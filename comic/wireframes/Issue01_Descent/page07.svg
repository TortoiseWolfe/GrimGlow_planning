  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 7  (5 panels)</text>

  <!-- TOP TIER: P1 shallow widescreen 742×220 at (29, 59) -->
  <g id="page7-panel1">
    <image x="29" y="59" width="742" height="220" xlink:href="_panels/Issue01_Descent/page07_panel01.svg"/>
    <rect x="29" y="59" width="742" height="220" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- MIDDLE TIER: P2 narrow + P3 wide + P4 narrow, all 320 tall at y=289 -->
  <g id="page7-panel2">
    <image x="29" y="289" width="175" height="320" xlink:href="_panels/Issue01_Descent/page07_panel02.svg"/>
    <rect x="29" y="289" width="175" height="320" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page7-panel3">
    <image x="215" y="289" width="372" height="320" xlink:href="_panels/Issue01_Descent/page07_panel03.svg"/>
    <rect x="215" y="289" width="372" height="320" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page7-panel4">
    <image x="598" y="289" width="175" height="320" xlink:href="_panels/Issue01_Descent/page07_panel04.svg"/>
    <rect x="598" y="289" width="175" height="320" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- BOTTOM TIER: P5 dramatic bird's-eye 742×562 at (29, 619) -->
  <g id="page7-panel5">
    <image x="29" y="619" width="742" height="562" xlink:href="_panels/Issue01_Descent/page07_panel05.svg"/>
    <rect x="29" y="619" width="742" height="562" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
