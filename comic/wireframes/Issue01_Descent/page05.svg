  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 5  (4 panels)</text>

  <!-- TOP TIER: P1 full-width 742×566 at (29, 59) -->
  <g id="page5-panel1">
    <image x="29" y="59" width="742" height="566" xlink:href="_panels/Issue01_Descent/page05_panel01.svg"/>
    <rect x="29" y="59" width="742" height="566" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- BOTTOM TIER: P2 wide-left 488×566 at (29, 635) + P3,P4 stacked right -->
  <g id="page5-panel2">
    <image x="29" y="635" width="488" height="566" xlink:href="_panels/Issue01_Descent/page05_panel02.svg"/>
    <rect x="29" y="635" width="488" height="566" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page5-panel3">
    <image x="527" y="635" width="244" height="278" xlink:href="_panels/Issue01_Descent/page05_panel03.svg"/>
    <rect x="527" y="635" width="244" height="278" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page5-panel4">
    <image x="527" y="923" width="244" height="278" xlink:href="_panels/Issue01_Descent/page05_panel04.svg"/>
    <rect x="527" y="923" width="244" height="278" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

</svg>
