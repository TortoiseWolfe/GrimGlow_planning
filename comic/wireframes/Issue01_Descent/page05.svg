<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 1 — Page 5 — "The City Sleeps" — handcrafted preview</title>
  <desc>Page 5 of Issue 1, "Descent." 4 panels: top establishing wide of Victorian London roofscape (entirely warm world before squad arrives); bottom-left medium of lamplighter Jack Hobday on his rounds; top-right narrow of Victorian woman witness reacting to falling-star light; bottom-right narrow ECU of her hand completing sign of cross. The visual pivot of the IP — first warm Victorian setting; first cool prismatic light meeting human face.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Page title. -->
  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 5  (4 panels)</text>

  <!-- ========================================================== -->
  <!-- TOP TIER: Panel 1 — full-width Victorian cityscape           -->
  <!-- 742 × 471 at (29, 59)                                        -->
  <!-- ========================================================== -->
  <g id="page5-panel1">
    <image x="29" y="59" width="742" height="471" xlink:href="_panels/Issue01_Descent/page05_panel01.svg"/>
    <rect x="29" y="59" width="742" height="471" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- ========================================================== -->
  <!-- BOTTOM TIER: Panel 2 wide-left + Panels 3,4 stacked right    -->
  <!-- Panel 2: 488 × 311 at (29, 540)                              -->
  <!-- Panel 3: 240 × 151 at (533, 540)                             -->
  <!-- Panel 4: 240 × 151 at (533, 700)                             -->
  <!-- ========================================================== -->
  <g id="page5-panel2">
    <image x="29" y="540" width="488" height="311" xlink:href="_panels/Issue01_Descent/page05_panel02.svg"/>
    <rect x="29" y="540" width="488" height="311" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page5-panel3">
    <image x="533" y="540" width="240" height="151" xlink:href="_panels/Issue01_Descent/page05_panel03.svg"/>
    <rect x="533" y="540" width="240" height="151" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page5-panel4">
    <image x="533" y="700" width="240" height="151" xlink:href="_panels/Issue01_Descent/page05_panel04.svg"/>
    <rect x="533" y="700" width="240" height="151" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

</svg>
