<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 1 — Page 5 — "The City Sleeps" — handcrafted preview</title>
