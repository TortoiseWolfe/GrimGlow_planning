<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 1 — Page 6 — "The Boy in the Window" — handcrafted preview</title>
  <desc>Page 6 of Issue 1, "Descent." 5 panels in 3 canonical tiers. Top tier — narrow Clerkenwell street establishing with Theodore silhouetted in lit window + close-up Theodore face dual-lit at window. Middle — full-width post-star roofscape (the city forgets). Bottom — lamplighter Hobday stopped looking up + ECU Theodore's hand on glass.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 6  (5 panels)</text>

  <!-- TOP TIER: P1 + P2 half-widths 366×364 at y=59 -->
  <g id="page6-panel1">
    <image x="29" y="59" width="366" height="364" xlink:href="_panels/Issue01_Descent/page06_panel01.svg"/>
    <rect x="29" y="59" width="366" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page6-panel2">
    <image x="405" y="59" width="366" height="364" xlink:href="_panels/Issue01_Descent/page06_panel02.svg"/>
    <rect x="405" y="59" width="366" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- MIDDLE TIER: P3 full-width 742×364 at y=433 -->
  <g id="page6-panel3">
    <image x="29" y="433" width="742" height="364" xlink:href="_panels/Issue01_Descent/page06_panel03.svg"/>
    <rect x="29" y="433" width="742" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- BOTTOM TIER: P4 wide-left 488×364 + P5 narrow-right 240×364 at y=807 -->
  <g id="page6-panel4">
    <image x="29" y="807" width="488" height="364" xlink:href="_panels/Issue01_Descent/page06_panel04.svg"/>
    <rect x="29" y="807" width="488" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page6-panel5">
    <image x="531" y="807" width="240" height="364" xlink:href="_panels/Issue01_Descent/page06_panel05.svg"/>
    <rect x="531" y="807" width="240" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

</svg>
