<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 1 — Page 6 — "The Boy in the Window" — handcrafted preview</title>
  <desc>Page 6 of Issue 1, "Descent." 5 panels: top tier — narrow Clerkenwell street establishing with Theodore silhouetted in lit window + close-up Theodore face dual-lit at window. Middle — full-width post-star roofscape (the city forgets). Bottom — lamplighter Hobday stopped looking up + ECU Theodore's hand on glass. Theodore's introduction — the boy who reaches toward the impossible. Section 2 closes with his hand on the glass.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Page title. -->
  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 6  (5 panels)</text>

