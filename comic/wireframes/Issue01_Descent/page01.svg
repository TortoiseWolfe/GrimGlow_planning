<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 1 — Page 1 — "Descent" — handcrafted preview</title>
  <desc>Page 1 of Issue 1, "Descent." 6 panels: full-width establishing wide of recon vessel in temporal corridor; three middle-tier panels (Sable at command, Wren at engineering, Jink restless on jump seat); bottom-tier wide-left Thresh at weapon rack through bridge archway and narrow-right close-up of Luma with holographic lenses. Each panel is a separately-handcrafted SVG composed here in the page layout grid.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Page title. -->
  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 1  (6 panels)</text>

  <!-- ========================================================== -->
  <!-- TOP TIER: Panel 1 — full-width establishing                 -->
  <!-- 742 × 364 at (29, 59)                                        -->
  <!-- ========================================================== -->
  <g id="page1-panel1">
    <image x="29" y="59" width="742" height="364" xlink:href="_panels/Issue01_Descent/page01_panel01.svg"/>
    <rect x="29" y="59" width="742" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- ========================================================== -->
  <!-- MIDDLE TIER: Panels 2, 3, 4 — three equal one-third widths  -->
  <!-- Each ~241 × 364 at y=433. Gutter ~10px between.             -->
  <!-- ========================================================== -->
  <g id="page1-panel2">
    <image x="29" y="433" width="241" height="364" xlink:href="_panels/Issue01_Descent/page01_panel02.svg"/>
    <rect x="29" y="433" width="241" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page1-panel3">
    <image x="280" y="433" width="241" height="364" xlink:href="_panels/Issue01_Descent/page01_panel03.svg"/>
    <rect x="280" y="433" width="241" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page1-panel4">
    <image x="531" y="433" width="241" height="364" xlink:href="_panels/Issue01_Descent/page01_panel04.svg"/>
    <rect x="531" y="433" width="241" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- ========================================================== -->
  <!-- BOTTOM TIER: Panel 5 wide-left + Panel 6 narrow-right       -->
  <!-- Panel 5: 494 × 364 at (29, 807)                             -->
  <!-- Panel 6: 241 × 364 at (531, 807)                             -->
  <!-- ========================================================== -->
  <g id="page1-panel5">
    <image x="29" y="807" width="494" height="364" xlink:href="_panels/Issue01_Descent/page01_panel05.svg"/>
    <rect x="29" y="807" width="494" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page1-panel6">
    <image x="531" y="807" width="241" height="364" xlink:href="_panels/Issue01_Descent/page01_panel06.svg"/>
    <rect x="531" y="807" width="241" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

</svg>
