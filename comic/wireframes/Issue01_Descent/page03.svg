<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 1 — Page 3 — "The Attack" — handcrafted preview</title>
  <desc>Page 3 of Issue 1, "Descent." 6 panels: full-width impact (the attack), three middle-tier panels (Sable controlled fury / Wren grim damage assessment / POV through cracking viewport with Titan glimpsed), bottom-tier wide-left desperate squad on knees with Sable standing + narrow-right ECU hand on emergency toggle. Each panel is a separately-handcrafted SVG composed here in the page layout grid.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Page title. -->
  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 3  (6 panels)</text>

  <!-- ========================================================== -->
  <!-- TOP TIER: Panel 1 — full-width IMPACT (the attack)          -->
  <!-- 742 × 364 at (29, 59)                                        -->
  <!-- ========================================================== -->
  <g id="page3-panel1">
    <image x="29" y="59" width="742" height="364" xlink:href="_panels/Issue01_Descent/page03_panel01.svg"/>
    <rect x="29" y="59" width="742" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- ========================================================== -->
  <!-- MIDDLE TIER: Panels 2, 3, 4 — three equal one-third widths  -->
  <!-- Each ~241 × 364 at y=433. Gutter ~10px between.             -->
  <!-- ========================================================== -->
  <g id="page3-panel2">
    <image x="29" y="433" width="241" height="364" xlink:href="_panels/Issue01_Descent/page03_panel02.svg"/>
    <rect x="29" y="433" width="241" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page3-panel3">
    <image x="280" y="433" width="241" height="364" xlink:href="_panels/Issue01_Descent/page03_panel03.svg"/>
    <rect x="280" y="433" width="241" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page3-panel4">
    <image x="531" y="433" width="241" height="364" xlink:href="_panels/Issue01_Descent/page03_panel04.svg"/>
    <rect x="531" y="433" width="241" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- ========================================================== -->
  <!-- BOTTOM TIER: Panel 5 wide-left + Panel 6 wide-right         -->
  <!-- Panel 5: 366 × 364 at (29, 807)                             -->
  <!-- Panel 6: 366 × 364 at (405, 807)                             -->
  <!-- ========================================================== -->
  <g id="page3-panel5">
    <image x="29" y="807" width="366" height="364" xlink:href="_panels/Issue01_Descent/page03_panel05.svg"/>
    <rect x="29" y="807" width="366" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page3-panel6">
    <image x="405" y="807" width="366" height="364" xlink:href="_panels/Issue01_Descent/page03_panel06.svg"/>
    <rect x="405" y="807" width="366" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

</svg>
