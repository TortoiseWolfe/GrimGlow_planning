<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 1 — Page 20 — "First Night Settles" — handcrafted preview</title>
  <desc>Page 20 of Issue 1, climax arc — first night settling. 4 panels in 3 tiers (banner / 2-col / banner footer). Sums to 1179px page-fill.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 20  (4 panels)</text>

  <!-- TIER 1: P1 panoramic banner 742×320 at y=59 -->
  <g id="page20-panel1">
    <image x="29" y="59" width="742" height="320" xlink:href="_panels/Issue01_Descent/page20_panel01.svg"/>
    <rect x="29" y="59" width="742" height="320" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- TIER 2: P2 half-left 366×400 + P3 half-right 366×400 at y=389 -->
  <g id="page20-panel2">
    <image x="29" y="389" width="366" height="400" xlink:href="_panels/Issue01_Descent/page20_panel02.svg"/>
    <rect x="29" y="389" width="366" height="400" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page20-panel3">
    <image x="405" y="389" width="366" height="400" xlink:href="_panels/Issue01_Descent/page20_panel03.svg"/>
    <rect x="405" y="389" width="366" height="400" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- TIER 3: P4 night camp wide 742×380 at y=799 -->
  <g id="page20-panel4">
    <image x="29" y="799" width="742" height="380" xlink:href="_panels/Issue01_Descent/page20_panel04.svg"/>
    <rect x="29" y="799" width="742" height="380" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

</svg>
