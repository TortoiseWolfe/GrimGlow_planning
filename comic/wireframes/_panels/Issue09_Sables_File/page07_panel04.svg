  <title>Issue 9 Page 7 Panel 4 — All five, the silence, the weight</title>
  <desc>Medium shot slight low angle. All five visible. Holographic display between them. The revelation has landed. Five processing in five different ways: Sable waiting, Wren calculating, Jink building toward fury, Thresh stone, Luma connecting troubled. Light pulses slowly. Silence has physical weight.</desc>
