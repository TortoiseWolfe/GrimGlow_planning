<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 8 Panel 5 — The aftermath, "There's more. Let her finish."</title>
  <desc>Medium wide group eye level. Five figures, the silence after "Don't" louder than the argument. Jink rigid with anger, Sable unfinished sentence, Wren steady between, Luma watching with dead core, Thresh half-turned away — the first physical withdrawal. Display indifferent.</desc>
