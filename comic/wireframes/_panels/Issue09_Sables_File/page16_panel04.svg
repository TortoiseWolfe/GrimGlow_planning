    <line x1="46" y1="20" x2="56" y2="20" stroke="#3a2818" stroke-width="0.3" opacity="0.4"/>
    <line x1="46" y1="100" x2="56" y2="100" stroke="#3a2818" stroke-width="0.3" opacity="0.4"/>
    <line x1="46" y1="200" x2="56" y2="200" stroke="#3a2818" stroke-width="0.3" opacity="0.4"/>
  </g>

  <g>
    <rect x="40" y="200" width="326" height="14" fill="url(#beamCrossG4)"/>
