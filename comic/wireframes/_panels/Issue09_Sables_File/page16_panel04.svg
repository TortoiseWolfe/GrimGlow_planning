    <line x1="160" y1="216" x2="200" y2="240" stroke="#5a4838" stroke-width="0.4"/>
  </g>
  <g opacity="0.55">
    <ellipse cx="190" cy="248" rx="3" ry="1" fill="#9098a0"/>
    <ellipse cx="220" cy="252" rx="2" ry="0.7" fill="#a89878"/>
  </g>

  <g>
    <path d="M 130 90 Q 124 110 130 138 Q 138 168 152 184 Q 174 192 198 192 Q 222 188 236 172 Q 244 144 244 110 Q 238 90 222 76 Q 198 70 176 72 Q 148 80 130 90 Z" fill="url(#faceLitJ_G4)" opacity="0.95"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowG4)">
    <ellipse cx="124" cy="62" rx="46" ry="28" fill="#a87820"/>
    <ellipse cx="172" cy="58" rx="38" ry="24" fill="#a87820"/>
  </g>
  <g>
    <path d="M 64 80 Q 74 50 104 38 Q 134 30 164 32 Q 194 34 222 50 Q 242 66 238 90 L 214 96 Q 226 70 194 56 Q 162 50 132 56 Q 106 64 90 86 Z" fill="url(#hairGoldDimG4)"/>
    <ellipse cx="64" cy="74" rx="14" ry="18" fill="url(#hairGoldDimG4)" transform="rotate(-25 64 74)"/>
    <ellipse cx="244" cy="80" rx="12" ry="16" fill="url(#hairGoldDimG4)" transform="rotate(20 244 80)"/>
    <ellipse cx="92" cy="46" rx="10" ry="8" fill="url(#hairGoldDimG4)" transform="rotate(-30 92 46)"/>
    <ellipse cx="216" cy="42" rx="10" ry="8" fill="url(#hairGoldDimG4)" transform="rotate(30 216 42)"/>
    <ellipse cx="148" cy="34" rx="14" ry="9" fill="url(#hairGoldDimG4)"/>
  </g>

  <g>
