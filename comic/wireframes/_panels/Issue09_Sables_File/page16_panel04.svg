<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 16 Panel 4 — Jink watches from above, the first step toward seeing the cost</title>
  <desc>Close-up Jink sitting up on upper cross-beam, chin on knees, looking down through gaps in timber at camp below. Anger still present but layered with observation. Seeing the cost of the secret on person who carried it. Faint emerald only illumination at this height. Watching Sable.</desc>
  <defs>
    <linearGradient id="bgG4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040608"/>
      <stop offset="0.4" stop-color="#0a0e16"/>
      <stop offset="0.8" stop-color="#080a10"/>
      <stop offset="1" stop-color="#040608"/>
    </linearGradient>
    <radialGradient id="emeraldFaintG4" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#3aa868" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#1a4030" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#040608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawnFromBelowG4" cx="0.5" cy="0.95" r="0.4">
      <stop offset="0" stop-color="#a89878" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#5a4838" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#040608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timberUprightG4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="beamCrossG4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="faceLitJ_G4" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.8" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairGoldDimG4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87820"/>
      <stop offset="0.4" stop-color="#7a5810"/>
      <stop offset="1" stop-color="#3a2810"/>
    </linearGradient>
    <linearGradient id="emeraldSuitG4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7048"/>
      <stop offset="0.5" stop-color="#1f4a30"/>
      <stop offset="1" stop-color="#0a1f14"/>
    </linearGradient>
    <radialGradient id="eyeWatchG4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#5a78a0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5a78a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomG4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="strongGlowG4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softG4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgG4)"/>
  <rect width="366" height="260" fill="url(#dawnFromBelowG4)"/>
  <rect width="366" height="260" fill="url(#emeraldFaintG4)"/>

  <g>
