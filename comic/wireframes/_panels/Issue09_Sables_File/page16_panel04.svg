    <ellipse cx="214" cy="122" rx="10" ry="4.5" fill="#0a0604"/>
    <circle cx="170" cy="124" r="3" fill="#1a3658"/>
    <circle cx="214" cy="122" r="3.4" fill="#1a3658"/>
    <circle cx="172" cy="123" r="1.4" fill="url(#eyeWatchG4)"/>
    <circle cx="216" cy="121" r="1.6" fill="url(#eyeWatchG4)"/>
  </g>

  <g stroke="#5a3818" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 152 114 Q 170 108 188 114"/>
    <path d="M 198 112 Q 214 106 232 114"/>
  </g>

  <path d="M 192 130 Q 188 152 192 168" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 168 178 Q 192 184 216 178" stroke="#0a0604" stroke-width="1.2" fill="none"/>
  </g>

  <g>
    <path d="M 90 192 Q 96 174 110 162 L 130 162 L 124 192 Q 130 210 138 214 L 230 214 Q 240 210 246 192 L 240 162 L 260 162 Q 274 174 280 192 L 286 212 L 84 212 Z" fill="url(#emeraldSuitG4)"/>
    <path d="M 130 192 Q 178 196 240 192 L 240 208 L 130 208 Z" fill="#0a1f14" opacity="0.85"/>
  </g>

  <g opacity="0.75">
    <line x1="170" y1="186" x2="195" y2="226" stroke="#88a0c8" stroke-width="0.4" stroke-dasharray="3 3"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowG4)">
    <circle cx="116" cy="186" r="2.5" fill="#3aa868"/>
    <circle cx="248" cy="186" r="2.5" fill="#3aa868"/>
    <circle cx="183" cy="200" r="2" fill="#3aa868"/>
  </g>

  <g opacity="0.55" filter="url(#bloomG4)">
    <ellipse cx="183" cy="220" rx="60" ry="6" fill="#1f4a30"/>
  </g>

  <g opacity="0.4">
    <circle cx="20" cy="40" r="0.4" fill="#3a4858"/>
    <circle cx="320" cy="60" r="0.4" fill="#3a4858"/>
  </g>
</svg>
