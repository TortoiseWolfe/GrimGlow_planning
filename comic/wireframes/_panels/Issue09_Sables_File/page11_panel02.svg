    <linearGradient id="bgB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="0.5" stop-color="#161a28"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <radialGradient id="sideHolo_B2" cx="0.05" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#080a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitJ_B2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a86838"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.7" stop-color="#3a261a"/>
      <stop offset="1" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="hairGoldB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d040"/>
      <stop offset="0.4" stop-color="#d8b020"/>
      <stop offset="1" stop-color="#7a5810"/>
    </linearGradient>
    <linearGradient id="emeraldS_B2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <radialGradient id="eyeWoundB2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomB2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowB2" x="-25%" y="-25%" width="150%" height="150%">
