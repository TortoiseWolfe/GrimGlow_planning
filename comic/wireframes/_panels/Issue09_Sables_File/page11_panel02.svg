<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 11 Panel 2 — Jink stops mid-pace, "I defended you"</title>
  <desc>Close-up Jink stopped mid-pace, face direct confrontation. Fury at peak — eyes show wound beneath. Betrayal personal: defended the person who lied. Harsh side-light, one half bright, other shadowed. Soot-streaked emerald collar.</desc>
