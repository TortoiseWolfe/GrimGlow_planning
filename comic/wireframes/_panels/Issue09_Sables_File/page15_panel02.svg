    <path d="M 252 226 L 288 226 L 294 260 L 246 260 Z" fill="url(#copperFigF2)"/>
    <path d="M 252 232 L 288 232 L 288 252 L 252 252 Z" fill="#5a2e10"/>
    <path d="M 246 236 L 220 220 L 218 226 L 240 246 Z" fill="url(#copperFigF2)"/>
