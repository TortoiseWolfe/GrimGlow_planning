    <rect x="140" y="155" width="14" height="10" fill="none" stroke="#a85820" stroke-width="0.6"/>
    <circle cx="220" cy="160" r="5" fill="none" stroke="#a85820" stroke-width="0.6"/>

    <line x1="80" y1="60" x2="160" y2="80" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="160" y1="80" x2="220" y2="60" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="80" y1="60" x2="100" y2="120" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="160" y1="80" x2="160" y2="120" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="220" y1="120" x2="280" y2="68" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="100" y1="120" x2="160" y2="120" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="160" y1="120" x2="220" y2="120" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="100" y1="120" x2="80" y2="160" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="160" y1="120" x2="146" y2="160" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="220" y1="120" x2="220" y2="160" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 2"/>
  </g>

  <g font-family="Courier New, monospace" fill="#f4d090" opacity="0.9">
    <text x="80" y="50" text-anchor="middle" font-size="3.4">CRYSTAL</text>
    <text x="160" y="68" text-anchor="middle" font-size="3.4">DRIVE</text>
    <text x="230" y="58" font-size="3.4">FLUX</text>
    <text x="288" y="86" text-anchor="middle" font-size="3.4">VECTOR</text>
    <text x="100" y="135" text-anchor="middle" font-size="3.4">COMP-A</text>
    <text x="167" y="135" text-anchor="middle" font-size="3.4">COMP-B</text>
    <text x="220" y="135" text-anchor="middle" font-size="3.4">COMP-C</text>
  </g>
  <g font-family="Courier New, monospace" fill="#a85820" opacity="0.7">
    <text x="80" y="172" text-anchor="middle" font-size="3.2">NEED</text>
    <text x="147" y="172" text-anchor="middle" font-size="3.2">NEED</text>
    <text x="220" y="172" text-anchor="middle" font-size="3.2">NEED</text>
  </g>

  <g>
    <ellipse cx="270" cy="208" rx="11" ry="13" fill="#3a261a"/>
    <ellipse cx="270" cy="202" rx="8" ry="9" fill="url(#faceLitW_F2)"/>
    <ellipse cx="266" cy="190" rx="7" ry="6" fill="url(#hairBlkF2)"/>
    <ellipse cx="276" cy="188" rx="6" ry="5" fill="url(#hairBlkF2)"/>
    <ellipse cx="266" cy="208" rx="1.2" ry="1.5" fill="#0a0604"/>
    <ellipse cx="274" cy="208" rx="1.2" ry="1.5" fill="#0a0604"/>
