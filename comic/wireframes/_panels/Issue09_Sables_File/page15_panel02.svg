<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 15 Panel 2 — Wren works, "Three-point-two tolerance. Hold."</title>
  <desc>Medium shot Wren at her station surrounded by floating copper-gold schematics — interconnected geometric nodes for ship drive components, some glowing (completed), others dark (still needed). Deep focus, hands in holographic field. Speaks to herself barely audibly. Function as lifeline.</desc>
  <defs>
    <linearGradient id="bgF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1812"/>
      <stop offset="0.4" stop-color="#2a201a"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="copperGoldF2" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copperFigF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="faceLitW_F2" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairBlkF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#2a1e1a"/>
    </linearGradient>
    <linearGradient id="stationF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3220"/>
      <stop offset="0.5" stop-color="#2a2418"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="eyeFocusF2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#f4b860" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomF2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="megaGoldF2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="strongGoldF2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softF2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgF2)"/>
  <rect width="366" height="260" fill="url(#copperGoldF2)"/>

  <g>
    <rect x="20" y="200" width="326" height="14" fill="url(#stationF2)"/>
    <rect x="20" y="200" width="326" height="3" fill="#5a3a20" opacity="0.6"/>
  </g>

  <g>
    <rect x="40" y="180" width="286" height="20" fill="url(#stationF2)" stroke="#5a3a20" stroke-width="0.6"/>
    <rect x="46" y="184" width="274" height="12" fill="#1a140a"/>
    <line x1="46" y1="190" x2="320" y2="190" stroke="#5a3a20" stroke-width="0.4"/>
  </g>

  <g opacity="0.7" filter="url(#megaGoldF2)">
    <ellipse cx="183" cy="120" rx="160" ry="100" fill="#d88838"/>
