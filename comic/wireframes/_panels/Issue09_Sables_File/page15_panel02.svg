    <circle cx="160" cy="80" r="8" fill="none" stroke="#f4d090" stroke-width="0.8"/>
    <circle cx="160" cy="80" r="3" fill="#f4d090" opacity="0.85"/>
    <rect x="220" y="60" width="20" height="14" fill="none" stroke="#f4d090" stroke-width="0.6"/>
    <rect x="225" y="64" width="10" height="6" fill="#f4d090" opacity="0.85"/>
    <polygon points="280,60 296,60 288,76" fill="none" stroke="#f4d090" stroke-width="0.6"/>
    <polygon points="280,60 296,60 288,76" fill="#f4d090" opacity="0.7"/>

    <circle cx="100" cy="120" r="5" fill="none" stroke="#f4d090" stroke-width="0.6"/>
    <rect x="160" y="115" width="14" height="10" fill="none" stroke="#f4d090" stroke-width="0.6"/>
    <circle cx="220" cy="120" r="5" fill="none" stroke="#f4d090" stroke-width="0.6"/>
    <polygon points="280,115 290,115 285,125" fill="none" stroke="#f4d090" stroke-width="0.6"/>

