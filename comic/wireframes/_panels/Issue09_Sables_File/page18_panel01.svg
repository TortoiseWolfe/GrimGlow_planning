<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 9 Page 18 Panel 1 — Theodore reads the room, "I can come back" / "Stay, Theodore."</title>
  <desc>Medium wide from inside camp. Theodore's enormous face fills wall gap — Victorian boy 12-13, sandy-brown hair, hazel eyes, freckles. Peers into dim camp, eyes adjusting. Concern of clever child reading adults' moods. Quiet, careful, assessing. Warm amber gaslight frames his face.</desc>
