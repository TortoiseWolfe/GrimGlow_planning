      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="timberSideI1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
