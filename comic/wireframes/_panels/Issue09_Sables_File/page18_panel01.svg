      <stop offset="0.4" stop-color="#15110a"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <radialGradient id="gaslightFromGapI1" cx="0.92" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#080604" stop-opacity="0"/>
