<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 3 Panel 3 — Sable's face seen through the corrupted display</title>
  <desc>Close-up low angle looking up past holographic display at Sable's face. Corrupted geometric fairy script scrolls between camera and her face. Light maps text across her features. Exhaustion beneath composure visible for the first time.</desc>
  <defs>
    <linearGradient id="bg33" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.4" stop-color="#1a2030"/>
      <stop offset="0.7" stop-color="#1f2638"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <radialGradient id="upGlow33" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#5878a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.8" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4a30"/>
    </linearGradient>
    <linearGradient id="hairSilFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7e84"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="silverSuit33" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="eyeTired" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom33" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="soft33" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bg33)"/>
  <rect width="366" height="260" fill="url(#upGlow33)"/>

