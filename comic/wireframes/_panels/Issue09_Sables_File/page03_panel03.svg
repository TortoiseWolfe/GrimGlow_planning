  </g>

  <g font-family="Courier New, monospace" fill="#c0d8f0" opacity="0.85">
    <text x="120" y="80" font-size="5" opacity="0.7" letter-spacing="2">CONVERGENCE</text>
    <text x="220" y="80" font-size="5" opacity="0.7" letter-spacing="2">INTERVEN</text>
    <text x="100" y="100" font-size="4" opacity="0.5">▓▒░</text>
    <text x="246" y="100" font-size="4" opacity="0.5">░▒▓</text>
    <text x="60" y="120" font-size="4.5" opacity="0.6" letter-spacing="1">CLASSIFICATION</text>
    <text x="240" y="120" font-size="4" opacity="0.5">[ ··· ]</text>
  </g>

  <g font-family="Courier New, monospace" opacity="0.95" fill="#c0d8f0">
