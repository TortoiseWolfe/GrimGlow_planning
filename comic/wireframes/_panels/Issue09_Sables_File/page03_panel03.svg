    <text x="220" y="148" font-size="6" letter-spacing="2" opacity="0.85" font-weight="700">CONVERGENCE</text>
    <text x="60" y="180" font-size="4.5" letter-spacing="1.5" opacity="0.6">PRIOR INSERTIONS</text>
    <text x="200" y="180" font-size="4.5" opacity="0.55">▓░ NULL ░▓</text>
    <text x="80" y="208" font-size="6" letter-spacing="2" opacity="0.8" font-weight="700">INTERVENTION</text>
  </g>

