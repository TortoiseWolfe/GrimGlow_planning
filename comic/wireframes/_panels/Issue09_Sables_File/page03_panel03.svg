    <line x1="40" y1="92" x2="326" y2="92" stroke="#a8c0e0" stroke-width="0.3"/>
    <line x1="40" y1="124" x2="326" y2="124" stroke="#a8c0e0" stroke-width="0.3"/>
    <line x1="40" y1="156" x2="326" y2="156" stroke="#a8c0e0" stroke-width="0.3"/>
    <line x1="40" y1="180" x2="326" y2="180" stroke="#a8c0e0" stroke-width="0.3"/>
    <line x1="40" y1="208" x2="326" y2="208" stroke="#a8c0e0" stroke-width="0.3"/>
  </g>

  <g opacity="0.5">
    <rect x="80" y="138" width="200" height="2" fill="#88a0c8"/>
    <rect x="40" y="172" width="280" height="1.5" fill="#5878a8"/>
    <rect x="100" y="200" width="160" height="2" fill="#88a0c8"/>
