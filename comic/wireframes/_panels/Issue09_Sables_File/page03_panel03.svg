    <path d="M 286 0 L 366 0 L 366 260 L 286 260 Z" fill="#0a0a10"/>
  </g>

  <g>
    <path d="M 116 120 Q 110 144 116 168 Q 124 196 138 210 Q 156 220 180 218 Q 206 214 222 196 Q 234 174 232 142 Q 226 120 210 108 Q 184 100 162 104 Q 134 110 116 120 Z" fill="url(#faceLitTxt)" opacity="0.95"/>
    <path d="M 116 130 Q 112 158 122 188 Q 134 210 152 220 Q 138 216 128 206 Q 116 188 112 162 Q 114 138 116 130 Z" fill="#0a0604" opacity="0.55"/>
  </g>

