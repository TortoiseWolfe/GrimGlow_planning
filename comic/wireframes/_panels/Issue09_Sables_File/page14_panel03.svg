<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 9 Page 14 Panel 3 — Luma at the wall gap, "Hold together"</title>
  <desc>Medium close-up Luma pauses at wall gap. Morning grey full on her face from outside. Holds scanner one hand, dead data core other, looking back at camp interior — shadow with scattered dim points of colored light. Concern mixed with resolve. Threshold between investigation and loyalty.</desc>
