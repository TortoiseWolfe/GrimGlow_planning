      <stop offset="0.5" stop-color="#4a2a78"/>
      <stop offset="1" stop-color="#1a0e2e"/>
    </linearGradient>
    <linearGradient id="scannerE3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a878d0"/>
      <stop offset="0.5" stop-color="#7848b8"/>
