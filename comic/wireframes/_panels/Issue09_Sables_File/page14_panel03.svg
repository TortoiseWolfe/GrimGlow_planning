      <stop offset="0.4" stop-color="#262438"/>
      <stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <radialGradient id="dawnFromOutsideE3" cx="0.05" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#a0a8b8" stop-opacity="0.85"/>
