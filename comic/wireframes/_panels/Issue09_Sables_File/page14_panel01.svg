    <line x1="158" y1="218" x2="186" y2="234" stroke="#5a3a20" stroke-width="0.6"/>
    <line x1="186" y1="218" x2="158" y2="234" stroke="#5a3a20" stroke-width="0.6"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowE1)">
    <circle cx="116" cy="220" r="2.5" fill="#3aa868"/>
    <circle cx="248" cy="220" r="2.5" fill="#3aa868"/>
    <circle cx="183" cy="232" r="2" fill="#3aa868"/>
    <circle cx="100" cy="248" r="2" fill="#3aa868"/>
