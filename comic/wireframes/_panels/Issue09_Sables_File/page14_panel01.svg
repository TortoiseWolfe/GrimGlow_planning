  </g>

  <path d="M 192 164 Q 188 184 192 200" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 172 212 L 216 212" stroke="#0a0604" stroke-width="1.4"/>
  </g>

  <g>
