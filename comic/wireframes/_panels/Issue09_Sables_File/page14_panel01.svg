  </g>

  <g opacity="0.85">
    <path d="M 96 204 L 70 230 L 76 248 L 100 218 Z" fill="url(#emeraldSuitE1)"/>
    <path d="M 274 204 L 300 230 L 294 248 L 270 218 Z" fill="url(#emeraldSuitE1)"/>
