<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 9 Page 14 Panel 1 — Jink alone on upper beam, knees drawn up, looks their age</title>
  <desc>Medium close-up Jink alone on upper cross-beam, back against timber upright, legs drawn up, arms wrapped around knees. Light brown skin, golden curls falling over forearms. Looks young — too young. Wounded stillness. Faint emerald suit nodes only light, green-tinted shadows.</desc>
  <defs>
    <linearGradient id="bgE1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.4" stop-color="#0e1218"/>
      <stop offset="0.8" stop-color="#080a10"/>
      <stop offset="1" stop-color="#040608"/>
    </linearGradient>
    <radialGradient id="emeraldDimE1" cx="0.5" cy="0.6" r="0.45">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#1a4030" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#040608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawnFromBelowE1" cx="0.5" cy="1" r="0.5">
      <stop offset="0" stop-color="#5a6478" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#040608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timberUprightE1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="beamCrossE1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="faceLitJ_E1" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.8" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairGoldDimE1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87820"/>
      <stop offset="0.4" stop-color="#7a5810"/>
      <stop offset="1" stop-color="#3a2810"/>
    </linearGradient>
    <linearGradient id="emeraldSuitE1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7048"/>
      <stop offset="0.5" stop-color="#1f4a30"/>
      <stop offset="1" stop-color="#0a1f14"/>
    </linearGradient>
    <radialGradient id="eyeStareE1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a78a0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5a78a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomE1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="strongGlowE1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softE1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
