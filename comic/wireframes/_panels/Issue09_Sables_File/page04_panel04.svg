<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 9 Page 4 Panel 4 — Wide pull-back, two tiny figures in the vast wall cavity</title>
  <desc>Wide two-shot eye-level from a distance. Two impossibly small figures on a beam in a vast Victorian wall cavity. Holographic display between them — single pool of blue-white light in surrounding darkness. Distant camp glow as dim points. Pre-dawn grey from wall gap. Two sources of light in vast darkness.</desc>
