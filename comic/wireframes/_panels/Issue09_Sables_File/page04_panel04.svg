    <linearGradient id="timberDark44" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="beamFloor44" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <filter id="megaGlow44" x="-30%" y="-30%" width="160%" height="160%">
