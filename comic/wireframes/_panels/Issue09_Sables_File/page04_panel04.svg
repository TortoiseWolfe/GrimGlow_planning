      <stop offset="0.7" stop-color="#080a14"/>
      <stop offset="1" stop-color="#020308"/>
    </linearGradient>
    <radialGradient id="centerPool44" cx="0.5" cy="0.55" r="0.25">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawnGap44" cx="0.95" cy="0.4" r="0.25">
      <stop offset="0" stop-color="#7088a8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#020308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timberMain44" x1="0" y1="0" x2="0" y2="1">
