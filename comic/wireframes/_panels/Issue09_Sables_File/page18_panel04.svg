    <text x="166" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5a3018">THEODORE</text>
    <text x="166" y="24" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.4" fill="#2a2a2a">"My grandmother told me stories. I know a good one."</text>
