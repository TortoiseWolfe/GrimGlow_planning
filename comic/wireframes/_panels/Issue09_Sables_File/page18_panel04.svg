<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 18 Panel 4 — Theodore brings warm light, the camp oriented not gathered, "I know a good one"</title>
  <desc>Wide shot along main beam toward wall gap. Warm amber gaslight from outside reaches deep — Theodore brought candle/lantern. Light stretches deep into camp interior touching each position. Figures subtly reoriented: Jink lower beam closer, Thresh slightly turned, Wren paused at station, Sable facing the light. Not gathered — oriented.</desc>
