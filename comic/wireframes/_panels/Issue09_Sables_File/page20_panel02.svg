    <linearGradient id="bgJ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#251f15"/>
      <stop offset="0.4" stop-color="#322816"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="amberWarmJ2" cx="0.95" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f4d090" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1a1410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitJ_J2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#a86838"/>
      <stop offset="1" stop-color="#e8a868"/>
    </linearGradient>
    <linearGradient id="hairGoldGlowJ2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87820"/>
      <stop offset="0.5" stop-color="#f4d040"/>
      <stop offset="1" stop-color="#ffe888"/>
    </linearGradient>
    <linearGradient id="emeraldWarmJ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa868"/>
      <stop offset="0.5" stop-color="#3a7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <radialGradient id="eyeTenderJ2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f4c878" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f4c878" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomJ2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowJ2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="softJ2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

