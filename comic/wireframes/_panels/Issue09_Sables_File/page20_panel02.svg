<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 20 Panel 2 — Jink listening, "tenderness grudgingly allowed"</title>
  <desc>Close-up Jink listening to fairy tale. Anger quieted not gone, space opened for something else. Eyes on storyteller through wall gap, not on anyone inside camp. Soft pain layered with attention. Brightness in eyes is tenderness now, grudgingly allowed.</desc>
