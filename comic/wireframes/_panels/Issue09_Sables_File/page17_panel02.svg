<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 17 Panel 2 — Jink bends scrap wire idly, the wrong silence</title>
  <desc>Medium shot Jink on mid-level cross-timber legs dangling, bending piece of scrap copper wire idly. Hands needing occupation. Curls catch golden-amber afternoon. Flat drained — bright kinetic energy entirely absent. Warm light makes flatness more visible. Wrong silence.</desc>
