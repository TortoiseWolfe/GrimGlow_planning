    <linearGradient id="bgH2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#251f15"/>
      <stop offset="0.4" stop-color="#322816"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="amberZoneH2" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1a1410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitJ_H2" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#5a3622"/>
      <stop offset="0.5" stop-color="#9a5828"/>
      <stop offset="1" stop-color="#c87838"/>
    </linearGradient>
    <linearGradient id="hairGoldAmberH2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d040"/>
      <stop offset="0.4" stop-color="#d8b020"/>
      <stop offset="1" stop-color="#7a5810"/>
    </linearGradient>
    <linearGradient id="emeraldSuitH2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <linearGradient id="beamWoodH2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.4" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="copperWireH2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="eyeFlatH2" cx="0.5" cy="0.5" r="0.5">
