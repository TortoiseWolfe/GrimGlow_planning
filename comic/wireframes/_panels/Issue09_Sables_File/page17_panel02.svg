      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5a6478" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomH2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowH2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softH2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

