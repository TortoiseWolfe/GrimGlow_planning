      <stop offset="1" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="crimsonArmorE2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1408"/>
      <stop offset="0.5" stop-color="#1a0606"/>
      <stop offset="1" stop-color="#0a0202"/>
    </linearGradient>
    <linearGradient id="rifleE2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
