    </linearGradient>
    <radialGradient id="crimsonStutterE2" cx="0.5" cy="0.7" r="0.4">
      <stop offset="0" stop-color="#5a1810" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.15"/>
