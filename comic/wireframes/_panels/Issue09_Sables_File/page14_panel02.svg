<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 9 Page 14 Panel 2 — Thresh in far shadows, weapon untouched, vacant</title>
  <desc>Medium close-up Thresh in far shadows, back to main space, weapon across lap untouched. Stares at timber wall — wood grain, nails, dust. Vacant, beyond compression into empty. Crimson edge-nodes stutter faintly. Weapon just there, not cleaned, not checked.</desc>
