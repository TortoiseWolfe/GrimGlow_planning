<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 12 Panel 2 — Sable in honest morning light, "Understood."</title>
  <desc>Medium close-up Sable. Small nod, acceptance not relief. Mask not back but composure reassembled fragile. First time in natural morning grey light this issue. Unforgiving and honest — exhaustion, shadows under eyes, soot on suit. No hiding.</desc>
