<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 9 Page 17 Panel 1 — Late afternoon, golden-amber band across the camp, settled fracture</title>
  <desc>Wide widescreen from inside looking toward wall gap. Late afternoon golden-amber streams through brickwork crack, long warm diagonal band across main beam. Dust motes float. New geography: Jink on mid-level cross-timber lower, Thresh perimeter, Wren station, Sable secondary beam. Settled not healed.</desc>
  <defs>
    <linearGradient id="bgH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1814"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="amberGoldH1" cx="0.85" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperZoneH1" cx="0.7" cy="0.6" r="0.18">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonZoneH1" cx="0.18" cy="0.6" r="0.12">
      <stop offset="0" stop-color="#5a1810" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverFH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#4a4e54"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="copperFH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="emeraldFH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
