    <ellipse cx="280" cy="122" rx="2" ry="2" fill="#7a4830"/>
    <g opacity="0.75" filter="url(#strongGlowH1)">
      <ellipse cx="280" cy="116" rx="6" ry="3" fill="#d8b020"/>
    </g>
    <rect x="276" y="126" width="8" height="14" fill="url(#emeraldFH1)"/>
  </g>
  <g opacity="0.55" filter="url(#bloomH1)">
    <circle cx="280" cy="138" r="2" fill="#3aa868"/>
  </g>

  <g>
    <ellipse cx="370" cy="178" rx="3" ry="3.4" fill="#3a261a"/>
    <ellipse cx="370" cy="176" rx="2" ry="2" fill="#9098a0"/>
    <rect x="366" y="180" width="8" height="14" fill="url(#silverFH1)" opacity="0.6"/>
  </g>

  <g>
