    <linearGradient id="crimsonFH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1810"/>
      <stop offset="0.5" stop-color="#2a0808"/>
      <stop offset="1" stop-color="#0a0202"/>
    </linearGradient>
    <linearGradient id="timberSideH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="beamMainH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.4" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="repairStationH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3220"/>
      <stop offset="0.5" stop-color="#2a2418"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <filter id="bloomH1" x="-25%" y="-25%" width="150%" height="150%">
