    <ellipse cx="138" cy="166" rx="3" ry="3.4" fill="#3a261a"/>
    <ellipse cx="138" cy="164" rx="2" ry="2" fill="#5a3622"/>
    <path d="M 132 162 Q 138 158 144 162" stroke="#8a3818" stroke-width="1" fill="none"/>
    <rect x="134" y="168" width="8" height="14" fill="url(#crimsonFH1)"/>
    <rect x="148" y="172" width="14" height="6" fill="#1a1a1a"/>
  </g>
  <g opacity="0.55" filter="url(#bloomH1)">
    <circle cx="133" cy="178" r="1.6" fill="#dc4540"/>
  </g>

  <g opacity="0.6">
    <ellipse cx="370" cy="200" rx="6" ry="2" fill="#080404"/>
    <ellipse cx="280" cy="142" rx="6" ry="2" fill="#080404"/>
    <ellipse cx="540" cy="200" rx="6" ry="2" fill="#080404"/>
