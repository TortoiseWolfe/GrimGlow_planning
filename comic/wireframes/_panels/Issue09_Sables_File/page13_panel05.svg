<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 13 Panel 5 — Five points of light, the camp as fracture diagram</title>
  <desc>Wide elevated. Five tiny figures in five separate spaces. Wren at repair station copper-gold light. Sable alone main beam grey light no colored illumination. Luma heading toward wall gap blue-violet scanner. Thresh barely visible far shadows dim crimson. Jink silhouette upper cross-beam faint emerald. Five colored points in grey space.</desc>
