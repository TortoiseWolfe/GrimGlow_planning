<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 8 Panel 2 — Jink wounded anger, "I trusted you"</title>
  <desc>Close-up slight low angle Jink. Wounded anger. Jaw set, eyes bright with intensity that precedes tears in someone who won't allow them. Personal not tactical. Blue-white harsh and direct, every line of tension visible.</desc>
  <defs>
    <linearGradient id="bg82" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="0.5" stop-color="#161a28"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <radialGradient id="holoJ82" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#080a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitJ82" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairGold82" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d040"/>
      <stop offset="0.4" stop-color="#d8b020"/>
      <stop offset="1" stop-color="#7a5810"/>
    </linearGradient>
    <linearGradient id="emeraldS82" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <radialGradient id="eyeBright82" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom82" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlow82" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="soft82" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bg82)"/>
