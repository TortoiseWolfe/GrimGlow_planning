    <line x1="80" y1="100" x2="286" y2="100"/>
    <line x1="80" y1="124" x2="286" y2="124"/>
    <line x1="80" y1="148" x2="286" y2="148"/>
    <line x1="80" y1="170" x2="286" y2="170"/>
  </g>
  <g opacity="0.6">
    <rect x="118" y="98" width="42" height="2" fill="#5878a8"/>
    <rect x="194" y="100" width="42" height="2" fill="#5878a8"/>
    <rect x="118" y="146" width="42" height="2" fill="#5878a8"/>
    <rect x="194" y="146" width="42" height="2" fill="#5878a8"/>
  </g>

  <g font-family="Courier New, monospace" fill="#c0d8f0" opacity="0.55">
    <text x="100" y="80" font-size="3.6" letter-spacing="1.5">CONVERG</text>
    <text x="220" y="80" font-size="3.6" letter-spacing="1.5">RVENTION</text>
    <text x="100" y="156" font-size="3.6" letter-spacing="1.5">MISSION</text>
    <text x="220" y="156" font-size="3.6" letter-spacing="1.5">CLASS·D</text>
  </g>

  <g opacity="0.55" filter="url(#bloom54)">
    <ellipse cx="183" cy="218" rx="60" ry="8" fill="#5878a8"/>
  </g>

  <g opacity="0.7" filter="url(#strongGlow54)">
    <ellipse cx="183" cy="232" rx="60" ry="6" fill="#88a8d0"/>
  </g>

  <g opacity="0.4">
    <circle cx="40" cy="40" r="0.5" fill="#5878a8"/>
    <circle cx="320" cy="40" r="0.5" fill="#5878a8"/>
    <circle cx="60" cy="180" r="0.4" fill="#3a4858"/>
  </g>
</svg>
