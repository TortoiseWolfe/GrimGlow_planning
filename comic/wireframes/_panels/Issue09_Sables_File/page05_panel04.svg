    <path d="M 142 122 Q 156 130 170 124" stroke="#0a0604" stroke-width="0.6" fill="none" opacity="0.6"/>
    <path d="M 188 120 Q 200 128 214 122" stroke="#0a0604" stroke-width="0.6" fill="none" opacity="0.6"/>
