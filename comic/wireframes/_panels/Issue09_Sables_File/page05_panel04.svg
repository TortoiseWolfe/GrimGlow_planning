<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 5 Panel 4 — Sable in briefing mode, the commander delivering truth like an order</title>
  <desc>Close-up Sable's face in blue-white holographic light. Composure rebuilt to function — briefing mode. Cracks visible underneath. Doesn't look away. Geometric fairy script light patterns overlay her face — she is overlaid with the mission data.</desc>
  <defs>
    <linearGradient id="bg54" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="0.5" stop-color="#161a28"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <radialGradient id="holoFront54" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#080a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitS54" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.8" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairSil54" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="silverSuit54" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="eyeS54" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom54" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlow54" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft54" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bg54)"/>
  <rect width="366" height="240" fill="url(#holoFront54)"/>

  <g opacity="0.5" filter="url(#soft54)">
    <path d="M 0 0 L 60 0 L 50 240 L 0 240 Z" fill="#0a0a10"/>
    <path d="M 306 0 L 366 0 L 366 240 L 316 240 Z" fill="#0a0a10"/>
  </g>

  <g>
    <ellipse cx="183" cy="220" rx="170" ry="40" fill="#0a0a10"/>
  </g>

  <g>
    <path d="M 116 78 Q 110 100 116 124 Q 124 152 138 168 Q 156 178 180 178 Q 206 174 222 158 Q 232 134 230 100 Q 224 78 208 64 Q 184 58 162 60 Q 134 68 116 78 Z" fill="url(#faceLitS54)" opacity="0.95"/>
    <path d="M 116 90 Q 112 116 122 144 Q 132 166 152 178 Q 138 174 128 162 Q 116 144 112 118 Q 114 96 116 90 Z" fill="#080404" opacity="0.55"/>
  </g>

  <g>
    <path d="M 110 70 Q 124 56 162 52 Q 200 50 220 60 Q 232 72 232 88 L 226 96 Q 216 78 196 70 Q 168 64 144 70 Q 122 78 116 88 Z" fill="url(#hairSil54)" opacity="0.92"/>
