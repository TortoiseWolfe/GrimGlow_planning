  <path d="M 178 122 Q 174 140 178 158" stroke="#0a0604" stroke-width="1.1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 156 168 L 200 168" stroke="#0a0604" stroke-width="1.6"/>
  </g>

  <g>
    <path d="M 80 196 L 286 192 L 286 240 L 80 240 Z" fill="url(#silverSuit54)"/>
    <path d="M 110 192 L 160 196 L 200 196 L 250 192 L 250 220 L 110 220 Z" fill="#2a2a2a"/>
  </g>

  <g opacity="0.85">
