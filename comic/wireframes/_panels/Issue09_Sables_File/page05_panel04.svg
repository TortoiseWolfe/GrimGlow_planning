    <ellipse cx="240" cy="206" rx="7" ry="2" fill="#0a0604"/>
    <ellipse cx="184" cy="200" rx="4" ry="1.6" fill="#0a0604"/>
  </g>

  <g opacity="0.7" stroke="#88a0c8" stroke-width="0.3" fill="none">
