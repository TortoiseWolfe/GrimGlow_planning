<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 9 Panel 3 — Sable's flicker, "I considered that possibility"</title>
  <desc>Close-up Sable. Listening to Luma. Flicker of recognition — possibly hope, possibly pain. She has carried this question alone. Light has softened fractionally. Geometric patterns settled into steadier illumination as file stabilizes.</desc>
