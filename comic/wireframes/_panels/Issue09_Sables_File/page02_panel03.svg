<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 9 Page 2 Panel 3 — Wide profile two-shot, the confrontation as a balance</title>
  <desc>Medium wide two-shot eye-level from the side, profile framing. Wren left counting points on fingers, Sable right with hands at sides fists barely clenched. Beam stretches between them. Blue-white camp glow above, grey pre-dawn from wall gap behind Sable. Profile framing reads as a scale in balance.</desc>
