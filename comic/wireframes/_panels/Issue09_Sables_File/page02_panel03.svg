      <stop offset="0" stop-color="#0a1018"/>
      <stop offset="0.4" stop-color="#1a2030"/>
      <stop offset="0.7" stop-color="#1f2638"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <radialGradient id="dawnGrad" cx="1" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9098a8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="campGlow3" cx="0.5" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#88a0c8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
