<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 9 Page 22 Panel 1 — Night, the camp after the story</title>
  <desc>Wide establishing camp at night. Wall gap shows dark Victorian city beyond — distant gaslight, stars above rooftops. Theodore gone. Camp cold and blue-dark. Dim holographic perimeter markers pulse lowest. Figures visible only as shapes — sleeping or pretending. Faint stars through gap. Hollow after the hearth.</desc>
  <defs>
    <linearGradient id="bgL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040608"/>
      <stop offset="0.5" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="cityNightL1" cx="0.92" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a4858" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#1a2030" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020306" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickNightL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1810"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="timberSideL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="beamColdL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="cityHorizonL1" cx="0.95" cy="0.7" r="0.4">
      <stop offset="0" stop-color="#5a4838" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#3a2818" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#020306" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomL1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowL1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="softL1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="742" height="340" fill="url(#bgL1)"/>
  <rect width="742" height="340" fill="url(#cityNightL1)"/>
  <rect width="742" height="340" fill="url(#cityHorizonL1)"/>

  <g>
    <path d="M 0 0 L 60 0 L 60 340 L 0 340 Z" fill="url(#timberSideL1)"/>
    <path d="M 60 0 L 60 340 L 80 320 L 80 20 Z" fill="#0a0604" opacity="0.85"/>
  </g>

  <g>
    <rect x="60" y="280" width="640" height="14" fill="url(#beamColdL1)"/>
    <rect x="60" y="280" width="640" height="3" fill="#3a2818" opacity="0.5"/>
    <rect x="60" y="292" width="640" height="2" fill="#020100" opacity="0.95"/>
  </g>

  <g>
