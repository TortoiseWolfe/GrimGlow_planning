  <g opacity="0.5">
    <ellipse cx="540" cy="244" rx="3" ry="4" fill="#1a1008"/>
    <rect x="538" y="246" width="6" height="14" fill="#5a2e10" opacity="0.7"/>
  </g>

  <g opacity="0.45">
    <ellipse cx="220" cy="244" rx="3" ry="4" fill="#1a1008"/>
    <rect x="218" y="246" width="6" height="14" fill="#1f4a30" opacity="0.6"/>
  </g>

  <g opacity="0.45">
    <ellipse cx="370" cy="244" rx="3" ry="4" fill="#1a1008"/>
    <rect x="368" y="246" width="6" height="14" fill="#3a3a3a" opacity="0.6"/>
  </g>

  <g opacity="0.4">
    <ellipse cx="120" cy="244" rx="3" ry="4" fill="#1a1008"/>
    <rect x="118" y="246" width="6" height="14" fill="#1a0606" opacity="0.6"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="120" cy="262" rx="6" ry="2" fill="#020100"/>
    <ellipse cx="220" cy="262" rx="6" ry="2" fill="#020100"/>
    <ellipse cx="370" cy="262" rx="6" ry="2" fill="#020100"/>
    <ellipse cx="540" cy="262" rx="6" ry="2" fill="#020100"/>
  </g>

  <g opacity="0.7">
    <rect x="50" y="304" width="640" height="22" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="370" y="318" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-style="italic" font-size="11" fill="#5a4a30">"Night."</text>
  </g>

  <g opacity="0.55">
    <circle cx="120" cy="40" r="0.6" fill="#a8c0e0"/>
    <circle cx="280" cy="20" r="0.7" fill="#a8c0e0"/>
    <circle cx="400" cy="50" r="0.6" fill="#a8c0e0"/>
    <circle cx="500" cy="30" r="0.5" fill="#a8c0e0"/>
    <circle cx="200" cy="60" r="0.5" fill="#7088a8"/>
