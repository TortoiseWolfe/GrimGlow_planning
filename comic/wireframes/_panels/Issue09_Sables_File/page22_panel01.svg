    <line x1="600" y1="220" x2="742" y2="220" stroke="#080404" stroke-width="0.6" opacity="0.85"/>
    <line x1="600" y1="280" x2="742" y2="280" stroke="#080404" stroke-width="0.6" opacity="0.85"/>
    <line x1="660" y1="0" x2="660" y2="40" stroke="#080404" stroke-width="0.5"/>
    <line x1="640" y1="40" x2="640" y2="100" stroke="#080404" stroke-width="0.5"/>
    <line x1="700" y1="100" x2="700" y2="160" stroke="#080404" stroke-width="0.5"/>
    <line x1="640" y1="160" x2="640" y2="220" stroke="#080404" stroke-width="0.5"/>
    <line x1="680" y1="220" x2="680" y2="280" stroke="#080404" stroke-width="0.5"/>
