    <circle cx="618" cy="100" r="0.6" fill="#a8c0e0"/>
    <circle cx="610" cy="120" r="0.5" fill="#a8c0e0"/>
    <circle cx="616" cy="50" r="0.6" fill="#a8c0e0"/>
    <circle cx="608" cy="140" r="0.5" fill="#9098a8"/>
