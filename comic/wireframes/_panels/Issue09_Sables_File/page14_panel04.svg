<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 9 Page 14 Panel 4 — Sable sits on beam edge, the commander with nothing to command</title>
  <desc>Medium close-up Sable on edge of main beam, legs hanging over, hands on knees. Data module beside her, display off. Empty — not composure, not pain, the space between where person exists without performance. Morning grey only illumination, no holographic. The most unadorned in the volume.</desc>
