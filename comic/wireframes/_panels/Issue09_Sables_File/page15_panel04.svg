  </g>
  <g opacity="0.85" filter="url(#strongGlowF4)">
    <circle cx="180" cy="190" r="22" fill="#88a8d0"/>
  </g>
  <g>
    <circle cx="180" cy="190" r="12" fill="url(#markerCoreF4)"/>
    <circle cx="180" cy="190" r="6" fill="#a8c0e0"/>
    <circle cx="180" cy="190" r="2" fill="#ffffff" opacity="0.95"/>
  </g>
  <g opacity="0.85">
    <line x1="160" y1="170" x2="200" y2="210" stroke="#a8c0e0" stroke-width="0.5"/>
    <line x1="200" y1="170" x2="160" y2="210" stroke="#a8c0e0" stroke-width="0.5"/>
    <circle cx="180" cy="190" r="18" fill="none" stroke="#a8c0e0" stroke-width="0.5"/>
  </g>
  <g>
    <rect x="178" y="200" width="4" height="40" fill="#3a4858"/>
    <ellipse cx="180" cy="240" rx="6" ry="2" fill="#080404"/>
  </g>

  <g>
    <ellipse cx="380" cy="166" rx="12" ry="14" fill="#3a261a"/>
    <ellipse cx="380" cy="158" rx="8" ry="9" fill="url(#faceLitT_F4)"/>
    <path d="M 370 150 Q 380 142 390 150 L 388 156 Q 384 146 380 146 Q 376 146 372 156 Z" fill="url(#hairBuzzF4)"/>
    <ellipse cx="376" cy="166" rx="1.2" ry="1.5" fill="#0a0604"/>
    <ellipse cx="384" cy="166" rx="1.2" ry="1.5" fill="#0a0604"/>
    <path d="M 374 174 L 386 174" stroke="#0a0604" stroke-width="1.2"/>
    <path d="M 360 178 L 400 178 L 408 240 L 352 240 Z" fill="url(#crimsonArmorF4)"/>
    <path d="M 360 184 L 400 184 L 400 220 L 360 220 Z" fill="#1a0606" opacity="0.85"/>
    <path d="M 352 192 L 340 224 L 346 234 L 358 210 Z" fill="url(#crimsonArmorF4)"/>
    <path d="M 408 192 L 420 224 L 414 234 L 402 210 Z" fill="url(#crimsonArmorF4)"/>
    <path d="M 340 232 L 332 240" stroke="url(#crimsonArmorF4)" stroke-width="3"/>
    <path d="M 420 232 L 428 240" stroke="url(#crimsonArmorF4)" stroke-width="3"/>
  </g>

  <g>
    <rect x="412" y="180" width="64" height="10" fill="url(#rifleF4)"/>
    <rect x="412" y="180" width="64" height="2" fill="#3a3a3a" opacity="0.6"/>
    <rect x="412" y="188" width="64" height="2" fill="#040404" opacity="0.85"/>
    <rect x="420" y="184" width="50" height="3" fill="#0a0a0a"/>
    <rect x="468" y="178" width="6" height="14" fill="#040404"/>
    <ellipse cx="476" cy="185" rx="2" ry="2.5" fill="#020202"/>
    <rect x="406" y="184" width="8" height="3" fill="#3a3a3a"/>
    <line x1="430" y1="180" x2="430" y2="190" stroke="#040404" stroke-width="0.4"/>
    <line x1="450" y1="180" x2="450" y2="190" stroke="#040404" stroke-width="0.4"/>
  </g>
  <g>
    <path d="M 412 180 Q 416 184 416 188 L 414 220 L 408 220 Z" fill="url(#crimsonArmorF4)"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="350" cy="226" rx="6" ry="2" fill="#0a0606"/>
    <ellipse cx="408" cy="226" rx="6" ry="2" fill="#0a0606"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowF4)">
    <circle cx="334" cy="210" r="2.5" fill="#dc4540"/>
    <circle cx="424" cy="210" r="2.5" fill="#dc4540"/>
    <circle cx="380" cy="232" r="2" fill="#dc4540"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="380" cy="244" rx="22" ry="2.5" fill="#080404"/>
  </g>

  <g opacity="0.45">
    <line x1="500" y1="40" x2="700" y2="40" stroke="#88a0c8" stroke-width="0.3"/>
    <line x1="500" y1="80" x2="700" y2="80" stroke="#88a0c8" stroke-width="0.3"/>
    <line x1="500" y1="120" x2="700" y2="120" stroke="#88a0c8" stroke-width="0.3"/>
    <line x1="500" y1="160" x2="700" y2="160" stroke="#88a0c8" stroke-width="0.3"/>
  </g>
  <g font-family="Courier New, monospace" fill="#88a0c8" opacity="0.75">
    <text x="600" y="108" text-anchor="middle" font-size="6.4" letter-spacing="2" font-weight="700">PERIMETER</text>
    <text x="600" y="128" text-anchor="middle" font-size="6.4" letter-spacing="2" font-weight="700">CLEAR</text>
  </g>

  <g opacity="0.55" filter="url(#bloomF4)">
    <ellipse cx="380" cy="252" rx="50" ry="6" fill="#5878a8"/>
  </g>

  <g opacity="0.4">
    <circle cx="120" cy="40" r="0.4" fill="#3a4858"/>
    <circle cx="660" cy="50" r="0.4" fill="#3a4858"/>
  </g>
</svg>
