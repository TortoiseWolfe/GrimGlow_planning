<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 15 Panel 4 — Thresh on perimeter, "Perimeter clear" — reflex as survival</title>
  <desc>Medium shot Thresh at camp's far perimeter, overwatch position near weakly pulsing holographic marker. Weapon ready, scanning outward. The military default when everything fails. Body knows what to do when mind cannot. Eyes scanning, jaw set, compressed into perimeter defense.</desc>
  <defs>
    <linearGradient id="bgF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.4" stop-color="#161a26"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="markerPulseF4" cx="0.25" cy="0.5" r="0.25">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#080a10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawnFilterF4" cx="0.95" cy="0.4" r="0.4">
      <stop offset="0" stop-color="#a0a8b8" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#080a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timberSideF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="beamMainF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="faceLitT_F4" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#1a1414"/>
      <stop offset="0.4" stop-color="#3a2828"/>
      <stop offset="0.8" stop-color="#5a3838"/>
      <stop offset="1" stop-color="#7a5050"/>
    </linearGradient>
    <linearGradient id="hairBuzzF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="crimsonArmorF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2520"/>
      <stop offset="0.5" stop-color="#4a1410"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="rifleF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="markerCoreF4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#5878a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5878a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomF4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="strongGlowF4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowF4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softF4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="742" height="280" fill="url(#bgF4)"/>
  <rect width="742" height="280" fill="url(#dawnFilterF4)"/>
  <rect width="742" height="280" fill="url(#markerPulseF4)"/>

  <g>
