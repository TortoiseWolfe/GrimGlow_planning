    <path d="M 60 0 L 60 280 L 80 260 L 80 20 Z" fill="#1a1008" opacity="0.85"/>
  </g>

  <g>
    <rect x="60" y="220" width="640" height="14" fill="url(#beamMainF4)"/>
    <rect x="60" y="220" width="640" height="3" fill="#5a3a20" opacity="0.55"/>
    <rect x="60" y="232" width="640" height="2" fill="#0e0805" opacity="0.85"/>
  </g>

  <g>
