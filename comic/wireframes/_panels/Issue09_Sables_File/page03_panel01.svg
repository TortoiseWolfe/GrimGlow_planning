<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 3 Panel 1 — Sable retrieves the data module, the first strong light</title>
  <desc>Medium two-shot over Wren's left shoulder. Wren in foreground (back, copper-suited shoulder, dark hair). Beyond, Sable retrieves data module from forearm compartment. Module activates — first strong blue-white light cuts pre-dawn dimness.</desc>
  <defs>
    <linearGradient id="bg31" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1018"/>
      <stop offset="0.4" stop-color="#161a26"/>
      <stop offset="0.7" stop-color="#1a1f2c"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <radialGradient id="moduleGlow31" cx="0.55" cy="0.55" r="0.4">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#5878a8" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#2a3848" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copperBack31" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#5a2e10"/>
      <stop offset="0.6" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <linearGradient id="silverFig31" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#4a4e54"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="faceLitS" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4a30"/>
    </linearGradient>
    <linearGradient id="hairSil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="hairBlack31" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#2a1e1a"/>
