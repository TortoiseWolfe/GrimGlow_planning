  <title>Issue 9 Page 9 Panel 2 — Luma's reframe, "What if it is something the people of this era believe?"</title>
  <desc>Medium wide eye level. Five figures around display, the final layer landing. Luma leans forward, lenses glowing, hands gesturing — the reframe question. Wren skeptical-engaged. Jink rigid but tilted to listen. Thresh half-turned but head angled back. Sable watches Luma make the connection.</desc>
