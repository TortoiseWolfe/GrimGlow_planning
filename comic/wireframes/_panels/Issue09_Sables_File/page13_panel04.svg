    <ellipse cx="124" cy="100" rx="8" ry="9" fill="url(#faceLitL_D4)"/>
    <path d="M 112 88 Q 124 78 138 88 Q 142 100 138 110 L 134 116 Q 130 96 124 92 Q 118 92 114 102 Z" fill="url(#hairBlkD4)"/>
    <path d="M 124 84 Q 128 100 132 130 Q 134 154 130 178" stroke="url(#hairBlkD4)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="120" cy="106" rx="1.2" ry="1.5" fill="#0a0604"/>
    <ellipse cx="128" cy="106" rx="1.2" ry="1.5" fill="#0a0604"/>
    <circle cx="121" cy="105" r="0.7" fill="url(#eyeL_D4)"/>
    <circle cx="129" cy="105" r="0.7" fill="url(#eyeL_D4)"/>
    <path d="M 119 113 L 129 113" stroke="#0a0604" stroke-width="0.9"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowD4)">
    <rect x="112" y="98" width="10" height="9" fill="#7848b8" opacity="0.55"/>
    <rect x="124" y="98" width="10" height="9" fill="#7848b8" opacity="0.55"/>
  </g>
  <g>
    <rect x="113" y="99" width="8" height="7" rx="1.4" fill="none" stroke="#a878d0" stroke-width="0.6" opacity="0.92"/>
    <rect x="125" y="99" width="8" height="7" rx="1.4" fill="none" stroke="#a878d0" stroke-width="0.6" opacity="0.92"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowD4)">
    <path d="M 128 86 Q 132 130 132 178" stroke="#a878d0" stroke-width="1.6" fill="none"/>
  </g>

  <g>
    <path d="M 104 120 L 144 120 L 148 162 L 152 198 L 100 198 L 104 162 Z" fill="url(#violetSuitD4)"/>
    <path d="M 106 124 L 142 124 L 144 158 L 106 158 Z" fill="#3a1a5a" opacity="0.85"/>
    <path d="M 100 130 L 84 162 L 80 198 L 96 158 Z" fill="url(#violetSuitD4)" opacity="0.95"/>
    <path d="M 148 130 L 164 162 L 168 198 L 152 158 Z" fill="url(#violetSuitD4)" opacity="0.95"/>
    <path d="M 80 198 L 70 200 L 70 158 L 80 158 Z" fill="#3a1a5a"/>
    <path d="M 168 198 L 178 200 L 178 158 L 168 158 Z" fill="#3a1a5a"/>
  </g>

  <g>
    <rect x="62" y="178" width="22" height="14" rx="2" fill="url(#scannerD4)" stroke="#3a1a5a" stroke-width="0.6"/>
    <rect x="65" y="180" width="16" height="4" fill="#1a0e2e"/>
    <rect x="65" y="185" width="16" height="2" fill="#a878d0" opacity="0.85"/>
    <rect x="65" y="188" width="10" height="2" fill="#a878d0" opacity="0.65"/>
    <rect x="79" y="188" width="2" height="2" fill="#c0a0e8"/>
  </g>
  <g opacity="0.9" filter="url(#strongGlowD4)">
    <ellipse cx="73" cy="180" rx="11" ry="3" fill="#a878d0"/>
  </g>

  <g>
    <rect x="166" y="178" width="22" height="14" rx="2" fill="url(#deadCoreD4)" stroke="#0a0610" stroke-width="0.6"/>
    <rect x="169" y="180" width="16" height="2" fill="#020204"/>
    <rect x="169" y="184" width="16" height="2" fill="#020204"/>
    <line x1="170" y1="178" x2="184" y2="192" stroke="#040408" stroke-width="0.5"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="80" cy="200" rx="3" ry="1.2" fill="#0a0418"/>
    <ellipse cx="170" cy="200" rx="3" ry="1.2" fill="#0a0418"/>
    <ellipse cx="124" cy="194" rx="3" ry="1" fill="#0a0418"/>
  </g>

  <g opacity="0.7">
    <line x1="86" y1="180" x2="100" y2="180" stroke="#a878d0" stroke-width="0.4" stroke-dasharray="2 2"/>
  </g>

  <g opacity="0.55" filter="url(#bloomD4)">
    <ellipse cx="124" cy="208" rx="40" ry="5" fill="#7848b8"/>
  </g>

  <g opacity="0.4">
    <circle cx="40" cy="40" r="0.5" fill="#9098b0"/>
    <circle cx="200" cy="50" r="0.5" fill="#9098b0"/>
  </g>
</svg>
