<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 13 Panel 4 — Luma at storage, "What did you know that we don't?"</title>
  <desc>Medium shot Luma at camp storage gathering scanner equipment. Holds dead data core in one hand, living scanner in other — two technologies same origin, one active one centuries dead. Focused but visibly shaken. Speaks quietly to prior operative whose possession she carries.</desc>
  <defs>
    <linearGradient id="bgD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a182a"/>
      <stop offset="0.4" stop-color="#262438"/>
      <stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <radialGradient id="dawnLumaD4" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9098b0" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a5478" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#15131f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitL_D4" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairBlkD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="0.5" stop-color="#1a1414"/>
      <stop offset="1" stop-color="#2a1818"/>
    </linearGradient>
    <linearGradient id="violetSuitD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#4a2a78"/>
      <stop offset="1" stop-color="#1a0e2e"/>
    </linearGradient>
    <linearGradient id="storageD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3220"/>
      <stop offset="0.5" stop-color="#2a2418"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <linearGradient id="scannerD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a878d0"/>
      <stop offset="0.5" stop-color="#7848b8"/>
      <stop offset="1" stop-color="#3a1a5a"/>
    </linearGradient>
    <linearGradient id="deadCoreD4" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1a1418"/>
      <stop offset="0.5" stop-color="#0a0810"/>
      <stop offset="1" stop-color="#020208"/>
    </linearGradient>
    <radialGradient id="eyeL_D4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a878d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a878d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomD4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowD4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softD4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgD4)"/>
  <rect width="246" height="240" fill="url(#dawnLumaD4)"/>

  <g>
    <rect x="20" y="200" width="206" height="40" fill="url(#storageD4)" stroke="#5a3a20" stroke-width="0.6"/>
    <rect x="26" y="206" width="194" height="28" fill="#1a140a"/>
    <line x1="26" y1="216" x2="220" y2="216" stroke="#5a3a20" stroke-width="0.4"/>
    <line x1="26" y1="226" x2="220" y2="226" stroke="#5a3a20" stroke-width="0.4"/>
    <circle cx="50" cy="220" r="2" fill="#7a3e18" opacity="0.7"/>
    <circle cx="100" cy="222" r="1.6" fill="#3a1a5a" opacity="0.7"/>
    <circle cx="180" cy="226" r="1.5" fill="#7848b8" opacity="0.7"/>
    <rect x="60" y="218" width="14" height="8" fill="#3a1f0a"/>
    <rect x="140" y="218" width="14" height="8" fill="#3a1a5a"/>
    <rect x="190" y="220" width="20" height="6" fill="#3a1f0a"/>
  </g>

  <g>
