      <stop offset="0" stop-color="#1a1f2c"/>
      <stop offset="0.4" stop-color="#252a36"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <radialGradient id="amberFullG3" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f4d8a8" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#a89878" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickFaceG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.5" stop-color="#7a5238"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="cityFarG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8868"/>
      <stop offset="0.5" stop-color="#5a4838"/>
      <stop offset="1" stop-color="#2a1f15"/>
    </linearGradient>
    <linearGradient id="faceLitS_G3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6438"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <linearGradient id="hairSilG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0b8a8"/>
      <stop offset="0.5" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="silverSuitG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a5a"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
