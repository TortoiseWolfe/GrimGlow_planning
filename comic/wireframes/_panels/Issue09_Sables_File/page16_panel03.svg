<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 16 Panel 3 — Sable at the wall gap, lost, the warmest light to touch her face</title>
  <desc>Close-up Sable at wall gap looking out. Full morning light on face from outside — warmest amber-grey. Through crack: rooftops, chimneys, church spires, smoke. Lost — not performing anything, looking at city as if it might have answers. The view that has been her companion through the secret.</desc>
  <defs>
