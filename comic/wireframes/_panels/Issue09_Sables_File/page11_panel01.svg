<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 9 Page 11 Panel 1 — Jink paces, "You managed us"</title>
  <desc>Medium wide eye level. Jink paces beam moving between blue-white display and morning grey from wall gap, hand through hair, gesticulating. Anger kinetic. Sable still at display absorbing. Wren stands ground between. Movement is Jink's, everything else still.</desc>
