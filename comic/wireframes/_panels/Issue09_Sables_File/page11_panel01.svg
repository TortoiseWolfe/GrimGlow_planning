      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.4" stop-color="#161a26"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="leftHolo_B1" cx="0.15" cy="0.55" r="0.35">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#080a10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightDawn_B1" cx="0.95" cy="0.4" r="0.4">
      <stop offset="0" stop-color="#a0a8b8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#080a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverFB1" x1="0" y1="0" x2="0" y2="1">
