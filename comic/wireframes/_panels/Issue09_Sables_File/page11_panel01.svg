      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="copperFB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="emeraldFB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <linearGradient id="hairGoldB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d040"/>
      <stop offset="0.5" stop-color="#d8b020"/>
