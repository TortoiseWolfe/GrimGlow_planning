    <ellipse cx="220" cy="124" rx="14" ry="0.8" fill="#5a4a30"/>
    <ellipse cx="120" cy="124" rx="14" ry="0.8" fill="#5a4a30"/>
  </g>

  <g>
    <ellipse cx="160" cy="116" rx="60" ry="7" fill="#1f4a30" opacity="0.85"/>
    <path d="M 120 110 Q 140 104 160 106 L 200 110 Q 210 110 210 116 Q 210 122 200 122 L 130 122 Q 110 120 110 116 Z" fill="url(#emeraldSuitF3)"/>
    <ellipse cx="120" cy="118" rx="14" ry="6" fill="#1f4a30"/>

    <path d="M 200 112 L 270 116 L 286 122 L 200 122 Z" fill="url(#emeraldSuitF3)"/>
    <ellipse cx="280" cy="120" rx="6" ry="3" fill="url(#emeraldSuitF3)"/>
  </g>

  <g>
    <ellipse cx="100" cy="106" rx="22" ry="14" fill="url(#faceLitJ_F3)"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowF3)">
    <ellipse cx="80" cy="100" rx="32" ry="14" fill="#a87820"/>
  </g>
  <g>
    <ellipse cx="80" cy="100" rx="22" ry="10" fill="url(#hairGoldF3)"/>
    <ellipse cx="60" cy="98" rx="14" ry="8" fill="url(#hairGoldF3)" transform="rotate(-15 60 98)"/>
    <ellipse cx="100" cy="96" rx="16" ry="7" fill="url(#hairGoldF3)"/>
    <ellipse cx="50" cy="106" rx="10" ry="6" fill="url(#hairGoldF3)" transform="rotate(-25 50 106)"/>
    <ellipse cx="76" cy="92" rx="8" ry="5" fill="url(#hairGoldF3)"/>
  </g>

  <g>
    <ellipse cx="106" cy="102" rx="3" ry="1.6" fill="#0a0604"/>
    <ellipse cx="116" cy="101" rx="3" ry="1.6" fill="#0a0604"/>
    <circle cx="106" cy="102" r="1" fill="url(#eyeFlatF3)"/>
    <circle cx="116" cy="101" r="1" fill="url(#eyeFlatF3)"/>
    <line x1="100" y1="106" x2="120" y2="106" stroke="#0a0604" stroke-width="0.6" opacity="0.7"/>
  </g>

  <g>
    <line x1="123" y1="105" x2="135" y2="106" stroke="#0a0604" stroke-width="0.7"/>
    <line x1="100" y1="100" x2="106" y2="100" stroke="#0a0604" stroke-width="0.6"/>
    <line x1="113" y1="100" x2="119" y2="100" stroke="#0a0604" stroke-width="0.6"/>
  </g>

  <g>
    <path d="M 240 114 L 320 110 L 320 116 L 240 118 Z" fill="url(#emeraldSuitF3)" opacity="0.85"/>
    <path d="M 320 110 L 330 108 L 332 114 L 320 116 Z" fill="url(#emeraldSuitF3)" opacity="0.95"/>
    <path d="M 326 108 Q 332 100 332 96 Q 330 92 326 96 L 326 108 Z" fill="url(#emeraldSuitF3)"/>
  </g>

  <g opacity="0.5">
    <path d="M 332 96 Q 336 86 340 88" stroke="#5a4a30" stroke-width="0.4" fill="none"/>
    <circle cx="324" cy="100" r="0.5" fill="#5a4a30"/>
    <circle cx="316" cy="104" r="0.4" fill="#5a4a30"/>
    <circle cx="308" cy="106" r="0.4" fill="#5a4a30"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowF3)">
    <ellipse cx="200" cy="112" rx="24" ry="6" fill="#3aa868"/>
  </g>
  <g opacity="0.95">
    <line x1="180" y1="110" x2="220" y2="110" stroke="#5acc88" stroke-width="0.4"/>
    <line x1="180" y1="118" x2="220" y2="118" stroke="#5acc88" stroke-width="0.4"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="80" cy="148" rx="24" ry="3" fill="#040608"/>
    <ellipse cx="160" cy="146" rx="40" ry="3" fill="#040608"/>
    <ellipse cx="280" cy="146" rx="14" ry="2" fill="#040608"/>
  </g>

  <g opacity="0.4">
    <circle cx="40" cy="200" r="0.4" fill="#3a4858"/>
    <circle cx="200" cy="220" r="0.4" fill="#3a4858"/>
    <circle cx="320" cy="200" r="0.4" fill="#3a4858"/>
  </g>
</svg>
