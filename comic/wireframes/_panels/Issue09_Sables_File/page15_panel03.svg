<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 15 Panel 3 — Jink lying on upper beam, idle dust patterns, stillness where motion should be</title>
  <desc>Medium shot Jink lying on back on upper cross-beam, staring up at dark timber ceiling. Curls splayed against rough wood, one hand traces idle patterns in dust. Wing-pack stowed but seams glow faint emerald. Energy that defines them — restlessness, quips, grin — entirely absent.</desc>
  <defs>
    <linearGradient id="bgF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040608"/>
      <stop offset="0.4" stop-color="#0a0e16"/>
      <stop offset="0.8" stop-color="#080a10"/>
      <stop offset="1" stop-color="#040608"/>
    </linearGradient>
    <radialGradient id="emeraldGlowF3" cx="0.5" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#3aa868" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#1a4030" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#040608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceilingDarkF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020306"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamWoodF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="faceLitJ_F3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairGoldF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87820"/>
      <stop offset="0.4" stop-color="#7a5810"/>
      <stop offset="1" stop-color="#3a2810"/>
    </linearGradient>
    <linearGradient id="emeraldSuitF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7048"/>
      <stop offset="0.5" stop-color="#1f4a30"/>
      <stop offset="1" stop-color="#0a1f14"/>
    </linearGradient>
    <radialGradient id="eyeFlatF3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a6470" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3a4858" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomF3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowF3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="softF3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgF3)"/>
  <rect width="366" height="260" fill="url(#emeraldGlowF3)"/>

  <g opacity="0.85">
    <rect x="0" y="0" width="366" height="80" fill="url(#ceilingDarkF3)"/>
  </g>

  <g opacity="0.5">
    <line x1="0" y1="20" x2="366" y2="22" stroke="#1a1010" stroke-width="0.4"/>
    <line x1="0" y1="40" x2="366" y2="42" stroke="#1a1010" stroke-width="0.4"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#1a1010" stroke-width="0.3"/>
    <line x1="120" y1="0" x2="120" y2="80" stroke="#1a1010" stroke-width="0.3"/>
    <line x1="240" y1="0" x2="240" y2="80" stroke="#1a1010" stroke-width="0.3"/>
    <line x1="320" y1="0" x2="320" y2="80" stroke="#1a1010" stroke-width="0.3"/>
  </g>

  <g>
    <rect x="20" y="120" width="326" height="22" fill="url(#beamWoodF3)"/>
    <rect x="20" y="120" width="326" height="3" fill="#5a3a20" opacity="0.55"/>
    <rect x="20" y="140" width="326" height="2" fill="#0e0805" opacity="0.85"/>
    <line x1="80" y1="120" x2="80" y2="142" stroke="#0e0805" stroke-width="0.5"/>
    <line x1="180" y1="120" x2="180" y2="142" stroke="#0e0805" stroke-width="0.5"/>
    <line x1="280" y1="120" x2="280" y2="142" stroke="#0e0805" stroke-width="0.5"/>
  </g>

  <g opacity="0.55">
