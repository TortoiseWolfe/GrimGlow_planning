<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 10 Panel 2 — Jink looks down and away, the fight leaves the fight</title>
  <desc>Close-up slight high angle. Jink looking down and away, breaking eye contact. Curls falling forward, partially shadowing face. Fury still present but shifted inward — hurt more than combat. Combative energy nowhere to go after Sable's surrender.</desc>
