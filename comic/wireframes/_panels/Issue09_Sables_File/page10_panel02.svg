      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <radialGradient id="holoTopA2" cx="0.5" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#080a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitJ_A2" x1="0" y1="0" x2="0" y2="0.7">
