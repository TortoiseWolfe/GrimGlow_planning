<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 9 Page 12 Panel 4 — Dispersal, the unit becoming five trajectories</title>
  <desc>Wide eye level slight pull-back. Five figures dispersing in different directions. Jink toward upper cross-timbers. Thresh distant in far shadows. Luma toward storage area. Wren toward repair station. Sable still at center, fixed point everything moves away from. Honest morning grey, display off.</desc>
