<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 7 Panel 2 — Wren cuts through with engineer's precision</title>
  <desc>Medium close-up Wren. Grim and steady — the engineer reporting assessed damage. Translates Sable's military briefing into operational reality. Heavily oil-stained copper suit, faint copper-gold nodes glow through grime. Blue-white display reflected on her features.</desc>
