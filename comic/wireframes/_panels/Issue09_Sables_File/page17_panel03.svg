<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 17 Panel 3 — Sable in shadow holds the data module without looking</title>
  <desc>Medium shot Sable on secondary beam in shadow, holding data module — not activated, just held. Habit ingrained. Hollowed out, composure not rebuilt, mask not restored. Module dark, inactive. Object that was burden now just device. Soot-darkened silver blends with grey shadow.</desc>
