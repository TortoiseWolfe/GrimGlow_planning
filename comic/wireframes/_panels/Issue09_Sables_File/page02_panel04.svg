<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 2 Panel 4 — Sable's hand unclenching, surrender gesture</title>
  <desc>Extreme close-up at eye level of Sable's hand at her side in soot-darkened silver gauntlet. Fist unclenching — fingers opening, releasing tension. Dim blue-white light catches knuckles. Soot/grime visible. A hand letting go.</desc>
  <defs>
    <linearGradient id="bgHand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c12"/>
      <stop offset="0.5" stop-color="#161a22"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <radialGradient id="rimHand" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#5a78a0" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#2a3848" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#080a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gauntletDark" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5a5a5e"/>
      <stop offset="0.4" stop-color="#3a3a3e"/>
      <stop offset="0.8" stop-color="#1a1a1e"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="gauntletLit" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="0.5" stop-color="#5a626a"/>
      <stop offset="1" stop-color="#1a1a1e"/>
    </linearGradient>
    <filter id="bloomHand" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softHand" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgHand)"/>
  <rect width="366" height="240" fill="url(#rimHand)"/>

  <g opacity="0.4" filter="url(#softHand)">
    <rect x="0" y="0" width="366" height="40" fill="#1a2030"/>
    <rect x="0" y="200" width="366" height="40" fill="#0a0a10"/>
  </g>

  <g>
    <path d="M 90 60 Q 80 100 84 150 Q 92 200 110 222 L 280 222 Q 292 200 286 162 L 280 110 Q 272 70 250 56 Q 220 50 180 52 Q 130 56 90 60 Z" fill="url(#gauntletDark)" opacity="0.95"/>
  </g>

  <g>
    <path d="M 110 70 Q 108 110 116 158 L 124 158 Q 130 130 130 92 Q 130 76 122 70 Z" fill="url(#gauntletLit)" opacity="0.92"/>
    <path d="M 140 64 Q 136 110 144 162 L 156 162 Q 162 130 160 84 Q 158 66 150 62 Z" fill="url(#gauntletLit)" opacity="0.92"/>
    <path d="M 174 60 Q 168 110 176 168 L 190 168 Q 198 132 194 80 Q 192 60 184 58 Z" fill="url(#gauntletLit)" opacity="0.95"/>
    <path d="M 210 64 Q 204 112 212 168 L 226 168 Q 232 130 228 84 Q 226 66 218 62 Z" fill="url(#gauntletLit)" opacity="0.92"/>
    <path d="M 248 78 Q 240 112 246 158 L 258 156 Q 262 124 258 92 Q 256 78 252 76 Z" fill="url(#gauntletLit)" opacity="0.85"/>
  </g>

  <g opacity="0.7">
    <ellipse cx="118" cy="78" rx="6" ry="3" fill="#0a0a0e"/>
    <ellipse cx="148" cy="74" rx="6" ry="3" fill="#0a0a0e"/>
    <ellipse cx="184" cy="70" rx="6" ry="3" fill="#0a0a0e"/>
    <ellipse cx="220" cy="74" rx="6" ry="3" fill="#0a0a0e"/>

    <ellipse cx="120" cy="120" rx="5" ry="2.5" fill="#0a0a0e"/>
    <ellipse cx="150" cy="116" rx="5" ry="2.5" fill="#0a0a0e"/>
    <ellipse cx="186" cy="112" rx="5" ry="2.5" fill="#0a0a0e"/>
    <ellipse cx="222" cy="116" rx="5" ry="2.5" fill="#0a0a0e"/>
  </g>

  <g opacity="0.85" filter="url(#bloomHand)">
    <path d="M 116 90 Q 124 130 122 156" stroke="#88a0c8" stroke-width="1.4" fill="none"/>
    <path d="M 148 86 Q 156 130 154 162" stroke="#88a0c8" stroke-width="1.4" fill="none"/>
    <path d="M 184 80 Q 192 130 190 168" stroke="#88a0c8" stroke-width="1.6" fill="none"/>
    <path d="M 220 86 Q 228 130 226 162" stroke="#88a0c8" stroke-width="1.4" fill="none"/>
  </g>

  <g opacity="0.95">
    <path d="M 116 90 Q 124 130 122 156" stroke="#a8c0e0" stroke-width="0.6" fill="none"/>
    <path d="M 148 86 Q 156 130 154 162" stroke="#a8c0e0" stroke-width="0.6" fill="none"/>
    <path d="M 184 80 Q 192 130 190 168" stroke="#c0d8f0" stroke-width="0.8" fill="none"/>
    <path d="M 220 86 Q 228 130 226 162" stroke="#a8c0e0" stroke-width="0.6" fill="none"/>
  </g>

  <g>
    <path d="M 88 130 Q 100 170 124 210 L 256 210 Q 280 170 290 130 Q 290 110 280 100 Q 250 88 220 90 L 168 92 Q 130 90 110 100 Q 90 112 88 130 Z" fill="url(#gauntletDark)"/>
    <path d="M 100 140 Q 110 168 130 200 L 248 200 Q 268 168 278 140 Q 278 122 268 116 Q 240 108 200 110 L 178 110 Q 130 108 110 118 Q 100 128 100 140 Z" fill="url(#gauntletLit)" opacity="0.85"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="180" cy="150" rx="40" ry="14" fill="#0a0a0e"/>
    <ellipse cx="180" cy="148" rx="36" ry="10" fill="#161a22"/>
  </g>

  <g opacity="0.9">
    <circle cx="120" cy="100" r="2" fill="#0a0604"/>
    <circle cx="100" cy="130" r="2.5" fill="#0a0604"/>
    <circle cx="280" cy="120" r="1.8" fill="#0a0604"/>
    <circle cx="252" cy="110" r="2" fill="#0a0604"/>
    <ellipse cx="200" cy="180" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="160" cy="180" rx="5" ry="2" fill="#0a0604"/>
    <path d="M 110 140 Q 130 146 150 144" stroke="#0a0604" stroke-width="0.8" fill="none"/>
    <path d="M 240 144 Q 220 148 200 146" stroke="#0a0604" stroke-width="0.8" fill="none"/>
  </g>

  <g opacity="0.7">
    <line x1="120" y1="80" x2="120" y2="110" stroke="#404048" stroke-width="0.4"/>
    <line x1="184" y1="78" x2="184" y2="120" stroke="#404048" stroke-width="0.4"/>
    <line x1="248" y1="80" x2="248" y2="110" stroke="#404048" stroke-width="0.4"/>
    <line x1="100" y1="160" x2="280" y2="160" stroke="#404048" stroke-width="0.4"/>
  </g>

  <g opacity="0.6" filter="url(#bloomHand)">
    <ellipse cx="184" cy="110" rx="60" ry="4" fill="#88a0c8"/>
  </g>

  <g opacity="0.4">
    <circle cx="40" cy="40" r="0.5" fill="#5a78a0"/>
    <circle cx="320" cy="50" r="0.5" fill="#5a78a0"/>
    <circle cx="60" cy="200" r="0.4" fill="#3a4858"/>
    <circle cx="320" cy="210" r="0.4" fill="#3a4858"/>
  </g>
</svg>
