      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <radialGradient id="rimGlow" cx="0.5" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#5a78a0" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2a3848" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0a0e16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLit" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.8" stop-color="#5a3e2a"/>
      <stop offset="1" stop-color="#7a5436"/>
    </linearGradient>
    <linearGradient id="copperSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="hairBun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="0.5" stop-color="#1a1414"/>
      <stop offset="1" stop-color="#2a1e1a"/>
    </linearGradient>
    <filter id="bloomFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

