<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 2 Panel 1 — Wren, arms crossed, presenting evidence</title>
  <desc>Medium close-up slight low angle of Wren. East Asian features, wiry build, oil-stained copper suit. Arms crossed — defensive-offensive engineer's posture. Hard focus, no anger. Dim blue-white camp glow from behind/above.</desc>
