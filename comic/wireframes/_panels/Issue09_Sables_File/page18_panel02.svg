<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 18 Panel 2 — Theodore's POV through the wall gap</title>
  <desc>Theodore's POV. From outside through crack: dim interior with scattered fairy-tech lights, tiny figures on beams. Sable rising on main beam, silver suit catching gaslight that enters. Camp like miniature stage — intimate, delicate, sad. Tiny world in pain.</desc>
  <defs>
    <linearGradient id="bgI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15110a"/>
      <stop offset="0.4" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <radialGradient id="gaslightI2" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#080604" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickEdgeI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3828"/>
      <stop offset="0.5" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="silverFI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8a8a0"/>
      <stop offset="0.5" stop-color="#7a8088"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="hairSilLitI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c8a8"/>
      <stop offset="0.5" stop-color="#a89878"/>
      <stop offset="1" stop-color="#5a4838"/>
    </linearGradient>
    <linearGradient id="faceLitS_I2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#9a5828"/>
      <stop offset="1" stop-color="#d8a878"/>
    </linearGradient>
    <linearGradient id="beamMainI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="0.4" stop-color="#5a3a20"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <filter id="bloomI2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowI2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="megaGlowI2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softI2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgI2)"/>

