  <title>Issue 9 Page 6 Panel 5 — Sable backlit by truth, "Plural. None reported back."</title>
  <desc>Medium shot eye level. Sable faces camera with display behind her — corrupted geometric script silhouetting her. Faces four squad arranged on beams: Jink leaning forward angry, Thresh rigid, Luma connecting, Wren arms-crossed. Halo from display is ironic not holy. Her composure cracked but held.</desc>
