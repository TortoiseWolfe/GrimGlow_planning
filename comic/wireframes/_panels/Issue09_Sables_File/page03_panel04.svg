  <title>Issue 9 Page 3 Panel 4 — Symmetrical two-shot, the file between them — "How long have you known?"</title>
  <desc>Medium two-shot straight on, symmetrical. Both women face camera from either side of holographic display floating chest-height. Wren left, jaw tightening as she reads. Sable right, watching for the verdict. The file is the brightest object — the truth literally illuminating them.</desc>
