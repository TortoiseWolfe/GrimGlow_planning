<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 21 Panel 3 — Sable's shattered recognition, "Thank you, Theodore"</title>
  <desc>Close-up Sable. Eyes open looking toward wall gap. Something moved — not command, not mask. Recognition. Tears she will not shed visible as brightness in dark eyes. Mask stays off. She heard the mission described by a boy quoting his grandmother. Warm amber catches brightness in eyes and silver-white hair.</desc>
  <defs>
    <linearGradient id="bgK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="warmFromGapK3" cx="0.95" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f4d090" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitS_K3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#c87838"/>
    </linearGradient>
    <linearGradient id="hairSilWarmK3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="0.5" stop-color="#c0b8a8"/>
      <stop offset="1" stop-color="#f4d8a8"/>
    </linearGradient>
    <linearGradient id="silverSuitWarmK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8868"/>
      <stop offset="0.5" stop-color="#5a4a3a"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="eyeBrightTearsK3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.4" stop-color="#f4c878" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f4c878" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomK3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowK3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softK3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgK3)"/>
  <rect width="366" height="260" fill="url(#warmFromGapK3)"/>

  <g>
