<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 20 Panel 4 — All four listening, "the answer is something you become"</title>
  <desc>Medium wide inside camp, four figures oriented toward wall gap. Each in own position, all listening. Sable on main beam silver open. Jink lower timber emerald tender-wounded. Wren station copper thoughtful. Thresh perimeter crimson unguarded. Warm amber dominant — four colors in same golden light. Fairy tale told to fairies.</desc>
