  <g transform="translate(60,18)">
    <path d="M 0 0 Q -8 4 -8 12 Q -8 28 0 32 L 380 32 Q 390 32 392 26 Q 392 8 384 4 Z" fill="#f4f4f4" stroke="#7a4828" stroke-width="1.6"/>
    <path d="M 4 4 L 0 -8 L 12 4 Z" fill="#f4f4f4" stroke="#7a4828" stroke-width="1.4"/>
    <text x="196" y="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5a3018">THEODORE</text>
    <text x="196" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#2a2a2a" font-style="italic">"And the creatures said: the answer is not something you find."</text>
    <text x="196" y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#2a2a2a" font-style="italic">"It is something you become."</text>
  </g>
</svg>
