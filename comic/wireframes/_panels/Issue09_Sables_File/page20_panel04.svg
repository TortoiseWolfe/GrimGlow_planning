    <ellipse cx="676" cy="116" rx="7" ry="3" fill="#9a6818" opacity="0.7"/>
    <circle cx="676" cy="116" r="2.6" fill="#5a3818"/>
    <circle cx="677" cy="115" r="1.6" fill="#ffffff"/>

    <path d="M 632 156 Q 656 162 680 156" stroke="#5a2818" stroke-width="1.5" fill="none"/>
    <path d="M 632 156 Q 656 164 680 156" fill="#9a4828" opacity="0.55"/>
    <path d="M 638 158 Q 656 164 674 158" stroke="#5a2818" stroke-width="0.4" fill="none" opacity="0.6"/>
  </g>

