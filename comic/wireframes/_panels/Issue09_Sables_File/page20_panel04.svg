  </g>
  <g>
    <ellipse cx="520" cy="216" rx="3" ry="8" fill="url(#candleCoreJ4)"/>
  </g>

  <g>
    <ellipse cx="220" cy="180" rx="3.6" ry="4" fill="#3a261a"/>
    <ellipse cx="220" cy="178" rx="2.4" ry="2.4" fill="#7a4830"/>
    <g>
      <ellipse cx="216" cy="172" rx="4" ry="3" fill="#f4d040"/>
