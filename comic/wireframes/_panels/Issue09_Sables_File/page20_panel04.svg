      <stop offset="0" stop-color="#251f15"/>
      <stop offset="0.4" stop-color="#322816"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="goldenWarmJ4" cx="0.92" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f4d090" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1a1410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverWarmJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0a878"/>
      <stop offset="0.5" stop-color="#7a6038"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="copperWarmJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a868"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="emeraldRefractJ4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#7aa848"/>
      <stop offset="1" stop-color="#a8a838"/>
    </linearGradient>
    <linearGradient id="crimsonWarmJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="brickJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5238"/>
      <stop offset="0.5" stop-color="#5a3828"/>
      <stop offset="1" stop-color="#2a1810"/>
