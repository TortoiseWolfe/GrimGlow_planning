  <g opacity="0.6" stroke="#88a0c8" stroke-width="0.3" fill="none">
    <line x1="200" y1="270" x2="200" y2="370"/>
    <line x1="516" y1="270" x2="516" y2="370"/>
  </g>

  <g opacity="0.55" filter="url(#bloomL3)">
    <ellipse cx="358" cy="396" rx="200" ry="8" fill="#5878a8"/>
  </g>

  <g transform="translate(150,18)">
    <rect x="-8" y="0" width="476" height="28" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.7"/>
    <text x="230" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-style="italic" font-size="13" font-weight="700" fill="#5a3018">"The quest was the staying."</text>
