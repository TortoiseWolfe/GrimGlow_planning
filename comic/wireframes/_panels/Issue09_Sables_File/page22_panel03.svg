<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 400" width="742" height="400">
  <title>Issue 9 Page 22 Panel 3 FINAL — Sable lost in the uplight, "The quest was the staying"</title>
  <desc>Extreme close-up slight low angle Sable's face in blue-white holographic uplight. Corrupted geometric fairy script scrolls across face from below — structured light mapping alien text onto skin. Eyes open but not reading — looking through file at something data cannot show. Lost. Simply, devastatingly lost. Light trapped in geometry on a face that has stopped pretending.</desc>
  <defs>
    <linearGradient id="bgL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020100"/>
      <stop offset="0.5" stop-color="#040608"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="megaUplightL3" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#5878a8" stop-opacity="0.65"/>
      <stop offset="0.8" stop-color="#1a2030" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitFinalL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.3" stop-color="#3a261a"/>
      <stop offset="0.6" stop-color="#5a3622"/>
      <stop offset="0.9" stop-color="#7a4a30"/>
      <stop offset="1" stop-color="#9a5e3e"/>
    </linearGradient>
    <linearGradient id="hairSilFinalL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e44"/>
      <stop offset="0.5" stop-color="#5a626a"/>
      <stop offset="1" stop-color="#7a8088"/>
    </linearGradient>
    <radialGradient id="eyeFinalL3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c0d8f0" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#88a8d0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#88a8d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomL3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="strongGlowL3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="megaGlowL3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softL3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <rect width="742" height="400" fill="url(#bgL3)"/>
  <rect width="742" height="400" fill="url(#megaUplightL3)"/>

  <g opacity="0.85" filter="url(#megaGlowL3)">
