<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 13 Panel 3 — Sable looks toward upper beams, the command that cannot be given</title>
  <desc>Medium close-up Sable, turned away from repair station, looking upward toward shadowed upper beams. Half-step toward Jink's direction arrested, correction back to stillness. Knows pursuit would make it worse. Morning grey, upper beams in shadow. The commander who cannot command this.</desc>
  <defs>
    <linearGradient id="bgD3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2c"/>
      <stop offset="0.4" stop-color="#252a36"/>
      <stop offset="0.7" stop-color="#1f2330"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <radialGradient id="dawnEvenD3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a0a8b8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperShadowD3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080a14"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="faceLitS_D3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3622"/>
      <stop offset="0.4" stop-color="#7a4a30"/>
      <stop offset="0.8" stop-color="#9a5e3e"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairSilD3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b0b8"/>
      <stop offset="0.5" stop-color="#7a8088"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="silverSuitD3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6a"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="eyeS_D3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#a0a8b8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a0a8b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomD3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softD3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgD3)"/>
  <rect width="246" height="240" fill="url(#dawnEvenD3)"/>

  <g opacity="0.5">
    <rect x="0" y="0" width="246" height="60" fill="url(#upperShadowD3)"/>
  </g>

  <g opacity="0.6">
    <rect x="40" y="40" width="100" height="6" fill="#1a1008"/>
    <rect x="120" y="20" width="100" height="6" fill="#1a1008"/>
    <line x1="200" y1="46" x2="200" y2="80" stroke="#1a1008" stroke-width="2"/>
  </g>

  <g>
    <ellipse cx="123" cy="220" rx="120" ry="40" fill="#15191f"/>
  </g>

  <g>
    <path d="M 78 92 Q 70 110 76 134 Q 84 162 100 178 Q 122 188 146 188 Q 170 184 184 168 Q 192 144 190 110 Q 184 90 168 76 Q 144 70 122 72 Q 94 80 78 92 Z" fill="url(#faceLitS_D3)" opacity="0.95"/>
    <path d="M 80 100 Q 76 124 84 148 Q 94 168 112 184 Q 100 180 92 168 Q 80 152 76 130 Q 78 108 80 100 Z" fill="#3a261a" opacity="0.45"/>
  </g>

  <g>
    <path d="M 70 80 Q 86 64 124 60 Q 162 60 184 70 Q 196 82 196 96 L 192 102 Q 182 84 162 76 Q 138 70 116 76 Q 92 84 86 96 Z" fill="url(#hairSilD3)" opacity="0.95"/>
    <g stroke="#cccccc" stroke-width="0.4" opacity="0.65">
      <line x1="86" y1="68" x2="92" y2="80"/>
      <line x1="106" y1="64" x2="108" y2="76"/>
      <line x1="130" y1="62" x2="130" y2="76"/>
      <line x1="154" y1="64" x2="152" y2="76"/>
      <line x1="178" y1="70" x2="174" y2="84"/>
    </g>
  </g>

  <g>
    <ellipse cx="116" cy="116" rx="9" ry="3" fill="#0a0604"/>
    <ellipse cx="160" cy="114" rx="10" ry="3.5" fill="#0a0604"/>
    <circle cx="116" cy="115" r="2.6" fill="#080404"/>
    <circle cx="160" cy="113" r="2.8" fill="#080404"/>
    <circle cx="118" cy="113" r="1.2" fill="url(#eyeS_D3)"/>
    <circle cx="162" cy="111" r="1.4" fill="url(#eyeS_D3)"/>
  </g>

  <g stroke="#0a0604" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 96 106 Q 116 102 134 106"/>
    <path d="M 144 104 Q 160 100 180 106"/>
  </g>

  <path d="M 138 122 Q 134 142 138 158" stroke="#0a0604" stroke-width="1.1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 116 168 Q 138 174 160 168" stroke="#0a0604" stroke-width="1.4" fill="none"/>
  </g>

  <g>
    <path d="M 30 196 L 218 192 L 222 240 L 22 240 Z" fill="url(#silverSuitD3)"/>
    <path d="M 60 192 L 110 196 L 140 196 L 196 192 L 196 220 L 60 220 Z" fill="#2a2a2a"/>
  </g>

  <g opacity="0.92">
    <ellipse cx="76" cy="206" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="180" cy="206" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="120" cy="200" rx="3.5" ry="1.4" fill="#0a0604"/>
    <path d="M 50 210 L 80 214 L 76 220 L 46 216 Z" fill="#080404" opacity="0.75"/>
    <path d="M 168 212 L 200 214 L 196 220 L 164 218 Z" fill="#080404" opacity="0.75"/>
  </g>

  <g opacity="0.55" filter="url(#bloomD3)">
    <ellipse cx="123" cy="208" rx="40" ry="6" fill="#7a8898"/>
  </g>

  <g opacity="0.4">
    <circle cx="40" cy="40" r="0.5" fill="#a0a8b8"/>
    <circle cx="220" cy="50" r="0.5" fill="#a0a8b8"/>
  </g>
</svg>
