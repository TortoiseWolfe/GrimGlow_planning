      <stop offset="0.4" stop-color="#262438"/>
      <stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <radialGradient id="dawnLuma_C3" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#9098b0" stop-opacity="0.55"/>
