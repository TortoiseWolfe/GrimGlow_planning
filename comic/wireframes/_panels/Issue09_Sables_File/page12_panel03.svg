      <stop offset="0.5" stop-color="#4a2a78"/>
      <stop offset="1" stop-color="#1a0e2e"/>
    </linearGradient>
    <linearGradient id="beamCrossC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="deadCoreC3" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1a1418"/>
      <stop offset="0.5" stop-color="#0a0810"/>
