<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 12 Panel 3 — Luma rises with purpose, "I want to go back to the church cache"</title>
  <desc>Medium shot Luma standing on cross-timber, pocketing dead data core. Determined — scientific curiosity sharpened into purpose. Looks toward Sable, question that's also a statement. Morning grey mixed with persistent blue-violet from lenses. Investigator with a lead.</desc>
