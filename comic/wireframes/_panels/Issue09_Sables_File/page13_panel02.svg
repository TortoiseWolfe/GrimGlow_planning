    <circle cx="80" cy="80" r="2" fill="#f4d090"/>
    <circle cx="160" cy="100" r="8" fill="none" stroke="#f4d090" stroke-width="0.8"/>
    <circle cx="160" cy="100" r="3" fill="#f4d090" opacity="0.7"/>
    <rect x="80" y="120" width="30" height="14" fill="none" stroke="#f4d090" stroke-width="0.7"/>
    <line x1="80" y1="127" x2="110" y2="127" stroke="#f4d090" stroke-width="0.4"/>
    <rect x="130" y="140" width="20" height="20" fill="none" stroke="#f4d090" stroke-width="0.7"/>
    <line x1="130" y1="140" x2="150" y2="160" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="150" y1="140" x2="130" y2="160" stroke="#f4d090" stroke-width="0.5"/>
    <polygon points="50,150 70,150 60,164" fill="none" stroke="#f4d090" stroke-width="0.6"/>

    <line x1="80" y1="80" x2="160" y2="100" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="160" y1="100" x2="140" y2="150" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="80" y1="80" x2="95" y2="120" stroke="#f4d090" stroke-width="0.5"/>
  </g>

  <g font-family="Courier New, monospace" fill="#f4d090" opacity="0.9">
    <text x="78" y="78" font-size="3.5">DRIVE</text>
    <text x="146" y="98" font-size="3.5">CRYSTAL</text>
    <text x="80" y="132" font-size="3.5">COMP-A</text>
    <text x="135" y="155" font-size="3.5">COMP-B</text>
    <text x="50" y="159" font-size="3.5">FLUX</text>
  </g>

  <g>
    <path d="M 0 200 L 90 180 Q 100 160 110 150 Q 120 145 130 150 Q 138 160 140 180 L 246 200 L 246 240 L 0 240 Z" fill="url(#copperGauntletD2)"/>
    <path d="M 30 196 L 80 180 Q 90 160 110 156 Q 130 156 138 180 L 220 200" fill="none" stroke="#7a3e18" stroke-width="1" opacity="0.6"/>
  </g>

  <g>
    <path d="M 90 144 Q 96 130 108 128 Q 122 130 130 148 L 142 162 L 130 168 L 100 168 L 88 162 Z" fill="url(#copperGauntLitD2)"/>
    <path d="M 90 144 Q 96 132 108 132" stroke="#5a2e10" stroke-width="0.8" fill="none"/>
    <path d="M 130 148 Q 124 140 116 138" stroke="#5a2e10" stroke-width="0.8" fill="none"/>
  </g>

  <g>
    <path d="M 96 130 L 100 110 L 108 100 L 116 96 L 122 100 L 124 116 L 122 132" fill="url(#copperGauntLitD2)" stroke="#5a2e10" stroke-width="0.6"/>
    <line x1="100" y1="116" x2="118" y2="118" stroke="#5a2e10" stroke-width="0.4"/>
    <line x1="102" y1="124" x2="118" y2="126" stroke="#5a2e10" stroke-width="0.4"/>

    <path d="M 132 144 L 138 124 L 146 116 L 154 116 L 158 122 L 154 138 L 148 152" fill="url(#copperGauntLitD2)" stroke="#5a2e10" stroke-width="0.6"/>
    <line x1="140" y1="128" x2="156" y2="128" stroke="#5a2e10" stroke-width="0.4"/>
  </g>

  <g opacity="0.95" filter="url(#strongGoldD2)">
    <ellipse cx="116" cy="100" rx="6" ry="4" fill="#f4b860"/>
    <ellipse cx="156" cy="118" rx="5" ry="3" fill="#f4b860"/>
  </g>
  <g opacity="0.85">
    <circle cx="116" cy="100" r="1.5" fill="#f4d090"/>
    <circle cx="156" cy="118" r="1.4" fill="#f4d090"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="100" cy="180" rx="5" ry="2" fill="#0a0604"/>
    <ellipse cx="146" cy="178" rx="5" ry="2" fill="#0a0604"/>
    <ellipse cx="60" cy="200" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="186" cy="200" rx="6" ry="2" fill="#0a0604"/>
  </g>

  <g opacity="0.4">
    <circle cx="40" cy="40" r="0.5" fill="#a85820"/>
    <circle cx="200" cy="40" r="0.5" fill="#a85820"/>
  </g>
</svg>
