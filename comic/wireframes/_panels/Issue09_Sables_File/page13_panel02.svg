<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 13 Panel 2 — Wren's hands manipulating copper-gold geometric schematic</title>
  <desc>Close-up slight high angle of Wren's hands inside holographic schematic. Oil-stained fingers in copper suit manipulating floating copper-gold geometric shapes, rearranging drive component diagrams. Warm structured functional light. Hands that fix things.</desc>
  <defs>
    <linearGradient id="bgD2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1812"/>
      <stop offset="0.4" stop-color="#2a201a"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="goldFieldD2" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copperGauntletD2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="copperGauntLitD2" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#7a3e18"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#d88838"/>
    </linearGradient>
    <filter id="bloomD2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="megaGoldD2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="strongGoldD2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softD2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgD2)"/>
  <rect width="246" height="240" fill="url(#goldFieldD2)"/>

  <g opacity="0.7" filter="url(#megaGoldD2)">
    <ellipse cx="123" cy="120" rx="120" ry="80" fill="#d88838"/>
  </g>
  <g opacity="0.85" filter="url(#strongGoldD2)">
    <ellipse cx="123" cy="120" rx="80" ry="50" fill="#f4b860"/>
  </g>

  <g opacity="0.95">
    <line x1="40" y1="50" x2="206" y2="50" stroke="#f4d090" stroke-width="0.6"/>
    <line x1="40" y1="80" x2="206" y2="80" stroke="#f4d090" stroke-width="0.6"/>
    <line x1="40" y1="110" x2="206" y2="110" stroke="#f4d090" stroke-width="0.7"/>
    <line x1="40" y1="140" x2="206" y2="140" stroke="#f4d090" stroke-width="0.6"/>
    <line x1="40" y1="170" x2="206" y2="170" stroke="#f4d090" stroke-width="0.6"/>

    <line x1="60" y1="40" x2="60" y2="180" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="100" y1="40" x2="100" y2="180" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="146" y1="40" x2="146" y2="180" stroke="#f4d090" stroke-width="0.5"/>
    <line x1="186" y1="40" x2="186" y2="180" stroke="#f4d090" stroke-width="0.5"/>
  </g>

  <g opacity="0.95">
