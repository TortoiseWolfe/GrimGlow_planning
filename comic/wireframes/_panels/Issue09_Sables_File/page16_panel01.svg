      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverFG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#4a4e54"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="copperFG1" x1="0" y1="0" x2="0" y2="1">
