      <stop offset="0" stop-color="#1a1f2c"/>
      <stop offset="0.4" stop-color="#252a36"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <radialGradient id="amberDawnG1" cx="0.95" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#d8b888" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a89878" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperGoldZoneG1" cx="0.7" cy="0.65" r="0.18">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldFaintG1" cx="0.4" cy="0.18" r="0.13">
