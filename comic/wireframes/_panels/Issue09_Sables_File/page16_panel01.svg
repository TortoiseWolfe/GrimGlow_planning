      <stop offset="0.5" stop-color="#2a0808"/>
      <stop offset="1" stop-color="#0a0202"/>
    </linearGradient>
    <linearGradient id="timberSideG1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
