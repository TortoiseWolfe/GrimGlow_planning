<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 16 Panel 1 — "Hours. No one spoke." — four in a space meant for five</title>
  <desc>Wide elevated angle full camp. Wren station copper-gold, Jink upper beam faint emerald, Thresh perimeter dim crimson, Sable main beam grey unadorned. Luma's spot conspicuously empty equipment gone. Morning warmer amber-grey but warmth makes hollowness worse.</desc>
