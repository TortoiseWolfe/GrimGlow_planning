<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 300" width="494" height="300">
  <title>Issue 9 — Page 1 — Panel 4: Wren reaches Sable — face off on the beam — "We need to talk about the file"</title>
  <desc>50mm medium two-shot eye level slight profile framing. Two tiny humanoid women face each other on narrow wooden beam in wall cavity. Left: Wren — degraded copper suit — stands squarely with balanced weight, arms at sides, direct unflinching. Right: Sable — soot-darkened silver suit — turns to face her, mask of composure still in place but eyes recognizing what this confrontation is. Six feet of beam between them at fairy scale. Behind Sable, thin crack in brickwork lets in grey pre-dawn light framing her silhouette. Behind Wren, dim blue-white holographic camp glow. Two light sources meet between figures — cool grey and cooler blue-white. No warm light sources.</desc>

  <defs>
    <linearGradient id="i9p1p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i9p1p4timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="i9p1p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <radialGradient id="i9p1p4perimeterGlow" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a3848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i9p1p4greyDawn" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a8b8c8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a2438" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i9p1p4wrenSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i9p1p4sableSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7a80"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="i9p1p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i9p1p4skinDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <filter id="i9p1p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i9p1p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i9p1p4megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="494" height="300" fill="url(#i9p1p4bg)"/>

  <!-- Background brick (Sable's side, right) -->
  <rect x="380" y="0" width="114" height="300" fill="url(#i9p1p4brick)"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.55">
    <line x1="380" y1="60" x2="494" y2="60"/>
    <line x1="380" y1="120" x2="494" y2="120"/>
    <line x1="380" y1="180" x2="494" y2="180"/>
    <line x1="380" y1="240" x2="494" y2="240"/>
  </g>
  <!-- Crack in brickwork visible behind Sable -->
  <path d="M460,40 L460,260 L466,255 L462,180 L468,170 L462,100 L466,80 Z" fill="#0a0408"/>
  <ellipse cx="500" cy="130" rx="80" ry="120" fill="url(#i9p1p4greyDawn)" filter="url(#i9p1p4megaglow)"/>

  <!-- Camp interior side (left) - dim perimeter glow -->
  <ellipse cx="0" cy="180" rx="200" ry="160" fill="url(#i9p1p4perimeterGlow)" filter="url(#i9p1p4megaglow)"/>

  <!-- Vertical timber posts -->
  <rect x="80" y="0" width="14" height="300" fill="url(#i9p1p4timber)"/>

  <!-- Cobwebs -->
  <g stroke="#5a5050" stroke-width="0.4" fill="none" opacity="0.4">
    <line x1="0" y1="40" x2="80" y2="0"/>
    <line x1="0" y1="80" x2="80" y2="40"/>
  </g>

  <!-- Beam they stand on -->
  <rect x="0" y="240" width="494" height="14" fill="url(#i9p1p4timber)"/>
  <rect x="0" y="270" width="494" height="30" fill="#0a0606"/>
  <line x1="0" y1="240" x2="494" y2="240" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>

  <!-- Dust motes -->
  <g fill="#a8c8d8" opacity="0.55" filter="url(#i9p1p4bloom)">
    <circle cx="200" cy="120" r="0.55"/>
    <circle cx="280" cy="160" r="0.55"/>
    <circle cx="380" cy="100" r="0.55"/>
  </g>

  <!-- Faint perimeter pylons -->
  <g opacity="0.55" filter="url(#i9p1p4bloom)">
    <line x1="40" y1="240" x2="40" y2="225" stroke="#a8c8d8" stroke-width="1"/>
    <circle cx="40" cy="225" r="1.4" fill="#a8c8d8"/>
  </g>

  <!-- ===== WREN — left side, squared up, balanced weight ===== -->
  <g transform="translate(180 230)">
    <!-- Body — squared, weight balanced -->
    <path d="M-22,40 L-26,3 L-30,-30 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-30 L26,3 L22,40 Z" fill="url(#i9p1p4wrenSuit)"/>
    <!-- Heavy oil stains -->
    <ellipse cx="-30" cy="-3" rx="6" ry="4" fill="#1a0606" opacity="0.95"/>
    <ellipse cx="30" cy="-3" rx="6" ry="4" fill="#1a0606" opacity="0.95"/>
    <ellipse cx="-15" cy="40" rx="11" ry="3" fill="#3a1808" opacity="0.85"/>
    <ellipse cx="15" cy="40" rx="11" ry="3" fill="#3a1808" opacity="0.85"/>
    <!-- Scorch on shoulder -->
    <ellipse cx="-22" cy="-50" rx="14" ry="6" fill="#040408" opacity="0.85"/>

    <!-- Suit accent dim -->
    <line x1="0" y1="-50" x2="0" y2="30" stroke="#ffa848" stroke-width="0.55" opacity="0.7" filter="url(#i9p1p4bloom)"/>
    <circle cx="-22" cy="-30" r="1.4" fill="#ffa848" filter="url(#i9p1p4bloom)" opacity="0.7"/>
    <circle cx="22" cy="-30" r="1.4" fill="#ffa848" filter="url(#i9p1p4bloom)" opacity="0.7"/>

    <!-- Arms at sides — loose but ready -->
    <path d="M-30,-30 L-36,3 L-26,11 L-22,-15 Z" fill="url(#i9p1p4wrenSuit)"/>
    <path d="M30,-30 L36,3 L26,11 L22,-15 Z" fill="url(#i9p1p4wrenSuit)"/>
    <ellipse cx="-32" cy="3" rx="3" ry="2" fill="url(#i9p1p4skin)"/>
    <ellipse cx="32" cy="3" rx="3" ry="2" fill="url(#i9p1p4skin)"/>

    <!-- Legs planted, balanced -->
    <path d="M-9,40 L-14,80 L-3,80 L0,40 Z" fill="url(#i9p1p4wrenSuit)"/>
    <path d="M3,40 L7,80 L14,80 L9,40 Z" fill="url(#i9p1p4wrenSuit)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-86" rx="11" ry="14" fill="url(#i9p1p4skin)"/>
    <ellipse cx="0" cy="-104" rx="14" ry="6" fill="#1a1008"/>
    <circle cx="6" cy="-110" r="5" fill="#1a1008"/>
    <circle cx="-6" cy="-105" r="4" fill="#1a1008"/>

    <!-- Eyes — direct, unflinching, looking RIGHT (at Sable) -->
    <ellipse cx="-3" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="-2" cy="-86" r="0.7" fill="#3a1808"/>
    <ellipse cx="3" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="4" cy="-86" r="0.7" fill="#3a1808"/>
    <!-- Brows set hard -->
    <line x1="-7" y1="-92" x2="-1" y2="-92" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="1" y1="-92" x2="7" y2="-92" stroke="#3a1808" stroke-width="0.85"/>
    <!-- Mouth — speaking -->
    <line x1="-3" y1="-78" x2="3" y2="-78" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== SABLE — right side, just turning to face Wren ===== -->
  <g transform="translate(380 230)">
    <!-- Body -->
    <path d="M-22,40 L-26,3 L-30,-30 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-30 L26,3 L22,40 Z" fill="url(#i9p1p4sableSuit)"/>
    <!-- Heavy soot -->
    <ellipse cx="-7" cy="-9" rx="9" ry="4" fill="#1a1818" opacity="0.85"/>
    <ellipse cx="9" cy="11" rx="6" ry="3" fill="#1a1818" opacity="0.7"/>
    <line x1="0" y1="-50" x2="0" y2="30" stroke="#fff" stroke-width="0.4" opacity="0.55" filter="url(#i9p1p4bloom)"/>

    <!-- Arms at sides -->
    <path d="M-30,-30 L-36,3 L-26,11 L-22,-15 Z" fill="url(#i9p1p4sableSuit)"/>
    <path d="M30,-30 L36,3 L26,11 L22,-15 Z" fill="url(#i9p1p4sableSuit)"/>

    <!-- Legs planted -->
    <path d="M-9,40 L-14,80 L-3,80 L0,40 Z" fill="url(#i9p1p4sableSuit)"/>
    <path d="M3,40 L7,80 L14,80 L9,40 Z" fill="url(#i9p1p4sableSuit)"/>

    <!-- Head — TURNING to face Wren (left), profile mostly visible -->
    <ellipse cx="0" cy="-86" rx="11" ry="14" fill="url(#i9p1p4skinDark)"/>
    <!-- Silver-white cropped hair -->
    <path d="M-9,-100 Q0,-104 9,-100 L9,-86 Q0,-90 -9,-86 Z" fill="#e8ecf0" opacity="0.95"/>
    <line x1="-7" y1="-100" x2="7" y2="-100" stroke="#fff" stroke-width="0.4" filter="url(#i9p1p4bloom)" opacity="0.7"/>
    <!-- Backlight from grey dawn -->
    <ellipse cx="0" cy="-104" rx="9" ry="2" fill="#a8b8c8" filter="url(#i9p1p4bloom)" opacity="0.85"/>

    <!-- Eyes — looking LEFT (at Wren), recognizing the confrontation -->
    <ellipse cx="-3" cy="-86" rx="2" ry="1" fill="#fff"/>
    <circle cx="-3" cy="-86" r="0.55" fill="#0a0a14"/>
    <ellipse cx="3" cy="-86" rx="2" ry="1" fill="#fff"/>
    <circle cx="3" cy="-86" r="0.55" fill="#0a0a14"/>
    <!-- Brows flat -->
    <line x1="-7" y1="-92" x2="-1" y2="-92" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="1" y1="-92" x2="7" y2="-92" stroke="#1a0808" stroke-width="0.85"/>
    <!-- Mouth flat hard -->
    <line x1="-3" y1="-78" x2="3" y2="-78" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Backlight rim on left side of head (from grey dawn behind her) -->
    <line x1="-9" y1="-86" x2="-9" y2="-100" stroke="#a8b8c8" stroke-width="0.4" filter="url(#i9p1p4bloom)" opacity="0.55"/>
  </g>

  <!-- The space between them (the confrontation) -->

  <!-- ===== DIALOGUE — WREN ===== -->
  <g>
    <rect x="14" y="14" width="338" height="36" rx="2" fill="white" stroke="#d88838" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#d88838" font-weight="700">WREN</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">We need to talk about the file.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260"/>
  </g>
</svg>
