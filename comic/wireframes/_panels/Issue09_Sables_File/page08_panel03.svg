      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom83" x="-20%" y="-20%" width="140%" height="140%">
