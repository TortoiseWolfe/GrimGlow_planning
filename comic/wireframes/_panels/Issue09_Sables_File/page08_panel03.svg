<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 8 Panel 3 — Sable absorbs, "I was protecting—" / "Don't."</title>
  <desc>Close-up Sable receiving the accusation. Doesn't flinch. Composure maintained by visible force of will. No defense. Geometric holographic light maps fracture lines across face. Controlled anguish — holding still because movement would be collapse.</desc>
