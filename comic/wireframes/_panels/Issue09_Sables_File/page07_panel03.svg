  <title>Issue 9 Page 7 Panel 3 — Luma holds the dead data core, "STAY. They knew."</title>
  <desc>Medium shot Luma on lower cross-timber holding inert dead data core, connecting to display above. Shaken certainty. Pattern visible and frightening. Dead core reflects no light — dark, cracked, centuries dead. Above, living display scrolls. Contrast between living file and dead artifact.</desc>
