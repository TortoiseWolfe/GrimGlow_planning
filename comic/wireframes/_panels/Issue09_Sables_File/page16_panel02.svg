<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 9 Page 16 Panel 2 — Sable circulates without command certainty</title>
  <desc>Medium shot Sable walking the main beam. Passes through different light zones — copper-gold near Wren station, flat grey at center, dim crimson near Thresh perimeter. Walk resembles command rounds but body language tentative. Wren doesn't look up. Sable doesn't approach Jink's upper beam.</desc>
  <defs>
    <linearGradient id="bgG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2c"/>
      <stop offset="0.4" stop-color="#252a36"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <radialGradient id="copperZoneG2" cx="0.85" cy="0.5" r="0.25">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonZoneG2" cx="0.15" cy="0.5" r="0.25">
      <stop offset="0" stop-color="#5a1810" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberDawnG2" cx="0.95" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#d8b888" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#a89878" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverFG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#4a4e54"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="copperFG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="crimsonFG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1810"/>
      <stop offset="0.5" stop-color="#2a0808"/>
      <stop offset="1" stop-color="#0a0202"/>
    </linearGradient>
    <linearGradient id="timberSideG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="beamMainG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <linearGradient id="repairStationG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3220"/>
      <stop offset="0.5" stop-color="#2a2418"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <filter id="bloomG2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowG2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softG2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="742" height="260" fill="url(#bgG2)"/>
