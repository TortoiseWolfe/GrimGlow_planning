    <path d="M 682 0 L 742 0 L 742 260 L 682 260 Z" fill="url(#timberSideG2)"/>
    <path d="M 682 0 L 682 260 L 662 240 L 662 20 Z" fill="#1a1008" opacity="0.85"/>
