    <ellipse cx="130" cy="206" rx="6" ry="2" fill="#080404"/>
    <ellipse cx="650" cy="206" rx="6" ry="2" fill="#080404"/>
  </g>

  <g opacity="0.65" filter="url(#strongGlowG2)">
    <ellipse cx="710" cy="120" rx="22" ry="80" fill="#d8b888"/>
  </g>
  <g opacity="0.92">
    <path d="M 696 60 L 720 60 L 720 200 L 696 200 Z" fill="#a89878" opacity="0.6"/>
  </g>

  <g opacity="0.4">
    <circle cx="120" cy="40" r="0.4" fill="#a89878"/>
    <circle cx="600" cy="50" r="0.4" fill="#a89878"/>
