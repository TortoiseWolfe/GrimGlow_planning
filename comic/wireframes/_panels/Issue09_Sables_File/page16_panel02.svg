    <rect x="106" y="174" width="38" height="22" fill="#1a140a"/>
    <ellipse cx="130" cy="166" rx="3" ry="3.4" fill="#3a261a"/>
    <ellipse cx="130" cy="164" rx="2" ry="2" fill="#5a3622"/>
    <path d="M 124 162 Q 130 158 136 162" stroke="#8a3818" stroke-width="1" fill="none"/>
    <rect x="126" y="168" width="8" height="14" fill="url(#crimsonFG2)"/>
    <rect x="148" y="172" width="14" height="6" fill="#1a1a1a"/>
