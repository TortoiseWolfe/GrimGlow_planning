    <line x1="364" y1="200" x2="362" y2="208" stroke="#1a1c20" stroke-width="1.6"/>
    <line x1="378" y1="200" x2="382" y2="208" stroke="#1a1c20" stroke-width="1.6"/>
  </g>

  <g opacity="0.5">
    <ellipse cx="320" cy="178" rx="3" ry="3.4" fill="#1a1c20"/>
    <ellipse cx="320" cy="176" rx="2" ry="2" fill="#3a3a3a"/>
    <path d="M 310 184 L 330 184 L 332 200 L 308 200 Z" fill="#3a3a3a"/>
  </g>
  <g opacity="0.3">
    <ellipse cx="280" cy="178" rx="3" ry="3.4" fill="#1a1c20"/>
    <path d="M 270 184 L 290 184 L 292 200 L 268 200 Z" fill="#3a3a3a"/>
  </g>

  <g opacity="0.7">
    <line x1="356" y1="208" x2="332" y2="212" stroke="#88a0c8" stroke-width="0.4" stroke-dasharray="2 2"/>
    <line x1="332" y1="212" x2="306" y2="214" stroke="#88a0c8" stroke-width="0.4" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <g opacity="0.6">
