      <stop offset="0" stop-color="#040608"/>
      <stop offset="0.5" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="dimEdge_B3" cx="0.85" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#3a4858" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#1a2030" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#020306" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timberA_B3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="faceLitT_B3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="0.4" stop-color="#1a1414"/>
      <stop offset="0.7" stop-color="#3a2828"/>
      <stop offset="1" stop-color="#5a3838"/>
    </linearGradient>
    <linearGradient id="hairBuzzB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="crimsonArmorB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1810"/>
      <stop offset="0.5" stop-color="#2a0808"/>
      <stop offset="1" stop-color="#0a0202"/>
    </linearGradient>
    <linearGradient id="rifleB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="bloomB3" x="-20%" y="-20%" width="140%" height="140%">
