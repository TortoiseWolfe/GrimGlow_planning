    </filter>
    <filter id="softB3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgB3)"/>
  <rect width="246" height="240" fill="url(#dimEdge_B3)"/>

