<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 11 Panel 3 — Thresh withdrawn into shadow, "Exposed."</title>
  <desc>Medium shot Thresh retreated to far end of beam, back against timber upright. Hand on rifle at hip. Stone, total compression. Single word like depth charge. Dim — only edge-light catches crimson armor's dented pauldron and scratched chest plate. Withdrawal into darkness.</desc>
  <defs>
