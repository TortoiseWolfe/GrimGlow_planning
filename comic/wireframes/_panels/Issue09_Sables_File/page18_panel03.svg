      <stop offset="1" stop-color="#3a2010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeWarmS_I3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomI3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowI3" x="-25%" y="-25%" width="150%" height="150%">
