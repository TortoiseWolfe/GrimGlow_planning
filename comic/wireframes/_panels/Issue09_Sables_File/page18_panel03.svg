<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 18 Panel 3 — Sable in warm gaslight, Theodore's eye through the gap, "Your company is welcome"</title>
  <desc>Inside camp eye level fairy-scale. Sable on main beam facing wall gap. Soot-darkened silver catches warm amber gaslight — warmest she's been lit this issue. Sharp features softened. Through gap: Theodore's enormous eye, warm brown concerned. Scale: Sable 4 inches, Theodore's eye size of her torso.</desc>
