      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="gasFromRightI3" cx="0.95" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitS_I3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#c87838"/>
    </linearGradient>
    <linearGradient id="hairSilWarmI3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="0.5" stop-color="#c0b8a8"/>
      <stop offset="1" stop-color="#f4d8a8"/>
    </linearGradient>
    <linearGradient id="silverSuitWarmI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8868"/>
      <stop offset="0.5" stop-color="#5a4a3a"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="beamWoodI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5230"/>
      <stop offset="0.4" stop-color="#5a3a20"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="brickRightI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3828"/>
      <stop offset="0.5" stop-color="#3a2418"/>
