      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <radialGradient id="holoT62" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.65"/>
