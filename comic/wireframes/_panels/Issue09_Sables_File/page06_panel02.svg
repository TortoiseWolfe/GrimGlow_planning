<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 9 Page 6 Panel 2 — Thresh, silent, processing threat</title>
  <desc>Close-up Thresh. Broad-shouldered, copper-red buzz cut, pale skin, defined cheekbones. Arms crossed with grip on forearms tightened — only sign of reaction. Crimson armor dented at left pauldron, scratch across chest plate. Silent. Fear compressed past silence into threat assessment.</desc>
