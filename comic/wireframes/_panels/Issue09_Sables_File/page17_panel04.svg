<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 17 Panel 4 — Theodore's giant face appears at the wall gap</title>
  <desc>Medium wide eye level from inside looking toward wall gap. Deep golden-amber evening light, gaslight beginning. Shadow blocks light: enormous face appears at crack. Victorian boy 12-13, sandy-brown hair, hazel eyes, freckles — Theodore filling opening. Lit from behind by warm gaslight. Tiny figures look up from isolation.</desc>
