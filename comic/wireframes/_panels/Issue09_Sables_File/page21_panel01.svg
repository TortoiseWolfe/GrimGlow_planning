  <g transform="translate(20,18)">
    <path d="M 0 0 Q -8 4 -8 12 Q -8 28 0 32 L 460 32 Q 470 32 472 26 Q 472 8 464 4 Z" fill="#f4f4f4" stroke="#7a4828" stroke-width="1.6"/>
    <path d="M 240 28 L 250 40 L 250 28 Z" fill="#f4f4f4" stroke="#7a4828" stroke-width="1.4"/>
    <text x="236" y="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5a3018">THEODORE</text>
    <text x="236" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#2a2a2a" font-style="italic">"The riddle has no answer to bring back. The answer is that we are already where we must be."</text>
    <text x="236" y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#2a2a2a" font-weight="700" font-style="italic">"The quest was the staying."</text>
