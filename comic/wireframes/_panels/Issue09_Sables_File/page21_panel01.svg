<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 21 Panel 1 — Theodore delivers "the quest was the staying"</title>
  <desc>Close-up fairy-scale Theodore's face fills frame — enormous candlelit. Hazel eyes bright with story's meaning. Earnest, formal warmth of oral tradition. Hazel eyes reflect tiny points of fairy-tech light from inside camp — blue-white, copper-gold, emerald, crimson tiny stars in enormous eye.</desc>
