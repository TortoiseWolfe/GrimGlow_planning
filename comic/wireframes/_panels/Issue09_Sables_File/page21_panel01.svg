      <stop offset="0" stop-color="#251f15"/>
      <stop offset="0.4" stop-color="#322816"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="theoCandleK1" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#f4d090" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1a1410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="theoFaceK1" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#7a4830"/>
      <stop offset="0.5" stop-color="#c89878"/>
      <stop offset="1" stop-color="#f4c898"/>
    </linearGradient>
    <linearGradient id="theoHairK1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#c88858"/>
      <stop offset="1" stop-color="#f4d090"/>
    </linearGradient>
    <linearGradient id="brickEdgeK1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3828"/>
      <stop offset="0.5" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="theoEyeBrightK1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a8782a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a8782a" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomK1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowK1" x="-25%" y="-25%" width="150%" height="150%">
