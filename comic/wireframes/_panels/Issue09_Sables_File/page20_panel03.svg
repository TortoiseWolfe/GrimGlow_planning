<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 20 Panel 3 — Thresh listening, "armor made warm by candlelight"</title>
  <desc>Close-up Thresh head fully turned toward storyteller, still at perimeter but listening. Unguarded — operational vocabulary has no framework for fairy tales, soldier stepped aside, person visible briefly. Fear quiet. Warm amber catches side of face. Crimson armor glows warm rather than harsh red.</desc>
