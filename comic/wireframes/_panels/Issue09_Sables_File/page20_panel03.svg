      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="warmFromGapJ3" cx="0.05" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f4d090" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitT_J3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6838"/>
      <stop offset="0.5" stop-color="#7a5050"/>
      <stop offset="1" stop-color="#3a2828"/>
    </linearGradient>
    <linearGradient id="hairBuzzWarmJ3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#8a3818"/>
      <stop offset="1" stop-color="#3a1408"/>
    </linearGradient>
    <linearGradient id="crimsonWarmJ3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8584a"/>
      <stop offset="0.5" stop-color="#8a2520"/>
      <stop offset="1" stop-color="#2a0808"/>
    </linearGradient>
    <radialGradient id="eyeUnguardJ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#f4c878" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f4c878" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomJ3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowJ3" x="-25%" y="-25%" width="150%" height="150%">
