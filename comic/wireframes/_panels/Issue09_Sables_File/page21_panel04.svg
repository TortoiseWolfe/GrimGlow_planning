    <path d="M 256 102 L 264 108" stroke="#5a3018" stroke-width="0.4" opacity="0.5"/>

    <g>
      <ellipse cx="252" cy="120" rx="6" ry="3.5" fill="url(#brassRingK4)" stroke="#3a2010" stroke-width="0.4"/>
      <ellipse cx="252" cy="118" rx="4" ry="2" fill="#a87838" opacity="0.8"/>
