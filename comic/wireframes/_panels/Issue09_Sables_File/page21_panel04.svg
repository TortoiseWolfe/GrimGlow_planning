  <g transform="translate(80,228)">
    <path d="M 0 0 Q -8 4 -8 12 Q -8 24 0 28 L 200 28 Q 210 28 212 22 Q 212 8 204 4 Z" fill="#f4f4f4" stroke="#7a4828" stroke-width="1.4"/>
    <path d="M 100 4 L 96 -8 L 108 4 Z" fill="#f4f4f4" stroke="#7a4828" stroke-width="1.2"/>
    <text x="106" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#5a3018">THEODORE</text>
    <text x="106" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">"The best quests are the ones</text>
    <text x="106" y="27" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">where you're already home."</text>
