<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 9 Page 21 Panel 4 — Theodore pulling back, brass gear ring catches candlelight, "the best quests are when you're already home"</title>
  <desc>Close-up slight low angle fairy-scale. Theodore pulling back slightly from wall gap, face receding candlelit. Gentle concern. Oil-stained hand at crack's edge. Brass gear ring on left index finger catches candlelight — warm golden point. Doesn't fully understand silence. Story was enough.</desc>
  <defs>
    <linearGradient id="bgK4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="candleWarmK4" cx="0.4" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#f4d090" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="theoFaceK4" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#a87858"/>
      <stop offset="0.8" stop-color="#d8a878"/>
      <stop offset="1" stop-color="#f4c898"/>
    </linearGradient>
    <linearGradient id="theoHairK4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#a87838"/>
      <stop offset="1" stop-color="#f4d090"/>
    </linearGradient>
    <linearGradient id="brickK4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5238"/>
      <stop offset="0.5" stop-color="#5a3828"/>
      <stop offset="1" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="brassRingK4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d090"/>
      <stop offset="0.5" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <radialGradient id="theoEyeGentle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a8782a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a8782a" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomK4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowK4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowK4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="ringSparkleK4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="softK4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

