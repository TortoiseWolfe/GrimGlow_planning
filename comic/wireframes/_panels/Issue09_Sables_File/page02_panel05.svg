<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 2 Panel 5 — Sable's mask cracks — "I'll show you the file."</title>
  <desc>Medium close-up Sable's face. Mask cracked — not collapsed. Jaw unclenched. Eyes shifted from guarded to rawer, more exposed. She's stopped pretending. Grey pre-dawn full on her face, unforgiving. Soot on collar.</desc>
  <defs>
