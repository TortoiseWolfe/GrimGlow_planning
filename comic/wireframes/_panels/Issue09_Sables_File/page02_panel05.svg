      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="0.4" stop-color="#262c38"/>
      <stop offset="1" stop-color="#1a1f28"/>
    </linearGradient>
    <radialGradient id="rimDawn5" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#a0a8b4" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1a1f28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLit5" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#5a3a22"/>
      <stop offset="0.8" stop-color="#7a4e2e"/>
      <stop offset="1" stop-color="#9a6438"/>
    </linearGradient>
    <linearGradient id="hairLit5" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#5a5e64"/>
      <stop offset="0.5" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#c0c8d0"/>
    </linearGradient>
    <linearGradient id="silverSuit5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6a6a"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="eyeRaw" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#c0d0e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a0b0c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="soft5" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

