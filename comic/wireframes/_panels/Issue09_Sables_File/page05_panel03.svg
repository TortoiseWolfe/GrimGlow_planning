<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 5 Panel 3 — Jink's face, the grin gone, "Intervention. Not recon."</title>
  <desc>Close-up Jink's face in blue-white holographic light. Wild bright golden blonde curly hair catching light. Light brown skin, lean androgynous features. Default grin entirely absent — alert confusion hardening into anger. Geometric fairy script reflections across features. Emerald nodes faint at collar.</desc>
  <defs>
    <linearGradient id="bg53" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="0.5" stop-color="#161a28"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <radialGradient id="holoGlow53" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#080a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitJ53" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairGold53" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d040"/>
      <stop offset="0.4" stop-color="#d8b020"/>
      <stop offset="1" stop-color="#7a5810"/>
    </linearGradient>
    <linearGradient id="emeraldS53" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <radialGradient id="eyeJ53" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom53" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlow53" x="-25%" y="-25%" width="150%" height="150%">
