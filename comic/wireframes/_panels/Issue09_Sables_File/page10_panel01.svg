<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 9 Page 10 Panel 1 — Sable and Jink, the mask off, "I chose wrong"</title>
  <desc>Medium two-shot eye level. Sable and Jink face each other, distance closed, on same beam. Wren stepped back. Sable raw, mask fully off — not commander, not burden-carrier, person who made wrong choice. Jink fury complicated by vulnerability seen. Equal blue-white light on both faces.</desc>
