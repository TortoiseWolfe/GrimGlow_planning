<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 9 Page 15 Panel 1 — Wall gap from human side, "the city beyond did not notice"</title>
  <desc>Wide widescreen establishing from outside, looking at Victorian brick wall — soot-stained weathered mortar crumbling. Thin crack between two bricks. Morning light warm amber-grey. Inside the crack: faintest dim colored fairy-tech light, barely visible. Fairy camp from human perspective — invisible, insignificant.</desc>
