      <stop offset="0.4" stop-color="#5a4a3a"/>
      <stop offset="0.8" stop-color="#3a342a"/>
      <stop offset="1" stop-color="#1a1610"/>
    </linearGradient>
    <radialGradient id="dawnAmberF1" cx="0.5" cy="0.3" r="0.7">
