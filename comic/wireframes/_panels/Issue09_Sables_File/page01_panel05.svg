<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 300" width="248" height="300">
  <title>Issue 9 Page 1 Panel 5 — Sable close-up — "What file."</title>
  <desc>85mm tight close-up of Sable's face. Mask fully engaged. Pre-dawn cool grey light on right side of face, deep shadow on left. Dark brown skin, sharp angular features, very short military-cropped silver-white hair near buzz-cut. Eyes calculating but expression controlled calm. Soot marks on silver collar visible. The face of someone hoping this conversation would not happen.</desc>
  <defs>
    <linearGradient id="predawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f28"/>
      <stop offset="0.4" stop-color="#252a35"/>
      <stop offset="1" stop-color="#2e323d"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="0.78" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7a8898" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#3a4250" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1a1f28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.45" stop-color="#2a1a10"/>
      <stop offset="0.7" stop-color="#54341e"/>
      <stop offset="1" stop-color="#7a4a2c"/>
    </linearGradient>
    <linearGradient id="faceShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0604"/>
      <stop offset="1" stop-color="#1f1208"/>
    </linearGradient>
    <linearGradient id="hairLit" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#3a3e44"/>
      <stop offset="0.5" stop-color="#7a7e84"/>
      <stop offset="1" stop-color="#aab0b6"/>
    </linearGradient>
    <linearGradient id="suitSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.6" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <radialGradient id="eyeGlint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#a0c0d8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a0c0d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
