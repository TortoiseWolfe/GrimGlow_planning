<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 9 Page 9 Panel 4 — Jink's fury complicated by understanding, "you don't even have the answer"</title>
  <desc>Close-up Jink. Fury held in tension with unwilling thought. Jaw still set from anger but eyes shifted from pure accusation to something more complex. Processing betrayal and mission simultaneously. Emerald nodes pulse at collar.</desc>
