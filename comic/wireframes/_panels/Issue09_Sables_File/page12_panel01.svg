  <title>Issue 9 Page 12 Panel 1 — Jink "this isn't finished", morning grey dominant</title>
  <desc>Medium wide widescreen eye level. Jink faces Wren, body taut — anger banked but not extinguished. Eyes flicker toward Sable before returning. Wren firm opposite. Background: Sable near dimming display, Luma on lower beam, Thresh withdrawn far end. Morning grey dominant, holographic fading.</desc>
