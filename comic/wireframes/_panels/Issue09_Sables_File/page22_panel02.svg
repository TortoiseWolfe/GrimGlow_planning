<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 360" width="742" height="360">
  <title>Issue 9 Page 22 Panel 2 — Sable alone, the cycle continues, the file opens</title>
  <desc>Medium shot Sable alone on main beam in dark camp, holding activated data module. Holographic display blooms — corrupted geometric fairy script blue-white from below. Cold uplight clinical lonely. Same file from Issue 1. Same light. She is not the same. Lost — sitting with question she cannot answer, alone in the dark. No other light in frame.</desc>
