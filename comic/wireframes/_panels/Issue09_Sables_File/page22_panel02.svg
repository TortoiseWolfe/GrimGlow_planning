      <stop offset="0.7" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairSilColdL2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a626a"/>
      <stop offset="0.5" stop-color="#7a8088"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="moduleCaseL2" x1="0" y1="0" x2="0" y2="1">
