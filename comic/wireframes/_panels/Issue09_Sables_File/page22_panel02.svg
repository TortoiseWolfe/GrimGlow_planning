    <linearGradient id="silverColdL2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a626a"/>
      <stop offset="0.5" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="faceLitS_L2" x1="0" y1="0" x2="0" y2="1">
