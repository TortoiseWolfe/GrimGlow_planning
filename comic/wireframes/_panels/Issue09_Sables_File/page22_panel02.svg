      <stop offset="0.6" stop-color="#1a1c22"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="beamColdL2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.5" stop-color="#0e0805"/>
