    <line x1="284" y1="63" x2="354" y2="63" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>
    <text x="284" y="78" font-family="monospace" font-size="3" fill="#d88838">[6/7]</text>
    <line x1="306" y1="76" x2="354" y2="76" stroke="#d88838" stroke-width="2" opacity="0.85"/>
    <line x1="306" y1="76" x2="350" y2="76" stroke="#fff088" stroke-width="2" opacity="0.95"/>
    <text x="320" y="92" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#d88838">86%</text>
    <text x="320" y="102" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#d88838" font-style="italic">ANCHOR NEXT</text>
  </g>
  <g opacity="0.62" filter="url(#bloomY1)">
    <rect x="280" y="50" width="80" height="60" fill="#d88838" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="262" rx="120" ry="3" fill="#040202" opacity="0.42"/>
