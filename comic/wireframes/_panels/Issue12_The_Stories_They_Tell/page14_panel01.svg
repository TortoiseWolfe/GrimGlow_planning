    <circle cx="257" cy="116" r="2" fill="#fff8d8"/>

    <text x="88" y="140" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[1]</text>
    <text x="116" y="140" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[2]</text>
    <text x="144" y="140" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[3]</text>
    <text x="172" y="140" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[4]</text>
    <text x="200" y="140" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[5]</text>
    <text x="228" y="140" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff088" font-weight="700">[6]</text>
    <text x="257" y="140" text-anchor="middle" font-family="monospace" font-size="4" fill="#fff088" font-weight="700">[7]</text>
  </g>
  <g opacity="0.62" filter="url(#bloomY1)">
