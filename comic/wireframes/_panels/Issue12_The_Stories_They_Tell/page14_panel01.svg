<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 14 Panel 1 — Sixth node, "Sixth. One more."</title>
  <desc>Close-up. Hands working with increasing confidence — oil-stained fingers rotating and extracting dark crystalline node from alien device with smooth practiced movements. Technique is learned now, rhythm found. Six nodes extracted, visible in row on cabinet floor — dark, inert, harmless. One node remains, faint amber-black pulse the last alien light in frame. Copper-gold holographic guide light steady at edge. Morning light dominant — alien retreating, ordinary returning. The pattern mastered.</desc>
  <defs>
    <linearGradient id="bgY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="morningDomY1" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperEdgeY1" cx="0.85" cy="0.15" r="0.32">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinetFloorY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="hubShellY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="deadNodeY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="liveNodeY1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinFingerY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="extractedCoreY1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff088" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="bloomY1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowY1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowY1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY1)"/>
  <rect width="366" height="280" fill="url(#morningDomY1)"/>
  <rect width="366" height="280" fill="url(#copperEdgeY1)"/>

  <g>
