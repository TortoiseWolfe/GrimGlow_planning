  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="156" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#3a2410" font-weight="700">THEODORE: "Sixth. One more."</text>
    <text x="156" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic" font-weight="700">WREN: "The last node is the anchor."</text>
  </g>
</svg>
