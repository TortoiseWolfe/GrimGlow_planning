      <rect x="120" y="200" width="22" height="22" rx="2" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55" transform="rotate(20 131 211)"/>
      <rect x="160" y="200" width="22" height="22" rx="2" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55" transform="rotate(-12 171 211)"/>
      <rect x="200" y="200" width="22" height="22" rx="2" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55" transform="rotate(5 211 211)"/>
      <rect x="240" y="200" width="22" height="22" rx="2" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55" transform="rotate(-15 251 211)"/>
    </g>
