    <line x1="60" y1="90" x2="300" y2="90" stroke="#5a3098" stroke-width="0.55" opacity="0.62"/>
    <line x1="60" y1="150" x2="300" y2="150" stroke="#5a3098" stroke-width="0.55" opacity="0.62"/>

    <rect x="78" y="105" width="20" height="20" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55"/>
    <rect x="106" y="105" width="20" height="20" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55"/>
    <rect x="134" y="105" width="20" height="20" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55"/>
    <rect x="162" y="105" width="20" height="20" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55"/>
    <rect x="190" y="105" width="20" height="20" fill="url(#deadNodeY1)" stroke="#3a1810" stroke-width="0.55"/>
    <rect x="218" y="105" width="20" height="20" fill="url(#liveNodeY1)" stroke="#3a1810" stroke-width="0.85"/>
