    <line x1="0" y1="186" x2="366" y2="186" stroke="#080404" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.4">
      <line x1="0" y1="220" x2="366" y2="220"/>
      <line x1="60" y1="186" x2="60" y2="280"/>
