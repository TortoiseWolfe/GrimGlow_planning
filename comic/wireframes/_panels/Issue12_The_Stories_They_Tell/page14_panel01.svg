  </g>
  <g opacity="0.42" filter="url(#strongGlowY1)">
    <circle cx="257" cy="116" r="14" fill="#a85020" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="220" cy="116" rx="22" ry="14" fill="url(#extractedCoreY1)" opacity="0.62"/>
    <path d="M 200 110 L 240 110 L 244 116 L 240 122 L 200 122 L 196 116 Z" fill="url(#extractedCoreY1)"/>
    <line x1="200" y1="110" x2="220" y2="116" stroke="#fff088" stroke-width="0.55"/>
    <line x1="240" y1="110" x2="220" y2="116" stroke="#fff088" stroke-width="0.55"/>
    <line x1="200" y1="122" x2="220" y2="116" stroke="#fff088" stroke-width="0.55"/>
    <line x1="240" y1="122" x2="220" y2="116" stroke="#fff088" stroke-width="0.55"/>

    <path d="M 196 116 L 180 130 L 174 152" stroke="url(#skinFingerY1)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="174" cy="156" rx="9" ry="6" fill="url(#skinFingerY1)"/>

    <ellipse cx="184" cy="138" rx="3" ry="2.4" fill="url(#brassRingY1)"/>
    <ellipse cx="184" cy="138" rx="2" ry="1.4" fill="#3a1a08"/>

    <ellipse cx="180" cy="148" rx="2" ry="0.85" fill="#7a4830" opacity="0.55"/>
