    <line x1="88" y1="190" x2="158" y2="190" stroke="url(#crimsonSteadyZ4)" stroke-width="1.4" opacity="0.95"/>
    <line x1="88" y1="200" x2="158" y2="200" stroke="url(#crimsonSteadyZ4)" stroke-width="1" opacity="0.85"/>

