<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 16 Panel 4 — Thresh on a rooftop, "We did it. All of us. Even the boy."</title>
  <desc>Medium shot. Tiny figure in maximum-degradation crimson armor on Victorian rooftop in morning light, weapon holstered, looking up at sky. Fresh drone damage visible on armor — new dents, new scratches — alongside accumulated damage of twelve issues. Holographic edge-lighting steadying, crimson geometric patterns pulsing more evenly than before. Copper-red buzz cut catches morning light. Beyond relief — quiet understanding, not of bravery but of something harder and more honest. Morning light on battered armor. The soldier standing in the light.</desc>
  <defs>
    <linearGradient id="bgZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#fff8d8"/>
      <stop offset="0.7" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="goldenLightZ4" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="cityFarZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitThreshZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="hairBuzzZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="skinThreshZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="weaponHolsterZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="crimsonSteadyZ4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomZ4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowZ4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowZ4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgZ4)"/>
  <rect width="247" height="280" fill="url(#goldenLightZ4)"/>

