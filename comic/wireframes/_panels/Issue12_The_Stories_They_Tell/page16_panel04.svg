    <path d="M 101 86 Q 123 64 145 86 Q 145 96 145 100 L 101 100 Q 101 96 101 86 Z" fill="url(#hairBuzzZ4)"/>
    <g opacity="0.7" stroke="#5a2810" stroke-width="0.4">
