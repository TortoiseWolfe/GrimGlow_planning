    <rect x="100" y="156" width="22" height="6" rx="1" fill="url(#weaponHolsterZ4)"/>
    <rect x="98" y="156" width="3" height="14" fill="url(#weaponHolsterZ4)"/>

    <path d="M 88 200 Q 78 212 70 220" stroke="url(#suitThreshZ4)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 158 200 Q 168 212 176 220" stroke="url(#suitThreshZ4)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <ellipse cx="68" cy="222" rx="6" ry="3" fill="#5a3018"/>
    <ellipse cx="178" cy="222" rx="6" ry="3" fill="#5a3018"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowZ4)">
    <ellipse cx="123" cy="170" rx="40" ry="50" fill="#d83838" opacity="0.42"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowZ4)">
    <ellipse cx="123" cy="170" rx="60" ry="70" fill="#8a2520" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomZ4)">
    <ellipse cx="123" cy="100" rx="40" ry="22" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g opacity="0.42">
    <line x1="115" y1="74" x2="115" y2="50" stroke="#a8c0e0" stroke-width="0.4" stroke-dasharray="2,2"/>
    <line x1="131" y1="76" x2="131" y2="52" stroke="#a8c0e0" stroke-width="0.4" stroke-dasharray="2,2"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="262" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-weight="700">THRESH (ragged): "Soldier confirms."</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-style="italic" font-weight="700">"We did it. All of us. Even the boy."</text>
