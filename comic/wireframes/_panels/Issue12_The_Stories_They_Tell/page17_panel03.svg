<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 17 Panel 3 — Luma traces cache to newspapers, "The fairy tales are the record."</title>
  <desc>Medium close-up. Same figure traces second thread in holographic constellation — from miniature church cache model to floating newspaper headline fragments: BROWNIES SEEN, MYSTERIOUS LIGHTS, DANCING FIGURES ON ROOFTOPS. At edge of constellation, holographic pamphlet glows — THE STORIES THEY TELL. Expression shifts — scientific rigor cracking as weight of thesis reaches her own conviction. Blue-violet light brightens on newspaper nodes. The stories that persisted.</desc>
  <defs>
    <linearGradient id="bgBB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.5" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetSpaceBB3" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitLumaBB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.4" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="hairLumaBB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinLumaBB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="paperBB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d8c8a8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="cacheNodeBB3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5a38a8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brightThreadBB3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomBB3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowBB3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowBB3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgBB3)"/>
  <rect width="366" height="240" fill="url(#violetSpaceBB3)"/>

  <g>
    <ellipse cx="60" cy="80" rx="32" ry="22" fill="url(#cacheNodeBB3)"/>
    <ellipse cx="55" cy="80" rx="14" ry="6" fill="#5a4858"/>
    <text x="60" y="92" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#fff8d8" font-weight="700">STAY</text>
    <text x="60" y="110" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">CHURCH</text>
  </g>
  <g opacity="0.62" filter="url(#strongGlowBB3)">
    <ellipse cx="60" cy="80" rx="40" ry="30" fill="#7848b8" opacity="0.42"/>
  </g>

  <g transform="rotate(-5 280 60)">
    <rect x="240" y="40" width="80" height="40" rx="2" fill="url(#paperBB3)" opacity="0.92"/>
    <text x="280" y="52" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">BROWNIES</text>
    <text x="280" y="60" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">SEEN</text>
    <line x1="246" y1="65" x2="314" y2="65" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="246" y1="71" x2="314" y2="71" stroke="#3a2010" stroke-width="0.4"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowBB3)">
    <rect x="240" y="40" width="80" height="40" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g transform="rotate(8 300 130)">
    <rect x="260" y="110" width="80" height="40" rx="2" fill="url(#paperBB3)" opacity="0.92"/>
    <text x="300" y="122" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">MYSTERIOUS</text>
    <text x="300" y="130" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">LIGHTS</text>
    <line x1="266" y1="135" x2="334" y2="135" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="266" y1="141" x2="334" y2="141" stroke="#3a2010" stroke-width="0.4"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowBB3)">
    <rect x="260" y="110" width="80" height="40" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g transform="rotate(-3 290 200)">
    <rect x="250" y="180" width="80" height="40" rx="2" fill="url(#paperBB3)" opacity="0.92"/>
    <text x="290" y="192" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">DANCING FIGURES</text>
    <text x="290" y="200" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">ON ROOFTOPS</text>
    <line x1="256" y1="205" x2="324" y2="205" stroke="#3a2010" stroke-width="0.4"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowBB3)">
    <rect x="250" y="180" width="80" height="40" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g>
    <line x1="80" y1="80" x2="240" y2="60" stroke="url(#brightThreadBB3)" stroke-width="2.4" opacity="0.95"/>
    <line x1="80" y1="80" x2="260" y2="120" stroke="url(#brightThreadBB3)" stroke-width="2" opacity="0.85"/>
    <line x1="80" y1="80" x2="250" y2="190" stroke="url(#brightThreadBB3)" stroke-width="1.8" opacity="0.85"/>

    <line x1="80" y1="80" x2="240" y2="60" stroke="#fff8d8" stroke-width="0.7" opacity="0.95"/>
    <line x1="80" y1="80" x2="260" y2="120" stroke="#fff8d8" stroke-width="0.55" opacity="0.85"/>
    <line x1="80" y1="80" x2="250" y2="190" stroke="#fff8d8" stroke-width="0.55" opacity="0.85"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowBB3)">
    <line x1="80" y1="80" x2="240" y2="60" stroke="#a878d8" stroke-width="11" opacity="0.42"/>
    <line x1="80" y1="80" x2="260" y2="120" stroke="#a878d8" stroke-width="11" opacity="0.42"/>
    <line x1="80" y1="80" x2="250" y2="190" stroke="#a878d8" stroke-width="11" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="160" cy="200" rx="22" ry="3" fill="#040202" opacity="0.62"/>

    <ellipse cx="160" cy="170" rx="22" ry="22" fill="url(#suitLumaBB3)"/>
    <path d="M 138 144 L 182 144 L 184 200 L 136 200 Z" fill="url(#suitLumaBB3)"/>

    <ellipse cx="160" cy="120" rx="14" ry="16" fill="url(#skinLumaBB3)"/>
    <path d="M 146 110 Q 160 96 174 110 Q 178 116 176 122 L 174 116 Q 168 110 160 112 Q 152 110 146 122 L 144 122 Q 144 116 146 110 Z" fill="url(#hairLumaBB3)"/>

    <ellipse cx="153" cy="124" rx="3" ry="2" fill="#1a1028"/>
    <ellipse cx="167" cy="124" rx="3" ry="2" fill="#a878d8"/>
    <line x1="148" y1="120" x2="158" y2="128" stroke="#d88838" stroke-width="0.4" opacity="0.85"/>
    <circle cx="153" cy="124" r="1" fill="#080404"/>
    <circle cx="167" cy="124" r="1" fill="#080404"/>
    <circle cx="168" cy="123" r="0.4" fill="#fff8d8"/>

    <path d="M 156 132 Q 160 134 164 132" stroke="#1a0a08" stroke-width="0.55" fill="none"/>
    <path d="M 156 138 L 164 138" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 182 156 L 220 130 L 244 110" stroke="url(#skinLumaBB3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="246" cy="108" rx="4" ry="3" fill="url(#skinLumaBB3)"/>
  </g>
  <g opacity="0.85" filter="url(#bloomBB3)">
    <ellipse cx="160" cy="170" rx="32" ry="32" fill="#7848b8" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="160" cy="220" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="156" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-weight="700">LUMA: "Everywhere they went, stories followed."</text>
    <text x="156" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-style="italic">"Humans saw them. Told stories. Published them."</text>
    <text x="156" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-weight="700">"The fairy tales are the record."</text>
  </g>
</svg>
