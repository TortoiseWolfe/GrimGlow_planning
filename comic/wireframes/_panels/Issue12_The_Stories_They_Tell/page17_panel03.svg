<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 280" width="184" height="280">
  <title>Issue 12 Page 17 Panel 3 — Luma's face, the moment before</title>
  <desc>Close-up. Woman's face lit from below by blue-violet holographic light — warm brown skin, large dark eyes behind one cracked and one intact holographic lens, long braided hair with luminous filament. Expression is face of someone about to change everything — rigor, doubt, conviction layered together. Blue-violet light casts structured geometric patterns upward across features. Cracked lens catches light differently than intact one, asymmetric glow. The moment before.</desc>
  <defs>
    <linearGradient id="bgAA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1028"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="violetBelowAA3" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairLumaAA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="faceLumaAA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4830"/>
      <stop offset="0.4" stop-color="#a87858"/>
      <stop offset="0.85" stop-color="#a878d8"/>
      <stop offset="1" stop-color="#7848b8"/>
    </linearGradient>
    <linearGradient id="lensCrackedAA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a38a8"/>
      <stop offset="0.5" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="lensIntactAA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a878d8"/>
      <stop offset="0.5" stop-color="#5a38a8"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="copperFoilAA3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="eyeRigorAA3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#7848b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomAA3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowAA3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowAA3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="184" height="280" fill="url(#bgAA3)"/>
  <rect width="184" height="280" fill="url(#violetBelowAA3)"/>

  <g>
    <ellipse cx="92" cy="160" rx="80" ry="120" fill="url(#faceLumaAA3)"/>

    <path d="M 14 30 Q 50 0 92 0 Q 134 0 170 30 Q 178 60 174 84 L 164 80 Q 140 30 110 26 Q 92 22 74 26 Q 44 30 20 80 L 10 84 Q 6 60 14 30 Z" fill="url(#hairLumaAA3)"/>

    <path d="M 8 80 Q 4 130 0 180 L 0 280 L 14 280 Q 12 200 16 130 Z" fill="url(#hairLumaAA3)"/>
    <g opacity="0.85" fill="#a878d8">
      <circle cx="8" cy="120" r="0.85"/>
      <circle cx="6" cy="160" r="0.85"/>
      <circle cx="4" cy="200" r="0.85"/>
      <circle cx="2" cy="240" r="0.85"/>
    </g>

    <ellipse cx="60" cy="120" rx="22" ry="14" fill="url(#lensCrackedAA3)" opacity="0.92"/>
    <ellipse cx="60" cy="120" rx="18" ry="11" fill="#1a1028"/>
    <rect x="36" y="118" width="48" height="4" fill="url(#copperFoilAA3)" opacity="0.92"/>
    <line x1="36" y1="118" x2="84" y2="118" stroke="#5a3018" stroke-width="0.4"/>
    <line x1="36" y1="122" x2="84" y2="122" stroke="#5a3018" stroke-width="0.4"/>

    <line x1="44" y1="115" x2="76" y2="125" stroke="#3a2868" stroke-width="0.55"/>
    <line x1="48" y1="125" x2="72" y2="115" stroke="#3a2868" stroke-width="0.55"/>

    <ellipse cx="60" cy="120" rx="9" ry="6" fill="#080404"/>
    <circle cx="62" cy="118" r="3" fill="url(#eyeRigorAA3)"/>
    <circle cx="60" cy="120" r="2" fill="#040206"/>

    <ellipse cx="124" cy="120" rx="22" ry="14" fill="url(#lensIntactAA3)" opacity="0.85"/>
    <ellipse cx="124" cy="120" rx="18" ry="11" fill="#1a1028"/>
    <ellipse cx="124" cy="120" rx="9" ry="6" fill="#080404"/>
    <circle cx="126" cy="118" r="3" fill="url(#eyeRigorAA3)"/>
    <circle cx="124" cy="120" r="2" fill="#040206"/>
    <circle cx="127" cy="117" r="0.7" fill="#fff8d8"/>

    <g opacity="0.85" font-family="monospace" font-size="2.4" fill="#a878d8">
      <text x="106" y="115">∇⊥◊</text>
      <text x="130" y="115">⊕Δ</text>
      <text x="106" y="128">142Hz</text>
    </g>

    <path d="M 70 150 Q 92 154 114 150" stroke="#1a0a08" stroke-width="0.85" fill="none" opacity="0.62"/>

    <path d="M 76 184 Q 92 188 108 184" stroke="#1a0a08" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 76 184 L 108 184" stroke="#3a2410" stroke-width="0.55" opacity="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowAA3)">
    <ellipse cx="124" cy="120" rx="22" ry="14" fill="#a878d8" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#bloomAA3)">
    <ellipse cx="60" cy="120" rx="22" ry="14" fill="#5a38a8" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomAA3)">
    <ellipse cx="92" cy="220" rx="100" ry="22" fill="#7848b8" opacity="0.42"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowAA3)">
    <ellipse cx="92" cy="240" rx="120" ry="40" fill="#a878d8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="92" cy="262" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
