<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 140" width="742" height="140">
  <title>Issue 12 Page 22 Panel 3 — FINAL PANEL — "And the stories they tell..."</title>
  <desc>Extreme close-up — tightest frame in the volume. Steel pen nib touches cream-colored journal page, drop of ink spreading at contact point. Pen is mid-stroke, forming letters. Words being written are legible: And the stories they tell... Sentence is incomplete — pen has not finished. Story continues beyond frame. At extreme top of frame, candle flame is soft blur of warm amber light. Page is cream-gold in candlelight. Ink glistens wet and black. Nib is dark line of steel. That is all. No fairy light. Only fire, paper, ink, and the words. Vermeer-intimate. The first words of the oldest fairy tale. The beginning of everything.</desc>
  <defs>
    <linearGradient id="bgOO3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a04"/>
      <stop offset="0.5" stop-color="#0a0604"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="candleSoftOO3" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperFinalOO3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#f4e8c8"/>
      <stop offset="1" stop-color="#d8b888"/>
    </linearGradient>
    <linearGradient id="penNibOO3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="0.8" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="candleBlurOO3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#fff088"/>
      <stop offset="0.8" stop-color="#d88838"/>
      <stop offset="1" stop-color="#a85020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inkDropOO3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#080404"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomOO3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowOO3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowOO3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowOO3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="candleSoftBlurOO3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="742" height="140" fill="url(#bgOO3)"/>
  <rect width="742" height="140" fill="url(#candleSoftOO3)"/>

  <g>
    <rect x="0" y="20" width="742" height="120" fill="url(#paperFinalOO3)"/>
    <rect x="0" y="20" width="742" height="3" fill="#a87858" opacity="0.42"/>

    <g opacity="0.42" stroke="#a87858" stroke-width="0.4">
      <line x1="0" y1="60" x2="742" y2="60"/>
      <line x1="0" y1="100" x2="742" y2="100"/>
    </g>
  </g>

  <g>
    <text x="100" y="50" font-family="Times New Roman, Georgia, serif" font-size="11" fill="#1a0a04" font-style="italic" opacity="0.55">...and they will not be forgotten,</text>
    <text x="100" y="68" font-family="Times New Roman, Georgia, serif" font-size="11" fill="#1a0a04" font-style="italic" opacity="0.55">though the world spin a thousand times.</text>
  </g>

  <g>
    <text x="100" y="100" font-family="Times New Roman, Georgia, serif" font-size="14" fill="#1a0a04" font-weight="700" font-style="italic">And the stories they tell</text>
  </g>
  <g opacity="0.42" filter="url(#bloomOO3)">
    <text x="100" y="100" font-family="Times New Roman, Georgia, serif" font-size="14" fill="#3a2010" font-weight="700" font-style="italic">And the stories they tell</text>
  </g>

  <g>
    <line x1="380" y1="92" x2="430" y2="106" stroke="url(#penNibOO3)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 425 102 L 432 106 L 428 110" stroke="#1a0a04" stroke-width="0.85" fill="none"/>

    <ellipse cx="432" cy="106" rx="3" ry="2" fill="#080404"/>
  </g>
  <g opacity="0.62" filter="url(#bloomOO3)">
    <ellipse cx="432" cy="106" rx="6" ry="3" fill="url(#inkDropOO3)"/>
  </g>

  <g>
    <text x="100" y="100" font-family="Times New Roman, Georgia, serif" font-size="14" fill="#1a0a04" font-weight="700" font-style="italic">And the stories they tell</text>
    <text x="438" y="100" font-family="Times New Roman, Georgia, serif" font-size="14" fill="#1a0a04" font-weight="700" font-style="italic">.</text>
    <line x1="442" y1="105" x2="446" y2="106" stroke="#080404" stroke-width="0.85"/>
  </g>

  <g>
    <ellipse cx="370" cy="10" rx="40" ry="22" fill="url(#candleBlurOO3)" opacity="0.85"/>
    <ellipse cx="370" cy="10" rx="22" ry="14" fill="#fff8d8" opacity="0.62"/>
    <ellipse cx="370" cy="10" rx="11" ry="9" fill="#fff8d8"/>
  </g>
  <g opacity="0.85" filter="url(#candleSoftBlurOO3)">
    <ellipse cx="370" cy="10" rx="60" ry="32" fill="#fff8d8" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowOO3)">
    <ellipse cx="370" cy="10" rx="120" ry="60" fill="#f4b860" opacity="0.55"/>
  </g>
  <g opacity="0.42" filter="url(#ultraGlowOO3)">
    <ellipse cx="370" cy="10" rx="280" ry="80" fill="#f4b860" opacity="0.42"/>
  </g>

  <g opacity="0.62" filter="url(#strongGlowOO3)">
    <rect x="0" y="20" width="742" height="120" fill="#fff8d8" opacity="0.32"/>
  </g>

  <g opacity="0.42">
    <ellipse cx="370" cy="80" rx="280" ry="22" fill="#fff8d8" opacity="0.32"/>
  </g>
</svg>
