<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 10 Panel 2 — Thresh behind cover, "I hate this. I hate this. I hate this."</title>
  <desc>Medium close-up. Tiny figure in degraded crimson armor presses flat against brick column, back to surface, compact weapon clutched to chest. Breathing hard, copper-red buzz cut damp with sweat, pale skin flushed, eyes showing raw terror — but jaw set, grip on weapon functional, training running beneath fear. Beyond column edge, dark iridescent shimmer of Titan drone's limb scrapes across brick — too close, enormous, wrong. Steam diffuses light. Crimson edge-lighting pulses, stuttering but present. The soldier who fights afraid.</desc>
  <defs>
    <linearGradient id="bgT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="droneEdgeT2" cx="0.95" cy="0.5" r="0.32">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1a0810" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steamSoftT2" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a8a8a8" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#5a5a5a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickColT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitThreshT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="0.8" stop-color="#3a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="hairBuzzT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="skinSweatT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.5" stop-color="#e8c8a8"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="weaponT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="droneLimbT2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080404"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#3a2868"/>
    </linearGradient>
    <linearGradient id="iridescenceT2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a3098" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0a04" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="crimsonStutterT2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#5a2520" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomT2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowT2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowT2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wrongnessT2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgT2)"/>
  <rect width="366" height="240" fill="url(#droneEdgeT2)"/>
  <rect width="366" height="240" fill="url(#steamSoftT2)"/>

  <g>
