      <line x1="126" y1="80" x2="214" y2="80"/>
      <line x1="126" y1="120" x2="214" y2="120"/>
      <line x1="126" y1="160" x2="214" y2="160"/>
      <line x1="126" y1="200" x2="214" y2="200"/>
      <line x1="170" y1="0" x2="170" y2="240"/>
    </g>

    <path d="M 220 80 L 270 70 Q 320 60 360 80 L 366 100 L 320 110 Q 270 120 220 110 Z" fill="url(#droneLimbT2)" opacity="0.92"/>
    <path d="M 220 80 L 270 70 Q 320 60 360 80" stroke="url(#iridescenceT2)" stroke-width="0.85" fill="none"/>
    <path d="M 220 110 L 270 120 Q 320 130 366 130" stroke="url(#iridescenceT2)" stroke-width="0.85" fill="none"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessT2)">
    <path d="M 220 80 L 360 60 L 366 110 L 220 120 Z" fill="#3a2868" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="76" cy="220" rx="22" ry="6" fill="#040202" opacity="0.62"/>

    <ellipse cx="76" cy="160" rx="32" ry="44" fill="url(#suitThreshT2)"/>
    <path d="M 44 130 L 108 130 L 112 200 L 40 200 Z" fill="url(#suitThreshT2)"/>

    <path d="M 44 134 L 56 130 L 54 144 L 40 146 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 96 144 L 108 142 L 106 152 L 96 154 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 66 168 L 80 168 L 76 178 L 64 178 Z" fill="#1a0810" opacity="0.85"/>

    <line x1="44" y1="138" x2="108" y2="138" stroke="url(#crimsonStutterT2)" stroke-width="1.4" opacity="0.85"/>
    <line x1="40" y1="184" x2="112" y2="184" stroke="url(#crimsonStutterT2)" stroke-width="1" opacity="0.62"/>

    <ellipse cx="76" cy="100" rx="22" ry="26" fill="url(#skinSweatT2)"/>
    <path d="M 54 86 Q 76 64 98 86 Q 98 96 98 100 L 54 100 Q 54 96 54 86 Z" fill="url(#hairBuzzT2)"/>
    <g opacity="0.7" stroke="#3a1808" stroke-width="0.4">
      <line x1="60" y1="78" x2="60" y2="94"/>
      <line x1="68" y1="74" x2="68" y2="94"/>
      <line x1="76" y1="72" x2="76" y2="94"/>
      <line x1="84" y1="74" x2="84" y2="94"/>
      <line x1="92" y1="78" x2="92" y2="94"/>
    </g>

    <g opacity="0.62">
      <ellipse cx="68" cy="80" rx="0.55" ry="2" fill="#a8c0e0"/>
      <ellipse cx="84" cy="78" rx="0.55" ry="2.4" fill="#a8c0e0"/>
      <ellipse cx="76" cy="74" rx="0.55" ry="2" fill="#a8c0e0"/>
    </g>

    <ellipse cx="66" cy="104" rx="3" ry="3.4" fill="#0a0604"/>
    <circle cx="68" cy="102" r="1.4" fill="#fff8d8"/>
    <ellipse cx="86" cy="104" rx="3" ry="3.4" fill="#0a0604"/>
    <circle cx="88" cy="102" r="1.4" fill="#fff8d8"/>

    <path d="M 60 100 Q 66 96 72 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 80 100 Q 86 96 92 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 70 124 Q 76 124 82 124" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <rect x="68" y="146" width="22" height="14" rx="2" fill="url(#weaponT2)"/>
    <line x1="70" y1="148" x2="86" y2="148" stroke="#d83838" stroke-width="0.4" opacity="0.62"/>

    <path d="M 40 200 Q 30 212 24 220" stroke="url(#suitThreshT2)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 112 200 Q 122 212 128 220" stroke="url(#suitThreshT2)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="22" cy="222" rx="6" ry="2" fill="#5a3018"/>
    <ellipse cx="130" cy="222" rx="6" ry="2" fill="#5a3018"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowT2)">
    <ellipse cx="76" cy="160" rx="40" ry="50" fill="#d83838" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowT2)">
    <ellipse cx="76" cy="160" rx="80" ry="80" fill="#8a2520" opacity="0.32"/>
  </g>

  <g opacity="0.55">
    <ellipse cx="40" cy="80" rx="30" ry="20" fill="#a8a8a8" opacity="0.32"/>
    <ellipse cx="280" cy="160" rx="40" ry="22" fill="#a8a8a8" opacity="0.32"/>
  </g>
  <g opacity="0.55" filter="url(#bloomT2)">
    <ellipse cx="40" cy="80" rx="40" ry="22" fill="#fff8d8" opacity="0.32"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="96" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#d83838" font-style="italic">THRESH: "I hate this. I hate this."</text>
    <text x="96" y="17" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#d83838" font-style="italic">"I hate this."</text>
    <text x="96" y="28" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#d83838" font-weight="700">"Jink — get its attention. I'll hit the sensor."</text>
  </g>
</svg>
