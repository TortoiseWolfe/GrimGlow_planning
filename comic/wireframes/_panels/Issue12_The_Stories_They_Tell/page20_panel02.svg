<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 20 Panel 2 — Sable's descent: steeple-ledge inset, then level among the squad, an unguarded held look with Wren.</title>
  <desc>Two-register composition. INSET (top-left, opaque): Sable as a small silhouette at a cathedral steeple ledge, about to climb down — rhyming Issue 1's crash arrival — the gaslit Victorian city behind her already turning to sunlit morning, warm amber over cool blue rooftops. MAIN REGISTER: Sable is now lower, level among the four battered squad figures rather than above them. Her pewter-dark degraded silver suit shows a faint blue-white holographic collar accent glowing through soot. Warm amber-gold morning light meets cool city-blue. The emotional beat: an UNGUARDED held eye-to-eye look between Sable (silver) and the copper-suited Wren standing beside her — Sable's face open and unmanaged, letting Wren see her plainly before she speaks. She gives her first order in the new mode — the ship is no longer their way out but their power, the mythology is the mission, they are not getting home because they are already there — and only then, barely above a whisper, "Then we stay."</desc>
  <defs>
    <linearGradient id="bgGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4b860"/>
      <stop offset="0.8" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="cityGlowGG2" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairSilverWarmGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d8d8d8"/>
      <stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="faceSableGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4830"/>
      <stop offset="0.4" stop-color="#a87858"/>
      <stop offset="0.8" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="faceWrenGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c8a0"/>
      <stop offset="0.45" stop-color="#d8a878"/>
      <stop offset="1" stop-color="#6a4428"/>
    </linearGradient>
    <radialGradient id="eyeAcceptGG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitSableGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a707a"/>
      <stop offset="0.5" stop-color="#3a4048"/>
      <stop offset="1" stop-color="#1a1e26"/>
    </linearGradient>
    <linearGradient id="suitWrenGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88a44"/>
      <stop offset="0.5" stop-color="#a85a28"/>
      <stop offset="1" stop-color="#5a3014"/>
    </linearGradient>
    <linearGradient id="suitSquadGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a3a"/>
      <stop offset="0.5" stop-color="#3a2e22"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="insetSkyGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="0.45" stop-color="#d89a58"/>
      <stop offset="0.8" stop-color="#3a4a66"/>
      <stop offset="1" stop-color="#10141f"/>
    </linearGradient>
    <linearGradient id="insetSteepleGG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2632"/>
      <stop offset="1" stop-color="#08060c"/>
    </linearGradient>
    <filter id="bloomGG2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowGG2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowGG2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowGG2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ============ MAIN BACKGROUND: dawn city, warm amber over cool blue ============ -->
  <rect width="742" height="240" fill="url(#bgGG2)"/>
  <rect width="742" height="240" fill="url(#cityGlowGG2)"/>

  <!-- cool city-blue silhouette band behind the squad (right two-thirds) -->
  <g opacity="0.85">
    <path d="M 300 178 L 300 150 L 320 150 L 320 132 L 344 132 L 344 158 L 372 158 L 372 120 L 384 120 L 384 100 L 396 100 L 396 120 L 410 120 L 410 150 L 440 150 L 440 128 L 462 128 L 462 156 L 500 156 L 500 138 L 530 138 L 530 162 L 572 162 L 572 142 L 600 142 L 600 158 L 660 158 L 660 144 L 700 144 L 700 168 L 742 168 L 742 240 L 300 240 Z" fill="#26344a" opacity="0.7"/>
    <path d="M 380 100 L 384 88 L 388 100 Z" fill="#26344a" opacity="0.7"/>
    <path d="M 520 178 L 520 150 L 540 150 L 540 130 L 556 130 L 556 158 L 588 158 L 588 146 L 620 146 L 620 170 L 700 170 L 700 152 L 742 152 L 742 240 L 520 240 Z" fill="#1c2738" opacity="0.7"/>
  </g>
  <!-- warm dawn wash low across the city as it turns sunlit -->
  <g opacity="0.6" filter="url(#megaGlowGG2)">
    <ellipse cx="540" cy="120" rx="300" ry="90" fill="#f4b860" opacity="0.3"/>
  </g>

  <!-- ============ INSET PANEL (OPAQUE) — DRAWN EARLY, top-left only ============ -->
  <!-- Bounding box: x 14..258 (w 244), y 12..132 (h 120). Main-register figures are placed RIGHT of x=300. -->
  <g>
    <rect x="14" y="12" width="244" height="120" rx="3" fill="#0c0a14" opacity="1" stroke="#a8c0e0" stroke-width="1.4"/>
    <!-- clip the inset content to the panel -->
    <clipPath id="insetClipGG2"><rect x="15" y="13" width="242" height="118" rx="2"/></clipPath>
    <g clip-path="url(#insetClipGG2)">
      <!-- gaslit-turning-sunlit sky -->
      <rect x="14" y="12" width="244" height="120" fill="url(#insetSkyGG2)"/>
      <!-- low sun bloom, morning breaking -->
      <g opacity="0.7" filter="url(#bloomGG2)">
        <ellipse cx="210" cy="58" rx="46" ry="30" fill="#fff2c0" opacity="0.7"/>
      </g>
      <!-- cool blue rooftops below, gaslamp warmth dotting them -->
      <path d="M 14 104 L 14 86 L 40 86 L 40 96 L 64 96 L 64 80 L 86 80 L 86 100 L 118 100 L 118 90 L 150 90 L 150 104 L 190 104 L 190 94 L 232 94 L 232 108 L 258 108 L 258 132 L 14 132 Z" fill="#2a3a52" opacity="0.92"/>
      <g fill="#ffcf6a" opacity="0.85">
        <circle cx="48" cy="112" r="1.4"/>
        <circle cx="96" cy="116" r="1.2"/>
        <circle cx="140" cy="110" r="1.4"/>
        <circle cx="178" cy="118" r="1.2"/>
        <circle cx="222" cy="114" r="1.4"/>
      </g>
      <!-- the cathedral steeple, dark, near-frame, with Sable on the ledge -->
      <path d="M 70 132 L 70 60 L 84 36 L 98 60 L 98 132 Z" fill="url(#insetSteepleGG2)"/>
      <path d="M 84 36 L 84 20 L 86 20 L 86 36 Z" fill="#06040a"/>
      <circle cx="85" cy="18" r="1.4" fill="#a8c0e0" opacity="0.8"/>
      <!-- ledge -->
      <rect x="62" y="90" width="44" height="5" fill="#1a1622"/>
      <!-- Sable small silhouette, about to climb down, one hand on the ledge edge (Issue 1 rhyme) -->
      <g>
        <ellipse cx="86" cy="78" rx="3.4" ry="3.8" fill="#3a4048"/>
        <rect x="82.6" y="80" width="6.8" height="11" rx="2.6" fill="#3a4048"/>
        <path d="M 83 82 L 78 90" stroke="#3a4048" stroke-width="2" stroke-linecap="round"/>
        <path d="M 89 82 L 94 90" stroke="#3a4048" stroke-width="2" stroke-linecap="round"/>
        <path d="M 84 90 L 82 96" stroke="#2a3038" stroke-width="2" stroke-linecap="round"/>
        <path d="M 88 90 L 90 95" stroke="#2a3038" stroke-width="2" stroke-linecap="round"/>
        <!-- faint blue-white holo accent at her collar -->
        <ellipse cx="86" cy="80" rx="2.2" ry="0.9" fill="#a8c0e0" opacity="0.85"/>
      </g>
      <g opacity="0.7" filter="url(#bloomGG2)">
        <ellipse cx="86" cy="80" rx="3" ry="1.4" fill="#a8c0e0" opacity="0.5"/>
      </g>
    </g>
    <!-- tiny inset label -->
    <text x="20" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.5" fill="#a8c0e0" opacity="0.85" font-style="italic">the descent — as it was the arrival</text>
  </g>

  <!-- ============ MAIN REGISTER FIGURES — DRAWN AFTER THE INSET, entirely RIGHT of x=300 ============ -->

  <!-- the two other battered squad figures, framing, level with Sable and Wren -->
  <!-- squad figure A (far, emerald/scout, dark battered) -->
  <g opacity="0.95">
    <ellipse cx="700" cy="118" rx="20" ry="22" fill="url(#suitSquadGG2)"/>
    <ellipse cx="700" cy="92" rx="14" ry="16" fill="#7a5a3e"/>
    <path d="M 688 80 Q 700 70 712 80 L 710 92 Q 700 86 690 92 Z" fill="#caa84a" opacity="0.85"/>
    <ellipse cx="694" cy="92" rx="2" ry="1.4" fill="#1a0e06"/>
    <ellipse cx="706" cy="92" rx="2" ry="1.4" fill="#1a0e06"/>
    <path d="M 692 138 L 690 168" stroke="url(#suitSquadGG2)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 708 138 L 710 168" stroke="url(#suitSquadGG2)" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="700" cy="106" rx="6" ry="2" fill="#4a9a6a" opacity="0.6"/>
    <g opacity="0.4" filter="url(#strongGlowGG2)"><ellipse cx="700" cy="106" rx="8" ry="3" fill="#4a9a6a" opacity="0.5"/></g>
  </g>

  <!-- squad figure B (ruby/soldier, broad, battered armor) -->
  <g opacity="0.95">
    <ellipse cx="338" cy="124" rx="24" ry="24" fill="url(#suitSquadGG2)"/>
    <ellipse cx="338" cy="96" rx="15" ry="17" fill="#8a5a42"/>
    <path d="M 324 84 Q 338 74 352 84 L 350 96 Q 338 90 326 96 Z" fill="#b85a44" opacity="0.85"/>
    <ellipse cx="332" cy="96" rx="2.2" ry="1.5" fill="#1a0e06"/>
    <ellipse cx="344" cy="96" rx="2.2" ry="1.5" fill="#1a0e06"/>
    <path d="M 328 146 L 324 172" stroke="url(#suitSquadGG2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 348 146 L 352 172" stroke="url(#suitSquadGG2)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="338" cy="112" rx="7" ry="2" fill="#c83a3a" opacity="0.55"/>
    <g opacity="0.4" filter="url(#strongGlowGG2)"><ellipse cx="338" cy="112" rx="9" ry="3" fill="#c83a3a" opacity="0.5"/></g>
    <!-- soot streaks -->
    <path d="M 326 118 L 332 134" stroke="#0a0806" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- ===== SABLE (silver) — main register, lower, level with the squad ===== -->
  <!-- centered around x=470, well clear of inset bbox (x<=258) -->
  <g>
    <!-- torso, pewter-dark degraded silver suit -->
    <ellipse cx="470" cy="150" rx="30" ry="34" fill="url(#suitSableGG2)"/>
    <!-- soot accumulation on the suit -->
    <path d="M 452 152 Q 460 166 458 180" stroke="#0a0a10" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M 486 150 Q 492 164 490 178" stroke="#0a0a10" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- blue-white holographic collar accent glowing through soot -->
    <path d="M 448 130 Q 470 122 492 130 L 490 138 Q 470 132 450 138 Z" fill="#a8c0e0" opacity="0.85"/>
    <g opacity="0.7" filter="url(#strongGlowGG2)"><path d="M 448 130 Q 470 122 492 130 L 490 138 Q 470 132 450 138 Z" fill="#a8c0e0" opacity="0.6"/></g>
    <!-- neck -->
    <rect x="463" y="112" width="14" height="14" fill="#8a5a40"/>
    <!-- head: dark brown skin, turned slightly toward Wren (her right, screen-right) -->
    <ellipse cx="470" cy="96" rx="20" ry="23" fill="url(#faceSableGG2)"/>
    <!-- military-cropped silver-white hair catching warm amber-gold -->
    <path d="M 450 80 Q 458 70 470 68 Q 482 70 490 80 Q 492 86 490 90 L 486 86 Q 478 78 470 78 Q 462 78 454 86 L 450 90 Q 448 86 450 80 Z" fill="url(#hairSilverWarmGG2)"/>
    <g opacity="0.7" stroke="#fff8d8" stroke-width="0.5">
      <line x1="458" y1="72" x2="458" y2="82"/>
      <line x1="466" y1="69" x2="466" y2="80"/>
      <line x1="474" y1="69" x2="474" y2="80"/>
      <line x1="482" y1="72" x2="482" y2="82"/>
    </g>
    <!-- eyes, OPEN and unmanaged, both directed toward Wren (screen-right) -->
    <ellipse cx="463" cy="95" rx="5.4" ry="3.6" fill="#0a0604"/>
    <ellipse cx="464" cy="94.5" rx="2" ry="1.4" fill="url(#eyeAcceptGG2)"/>
    <circle cx="465" cy="95" r="1.4" fill="#080404"/>
    <circle cx="465.6" cy="94.2" r="0.5" fill="#fff8d8"/>
    <ellipse cx="479" cy="95" rx="5.4" ry="3.6" fill="#0a0604"/>
    <ellipse cx="480" cy="94.5" rx="2" ry="1.4" fill="url(#eyeAcceptGG2)"/>
    <circle cx="481" cy="95" r="1.4" fill="#080404"/>
    <circle cx="481.6" cy="94.2" r="0.5" fill="#fff8d8"/>
    <!-- brows lifted, unguarded (not furrowed command) -->
    <path d="M 456 88 Q 463 85 470 88" stroke="#0a0604" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M 472 88 Q 479 85 486 88" stroke="#0a0604" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- amber cheek light -->
    <ellipse cx="461" cy="103" rx="5" ry="1.6" fill="#a85820" opacity="0.55"/>
    <ellipse cx="481" cy="103" rx="5" ry="1.6" fill="#a85820" opacity="0.55"/>
    <!-- mouth: barely parted, soft — about to speak, not yet closed in command -->
    <path d="M 463 108 Q 470 110 477 108" stroke="#0a0604" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== WREN (copper) — main register, beside Sable, returning the look ===== -->
  <!-- centered around x=560, level with Sable -->
  <g>
    <ellipse cx="560" cy="152" rx="28" ry="32" fill="url(#suitWrenGG2)"/>
    <!-- oil-stained streaks on copper suit -->
    <path d="M 546 154 Q 552 168 550 180" stroke="#1a0e06" stroke-width="3" fill="none" opacity="0.45"/>
    <path d="M 574 152 Q 580 166 578 178" stroke="#1a0e06" stroke-width="3" fill="none" opacity="0.45"/>
    <!-- copper holo collar accent -->
    <path d="M 540 132 Q 560 124 580 132 L 578 140 Q 560 134 542 140 Z" fill="#e89a4a" opacity="0.8"/>
    <g opacity="0.6" filter="url(#strongGlowGG2)"><path d="M 540 132 Q 560 124 580 132 L 578 140 Q 560 134 542 140 Z" fill="#e89a4a" opacity="0.55"/></g>
    <!-- neck -->
    <rect x="553" y="114" width="14" height="14" fill="#b07a52"/>
    <!-- head: East Asian, turned slightly toward Sable (her left, screen-left) -->
    <ellipse cx="560" cy="98" rx="19" ry="22" fill="url(#faceWrenGG2)"/>
    <!-- messy black hair knot -->
    <path d="M 542 84 Q 550 72 560 70 Q 570 72 578 84 Q 580 90 578 94 L 574 88 Q 568 80 560 80 Q 552 80 546 88 L 542 94 Q 540 90 542 84 Z" fill="#1a140e"/>
    <ellipse cx="572" cy="74" rx="5" ry="6" fill="#1a140e"/>
    <g opacity="0.5" stroke="#5a4028" stroke-width="0.5">
      <line x1="550" y1="74" x2="552" y2="82"/>
      <line x1="560" y1="71" x2="560" y2="80"/>
      <line x1="570" y1="74" x2="568" y2="82"/>
    </g>
    <!-- eyes directed toward Sable (screen-left) — meeting her gaze -->
    <ellipse cx="551" cy="97" rx="5" ry="3.4" fill="#0a0604"/>
    <ellipse cx="550" cy="96.5" rx="1.8" ry="1.3" fill="url(#eyeAcceptGG2)"/>
    <circle cx="549.6" cy="97" r="1.3" fill="#080404"/>
    <circle cx="549" cy="96.3" r="0.5" fill="#fff8d8"/>
    <ellipse cx="567" cy="97" rx="5" ry="3.4" fill="#0a0604"/>
    <ellipse cx="566" cy="96.5" rx="1.8" ry="1.3" fill="url(#eyeAcceptGG2)"/>
    <circle cx="565.6" cy="97" r="1.3" fill="#080404"/>
    <circle cx="565" cy="96.3" r="0.5" fill="#fff8d8"/>
    <!-- brows, attentive, soft -->
    <path d="M 545 90 Q 551 87 558 90" stroke="#0a0604" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 562 90 Q 568 87 574 90" stroke="#0a0604" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="551" cy="105" rx="4.4" ry="1.5" fill="#a85820" opacity="0.5"/>
    <ellipse cx="568" cy="105" rx="4.4" ry="1.5" fill="#a85820" opacity="0.5"/>
    <!-- mouth, quiet, receiving -->
    <path d="M 553 110 Q 560 111 567 110" stroke="#0a0604" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== THE HELD LOOK: eye-line connecting Sable and Wren, blue-white + copper meeting ===== -->
  <g opacity="0.42" filter="url(#bloomGG2)">
    <line x1="486" y1="95" x2="544" y2="97" stroke="#cdd9ea" stroke-width="2.4" opacity="0.5"/>
  </g>
  <g opacity="0.6">
    <line x1="486" y1="95" x2="544" y2="97" stroke="#e8e0d0" stroke-width="0.7" opacity="0.5" stroke-dasharray="2 3"/>
  </g>

  <!-- ============ DUAL-LIGHT ATMOSPHERE OVER THE MAIN REGISTER ============ -->
  <g opacity="0.85" filter="url(#bloomGG2)">
    <ellipse cx="540" cy="34" rx="220" ry="20" fill="#fff8d8" opacity="0.4"/>
  </g>
  <g opacity="0.5" filter="url(#megaGlowGG2)">
    <ellipse cx="500" cy="150" rx="260" ry="70" fill="#f4b860" opacity="0.28"/>
  </g>
  <g opacity="0.35" filter="url(#ultraGlowGG2)">
    <ellipse cx="660" cy="120" rx="160" ry="120" fill="#a8c0e0" opacity="0.3"/>
  </g>

  <!-- ground shadow under the squad -->
  <g opacity="0.55">
    <ellipse cx="520" cy="206" rx="240" ry="6" fill="#040202" opacity="0.4"/>
  </g>

  <!-- ============ DIALOGUE CAPTION BOX — bottom-left, below inset, character-color stroke ============ -->
  <g transform="translate(14,138)">
    <rect x="-6" y="0" width="280" height="98" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.4"/>

    <text x="6" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c0e0" font-weight="700">SABLE:</text>
    <text x="6" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a8c0e0">"New orders. The ship isn't our way out</text>
    <text x="6" y="29" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a8c0e0">anymore — it's our power. Luma, the</text>
    <text x="6" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a8c0e0">mythology is the mission now; map all</text>
    <text x="6" y="47" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a8c0e0">of it. We're not getting home."</text>

    <text x="6" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c0e0" font-weight="700">SABLE:</text>
    <text x="6" y="71" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a8c0e0">"We're already there."</text>

    <line x1="-6" y1="78" x2="274" y2="78" stroke="#a8c0e0" stroke-width="0.55" opacity="0.45"/>

    <text x="6" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.5" fill="#a8c0e0" font-weight="700">SABLE (barely above a whisper):</text>
    <text x="160" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#a8c0e0" font-style="italic" font-weight="700">"Then we stay."</text>
  </g>
</svg>
