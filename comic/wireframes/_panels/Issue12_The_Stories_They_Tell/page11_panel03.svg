<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 11 Panel 3 — Theodore's hand on the cabinet, "You need my hands. My hands are here."</title>
  <desc>Close-up. Boy's hand grips access panel handle of cast-iron telegraph exchange cabinet — oil-stained fingers, burn scar on one knuckle, brass gear ring on index finger. Grip tight, knuckles white against dark iron. At cabinet seams, amber-black pulse has grown brighter — hub device inside, active, pushing restore signal. Morning light on hand. The decision in the grip. The ordinary hand that will do the extraordinary thing.</desc>
  <defs>
    <linearGradient id="bgU3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#fff8d8"/>
      <stop offset="0.7" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="morningHandU3" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seamPulseU3" cx="0.5" cy="0.85" r="0.42">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ironHandleU3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3848"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="cabinetIronU3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3848"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="skinHandU3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingU3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="titanSeamU3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomU3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowU3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="wrongnessU3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgU3)"/>
  <rect width="247" height="280" fill="url(#morningHandU3)"/>
  <rect width="247" height="280" fill="url(#seamPulseU3)"/>

  <g>
    <rect x="0" y="180" width="247" height="100" fill="url(#cabinetIronU3)"/>
    <rect x="0" y="180" width="247" height="6" fill="#080404"/>
    <g opacity="0.62" stroke="#080404" stroke-width="0.4">
      <line x1="0" y1="220" x2="247" y2="220"/>
      <line x1="0" y1="250" x2="247" y2="250"/>
      <line x1="80" y1="186" x2="80" y2="280"/>
      <line x1="160" y1="186" x2="160" y2="280"/>
    </g>

    <line x1="0" y1="186" x2="247" y2="186" stroke="url(#titanSeamU3)" stroke-width="0.85"/>
    <line x1="60" y1="186" x2="58" y2="200" stroke="url(#titanSeamU3)" stroke-width="0.7"/>
    <line x1="190" y1="186" x2="192" y2="200" stroke="url(#titanSeamU3)" stroke-width="0.7"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessU3)">
