    <path d="M 110 70 L 130 70 L 130 130 L 110 130 Z" fill="url(#skinHandU3)" opacity="0.85"/>
    <path d="M 140 80 L 160 80 L 160 130 L 140 130 Z" fill="url(#skinHandU3)" opacity="0.85"/>
    <path d="M 170 90 L 190 90 L 190 130 L 170 130 Z" fill="url(#skinHandU3)" opacity="0.85"/>

    <path d="M 80 130 L 100 130 L 105 165 L 78 168 Z" fill="url(#skinHandU3)" opacity="0.92"/>
    <path d="M 110 130 L 130 130 L 135 170 L 105 168 Z" fill="url(#skinHandU3)" opacity="0.92"/>
    <path d="M 140 130 L 160 130 L 162 165 L 134 168 Z" fill="url(#skinHandU3)" opacity="0.92"/>
    <path d="M 170 130 L 190 130 L 188 158 L 162 162 Z" fill="url(#skinHandU3)" opacity="0.92"/>

    <line x1="80" y1="130" x2="80" y2="170" stroke="#7a4830" stroke-width="0.55" opacity="0.62"/>
    <line x1="110" y1="130" x2="105" y2="170" stroke="#7a4830" stroke-width="0.55" opacity="0.62"/>
    <line x1="140" y1="130" x2="135" y2="170" stroke="#7a4830" stroke-width="0.55" opacity="0.62"/>
    <line x1="170" y1="130" x2="162" y2="165" stroke="#7a4830" stroke-width="0.55" opacity="0.62"/>

    <ellipse cx="100" cy="80" rx="6" ry="4" fill="#a87858" opacity="0.62"/>
    <path d="M 90 84 L 96 80" stroke="#a85820" stroke-width="0.85" opacity="0.7"/>

    <ellipse cx="155" cy="90" rx="6" ry="3" fill="#5a3018" opacity="0.55"/>
    <ellipse cx="125" cy="120" rx="3" ry="2" fill="#5a3018" opacity="0.55"/>
    <ellipse cx="180" cy="110" rx="3" ry="1.4" fill="#5a3018" opacity="0.55"/>

    <path d="M 120 70 L 130 64 L 138 68 Z" fill="#a85820" opacity="0.62"/>

    <ellipse cx="118" cy="80" rx="4" ry="3" fill="url(#brassRingU3)"/>
    <ellipse cx="118" cy="80" rx="2.4" ry="1.4" fill="#3a1a08"/>
    <line x1="114" y1="80" x2="122" y2="80" stroke="#5a2e10" stroke-width="0.55"/>
    <line x1="118" y1="76" x2="118" y2="84" stroke="#5a2e10" stroke-width="0.4"/>

    <path d="M 60 60 Q 50 80 50 110 Q 50 140 60 170 L 30 170 L 30 60 Z" fill="url(#skinHandU3)" opacity="0.85"/>

    <path d="M 78 168 L 105 168 L 135 170 L 162 165 L 188 158" stroke="#7a4830" stroke-width="0.55" fill="none" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowU3)">
    <ellipse cx="118" cy="80" rx="9" ry="6" fill="#fff8d8" opacity="0.55"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="270" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-weight="700">THEODORE: "I'm not waiting."</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-style="italic" font-weight="700">"You need my hands. My hands are here."</text>
  </g>
</svg>
