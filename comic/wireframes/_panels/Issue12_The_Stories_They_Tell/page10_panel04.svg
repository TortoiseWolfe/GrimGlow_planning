<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 280" width="246" height="280">
  <title>Issue 12 Page 10 Panel 4 — Thresh aiming, "Now."</title>
  <desc>Close-up. Woman in degraded crimson armor leans around brick column, compact weapon aimed, arms extended. Hands tremble visibly — but weapon's sights locked on target. Copper-red buzz cut, pale face set with focused terror, eyes locked forward. Weapon charges — crimson energy building at barrel, casting sharp red light across gauntlets and face. In distance, dark geometric lenses of Titan drone's sensor cluster. Crimson weapon charge light. Dark target ahead. The shaking aim that doesn't miss.</desc>
  <defs>
    <linearGradient id="bgT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="weaponChargeT4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff088" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="droneFarT4" cx="0.5" cy="0.92" r="0.18">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#1a0810" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickEdgeT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="gauntletT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#3a1820"/>
    </linearGradient>
    <linearGradient id="hairBuzzT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="skinFocusT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.5" stop-color="#d8b888"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="weaponBodyT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="crimsonChargedT4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fff088" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff088" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bloomT4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowT4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowT4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
    <filter id="trembleT4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>

  <rect width="246" height="280" fill="url(#bgT4)"/>
  <rect width="246" height="280" fill="url(#droneFarT4)"/>
  <rect width="246" height="280" fill="url(#weaponChargeT4)"/>

  <g>
    <rect x="0" y="0" width="40" height="280" fill="url(#brickEdgeT4)"/>
    <rect x="34" y="0" width="6" height="280" fill="#080404"/>
    <g opacity="0.62" stroke="#080404" stroke-width="0.55">
      <line x1="0" y1="40" x2="40" y2="40"/>
      <line x1="0" y1="80" x2="40" y2="80"/>
      <line x1="0" y1="120" x2="40" y2="120"/>
      <line x1="0" y1="160" x2="40" y2="160"/>
      <line x1="0" y1="200" x2="40" y2="200"/>
      <line x1="0" y1="240" x2="40" y2="240"/>
      <line x1="20" y1="0" x2="20" y2="280"/>
    </g>
  </g>

  <g>
    <ellipse cx="123" cy="240" rx="6" ry="4" fill="url(#droneFarT4)"/>
    <ellipse cx="115" cy="234" rx="3" ry="2" fill="#a85020" opacity="0.85"/>
    <ellipse cx="123" cy="240" rx="3" ry="2" fill="#a85020" opacity="0.95"/>
    <ellipse cx="131" cy="234" rx="3" ry="2" fill="#a85020" opacity="0.85"/>
  </g>
  <g opacity="0.62" filter="url(#bloomT4)">
    <ellipse cx="123" cy="240" rx="14" ry="9" fill="#a85020" opacity="0.42"/>
  </g>

  <g>
    <line x1="123" y1="120" x2="119" y2="234" stroke="#a85020" stroke-width="0.4" opacity="0.55" stroke-dasharray="2,3"/>
  </g>

  <g>
    <ellipse cx="80" cy="240" rx="40" ry="9" fill="#040202" opacity="0.62"/>

    <ellipse cx="80" cy="180" rx="32" ry="44" fill="url(#gauntletT4)"/>
    <path d="M 48 152 L 112 152 L 116 220 L 44 220 Z" fill="url(#gauntletT4)"/>

    <ellipse cx="80" cy="100" rx="22" ry="26" fill="url(#skinFocusT4)"/>
    <path d="M 58 86 Q 80 64 102 86 Q 102 96 102 100 L 58 100 Q 58 96 58 86 Z" fill="url(#hairBuzzT4)"/>
    <g opacity="0.7" stroke="#3a1808" stroke-width="0.4">
      <line x1="64" y1="78" x2="64" y2="94"/>
      <line x1="72" y1="74" x2="72" y2="94"/>
      <line x1="80" y1="72" x2="80" y2="94"/>
      <line x1="88" y1="74" x2="88" y2="94"/>
      <line x1="96" y1="78" x2="96" y2="94"/>
    </g>

    <ellipse cx="72" cy="104" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="73" cy="103" r="0.85" fill="#fff8d8"/>
    <ellipse cx="88" cy="104" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="89" cy="103" r="0.85" fill="#fff8d8"/>

    <path d="M 66 100 Q 72 98 78 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 82 100 Q 88 98 94 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 74 122 L 86 122" stroke="#1a0a08" stroke-width="1" fill="none"/>

    <ellipse cx="76" cy="116" rx="3" ry="0.85" fill="#a85820" opacity="0.55"/>
    <ellipse cx="84" cy="116" rx="3" ry="0.85" fill="#a85820" opacity="0.55"/>

    <path d="M 112 152 L 140 140" stroke="url(#gauntletT4)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 116 168 L 144 156" stroke="url(#gauntletT4)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="146" cy="138" rx="6" ry="4" fill="url(#gauntletT4)"/>
    <ellipse cx="148" cy="154" rx="6" ry="4" fill="url(#gauntletT4)"/>

    <rect x="146" y="132" width="40" height="14" rx="2" fill="url(#weaponBodyT4)"/>
    <rect x="146" y="146" width="40" height="6" rx="1" fill="url(#weaponBodyT4)"/>
    <rect x="178" y="138" width="14" height="11" rx="1" fill="url(#weaponBodyT4)"/>

    <line x1="146" y1="138" x2="190" y2="138" stroke="url(#crimsonChargedT4)" stroke-width="2" opacity="0.95"/>
    <line x1="146" y1="142" x2="190" y2="142" stroke="url(#crimsonChargedT4)" stroke-width="1.4" opacity="0.85"/>

    <circle cx="190" cy="140" r="6" fill="#fff088" opacity="0.95"/>
    <circle cx="190" cy="140" r="3" fill="#fff8d8" opacity="0.95"/>
  </g>

  <g filter="url(#trembleT4)">
    <ellipse cx="146" cy="138" rx="22" ry="6" fill="url(#gauntletT4)" opacity="0.32"/>
    <ellipse cx="148" cy="154" rx="22" ry="6" fill="url(#gauntletT4)" opacity="0.32"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowT4)">
    <circle cx="190" cy="140" r="14" fill="#fff088" opacity="0.62"/>
    <line x1="146" y1="140" x2="190" y2="140" stroke="#d83838" stroke-width="6" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowT4)">
    <circle cx="190" cy="140" r="32" fill="#d83838" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomT4)">
    <ellipse cx="80" cy="100" rx="40" ry="22" fill="#fff088" opacity="0.32"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="100" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="46" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#d83838" font-weight="700">"Now."</text>
  </g>
</svg>
