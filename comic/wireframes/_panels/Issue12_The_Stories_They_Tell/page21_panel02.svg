<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 21 Panel 2 — Theodore's face in candlelight, the first storyteller</title>
  <desc>Medium close-up. Victorian boy's face in candlelight — sandy-brown hair falling across forehead, hazel eyes focused downward on something he is writing, freckles across nose, oil stains at temple, brass gear ring on left index finger catching amber light at edge of frame. Quiet concentration and tenderness — boy putting words to something he doesn't fully understand but knows is true. Warm amber candlelight from below and to the right, strong shadows on the left side of face. The faintest trace of cool geometric light reflected on his cheek — already fading. Rembrandt chiaroscuro. The face of the first storyteller.</desc>
  <defs>
    <linearGradient id="bgJJ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="candleSourceJJ2" cx="0.85" cy="0.92" r="0.7">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#f4b860" stop-opacity="0.62"/>
      <stop offset="0.8" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairTheoJJ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.4" stop-color="#7a3818"/>
      <stop offset="0.8" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="faceTheoJJ2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.8" stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#fff8d8"/>
    </linearGradient>
    <radialGradient id="eyeTenderJJ2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassRingJJ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="emitterTraceJJ2" cx="0.18" cy="0.85" r="0.3">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#a878d8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomJJ2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowJJ2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowJJ2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgJJ2)"/>
  <rect width="247" height="280" fill="url(#candleSourceJJ2)"/>
  <rect width="247" height="280" fill="url(#emitterTraceJJ2)"/>

