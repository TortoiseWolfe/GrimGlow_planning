<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 8 Panel 1 — Thresh emerges into dawn, "I'm out. What did I miss?"</title>
  <desc>Medium shot. Tiny figure in degraded crimson armor emerges from dark Victorian basement stairwell into dawn light. Blinks, sudden brightness washing over pale face — copper-red buzz cut catching warm light, sweat and tension of basement still visible. Dead Titan device core clipped to kit. Stairwell behind dark. Light ahead warm amber dawn. Relief flooding over exhaustion — moment of just breathing. Crimson suit catches dawn light, holographic edge-lighting steadying.</desc>
  <defs>
    <linearGradient id="bgP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#fff8d8"/>
      <stop offset="0.7" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="dawnFloodP1" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stairDarkP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="stoneStairP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitThreshP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="0.8" stop-color="#3a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="hairBuzzP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="1" stop-color="#5a2810"/>
    </linearGradient>
    <linearGradient id="skinThreshP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#e8d8b8"/>
      <stop offset="0.7" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="coreDeadP1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="crimsonStableP1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomP1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowP1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowP1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgP1)"/>
  <rect width="366" height="240" fill="url(#dawnFloodP1)"/>

  <g>
    <rect x="40" y="60" width="100" height="180" fill="url(#stairDarkP1)"/>
    <rect x="40" y="60" width="6" height="180" fill="#080404"/>
    <rect x="134" y="60" width="6" height="180" fill="#080404"/>
    <rect x="40" y="60" width="100" height="6" fill="#080404"/>

    <rect x="46" y="80" width="88" height="14" fill="url(#stoneStairP1)" opacity="0.85"/>
    <rect x="46" y="100" width="88" height="14" fill="url(#stoneStairP1)" opacity="0.7"/>
    <rect x="46" y="120" width="88" height="14" fill="url(#stoneStairP1)" opacity="0.55"/>
    <rect x="46" y="140" width="88" height="14" fill="url(#stoneStairP1)" opacity="0.42"/>
    <rect x="46" y="160" width="88" height="80" fill="#020100" opacity="0.92"/>
    <line x1="46" y1="80" x2="134" y2="80" stroke="#080404" stroke-width="0.55"/>
    <line x1="46" y1="100" x2="134" y2="100" stroke="#080404" stroke-width="0.55"/>
    <line x1="46" y1="120" x2="134" y2="120" stroke="#080404" stroke-width="0.55"/>
    <line x1="46" y1="140" x2="134" y2="140" stroke="#080404" stroke-width="0.55"/>
  </g>

  <g>
    <rect x="0" y="200" width="366" height="40" fill="#a85820" opacity="0.62"/>
    <rect x="140" y="200" width="226" height="40" fill="#5a3018" opacity="0.85"/>
    <g opacity="0.62" stroke="#3a1808" stroke-width="0.55">
      <line x1="160" y1="220" x2="200" y2="220"/>
      <line x1="220" y1="220" x2="260" y2="220"/>
      <line x1="280" y1="220" x2="320" y2="220"/>
    </g>
  </g>

  <g>
    <ellipse cx="220" cy="220" rx="44" ry="9" fill="#040202" opacity="0.62"/>

    <ellipse cx="220" cy="160" rx="32" ry="44" fill="url(#suitThreshP1)"/>
    <path d="M 188 130 L 252 130 L 256 200 L 184 200 Z" fill="url(#suitThreshP1)"/>

    <path d="M 188 134 L 200 130 L 198 144 L 184 146 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 240 144 L 252 142 L 250 152 L 240 154 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 210 168 L 224 168 L 220 178 L 208 178 Z" fill="#1a0810" opacity="0.85"/>

    <line x1="188" y1="138" x2="252" y2="138" stroke="url(#crimsonStableP1)" stroke-width="1.4" opacity="0.95"/>
    <line x1="184" y1="184" x2="256" y2="184" stroke="url(#crimsonStableP1)" stroke-width="1.4" opacity="0.95"/>
    <line x1="184" y1="200" x2="256" y2="200" stroke="url(#crimsonStableP1)" stroke-width="1" opacity="0.85"/>

    <ellipse cx="220" cy="98" rx="22" ry="26" fill="url(#skinThreshP1)"/>
    <path d="M 198 84 Q 220 60 244 84 Q 244 96 244 100 L 196 100 Q 196 96 198 84 Z" fill="url(#hairBuzzP1)"/>
    <g opacity="0.7" stroke="#5a2810" stroke-width="0.4">
      <line x1="204" y1="74" x2="204" y2="94"/>
      <line x1="212" y1="70" x2="212" y2="94"/>
      <line x1="220" y1="68" x2="220" y2="94"/>
      <line x1="228" y1="70" x2="228" y2="94"/>
      <line x1="236" y1="74" x2="236" y2="94"/>
    </g>

    <ellipse cx="212" cy="104" rx="2.4" ry="2" fill="#0a0604"/>
    <circle cx="212.6" cy="103.4" r="0.62" fill="#fff8d8"/>
    <ellipse cx="228" cy="104" rx="2.4" ry="2" fill="#0a0604"/>
    <circle cx="228.6" cy="103.4" r="0.62" fill="#fff8d8"/>

    <path d="M 206 100 Q 212 98 218 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 222 100 Q 228 98 234 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 213 122 Q 220 122 227 122" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <ellipse cx="216" cy="116" rx="3" ry="0.85" fill="#a85820" opacity="0.55"/>
    <ellipse cx="224" cy="116" rx="3" ry="0.85" fill="#a85820" opacity="0.55"/>

    <ellipse cx="218" cy="92" rx="0.85" ry="0.55" fill="#a8c0e0" opacity="0.62"/>
    <ellipse cx="224" cy="86" rx="0.85" ry="0.55" fill="#a8c0e0" opacity="0.62"/>

    <path d="M 184 200 Q 174 210 168 220" stroke="url(#suitThreshP1)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 256 200 Q 266 210 272 220" stroke="url(#suitThreshP1)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <ellipse cx="166" cy="222" rx="6" ry="3" fill="#5a3018"/>
    <ellipse cx="274" cy="222" rx="6" ry="3" fill="#5a3018"/>

    <rect x="246" y="170" width="22" height="16" rx="2" fill="url(#coreDeadP1)" stroke="#5a3018" stroke-width="0.55"/>
    <line x1="246" y1="174" x2="268" y2="174" stroke="#3a1810" stroke-width="0.4"/>
    <circle cx="257" cy="178" r="1.4" fill="#3a1810" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowP1)">
    <ellipse cx="220" cy="160" rx="40" ry="50" fill="#d83838" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowP1)">
    <ellipse cx="220" cy="160" rx="80" ry="80" fill="#8a2520" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomP1)">
    <ellipse cx="220" cy="100" rx="40" ry="14" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="220" cy="232" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-weight="700">THRESH: "I'm out. What did I miss?"</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-style="italic" font-weight="700">SABLE: "Fifth device. Regroup at the exchange."</text>
  </g>
</svg>
