<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 5 Panel 2 — Thresh's hands, sixth disconnection, "Six down. One left."</title>
  <desc>Extreme close-up of gauntleted hands working on Titan device — crimson armored gloves, scarred, dented, fingers trembling visibly but executing precise disconnection. One interface point remains — thin dark tendril connecting device to pipe junction. Amber-black light almost gone, just faint pulse from final connection. Crimson holographic edge-lighting returns to hands, geometric patterns glowing along armor edges. Trembling fingers. Precision. One more.</desc>
  <defs>
    <linearGradient id="bgM2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="lastPulseM2" cx="0.5" cy="0.5" r="0.32">
      <stop offset="0" stop-color="#7a3818" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gauntletM2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="0.8" stop-color="#3a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="deviceShellM2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="crimsonReturnM2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="tendrilM2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85020" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomM2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowM2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowM2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
    <filter id="trembleM2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgM2)"/>
  <rect width="247" height="280" fill="url(#lastPulseM2)"/>

  <g>
    <path d="M 0 280 L 0 130 Q 14 110 30 100 L 80 96 Q 100 96 110 110 L 116 124 L 110 156 L 100 200 L 80 240 L 50 270 L 0 280 Z" fill="url(#gauntletM2)"/>

    <path d="M 247 280 L 247 130 Q 233 110 217 100 L 167 96 Q 147 96 137 110 L 131 124 L 137 156 L 147 200 L 167 240 L 197 270 L 247 280 Z" fill="url(#gauntletM2)"/>

    <path d="M 14 130 L 30 134 L 26 144 L 10 142 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 60 110 L 76 114 L 70 124 L 54 122 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 30 200 L 50 196 L 48 210 L 26 214 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 217 130 L 233 134 L 237 144 L 221 142 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 171 110 L 187 114 L 193 124 L 177 122 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 217 200 L 197 196 L 199 210 L 221 214 Z" fill="#1a0810" opacity="0.85"/>

    <line x1="0" y1="120" x2="116" y2="124" stroke="url(#crimsonReturnM2)" stroke-width="1.4" opacity="0.85"/>
    <line x1="247" y1="120" x2="131" y2="124" stroke="url(#crimsonReturnM2)" stroke-width="1.4" opacity="0.85"/>
    <line x1="0" y1="160" x2="116" y2="156" stroke="url(#crimsonReturnM2)" stroke-width="1" opacity="0.62"/>
    <line x1="247" y1="160" x2="131" y2="156" stroke="url(#crimsonReturnM2)" stroke-width="1" opacity="0.62"/>

