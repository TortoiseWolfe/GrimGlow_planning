    <ellipse cx="96" cy="100" rx="6" ry="11" fill="url(#gauntletM2)"/>
    <ellipse cx="106" cy="106" rx="5" ry="9" fill="url(#gauntletM2)"/>

    <ellipse cx="171" cy="100" rx="6" ry="11" fill="url(#gauntletM2)"/>
    <ellipse cx="161" cy="96" rx="6" ry="13" fill="url(#gauntletM2)"/>
    <ellipse cx="151" cy="100" rx="6" ry="11" fill="url(#gauntletM2)"/>
    <ellipse cx="141" cy="106" rx="5" ry="9" fill="url(#gauntletM2)"/>
  </g>

  <g filter="url(#trembleM2)">
    <ellipse cx="80" cy="100" rx="22" ry="14" fill="url(#gauntletM2)" opacity="0.32"/>
    <ellipse cx="167" cy="100" rx="22" ry="14" fill="url(#gauntletM2)" opacity="0.32"/>
  </g>

  <g>
    <rect x="80" y="140" width="86" height="80" fill="url(#deviceShellM2)"/>
    <rect x="80" y="140" width="86" height="6" fill="#3a1810" opacity="0.85"/>
    <rect x="80" y="214" width="86" height="6" fill="#3a1810" opacity="0.85"/>
    <line x1="80" y1="180" x2="166" y2="180" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="123" y1="140" x2="123" y2="220" stroke="#3a1810" stroke-width="0.55"/>

    <ellipse cx="123" cy="180" rx="22" ry="14" fill="url(#lastPulseM2)"/>
    <circle cx="123" cy="180" r="2" fill="#a85020" opacity="0.62"/>

    <line x1="123" y1="180" x2="123" y2="240" stroke="url(#tendrilM2)" stroke-width="2" opacity="0.85"/>
    <line x1="123" y1="180" x2="123" y2="240" stroke="#a85020" stroke-width="0.55" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#bloomM2)">
    <line x1="123" y1="180" x2="123" y2="240" stroke="#a85020" stroke-width="6" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowM2)">
    <line x1="0" y1="120" x2="116" y2="124" stroke="#d83838" stroke-width="3" opacity="0.42"/>
    <line x1="247" y1="120" x2="131" y2="124" stroke="#d83838" stroke-width="3" opacity="0.42"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowM2)">
    <ellipse cx="123" cy="120" rx="180" ry="22" fill="#d83838" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomM2)">
    <ellipse cx="123" cy="180" rx="40" ry="14" fill="#7a3818" opacity="0.32"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-style="italic" font-weight="700">THRESH: "Six down. One left. One more."</text>
  </g>
</svg>
