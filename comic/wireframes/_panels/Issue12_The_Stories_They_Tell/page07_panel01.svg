      <path d="M 200 210 Q 230 212 260 210 Q 290 208 320 210"/>
      <path d="M 360 210 Q 390 212 420 210 Q 450 208 480 210"/>
      <path d="M 520 210 Q 550 212 580 210"/>
      <path d="M 0 224 Q 30 226 60 224 Q 90 222 120 224"/>
      <path d="M 200 224 Q 230 226 260 224"/>
      <path d="M 400 224 Q 430 226 460 224"/>
