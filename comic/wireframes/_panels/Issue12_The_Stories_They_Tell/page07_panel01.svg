    <rect x="660" y="60" width="20" height="6" fill="#1a0a04"/>
    <rect x="662" y="68" width="16" height="100" fill="#080404"/>
  </g>

  <g opacity="0.85" filter="url(#bloomO1)">
    <rect x="80" y="40" width="582" height="22" fill="#fff8d8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="370" cy="220" rx="280" ry="3" fill="#040202" opacity="0.42"/>
