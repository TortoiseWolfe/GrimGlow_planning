    <line x1="360" y1="166" x2="362" y2="170" stroke="url(#titanSeamO1)" stroke-width="0.7"/>
    <line x1="324" y1="180" x2="356" y2="180" stroke="url(#titanSeamO1)" stroke-width="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessO1)">
    <rect x="318" y="160" width="44" height="40" fill="#a85020" opacity="0.32"/>
