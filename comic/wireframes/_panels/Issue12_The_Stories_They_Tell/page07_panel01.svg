    <circle cx="640" cy="180" r="1.4" fill="#d88838"/>

    <rect x="654" y="156" width="18" height="11" rx="1" fill="url(#brassPlateO1)"/>
    <text x="663" y="163" text-anchor="middle" font-family="Times New Roman, serif" font-size="2.4" fill="#1a0a04" font-weight="700">TELEGRAPH</text>
    <text x="663" y="166" text-anchor="middle" font-family="Times New Roman, serif" font-size="2.4" fill="#1a0a04" font-weight="700">EXCHANGE</text>
  </g>
  <g opacity="0.85" filter="url(#bloomO1)">
