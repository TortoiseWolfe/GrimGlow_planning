  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="380" height="36" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="184" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c0e0" font-weight="700">SABLE: "The fifth device is human-scaled."</text>
    <text x="184" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic">WREN: "I can talk someone through the disarm. But I can't do it myself."</text>
    <text x="184" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a8c0e0" font-style="italic" font-weight="700">SABLE: (Beat.) "Theodore."</text>
  </g>
</svg>
