    <rect x="324" y="170" width="32" height="20" fill="#0a0a14" opacity="0.85"/>
    <line x1="324" y1="180" x2="356" y2="180" stroke="#3a3848" stroke-width="0.55"/>
    <circle cx="350" cy="180" r="1" fill="#3a3848"/>

