    <line x1="450" y1="60" x2="450" y2="140" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="420" y1="100" x2="480" y2="100" stroke="#3a1808" stroke-width="0.7"/>

    <rect x="520" y="60" width="60" height="80" fill="#080404"/>
