  </g>

  <g>
    <line x1="80" y1="190" x2="100" y2="170" stroke="#d88838" stroke-width="0.55" opacity="0.62" stroke-dasharray="2,1"/>

    <rect x="20" y="100" width="60" height="60" rx="3" fill="none" stroke="#d88838" stroke-width="0.4" opacity="0.85"/>

    <text x="22" y="110" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">RELAY</text>

    <g opacity="0.85">
      <circle cx="32" cy="120" r="2" fill="none" stroke="#d88838" stroke-width="0.4"/>
      <circle cx="44" cy="120" r="2" fill="none" stroke="#d88838" stroke-width="0.4"/>
      <circle cx="56" cy="120" r="2" fill="none" stroke="#d88838" stroke-width="0.4"/>
      <circle cx="68" cy="120" r="2" fill="#d88838"/>
      <line x1="34" y1="120" x2="68" y2="120" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>
    </g>

    <g opacity="0.85" stroke="#d88838" stroke-width="0.4" fill="none">
      <path d="M 26 134 L 36 134"/>
      <path d="M 26 142 L 56 142"/>
      <path d="M 26 150 L 46 150"/>
      <text x="42" y="156" font-family="monospace" font-size="2.4" fill="#d88838">[2/7]</text>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowV4)">
    <rect x="20" y="100" width="60" height="60" fill="#d88838" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="266" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-style="italic" font-weight="700">JINK (quiet): "Come on, mate. You've got this."</text>
  </g>
