    <path d="M 71 192 L 89 192 L 91 218 L 69 218 Z" fill="url(#suitJinkV4)"/>

    <path d="M 71 192 L 89 192" stroke="#fff088" stroke-width="0.55" opacity="0.62"/>

    <ellipse cx="80" cy="180" rx="6" ry="9" fill="url(#skinJinkV4)"/>
    <path d="M 73 174 Q 80 168 87 174 Q 89 178 87 180 Q 84 174 80 176 Q 77 174 75 180 Q 73 178 73 174 Z" fill="url(#hairBlondeV4)"/>
    <ellipse cx="76" cy="180" rx="2" ry="3" fill="url(#hairBlondeV4)"/>
    <ellipse cx="84" cy="180" rx="2" ry="3" fill="url(#hairBlondeV4)"/>

    <circle cx="78" cy="180" r="0.7" fill="#0a0604"/>
    <circle cx="82" cy="180" r="0.7" fill="#0a0604"/>
    <path d="M 76 184 Q 80 186 84 184" stroke="#1a0a08" stroke-width="0.4" fill="none"/>

