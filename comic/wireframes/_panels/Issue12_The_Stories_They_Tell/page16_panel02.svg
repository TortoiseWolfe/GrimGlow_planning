  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="156" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-weight="700">LUMA: "Before we go back. Before we talk about next."</text>
    <text x="156" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-style="italic">"I've been mapping the patterns. Since 'STAY.'"</text>
    <text x="156" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a878d8" font-weight="700">"I know what we are."</text>
  </g>
