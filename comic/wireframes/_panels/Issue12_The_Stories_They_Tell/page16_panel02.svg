<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 16 Panel 2 — Luma steps forward, "I know what we are."</title>
  <desc>Medium wide. Five tiny figures on church steeple beams, one stepping forward — woman in degraded sapphire-violet suit, South Asian features, long braided hair with luminous filament, one cracked lens, the other scrolling data. She activates her scanner, blue-violet light warming up. The other four turn toward her — silver, copper, emerald, crimson — expressions shifting from post-mission relief to attention. The authority is in the evidence, not the rank. Blue-violet scanner glow brightening. Morning light through stone arches behind. The scientist with the answer.</desc>
