<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 15 Panel 4 — THE CHOICE — Theodore steadies Cribbage, Jink on his wrist, "I'll know."</title>
  <desc>Wide medium shot. Victorian boy of twelve crouches on a London pavement and gets an arm under a recovering middle-aged craftsman — the boy supporting his master, the power inverted, the one who dismissed him now leaning on him. On the boy's wrist stands a tiny figure in a degraded emerald suit, close to his ear, speaking only to him. Cribbage has ordinary eyes again and a trembling hand, still half-gone. Beyond them the morning street continues exactly as before — a horse-cart, a basket-woman, a far constable — none having seen any of it. The boy looks down the street toward home, not the shop, resolved and quiet and suddenly older. Full golden morning light, the same indifferent sun; Jink's emerald glow dim, present but not performing; no alien light on the humans.</desc>
  <defs>
    <linearGradient id="bgZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.42" stop-color="#fff8d8"/>
      <stop offset="0.72" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2838"/>
    </linearGradient>
    <radialGradient id="goldenMorningZ4" cx="0.42" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cobbleZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="buildingZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="faceWarmZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="hairTheoZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="0.8" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="hairBlondeZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="waistcoatZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="trousersZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="cribbageCoatZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.5" stop-color="#3a2c1c"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="suitJinkZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="pedestrianZ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <filter id="bloomZ4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowZ4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgZ4)"/>
  <rect width="742" height="240" fill="url(#goldenMorningZ4)"/>

  <!-- background buildings / oblivious city -->
  <g>
    <rect x="0" y="0" width="742" height="150" fill="url(#buildingZ4)" opacity="0.82"/>
    <g opacity="0.5" stroke="#3a1808" stroke-width="0.4">
      <line x1="0" y1="34" x2="742" y2="34"/>
      <line x1="0" y1="68" x2="742" y2="68"/>
      <line x1="0" y1="102" x2="742" y2="102"/>
    </g>
    <rect x="30" y="36" width="34" height="54" fill="#080404" opacity="0.82"/>
    <rect x="92" y="36" width="34" height="54" fill="#080404" opacity="0.82"/>
    <rect x="558" y="36" width="34" height="54" fill="#080404" opacity="0.82"/>
    <rect x="620" y="36" width="34" height="54" fill="#080404" opacity="0.82"/>
    <rect x="682" y="36" width="34" height="54" fill="#080404" opacity="0.82"/>
    <!-- shop front far right (away from home direction) -->
    <rect x="470" y="44" width="70" height="100" fill="#3a2010"/>
    <rect x="476" y="50" width="58" height="80" fill="#080404" opacity="0.82"/>
    <text x="505" y="92" text-anchor="middle" font-family="Times New Roman, serif" font-size="8" fill="#a87858" font-weight="700">SHOP</text>
    <rect x="0" y="150" width="742" height="14" fill="#1a0a04"/>
  </g>

  <!-- pavement / cobbles -->
  <g>
    <rect x="0" y="164" width="742" height="76" fill="url(#cobbleZ4)"/>
    <g opacity="0.6" stroke="#1a1018" stroke-width="0.5">
      <path d="M 0 186 Q 120 188 240 186 Q 360 184 480 186 Q 600 188 742 186"/>
      <path d="M 0 208 Q 120 210 240 208 Q 360 206 480 208 Q 600 210 742 208"/>
      <path d="M 0 228 Q 120 230 240 228 Q 360 226 480 228 Q 600 230 742 228"/>
    </g>
  </g>

  <!-- oblivious street: far constable, basket-woman, horse-cart -->
  <g opacity="0.6">
    <!-- far constable, far right, walking away -->
    <ellipse cx="668" cy="172" rx="8" ry="2" fill="#040202"/>
    <ellipse cx="668" cy="156" rx="5" ry="13" fill="url(#pedestrianZ4)"/>
    <ellipse cx="668" cy="142" rx="3.4" ry="4.6" fill="#2a1808"/>
    <path d="M 663 138 Q 668 134 673 138 Z" fill="#1a1008"/>

    <!-- basket-woman, mid-right -->
    <ellipse cx="592" cy="178" rx="11" ry="3" fill="#040202"/>
    <path d="M 583 178 L 601 178 L 597 144 L 587 144 Z" fill="url(#pedestrianZ4)"/>
    <ellipse cx="592" cy="138" rx="5" ry="6" fill="#2a1808"/>
    <ellipse cx="606" cy="160" rx="7" ry="4" fill="#7a4818" opacity="0.85"/>
    <path d="M 599 160 L 613 160 L 611 166 L 601 166 Z" fill="#5a3818"/>
  </g>

  <!-- horse-cart, left background, passing -->
  <g opacity="0.55">
    <ellipse cx="120" cy="180" rx="58" ry="6" fill="#040202"/>
    <rect x="96" y="150" width="62" height="24" rx="2" fill="#3a2410"/>
    <rect x="96" y="150" width="62" height="6" fill="#1a1008"/>
    <circle cx="108" cy="176" r="9" fill="none" stroke="#1a1008" stroke-width="2.4"/>
    <circle cx="146" cy="176" r="9" fill="none" stroke="#1a1008" stroke-width="2.4"/>
    <!-- horse -->
    <path d="M 60 168 Q 50 150 64 146 L 78 150 L 92 156 L 92 174 L 82 174 L 80 162 L 70 162 L 68 174 L 60 174 Z" fill="#2a1a0c"/>
    <path d="M 60 150 L 52 142 L 58 144 Z" fill="#1a1008"/>
  </g>

  <!-- CRIBBAGE: recovering master, leaning, seated low on the boy's arm -->
  <g>
    <ellipse cx="300" cy="234" rx="78" ry="9" fill="#040202" opacity="0.55"/>

    <!-- legs sprawled / sitting -->
    <path d="M 300 214 Q 350 222 388 218" stroke="url(#trousersZ4)" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 300 216 Q 268 224 240 222" stroke="url(#trousersZ4)" stroke-width="18" fill="none" stroke-linecap="round"/>

    <!-- torso, slumped, leaning toward boy (left) -->
    <path d="M 278 150 L 340 156 L 350 214 L 268 214 Z" fill="url(#cribbageCoatZ4)"/>
    <path d="M 300 156 L 320 158 L 322 210 L 304 210 Z" fill="url(#waistcoatZ4)" opacity="0.9"/>
    <circle cx="312" cy="174" r="1.6" fill="#1a1008"/>
    <circle cx="312" cy="186" r="1.6" fill="#1a1008"/>
    <circle cx="313" cy="198" r="1.6" fill="#1a1008"/>

    <!-- collar — NO dark vein anymore (recovered) -->
    <path d="M 296 150 L 330 154 L 326 164 L 300 162 Z" fill="#d8c8a8"/>

    <!-- trembling hand reaching weakly -->
    <path d="M 268 184 Q 250 196 244 210" stroke="url(#cribbageCoatZ4)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="244" cy="214" rx="7" ry="5" fill="url(#faceWarmZ4)"/>
    <path d="M 240 212 L 236 218 M 244 214 L 242 222 M 248 213 L 248 221" stroke="#a87858" stroke-width="1.4" stroke-linecap="round"/>
    <!-- tremble marks -->
    <path d="M 252 208 L 256 206 M 252 214 L 256 213 M 252 220 L 256 220" stroke="#5a3818" stroke-width="0.7" opacity="0.6"/>

    <!-- head, tilted, leaning on boy -->
    <ellipse cx="290" cy="120" rx="26" ry="30" fill="url(#faceWarmZ4)"/>
    <!-- thinning grey-brown hair -->
    <path d="M 266 110 Q 278 86 290 86 Q 304 86 316 110 Q 318 120 314 128 L 306 124 Q 290 100 290 100 Q 274 102 270 124 L 264 126 Q 262 118 266 110 Z" fill="#7a6850"/>
    <!-- loupe pushed up on brow (clockmaker) -->
    <ellipse cx="282" cy="100" rx="6" ry="6" fill="none" stroke="#5a3818" stroke-width="2"/>
    <ellipse cx="282" cy="100" rx="3.4" ry="3.4" fill="#2a1808" opacity="0.7"/>
    <!-- ORDINARY eyes again (recovered) — tired, brown, no iridescence -->
    <ellipse cx="281" cy="120" rx="4.6" ry="5.2" fill="#0a0604"/>
    <circle cx="281" cy="120" r="2.8" fill="#5a3018"/>
    <circle cx="282" cy="119" r="0.9" fill="#fff8d8"/>
    <ellipse cx="301" cy="121" rx="4.6" ry="5.2" fill="#0a0604"/>
    <circle cx="301" cy="121" r="2.8" fill="#5a3018"/>
    <circle cx="302" cy="120" r="0.9" fill="#fff8d8"/>
    <!-- heavy tired brows -->
    <path d="M 274 110 Q 281 106 288 110" stroke="#5a4838" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 294 111 Q 301 107 308 111" stroke="#5a4838" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- slack, dazed mouth -->
    <path d="M 280 138 Q 290 142 300 137" stroke="#5a3018" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- grey stubble shading -->
    <path d="M 274 132 Q 290 148 306 131" stroke="#7a6850" stroke-width="3" fill="none" opacity="0.4"/>
  </g>

  <!-- THEODORE: crouched behind/under Cribbage, supporting him, looking down street toward home (left) -->
  <g>
    <ellipse cx="180" cy="236" rx="86" ry="9" fill="#040202" opacity="0.55"/>

    <!-- crouched legs -->
    <path d="M 150 236 Q 138 222 134 210" stroke="url(#trousersZ4)" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 218 236 Q 226 220 222 208" stroke="url(#trousersZ4)" stroke-width="20" fill="none" stroke-linecap="round"/>

    <!-- torso leaning forward toward Cribbage -->
    <path d="M 138 142 L 206 138 L 232 210 L 130 214 Z" fill="url(#waistcoatZ4)"/>
    <line x1="172" y1="142" x2="184" y2="210" stroke="#1a0a08" stroke-width="0.85" opacity="0.5"/>
    <circle cx="174" cy="164" r="1.8" fill="#3a1808"/>
    <circle cx="176" cy="182" r="1.8" fill="#3a1808"/>
    <circle cx="178" cy="200" r="1.8" fill="#3a1808"/>
    <!-- shirt collar -->
    <path d="M 154 138 L 196 134 L 192 150 L 158 152 Z" fill="#fff8d8"/>

    <!-- supporting arm: reaching across, under Cribbage's back -->
    <path d="M 200 158 Q 250 150 300 168" stroke="url(#waistcoatZ4)" stroke-width="15" fill="none" stroke-linecap="round"/>
    <!-- forearm / sleeve roll -->
    <path d="M 264 162 Q 282 160 300 170" stroke="url(#faceWarmZ4)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <!-- near arm where Jink stands (wrist held up, close to ear) -->
    <path d="M 150 156 Q 134 142 132 122" stroke="url(#waistcoatZ4)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 132 130 Q 128 118 134 106" stroke="url(#faceWarmZ4)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <ellipse cx="136" cy="102" rx="6" ry="7" fill="url(#faceWarmZ4)"/>

    <!-- head, turned to look down street (toward left/home), resolved -->
    <ellipse cx="148" cy="92" rx="28" ry="33" fill="url(#faceWarmZ4)"/>
    <path d="M 120 78 Q 138 50 156 50 Q 176 50 192 80 Q 196 96 190 108 L 178 102 Q 156 64 148 62 Q 132 66 128 104 L 120 106 Q 116 90 120 78 Z" fill="url(#hairTheoZ4)"/>
    <path d="M 130 64 Q 148 56 168 64" stroke="#7a3818" stroke-width="1.6" fill="none" opacity="0.6"/>
    <path d="M 138 54 Q 156 48 172 56" stroke="#7a3818" stroke-width="1.6" fill="none" opacity="0.6"/>

    <!-- eyes looking left (down the street, toward home) -->
    <ellipse cx="132" cy="92" rx="5.4" ry="6.4" fill="#0a0604"/>
    <circle cx="130" cy="92" r="3.2" fill="#5a3018"/>
    <circle cx="129" cy="91" r="1" fill="#fff8d8"/>
    <ellipse cx="156" cy="93" rx="5.4" ry="6.4" fill="#0a0604"/>
    <circle cx="154" cy="93" r="3.2" fill="#5a3018"/>
    <circle cx="153" cy="92" r="1" fill="#fff8d8"/>
    <!-- resolved brows -->
    <path d="M 124 80 Q 132 76 142 80" stroke="#0a0604" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 148 81 Q 158 77 168 82" stroke="#0a0604" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- quiet, firm-set mouth -->
    <path d="M 138 112 Q 150 115 162 110" stroke="#0a0604" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="138" cy="106" rx="6" ry="2.4" fill="#a85820" opacity="0.5"/>
    <ellipse cx="160" cy="107" rx="6" ry="2.4" fill="#a85820" opacity="0.5"/>
  </g>

  <!-- JINK: tiny, on Theodore's raised wrist, near his ear, speaking only to him -->
  <g>
    <ellipse cx="136" cy="99" rx="2.6" ry="0.8" fill="#040202" opacity="0.5"/>
    <ellipse cx="136" cy="94" rx="4" ry="6" fill="url(#suitJinkZ4)"/>
    <path d="M 132 90 L 140 90 L 141 100 L 131 100 Z" fill="url(#suitJinkZ4)"/>
    <!-- head + curly blonde -->
    <ellipse cx="136" cy="85" rx="2.8" ry="3.4" fill="#a87858"/>
    <ellipse cx="133.6" cy="85" rx="1.4" ry="2" fill="url(#hairBlondeZ4)"/>
    <ellipse cx="138.4" cy="85" rx="1.4" ry="2" fill="url(#hairBlondeZ4)"/>
    <path d="M 133 81 Q 136 77 139 81 Q 140 84 138 86 Q 136 82 134 86 Q 132 84 133 81 Z" fill="url(#hairBlondeZ4)"/>
    <circle cx="135" cy="85" r="0.3" fill="#0a0604"/>
    <circle cx="137.4" cy="85" r="0.3" fill="#0a0604"/>
    <!-- one hand toward ear, leaning in to speak only to him -->
    <path d="M 140 90 Q 148 86 152 84" stroke="url(#suitJinkZ4)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 132 100 L 128 106 M 140 100 L 143 107" stroke="url(#suitJinkZ4)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- emerald glow: DIM, present but not performing -->
  <g opacity="0.3" filter="url(#bloomZ4)">
    <ellipse cx="136" cy="92" rx="8" ry="9" fill="#3a8858" opacity="0.3"/>
  </g>
  <g opacity="0.18" filter="url(#strongGlowZ4)">
    <ellipse cx="136" cy="92" rx="13" ry="13" fill="#3a8858" opacity="0.18"/>
  </g>

  <!-- warm morning haze band, indifferent sun -->
  <g opacity="0.55" filter="url(#bloomZ4)">
    <ellipse cx="320" cy="44" rx="300" ry="30" fill="#fff8d8" opacity="0.28"/>
  </g>

  <!-- DIALOGUE -->
  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="244" height="44" rx="3" fill="#f5ecd8" opacity="0.96" stroke="#3a2410" stroke-width="1.4"/>
    <text x="112" y="12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a2410" font-weight="700">THEODORE</text>
    <text x="112" y="24" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.4" fill="#3a2410" font-style="italic" font-weight="700">"I'm getting you home.</text>
    <text x="112" y="35" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.4" fill="#3a2410" font-style="italic" font-weight="700">Not the shop. Home."</text>
  </g>

  <g transform="translate(266,12)">
    <rect x="-6" y="0" width="246" height="44" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="114" y="12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#3a8858" font-weight="700">JINK (small, only Theodore hears)</text>
    <text x="114" y="24" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#e8f4ec" font-style="italic">"Nobody saw. Nobody'll ever</text>
    <text x="114" y="35" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#e8f4ec" font-style="italic">know it was you."</text>
  </g>

  <g transform="translate(560,12)">
    <rect x="-6" y="0" width="176" height="44" rx="3" fill="#f5ecd8" opacity="0.96" stroke="#3a2410" stroke-width="1.4"/>
    <text x="82" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a2410" font-weight="700">THEODORE</text>
    <text x="82" y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#3a2410" font-style="italic" font-weight="700">"I'll know."</text>
  </g>
</svg>
