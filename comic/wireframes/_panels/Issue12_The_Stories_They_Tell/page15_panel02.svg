<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 15 Panel 2 — Tactical display, all markers grey, "Operation complete."</title>
  <desc>Close-up holographic tactical display. Five device markers on miniature city map — all neutral grey. Dead. Network visualization shows no data flow, no connections, no amber-black light anywhere. Geometric timer stopped. Display steady — no pulsing, no urgency. Blue-white holographic light, clean and calm. Operation complete. The silence of success.</desc>
  <defs>
    <linearGradient id="bgZ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="calmHoloZ2" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameCalmZ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.5" stop-color="#5a78a8"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="deadMarkerZ2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8a8a8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5a5a5a" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomZ2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowZ2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowZ2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgZ2)"/>
  <rect width="247" height="280" fill="url(#calmHoloZ2)"/>

  <g>
    <rect x="14" y="14" width="219" height="252" rx="4" fill="none" stroke="url(#frameCalmZ2)" stroke-width="1.4" opacity="0.85"/>
    <rect x="20" y="20" width="207" height="240" fill="#0a0a14" opacity="0.85"/>

    <text x="30" y="36" font-family="monospace" font-size="4.4" fill="#3a8858" font-weight="700">► OPERATION COMPLETE ◄</text>
    <line x1="30" y1="42" x2="217" y2="42" stroke="#3a8858" stroke-width="0.55" opacity="0.62"/>

    <text x="30" y="58" font-family="monospace" font-size="3.4" fill="#a8c0e0">TIMER:</text>
    <text x="123" y="68" text-anchor="middle" font-family="monospace" font-size="14" fill="#7a7a7a" font-weight="700">00:00</text>
    <text x="30" y="80" font-family="monospace" font-size="3" fill="#a8c0e0">[STOPPED]</text>

    <line x1="30" y1="92" x2="217" y2="92" stroke="#5a78a8" stroke-width="0.55" opacity="0.62"/>

    <g opacity="0.42" stroke="#5a78a8" stroke-width="0.4" fill="none">
      <line x1="40" y1="120" x2="200" y2="120"/>
      <line x1="40" y1="160" x2="200" y2="160"/>
      <line x1="40" y1="200" x2="200" y2="200"/>
      <line x1="60" y1="110" x2="60" y2="220"/>
      <line x1="120" y1="110" x2="120" y2="220"/>
      <line x1="180" y1="110" x2="180" y2="220"/>
    </g>

    <g>
      <ellipse cx="60" cy="130" rx="9" ry="6" fill="url(#deadMarkerZ2)"/>
      <text x="60" y="148" text-anchor="middle" font-family="monospace" font-size="3" fill="#7a7a7a">A • DEAD</text>

      <ellipse cx="180" cy="130" rx="9" ry="6" fill="url(#deadMarkerZ2)"/>
      <text x="180" y="148" text-anchor="middle" font-family="monospace" font-size="3" fill="#7a7a7a">B • DEAD</text>

      <ellipse cx="60" cy="200" rx="9" ry="6" fill="url(#deadMarkerZ2)"/>
      <text x="60" y="218" text-anchor="middle" font-family="monospace" font-size="3" fill="#7a7a7a">C • DEAD</text>

      <ellipse cx="180" cy="200" rx="9" ry="6" fill="url(#deadMarkerZ2)"/>
      <text x="180" y="218" text-anchor="middle" font-family="monospace" font-size="3" fill="#7a7a7a">D • DEAD</text>

      <circle cx="120" cy="165" r="14" fill="url(#deadMarkerZ2)"/>
      <circle cx="120" cy="165" r="6" fill="#5a5a5a"/>
      <text x="120" y="190" text-anchor="middle" font-family="monospace" font-size="4" fill="#7a7a7a" font-weight="700">HUB • DEAD</text>
    </g>

    <text x="123" y="240" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#3a8858" font-weight="700">▼ NETWORK COLLAPSED ▼</text>
    <text x="123" y="252" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a8c0e0" font-style="italic">silence</text>
  </g>
  <g opacity="0.62" filter="url(#strongGlowZ2)">
    <rect x="14" y="14" width="219" height="252" fill="#a8c0e0" opacity="0.32"/>
  </g>
  <g opacity="0.32" filter="url(#bloomZ2)">
    <ellipse cx="60" cy="130" rx="14" ry="9" fill="#7a7a7a" opacity="0.32"/>
    <ellipse cx="180" cy="130" rx="14" ry="9" fill="#7a7a7a" opacity="0.32"/>
    <ellipse cx="60" cy="200" rx="14" ry="9" fill="#7a7a7a" opacity="0.32"/>
    <ellipse cx="180" cy="200" rx="14" ry="9" fill="#7a7a7a" opacity="0.32"/>
    <circle cx="120" cy="165" r="22" fill="#7a7a7a" opacity="0.32"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE (controlled): "All devices neutralized."</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-style="italic" font-weight="700">"Network collapsed. Operation complete."</text>
  </g>
</svg>
