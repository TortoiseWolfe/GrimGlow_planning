  </g>
  <g opacity="0.62" filter="url(#megaGlowN2)">
    <rect x="40" y="120" width="100" height="60" fill="#5a78a8" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomN2)">
    <ellipse cx="220" cy="170" rx="50" ry="22" fill="#a8c0e0" opacity="0.22"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="220" cy="262" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="340" height="36" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="166" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "Buffer shows constant comm — every device to every device."</text>
    <text x="166" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic" font-weight="700">"And with something else. A fifth node. Larger signal."</text>
    <text x="166" y="31" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c0e0" font-weight="700">SABLE: "A fifth device."</text>
  </g>
</svg>
