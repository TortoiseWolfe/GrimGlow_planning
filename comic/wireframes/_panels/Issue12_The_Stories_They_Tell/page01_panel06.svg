<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 280" width="246" height="280">
  <title>Issue 12 Page 1 Panel 6 — Theodore moving through morning street, "Theodore, moving. I know where to go."</title>
  <desc>Medium shot eye level street perspective. Victorian boy 12-13, lanky pre-teen, walks through early morning London street, hands in trouser pockets, looking straight ahead with quiet determination. Slight, untidy sandy-brown hair, hazel eyes, freckles. Collarless linen shirt with rolled sleeves, worn leather waistcoat too large, patched wool trousers. Oil-stained hands hidden, brass gear ring on left index finger barely visible. Looks like any working-class boy on early errand — ordinary, unremarkable. He is the giant. Early morning amber gaslight mixing with grey dawn.</desc>
