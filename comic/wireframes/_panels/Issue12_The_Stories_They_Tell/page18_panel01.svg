<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 12 Page 18 Panel 1 — SPLASH — Luma's constellation, "Before I show you any of this — you need to know I wanted it to be true. I'm the one who wanted to stay. Weigh everything against that. / Now. This is everything. Every glyph. Every trace. Every story. I've mapped them."</title>
  <desc>SPLASH wide. Interior of a Victorian church steeple transformed by Luma's holographic projection — a three-dimensional constellation of evidence fills the air in blue-violet structured light. Luminous nodes joined by glowing threads rotate slowly between the bell mechanism and the stone arches. Distinct nodes: geometric fairy glyphs, a miniature corroded wing-pack carved STAY (church cache), newspaper headlines TELEGRAPH DEMON / MYSTERIOUS LIGHTS, James Machen's pamphlet THE STORIES THEY TELL, Titan device locations in fading amber-black, a timeline of prior operative presence across centuries, and at center, glowing brightest, a holographic written page — the intersection of all threads. Five tiny figures in degraded department-colored suits stand within the constellation, inside the answer. The map of the paradox.</desc>
