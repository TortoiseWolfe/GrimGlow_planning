<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 18 Panel 1 — Luma delivers the thesis, "The mission is to be here."</title>
  <desc>Medium close-up. Tiny figure in degraded sapphire-violet suit at center of holographic constellation, beside glowing node — holographic representation of written page, text visible, brightest node in web. One hand raised, other holds scanner that trembles. Conviction held alongside doubt — honest scientist presenting thesis she cannot separate from desire for it to be true. Near her, holographic word STAY glows in geometric fairy script — ancient, luminous, carved into virtual brick. Blue-violet light from every direction. The answer.</desc>
  <defs>
    <linearGradient id="bgCC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.4" stop-color="#1a1028"/>
      <stop offset="0.8" stop-color="#080404"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="constellationCC1" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerNodeCC1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperCenterCC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d8c8a8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="suitLumaCC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.4" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="hairLumaCC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinLumaCC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="stayGlyphCC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#a878d8"/>
      <stop offset="1" stop-color="#5a38a8"/>
    </linearGradient>
    <linearGradient id="brickVirtualCC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.5" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <filter id="bloomCC1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowCC1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowCC1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowCC1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgCC1)"/>
  <rect width="366" height="280" fill="url(#constellationCC1)"/>

  <g opacity="0.55" stroke="#a878d8" stroke-width="0.55" fill="none" stroke-dasharray="2,2">
    <path d="M 60 60 Q 183 100 306 60"/>
    <path d="M 60 220 Q 183 240 306 220"/>
    <path d="M 30 140 Q 100 160 183 140"/>
    <path d="M 336 140 Q 270 160 183 140"/>
    <path d="M 100 80 L 183 140"/>
    <path d="M 266 80 L 183 140"/>
    <path d="M 100 220 L 183 140"/>
    <path d="M 266 220 L 183 140"/>
  </g>

  <g>
    <ellipse cx="280" cy="80" rx="22" ry="14" fill="url(#brickVirtualCC1)"/>
    <text x="280" y="78" text-anchor="middle" font-family="Times New Roman, serif" font-size="6" fill="url(#stayGlyphCC1)" font-weight="700">STAY</text>
    <line x1="262" y1="84" x2="298" y2="84" stroke="#a878d8" stroke-width="0.55" opacity="0.62"/>
    <g opacity="0.62" stroke="#a878d8" stroke-width="0.4">
      <line x1="262" y1="74" x2="298" y2="74"/>
      <line x1="270" y1="68" x2="270" y2="80"/>
      <line x1="290" y1="68" x2="290" y2="80"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowCC1)">
    <ellipse cx="280" cy="80" rx="32" ry="22" fill="#a878d8" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowCC1)">
    <ellipse cx="280" cy="80" rx="50" ry="32" fill="#7848b8" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="183" cy="140" rx="50" ry="60" fill="url(#centerNodeCC1)"/>
    <rect x="155" y="100" width="56" height="80" rx="3" fill="url(#paperCenterCC1)" opacity="0.92"/>
    <text x="183" y="118" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#1a0a04" font-weight="700">THE STORIES</text>
    <text x="183" y="128" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#1a0a04" font-weight="700">THEY TELL</text>
    <line x1="160" y1="134" x2="206" y2="134" stroke="#3a2010" stroke-width="0.4"/>
    <text x="183" y="146" text-anchor="middle" font-family="Times New Roman, serif" font-size="3" fill="#3a2010" font-style="italic">— J. Machen</text>
    <line x1="160" y1="152" x2="206" y2="152" stroke="#3a2010" stroke-width="0.4"/>
    <g opacity="0.55" stroke="#3a2010" stroke-width="0.4">
      <line x1="160" y1="160" x2="206" y2="160"/>
      <line x1="160" y1="166" x2="206" y2="166"/>
      <line x1="160" y1="172" x2="200" y2="172"/>
    </g>
  </g>
  <g opacity="0.95" filter="url(#strongGlowCC1)">
    <ellipse cx="183" cy="140" rx="60" ry="70" fill="#fff8d8" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowCC1)">
    <ellipse cx="183" cy="140" rx="100" ry="120" fill="#a878d8" opacity="0.42"/>
  </g>
  <g opacity="0.42" filter="url(#ultraGlowCC1)">
    <ellipse cx="183" cy="140" rx="180" ry="180" fill="#7848b8" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="80" cy="240" rx="22" ry="3" fill="#040202" opacity="0.62"/>

    <ellipse cx="80" cy="200" rx="22" ry="32" fill="url(#suitLumaCC1)"/>
    <path d="M 58 170 L 102 170 L 106 240 L 56 240 Z" fill="url(#suitLumaCC1)"/>

    <ellipse cx="80" cy="140" rx="22" ry="26" fill="url(#skinLumaCC1)"/>
    <path d="M 58 126 Q 80 104 104 126 Q 110 136 108 142 L 104 140 Q 90 126 80 128 Q 70 126 58 140 L 56 140 Q 54 136 58 126 Z" fill="url(#hairLumaCC1)"/>

    <ellipse cx="69" cy="145" rx="6" ry="4" fill="#5a38a8"/>
    <ellipse cx="69" cy="145" rx="4" ry="3" fill="#1a1028"/>
    <line x1="64" y1="140" x2="74" y2="148" stroke="#d88838" stroke-width="0.55" opacity="0.85"/>
    <circle cx="69" cy="145" r="2" fill="#080404"/>

    <ellipse cx="91" cy="145" rx="6" ry="4" fill="#a878d8"/>
    <ellipse cx="91" cy="145" rx="4" ry="3" fill="#1a1028"/>
    <circle cx="91" cy="145" r="2" fill="#080404"/>
    <circle cx="92" cy="144" r="0.7" fill="#a878d8"/>

    <path d="M 72 156 Q 80 158 88 156" stroke="#1a0a08" stroke-width="0.55" fill="none"/>
    <path d="M 76 164 Q 80 166 84 164" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 102 178 L 130 160" stroke="url(#skinLumaCC1)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="132" cy="158" rx="6" ry="3" fill="url(#skinLumaCC1)"/>
    <rect x="128" y="150" width="14" height="14" rx="2" fill="#1a1028"/>
    <ellipse cx="135" cy="156" rx="3" ry="2" fill="#a878d8"/>
    <line x1="128" y1="153" x2="135" y2="158" stroke="#fff8d8" stroke-width="0.4" opacity="0.62"/>

    <path d="M 58 178 L 30 160" stroke="url(#skinLumaCC1)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="28" cy="158" rx="6" ry="3" fill="url(#skinLumaCC1)"/>
  </g>
  <g opacity="0.85" filter="url(#bloomCC1)">
    <ellipse cx="80" cy="200" rx="32" ry="40" fill="#7848b8" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#strongGlowCC1)">
    <rect x="128" y="150" width="14" height="14" fill="#a878d8" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="262" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="48" rx="3" fill="#1a1828" opacity="0.95" stroke="#7848b8" stroke-width="1.4"/>
    <text x="156" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-weight="700">LUMA: "The convergence point isn't technological."</text>
    <text x="156" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-style="italic">"It's narrative. The mission isn't to change an event."</text>
    <text x="156" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a878d8" font-weight="700">"The mission is to be here. To be the fairies."</text>
    <text x="156" y="40" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a878d8" font-style="italic" font-weight="700">"That's what 'STAY' means."</text>
  </g>
</svg>
