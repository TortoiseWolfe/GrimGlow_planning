<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 240" width="247" height="240">
  <title>Issue 12 Page 9 Panel 3 — Jink in sharp dive, "I'm coming, Thresh. Hold on."</title>
  <desc>Medium shot. Tiny figure in degraded emerald suit folds holographic dragonfly wings into combat dive, dropping sharply toward dark basement stairwell entrance below. Emerald-green prismatic trails tear air behind, bright against morning sky. Wild golden blonde curly hair streaming, expression is fear and determination — no grin, no quip, scout diving to save someone. Stairwell mouth below dark. Sky above bright morning blue. Light into dark. The dive.</desc>
  <defs>
    <linearGradient id="bgS3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="0.7" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="skyAboveS3" cx="0.5" cy="0.05" r="0.4">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="darkBelowS3" cx="0.5" cy="0.92" r="0.42">
      <stop offset="0" stop-color="#040206" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#1a1018" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3a2838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopS3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="stairMouthS3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="suitJinkS3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeS3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="trailDiveS3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#fff088" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a8858" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomS3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowS3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowS3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
    <filter id="ultraGlowS3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="247" height="240" fill="url(#bgS3)"/>
  <rect width="247" height="240" fill="url(#skyAboveS3)"/>
  <rect width="247" height="240" fill="url(#darkBelowS3)"/>

  <g opacity="0.42">
    <circle cx="60" cy="20" r="0.4" fill="#fff8d8"/>
    <circle cx="180" cy="14" r="0.55" fill="#fff8d8"/>
  </g>

  <g>
    <path d="M 0 160 L 60 156 L 130 160 L 200 156 L 247 160 L 247 200 L 0 200 Z" fill="url(#rooftopS3)" opacity="0.92"/>

    <rect x="80" y="170" width="80" height="70" fill="url(#stairMouthS3)"/>
    <path d="M 80 170 L 100 178 L 100 230 L 80 240 Z" fill="#040206"/>
    <path d="M 160 170 L 140 178 L 140 230 L 160 240 Z" fill="#040206"/>
    <path d="M 100 178 L 140 178 L 130 240 L 110 240 Z" fill="#020100"/>

    <g opacity="0.55">
      <line x1="80" y1="170" x2="160" y2="170" stroke="#080404" stroke-width="0.85"/>
      <line x1="100" y1="178" x2="140" y2="178" stroke="#080404" stroke-width="0.55"/>
    </g>
  </g>

  <g>
    <path d="M 200 30 Q 180 50 160 80 Q 140 110 120 140 Q 110 160 120 180" stroke="url(#trailDiveS3)" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 200 30 Q 180 50 160 80 Q 140 110 120 140 Q 110 160 120 180" stroke="url(#trailDiveS3)" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 200 30 Q 180 50 160 80 Q 140 110 120 140 Q 110 160 120 180" stroke="#fff088" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowS3)">
    <path d="M 200 30 Q 180 50 160 80 Q 140 110 120 140 Q 110 160 120 180" stroke="#3a8858" stroke-width="40" fill="none" stroke-linecap="round" opacity="0.42"/>
  </g>
  <g opacity="0.42" filter="url(#ultraGlowS3)">
    <path d="M 200 30 Q 180 50 160 80 Q 140 110 120 140 Q 110 160 120 180" stroke="#3a8858" stroke-width="60" fill="none" stroke-linecap="round" opacity="0.32"/>
  </g>

  <g transform="rotate(60 120 160)">
    <ellipse cx="120" cy="160" rx="14" ry="9" fill="url(#suitJinkS3)"/>
    <path d="M 108 158 Q 96 150 88 156 Q 96 166 108 162 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 132 158 Q 144 150 152 156 Q 144 166 132 162 Z" fill="#3a8858" opacity="0.85"/>

    <ellipse cx="120" cy="156" rx="6" ry="5" fill="#a87858"/>
    <path d="M 116 152 Q 120 144 124 150 Q 124 154 124 156 L 116 156 Q 116 154 116 152 Z" fill="url(#hairBlondeS3)"/>
    <path d="M 120 154 L 110 144" stroke="url(#hairBlondeS3)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 122 154 L 130 144" stroke="url(#hairBlondeS3)" stroke-width="2" fill="none" stroke-linecap="round"/>

    <circle cx="118" cy="156" r="0.55" fill="#0a0604"/>
    <circle cx="122" cy="156" r="0.55" fill="#0a0604"/>
    <path d="M 118 162 L 122 162" stroke="#1a0a08" stroke-width="0.4"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowS3)">
    <circle cx="120" cy="160" r="14" fill="#3a8858" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowS3)">
    <circle cx="120" cy="160" r="32" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <line x1="60" y1="100" x2="200" y2="100" stroke="#080404" stroke-width="0.55"/>
    <line x1="80" y1="120" x2="180" y2="120" stroke="#080404" stroke-width="0.55"/>
    <rect x="40" y="140" width="6" height="20" fill="#080404"/>
    <rect x="200" y="140" width="6" height="20" fill="#080404"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-style="italic" font-weight="700">JINK: "I'm coming, Thresh. Hold on."</text>
  </g>
</svg>
