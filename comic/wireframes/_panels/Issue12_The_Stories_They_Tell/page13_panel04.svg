<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 280" width="246" height="280">
  <title>Issue 12 Page 13 Panel 4 — Fifth node disconnects, "It kicked. I held it."</title>
  <desc>Extreme close-up. Boy's fingers grip dark crystalline node — amber-black light surging through contact, illuminating edges of oil-stained fingers, burn scar, gear ring. Light pulses intensely for a moment — node resisting, kicking. Fingers do not let go. Node being rotated and extracted. Amber-black light dying in grip. Extraction clean. The hand that held.</desc>
