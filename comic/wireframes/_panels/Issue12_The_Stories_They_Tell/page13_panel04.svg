      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="crystalCoreX4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff088" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="bloomX4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowX4" x="-25%" y="-25%" width="150%" height="150%">
