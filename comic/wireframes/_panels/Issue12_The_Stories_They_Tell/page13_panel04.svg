      <stop offset="0.5" stop-color="#0a0604"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="surgeFlashX4" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinFingerX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingX4" x1="0" y1="0" x2="0" y2="1">
