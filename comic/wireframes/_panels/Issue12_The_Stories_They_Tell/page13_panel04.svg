<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 280" width="246" height="280">
  <title>Issue 12 Page 13 Panel 4 — Sixth node free, hand reaches for the anchor, "I trust them."</title>
  <desc>Close-up. Oil-stained, burn-scarred fingers with a brass gear-ring have just rotated the sixth dark crystalline node free — it sits inert among extracted nodes on the cabinet floor. The same hand reaches deeper into the cast-iron telegraph cabinet toward the device core, where the seventh node — the anchor — still glows with a faint last ember of amber-black light. A copper-gold holographic guide arrow points true to the target. Morning light dominant now; the alien retreating, the ordinary returning. The technique mastered, reaching for the last one.</desc>
  <defs>
    <linearGradient id="bgY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a221a"/>
      <stop offset="0.45" stop-color="#171010"/>
      <stop offset="1" stop-color="#080605"/>
    </linearGradient>
    <radialGradient id="morningY4" cx="0.72" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#fff0c8" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#d8b078" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#080605" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emberY4" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff088" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#a85020" stop-opacity="0.78"/>
      <stop offset="0.7" stop-color="#3a1810" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#080605" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0d0"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a07050"/>
      <stop offset="1" stop-color="#523414"/>
    </linearGradient>
    <linearGradient id="skinDarkY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89868"/>
      <stop offset="0.6" stop-color="#8a5e3e"/>
      <stop offset="1" stop-color="#3a2410"/>
    </linearGradient>
    <linearGradient id="brassY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="ironY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3632"/>
      <stop offset="0.5" stop-color="#1e1a18"/>
      <stop offset="1" stop-color="#0c0a0a"/>
    </linearGradient>
    <radialGradient id="anchorCoreY4" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fff088" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#c86828" stop-opacity="0.82"/>
      <stop offset="0.7" stop-color="#5a2810" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#1a0e08" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="deadNodeY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3340"/>
      <stop offset="0.5" stop-color="#241e2a"/>
      <stop offset="1" stop-color="#100a12"/>
    </linearGradient>
    <filter id="bloomY4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowY4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
    <filter id="guideGlowY4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="246" height="280" fill="url(#bgY4)"/>
  <rect width="246" height="280" fill="url(#morningY4)"/>

  <!-- cast-iron telegraph exchange cabinet interior -->
  <g>
    <path d="M 0 84 L 246 84 L 246 280 L 0 280 Z" fill="url(#ironY4)"/>
    <path d="M 18 84 L 18 280" stroke="#0a0808" stroke-width="2.4" opacity="0.6"/>
    <path d="M 228 84 L 228 280" stroke="#0a0808" stroke-width="2.4" opacity="0.6"/>
    <path d="M 18 110 L 228 110" stroke="#0a0808" stroke-width="1.6" opacity="0.5"/>
    <path d="M 18 110 L 228 110" stroke="#4a443e" stroke-width="0.5" opacity="0.5"/>
    <!-- rivets along the iron frame -->
    <g fill="#4a443e" opacity="0.6">
      <circle cx="10" cy="96" r="1.6"/><circle cx="10" cy="150" r="1.6"/>
      <circle cx="10" cy="208" r="1.6"/><circle cx="236" cy="96" r="1.6"/>
      <circle cx="236" cy="150" r="1.6"/><circle cx="236" cy="208" r="1.6"/>
    </g>
    <!-- disconnected wiring tangled at the device core -->
    <g stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M 150 130 Q 180 150 196 188" stroke="#5a3a20" stroke-width="2"/>
      <path d="M 160 124 Q 198 140 214 176" stroke="#3a4a3a" stroke-width="1.6"/>
      <path d="M 144 142 Q 176 170 184 214" stroke="#4a3018" stroke-width="1.6"/>
      <path d="M 168 132 Q 206 158 210 206" stroke="#2a2a3a" stroke-width="1.4"/>
    </g>
  </g>

  <!-- row of extracted dead nodes resting on cabinet floor -->
  <g>
    <g transform="translate(34,236) rotate(-12)">
      <path d="M -8 -6 L 8 -6 L 11 0 L 8 6 L -8 6 L -11 0 Z" fill="url(#deadNodeY4)"/>
      <line x1="-8" y1="-6" x2="8" y2="6" stroke="#3a3340" stroke-width="0.5"/>
    </g>
    <g transform="translate(64,242) rotate(8)">
      <path d="M -7 -5 L 7 -5 L 10 0 L 7 5 L -7 5 L -10 0 Z" fill="url(#deadNodeY4)"/>
      <line x1="7" y1="-5" x2="-7" y2="5" stroke="#3a3340" stroke-width="0.5"/>
    </g>
    <g transform="translate(96,248) rotate(-6)">
      <path d="M -8 -6 L 8 -6 L 11 0 L 8 6 L -8 6 L -11 0 Z" fill="url(#deadNodeY4)"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#3a3340" stroke-width="0.5"/>
    </g>
    <!-- the freshly-freed SIXTH node, slightly apart, last faint dimming -->
    <g transform="translate(130,250) rotate(14)">
      <path d="M -8 -6 L 8 -6 L 11 0 L 8 6 L -8 6 L -11 0 Z" fill="url(#deadNodeY4)"/>
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#a85020" opacity="0.28"/>
      <line x1="-8" y1="-6" x2="8" y2="6" stroke="#5a4838" stroke-width="0.5"/>
    </g>
    <g opacity="0.3" filter="url(#bloomY4)">
      <ellipse cx="130" cy="250" rx="14" ry="9" fill="#a85020" opacity="0.4"/>
    </g>
  </g>

  <!-- ANCHOR node (seventh) deep in the core, faint last ember -->
  <g opacity="0.5" filter="url(#megaGlowY4)">
    <ellipse cx="186" cy="160" rx="42" ry="42" fill="#a85020" opacity="0.42"/>
  </g>
  <g opacity="0.65" filter="url(#strongGlowY4)">
    <ellipse cx="186" cy="160" rx="24" ry="24" fill="#fff088" opacity="0.5"/>
  </g>
  <rect x="160" y="138" width="52" height="52" fill="url(#emberY4)" opacity="0.9"/>
  <g>
    <path d="M 172 160 L 186 142 L 200 160 L 186 178 Z" fill="url(#anchorCoreY4)"/>
    <path d="M 172 160 L 186 142 L 186 160 Z" fill="#fff8d8" opacity="0.5"/>
    <path d="M 186 160 L 200 160 L 186 178 Z" fill="#3a1810" opacity="0.55"/>
    <line x1="186" y1="142" x2="186" y2="178" stroke="#fff088" stroke-width="0.6"/>
    <line x1="172" y1="160" x2="200" y2="160" stroke="#fff8d8" stroke-width="0.5"/>
    <ellipse cx="186" cy="160" rx="4" ry="4" fill="#fff088" opacity="0.85"/>
  </g>

  <!-- copper-gold holographic guide arrow pointing to the anchor -->
  <g opacity="0.9">
    <g opacity="0.7" filter="url(#guideGlowY4)" stroke="#ffc868" stroke-width="2" fill="none">
      <path d="M 96 118 L 168 152"/>
    </g>
    <path d="M 96 118 L 168 152" stroke="#ffd888" stroke-width="1.1" fill="none"/>
    <path d="M 168 152 L 158 148 M 168 152 L 162 142" stroke="#ffd888" stroke-width="1.1" fill="none"/>
    <!-- geometric guide reticle around target -->
    <g stroke="#ffc868" stroke-width="0.7" fill="none" opacity="0.85">
      <path d="M 186 138 L 178 138 M 186 138 L 186 146"/>
      <path d="M 186 182 L 194 182 M 186 182 L 186 174"/>
      <path d="M 164 160 L 164 152 M 208 160 L 208 168"/>
    </g>
    <circle cx="186" cy="160" r="20" fill="none" stroke="#ffc868" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- the hand: oil-stained fingers reaching deeper toward the core -->
  <g>
    <!-- back of hand / wrist entering from lower-left -->
    <path d="M -6 280 L -6 196 Q 6 168 36 152 L 70 138 Q 96 130 120 132 L 150 142 Q 162 148 166 160 L 158 168 Q 140 158 120 156 L 92 158 Q 70 162 54 178 L 34 204 Q 20 232 22 280 Z" fill="url(#skinY4)"/>
    <!-- index finger reaching to the anchor -->
    <path d="M 118 134 Q 140 138 156 150 L 166 160 Q 168 166 162 170 L 150 168 Q 134 156 116 154 L 108 152 Q 104 144 110 138 Z" fill="url(#skinY4)"/>
    <!-- second finger, slightly behind -->
    <path d="M 96 142 Q 120 144 140 156 L 150 166 Q 150 172 144 174 L 132 170 Q 116 160 98 160 L 88 160 Q 84 152 90 146 Z" fill="url(#skinDarkY4)" opacity="0.92"/>
    <!-- thumb wrapping near base -->
    <path d="M 30 168 Q 48 156 70 154 L 86 158 Q 90 164 84 170 L 66 174 Q 48 178 38 192 Q 30 184 30 168 Z" fill="url(#skinDarkY4)"/>
    <!-- knuckle shading -->
    <path d="M 70 150 Q 90 146 110 148" stroke="#7a4830" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 60 162 Q 80 158 96 160" stroke="#7a4830" stroke-width="0.8" fill="none" opacity="0.45"/>
  </g>

  <!-- oil stains, burn scar, gear ring on the reaching hand -->
  <g>
    <ellipse cx="48" cy="200" rx="10" ry="6" fill="#3a2410" opacity="0.5"/>
    <ellipse cx="86" cy="184" rx="6" ry="4" fill="#3a2410" opacity="0.45"/>
    <ellipse cx="20" cy="232" rx="9" ry="5" fill="#2a1808" opacity="0.5"/>
    <!-- burn scar across the index finger -->
    <path d="M 124 142 Q 134 144 142 150" stroke="#b86848" stroke-width="1.4" fill="none" opacity="0.6"/>
    <path d="M 124 142 Q 134 144 142 150" stroke="#7a4030" stroke-width="0.5" fill="none" opacity="0.5"/>
    <!-- brass gear-ring on the second finger -->
    <ellipse cx="112" cy="151" rx="6" ry="4" fill="url(#brassY4)"/>
    <ellipse cx="112" cy="151" rx="2.6" ry="1.8" fill="#3a1a08"/>
    <g stroke="#5a2e10" stroke-width="0.35">
      <line x1="106" y1="151" x2="118" y2="151"/>
      <line x1="112" y1="147" x2="112" y2="155"/>
      <line x1="108" y1="148" x2="116" y2="154"/>
      <line x1="116" y1="148" x2="108" y2="154"/>
    </g>
    <g opacity="0.6" filter="url(#bloomY4)">
      <ellipse cx="112" cy="151" rx="9" ry="6" fill="#fff8d8" opacity="0.4"/>
    </g>
  </g>

  <!-- ember light falling on the fingertips reaching in -->
  <g opacity="0.55" filter="url(#bloomY4)">
    <ellipse cx="158" cy="160" rx="16" ry="11" fill="#fff088" opacity="0.4"/>
  </g>

  <!-- Theodore's face at the side of frame: calm, no fear -->
  <g opacity="0.92">
    <path d="M -10 30 Q 10 26 26 40 L 34 64 Q 36 84 28 102 L 18 118 Q 6 128 -10 130 Z" fill="url(#skinY4)" opacity="0.95"/>
    <!-- hazel eye, calm -->
    <ellipse cx="16" cy="70" rx="5.5" ry="3" fill="#fff8f0"/>
    <ellipse cx="17" cy="70" rx="2.4" ry="2.4" fill="#7a5a30"/>
    <ellipse cx="17" cy="70" rx="1" ry="1" fill="#1a1008"/>
    <path d="M 8 64 Q 16 61 24 64" stroke="#3a2410" stroke-width="1" fill="none"/>
    <!-- brow relaxed, slight set mouth of concentration -->
    <path d="M 6 92 Q 16 95 26 91" stroke="#7a4830" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- tousled hair edge -->
    <path d="M -10 30 Q 6 22 24 34 L 22 42 Q 8 32 -10 40 Z" fill="#3a2812"/>
    <!-- morning light catching the cheek -->
    <ellipse cx="24" cy="78" rx="6" ry="14" fill="#fff0c8" opacity="0.22"/>
  </g>

  <!-- floor shadow / depth at base -->
  <g opacity="0.6">
    <ellipse cx="123" cy="276" rx="110" ry="4" fill="#040202" opacity="0.42"/>
  </g>

  <!-- dialogue caption boxes -->
  <g transform="translate(8,10)">
    <rect x="-4" y="0" width="200" height="30" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="96" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-weight="700">THEODORE: "Sixth. One more."</text>
    <text x="96" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a85820" font-style="italic" font-weight="700">WREN: "The last node is the anchor — when it comes</text>
    <text x="96" y="26" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a85820" font-style="italic" font-weight="700">free, the device powers down permanently."</text>
  </g>
  <g transform="translate(40,232)">
    <rect x="-4" y="0" width="200" height="30" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="96" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#3a2410" font-weight="700">THEODORE: "I feel it. The anchor. It's deeper</text>
    <text x="96" y="16" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#3a2410" font-weight="700">than the others."</text>
    <text x="96" y="24" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#a85820" font-style="italic" font-weight="700">WREN: "Trust your hands." THEODORE: "I trust them."</text>
  </g>
</svg>
