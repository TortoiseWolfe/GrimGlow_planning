<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 6 Panel 4 — The network schematic, the fifth node revealed, "It's human-scaled."</title>
  <desc>Close-up holographic display — copper-gold schematic of telegraph network projected from wrist scanner. Four node points at perimeter neutral grey — neutralized. At center, fifth node pulses with sickly amber-black light, larger than others, connected to all four by geometric data-flow lines. Network architecture is clear — four satellites fed into central hub. Hub is active. Hub knows. Copper-gold light contrasts with amber-black pulse. Display fills panel — the problem visualized.</desc>
  <defs>
    <linearGradient id="bgN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="0.5" stop-color="#0a0604"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="copperFieldN4" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubAmberBlackN4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="dataLineN4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a7a7a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7a7a7a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomN4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowN4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowN4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wrongnessN4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgN4)"/>
  <rect width="366" height="280" fill="url(#copperFieldN4)"/>

  <g>
    <rect x="20" y="20" width="326" height="240" rx="3" fill="none" stroke="url(#frameN4)" stroke-width="1.4" opacity="0.85"/>
    <rect x="26" y="26" width="314" height="228" rx="2" fill="none" stroke="url(#frameN4)" stroke-width="0.55" opacity="0.62"/>

    <text x="40" y="40" font-family="monospace" font-size="5.4" fill="#d88838" font-weight="700">NETWORK ANALYSIS</text>
    <text x="280" y="40" font-family="monospace" font-size="4" fill="#d88838">[ALERT]</text>
    <line x1="40" y1="44" x2="326" y2="44" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>

    <g opacity="0.85" stroke="#7a7a7a" stroke-width="2" fill="none">
      <line x1="80" y1="100" x2="183" y2="160"/>
      <line x1="286" y1="100" x2="183" y2="160"/>
      <line x1="80" y1="220" x2="183" y2="160"/>
      <line x1="286" y1="220" x2="183" y2="160"/>
    </g>

    <g opacity="0.85" fill="none" stroke="url(#dataLineN4)" stroke-width="0.85" stroke-dasharray="3,2">
      <line x1="80" y1="100" x2="183" y2="160"/>
      <line x1="286" y1="100" x2="183" y2="160"/>
      <line x1="80" y1="220" x2="183" y2="160"/>
      <line x1="286" y1="220" x2="183" y2="160"/>
    </g>

    <g>
      <circle cx="80" cy="100" r="11" fill="#1a2030"/>
      <circle cx="80" cy="100" r="6" fill="#7a7a7a"/>
      <circle cx="80" cy="100" r="3" fill="#a8a8a8"/>
      <text x="80" y="124" text-anchor="middle" font-family="monospace" font-size="4" fill="#7a7a7a">ALPHA</text>

      <circle cx="286" cy="100" r="11" fill="#1a2030"/>
      <circle cx="286" cy="100" r="6" fill="#7a7a7a"/>
      <circle cx="286" cy="100" r="3" fill="#a8a8a8"/>
      <text x="286" y="124" text-anchor="middle" font-family="monospace" font-size="4" fill="#7a7a7a">BRAVO</text>

      <circle cx="80" cy="220" r="11" fill="#1a2030"/>
      <circle cx="80" cy="220" r="6" fill="#7a7a7a"/>
      <circle cx="80" cy="220" r="3" fill="#a8a8a8"/>
      <text x="80" y="244" text-anchor="middle" font-family="monospace" font-size="4" fill="#7a7a7a">CHARLIE</text>

      <circle cx="286" cy="220" r="11" fill="#1a2030"/>
      <circle cx="286" cy="220" r="6" fill="#7a7a7a"/>
      <circle cx="286" cy="220" r="3" fill="#a8a8a8"/>
      <text x="286" y="244" text-anchor="middle" font-family="monospace" font-size="4" fill="#7a7a7a">DELTA</text>
    </g>

    <g>
      <circle cx="183" cy="160" r="32" fill="#1a0810"/>
      <circle cx="183" cy="160" r="22" fill="url(#hubAmberBlackN4)"/>
      <circle cx="183" cy="160" r="14" fill="#a85020" opacity="0.85"/>
      <circle cx="183" cy="160" r="6" fill="#fff8d8" opacity="0.62"/>
      <line x1="167" y1="148" x2="199" y2="172" stroke="#3a1810" stroke-width="0.85"/>
      <line x1="199" y1="148" x2="167" y2="172" stroke="#3a1810" stroke-width="0.85"/>

      <text x="183" y="200" text-anchor="middle" font-family="monospace" font-size="6" fill="#a85020" font-weight="700">[ HUB ]</text>
      <text x="183" y="208" text-anchor="middle" font-family="monospace" font-size="4" fill="#a85020">BARTHOLOMEW LANE</text>
      <text x="183" y="214" text-anchor="middle" font-family="monospace" font-size="4" fill="#a85020">HUMAN-SCALED</text>
    </g>
  </g>
  <g opacity="0.85" filter="url(#wrongnessN4)">
    <circle cx="183" cy="160" r="40" fill="#a85020" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessN4)">
    <circle cx="183" cy="160" r="80" fill="#3a1810" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowN4)">
    <rect x="20" y="20" width="326" height="240" fill="#d88838" opacity="0.22"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowN4)">
    <circle cx="183" cy="160" r="60" fill="#a85020" opacity="0.42"/>
  </g>

  <g transform="translate(8,260)">
    <rect x="-4" y="0" width="350" height="20" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="171" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "It's human-scaled. Full-sized. None of us can reach the internals."</text>
    <text x="171" y="17" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-style="italic">SABLE: (Silence.)</text>
  </g>
</svg>
