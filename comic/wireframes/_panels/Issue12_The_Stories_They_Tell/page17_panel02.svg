<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 17 Panel 2 — Luma traces glyph to cache, "They chose to stay."</title>
  <desc>Medium close-up. Tiny figure in degraded sapphire-violet suit stands within holographic constellation, one hand extended, tracing glowing thread between two luminous nodes — fairy glyphs and miniature model of church cache. South Asian features, dark long braided hair with luminous filament, one cracked lens, the other scrolling data. Scientific rigor — presenting evidence, not argument. Thread brightens at her touch. Blue-violet light on her face and hands. The evidence speaking.</desc>
  <defs>
    <linearGradient id="bgBB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.5" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetSpaceBB2" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitLumaBB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.4" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="hairLumaBB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinLumaBB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="glyphNodeBB2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5a38a8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cacheNodeBB2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5a38a8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brightThreadBB2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomBB2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowBB2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowBB2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgBB2)"/>
  <rect width="366" height="240" fill="url(#violetSpaceBB2)"/>

  <g>
    <ellipse cx="60" cy="80" rx="32" ry="22" fill="url(#glyphNodeBB2)"/>
    <text x="60" y="74" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff8d8" font-weight="700">∇⊥◊⊥∢⊕</text>
    <text x="60" y="82" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff8d8">⊥◊∇⊥∢</text>
    <text x="60" y="90" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff8d8">⊕Δ◊⊥</text>
    <text x="60" y="108" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">FAIRY GLYPHS</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowBB2)">
    <ellipse cx="60" cy="80" rx="40" ry="30" fill="#7848b8" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="306" cy="160" rx="32" ry="22" fill="url(#cacheNodeBB2)"/>
    <ellipse cx="300" cy="160" rx="14" ry="6" fill="#5a4858"/>
    <path d="M 290 156 Q 306 152 320 156" stroke="#a878d8" stroke-width="0.55" fill="none"/>
    <text x="306" y="172" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#fff8d8" font-weight="700">STAY</text>
    <text x="306" y="190" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">CHURCH CACHE</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowBB2)">
    <ellipse cx="306" cy="160" rx="40" ry="30" fill="#7848b8" opacity="0.42"/>
  </g>

  <g>
    <line x1="80" y1="100" x2="280" y2="155" stroke="url(#brightThreadBB2)" stroke-width="3" opacity="0.95"/>
    <line x1="80" y1="100" x2="280" y2="155" stroke="#fff8d8" stroke-width="0.85" opacity="0.95"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowBB2)">
    <line x1="80" y1="100" x2="280" y2="155" stroke="#a878d8" stroke-width="9" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowBB2)">
    <line x1="80" y1="100" x2="280" y2="155" stroke="#a878d8" stroke-width="22" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="183" cy="200" rx="22" ry="3" fill="#040202" opacity="0.62"/>

    <ellipse cx="183" cy="160" rx="22" ry="32" fill="url(#suitLumaBB2)"/>
    <path d="M 161 130 L 205 130 L 209 200 L 159 200 Z" fill="url(#suitLumaBB2)"/>

    <ellipse cx="183" cy="100" rx="22" ry="26" fill="url(#skinLumaBB2)"/>
    <path d="M 161 86 Q 183 64 207 86 Q 213 96 211 102 L 207 100 Q 193 86 183 88 Q 173 86 161 100 L 159 100 Q 157 96 161 86 Z" fill="url(#hairLumaBB2)"/>

    <ellipse cx="172" cy="105" rx="6" ry="4" fill="#5a38a8"/>
    <ellipse cx="172" cy="105" rx="4" ry="3" fill="#1a1028"/>
    <line x1="167" y1="100" x2="177" y2="108" stroke="#d88838" stroke-width="0.55" opacity="0.85"/>
    <circle cx="172" cy="105" r="2" fill="#080404"/>
    <circle cx="173" cy="104" r="0.7" fill="#5a38a8"/>

    <ellipse cx="194" cy="105" rx="6" ry="4" fill="#a878d8"/>
    <ellipse cx="194" cy="105" rx="4" ry="3" fill="#1a1028"/>
    <circle cx="194" cy="105" r="2" fill="#080404"/>
    <circle cx="195" cy="104" r="0.7" fill="#a878d8"/>
    <text x="198" y="108" font-family="monospace" font-size="2" fill="#a878d8" opacity="0.85">∇⊥◊</text>

    <path d="M 175 116 Q 183 118 191 116" stroke="#1a0a08" stroke-width="0.55" fill="none"/>
    <path d="M 179 124 Q 183 126 187 124" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 205 138 L 230 130 L 250 122 L 270 116" stroke="url(#skinLumaBB2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="272" cy="114" rx="6" ry="3" fill="url(#skinLumaBB2)"/>
    <circle cx="280" cy="155" r="3" fill="#fff8d8"/>
  </g>
  <g opacity="0.85" filter="url(#bloomBB2)">
    <circle cx="280" cy="155" r="9" fill="#fff8d8" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#bloomBB2)">
    <ellipse cx="183" cy="160" rx="32" ry="40" fill="#7848b8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="220" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="280" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="136" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-weight="700">LUMA: "Prior operatives — at least three deployments."</text>
    <text x="136" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-style="italic">"Each one carved glyphs. Each one stayed."</text>
    <text x="136" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-weight="700">"They didn't fail to leave. They chose to stay."</text>
  </g>
</svg>
