    <rect x="428" y="148" width="6" height="14" fill="url(#paperMM1)" opacity="0.92"/>
    <rect x="430" y="142" width="3" height="8" fill="#080404"/>
    <ellipse cx="431" cy="142" rx="2" ry="3" fill="url(#candleFlameMM1)"/>
    <circle cx="431" cy="141" r="0.85" fill="#fff8d8"/>

    <ellipse cx="431" cy="148" rx="3" ry="1" fill="#a85820" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowMM1)">
    <circle cx="431" cy="142" r="6" fill="#fff8d8" opacity="0.55"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowMM1)">
    <circle cx="431" cy="142" r="14" fill="#f4b860" opacity="0.42"/>
  </g>
  <g opacity="0.32" filter="url(#megaGlowMM1)">
    <circle cx="431" cy="142" r="32" fill="#f4b860" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="540" cy="240" rx="60" ry="6" fill="#040202" opacity="0.62"/>

    <ellipse cx="540" cy="200" rx="40" ry="40" fill="url(#waistcoatMM1)"/>
    <path d="M 504 168 L 576 168 L 580 240 L 500 240 Z" fill="url(#waistcoatMM1)"/>
    <line x1="540" y1="172" x2="540" y2="240" stroke="#1a0a08" stroke-width="0.55" opacity="0.62"/>

