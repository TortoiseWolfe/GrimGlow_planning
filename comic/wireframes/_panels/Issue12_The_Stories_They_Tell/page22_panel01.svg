<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 22 Panel 1 — Theodore writing all night, dawn approaching</title>
  <desc>Medium wide shot. Victorian boy sits at workbench in cramped workshop, writing in journal by light of candle that has burned low — wax pooled, flame smaller, pool of warm amber light narrower than before. Pen moves steadily. Journal pages filling — earlier pages visible, covered in careful handwriting. Fairy artifacts on bench dark now — holographic emitter no longer glows, miniature tool lost among shadows, scrap of suit material indistinguishable from soot around it. Through window behind, first grey of approaching dawn lightens horizon beyond chimney silhouettes. Has been writing all night. Fairy light gone. Candle remains. Story grows.</desc>
  <defs>
    <linearGradient id="bgMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.4" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="candleLowMM1" cx="0.62" cy="0.45" r="0.4">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="#a85820" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawnGreyMM1" cx="0.15" cy="0.4" r="0.32">
      <stop offset="0" stop-color="#7a8898" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="benchMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="paperMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#f4e8c8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="candleFlameMM1" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#fff088"/>
      <stop offset="0.8" stop-color="#d88838"/>
      <stop offset="1" stop-color="#a85020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairTheoMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="waistcoatMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="shirtMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#e8d8b8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="skinTheoMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="dawnHorizonMM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <filter id="bloomMM1" x="-20%" y="-20%" width="140%" height="140%">
