    <line x1="284" y1="202" x2="376" y2="202" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="284" y1="210" x2="376" y2="210" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="284" y1="218" x2="370" y2="218" stroke="#3a2010" stroke-width="0.4"/>
  </g>

  <g>
