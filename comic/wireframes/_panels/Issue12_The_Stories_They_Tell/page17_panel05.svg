<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 17 Panel 5 — Jink's realization, "We're not stuck here. We're needed here."</title>
  <desc>Medium shot. Tiny figure in degraded emerald suit stands in holographic constellation, looking at luminous threads connecting their own presence — sighting reports, boy's stories, published mythology — with new expression. Not the reckless grin. Not the scared determination. Understanding. The scout who loved the adventure seeing that the adventure was always the point. Wild golden blonde curly hair catches blue-violet light. Emerald accents glow. The threads brighten. The purpose found.</desc>
  <defs>
    <linearGradient id="bgBB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetEmeraldBB5" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a8858" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitJinkBB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeBB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="skinJinkBB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <radialGradient id="theoNodeBB5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85020" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="storyNodeBB5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brightThreadBB5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fff088" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomBB5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowBB5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowBB5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgBB5)"/>
  <rect width="366" height="240" fill="url(#violetEmeraldBB5)"/>

  <g>
    <ellipse cx="60" cy="60" rx="28" ry="20" fill="url(#theoNodeBB5)"/>
    <circle cx="60" cy="58" r="9" fill="#a87858" opacity="0.85"/>
    <path d="M 51 50 Q 60 42 69 50" stroke="#a85020" stroke-width="0.55"/>
    <text x="60" y="88" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#fff8d8" font-style="italic">THEODORE</text>

    <ellipse cx="306" cy="60" rx="28" ry="20" fill="url(#storyNodeBB5)"/>
    <text x="306" y="56" text-anchor="middle" font-family="Times New Roman, serif" font-size="3" fill="#fff8d8" font-style="italic">"there were</text>
    <text x="306" y="62" text-anchor="middle" font-family="Times New Roman, serif" font-size="3" fill="#fff8d8" font-style="italic">fairies, and..."</text>
    <text x="306" y="88" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">STORIES</text>

    <ellipse cx="60" cy="180" rx="28" ry="20" fill="url(#storyNodeBB5)"/>
    <rect x="46" y="170" width="28" height="20" fill="#fff8d8" opacity="0.62"/>
    <line x1="50" y1="174" x2="70" y2="174" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="50" y1="180" x2="70" y2="180" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="50" y1="186" x2="65" y2="186" stroke="#3a2010" stroke-width="0.4"/>
    <text x="60" y="208" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">PUBLISHED</text>

    <ellipse cx="306" cy="180" rx="28" ry="20" fill="url(#storyNodeBB5)"/>
    <text x="306" y="184" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#fff8d8" font-style="italic">SIGHTINGS</text>
    <text x="306" y="208" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">REPORTS</text>
  </g>
  <g opacity="0.62" filter="url(#strongGlowBB5)">
    <ellipse cx="60" cy="60" rx="40" ry="30" fill="#a85020" opacity="0.42"/>
    <ellipse cx="306" cy="60" rx="40" ry="30" fill="#a878d8" opacity="0.42"/>
    <ellipse cx="60" cy="180" rx="40" ry="30" fill="#a878d8" opacity="0.42"/>
    <ellipse cx="306" cy="180" rx="40" ry="30" fill="#a878d8" opacity="0.42"/>
  </g>

  <g>
    <line x1="80" y1="80" x2="183" y2="160" stroke="url(#brightThreadBB5)" stroke-width="2" opacity="0.95"/>
    <line x1="286" y1="80" x2="183" y2="160" stroke="url(#brightThreadBB5)" stroke-width="2" opacity="0.95"/>
    <line x1="80" y1="170" x2="183" y2="160" stroke="url(#brightThreadBB5)" stroke-width="2" opacity="0.95"/>
    <line x1="286" y1="170" x2="183" y2="160" stroke="url(#brightThreadBB5)" stroke-width="2" opacity="0.95"/>
    <line x1="60" y1="80" x2="306" y2="60" stroke="url(#brightThreadBB5)" stroke-width="1.4" opacity="0.85"/>
    <line x1="60" y1="180" x2="306" y2="180" stroke="url(#brightThreadBB5)" stroke-width="1.4" opacity="0.85"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowBB5)">
    <line x1="80" y1="80" x2="183" y2="160" stroke="#3a8858" stroke-width="9" opacity="0.55"/>
    <line x1="286" y1="80" x2="183" y2="160" stroke="#3a8858" stroke-width="9" opacity="0.55"/>
    <line x1="80" y1="170" x2="183" y2="160" stroke="#a878d8" stroke-width="9" opacity="0.55"/>
    <line x1="286" y1="170" x2="183" y2="160" stroke="#a878d8" stroke-width="9" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="183" cy="200" rx="22" ry="3" fill="#040202" opacity="0.62"/>

    <ellipse cx="183" cy="160" rx="22" ry="32" fill="url(#suitJinkBB5)"/>
    <path d="M 161 132 L 205 132 L 209 200 L 159 200 Z" fill="url(#suitJinkBB5)"/>

    <ellipse cx="183" cy="100" rx="22" ry="26" fill="url(#skinJinkBB5)"/>
    <path d="M 161 86 Q 178 64 211 70 Q 220 96 215 110 Q 200 88 184 90 Q 168 92 162 110 Q 156 100 161 86 Z" fill="url(#hairBlondeBB5)"/>
    <ellipse cx="173" cy="100" rx="3" ry="5" fill="url(#hairBlondeBB5)"/>
    <ellipse cx="193" cy="100" rx="3" ry="5" fill="url(#hairBlondeBB5)"/>

    <ellipse cx="174" cy="106" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="175" cy="105" r="0.85" fill="#a87838"/>
    <ellipse cx="192" cy="106" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="193" cy="105" r="0.85" fill="#a87838"/>

    <path d="M 168 102 Q 174 100 180 102" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 186 102 Q 192 100 198 102" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 168 120 Q 175 124 183 122 Q 191 124 198 120 Q 198 130 191 132 Q 183 132 175 132 Q 168 130 168 120 Z" fill="#1a0604"/>
    <path d="M 174 124 L 192 124" stroke="#fff8d8" stroke-width="0.85" stroke-linecap="round"/>
  </g>
  <g opacity="0.85" filter="url(#bloomBB5)">
    <ellipse cx="183" cy="160" rx="32" ry="40" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="220" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="156" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#3a8858" font-weight="700">JINK: "So we're not stuck here."</text>
    <text x="156" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#3a8858" font-style="italic" font-weight="700">"We're needed here."</text>
  </g>
</svg>
