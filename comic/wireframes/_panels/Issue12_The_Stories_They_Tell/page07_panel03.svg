    <ellipse cx="123" cy="138" rx="14" ry="16" fill="url(#skinTheoO3)"/>
    <path d="M 109 124 Q 123 110 140 124 Q 142 134 140 138 L 106 138 Q 106 134 109 124 Z" fill="url(#hairTheoO3)"/>
    <path d="M 113 122 Q 120 116 128 118" stroke="#7a3818" stroke-width="0.85" fill="none" opacity="0.7"/>
    <path d="M 132 116 Q 138 118 142 124" stroke="#7a3818" stroke-width="0.85" fill="none" opacity="0.7"/>

    <ellipse cx="118" cy="140" rx="1.4" ry="2" fill="#0a0604"/>
    <circle cx="118.4" cy="139.6" r="0.4" fill="#a87838"/>
    <ellipse cx="128" cy="140" rx="1.4" ry="2" fill="#0a0604"/>
    <circle cx="128.4" cy="139.6" r="0.4" fill="#a87838"/>

    <path d="M 114 136 Q 118 134 122 136" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 124 136 Q 128 134 132 136" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 119 152 L 127 152" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <ellipse cx="120" cy="146" rx="2" ry="0.85" fill="#a85820" opacity="0.42"/>
    <ellipse cx="126" cy="146" rx="2" ry="0.85" fill="#a85820" opacity="0.42"/>
  </g>

  <g opacity="0.62" filter="url(#strongGlowO3)">
    <circle cx="140" cy="218" r="6" fill="#a8c0e0" opacity="0.42"/>
  </g>
  <g opacity="0.85" filter="url(#bloomO3)">
    <circle cx="148" cy="206" r="5" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g opacity="0.55">
    <line x1="40" y1="200" x2="60" y2="200" stroke="#a8c0e0" stroke-width="0.4" stroke-dasharray="2,2"/>
    <line x1="200" y1="200" x2="220" y2="200" stroke="#a8c0e0" stroke-width="0.4" stroke-dasharray="2,2"/>
    <path d="M 60 200 L 70 198 L 65 196 Z" fill="#a8c0e0" opacity="0.55"/>
