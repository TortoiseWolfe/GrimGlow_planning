      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="cabinetIronQ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3848"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="titanShimmerQ3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1810" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hairTheoQ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
