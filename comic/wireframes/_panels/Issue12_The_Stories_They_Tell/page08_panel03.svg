    <line x1="304" y1="194" x2="336" y2="194" stroke="url(#titanShimmerQ3)" stroke-width="0.55"/>
    <line x1="300" y1="220" x2="340" y2="220" stroke="url(#titanShimmerQ3)" stroke-width="0.55"/>
  </g>
  <g opacity="0.42" filter="url(#wrongnessQ3)">
