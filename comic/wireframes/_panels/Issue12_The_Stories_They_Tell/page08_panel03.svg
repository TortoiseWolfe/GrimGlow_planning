    <text x="150" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#3a2410" font-weight="700">THEODORE (low): "I'm here. I see it."</text>
    <text x="150" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#5a6478" font-style="italic" font-weight="700">SABLE: "Wait for Jink. Relay first, then open."</text>
