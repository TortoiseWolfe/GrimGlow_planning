    <path d="M 116 220 Q 122 230 126 244" stroke="url(#trousersQ3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="74" cy="246" rx="3" ry="1" fill="#0a0404"/>
    <ellipse cx="128" cy="246" rx="3" ry="1" fill="#0a0404"/>

