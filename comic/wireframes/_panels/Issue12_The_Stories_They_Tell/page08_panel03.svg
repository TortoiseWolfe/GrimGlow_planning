<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 12 Page 8 Panel 3 — Theodore at the cabinet, "I'm here. I see it. There's people about."</title>
  <desc>Wide. Victorian London street in morning light — Bartholomew Lane. Cast-iron telegraph exchange cabinet on pavement, roughly waist-height, access panel visible. Pedestrians pass, paying no attention. Slight Victorian boy approaches from left, hands in pockets, trying to look casual — sandy-brown hair, worn waistcoat, patched trousers. Cabinet has barely visible shimmer at seams — faint amber-black pulse, invisible to passersby. The ordinary world. The extraordinary thing hidden in it. Full morning light, warm amber-gold, busy street.</desc>
