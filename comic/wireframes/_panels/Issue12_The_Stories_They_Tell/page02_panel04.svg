<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 2 Panel 4 — Theodore's hand cupping the comm bead, "I'm near the exchange. Waiting for the mark."</title>
  <desc>Extreme close-up of boy's hand — oil-stained fingers, small burn scar on one knuckle, brass gear ring on left index finger. Hand curled protectively around small holographic communication bead concealed in palm — bead projects faint blue-white geometric glyph into cupped fingers, barely visible, hidden from world. Hand belongs to Victorian working-class boy — oil stains and calluses tell the story. Early morning grey-amber light on skin. Holographic bead is faintest blue-white glow, point of the future hidden in the past. Concealment and trust.</desc>
  <defs>
    <linearGradient id="bgJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="amberMorningJ4" cx="0.5" cy="0.7" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="palmTheoJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d8b8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="fingerCuffJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#e8d8b8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="beadGlyphJ4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#5a78a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassRingJ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <filter id="bloomJ4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowJ4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowJ4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgJ4)"/>
  <rect width="247" height="280" fill="url(#amberMorningJ4)"/>

  <g>
