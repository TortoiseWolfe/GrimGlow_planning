    <path d="M 130 92 L 200 90 Q 220 92 240 100 L 240 116 Q 200 110 130 112 Z" fill="url(#palmTheoJ4)" opacity="0.85"/>
    <path d="M 30 130 L 90 124 Q 120 122 150 128 L 154 140 Q 100 138 30 144 Z" fill="url(#palmTheoJ4)" opacity="0.85"/>
    <path d="M 30 170 L 90 164 Q 120 162 150 168 L 154 180 Q 100 178 30 184 Z" fill="url(#palmTheoJ4)" opacity="0.85"/>

    <line x1="30" y1="100" x2="240" y2="116" stroke="#7a4830" stroke-width="0.4" opacity="0.42"/>
    <line x1="30" y1="140" x2="154" y2="140" stroke="#7a4830" stroke-width="0.4" opacity="0.42"/>
    <line x1="30" y1="180" x2="154" y2="180" stroke="#7a4830" stroke-width="0.4" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="270" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-style="italic" font-weight="700">THEODORE: "I'm near the exchange."</text>
  </g>
</svg>
