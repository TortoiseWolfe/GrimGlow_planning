    <line x1="109" y1="60" x2="121" y2="60" stroke="#5a2e10" stroke-width="0.7"/>
    <line x1="115" y1="55" x2="115" y2="65" stroke="#5a2e10" stroke-width="0.55"/>

    <path d="M 90 56 Q 110 50 130 54 L 134 64 Q 110 62 92 66 Z" fill="url(#fingerCuffJ4)" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowJ4)">
