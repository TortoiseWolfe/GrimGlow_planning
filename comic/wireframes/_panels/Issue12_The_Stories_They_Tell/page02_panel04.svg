    <path d="M 50 130 Q 100 124 150 126 Q 200 130 230 140" stroke="#7a4830" stroke-width="0.55" fill="none" opacity="0.55"/>
    <path d="M 40 170 Q 100 164 160 166 Q 210 170 230 180" stroke="#7a4830" stroke-width="0.55" fill="none" opacity="0.55"/>

    <ellipse cx="60" cy="160" rx="6" ry="3" fill="#5a3018" opacity="0.62"/>
    <ellipse cx="140" cy="180" rx="9" ry="3" fill="#5a3018" opacity="0.62"/>
    <ellipse cx="200" cy="200" rx="6" ry="3" fill="#5a3018" opacity="0.62"/>
    <ellipse cx="100" cy="120" rx="3" ry="1.4" fill="#5a3018" opacity="0.62"/>

    <path d="M 80 100 L 90 92 L 96 96 L 88 104 Z" fill="#a85820" opacity="0.7"/>

