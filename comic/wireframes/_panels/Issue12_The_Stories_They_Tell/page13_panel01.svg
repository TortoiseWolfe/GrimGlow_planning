<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 13 Panel 1 — Theodore's POV inside the cabinet, "Like a gear that's been running hot."</title>
  <desc>Medium wide over-the-shoulder POV. Boy's perspective looking into open cast-iron telegraph exchange cabinet. Oil-stained hands work inside among brass telegraph wiring, junction blocks, relay mechanisms. Among Victorian copper and brass, Titan device — dark, angular, alien — has seven crystalline nodes embedded at connection points. Three nodes pulled free and set aside, dark and inert. Four remain, pulsing with faint amber-black light. Copper-gold holographic projection beside right hand — rotating disarm diagram with arrows and pressure indicators. Hands steady among the alien and familiar.</desc>
  <defs>
    <linearGradient id="bgW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="amberFadingW1" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperGuideW1" cx="0.85" cy="0.55" r="0.32">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="morningEdgeW1" cx="0.05" cy="0.05" r="0.32">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinetIntW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="brassWireW1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="copperWireW1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="hubShellW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="liveNodeW1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deadNodeW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="skinHandW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <filter id="bloomW1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowW1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowW1" x="-30%" y="-30%" width="160%" height="160%">
