    <line x1="546" y1="95" x2="694" y2="95" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>

    <g stroke="#d88838" stroke-width="0.55" fill="none">
      <circle cx="580" cy="120" r="14"/>
      <circle cx="580" cy="120" r="6"/>
      <line x1="580" y1="106" x2="580" y2="120"/>
      <path d="M 575 108 L 580 104 L 585 108" fill="none"/>
      <text x="580" y="146" text-anchor="middle" font-family="monospace" font-size="3" fill="#d88838">¼ TURN CCW</text>
    </g>

    <g stroke="#d88838" stroke-width="0.55" fill="none">
      <line x1="610" y1="120" x2="630" y2="120"/>
      <path d="M 626 116 L 630 120 L 626 124" fill="none"/>
    </g>

    <g stroke="#d88838" stroke-width="0.55" fill="none">
      <rect x="640" y="106" width="22" height="22" rx="2"/>
      <line x1="660" y1="120" x2="680" y2="120"/>
      <path d="M 676 116 L 680 120 L 676 124" fill="none"/>
      <text x="650" y="146" text-anchor="middle" font-family="monospace" font-size="3" fill="#d88838">PULL</text>
    </g>

    <text x="620" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">► WARM TO TOUCH ◄</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowW1)">
    <rect x="540" y="80" width="160" height="100" fill="#d88838" opacity="0.32"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowW1)">
    <rect x="540" y="80" width="160" height="100" fill="#a85820" opacity="0.32"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="380" height="36" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="184" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "Fourth node. Reach past the relay coil."</text>
    <text x="184" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic">"Feel for the crystalline edge. It'll be warm."</text>
    <text x="184" y="31" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-weight="700">THEODORE: "Like a gear that's been running hot."</text>
