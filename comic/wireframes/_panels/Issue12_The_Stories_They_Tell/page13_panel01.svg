    <circle cx="391" cy="151" r="3" fill="#a85020"/>

    <rect x="420" y="140" width="22" height="22" fill="url(#liveNodeW1)" stroke="#3a1810" stroke-width="0.55"/>
    <circle cx="431" cy="151" r="3" fill="#a85020"/>

    <rect x="460" y="140" width="22" height="22" fill="url(#liveNodeW1)" stroke="#3a1810" stroke-width="0.55"/>
    <circle cx="471" cy="151" r="3" fill="#a85020"/>

    <text x="231" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[1]</text>
    <text x="271" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[2]</text>
    <text x="311" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#3a1810" font-weight="700">[3]</text>
    <text x="351" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff088" font-weight="700">[4]</text>
    <text x="391" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff088" font-weight="700">[5]</text>
    <text x="431" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff088" font-weight="700">[6]</text>
    <text x="471" y="170" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff088" font-weight="700">[7]</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowW1)">
    <rect x="340" y="140" width="142" height="22" fill="#a85020" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessW1)">
    <rect x="200" y="120" width="280" height="80" fill="#a85020" opacity="0.32"/>
  </g>

  <g>
    <rect x="80" y="120" width="44" height="44" rx="3" fill="url(#deadNodeW1)" transform="rotate(15 102 142)"/>
    <rect x="120" y="160" width="44" height="44" rx="3" fill="url(#deadNodeW1)" transform="rotate(-10 142 182)"/>
    <rect x="540" y="160" width="44" height="44" rx="3" fill="url(#deadNodeW1)" transform="rotate(8 562 182)"/>
  </g>

  <g>
    <path d="M 0 240 L 0 100 Q 30 80 80 80 L 160 90 Q 200 100 220 130 L 220 200 Q 200 230 160 240 Z" fill="url(#skinHandW1)" opacity="0.85"/>
