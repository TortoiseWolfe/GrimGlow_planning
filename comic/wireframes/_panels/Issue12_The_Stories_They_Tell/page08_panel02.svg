<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 8 Panel 2 — Jink banks toward the exchange, "I'll be Theodore's relay."</title>
  <desc>Medium wide. Tiny figure in degraded emerald suit banks sharply in flight, emerald-green dragonfly wings trailing prismatic light in arc across morning sky, heading south toward distant building. Telegraph lines below converge toward same point. Morning sky brightening — blue and gold replacing dawn grey-pink. Urgent purpose, flying fast. Emerald trails arc through sky. The relay in flight.</desc>
  <defs>
    <linearGradient id="bgP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="0.7" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="morningSkyP2" cx="0.7" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cityFloorP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="exchangeFarP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="suitJinkP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="trailArcP2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#fff088" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3a8858" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="bloomP2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowP2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowP2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowP2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgP2)"/>
  <rect width="366" height="240" fill="url(#morningSkyP2)"/>

  <g>
    <path d="M 0 160 L 60 154 L 130 158 L 200 152 L 280 158 L 366 152 L 366 240 L 0 240 Z" fill="url(#cityFloorP2)" opacity="0.92"/>
    <g opacity="0.7">
      <rect x="40" y="140" width="6" height="14" fill="#0a0604"/>
      <rect x="100" y="136" width="9" height="20" fill="#0a0604"/>
      <rect x="160" y="138" width="6" height="16" fill="#0a0604"/>
      <rect x="220" y="134" width="9" height="20" fill="#0a0604"/>

      <rect x="60" y="180" width="9" height="22" fill="#040206"/>
      <rect x="180" y="184" width="14" height="20" fill="#040206"/>
      <rect x="320" y="180" width="11" height="22" fill="#040206"/>
    </g>

    <rect x="290" y="172" width="40" height="50" fill="url(#exchangeFarP2)"/>
    <rect x="290" y="172" width="40" height="3" fill="#3a1808"/>
    <rect x="294" y="180" width="11" height="14" fill="#080404"/>
    <rect x="316" y="180" width="11" height="14" fill="#080404"/>

    <g opacity="0.85" stroke="#080404" stroke-width="0.55">
      <line x1="0" y1="160" x2="100" y2="140"/>
      <line x1="100" y1="140" x2="200" y2="138"/>
      <line x1="200" y1="138" x2="280" y2="146"/>
      <line x1="280" y1="146" x2="310" y2="172"/>
      <line x1="0" y1="180" x2="120" y2="160"/>
      <line x1="120" y1="160" x2="240" y2="156"/>
      <line x1="240" y1="156" x2="310" y2="174"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#bloomP2)">
    <ellipse cx="280" cy="60" rx="180" ry="22" fill="#f4b860" opacity="0.42"/>
  </g>

  <g>
    <path d="M 20 30 Q 60 50 100 80 Q 150 110 200 130 Q 250 145 290 165" stroke="url(#trailArcP2)" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 20 30 Q 60 50 100 80 Q 150 110 200 130 Q 250 145 290 165" stroke="url(#trailArcP2)" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 20 30 Q 60 50 100 80 Q 150 110 200 130 Q 250 145 290 165" stroke="#fff088" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowP2)">
    <path d="M 20 30 Q 60 50 100 80 Q 150 110 200 130 Q 250 145 290 165" stroke="#3a8858" stroke-width="40" fill="none" stroke-linecap="round" opacity="0.42"/>
  </g>

  <g transform="rotate(35 200 130)">
    <ellipse cx="200" cy="130" rx="14" ry="6" fill="url(#suitJinkP2)"/>
    <path d="M 188 126 Q 174 118 166 124 Q 174 132 188 130 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 212 126 Q 226 118 234 124 Q 226 132 212 130 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 188 130 Q 178 138 172 144 Q 184 142 192 134 Z" fill="#3a8858" opacity="0.7"/>
    <path d="M 212 130 Q 222 138 228 144 Q 216 142 208 134 Z" fill="#3a8858" opacity="0.7"/>

    <ellipse cx="200" cy="124" rx="6" ry="5" fill="#a87858"/>
    <path d="M 196 119 Q 200 114 204 119 Q 206 122 204 124 L 196 124 Q 194 122 196 119 Z" fill="url(#hairBlondeP2)"/>
    <circle cx="198" cy="124" r="0.55" fill="#0a0604"/>
    <circle cx="202" cy="124" r="0.55" fill="#0a0604"/>

    <g opacity="0.7" stroke="#fff088" stroke-width="0.4" fill="none">
      <line x1="188" y1="126" x2="170" y2="120"/>
      <line x1="212" y1="126" x2="230" y2="120"/>
      <line x1="188" y1="130" x2="172" y2="142"/>
      <line x1="212" y1="130" x2="228" y2="142"/>
    </g>
  </g>
  <g opacity="0.95" filter="url(#strongGlowP2)">
    <circle cx="200" cy="130" r="22" fill="#3a8858" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowP2)">
    <circle cx="200" cy="130" r="44" fill="#3a8858" opacity="0.42"/>
  </g>
  <g opacity="0.42" filter="url(#ultraGlowP2)">
    <circle cx="200" cy="130" r="80" fill="#3a8858" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="220" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-weight="700">JINK: "On my way. I'll be the relay."</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic" font-weight="700">WREN: "Transmitting now."</text>
  </g>
</svg>
