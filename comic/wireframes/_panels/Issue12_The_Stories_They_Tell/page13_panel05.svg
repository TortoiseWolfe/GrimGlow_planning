    <path d="M 244 240 Q 252 254 256 268" stroke="url(#trousersX5)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="220" cy="180" rx="11" ry="14" fill="#d8a878"/>
    <path d="M 209 170 Q 220 158 232 170 Q 234 178 232 182 L 208 182 Q 208 178 209 170 Z" fill="url(#hairTheoX5)"/>
    <line x1="220" y1="200" x2="244" y2="208" stroke="#d8a878" stroke-width="6" stroke-linecap="round"/>
    <line x1="220" y1="200" x2="246" y2="195" stroke="#d8a878" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="259" y="166" width="11" height="6" fill="url(#cabinetIronX5)"/>
    <ellipse cx="265" cy="166" rx="3" ry="1.4" fill="#3a8858"/>
    <circle cx="265" cy="166" r="0.55" fill="#fff088"/>
  </g>
  <g opacity="0.62" filter="url(#bloomX5)">
