    <linearGradient id="horseX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="dressX5" x1="0" y1="0" x2="0" y2="1">
