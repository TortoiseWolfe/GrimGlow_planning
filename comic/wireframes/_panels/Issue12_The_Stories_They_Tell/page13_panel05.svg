<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 12 Page 13 Panel 5 — The street, oblivious — the world not watching</title>
  <desc>Medium wide. Victorian London street in morning light — boy kneels at open cast-iron telegraph exchange cabinet on pavement, hands inside, working. On cabinet's access panel, barely visible, tiny figure in emerald maintains faint copper-gold holographic projection. Around them, morning city continues — horse-drawn cart passes, woman walks with shopping basket, constable strolls far pavement. No one looks. No one notices. Copper-gold glow from cabinet small, lost in morning daylight. Fading amber-black pulse from inside. The ordinary world, the extraordinary thing inside it, the perfect indifference of the city.</desc>
