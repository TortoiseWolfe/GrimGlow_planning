<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 17 Panel 4 — Wren's pushback, "Stories don't build civilizations."</title>
  <desc>Medium shot. Tiny figure in maximum-degradation copper suit stands in holographic constellation, arms crossed, skepticism on East Asian features. Constellation's blue-violet threads reflect in copper-gold suit accents. The engineer, unconvinced by narrative — demanding data, not poetry. Constellation around her shows connections she helped prove — telegraph nodes, Titan device locations, data flow patterns — all leading back to central written-page node. The skeptic inside the evidence.</desc>
  <defs>
    <linearGradient id="bgBB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.5" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetSpaceBB4" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitWrenBB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="hairWrenBB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenBB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="copperGoldEdgeBB4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <radialGradient id="techNodeBB4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="threadBB4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomBB4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowBB4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowBB4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgBB4)"/>
  <rect width="366" height="240" fill="url(#violetSpaceBB4)"/>

  <g opacity="0.62" stroke="url(#threadBB4)" stroke-width="0.85" fill="none" stroke-dasharray="4,2">
