    <ellipse cx="40" cy="40" rx="22" ry="14" fill="#d88838" opacity="0.42"/>
    <ellipse cx="326" cy="40" rx="22" ry="14" fill="#d88838" opacity="0.42"/>
    <ellipse cx="40" cy="180" rx="22" ry="14" fill="#d88838" opacity="0.42"/>
    <ellipse cx="326" cy="180" rx="22" ry="14" fill="#d88838" opacity="0.42"/>
  </g>

  <g>
