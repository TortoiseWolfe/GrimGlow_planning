    <ellipse cx="183" cy="110" rx="14" ry="16" fill="url(#skinWrenBB4)"/>
    <path d="M 169 100 Q 183 86 197 100 Q 200 108 198 116 L 196 110 Q 190 100 184 102 Q 178 100 172 116 L 168 116 Q 168 108 169 100 Z" fill="url(#hairWrenBB4)"/>
