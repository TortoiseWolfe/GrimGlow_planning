<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 280" width="184" height="280">
  <title>Issue 12 Page 17 Panel 4 — Sable watching, the commander who knew</title>
  <desc>Close-up. Woman's face watching — dark brown skin, sharp angular features, military-cropped silver-white hair. Expression is quiet recognition — not surprise, but understanding arriving where it was always heading. Blue-white holographic light from behind, blue-violet light reflected from ahead, catching in dark eyes. She knows. She's known. The commander who carried the answer.</desc>
  <defs>
    <linearGradient id="bgAA4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.4" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="holoBackAA4" cx="0.85" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetForwardAA4" cx="0.15" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairSilverAA4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset="0.5" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="faceSableAA4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.4" stop-color="#5a4838"/>
      <stop offset="0.7" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#5a78a8"/>
    </linearGradient>
    <radialGradient id="eyeKnowAA4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#5a78a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomAA4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowAA4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowAA4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="184" height="280" fill="url(#bgAA4)"/>
  <rect width="184" height="280" fill="url(#holoBackAA4)"/>
  <rect width="184" height="280" fill="url(#violetForwardAA4)"/>

  <g>
    <ellipse cx="92" cy="160" rx="80" ry="120" fill="url(#faceSableAA4)"/>

    <path d="M 14 30 Q 50 0 92 0 Q 134 0 170 30 Q 178 60 174 84 L 164 80 Q 140 30 110 26 Q 92 22 74 26 Q 44 30 20 80 L 10 84 Q 6 60 14 30 Z" fill="url(#hairSilverAA4)"/>
    <g opacity="0.7" stroke="#7a7a7a" stroke-width="0.55">
      <line x1="40" y1="20" x2="40" y2="40"/>
      <line x1="60" y1="14" x2="60" y2="40"/>
      <line x1="80" y1="10" x2="80" y2="40"/>
      <line x1="100" y1="10" x2="100" y2="40"/>
      <line x1="120" y1="14" x2="120" y2="40"/>
      <line x1="140" y1="20" x2="140" y2="40"/>
    </g>

    <ellipse cx="60" cy="130" rx="14" ry="14" fill="#0a0604"/>
    <circle cx="60" cy="130" r="9" fill="#3a2010"/>
    <circle cx="62" cy="128" r="4" fill="url(#eyeKnowAA4)"/>
    <circle cx="60" cy="130" r="2.4" fill="#040206"/>
    <circle cx="62" cy="128" r="0.85" fill="#a878d8"/>

    <ellipse cx="124" cy="130" rx="14" ry="14" fill="#0a0604"/>
    <circle cx="124" cy="130" r="9" fill="#3a2010"/>
    <circle cx="126" cy="128" r="4" fill="url(#eyeKnowAA4)"/>
    <circle cx="124" cy="130" r="2.4" fill="#040206"/>
    <circle cx="126" cy="128" r="0.85" fill="#a8c0e0"/>

    <path d="M 36 110 Q 60 98 84 110" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 100 110 Q 124 98 148 110" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="76" cy="160" rx="11" ry="3" fill="#1a0a04" opacity="0.62"/>
    <ellipse cx="108" cy="160" rx="11" ry="3" fill="#1a0a04" opacity="0.62"/>

    <path d="M 76 196 L 108 196" stroke="#0a0604" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 76 200 L 108 200" stroke="#3a2410" stroke-width="0.55" opacity="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#bloomAA4)">
    <ellipse cx="92" cy="40" rx="100" ry="14" fill="#a8c0e0" opacity="0.32"/>
    <ellipse cx="92" cy="60" rx="100" ry="11" fill="#7a7a7a" opacity="0.32"/>
  </g>

  <g opacity="0.55" filter="url(#strongGlowAA4)">
    <ellipse cx="40" cy="140" rx="22" ry="40" fill="#7848b8" opacity="0.42"/>
    <ellipse cx="144" cy="140" rx="22" ry="40" fill="#5a78a8" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="92" cy="262" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
