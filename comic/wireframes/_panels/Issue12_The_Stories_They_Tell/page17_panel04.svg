    <text x="183" y="158" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#1a0a04" font-style="italic">stories</text>
    <text x="183" y="166" text-anchor="middle" font-family="Times New Roman, serif" font-size="3" fill="#3a2010" font-style="italic">they tell</text>
  </g>
  <g opacity="0.62" filter="url(#bloomBB4)">
