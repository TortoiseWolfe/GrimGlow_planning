    <line x1="40" y1="34" x2="40" y2="46" stroke="#d88838" stroke-width="0.55"/>
    <text x="40" y="60" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#d88838" font-style="italic">TELEGRAPH</text>

