    <ellipse cx="188" cy="112" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="188.6" cy="111.4" r="0.62" fill="#fff8d8"/>

    <path d="M 174 108 Q 178 106 182 108" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 184 108 Q 188 106 192 108" stroke="#0a0604" stroke-width="0.55" fill="none"/>

    <path d="M 178 124 L 188 124" stroke="#1a0a08" stroke-width="0.85" fill="none"/>
    <path d="M 178 122 Q 183 121 188 122" stroke="#3a2410" stroke-width="0.4" opacity="0.62"/>

    <ellipse cx="180" cy="116" rx="2" ry="0.55" fill="#a85820" opacity="0.55"/>
    <ellipse cx="186" cy="116" rx="2" ry="0.55" fill="#a85820" opacity="0.55"/>

    <path d="M 161 152 L 130 168 L 130 184 Q 130 196 144 196" stroke="url(#suitWrenBB4)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 205 152 L 236 168 L 236 184 Q 236 196 222 196" stroke="url(#suitWrenBB4)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <ellipse cx="142" cy="196" rx="6" ry="3" fill="url(#skinWrenBB4)"/>
    <ellipse cx="224" cy="196" rx="6" ry="3" fill="url(#skinWrenBB4)"/>

    <line x1="142" y1="194" x2="224" y2="194" stroke="url(#suitWrenBB4)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowBB4)">
    <ellipse cx="183" cy="170" rx="32" ry="40" fill="#d88838" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="225" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="156" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "Stories don't build civilizations, Luma."</text>
    <text x="156" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-style="italic" font-weight="700">LUMA: "The medium shapes the message."</text>
