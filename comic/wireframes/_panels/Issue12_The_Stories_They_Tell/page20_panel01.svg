<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 380" width="742" height="380">
  <title>Issue 12 Page 20 Panel 1 — Sable looks at her squad, the commander seeing what they are</title>
  <desc>Wide shot from slightly behind and beside Sable. Over her shoulder, four other tiny figures on church steeple beams in morning light. Wren in near-brown copper sits with tools in lap. Jink in soot-streaked emerald perches on higher beam, one leg dangling. Thresh in battered crimson stands with arms crossed. Luma in scuffed sapphire-violet leans against bell mechanism. All heavily degraded — soot, damage, improvised repairs — but holographic light bleeds through grime in five colors. They look like fairy tales. Something that has been through the dark and still carries light. Morning amber through arches.</desc>
