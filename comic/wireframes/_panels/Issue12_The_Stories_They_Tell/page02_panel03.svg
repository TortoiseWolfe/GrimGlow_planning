<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 2 Panel 3 — Luma at the camp monitoring station, "All vitals nominal."</title>
  <desc>Medium close-up slight low angle. Tiny figure sits at monitoring station inside wall cavity — fairy squad's hidden camp between Victorian timber beams. South Asian features, warm brown skin, large expressive eyes behind holographic lenses — one cracked, one intact — scrolling blue-violet data. Dark long braided hair with luminous filament pulses softly. Sapphire-violet metallic suit shows dust, ink stains, cracked lens, new scuffs. Multiple holographic displays float before her — comms channels, vital signs for five squad members, smaller tactical city map. Concentrated vigilance. Blue-violet light dominates her face.</desc>
