<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 5 Panel 3 — Sable's eyes on the tactical display</title>
  <desc>Extreme close-up on pair of eyes — dark brown irises, sharp intelligence, dark brown skin around them, military-cropped silver-white hair barely visible at edge of frame. In reflection of both eyes, holographic tactical display visible — miniature city map with single amber-black marker pulsing. She is watching. She cannot help. She can only wait. Blue-white holographic light reflected in dark eyes. Amber-black marker pulses in reflection. Command helplessness.</desc>
  <defs>
    <linearGradient id="bgM3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="holoFaceM3" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairSilverM3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset="0.5" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="faceSableM3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="eyeReflectM3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a2030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberMarkerM3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomM3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowM3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="wrongnessM3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgM3)"/>
  <rect width="247" height="280" fill="url(#holoFaceM3)"/>

  <g>
    <ellipse cx="123" cy="180" rx="180" ry="200" fill="url(#faceSableM3)"/>

    <path d="M 0 0 L 247 0 L 247 60 Q 200 50 123 50 Q 46 50 0 60 Z" fill="url(#hairSilverM3)"/>
    <g opacity="0.7" stroke="#7a7a7a" stroke-width="0.55">
      <line x1="20" y1="20" x2="20" y2="50"/>
      <line x1="50" y1="14" x2="50" y2="50"/>
      <line x1="80" y1="10" x2="80" y2="50"/>
      <line x1="110" y1="8" x2="110" y2="50"/>
      <line x1="140" y1="8" x2="140" y2="50"/>
      <line x1="170" y1="10" x2="170" y2="50"/>
      <line x1="200" y1="14" x2="200" y2="50"/>
      <line x1="230" y1="20" x2="230" y2="50"/>
    </g>
  </g>

  <g>
    <ellipse cx="60" cy="130" rx="44" ry="32" fill="#0a0604"/>
    <ellipse cx="60" cy="130" rx="32" ry="22" fill="#080404"/>
    <ellipse cx="60" cy="130" rx="22" ry="14" fill="#1a2030"/>

    <rect x="46" y="120" width="32" height="22" fill="none" stroke="#5a78a8" stroke-width="0.55" opacity="0.85"/>
    <line x1="46" y1="128" x2="78" y2="128" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="46" y1="136" x2="78" y2="136" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="56" y1="120" x2="56" y2="142" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="68" y1="120" x2="68" y2="142" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>

    <circle cx="62" cy="135" r="2" fill="#a85020" opacity="0.95"/>

    <circle cx="60" cy="130" r="3" fill="#040206" opacity="0.62"/>

    <ellipse cx="187" cy="130" rx="44" ry="32" fill="#0a0604"/>
    <ellipse cx="187" cy="130" rx="32" ry="22" fill="#080404"/>
    <ellipse cx="187" cy="130" rx="22" ry="14" fill="#1a2030"/>

    <rect x="173" y="120" width="32" height="22" fill="none" stroke="#5a78a8" stroke-width="0.55" opacity="0.85"/>
    <line x1="173" y1="128" x2="205" y2="128" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="173" y1="136" x2="205" y2="136" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="183" y1="120" x2="183" y2="142" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="195" y1="120" x2="195" y2="142" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>

    <circle cx="189" cy="135" r="2" fill="#a85020" opacity="0.95"/>

    <circle cx="187" cy="130" r="3" fill="#040206" opacity="0.62"/>

    <path d="M 14 90 Q 60 76 110 90" stroke="#0a0604" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 137 90 Q 187 76 233 90" stroke="#0a0604" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 14 86 Q 60 80 110 86" stroke="#5a3018" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 137 86 Q 187 80 233 86" stroke="#5a3018" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowM3)">
    <ellipse cx="60" cy="130" rx="32" ry="22" fill="#a8c0e0" opacity="0.42"/>
    <ellipse cx="187" cy="130" rx="32" ry="22" fill="#a8c0e0" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessM3)">
    <circle cx="62" cy="135" r="6" fill="#a85020" opacity="0.62"/>
    <circle cx="189" cy="135" r="6" fill="#a85020" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#bloomM3)">
    <ellipse cx="123" cy="200" rx="180" ry="40" fill="#5a78a8" opacity="0.22"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="270" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
