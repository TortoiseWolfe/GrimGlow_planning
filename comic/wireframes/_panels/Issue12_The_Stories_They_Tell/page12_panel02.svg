<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 12 Panel 2 — Sable's tactical countdown, "You have minutes."</title>
  <desc>Close-up holographic tactical display showing crisis countdown. Four satellite device markers flicker rapidly between grey and amber-black — reactivating. Central hub marker pulses with intense amber-black light. Geometric countdown timer visible in blue-white — minutes remaining. Display pulses with urgency, indicators flashing. Blue-white holographic light, amber-black markers, the time running out. The clock.</desc>
  <defs>
    <linearGradient id="bgV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="urgencyV2" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="hubAlertV2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="satFlashV2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7a3018" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomV2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowV2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowV2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="wrongnessV2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgV2)"/>
  <rect width="247" height="280" fill="url(#urgencyV2)"/>

  <g>
    <rect x="14" y="14" width="219" height="252" rx="4" fill="none" stroke="url(#frameV2)" stroke-width="1.4" opacity="0.85"/>
    <rect x="20" y="20" width="207" height="240" fill="#0a0a14" opacity="0.85"/>

    <text x="30" y="34" font-family="monospace" font-size="4.4" fill="#d83838" font-weight="700">⚠ FAILSAFE ACTIVE</text>
    <line x1="30" y1="38" x2="217" y2="38" stroke="#d83838" stroke-width="0.4" opacity="0.85"/>

    <text x="30" y="56" font-family="monospace" font-size="4" fill="#a8c0e0" font-weight="700">COUNTDOWN:</text>
    <text x="123" y="68" text-anchor="middle" font-family="monospace" font-size="20" fill="#fff088" font-weight="700">02:14</text>
    <text x="30" y="80" font-family="monospace" font-size="3" fill="#a8c0e0">MINUTES TO RECONNECT</text>

    <line x1="30" y1="92" x2="217" y2="92" stroke="#5a78a8" stroke-width="0.55" opacity="0.62"/>

    <g opacity="0.55" stroke="#5a78a8" stroke-width="0.4" fill="none">
      <line x1="40" y1="120" x2="200" y2="120"/>
      <line x1="40" y1="160" x2="200" y2="160"/>
      <line x1="40" y1="200" x2="200" y2="200"/>
      <line x1="60" y1="110" x2="60" y2="220"/>
      <line x1="120" y1="110" x2="120" y2="220"/>
      <line x1="180" y1="110" x2="180" y2="220"/>
    </g>

    <g>
      <ellipse cx="60" cy="130" rx="9" ry="6" fill="url(#satFlashV2)"/>
      <text x="60" y="148" text-anchor="middle" font-family="monospace" font-size="3" fill="#a85020" font-weight="700">A 78%</text>

      <ellipse cx="180" cy="130" rx="9" ry="6" fill="url(#satFlashV2)"/>
      <text x="180" y="148" text-anchor="middle" font-family="monospace" font-size="3" fill="#a85020" font-weight="700">B 82%</text>

      <ellipse cx="60" cy="200" rx="9" ry="6" fill="url(#satFlashV2)"/>
      <text x="60" y="218" text-anchor="middle" font-family="monospace" font-size="3" fill="#a85020" font-weight="700">C 75%</text>

      <ellipse cx="180" cy="200" rx="9" ry="6" fill="url(#satFlashV2)"/>
      <text x="180" y="218" text-anchor="middle" font-family="monospace" font-size="3" fill="#a85020" font-weight="700">D 80%</text>

      <circle cx="123" cy="165" r="22" fill="url(#hubAlertV2)"/>
      <circle cx="123" cy="165" r="14" fill="#a85020" opacity="0.95"/>
      <circle cx="123" cy="165" r="6" fill="#fff8d8"/>
      <text x="123" y="195" text-anchor="middle" font-family="monospace" font-size="4" fill="#fff088" font-weight="700">HUB ACTIVE</text>

      <g opacity="0.85" stroke="#a85020" stroke-width="0.85" stroke-dasharray="3,2" fill="none">
        <line x1="60" y1="130" x2="123" y2="165"/>
        <line x1="180" y1="130" x2="123" y2="165"/>
        <line x1="60" y1="200" x2="123" y2="165"/>
        <line x1="180" y1="200" x2="123" y2="165"/>
      </g>
    </g>

    <text x="30" y="240" font-family="monospace" font-size="3" fill="#d83838" font-weight="700">► HUB MUST DIE BEFORE TIMER ◄</text>
    <line x1="30" y1="250" x2="217" y2="250" stroke="#d83838" stroke-width="0.4" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowV2)">
    <rect x="14" y="14" width="219" height="252" fill="#a8c0e0" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessV2)">
    <circle cx="123" cy="165" r="40" fill="#a85020" opacity="0.42"/>
    <ellipse cx="60" cy="130" r="14" fill="#a85020" opacity="0.32"/>
    <ellipse cx="180" cy="130" r="14" fill="#a85020" opacity="0.32"/>
    <ellipse cx="60" cy="200" r="14" fill="#a85020" opacity="0.32"/>
    <ellipse cx="180" cy="200" r="14" fill="#a85020" opacity="0.32"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowV2)">
    <text x="123" y="68" text-anchor="middle" font-family="monospace" font-size="20" fill="#fff088" font-weight="700">02:14</text>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a8c0e0" font-weight="700">SABLE: "Theodore, satellites reactivating."</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a8c0e0" font-style="italic" font-weight="700">"You have minutes." THEODORE: "I'm working."</text>
  </g>
</svg>
