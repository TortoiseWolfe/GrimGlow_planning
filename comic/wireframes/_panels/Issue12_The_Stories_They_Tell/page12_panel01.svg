<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 12 Panel 1 — Theodore at the cabinet, Jink projecting Wren's schematic, "Seven nodes. Pressure and rotation."</title>
  <desc>Wide shot. Victorian London street — morning light. Boy 12-13 kneels at open cast-iron telegraph exchange cabinet, hands reaching inside. On cabinet's access panel, tiny figure in degraded emerald suit just landed, wings folding, immediately activating projection from wing-pack emitter. Copper-gold holographic schematic materializes in air beside boy's hands — step-by-step disarm diagram showing Titan device's internals, crystalline node locations marked, disconnection sequence numbered. Pedestrians pass behind, oblivious. Morning light, copper-gold holographic projection, amber-black device pulse from inside cabinet. The extraordinary hidden in the ordinary.</desc>
