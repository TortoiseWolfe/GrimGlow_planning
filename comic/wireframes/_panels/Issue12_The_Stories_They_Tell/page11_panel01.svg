<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 11 Panel 1 — The failsafe, "Minutes. Maybe less."</title>
  <desc>Wide shot. Tiny figure in pewter-dark degraded silver suit at church steeple command position, large holographic tactical display expanded — blue-white miniature city map pulsing with urgency. Four satellite device markers flicker between neutral grey and amber-black — reactivating. Central hub marker pulses brighter amber-black. Squad position markers scattered. Display shows operation unraveling in real time. Dawn light on church stone behind. Posture rigid — processing, adapting, deciding. Blue-white holographic urgency light. The crisis point.</desc>
  <defs>
    <linearGradient id="bgU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#5a78a8"/>
      <stop offset="0.7" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="dawnSkyU1" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="urgencyHoloU1" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steepleStoneU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6878"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="bellHouseU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitSableU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="hubAmberU1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="satFlickerU1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7a7a7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomU1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowU1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowU1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wrongnessU1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgU1)"/>
  <rect width="742" height="240" fill="url(#dawnSkyU1)"/>
  <rect width="742" height="240" fill="url(#urgencyHoloU1)"/>

  <g>
    <path d="M 60 0 L 80 0 L 76 14 L 64 14 Z" fill="#3a2838"/>
    <path d="M 50 14 L 90 14 L 84 60 L 56 60 Z" fill="url(#steepleStoneU1)"/>
    <path d="M 30 60 L 110 60 L 100 130 L 40 130 Z" fill="url(#bellHouseU1)"/>
    <rect x="50" y="80" width="14" height="40" fill="#080404"/>
    <rect x="76" y="80" width="14" height="40" fill="#080404"/>
    <rect x="20" y="130" width="100" height="14" fill="url(#steepleStoneU1)"/>
    <path d="M 14 144 L 126 144 L 130 240 L 10 240 Z" fill="url(#steepleStoneU1)"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.55">
      <line x1="14" y1="180" x2="126" y2="180"/>
      <line x1="14" y1="220" x2="126" y2="220"/>
      <line x1="50" y1="144" x2="50" y2="240"/>
      <line x1="90" y1="144" x2="90" y2="240"/>
    </g>
  </g>

  <g>
    <ellipse cx="70" cy="170" rx="3" ry="6" fill="#3a4858"/>
    <circle cx="70" cy="164" r="1.4" fill="#5a3818"/>
    <path d="M 67 162 Q 70 158 73 162 L 73 164 L 67 164 Z" fill="#a8a8a8"/>
  </g>

  <g>
    <line x1="80" y1="166" x2="160" y2="120" stroke="#a8c0e0" stroke-width="0.4" opacity="0.55" stroke-dasharray="2,2"/>

    <rect x="160" y="40" width="540" height="180" rx="4" fill="none" stroke="#5a78a8" stroke-width="1.2" opacity="0.85"/>
    <rect x="166" y="46" width="528" height="168" fill="#0a0a14" opacity="0.62"/>

    <text x="180" y="62" font-family="monospace" font-size="6" fill="#a8c0e0" font-weight="700">⚠ TACTICAL — CRITICAL — FAILSAFE TRIGGERED</text>
    <text x="600" y="62" font-family="monospace" font-size="5.4" fill="#d83838" font-weight="700">[T-MINUTES]</text>
    <line x1="180" y1="70" x2="680" y2="70" stroke="#a8c0e0" stroke-width="0.4" opacity="0.62"/>

    <g opacity="0.55" stroke="#5a78a8" stroke-width="0.4" fill="none">
      <path d="M 200 90 L 660 90"/>
      <path d="M 200 110 L 660 110"/>
      <path d="M 200 130 L 660 130"/>
      <path d="M 200 150 L 660 150"/>
      <path d="M 200 170 L 660 170"/>
      <path d="M 200 190 L 660 190"/>
      <path d="M 240 80 L 240 200"/>
      <path d="M 320 80 L 320 200"/>
      <path d="M 400 80 L 400 200"/>
      <path d="M 480 80 L 480 200"/>
      <path d="M 560 80 L 560 200"/>
      <path d="M 620 80 L 620 200"/>
    </g>

    <g>
      <ellipse cx="240" cy="100" rx="9" ry="6" fill="url(#satFlickerU1)"/>
      <text x="240" y="112" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#a85020" font-weight="700">A ⟳</text>

      <ellipse cx="600" cy="100" rx="9" ry="6" fill="url(#satFlickerU1)"/>
      <text x="600" y="112" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#a85020" font-weight="700">B ⟳</text>

      <ellipse cx="240" cy="180" rx="9" ry="6" fill="url(#satFlickerU1)"/>
      <text x="240" y="192" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#a85020" font-weight="700">C ⟳</text>

      <ellipse cx="600" cy="180" rx="9" ry="6" fill="url(#satFlickerU1)"/>
      <text x="600" y="192" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#a85020" font-weight="700">D ⟳</text>

      <circle cx="420" cy="140" r="22" fill="url(#hubAmberU1)"/>
      <circle cx="420" cy="140" r="14" fill="#a85020" opacity="0.85"/>
      <circle cx="420" cy="140" r="6" fill="#fff8d8" opacity="0.95"/>
      <text x="420" y="120" text-anchor="middle" font-family="monospace" font-size="6" fill="#a85020" font-weight="700">HUB ⚠</text>
      <text x="420" y="170" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#a85020" font-weight="700">RESTORE SIGNAL</text>

      <g opacity="0.85" stroke="#a85020" stroke-width="0.7" stroke-dasharray="3,2" fill="none">
        <line x1="240" y1="100" x2="420" y2="140"/>
        <line x1="600" y1="100" x2="420" y2="140"/>
        <line x1="240" y1="180" x2="420" y2="140"/>
        <line x1="600" y1="180" x2="420" y2="140"/>
      </g>

      <circle cx="320" cy="100" r="3" fill="#3a8858" opacity="0.85"/>
      <circle cx="480" cy="100" r="3" fill="#a85820" opacity="0.85"/>
      <circle cx="320" cy="180" r="3" fill="#d83838" opacity="0.85"/>
      <circle cx="480" cy="180" r="3" fill="#a878d8" opacity="0.85"/>
      <text x="320" y="206" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#3a8858">JINK</text>
      <text x="480" y="206" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a85820">WREN</text>
      <text x="320" y="76" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#d83838">THRESH</text>
      <text x="480" y="76" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8">LUMA</text>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowU1)">
    <rect x="160" y="40" width="540" height="180" fill="#a8c0e0" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessU1)">
    <circle cx="420" cy="140" r="40" fill="#a85020" opacity="0.42"/>
    <circle cx="240" cy="100" r="14" fill="#a85020" opacity="0.32"/>
    <circle cx="600" cy="100" r="14" fill="#a85020" opacity="0.32"/>
    <circle cx="240" cy="180" r="14" fill="#a85020" opacity="0.32"/>
    <circle cx="600" cy="180" r="14" fill="#a85020" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowU1)">
    <rect x="160" y="40" width="540" height="180" fill="#5a78a8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="370" cy="220" rx="280" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="380" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="184" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "Satellites reactivating. Hub pushing restore signal."</text>
    <text x="184" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-style="italic" font-weight="700">SABLE: "How long?" WREN: "Minutes. Maybe less."</text>
  </g>
</svg>
