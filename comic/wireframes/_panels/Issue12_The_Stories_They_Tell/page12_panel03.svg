<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 12 Panel 3 — Theodore's hands inside the device, "First node free."</title>
  <desc>Extreme close-up. Boy's fingers work inside alien device — oil-stained, burn scar on one knuckle, brass gear ring catching light. Fingers grip dark crystalline node — angular, alien — and apply pressure and rotation, precise movements of clockwork-trained hand. Node turns. At edge of frame, copper-gold holographic guide shows next step in geometric light. Device's amber-black pulse close, intense, illuminating working fingers. Hands steady. Clockwork logic applied to alien technology.</desc>
  <defs>
    <linearGradient id="bgV3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#0a0604"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="hubCloseV3" cx="0.55" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperEdgeV3" cx="0.85" cy="0.15" r="0.32">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deviceShellV3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="crystalNodeV3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.62"/>
    </radialGradient>
    <linearGradient id="skinFingerV3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingV3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <filter id="bloomV3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowV3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowV3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgV3)"/>
  <rect width="247" height="280" fill="url(#hubCloseV3)"/>
  <rect width="247" height="280" fill="url(#copperEdgeV3)"/>

  <g>
    <rect x="0" y="60" width="247" height="200" fill="url(#deviceShellV3)" opacity="0.85"/>
    <rect x="0" y="60" width="247" height="9" fill="#5a3098" opacity="0.42"/>
    <line x1="0" y1="120" x2="247" y2="120" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="0" y1="180" x2="247" y2="180" stroke="#3a1810" stroke-width="0.55"/>

    <g opacity="0.62" stroke="#5a3098" stroke-width="0.4" fill="none">
      <path d="M 0 90 Q 60 92 123 90 Q 180 88 247 90"/>
      <path d="M 0 150 Q 60 152 123 150 Q 180 148 247 150"/>
      <path d="M 0 210 Q 60 212 123 210 Q 180 208 247 210"/>
    </g>
  </g>

  <g>
