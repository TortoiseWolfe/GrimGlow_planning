    <path d="M 80 110 L 100 100 L 146 100 L 166 110 L 166 170 L 146 180 L 100 180 L 80 170 Z" fill="#3a1810" opacity="0.62"/>

    <path d="M 100 110 L 123 100 L 146 110 L 146 170 L 123 180 L 100 170 Z" fill="url(#crystalNodeV3)"/>
    <path d="M 100 110 L 146 110 L 123 130 Z" fill="#fff8d8" opacity="0.42"/>
    <path d="M 100 170 L 146 170 L 123 150 Z" fill="#fff8d8" opacity="0.42"/>
    <line x1="100" y1="110" x2="146" y2="170" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="146" y1="110" x2="100" y2="170" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="123" y1="100" x2="123" y2="180" stroke="#fff8d8" stroke-width="0.4"/>

    <g opacity="0.85" stroke="#a85020" stroke-width="0.55" fill="none">
      <path d="M 60 80 Q 80 90 100 110"/>
      <path d="M 186 80 Q 166 90 146 110"/>
      <path d="M 60 200 Q 80 190 100 170"/>
      <path d="M 186 200 Q 166 190 146 170"/>
    </g>

    <path d="M 130 105 Q 138 110 130 116" stroke="#fff088" stroke-width="0.55" fill="none" opacity="0.95"/>
    <path d="M 132 100 L 142 110" stroke="#fff088" stroke-width="0.55" fill="none" opacity="0.85"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowV3)">
    <ellipse cx="123" cy="140" rx="40" ry="40" fill="#a85020" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowV3)">
    <ellipse cx="123" cy="140" rx="80" ry="80" fill="#a85020" opacity="0.42"/>
  </g>

  <g>
    <path d="M 0 280 L 0 200 Q 14 180 30 170 L 60 168 Q 76 168 86 180 L 90 196 L 88 220 Q 86 240 80 260 Z" fill="url(#skinFingerV3)"/>
    <path d="M 86 180 L 110 156 L 120 130 L 116 116" stroke="url(#skinFingerV3)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <ellipse cx="116" cy="116" rx="6" ry="9" fill="url(#skinFingerV3)" transform="rotate(-30 116 116)"/>

    <path d="M 247 280 L 247 200 Q 233 180 217 170 L 187 168 Q 171 168 161 180 L 157 196 L 159 220 Q 161 240 167 260 Z" fill="url(#skinFingerV3)"/>
    <path d="M 161 180 L 145 156 L 138 130 L 142 116" stroke="url(#skinFingerV3)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <ellipse cx="142" cy="116" rx="6" ry="9" fill="url(#skinFingerV3)" transform="rotate(30 142 116)"/>

    <ellipse cx="40" cy="240" rx="9" ry="6" fill="#5a3018" opacity="0.62"/>
    <ellipse cx="207" cy="244" rx="9" ry="6" fill="#5a3018" opacity="0.62"/>
    <ellipse cx="100" cy="200" rx="3" ry="2" fill="#7a4830" opacity="0.55"/>

    <path d="M 100 220 L 110 216 L 116 222" fill="#a85820" opacity="0.62"/>

    <ellipse cx="120" cy="200" rx="3" ry="2.4" fill="url(#brassRingV3)"/>
    <ellipse cx="120" cy="200" rx="2" ry="1.4" fill="#3a1a08"/>
    <line x1="116" y1="200" x2="124" y2="200" stroke="#5a2e10" stroke-width="0.4"/>
  </g>
  <g opacity="0.85" filter="url(#bloomV3)">
    <ellipse cx="120" cy="200" rx="6" ry="3" fill="#fff8d8" opacity="0.55"/>
  </g>

  <g>
    <rect x="180" y="20" width="60" height="40" rx="2" fill="none" stroke="#d88838" stroke-width="0.4" opacity="0.85"/>
    <text x="184" y="30" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">[1] ROTATE ¼</text>
    <g stroke="#d88838" stroke-width="0.4" fill="none">
      <circle cx="200" cy="44" r="6"/>
      <circle cx="200" cy="44" r="2"/>
      <line x1="200" y1="38" x2="200" y2="44"/>
      <path d="M 196 38 L 200 36 L 204 38" fill="none"/>
    </g>
    <text x="220" y="46" font-family="monospace" font-size="3" fill="#d88838">→</text>
    <text x="208" y="56" font-family="monospace" font-size="2.4" fill="#d88838">CCW PULL</text>
  </g>
  <g opacity="0.62" filter="url(#strongGlowV3)">
    <rect x="180" y="20" width="60" height="40" fill="#d88838" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-weight="700">THEODORE: "First node free."</text>
  </g>
</svg>
