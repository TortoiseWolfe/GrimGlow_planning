<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 600" width="742" height="600">
  <title>Issue 12 Page 9 Panel 1 — SPLASH — Titan drone activates in basement, "CONTACT! Drone! In the basement!"</title>
  <desc>SPLASH PANEL extreme low angle from floor level looking up. Titan drone unfolds from pipe infrastructure on ceiling of dark Victorian industrial basement — dark angular limbs extending with too many joints, surfaces shimmering with oil-on-water dark iridescence in bruise-purple and black, cloaking failing in patches to reveal angular segments of dark absorptive surface. Cluster of geometric sensory lenses swivels downward. Drone enormous from four-inch perspective — filling ceiling, mechanical and predatory, nightmare of wrong geometry. At bottom of frame, tiny figure in degraded crimson armor caught mid-scramble, weapon half-raised, total fear. Crimson holographic edge-lighting pulses frantically.</desc>
