<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 10 Panel 3 — Jink as bait, "Hey, ugly! Over here!"</title>
  <desc>Dynamic medium shot. Tiny figure in degraded emerald suit flies fast and dangerously close around sensor cluster of Titan drone — cluster of dark geometric lenses that swivels to track buzzing figure. Emerald wings trail prismatic light in tight circles around drone's head-like array. Figure grins — tight, scared, functional — reckless flying of scout repurposed as combat bait. Drone's dark iridescent surface absorbs emerald light wrongly. Bait and switch.</desc>
  <defs>
    <linearGradient id="bgT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="droneCenterT3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#1a0810" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="droneShellT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080404"/>
      <stop offset="0.5" stop-color="#020100"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="iridescenceT3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a3098" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0.62"/>
    </linearGradient>
    <radialGradient id="lensT3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitJinkT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="circleTrailT3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a8858" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff088" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bloomT3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowT3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowT3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wrongnessT3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgT3)"/>
  <rect width="366" height="240" fill="url(#droneCenterT3)"/>

  <g>
    <ellipse cx="183" cy="120" rx="100" ry="80" fill="url(#droneShellT3)"/>

    <ellipse cx="183" cy="120" rx="60" ry="44" fill="#0a0604"/>
    <ellipse cx="160" cy="108" rx="11" ry="9" fill="url(#lensT3)"/>
    <ellipse cx="183" cy="116" rx="14" ry="11" fill="url(#lensT3)"/>
    <ellipse cx="206" cy="108" rx="11" ry="9" fill="url(#lensT3)"/>
    <ellipse cx="170" cy="132" rx="11" ry="9" fill="url(#lensT3)"/>
    <ellipse cx="200" cy="132" rx="11" ry="9" fill="url(#lensT3)"/>

    <circle cx="160" cy="108" r="3" fill="#a85020"/>
    <circle cx="183" cy="116" r="4" fill="#a85020"/>
    <circle cx="206" cy="108" r="3" fill="#a85020"/>
    <circle cx="170" cy="132" r="3" fill="#a85020"/>
    <circle cx="200" cy="132" r="3" fill="#a85020"/>

    <g opacity="0.85">
      <line x1="100" y1="80" x2="160" y2="100" stroke="url(#iridescenceT3)" stroke-width="0.85"/>
      <line x1="266" y1="80" x2="200" y2="100" stroke="url(#iridescenceT3)" stroke-width="0.85"/>
      <line x1="100" y1="160" x2="160" y2="140" stroke="url(#iridescenceT3)" stroke-width="0.85"/>
      <line x1="266" y1="160" x2="200" y2="140" stroke="url(#iridescenceT3)" stroke-width="0.85"/>
    </g>

    <line x1="183" y1="116" x2="320" y2="60" stroke="#a85020" stroke-width="0.4" opacity="0.55" stroke-dasharray="3,2"/>
    <line x1="183" y1="116" x2="40" y2="80" stroke="#a85020" stroke-width="0.4" opacity="0.55" stroke-dasharray="3,2"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessT3)">
    <ellipse cx="183" cy="120" rx="80" ry="60" fill="#3a2868" opacity="0.42"/>
  </g>

  <g>
    <path d="M 80 60 Q 100 40 150 50 Q 220 70 280 60 Q 320 50 340 80 Q 320 120 260 130 Q 200 140 140 130 Q 80 110 60 80 Q 60 70 80 60 Z" fill="none" stroke="url(#circleTrailT3)" stroke-width="11" opacity="0.85"/>
    <path d="M 80 60 Q 100 40 150 50 Q 220 70 280 60 Q 320 50 340 80 Q 320 120 260 130 Q 200 140 140 130 Q 80 110 60 80 Q 60 70 80 60 Z" fill="none" stroke="url(#circleTrailT3)" stroke-width="6" opacity="0.95"/>
    <path d="M 80 60 Q 100 40 150 50 Q 220 70 280 60 Q 320 50 340 80 Q 320 120 260 130 Q 200 140 140 130 Q 80 110 60 80 Q 60 70 80 60 Z" fill="none" stroke="#fff088" stroke-width="1.4" opacity="0.85"/>
  </g>
  <g opacity="0.42" filter="url(#megaGlowT3)">
    <path d="M 80 60 Q 100 40 150 50 Q 220 70 280 60 Q 320 50 340 80 Q 320 120 260 130 Q 200 140 140 130 Q 80 110 60 80 Q 60 70 80 60 Z" fill="none" stroke="#3a8858" stroke-width="22" opacity="0.42"/>
  </g>

  <g transform="rotate(20 320 90)">
    <ellipse cx="320" cy="90" rx="14" ry="6" fill="url(#suitJinkT3)"/>
    <path d="M 308 87 Q 290 82 282 88 Q 290 96 308 92 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 332 87 Q 350 82 358 88 Q 350 96 332 92 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 308 92 Q 296 100 290 106 Q 304 104 312 96 Z" fill="#3a8858" opacity="0.7"/>
    <path d="M 332 92 Q 344 100 350 106 Q 336 104 328 96 Z" fill="#3a8858" opacity="0.7"/>

    <ellipse cx="320" cy="84" rx="5" ry="5" fill="#a87858"/>
    <path d="M 315 80 Q 320 74 326 80 Q 328 84 326 86 L 314 86 Q 312 84 315 80 Z" fill="url(#hairBlondeT3)"/>
    <ellipse cx="316" cy="84" rx="2" ry="3" fill="url(#hairBlondeT3)"/>
    <ellipse cx="324" cy="84" rx="2" ry="3" fill="url(#hairBlondeT3)"/>

    <circle cx="318" cy="84" r="0.55" fill="#0a0604"/>
    <circle cx="322" cy="84" r="0.55" fill="#0a0604"/>
    <path d="M 314 88 Q 320 92 326 88 Q 328 90 326 92 Q 320 94 314 92 Q 312 90 314 88 Z" fill="#1a0604"/>
    <path d="M 316 90 L 324 90" stroke="#fff8d8" stroke-width="0.55" stroke-linecap="round"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowT3)">
    <circle cx="320" cy="90" r="14" fill="#3a8858" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowT3)">
    <circle cx="320" cy="90" r="32" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="220" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-weight="700">JINK (breathless): "Hey, ugly!"</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-style="italic" font-weight="700">"Can't catch what you can't track!"</text>
  </g>
</svg>
