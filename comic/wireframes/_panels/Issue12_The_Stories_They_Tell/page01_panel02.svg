<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 240" width="247" height="240">
  <title>Issue 12 Page 1 Panel 2 — Jink banking between chimneys, "Scout, airborne. En route to Junction Alpha."</title>
  <desc>Medium close-up dynamic low angle. Tiny figure banks hard between two massive Victorian chimney stacks, wing-pack fully deployed — translucent dragonfly wings in emerald-green light, geometric lattice visible, prismatic emerald trails through swirling soot. Lean androgynous, light brown skin, wild bright golden blonde curly hair flecked with soot, emerald metallic suit heavily degraded. Focused determination, no grin — purpose. Dawn grey-pink sky. Chimney stacks in dark silhouette, enormous compared to tiny flying figure.</desc>
  <defs>
    <linearGradient id="bgI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7898"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="emeraldGlowI2" cx="0.6" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#1a4830" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chimneyI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="suitJinkI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeI2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="trailEmeraldI2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#fff088" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bloomI2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowI2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowI2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="247" height="240" fill="url(#bgI2)"/>
  <rect width="247" height="240" fill="url(#emeraldGlowI2)"/>

  <g>
    <rect x="0" y="0" width="40" height="240" fill="url(#chimneyI2)"/>
    <rect x="0" y="0" width="40" height="14" fill="#1a0a04"/>
    <rect x="0" y="14" width="40" height="3" fill="#5a3018"/>
    <g opacity="0.62" stroke="#080404" stroke-width="0.55">
      <line x1="0" y1="40" x2="40" y2="40"/>
      <line x1="0" y1="80" x2="40" y2="80"/>
      <line x1="0" y1="120" x2="40" y2="120"/>
      <line x1="0" y1="160" x2="40" y2="160"/>
      <line x1="0" y1="200" x2="40" y2="200"/>
      <line x1="20" y1="0" x2="20" y2="240"/>
    </g>

    <rect x="207" y="0" width="40" height="240" fill="url(#chimneyI2)"/>
    <rect x="207" y="0" width="40" height="14" fill="#1a0a04"/>
    <rect x="207" y="14" width="40" height="3" fill="#5a3018"/>
    <g opacity="0.62" stroke="#080404" stroke-width="0.55">
      <line x1="207" y1="40" x2="247" y2="40"/>
      <line x1="207" y1="80" x2="247" y2="80"/>
      <line x1="207" y1="120" x2="247" y2="120"/>
      <line x1="207" y1="160" x2="247" y2="160"/>
      <line x1="207" y1="200" x2="247" y2="200"/>
      <line x1="227" y1="0" x2="227" y2="240"/>
    </g>
  </g>

  <g opacity="0.55">
    <ellipse cx="60" cy="60" rx="6" ry="3" fill="#3a2818"/>
    <ellipse cx="80" cy="80" rx="4" ry="2" fill="#3a2818"/>
    <ellipse cx="160" cy="60" rx="6" ry="3" fill="#3a2818"/>
    <ellipse cx="180" cy="80" rx="4" ry="2" fill="#3a2818"/>
    <ellipse cx="120" cy="190" rx="9" ry="4" fill="#3a2818"/>
    <ellipse cx="60" cy="200" rx="6" ry="3" fill="#3a2818"/>
    <ellipse cx="180" cy="200" rx="6" ry="3" fill="#3a2818"/>
  </g>

  <g>
    <path d="M 56 180 Q 80 168 100 156 Q 110 150 116 144" stroke="url(#trailEmeraldI2)" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 56 180 Q 80 168 100 156 Q 110 150 116 144" stroke="url(#trailEmeraldI2)" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 56 180 Q 80 168 100 156 Q 110 150 116 144" stroke="#fff088" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowI2)">
    <path d="M 56 180 Q 80 168 100 156 Q 110 150 116 144" stroke="#3a8858" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.42"/>
  </g>

  <g>
