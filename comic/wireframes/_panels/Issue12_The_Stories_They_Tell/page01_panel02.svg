    <path d="M 110 110 Q 124 96 140 110 Q 138 116 134 118 Q 124 116 116 120 Q 112 116 110 110 Z" fill="#3a2818" transform="rotate(-30 124 110)"/>

    <ellipse cx="124" cy="100" rx="14" ry="11" fill="#a87858" transform="rotate(-30 124 100)"/>
    <path d="M 112 90 Q 124 76 138 90 Q 144 96 142 100 Q 132 92 120 96 Q 110 96 110 100 Q 110 96 112 90 Z" fill="url(#hairBlondeI2)" transform="rotate(-30 124 96)"/>
    <ellipse cx="120" cy="100" rx="3" ry="6" fill="url(#hairBlondeI2)" transform="rotate(-30 120 100)"/>
    <ellipse cx="130" cy="100" rx="3" ry="6" fill="url(#hairBlondeI2)" transform="rotate(-30 130 100)"/>

    <circle cx="120" cy="100" r="0.85" fill="#0a0604"/>
    <circle cx="130" cy="100" r="0.85" fill="#0a0604"/>
    <path d="M 122 106 L 128 106" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 88 102 Q 60 80 32 86 Q 50 100 80 110 Q 100 110 88 102 Z" fill="url(#suitJinkI2)" opacity="0.85"/>
    <path d="M 158 102 Q 186 80 214 86 Q 196 100 166 110 Q 146 110 158 102 Z" fill="url(#suitJinkI2)" opacity="0.85"/>
    <path d="M 88 124 Q 60 134 32 144 Q 50 132 80 122 Q 100 122 88 124 Z" fill="url(#suitJinkI2)" opacity="0.7"/>
    <path d="M 158 124 Q 186 134 214 144 Q 196 132 166 122 Q 146 122 158 124 Z" fill="url(#suitJinkI2)" opacity="0.7"/>

    <g opacity="0.7" stroke="#fff088" stroke-width="0.4" fill="none">
      <path d="M 88 102 L 60 90"/>
      <path d="M 88 102 L 50 96"/>
      <path d="M 88 102 L 70 110"/>
      <path d="M 158 102 L 186 90"/>
      <path d="M 158 102 L 196 96"/>
      <path d="M 158 102 L 176 110"/>
    </g>
  </g>

  <g opacity="0.95" filter="url(#strongGlowI2)">
    <ellipse cx="124" cy="120" rx="40" ry="22" fill="#3a8858" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowI2)">
    <ellipse cx="124" cy="120" rx="80" ry="44" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="124" cy="220" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-weight="700">JINK (radio): "Scout, airborne. Junction Alpha."</text>
  </g>
</svg>
