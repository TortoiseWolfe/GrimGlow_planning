    <line x1="133" y1="229" x2="137" y2="229" stroke="#d83838" stroke-width="0.7"/>
    <line x1="133" y1="230.5" x2="137" y2="230.5" stroke="#d83838" stroke-width="0.7"/>

    <ellipse cx="118" cy="232" rx="3" ry="4" fill="#fff8e8"/>
