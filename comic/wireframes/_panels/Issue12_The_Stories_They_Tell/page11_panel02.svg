    <path d="M 113 230 Q 116 240 116 250" stroke="url(#wreckWingU2)" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 109 234 L 106 230 L 110 233 L 107 237 Z" fill="#1a0e14" opacity="0.9"/>
    <path d="M 113 231 L 117 228 L 114 233 Z" fill="#1a0e14" opacity="0.9"/>

