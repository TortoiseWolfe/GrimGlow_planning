<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 11 Panel 2 — Jink leaves the wounded Thresh, "Hold on, Thresh."</title>
  <desc>Medium shot. Tiny figure in degraded emerald suit rockets upward from the dark basement stairwell at full holographic dragonfly-wing power, emerald-green prismatic trails blazing — but the head and posture twist half-back and down with reluctance toward the figure below. At the stairwell mouth, the second tiny figure in crimson armor is wounded: propped against the dark stairwell wall, one arm hanging useless, the wing-pack on its back shattered and dark with no crimson wing glow, only the chest and gauntlet crimson edges still lit. It lifts its good hand in a flat final wave — go. Bright climbing emerald above, wounded dark crimson below. The failsafe forces the parting.</desc>
