    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a83838" font-weight="700">THRESH: "Go. Hub first. I'm not going anywhere."</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#3a8858" font-weight="700">JINK: "Airborne. ...Hold on, Thresh."</text>
