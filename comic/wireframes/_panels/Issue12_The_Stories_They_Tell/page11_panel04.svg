  </g>
  <g opacity="0.62" filter="url(#wrongnessU4)">
    <rect x="120" y="100" width="120" height="100" fill="#3a1810" opacity="0.42"/>
  </g>
  <g opacity="0.42" filter="url(#megaGlowU4)">
    <ellipse cx="180" cy="155" rx="80" ry="60" fill="#a85020" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="60" cy="240" rx="14" ry="3" fill="#040202" opacity="0.62"/>

    <path d="M 40 180 L 80 180 L 84 240 L 36 240 Z" fill="url(#waistcoatU4)"/>
    <line x1="60" y1="184" x2="60" y2="240" stroke="#1a0a08" stroke-width="0.55" opacity="0.55"/>
    <circle cx="60" cy="200" r="0.85" fill="#3a1808"/>

    <path d="M 46 168 L 74 168 L 76 184 L 44 184 Z" fill="#fff8d8"/>

    <path d="M 76 180 L 110 174 L 130 168 L 145 162" stroke="url(#skinTheoU4)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="148" cy="160" rx="6" ry="3" fill="url(#skinTheoU4)"/>

    <ellipse cx="60" cy="146" rx="14" ry="16" fill="url(#skinTheoU4)"/>
    <path d="M 46 132 Q 60 116 76 132 Q 78 140 76 144 L 44 144 Q 44 140 46 132 Z" fill="url(#hairTheoU4)"/>

    <ellipse cx="55" cy="148" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="55.6" cy="147.4" r="0.62" fill="#a87838"/>
    <ellipse cx="65" cy="148" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="65.6" cy="147.4" r="0.62" fill="#a87838"/>

    <path d="M 51 144 Q 55 142 59 144" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 61 144 Q 65 142 69 144" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 56 158 L 64 158" stroke="#1a0a08" stroke-width="0.7" fill="none"/>

    <ellipse cx="56" cy="152" rx="2" ry="0.7" fill="#a85820" opacity="0.55"/>
    <ellipse cx="64" cy="152" rx="2" ry="0.7" fill="#a85820" opacity="0.55"/>

    <path d="M 36 240 Q 28 256 24 270" stroke="#3a2818" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 84 240 Q 92 256 96 270" stroke="#3a2818" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.85" filter="url(#bloomU4)">
    <ellipse cx="60" cy="146" rx="22" ry="14" fill="#a85020" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="266" rx="100" ry="3" fill="#040202" opacity="0.42"/>
