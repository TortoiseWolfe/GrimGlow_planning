<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 11 Panel 4 — The cabinet opens, "I see the connections."</title>
  <desc>Medium shot. Victorian boy pulls open access panel of cast-iron telegraph exchange cabinet, revealing interior — dense nest of telegraph cables, junction blocks, relay mechanisms in copper and brass. Mounted among them, clearly alien, Titan temporal nudge device — hub, larger than satellites, size of book, dark and angular, pulsing with intense amber-black light. Alien device wrong among Victorian technology — dark geometry among brass curves. Boy stares, hazel eyes processing shock then recognition. The alien revealed in the familiar.</desc>
  <defs>
    <linearGradient id="bgU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#fff8d8"/>
      <stop offset="0.7" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="hubFloodU4" cx="0.62" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinetIronU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3848"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="cabinetInteriorU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a04"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="brassWireU4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="copperWireU4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="hubDeviceU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="hubCoreU4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#a85020" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.62"/>
    </radialGradient>
    <linearGradient id="hairTheoU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="skinTheoU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d8b8"/>
      <stop offset="0.5" stop-color="#d8a878"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="waistcoatU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <filter id="bloomU4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowU4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowU4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="wrongnessU4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgU4)"/>
  <rect width="247" height="280" fill="url(#hubFloodU4)"/>

