    <path d="M 130 110 L 230 110 L 220 100 L 140 100 Z" fill="#080404"/>
    <line x1="130" y1="120" x2="230" y2="120" stroke="#5a3098" stroke-width="0.55" opacity="0.85"/>
    <line x1="130" y1="190" x2="230" y2="190" stroke="#5a3098" stroke-width="0.55" opacity="0.85"/>

    <ellipse cx="180" cy="155" rx="32" ry="22" fill="url(#hubCoreU4)"/>
    <circle cx="180" cy="155" r="14" fill="#fff088"/>
    <circle cx="180" cy="155" r="6" fill="#fff8d8"/>

