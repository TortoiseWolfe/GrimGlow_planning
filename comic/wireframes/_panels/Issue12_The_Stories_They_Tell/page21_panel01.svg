    <rect x="0" y="160" width="742" height="80" fill="url(#benchII1)"/>
    <rect x="0" y="160" width="742" height="3" fill="#9a6028" opacity="0.62"/>
    <line x1="0" y1="200" x2="742" y2="200" stroke="#3a1808" stroke-width="0.4" opacity="0.55"/>

    <g opacity="0.85">
