    <path d="M 306 144 L 394 144 L 400 220 L 300 220 Z" fill="url(#waistcoatII1)"/>
    <line x1="350" y1="148" x2="350" y2="220" stroke="#1a0a08" stroke-width="0.55" opacity="0.62"/>

    <path d="M 314 110 L 386 110 L 390 144 L 310 144 Z" fill="url(#shirtII1)"/>

    <path d="M 386 144 L 420 156 L 446 168 L 460 178" stroke="url(#skinTheoII1)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="462" cy="180" rx="6" ry="3" fill="url(#skinTheoII1)"/>

    <path d="M 314 144 L 290 156 L 290 178" stroke="url(#skinTheoII1)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <ellipse cx="350" cy="84" rx="32" ry="38" fill="url(#skinTheoII1)"/>
    <path d="M 318 60 Q 350 28 386 60 Q 392 80 388 92 L 384 84 Q 360 60 350 62 Q 340 60 320 88 L 314 92 Q 312 80 318 60 Z" fill="url(#hairTheoII1)"/>

    <ellipse cx="343" cy="92" rx="3" ry="3.4" fill="#0a0604"/>
    <circle cx="344" cy="91" r="0.85" fill="#a87838"/>
    <ellipse cx="357" cy="92" rx="3" ry="3.4" fill="#0a0604"/>
    <circle cx="358" cy="91" r="0.85" fill="#a87838"/>

    <path d="M 337 88 Q 343 86 349 88" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 351 88 Q 357 86 363 88" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 344 110 L 356 110" stroke="#1a0a08" stroke-width="1" fill="none"/>

    <ellipse cx="345" cy="100" rx="3" ry="0.85" fill="#a85820" opacity="0.55"/>
    <ellipse cx="355" cy="100" rx="3" ry="0.85" fill="#a85820" opacity="0.55"/>

    <ellipse cx="453" cy="178" rx="3" ry="2" fill="#d88838"/>
    <ellipse cx="453" cy="178" rx="2" ry="1.4" fill="#a85820"/>
  </g>
  <g opacity="0.85" filter="url(#bloomII1)">
