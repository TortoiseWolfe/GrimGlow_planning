      <circle cx="240" cy="180" r="6" fill="#5a3018"/>
      <g stroke="#3a1808" stroke-width="0.4">
        <line x1="234" y1="180" x2="246" y2="180"/>
        <line x1="240" y1="174" x2="240" y2="186"/>
        <line x1="236" y1="176" x2="244" y2="184"/>
