<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 21 Panel 1 — Theodore's workshop at night, candlelight and ink</title>
  <desc>Wide establishing shot. Cramped Victorian tinker's workshop at night — workbench cluttered with clockwork tools, brass gears, copper wire spools, half-assembled mechanism. Single candle burns on workbench, filling space with warm amber light, painting everything in Vermeer tones. Victorian boy sits at bench hunched over open journal, steel-nib pen in right hand, inkwell to left. Among familiar clockwork: tiny holographic emitter still faintly glowing in soft varied hues, miniature tool, scrap of soot-darkened metallic material. Window behind shows dark London night. Candlelight and ink.</desc>
  <defs>
    <linearGradient id="bgII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.4" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="candleGlowII1" cx="0.62" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowNightII1" cx="0.15" cy="0.4" r="0.32">
      <stop offset="0" stop-color="#3a4858" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#1a2030" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="benchII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="brassII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="candleFlameII1" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#fff088"/>
      <stop offset="0.8" stop-color="#d88838"/>
      <stop offset="1" stop-color="#a85020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#f4e8c8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="hairTheoII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="waistcoatII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="shirtII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#e8d8b8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="skinTheoII1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <radialGradient id="emitterFadingII1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a878d8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomII1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowII1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowII1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowII1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgII1)"/>
  <rect width="742" height="240" fill="url(#windowNightII1)"/>
  <rect width="742" height="240" fill="url(#candleGlowII1)"/>

  <g>
    <rect x="0" y="0" width="742" height="160" fill="url(#wallII1)" opacity="0.62"/>

    <rect x="40" y="40" width="120" height="100" fill="#1a1828" opacity="0.85"/>
    <rect x="40" y="40" width="120" height="6" fill="#3a1808"/>
    <line x1="100" y1="40" x2="100" y2="140" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="40" y1="90" x2="160" y2="90" stroke="#3a1808" stroke-width="0.85"/>

    <g opacity="0.62">
      <path d="M 50 50 L 90 80 L 50 80 Z" fill="#3a4858"/>
      <path d="M 110 50 L 150 80 L 110 80 Z" fill="#3a4858"/>
      <circle cx="80" cy="105" r="3" fill="#f4b860" opacity="0.55"/>
      <circle cx="80" cy="105" r="6" fill="#f4b860" opacity="0.32"/>
    </g>
    <g opacity="0.42">
      <path d="M 60 100 Q 120 95 156 100" stroke="#5a6878" stroke-width="0.55" fill="none"/>
    </g>
  </g>

