  </g>
  <g opacity="0.62" filter="url(#megaGlowII1)">
    <circle cx="500" cy="92" r="22" fill="#f4b860" opacity="0.55"/>
  </g>
  <g opacity="0.42" filter="url(#ultraGlowII1)">
    <circle cx="500" cy="92" r="50" fill="#f4b860" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="350" cy="240" rx="80" ry="11" fill="#040202" opacity="0.62"/>

