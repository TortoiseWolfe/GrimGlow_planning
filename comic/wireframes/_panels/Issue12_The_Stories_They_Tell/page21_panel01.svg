  </g>
  <g opacity="0.62" filter="url(#strongGlowII1)">
    <ellipse cx="453" cy="178" rx="9" ry="6" fill="#fff8d8" opacity="0.55"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="350" cy="225" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
