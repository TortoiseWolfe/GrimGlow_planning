      <circle cx="540" cy="180" r="9" fill="url(#brassII1)" opacity="0.62"/>
      <circle cx="540" cy="180" r="5" fill="#5a3018"/>

      <rect x="180" y="172" width="22" height="4" rx="1" fill="#3a2230" opacity="0.85"/>
      <rect x="500" y="172" width="22" height="4" rx="1" fill="#3a2230" opacity="0.85"/>

      <path d="M 600 170 Q 620 168 640 172" stroke="url(#brassII1)" stroke-width="0.85" fill="none" opacity="0.85"/>
      <path d="M 600 178 Q 620 176 640 180" stroke="url(#brassII1)" stroke-width="0.85" fill="none" opacity="0.62"/>
    </g>

    <ellipse cx="295" cy="190" rx="22" ry="14" fill="#0a0a14"/>
    <ellipse cx="295" cy="188" rx="20" ry="11" fill="#1a1828"/>
    <circle cx="285" cy="186" r="2" fill="#a8c0e0" opacity="0.32"/>
    <circle cx="295" cy="190" r="2" fill="#3a8858" opacity="0.32"/>
    <circle cx="305" cy="186" r="2" fill="#d88838" opacity="0.32"/>
  </g>
  <g opacity="0.55" filter="url(#bloomII1)">
    <ellipse cx="295" cy="188" rx="22" ry="11" fill="url(#emitterFadingII1)"/>
  </g>

  <g>
    <rect x="380" y="180" width="80" height="44" fill="url(#paperII1)"/>
    <line x1="384" y1="186" x2="456" y2="186" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="384" y1="194" x2="456" y2="194" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="384" y1="202" x2="456" y2="202" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="384" y1="210" x2="450" y2="210" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="384" y1="218" x2="445" y2="218" stroke="#3a2010" stroke-width="0.4"/>

    <g opacity="0.85" font-family="Times New Roman, serif" font-size="2.4" fill="#1a0a04" font-style="italic">
      <text x="386" y="190">they fell like stars, and where they landed</text>
      <text x="386" y="198">the cobblestones glowed with a fairy fire</text>
      <text x="386" y="206">the captain stood no taller than my hand</text>
    </g>

    <rect x="464" y="190" width="6" height="9" fill="#1a0a04"/>
    <ellipse cx="467" cy="200" rx="6" ry="2" fill="#1a0a04" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="500" cy="135" rx="6" ry="2" fill="#1a0a04" opacity="0.62"/>
    <rect x="495" y="100" width="11" height="35" fill="url(#paperII1)" opacity="0.92"/>
    <rect x="498" y="92" width="5" height="9" fill="#080404"/>
    <ellipse cx="500" cy="92" rx="2" ry="3" fill="url(#candleFlameII1)"/>
    <circle cx="500" cy="91" r="1" fill="#fff8d8"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowII1)">
