<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 14 Panel 4 — The last node, "It's out. The light is gone."</title>
  <desc>Close-up. Boy's oil-stained fingers pull dark crystalline node free from core of alien device — final pulse of amber-black light flashes through fingers and dies. Node comes free. Device goes dark. Interior of telegraph exchange cabinet is suddenly, completely ordinary — brass junction blocks, copper wiring, iron housing, and nothing more. No amber-black. No alien light. Copper-gold holographic guide fades at edge of frame. Only morning light remains — warm, clean, natural. Dark crystalline node in fingers is inert, cold, harmless. The ordinary restored.</desc>
  <defs>
    <linearGradient id="bgY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4b860"/>
      <stop offset="0.7" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="morningCleanY4" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinetCleanY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="brassWireY4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="copperWireY4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="skinFingerY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="deadCrystalY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="finalFlashY4" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#a85020" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY4)"/>
  <rect width="366" height="280" fill="url(#morningCleanY4)"/>

  <g opacity="0.42">
    <rect width="366" height="280" fill="url(#finalFlashY4)"/>
  </g>

  <g>
    <rect x="40" y="80" width="286" height="200" fill="url(#cabinetCleanY4)"/>
    <rect x="40" y="80" width="286" height="9" fill="#3a1808"/>
    <rect x="40" y="80" width="9" height="200" fill="#3a1808"/>
    <rect x="317" y="80" width="9" height="200" fill="#3a1808"/>

    <g opacity="0.85" stroke="url(#brassWireY4)" stroke-width="1.4" fill="none">
      <path d="M 60 110 Q 130 116 200 110 Q 260 104 306 110"/>
      <path d="M 60 140 Q 130 146 200 140 Q 260 134 306 140"/>
      <path d="M 60 170 Q 130 176 200 170 Q 260 164 306 170"/>
      <path d="M 60 200 Q 130 206 200 200 Q 260 194 306 200"/>
      <path d="M 60 230 Q 130 236 200 230 Q 260 224 306 230"/>
      <path d="M 60 260 Q 130 266 200 260 Q 260 254 306 260"/>
    </g>
    <g opacity="0.62" stroke="url(#copperWireY4)" stroke-width="0.85" fill="none">
      <path d="M 60 120 Q 130 126 200 120 Q 260 114 306 120"/>
      <path d="M 60 150 Q 130 156 200 150 Q 260 144 306 150"/>
      <path d="M 60 180 Q 130 186 200 180 Q 260 174 306 180"/>
      <path d="M 60 210 Q 130 216 200 210 Q 260 204 306 210"/>
      <path d="M 60 240 Q 130 246 200 240 Q 260 234 306 240"/>
    </g>

