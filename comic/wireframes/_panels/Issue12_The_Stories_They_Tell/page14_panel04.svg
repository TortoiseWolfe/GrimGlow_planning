<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 14 Panel 4 — Theodore's hands move to the nape, the guides converge, "New target. Same hands."</title>
  <desc>Close-up. The boy's oil-stained, burn-scarred hands, a brass gear ring on one finger, rise toward the nape of a slumped man's neck where a small clean alien plug is seated in the flesh. Wren's copper-gold holographic guide swings from the dead cabinet and re-anchors as a target overlay laid precisely over the plug — seating lines, angle indicator, pressure vectors. Luma's blue-violet vitals readout floats beside it — a slow pulse line, a temperature, a warning band rendered in light. Two colors of fairy light converge on one small alien object in human flesh. Morning light warm on the hands and the neck; the overlays cool against it. The same hands, a new and living target.</desc>
  <defs>
    <linearGradient id="bgY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="morningSideY4" cx="0.1" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="napeWarmY4" cx="0.55" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#3a1810" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinNapeY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c898"/>
      <stop offset="0.45" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="collarY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a38"/>
      <stop offset="0.5" stop-color="#3a2e20"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="hairCribY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6850"/>
      <stop offset="0.5" stop-color="#4a3e30"/>
      <stop offset="1" stop-color="#241c12"/>
    </linearGradient>
    <linearGradient id="skinHandY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#e8c090"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="plugY4" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#7a6aa8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#0a0612"/>
    </radialGradient>
    <linearGradient id="copperGuideY4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#a85020"/>
    </linearGradient>
    <linearGradient id="vitalsPanelY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5acd" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2a1a58" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="bloomY4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="violetGlowY4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY4)"/>
  <rect width="366" height="280" fill="url(#morningSideY4)"/>
  <rect width="366" height="280" fill="url(#napeWarmY4)"/>

  <!-- Slumped man: nape, collar, hair seen from above-behind -->
  <g>
    <!-- coat shoulders / collar mass -->
    <path d="M 30 280 L 30 206 Q 120 156 200 162 Q 286 168 342 214 L 342 280 Z" fill="url(#collarY4)"/>
    <path d="M 56 280 Q 130 200 200 204 Q 282 208 322 280" fill="none" stroke="#1a1208" stroke-width="1.4" opacity="0.7"/>
    <path d="M 92 234 Q 170 204 256 214" fill="none" stroke="#6a5640" stroke-width="1" opacity="0.55"/>

    <!-- nape of neck (skin) -->
    <path d="M 132 214 Q 152 156 200 152 Q 250 148 268 200 Q 240 218 200 220 Q 158 222 132 214 Z" fill="url(#skinNapeY4)"/>
    <path d="M 142 174 Q 200 156 256 182" fill="none" stroke="#a87858" stroke-width="2.4" opacity="0.5"/>
    <path d="M 152 204 Q 200 196 248 204" fill="none" stroke="#8a5838" stroke-width="1.2" opacity="0.5"/>

    <!-- hairline above nape (back of head receding from view) -->
    <path d="M 112 166 Q 200 102 292 166 Q 268 144 200 138 Q 134 144 112 166 Z" fill="url(#hairCribY4)"/>
    <path d="M 132 160 Q 200 122 270 160" fill="none" stroke="#241c12" stroke-width="1" opacity="0.6"/>
    <path d="M 162 156 Q 200 136 240 156" fill="none" stroke="#5a4a38" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- The plug seated in the nape (dark Titan iridescence) -->
  <g>
    <ellipse cx="200" cy="188" rx="15" ry="11" fill="url(#plugY4)"/>
    <ellipse cx="200" cy="188" rx="15" ry="11" fill="none" stroke="#5a3098" stroke-width="0.7" opacity="0.7"/>
    <ellipse cx="200" cy="190" rx="19" ry="14" fill="none" stroke="#7a3818" stroke-width="0.9" opacity="0.5"/>
    <path d="M 192 182 L 208 182 L 211 192 L 200 197 L 189 192 Z" fill="#3a2868" opacity="0.9"/>
    <circle cx="200" cy="188" r="3" fill="#7a6aa8" opacity="0.9"/>
    <circle cx="199" cy="187" r="1" fill="#a89ad8"/>
    <!-- dark vein down from plug into collar -->
    <path d="M 200 199 Q 196 210 200 222" fill="none" stroke="#3a2868" stroke-width="1.4" opacity="0.55"/>
  </g>
  <g opacity="0.5" filter="url(#violetGlowY4)">
    <ellipse cx="200" cy="188" rx="16" ry="12" fill="#5a3098" opacity="0.3"/>
  </g>

  <!-- Theodore's hands rising toward the nape from below frame -->
  <g>
    <!-- right hand reaching up -->
    <path d="M 150 280 L 152 240 Q 154 222 168 214 Q 182 208 188 200" fill="none" stroke="url(#skinHandY4)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 168 214 Q 178 204 187 200" fill="none" stroke="url(#skinHandY4)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="190" cy="199" rx="6" ry="5" fill="url(#skinHandY4)"/>
    <!-- left hand from other side -->
    <path d="M 258 280 L 254 242 Q 250 224 236 216 Q 222 210 216 202" fill="none" stroke="url(#skinHandY4)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 236 216 Q 226 206 217 202" fill="none" stroke="url(#skinHandY4)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="210" cy="200" rx="6" ry="5" fill="url(#skinHandY4)"/>

    <!-- oil stains / burn scars -->
    <ellipse cx="160" cy="244" rx="5" ry="3" fill="#3a2818" opacity="0.45"/>
    <ellipse cx="244" cy="248" rx="4" ry="2.6" fill="#3a2818" opacity="0.4"/>
    <path d="M 232 228 L 240 234" stroke="#7a4828" stroke-width="1" opacity="0.5"/>
    <path d="M 172 232 L 178 238" stroke="#7a4828" stroke-width="1" opacity="0.5"/>

    <!-- brass gear ring on right hand -->
    <ellipse cx="172" cy="226" rx="6" ry="4.4" fill="url(#brassRingY4)"/>
    <ellipse cx="172" cy="226" rx="3" ry="2.2" fill="#3a1a08"/>
    <g stroke="#d88838" stroke-width="0.6" opacity="0.8">
      <line x1="172" y1="221.6" x2="172" y2="219.6"/>
      <line x1="176.4" y1="226" x2="178.4" y2="226"/>
      <line x1="167.6" y1="226" x2="165.6" y2="226"/>
    </g>
  </g>
  <g opacity="0.7" filter="url(#bloomY4)">
    <ellipse cx="172" cy="226" rx="9" ry="6" fill="#fff8d8" opacity="0.38"/>
  </g>

  <!-- WREN copper-gold geometry guide: target overlay re-anchored on the plug -->
  <g opacity="0.9">
    <!-- swing arc from dead cabinet (upper-left) into the target -->
    <path d="M 56 62 Q 120 116 184 182" fill="none" stroke="url(#copperGuideY4)" stroke-width="0.9" stroke-dasharray="5 4" opacity="0.7"/>
    <text x="54" y="56" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">RE-ANCHOR</text>

    <!-- target reticle on plug -->
    <circle cx="200" cy="188" r="26" fill="none" stroke="#d88838" stroke-width="0.85"/>
    <circle cx="200" cy="188" r="20" fill="none" stroke="#d88838" stroke-width="0.55" stroke-dasharray="3 3"/>
    <line x1="166" y1="188" x2="190" y2="188" stroke="#d88838" stroke-width="0.7"/>
    <line x1="210" y1="188" x2="234" y2="188" stroke="#d88838" stroke-width="0.7"/>
    <line x1="200" y1="154" x2="200" y2="176" stroke="#d88838" stroke-width="0.7"/>
    <line x1="200" y1="200" x2="200" y2="222" stroke="#d88838" stroke-width="0.7"/>
    <!-- corner brackets -->
    <path d="M 174 166 L 174 174 M 174 166 L 182 166" fill="none" stroke="#fff088" stroke-width="0.9"/>
    <path d="M 226 166 L 226 174 M 226 166 L 218 166" fill="none" stroke="#fff088" stroke-width="0.9"/>
    <path d="M 174 210 L 174 202 M 174 210 L 182 210" fill="none" stroke="#fff088" stroke-width="0.9"/>
    <path d="M 226 210 L 226 202 M 226 210 L 218 210" fill="none" stroke="#fff088" stroke-width="0.9"/>

    <!-- seating-angle indicator -->
    <path d="M 200 188 L 228 170" fill="none" stroke="#fff088" stroke-width="0.7"/>
    <path d="M 222 172 L 228 170 L 226 176" fill="none" stroke="#fff088" stroke-width="0.6"/>
    <text x="230" y="164" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">SEAT 12°</text>
    <!-- pressure vectors -->
    <path d="M 182 204 L 192 196" fill="none" stroke="#d88838" stroke-width="0.6"/>
    <path d="M 218 204 L 208 196" fill="none" stroke="#d88838" stroke-width="0.6"/>
    <text x="146" y="230" font-family="monospace" font-size="2.6" fill="#d88838">NO TORQUE</text>
  </g>
  <g opacity="0.6" filter="url(#strongGlowY4)">
    <circle cx="200" cy="188" r="26" fill="none" stroke="#d88838" stroke-width="2.4" opacity="0.4"/>
  </g>

  <!-- LUMA blue-violet vitals readout floating beside the target -->
  <g opacity="0.92">
    <rect x="262" y="98" width="86" height="66" rx="3" fill="url(#vitalsPanelY4)" stroke="#6a5acd" stroke-width="0.7"/>
    <line x1="262" y1="110" x2="348" y2="110" stroke="#6a5acd" stroke-width="0.4" opacity="0.6"/>
    <text x="266" y="107" font-family="monospace" font-size="3.4" fill="#a89ad8" font-weight="700">VITALS</text>
    <text x="320" y="107" font-family="monospace" font-size="2.8" fill="#8a7ad8">LIVE</text>

    <!-- slow pulse line -->
    <path d="M 266 132 L 282 132 L 286 122 L 290 142 L 294 132 L 312 132 L 316 124 L 320 140 L 324 132 L 344 132"
          fill="none" stroke="#8a7ad8" stroke-width="0.9"/>
    <text x="266" y="122" font-family="monospace" font-size="2.6" fill="#a89ad8">PULSE 41</text>

    <!-- temperature -->
    <text x="266" y="152" font-family="monospace" font-size="2.8" fill="#a89ad8">TEMP 36.4°</text>
    <!-- warning band -->
    <rect x="306" y="146" width="38" height="9" rx="1.5" fill="#6a5acd" opacity="0.28" stroke="#a83838" stroke-width="0.5"/>
    <text x="325" y="152.5" text-anchor="middle" font-family="monospace" font-size="2.6" fill="#d8a0a0" font-weight="700">FRAGILE</text>

    <!-- thread from readout to plug -->
    <path d="M 262 152 Q 230 172 212 186" fill="none" stroke="#6a5acd" stroke-width="0.7" stroke-dasharray="4 3" opacity="0.65"/>
  </g>
  <g opacity="0.5" filter="url(#violetGlowY4)">
    <rect x="262" y="98" width="86" height="66" rx="3" fill="#6a5acd" opacity="0.18"/>
  </g>

  <!-- contact shadow -->
  <g opacity="0.5">
    <ellipse cx="200" cy="277" rx="155" ry="4" fill="#040202" opacity="0.42"/>
  </g>

  <!-- Caption box -->
  <g transform="translate(14,10)">
    <rect x="-6" y="0" width="322" height="45" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="151" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#c87533" font-weight="700">WREN: <tspan fill="#e8e0f0" font-weight="400" font-style="italic">"New target. Same hands. I'll guide the geometry."</tspan></text>
    <text x="151" y="21" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#6a5acd" font-weight="700">LUMA: <tspan fill="#e8e0f0" font-weight="400" font-style="italic">"I'll call his vitals. This is mechanical, not</tspan></text>
    <text x="151" y="31" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#e8e0f0" font-style="italic">medical — find the seat, ease the pressure, no torque.</text>
    <text x="151" y="41" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#e8e0f0" font-style="italic">If you tear it, you'll kill him. Slow."</text>
  </g>
</svg>
