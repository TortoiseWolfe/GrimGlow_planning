    <circle cx="80" cy="120" r="2" fill="#fff8d8" opacity="0.85"/>
    <ellipse cx="280" cy="160" rx="6" ry="4" fill="#5a3018"/>
    <circle cx="280" cy="160" r="2" fill="#fff8d8" opacity="0.85"/>
    <ellipse cx="80" cy="220" rx="6" ry="4" fill="#5a3018"/>
    <circle cx="80" cy="220" r="2" fill="#fff8d8" opacity="0.85"/>
    <ellipse cx="280" cy="240" rx="6" ry="4" fill="#5a3018"/>
    <circle cx="280" cy="240" r="2" fill="#fff8d8" opacity="0.85"/>

    <rect x="140" y="160" width="80" height="60" fill="#3a2010" opacity="0.62"/>
    <line x1="140" y1="180" x2="220" y2="180" stroke="#5a3018" stroke-width="0.55"/>
    <line x1="140" y1="200" x2="220" y2="200" stroke="#5a3018" stroke-width="0.55"/>
    <ellipse cx="180" cy="190" rx="9" ry="6" fill="#1a0a04"/>
  </g>
  <g opacity="0.85" filter="url(#bloomY4)">
    <rect x="40" y="80" width="286" height="80" fill="#fff8d8" opacity="0.32"/>
  </g>

  <g>
    <path d="M 0 60 Q 60 50 100 56 Q 130 60 156 76" stroke="url(#skinFingerY4)" stroke-width="32" fill="none" stroke-linecap="round"/>
    <ellipse cx="156" cy="80" rx="22" ry="14" fill="url(#skinFingerY4)"/>

    <path d="M 80 50 Q 100 50 116 60" stroke="url(#skinFingerY4)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <ellipse cx="100" cy="80" rx="14" ry="9" fill="#5a3018" opacity="0.32"/>
    <ellipse cx="60" cy="65" rx="6" ry="3" fill="#7a4830" opacity="0.42"/>

    <ellipse cx="116" cy="60" rx="4" ry="3" fill="url(#brassRingY4)"/>
    <ellipse cx="116" cy="60" rx="2" ry="1.4" fill="#3a1a08"/>
    <line x1="112" y1="60" x2="120" y2="60" stroke="#5a2e10" stroke-width="0.4"/>

    <path d="M 130 80 L 145 76 L 142 84 Z" fill="#a85820" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#bloomY4)">
    <ellipse cx="116" cy="60" rx="9" ry="6" fill="#fff8d8" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="156" cy="80" rx="14" ry="14" fill="url(#deadCrystalY4)"/>
    <path d="M 145 70 L 167 70 L 172 80 L 167 92 L 145 92 L 140 80 Z" fill="url(#deadCrystalY4)"/>
    <path d="M 145 70 L 167 70 L 156 80 Z" fill="#5a2820" opacity="0.62"/>
    <path d="M 145 92 L 167 92 L 156 80 Z" fill="#5a2820" opacity="0.62"/>
    <line x1="145" y1="70" x2="167" y2="92" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="167" y1="70" x2="145" y2="92" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="156" y1="68" x2="156" y2="92" stroke="#3a1810" stroke-width="0.4"/>
  </g>

  <g opacity="0.32">
    <line x1="180" y1="190" x2="190" y2="200" stroke="#a85020" stroke-width="0.55" opacity="0.55"/>
    <circle cx="180" cy="190" r="2" fill="none" stroke="#a85020" stroke-width="0.4" opacity="0.55"/>
  </g>

  <g opacity="0.32">
    <text x="280" y="60" font-family="monospace" font-size="3" fill="#d88838" opacity="0.42" font-style="italic">▮ ▯ ▯</text>
    <line x1="270" y1="68" x2="320" y2="68" stroke="#d88838" stroke-width="0.4" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="266" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="280" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="130" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#3a2410" font-weight="700">THEODORE:</text>
    <text x="130" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#3a2410" font-style="italic" font-weight="700">"It's out. The light is gone."</text>
  </g>
</svg>
