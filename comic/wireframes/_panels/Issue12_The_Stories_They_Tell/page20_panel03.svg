<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 140" width="742" height="140">
  <title>Issue 12 Page 20 Panel 3 — Steeple from outside, the city stretching, five lights too small to see</title>
  <desc>Extreme wide horizontal strip. Victorian church steeple rises above London skyline in morning light. Stone and brick, bell housing visible. Through arches at top, faintest points of colored light visible — five holographic glows, too small to resolve into figures, five department colors. Below steeple, city stretches in every direction — rooftops, chimneys, telegraph lines catching morning light, gaslit-turning-sunlit sprawl of London. Morning amber-gold across cityscape. The faintest fairy light in the steeple. The stories already down there, in the streets, spreading. Five lights in the largest city — the fairy tales beginning.</desc>
