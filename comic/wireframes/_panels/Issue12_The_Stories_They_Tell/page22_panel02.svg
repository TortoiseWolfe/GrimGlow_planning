<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 380" width="742" height="380">
  <title>Issue 12 Page 22 Panel 2 — KEY IMAGE — overhead journal, the oldest fairy tale</title>
  <desc>Overhead close shot looking down at workbench. Open journal fills center — cream-colored pages covered in boy's careful handwriting, steel-nib pen resting in right hand at page's edge, left hand steadying journal with brass gear ring visible. Fragments of text legible: "they fell like stars, and where they landed, the cobblestones glowed" and "the captain stood no taller than a sparrow, but her voice could command the wind" and "the monsters came from the shadows, and the fairies fought them in the fog, and the light did not go out". Candle burns at top of frame, flame reflected in inkwell. Workbench surrounds journal — brass gears, clockwork tools, dark inert artifacts. No fairy light. Only candlelight on paper, on ink, on the hands of a boy writing mythology. Vermeer overhead. The convergence point in ink.</desc>
  <defs>
    <linearGradient id="bgNN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="candleOverheadNN2" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="benchTopNN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="paperOpenNN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#f4e8c8"/>
      <stop offset="1" stop-color="#d8c8a8"/>
    </linearGradient>
    <linearGradient id="skinHandNN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="penSteelNN2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.4" stop-color="#1a1018"/>
      <stop offset="0.8" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="brassRingNN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="candleFlameNN2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#fff088"/>
      <stop offset="0.8" stop-color="#d88838"/>
      <stop offset="1" stop-color="#a85020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inkwellNN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <filter id="bloomNN2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowNN2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowNN2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowNN2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="742" height="380" fill="url(#bgNN2)"/>
  <rect width="742" height="380" fill="url(#candleOverheadNN2)"/>

  <g>
    <rect x="0" y="0" width="742" height="380" fill="url(#benchTopNN2)" opacity="0.85"/>
    <g opacity="0.42" stroke="#3a1808" stroke-width="0.55">
      <line x1="0" y1="60" x2="742" y2="60"/>
      <line x1="0" y1="200" x2="742" y2="200"/>
      <line x1="0" y1="320" x2="742" y2="320"/>
      <line x1="120" y1="0" x2="120" y2="380"/>
      <line x1="600" y1="0" x2="600" y2="380"/>
    </g>
  </g>

  <g opacity="0.62">
    <circle cx="60" cy="100" r="14" fill="url(#brassRingNN2)" opacity="0.62"/>
    <circle cx="60" cy="100" r="9" fill="#5a3018"/>
    <circle cx="60" cy="100" r="3" fill="#3a1808"/>

    <circle cx="680" cy="120" r="11" fill="url(#brassRingNN2)" opacity="0.62"/>
    <circle cx="680" cy="120" r="6" fill="#5a3018"/>

    <rect x="50" y="280" width="40" height="3" fill="#3a2230" opacity="0.85"/>

    <rect x="640" y="280" width="22" height="22" fill="url(#inkwellNN2)"/>
    <ellipse cx="651" cy="280" rx="11" ry="3" fill="#1a0a04"/>
    <ellipse cx="651" cy="282" rx="9" ry="2" fill="#080404"/>
  </g>
  <g opacity="0.62" filter="url(#strongGlowNN2)">
    <ellipse cx="651" cy="282" rx="11" ry="6" fill="#fff088" opacity="0.55"/>
  </g>

  <g opacity="0.42">
    <rect x="60" y="320" width="22" height="14" fill="#1a1828" opacity="0.62"/>
    <rect x="660" y="320" width="14" height="22" fill="#1a1018" opacity="0.42"/>
  </g>

  <g>
    <rect x="120" y="40" width="480" height="300" fill="url(#paperOpenNN2)"/>
    <line x1="360" y1="40" x2="360" y2="340" stroke="#a87858" stroke-width="1" opacity="0.62"/>
    <rect x="120" y="40" width="480" height="3" fill="#a87858" opacity="0.42"/>

    <g opacity="0.85" font-family="Times New Roman, Georgia, serif" font-size="9" fill="#1a0a04" font-style="italic">
      <text x="140" y="68">I shall set down here what I have seen,</text>
      <text x="140" y="86">though no man may believe me.</text>
      <text x="140" y="116">There were beings of light, no taller</text>
      <text x="140" y="134">than my hand, with wings like dragon-</text>
      <text x="140" y="152">flies made of coloured fire.</text>
      <text x="140" y="180">They fell like stars, and where they</text>
      <text x="140" y="198">landed, the cobblestones glowed for</text>
      <text x="140" y="216">a moment in colours not of this world.</text>
      <text x="140" y="246">The captain stood no taller than a</text>
      <text x="140" y="264">sparrow, but her voice could command</text>
      <text x="140" y="282">the wind, and the monsters obeyed her.</text>
      <text x="140" y="310">And the monsters came from the</text>
      <text x="140" y="328">shadows, and the fairies fought them</text>
    </g>

    <g opacity="0.85" font-family="Times New Roman, Georgia, serif" font-size="9" fill="#1a0a04" font-style="italic">
      <text x="380" y="68">in the fog, and the light did not</text>
      <text x="380" y="86">go out, though the sun would not</text>
      <text x="380" y="104">rise for many hours yet.</text>
      <text x="380" y="134">The scout had hair like dandelion</text>
      <text x="380" y="152">fluff in summer, and laughed like</text>
      <text x="380" y="170">a kettle whistle, and called me</text>
      <text x="380" y="188">"giant" though I am not the largest</text>
      <text x="380" y="206">boy in my street.</text>
      <text x="380" y="236">The engineer had hands too clever</text>
      <text x="380" y="254">for the world she came from. I</text>
      <text x="380" y="272">think she came to ours because</text>
      <text x="380" y="290">a clock will let itself be loved</text>
      <text x="380" y="308">where a future may not.</text>
    </g>

    <g opacity="0.55" stroke="#3a2010" stroke-width="0.4">
      <line x1="140" y1="92" x2="340" y2="92"/>
      <line x1="140" y1="158" x2="340" y2="158"/>
      <line x1="140" y1="222" x2="340" y2="222"/>
      <line x1="140" y1="288" x2="340" y2="288"/>
      <line x1="140" y1="338" x2="340" y2="338"/>
      <line x1="380" y1="110" x2="580" y2="110"/>
      <line x1="380" y1="212" x2="580" y2="212"/>
      <line x1="380" y1="314" x2="580" y2="314"/>
    </g>
  </g>

  <g>
    <ellipse cx="80" cy="280" rx="40" ry="6" fill="#5a2810" opacity="0.55"/>
    <path d="M 0 240 Q 40 230 100 240 L 130 280 L 130 380 L 0 380 Z" fill="url(#skinHandNN2)"/>
    <ellipse cx="60" cy="270" rx="14" ry="3" fill="#7a4830" opacity="0.42"/>

    <ellipse cx="100" cy="240" rx="6" ry="3" fill="url(#brassRingNN2)"/>
    <ellipse cx="100" cy="240" rx="3" ry="2" fill="#3a1a08"/>
    <line x1="94" y1="240" x2="106" y2="240" stroke="#5a2e10" stroke-width="0.4"/>
  </g>
  <g opacity="0.62" filter="url(#bloomNN2)">
    <ellipse cx="100" cy="240" rx="14" ry="9" fill="#fff8d8" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="600" cy="320" rx="40" ry="6" fill="#5a2810" opacity="0.55"/>
    <path d="M 742 240 Q 700 230 640 250 L 600 290 L 580 380 L 742 380 Z" fill="url(#skinHandNN2)"/>
    <ellipse cx="660" cy="290" rx="14" ry="3" fill="#7a4830" opacity="0.42"/>

    <line x1="500" y1="200" x2="640" y2="280" stroke="url(#penSteelNN2)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="500" cy="200" rx="3" ry="2" fill="#a87838" transform="rotate(-30 500 200)"/>
    <line x1="498" y1="198" x2="510" y2="206" stroke="#1a0a04" stroke-width="0.85"/>

    <ellipse cx="500" cy="202" rx="2" ry="1" fill="#080404"/>
  </g>
  <g opacity="0.62" filter="url(#bloomNN2)">
    <ellipse cx="500" cy="200" rx="6" ry="3" fill="#fff8d8" opacity="0.62"/>
  </g>

  <g>
    <rect x="350" y="0" width="40" height="40" fill="#1a0a04"/>
    <rect x="360" y="20" width="20" height="20" fill="url(#paperOpenNN2)"/>
    <rect x="365" y="0" width="10" height="20" fill="#080404"/>
    <ellipse cx="370" cy="0" rx="6" ry="9" fill="url(#candleFlameNN2)"/>
    <circle cx="370" cy="-2" r="2.4" fill="#fff8d8"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowNN2)">
    <circle cx="370" cy="0" r="22" fill="#fff8d8" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowNN2)">
    <circle cx="370" cy="0" r="50" fill="#f4b860" opacity="0.55"/>
  </g>
  <g opacity="0.42" filter="url(#ultraGlowNN2)">
    <circle cx="370" cy="0" r="120" fill="#f4b860" opacity="0.42"/>
  </g>

  <g>
    <line x1="640" y1="280" x2="651" y2="282" stroke="#080404" stroke-width="0.85"/>
    <ellipse cx="641" cy="280" rx="2" ry="1" fill="#080404"/>
  </g>
  <g opacity="0.62" filter="url(#bloomNN2)">
    <ellipse cx="651" cy="282" rx="11" ry="6" fill="#fff088" opacity="0.62"/>
  </g>
</svg>
