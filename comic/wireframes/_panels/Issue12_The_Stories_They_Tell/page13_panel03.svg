<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 13 Panel 3 — The slumped man at the foot of the cabinet, unwitnessed</title>
  <desc>Wide low side-angle street beat. At the foot of a cast-iron telegraph exchange cabinet on a Victorian pavement, Cribbage — a brain-plugged man in worn working clothes — sits slumped against the iron, head lolled, eyes half-closed and vacant, a dark vein at his collar, faint iridescence in his eyes, a clean geometric glint at the nape of his neck. A constable strolls the near pavement, gaze sliding right past him with bored indifference. A thin blue-violet scanner-thread bleeds in from the lower edge — Luma's signal through the comms relay, washing softly across the cabinet internals as she reads the whole network. Full morning light warm on the pavement, one cold geometric highlight on the nape against all the brass.</desc>
  <defs>
    <linearGradient id="bgX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#fff8d8"/>
      <stop offset="0.7" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2838"/>
    </linearGradient>
    <radialGradient id="morningX3" cx="0.5" cy="0.38" r="0.66">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cobbleX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="buildingX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="cabinetIronX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3848"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="cribCoatX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.5" stop-color="#3a2c20"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="cribTrouserX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3028"/>
      <stop offset="0.5" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="constableX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="plugGlowX3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d83838" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#a82020" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lumaThreadX3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6a5acd" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6a5acd" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomX3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="plugBlurX3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="scanBlurX3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgX3)"/>
  <rect width="366" height="240" fill="url(#morningX3)"/>

  <!-- Background building wall, morning-lit brick -->
  <g>
    <rect x="0" y="0" width="366" height="138" fill="url(#buildingX3)" opacity="0.85"/>
    <g opacity="0.5" stroke="#3a1808" stroke-width="0.4">
      <line x1="0" y1="20" x2="366" y2="20"/>
      <line x1="0" y1="40" x2="366" y2="40"/>
      <line x1="0" y1="60" x2="366" y2="60"/>
      <line x1="0" y1="80" x2="366" y2="80"/>
      <line x1="0" y1="100" x2="366" y2="100"/>
      <line x1="0" y1="120" x2="366" y2="120"/>
    </g>
    <rect x="30" y="34" width="26" height="46" fill="#080404"/>
    <rect x="86" y="34" width="26" height="46" fill="#080404"/>
    <rect x="288" y="34" width="26" height="46" fill="#080404"/>
    <rect x="332" y="34" width="26" height="46" fill="#080404"/>
    <rect x="0" y="138" width="366" height="16" fill="#1a0a04"/>
  </g>

  <!-- Pavement -->
  <g>
    <rect x="0" y="154" width="366" height="86" fill="url(#cobbleX3)"/>
    <g opacity="0.6" stroke="#1a1018" stroke-width="0.55">
      <path d="M 0 174 Q 60 176 120 174 Q 180 172 240 174 Q 300 176 366 174"/>
      <path d="M 0 196 Q 60 198 120 196 Q 180 194 240 196 Q 300 198 366 196"/>
      <path d="M 0 218 Q 60 220 120 218 Q 180 216 240 218 Q 300 220 366 218"/>
    </g>
  </g>

  <!-- Constable on near pavement, gaze sliding off, mid-stride -->
  <g>
    <ellipse cx="100" cy="226" rx="9" ry="2.4" fill="#040202" opacity="0.6"/>
    <path d="M 90 178 L 110 178 L 116 224 L 84 224 Z" fill="url(#constableX3)"/>
    <path d="M 84 224 Q 76 236 70 240" stroke="url(#constableX3)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 116 224 Q 122 236 128 240" stroke="url(#constableX3)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- arm swinging forward, away from the slumped man -->
    <path d="M 92 190 Q 80 198 74 210" stroke="url(#constableX3)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="101" cy="166" rx="8" ry="11" fill="#c89868"/>
    <!-- gaze line: looking ahead and slightly down, away from cabinet -->
    <path d="M 94 165 L 78 172" stroke="#1a1410" stroke-width="0.5" opacity="0.4"/>
    <!-- custodian helmet -->
    <path d="M 92 156 Q 101 146 110 156 L 112 162 L 90 162 Z" fill="#0a0a14"/>
    <ellipse cx="101" cy="150" rx="3" ry="2.4" fill="#0a0a14"/>
    <circle cx="101" cy="148" r="1" fill="#1a2030"/>
    <line x1="90" y1="162" x2="112" y2="162" stroke="#a85020" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Cast-iron telegraph exchange cabinet flank, right of frame, low angle -->
  <g>
    <ellipse cx="278" cy="222" rx="40" ry="6" fill="#040202" opacity="0.6"/>
    <rect x="248" y="100" width="62" height="120" fill="url(#cabinetIronX3)"/>
    <rect x="248" y="100" width="62" height="8" fill="#080404"/>
    <!-- riveted seams -->
    <line x1="248" y1="140" x2="310" y2="140" stroke="#3a3848" stroke-width="0.6" opacity="0.7"/>
    <line x1="248" y1="180" x2="310" y2="180" stroke="#3a3848" stroke-width="0.6" opacity="0.7"/>
    <line x1="280" y1="108" x2="280" y2="220" stroke="#080404" stroke-width="0.8"/>
    <g fill="#3a3848" opacity="0.6">
      <circle cx="254" cy="114" r="1"/>
      <circle cx="304" cy="114" r="1"/>
      <circle cx="254" cy="214" r="1"/>
      <circle cx="304" cy="214" r="1"/>
    </g>
    <!-- ajar access panel at top, faint warm interior -->
    <rect x="252" y="104" width="54" height="30" fill="#0a0a14" opacity="0.85"/>
    <ellipse cx="278" cy="118" rx="18" ry="8" fill="#a85020" opacity="0.18" filter="url(#bloomX3)"/>
  </g>

  <!-- Cribbage: brain-plugged man slumped against the cabinet base, vacant -->
  <g>
    <ellipse cx="232" cy="222" rx="30" ry="5" fill="#040202" opacity="0.6"/>
    <!-- legs splayed on the cold stone -->
    <path d="M 226 200 Q 210 214 192 218" stroke="url(#cribTrouserX3)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 236 202 Q 224 216 206 222" stroke="url(#cribTrouserX3)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- worn boots -->
    <ellipse cx="190" cy="219" rx="6" ry="3" fill="#080404"/>
    <ellipse cx="204" cy="223" rx="6" ry="3" fill="#080404"/>
    <!-- torso slumped against cabinet, leaning into the iron -->
    <path d="M 224 158 L 248 156 L 250 204 L 220 206 Z" fill="url(#cribCoatX3)"/>
    <!-- limp arm fallen in lap, trembling-still -->
    <path d="M 232 172 Q 220 184 214 196" stroke="url(#cribCoatX3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="213" cy="197" rx="3.4" ry="2.6" fill="#c89060"/>
    <!-- clockmaker's loupe on a cord at the chest -->
    <line x1="238" y1="160" x2="231" y2="178" stroke="#1a1208" stroke-width="0.6"/>
    <circle cx="231" cy="180" r="2.4" fill="none" stroke="#7a5828" stroke-width="0.9"/>
    <circle cx="231" cy="180" r="1" fill="#3a2c20" opacity="0.7"/>
    <!-- collar with dark plug-vein creeping up -->
    <path d="M 230 158 L 240 157 L 238 164 L 232 165 Z" fill="#2a2018"/>
    <path d="M 236 162 Q 238 154 240 148" stroke="#2a0808" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M 236 162 Q 234 156 232 150" stroke="#2a0808" stroke-width="0.9" fill="none" opacity="0.7"/>
    <!-- head lolled to the side, vacant -->
    <ellipse cx="240" cy="146" rx="9" ry="11" fill="#c89060"/>
    <!-- lank hair -->
    <path d="M 231 138 Q 240 128 250 138 Q 251 144 249 148 L 232 149 Q 230 144 231 138 Z" fill="#3a2c1c"/>
    <!-- half-closed vacant eyes, faint iridescence -->
    <line x1="234" y1="146" x2="239" y2="146.5" stroke="#1a1410" stroke-width="0.9"/>
    <line x1="242" y1="146" x2="247" y2="146.5" stroke="#1a1410" stroke-width="0.9"/>
    <ellipse cx="236.5" cy="146" rx="1.6" ry="0.7" fill="#5a3098" opacity="0.55"/>
    <ellipse cx="244.5" cy="146" rx="1.6" ry="0.7" fill="#5a3098" opacity="0.55"/>
    <!-- slack mouth -->
    <line x1="237" y1="153" x2="244" y2="152.5" stroke="#5a3018" stroke-width="0.7" opacity="0.7"/>
  </g>
  <!-- warm-red organic plug glow at the collar/nape -->
  <g opacity="0.7" filter="url(#plugBlurX3)">
    <ellipse cx="245" cy="142" rx="7" ry="6" fill="url(#plugGlowX3)"/>
  </g>
  <!-- geometric glint at the nape, too clean for Victorian iron -->
  <g>
    <rect x="246" y="140" width="3" height="3" transform="rotate(45 247.5 141.5)" fill="#2a1838"/>
    <rect x="246.4" y="140.4" width="2.2" height="2.2" transform="rotate(45 247.5 141.5)" fill="#6a5acd" opacity="0.8"/>
    <circle cx="247.5" cy="141.5" r="0.6" fill="#c8c0ff"/>
  </g>
  <g opacity="0.7" filter="url(#bloomX3)">
    <circle cx="247.5" cy="141.5" r="3.4" fill="#6a5acd" opacity="0.45"/>
  </g>

  <!-- Luma's thin blue-violet scanner-thread bleeding in from lower edge into the cabinet -->
  <g opacity="0.8" filter="url(#scanBlurX3)">
    <path d="M 8 238 Q 120 224 230 168 Q 262 142 278 118" stroke="url(#lumaThreadX3)" stroke-width="1.4" fill="none"/>
    <path d="M 8 234 Q 120 220 232 164 Q 264 138 280 116" stroke="url(#lumaThreadX3)" stroke-width="0.6" fill="none" opacity="0.6"/>
  </g>
  <!-- scanner wash across cabinet internals -->
  <g opacity="0.5" filter="url(#bloomX3)">
    <ellipse cx="278" cy="119" rx="16" ry="7" fill="#6a5acd" opacity="0.32"/>
  </g>
  <!-- faint reticule ticks along the thread -->
  <g stroke="#6a5acd" stroke-width="0.5" opacity="0.5">
    <line x1="150" y1="208" x2="153" y2="205"/>
    <line x1="190" y1="190" x2="193" y2="187"/>
    <line x1="226" y1="166" x2="229" y2="163"/>
  </g>

  <!-- ambient murmur -->
  <g opacity="0.5">
    <text x="74" y="200" font-family="monospace" font-size="3" fill="#1a0a04" opacity="0.6" font-style="italic">move along</text>
  </g>

  <!-- LUMA radio caption box (sapphire-violet, comms = dashed stroke) -->
  <g transform="translate(10 10)">
    <rect x="0" y="0" width="184" height="40" rx="3" fill="#1a1828" stroke="#6a5acd" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="8" y="13" font-family="Verdana, sans-serif" font-size="8" font-weight="bold" fill="#6a5acd">LUMA (radio)</text>
    <text x="8" y="25" font-family="Verdana, sans-serif" font-size="7.2" fill="#1a1410">Theodore — I'm reading the whole network off</text>
    <text x="8" y="35" font-family="Verdana, sans-serif" font-size="7.2" fill="#1a1410">your relay. Stay on the nodes. I've got eyes on the rest.</text>
  </g>
</svg>
