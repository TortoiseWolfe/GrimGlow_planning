<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 13 Panel 3 — Wren stilled by Theodore's clockmaker language, "...yes. Exactly like that."</title>
  <desc>Medium shot. Tiny figure in maximum-degradation copper suit on Victorian rooftop, surrounded by expanded copper-gold holographic display — schematics, data feeds, Titan device internals rendered in geometric light. Hands stilled mid-gesture — fingers no longer moving through schematics, arms dropped fractionally, display cycling on without her direction. East Asian features, dark hair in high messy bun. Face turned slightly toward where Theodore's voice is coming from, expression open and unguarded — not engineer's mask but rarer look of someone stopped in their tracks. The engineer who forgot, for one beat, that she was the one who knew more.</desc>
  <defs>
    <linearGradient id="bgW3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#fff8d8"/>
      <stop offset="0.7" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="copperFloodW3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopW3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitWrenW3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="hairWrenW3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenW3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="schematicW3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <radialGradient id="eyeOpenW3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d8a878" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomW3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowW3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowW3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgW3)"/>
  <rect width="366" height="240" fill="url(#copperFloodW3)"/>

  <g>
