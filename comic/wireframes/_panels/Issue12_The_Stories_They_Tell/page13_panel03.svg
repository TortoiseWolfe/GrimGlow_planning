    <line x1="0" y1="186" x2="366" y2="186" stroke="#080404" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.4">
      <line x1="0" y1="210" x2="366" y2="210"/>
      <line x1="80" y1="186" x2="80" y2="240"/>
      <line x1="200" y1="186" x2="200" y2="240"/>
      <line x1="300" y1="186" x2="300" y2="240"/>
    </g>
  </g>

  <g>
