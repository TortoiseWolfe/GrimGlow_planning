    <circle cx="119" cy="99" r="0.7" fill="url(#eyeOpenW3)"/>
    <ellipse cx="128" cy="100" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="129" cy="99" r="0.7" fill="url(#eyeOpenW3)"/>

    <path d="M 114 96 Q 118 94 122 96" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 124 96 Q 128 94 132 96" stroke="#0a0604" stroke-width="0.55" fill="none"/>

    <path d="M 119 114 L 127 114" stroke="#1a0a08" stroke-width="0.55" fill="none"/>
    <path d="M 119 114 Q 123 113 127 114" stroke="#1a0a08" stroke-width="0.4" fill="none"/>

    <ellipse cx="120" cy="106" rx="2" ry="0.7" fill="#a85820" opacity="0.55"/>
    <ellipse cx="126" cy="106" rx="2" ry="0.7" fill="#a85820" opacity="0.55"/>

    <path d="M 98 200 Q 90 212 84 220" stroke="url(#suitWrenW3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 148 200 Q 156 212 162 220" stroke="url(#suitWrenW3)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <path d="M 145 150 L 165 144" stroke="url(#skinWrenW3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="167" cy="142" rx="4" ry="3" fill="url(#skinWrenW3)"/>
    <path d="M 101 144 L 86 152" stroke="url(#skinWrenW3)" stroke-width="6" fill="none" stroke-linecap="round"/>
