    <text x="186" y="72" font-family="monospace" font-size="3.4" fill="#d88838" font-weight="700">DEVICE INTERNALS — LIVE</text>
    <line x1="186" y1="76" x2="334" y2="76" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>

    <g opacity="0.85" stroke="#d88838" stroke-width="0.4" fill="none">
      <rect x="200" y="84" width="120" height="50"/>
      <line x1="200" y1="100" x2="320" y2="100"/>
      <line x1="200" y1="116" x2="320" y2="116"/>
      <line x1="240" y1="84" x2="240" y2="134"/>
      <line x1="280" y1="84" x2="280" y2="134"/>
    </g>
    <g>
      <rect x="208" y="88" width="6" height="6" fill="#3a1810" opacity="0.85"/>
      <rect x="248" y="88" width="6" height="6" fill="#3a1810" opacity="0.85"/>
      <rect x="288" y="88" width="6" height="6" fill="#3a1810" opacity="0.85"/>
      <rect x="208" y="120" width="6" height="6" fill="#a85020" opacity="0.95"/>
      <rect x="248" y="120" width="6" height="6" fill="#a85020" opacity="0.95"/>
      <rect x="288" y="120" width="6" height="6" fill="#a85020" opacity="0.95"/>
      <circle cx="260" cy="108" r="3" fill="#a85020" opacity="0.95"/>
    </g>

    <text x="260" y="150" text-anchor="middle" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">[5/7] LOAD-BEARING</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowW3)">
    <rect x="180" y="60" width="160" height="100" fill="#d88838" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowW3)">
    <rect x="180" y="60" width="160" height="100" fill="#a85820" opacity="0.32"/>
  </g>

  <g>
    <text x="20" y="40" font-family="monospace" font-size="4" fill="#d88838" opacity="0.62" font-style="italic">▮ ▯ ▮</text>
    <text x="60" y="60" font-family="monospace" font-size="3" fill="#d88838" opacity="0.55">∇⊥◊</text>
  </g>

  <g opacity="0.85" filter="url(#bloomW3)">
    <ellipse cx="123" cy="100" rx="22" ry="14" fill="#fff8d8" opacity="0.32"/>
