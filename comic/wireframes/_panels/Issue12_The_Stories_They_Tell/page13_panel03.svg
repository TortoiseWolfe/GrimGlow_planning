  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="200" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="96" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#3a2410" font-weight="700">THEODORE: "Like the main escapement wheel."</text>
    <text x="96" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a85820" font-style="italic" font-weight="700">WREN (a pause): "...yes. Exactly like that."</text>
