    <ellipse cx="123" cy="160" rx="22" ry="32" fill="url(#suitWrenW3)"/>
    <path d="M 101 130 L 145 130 L 148 200 L 98 200 Z" fill="url(#suitWrenW3)"/>

    <path d="M 103 138 L 113 134 L 110 148 L 100 150 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 135 152 L 145 150 L 143 160 L 133 162 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 115 172 L 125 172 L 121 180 L 113 180 Z" fill="#1a0804" opacity="0.85"/>

    <ellipse cx="123" cy="100" rx="14" ry="18" fill="url(#skinWrenW3)"/>
