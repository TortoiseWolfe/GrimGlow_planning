<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 14 Panel 2 — Sable's tactical, "The satellites are stabilizing."</title>
  <desc>Close-up holographic tactical display. Four satellite device markers settling — amber-black fading, grey strengthening. Central hub marker's amber-black pulse weakening. Network is dying. One more disconnection and it collapses. Blue-white holographic light, amber-black fading from display like fever breaking. The tide turning.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="hopeFieldY2" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="satFadingY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a7a7a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubFadingY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a3018" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY2)"/>
  <rect width="366" height="280" fill="url(#hopeFieldY2)"/>

  <g>
    <rect x="20" y="20" width="326" height="240" rx="4" fill="none" stroke="url(#frameY2)" stroke-width="1.4" opacity="0.85"/>
    <rect x="26" y="26" width="314" height="228" fill="#0a0a14" opacity="0.85"/>

    <text x="40" y="44" font-family="monospace" font-size="5" fill="#a8c0e0" font-weight="700">TACTICAL — STABILIZING</text>
    <text x="320" y="44" text-anchor="end" font-family="monospace" font-size="4" fill="#3a8858" font-weight="700">▼ FADING</text>
    <line x1="40" y1="50" x2="326" y2="50" stroke="#a8c0e0" stroke-width="0.4" opacity="0.62"/>

    <g opacity="0.55" stroke="#5a78a8" stroke-width="0.4" fill="none">
      <line x1="60" y1="80" x2="306" y2="80"/>
      <line x1="60" y1="120" x2="306" y2="120"/>
      <line x1="60" y1="160" x2="306" y2="160"/>
      <line x1="60" y1="200" x2="306" y2="200"/>
      <line x1="100" y1="70" x2="100" y2="210"/>
      <line x1="160" y1="70" x2="160" y2="210"/>
      <line x1="220" y1="70" x2="220" y2="210"/>
      <line x1="280" y1="70" x2="280" y2="210"/>
    </g>

    <g>
      <ellipse cx="100" cy="100" rx="14" ry="9" fill="url(#satFadingY2)"/>
      <text x="100" y="120" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#7a7a7a" font-weight="700">A 22%</text>

      <ellipse cx="280" cy="100" rx="14" ry="9" fill="url(#satFadingY2)"/>
      <text x="280" y="120" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#7a7a7a" font-weight="700">B 18%</text>

      <ellipse cx="100" cy="180" rx="14" ry="9" fill="url(#satFadingY2)"/>
      <text x="100" y="200" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#7a7a7a" font-weight="700">C 25%</text>

      <ellipse cx="280" cy="180" rx="14" ry="9" fill="url(#satFadingY2)"/>
      <text x="280" y="200" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#7a7a7a" font-weight="700">D 20%</text>

      <circle cx="183" cy="140" r="22" fill="url(#hubFadingY2)"/>
      <circle cx="183" cy="140" r="11" fill="#5a3018" opacity="0.62"/>
      <circle cx="183" cy="140" r="5" fill="#7a3018" opacity="0.42"/>
      <text x="183" y="170" text-anchor="middle" font-family="monospace" font-size="4" fill="#7a3018" font-weight="700">HUB ▼ 12%</text>

      <g opacity="0.42" stroke="#7a7a7a" stroke-width="0.4" stroke-dasharray="2,3" fill="none">
        <line x1="100" y1="100" x2="183" y2="140"/>
        <line x1="280" y1="100" x2="183" y2="140"/>
        <line x1="100" y1="180" x2="183" y2="140"/>
        <line x1="280" y1="180" x2="183" y2="140"/>
      </g>
    </g>

    <text x="183" y="234" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#3a8858" font-weight="700">► RESTORE SIGNAL FAILING ◄</text>
    <text x="183" y="244" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a8c0e0" font-style="italic">ONE NODE TO COLLAPSE</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowY2)">
    <rect x="20" y="20" width="326" height="240" fill="#a8c0e0" opacity="0.32"/>
  </g>
  <g opacity="0.42" filter="url(#bloomY2)">
    <ellipse cx="100" cy="100" rx="22" ry="14" fill="#7a7a7a" opacity="0.32"/>
    <ellipse cx="280" cy="100" rx="22" ry="14" fill="#7a7a7a" opacity="0.32"/>
    <ellipse cx="100" cy="180" rx="22" ry="14" fill="#7a7a7a" opacity="0.32"/>
    <ellipse cx="280" cy="180" rx="22" ry="14" fill="#7a7a7a" opacity="0.32"/>
  </g>
  <g opacity="0.32" filter="url(#megaGlowY2)">
    <circle cx="183" cy="140" r="32" fill="#7a3018" opacity="0.32"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="156" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE (barely breathing): "Satellites stabilizing."</text>
    <text x="156" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-style="italic" font-weight="700">"Restore signal weakening. One more, Theodore."</text>
  </g>
</svg>
