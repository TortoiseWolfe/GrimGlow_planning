<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 14 Panel 2 — Luma's scanner, "There's an eighth contact. It's organic."</title>
  <desc>Close-up holographic scanner readout in blue-violet light, projected over the open dead telegraph cabinet. Seven crystalline node-signatures hang faceted and grey — all dead, inert. But one eighth signature still reads live and it is wrong: soft, branching, organic, pulsing in a slow steady human rhythm — a heartbeat rendered in light, warm against the cold violet. The device's death did not free it. Someone is plugged into the network.</desc>
  <defs>
    <linearGradient id="bgL2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181428"/>
      <stop offset="0.5" stop-color="#0a081a"/>
      <stop offset="1" stop-color="#040208"/>
    </linearGradient>
    <radialGradient id="scanFieldL2" cx="0.5" cy="0.5" r="0.58">
      <stop offset="0" stop-color="#6a5acd" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#4a3a98" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0a081a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameL2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a78d8"/>
      <stop offset="0.5" stop-color="#5a4aa0"/>
      <stop offset="1" stop-color="#2a2050"/>
    </linearGradient>
    <linearGradient id="cabL2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c1a"/>
      <stop offset="0.5" stop-color="#241a0e"/>
      <stop offset="1" stop-color="#120c06"/>
    </linearGradient>
    <radialGradient id="nodeDeadL2" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#8a8a8a" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#4a4a52" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#0a081a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="organicL2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9868" stop-opacity="0.92"/>
      <stop offset="0.4" stop-color="#d85838" stop-opacity="0.72"/>
      <stop offset="0.75" stop-color="#8a2818" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#180808" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomL2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowL2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowL2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgL2)"/>
  <rect width="366" height="280" fill="url(#scanFieldL2)"/>

  <g>
    <rect x="22" y="62" width="322" height="178" rx="3" fill="url(#cabL2)" opacity="0.92"/>
    <rect x="22" y="62" width="322" height="178" rx="3" fill="none" stroke="#1a120a" stroke-width="2"/>
    <g opacity="0.4" stroke="#0a0604" stroke-width="0.6">
      <line x1="120" y1="64" x2="120" y2="238"/>
      <line x1="246" y1="64" x2="246" y2="238"/>
      <line x1="24" y1="150" x2="342" y2="150"/>
    </g>
  </g>

  <g>
    <rect x="20" y="20" width="326" height="240" rx="4" fill="none" stroke="url(#frameL2)" stroke-width="1.4" opacity="0.9"/>
    <rect x="30" y="56" width="306" height="190" rx="3" fill="#0a081a" opacity="0.5" stroke="#6a5acd" stroke-width="0.6"/>

    <text x="40" y="46" font-family="monospace" font-size="5" fill="#9a88e8" font-weight="700">SCAN — NODE SIGNATURES</text>
    <text x="326" y="46" text-anchor="end" font-family="monospace" font-size="4" fill="#d85838" font-weight="700">● LIVE: 1</text>
    <line x1="40" y1="51" x2="326" y2="51" stroke="#6a5acd" stroke-width="0.4" opacity="0.7"/>

    <g opacity="0.5" stroke="#5a4aa0" stroke-width="0.4" fill="none">
      <line x1="40" y1="90" x2="326" y2="90"/>
      <line x1="40" y1="130" x2="326" y2="130"/>
      <line x1="40" y1="170" x2="326" y2="170"/>
      <line x1="40" y1="210" x2="326" y2="210"/>
    </g>

    <g opacity="0.35" stroke="#7a6ad0" stroke-width="0.4" stroke-dasharray="2,3" fill="none">
      <line x1="78" y1="100" x2="183" y2="158"/>
      <line x1="143" y1="100" x2="183" y2="158"/>
      <line x1="223" y1="100" x2="183" y2="158"/>
      <line x1="288" y1="100" x2="183" y2="158"/>
      <line x1="78" y1="200" x2="183" y2="158"/>
      <line x1="143" y1="200" x2="183" y2="158"/>
      <line x1="288" y1="200" x2="183" y2="158"/>
    </g>

    <g fill="none" stroke="#8a8a8a" stroke-width="0.9" opacity="0.8">
      <g transform="translate(78,100)"><path d="M0,-9 L8,-3 L8,5 L0,11 L-8,5 L-8,-3 Z"/><path d="M0,-9 L0,11 M-8,-3 L8,5 M-8,5 L8,-3"/></g>
      <g transform="translate(143,100)"><path d="M0,-9 L8,-3 L8,5 L0,11 L-8,5 L-8,-3 Z"/><path d="M0,-9 L0,11 M-8,-3 L8,5 M-8,5 L8,-3"/></g>
      <g transform="translate(223,100)"><path d="M0,-9 L8,-3 L8,5 L0,11 L-8,5 L-8,-3 Z"/><path d="M0,-9 L0,11 M-8,-3 L8,5 M-8,5 L8,-3"/></g>
      <g transform="translate(288,100)"><path d="M0,-9 L8,-3 L8,5 L0,11 L-8,5 L-8,-3 Z"/><path d="M0,-9 L0,11 M-8,-3 L8,5 M-8,5 L8,-3"/></g>
      <g transform="translate(78,200)"><path d="M0,-9 L8,-3 L8,5 L0,11 L-8,5 L-8,-3 Z"/><path d="M0,-9 L0,11 M-8,-3 L8,5 M-8,5 L8,-3"/></g>
      <g transform="translate(143,200)"><path d="M0,-9 L8,-3 L8,5 L0,11 L-8,5 L-8,-3 Z"/><path d="M0,-9 L0,11 M-8,-3 L8,5 M-8,5 L8,-3"/></g>
      <g transform="translate(288,200)"><path d="M0,-9 L8,-3 L8,5 L0,11 L-8,5 L-8,-3 Z"/><path d="M0,-9 L0,11 M-8,-3 L8,5 M-8,5 L8,-3"/></g>
    </g>

    <g font-family="monospace" font-size="3.4" fill="#7a7a7a" font-weight="700" text-anchor="middle">
      <text x="78" y="120">N1 ✕ DEAD</text>
      <text x="143" y="120">N2 ✕ DEAD</text>
      <text x="223" y="120">N3 ✕ DEAD</text>
      <text x="288" y="120">N4 ✕ DEAD</text>
      <text x="78" y="220">N5 ✕ DEAD</text>
      <text x="143" y="220">N6 ✕ DEAD</text>
      <text x="288" y="220">N7 ✕ DEAD</text>
    </g>

    <g>
      <path d="M183,138 C176,134 172,140 174,148 C168,150 170,158 176,159 C172,166 180,170 184,165 C188,172 196,168 193,160 C200,159 199,150 192,149 C196,141 189,135 183,138 Z" fill="url(#organicL2)"/>
      <path d="M183,150 C181,146 178,148 179,151 M183,150 C186,147 189,149 188,152 M183,150 L181,158 M183,150 L186,159 M183,150 L183,143" fill="none" stroke="#ffb888" stroke-width="0.7" opacity="0.85"/>
      <circle cx="183" cy="152" r="3" fill="#ffd0a8" opacity="0.9"/>
    </g>
    <text x="223" y="200" text-anchor="middle" font-family="monospace" font-size="4" fill="#ff9868" font-weight="700">N8 ● LIVE — ORGANIC</text>
    <text x="223" y="210" text-anchor="middle" font-family="monospace" font-size="3.2" fill="#d85838" font-weight="700">PULSE 64 BPM ♥</text>

    <text x="183" y="237" text-anchor="middle" font-family="monospace" font-size="3.4" fill="#9a88e8" font-weight="700">► NETWORK ACTIVE — CONTACT NOT CRYSTALLINE ◄</text>
  </g>

  <g opacity="0.85" filter="url(#strongGlowL2)">
    <rect x="30" y="56" width="306" height="190" fill="#6a5acd" opacity="0.22"/>
  </g>
  <g opacity="0.32" filter="url(#bloomL2)">
    <circle cx="78" cy="100" r="14" fill="#8a8a8a" opacity="0.28"/>
    <circle cx="143" cy="100" r="14" fill="#8a8a8a" opacity="0.28"/>
    <circle cx="223" cy="100" r="14" fill="#8a8a8a" opacity="0.28"/>
    <circle cx="288" cy="100" r="14" fill="#8a8a8a" opacity="0.28"/>
    <circle cx="78" cy="200" r="14" fill="#8a8a8a" opacity="0.28"/>
    <circle cx="143" cy="200" r="14" fill="#8a8a8a" opacity="0.28"/>
    <circle cx="288" cy="200" r="14" fill="#8a8a8a" opacity="0.28"/>
  </g>
  <g opacity="0.5" filter="url(#megaGlowL2)">
    <circle cx="183" cy="152" r="26" fill="#d85838" opacity="0.42"/>
  </g>
  <g opacity="0.42" filter="url(#bloomL2)">
    <circle cx="183" cy="152" r="12" fill="#ff9868" opacity="0.55"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="40" rx="3" fill="#1a1828" opacity="0.95" stroke="#6a5acd" stroke-width="1.2" stroke-dasharray="5,2"/>
    <text x="156" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#9a88e8" font-weight="700">LUMA (radio, sharp): "Theodore — don't move. The device is</text>
    <text x="156" y="19.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#e8e4f4">dead but the network isn't. There's an eighth contact.</text>
    <text x="156" y="28" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#e8e4f4">It's not crystalline. It's organic.</text>
    <text x="156" y="36.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#ff9868" font-style="italic" font-weight="700">Someone's plugged into this."</text>
  </g>
</svg>
