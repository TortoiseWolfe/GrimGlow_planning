<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 12 Page 3 Panel 2 — Jink at Junction Alpha, "Nasty little thing. Three minutes."</title>
  <desc>Close-up slight dutch angle. Tiny figure hovers beside rooftop telegraph junction box, one hand gripping wire for stability, other reaching into open junction box where Titan device pulses sickly amber-black between copper wires. Wing-pack fully deployed, translucent emerald-green dragonfly wings holding position. Wild bright golden blonde curly hair, emerald suit heavily degraded with soot and copper wire repairs. Concentration with flicker of old grin. Open dawn sky behind.</desc>
  <defs>
    <linearGradient id="bgK2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="dawnK2" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="junctionMetalK2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.5" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="titanPulseK2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitJinkK2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeK2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="wingTransK2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#fff088" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3a8858" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomK2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowK2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowK2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
    <filter id="wrongnessK2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <g transform="rotate(4 123 120)">
    <rect width="246" height="240" fill="url(#bgK2)"/>
    <rect width="246" height="240" fill="url(#dawnK2)"/>
  </g>

  <g transform="rotate(4 123 120)">
    <rect x="60" y="80" width="120" height="100" fill="url(#junctionMetalK2)"/>
    <rect x="60" y="80" width="120" height="6" fill="#1a0a04"/>
    <rect x="60" y="174" width="120" height="6" fill="#1a0a04"/>
    <rect x="60" y="80" width="6" height="100" fill="#1a0a04"/>

    <rect x="80" y="100" width="100" height="80" fill="#0a0604"/>
    <line x1="80" y1="120" x2="180" y2="120" stroke="#3a2010" stroke-width="0.55"/>
    <line x1="80" y1="140" x2="180" y2="140" stroke="#3a2010" stroke-width="0.55"/>
    <line x1="80" y1="160" x2="180" y2="160" stroke="#3a2010" stroke-width="0.55"/>

    <g opacity="0.85" stroke="#a85820" stroke-width="0.7" fill="none">
      <path d="M 86 110 Q 100 116 130 110 Q 160 104 178 110"/>
      <path d="M 86 130 Q 100 136 130 130 Q 160 124 178 130"/>
      <path d="M 86 150 Q 100 156 130 150 Q 160 144 178 150"/>
      <path d="M 86 170 Q 100 176 130 170 Q 160 164 178 170"/>
    </g>

    <ellipse cx="130" cy="140" rx="22" ry="14" fill="#1a0810"/>
    <ellipse cx="130" cy="140" rx="14" ry="9" fill="url(#titanPulseK2)"/>
    <circle cx="130" cy="140" r="3" fill="#a85020" opacity="0.95"/>
    <line x1="122" y1="136" x2="138" y2="144" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="138" y1="136" x2="122" y2="144" stroke="#3a1810" stroke-width="0.55"/>
  </g>
  <g opacity="0.85" filter="url(#wrongnessK2)" transform="rotate(4 123 120)">
    <ellipse cx="130" cy="140" rx="32" ry="22" fill="#a85020" opacity="0.42"/>
  </g>

  <g transform="rotate(4 123 120)">
    <line x1="60" y1="100" x2="20" y2="80" stroke="#0a0604" stroke-width="0.85"/>
    <line x1="60" y1="120" x2="0" y2="100" stroke="#0a0604" stroke-width="0.85"/>
    <line x1="60" y1="160" x2="0" y2="180" stroke="#0a0604" stroke-width="0.85"/>
    <line x1="180" y1="100" x2="246" y2="80" stroke="#0a0604" stroke-width="0.85"/>
    <line x1="180" y1="160" x2="246" y2="180" stroke="#0a0604" stroke-width="0.85"/>
  </g>

  <g transform="rotate(4 123 120)">
    <path d="M 30 60 Q 0 50 -20 80 Q 0 100 30 100 Q 50 80 50 70 Q 50 60 30 60 Z" fill="url(#wingTransK2)" opacity="0.85"/>
    <path d="M 30 130 Q 0 120 -20 150 Q 0 170 30 170 Q 50 150 50 140 Q 50 130 30 130 Z" fill="url(#wingTransK2)" opacity="0.85"/>
    <g opacity="0.7" stroke="#3a8858" stroke-width="0.55" fill="none">
      <line x1="30" y1="60" x2="0" y2="80"/>
      <line x1="30" y1="60" x2="20" y2="100"/>
      <line x1="30" y1="60" x2="50" y2="80"/>
      <line x1="30" y1="130" x2="0" y2="150"/>
      <line x1="30" y1="130" x2="20" y2="170"/>
      <line x1="30" y1="130" x2="50" y2="140"/>
    </g>

    <ellipse cx="50" cy="100" rx="11" ry="22" fill="url(#suitJinkK2)"/>
    <path d="M 38 80 L 64 80 L 66 124 L 36 124 Z" fill="url(#suitJinkK2)"/>
    <path d="M 38 84 L 44 82 L 42 92 L 36 94 Z" fill="#0a2018" opacity="0.85"/>

    <ellipse cx="50" cy="60" rx="11" ry="14" fill="#a87858"/>
    <path d="M 36 50 Q 50 36 66 48 Q 70 56 66 60 Q 56 52 50 56 Q 44 52 38 60 Q 36 56 36 50 Z" fill="url(#hairBlondeK2)"/>
    <ellipse cx="44" cy="60" rx="2" ry="4" fill="url(#hairBlondeK2)"/>
    <ellipse cx="56" cy="60" rx="2" ry="4" fill="url(#hairBlondeK2)"/>

    <circle cx="46" cy="60" r="0.7" fill="#0a0604"/>
    <circle cx="54" cy="60" r="0.7" fill="#0a0604"/>
    <path d="M 46 66 Q 50 67 54 66" stroke="#1a0a08" stroke-width="0.4" fill="none"/>

    <path d="M 64 100 Q 90 110 110 130 Q 116 138 110 144" stroke="url(#suitJinkK2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="110" cy="142" rx="4" ry="2" fill="#a87858"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowK2)" transform="rotate(4 123 120)">
    <ellipse cx="50" cy="100" rx="22" ry="32" fill="#3a8858" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowK2)" transform="rotate(4 123 120)">
    <ellipse cx="30" cy="100" rx="60" ry="60" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomK2)" transform="rotate(4 123 120)">
    <ellipse cx="130" cy="140" rx="60" ry="40" fill="#3a8858" opacity="0.22"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="86" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-weight="700">JINK: "Device exposed."</text>
    <text x="86" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-style="italic" font-weight="700">"Nasty little thing. Three minutes."</text>
  </g>
</svg>
