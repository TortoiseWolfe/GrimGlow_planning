<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 14 Panel 3 — Theodore reaches for the anchor, "I trust them."</title>
  <desc>Medium close-up. Boy's hand reaches deep into cast-iron telegraph exchange cabinet, past extracted crystalline nodes and disconnected wiring, toward core of alien device where last amber-black pulse glows faintly — anchor node, final connection. Copper-gold holographic arrow points to target. Boy's face visible at side of frame — hazel eyes calm, no fear, quiet confidence of craftsman doing what his hands know. Amber-black faint — last ember. Copper-gold guide points true. Reaching for the last one.</desc>
  <defs>
    <linearGradient id="bgY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="lastEmberY3" cx="0.5" cy="0.62" r="0.32">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="morningSideY3" cx="0.05" cy="0.4" r="0.42">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinetIntY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="hubShellY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="anchorNodeY3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairTheoY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="skinTheoY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassRingY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="deadNodeY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <filter id="bloomY3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowY3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowY3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY3)"/>
  <rect width="366" height="280" fill="url(#morningSideY3)"/>
  <rect width="366" height="280" fill="url(#lastEmberY3)"/>

  <g>
    <rect x="80" y="20" width="286" height="260" fill="url(#cabinetIntY3)"/>
    <rect x="80" y="20" width="6" height="260" fill="#080404"/>

    <g opacity="0.62" stroke="#a85820" stroke-width="0.85" fill="none">
      <path d="M 100 50 Q 200 56 360 50"/>
      <path d="M 100 80 Q 200 86 360 80"/>
      <path d="M 100 220 Q 200 226 360 220"/>
      <path d="M 100 250 Q 200 256 360 250"/>
    </g>

    <ellipse cx="120" cy="50" rx="6" ry="4" fill="#5a3018"/>
    <ellipse cx="320" cy="80" rx="6" ry="4" fill="#5a3018"/>
    <ellipse cx="120" cy="250" rx="6" ry="4" fill="#5a3018"/>
    <ellipse cx="320" cy="220" rx="6" ry="4" fill="#5a3018"/>

    <rect x="200" y="120" width="120" height="80" fill="url(#hubShellY3)"/>
    <line x1="200" y1="130" x2="320" y2="130" stroke="#5a3098" stroke-width="0.4" opacity="0.62"/>
    <line x1="200" y1="190" x2="320" y2="190" stroke="#5a3098" stroke-width="0.4" opacity="0.62"/>

    <g>
      <rect x="208" y="138" width="14" height="14" fill="url(#deadNodeY3)" stroke="#3a1810" stroke-width="0.55"/>
      <rect x="226" y="138" width="14" height="14" fill="url(#deadNodeY3)" stroke="#3a1810" stroke-width="0.55"/>
      <rect x="244" y="138" width="14" height="14" fill="url(#deadNodeY3)" stroke="#3a1810" stroke-width="0.55"/>
      <rect x="208" y="172" width="14" height="14" fill="url(#deadNodeY3)" stroke="#3a1810" stroke-width="0.55"/>
      <rect x="226" y="172" width="14" height="14" fill="url(#deadNodeY3)" stroke="#3a1810" stroke-width="0.55"/>
      <rect x="244" y="172" width="14" height="14" fill="url(#deadNodeY3)" stroke="#3a1810" stroke-width="0.55"/>
    </g>

    <ellipse cx="285" cy="160" rx="22" ry="22" fill="url(#anchorNodeY3)"/>
    <path d="M 270 145 L 300 145 L 304 175 L 285 180 L 270 175 Z" fill="#3a1810" opacity="0.85"/>
    <circle cx="285" cy="160" r="9" fill="#a85020" opacity="0.85"/>
    <circle cx="285" cy="160" r="3" fill="#fff8d8"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowY3)">
    <circle cx="285" cy="160" r="22" fill="#a85020" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowY3)">
    <circle cx="285" cy="160" r="40" fill="#fff088" opacity="0.32"/>
  </g>

  <g>
    <rect x="160" y="80" width="50" height="40" rx="2" fill="none" stroke="#d88838" stroke-width="0.55" opacity="0.85"/>
    <text x="164" y="92" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">[7] ANCHOR</text>
    <text x="164" y="100" font-family="monospace" font-size="2.4" fill="#d88838">DEEPEST NODE</text>
    <line x1="200" y1="110" x2="240" y2="140" stroke="#d88838" stroke-width="0.7" opacity="0.85"/>
    <path d="M 234 138 L 240 140 L 234 144" fill="none" stroke="#d88838" stroke-width="0.55"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowY3)">
    <rect x="160" y="80" width="50" height="40" fill="#d88838" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="40" cy="160" rx="60" ry="80" fill="url(#skinTheoY3)" opacity="0.92"/>

    <ellipse cx="40" cy="120" rx="40" ry="48" fill="url(#skinTheoY3)"/>
    <path d="M 0 100 Q 30 80 70 100 Q 80 110 78 124 L 70 122 Q 50 100 40 100 Q 30 100 16 124 L 8 124 Q 0 110 0 100 Z" fill="url(#hairTheoY3)"/>
    <path d="M 18 110 Q 30 100 42 108" stroke="#7a3818" stroke-width="1" fill="none" opacity="0.7"/>

    <ellipse cx="32" cy="124" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="32.6" cy="123.4" r="0.85" fill="#a87838"/>
    <ellipse cx="48" cy="124" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="48.6" cy="123.4" r="0.85" fill="#a87838"/>

    <path d="M 26 120 Q 32 117 38 120" stroke="#0a0604" stroke-width="0.7" fill="none"/>
    <path d="M 42 120 Q 48 117 54 120" stroke="#0a0604" stroke-width="0.7" fill="none"/>
    <path d="M 36 138 L 46 138" stroke="#1a0a08" stroke-width="0.7" fill="none"/>

    <ellipse cx="32" cy="130" rx="2" ry="0.7" fill="#a85820" opacity="0.42"/>
    <ellipse cx="48" cy="130" rx="2" ry="0.7" fill="#a85820" opacity="0.42"/>

    <path d="M 60 180 Q 90 170 130 165 L 180 160 Q 220 158 250 156" stroke="url(#skinTheoY3)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <ellipse cx="252" cy="158" rx="14" ry="9" fill="url(#skinTheoY3)"/>

    <ellipse cx="180" cy="166" rx="6" ry="4" fill="url(#brassRingY3)"/>
    <ellipse cx="180" cy="166" rx="3" ry="2" fill="#3a1a08"/>
  </g>
  <g opacity="0.85" filter="url(#bloomY3)">
    <ellipse cx="180" cy="166" rx="11" ry="6" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="262" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="280" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="130" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-weight="700">THEODORE: "I feel it. The anchor."</text>
    <text x="130" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic">WREN: "Trust your hands."</text>
    <text x="130" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-style="italic" font-weight="700">THEODORE: "I trust them."</text>
  </g>
</svg>
