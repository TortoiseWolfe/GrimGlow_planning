<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 14 Panel 3 — Theodore recognizes the slumped man: it is Cribbage, his master.</title>
  <desc>Medium close-up, 50mm. Theodore has turned from the now-dead, ordinary telegraph cabinet to look down at the man slumped against its iron base. The man's face is visible for the first time — slack, vacant, gone behind his own eyes, but unmistakable: CRIBBAGE, the clockmaker, Theodore's master, a clockmaker's loupe still on his brow. At the nape of his neck a small clean alien plug glints, a dark iridescent vein creeping at his collar. A faint blue-violet scanner-thread overlays the man, marking him as the live eighth contact. Theodore's face registers recognition like a blow — specific, personal, the stomach-drop of seeing this face, this man, his master, gone. Warm morning light against the cold geometric glint of the plug.</desc>
  <defs>
    <linearGradient id="bgY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.45" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#160a06"/>
    </linearGradient>
    <radialGradient id="morningSideY3" cx="0.92" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coldFloorY3" cx="0.45" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#2a1810" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinetIntY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="ironBaseY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a14"/>
      <stop offset="0.6" stop-color="#160c08"/>
      <stop offset="1" stop-color="#060304"/>
    </linearGradient>
    <linearGradient id="skinCribY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c898"/>
      <stop offset="0.5" stop-color="#b38f68"/>
      <stop offset="1" stop-color="#6a4a30"/>
    </linearGradient>
    <linearGradient id="coatCribY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a28"/>
      <stop offset="0.6" stop-color="#2a2014"/>
      <stop offset="1" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="hairCribY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6a58"/>
      <stop offset="0.5" stop-color="#56483a"/>
      <stop offset="1" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="skinTheoY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="hairTheoY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <radialGradient id="plugGlintY3" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#d8c8f8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#5a3098" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loupeY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <filter id="bloomY3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowY3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowY3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY3)"/>
  <rect width="366" height="280" fill="url(#morningSideY3)"/>
  <rect width="366" height="280" fill="url(#coldFloorY3)"/>

  <!-- dead, ordinary cabinet interior at upper left, light gone from it -->
  <g>
    <rect x="0" y="0" width="150" height="150" fill="url(#cabinetIntY3)"/>
    <rect x="146" y="0" width="6" height="150" fill="#080404"/>
    <g opacity="0.55" stroke="#a85820" stroke-width="0.8" fill="none">
      <path d="M 14 30 Q 80 36 150 30"/>
      <path d="M 14 60 Q 80 66 150 60"/>
      <path d="M 14 110 Q 80 116 150 110"/>
    </g>
    <ellipse cx="34" cy="30" rx="6" ry="4" fill="#5a3018"/>
    <ellipse cx="120" cy="60" rx="6" ry="4" fill="#5a3018"/>
    <ellipse cx="40" cy="110" rx="6" ry="4" fill="#5a3018"/>
    <!-- inert grey nodes on the cabinet floor, dead -->
    <rect x="56" y="120" width="13" height="13" fill="#1a0e10" stroke="#3a1810" stroke-width="0.55"/>
    <rect x="74" y="120" width="13" height="13" fill="#1a0e10" stroke="#3a1810" stroke-width="0.55"/>
    <rect x="92" y="120" width="13" height="13" fill="#1a0e10" stroke="#3a1810" stroke-width="0.55"/>
    <text x="14" y="146" font-family="monospace" font-size="3.4" fill="#5a4838" opacity="0.7">DEAD — NO LIGHT</text>
  </g>

  <!-- iron base of the cabinet the man is slumped against -->
  <rect x="120" y="150" width="246" height="130" fill="url(#ironBaseY3)"/>
  <line x1="120" y1="162" x2="366" y2="162" stroke="#080404" stroke-width="2" opacity="0.7"/>
  <line x1="120" y1="252" x2="366" y2="252" stroke="#080404" stroke-width="2" opacity="0.7"/>

  <!-- CRIBBAGE: slumped, slack, gone — face visible for the first time -->
  <g>
    <!-- slumped torso / worn working coat -->
    <path d="M 150 280 L 142 220 Q 150 196 188 188 Q 226 184 256 200 Q 280 214 286 280 Z" fill="url(#coatCribY3)"/>
    <path d="M 188 190 Q 206 200 214 224 L 206 232 Q 196 210 184 198 Z" fill="#2a2014" opacity="0.7"/>
    <!-- collar with dark iridescent vein creeping up -->
    <path d="M 196 196 Q 214 188 232 196 L 228 208 Q 214 200 200 208 Z" fill="#1a120c"/>
    <path d="M 220 200 Q 226 184 230 168" stroke="#5a3098" stroke-width="2.2" fill="none" opacity="0.75"/>
    <path d="M 218 202 Q 222 188 224 174" stroke="#3a2868" stroke-width="1.2" fill="none" opacity="0.6"/>

    <!-- head dropped forward, face turned toward the boy/viewer, slack -->
    <ellipse cx="210" cy="150" rx="40" ry="44" fill="url(#skinCribY3)"/>
    <!-- grey stubbled jaw shadow -->
    <path d="M 178 158 Q 210 192 244 156 Q 232 178 210 182 Q 188 180 178 158 Z" fill="#6a4a30" opacity="0.45"/>
    <!-- thinning grey hair -->
    <path d="M 172 132 Q 184 104 212 102 Q 244 102 250 130 Q 252 142 248 152 L 240 146 Q 236 120 210 118 Q 188 118 182 142 L 174 148 Q 170 140 172 132 Z" fill="url(#hairCribY3)"/>
    <!-- clockmaker's loupe pushed up onto the brow -->
    <g>
      <ellipse cx="232" cy="128" rx="9" ry="9" fill="none" stroke="url(#loupeY3)" stroke-width="2.4"/>
      <ellipse cx="232" cy="128" rx="6" ry="6" fill="#160c08" opacity="0.7"/>
      <ellipse cx="230" cy="126" rx="2" ry="2.4" fill="#fff8d8" opacity="0.5"/>
    </g>
    <!-- the face: vacant, gone behind his own eyes -->
    <!-- half-lidded slack eyes, faint iridescent reflection -->
    <path d="M 192 146 Q 200 142 208 146" stroke="#3a2418" stroke-width="0.9" fill="none"/>
    <path d="M 216 146 Q 224 142 232 146" stroke="#3a2418" stroke-width="0.9" fill="none"/>
    <ellipse cx="200" cy="149" rx="3" ry="1.8" fill="#1a120c"/>
    <ellipse cx="224" cy="149" rx="3" ry="1.8" fill="#1a120c"/>
    <ellipse cx="200" cy="149" rx="1.1" ry="0.9" fill="#6a5acd" opacity="0.55"/>
    <ellipse cx="224" cy="149" rx="1.1" ry="0.9" fill="#6a5acd" opacity="0.55"/>
    <!-- heavy lids, brow, the slackness -->
    <path d="M 192 143 Q 200 139 208 143" stroke="#6a4a30" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 216 143 Q 224 139 232 143" stroke="#6a4a30" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 208 152 L 210 164 L 205 166" stroke="#6a4a30" stroke-width="0.9" fill="none" opacity="0.6"/>
    <!-- slack, parted mouth -->
    <path d="M 200 172 Q 210 178 222 171" stroke="#3a2014" stroke-width="1.4" fill="none" opacity="0.8"/>
    <path d="M 202 173 Q 210 175 220 172" stroke="#1a0c08" stroke-width="0.6" fill="none"/>

    <!-- the plug at the nape — small clean alien thing in human flesh -->
    <ellipse cx="244" cy="142" rx="9" ry="9" fill="url(#plugGlintY3)"/>
    <rect x="240" y="138" width="8" height="8" rx="1" fill="#3a2868"/>
    <rect x="242" y="140" width="4" height="4" rx="0.5" fill="#5a3098"/>
    <circle cx="244" cy="142" r="1.3" fill="#d8c8f8"/>
  </g>
  <!-- cold plug glint bloom -->
  <g opacity="0.85" filter="url(#strongGlowY3)">
    <circle cx="244" cy="142" r="9" fill="#5a3098" opacity="0.5"/>
  </g>

  <!-- Luma's blue-violet scanner-thread overlaying the man, marking the live contact -->
  <g opacity="0.7">
    <path d="M 150 200 Q 200 188 244 142" stroke="#6a5acd" stroke-width="0.7" fill="none" stroke-dasharray="3 3"/>
    <path d="M 244 142 Q 270 160 286 210" stroke="#6a5acd" stroke-width="0.7" fill="none" stroke-dasharray="3 3"/>
    <ellipse cx="210" cy="150" rx="46" ry="50" fill="none" stroke="#6a5acd" stroke-width="0.55" stroke-dasharray="2 4" opacity="0.6"/>
    <g font-family="monospace" font-size="3.4" fill="#9a8cf0">
      <text x="252" y="120">CONTACT 8</text>
      <text x="252" y="126" font-size="2.8">ORGANIC · LIVE</text>
    </g>
    <!-- a small live pulse-line, a heartbeat in light -->
    <path d="M 252 130 L 262 130 L 265 124 L 268 136 L 271 130 L 286 130" stroke="#9a8cf0" stroke-width="0.7" fill="none"/>
  </g>
  <g opacity="0.5" filter="url(#bloomY3)">
    <ellipse cx="210" cy="150" rx="46" ry="50" fill="#6a5acd" opacity="0.16"/>
  </g>

  <!-- Theodore at left edge, turned, recognition landing like a blow -->
  <g>
    <ellipse cx="30" cy="240" rx="52" ry="48" fill="url(#skinTheoY3)" opacity="0.9"/>
    <ellipse cx="34" cy="208" rx="36" ry="40" fill="url(#skinTheoY3)"/>
    <path d="M -2 188 Q 24 168 64 186 Q 72 196 70 210 L 62 208 Q 44 188 34 188 Q 22 188 10 210 L 2 210 Q -4 198 -2 188 Z" fill="url(#hairTheoY3)"/>
    <!-- eyes wide, stunned -->
    <ellipse cx="26" cy="210" rx="2.6" ry="3.4" fill="#fff8d8"/>
    <ellipse cx="26.4" cy="210.4" rx="1.6" ry="2.2" fill="#0a0604"/>
    <circle cx="26.8" cy="209.4" r="0.7" fill="#a87838"/>
    <ellipse cx="44" cy="210" rx="2.6" ry="3.4" fill="#fff8d8"/>
    <ellipse cx="44.4" cy="210.4" rx="1.6" ry="2.2" fill="#0a0604"/>
    <circle cx="44.8" cy="209.4" r="0.7" fill="#a87838"/>
    <!-- raised, drawn brows -->
    <path d="M 20 204 Q 26 200 32 203" stroke="#0a0604" stroke-width="0.8" fill="none"/>
    <path d="M 38 203 Q 44 200 50 204" stroke="#0a0604" stroke-width="0.8" fill="none"/>
    <!-- parted, stunned mouth -->
    <path d="M 30 226 Q 36 230 42 226" stroke="#1a0a08" stroke-width="0.9" fill="none"/>
    <path d="M 31 227 Q 36 229 41 227" stroke="#5a3018" stroke-width="0.5" fill="none"/>
  </g>

  <!-- floor shadow -->
  <g opacity="0.6">
    <ellipse cx="200" cy="274" rx="150" ry="4" fill="#040202" opacity="0.42"/>
  </g>

  <!-- dialogue caption box -->
  <g transform="translate(12,10)">
    <rect x="-6" y="0" width="290" height="44" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="138" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#3a2410" font-weight="700">THEODORE: "That's... that's Mr. Cribbage.</text>
    <text x="138" y="17" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#3a2410" font-weight="700">That's my master."</text>
    <rect x="-2" y="22" width="282" height="20" rx="2" fill="none" stroke="#6a5acd" stroke-width="0.9" stroke-dasharray="4 2" opacity="0.85"/>
    <text x="138" y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#6a5acd" font-weight="700">LUMA: <tspan fill="#6a5acd" font-weight="400" font-style="italic">"The device dying won't free him.</tspan></text>
    <text x="138" y="39" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#6a5acd" font-style="italic">That one comes out by hand. Your hands."</text>
  </g>
</svg>
