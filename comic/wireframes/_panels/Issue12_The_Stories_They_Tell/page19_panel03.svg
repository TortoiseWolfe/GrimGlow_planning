<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 280" width="246" height="280">
  <title>Issue 12 Page 19 Panel 3 — Theodore looking up, the witness who will write the story</title>
  <desc>Close-up. Victorian boy's face looking upward through stone window gap — sandy-brown hair, hazel eyes wide, freckles. Looking up at something above him that he cannot fully see — tiny figures in colored light, too far and too small to make out clearly, but present. Boy seeing his friends differently — not understanding the change, but feeling it. Morning light on his face from side. Faintest holographic glow from above, filtered through stone. The witness who will write the story.</desc>
  <defs>
    <linearGradient id="bgFF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.4" stop-color="#3a2838"/>
      <stop offset="0.8" stop-color="#1a1018"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="filteredGlowFF3" cx="0.5" cy="0.05" r="0.45">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#fff8d8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="morningSideFF3" cx="0.85" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneFF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6878"/>
      <stop offset="0.5" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2838"/>
    </linearGradient>
    <linearGradient id="hairTheoFF3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="0.7" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="faceTheoFF3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.3" stop-color="#a87858"/>
      <stop offset="0.7" stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <radialGradient id="eyeWitnessFF3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomFF3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowFF3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowFF3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="246" height="280" fill="url(#bgFF3)"/>
  <rect width="246" height="280" fill="url(#filteredGlowFF3)"/>
  <rect width="246" height="280" fill="url(#morningSideFF3)"/>

  <g>
    <rect x="0" y="0" width="246" height="80" fill="url(#stoneFF3)" opacity="0.85"/>

    <path d="M 60 50 Q 60 80 90 80 L 156 80 Q 186 80 186 50 Z" fill="url(#bgFF3)" opacity="0.85"/>

    <g opacity="0.55" stroke="#3a2838" stroke-width="0.4">
      <line x1="0" y1="20" x2="246" y2="20"/>
      <line x1="0" y1="40" x2="246" y2="40"/>
      <line x1="60" y1="0" x2="60" y2="50"/>
      <line x1="186" y1="0" x2="186" y2="50"/>
      <line x1="120" y1="0" x2="120" y2="20"/>
      <line x1="40" y1="40" x2="40" y2="80"/>
      <line x1="200" y1="40" x2="200" y2="80"/>
    </g>
  </g>

  <g opacity="0.62">
    <circle cx="105" cy="62" r="0.85" fill="#a878d8"/>
    <circle cx="115" cy="58" r="0.85" fill="#3a8858"/>
    <circle cx="125" cy="62" r="0.85" fill="#d83838"/>
    <circle cx="135" cy="58" r="0.85" fill="#d88838"/>
    <circle cx="145" cy="62" r="0.85" fill="#a8c0e0"/>
  </g>
  <g opacity="0.42" filter="url(#bloomFF3)">
