    <path d="M 30 110 Q 60 90 100 92 Q 130 94 156 92 Q 186 90 216 110 Q 220 130 216 142 L 206 138 Q 180 110 150 106 Q 120 102 100 106 Q 70 110 40 138 L 30 142 Q 26 130 30 110 Z" fill="url(#hairTheoFF3)"/>
    <path d="M 60 100 Q 80 88 100 96" stroke="#7a3818" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 140 96 Q 160 88 180 100" stroke="#7a3818" stroke-width="1.4" fill="none" opacity="0.7"/>

    <ellipse cx="92" cy="160" rx="14" ry="14" fill="#0a0604"/>
    <circle cx="92" cy="160" r="9" fill="#3a2010"/>
    <ellipse cx="94" cy="158" rx="4" ry="3" fill="url(#eyeWitnessFF3)"/>
    <circle cx="92" cy="160" r="3" fill="#080404"/>
    <circle cx="94" cy="158" r="0.85" fill="#fff8d8"/>

    <ellipse cx="156" cy="160" rx="14" ry="14" fill="#0a0604"/>
    <circle cx="156" cy="160" r="9" fill="#3a2010"/>
    <ellipse cx="158" cy="158" rx="4" ry="3" fill="url(#eyeWitnessFF3)"/>
    <circle cx="156" cy="160" r="3" fill="#080404"/>
    <circle cx="158" cy="158" r="0.85" fill="#fff8d8"/>

    <path d="M 70 138 Q 92 124 116 138" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 132 138 Q 156 124 180 138" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 70 130 Q 92 118 116 130" stroke="#5a3018" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 132 130 Q 156 118 180 130" stroke="#5a3018" stroke-width="2" fill="none" opacity="0.7"/>

    <ellipse cx="106" cy="190" rx="9" ry="3" fill="#a85820" opacity="0.55"/>
    <ellipse cx="142" cy="190" rx="9" ry="3" fill="#a85820" opacity="0.55"/>
    <ellipse cx="124" cy="188" rx="3" ry="1.4" fill="#a85820" opacity="0.55"/>

    <path d="M 110 222 Q 124 218 138 222" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 110 220 L 138 220" stroke="#3a2410" stroke-width="0.7" opacity="0.55"/>
  </g>

  <g opacity="0.55">
    <line x1="92" y1="148" x2="123" y2="80" stroke="#a878d8" stroke-width="0.4" stroke-dasharray="2,2"/>
    <line x1="156" y1="148" x2="123" y2="80" stroke="#a878d8" stroke-width="0.4" stroke-dasharray="2,2"/>
  </g>

  <g opacity="0.62" filter="url(#strongGlowFF3)">
    <circle cx="94" cy="158" r="3" fill="#a878d8" opacity="0.42"/>
    <circle cx="158" cy="158" r="3" fill="#a878d8" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="262" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
