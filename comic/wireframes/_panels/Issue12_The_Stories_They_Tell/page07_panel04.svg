<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 7 Panel 4 — Wren prepares the talk-through, "Same logic. Connection and disconnection."</title>
  <desc>Medium close-up. Tiny figure in degraded copper suit rapidly configures copper-gold holographic display on Victorian rooftop — expanding schematics, simplifying data, converting complex alien technical analysis into step-by-step instruction diagrams. Intense focus, racing against time, translating future technology into language of clockwork. Holographic display bright and active, filling space around her with technical data — overlapping schematics, device architecture, simplified procedure steps. Morning light on rooftop behind. The engineer translating worlds.</desc>
  <defs>
    <linearGradient id="bgO4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="copperFloodO4" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopO4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitWrenO4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="hairWrenO4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenO4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a878"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="schematicO4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <filter id="bloomO4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowO4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowO4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgO4)"/>
  <rect width="247" height="280" fill="url(#copperFloodO4)"/>

  <g>
    <rect x="0" y="200" width="247" height="80" fill="url(#rooftopO4)"/>
    <line x1="0" y1="206" x2="247" y2="206" stroke="#080404" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.4">
      <line x1="0" y1="230" x2="247" y2="230"/>
      <line x1="0" y1="254" x2="247" y2="254"/>
      <line x1="60" y1="206" x2="60" y2="280"/>
      <line x1="180" y1="206" x2="180" y2="280"/>
    </g>
  </g>

  <g>
    <ellipse cx="60" cy="240" rx="22" ry="3" fill="#040202" opacity="0.62"/>

    <ellipse cx="60" cy="180" rx="22" ry="32" fill="url(#suitWrenO4)"/>
    <path d="M 38 152 L 82 152 L 86 220 L 36 220 Z" fill="url(#suitWrenO4)"/>

    <path d="M 40 160 L 50 156 L 48 168 L 38 170 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 76 174 L 84 172 L 82 182 L 74 184 Z" fill="#1a0804" opacity="0.85"/>

    <path d="M 38 152 Q 60 156 82 152" stroke="#a85820" stroke-width="0.55" fill="none" opacity="0.55"/>
    <line x1="50" y1="160" x2="54" y2="170" stroke="#a85820" stroke-width="0.55"/>

    <ellipse cx="60" cy="120" rx="14" ry="16" fill="url(#skinWrenO4)"/>
    <path d="M 46 108 Q 60 92 76 108 Q 80 116 78 124 L 70 116 Q 62 108 54 110 Q 46 112 46 124 L 42 124 Q 42 114 46 108 Z" fill="url(#hairWrenO4)"/>
    <path d="M 76 96 Q 84 96 86 106 L 80 110 Z" fill="url(#hairWrenO4)"/>

    <ellipse cx="54" cy="122" rx="1.4" ry="2" fill="#0a0604"/>
    <circle cx="54.4" cy="121.4" r="0.4" fill="#fff8d8"/>
    <ellipse cx="64" cy="122" rx="1.4" ry="2" fill="#0a0604"/>
    <circle cx="64.4" cy="121.4" r="0.4" fill="#fff8d8"/>

    <path d="M 50 118 Q 54 116 58 118" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 60 118 Q 64 116 68 118" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 56 134 Q 60 134 64 134" stroke="#1a0a08" stroke-width="0.7" fill="none"/>

    <path d="M 82 160 L 110 156" stroke="url(#skinWrenO4)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 82 180 L 110 184" stroke="url(#skinWrenO4)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="110" cy="156" rx="6" ry="3" fill="url(#skinWrenO4)"/>
    <ellipse cx="110" cy="184" rx="6" ry="3" fill="url(#skinWrenO4)"/>
  </g>

  <g>
    <rect x="100" y="40" width="140" height="190" rx="3" fill="none" stroke="#d88838" stroke-width="0.55" opacity="0.7"/>

    <text x="106" y="52" font-family="monospace" font-size="4" fill="#d88838" font-weight="700">DISARM PROCEDURE</text>
    <line x1="106" y1="55" x2="234" y2="55" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>

    <g opacity="0.85">
      <text x="106" y="68" font-family="monospace" font-size="3.4" fill="#d88838" font-weight="700">[01]</text>
      <text x="124" y="68" font-family="monospace" font-size="3" fill="#fff8d8">OPEN PANEL</text>
      <rect x="180" y="60" width="48" height="10" rx="1" fill="none" stroke="#d88838" stroke-width="0.4"/>
      <line x1="184" y1="65" x2="194" y2="65" stroke="#d88838" stroke-width="0.55"/>
      <circle cx="220" cy="65" r="2" fill="#d88838"/>
    </g>

    <g opacity="0.85">
      <text x="106" y="88" font-family="monospace" font-size="3.4" fill="#d88838" font-weight="700">[02]</text>
      <text x="124" y="88" font-family="monospace" font-size="3" fill="#fff8d8">FIND CORE</text>
      <ellipse cx="200" cy="86" rx="22" ry="6" fill="none" stroke="#d88838" stroke-width="0.4"/>
      <circle cx="200" cy="86" r="2" fill="#a85020"/>
    </g>

    <g opacity="0.85">
      <text x="106" y="108" font-family="monospace" font-size="3.4" fill="#d88838" font-weight="700">[03]</text>
      <text x="124" y="108" font-family="monospace" font-size="3" fill="#fff8d8">7 NODES</text>
      <g stroke="#d88838" stroke-width="0.4" fill="none">
        <circle cx="178" cy="107" r="1.4"/>
        <circle cx="186" cy="107" r="1.4"/>
        <circle cx="194" cy="107" r="1.4"/>
        <circle cx="202" cy="107" r="1.4"/>
        <circle cx="210" cy="107" r="1.4"/>
        <circle cx="218" cy="107" r="1.4"/>
        <circle cx="226" cy="107" r="1.4"/>
      </g>
    </g>

    <g opacity="0.85">
      <text x="106" y="128" font-family="monospace" font-size="3.4" fill="#d88838" font-weight="700">[04]</text>
      <text x="124" y="128" font-family="monospace" font-size="3" fill="#fff8d8">PULL EACH</text>
      <path d="M 180 124 L 226 132 L 220 130 L 222 134" stroke="#d88838" stroke-width="0.55" fill="none"/>
    </g>

    <g opacity="0.85">
      <text x="106" y="148" font-family="monospace" font-size="3.4" fill="#d88838" font-weight="700">[05]</text>
      <text x="124" y="148" font-family="monospace" font-size="3" fill="#fff8d8">EXTRACT CORE</text>
    </g>

    <g opacity="0.85">
      <text x="106" y="170" font-family="monospace" font-size="3" fill="#fff8d8" font-style="italic">"LIKE A WATCH</text>
      <text x="106" y="180" font-family="monospace" font-size="3" fill="#fff8d8" font-style="italic">MOVEMENT — SAME</text>
      <text x="106" y="190" font-family="monospace" font-size="3" fill="#fff8d8" font-style="italic">LOGIC, DIFFERENT</text>
      <text x="106" y="200" font-family="monospace" font-size="3" fill="#fff8d8" font-style="italic">PIECES."</text>
    </g>

    <g opacity="0.7" stroke="#d88838" stroke-width="0.4" fill="none">
      <circle cx="160" cy="220" r="6"/>
      <circle cx="160" cy="220" r="3"/>
      <line x1="156" y1="220" x2="164" y2="220"/>
      <line x1="160" y1="216" x2="160" y2="224"/>
      <line x1="158" y1="218" x2="162" y2="222"/>
      <line x1="158" y1="222" x2="162" y2="218"/>
    </g>
    <g opacity="0.7" stroke="#d88838" stroke-width="0.4" fill="none">
      <circle cx="200" cy="220" r="6"/>
      <line x1="196" y1="220" x2="204" y2="220"/>
      <line x1="200" y1="216" x2="200" y2="224"/>
      <line x1="200" y1="216" x2="204" y2="218"/>
      <line x1="200" y1="216" x2="196" y2="218"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowO4)">
    <rect x="100" y="40" width="140" height="190" fill="#d88838" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowO4)">
    <rect x="100" y="40" width="140" height="190" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomO4)">
    <ellipse cx="60" cy="180" rx="32" ry="40" fill="#d88838" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="262" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="86" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a85820" font-weight="700">WREN: "Theodore — like clockwork."</text>
    <text x="86" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a85820" font-style="italic">"Same logic. Your hands know this."</text>
  </g>
</svg>
