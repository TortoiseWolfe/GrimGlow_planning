    <path d="M 256 130 Q 286 140 306 120 Q 306 100 266 90 Q 236 100 226 110 Q 236 120 256 130 Z" fill="url(#wingFullN3)" opacity="0.85"/>

    <g opacity="0.7" stroke="#3a8858" stroke-width="0.55" fill="none">
      <line x1="140" y1="100" x2="60" y2="80"/>
      <line x1="140" y1="100" x2="60" y2="120"/>
      <line x1="140" y1="100" x2="100" y2="110"/>
      <line x1="226" y1="100" x2="306" y2="80"/>
      <line x1="226" y1="100" x2="306" y2="120"/>
      <line x1="226" y1="100" x2="266" y2="110"/>
    </g>

    <ellipse cx="183" cy="100" rx="14" ry="22" fill="url(#suitJinkN3)"/>
    <path d="M 169 80 L 197 80 L 199 130 L 167 130 Z" fill="url(#suitJinkN3)"/>

    <ellipse cx="183" cy="60" rx="11" ry="14" fill="#a87858"/>
    <path d="M 169 50 Q 183 36 200 48 Q 204 56 200 60 Q 192 50 184 54 Q 176 56 170 60 Q 168 56 169 50 Z" fill="url(#hairBlondeN3)"/>
    <ellipse cx="178" cy="60" rx="2" ry="4" fill="url(#hairBlondeN3)"/>
    <ellipse cx="188" cy="60" rx="2" ry="4" fill="url(#hairBlondeN3)"/>

    <circle cx="180" cy="60" r="0.85" fill="#0a0604"/>
    <circle cx="186" cy="60" r="0.85" fill="#0a0604"/>
    <path d="M 180 68 L 186 68" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 167 130 Q 156 142 152 156" stroke="url(#suitJinkN3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 199 130 Q 210 142 214 156" stroke="url(#suitJinkN3)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowN3)">
    <ellipse cx="183" cy="100" rx="32" ry="32" fill="#3a8858" opacity="0.55"/>
