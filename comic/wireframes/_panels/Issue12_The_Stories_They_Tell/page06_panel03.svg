<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 6 Panel 3 — Jink scanning the city, "Where would you put a fifth device?"</title>
  <desc>Medium wide. Tiny figure hovers above Victorian rooftops, emerald-green dragonfly wings fully spread, looking down at city below. Telegraph lines visible as dark threads spreading across rooftop landscape, converging toward city center — web of communication infrastructure. Expression urgent, scanning, grin long gone. Emerald wing-glow and dawn sky. City below warming in first real morning light. The web revealed.</desc>
  <defs>
    <linearGradient id="bgN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#7a8898"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <radialGradient id="dawnSkyN3" cx="0.5" cy="0.05" r="0.62">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cityFloorN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitJinkN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="wingFullN3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#fff088" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3a8858" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="webHubN3" cx="0.5" cy="0.78" r="0.32">
      <stop offset="0" stop-color="#3a1810" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1a0a04" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomN3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowN3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowN3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgN3)"/>
  <rect width="366" height="280" fill="url(#dawnSkyN3)"/>

