      <line x1="120" y1="172" x2="120" y2="204"/>
      <line x1="244" y1="172" x2="244" y2="204"/>
      <line x1="306" y1="170" x2="306" y2="200"/>
    </g>

    <g opacity="0.85" stroke="#a85820" stroke-width="0.55" stroke-dasharray="2,2">
