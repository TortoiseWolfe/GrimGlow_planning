  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="340" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="166" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-weight="700">JINK: "Scanning. Where would you put a fifth device?"</text>
    <text x="166" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic" font-weight="700">WREN: "Central. Where lines converge. A telegraph exchange."</text>
  </g>
