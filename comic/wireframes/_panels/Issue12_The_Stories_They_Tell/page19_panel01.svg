    <text x="144" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#d83838" font-weight="700">THRESH</text>
    <text x="144" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#1a1410">"I don't want to stay."  <tspan font-style="italic" fill="#5a3818">(A beat.)</tspan>  "I'll stay."</text>
