      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="bloomDD1" x="-20%" y="-20%" width="140%" height="140%">
