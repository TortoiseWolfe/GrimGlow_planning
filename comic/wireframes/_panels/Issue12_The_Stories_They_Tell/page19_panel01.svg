<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 19 Panel 1 — Constellation collapses, "The most honest thing anyone's said."</title>
  <desc>Medium wide. Tiny figure in sapphire-violet suit gestures and blue-violet holographic constellation dims — luminous nodes and threads contracting, collapsing into small scanner device in her hand. Church steeple returns to morning light — stone walls, timber beams, bell mechanism above, warm amber light through arches. Other four figures watch the constellation fade. Steeple is just a steeple again. But the people are different. Blue-violet fading. Warm morning amber returning. The vision given.</desc>
  <defs>
    <linearGradient id="bgDD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6878"/>
      <stop offset="0.4" stop-color="#3a2868"/>
      <stop offset="0.8" stop-color="#1a1018"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetCollapseDD1" cx="0.7" cy="0.45" r="0.32">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberReturnDD1" cx="0.5" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
