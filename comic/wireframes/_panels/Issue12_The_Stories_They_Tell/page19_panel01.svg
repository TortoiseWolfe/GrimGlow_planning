<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 19 Panel 1 — Thresh's response, "I don't want to stay. I'll stay."</title>
  <desc>Medium shot. Tiny figure in maximum-degradation crimson armor stands inside a fading blue-violet holographic constellation in the church steeple, looking down at her own scarred hands — dented gauntlets, gouged vambrace. Pale skin, copper-red buzz cut. Blue-violet constellation light on the crimson armor makes a purple-red interference pattern across the dented plates. Stone walls, timber beam below, bell mechanism above, warm amber morning light through the arch. The hardest kind of courage — not adrenaline but the quiet decision to endure. The soldier who will stay afraid.</desc>
  <defs>
    <linearGradient id="bgTR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5870"/>
      <stop offset="0.4" stop-color="#352460"/>
      <stop offset="0.8" stop-color="#180e18"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetWashTR1" cx="0.55" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberWashTR1" cx="0.12" cy="0.06" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneTR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6878"/>
      <stop offset="0.5" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2838"/>
    </linearGradient>
    <linearGradient id="archAmberTR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <linearGradient id="beamTR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="bellMechTR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="suitCrimsonTR1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b84858"/>
      <stop offset="0.4" stop-color="#7a2540"/>
      <stop offset="1" stop-color="#1a0814"/>
    </linearGradient>
    <linearGradient id="armorInterfTR1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.5" stop-color="#8a3878"/>
      <stop offset="1" stop-color="#5a3098"/>
    </linearGradient>
    <linearGradient id="threadFadingTR1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="bloomTR1" x="-25%" y="-25%" width="150%" height="150%">
