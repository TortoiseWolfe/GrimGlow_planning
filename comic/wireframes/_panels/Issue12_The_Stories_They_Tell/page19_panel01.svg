    <line x1="183" y1="171" x2="189" y2="172" stroke="#5a3098" stroke-width="0.6" opacity="0.8"/>
    <line x1="184" y1="174" x2="190" y2="175" stroke="#5a3098" stroke-width="0.6" opacity="0.8"/>
