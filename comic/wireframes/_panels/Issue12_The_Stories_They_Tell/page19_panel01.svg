  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="380" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="184" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-weight="700">LUMA: "I can't separate my analysis from my desire to stay."</text>
    <text x="184" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a878d8" font-style="italic">"The evidence is the evidence. The bias is the bias. Both exist."</text>
  </g>
  <g transform="translate(14,40)">
    <rect x="-6" y="0" width="380" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="184" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic" font-weight="700">WREN (quiet): "That's the most honest thing anyone's said on this mission."</text>
  </g>
</svg>
