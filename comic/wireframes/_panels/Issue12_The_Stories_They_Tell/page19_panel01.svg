    <path d="M 250 80 Q 380 130 514 158" stroke="url(#threadFadingDD1)" stroke-width="0.85" fill="none" stroke-dasharray="4,2"/>
    <path d="M 300 130 Q 400 145 514 158" stroke="url(#threadFadingDD1)" stroke-width="0.85" fill="none" stroke-dasharray="4,2"/>
    <path d="M 380 110 Q 450 135 514 158" stroke="url(#threadFadingDD1)" stroke-width="0.85" fill="none" stroke-dasharray="4,2"/>

    <ellipse cx="200" cy="100" rx="4" ry="3" fill="#a878d8" opacity="0.42"/>
    <ellipse cx="250" cy="80" rx="3" ry="2" fill="#a878d8" opacity="0.42"/>
    <ellipse cx="300" cy="130" rx="4" ry="3" fill="#a878d8" opacity="0.42"/>
    <ellipse cx="380" cy="110" rx="3" ry="2" fill="#a878d8" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="120" cy="160" rx="6" ry="3" fill="#040202" opacity="0.62"/>
    <ellipse cx="120" cy="148" rx="4" ry="11" fill="url(#suitSilverDD1)"/>
    <circle cx="120" cy="138" r="2.4" fill="#5a3818"/>
    <ellipse cx="118" cy="137" rx="2" ry="0.85" fill="#a8a8a8"/>
