    <ellipse cx="120" cy="148" rx="11" ry="11" fill="#a8c0e0" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="220" cy="160" rx="6" ry="3" fill="#040202" opacity="0.62"/>
    <ellipse cx="220" cy="148" rx="4" ry="11" fill="url(#suitCopperDD1)"/>
    <circle cx="220" cy="138" r="2.4" fill="#3a2010"/>
