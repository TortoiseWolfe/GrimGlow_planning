      <stop offset="0.5" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <linearGradient id="beamDD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
