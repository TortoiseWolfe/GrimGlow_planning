    <line x1="140" y1="0" x2="140" y2="240" stroke="#fff8d8" stroke-width="22" opacity="0.32"/>
    <line x1="540" y1="0" x2="540" y2="240" stroke="#fff8d8" stroke-width="22" opacity="0.32"/>
  </g>

  <g opacity="0.65">
