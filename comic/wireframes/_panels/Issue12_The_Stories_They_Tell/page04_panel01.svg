    <ellipse cx="640" cy="120" rx="14" ry="9" fill="url(#titanFarL1)"/>
    <circle cx="640" cy="120" r="3" fill="#a85020" opacity="0.95"/>
    <line x1="632" y1="116" x2="648" y2="124" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="648" y1="116" x2="632" y2="124" stroke="#3a1810" stroke-width="0.55"/>
  </g>
  <g opacity="0.85" filter="url(#wrongnessL1)">
    <ellipse cx="640" cy="120" rx="40" ry="22" fill="#a85020" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessL1)">
    <ellipse cx="640" cy="120" rx="80" ry="40" fill="#3a1810" opacity="0.42"/>
