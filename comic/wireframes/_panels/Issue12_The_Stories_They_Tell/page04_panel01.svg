  </g>
  <g opacity="0.62" filter="url(#megaGlowL1)">
    <ellipse cx="280" cy="160" rx="40" ry="50" fill="#8a2520" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomL1)">
    <ellipse cx="76" cy="120" rx="3" ry="22" fill="#d83838" opacity="0.32"/>
    <ellipse cx="624" cy="100" rx="3" ry="22" fill="#a85020" opacity="0.32"/>
  </g>

  <g opacity="0.65">
