    <rect x="480" y="40" width="22" height="200" fill="url(#pipeMidL1)"/>
    <rect x="280" y="60" width="14" height="180" fill="url(#pipeFarL1)"/>
    <rect x="430" y="60" width="14" height="180" fill="url(#pipeFarL1)"/>

