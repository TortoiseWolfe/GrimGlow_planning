<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 4 Panel 1 — Thresh advancing through the basement, "Twenty meters to device."</title>
  <desc>Medium wide eye level. Tiny figure advances between massive Victorian industrial steam pipes in near-darkness, weapon raised, moving toward pulsing amber-black light at far end. Pipes tower around her like canyon — condensation drips, iron supports loom. Broad-shouldered, muscular, copper-red buzz cut, crimson armored suit at maximum degradation. Every line of body tense. Amber-black pulse ahead casts sickly light across wet pipes. Crimson suit glow reflected off condensation. Thin grey light from distant grate above, far behind.</desc>
  <defs>
    <linearGradient id="bgL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.4" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="titanFarL1" cx="0.85" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grateBackL1" cx="0.05" cy="0.05" r="0.18">
      <stop offset="0" stop-color="#7a8898" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipeWetL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.3" stop-color="#3a2818"/>
      <stop offset="0.7" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="pipeMidL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="pipeFarL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="brickColumnL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="suitThreshL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2530"/>
      <stop offset="0.5" stop-color="#5a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="hairBuzzL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="skinThreshL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8b8"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="weaponL1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="crimsonStutterL1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#5a2520" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="#d83838" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomL1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowL1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowL1" x="-30%" y="-30%" width="160%" height="160%">
