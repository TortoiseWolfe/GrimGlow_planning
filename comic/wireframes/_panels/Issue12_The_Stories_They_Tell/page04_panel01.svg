  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="280" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="130" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-weight="700">THRESH (barely audible): "Advancing. Twenty meters to device."</text>
  </g>
</svg>
