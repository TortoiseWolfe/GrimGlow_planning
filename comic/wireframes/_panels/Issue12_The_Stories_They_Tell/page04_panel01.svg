    <path d="M 296 184 Q 304 192 312 200" stroke="url(#suitThreshL1)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <rect x="296" y="142" width="32" height="3" rx="1" fill="url(#weaponL1)"/>
