<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 5 Panel 4 — Thresh holds the dead core, "Charlie neutralized. I did it. All four down."</title>
  <desc>Medium shot. Tiny figure in degraded crimson armor holds dead Titan device core — dark, angular, inert — in shaking hands. Industrial basement around her dark again, amber-black light gone. Crimson holographic edge-lighting is primary illumination — stuttering geometric patterns along armor in darkness. Thin grey light from iron grate far above cuts distant wedge. Exhaustion and relief — shaking hasn't stopped, but job is done. Copper-red buzz cut, pale skin, sweat visible. Four devices down.</desc>
  <defs>
    <linearGradient id="bgM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="grateAboveM4" cx="0.5" cy="0" r="0.32">
      <stop offset="0" stop-color="#7a8898" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitThreshM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="0.8" stop-color="#3a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="hairBuzzM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="skinThreshM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8b8"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="coreDeadM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="crimsonStutterM4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#5a2520" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomM4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowM4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowM4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgM4)"/>
  <rect width="247" height="280" fill="url(#grateAboveM4)"/>

  <g opacity="0.42">
    <line x1="100" y1="0" x2="80" y2="40" stroke="#7a8898" stroke-width="0.7"/>
    <line x1="123" y1="0" x2="123" y2="40" stroke="#7a8898" stroke-width="0.7"/>
    <line x1="146" y1="0" x2="166" y2="40" stroke="#7a8898" stroke-width="0.7"/>
  </g>

  <g>
    <ellipse cx="123" cy="240" rx="44" ry="9" fill="#040202" opacity="0.62"/>

    <ellipse cx="123" cy="170" rx="32" ry="44" fill="url(#suitThreshM4)"/>
    <path d="M 91 130 L 155 130 L 158 220 L 88 220 Z" fill="url(#suitThreshM4)"/>

    <path d="M 91 134 L 102 130 L 100 144 L 88 146 Z" fill="#1a0810" opacity="0.85"/>
