    <path d="M 95 196 L 110 194 L 108 206 L 92 208 Z" fill="#1a0810" opacity="0.85"/>

    <line x1="91" y1="138" x2="155" y2="138" stroke="url(#crimsonStutterM4)" stroke-width="1.4" opacity="0.85"/>
    <line x1="88" y1="184" x2="158" y2="184" stroke="url(#crimsonStutterM4)" stroke-width="1.4" opacity="0.85"/>
    <line x1="88" y1="220" x2="158" y2="220" stroke="url(#crimsonStutterM4)" stroke-width="1" opacity="0.62"/>

    <ellipse cx="123" cy="100" rx="22" ry="26" fill="url(#skinThreshM4)"/>
    <path d="M 101 86 Q 123 64 145 86 Q 145 96 145 100 L 101 100 Q 101 96 101 86 Z" fill="url(#hairBuzzM4)"/>
