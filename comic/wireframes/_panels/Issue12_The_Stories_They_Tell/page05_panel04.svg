      <line x1="115" y1="74" x2="115" y2="96"/>
      <line x1="123" y1="72" x2="123" y2="96"/>
      <line x1="131" y1="74" x2="131" y2="96"/>
      <line x1="139" y1="78" x2="139" y2="96"/>
    </g>

    <ellipse cx="115" cy="106" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="115.6" cy="105.4" r="0.62" fill="#fff8d8"/>
    <ellipse cx="131" cy="106" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="131.6" cy="105.4" r="0.62" fill="#fff8d8"/>

    <path d="M 109 102 Q 115 100 121 102" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 125 102 Q 131 100 137 102" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 117 122 L 129 122" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <ellipse cx="118" cy="116" rx="3" ry="0.85" fill="#a85820" opacity="0.42"/>
    <ellipse cx="128" cy="116" rx="3" ry="0.85" fill="#a85820" opacity="0.42"/>

    <path d="M 88 220 Q 78 230 70 240" stroke="url(#suitThreshM4)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 158 220 Q 168 230 176 240" stroke="url(#suitThreshM4)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <path d="M 100 178 L 90 192" stroke="url(#suitThreshM4)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 146 178 L 156 192" stroke="url(#suitThreshM4)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <ellipse cx="90" cy="192" rx="8" ry="6" fill="url(#skinThreshM4)"/>
    <ellipse cx="156" cy="192" rx="8" ry="6" fill="url(#skinThreshM4)"/>

    <g opacity="0.55">
      <line x1="84" y1="190" x2="96" y2="194" stroke="#a87858" stroke-width="0.4"/>
      <line x1="84" y1="194" x2="96" y2="190" stroke="#a87858" stroke-width="0.4"/>
      <line x1="150" y1="190" x2="162" y2="194" stroke="#a87858" stroke-width="0.4"/>
      <line x1="150" y1="194" x2="162" y2="190" stroke="#a87858" stroke-width="0.4"/>
    </g>
  </g>

  <g>
    <path d="M 105 188 L 141 188 L 145 200 L 138 212 L 108 212 L 101 200 Z" fill="url(#coreDeadM4)"/>
    <line x1="105" y1="188" x2="123" y2="200" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="141" y1="188" x2="123" y2="200" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="108" y1="212" x2="123" y2="200" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="138" y1="212" x2="123" y2="200" stroke="#3a1810" stroke-width="0.55"/>
    <circle cx="123" cy="200" r="1.4" fill="#3a1810" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowM4)">
    <ellipse cx="123" cy="170" rx="40" ry="50" fill="#d83838" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowM4)">
    <ellipse cx="123" cy="170" rx="80" ry="80" fill="#8a2520" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <circle cx="115" cy="74" r="0.85" fill="#fff8d8" opacity="0.62"/>
    <circle cx="131" cy="76" r="0.85" fill="#fff8d8" opacity="0.62"/>
    <circle cx="123" cy="84" r="0.85" fill="#fff8d8" opacity="0.62"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="260" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="86" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-weight="700">THRESH (ragged): "Charlie neutralized."</text>
    <text x="86" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-style="italic" font-weight="700">"I did it. All four down."</text>
  </g>
</svg>
