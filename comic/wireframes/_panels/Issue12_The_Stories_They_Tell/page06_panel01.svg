<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 6 Panel 1 — Wren on the rooftop, "These things aren't independent. They're networked."</title>
  <desc>Medium shot. Tiny figure in degraded copper suit stands on Victorian rooftop in dawn light, extracted Titan device in pouch at hip. Examines copper-gold holographic data display projected from wrist scanner, expression shifting from satisfaction to unease — furrow deepening on brow. Dawn light — amber and grey — catches oil-stained suit. City stretches behind her, telegraph lines catching first light. The engineer's instinct.</desc>
  <defs>
    <linearGradient id="bgN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="copperDisplayN1" cx="0.65" cy="0.55" r="0.32">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawnFarN1" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="cityFarN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="suitWrenN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="hairWrenN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a878"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="pouchN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <filter id="bloomN1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowN1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowN1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgN1)"/>
  <rect width="366" height="280" fill="url(#dawnFarN1)"/>
  <rect width="366" height="280" fill="url(#copperDisplayN1)"/>

