    <rect x="218" y="207" width="11" height="9" fill="#080404"/>

    <ellipse cx="183" cy="118" rx="20" ry="22" fill="url(#skinWrenN1)"/>
    <path d="M 165 102 Q 183 80 198 100 Q 206 116 200 124 L 192 116 Q 184 100 174 104 Q 166 106 168 124 L 162 124 Q 162 110 165 102 Z" fill="url(#hairWrenN1)"/>
    <path d="M 198 90 Q 210 88 214 100 L 208 110 L 200 100 Z" fill="url(#hairWrenN1)"/>

    <ellipse cx="174" cy="120" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="174.4" cy="119.4" r="0.62" fill="#fff8d8"/>
    <ellipse cx="192" cy="120" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="192.4" cy="119.4" r="0.62" fill="#fff8d8"/>

    <path d="M 168 116 Q 174 113 180 116" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 186 116 Q 192 113 198 116" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 178 134 Q 183 134 188 134" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <path d="M 153 220 Q 144 230 138 240" stroke="url(#suitWrenN1)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 213 220 Q 230 230 240 240" stroke="url(#suitWrenN1)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <ellipse cx="138" cy="244" rx="9" ry="3" fill="#5a3018"/>
    <ellipse cx="240" cy="244" rx="9" ry="3" fill="url(#skinWrenN1)"/>

    <line x1="240" y1="244" x2="270" y2="240" stroke="#a87858" stroke-width="0.55" opacity="0.7"/>
  </g>

  <g>
    <rect x="245" y="200" width="80" height="44" rx="3" fill="none" stroke="#d88838" stroke-width="0.55" opacity="0.85"/>
    <line x1="245" y1="212" x2="325" y2="212" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>
    <line x1="245" y1="226" x2="325" y2="226" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>

    <g opacity="0.85">
      <circle cx="255" cy="208" r="2" fill="#7a7a7a"/>
      <circle cx="305" cy="208" r="2" fill="#7a7a7a"/>
      <circle cx="255" cy="240" r="2" fill="#7a7a7a"/>
      <circle cx="305" cy="240" r="2" fill="#7a7a7a"/>

      <line x1="255" y1="208" x2="305" y2="208" stroke="#d88838" stroke-width="0.55" opacity="0.62" stroke-dasharray="1,1"/>
      <line x1="305" y1="208" x2="305" y2="240" stroke="#d88838" stroke-width="0.55" opacity="0.62" stroke-dasharray="1,1"/>
      <line x1="305" y1="240" x2="255" y2="240" stroke="#d88838" stroke-width="0.55" opacity="0.62" stroke-dasharray="1,1"/>
      <line x1="255" y1="240" x2="255" y2="208" stroke="#d88838" stroke-width="0.55" opacity="0.62" stroke-dasharray="1,1"/>
      <line x1="255" y1="208" x2="305" y2="240" stroke="#d88838" stroke-width="0.4" opacity="0.55"/>
      <line x1="305" y1="208" x2="255" y2="240" stroke="#d88838" stroke-width="0.4" opacity="0.55"/>

      <text x="285" y="234" font-family="monospace" font-size="3" fill="#d88838">NETWORK</text>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowN1)">
