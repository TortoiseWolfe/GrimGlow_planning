      <rect x="310" y="76" width="11" height="22" fill="#0a0604"/>
    </g>

    <g opacity="0.55" stroke="#080404" stroke-width="0.55">
      <line x1="0" y1="120" x2="100" y2="100"/>
      <line x1="100" y1="100" x2="200" y2="92"/>
      <line x1="200" y1="92" x2="300" y2="100"/>
      <line x1="300" y1="100" x2="366" y2="92"/>
      <line x1="0" y1="140" x2="180" y2="120"/>
