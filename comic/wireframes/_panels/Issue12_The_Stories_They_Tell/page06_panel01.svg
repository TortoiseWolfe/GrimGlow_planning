    <line x1="0" y1="166" x2="366" y2="166" stroke="#080404" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.4">
      <line x1="0" y1="190" x2="366" y2="190"/>
      <line x1="0" y1="220" x2="366" y2="220"/>
      <line x1="0" y1="250" x2="366" y2="250"/>
      <line x1="60" y1="166" x2="60" y2="280"/>
      <line x1="180" y1="166" x2="180" y2="280"/>
      <line x1="300" y1="166" x2="300" y2="280"/>
    </g>
  </g>

  <g>
    <ellipse cx="183" cy="240" rx="60" ry="9" fill="#040202" opacity="0.62"/>

    <ellipse cx="183" cy="180" rx="32" ry="44" fill="url(#suitWrenN1)"/>
    <path d="M 156 150 L 210 150 L 213 220 L 153 220 Z" fill="url(#suitWrenN1)"/>

    <path d="M 158 158 L 168 154 L 165 168 L 156 170 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 200 172 L 210 170 L 208 180 L 198 182 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 170 192 L 182 190 L 180 200 L 168 200 Z" fill="#1a0804" opacity="0.85"/>

    <path d="M 156 150 Q 183 154 210 150" stroke="#a85820" stroke-width="0.55" fill="none" opacity="0.55"/>
    <line x1="170" y1="160" x2="174" y2="170" stroke="#a85820" stroke-width="0.55"/>
    <line x1="186" y1="166" x2="190" y2="178" stroke="#a85820" stroke-width="0.55"/>

