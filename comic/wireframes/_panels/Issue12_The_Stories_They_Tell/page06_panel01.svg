  <g opacity="0.85" filter="url(#bloomN1)">
    <ellipse cx="183" cy="180" rx="40" ry="22" fill="#d88838" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="262" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="320" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="156" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "Looking at this device's data buffer."</text>
    <text x="156" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a85820" font-style="italic" font-weight="700">"These things aren't independent. They're networked."</text>
    <text x="156" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE: "Explain."</text>
  </g>
</svg>
