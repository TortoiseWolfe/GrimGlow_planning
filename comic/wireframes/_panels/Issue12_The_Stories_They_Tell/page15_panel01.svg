<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 600" width="742" height="600">
  <title>Issue 12 Page 15 Panel 1 — SPLASH — Theodore and Jink, "We did it."</title>
  <desc>SPLASH slightly low angle. Victorian boy 12-13 kneels at open cast-iron cabinet on London street, holding up dark crystalline node — inert, cold, catching morning light like strange gem. Hazel eyes examine it with wonder and quiet pride. Beside his arm, standing on cabinet rim, tiny figure in degraded emerald suit rests one small hand on boy's enormous wrist. They look at each other — boy down, fairy up — equal relief, equal joy, equal partnership. Scale contrast enormous. Behind them, London street in full morning light — pedestrians, shop fronts, oblivious city. The dead node catches no alien glow. Jink's emerald glow dim, present but not performing. The fairy and the boy — the moment after.</desc>
