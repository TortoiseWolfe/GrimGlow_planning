<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 15 Panel 3 — Cribbage surfacing, "My... my hands. Theodore. Where..."</title>
  <desc>Close-up. Mr. Cribbage's face fills the frame, the vacancy slowly draining out of it — a man surfacing from deep water, not all the way up yet. His clockmaker's loupe pushed up on his brow, worn working clothes. The iridescent alien glow has nearly faded from his half-open eyes; they drift toward ordinary, unfocused then fractionally focusing. The dark vein at his collar is dimming. His mouth works around the first simple, lost words. A trembling hand lifts into the frame. Theodore's small steadying hand rests at his shoulder. Recovery, not death. Plain warm morning sun on an ordinary, recovering man — no alien light anywhere on him now.</desc>
