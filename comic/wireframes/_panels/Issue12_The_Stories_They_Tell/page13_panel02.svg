<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 280" width="246" height="280">
  <title>Issue 12 Page 13 Panel 2 — Wren coaching the fifth node, her hands stilling at Theodore's clockmaker language; inset of the load-bearing node kicking as he rides the pulse</title>
  <desc>Medium shot with corner inset. A tiny figure in maximum-degradation copper suit stands on a Victorian telegraph-station rooftop, surrounded by an expanded copper-gold holographic display of schematics and the Titan device internals. Her hands have stilled mid-gesture — arms dropped fractionally, the display cycling on without her direction — face turned toward Theodore's voice, the Issue-5 wonder look, open and unguarded. Inset frame at the upper right: an extreme close-up of a boy's oil-stained fingers gripping a dark crystalline node, amber-black light surging and kicking through the contact, lighting the burn scar and gear ring; the fingers do not let go, the node extracted clean as the amber-black dies. Copper-gold holographic light against morning rooftop sky. The engineer who forgot, for one beat, that she was the one who knew more.</desc>
  <defs>
    <linearGradient id="bgW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.42" stop-color="#fff8d8"/>
      <stop offset="0.72" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="copperFloodW2" cx="0.5" cy="0.55" r="0.62">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitWrenW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="hairWrenW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="schematicW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <radialGradient id="eyeOpenW2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d8a878" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodePulseW2" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7a50c8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5a3098" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1a0820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="insetFleshW2" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#0a0608"/>
    </radialGradient>
    <filter id="bloomW2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowW2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="megaGlowW2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.6"/>
    </filter>
    <filter id="titanGlowW2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect width="246" height="280" fill="url(#bgW2)"/>
  <rect width="246" height="280" fill="url(#copperFloodW2)"/>

  <!-- rooftop slab -->
  <g>
    <rect x="0" y="214" width="246" height="66" fill="url(#rooftopW2)"/>
    <line x1="0" y1="220" x2="246" y2="220" stroke="#080404" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.4">
      <line x1="0" y1="248" x2="246" y2="248"/>
      <line x1="56" y1="220" x2="56" y2="280"/>
      <line x1="140" y1="220" x2="140" y2="280"/>
      <line x1="210" y1="220" x2="210" y2="280"/>
    </g>
    <!-- distant rooftops / chimney silhouettes -->
    <g opacity="0.5" fill="#2a1c28">
      <rect x="8" y="196" width="20" height="20"/>
      <rect x="32" y="204" width="8" height="12"/>
      <rect x="190" y="190" width="26" height="26"/>
      <rect x="220" y="200" width="9" height="16"/>
    </g>
  </g>

  <!-- ambient fairy-rune drift -->
  <g>
    <text x="18" y="56" font-family="monospace" font-size="4" fill="#d88838" opacity="0.55" font-style="italic">&#9646; &#9647; &#9646;</text>
    <text x="40" y="80" font-family="monospace" font-size="3" fill="#d88838" opacity="0.5">&#8711;&#8869;&#9674;</text>
  </g>

  <!-- WREN figure on rooftop, hands stilled -->
  <g>
    <ellipse cx="86" cy="244" rx="22" ry="3" fill="#040202" opacity="0.6"/>

    <ellipse cx="86" cy="186" rx="22" ry="32" fill="url(#suitWrenW2)"/>
    <path d="M 64 156 L 108 156 L 111 226 L 61 226 Z" fill="url(#suitWrenW2)"/>

    <!-- soot / patch damage -->
    <path d="M 66 164 L 76 160 L 73 174 L 63 176 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 98 178 L 108 176 L 106 186 L 96 188 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 78 198 L 88 198 L 84 206 L 76 206 Z" fill="#1a0804" opacity="0.85"/>
    <!-- brass wire / tin patch hints -->
    <line x1="63" y1="180" x2="71" y2="178" stroke="#c87533" stroke-width="0.6" opacity="0.7"/>
    <line x1="100" y1="168" x2="108" y2="170" stroke="#c87533" stroke-width="0.6" opacity="0.7"/>
    <rect x="92" y="156" width="9" height="5" fill="#7a6048" opacity="0.7"/>

    <!-- head -->
    <ellipse cx="86" cy="126" rx="14" ry="18" fill="url(#skinWrenW2)"/>
    <!-- hair UP, high messy bun -->
    <path d="M 72 116 Q 86 100 100 116 Q 103 122 101 126 L 99 122 Q 93 112 87 114 Q 81 116 79 126 L 75 126 Q 71 122 72 116 Z" fill="url(#hairWrenW2)"/>
    <ellipse cx="86" cy="103" rx="7" ry="6" fill="url(#hairWrenW2)"/>
    <path d="M 80 100 Q 86 95 92 100" stroke="#1a0a08" stroke-width="0.5" fill="none" opacity="0.7"/>

    <!-- face turned slightly toward Theodore's voice (toward inset, frame-right) -->
    <ellipse cx="83" cy="126" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="84" cy="125" r="0.7" fill="url(#eyeOpenW2)"/>
    <ellipse cx="93" cy="126" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="94" cy="125" r="0.7" fill="url(#eyeOpenW2)"/>
    <!-- brows raised slightly: the wonder look -->
    <path d="M 79 121 Q 83 119 87 121" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 89 121 Q 93 119 97 121" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <!-- mouth: lips parted, unguarded -->
    <path d="M 84 140 Q 88 142 92 140" stroke="#1a0a08" stroke-width="0.6" fill="none"/>
    <path d="M 84 140 Q 88 140.5 92 140" stroke="#5a3018" stroke-width="0.4" fill="none"/>
    <ellipse cx="83" cy="133" rx="2" ry="0.7" fill="#a85820" opacity="0.5"/>
    <ellipse cx="93" cy="133" rx="2" ry="0.7" fill="#a85820" opacity="0.5"/>

    <!-- arms DROPPED fractionally, hands no longer in the display -->
    <path d="M 64 174 Q 52 196 50 214" stroke="url(#suitWrenW2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="49" cy="216" rx="4" ry="3" fill="url(#skinWrenW2)"/>
    <path d="M 108 174 Q 120 196 122 214" stroke="url(#suitWrenW2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="123" cy="216" rx="4" ry="3" fill="url(#skinWrenW2)"/>
    <!-- legs -->
    <path d="M 61 226 Q 56 238 52 244" stroke="url(#suitWrenW2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 111 226 Q 116 238 120 244" stroke="url(#suitWrenW2)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- expanded copper-gold holographic display, cycling unattended -->
  <g>
    <rect x="118" y="92" width="116" height="92" rx="3" fill="none" stroke="url(#schematicW2)" stroke-width="0.7" opacity="0.85"/>
    <text x="124" y="103" font-family="monospace" font-size="3.4" fill="#d88838" font-weight="700">DEVICE INTERNALS — LIVE</text>
    <line x1="124" y1="107" x2="228" y2="107" stroke="#d88838" stroke-width="0.4" opacity="0.6"/>

    <g opacity="0.85" stroke="#d88838" stroke-width="0.4" fill="none">
      <rect x="130" y="114" width="96" height="46"/>
      <line x1="130" y1="129" x2="226" y2="129"/>
      <line x1="130" y1="145" x2="226" y2="145"/>
      <line x1="162" y1="114" x2="162" y2="160"/>
      <line x1="194" y1="114" x2="194" y2="160"/>
    </g>
    <g>
      <rect x="136" y="118" width="6" height="6" fill="#3a1810" opacity="0.85"/>
      <rect x="168" y="118" width="6" height="6" fill="#3a1810" opacity="0.85"/>
      <rect x="200" y="118" width="6" height="6" fill="#3a1810" opacity="0.85"/>
      <rect x="136" y="148" width="6" height="6" fill="#a85020" opacity="0.95"/>
      <rect x="200" y="148" width="6" height="6" fill="#a85020" opacity="0.95"/>
      <!-- fifth node highlighted: load-bearing, pulsing -->
      <circle cx="177" cy="137" r="4.6" fill="#7a50c8" opacity="0.6"/>
      <circle cx="177" cy="137" r="3" fill="#a85020" opacity="0.95"/>
    </g>
    <text x="176" y="174" text-anchor="middle" font-family="monospace" font-size="3" fill="#d88838" font-weight="700">[5/7] LOAD-BEARING</text>
    <!-- stale gesture marker: where her hand was, now empty -->
    <g opacity="0.5" stroke="#fff8d8" stroke-width="0.4" fill="none" stroke-dasharray="1.5,1.5">
      <path d="M 124 168 Q 150 156 177 137"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowW2)">
    <rect x="118" y="92" width="116" height="92" fill="#d88838" opacity="0.3"/>
  </g>
  <g opacity="0.6" filter="url(#megaGlowW2)">
    <rect x="118" y="92" width="116" height="92" fill="#a85820" opacity="0.3"/>
  </g>

  <!-- soft bloom on Wren's stilled face -->
  <g opacity="0.85" filter="url(#bloomW2)">
    <ellipse cx="86" cy="126" rx="20" ry="13" fill="#fff8d8" opacity="0.3"/>
  </g>

  <!-- comms relay thread to the display -->
  <g opacity="0.6" stroke="#d88838" stroke-width="0.4" fill="none" stroke-dasharray="2,2">
    <line x1="100" y1="120" x2="118" y2="120"/>
  </g>

  <!-- ===================== INSET: fifth node kicking ===================== -->
  <g>
    <rect x="156" y="40" width="78" height="62" rx="2" fill="url(#insetFleshW2)" stroke="#d88838" stroke-width="1.4"/>
    <rect x="156" y="40" width="78" height="62" rx="2" fill="none" stroke="#1a0804" stroke-width="0.5"/>
    <!-- inset label -->
    <text x="160" y="49" font-family="monospace" font-size="3.2" fill="#d88838" font-weight="700" opacity="0.85">FIFTH NODE — LIVE</text>

    <!-- amber-black pulse surge behind fingers -->
    <g filter="url(#titanGlowW2)">
      <circle cx="196" cy="76" r="20" fill="url(#nodePulseW2)"/>
    </g>

    <!-- the dark crystalline node (titan tech, lightless iridescence) -->
    <path d="M 196 64 L 207 72 L 203 86 L 189 86 L 185 72 Z" fill="#3a2868"/>
    <path d="M 196 64 L 207 72 L 196 76 Z" fill="#5a3098" opacity="0.85"/>
    <path d="M 196 76 L 203 86 L 189 86 Z" fill="#241040" opacity="0.9"/>
    <path d="M 196 64 L 196 76 L 185 72 Z" fill="#4a2880" opacity="0.7"/>
    <!-- kick / surge edge lines -->
    <g opacity="0.8" stroke="#7a50c8" stroke-width="0.6" fill="none">
      <path d="M 207 72 L 218 66"/>
      <path d="M 185 72 L 174 66"/>
      <path d="M 203 86 L 210 96"/>
    </g>

    <!-- Theodore's oil-stained fingers gripping, not letting go -->
    <g>
      <!-- thumb from lower-left -->
      <path d="M 168 98 Q 180 92 190 82" stroke="#caa078" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M 168 98 Q 180 92 190 82" stroke="#5a3818" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.45"/>
      <!-- index finger from upper-right curling onto node -->
      <path d="M 224 88 Q 212 80 202 78" stroke="#caa078" stroke-width="5.4" fill="none" stroke-linecap="round"/>
      <path d="M 224 88 Q 212 80 202 78" stroke="#5a3818" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.45"/>
      <!-- second finger -->
      <path d="M 226 96 Q 214 90 205 84" stroke="#b88c64" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- fingertip on node -->
      <ellipse cx="200" cy="79" rx="4" ry="3.4" fill="#caa078"/>
      <ellipse cx="189" cy="83" rx="3.6" ry="3" fill="#caa078"/>
      <!-- edge light from the surge on the fingers -->
      <path d="M 200 76 Q 196 75 192 78" stroke="#a86ce0" stroke-width="0.8" fill="none" opacity="0.85"/>
      <path d="M 187 80 Q 191 80 195 82" stroke="#a86ce0" stroke-width="0.8" fill="none" opacity="0.85"/>
      <!-- gear ring on index finger -->
      <ellipse cx="216" cy="85" rx="2.4" ry="1.6" fill="none" stroke="#d8b048" stroke-width="0.9" transform="rotate(-30 216 85)"/>
      <!-- burn scar mark -->
      <path d="M 178 95 Q 181 93 184 94" stroke="#7a4030" stroke-width="0.7" fill="none" opacity="0.7"/>
    </g>

    <!-- node-extracted-clean cue: faint amber dying -->
    <text x="232" y="99" text-anchor="end" font-family="monospace" font-size="2.8" fill="#a86ce0" opacity="0.7" font-style="italic">kick</text>
  </g>
  <!-- inset outer accent glow -->
  <g opacity="0.5" filter="url(#strongGlowW2)">
    <rect x="156" y="40" width="78" height="62" fill="none" stroke="#5a3098" stroke-width="2"/>
  </g>

  <!-- ===================== DIALOGUE CAPTION STACK ===================== -->
  <g transform="translate(6,228)">
    <rect x="0" y="0" width="148" height="46" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="6" y="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.6" fill="#c87533" font-weight="700">WREN <tspan fill="#7a6048" font-style="italic" font-weight="400">(radio)</tspan></text>
    <text x="6" y="16" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.2" fill="#e8e0d0">"It's load-bearing. When you pull it, the device</text>
    <text x="6" y="21.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.2" fill="#e8e0d0">may pulse. Don't let go. Ride the pulse, then twist."</text>
    <text x="6" y="29" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.6" fill="#5a606a" font-weight="700">THEODORE <tspan fill="#7a6048" font-style="italic" font-weight="400">(radio)</tspan></text>
    <text x="6" y="34.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.2" fill="#e8e0d0">"Like the main escapement wheel in a longcase</text>
    <text x="6" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.2" fill="#e8e0d0">clock. It kicks when you disengage it."</text>
  </g>

  <g transform="translate(94,108)">
    <rect x="0" y="0" width="140" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="6" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.4" fill="#c87533" font-weight="700">WREN <tspan fill="#7a6048" font-style="italic" font-weight="400">(radio, a pause)</tspan></text>
    <text x="6" y="14.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.4" fill="#c87533" font-style="italic" font-weight="700">"...yes. Exactly like that."</text>
    <line x1="6" y1="17" x2="134" y2="17" stroke="#a85820" stroke-width="0.4" opacity="0.5"/>
    <text x="6" y="23.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.2" fill="#5a606a" font-weight="700">THEODORE <tspan fill="#7a6048" font-weight="400" font-style="italic">(gritted teeth):</tspan> <tspan fill="#e8e0d0" font-weight="400">"It kicked.</tspan></text>
    <text x="6" y="29" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.2" fill="#e8e0d0">I held it. Fifth node free." <tspan fill="#c87533" font-weight="700">WREN:</tspan> <tspan fill="#c87533" font-style="italic">"Clean</tspan></text>
    <text x="118" y="29" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.2" fill="#c87533" font-style="italic">extraction."</text>
  </g>
</svg>
