    <text x="184" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#d83838" font-weight="700">THRESH (firing): "Weapon's barely scratching it!"</text>
    <text x="184" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#3a8858" font-style="italic" font-weight="700">JINK (diving): "Then let's scratch it louder!"</text>
