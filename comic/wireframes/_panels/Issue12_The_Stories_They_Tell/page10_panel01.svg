    <path d="M 329 158 Q 344 152 350 158 Q 344 164 329 162 Z" fill="#3a8858" opacity="0.85"/>

    <ellipse cx="320" cy="156" rx="4" ry="4" fill="#a87858"/>
    <path d="M 316 154 Q 320 148 324 154 Q 326 156 324 158 L 316 158 Q 314 156 316 154 Z" fill="#fff088"/>
    <circle cx="318" cy="156" r="0.4" fill="#0a0604"/>
    <circle cx="322" cy="156" r="0.4" fill="#0a0604"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowT1)">
    <ellipse cx="320" cy="160" rx="22" ry="14" fill="#3a8858" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowT1)">
    <ellipse cx="320" cy="160" rx="44" ry="32" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.65">
