      <line x1="0" y1="140" x2="80" y2="140"/>
      <line x1="0" y1="160" x2="80" y2="160"/>
      <line x1="0" y1="180" x2="80" y2="180"/>
      <line x1="0" y1="200" x2="80" y2="200"/>
      <line x1="0" y1="220" x2="80" y2="220"/>
      <line x1="40" y1="120" x2="40" y2="240"/>
    </g>
  </g>

  <g>
    <ellipse cx="120" cy="220" rx="22" ry="3" fill="#040202" opacity="0.62"/>

    <ellipse cx="120" cy="180" rx="14" ry="20" fill="url(#suitThreshT1)"/>
    <path d="M 106 162 L 134 162 L 138 200 L 102 200 Z" fill="url(#suitThreshT1)"/>

    <ellipse cx="120" cy="148" rx="9" ry="11" fill="#e8d8b8"/>
    <path d="M 111 140 Q 120 130 129 140 Q 130 144 130 146 L 110 146 Q 110 144 111 140 Z" fill="#7a3018"/>

