<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 10 Panel 1 — The basement fight, Jink dives in, "Then let's scratch it louder!"</title>
  <desc>Wide dynamic action panel. Dark Victorian industrial basement in chaos — Titan drone extends angular dark limbs through pipe infrastructure, knocking pipes loose, steam bursting from broken joints in white clouds. Behind brick column, tiny figure in crimson armor fires compact weapon — crimson energy bolts streak toward drone and absorbed with iridescent ripples. Drone dark, angular, enormous at four-inch scale, oil-on-water iridescence in bruise-purple and black. From stairwell above, second tiny figure dives in — emerald wings cutting through dark like flare. Combat chaos.</desc>
  <defs>
    <linearGradient id="bgT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="droneAuraT1" cx="0.7" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1a0810" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stairLightT1" cx="0.85" cy="0.05" r="0.18">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipeT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="brickT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="droneShellT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080404"/>
      <stop offset="0.5" stop-color="#020100"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="iridescenceT1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a3098" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0.62"/>
    </linearGradient>
    <radialGradient id="steamT1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a8a8a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5a5a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitThreshT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="suitJinkT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="boltT1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff088" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="trailJinkT1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#fff088" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bloomT1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowT1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowT1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wrongnessT1" x="-30%" y="-30%" width="160%" height="160%">
