<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 21 Panel 3 — The fairy artifacts on the workbench, fading</title>
  <desc>Close-up still life. Among Victorian clockwork tools and brass gears on wooden workbench: tiny holographic emitter, no larger than thimble, still cycling slowly through geometric light patterns in varied soft hues — but dimming, power depleting. Miniature tool, impossibly small and precise, resting among crude brass gears. Scrap of metallic material size of thumbnail, soot-darkened, shimmer almost gone — candlelight finding faintest iridescence. The future's artifacts among the past's tools. Holographic light fading. Candlelight remaining. Vermeer still life — the traces left behind.</desc>
  <defs>
    <linearGradient id="bgKK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="candleAmberKK3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="benchKK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="brassGearKK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <radialGradient id="emitterDyingKK3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#a878d8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emitterShellKK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4858"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="suitFabricKK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <filter id="bloomKK3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowKK3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowKK3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgKK3)"/>
  <rect width="247" height="280" fill="url(#candleAmberKK3)"/>

  <g>
    <rect x="0" y="0" width="247" height="280" fill="url(#benchKK3)" opacity="0.85"/>
    <g opacity="0.42" stroke="#3a1808" stroke-width="0.4">
      <line x1="0" y1="60" x2="247" y2="60"/>
      <line x1="0" y1="140" x2="247" y2="140"/>
      <line x1="0" y1="220" x2="247" y2="220"/>
      <line x1="80" y1="0" x2="80" y2="280"/>
      <line x1="180" y1="0" x2="180" y2="280"/>
    </g>
  </g>

  <g>
    <ellipse cx="60" cy="180" rx="22" ry="6" fill="#1a0a04" opacity="0.62"/>
    <circle cx="60" cy="160" r="22" fill="url(#brassGearKK3)" opacity="0.85"/>
    <circle cx="60" cy="160" r="14" fill="#5a3018"/>
    <circle cx="60" cy="160" r="6" fill="#3a1808"/>
    <g stroke="#3a1808" stroke-width="0.4">
      <line x1="48" y1="160" x2="72" y2="160"/>
      <line x1="60" y1="148" x2="60" y2="172"/>
      <line x1="52" y1="152" x2="68" y2="168"/>
      <line x1="68" y1="152" x2="52" y2="168"/>
    </g>
    <g opacity="0.62" fill="#3a1808">
      <rect x="36" y="158" width="3" height="4"/>
      <rect x="81" y="158" width="3" height="4"/>
      <rect x="58" y="135" width="4" height="3"/>
      <rect x="58" y="183" width="4" height="3"/>
