  </g>
  <g opacity="0.62" filter="url(#bloomKK3)">
    <circle cx="60" cy="160" r="22" fill="#d88838" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="200" cy="220" rx="14" ry="3" fill="#1a0a04" opacity="0.62"/>
    <circle cx="200" cy="200" r="14" fill="url(#brassGearKK3)" opacity="0.85"/>
    <circle cx="200" cy="200" r="9" fill="#5a3018"/>
    <circle cx="200" cy="200" r="3" fill="#3a1808"/>
    <line x1="190" y1="200" x2="210" y2="200" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="200" y1="190" x2="200" y2="210" stroke="#3a1808" stroke-width="0.4"/>
  </g>
  <g opacity="0.62" filter="url(#bloomKK3)">
    <circle cx="200" cy="200" r="14" fill="#d88838" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="123" cy="120" rx="22" ry="14" fill="url(#emitterDyingKK3)"/>
    <rect x="113" y="106" width="20" height="22" rx="3" fill="url(#emitterShellKK3)"/>
    <rect x="113" y="106" width="20" height="3" fill="#5a78a8" opacity="0.62"/>
    <rect x="115" y="111" width="16" height="14" fill="#0a0a14" opacity="0.85"/>

    <g opacity="0.62">
      <circle cx="118" cy="116" r="0.55" fill="#a8c0e0"/>
      <circle cx="123" cy="118" r="0.55" fill="#3a8858"/>
      <circle cx="128" cy="116" r="0.55" fill="#d88838"/>
      <circle cx="121" cy="121" r="0.55" fill="#d83838"/>
      <circle cx="125" cy="121" r="0.55" fill="#a878d8"/>
    </g>

    <g opacity="0.42" font-family="monospace" font-size="2" fill="#a8c0e0">
      <text x="116" y="115">∇⊥</text>
      <text x="124" y="124">◊∢</text>
    </g>
  </g>
  <g opacity="0.62" filter="url(#strongGlowKK3)">
    <ellipse cx="123" cy="118" rx="14" ry="11" fill="#a8c0e0" opacity="0.32"/>
  </g>
  <g opacity="0.42" filter="url(#megaGlowKK3)">
    <ellipse cx="123" cy="118" rx="22" ry="14" fill="#a878d8" opacity="0.32"/>
  </g>

  <g>
    <rect x="160" y="170" width="22" height="3" rx="1" fill="#3a4858" opacity="0.85"/>
    <rect x="178" y="171" width="6" height="2" fill="#5a78a8" opacity="0.85"/>
    <line x1="160" y1="170" x2="184" y2="170" stroke="#a8c0e0" stroke-width="0.4" opacity="0.55"/>
  </g>
  <g opacity="0.42" filter="url(#bloomKK3)">
    <ellipse cx="172" cy="172" rx="14" ry="3" fill="#a8c0e0" opacity="0.32"/>
  </g>

  <g>
    <path d="M 70 80 L 90 78 L 92 86 L 72 88 Z" fill="url(#suitFabricKK3)"/>
    <line x1="71" y1="83" x2="91" y2="81" stroke="#5a4858" stroke-width="0.4" opacity="0.55"/>

    <g opacity="0.32">
      <line x1="73" y1="80" x2="76" y2="84" stroke="#a8c0e0" stroke-width="0.4"/>
      <line x1="80" y1="78" x2="83" y2="82" stroke="#3a8858" stroke-width="0.4"/>
      <line x1="86" y1="80" x2="89" y2="84" stroke="#d83838" stroke-width="0.4"/>
    </g>

    <ellipse cx="60" cy="80" rx="14" ry="3" fill="#1a0a04" opacity="0.42"/>
  </g>
  <g opacity="0.32" filter="url(#bloomKK3)">
    <rect x="68" y="76" width="26" height="14" fill="#a878d8" opacity="0.32"/>
  </g>

  <g opacity="0.62">
    <line x1="20" y1="240" x2="80" y2="234" stroke="#a85820" stroke-width="0.55"/>
    <line x1="160" y1="240" x2="220" y2="234" stroke="#a85820" stroke-width="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#bloomKK3)">
    <rect x="0" y="0" width="247" height="40" fill="#fff8d8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="260" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
