<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 3 Panel 5 — Jink extracts the core, "Junction Alpha neutralized. Core extracted. One down."</title>
  <desc>Medium shot dynamic angle. Tiny figure in degraded emerald suit hovers at rooftop junction box, wings flaring wide for leverage — two pairs of translucent holographic dragonfly wings in emerald-green light, fully extended. Both hands pull dark crystalline core from junction box housing — core small, angular, dark with fading amber-black light. Junction box behind dark now — Titan device neutralized. Satisfaction, quick flash of grin. Dawn sky behind, light brightening. Emerald wing-glow flares bright with effort. Dark core in hands, sickly light fading.</desc>
  <defs>
    <linearGradient id="bgK5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#fff8d8"/>
      <stop offset="0.7" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="dawnBrightK5" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="junctionDarkK5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="suitJinkK5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeK5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="wingFlareK5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#3a8858" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#fff088" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3a8858" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreFadingK5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a3818" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystalK5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <filter id="bloomK5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowK5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowK5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowK5" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgK5)"/>
  <rect width="366" height="280" fill="url(#dawnBrightK5)"/>

