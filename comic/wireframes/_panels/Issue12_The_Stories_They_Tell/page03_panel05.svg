    <ellipse cx="192" cy="100" rx="3" ry="5" fill="url(#hairBlondeK5)"/>

    <circle cx="174" cy="100" r="1" fill="#0a0604"/>
    <circle cx="192" cy="100" r="1" fill="#0a0604"/>

    <path d="M 168 96 Q 174 94 180 96" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 186 96 Q 192 94 198 96" stroke="#0a0604" stroke-width="0.55" fill="none"/>

    <path d="M 170 112 Q 178 118 183 116 Q 188 118 196 112 Q 196 122 188 124 Q 183 124 178 124 Q 170 122 170 112 Z" fill="#1a0604"/>
    <path d="M 174 116 L 192 116" stroke="#fff8d8" stroke-width="0.85" stroke-linecap="round"/>

    <path d="M 156 200 Q 144 218 138 240" stroke="url(#suitJinkK5)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 212 200 Q 224 218 230 240" stroke="url(#suitJinkK5)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <path d="M 156 138 L 130 156" stroke="url(#suitJinkK5)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 210 138 L 236 156" stroke="url(#suitJinkK5)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <g>
    <ellipse cx="183" cy="200" rx="32" ry="14" fill="url(#coreFadingK5)" opacity="0.85"/>
    <path d="M 168 192 L 198 192 L 204 204 L 195 214 L 171 214 L 162 204 Z" fill="url(#crystalK5)"/>
    <line x1="168" y1="192" x2="183" y2="204" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="198" y1="192" x2="183" y2="204" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="171" y1="214" x2="183" y2="204" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="195" y1="214" x2="183" y2="204" stroke="#3a1810" stroke-width="0.55"/>
    <circle cx="183" cy="204" r="2" fill="#7a3818" opacity="0.62"/>

    <ellipse cx="160" cy="194" rx="6" ry="4" fill="#a87858"/>
    <ellipse cx="206" cy="194" rx="6" ry="4" fill="#a87858"/>
  </g>
  <g opacity="0.62" filter="url(#bloomK5)">
