    <line x1="240" y1="174" x2="200" y2="160" stroke="#0a0604" stroke-width="0.85"/>
    <line x1="240" y1="200" x2="180" y2="190" stroke="#0a0604" stroke-width="0.85"/>
    <line x1="240" y1="228" x2="200" y2="240" stroke="#0a0604" stroke-width="0.85"/>
