    <path d="M 366 80 Q 386 130 346 160 Q 306 180 286 170 Q 276 160 286 140 Q 296 120 326 100 Q 346 80 366 80 Z" fill="#3a8858" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowK5)">
    <path d="M 0 80 Q -20 130 20 160 Q 60 180 80 170 Q 90 160 80 140 Q 70 120 40 100 Q 20 80 0 80 Z" fill="#3a8858" opacity="0.42"/>
    <path d="M 366 80 Q 386 130 346 160 Q 306 180 286 170 Q 276 160 286 140 Q 296 120 326 100 Q 346 80 366 80 Z" fill="#3a8858" opacity="0.42"/>
  </g>

