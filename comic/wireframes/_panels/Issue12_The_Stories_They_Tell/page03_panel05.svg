    <path d="M 366 80 Q 386 130 346 160 Q 306 180 286 170 Q 276 160 286 140 Q 296 120 326 100 Q 346 80 366 80 Z" fill="url(#wingFlareK5)" opacity="0.92"/>
    <g opacity="0.85" stroke="#3a8858" stroke-width="0.7" fill="none">
      <line x1="286" y1="140" x2="366" y2="80"/>
      <line x1="286" y1="140" x2="346" y2="160"/>
      <line x1="286" y1="140" x2="306" y2="180"/>
      <line x1="286" y1="140" x2="326" y2="100"/>
