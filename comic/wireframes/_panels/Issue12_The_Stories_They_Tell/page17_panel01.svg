      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.4" stop-color="#3a2838"/>
      <stop offset="0.8" stop-color="#1a1018"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
