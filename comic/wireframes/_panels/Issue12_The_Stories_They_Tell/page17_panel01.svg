  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="380" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="184" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE: "Report."</text>
    <text x="184" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic">WREN: "All five neutralized. The Titans will adapt."</text>
    <text x="184" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-style="italic" font-weight="700">SABLE: "For now is enough."</text>
  </g>
