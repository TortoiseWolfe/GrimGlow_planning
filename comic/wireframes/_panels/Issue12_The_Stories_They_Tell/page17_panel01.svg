<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 460" width="742" height="460">
  <title>Issue 12 Page 17 Panel 1 — SPLASH — Luma's constellation, "Every glyph. Every trace. Every story."</title>
  <desc>SPLASH wide. Interior of Victorian church steeple transformed by holographic projection — three-dimensional constellation of evidence fills air in blue-violet structured light. Luminous nodes connected by glowing threads rotate slowly. Each node distinct: geometric fairy glyphs, miniature wing-pack with carved STAY, newspaper headlines TELEGRAPH DEMON / MYSTERIOUS LIGHTS, pamphlet THE STORIES THEY TELL, Titan device locations in fading amber-black, timeline of prior operative presence across centuries. At center, brightest, holographic written page — the intersection of all threads. Five tiny figures stand within the constellation, surrounded by the evidence. The map of the paradox.</desc>
