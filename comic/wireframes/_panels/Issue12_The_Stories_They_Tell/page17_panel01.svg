<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 17 Panel 1 — The squad reconvenes at the steeple, "For now is enough."</title>
  <desc>Wide high-angle. Interior of Victorian church steeple — bell mechanism, timber beams, stone arches. Five tiny figures reconvene on beams and railings. One in pewter-dark silver stands at railing — command. One in near-brown copper arrives via wing-pack. One in soot-streaked emerald lands. One in battered crimson climbs last beam. One in scuffed sapphire-violet arrives from below. Through stone window gap far below, boy's face visible — looking up. Morning light streams through stone arches in warm amber beams. Five suits glow — degraded but holographic light bleeds through grime in five department colors.</desc>
