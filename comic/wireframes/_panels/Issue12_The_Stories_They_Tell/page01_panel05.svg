    <circle cx="247" cy="0" r="2" fill="#5a4858"/>

    <path d="M 220 14 L 274 14 L 264 60 L 230 60 Z" fill="url(#steepleI5)"/>
    <path d="M 224 18 L 270 18 L 268 22 L 226 22 Z" fill="#080404" opacity="0.62"/>

    <path d="M 200 60 L 294 60 L 286 130 L 208 130 Z" fill="url(#bellHouseI5)"/>
