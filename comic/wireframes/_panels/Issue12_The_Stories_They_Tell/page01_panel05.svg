  </g>

  <g opacity="0.85" filter="url(#bloomI5)">
    <circle cx="247" cy="138" r="6" fill="#a8c0e0" opacity="0.42"/>
  </g>

  <g opacity="0.62" filter="url(#strongGlowI5)">
    <ellipse cx="350" cy="60" rx="80" ry="22" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="280" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="130" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c0e0" font-weight="700">SABLE (radio): "Command in position. Steeple Delta."</text>
    <text x="130" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c0e0" font-style="italic" font-weight="700">"I have tactical. All teams proceed."</text>
  </g>
</svg>
