<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 12 Page 1 Panel 5 — Sable on the church steeple, "Command in position. Steeple Delta."</title>
  <desc>Wide low angle looking up at Victorian church steeple against dawn sky. Steeple stone and brick, heavy, bell housing visible above — enormous Victorian architecture. At top, barely visible against grey-pink dawn, tiny figure stands on steeple railing beside bell mechanism. Dark brown skin, silver-white military-cropped hair, metallic silver suit darkened to pewter by soot. Faint blue-white holographic tactical display hovers before her — city map with device locations and squad positions. Small point of authority at highest point.</desc>
  <defs>
    <linearGradient id="bgI5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#7a8898"/>
      <stop offset="0.7" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="dawnSkyI5" cx="0.95" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steepleI5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.4" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="bellHouseI5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6878"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="holoTacticalI5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.5" stop-color="#5a78a8"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <filter id="bloomI5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowI5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowI5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="494" height="280" fill="url(#bgI5)"/>
  <rect width="494" height="280" fill="url(#dawnSkyI5)"/>

  <g>
