    <rect x="296" y="100" width="60" height="32" rx="2" fill="none" stroke="#5a78a8" stroke-width="0.55" opacity="0.85"/>
    <rect x="298" y="102" width="56" height="6" fill="#0a0a14" opacity="0.62"/>
    <text x="302" y="107" font-family="monospace" font-size="3" fill="#a8c0e0">TACTICAL</text>

    <g opacity="0.85">
      <path d="M 304 114 L 310 114 L 312 116 L 310 118 L 304 118 Z" fill="none" stroke="#a8c0e0" stroke-width="0.4"/>
      <line x1="312" y1="116" x2="324" y2="118" stroke="#a8c0e0" stroke-width="0.4"/>
      <circle cx="324" cy="118" r="0.85" fill="#3a8858"/>
      <circle cx="332" cy="120" r="0.85" fill="#d88838"/>
      <circle cx="340" cy="124" r="0.85" fill="#d83838"/>
      <circle cx="346" cy="126" r="0.85" fill="#a878d8"/>
      <line x1="312" y1="120" x2="346" y2="126" stroke="#5a78a8" stroke-width="0.4" stroke-dasharray="1,1"/>

      <text x="302" y="124" font-family="monospace" font-size="2.4" fill="#a8c0e0">ALPHA</text>
      <text x="302" y="128" font-family="monospace" font-size="2.4" fill="#a8c0e0">BRAVO</text>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowI5)">
