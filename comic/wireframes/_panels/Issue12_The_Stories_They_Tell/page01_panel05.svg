      <line x1="294" y1="130" x2="294" y2="142"/>
    </g>
  </g>

  <g>
    <ellipse cx="247" cy="136" rx="3" ry="6" fill="#3a4858"/>
    <circle cx="247" cy="130" r="1.4" fill="#5a3818"/>
  </g>

  <g>
