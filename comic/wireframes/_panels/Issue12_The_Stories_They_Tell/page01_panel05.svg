      <line x1="260" y1="144" x2="262" y2="280"/>
    </g>

    <ellipse cx="210" cy="190" rx="11" ry="14" fill="#080404"/>
    <ellipse cx="247" cy="200" rx="11" ry="14" fill="#080404"/>
    <ellipse cx="284" cy="190" rx="11" ry="14" fill="#080404"/>

