    <ellipse cx="231" cy="100" rx="6" ry="9" fill="#3a2818"/>
    <line x1="231" y1="80" x2="231" y2="92" stroke="#1a0a04" stroke-width="0.85"/>
    <ellipse cx="263" cy="100" rx="6" ry="9" fill="#3a2818"/>
    <line x1="263" y1="80" x2="263" y2="92" stroke="#1a0a04" stroke-width="0.85"/>

    <rect x="190" y="130" width="114" height="14" fill="url(#steepleI5)"/>
    <line x1="190" y1="130" x2="304" y2="130" stroke="#080404" stroke-width="0.85"/>

    <path d="M 180 144 L 314 144 L 320 280 L 174 280 Z" fill="url(#steepleI5)"/>
    <g opacity="0.62" stroke="#080404" stroke-width="0.55">
