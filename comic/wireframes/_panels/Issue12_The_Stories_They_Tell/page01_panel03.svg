  <g>
    <rect x="180" y="60" width="44" height="40" fill="url(#conduitI3)"/>
    <rect x="180" y="60" width="44" height="6" fill="#080404"/>
    <g opacity="0.62" stroke="#1a0a04" stroke-width="0.55">
      <line x1="190" y1="72" x2="214" y2="72"/>
      <line x1="190" y1="80" x2="214" y2="80"/>
      <line x1="190" y1="88" x2="214" y2="88"/>
    </g>
  </g>

  <g>
    <ellipse cx="100" cy="140" rx="14" ry="22" fill="url(#suitWrenI3)"/>
    <path d="M 86 124 L 114 124 L 116 162 L 84 162 Z" fill="url(#suitWrenI3)"/>

    <path d="M 88 134 L 94 132 L 92 144 L 86 144 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 108 144 L 114 142 L 113 152 L 107 154 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 100 152 L 106 152 L 104 158 L 98 158 Z" fill="#1a0804" opacity="0.85"/>

    <ellipse cx="100" cy="106" rx="11" ry="14" fill="url(#skinWrenI3)"/>
    <path d="M 91 96 Q 100 84 110 94 Q 114 102 112 106 L 116 100 Q 118 94 116 88 L 110 90 Q 100 84 90 90 Q 86 96 88 100 L 88 106 Q 90 102 91 96 Z" fill="url(#hairWrenI3)"/>
    <path d="M 110 80 Q 116 76 120 84 Q 116 92 110 88 Z" fill="url(#hairWrenI3)"/>

    <circle cx="96" cy="106" r="0.85" fill="#0a0604"/>
    <circle cx="104" cy="106" r="0.85" fill="#0a0604"/>
    <path d="M 98 116 L 102 116" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 84 162 Q 76 178 70 196" stroke="url(#suitWrenI3)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 116 162 Q 124 178 130 196" stroke="url(#suitWrenI3)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <ellipse cx="68" cy="200" rx="6" ry="3" fill="#3a1808"/>
    <ellipse cx="132" cy="200" rx="6" ry="3" fill="#3a1808"/>

    <circle cx="68" cy="200" r="2" fill="#fff8d8" opacity="0.62"/>
    <circle cx="132" cy="200" r="2" fill="#fff8d8" opacity="0.62"/>

    <ellipse cx="84" cy="146" rx="3" ry="1" fill="#fff8d8" opacity="0.7"/>
    <ellipse cx="80" cy="160" rx="2" ry="0.85" fill="#fff8d8" opacity="0.7"/>

    <ellipse cx="60" cy="180" rx="3" ry="1" fill="#fff8d8" opacity="0.7"/>
    <ellipse cx="140" cy="180" rx="3" ry="1" fill="#fff8d8" opacity="0.7"/>
  </g>

  <g>
    <circle cx="124" cy="148" r="2" fill="#d88838" opacity="0.85"/>
    <circle cx="128" cy="142" r="1.4" fill="#d88838" opacity="0.7"/>
    <circle cx="122" cy="156" r="1.4" fill="#d88838" opacity="0.7"/>
    <line x1="120" y1="148" x2="124" y2="148" stroke="#d88838" stroke-width="0.4" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#strongGlowI3)">
    <circle cx="124" cy="148" r="6" fill="#d88838" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomI3)">
    <ellipse cx="100" cy="140" rx="22" ry="22" fill="#a85820" opacity="0.22"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "Engineer, Station Bravo. 2 minutes."</text>
  </g>
