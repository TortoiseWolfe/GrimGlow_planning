<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 240" width="247" height="240">
  <title>Issue 12 Page 1 Panel 3 — Wren scaling brick wall, "Engineer, approaching Station Bravo."</title>
  <desc>Medium shot eye level. Tiny figure scales exterior brick wall of Victorian telegraph station, moving along cable conduit toward ventilation gap. East Asian features, wiry build, dark hair in messy bun, metallic copper suit at maximum degradation — oil-stained near-brown, brass wire patches, copper dust in knees, scorch mark covered by tin strip. Holographic tools orbit left wrist, dimmed. Locked focus. Dawn light on soot-darkened brick. Cable conduit is a tunnel at her scale.</desc>
  <defs>
    <linearGradient id="bgI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7898"/>
      <stop offset="0.4" stop-color="#5a4838"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="copperFaintI3" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickWallI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitWrenI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="conduitI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="hairWrenI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenI3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a878"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <filter id="bloomI3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowI3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <rect width="247" height="240" fill="url(#bgI3)"/>
  <rect width="247" height="240" fill="url(#copperFaintI3)"/>

  <g>
    <rect x="0" y="0" width="247" height="240" fill="url(#brickWallI3)" opacity="0.92"/>
    <g opacity="0.62" stroke="#1a0a04" stroke-width="0.55">
      <line x1="0" y1="20" x2="247" y2="20"/>
      <line x1="0" y1="40" x2="247" y2="40"/>
      <line x1="0" y1="60" x2="247" y2="60"/>
      <line x1="0" y1="80" x2="247" y2="80"/>
      <line x1="0" y1="100" x2="247" y2="100"/>
      <line x1="0" y1="120" x2="247" y2="120"/>
