      <line x1="0" y1="180" x2="247" y2="180"/>
      <line x1="0" y1="200" x2="247" y2="200"/>
      <line x1="0" y1="220" x2="247" y2="220"/>
      <line x1="40" y1="0" x2="40" y2="20"/>
