    <line x1="60" y1="0" x2="60" y2="240" stroke="#080404" stroke-width="0.85"/>
    <line x1="82" y1="0" x2="82" y2="240" stroke="#080404" stroke-width="0.85"/>
    <g opacity="0.62" stroke="#5a3018" stroke-width="0.55">
      <line x1="62" y1="40" x2="80" y2="40"/>
      <line x1="62" y1="80" x2="80" y2="80"/>
      <line x1="62" y1="120" x2="80" y2="120"/>
      <line x1="62" y1="160" x2="80" y2="160"/>
      <line x1="62" y1="200" x2="80" y2="200"/>
