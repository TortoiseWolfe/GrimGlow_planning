      <line x1="160" y1="0" x2="160" y2="20"/>
      <line x1="60" y1="40" x2="60" y2="60"/>
      <line x1="140" y1="40" x2="140" y2="60"/>
      <line x1="200" y1="40" x2="200" y2="60"/>
      <line x1="40" y1="60" x2="40" y2="80"/>
      <line x1="120" y1="60" x2="120" y2="80"/>
      <line x1="180" y1="60" x2="180" y2="80"/>
      <line x1="80" y1="80" x2="80" y2="100"/>
      <line x1="160" y1="80" x2="160" y2="100"/>
      <line x1="40" y1="100" x2="40" y2="120"/>
      <line x1="100" y1="100" x2="100" y2="120"/>
      <line x1="180" y1="100" x2="180" y2="120"/>
