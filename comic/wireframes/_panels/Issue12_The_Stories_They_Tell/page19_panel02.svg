<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 19 Panel 2 — Wren's reluctant acceptance, the city beyond the arches</title>
  <desc>Medium shot. Wren in maximum-degradation copper suit stands inside a blue-violet holographic constellation, turning to look out through stone arches at a Victorian city below — rooftops, chimneys, telegraph lines, gaslit London in morning light. Beside her a sapphire-violet figure, Luma, gives a small exhausted smile. Blue-violet holographic light inside; warm amber morning light outside through the arches; the two coexist, future and past, cool and warm, neither dominating. The convergence conceded.</desc>
  <defs>
    <linearGradient id="skyP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d0"/>
      <stop offset="0.45" stop-color="#f4b860"/>
      <stop offset="0.8" stop-color="#b87838"/>
      <stop offset="1" stop-color="#6a4830"/>
    </linearGradient>
    <radialGradient id="amberP2" cx="0.72" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coolP2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a48a8" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#3a2868" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stoneP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a52"/>
      <stop offset="0.5" stop-color="#3a2e36"/>
      <stop offset="1" stop-color="#1a1218"/>
    </linearGradient>
    <linearGradient id="cityP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8703a"/>
      <stop offset="0.5" stop-color="#6a4830"/>
      <stop offset="1" stop-color="#3a2820"/>
    </linearGradient>
    <linearGradient id="beamP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitCopperP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="suitSapphireP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.4" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <filter id="bloomP2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glowP2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaP2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="#14101c"/>

  <!-- City and sky seen through the arches (right side, warm) -->
  <g>
    <!-- stone wall slab the arches are cut into -->
    <rect x="0" y="0" width="366" height="240" fill="url(#stoneP2)"/>

    <!-- two stone arch openings revealing the city beyond -->
    <clipPath id="archAP2"><path d="M 150 200 L 150 70 Q 150 36 184 36 Q 218 36 218 70 L 218 200 Z"/></clipPath>
    <clipPath id="archBP2"><path d="M 244 200 L 244 78 Q 244 48 274 48 Q 304 48 304 78 L 304 200 Z"/></clipPath>

    <g clip-path="url(#archAP2)">
      <rect x="150" y="0" width="70" height="240" fill="url(#skyP2)"/>
      <rect x="150" y="0" width="70" height="240" fill="url(#amberP2)"/>
      <!-- distant rooftops / chimneys -->
      <rect x="152" y="150" width="14" height="50" fill="url(#cityP2)"/>
      <rect x="155" y="142" width="3" height="10" fill="#2a1c14"/>
      <rect x="168" y="138" width="18" height="62" fill="url(#cityP2)"/>
      <rect x="173" y="128" width="3" height="12" fill="#2a1c14"/>
      <rect x="180" y="130" width="3" height="10" fill="#2a1c14"/>
      <rect x="190" y="156" width="16" height="44" fill="url(#cityP2)"/>
      <rect x="206" y="146" width="12" height="54" fill="url(#cityP2)"/>
      <rect x="209" y="136" width="3" height="12" fill="#2a1c14"/>
      <!-- telegraph lines -->
      <line x1="150" y1="118" x2="218" y2="126" stroke="#1a120c" stroke-width="0.6" opacity="0.7"/>
      <line x1="150" y1="125" x2="218" y2="116" stroke="#1a120c" stroke-width="0.5" opacity="0.6"/>
      <line x1="176" y1="100" x2="176" y2="128" stroke="#1a120c" stroke-width="0.7"/>
      <line x1="172" y1="104" x2="180" y2="104" stroke="#1a120c" stroke-width="0.6"/>
    </g>

    <g clip-path="url(#archBP2)">
      <rect x="244" y="0" width="60" height="240" fill="url(#skyP2)"/>
      <rect x="244" y="0" width="60" height="240" fill="url(#amberP2)"/>
      <rect x="246" y="160" width="14" height="40" fill="url(#cityP2)"/>
      <rect x="250" y="150" width="3" height="12" fill="#2a1c14"/>
      <rect x="262" y="148" width="18" height="52" fill="url(#cityP2)"/>
      <rect x="267" y="138" width="3" height="12" fill="#2a1c14"/>
      <rect x="282" y="156" width="20" height="44" fill="url(#cityP2)"/>
      <rect x="288" y="146" width="3" height="12" fill="#2a1c14"/>
      <!-- telegraph lines -->
      <line x1="244" y1="124" x2="304" y2="116" stroke="#1a120c" stroke-width="0.6" opacity="0.7"/>
      <line x1="244" y1="116" x2="304" y2="124" stroke="#1a120c" stroke-width="0.5" opacity="0.6"/>
      <line x1="272" y1="98" x2="272" y2="124" stroke="#1a120c" stroke-width="0.7"/>
      <line x1="268" y1="102" x2="276" y2="102" stroke="#1a120c" stroke-width="0.6"/>
    </g>

    <!-- arch inner highlight (warm rim light catching the stone edges) -->
    <path d="M 150 200 L 150 70 Q 150 36 184 36 Q 218 36 218 70 L 218 200" fill="none" stroke="#f4b860" stroke-width="1.6" opacity="0.55"/>
    <path d="M 244 200 L 244 78 Q 244 48 274 48 Q 304 48 304 78 L 304 200" fill="none" stroke="#f4b860" stroke-width="1.4" opacity="0.5"/>
  </g>

  <!-- warm amber spill from the arches into the interior -->
  <g filter="url(#glowP2)" opacity="0.5">
    <path d="M 150 200 L 150 70 Q 150 36 184 36 Q 218 36 218 70 L 218 200 Z" fill="#f4b860" opacity="0.22"/>
    <path d="M 244 200 L 244 78 Q 244 48 274 48 Q 304 48 304 78 L 304 200 Z" fill="#f4b860" opacity="0.2"/>
  </g>

  <!-- cool blue-violet holographic wash on the interior (left side) -->
  <rect x="0" y="0" width="366" height="240" fill="url(#coolP2)"/>

  <!-- timber beams of the steeple interior -->
  <g>
    <rect x="0" y="184" width="366" height="13" fill="url(#beamP2)"/>
    <rect x="0" y="184" width="366" height="2.5" fill="#9a6028" opacity="0.55"/>
    <rect x="0" y="120" width="120" height="8" fill="url(#beamP2)"/>
    <rect x="0" y="120" width="120" height="2" fill="#7a5028" opacity="0.45"/>
    <rect x="30" y="0" width="11" height="184" fill="url(#beamP2)"/>
  </g>

  <!-- holographic constellation (nodes + threads) inside the steeple, cool -->
  <g filter="url(#megaP2)" opacity="0.55">
    <line x1="40" y1="60" x2="100" y2="100" stroke="#7a68d8" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="100" x2="62" y2="150" stroke="#7a68d8" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="100" x2="135" y2="70" stroke="#7a68d8" stroke-width="2" opacity="0.45"/>
  </g>
  <g opacity="0.85">
    <line x1="40" y1="60" x2="100" y2="100" stroke="#a878d8" stroke-width="0.5"/>
    <line x1="100" y1="100" x2="62" y2="150" stroke="#a878d8" stroke-width="0.5"/>
    <line x1="100" y1="100" x2="135" y2="70" stroke="#a878d8" stroke-width="0.5"/>
    <line x1="62" y1="150" x2="135" y2="70" stroke="#7a68c8" stroke-width="0.4" opacity="0.6"/>
    <circle cx="40" cy="60" r="2.4" fill="#c8b0ff"/>
    <circle cx="100" cy="100" r="3" fill="#d8c0ff"/>
    <circle cx="62" cy="150" r="2.2" fill="#c8b0ff"/>
    <circle cx="135" cy="70" r="2.2" fill="#c8b0ff"/>
  </g>

  <!-- LUMA (sapphire-violet) — beside Wren, small exhausted smile -->
  <g>
    <ellipse cx="62" cy="180" rx="9" ry="3" fill="#040202" opacity="0.6"/>
    <ellipse cx="62" cy="160" rx="9" ry="14" fill="url(#suitSapphireP2)"/>
    <path d="M 53 144 L 71 144 L 73 184 L 51 184 Z" fill="url(#suitSapphireP2)"/>
    <!-- soot / improvised repair patches -->
    <path d="M 54 150 L 59 148 L 57 158 L 52 160 Z" fill="#0a0610" opacity="0.7"/>
    <path d="M 66 162 L 71 160 L 69 170 L 64 172 Z" fill="#0a0610" opacity="0.7"/>
    <line x1="53" y1="152" x2="71" y2="152" stroke="#a878d8" stroke-width="0.4" opacity="0.7"/>
    <!-- head, braided hair, holo lenses -->
    <ellipse cx="62" cy="135" rx="6" ry="6" fill="#a87858"/>
    <ellipse cx="59" cy="135" rx="2" ry="1" fill="#5a38a8"/>
    <ellipse cx="65" cy="135" rx="2" ry="1" fill="#a878d8"/>
    <line x1="57" y1="135" x2="67" y2="135" stroke="#6a5acd" stroke-width="0.4" opacity="0.7"/>
    <circle cx="59" cy="135" r="0.55" fill="#080404"/>
    <circle cx="65" cy="135" r="0.55" fill="#080404"/>
    <!-- braid -->
    <path d="M 68 132 Q 72 138 70 148 Q 69 154 71 160" stroke="#2a1a28" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- small exhausted smile -->
    <path d="M 59 139 Q 62 141 65 139" stroke="#3a2018" stroke-width="0.5" fill="none"/>
  </g>
  <g opacity="0.85" filter="url(#glowP2)">
    <ellipse cx="62" cy="160" rx="13" ry="14" fill="#a878d8" opacity="0.5"/>
  </g>

  <!-- WREN (copper) — turned toward the arches, looking out at the city -->
  <g>
    <ellipse cx="118" cy="186" rx="9" ry="3" fill="#040202" opacity="0.6"/>
    <ellipse cx="118" cy="164" rx="9" ry="15" fill="url(#suitCopperP2)"/>
    <path d="M 109 148 L 127 148 L 130 188 L 107 188 Z" fill="url(#suitCopperP2)"/>
    <!-- oil-stained, soot, improvised repairs -->
    <path d="M 110 153 L 115 151 L 113 162 L 108 164 Z" fill="#1a0804" opacity="0.8"/>
    <path d="M 121 166 L 127 164 L 125 174 L 119 176 Z" fill="#1a0804" opacity="0.75"/>
    <line x1="109" y1="155" x2="127" y2="155" stroke="#d88838" stroke-width="0.4" opacity="0.7"/>
    <line x1="108" y1="170" x2="128" y2="170" stroke="#c87533" stroke-width="0.4" opacity="0.6"/>
    <!-- copper accent glow bleeding through grime -->
    <path d="M 124 160 L 128 159 L 127 165 L 123 166 Z" fill="#ffae66" opacity="0.55"/>
    <!-- head turned to the right (toward arches), messy black hair knot -->
    <ellipse cx="120" cy="138" rx="6" ry="6" fill="#a87858"/>
    <path d="M 114 134 Q 120 128 126 134 Q 127 138 125 140 Q 122 132 116 136 Q 114 137 114 140 Z" fill="#2a1c14"/>
    <ellipse cx="125" cy="131" rx="2.2" ry="2.6" fill="#2a1c14"/>
    <!-- face profile-ish, looking right -->
    <circle cx="123" cy="138" r="0.55" fill="#0a0604"/>
    <path d="M 122 142 Q 124 142 125 141" stroke="#3a2018" stroke-width="0.5" fill="none"/>
    <!-- copper accent stripe on shoulder -->
    <path d="M 109 148 L 116 146" stroke="#d88838" stroke-width="0.6" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#glowP2)">
    <ellipse cx="118" cy="164" rx="13" ry="15" fill="#d88838" opacity="0.45"/>
  </g>

  <!-- threshold ground shadow -->
  <ellipse cx="90" cy="200" rx="100" ry="3" fill="#040202" opacity="0.4"/>

  <!-- WREN dialogue caption (copper) -->
  <g transform="translate(8,206)">
    <rect x="0" y="0" width="222" height="30" rx="3" fill="#1a1828" stroke="#c87533" stroke-width="1.4"/>
    <text x="7" y="11" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#c87533">WREN</text>
    <text x="7" y="20" font-family="Georgia, serif" font-size="6.4" fill="#e8e0d4">The telegraph carries stories. Stories shape</text>
    <text x="7" y="27.5" font-family="Georgia, serif" font-size="6.4" fill="#e8e0d4">beliefs. Beliefs shape civilizations. I hate that this makes sense.</text>
  </g>

  <!-- LUMA dialogue caption (sapphire-violet) -->
  <g transform="translate(238,206)">
    <rect x="0" y="0" width="120" height="30" rx="3" fill="#1a1828" stroke="#6a5acd" stroke-width="1.4"/>
    <text x="7" y="11" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#8a7ae0">LUMA</text>
    <text x="7" y="22" font-family="Georgia, serif" font-size="7.4" fill="#e8e0d4">I know.</text>
  </g>
</svg>
