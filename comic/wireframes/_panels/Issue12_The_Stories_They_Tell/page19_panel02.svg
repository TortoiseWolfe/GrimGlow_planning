<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 12 Page 19 Panel 2 — Five squad members in morning light, the fairy tales they always were</title>
  <desc>Medium shot. Five tiny figures in maximum-degradation metallic suits stand on timber beams inside church steeple in morning light. Silver, copper, emerald, crimson, sapphire-violet — each suit heavily damaged, soot-covered, improvised repairs visible, but holographic light still bleeds through the grime at joints, seams, and nodes in five department colors. They look at each other — no holographic displays, no evidence, no projection. Just five people who know what they are now. Morning light through stone arches catches grime and light beneath. The degradation arc at peak, the beauty at deepest. The fairy tales they always were.</desc>
