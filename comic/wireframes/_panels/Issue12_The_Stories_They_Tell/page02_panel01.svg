<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 2 Panel 1 — Jink's POV banking over rooftops, "Visual on Junction Alpha. Ugly thing."</title>
  <desc>Wide first-person aerial POV banking over Victorian rooftop landscape at speed. Telegraph lines and chimney forests stretch below. Rooftop junction pole in mid-ground where multiple telegraph wires converge on junction box mounted near soot-blackened chimney stack. One emerald-glowing wing-tip visible in lower left corner — translucent holographic dragonfly wing with geometric lattice, trailing prismatic emerald light. Junction box has faint amber-black pulse at seams — Titan device embedded inside, sickly light a wrong note in the dawn.</desc>
  <defs>
    <linearGradient id="bgJ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="0.8" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="dawnAmberJ1" cx="0.92" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopJ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="rooftopMidJ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="chimneyJ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="junctionBoxJ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="titanGlowJ1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1810" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wingTipJ1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#fff088" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bloomJ1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowJ1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowJ1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wrongnessJ1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgJ1)"/>
  <rect width="742" height="240" fill="url(#dawnAmberJ1)"/>

  <g>
    <path d="M 0 80 L 60 76 L 140 80 L 220 76 L 300 80 L 380 76 L 460 80 L 540 76 L 620 80 L 700 76 L 742 80 L 742 110 L 0 110 Z" fill="url(#rooftopJ1)" opacity="0.85"/>

    <g opacity="0.7">
      <rect x="40" y="60" width="9" height="20" fill="#0a0604"/>
      <rect x="120" y="56" width="9" height="22" fill="#0a0604"/>
      <rect x="220" y="58" width="11" height="20" fill="#0a0604"/>
      <rect x="320" y="50" width="9" height="28" fill="#0a0604"/>
      <rect x="420" y="58" width="9" height="20" fill="#0a0604"/>
      <rect x="520" y="56" width="11" height="22" fill="#0a0604"/>
      <rect x="620" y="60" width="9" height="20" fill="#0a0604"/>
    </g>

    <path d="M 0 110 L 80 100 L 160 110 L 240 96 L 320 110 L 400 92 L 480 110 L 560 100 L 640 110 L 742 100 L 742 160 L 0 160 Z" fill="url(#rooftopMidJ1)" opacity="0.92"/>

    <g opacity="0.85">
      <rect x="40" y="80" width="14" height="20" fill="#040206"/>
      <rect x="120" y="80" width="14" height="20" fill="#040206"/>
      <rect x="240" y="74" width="14" height="22" fill="#040206"/>
      <rect x="380" y="72" width="14" height="22" fill="#040206"/>
      <rect x="520" y="78" width="14" height="22" fill="#040206"/>
      <rect x="660" y="82" width="14" height="20" fill="#040206"/>
    </g>

    <path d="M 0 160 L 100 150 L 200 160 L 300 145 L 400 160 L 500 142 L 600 160 L 742 148 L 742 240 L 0 240 Z" fill="#0a0604" opacity="0.92"/>

    <g opacity="0.85" stroke="#080404" stroke-width="0.55">
      <line x1="60" y1="98" x2="200" y2="80"/>
      <line x1="200" y1="80" x2="320" y2="60"/>
      <line x1="320" y1="60" x2="430" y2="58"/>
      <line x1="430" y1="58" x2="560" y2="68"/>
      <line x1="560" y1="68" x2="700" y2="62"/>

      <line x1="60" y1="118" x2="160" y2="100"/>
      <line x1="160" y1="100" x2="280" y2="98"/>
      <line x1="280" y1="98" x2="380" y2="96"/>
      <line x1="380" y1="96" x2="500" y2="100"/>
      <line x1="500" y1="100" x2="640" y2="98"/>
    </g>
  </g>
  <g opacity="0.62" filter="url(#bloomJ1)">
    <ellipse cx="640" cy="60" rx="280" ry="22" fill="#f4b860" opacity="0.42"/>
  </g>

  <g>
    <rect x="380" y="60" width="6" height="120" fill="#1a0a04"/>
    <rect x="384" y="180" width="14" height="14" fill="#1a0a04"/>
    <rect x="370" y="68" width="22" height="40" fill="url(#junctionBoxJ1)"/>
    <line x1="370" y1="76" x2="392" y2="76" stroke="#080404" stroke-width="0.55"/>
    <line x1="370" y1="100" x2="392" y2="100" stroke="#080404" stroke-width="0.55"/>

    <line x1="370" y1="80" x2="368" y2="84" stroke="url(#titanGlowJ1)" stroke-width="0.85" opacity="0.85"/>
    <line x1="392" y1="84" x2="394" y2="80" stroke="url(#titanGlowJ1)" stroke-width="0.85" opacity="0.85"/>
    <line x1="370" y1="92" x2="392" y2="92" stroke="url(#titanGlowJ1)" stroke-width="1.4" opacity="0.85"/>

    <g opacity="0.85" stroke="#080404" stroke-width="0.7">
      <line x1="370" y1="78" x2="220" y2="60"/>
      <line x1="370" y1="78" x2="280" y2="68"/>
      <line x1="370" y1="78" x2="320" y2="62"/>
      <line x1="392" y1="78" x2="500" y2="60"/>
      <line x1="392" y1="78" x2="560" y2="68"/>
      <line x1="392" y1="78" x2="660" y2="62"/>
      <line x1="370" y1="100" x2="160" y2="98"/>
      <line x1="392" y1="100" x2="640" y2="96"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#wrongnessJ1)">
    <rect x="370" y="68" width="22" height="40" fill="#a85020" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessJ1)">
    <rect x="362" y="60" width="38" height="56" fill="#3a1810" opacity="0.42"/>
  </g>

  <g>
    <path d="M 0 180 Q 40 174 80 178 Q 120 184 156 180 L 156 200 Q 120 210 80 206 Q 40 198 0 200 Z" fill="url(#wingTipJ1)" opacity="0.85"/>
    <g opacity="0.7" stroke="#3a8858" stroke-width="0.7" fill="none">
      <line x1="0" y1="180" x2="156" y2="180"/>
      <line x1="0" y1="190" x2="156" y2="190"/>
      <line x1="20" y1="178" x2="40" y2="200"/>
      <line x1="60" y1="178" x2="80" y2="206"/>
      <line x1="100" y1="180" x2="120" y2="208"/>
      <line x1="140" y1="180" x2="156" y2="200"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowJ1)">
    <path d="M 0 180 Q 40 174 80 178 Q 120 184 156 180 L 156 200 Q 120 210 80 206 Q 40 198 0 200 Z" fill="#3a8858" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowJ1)">
    <ellipse cx="78" cy="190" rx="120" ry="32" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.55">
    <line x1="200" y1="160" x2="280" y2="170" stroke="#7a7a7a" stroke-width="0.4" stroke-dasharray="2,2"/>
    <line x1="320" y1="170" x2="400" y2="180" stroke="#7a7a7a" stroke-width="0.4" stroke-dasharray="2,2"/>
    <line x1="440" y1="170" x2="520" y2="180" stroke="#7a7a7a" stroke-width="0.4" stroke-dasharray="2,2"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="280" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="130" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#3a8858" font-weight="700">JINK (radio): "Visual on Junction Alpha."</text>
    <text x="130" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#3a8858" font-style="italic" font-weight="700">"I see the device. Ugly thing."</text>
  </g>
  <g transform="translate(14,40)">
    <rect x="-6" y="0" width="320" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="150" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE: "Confirmed. Hold approach until synchronization."</text>
  </g>
</svg>
