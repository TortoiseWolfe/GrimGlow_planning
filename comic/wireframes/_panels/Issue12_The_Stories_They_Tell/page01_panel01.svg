    <line x1="40" y1="120" x2="160" y2="116"/>
    <line x1="160" y1="116" x2="280" y2="120"/>
    <line x1="280" y1="120" x2="400" y2="116"/>
    <line x1="400" y1="116" x2="520" y2="118"/>
    <line x1="520" y1="118" x2="640" y2="114"/>
    <line x1="640" y1="114" x2="740" y2="118"/>
  </g>

  <g opacity="0.85" stroke="#fff8d8" stroke-width="0.4">
    <line x1="60" y1="80" x2="180" y2="76"/>
    <line x1="320" y1="64" x2="450" y2="76"/>
    <line x1="580" y1="60" x2="700" y2="78"/>
  </g>

  <g>
    <circle cx="200" cy="40" r="1.6" fill="#3a8858"/>
    <circle cx="320" cy="120" r="1.4" fill="#d88838"/>
    <circle cx="500" cy="140" r="1.6" fill="#a83838"/>
    <circle cx="600" cy="180" r="1.4" fill="#7848b8"/>
    <circle cx="380" cy="80" r="1.6" fill="#a8c0e0"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowH1)">
    <circle cx="200" cy="40" r="6" fill="#3a8858" opacity="0.62"/>
    <circle cx="320" cy="120" r="5" fill="#d88838" opacity="0.62"/>
    <circle cx="500" cy="140" r="6" fill="#d83838" opacity="0.62"/>
