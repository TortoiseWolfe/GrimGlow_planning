      <rect x="320" y="136" width="11" height="22" fill="#040206"/>
      <rect x="400" y="126" width="14" height="32" fill="#040206"/>
      <rect x="480" y="136" width="11" height="22" fill="#040206"/>
      <rect x="560" y="130" width="14" height="28" fill="#040206"/>
      <rect x="640" y="136" width="11" height="22" fill="#040206"/>
      <rect x="700" y="130" width="14" height="28" fill="#040206"/>
