      <rect x="180" y="70" width="3" height="22" fill="#040206"/>
      <path d="M 320 60 L 326 60 L 323 50 Z" fill="#040206"/>
      <rect x="450" y="70" width="3" height="22" fill="#040206"/>
      <path d="M 580 56 L 586 56 L 583 46 Z" fill="#040206"/>
