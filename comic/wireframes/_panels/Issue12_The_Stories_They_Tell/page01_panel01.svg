<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 12 Page 1 Panel 1 — Dawn over the city, "Operation commence."</title>
  <desc>Ultra-wide high-angle establishing shot. Vast Victorian cityscape at dawn — rooftops, chimneys, church spires, telegraph lines like dark threads across lightening sky. Grey-pink dawn from east, long shadows westward. Five tiny points of faint colored light — emerald airborne and highest, copper-gold, crimson, blue-violet, blue-white — fireflies in the enormous city. Sky shifts grey-pink at horizon to pale blue overhead. Telegraph lines catch first light. Five smallest lights in the largest city.</desc>
  <defs>
    <linearGradient id="bgH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.3" stop-color="#a87878"/>
      <stop offset="0.6" stop-color="#a85820"/>
      <stop offset="1" stop-color="#3a1810"/>
    </linearGradient>
    <radialGradient id="dawnEastH1" cx="0.95" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cityFarH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="cityMidH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="cityNearH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="streetGlowH1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a85820" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomH1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowH1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowH1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="742" height="220" fill="url(#bgH1)"/>
  <rect width="742" height="220" fill="url(#dawnEastH1)"/>

  <g>
