  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="280" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="130" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#5a4a30" font-weight="700">CAPTION:</text>
    <text x="130" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#3a2410" font-style="italic" font-weight="700">"Dawn. Operation commence."</text>
  </g>
  <g transform="translate(14,40)">
    <rect x="-6" y="0" width="320" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="150" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE (radio): "All positions, this is Command. Confirm deployment."</text>
  </g>
