<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 18 Panel 2 — Luma traces the threads: from operatives who chose to stay to the stories that followed.</title>
  <desc>Medium close-up. A tiny figure in degraded sapphire-violet suit stands within a holographic constellation, one hand extended, tracing first the glowing thread between two luminous nodes — fairy glyphs and a miniature church-cache model with the carved word STAY — then sweeping toward floating newspaper headline fragments (BROWNIES SEEN, MYSTERIOUS LIGHTS, DANCING FIGURES ON ROOFTOPS) and a glowing pamphlet THE STORIES THEY TELL at the edge. South Asian features, warm brown skin, one thick dark braid, one cracked holographic lens, the other scrolling data. Expression shifts from scientific rigor to conviction. Threads brighten at her touch. Blue-violet light on face and hands. The evidence speaking and the stories that persisted.</desc>
  <defs>
    <linearGradient id="bgCB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.5" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetSpaceCB2" cx="0.5" cy="0.46" r="0.66">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitLumaCB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.4" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="hairLumaCB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinLumaCB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="glyphNodeCB2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5a38a8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cacheNodeCB2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5a38a8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="storyNodeCB2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8a0e8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#6a48b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brightThreadCB2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomCB2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowCB2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowCB2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgCB2)"/>
  <rect width="366" height="280" fill="url(#violetSpaceCB2)"/>

  <!-- glyph node (origin) -->
  <g>
    <ellipse cx="52" cy="98" rx="30" ry="20" fill="url(#glyphNodeCB2)"/>
    <text x="52" y="93" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff8d8" font-weight="700">∇⊥◊⊥∢⊕</text>
    <text x="52" y="100" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff8d8">⊥◊∇⊥∢</text>
    <text x="52" y="107" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff8d8">⊕Δ◊⊥</text>
    <text x="52" y="123" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">FAIRY GLYPHS</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowCB2)">
    <ellipse cx="52" cy="98" rx="38" ry="28" fill="#7848b8" opacity="0.42"/>
  </g>

  <!-- church cache node "STAY" -->
  <g>
    <ellipse cx="150" cy="180" rx="30" ry="20" fill="url(#cacheNodeCB2)"/>
    <ellipse cx="144" cy="180" rx="13" ry="5.5" fill="#5a4858"/>
    <path d="M 134 176 Q 150 172 164 176" stroke="#a878d8" stroke-width="0.55" fill="none"/>
    <text x="150" y="184" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#fff8d8" font-weight="700">STAY</text>
    <text x="150" y="204" text-anchor="middle" font-family="monospace" font-size="2.4" fill="#a878d8" font-style="italic">CHURCH CACHE</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowCB2)">
    <ellipse cx="150" cy="180" rx="38" ry="28" fill="#7848b8" opacity="0.42"/>
  </g>

  <!-- newspaper headline nodes (the stories that followed) -->
  <g>
    <rect x="282" y="46" width="74" height="20" rx="1.5" fill="#1a1428" opacity="0.92" stroke="#a878d8" stroke-width="0.6"/>
    <text x="319" y="55" text-anchor="middle" font-family="Times New Roman, serif" font-size="4.4" fill="#e8d8f8" font-weight="700">BROWNIES SEEN</text>
    <text x="319" y="62" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.2" fill="#a878d8" font-style="italic">— a parish account</text>
  </g>
  <g>
    <rect x="288" y="92" width="74" height="20" rx="1.5" fill="#1a1428" opacity="0.92" stroke="#a878d8" stroke-width="0.6"/>
    <text x="325" y="101" text-anchor="middle" font-family="Times New Roman, serif" font-size="4.2" fill="#e8d8f8" font-weight="700">MYSTERIOUS LIGHTS</text>
    <text x="325" y="108" text-anchor="middle" font-family="Times New Roman, serif" font-size="3" fill="#a878d8" font-style="italic">over the rooftops</text>
  </g>
  <g>
    <rect x="278" y="138" width="80" height="20" rx="1.5" fill="#1a1428" opacity="0.92" stroke="#a878d8" stroke-width="0.6"/>
    <text x="318" y="147" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.9" fill="#e8d8f8" font-weight="700">DANCING FIGURES</text>
    <text x="318" y="154" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.2" fill="#a878d8" font-style="italic">on the rooftops</text>
  </g>

  <!-- pamphlet node: THE STORIES THEY TELL (brightest, the record) -->
  <g>
    <ellipse cx="312" cy="206" rx="34" ry="24" fill="url(#storyNodeCB2)"/>
    <rect x="298" y="190" width="28" height="34" rx="1" fill="#f0e4d0" opacity="0.95" stroke="#a878d8" stroke-width="0.7"/>
    <line x1="302" y1="198" x2="322" y2="198" stroke="#6a4830" stroke-width="0.5"/>
    <line x1="302" y1="202" x2="322" y2="202" stroke="#6a4830" stroke-width="0.4"/>
    <line x1="302" y1="206" x2="320" y2="206" stroke="#6a4830" stroke-width="0.4"/>
    <line x1="302" y1="210" x2="322" y2="210" stroke="#6a4830" stroke-width="0.4"/>
    <line x1="302" y1="214" x2="318" y2="214" stroke="#6a4830" stroke-width="0.4"/>
    <text x="312" y="234" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#fff8d8" font-weight="700">THE STORIES THEY TELL</text>
  </g>
  <g opacity="0.9" filter="url(#strongGlowCB2)">
    <ellipse cx="312" cy="206" rx="42" ry="30" fill="#9868d8" opacity="0.5"/>
  </g>

  <!-- THREAD A: glyph -> cache (operatives), bright at her touch -->
  <g>
    <line x1="74" y1="116" x2="124" y2="172" stroke="url(#brightThreadCB2)" stroke-width="3" opacity="0.95"/>
    <line x1="74" y1="116" x2="124" y2="172" stroke="#fff8d8" stroke-width="0.85" opacity="0.95"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowCB2)">
    <line x1="74" y1="116" x2="124" y2="172" stroke="#a878d8" stroke-width="9" opacity="0.62"/>
  </g>
  <g opacity="0.6" filter="url(#megaGlowCB2)">
    <line x1="74" y1="116" x2="124" y2="172" stroke="#a878d8" stroke-width="20" opacity="0.4"/>
  </g>

  <!-- THREAD B: cache/STAY -> stories that followed, sweeping right -->
  <g>
    <path d="M 178 172 Q 250 150 286 60" stroke="url(#brightThreadCB2)" stroke-width="2.2" fill="none" opacity="0.9"/>
    <path d="M 178 174 Q 248 158 296 100" stroke="url(#brightThreadCB2)" stroke-width="2.2" fill="none" opacity="0.9"/>
    <path d="M 178 178 Q 246 168 290 146" stroke="url(#brightThreadCB2)" stroke-width="2.2" fill="none" opacity="0.9"/>
    <path d="M 178 184 Q 252 196 290 204" stroke="url(#brightThreadCB2)" stroke-width="3" fill="none" opacity="0.95"/>
    <path d="M 178 184 Q 252 196 290 204" stroke="#fff8d8" stroke-width="0.85" fill="none" opacity="0.95"/>
  </g>
  <g opacity="0.8" filter="url(#strongGlowCB2)">
    <path d="M 178 184 Q 252 196 290 204" stroke="#a878d8" stroke-width="9" fill="none" opacity="0.55"/>
  </g>
  <g opacity="0.5" filter="url(#megaGlowCB2)">
    <path d="M 178 184 Q 252 196 290 204" stroke="#9868d8" stroke-width="20" fill="none" opacity="0.36"/>
  </g>

  <!-- Luma figure, lower-left of center -->
  <g>
    <ellipse cx="150" cy="244" rx="22" ry="3" fill="#040202" opacity="0.62"/>

    <ellipse cx="150" cy="204" rx="22" ry="32" fill="url(#suitLumaCB2)"/>
    <path d="M 128 174 L 172 174 L 176 244 L 126 244 Z" fill="url(#suitLumaCB2)"/>

    <ellipse cx="150" cy="144" rx="22" ry="26" fill="url(#skinLumaCB2)"/>
    <path d="M 128 130 Q 150 108 174 130 Q 180 140 178 146 L 174 144 Q 160 130 150 132 Q 140 130 128 144 L 126 144 Q 124 140 128 130 Z" fill="url(#hairLumaCB2)"/>
    <!-- braid over shoulder -->
    <path d="M 130 154 Q 122 178 126 206 Q 128 218 132 224" stroke="url(#hairLumaCB2)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <line x1="124" y1="166" x2="130" y2="170" stroke="#1a0a08" stroke-width="0.5"/>
    <line x1="123" y1="180" x2="129" y2="184" stroke="#1a0a08" stroke-width="0.5"/>
    <line x1="123" y1="194" x2="129" y2="198" stroke="#1a0a08" stroke-width="0.5"/>

    <!-- cracked lens (left) -->
    <ellipse cx="139" cy="149" rx="6" ry="4" fill="#5a38a8"/>
    <ellipse cx="139" cy="149" rx="4" ry="3" fill="#1a1028"/>
    <line x1="134" y1="144" x2="144" y2="152" stroke="#d88838" stroke-width="0.55" opacity="0.85"/>
    <circle cx="139" cy="149" r="2" fill="#080404"/>
    <circle cx="140" cy="148" r="0.7" fill="#5a38a8"/>

    <!-- intact lens (right) scrolling data -->
    <ellipse cx="161" cy="149" rx="6" ry="4" fill="#a878d8"/>
    <ellipse cx="161" cy="149" rx="4" ry="3" fill="#1a1028"/>
    <circle cx="161" cy="149" r="2" fill="#080404"/>
    <circle cx="162" cy="148" r="0.7" fill="#a878d8"/>
    <text x="165" y="152" font-family="monospace" font-size="2" fill="#a878d8" opacity="0.85">∇⊥◊</text>

    <path d="M 142 160 Q 150 162 158 160" stroke="#1a0a08" stroke-width="0.55" fill="none"/>
    <!-- mouth: rigor giving way to conviction -->
    <path d="M 146 168 Q 150 171 154 168" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <!-- extended tracing arm reaching right toward the stories -->
    <path d="M 172 182 L 200 174 L 230 168 L 262 162" stroke="url(#skinLumaCB2)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="266" cy="160" rx="6" ry="3" fill="url(#skinLumaCB2)"/>
    <circle cx="274" cy="158" r="3" fill="#fff8d8"/>
  </g>
  <g opacity="0.85" filter="url(#bloomCB2)">
    <circle cx="274" cy="158" r="9" fill="#fff8d8" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#bloomCB2)">
    <ellipse cx="150" cy="204" rx="32" ry="40" fill="#7848b8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="150" cy="262" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <!-- caption box: both Luma blocks verbatim -->
  <g transform="translate(8,8)">
    <rect x="-4" y="0" width="350" height="62" rx="3" fill="#1a1828" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="171" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#a878d8" font-weight="700">LUMA: "Prior operatives — at least three deployments over centuries.</text>
    <text x="171" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#a878d8" font-style="italic">Each one carved glyphs. Each one left technology behind. Each one</text>
    <text x="171" y="27" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#a878d8" font-weight="700">stayed. They didn't fail to leave. They chose to stay."</text>
    <text x="171" y="40" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#a878d8" font-weight="700">LUMA: "And everywhere they went, stories followed. Humans saw them.</text>
    <text x="171" y="49" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#a878d8" font-style="italic">Told stories about them. Published them. The fairy tales aren't incidental.</text>
    <text x="171" y="58" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#a878d8" font-weight="700">They're the record. They're what persists."</text>
  </g>
</svg>
