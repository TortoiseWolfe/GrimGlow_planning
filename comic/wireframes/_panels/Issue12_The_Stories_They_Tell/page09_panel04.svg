    <line x1="164" y1="138" x2="196" y2="138" stroke="#3a3848" stroke-width="0.55"/>
    <circle cx="190" cy="138" r="1.4" fill="#3a3848"/>

    <line x1="160" y1="109" x2="158" y2="112" stroke="url(#titanSeamS4)" stroke-width="0.7"/>
    <line x1="200" y1="109" x2="202" y2="112" stroke="url(#titanSeamS4)" stroke-width="0.7"/>
    <line x1="164" y1="138" x2="196" y2="138" stroke="url(#titanSeamS4)" stroke-width="0.55"/>
    <line x1="160" y1="180" x2="200" y2="180" stroke="url(#titanSeamS4)" stroke-width="0.7"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessS4)">
