<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 240" width="247" height="240">
  <title>Issue 12 Page 9 Panel 4 — Theodore alone at the cabinet, "Jink's gone. Is someone hurt?"</title>
  <desc>Close-up. Victorian boy 12-13, lanky pre-teen, stands at cast-iron telegraph exchange cabinet on morning street, one hand on access panel, looking upward — searching sky where Jink was moments ago. Boy processing chaos through tiny earpiece — hearing battle he cannot see, understanding he is now alone. Sandy-brown hair, hazel eyes wide, freckles, gear ring catching light on finger. Cabinet beside him pulses faintly amber-black at seams. Morning street light, pedestrians passing behind, ordinary world indifferent. Alone at the threshold.</desc>
