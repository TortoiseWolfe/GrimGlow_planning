    <ellipse cx="54" cy="222" rx="3" ry="1" fill="#0a0404"/>
    <ellipse cx="118" cy="222" rx="3" ry="1" fill="#0a0404"/>

    <path d="M 70 140 L 64 162 L 68 180 L 76 180 L 74 162 Z" fill="url(#skinTheoS4)" opacity="0.85"/>
    <path d="M 102 140 L 108 162 L 130 138 Q 140 130 144 130" stroke="url(#skinTheoS4)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="146" cy="128" rx="6" ry="3" fill="url(#skinTheoS4)"/>

    <ellipse cx="138" cy="134" rx="2" ry="2.4" fill="url(#brassRingS4)"/>
    <ellipse cx="138" cy="134" rx="1" ry="1.4" fill="#a85820"/>

    <ellipse cx="86" cy="106" rx="14" ry="16" fill="url(#skinTheoS4)"/>
    <path d="M 72 92 Q 86 78 102 92 Q 104 102 102 106 L 70 106 Q 70 102 72 92 Z" fill="url(#hairTheoS4)"/>
    <path d="M 76 90 Q 84 84 92 86" stroke="#7a3818" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M 96 84 Q 100 86 104 92" stroke="#7a3818" stroke-width="0.7" fill="none" opacity="0.7"/>

    <ellipse cx="80" cy="108" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="80.6" cy="107.4" r="0.62" fill="#a87838"/>
    <ellipse cx="92" cy="108" rx="2" ry="2.4" fill="#0a0604"/>
    <circle cx="92.6" cy="107.4" r="0.62" fill="#a87838"/>

    <path d="M 76 104 Q 80 102 84 104" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 88 104 Q 92 102 96 104" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 82 122 L 90 122" stroke="#1a0a08" stroke-width="0.7" fill="none"/>

    <ellipse cx="82" cy="114" rx="2" ry="0.7" fill="#a85820" opacity="0.55"/>
    <ellipse cx="90" cy="114" rx="2" ry="0.7" fill="#a85820" opacity="0.55"/>
