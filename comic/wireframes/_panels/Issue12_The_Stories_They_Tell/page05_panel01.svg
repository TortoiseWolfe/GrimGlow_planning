<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 5 Panel 1 — Composite, three-fourths complete, "Three targets neutralized."</title>
  <desc>Composite wide panel divided into three simultaneous moments by telegraph wire lines. LEFT: tiny figure in degraded copper suit climbs out of telegraph station ventilation gap into dawn light, extracted Titan device in kit, dawn light hitting her face — relief and competence. CENTER: tiny figure in pewter-dark silver suit at church steeple, holographic tactical display showing three device markers changed to neutral grey, one still pulsing amber-black — focused on last marker. RIGHT: tiny figure in degraded emerald suit airborne above rooftops, emerald-green wing-trails marking circling patrol pattern.</desc>
  <defs>
    <linearGradient id="bgM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.4" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="dawnLeftM1" cx="0.18" cy="0.5" r="0.18">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="holoCenterM1" cx="0.5" cy="0.5" r="0.18">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldRightM1" cx="0.85" cy="0.5" r="0.2">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1a4830" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooftopM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitWrenM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="suitSableM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="suitJinkM1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="trailM1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#fff088" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomM1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowM1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowM1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgM1)"/>
