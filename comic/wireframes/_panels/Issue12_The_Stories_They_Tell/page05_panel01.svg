  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="280" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="130" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c0e0" font-weight="700">SABLE: "Three targets neutralized."</text>
    <text x="130" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#d83838" font-style="italic" font-weight="700">THRESH: "Two connections left. Almost there."</text>
  </g>
</svg>
