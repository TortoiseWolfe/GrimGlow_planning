    <line x1="380" y1="132" x2="440" y2="132" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="380" y1="142" x2="440" y2="142" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="392" y1="120" x2="392" y2="152" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="412" y1="120" x2="412" y2="152" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>
    <line x1="426" y1="120" x2="426" y2="152" stroke="#5a78a8" stroke-width="0.4" opacity="0.62"/>

    <circle cx="396" cy="128" r="2" fill="#7a7a7a"/>
    <circle cx="416" cy="135" r="2" fill="#7a7a7a"/>
    <circle cx="430" cy="148" r="2" fill="#7a7a7a"/>
    <circle cx="404" cy="142" r="2" fill="#a85020"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowM1)">
    <rect x="380" y="120" width="60" height="32" fill="#a8c0e0" opacity="0.42"/>
    <circle cx="404" cy="142" r="6" fill="#a85020" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowM1)">
    <rect x="380" y="120" width="60" height="32" fill="#5a78a8" opacity="0.32"/>
  </g>

  <g>
    <rect x="495" y="0" width="247" height="240" fill="url(#bgM1)" opacity="0.32"/>
    <rect x="495" y="0" width="247" height="240" fill="url(#emeraldRightM1)" opacity="0.62"/>

    <path d="M 510 100 L 580 96 L 650 100 L 720 96 L 742 100 L 742 160 L 510 160 Z" fill="url(#rooftopM1)" opacity="0.62"/>
