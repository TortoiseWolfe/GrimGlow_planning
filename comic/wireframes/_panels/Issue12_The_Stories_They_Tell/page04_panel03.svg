<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 12 Page 4 Panel 3 — Wren completes her disarm, "Two down."</title>
  <desc>Medium shot. Tiny figure in degraded copper suit pulls last interface connection from dark Titan device mounted inside telegraph junction cabinet. Device goes dead — amber-black light extinguished. Telegraph relay coils around her hum with normal function, brass and copper gleaming in returning warmth of pre-dawn light through dirty windows. She holds extracted device — dark, angular, inert — in one oil-stained hand. Professional satisfaction, nod to herself. Copper-gold tools brighter now. Normal brass tones return.</desc>
  <defs>
    <linearGradient id="bgL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.4" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="dawnReturnL3" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinetInteriorL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperWireL3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="suitWrenL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.4" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="hairWrenL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a878"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="extractedDeviceL3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1810"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <filter id="bloomL3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowL3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowL3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgL3)"/>
  <rect width="366" height="240" fill="url(#dawnReturnL3)"/>

  <g>
    <rect x="60" y="20" width="246" height="200" fill="url(#cabinetInteriorL3)"/>
    <rect x="60" y="20" width="246" height="9" fill="#5a3018"/>
    <rect x="60" y="211" width="246" height="9" fill="#5a3018"/>
    <rect x="60" y="20" width="6" height="200" fill="#5a3018"/>
    <rect x="300" y="20" width="6" height="200" fill="#5a3018"/>

    <g opacity="0.85" stroke="url(#copperWireL3)" stroke-width="1.4" fill="none">
      <path d="M 70 50 Q 130 56 183 50 Q 236 44 300 50"/>
      <path d="M 70 80 Q 130 86 183 80 Q 236 74 300 80"/>
      <path d="M 70 110 Q 130 116 183 110 Q 236 104 300 110"/>
      <path d="M 70 140 Q 130 146 183 140 Q 236 134 300 140"/>
      <path d="M 70 170 Q 130 176 183 170 Q 236 164 300 170"/>
      <path d="M 70 200 Q 130 206 183 200 Q 236 194 300 200"/>
    </g>

    <ellipse cx="100" cy="60" rx="9" ry="6" fill="#5a3018"/>
    <circle cx="100" cy="60" r="2" fill="#fff8d8" opacity="0.85"/>
    <ellipse cx="266" cy="80" rx="9" ry="6" fill="#5a3018"/>
    <circle cx="266" cy="80" r="2" fill="#fff8d8" opacity="0.85"/>
    <ellipse cx="100" cy="180" rx="9" ry="6" fill="#5a3018"/>
    <circle cx="100" cy="180" r="2" fill="#fff8d8" opacity="0.85"/>
    <ellipse cx="266" cy="190" rx="9" ry="6" fill="#5a3018"/>
    <circle cx="266" cy="190" r="2" fill="#fff8d8" opacity="0.85"/>
  </g>
  <g opacity="0.85" filter="url(#bloomL3)">
    <circle cx="100" cy="60" r="6" fill="#d88838" opacity="0.62"/>
    <circle cx="266" cy="80" r="6" fill="#d88838" opacity="0.62"/>
    <circle cx="100" cy="180" r="6" fill="#d88838" opacity="0.62"/>
    <circle cx="266" cy="190" r="6" fill="#d88838" opacity="0.62"/>
  </g>

  <g>
    <rect x="140" y="100" width="80" height="40" fill="#080404"/>
    <line x1="140" y1="120" x2="220" y2="120" stroke="#3a2010" stroke-width="0.55"/>
    <ellipse cx="180" cy="120" rx="9" ry="6" fill="#1a0810"/>
    <circle cx="180" cy="120" r="2" fill="#3a1810" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="183" cy="200" rx="22" ry="22" fill="#040202" opacity="0.62"/>

    <ellipse cx="183" cy="160" rx="14" ry="22" fill="url(#suitWrenL3)"/>
    <path d="M 169 140 L 197 140 L 200 184 L 166 184 Z" fill="url(#suitWrenL3)"/>
    <path d="M 171 144 L 178 142 L 176 154 L 168 156 Z" fill="#1a0804" opacity="0.85"/>
    <line x1="171" y1="148" x2="173" y2="156" stroke="#a85820" stroke-width="0.55"/>

    <ellipse cx="183" cy="120" rx="11" ry="14" fill="url(#skinWrenL3)"/>
    <path d="M 174 110 Q 183 96 192 110 Q 196 116 194 122 L 186 124 Q 184 110 174 110 Z" fill="url(#hairWrenL3)"/>
    <path d="M 192 100 Q 200 96 200 104 L 196 108 Z" fill="url(#hairWrenL3)"/>

    <circle cx="180" cy="122" r="0.85" fill="#0a0604"/>
    <circle cx="187" cy="122" r="0.85" fill="#0a0604"/>
    <path d="M 178 134 Q 183 134 188 134" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 166 184 Q 156 196 146 200" stroke="url(#suitWrenL3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="146" cy="200" rx="4" ry="2" fill="url(#skinWrenL3)"/>

    <path d="M 200 184 Q 220 196 240 200" stroke="url(#suitWrenL3)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="240" cy="200" rx="6" ry="3" fill="url(#skinWrenL3)"/>
  </g>

  <g>
    <rect x="232" y="190" width="22" height="14" fill="url(#extractedDeviceL3)"/>
    <line x1="232" y1="194" x2="254" y2="194" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="232" y1="200" x2="254" y2="200" stroke="#3a1810" stroke-width="0.55"/>
    <circle cx="243" cy="197" r="1.4" fill="#3a1810" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowL3)">
    <ellipse cx="183" cy="160" rx="22" ry="32" fill="#d88838" opacity="0.42"/>
    <ellipse cx="146" cy="200" rx="6" ry="3" fill="#d88838" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowL3)">
    <ellipse cx="183" cy="160" rx="40" ry="50" fill="#a85820" opacity="0.32"/>
  </g>

  <g>
    <circle cx="60" cy="160" r="2.4" fill="#fff8d8" opacity="0.85"/>
    <circle cx="80" cy="170" r="1.6" fill="#fff8d8" opacity="0.62"/>
    <circle cx="40" cy="180" r="2" fill="#fff8d8" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#bloomL3)">
    <circle cx="60" cy="160" r="9" fill="#d88838" opacity="0.62"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="220" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="320" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="150" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a85820" font-weight="700">WREN: "Station Bravo neutralized. Device extracted intact."</text>
    <text x="150" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a85820" font-style="italic" font-weight="700">"Two down."</text>
  </g>
</svg>
