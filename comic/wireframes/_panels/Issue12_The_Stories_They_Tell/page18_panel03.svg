  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="320" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="150" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-weight="700">WREN: "Telegraph carries stories. Stories shape beliefs."</text>
    <text x="150" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a85820" font-style="italic" font-weight="700">"Beliefs shape civilizations. I hate that this makes sense."</text>
  </g>
  <g transform="translate(440,12)">
