<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 12 Page 18 Panel 3 — Wren's pushback, "Stories don't build civilizations." Luma: "The medium shapes the message."</title>
  <desc>Medium shot. Wren, arms crossed in maximum-degradation copper suit, stands skeptical within a blue-violet holographic constellation. The engineer who deals in systems, not stories. Around her the connections she helped prove — telegraph nodes, Titan device locations, data-flow patterns — all leading back to a central written-page node. The thread between the TELEGRAPH node and the STORIES node brightens as Luma names it. Blue-violet constellation light reflected in her copper-gold suit accents.</desc>
  <defs>
    <linearGradient id="bgWP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.5" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="violetSpaceWP3" cx="0.46" cy="0.5" r="0.64">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitWrenWP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.4" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2c10"/>
    </linearGradient>
    <linearGradient id="hairWrenWP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1810"/>
      <stop offset="0.5" stop-color="#140a06"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="skinWrenWP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b888"/>
      <stop offset="0.4" stop-color="#b88858"/>
      <stop offset="1" stop-color="#7a5030"/>
    </linearGradient>
    <linearGradient id="paperWP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d8c8a8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="pageNodeWP3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#c8a8e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cacheNodeWP3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#5a38a8" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titanNodeWP3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a3098" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a2868" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brightThreadWP3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#fff8d8" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#a878d8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomWP3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowWP3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowWP3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgWP3)"/>
  <rect width="366" height="280" fill="url(#violetSpaceWP3)"/>

  <!-- faint timber beams of the steeple behind the constellation -->
  <g opacity="0.32">
    <rect x="0" y="44" width="366" height="5" fill="#2a1808" transform="rotate(-3 183 46)"/>
    <rect x="300" y="60" width="9" height="220" fill="#2a1808" transform="rotate(4 304 170)"/>
    <rect x="40" y="70" width="7" height="210" fill="#2a1808" transform="rotate(-3 44 175)"/>
  </g>

  <!-- constellation threads (drawn under nodes) -->
  <g>
    <!-- telegraph -> stories: THE bright thread Luma names -->
    <line x1="76" y1="86" x2="246" y2="148" stroke="url(#brightThreadWP3)" stroke-width="2.6" opacity="0.97"/>
    <line x1="76" y1="86" x2="246" y2="148" stroke="#fff8d8" stroke-width="0.8" opacity="0.97"/>
    <!-- titan device -> telegraph -->
    <line x1="300" y1="74" x2="76" y2="86" stroke="#7848b8" stroke-width="1.6" opacity="0.7"/>
    <!-- titan device -> stories (steering through transmitted stories) -->
    <line x1="300" y1="74" x2="246" y2="148" stroke="#7848b8" stroke-width="1.4" opacity="0.62"/>
    <!-- data-flow node -> stories -->
    <line x1="312" y1="206" x2="246" y2="148" stroke="#a878d8" stroke-width="1.4" opacity="0.62"/>
    <!-- glyph -> stories -->
    <line x1="58" y1="214" x2="246" y2="148" stroke="#a878d8" stroke-width="1.4" opacity="0.62"/>
  </g>
  <g opacity="0.6" filter="url(#megaGlowWP3)">
    <line x1="76" y1="86" x2="246" y2="148" stroke="#a878d8" stroke-width="11" opacity="0.45"/>
  </g>

  <!-- TELEGRAPH node (upper left) -->
  <g>
    <ellipse cx="76" cy="86" rx="30" ry="22" fill="url(#cacheNodeWP3)"/>
    <line x1="60" y1="92" x2="92" y2="92" stroke="#c8b8e0" stroke-width="0.7"/>
    <line x1="64" y1="80" x2="64" y2="92" stroke="#c8b8e0" stroke-width="0.7"/>
    <line x1="76" y1="76" x2="76" y2="92" stroke="#c8b8e0" stroke-width="0.7"/>
    <line x1="88" y1="80" x2="88" y2="92" stroke="#c8b8e0" stroke-width="0.7"/>
    <circle cx="70" cy="84" r="1.3" fill="#fff8d8"/>
    <circle cx="82" cy="84" r="1.3" fill="#fff8d8"/>
    <text x="76" y="106" text-anchor="middle" font-family="monospace" font-size="3" fill="#c8a8e0" font-style="italic">TELEGRAPH</text>
  </g>
  <g opacity="0.6" filter="url(#strongGlowWP3)">
    <ellipse cx="76" cy="86" rx="36" ry="28" fill="#7848b8" opacity="0.4"/>
  </g>

  <!-- TITAN DEVICE node (upper right) — lightless dark iridescence -->
  <g>
    <ellipse cx="300" cy="74" rx="26" ry="20" fill="url(#titanNodeWP3)"/>
    <path d="M 288 74 L 300 62 L 312 74 L 300 86 Z" fill="#3a2868" stroke="#5a3098" stroke-width="0.7"/>
    <path d="M 294 74 L 300 68 L 306 74 L 300 80 Z" fill="#1a1028" opacity="0.85"/>
    <text x="300" y="98" text-anchor="middle" font-family="monospace" font-size="2.8" fill="#7a5ac8" font-style="italic">TITAN DEVICE</text>
  </g>
  <g opacity="0.55" filter="url(#strongGlowWP3)">
    <ellipse cx="300" cy="74" rx="30" ry="24" fill="#5a3098" opacity="0.42"/>
  </g>

  <!-- DATA-FLOW node (lower right) -->
  <g>
    <ellipse cx="312" cy="206" rx="22" ry="16" fill="url(#cacheNodeWP3)"/>
    <path d="M 300 212 L 306 200 L 310 208 L 316 196 L 320 206 L 324 198" stroke="#fff8d8" stroke-width="0.7" fill="none"/>
    <text x="312" y="228" text-anchor="middle" font-family="monospace" font-size="2.8" fill="#c8a8e0" font-style="italic">DATA-FLOW</text>
  </g>
  <g opacity="0.55" filter="url(#strongGlowWP3)">
    <ellipse cx="312" cy="206" rx="26" ry="20" fill="#7848b8" opacity="0.4"/>
  </g>

  <!-- GLYPH/cache node (lower left) -->
  <g>
    <ellipse cx="58" cy="214" rx="20" ry="15" fill="url(#cacheNodeWP3)"/>
    <text x="58" y="218" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#fff8d8" font-weight="700">STAY</text>
    <text x="58" y="234" text-anchor="middle" font-family="monospace" font-size="2.6" fill="#a878d8" font-style="italic">GLYPH</text>
  </g>
  <g opacity="0.55" filter="url(#strongGlowWP3)">
    <ellipse cx="58" cy="214" rx="24" ry="19" fill="#7848b8" opacity="0.4"/>
  </g>

  <!-- central STORIES / written-page node (the convergence) -->
  <g>
    <ellipse cx="246" cy="148" rx="40" ry="34" fill="url(#pageNodeWP3)"/>
    <g transform="rotate(6 246 148)">
      <rect x="228" y="128" width="36" height="44" rx="1.5" fill="url(#paperWP3)" opacity="0.95"/>
      <text x="246" y="139" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">THE STORIES</text>
      <text x="246" y="146" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#1a0a04" font-weight="700">THEY TELL</text>
      <line x1="232" y1="151" x2="260" y2="151" stroke="#3a2010" stroke-width="0.4"/>
      <line x1="232" y1="156" x2="260" y2="156" stroke="#3a2010" stroke-width="0.4"/>
      <line x1="232" y1="161" x2="260" y2="161" stroke="#3a2010" stroke-width="0.4"/>
      <line x1="232" y1="166" x2="254" y2="166" stroke="#3a2010" stroke-width="0.4"/>
    </g>
    <text x="246" y="190" text-anchor="middle" font-family="monospace" font-size="3" fill="#fff8d8" font-style="italic">STORIES</text>
  </g>
  <g opacity="0.8" filter="url(#strongGlowWP3)">
    <ellipse cx="246" cy="148" rx="42" ry="36" fill="#fff8d8" opacity="0.4"/>
  </g>

  <!-- WREN — arms crossed, skeptic inside the evidence (lower-center-left) -->
  <g>
    <ellipse cx="150" cy="252" rx="24" ry="3.5" fill="#040202" opacity="0.6"/>

    <!-- torso, copper suit -->
    <ellipse cx="150" cy="222" rx="23" ry="23" fill="url(#suitWrenWP3)"/>
    <path d="M 127 196 L 173 196 L 176 252 L 124 252 Z" fill="url(#suitWrenWP3)"/>
    <!-- copper-gold accent seams catching the violet -->
    <line x1="150" y1="200" x2="150" y2="248" stroke="#f0c878" stroke-width="0.9" opacity="0.85"/>
    <line x1="134" y1="212" x2="166" y2="212" stroke="#a878d8" stroke-width="0.7" opacity="0.7"/>
    <path d="M 130 224 Q 150 230 170 224" stroke="#c8a8e0" stroke-width="0.6" fill="none" opacity="0.6"/>
    <!-- soot/degradation patches -->
    <ellipse cx="138" cy="234" rx="6" ry="9" fill="#2a1808" opacity="0.45"/>
    <ellipse cx="164" cy="230" rx="5" ry="7" fill="#2a1808" opacity="0.4"/>

    <!-- crossed arms over the chest -->
    <path d="M 130 214 Q 150 226 170 214 L 168 224 Q 150 234 132 224 Z" fill="url(#suitWrenWP3)" stroke="#7a4020" stroke-width="0.6"/>
    <path d="M 132 220 Q 150 230 168 220" stroke="#f0c878" stroke-width="0.7" fill="none" opacity="0.7"/>
    <ellipse cx="129" cy="222" rx="4.5" ry="4" fill="url(#skinWrenWP3)"/>
    <ellipse cx="171" cy="222" rx="4.5" ry="4" fill="url(#skinWrenWP3)"/>

    <!-- head -->
    <ellipse cx="150" cy="172" rx="14" ry="16" fill="url(#skinWrenWP3)"/>
    <!-- messy black hair knot -->
    <path d="M 136 164 Q 150 148 164 164 Q 168 170 166 176 L 163 168 Q 156 162 150 164 Q 144 162 137 174 L 134 174 Q 134 168 136 164 Z" fill="url(#hairWrenWP3)"/>
    <ellipse cx="160" cy="158" rx="5" ry="4.5" fill="url(#hairWrenWP3)"/>
    <path d="M 162 154 Q 168 152 166 158" stroke="#140a06" stroke-width="1.4" fill="none"/>

    <!-- skeptical eyes — one brow up -->
    <path d="M 140 172 L 148 174" stroke="#1a0a08" stroke-width="0.7"/>
    <path d="M 152 174 L 160 171" stroke="#1a0a08" stroke-width="0.7"/>
    <ellipse cx="144" cy="176" rx="2.6" ry="1.8" fill="#1a1028"/>
    <ellipse cx="156" cy="176" rx="2.6" ry="1.8" fill="#a878d8"/>
    <circle cx="144" cy="176" r="0.9" fill="#080404"/>
    <circle cx="156" cy="176" r="0.9" fill="#080404"/>
    <circle cx="157" cy="175" r="0.4" fill="#fff8d8"/>
    <!-- flat, unconvinced mouth -->
    <path d="M 145 185 L 156 184" stroke="#1a0a08" stroke-width="0.7" fill="none"/>
  </g>
  <!-- violet rim-light bloom across Wren -->
  <g opacity="0.7" filter="url(#bloomWP3)">
    <ellipse cx="150" cy="220" rx="30" ry="30" fill="#7848b8" opacity="0.34"/>
  </g>

  <g opacity="0.6">
    <ellipse cx="183" cy="272" rx="120" ry="3" fill="#040202" opacity="0.4"/>
  </g>

  <!-- WREN caption (copper) -->
  <g transform="translate(8,10)">
    <rect x="-4" y="0" width="234" height="42" rx="3" fill="#1a1828" opacity="0.95" stroke="#c87533" stroke-width="1.2"/>
    <text x="113" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#d88838" font-weight="700">WREN: "Stories don't build</text>
    <text x="113" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#d88838" font-weight="700">civilizations, Luma. Technology does.</text>
    <text x="113" y="27" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#d88838" font-style="italic">Infrastructure. The telegraph doesn't</text>
    <text x="113" y="36" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.2" fill="#d88838" font-style="italic">care about fairy tales."</text>
  </g>

  <!-- LUMA caption (sapphire-violet) -->
  <g transform="translate(108,212)">
    <rect x="-4" y="0" width="258" height="58" rx="3" fill="#1a1828" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="125" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a878d8" font-weight="700">LUMA: "The telegraph carries information</text>
    <text x="125" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a878d8" font-style="italic">that shapes what people believe. You proved</text>
    <text x="125" y="27" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a878d8" font-style="italic">that yourself — the Titan devices were steering</text>
    <text x="125" y="36" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a878d8" font-style="italic">human development through the stories the</text>
    <text x="125" y="45" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a878d8" font-weight="700">telegraph transmitted. The medium shapes</text>
    <text x="125" y="54" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a878d8" font-weight="700">the message. The message shapes the civilization."</text>
  </g>
</svg>
