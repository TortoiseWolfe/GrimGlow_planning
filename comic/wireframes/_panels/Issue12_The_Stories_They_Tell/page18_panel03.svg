<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 12 Page 18 Panel 3 — The squad in the constellation, the city below, "I hate that this makes sense."</title>
  <desc>Wide. Interior of Victorian church steeple filled with blue-violet holographic constellation — luminous nodes and threads floating among bell mechanism and timber beams. Five tiny figures in degraded metallic suits stand within constellation, five colors of light bleeding through grime. Through stone arches, Victorian city stretches below — rooftops, chimneys, telegraph lines, gaslit sprawl in morning light. Blue-violet inside, warm amber outside through arches. Two light sources coexist — neither dominating. The convergence.</desc>
  <defs>
    <linearGradient id="bgCC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2868"/>
      <stop offset="0.5" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="constellInsideCC3" cx="0.5" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberOutsideCC3" cx="0.5" cy="0.92" r="0.45">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneArchCC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6878"/>
      <stop offset="0.5" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#3a2838"/>
    </linearGradient>
    <linearGradient id="cityFarCC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="centerNodeCC3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#7848b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassWindowCC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <filter id="bloomCC3" x="-20%" y="-20%" width="140%" height="140%">
