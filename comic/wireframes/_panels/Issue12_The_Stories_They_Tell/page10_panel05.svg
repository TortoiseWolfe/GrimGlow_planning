  </g>

  <g>
    <ellipse cx="140" cy="240" rx="22" ry="6" fill="#040202" opacity="0.62"/>

    <ellipse cx="140" cy="200" rx="22" ry="32" fill="url(#suitThreshT5)"/>
    <path d="M 118 178 L 162 178 L 165 240 L 116 240 Z" fill="url(#suitThreshT5)"/>

    <ellipse cx="140" cy="148" rx="14" ry="16" fill="#fff8e8"/>
    <path d="M 126 138 Q 140 122 154 138 Q 156 142 154 144 L 126 144 Q 124 142 126 138 Z" fill="#7a3018"/>
    <circle cx="135" cy="148" r="0.85" fill="#0a0604"/>
    <circle cx="145" cy="148" r="0.85" fill="#0a0604"/>
    <path d="M 132 158 Q 140 156 148 158" stroke="#1a0a08" stroke-width="0.7" fill="none"/>

    <path d="M 162 178 L 200 160" stroke="url(#suitThreshT5)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="200" cy="160" rx="6" ry="4" fill="#fff8e8"/>

    <rect x="200" y="156" width="40" height="11" rx="2" fill="#3a2230"/>
    <rect x="234" y="158" width="11" height="6" rx="1" fill="#3a2230"/>
    <line x1="200" y1="160" x2="245" y2="160" stroke="url(#boltLineT5)" stroke-width="2" opacity="0.85"/>
    <circle cx="245" cy="160" r="3" fill="#fff088"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowT5)">
    <circle cx="245" cy="160" r="9" fill="#fff088" opacity="0.62"/>
    <ellipse cx="140" cy="200" rx="32" ry="40" fill="#d83838" opacity="0.42"/>
  </g>

  <g>
    <line x1="245" y1="160" x2="290" y2="100" stroke="url(#boltLineT5)" stroke-width="3" opacity="0.95"/>
    <line x1="245" y1="160" x2="290" y2="100" stroke="#fff8d8" stroke-width="1.4" opacity="0.95"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowT5)">
    <line x1="245" y1="160" x2="290" y2="100" stroke="#d83838" stroke-width="6" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#ultraGlowT5)">
    <line x1="245" y1="160" x2="290" y2="100" stroke="#fff088" stroke-width="22" opacity="0.42"/>
  </g>

  <g transform="rotate(-15 380 140)">
    <ellipse cx="380" cy="140" rx="11" ry="6" fill="url(#suitJinkT5)"/>
    <path d="M 371 138 Q 358 132 350 138 Q 358 144 371 142 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 389 138 Q 402 132 410 138 Q 402 144 389 142 Z" fill="#3a8858" opacity="0.85"/>

    <ellipse cx="380" cy="136" rx="4" ry="4" fill="#a87858"/>
    <path d="M 376 134 Q 380 128 384 134 Q 386 136 384 138 L 376 138 Q 374 136 376 134 Z" fill="#fff088"/>
    <circle cx="378" cy="136" r="0.4" fill="#0a0604"/>
    <circle cx="382" cy="136" r="0.4" fill="#0a0604"/>
  </g>
  <g opacity="0.85" filter="url(#bloomT5)">
    <circle cx="380" cy="140" r="14" fill="#3a8858" opacity="0.55"/>
  </g>

  <g opacity="0.62">
    <circle cx="240" cy="60" r="1.4" fill="#3a2868"/>
    <circle cx="320" cy="50" r="1.4" fill="#5a3098"/>
    <circle cx="280" cy="120" r="1.4" fill="#3a2868"/>
    <circle cx="350" cy="110" r="1.4" fill="#5a3098"/>
    <circle cx="220" cy="140" r="1.4" fill="#3a2868"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="247" cy="260" rx="180" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="320" height="34" rx="3" fill="#1a1828" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="150" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-weight="700">JINK: "Direct hit! It's pulling back!"</text>
    <text x="150" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-style="italic">THRESH (ragged): "Did I get it?"</text>
    <text x="150" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a8858" font-style="italic" font-weight="700">JINK: "You got it, Thresh. You got it."</text>
  </g>
</svg>
