      <stop offset="0.5" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d83838" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wingShardT5" x1="0" y1="0" x2="1" y2="1">
