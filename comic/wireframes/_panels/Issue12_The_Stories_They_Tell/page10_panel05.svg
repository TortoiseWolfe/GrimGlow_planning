<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 12 Page 10 Panel 5 — The wound. The blinded drone whips a limb; Thresh is thrown down, wing-pack shattered.</title>
  <desc>Medium wide. The crimson bolt has struck the Titan drone's sensor cluster — it shatters, dark crystalline fragments spraying with flickering iridescence as the drone spasms and retreats into the ceiling pipes. But the blinded thing convulses, whipping an angular limb that strikes Thresh across the back where the wing-pack mounts. The crimson wing-pack SHATTERS into guttering crimson shards, one arm folds the wrong way, and Thresh is thrown DOWN to the basement floor at the base of the brick column — no longer standing or aiming, on the ground with the weapon spilling from a slack grip. Jink (emerald) dives in, relief turned to alarm. The mood flips from triumph to cost-paid.</desc>
