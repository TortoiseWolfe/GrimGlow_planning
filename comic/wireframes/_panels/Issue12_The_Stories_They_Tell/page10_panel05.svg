<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 12 Page 10 Panel 5 — The shot hits, "You got it, Thresh. You got it."</title>
  <desc>Medium wide. Crimson energy bolt strikes sensor cluster of Titan drone — cluster shatters, dark crystalline fragments spraying outward with flickering iridescence. Drone spasms, angular limbs jerking with lost coordination, pulling back toward ceiling pipes in retreat. At base of brick column, tiny figure in crimson armor with weapon extended, barrel still glowing — fierce shaking triumph. Nearby, hovering, second tiny figure in emerald watches with relief. Dark crystalline fragments scatter through air. The shot that mattered.</desc>
  <defs>
    <linearGradient id="bgT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1018"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="impactFlashT5" cx="0.62" cy="0.35" r="0.32">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="droneRetreatT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="droneShellT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080404"/>
      <stop offset="0.5" stop-color="#020100"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="iridescenceFlickerT5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2868" stop-opacity="0.42"/>
      <stop offset="0.3" stop-color="#5a3098" stop-opacity="0.62"/>
      <stop offset="0.6" stop-color="#1a0a04" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3a2868" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="brickT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitThreshT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="suitJinkT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="boltLineT5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff088" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d83838" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bloomT5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowT5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowT5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowT5" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="494" height="280" fill="url(#bgT5)"/>
  <rect width="494" height="280" fill="url(#impactFlashT5)"/>

  <g>
    <rect x="0" y="0" width="494" height="40" fill="url(#droneRetreatT5)"/>
    <rect x="0" y="36" width="494" height="6" fill="#080404"/>
    <g opacity="0.85">
      <rect x="80" y="0" width="22" height="60" fill="url(#droneRetreatT5)"/>
      <rect x="380" y="0" width="22" height="60" fill="url(#droneRetreatT5)"/>
    </g>
  </g>

  <g>
    <path d="M 200 40 L 280 30 L 360 50 L 380 80 L 340 90 L 300 80 L 260 90 L 220 80 Z" fill="url(#droneShellT5)" opacity="0.85"/>
    <path d="M 280 40 L 240 70 Q 220 80 220 96 L 200 110 L 180 130" stroke="url(#droneShellT5)" stroke-width="9" fill="none" opacity="0.85"/>
    <path d="M 320 40 L 360 70 Q 380 80 380 96 L 400 110 L 420 130" stroke="url(#droneShellT5)" stroke-width="9" fill="none" opacity="0.85"/>
    <path d="M 280 40 L 320 56 L 320 80" stroke="url(#droneShellT5)" stroke-width="6" fill="none" opacity="0.92"/>

    <g opacity="0.55">
      <path d="M 200 40 L 280 30" stroke="url(#iridescenceFlickerT5)" stroke-width="0.85" fill="none"/>
      <path d="M 280 30 L 360 50" stroke="url(#iridescenceFlickerT5)" stroke-width="0.85" fill="none"/>
    </g>

    <g>
      <ellipse cx="300" cy="80" rx="22" ry="11" fill="#1a0810"/>
      <path d="M 280 76 L 320 76 L 318 84 L 282 84 Z" fill="#0a0604" opacity="0.85"/>

      <g opacity="0.92">
        <path d="M 290 76 L 286 70 L 282 78 Z" fill="#3a2868"/>
        <path d="M 296 80 L 290 74 L 284 82 Z" fill="#5a3098"/>
        <path d="M 304 76 L 308 68 L 314 78 Z" fill="#3a2868"/>
        <path d="M 310 82 L 316 72 L 320 80 Z" fill="#5a3098"/>
        <path d="M 270 86 L 264 80 L 260 88 Z" fill="#3a2868"/>
        <path d="M 330 86 L 336 80 L 340 88 Z" fill="#5a3098"/>
      </g>
    </g>
  </g>
  <g opacity="0.85" filter="url(#bloomT5)">
    <ellipse cx="300" cy="80" rx="60" ry="22" fill="#fff088" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#strongGlowT5)">
    <ellipse cx="300" cy="80" rx="80" ry="40" fill="#d83838" opacity="0.42"/>
  </g>
  <g opacity="0.42" filter="url(#megaGlowT5)">
    <ellipse cx="300" cy="80" rx="120" ry="80" fill="#3a2868" opacity="0.32"/>
  </g>

  <g>
    <rect x="40" y="160" width="60" height="120" fill="url(#brickT5)"/>
    <rect x="40" y="160" width="6" height="120" fill="#080404"/>
    <g opacity="0.62" stroke="#080404" stroke-width="0.4">
      <line x1="40" y1="190" x2="100" y2="190"/>
      <line x1="40" y1="220" x2="100" y2="220"/>
      <line x1="40" y1="250" x2="100" y2="250"/>
      <line x1="70" y1="160" x2="70" y2="280"/>
