<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 12 Page 3 Panel 3 — Thresh's POV at the basement, "I can see the device. It's... far."</title>
  <desc>Wide POV shot from bottom of Victorian industrial basement stairwell, looking into cavernous dark space filled with steam pipes, brick columns, and iron supports — forest of industrial infrastructure stretching into darkness. At far end, barely visible, Titan device mounted on pipe junction, pulsing sickly amber-black — only significant light source in the darkness. Compact rifle barrel visible at bottom edge — viewer's weapon, ruby-crimson holographic edge-lighting pulsing unevenly. Thin grey light from iron grate far above cuts weak wedge into the dark.</desc>
  <defs>
    <linearGradient id="bgK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.4" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="grateLightK3" cx="0.5" cy="0.05" r="0.32">
      <stop offset="0" stop-color="#7a8898" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a4858" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titanFarPulseK3" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#a85020" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipeFarK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="pipeMidK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="pipeNearK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.5" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="brickColumnK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="weaponK3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="crimsonStutterK3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#5a2520" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="#d83838" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomK3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowK3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowK3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowK3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="wrongnessK3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgK3)"/>
  <rect width="742" height="240" fill="url(#grateLightK3)"/>

  <g opacity="0.42">
    <line x1="320" y1="0" x2="280" y2="40" stroke="#7a8898" stroke-width="0.7"/>
    <line x1="340" y1="0" x2="320" y2="40" stroke="#7a8898" stroke-width="0.7"/>
    <line x1="380" y1="0" x2="380" y2="40" stroke="#7a8898" stroke-width="0.7"/>
    <line x1="400" y1="0" x2="420" y2="40" stroke="#7a8898" stroke-width="0.7"/>
    <line x1="420" y1="0" x2="460" y2="40" stroke="#7a8898" stroke-width="0.7"/>
  </g>

  <g>
    <rect x="0" y="40" width="60" height="200" fill="url(#pipeNearK3)"/>
    <rect x="682" y="40" width="60" height="200" fill="url(#pipeNearK3)"/>
    <line x1="60" y1="40" x2="60" y2="240" stroke="#080404" stroke-width="0.85"/>
    <line x1="682" y1="40" x2="682" y2="240" stroke="#080404" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.55">
      <line x1="0" y1="80" x2="60" y2="80"/>
      <line x1="0" y1="120" x2="60" y2="120"/>
      <line x1="0" y1="160" x2="60" y2="160"/>
      <line x1="0" y1="200" x2="60" y2="200"/>
      <line x1="682" y1="80" x2="742" y2="80"/>
      <line x1="682" y1="120" x2="742" y2="120"/>
      <line x1="682" y1="160" x2="742" y2="160"/>
      <line x1="682" y1="200" x2="742" y2="200"/>
    </g>
  </g>

  <g>
    <rect x="80" y="60" width="40" height="180" fill="url(#brickColumnK3)"/>
    <rect x="622" y="60" width="40" height="180" fill="url(#brickColumnK3)"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.4">
      <line x1="80" y1="100" x2="120" y2="100"/>
      <line x1="80" y1="140" x2="120" y2="140"/>
      <line x1="80" y1="180" x2="120" y2="180"/>
      <line x1="100" y1="60" x2="100" y2="240"/>
      <line x1="622" y1="100" x2="662" y2="100"/>
      <line x1="622" y1="140" x2="662" y2="140"/>
      <line x1="622" y1="180" x2="662" y2="180"/>
      <line x1="642" y1="60" x2="642" y2="240"/>
    </g>
  </g>

  <g>
    <rect x="160" y="120" width="22" height="120" fill="url(#pipeMidK3)"/>
    <ellipse cx="171" cy="120" rx="11" ry="3" fill="#5a4838"/>
    <rect x="560" y="120" width="22" height="120" fill="url(#pipeMidK3)"/>
    <ellipse cx="571" cy="120" rx="11" ry="3" fill="#5a4838"/>
  </g>

  <g>
    <rect x="240" y="140" width="14" height="100" fill="url(#pipeFarK3)"/>
    <rect x="488" y="140" width="14" height="100" fill="url(#pipeFarK3)"/>
    <rect x="320" y="160" width="11" height="80" fill="url(#pipeFarK3)"/>
    <rect x="411" y="160" width="11" height="80" fill="url(#pipeFarK3)"/>

    <line x1="200" y1="180" x2="540" y2="180" stroke="url(#pipeFarK3)" stroke-width="6"/>
    <line x1="180" y1="220" x2="560" y2="220" stroke="url(#pipeFarK3)" stroke-width="9"/>
  </g>

  <g>
    <ellipse cx="371" cy="130" rx="22" ry="14" fill="#1a0810"/>
    <ellipse cx="371" cy="130" rx="14" ry="9" fill="url(#titanFarPulseK3)"/>
    <circle cx="371" cy="130" r="3" fill="#a85020" opacity="0.95"/>
    <line x1="363" y1="126" x2="379" y2="134" stroke="#3a1810" stroke-width="0.55"/>
    <line x1="379" y1="126" x2="363" y2="134" stroke="#3a1810" stroke-width="0.55"/>
  </g>
  <g opacity="0.85" filter="url(#wrongnessK3)">
    <ellipse cx="371" cy="130" rx="32" ry="22" fill="#a85020" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#wrongnessK3)">
    <ellipse cx="371" cy="130" rx="60" ry="40" fill="#3a1810" opacity="0.32"/>
  </g>

  <g>
    <rect x="40" y="200" width="220" height="40" rx="6" fill="url(#weaponK3)"/>
    <rect x="40" y="200" width="220" height="6" fill="#5a3038" opacity="0.7"/>
    <rect x="40" y="234" width="220" height="6" fill="#1a0810" opacity="0.7"/>

    <rect x="80" y="208" width="40" height="14" rx="2" fill="#2a1018"/>
    <rect x="160" y="208" width="60" height="14" rx="2" fill="#2a1018"/>

    <line x1="40" y1="220" x2="260" y2="220" stroke="url(#crimsonStutterK3)" stroke-width="2" opacity="0.85"/>
    <line x1="40" y1="226" x2="260" y2="226" stroke="url(#crimsonStutterK3)" stroke-width="1.4" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowK3)">
    <rect x="40" y="216" width="220" height="14" fill="#d83838" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowK3)">
    <rect x="40" y="200" width="220" height="40" fill="#8a2520" opacity="0.42"/>
  </g>

  <g opacity="0.42" stroke="#7a8898" stroke-width="0.55" stroke-dasharray="2,3">
    <line x1="320" y1="0" x2="320" y2="60"/>
    <line x1="380" y1="0" x2="380" y2="50"/>
    <line x1="420" y1="0" x2="420" y2="60"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="371" cy="220" rx="280" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="240" height="22" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="110" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#d83838" font-weight="700">THRESH (tight): "I can see the device."</text>
    <text x="110" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#d83838" font-style="italic" font-weight="700">"It's... far."</text>
  </g>
  <g transform="translate(280,12)">
    <rect x="-6" y="0" width="240" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="110" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE: "Take your time. You have the window."</text>
  </g>
</svg>
