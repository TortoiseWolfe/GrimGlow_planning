<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 280" width="247" height="280">
  <title>Issue 12 Page 7 Panel 2 — Sable's decision, "Theodore. Are you near Bartholomew Lane?"</title>
  <desc>Close-up woman's face making a decision that costs her. Dark brown skin, sharp features, military-cropped silver-white hair, pewter-dark degraded silver suit at collar. Expression is command discipline over personal weight — face of someone sending a child into danger because there is no other option. Blue-white holographic light from below. Morning light from behind. The cost of command.</desc>
  <defs>
    <linearGradient id="bgO2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.4" stop-color="#7a8898"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="dawnBackO2" cx="0.85" cy="0.1" r="0.42">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="holoBelowO2" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairSilverO2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset="0.5" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="faceSableO2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.4" stop-color="#5a4838"/>
      <stop offset="0.85" stop-color="#5a78a8"/>
      <stop offset="1" stop-color="#3a4858"/>
    </linearGradient>
    <radialGradient id="eyeWeightO2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a87858" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a87858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitCollarO2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <filter id="bloomO2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowO2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowO2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="247" height="280" fill="url(#bgO2)"/>
  <rect width="247" height="280" fill="url(#dawnBackO2)"/>
  <rect width="247" height="280" fill="url(#holoBelowO2)"/>

  <g>
    <ellipse cx="123" cy="160" rx="120" ry="160" fill="url(#faceSableO2)"/>

    <path d="M 30 50 Q 70 14 123 14 Q 176 14 216 50 Q 220 80 214 90 L 204 84 Q 180 50 150 44 Q 123 38 96 44 Q 66 50 42 84 L 32 90 Q 26 80 30 50 Z" fill="url(#hairSilverO2)"/>
    <g opacity="0.7" stroke="#7a7a7a" stroke-width="0.55">
      <line x1="60" y1="38" x2="60" y2="60"/>
      <line x1="80" y1="32" x2="80" y2="60"/>
      <line x1="100" y1="28" x2="100" y2="60"/>
      <line x1="123" y1="26" x2="123" y2="60"/>
      <line x1="146" y1="28" x2="146" y2="60"/>
      <line x1="166" y1="32" x2="166" y2="60"/>
      <line x1="186" y1="38" x2="186" y2="60"/>
    </g>

    <ellipse cx="86" cy="130" rx="14" ry="14" fill="#0a0604"/>
    <circle cx="86" cy="130" r="9" fill="#3a2010"/>
    <circle cx="88" cy="128" r="3" fill="url(#eyeWeightO2)"/>
    <circle cx="86" cy="130" r="2.4" fill="#080404"/>
    <circle cx="87" cy="129" r="0.7" fill="#a8c0e0"/>

    <ellipse cx="160" cy="130" rx="14" ry="14" fill="#0a0604"/>
    <circle cx="160" cy="130" r="9" fill="#3a2010"/>
    <circle cx="162" cy="128" r="3" fill="url(#eyeWeightO2)"/>
    <circle cx="160" cy="130" r="2.4" fill="#080404"/>
    <circle cx="161" cy="129" r="0.7" fill="#a8c0e0"/>

    <path d="M 60 110 Q 86 100 110 110" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 136 110 Q 160 100 186 110" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="100" cy="156" rx="9" ry="3" fill="#1a0a04" opacity="0.62"/>
    <ellipse cx="146" cy="156" rx="9" ry="3" fill="#1a0a04" opacity="0.62"/>

    <path d="M 100 200 L 146 200" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 100 204 L 146 204" stroke="#3a2410" stroke-width="0.85" opacity="0.55"/>
  </g>

  <g>
    <rect x="0" y="240" width="247" height="40" fill="url(#suitCollarO2)"/>
    <line x1="0" y1="246" x2="247" y2="246" stroke="#1a2030" stroke-width="0.85"/>
    <path d="M 80 250 L 100 248 L 96 264 L 76 266 Z" fill="#1a1810" opacity="0.85"/>
    <path d="M 160 250 L 180 248 L 176 264 L 156 266 Z" fill="#1a1810" opacity="0.85"/>
    <line x1="123" y1="246" x2="123" y2="280" stroke="#1a2030" stroke-width="0.55" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowO2)">
    <ellipse cx="123" cy="240" rx="100" ry="22" fill="#a8c0e0" opacity="0.42"/>
  </g>
  <g opacity="0.85" filter="url(#bloomO2)">
    <ellipse cx="123" cy="80" rx="120" ry="22" fill="#fff8d8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="270" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="36" rx="3" fill="#1a1828" opacity="0.95" stroke="#a8c0e0" stroke-width="1.2"/>
    <text x="86" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-weight="700">SABLE: "Theodore. Are you near</text>
    <text x="86" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#a8c0e0" font-style="italic" font-weight="700">Bartholomew Lane?"</text>
    <text x="86" y="31" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#3a2410" font-style="italic" font-weight="700">"We need your hands."</text>
  </g>
</svg>
