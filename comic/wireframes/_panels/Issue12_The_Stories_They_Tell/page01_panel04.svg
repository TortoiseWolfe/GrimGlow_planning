    <path d="M 40 140 L 207 140 L 207 160 L 40 160 Z" fill="url(#stoneI4)" opacity="0.7"/>
    <path d="M 40 180 L 207 180 L 207 200 L 40 200 Z" fill="url(#stoneI4)" opacity="0.55"/>
    <path d="M 40 220 L 207 220 L 207 240 L 40 240 Z" fill="#040206" opacity="0.85"/>

    <line x1="40" y1="60" x2="40" y2="240" stroke="#080404" stroke-width="0.85"/>
    <line x1="207" y1="60" x2="207" y2="240" stroke="#080404" stroke-width="0.85"/>

    <line x1="40" y1="80" x2="207" y2="80" stroke="#040206" stroke-width="0.55"/>
    <line x1="40" y1="120" x2="207" y2="120" stroke="#040206" stroke-width="0.55"/>
    <line x1="40" y1="160" x2="207" y2="160" stroke="#040206" stroke-width="0.55"/>
    <line x1="40" y1="200" x2="207" y2="200" stroke="#040206" stroke-width="0.55"/>
  </g>
  <g opacity="0.55" filter="url(#bloomI4)">
    <path d="M 40 0 L 207 0 L 207 80 L 40 80 Z" fill="#fff8d8" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="124" cy="100" rx="22" ry="32" fill="url(#suitThreshI4)"/>
    <path d="M 102 76 L 146 76 L 148 124 L 100 124 Z" fill="url(#suitThreshI4)"/>

    <path d="M 100 80 L 110 76 L 108 88 L 100 92 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 138 92 L 146 90 L 145 100 L 137 102 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 124 108 L 132 108 L 130 116 L 122 116 Z" fill="#1a0810" opacity="0.85"/>

    <line x1="102" y1="84" x2="148" y2="86" stroke="url(#crimsonStutterI4)" stroke-width="1.4" opacity="0.85"/>
    <line x1="100" y1="124" x2="148" y2="124" stroke="url(#crimsonStutterI4)" stroke-width="1.4" opacity="0.85"/>
    <line x1="122" y1="76" x2="124" y2="124" stroke="url(#crimsonStutterI4)" stroke-width="0.7" opacity="0.62"/>

    <ellipse cx="124" cy="60" rx="14" ry="14" fill="url(#skinThreshI4)"/>
    <path d="M 110 50 Q 124 38 138 50 Q 140 56 138 60 L 110 60 Q 110 56 110 50 Z" fill="url(#hairBuzzI4)"/>
    <g opacity="0.55" stroke="#3a1808" stroke-width="0.4">
      <line x1="114" y1="48" x2="114" y2="58"/>
      <line x1="120" y1="46" x2="120" y2="58"/>
      <line x1="124" y1="44" x2="124" y2="58"/>
      <line x1="128" y1="46" x2="128" y2="58"/>
      <line x1="134" y1="48" x2="134" y2="58"/>
    </g>

    <circle cx="120" cy="62" r="0.85" fill="#0a0604"/>
    <circle cx="128" cy="62" r="0.85" fill="#0a0604"/>
    <path d="M 122 70 Q 124 71 126 70" stroke="#1a0a08" stroke-width="0.55" fill="none"/>

    <path d="M 100 124 Q 92 140 88 158" stroke="url(#suitThreshI4)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 148 124 Q 156 140 160 158" stroke="url(#suitThreshI4)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <rect x="86" y="124" width="14" height="6" rx="1" fill="url(#weaponI4)"/>
    <rect x="100" y="120" width="22" height="11" rx="1" fill="url(#weaponI4)"/>
    <rect x="122" y="124" width="6" height="6" rx="1" fill="url(#weaponI4)"/>
    <line x1="86" y1="125" x2="128" y2="125" stroke="url(#crimsonStutterI4)" stroke-width="0.7" opacity="0.85"/>

    <ellipse cx="84" cy="160" rx="6" ry="3" fill="#5a3018"/>
    <ellipse cx="164" cy="160" rx="6" ry="3" fill="#5a3018"/>

    <ellipse cx="84" cy="160" rx="3" ry="1.4" fill="#fff8d8" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowI4)">
    <line x1="100" y1="84" x2="148" y2="86" stroke="#d83838" stroke-width="3" opacity="0.55"/>
    <line x1="100" y1="124" x2="148" y2="124" stroke="#d83838" stroke-width="3" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowI4)">
    <ellipse cx="124" cy="100" rx="40" ry="40" fill="#8a2520" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="124" cy="220" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,12)">
    <rect x="-4" y="0" width="180" height="14" rx="3" fill="#1a1828" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="86" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#d83838" font-weight="700">THRESH: "Basement Charlie. It's dark."</text>
  </g>
