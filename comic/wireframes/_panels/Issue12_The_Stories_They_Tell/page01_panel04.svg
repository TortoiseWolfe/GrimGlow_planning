<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 240" width="247" height="240">
  <title>Issue 12 Page 1 Panel 4 — Thresh descending into stairwell, "Soldier, entering Basement Charlie. It's dark down here."</title>
  <desc>Medium shot slight high angle looking down. Tiny figure descends Victorian industrial basement stairwell, weapon drawn, moving through heavy shadows. Broad-shouldered powerfully muscular woman, athletic, pale skin, defined cheekbones, copper-red buzz cut. Ruby-crimson metallic suit at maximum degradation — armored plating dented, gouged, scratched. Crimson edge-lighting stutters and pulses unevenly. White-knuckle grip on rifle. Fear and purpose together. Grey dawn light cuts wedge into total darkness below.</desc>
  <defs>
    <linearGradient id="bgI4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6878"/>
      <stop offset="0.4" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnWedgeI4" cx="0.5" cy="0.05" r="0.42">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a87878" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stairWallI4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3848"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="stoneI4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#3a2838"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="suitThreshI4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2530"/>
      <stop offset="0.5" stop-color="#5a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="hairBuzzI4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="skinThreshI4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8b8"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="weaponI4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="crimsonStutterI4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5a2520" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#d83838" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomI4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowI4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowI4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="247" height="240" fill="url(#bgI4)"/>
  <rect width="247" height="240" fill="url(#dawnWedgeI4)"/>

  <g>
    <rect x="0" y="0" width="40" height="240" fill="url(#stairWallI4)"/>
    <rect x="207" y="0" width="40" height="240" fill="url(#stairWallI4)"/>
    <g opacity="0.55" stroke="#080404" stroke-width="0.55">
      <line x1="0" y1="40" x2="40" y2="40"/>
      <line x1="0" y1="80" x2="40" y2="80"/>
      <line x1="0" y1="120" x2="40" y2="120"/>
      <line x1="0" y1="160" x2="40" y2="160"/>
      <line x1="0" y1="200" x2="40" y2="200"/>
      <line x1="207" y1="40" x2="247" y2="40"/>
      <line x1="207" y1="80" x2="247" y2="80"/>
      <line x1="207" y1="120" x2="247" y2="120"/>
      <line x1="207" y1="160" x2="247" y2="160"/>
      <line x1="207" y1="200" x2="247" y2="200"/>
    </g>
  </g>

  <g>
