<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 380" width="244" height="380">
  <title>Issue 1 — Page 11 — Panel 5: Wren works ECU — focus while others look skyward</title>
  <desc>ECU 135mm Wren's face inside access panel of wrecked alien hull. Wiry East Asian, dark hair collapsed bun strands across forehead, copper suit dried dark fluid. Focused + grim — eyes moving across unseen interior wreckage cataloging failures, deep line between brows. Has not looked up to watch flight, working. Cool blue-white flicker from dying display strobes intermittently across features casting shifting angular shadows. Above her faintly through hull crack: emerald flicker from Jink's wing-pack reflected — small intrusion of color. WREN muttering: "Drive coupling... sheared clean. Housing fractured at three points. The containment ring..."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020208"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="p11p5displayFlicker" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#7ac8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p11p5skinCold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87850"/>
      <stop offset="100%" stop-color="#dceaff"/>
    </linearGradient>
    <radialGradient id="p11p5emeraldFlicker" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#a8f5c8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a5a30" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p11p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Dark background. -->
  <rect width="244" height="380" fill="url(#p11p5bg)"/>

  <!-- Hull plating around face (dark angular metal — she's inside the access panel). -->
  <g id="p11p5-hull-frame">
    <!-- Top-left torn hull edge. -->
    <path d="M0,0 L70,0 L60,40 L40,55 L0,40 Z" fill="#1a1a24" stroke="#080808" stroke-width="0.7"/>
    <!-- Top-right torn hull edge. -->
    <path d="M174,0 L244,0 L244,40 L204,55 L184,40 Z" fill="#1a1a24" stroke="#080808" stroke-width="0.7"/>
    <!-- Bottom-left. -->
    <path d="M0,340 L40,325 L60,340 L70,380 L0,380 Z" fill="#1a1a24" stroke="#080808" stroke-width="0.7"/>
    <!-- Bottom-right. -->
    <path d="M204,325 L244,340 L244,380 L174,380 L184,340 Z" fill="#1a1a24" stroke="#080808" stroke-width="0.7"/>
    <!-- Edge highlights. -->
    <line x1="0" y1="40" x2="40" y2="55" stroke="#3a3848" stroke-width="0.5" opacity="0.7"/>
    <line x1="244" y1="40" x2="204" y2="55" stroke="#3a3848" stroke-width="0.5" opacity="0.7"/>
  </g>

  <!-- HULL CRACK above (script-specific — emerald wing-light penetrates). -->
  <g id="p11p5-hull-crack">
    <path d="M100,0 L106,18 L100,28 L114,40 L106,55 L122,52 L130,38 L122,28 L138,15 L132,0" stroke="#080404" stroke-width="0.9" fill="none"/>
    <!-- Emerald light leaking through crack. -->
    <ellipse cx="120" cy="38" rx="30" ry="22" fill="url(#p11p5emeraldFlicker)" filter="url(#p11p5strongBloom)" opacity="0.85"/>
    <!-- Bright light center of crack. -->
    <line x1="100" y1="0" x2="106" y2="18" stroke="#a8f5c8" stroke-width="0.7" filter="url(#p11p5bloom)" opacity="0.95"/>
    <line x1="106" y1="18" x2="100" y2="28" stroke="#a8f5c8" stroke-width="0.7" filter="url(#p11p5bloom)" opacity="0.95"/>
    <line x1="100" y1="28" x2="114" y2="40" stroke="#a8f5c8" stroke-width="0.7" filter="url(#p11p5bloom)" opacity="0.95"/>
    <line x1="114" y1="40" x2="106" y2="55" stroke="#a8f5c8" stroke-width="0.7" filter="url(#p11p5bloom)" opacity="0.95"/>
    <line x1="122" y1="52" x2="130" y2="38" stroke="#a8f5c8" stroke-width="0.6" filter="url(#p11p5bloom)" opacity="0.95"/>
    <line x1="130" y1="38" x2="122" y2="28" stroke="#a8f5c8" stroke-width="0.6" filter="url(#p11p5bloom)" opacity="0.95"/>
    <line x1="122" y1="28" x2="138" y2="15" stroke="#a8f5c8" stroke-width="0.7" filter="url(#p11p5bloom)" opacity="0.95"/>
    <line x1="138" y1="15" x2="132" y2="0" stroke="#a8f5c8" stroke-width="0.7" filter="url(#p11p5bloom)" opacity="0.95"/>
  </g>

  <!-- Strong cool blue-white STROBE from below — dying display flickering. -->
  <ellipse cx="122" cy="380" rx="180" ry="240" fill="url(#p11p5displayFlicker)" filter="url(#p11p5strongBloom)"/>
  <ellipse cx="122" cy="350" rx="80" ry="120" fill="#bfe4ff" filter="url(#p11p5bloom)" opacity="0.4"/>
  <!-- Strobe artifacts. -->
  <g fill="#ffffff" filter="url(#p11p5bloom)">
    <circle cx="100" cy="320" r="0.7"/>
    <circle cx="148" cy="335" r="0.6"/>
    <circle cx="80" cy="350" r="0.5"/>
  </g>
  <!-- Faint scrolling data strip at very bottom. -->
  <g stroke="#bfe4ff" stroke-width="0.4" opacity="0.65" fill="none">
    <line x1="40" y1="365" x2="200" y2="365"/>
    <line x1="40" y1="372" x2="200" y2="372"/>
  </g>

  <!-- WREN'S FACE — ECU center fills frame. -->
  <g id="p11p5-wren-face" transform="translate(122, 195)">

    <!-- Head shape. -->
    <ellipse cx="0" cy="0" rx="80" ry="105" fill="url(#p11p5skinCold)"/>

    <!-- Hair (dark, collapsed bun, strands across forehead). -->
    <path d="M-65,-95 Q-30,-115 0,-118 Q30,-115 65,-95 L65,-65 L-65,-65 Z" fill="#0a0408"/>
    <!-- Bun shapes (visible behind/above). -->
    <ellipse cx="-15" cy="-115" rx="30" ry="14" fill="#0a0408"/>
    <ellipse cx="15" cy="-122" rx="22" ry="11" fill="#0a0408"/>
    <ellipse cx="-5" cy="-110" rx="20" ry="8" fill="none" stroke="#3a1810" stroke-width="0.8" opacity="0.85"/>
    <!-- STRANDS ACROSS FOREHEAD (script-specific). -->
    <path d="M-50,-72 Q-32,-55 -38,-30" fill="none" stroke="#0a0408" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-15,-78 Q-5,-55 -10,-30" fill="none" stroke="#0a0408" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22,-78 Q32,-55 28,-30" fill="none" stroke="#0a0408" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M48,-72 Q56,-55 50,-32" fill="none" stroke="#0a0408" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Smaller wisps. -->
    <path d="M-32,-70 Q-25,-55 -28,-32" fill="none" stroke="#0a0408" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M0,-72 Q5,-55 2,-32" fill="none" stroke="#0a0408" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M35,-70 Q40,-55 38,-32" fill="none" stroke="#0a0408" stroke-width="1.4" stroke-linecap="round"/>

    <!-- BROW — DEEP LINE BETWEEN BROWS (the assessment-is-worse-than-expected line). -->
    <line x1="-3" y1="-25" x2="-3" y2="-5" stroke="#1a0808" stroke-width="2.5"/>
    <line x1="3" y1="-25" x2="3" y2="-5" stroke="#1a0808" stroke-width="2.5"/>
    <!-- Brow furrows. -->
    <path d="M-40,-25 Q-25,-32 -10,-25" stroke="#1a0808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M10,-25 Q25,-32 40,-25" stroke="#1a0808" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- EYES — narrowed, NARROW almond shape, focused on unseen wreckage below. -->
    <path d="M-32,-10 Q-22,-15 -12,-10 Q-22,-5 -32,-10 Z" fill="#1a0808"/>
    <path d="M12,-10 Q22,-15 32,-10 Q22,-5 12,-10 Z" fill="#1a0808"/>
    <ellipse cx="-22" cy="-10" rx="2" ry="2" fill="#080404"/>
    <ellipse cx="22" cy="-10" rx="2" ry="2" fill="#080404"/>
    <!-- COOL CATCH-LIGHT (blue-white from display below). -->
    <circle cx="-22" cy="-8" r="1" fill="#dceaff"/>
    <circle cx="22" cy="-8" r="1" fill="#dceaff"/>
    <!-- Eyelashes. -->
    <path d="M-34,-15 Q-22,-19 -10,-15" stroke="#1a0808" stroke-width="1.4" fill="none"/>
    <path d="M10,-15 Q22,-19 34,-15" stroke="#1a0808" stroke-width="1.4" fill="none"/>

    <!-- CHEEKBONES (cool catches from below). -->
    <ellipse cx="-50" cy="20" rx="13" ry="7" fill="#a87850" opacity="0.55"/>
    <ellipse cx="50" cy="20" rx="13" ry="7" fill="#a87850" opacity="0.55"/>
    <!-- Cool catches. -->
    <ellipse cx="-50" cy="22" rx="7" ry="3" fill="#dceaff" opacity="0.4"/>
    <ellipse cx="50" cy="22" rx="7" ry="3" fill="#dceaff" opacity="0.4"/>

    <!-- Nose. -->
    <path d="M0,-5 L-5,30 L0,38 L5,30 Z" fill="#5a3818" opacity="0.55"/>
    <ellipse cx="-3" cy="35" rx="2" ry="1.5" fill="#1a0808"/>
    <ellipse cx="3" cy="35" rx="2" ry="1.5" fill="#1a0808"/>

    <!-- LIPS — slightly parted (muttering) but pressed thin. -->
    <path d="M-18,55 Q-3,52 0,53 Q3,52 18,55" stroke="#3a1808" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="-15" y1="56" x2="15" y2="56" stroke="#1a0808" stroke-width="0.6"/>

    <!-- Jaw set. -->
    <path d="M-78,68 Q-40,98 0,103 Q40,98 78,68" fill="none" stroke="#1a0808" stroke-width="1" opacity="0.7"/>

    <!-- COOL UPLIGHT WASH on lower face. -->
    <path d="M-78,68 Q-40,98 0,103 Q40,98 78,68 L50,30 L0,45 L-50,30 Z" fill="#bfe4ff" opacity="0.22"/>
    <!-- Cool rim under jaw. -->
    <path d="M-70,75 Q-35,98 0,100 Q35,98 70,75" fill="none" stroke="#dceaff" stroke-width="1.6" opacity="0.65" filter="url(#p11p5bloom)"/>
    <!-- Cool catch on tip of nose. -->
    <ellipse cx="0" cy="38" rx="3" ry="1.5" fill="#dceaff" opacity="0.45"/>

    <!-- EMERALD INTRUSION on top-left (faint, the wing-light through crack reflected). -->
    <ellipse cx="-30" cy="-95" rx="20" ry="10" fill="#a8f5c8" opacity="0.18"/>
    <ellipse cx="-30" cy="-90" rx="14" ry="6" fill="#5af5a0" opacity="0.25"/>
  </g>

  <!-- WREN muttering balloon (top — internal monologue, italic). -->
  <g id="p11p5-dlg-wren">
    <rect x="14" y="14" width="216" height="98" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" font-style="italic" fill="#1a1a1a">Drive coupling...</text>
    <text x="24" y="68" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" font-style="italic" fill="#1a1a1a">sheared clean. Housing</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" font-style="italic" fill="#1a1a1a">fractured at three points.</text>
    <text x="24" y="100" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#1a1a1a">Containment ring...</text>
    <path d="M150,112 L168,112 L162,140 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="150" y1="112" x2="168" y2="112" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p11p5-meta">
    <text x="236" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">5</text>
    <text x="240" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">WREN WORKS</text>
  </g>
</svg>
