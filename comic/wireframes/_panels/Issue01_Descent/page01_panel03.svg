<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 1 — Page 1 — Panel 3: Wren at engineering console</title>
  <desc>Medium shot, slight high angle looking down at workstation. Wren hunched over engineering console, hands inside copper-gold holographic diagnostic display manipulating floating geometric shapes. Focused, slightly bored — rote work, muscle memory. Warm copper-gold from holographic interface mixing with ambient blue-white overhead. WREN: "Drive nominal. Ninety-seven percent field coherence. We're clean."</desc>

  <defs>
    <!-- Shared balloon drop shadow (dialogue-style.md). -->
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p3suitMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6e3dc"/>
      <stop offset="20%" stop-color="#c2bfb6"/>
      <stop offset="50%" stop-color="#9a968c"/>
      <stop offset="80%" stop-color="#76726a"/>
      <stop offset="100%" stop-color="#58544c"/>
    </linearGradient>
    <linearGradient id="p3suitHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="p3suitSeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c261c"/>
      <stop offset="100%" stop-color="#15110b"/>
    </linearGradient>
    <linearGradient id="p3copperTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a065"/>
      <stop offset="50%" stop-color="#c87a35"/>
      <stop offset="100%" stop-color="#8c4a18"/>
    </linearGradient>
    <linearGradient id="p3skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c39e"/>
      <stop offset="50%" stop-color="#d4a87e"/>
      <stop offset="100%" stop-color="#a87a52"/>
    </linearGradient>
    <linearGradient id="p3hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="60%" stop-color="#0e0a08"/>
      <stop offset="100%" stop-color="#050302"/>
    </linearGradient>
    <radialGradient id="p3oilStain" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a0e06" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a0e06" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="p3hologramCore" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f5a850" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c8761e" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="p3hologramGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c8761e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8c4a18" stop-opacity="0"/>
    </radialGradient>

    <!-- Bridge ambient — same blue-white overhead, but warmer key from the console hologram. -->
    <radialGradient id="p3overheadKey" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#dce4f0" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#7c92ae" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a2238" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Warm copper key from below — the console's holographic light hitting Wren from underneath. -->
    <radialGradient id="p3consoleKey" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#a86028" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a0e06" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="p3holoDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86028" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c8761e" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="p3bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="p3softBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="p3dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <symbol id="p3copperNode" viewBox="-10 -10 20 20" overflow="visible">
      <circle r="9" fill="url(#p3hologramGlow)" filter="url(#p3bloom)"/>
      <circle r="6.5" fill="url(#p3hologramCore)"/>
      <circle r="2.8" fill="#fff5d8" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- ========================================================== -->
  <!-- LAYER: bridge background (slight high angle reveals more floor) -->
  <!-- ========================================================== -->
  <g id="p3-bridge-bg">
    <rect width="241" height="364" fill="#0a0e18"/>
    <rect width="241" height="364" fill="url(#p3overheadKey)" opacity="0.5"/>

    <!-- Ceiling panel light (smaller because high angle pushes ceiling further). -->
    <rect x="0" y="0" width="241" height="10" fill="#1a2438"/>
    <rect x="40" y="2" width="50" height="4" fill="#dce4f0" filter="url(#p3softBloom)" opacity="0.85"/>
    <rect x="150" y="2" width="50" height="4" fill="#dce4f0" filter="url(#p3softBloom)" opacity="0.85"/>

    <!-- Wall structural lines — angled down (high angle perspective). -->
    <line x1="0" y1="10" x2="241" y2="10" stroke="#2a3450" stroke-width="0.6" opacity="0.7"/>
    <line x1="0" y1="60" x2="241" y2="55" stroke="#2a3450" stroke-width="0.5" opacity="0.55"/>

    <!-- Console workstation — large foreground, angled down view. -->
    <path d="M0,260 L241,260 L241,364 L0,364 Z" fill="#15192a"/>
    <line x1="0" y1="260" x2="241" y2="260" stroke="#2a3450" stroke-width="0.8" opacity="0.85"/>
    <!-- Console surface highlights with copper undertone from holo. -->
    <rect x="0" y="260" width="241" height="104" fill="url(#p3consoleKey)" opacity="0.85"/>
    <!-- Plate seams on console. -->
    <line x1="60" y1="260" x2="60" y2="364" stroke="#2a261c" stroke-width="0.5" opacity="0.55"/>
    <line x1="180" y1="260" x2="180" y2="364" stroke="#2a261c" stroke-width="0.5" opacity="0.55"/>
    <line x1="0" y1="320" x2="241" y2="320" stroke="#2a261c" stroke-width="0.5" opacity="0.55"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: console hologram — copper-gold floating geometric    -->
  <!-- shapes that Wren is manipulating with her hands.            -->
  <!-- ========================================================== -->
  <g id="p3-holo-console" transform="translate(20, 248)">
    <!-- Outer copper bloom on console surface. -->
    <ellipse cx="100" cy="20" rx="115" ry="38" fill="url(#p3hologramGlow)" filter="url(#p3bloom)" opacity="0.95"/>

    <!-- Floating geometric shapes — diagnostic readouts mid-manipulation. -->
    <g id="p3-holo-shapes">
      <!-- Hexagonal field-coherence lattice (large central). -->
      <polygon points="100,0 122,12 122,36 100,48 78,36 78,12" fill="url(#p3holoDisplay)" stroke="#fff5d8" stroke-width="0.7" opacity="0.95"/>
      <polygon points="100,8 116,16 116,32 100,40 84,32 84,16" fill="none" stroke="#fff5d8" stroke-width="0.5" opacity="0.7"/>
      <line x1="100" y1="0" x2="100" y2="48" stroke="#fff5d8" stroke-width="0.5" opacity="0.6"/>
      <line x1="78" y1="12" x2="122" y2="36" stroke="#fff5d8" stroke-width="0.5" opacity="0.4"/>
      <line x1="78" y1="36" x2="122" y2="12" stroke="#fff5d8" stroke-width="0.5" opacity="0.4"/>

      <!-- Side cube (smaller, left). -->
      <polygon points="40,12 56,8 56,28 40,32 30,26 30,18" fill="url(#p3holoDisplay)" stroke="#fff5d8" stroke-width="0.6" opacity="0.85"/>
      <line x1="40" y1="12" x2="40" y2="32" stroke="#fff5d8" stroke-width="0.5" opacity="0.6"/>
      <line x1="56" y1="8" x2="56" y2="28" stroke="#fff5d8" stroke-width="0.5" opacity="0.6"/>

      <!-- Side cube (smaller, right). -->
      <polygon points="160,12 176,8 176,28 160,32 150,26 150,18" fill="url(#p3holoDisplay)" stroke="#fff5d8" stroke-width="0.6" opacity="0.85"/>
      <line x1="160" y1="12" x2="160" y2="32" stroke="#fff5d8" stroke-width="0.5" opacity="0.6"/>
      <line x1="176" y1="8" x2="176" y2="28" stroke="#fff5d8" stroke-width="0.5" opacity="0.6"/>

      <!-- Floating data ring above. -->
      <ellipse cx="100" cy="-8" rx="40" ry="6" fill="none" stroke="#fff5d8" stroke-width="0.7" opacity="0.85"/>
      <ellipse cx="100" cy="-8" rx="40" ry="6" fill="url(#p3hologramCore)" opacity="0.25"/>

      <!-- Tick marks on ring suggesting rotation/scrolling. -->
      <line x1="62" y1="-8" x2="60" y2="-8" stroke="#fff5d8" stroke-width="0.6"/>
      <line x1="80" y1="-12" x2="80" y2="-13" stroke="#fff5d8" stroke-width="0.5"/>
      <line x1="100" y1="-14" x2="100" y2="-16" stroke="#fff5d8" stroke-width="0.6"/>
      <line x1="120" y1="-12" x2="120" y2="-13" stroke="#fff5d8" stroke-width="0.5"/>
      <line x1="140" y1="-8" x2="142" y2="-8" stroke="#fff5d8" stroke-width="0.6"/>

      <!-- Numeric/glyph blocks across surface. -->
      <g stroke="#fff5d8" stroke-width="0.5" fill="none" opacity="0.75">
        <rect x="10" y="50" width="14" height="6"/>
        <rect x="28" y="50" width="22" height="6"/>
        <rect x="56" y="50" width="14" height="6"/>
        <rect x="74" y="50" width="20" height="6"/>
        <rect x="98" y="50" width="14" height="6"/>
        <rect x="116" y="50" width="22" height="6"/>
        <rect x="142" y="50" width="14" height="6"/>
        <rect x="160" y="50" width="22" height="6"/>
        <rect x="186" y="50" width="14" height="6"/>
      </g>
      <!-- Highlighted "97%" coherence readout. -->
      <rect x="80" y="60" width="40" height="10" fill="url(#p3hologramCore)" opacity="0.7"/>
      <rect x="80" y="60" width="40" height="10" fill="none" stroke="#fff5d8" stroke-width="0.7"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: Wren — high-angle MCU, hunched over console          -->
  <!-- Her hands are inside the holographic field above.           -->
  <!-- ========================================================== -->
  <g id="p3-wren" filter="url(#p3dropShadow)">

    <!-- Torso — hunched forward, slight angle. -->
    <g id="p3-wren-torso">
      <path d="M50,180 Q40,220 60,280 Q70,300 90,302 L160,302 Q180,300 190,280 Q210,220 200,180 Q190,170 124,170 Q60,170 50,180 Z" fill="url(#p3suitMetal)"/>
      <path d="M50,180 Q40,220 60,280 Q70,300 90,302 L160,302 Q180,300 190,280 Q210,220 200,180 Q190,170 124,170 Q60,170 50,180 Z" fill="url(#p3suitHighlight)"/>

      <!-- Sternum copper accent strip (per Wren template). -->
      <line x1="125" y1="172" x2="125" y2="298" stroke="url(#p3copperTrim)" stroke-width="2.4" opacity="0.85"/>

      <!-- Pectoral plate divisions. -->
      <path d="M70,194 Q76,224 80,250 L74,250 Q70,224 70,194 Z" fill="#2a261c" opacity="0.45"/>
      <path d="M180,194 Q174,224 170,250 L176,250 Q180,224 180,194 Z" fill="#2a261c" opacity="0.45"/>

      <!-- Plate edge copper trim around collar. -->
      <path d="M68,182 Q125,174 182,182" fill="none" stroke="url(#p3copperTrim)" stroke-width="1.4" opacity="0.85"/>

      <!-- Abdominal seams. -->
      <line x1="70" y1="258" x2="180" y2="258" stroke="#2a261c" stroke-width="0.7" opacity="0.6"/>
      <line x1="72" y1="276" x2="178" y2="276" stroke="#2a261c" stroke-width="0.7" opacity="0.6"/>

      <!-- Chest accent (large copper). -->
      <use href="#p3copperNode" x="106" y="200" width="38" height="38"/>
      <!-- Shoulder accents. -->
      <use href="#p3copperNode" x="50" y="180" width="26" height="26"/>
      <use href="#p3copperNode" x="174" y="180" width="26" height="26"/>

      <!-- Warm copper bottom glow on suit (under-lighting from console). -->
      <path d="M60,260 Q90,300 124,302 Q160,300 190,260 L196,300 L54,300 Z" fill="#f5a850" opacity="0.32"/>
    </g>

    <!-- Arms reaching forward into the console hologram (both hands manipulating shapes). -->
    <g id="p3-wren-arms">
      <!-- Left arm extending forward and down to hologram. -->
      <path d="M30,180 Q14,220 22,260 L52,268 Q60,224 60,182 Z" fill="url(#p3suitMetal)"/>
      <path d="M30,180 Q14,220 22,260 L52,268 Q60,224 60,182 Z" fill="url(#p3suitHighlight)"/>
      <!-- Forearm extending into console area (foreshortened). -->
      <path d="M22,260 Q30,290 50,302 L78,300 Q70,278 52,268 Z" fill="url(#p3suitMetal)"/>
      <ellipse cx="78" cy="304" rx="14" ry="10" fill="url(#p3skinTone)"/>
      <ellipse cx="78" cy="304" rx="14" ry="10" fill="url(#p3oilStain)" opacity="0.55"/>
      <!-- Wrist holographic emitter. -->
      <ellipse cx="56" cy="278" rx="14" ry="3.5" fill="url(#p3hologramCore)" opacity="0.9"/>
      <!-- Bicep accent. -->
      <use href="#p3copperNode" x="22" y="210" width="18" height="18"/>

      <!-- Right arm. -->
      <path d="M218,180 Q234,220 226,260 L196,268 Q190,224 188,182 Z" fill="url(#p3suitMetal)"/>
      <path d="M218,180 Q234,220 226,260 L196,268 Q190,224 188,182 Z" fill="url(#p3suitHighlight)" opacity="0.4"/>
      <path d="M226,260 Q220,290 200,302 L172,300 Q180,278 196,268 Z" fill="url(#p3suitMetal)"/>
      <ellipse cx="170" cy="304" rx="14" ry="10" fill="url(#p3skinTone)"/>
      <ellipse cx="170" cy="304" rx="14" ry="10" fill="url(#p3oilStain)" opacity="0.45"/>
      <ellipse cx="192" cy="278" rx="14" ry="3.5" fill="url(#p3hologramCore)" opacity="0.9"/>
      <use href="#p3copperNode" x="208" y="210" width="18" height="18"/>
    </g>

    <!-- Neck + collar. -->
    <g id="p3-wren-neck">
      <path d="M110,150 L110,180 L140,180 L140,150 Z" fill="url(#p3skinTone)"/>
      <path d="M96,170 Q124,158 152,170 L148,182 L100,182 Z" fill="url(#p3suitMetal)"/>
      <line x1="125" y1="164" x2="125" y2="180" stroke="#2a261c" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Head — high angle (looking down at her), tilted forward in concentration. -->
    <g id="p3-wren-head">
      <!-- Head shape — slightly elongated due to top-down view. -->
      <ellipse cx="125" cy="120" rx="34" ry="42" fill="url(#p3skinTone)"/>

      <!-- Top of head — high angle reveals more of the hair mass. -->
      <ellipse cx="125" cy="100" rx="32" ry="22" fill="url(#p3hair)"/>

      <!-- Hair — dark, parted center, pulled back tight. Top-down view emphasizes the part. -->
      <line x1="125" y1="80" x2="125" y2="116" stroke="#040201" stroke-width="0.7" opacity="0.8"/>
      <!-- Hair sweeping back from the part. -->
      <path d="M93,108 Q98,90 125,82 Q152,90 157,108 Q150,98 125,92 Q100,98 93,108 Z" fill="url(#p3hair)"/>
      <!-- Hair sides framing face. -->
      <path d="M93,114 Q90,140 96,162 L102,160 Q98,140 100,118 Z" fill="url(#p3hair)"/>
      <path d="M157,114 Q160,140 154,162 L148,160 Q152,140 150,118 Z" fill="url(#p3hair)"/>

      <!-- Knot at nape (small, visible from top angle as a bump at back of head). -->
      <ellipse cx="125" cy="160" rx="14" ry="9" fill="url(#p3hair)"/>
      <ellipse cx="125" cy="158" rx="11" ry="6" fill="#0a0604" opacity="0.6"/>

      <!-- Stray strands. -->
      <path d="M108,108 Q116,114 122,110" fill="none" stroke="#0a0604" stroke-width="0.7" opacity="0.85"/>
      <path d="M128,110 Q136,114 142,108" fill="none" stroke="#0a0604" stroke-width="0.7" opacity="0.85"/>

      <!-- Cool blue rim from overhead (top of head). -->
      <ellipse cx="125" cy="92" rx="28" ry="12" fill="#bfe4ff" opacity="0.18"/>

      <!-- Warm copper key on lower face (light from console). -->
      <path d="M100,140 Q125,165 150,140 Q150,158 125,166 Q100,158 100,140 Z" fill="#f5a850" opacity="0.3"/>

      <!-- Eyes — looking down at console (head tilted forward, eyes downcast). -->
      <ellipse cx="113" cy="125" rx="3.4" ry="1.5" fill="#1a0e08"/>
      <ellipse cx="137" cy="125" rx="3.4" ry="1.5" fill="#1a0e08"/>
      <!-- Eye highlights — copper glint from below. -->
      <ellipse cx="113" cy="126" rx="0.7" ry="0.5" fill="#f5d878"/>
      <ellipse cx="137" cy="126" rx="0.7" ry="0.5" fill="#f5d878"/>

      <!-- Brows — drawn together (focused). -->
      <path d="M105,118 Q113,116 120,118" fill="none" stroke="#0a0604" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M130,118 Q137,116 144,118" fill="none" stroke="#0a0604" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Subtle furrow between. -->
      <line x1="124" y1="120" x2="124" y2="128" stroke="#7a5232" stroke-width="0.5" opacity="0.7"/>

      <!-- Nose. -->
      <path d="M125,128 L122,144 Q125,146 128,144 Z" fill="#7a5230" opacity="0.65"/>
      <!-- Mouth — closed, slight press of concentration (per script: "lips pressed together"). -->
      <path d="M118,154 Q125,156 132,154" fill="none" stroke="#5a3018" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: dialogue                                             -->
  <!-- ========================================================== -->
  <g id="p3-dialogue">
    <rect x="6" y="14" width="225" height="52" rx="6" fill="white" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <polygon points="80,66 90,66 76,76" fill="white" stroke="#c87a35" stroke-width="2"/>
    <line x1="79.5" y1="66" x2="90.5" y2="66" stroke="white" stroke-width="1.5"/>
    <text x="14" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
    <text x="14" y="46" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">Drive nominal. Ninety-seven</text>
    <text x="14" y="60" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">percent field coherence. We're clean.</text>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: panel meta                                           -->
  <!-- ========================================================== -->
  <g id="p3-meta">
    <text x="230" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#888" opacity="0.7">3</text>
    <text x="234" y="356" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#888" opacity="0.6">MED</text>
  </g>

</svg>
