<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 552" width="244" height="552">
  <title>Issue 1 — Page 12 — Panel 2: Jink banks around chimney pot, joy in flight</title>
  <desc>Medium shot at three-quarter angle, dynamic (50mm). Jink banking hard around a massive soot-crusted chimney pot — cylindrical clay column taller than they are, crusted with soot+lichen. Wings tilted, geometric lattice blurring with speed. Full grin, eyes wide, golden curls streaming. Inappropriate, irrepressible joy. Behind: more chimney pots receding into forest. Warm amber from city below uplights soot surfaces; emerald wing-glow slashes across clay. Silent panel.</desc>

  <defs>
    <linearGradient id="p12p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p12p2warmGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c87830" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p12p2clay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2812"/>
      <stop offset="50%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p12p2clayLit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86028"/>
      <stop offset="100%" stop-color="#5a2812"/>
    </linearGradient>
    <radialGradient id="p12p2wingGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a8f5c8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a5a30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p12p2emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a5a30"/>
    </linearGradient>
    <filter id="p12p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p12p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="p12p2motionBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="244" height="552" fill="url(#p12p2sky)"/>

  <!-- Far stars. -->
  <g fill="#dce4f0" opacity="0.65">
    <circle cx="30" cy="40" r="0.7"/>
    <circle cx="80" cy="60" r="0.5"/>
    <circle cx="155" cy="35" r="0.7"/>
    <circle cx="210" cy="55" r="0.5"/>
    <circle cx="50" cy="115" r="0.6"/>
    <circle cx="195" cy="125" r="0.5"/>
  </g>

  <!-- Distant chimney forest receding (BG). -->
  <g id="p12p2-chimney-forest-far">
    <g fill="#1a1820" opacity="0.7">
      <rect x="20" y="180" width="8" height="40"/>
      <rect x="55" y="160" width="9" height="60"/>
      <rect x="90" y="170" width="8" height="50"/>
      <rect x="125" y="155" width="10" height="65"/>
      <rect x="160" y="175" width="8" height="45"/>
      <rect x="195" y="165" width="9" height="55"/>
      <rect x="225" y="180" width="8" height="40"/>
    </g>
    <g fill="#0a0808">
      <rect x="18" y="178" width="12" height="3"/>
      <rect x="53" y="158" width="13" height="3"/>
      <rect x="88" y="168" width="12" height="3"/>
      <rect x="123" y="153" width="14" height="3"/>
      <rect x="158" y="173" width="12" height="3"/>
      <rect x="193" y="163" width="13" height="3"/>
      <rect x="223" y="178" width="12" height="3"/>
    </g>
  </g>

  <!-- Mid-ground chimney forest. -->
  <g id="p12p2-chimney-forest-mid">
    <g fill="#2a1810">
      <rect x="10" y="240" width="14" height="100"/>
      <rect x="40" y="220" width="16" height="120"/>
      <rect x="70" y="252" width="13" height="88"/>
      <rect x="180" y="225" width="15" height="115"/>
      <rect x="210" y="245" width="14" height="95"/>
    </g>
    <g fill="#1a0808">
      <rect x="8" y="237" width="18" height="4"/>
      <rect x="38" y="217" width="20" height="4"/>
      <rect x="68" y="249" width="17" height="4"/>
      <rect x="178" y="222" width="19" height="4"/>
      <rect x="208" y="242" width="18" height="4"/>
    </g>
    <!-- Soot streaks down each pot. -->
    <g fill="#080404" opacity="0.6">
      <rect x="14" y="240" width="2" height="100"/>
      <rect x="46" y="220" width="2" height="120"/>
      <rect x="74" y="252" width="2" height="88"/>
      <rect x="184" y="225" width="2" height="115"/>
      <rect x="214" y="245" width="2" height="95"/>
    </g>
    <!-- Lichen patches. -->
    <g fill="#4a6038" opacity="0.55">
      <ellipse cx="48" cy="280" rx="6" ry="3"/>
      <ellipse cx="50" cy="310" rx="5" ry="2.5"/>
      <ellipse cx="186" cy="290" rx="5" ry="3"/>
      <ellipse cx="218" cy="320" rx="4" ry="2"/>
      <ellipse cx="78" cy="290" rx="4" ry="2.5"/>
    </g>
  </g>

  <!-- Warm amber glow rising between chimney pots from below. -->
  <ellipse cx="122" cy="510" rx="200" ry="80" fill="url(#p12p2warmGlow)" filter="url(#p12p2strongBloom)"/>

  <!-- HERO CHIMNEY POT (foreground, large, dominant on right side). -->
  <g id="p12p2-hero-chimney" transform="translate(170, 260)">
    <!-- Cylindrical body. -->
    <rect x="-32" y="0" width="64" height="290" fill="url(#p12p2clay)"/>
    <!-- Lit edge (left, catching emerald wing glow + warm city glow). -->
    <path d="M-32,0 L-22,2 L-22,290 L-32,290 Z" fill="url(#p12p2clayLit)" opacity="0.85"/>
    <!-- Crown ring at top. -->
    <ellipse cx="0" cy="0" rx="32" ry="8" fill="#1a0808"/>
    <ellipse cx="0" cy="0" rx="32" ry="8" fill="none" stroke="#5a2812" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="26" ry="5" fill="#080404"/>
    <!-- Soot streaks running down. -->
    <g fill="#080404" opacity="0.85">
      <path d="M-28,4 L-26,290"/>
      <path d="M-14,6 L-12,290"/>
      <path d="M0,6 L2,290"/>
      <path d="M14,6 L16,290"/>
      <path d="M26,4 L28,290"/>
    </g>
    <!-- Heavier soot wash. -->
    <ellipse cx="-12" cy="120" rx="10" ry="100" fill="#080404" opacity="0.45"/>
    <ellipse cx="14" cy="180" rx="8" ry="80" fill="#080404" opacity="0.4"/>
    <!-- Lichen patches (greenish-brown). -->
    <g fill="#4a6038" opacity="0.7">
      <ellipse cx="-22" cy="50" rx="6" ry="4"/>
      <ellipse cx="-18" cy="90" rx="5" ry="3"/>
      <ellipse cx="20" cy="140" rx="7" ry="4"/>
      <ellipse cx="-25" cy="200" rx="5" ry="3"/>
      <ellipse cx="18" cy="240" rx="6" ry="3.5"/>
    </g>
    <g fill="#6a8048" opacity="0.55">
      <ellipse cx="-20" cy="48" rx="3" ry="2"/>
      <ellipse cx="22" cy="138" rx="3" ry="1.5"/>
      <ellipse cx="-23" cy="198" rx="2" ry="1.5"/>
    </g>
    <!-- Crusty texture detail. -->
    <g fill="#1a0808" opacity="0.8">
      <circle cx="-26" cy="30" r="0.7"/>
      <circle cx="-15" cy="65" r="0.6"/>
      <circle cx="6" cy="80" r="0.7"/>
      <circle cx="22" cy="100" r="0.6"/>
      <circle cx="-28" cy="170" r="0.7"/>
      <circle cx="-12" cy="220" r="0.6"/>
      <circle cx="10" cy="260" r="0.6"/>
    </g>
    <!-- EMERALD WING-GLOW SLASH across left side of pot (Jink passing). -->
    <path d="M-32,140 Q-20,160 -22,200 Q-18,235 -28,260" stroke="#2ed078" stroke-width="6" fill="none" filter="url(#p12p2bloom)" opacity="0.65" stroke-linecap="round"/>
    <path d="M-32,140 Q-20,160 -22,200 Q-18,235 -28,260" stroke="#a8f5c8" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round"/>
    <!-- Geometric pattern from wing on clay. -->
    <g stroke="#a8f5c8" stroke-width="0.8" fill="none" opacity="0.55">
      <line x1="-30" y1="160" x2="-22" y2="170"/>
      <line x1="-28" y1="180" x2="-22" y2="186"/>
      <line x1="-25" y1="200" x2="-22" y2="202"/>
      <line x1="-26" y1="220" x2="-22" y2="222"/>
      <line x1="-28" y1="240" x2="-22" y2="246"/>
    </g>
  </g>

  <!-- JINK banking through (foreground, mid-left of panel). -->
  <g id="p12p2-jink" transform="translate(95, 320) rotate(-25)">
    <!-- Body in emerald suit, leaning into bank. -->
    <path d="M-13,15 Q-15,-15 -10,-30 L10,-30 Q15,-15 13,15 Z" fill="url(#p12p2emerald)" stroke="#080408" stroke-width="0.6"/>
    <!-- Cool emerald accent on chest plate. -->
    <ellipse cx="0" cy="-5" rx="6" ry="4" fill="#a8f5c8" opacity="0.4"/>
    <!-- Shoulder pads. -->
    <ellipse cx="-10" cy="-26" rx="6" ry="4" fill="#2ed078" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="10" cy="-26" rx="6" ry="4" fill="#2ed078" stroke="#080408" stroke-width="0.5"/>

    <!-- Arms (one forward leading bank, one back). -->
    <path d="M-10,-18 L-22,-12 L-30,-2" fill="none" stroke="#2ed078" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M10,-15 L18,-2 L24,12" fill="none" stroke="#2ed078" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="-30" cy="-2" rx="3" ry="2.5" fill="#f0d088"/>
    <ellipse cx="24" cy="12" rx="3" ry="2.5" fill="#f0d088"/>

    <!-- Legs angled (mid-flight, trailing). -->
    <path d="M-7,15 L-12,32 L-15,48" fill="none" stroke="#0a5a30" stroke-width="6" stroke-linecap="round"/>
    <path d="M7,15 L10,32 L12,48" fill="none" stroke="#0a5a30" stroke-width="6" stroke-linecap="round"/>
    <path d="M-15,48 L-22,52 L-26,52" fill="none" stroke="#2ed078" stroke-width="3" stroke-linecap="round"/>
    <path d="M12,48 L18,52 L22,52" fill="none" stroke="#2ed078" stroke-width="3" stroke-linecap="round"/>

    <!-- TRANSLUCENT EMERALD DRAGONFLY WINGS (tilted with bank, geometric lattice). -->
    <g id="p12p2-wings">
      <!-- Upper wing pair (large, behind body). -->
      <path d="M-12,-25 Q-50,-50 -82,-20 Q-72,2 -40,-8 Q-20,-15 -12,-15 Z" fill="url(#p12p2wingGlow)" opacity="0.55" filter="url(#p12p2bloom)"/>
      <path d="M12,-25 Q50,-50 82,-20 Q72,2 40,-8 Q20,-15 12,-15 Z" fill="url(#p12p2wingGlow)" opacity="0.55" filter="url(#p12p2bloom)"/>
      <!-- Lower wing pair. -->
      <path d="M-12,-15 Q-44,-2 -68,18 Q-58,28 -36,18 Q-20,8 -12,5 Z" fill="url(#p12p2wingGlow)" opacity="0.45" filter="url(#p12p2bloom)"/>
      <path d="M12,-15 Q44,-2 68,18 Q58,28 36,18 Q20,8 12,5 Z" fill="url(#p12p2wingGlow)" opacity="0.45" filter="url(#p12p2bloom)"/>

      <!-- Geometric lattice on upper wings (motion-blurred). -->
      <g stroke="#a8f5c8" stroke-width="0.7" fill="none" opacity="0.6" filter="url(#p12p2motionBlur)">
        <line x1="-20" y1="-22" x2="-40" y2="-30"/>
        <line x1="-30" y1="-25" x2="-55" y2="-35"/>
        <line x1="-40" y1="-22" x2="-70" y2="-25"/>
        <line x1="-50" y1="-15" x2="-78" y2="-15"/>
        <line x1="-25" y1="-30" x2="-32" y2="-15"/>
        <line x1="-45" y1="-32" x2="-50" y2="-12"/>
        <line x1="-60" y1="-28" x2="-65" y2="-8"/>
        <!-- Right wing mirror. -->
        <line x1="20" y1="-22" x2="40" y2="-30"/>
        <line x1="30" y1="-25" x2="55" y2="-35"/>
        <line x1="40" y1="-22" x2="70" y2="-25"/>
        <line x1="50" y1="-15" x2="78" y2="-15"/>
        <line x1="25" y1="-30" x2="32" y2="-15"/>
        <line x1="45" y1="-32" x2="50" y2="-12"/>
        <line x1="60" y1="-28" x2="65" y2="-8"/>
      </g>
      <!-- Bright leading edge highlights on wings. -->
      <path d="M-12,-25 Q-50,-50 -82,-20" fill="none" stroke="#bfffe0" stroke-width="1.2" opacity="0.85" filter="url(#p12p2bloom)"/>
      <path d="M12,-25 Q50,-50 82,-20" fill="none" stroke="#bfffe0" stroke-width="1.2" opacity="0.85" filter="url(#p12p2bloom)"/>
    </g>

    <!-- HEAD with golden curls streaming back. -->
    <ellipse cx="0" cy="-44" rx="9" ry="10" fill="#d8b890"/>
    <!-- Curls streaming back/up (long with motion). -->
    <g fill="#f5d068">
      <ellipse cx="0" cy="-54" rx="6" ry="4"/>
      <ellipse cx="-5" cy="-52" rx="5" ry="3.5"/>
      <ellipse cx="5" cy="-52" rx="5" ry="3.5"/>
      <ellipse cx="-3" cy="-58" rx="4" ry="3"/>
      <ellipse cx="4" cy="-58" rx="4" ry="3"/>
      <!-- Trailing streamed curls (motion). -->
      <ellipse cx="-8" cy="-60" rx="3" ry="6" transform="rotate(-30 -8 -60)"/>
      <ellipse cx="8" cy="-60" rx="3" ry="6" transform="rotate(30 8 -60)"/>
      <ellipse cx="-12" cy="-65" rx="2" ry="5" transform="rotate(-40 -12 -65)"/>
      <ellipse cx="12" cy="-65" rx="2" ry="5" transform="rotate(40 12 -65)"/>
    </g>
    <!-- Curl shadow separations. -->
    <g fill="#a87038" opacity="0.6">
      <circle cx="-3" cy="-55" r="0.6"/>
      <circle cx="3" cy="-56" r="0.6"/>
      <circle cx="0" cy="-58" r="0.6"/>
    </g>
    <!-- Curl glints. -->
    <g fill="#fff5d0" opacity="0.85">
      <circle cx="-2" cy="-58" r="0.5"/>
      <circle cx="6" cy="-55" r="0.5"/>
    </g>

    <!-- FACE: full grin, eyes wide, joy. -->
    <!-- Eyes (large, wide, bright). -->
    <ellipse cx="-3.5" cy="-44" rx="2" ry="2.5" fill="#f5e8d0"/>
    <ellipse cx="3.5" cy="-44" rx="2" ry="2.5" fill="#f5e8d0"/>
    <ellipse cx="-3.5" cy="-44" rx="1.4" ry="1.5" fill="#3a2818"/>
    <ellipse cx="3.5" cy="-44" rx="1.4" ry="1.5" fill="#3a2818"/>
    <ellipse cx="-3.5" cy="-44.5" rx="0.6" ry="0.7" fill="#080404"/>
    <ellipse cx="3.5" cy="-44.5" rx="0.6" ry="0.7" fill="#080404"/>
    <!-- Catch-light: warm. -->
    <circle cx="-3.5" cy="-44.7" r="0.4" fill="#fff5d0"/>
    <circle cx="3.5" cy="-44.7" r="0.4" fill="#fff5d0"/>
    <!-- Brow (raised slightly = joy). -->
    <path d="M-6,-49 Q-3,-51 0,-49" stroke="#3a1808" stroke-width="0.8" fill="none"/>
    <path d="M0,-49 Q3,-51 6,-49" stroke="#3a1808" stroke-width="0.8" fill="none"/>
    <!-- FULL GRIN: open mouth showing teeth, broad. -->
    <path d="M-7,-37 Q0,-30 7,-37 Q5,-33 0,-32 Q-5,-33 -7,-37 Z" fill="#3a1808"/>
    <line x1="-5" y1="-35" x2="5" y2="-35" stroke="#fff5d0" stroke-width="0.7"/>
    <!-- Cheeks raised (lift). -->
    <ellipse cx="-7" cy="-40" rx="2" ry="1.2" fill="#e8a878" opacity="0.6"/>
    <ellipse cx="7" cy="-40" rx="2" ry="1.2" fill="#e8a878" opacity="0.6"/>

    <!-- Warm uplighting catch on face from city below. -->
    <ellipse cx="0" cy="-37" rx="6" ry="3" fill="#f5b860" opacity="0.18"/>
  </g>

  <!-- Meta tag. -->
  <g id="p12p2-meta">
    <text x="236" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="240" y="544" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">JINK BANKS</text>
  </g>
</svg>
