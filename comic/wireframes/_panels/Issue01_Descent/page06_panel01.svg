<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 1 — Page 6 — Panel 1: Clerkenwell side street, Theodore in workshop window</title>
  <desc>Wide shot at 35mm, eye level. Narrow Clerkenwell side street at night. Workshops + terraced houses, faded TINKER trade sign, wet cobblestones reflecting amber gaslight from cast-iron lamp at far end. Upper-floor window glows warm candlelight with silhouette of boy leaning forward face-pressed-to-glass looking up at sky. Composition leads eye through dark street to lit window. Fading prismatic streak ghost across sky above.</desc>

  <defs>
    <linearGradient id="p6p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="60%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p6p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p6p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#15080a"/>
    </linearGradient>
    <radialGradient id="p6p1windowGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5a850" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p1lampGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffe080" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="p6p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Sky takes upper third. -->
  <rect width="366" height="140" fill="url(#p6p1sky)"/>
  <path d="M0,50 L366,20 L366,32 L0,62 Z" fill="#5a3a8a" opacity="0.18" filter="url(#p6p1bloom)"/>
  <g fill="#dce4f0" opacity="0.7">
    <circle cx="58" cy="22" r="0.6"/>
    <circle cx="148" cy="36" r="0.7"/>
    <circle cx="240" cy="18" r="0.6"/>
    <circle cx="320" cy="42" r="0.7"/>
    <circle cx="100" cy="80" r="0.5"/>
    <circle cx="200" cy="100" r="0.6"/>
    <circle cx="300" cy="90" r="0.5"/>
  </g>

  <!-- Buildings left side. -->
  <g id="p6p1-left-bldgs">
    <rect x="0" y="60" width="80" height="304" fill="url(#p6p1brick)"/>
    <rect x="80" y="80" width="50" height="284" fill="url(#p6p1brick)"/>
    <line x1="80" y1="60" x2="80" y2="364" stroke="#0a0204" stroke-width="0.7"/>
    <line x1="130" y1="80" x2="130" y2="364" stroke="#0a0204" stroke-width="0.7"/>
    <rect x="14" y="100" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="40" y="100" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="14" y="160" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="40" y="160" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="14" y="220" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="40" y="220" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="14" y="280" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="90" y="120" width="12" height="18" fill="#3a1810" opacity="0.85"/>
    <rect x="108" y="120" width="12" height="18" fill="#3a1810" opacity="0.85"/>
    <rect x="90" y="180" width="12" height="18" fill="#3a1810" opacity="0.85"/>
    <rect x="108" y="240" width="12" height="18" fill="#3a1810" opacity="0.85"/>
  </g>

  <!-- Buildings right side (with workshop). -->
  <g id="p6p1-right-bldgs">
    <rect x="200" y="80" width="80" height="284" fill="url(#p6p1brick)"/>
    <rect x="280" y="60" width="86" height="304" fill="url(#p6p1brick)"/>
    <line x1="200" y1="80" x2="200" y2="364" stroke="#0a0204" stroke-width="0.7"/>
    <line x1="280" y1="60" x2="280" y2="364" stroke="#0a0204" stroke-width="0.7"/>
    <rect x="290" y="100" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="316" y="100" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="342" y="100" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="290" y="220" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="316" y="220" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="290" y="280" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="316" y="280" width="14" height="20" fill="#3a1810" opacity="0.85"/>

    <!-- Faded TINKER trade sign. -->
    <rect x="206" y="200" width="68" height="20" fill="#3a2010"/>
    <text x="240" y="214" text-anchor="middle" font-family="serif" font-size="9" fill="#a87838" letter-spacing="0.5" opacity="0.85">HARTLEY · TINKER</text>

    <!-- Theodore's lit window. -->
    <g id="p6p1-theodore-window">
      <ellipse cx="240" cy="148" rx="60" ry="38" fill="url(#p6p1windowGlow)" filter="url(#p6p1strongBloom)"/>
      <rect x="218" y="128" width="44" height="48" fill="#fff5d8"/>
      <rect x="218" y="128" width="44" height="48" fill="none" stroke="#3a2010" stroke-width="1.4"/>
      <line x1="240" y1="128" x2="240" y2="176" stroke="#3a2010" stroke-width="0.8"/>
      <line x1="218" y1="152" x2="262" y2="152" stroke="#3a2010" stroke-width="0.8"/>
      <!-- Theodore silhouette inside window. -->
      <path d="M226,132 Q230,138 232,148 Q230,154 232,158 Q236,160 240,158 L246,158 Q248,156 248,150 Q250,142 252,138 L252,156 Q252,168 244,170 L228,170 Q224,168 224,156 Q224,144 226,132 Z" fill="#1a0e08" opacity="0.9"/>
    </g>
  </g>

  <!-- Cobblestone street (foreground, wet, takes substantial vertical room). -->
  <g id="p6p1-street">
    <path d="M130,300 L280,300 L366,364 L0,364 Z" fill="url(#p6p1cobble)"/>
    <g stroke="#5a2810" stroke-width="0.4" fill="none" opacity="0.55">
      <path d="M40,315 Q60,318 80,315"/>
      <path d="M150,318 Q170,320 190,318"/>
      <path d="M250,318 Q270,320 290,318"/>
      <path d="M30,335 Q60,338 90,335"/>
      <path d="M180,338 Q210,340 240,338"/>
      <path d="M310,335 Q330,338 350,335"/>
      <path d="M20,355 Q60,358 100,355"/>
      <path d="M260,358 Q300,360 340,358"/>
    </g>
    <ellipse cx="186" cy="320" rx="40" ry="6" fill="#c87830" opacity="0.45" filter="url(#p6p1bloom)"/>
  </g>

  <!-- Distant gas lamp at end of street. -->
  <g id="p6p1-distant-lamp">
    <rect x="183" y="240" width="3" height="60" fill="#1a0808"/>
    <path d="M178,240 L188,240 L191,244 L189,252 L177,252 L175,244 Z" fill="#1a0808"/>
    <ellipse cx="183" cy="246" rx="6" ry="4" fill="#fff5d8" opacity="0.95" filter="url(#p6p1bloom)"/>
    <ellipse cx="183" cy="246" rx="3" ry="2" fill="#ffe080"/>
    <ellipse cx="183" cy="246" rx="32" ry="20" fill="url(#p6p1lampGlow)" filter="url(#p6p1bloom)" opacity="0.7"/>
  </g>

  <!-- Foreground rooftop overhang (top framing). -->
  <path d="M0,60 L40,55 L80,60 L120,52 L160,60 L200,80 L240,72 L280,60 L320,55 L366,60 L366,40 L0,40 Z" fill="#0a0408"/>

  <g id="p6p1-meta">
    <text x="356" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="360" y="356" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">WIDE</text>
  </g>
</svg>
