<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 380" width="244" height="380">
  <title>Issue 1 — Page 8 — Panel 2: Wren striding toward wreckage, diagnostic fury</title>
  <desc>Medium close-up at slight low angle (50mm). Wren on her feet moving toward largest wreckage. Copper suit streaked with dark hydraulic fluid on both forearms. Hair bun partially collapsed, strands across face. Diagnostic fury — lips thin, eyes narrowed. Cool blue-white from dying wreckage ahead lights her face front, copper catches and shifts light warmer. WREN (to herself): "The drive housing..."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p2gutter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="p8p2coolGlow" cx="50%" cy="60%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#5aa6dc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a4a8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p8p2copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <linearGradient id="p8p2copperLit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c890"/>
      <stop offset="100%" stop-color="#a86028"/>
    </linearGradient>
    <linearGradient id="p8p2skinFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d8c0"/>
      <stop offset="100%" stop-color="#a87850"/>
    </linearGradient>
    <filter id="p8p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p8p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Gutter background. -->
  <rect width="244" height="380" fill="url(#p8p2gutter)"/>

  <!-- Curved gutter wall (back). -->
  <path d="M0,40 Q122,15 244,40 L244,290 L0,290 Z" fill="#1a0e08" opacity="0.85"/>
  <line x1="0" y1="80" x2="244" y2="60" stroke="#080404" stroke-width="0.8" opacity="0.7"/>
  <line x1="0" y1="160" x2="244" y2="155" stroke="#080404" stroke-width="0.8" opacity="0.7"/>
  <line x1="0" y1="230" x2="244" y2="228" stroke="#080404" stroke-width="0.8" opacity="0.7"/>

  <!-- Iron rivets. -->
  <g fill="#080404" opacity="0.85">
    <circle cx="40" cy="85" r="2"/>
    <circle cx="120" cy="68" r="2"/>
    <circle cx="200" cy="85" r="2"/>
    <circle cx="40" cy="165" r="2"/>
    <circle cx="200" cy="160" r="2"/>
  </g>

  <!-- Soot streaks. -->
  <g fill="#080404" opacity="0.55">
    <path d="M30,40 Q34,140 28,260"/>
    <path d="M210,42 Q214,140 208,260"/>
  </g>

  <!-- COOL WRECKAGE GLOW from below/ahead — illuminates Wren's face from front. -->
  <ellipse cx="122" cy="320" rx="180" ry="100" fill="url(#p8p2coolGlow)" filter="url(#p8p2strongBloom)"/>
  <ellipse cx="122" cy="340" rx="120" ry="50" fill="#bfe4ff" filter="url(#p8p2bloom)" opacity="0.45"/>

  <!-- Floor with debris. -->
  <rect y="290" width="244" height="90" fill="#0a0508"/>
  <line x1="0" y1="290" x2="244" y2="290" stroke="#080404" stroke-width="0.8"/>

  <!-- Coal sediment + small wreckage shards on floor. -->
  <g fill="#080404" opacity="0.7">
    <circle cx="30" cy="320" r="1.5"/>
    <circle cx="80" cy="335" r="1.8"/>
    <circle cx="135" cy="318" r="1.4"/>
    <circle cx="195" cy="338" r="1.6"/>
    <circle cx="50" cy="358" r="1.4"/>
    <circle cx="180" cy="362" r="1.4"/>
  </g>
  <g fill="#1a1a24" stroke="#7ac8ff" stroke-width="0.4">
    <polygon points="40,346 50,348 48,358 38,356"/>
    <polygon points="170,355 180,358 178,366 168,363"/>
  </g>
  <line x1="42" y1="350" x2="46" y2="354" stroke="#7ac8ff" stroke-width="0.6" filter="url(#p8p2bloom)" opacity="0.85"/>

  <!-- Wreckage in foreground (the source of light). -->
  <g id="p8p2-wreckage-fg">
    <path d="M0,360 L40,340 L80,348 L130,338 L180,346 L220,340 L244,348 L244,380 L0,380 Z" fill="#0a0a14"/>
    <!-- Bright sparking node. -->
    <ellipse cx="135" cy="365" rx="14" ry="6" fill="#bfe4ff" filter="url(#p8p2strongBloom)" opacity="0.85"/>
    <ellipse cx="135" cy="365" rx="6" ry="2.5" fill="#ffffff" filter="url(#p8p2bloom)" opacity="0.95"/>
    <line x1="125" y1="362" x2="145" y2="367" stroke="#ffffff" stroke-width="1.5" filter="url(#p8p2bloom)" opacity="0.95"/>
  </g>

  <!-- WREN — striding forward toward wreckage. Centered, slight low angle. -->
  <g id="p8p2-wren" transform="translate(122, 230)">
    <!-- Body: form-fitting copper suit, mid-stride lean forward. -->
    <path d="M-22,40 Q-24,10 -20,-18 L20,-18 Q24,10 22,40 Z" fill="url(#p8p2copper)" stroke="#3a1808" stroke-width="0.6"/>
    <!-- Front-lit copper highlights from cool wreckage glow. -->
    <path d="M-20,-15 Q-22,12 -18,38" fill="none" stroke="#f5c890" stroke-width="2" opacity="0.55"/>
    <path d="M18,-15 Q22,12 16,38" fill="none" stroke="#a86028" stroke-width="1.2" opacity="0.45"/>
    <!-- Cool reflection on chest plate. -->
    <ellipse cx="0" cy="0" rx="10" ry="8" fill="#a8c4dc" opacity="0.25"/>

    <!-- Shoulder pads. -->
    <ellipse cx="-20" cy="-15" rx="7" ry="4.5" fill="#c87a35" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="20" cy="-15" rx="7" ry="4.5" fill="#c87a35" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="-20" cy="-16" rx="4" ry="2" fill="#f5c890" opacity="0.6"/>
    <ellipse cx="20" cy="-16" rx="4" ry="2" fill="#f5c890" opacity="0.6"/>

    <!-- Right arm forward (reaching toward wreckage). -->
    <path d="M20,-8 L34,5 L42,18 L50,30" fill="none" stroke="url(#p8p2copperLit)" stroke-width="6" stroke-linecap="round"/>
    <!-- Hydraulic fluid streaks on right forearm (dark). -->
    <path d="M36,8 Q44,16 50,28" stroke="#1a0a08" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M40,5 Q46,12 50,22" stroke="#080406" stroke-width="1.2" fill="none" opacity="0.85"/>
    <ellipse cx="50" cy="30" rx="4" ry="3" fill="#e0c0a0"/>

    <!-- Left arm slightly back, balancing stride. -->
    <path d="M-20,-5 L-32,8 L-40,22" fill="none" stroke="url(#p8p2copperLit)" stroke-width="6" stroke-linecap="round"/>
    <!-- Hydraulic streaks on left forearm. -->
    <path d="M-30,8 Q-36,16 -40,20" stroke="#1a0a08" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M-34,5 Q-38,12 -40,18" stroke="#080406" stroke-width="1.2" fill="none" opacity="0.85"/>
    <ellipse cx="-40" cy="22" rx="3.5" ry="2.8" fill="#e0c0a0"/>

    <!-- Legs mid-stride. -->
    <path d="M-12,40 L-16,72 L-12,100 L-8,128" fill="none" stroke="#a86028" stroke-width="8" stroke-linecap="round"/>
    <path d="M14,40 L20,72 L26,100 L30,130" fill="none" stroke="#a86028" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="-8" cy="128" rx="6" ry="3" fill="#1a0808"/>
    <ellipse cx="30" cy="130" rx="6" ry="3" fill="#1a0808"/>

    <!-- HEAD (East Asian, partially collapsed bun, lit from front). -->
    <ellipse cx="0" cy="-32" rx="13" ry="14" fill="url(#p8p2skinFront)"/>
    <!-- Hair: high partially-collapsed messy bun. -->
    <ellipse cx="-2" cy="-44" rx="10" ry="7" fill="#0a0408"/>
    <ellipse cx="3" cy="-48" rx="6" ry="4.5" fill="#0a0408"/>
    <ellipse cx="-5" cy="-50" rx="5" ry="3.5" fill="#0a0408"/>
    <!-- Bun-tie ring. -->
    <ellipse cx="-1" cy="-44" rx="5" ry="2" fill="none" stroke="#3a1810" stroke-width="0.8" opacity="0.9"/>
    <!-- Strands fallen across face. -->
    <path d="M-12,-40 Q-8,-32 -10,-22" fill="none" stroke="#0a0408" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M11,-38 Q7,-30 9,-22" fill="none" stroke="#0a0408" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M-3,-30 Q-2,-26 -4,-21" fill="none" stroke="#0a0408" stroke-width="1.0" stroke-linecap="round" opacity="0.85"/>
    <!-- Escaping wisps. -->
    <path d="M-10,-50 Q-13,-52 -14,-48" fill="none" stroke="#0a0408" stroke-width="1.0" stroke-linecap="round"/>
    <path d="M11,-50 Q14,-52 15,-48" fill="none" stroke="#0a0408" stroke-width="1.0" stroke-linecap="round"/>

    <!-- Face: diagnostic fury — narrowed eyes, thin pressed lips. -->
    <!-- Eyes (almond shape, narrowed). -->
    <path d="M-7,-32 Q-4,-34 -1,-32 Q-4,-31 -7,-32 Z" fill="#1a0808"/>
    <path d="M1,-32 Q4,-34 7,-32 Q4,-31 1,-32 Z" fill="#1a0808"/>
    <!-- Brow lines (furrowed). -->
    <path d="M-7,-37 Q-4,-38 -1,-37" stroke="#3a1810" stroke-width="1.2" fill="none"/>
    <path d="M1,-37 Q4,-38 7,-37" stroke="#3a1810" stroke-width="1.2" fill="none"/>
    <!-- Lips: thin pressed line. -->
    <line x1="-4" y1="-23" x2="4" y2="-23" stroke="#5a2818" stroke-width="1.3"/>
    <!-- Cheekbones subtle highlight. -->
    <ellipse cx="-7" cy="-28" rx="2.5" ry="1.5" fill="#f0d8b8" opacity="0.55"/>
    <ellipse cx="7" cy="-28" rx="2.5" ry="1.5" fill="#f0d8b8" opacity="0.55"/>
    <!-- Cool light wash on forehead/face from front. -->
    <ellipse cx="0" cy="-30" rx="9" ry="6" fill="#bfe4ff" opacity="0.18"/>
  </g>

  <!-- Wren dialogue (top, internal monologue — small balloon). -->
  <g id="p8p2-dlg-wren">
    <rect x="36" y="14" width="172" height="46" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="46" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="46" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" font-style="italic" fill="#1a1a1a">The drive housing...</text>
    <path d="M114,60 L130,60 L122,72 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="114" y1="60" x2="130" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p8p2-meta">
    <text x="236" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="240" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">WREN MCU</text>
  </g>
</svg>
