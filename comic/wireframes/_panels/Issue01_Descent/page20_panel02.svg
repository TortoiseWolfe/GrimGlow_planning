<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 400" width="366" height="400">
  <title>Issue 1 — Page 20 — Panel 2: Sable + Wren partnership, low angle</title>
  <desc>Medium shot from low worm's-eye angle on gutter floor (50mm). Sable + Wren standing together near alien wreckage. Sable: arms crossed, head tilted slightly, listening, evaluating. Wren: gestures w/ pen-sized fab tool, copper-gold floating holographic list still hanging in air between them. Curved gutter walls rise around. Above: chimney smoke drifts across stars. Cool wreckage glow below + copper-gold list center + suit accents. WREN: "Every component means a mission. Every mission means exposure. I need time and access and luck — and those are the three things we don't have." SABLE: "Make the list. Prioritize by survival impact. We start tomorrow."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p20p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020208"/>
      <stop offset="100%" stop-color="#080a18"/>
    </linearGradient>
    <linearGradient id="p20p2iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="p20p2coolGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5aa6dc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p2listGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffd060" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86028" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p20p2silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfc6d0"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p20p2copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <radialGradient id="p20p2warmEdge" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p20p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Sky/dark background (top of panel — gutter walls rise into starry sky). -->
  <rect width="366" height="400" fill="url(#p20p2sky)"/>

  <!-- Stars at top. -->
  <g fill="#dce4f0" opacity="0.7">
    <circle cx="40" cy="22" r="0.7"/>
    <circle cx="120" cy="34" r="0.5"/>
    <circle cx="220" cy="22" r="0.7"/>
    <circle cx="300" cy="34" r="0.6"/>
    <circle cx="80" cy="58" r="0.5"/>
    <circle cx="200" cy="68" r="0.5"/>
    <circle cx="320" cy="58" r="0.6"/>
  </g>
  <!-- Chimney smoke drift at top edge. -->
  <ellipse cx="100" cy="38" rx="50" ry="8" fill="#3a2818" opacity="0.4"/>
  <ellipse cx="280" cy="42" rx="60" ry="10" fill="#3a2818" opacity="0.4"/>

  <!-- Curved gutter walls rising around them — perspective lines. -->
  <g id="p20p2-gutter-walls">
    <!-- Left wall rises from bottom-left. -->
    <path d="M0,400 L40,200 L60,80 L0,80 Z" fill="url(#p20p2iron)"/>
    <line x1="40" y1="200" x2="60" y2="80" stroke="#080404" stroke-width="1.5"/>
    <!-- Right wall rises from bottom-right. -->
    <path d="M366,400 L326,200 L306,80 L366,80 Z" fill="url(#p20p2iron)"/>
    <line x1="326" y1="200" x2="306" y2="80" stroke="#080404" stroke-width="1.5"/>
    <!-- Iron rivets up the walls. -->
    <g fill="#080404" opacity="0.85">
      <circle cx="22" cy="160" r="2"/>
      <circle cx="32" cy="240" r="2"/>
      <circle cx="40" cy="320" r="2"/>
      <circle cx="344" cy="160" r="2"/>
      <circle cx="334" cy="240" r="2"/>
      <circle cx="326" cy="320" r="2"/>
    </g>
    <!-- Soot streaks. -->
    <g fill="#080404" opacity="0.55">
      <path d="M28,80 Q34,200 38,360"/>
      <path d="M340,80 Q334,200 328,360"/>
    </g>
  </g>

  <!-- Faint warm city-glow at very top edge (peeking over walls). -->
  <ellipse cx="183" cy="60" rx="200" ry="20" fill="url(#p20p2warmEdge)" filter="url(#p20p2bloom)" opacity="0.4"/>

  <!-- Wreckage on gutter floor (BIG cool glow source from below since worm's-eye). -->
  <g id="p20p2-wreckage">
    <ellipse cx="183" cy="370" rx="200" ry="60" fill="url(#p20p2coolGlow)" filter="url(#p20p2strongBloom)"/>
    <!-- Hull plating fragments. -->
    <g fill="#1a1a24" stroke="#080808" stroke-width="0.6">
      <polygon points="60,360 100,348 130,370 90,378"/>
      <polygon points="180,365 230,350 260,375 200,382"/>
      <polygon points="280,360 320,348 348,370 308,378"/>
    </g>
    <!-- Bright sparks. -->
    <g fill="#ffffff" filter="url(#p20p2bloom)">
      <circle cx="92" cy="362" r="1.4"/>
      <circle cx="218" cy="365" r="1.6"/>
      <circle cx="308" cy="362" r="1.4"/>
    </g>
    <line x1="80" y1="358" x2="100" y2="370" stroke="#bfe4ff" stroke-width="1" filter="url(#p20p2bloom)" opacity="0.95"/>
    <line x1="280" y1="358" x2="300" y2="370" stroke="#bfe4ff" stroke-width="1" filter="url(#p20p2bloom)" opacity="0.95"/>
  </g>

  <!-- SABLE — left of center, arms crossed, head tilted, listening. (Worm's-eye = figures look tall) -->
  <g id="p20p2-sable" transform="translate(110, 280)">
    <!-- Body in damaged silver suit. -->
    <path d="M-22,90 Q-26,30 -22,-15 L-12,-25 L18,-25 Q22,-15 22,90 Z" fill="url(#p20p2silver)" stroke="#3a3848" stroke-width="0.6"/>
    <!-- Cool wreckage light from below underlights body. -->
    <path d="M-22,30 Q-26,60 -22,90 L22,90 Q22,60 22,30 Z" fill="#7ac8ff" opacity="0.25"/>
    <!-- Cracked right shoulder bleeding (visible from worm angle). -->
    <ellipse cx="20" cy="-12" rx="7" ry="4" fill="#9ba1aa" stroke="#080408" stroke-width="0.4"/>
    <line x1="14" y1="-13" x2="26" y2="-10" stroke="#7ac8ff" stroke-width="1" filter="url(#p20p2bloom)" opacity="0.95"/>
    <ellipse cx="20" cy="-10" rx="10" ry="5" fill="#bfe4ff" filter="url(#p20p2bloom)" opacity="0.45"/>
    <!-- Left shoulder. -->
    <ellipse cx="-20" cy="-12" rx="7" ry="4" fill="#9ba1aa" stroke="#080408" stroke-width="0.4"/>

    <!-- ARMS CROSSED across chest. -->
    <path d="M-20,-5 L-2,5 L20,8" fill="none" stroke="url(#p20p2silver)" stroke-width="6" stroke-linecap="round"/>
    <path d="M20,-2 L0,8 L-22,12" fill="none" stroke="url(#p20p2silver)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Hands tucked under opposite elbow. -->
    <ellipse cx="20" cy="8" rx="4" ry="3" fill="#5a3018"/>
    <ellipse cx="-22" cy="12" rx="4" ry="3" fill="#5a3018"/>

    <!-- Legs standing. -->
    <path d="M-12,90 L-16,118 L-18,150" fill="none" stroke="#5a606a" stroke-width="8" stroke-linecap="round"/>
    <path d="M14,90 L18,118 L18,150" fill="none" stroke="#5a606a" stroke-width="8" stroke-linecap="round"/>

    <!-- HEAD — tilted slightly to the right (toward Wren). -->
    <ellipse cx="2" cy="-37" rx="13" ry="14" fill="#5a3018" transform="rotate(-8 2 -37)"/>
    <!-- Buzz cap silver-white. -->
    <path d="M-9,-44 Q-3,-50 2,-50 Q7,-50 13,-44 L13,-37 L-9,-37 Z" fill="#e8eaee" transform="rotate(-8 2 -37)"/>
    <path d="M-9,-44 Q2,-48 13,-44" fill="none" stroke="#9aa4b4" stroke-width="0.6" opacity="0.7" transform="rotate(-8 2 -37)"/>
    <!-- Eyes (looking right at Wren). -->
    <ellipse cx="-2" cy="-37" rx="1.4" ry="1.0" fill="#1a0808"/>
    <ellipse cx="6" cy="-37" rx="1.4" ry="1.0" fill="#1a0808"/>
    <!-- Catch-lights warm (from city edge). -->
    <circle cx="-2" cy="-37.5" r="0.4" fill="#fff5d0"/>
    <circle cx="6" cy="-37.5" r="0.4" fill="#fff5d0"/>
    <!-- Brow set. -->
    <path d="M-5,-42 Q-2,-43 1,-42" stroke="#3a1808" stroke-width="0.8" fill="none"/>
    <path d="M3,-42 Q6,-43 9,-42" stroke="#3a1808" stroke-width="0.8" fill="none"/>
    <!-- Lips (closed, evaluative). -->
    <line x1="-3" y1="-29" x2="6" y2="-30" stroke="#3a1808" stroke-width="1"/>
    <!-- Cool underlight catch on jaw. -->
    <ellipse cx="0" cy="-30" rx="9" ry="3" fill="#7ac8ff" opacity="0.2"/>
  </g>

  <!-- WREN — right of center, gesturing w/ tool. -->
  <g id="p20p2-wren" transform="translate(255, 280)">
    <path d="M-22,90 Q-26,30 -22,-15 L-12,-25 L18,-25 Q22,-15 22,90 Z" fill="url(#p20p2copper)" stroke="#080408" stroke-width="0.6"/>
    <!-- Cool wreckage underlight. -->
    <path d="M-22,30 Q-26,60 -22,90 L22,90 Q22,60 22,30 Z" fill="#7ac8ff" opacity="0.18"/>
    <!-- Copper-gold front-light wash from list. -->
    <ellipse cx="-15" cy="0" rx="22" ry="20" fill="#ffd060" opacity="0.18"/>
    <!-- Shoulders. -->
    <ellipse cx="-20" cy="-12" rx="7" ry="4" fill="#c87a35" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="20" cy="-12" rx="7" ry="4" fill="#c87a35" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-20" cy="-13" rx="4" ry="2" fill="#f5c890" opacity="0.55"/>

    <!-- LEFT arm (toward Sable, gesturing) holding tool. -->
    <path d="M-22,-8 L-38,-2 L-50,8 L-58,18" fill="none" stroke="url(#p20p2copper)" stroke-width="6" stroke-linecap="round"/>
    <!-- Hand. -->
    <ellipse cx="-58" cy="18" rx="4" ry="3" fill="#e0c0a0"/>
    <!-- Pen-sized tool. -->
    <rect x="-72" y="14" width="14" height="3" rx="1" fill="#3a3848"/>
    <circle cx="-72" cy="15.5" r="1.5" fill="#ffd060" filter="url(#p20p2bloom)"/>
    <!-- Hydraulic stains on forearm. -->
    <path d="M-44,4 Q-52,8 -56,12" stroke="#1a0a08" stroke-width="1.5" fill="none" opacity="0.85"/>

    <!-- Right arm at side. -->
    <path d="M22,-5 L26,18 L24,30" fill="none" stroke="url(#p20p2copper)" stroke-width="5.5" stroke-linecap="round"/>
    <ellipse cx="24" cy="30" rx="3.5" ry="2.5" fill="#e0c0a0"/>

    <!-- Legs. -->
    <path d="M-10,90 L-14,118 L-14,150" fill="none" stroke="#a86028" stroke-width="8" stroke-linecap="round"/>
    <path d="M14,90 L18,118 L20,150" fill="none" stroke="#a86028" stroke-width="8" stroke-linecap="round"/>

    <!-- HEAD East Asian + bun. -->
    <ellipse cx="0" cy="-37" rx="13" ry="14" fill="#e0c0a0"/>
    <ellipse cx="-2" cy="-50" rx="11" ry="7" fill="#0a0408"/>
    <ellipse cx="3" cy="-54" rx="6" ry="5" fill="#0a0408"/>
    <ellipse cx="-1" cy="-50" rx="6" ry="2" fill="none" stroke="#3a1810" stroke-width="0.7" opacity="0.9"/>
    <!-- Strands across face. -->
    <path d="M-11,-40 Q-8,-32 -10,-25" fill="none" stroke="#0a0408" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M11,-40 Q8,-32 10,-25" fill="none" stroke="#0a0408" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Eyes (engaged, looking left at Sable). -->
    <path d="M-9,-37 Q-4,-39 -1,-37 Q-4,-35 -9,-37 Z" fill="#1a0808"/>
    <path d="M1,-37 Q4,-39 7,-37 Q4,-35 1,-37 Z" fill="#1a0808"/>
    <ellipse cx="-5" cy="-37" rx="0.7" ry="0.7" fill="#080404"/>
    <ellipse cx="3" cy="-37" rx="0.7" ry="0.7" fill="#080404"/>
    <!-- Brow. -->
    <path d="M-9,-43 Q-5,-44 -1,-43" stroke="#3a1810" stroke-width="1" fill="none"/>
    <path d="M1,-43 Q4,-44 8,-43" stroke="#3a1810" stroke-width="1" fill="none"/>
    <!-- Lips talking. -->
    <line x1="-4" y1="-26" x2="4" y2="-26" stroke="#5a2818" stroke-width="1.2"/>
    <!-- Cool underlight + copper-gold catch. -->
    <ellipse cx="0" cy="-30" rx="9" ry="3" fill="#7ac8ff" opacity="0.18"/>
    <ellipse cx="-9" cy="-32" rx="3" ry="2" fill="#ffd060" opacity="0.45"/>
  </g>

  <!-- HOLOGRAPHIC LIST hanging in air BETWEEN them — copper-gold script. -->
  <g id="p20p2-holo-list" transform="translate(183, 250)">
    <!-- Glow halo. -->
    <ellipse cx="0" cy="0" rx="40" ry="18" fill="url(#p20p2listGlow)" filter="url(#p20p2bloom)"/>
    <!-- 3 list items stacked. -->
    <g stroke="#ffd060" stroke-width="0.7" fill="none" opacity="0.9" filter="url(#p20p2bloom)">
      <rect x="-32" y="-22" width="64" height="10" rx="1" stroke-dasharray="2,1"/>
      <line x1="-30" y1="-16" x2="20" y2="-16" stroke-width="0.6"/>
      <rect x="-30" y="-8" width="60" height="10" rx="1" stroke-dasharray="2,1"/>
      <line x1="-28" y1="-2" x2="18" y2="-2" stroke-width="0.6"/>
      <rect x="-32" y="6" width="64" height="10" rx="1" stroke-dasharray="2,1"/>
      <line x1="-30" y1="12" x2="22" y2="12" stroke-width="0.6"/>
    </g>
    <!-- Tiny geometric icons. -->
    <g fill="none" stroke="#ffd060" stroke-width="0.6" opacity="0.85">
      <circle cx="-22" cy="-17" r="2"/>
      <line x1="-23" y1="-19" x2="-21" y2="-15"/>
      <ellipse cx="-22" cy="-3" rx="3" ry="1.5"/>
      <path d="M-26,11 Q-22,8 -18,11"/>
    </g>
    <!-- Bright "growing" indicator. -->
    <ellipse cx="20" cy="11" rx="4" ry="2" fill="#ffe0a0" filter="url(#p20p2bloom)" opacity="0.85"/>
  </g>

  <!-- WREN balloon top (long quote). -->
  <g id="p20p2-dlg-wren">
    <rect x="14" y="14" width="338" height="106" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Every component means a mission.</text>
    <text x="24" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Every mission means exposure.</text>
    <text x="24" y="86" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Time, access, luck — three things</text>
    <text x="24" y="104" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">we don't have.</text>
    <path d="M242,120 L262,120 L256,150 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="242" y1="120" x2="262" y2="120" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- SABLE balloon bottom (response). -->
  <g id="p20p2-dlg-sable">
    <rect x="14" y="304" width="338" height="80" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="324" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="344" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Make the list. Prioritize by</text>
    <text x="24" y="360" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">survival impact.</text>
    <text x="24" y="378" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">We start tomorrow.</text>
    <path d="M82,304 L98,304 L100,266 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="82" y1="304" x2="98" y2="304" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p20p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="362" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE + WREN</text>
  </g>
</svg>
