<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 1 — Page 19 — Panel 1: Sable takes command, OTS Wren</title>
  <desc>Medium shot at eye level over Wren's shoulder (50mm). Wren's copper-suited shoulder + messy dark hair in left foreground. Beyond: Sable turned back from gutter edge to face squad — shoulders squared, weight centered, chin up. Vast amber Victorian cityscape backdrop. Damaged silver suit w/ cracked panels. Resolved expression. Warm amber backlight rims silhouette in gold. Cool blue-white from cracked panels catches face front. SABLE: "We're soldiers. This is a hostile environment. We secure, we assess, we adapt." / "The drive is gone. We're not gone. We work the problem."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a18"/>
      <stop offset="60%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#7a4830"/>
    </linearGradient>
    <radialGradient id="p19p1cityHaze" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c87830" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19p1silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfc6d0"/>
      <stop offset="100%" stop-color="#3a3848"/>
    </linearGradient>
    <linearGradient id="p19p1copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <radialGradient id="p19p1fractureGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p1backlight" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <filter id="p19p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p19p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="742" height="320" fill="url(#p19p1sky)"/>

  <!-- Distant city silhouette horizon w/ amber haze. -->
  <rect y="160" width="742" height="100" fill="url(#p19p1cityHaze)" opacity="0.85"/>

  <!-- Far city silhouette: church spires, chimney stacks, factory. -->
  <g id="p19p1-city-bg">
    <path d="M0,200 L40,196 L60,202 L90,194 L130,202 L160,194 L200,202 L240,192 L280,202 L320,192 L360,200 L400,190 L440,200 L480,190 L520,202 L560,192 L600,200 L640,190 L680,200 L720,194 L742,202 L742,260 L0,260 Z" fill="#1a1820" opacity="0.85"/>
    <!-- Spires + factory stacks. -->
    <polygon points="118,184 124,200 112,200" fill="#1a1820"/>
    <polygon points="278,178 284,200 272,200" fill="#1a1820"/>
    <polygon points="438,180 444,200 432,200" fill="#1a1820"/>
    <polygon points="598,178 604,200 592,200" fill="#1a1820"/>
    <rect x="218" y="160" width="5" height="42" fill="#0a0808"/>
    <rect x="538" y="158" width="5" height="44" fill="#0a0808"/>
    <!-- Smoke trails. -->
    <ellipse cx="240" cy="142" rx="40" ry="10" fill="#3a2818" opacity="0.5"/>
    <ellipse cx="560" cy="148" rx="45" ry="12" fill="#3a2818" opacity="0.5"/>
  </g>

  <!-- Mid rooftops + chimney pots. -->
  <g id="p19p1-mid-roofs">
    <path d="M0,260 L30,256 L60,264 L90,254 L130,264 L160,254 L200,264 L240,254 L280,262 L320,254 L360,264 L400,254 L440,264 L480,254 L520,264 L560,254 L600,262 L640,254 L680,264 L720,254 L742,260 L742,320 L0,320 Z" fill="#0a0808"/>
    <!-- Chimney pots. -->
    <g fill="#3a1810">
      <rect x="48" y="240" width="5" height="20"/>
      <rect x="58" y="237" width="5" height="23"/>
      <rect x="46" y="238" width="20" height="3" fill="#5a2812"/>

      <rect x="148" y="240" width="5" height="20"/>
      <rect x="156" y="237" width="5" height="23"/>
      <rect x="146" y="238" width="20" height="3" fill="#5a2812"/>

      <rect x="358" y="240" width="5" height="20"/>
      <rect x="366" y="237" width="5" height="23"/>
      <rect x="356" y="238" width="20" height="3" fill="#5a2812"/>

      <rect x="558" y="240" width="5" height="20"/>
      <rect x="566" y="237" width="5" height="23"/>
      <rect x="556" y="238" width="20" height="3" fill="#5a2812"/>
    </g>
    <!-- Lit windows. -->
    <ellipse cx="222" cy="288" rx="11" ry="6" fill="#fff5d8" filter="url(#p19p1bloom)" opacity="0.85"/>
    <rect x="218" y="285" width="8" height="8" fill="#fff5d8" opacity="0.9"/>
    <ellipse cx="468" cy="290" rx="10" ry="5" fill="#fff5d8" filter="url(#p19p1bloom)" opacity="0.7"/>
    <rect x="464" y="287" width="8" height="7" fill="#fff5d8" opacity="0.85"/>
  </g>

  <!-- Strong amber backlight halo behind Sable (golden rim). -->
  <ellipse cx="450" cy="160" rx="200" ry="150" fill="url(#p19p1backlight)" filter="url(#p19p1strongBloom)"/>

  <!-- WREN OTS — copper shoulder + messy bun, left foreground. -->
  <g id="p19p1-wren-ots" transform="translate(120, 200)">
    <!-- Body silhouette (back of shoulder). -->
    <path d="M-100,120 Q-100,40 -60,0 Q-30,-40 30,-40 Q60,-25 80,30 L80,120 Z" fill="url(#p19p1copper)" opacity="0.95"/>
    <!-- Shoulder pad accent. -->
    <ellipse cx="40" cy="-15" rx="30" ry="14" fill="#c87a35" stroke="#080408" stroke-width="0.6"/>
    <ellipse cx="40" cy="-22" rx="20" ry="6" fill="#f5c890" opacity="0.55"/>
    <!-- Hydraulic stains visible on copper. -->
    <path d="M-50,40 Q-30,30 -10,40" stroke="#1a0a08" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M-40,80 Q-20,70 0,80" stroke="#1a0a08" stroke-width="1.5" fill="none" opacity="0.7"/>
    <!-- Head — back of head w/ messy bun. -->
    <ellipse cx="20" cy="-50" rx="22" ry="26" fill="#e0c0a0"/>
    <ellipse cx="14" cy="-72" rx="18" ry="11" fill="#0a0408"/>
    <ellipse cx="22" cy="-80" rx="12" ry="8" fill="#0a0408"/>
    <ellipse cx="10" cy="-78" rx="10" ry="7" fill="#0a0408"/>
    <ellipse cx="18" cy="-72" rx="10" ry="3" fill="none" stroke="#3a1810" stroke-width="0.8" opacity="0.9"/>
    <!-- Stray strands. -->
    <path d="M-2,-65 Q-7,-60 -9,-50" fill="none" stroke="#0a0408" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M40,-72 Q44,-65 42,-55" fill="none" stroke="#0a0408" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- SABLE — turned to face squad, beyond Wren. -->
  <g id="p19p1-sable" transform="translate(440, 175)">

    <!-- Body — facing camera now (3/4 turned toward Wren+squad). -->
    <path d="M-26,90 Q-30,30 -25,-25 L-12,-40 L18,-40 Q22,-25 28,-25 Q32,30 26,90 Z" fill="url(#p19p1silver)" stroke="#3a3848" stroke-width="0.8"/>
    <!-- Cool front wash on body (from cracked panels). -->
    <ellipse cx="0" cy="0" rx="22" ry="40" fill="#7ac8ff" opacity="0.18"/>
    <!-- Warm backlight rim on right side. -->
    <path d="M28,-25 Q32,30 26,90" fill="none" stroke="#f5b860" stroke-width="2" opacity="0.85" filter="url(#p19p1bloom)"/>
    <path d="M-26,90 Q-30,30 -25,-25" fill="none" stroke="#f5b860" stroke-width="2" opacity="0.85" filter="url(#p19p1bloom)"/>

    <!-- CRACKED RIGHT shoulder panel bleeding blue-white. -->
    <ellipse cx="22" cy="-24" rx="9" ry="5" fill="#9ba1aa" stroke="#080408" stroke-width="0.5"/>
    <line x1="16" y1="-25" x2="28" y2="-22" stroke="#7ac8ff" stroke-width="1.4" filter="url(#p19p1bloom)" opacity="0.95"/>
    <line x1="22" y1="-26" x2="22" y2="-15" stroke="#bfe4ff" stroke-width="1" filter="url(#p19p1bloom)" opacity="0.95"/>
    <ellipse cx="22" cy="-22" rx="14" ry="8" fill="url(#p19p1fractureGlow)" filter="url(#p19p1strongBloom)" opacity="0.55"/>

    <!-- LEFT shoulder. -->
    <ellipse cx="-22" cy="-24" rx="8" ry="4.5" fill="#9ba1aa" stroke="#080408" stroke-width="0.5"/>

    <!-- Additional fracture lines. -->
    <line x1="-6" y1="0" x2="0" y2="14" stroke="#7ac8ff" stroke-width="1.2" filter="url(#p19p1bloom)" opacity="0.95"/>

    <!-- Arms at sides (commanding stance — relaxed but ready). -->
    <path d="M-25,-15 L-32,18 L-34,55" fill="none" stroke="url(#p19p1silver)" stroke-width="6" stroke-linecap="round"/>
    <path d="M25,-15 L32,18 L34,55" fill="none" stroke="url(#p19p1silver)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-34" cy="55" rx="4.5" ry="3" fill="#5a3018"/>
    <ellipse cx="34" cy="55" rx="4.5" ry="3" fill="#5a3018"/>

    <!-- Legs standing firm. -->
    <path d="M-12,90 L-16,118 L-18,140" fill="none" stroke="#5a606a" stroke-width="9" stroke-linecap="round"/>
    <path d="M12,90 L16,118 L18,140" fill="none" stroke="#5a606a" stroke-width="9" stroke-linecap="round"/>

    <!-- HEAD — facing camera (3/4 toward Wren). -->
    <ellipse cx="0" cy="-55" rx="14" ry="15" fill="#5a3018"/>
    <!-- Buzz cap silver-white. -->
    <path d="M-10,-63 Q-3,-70 0,-70 Q4,-70 13,-63 L13,-55 L-10,-55 Z" fill="#e8eaee"/>
    <path d="M-10,-63 Q0,-67 13,-63" fill="none" stroke="#9aa4b4" stroke-width="0.7" opacity="0.7"/>
    <!-- Buzz stipple. -->
    <g fill="#5a606a" opacity="0.7">
      <circle cx="-6" cy="-65" r="0.6"/>
      <circle cx="-2" cy="-66" r="0.6"/>
      <circle cx="2" cy="-67" r="0.6"/>
      <circle cx="6" cy="-66" r="0.6"/>
      <circle cx="10" cy="-63" r="0.6"/>
    </g>
    <!-- Soot dust. -->
    <g fill="#3a2818" opacity="0.55">
      <circle cx="-3" cy="-68" r="0.9"/>
      <circle cx="5" cy="-69" r="0.7"/>
    </g>

    <!-- FACE — facing forward. -->
    <!-- Eyes (steady, clear, looking at squad). -->
    <ellipse cx="-4" cy="-55" rx="1.6" ry="1.2" fill="#1a0808"/>
    <ellipse cx="4" cy="-55" rx="1.6" ry="1.2" fill="#1a0808"/>
    <ellipse cx="-4" cy="-56" rx="0.7" ry="0.7" fill="#080404"/>
    <ellipse cx="4" cy="-56" rx="0.7" ry="0.7" fill="#080404"/>
    <!-- Cool catch-light from cracked panels (front-lit). -->
    <circle cx="-4" cy="-56.5" r="0.5" fill="#dceaff"/>
    <circle cx="4" cy="-56.5" r="0.5" fill="#dceaff"/>
    <!-- Brow (set). -->
    <path d="M-7,-60 Q-4,-61 -1,-60" stroke="#3a1808" stroke-width="1" fill="none"/>
    <path d="M1,-60 Q4,-61 7,-60" stroke="#3a1808" stroke-width="1" fill="none"/>
    <!-- Nose. -->
    <path d="M0,-50 L-2,-44 L2,-44 Z" fill="#3a1808" opacity="0.5"/>
    <!-- Lips: set, decided. -->
    <line x1="-5" y1="-44" x2="5" y2="-44" stroke="#3a1808" stroke-width="1.3"/>
    <!-- Cheekbones w/ warm-right cool-left wash. -->
    <ellipse cx="-7" cy="-50" rx="3" ry="1.7" fill="#7a4830" opacity="0.5"/>
    <ellipse cx="8" cy="-50" rx="3" ry="1.7" fill="#a87850" opacity="0.6"/>
    <!-- Warm rim on hair from backlight. -->
    <path d="M-10,-63 Q0,-67 13,-63" fill="none" stroke="#f5b860" stroke-width="0.9" opacity="0.6"/>
  </g>

  <!-- Two SABLE balloons in upper area. Sable1 top-left (over Wren's bun), Sable2 below it. -->
  <g id="p19p1-dlg-sable1">
    <rect x="20" y="14" width="372" height="80" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="32" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="32" y="56" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">We're soldiers. This is a hostile</text>
    <text x="32" y="72" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">environment. We secure, we</text>
    <text x="32" y="88" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">assess, we adapt.</text>
    <path d="M340,94 L356,94 L420,140 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="340" y1="94" x2="356" y2="94" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g id="p19p1-dlg-sable2">
    <rect x="410" y="14" width="316" height="62" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="422" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="422" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">The drive is gone. We're not gone.</text>
    <text x="422" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">We work the problem.</text>
    <path d="M438,76 L456,76 L444,140 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="438" y1="76" x2="456" y2="76" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p19p1-meta">
    <text x="730" y="18" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="734" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE TAKES COMMAND</text>
  </g>
</svg>
