<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 550" width="247" height="550">
  <title>Issue 1 — Page 16 — Panel 1: Sable directing operations — worm's-eye command</title>
  <desc>Medium shot worm's-eye 35mm. Sable LOOMS dominant in frame, head near top, boots near bottom. Pointing decisively to roof-side wall with one hand. Behind her: dark sky + chimney stack towering above trailing smoke. Cracked suit panels at right shoulder bleed bright blue-white holo light. Silver-white cropped hair, dark brown skin, sharp focus, jaw set. Cool blue-white from cracked panels catches underside of jaw + silver hair. Warm amber from below lights suit waist-down. Authority in dual light. SABLE: "Thresh — perimeter. Jink — high ground, three-sixty scan. Nobody sleeps."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p16p1chimney" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p16p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p16p1silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dce0e8"/>
      <stop offset="50%" stop-color="#a0a8b4"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <radialGradient id="p16p1amber" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p16p1blueWhiteCrack">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#dce4ff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#7af0ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p16p1smokeAmber">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p16p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p16p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="247" height="550" fill="url(#p16p1sky)"/>

  <!-- Stars top. -->
  <g fill="#dce4f0" opacity="0.7">
    <circle cx="40" cy="22" r="0.6"/>
    <circle cx="80" cy="18" r="0.5"/>
    <circle cx="120" cy="32" r="0.6"/>
    <circle cx="220" cy="40" r="0.4"/>
    <circle cx="200" cy="14" r="0.5"/>
  </g>

  <!-- CHIMNEY STACK towering above (back, slight right of center). -->
  <g id="p16p1-chimney">
    <rect x="148" y="0" width="58" height="240" fill="url(#p16p1chimney)"/>
    <rect x="143" y="0" width="68" height="3" fill="#1a0808"/>
    <!-- Chimney pots crown. -->
    <rect x="152" y="-30" width="6" height="30" fill="#3a1810"/>
    <rect x="166" y="-34" width="6" height="34" fill="#3a1810"/>
    <rect x="180" y="-30" width="6" height="30" fill="#3a1810"/>
    <rect x="194" y="-32" width="6" height="32" fill="#3a1810"/>
    <!-- Brick courses. -->
    <g stroke="#080404" stroke-width="0.5" opacity="0.7">
      <line x1="148" y1="50" x2="206" y2="50"/>
      <line x1="148" y1="100" x2="206" y2="100"/>
      <line x1="148" y1="150" x2="206" y2="150"/>
      <line x1="148" y1="200" x2="206" y2="200"/>
      <line x1="160" y1="50" x2="160" y2="100"/>
      <line x1="180" y1="100" x2="180" y2="150"/>
      <line x1="160" y1="150" x2="160" y2="200"/>
      <line x1="190" y1="0" x2="190" y2="50"/>
    </g>
    <g fill="#080404" opacity="0.55">
      <path d="M158,30 Q163,150 156,230"/>
      <path d="M188,40 Q193,150 186,230"/>
    </g>
    <!-- SMOKE TRAIL backlit amber. -->
    <ellipse cx="178" cy="-50" rx="60" ry="22" fill="url(#p16p1smokeAmber)" filter="url(#p16p1strongBloom)"/>
    <ellipse cx="178" cy="-30" rx="44" ry="14" fill="#3a2818" opacity="0.55"/>
    <ellipse cx="178" cy="-15" rx="32" ry="10" fill="#a85820" opacity="0.5" filter="url(#p16p1bloom)"/>
  </g>

  <!-- DISTANT roof silhouette behind chimney (left). -->
  <g>
    <path d="M0,210 L40,200 L80,212 L120,206 L148,210 L148,260 L0,260 Z" fill="#0a0810" opacity="0.9"/>
    <rect x="40" y="194" width="3" height="6" fill="#080404"/>
    <rect x="100" y="206" width="3" height="6" fill="#080404"/>
  </g>

  <!-- GUTTER FLOOR (lower portion). -->
  <rect y="260" width="247" height="290" fill="url(#p16p1floor)"/>
  <ellipse cx="124" cy="550" rx="220" ry="140" fill="url(#p16p1amber)" filter="url(#p16p1strongBloom)" opacity="0.9"/>
  <g fill="#080404" opacity="0.7">
    <circle cx="40" cy="500" r="2"/>
    <circle cx="80" cy="540" r="1.5"/>
    <circle cx="180" cy="510" r="1.7"/>
    <circle cx="210" cy="540" r="2"/>
    <circle cx="20" cy="540" r="1.5"/>
  </g>
  <g fill="#5a3018" opacity="0.85">
    <path d="M30,520 Q40,514 50,522 Q46,530 34,528 Z"/>
    <path d="M180,525 Q190,520 200,528 L192,536 Z"/>
  </g>

  <!-- SABLE — LOOMING in frame, head near top, boots near bottom. Worm's-eye perspective makes her dominant. -->
  <g id="p16p1-sable" transform="translate(122, 290)">

    <!-- Lower legs (greaves) — wide stance, breaking bottom of frame. -->
    <path d="M-26,160 L-30,210 L-34,250" fill="none" stroke="#3a3a45" stroke-width="14" stroke-linecap="round"/>
    <path d="M26,160 L30,210 L34,250" fill="none" stroke="#3a3a45" stroke-width="14" stroke-linecap="round"/>
    <!-- Boot caps. -->
    <ellipse cx="-34" cy="252" rx="14" ry="4" fill="#080408"/>
    <ellipse cx="34" cy="252" rx="14" ry="4" fill="#080408"/>
    <!-- Warm amber catches lower legs (script: waist-down). -->
    <path d="M-26,160 L-30,210 L-34,250" fill="none" stroke="#f5b860" stroke-width="4" stroke-linecap="round" opacity="0.55" filter="url(#p16p1bloom)"/>
    <path d="M26,160 L30,210 L34,250" fill="none" stroke="#f5b860" stroke-width="4" stroke-linecap="round" opacity="0.55" filter="url(#p16p1bloom)"/>
    <!-- Greave plate detail. -->
    <ellipse cx="-30" cy="200" rx="9" ry="6" fill="#5a606a" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="30" cy="200" rx="9" ry="6" fill="#5a606a" stroke="#080408" stroke-width="0.5"/>

    <!-- Thighs (broader, perspective). -->
    <path d="M-22,80 L-26,160 L-2,160" fill="url(#p16p1silver)" stroke="#080408" stroke-width="0.8"/>
    <path d="M22,80 L26,160 L2,160" fill="url(#p16p1silver)" stroke="#080408" stroke-width="0.8"/>
    <!-- Hip belt. -->
    <rect x="-26" y="74" width="52" height="9" fill="#3a3a45" stroke="#080408" stroke-width="0.6"/>
    <rect x="-6" y="74" width="12" height="9" fill="#5a606a" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="0" cy="120" rx="28" ry="16" fill="#f5b860" opacity="0.4" filter="url(#p16p1bloom)"/>

    <!-- TORSO armored — broader for low-angle perspective. -->
    <path d="M-32,-30 Q-38,15 -26,72 L26,72 Q38,15 32,-30 L14,-44 L-14,-44 Z" fill="url(#p16p1silver)" stroke="#080408" stroke-width="0.9"/>
    <!-- Suit chest seam glow. -->
    <line x1="0" y1="-26" x2="0" y2="68" stroke="#dce4ff" stroke-width="0.9" opacity="0.85" filter="url(#p16p1bloom)"/>
    <line x1="-22" y1="-22" x2="-22" y2="55" stroke="#dce4ff" stroke-width="0.6" opacity="0.7" filter="url(#p16p1bloom)"/>
    <line x1="22" y1="-22" x2="22" y2="55" stroke="#dce4ff" stroke-width="0.6" opacity="0.7" filter="url(#p16p1bloom)"/>
    <!-- Chest plate band. -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#080408" stroke-width="0.7" opacity="0.85"/>
    <line x1="-32" y1="20" x2="32" y2="20" stroke="#080408" stroke-width="0.5" opacity="0.7"/>
    <ellipse cx="0" cy="10" rx="28" ry="18" fill="#dce4ff" opacity="0.18" filter="url(#p16p1strongBloom)"/>

    <!-- LEFT shoulder (intact). -->
    <ellipse cx="-32" cy="-28" rx="12" ry="7" fill="#a8a8b0" stroke="#080408" stroke-width="0.7"/>
    <ellipse cx="-32" cy="-30" rx="7" ry="3" fill="#dce4ff" opacity="0.7"/>

    <!-- RIGHT SHOULDER — CRACKED, bright blue-white bleed (script-specific). -->
    <ellipse cx="32" cy="-28" rx="12" ry="7" fill="#a8a8b0" stroke="#080408" stroke-width="0.7"/>
    <!-- BRIGHT halo bleeding through cracks. -->
    <ellipse cx="32" cy="-28" rx="22" ry="14" fill="url(#p16p1blueWhiteCrack)" filter="url(#p16p1deepBloom)" opacity="1"/>
    <!-- Fracture lines (visible through bright light). -->
    <g stroke="#080408" stroke-width="0.9" fill="none">
      <line x1="22" y1="-30" x2="42" y2="-22"/>
      <line x1="26" y1="-25" x2="42" y2="-26"/>
      <line x1="30" y1="-34" x2="34" y2="-22"/>
      <line x1="36" y1="-32" x2="32" y2="-20"/>
    </g>
    <!-- Bright crack core highlights. -->
    <g stroke="#ffffff" stroke-width="0.9" filter="url(#p16p1bloom)" opacity="1">
      <line x1="26" y1="-30" x2="36" y2="-25"/>
      <line x1="30" y1="-34" x2="32" y2="-26"/>
      <line x1="28" y1="-22" x2="38" y2="-26"/>
      <line x1="32" y1="-32" x2="34" y2="-22"/>
    </g>
    <!-- Particle sparks. -->
    <g fill="#dce4ff" filter="url(#p16p1bloom)">
      <circle cx="42" cy="-32" r="0.7"/>
      <circle cx="46" cy="-26" r="0.6"/>
      <circle cx="40" cy="-18" r="0.7"/>
      <circle cx="50" cy="-22" r="0.5"/>
    </g>

    <!-- LEFT arm — POINTING DECISIVELY toward upper-left (off-frame). -->
    <path d="M-32,-22 L-58,-18 L-86,-12 L-110,-8" fill="none" stroke="url(#p16p1silver)" stroke-width="9" stroke-linecap="round"/>
    <!-- Pointing hand (gauntleted). -->
    <ellipse cx="-110" cy="-8" rx="7" ry="4.5" fill="#5a606a" stroke="#080408" stroke-width="0.6"/>
    <!-- Index finger extended. -->
    <line x1="-110" y1="-8" x2="-128" y2="-12" stroke="#3a2818" stroke-width="4" stroke-linecap="round"/>
    <!-- Knuckle plates. -->
    <g fill="#a8a8b0" stroke="#080408" stroke-width="0.4">
      <rect x="-115" y="-12" width="3" height="3"/>
      <rect x="-112" y="-11" width="3" height="3"/>
    </g>

    <!-- RIGHT arm — at side, hand on hip. -->
    <path d="M32,-22 L42,15 L36,55" fill="none" stroke="url(#p16p1silver)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="36" cy="58" rx="7" ry="4.5" fill="#5a606a" stroke="#080408" stroke-width="0.6"/>

    <!-- HEAD — dark brown skin, sharp features, low-angle (chin prominent). -->
    <ellipse cx="0" cy="-72" rx="16" ry="17" fill="#5a3818"/>

    <!-- SILVER-WHITE CROPPED HAIR — buzz cap. -->
    <path d="M-14,-84 Q-3,-90 3,-90 Q14,-90 15,-80 L15,-66 L-14,-66 Z" fill="#c8ccd4"/>
    <g fill="#a8acb4" opacity="0.85">
      <circle cx="-9" cy="-86" r="0.6"/>
      <circle cx="-5" cy="-88" r="0.6"/>
      <circle cx="0" cy="-89" r="0.6"/>
      <circle cx="5" cy="-88" r="0.6"/>
      <circle cx="9" cy="-86" r="0.6"/>
      <circle cx="-10" cy="-82" r="0.5"/>
      <circle cx="-3" cy="-84" r="0.5"/>
      <circle cx="6" cy="-83" r="0.5"/>
    </g>
    <!-- Silver hair COOL CATCH (from cracked panels per script). -->
    <ellipse cx="0" cy="-86" rx="12" ry="2.5" fill="#dce4ff" opacity="0.7" filter="url(#p16p1bloom)"/>
    <!-- Cool catch right side of hair (closer to crack). -->
    <ellipse cx="9" cy="-83" rx="6" ry="2" fill="#7af0ff" opacity="0.55" filter="url(#p16p1bloom)"/>

    <!-- Forehead furrow. -->
    <path d="M-10,-76 Q-5,-79 -1,-76" stroke="#3a1810" stroke-width="0.6" fill="none"/>
    <path d="M1,-76 Q5,-79 10,-76" stroke="#3a1810" stroke-width="0.6" fill="none"/>
    <!-- Eyes (looking off-camera at her direction, sharp focus). -->
    <ellipse cx="-5" cy="-72" rx="2" ry="1.5" fill="#080404"/>
    <ellipse cx="6" cy="-72" rx="2" ry="1.5" fill="#080404"/>
    <circle cx="-5" cy="-73" r="0.6" fill="#dce4ff"/>
    <circle cx="6" cy="-73" r="0.6" fill="#dce4ff"/>
    <!-- Brow set hard. -->
    <path d="M-10,-78 Q-5,-81 -1,-78" stroke="#3a2810" stroke-width="1.2" fill="none"/>
    <path d="M1,-78 Q5,-81 10,-78" stroke="#3a2810" stroke-width="1.2" fill="none"/>
    <!-- Defined cheekbones. -->
    <ellipse cx="-10" cy="-64" rx="3.5" ry="1.6" fill="#3a2010" opacity="0.55"/>
    <ellipse cx="10" cy="-64" rx="3.5" ry="1.6" fill="#3a2010" opacity="0.55"/>
    <!-- Lips firm (commanding). -->
    <line x1="-3" y1="-58" x2="6" y2="-58" stroke="#3a1810" stroke-width="1.4"/>
    <!-- Jaw definition. -->
    <ellipse cx="-11" cy="-55" rx="3" ry="1.2" fill="#3a1810" opacity="0.55"/>
    <ellipse cx="11" cy="-55" rx="3" ry="1.2" fill="#3a1810" opacity="0.55"/>

    <!-- COOL BLUE-WHITE catch on UNDERSIDE of jaw (script-specific from cracked panels). -->
    <ellipse cx="0" cy="-52" rx="14" ry="3" fill="#dce4ff" opacity="0.55" filter="url(#p16p1bloom)"/>
    <!-- Stronger catch on right side (closer to crack source). -->
    <ellipse cx="8" cy="-50" rx="8" ry="2" fill="#7af0ff" opacity="0.55" filter="url(#p16p1bloom)"/>
    <!-- Cool catch under chin neck. -->
    <ellipse cx="0" cy="-46" rx="8" ry="2" fill="#7af0ff" opacity="0.4" filter="url(#p16p1bloom)"/>
  </g>

  <!-- SABLE dialogue — top of frame. -->
  <g id="p16p1-dlg-sable">
    <rect x="14" y="14" width="218" height="92" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="33" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="51" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Thresh — perimeter.</text>
    <text x="24" y="68" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Jink — high ground,</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">three-sixty scan.</text>
    <text x="24" y="101" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" font-style="italic" fill="#3a3030">Nobody sleeps.</text>
    <path d="M118,106 L136,106 L128,210 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="118" y1="106" x2="136" y2="106" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p16p1-meta">
    <text x="239" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="243" y="542" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE COMMAND</text>
  </g>
</svg>
