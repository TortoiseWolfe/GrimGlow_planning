<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 566" width="742" height="566">
  <title>Issue 1 — Page 5 — Panel 1: Victorian London roofscape, the city sleeps</title>
  <desc>Establishing wide at 24mm, eye level. Victorian London roofscape at night — dense forest of chimney pots, slate roofs, church spires, iron weathervanes silhouetted against deep blue-black sky. Fog hangs in layers between buildings, glowing amber from gaslight rising below. A few lit windows. A distant chimney plume. Sky vast, dark, clear. Entirely warm-lit world before the squad arrives. CAPTION: "The city sleeps. The gas burns low."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p5p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1228"/>
      <stop offset="50%" stop-color="#15203a"/>
      <stop offset="100%" stop-color="#3a3018"/>
    </linearGradient>
    <linearGradient id="p5p1fog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818" stop-opacity="0"/>
      <stop offset="40%" stop-color="#5a3a18" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#a8682a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c8783a" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="p5p1gasGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c87830" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p5p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#15080a"/>
    </linearGradient>
    <linearGradient id="p5p1slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1820"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="p5p1windowGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5a850" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="p5p1softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- Sky takes upper 50% (more vertical room for the cityscape). -->
  <g id="p5p1-sky">
    <rect width="742" height="566" fill="url(#p5p1sky)"/>
    <g fill="#dce4f0" opacity="0.85">
      <circle cx="68" cy="42" r="0.9"/>
      <circle cx="124" cy="28" r="0.7"/>
      <circle cx="186" cy="56" r="1.1"/>
      <circle cx="240" cy="22" r="0.8"/>
      <circle cx="298" cy="48" r="0.9"/>
      <circle cx="356" cy="34" r="1.3"/>
      <circle cx="408" cy="62" r="0.7"/>
      <circle cx="464" cy="28" r="1.0"/>
      <circle cx="522" cy="54" r="0.8"/>
      <circle cx="582" cy="32" r="0.9"/>
      <circle cx="638" cy="48" r="1.1"/>
      <circle cx="692" cy="22" r="0.7"/>
      <circle cx="42" cy="78" r="0.6"/>
      <circle cx="156" cy="92" r="0.7"/>
      <circle cx="278" cy="84" r="0.6"/>
      <circle cx="394" cy="98" r="0.7"/>
      <circle cx="512" cy="86" r="0.6"/>
      <circle cx="654" cy="94" r="0.7"/>
      <circle cx="100" cy="130" r="0.7"/>
      <circle cx="220" cy="140" r="0.6"/>
      <circle cx="340" cy="120" r="0.7"/>
      <circle cx="460" cy="135" r="0.6"/>
      <circle cx="580" cy="125" r="0.7"/>
      <circle cx="700" cy="140" r="0.6"/>
      <circle cx="160" cy="180" r="0.5"/>
      <circle cx="280" cy="200" r="0.6"/>
      <circle cx="420" cy="180" r="0.5"/>
      <circle cx="540" cy="200" r="0.6"/>
    </g>
    <g fill="#fff5d8" opacity="0.95">
      <circle cx="186" cy="56" r="1.6" filter="url(#p5p1softBloom)"/>
      <circle cx="356" cy="34" r="1.8" filter="url(#p5p1softBloom)"/>
      <circle cx="638" cy="48" r="1.6" filter="url(#p5p1softBloom)"/>
    </g>
  </g>

  <!-- Fog band. -->
  <g id="p5p1-fog-far">
    <rect y="340" width="742" height="226" fill="url(#p5p1fog)" opacity="0.85"/>
    <ellipse cx="120" cy="450" rx="80" ry="38" fill="url(#p5p1gasGlow)" filter="url(#p5p1bloom)"/>
    <ellipse cx="320" cy="475" rx="100" ry="42" fill="url(#p5p1gasGlow)" filter="url(#p5p1bloom)"/>
    <ellipse cx="520" cy="455" rx="80" ry="38" fill="url(#p5p1gasGlow)" filter="url(#p5p1bloom)"/>
    <ellipse cx="680" cy="465" rx="60" ry="34" fill="url(#p5p1gasGlow)" filter="url(#p5p1bloom)"/>
  </g>

  <!-- Distant rooftops + church spire. -->
  <g id="p5p1-roofs-far">
    <path d="M0,300 L40,290 L60,296 L90,282 L130,290 L160,278 L200,286 L230,272 L270,282 L310,268 L340,278 L380,264 L420,274 L460,260 L500,272 L540,258 L580,268 L620,254 L660,266 L700,252 L742,264 L742,340 L0,340 Z" fill="url(#p5p1slate)" opacity="0.85"/>

    <path d="M280,200 L290,180 L296,180 L300,160 L310,180 L316,180 L322,200 L322,300 L280,300 Z" fill="url(#p5p1slate)"/>
    <path d="M298,120 L302,120 L302,160 L298,160 Z" fill="url(#p5p1slate)"/>
    <line x1="300" y1="114" x2="300" y2="126" stroke="#1a1820" stroke-width="1.2"/>
    <line x1="296" y1="120" x2="304" y2="120" stroke="#1a1820" stroke-width="1.2"/>
    <rect x="296" y="220" width="8" height="20" fill="#3a2810" opacity="0.85"/>

    <ellipse cx="468" cy="260" rx="18" ry="48" fill="#3a2818" opacity="0.35" filter="url(#p5p1bloom)"/>
    <ellipse cx="476" cy="200" rx="14" ry="36" fill="#5a3a20" opacity="0.4" filter="url(#p5p1bloom)"/>
    <ellipse cx="482" cy="150" rx="10" ry="28" fill="#5a3a20" opacity="0.32" filter="url(#p5p1bloom)"/>
    <path d="M462,300 Q466,260 472,220 Q478,180 486,140" fill="none" stroke="#5a3a20" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- Mid-ground rooftops. -->
  <g id="p5p1-roofs-mid">
    <path d="M0,370 L30,358 L60,366 L90,352 L120,362 L160,348 L200,358 L240,344 L280,356 L320,340 L360,352 L400,336 L440,348 L480,332 L520,344 L560,328 L600,340 L640,324 L680,336 L720,320 L742,330 L742,400 L0,400 Z" fill="url(#p5p1brick)"/>

    <g id="p5p1-chimney-pots">
      <rect x="50" y="340" width="8" height="22" fill="#3a1810"/>
      <rect x="60" y="336" width="8" height="26" fill="#3a1810"/>
      <rect x="48" y="338" width="22" height="3" fill="#5a2812"/>
      <rect x="148" y="338" width="6" height="20" fill="#3a1810"/>
      <rect x="156" y="334" width="6" height="24" fill="#3a1810"/>
      <rect x="164" y="338" width="6" height="20" fill="#3a1810"/>
      <rect x="146" y="336" width="26" height="3" fill="#5a2812"/>
      <rect x="358" y="340" width="8" height="20" fill="#3a1810"/>
      <rect x="368" y="336" width="8" height="24" fill="#3a1810"/>
      <rect x="378" y="338" width="8" height="22" fill="#3a1810"/>
      <rect x="356" y="338" width="32" height="3" fill="#5a2812"/>
      <rect x="498" y="338" width="6" height="22" fill="#3a1810"/>
      <rect x="506" y="334" width="6" height="26" fill="#3a1810"/>
      <rect x="514" y="336" width="6" height="24" fill="#3a1810"/>
      <rect x="496" y="336" width="26" height="3" fill="#5a2812"/>
      <rect x="618" y="336" width="6" height="22" fill="#3a1810"/>
      <rect x="626" y="332" width="8" height="26" fill="#3a1810"/>
      <rect x="616" y="334" width="20" height="3" fill="#5a2812"/>
      <rect x="688" y="330" width="6" height="20" fill="#3a1810"/>
      <rect x="696" y="326" width="6" height="24" fill="#3a1810"/>
      <rect x="704" y="330" width="6" height="20" fill="#3a1810"/>
      <rect x="686" y="328" width="26" height="3" fill="#5a2812"/>
    </g>

    <g id="p5p1-weathervane" transform="translate(420, 320)">
      <line x1="0" y1="0" x2="0" y2="-32" stroke="#15080a" stroke-width="1.5"/>
      <line x1="-8" y1="-22" x2="8" y2="-22" stroke="#15080a" stroke-width="1"/>
      <text x="-7" y="-19" font-size="5" fill="#15080a">N</text>
      <text x="6" y="-19" font-size="5" fill="#15080a">S</text>
      <polygon points="-2,-32 2,-32 6,-26 4,-22 -4,-22 -6,-26" fill="#15080a"/>
    </g>

    <g id="p5p1-lit-windows">
      <ellipse cx="222" cy="380" rx="20" ry="13" fill="url(#p5p1windowGlow)" filter="url(#p5p1bloom)"/>
      <rect x="214" y="372" width="16" height="18" fill="#fff5d8" opacity="0.95"/>
      <line x1="222" y1="372" x2="222" y2="390" stroke="#3a1810" stroke-width="0.8"/>
      <line x1="214" y1="381" x2="230" y2="381" stroke="#3a1810" stroke-width="0.8"/>

      <ellipse cx="468" cy="372" rx="16" ry="11" fill="url(#p5p1windowGlow)" filter="url(#p5p1bloom)"/>
      <rect x="462" y="366" width="12" height="14" fill="#fff5d8" opacity="0.9"/>
      <line x1="468" y1="366" x2="468" y2="380" stroke="#3a1810" stroke-width="0.7"/>
      <line x1="462" y1="373" x2="474" y2="373" stroke="#3a1810" stroke-width="0.7"/>

      <ellipse cx="600" cy="384" rx="14" ry="10" fill="url(#p5p1windowGlow)" filter="url(#p5p1bloom)" opacity="0.85"/>
      <rect x="595" y="379" width="10" height="12" fill="#fff5d8" opacity="0.85"/>
      <line x1="600" y1="379" x2="600" y2="391" stroke="#3a1810" stroke-width="0.6"/>
      <line x1="595" y1="385" x2="605" y2="385" stroke="#3a1810" stroke-width="0.6"/>
    </g>
  </g>

  <!-- Foreground rooftops. -->
  <g id="p5p1-roofs-fg">
    <path d="M0,470 L80,458 L150,466 L220,456 L290,466 L360,454 L430,464 L500,452 L570,462 L640,452 L720,462 L742,458 L742,566 L0,566 Z" fill="#0a0408"/>

    <g id="p5p1-fg-chimneys">
      <rect x="60" y="430" width="50" height="40" fill="#1a0810"/>
      <rect x="64" y="406" width="10" height="28" fill="#3a1810"/>
      <rect x="76" y="400" width="10" height="34" fill="#3a1810"/>
      <rect x="88" y="404" width="10" height="30" fill="#3a1810"/>
      <rect x="100" y="408" width="10" height="26" fill="#3a1810"/>
      <rect x="62" y="404" width="50" height="4" fill="#5a2812"/>
      <line x1="68" y1="406" x2="68" y2="430" stroke="#0a0204" stroke-width="0.6" opacity="0.85"/>
      <line x1="80" y1="400" x2="80" y2="430" stroke="#0a0204" stroke-width="0.6" opacity="0.85"/>
      <line x1="92" y1="404" x2="92" y2="430" stroke="#0a0204" stroke-width="0.6" opacity="0.85"/>
      <line x1="104" y1="408" x2="104" y2="430" stroke="#0a0204" stroke-width="0.6" opacity="0.85"/>
    </g>

    <g id="p5p1-fg-chimney-right">
      <rect x="660" y="390" width="32" height="80" fill="#1a0810"/>
      <rect x="664" y="370" width="8" height="22" fill="#3a1810"/>
      <rect x="676" y="366" width="8" height="26" fill="#3a1810"/>
      <rect x="660" y="372" width="32" height="3" fill="#5a2812"/>
      <path d="M668,366 Q670,348 666,332 Q672,320 670,306" fill="none" stroke="#3a2818" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Caption. -->
  <g id="p5p1-caption">
    <rect x="20" y="20" width="220" height="50" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="30" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="30" y="58" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">The city sleeps. The gas burns low.</text>
  </g>

  <g id="p5p1-meta">
    <text x="730" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="734" y="558" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">WIDE</text>
  </g>
</svg>
