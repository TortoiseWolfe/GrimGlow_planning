<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 400" width="366" height="400">
  <title>Issue 1 — Page 11 — Panel 2: Wings deploy — fairy tech as spectacle</title>
  <desc>CU 85mm tight, eye level. Wing-pack panels unfold from housing between shoulders — translucent dragonfly wings extending outward. Structure = lattice of brilliant emerald geometric light, prismatic + precise. Wings cast emerald-green geometric lattice-pattern shadows on surrounding cast-iron gutter walls + curls. Strongest holographic light in scene, overwhelming fading wreckage + pushing back warm amber. Silent.</desc>

  <defs>
    <linearGradient id="p11p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p11p2iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="p11p2bigEmeraldHalo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a8f5c8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a5a30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p2wingFill" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#5af5a0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="p11p2emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a5a30"/>
    </linearGradient>
    <linearGradient id="p11p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87850"/>
      <stop offset="100%" stop-color="#d8b890"/>
    </linearGradient>
    <filter id="p11p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p11p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Background. -->
  <rect width="366" height="400" fill="url(#p11p2bg)"/>

  <!-- Curved gutter wall back (catching emerald lattice shadows). -->
  <path d="M0,40 Q183,20 366,40 L366,360 L0,360 Z" fill="url(#p11p2iron)"/>
  <line x1="0" y1="80" x2="366" y2="60" stroke="#080404" stroke-width="0.6" opacity="0.7"/>
  <line x1="0" y1="200" x2="366" y2="195" stroke="#080404" stroke-width="0.6" opacity="0.7"/>
  <line x1="0" y1="320" x2="366" y2="318" stroke="#080404" stroke-width="0.6" opacity="0.7"/>
  <g fill="#080404" opacity="0.85">
    <circle cx="50" cy="85" r="2"/>
    <circle cx="316" cy="85" r="2"/>
    <circle cx="50" cy="205" r="2"/>
    <circle cx="316" cy="200" r="2"/>
  </g>

  <!-- Big emerald halo from wings — dominates panel. -->
  <ellipse cx="183" cy="210" rx="240" ry="200" fill="url(#p11p2bigEmeraldHalo)" filter="url(#p11p2strongBloom)" opacity="0.85"/>

  <!-- EMERALD LATTICE-PATTERN SHADOWS cast on gutter walls (script-specific). -->
  <g id="p11p2-lattice-shadows" stroke="#a8f5c8" stroke-width="0.6" fill="none" opacity="0.55">
    <!-- Diagonal lattice on left wall. -->
    <line x1="20" y1="80" x2="60" y2="120"/>
    <line x1="20" y1="120" x2="60" y2="160"/>
    <line x1="20" y1="160" x2="60" y2="200"/>
    <line x1="20" y1="200" x2="60" y2="240"/>
    <line x1="20" y1="240" x2="60" y2="280"/>
    <line x1="20" y1="80" x2="60" y2="40"/>
    <line x1="20" y1="120" x2="60" y2="80"/>
    <line x1="20" y1="160" x2="60" y2="120"/>
    <line x1="20" y1="200" x2="60" y2="160"/>
    <line x1="20" y1="240" x2="60" y2="200"/>
    <line x1="20" y1="280" x2="60" y2="240"/>
    <!-- Right wall lattice. -->
    <line x1="346" y1="80" x2="306" y2="120"/>
    <line x1="346" y1="120" x2="306" y2="160"/>
    <line x1="346" y1="160" x2="306" y2="200"/>
    <line x1="346" y1="200" x2="306" y2="240"/>
    <line x1="346" y1="240" x2="306" y2="280"/>
    <line x1="346" y1="80" x2="306" y2="40"/>
    <line x1="346" y1="120" x2="306" y2="80"/>
    <line x1="346" y1="160" x2="306" y2="120"/>
    <line x1="346" y1="200" x2="306" y2="160"/>
    <line x1="346" y1="240" x2="306" y2="200"/>
    <line x1="346" y1="280" x2="306" y2="240"/>
  </g>

  <!-- WINGS — translucent dragonfly form, fully extended (4 wing panels: 2 upper + 2 lower). -->
  <g id="p11p2-wings" filter="url(#p11p2bloom)">
    <!-- Upper-left wing. -->
    <path d="M-20,0 Q-90,-90 -160,-50 Q-180,-15 -130,5 Q-70,8 -25,-5 Z" fill="url(#p11p2wingFill)" opacity="0.65" transform="translate(183, 200)"/>
    <!-- Upper-right wing. -->
    <path d="M20,0 Q90,-90 160,-50 Q180,-15 130,5 Q70,8 25,-5 Z" fill="url(#p11p2wingFill)" opacity="0.65" transform="translate(183, 200)"/>
    <!-- Lower-left wing. -->
    <path d="M-15,15 Q-70,30 -130,75 Q-145,95 -100,90 Q-55,75 -25,30 Z" fill="url(#p11p2wingFill)" opacity="0.55" transform="translate(183, 200)"/>
    <!-- Lower-right wing. -->
    <path d="M15,15 Q70,30 130,75 Q145,95 100,90 Q55,75 25,30 Z" fill="url(#p11p2wingFill)" opacity="0.55" transform="translate(183, 200)"/>
  </g>

  <!-- WING LATTICE veins (geometric structure). -->
  <g id="p11p2-wing-lattice" stroke="#bfffe0" stroke-width="0.7" fill="none" opacity="0.85" transform="translate(183, 200)">
    <!-- Upper-left primary veins. -->
    <line x1="-25" y1="-5" x2="-60" y2="-25"/>
    <line x1="-25" y1="-5" x2="-90" y2="-50"/>
    <line x1="-25" y1="-5" x2="-130" y2="-50"/>
    <line x1="-25" y1="-5" x2="-160" y2="-30"/>
    <line x1="-25" y1="-5" x2="-130" y2="0"/>
    <!-- Cross veins. -->
    <line x1="-50" y1="-30" x2="-55" y2="-5"/>
    <line x1="-80" y1="-50" x2="-85" y2="-15"/>
    <line x1="-110" y1="-55" x2="-115" y2="-15"/>
    <line x1="-140" y1="-50" x2="-145" y2="-15"/>
    <!-- Upper-right mirrored. -->
    <line x1="25" y1="-5" x2="60" y2="-25"/>
    <line x1="25" y1="-5" x2="90" y2="-50"/>
    <line x1="25" y1="-5" x2="130" y2="-50"/>
    <line x1="25" y1="-5" x2="160" y2="-30"/>
    <line x1="25" y1="-5" x2="130" y2="0"/>
    <line x1="50" y1="-30" x2="55" y2="-5"/>
    <line x1="80" y1="-50" x2="85" y2="-15"/>
    <line x1="110" y1="-55" x2="115" y2="-15"/>
    <line x1="140" y1="-50" x2="145" y2="-15"/>
    <!-- Lower wing veins. -->
    <line x1="-20" y1="20" x2="-60" y2="40"/>
    <line x1="-20" y1="20" x2="-100" y2="60"/>
    <line x1="-20" y1="20" x2="-130" y2="75"/>
    <line x1="-20" y1="20" x2="-100" y2="90"/>
    <line x1="20" y1="20" x2="60" y2="40"/>
    <line x1="20" y1="20" x2="100" y2="60"/>
    <line x1="20" y1="20" x2="130" y2="75"/>
    <line x1="20" y1="20" x2="100" y2="90"/>
  </g>

  <!-- Bright leading edge highlights on wings. -->
  <g stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.85" filter="url(#p11p2bloom)" transform="translate(183, 200)">
    <path d="M-20,0 Q-90,-90 -160,-50"/>
    <path d="M20,0 Q90,-90 160,-50"/>
    <path d="M-15,15 Q-70,30 -130,75"/>
    <path d="M15,15 Q70,30 130,75"/>
  </g>

  <!-- WING-PACK HOUSING (between shoulder blades — opening, panels deployed). -->
  <g id="p11p2-pack" transform="translate(183, 200)">
    <rect x="-12" y="-15" width="24" height="30" rx="2" fill="#1a4828" stroke="#080408" stroke-width="0.7"/>
    <!-- Side panels open. -->
    <path d="M-12,-15 L-22,-25 L-18,5" fill="#0a5a30" stroke="#080408" stroke-width="0.6"/>
    <path d="M12,-15 L22,-25 L18,5" fill="#0a5a30" stroke="#080408" stroke-width="0.6"/>
    <!-- Bright pulsing nodes. -->
    <circle cx="-6" cy="-6" r="1.5" fill="#bfffe0" filter="url(#p11p2bloom)" opacity="0.95"/>
    <circle cx="6" cy="-6" r="1.5" fill="#bfffe0" filter="url(#p11p2bloom)" opacity="0.95"/>
    <circle cx="0" cy="6" r="1.7" fill="#bfffe0" filter="url(#p11p2bloom)" opacity="0.95"/>
  </g>

  <!-- JINK BACK VIEW (partial — back of body, head, curls). -->
  <g id="p11p2-jink-back" transform="translate(183, 245)">
    <!-- Body back silhouette in emerald. -->
    <path d="M-22,80 Q-26,30 -22,-15 L-12,-25 L18,-25 Q22,-15 22,80 Z" fill="url(#p11p2emerald)" stroke="#080408" stroke-width="0.7"/>
    <!-- Shoulders. -->
    <ellipse cx="-22" cy="-22" rx="7" ry="4" fill="#2ed078" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="22" cy="-22" rx="7" ry="4" fill="#2ed078" stroke="#080408" stroke-width="0.5"/>
    <!-- Body emerald wash from wings. -->
    <ellipse cx="0" cy="0" rx="22" ry="35" fill="#a8f5c8" opacity="0.25"/>

    <!-- Arms slightly out (preparing to fly). -->
    <path d="M-22,-12 L-32,-2 L-30,15" fill="none" stroke="#2ed078" stroke-width="5" stroke-linecap="round"/>
    <path d="M22,-12 L32,-2 L30,15" fill="none" stroke="#2ed078" stroke-width="5" stroke-linecap="round"/>

    <!-- Legs. -->
    <path d="M-12,80 L-18,108 L-18,135" fill="none" stroke="#0a5a30" stroke-width="7" stroke-linecap="round"/>
    <path d="M14,80 L18,108 L18,135" fill="none" stroke="#0a5a30" stroke-width="7" stroke-linecap="round"/>

    <!-- HEAD back view w/ wild curls. -->
    <ellipse cx="0" cy="-44" rx="13" ry="14" fill="url(#p11p2skin)"/>
    <g fill="#f5d068">
      <ellipse cx="0" cy="-58" rx="11" ry="8"/>
      <ellipse cx="-8" cy="-54" rx="8" ry="6"/>
      <ellipse cx="8" cy="-54" rx="8" ry="6"/>
      <ellipse cx="-3" cy="-65" rx="6" ry="4.5"/>
      <ellipse cx="9" cy="-65" rx="6" ry="4.5"/>
      <ellipse cx="-13" cy="-58" rx="5" ry="4"/>
      <ellipse cx="13" cy="-58" rx="5" ry="4"/>
    </g>
    <!-- EMERALD LATTICE-PATTERN SHADOWS cast on UNDERSIDE OF CURLS (script-specific). -->
    <g stroke="#5af5a0" stroke-width="0.5" fill="none" opacity="0.7">
      <line x1="-8" y1="-50" x2="-2" y2="-46"/>
      <line x1="2" y1="-46" x2="8" y2="-50"/>
      <line x1="-12" y1="-54" x2="-6" y2="-50"/>
      <line x1="6" y1="-50" x2="12" y2="-54"/>
    </g>
    <!-- Curl glints. -->
    <g fill="#fff5d0" opacity="0.85">
      <circle cx="-3" cy="-58" r="0.6"/>
      <circle cx="6" cy="-55" r="0.5"/>
    </g>
  </g>

  <!-- Meta tag. -->
  <g id="p11p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="362" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">WINGS DEPLOY</text>
  </g>
</svg>
