<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 420" width="366" height="420">
  <title>Issue 1 — Page 13 — Panel 4: Moss as forest at fairy scale</title>
  <desc>CU slight high angle (Luma scanner POV). Moss fronds standing like fern trees, stalks thick as wrist, capsules like seed pods on tall stems. Fist-sized water droplets clinging to fronds catching prismatic reflections. Through forest: pitted oxidized iron landscape. Blue-violet scanner beam cuts through casting structured geometric patterns on fronds + droplets. Warm amber from city-glow backlights moss capsules at tops making them glow amber-green. Biology at scale that transforms mundane to magnificent. Silent.</desc>

  <defs>
    <linearGradient id="p13p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p13p4iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="p13p4cityBacklit" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p13p4mossStalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a8048"/>
      <stop offset="100%" stop-color="#2a4830"/>
    </linearGradient>
    <radialGradient id="p13p4mossCapsule" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a8c878" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4a8048" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="p13p4droplet" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#dceaff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="p13p4scannerBeam" cx="50%" cy="0%">
      <stop offset="0%" stop-color="#a87af0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2acc" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p13p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Background. -->
  <rect width="366" height="420" fill="url(#p13p4bg)"/>

  <!-- IRON LANDSCAPE — pitted, oxidized terrain visible behind/below moss. -->
  <rect y="280" width="366" height="140" fill="url(#p13p4iron)"/>
  <line x1="0" y1="280" x2="366" y2="280" stroke="#080404" stroke-width="0.7"/>
  <!-- Iron pits + oxidation patches. -->
  <g fill="#080404" opacity="0.85">
    <ellipse cx="40" cy="320" rx="14" ry="3"/>
    <ellipse cx="100" cy="340" rx="10" ry="2.5"/>
    <ellipse cx="160" cy="330" rx="12" ry="3"/>
    <ellipse cx="220" cy="350" rx="14" ry="3.5"/>
    <ellipse cx="280" cy="335" rx="10" ry="2.5"/>
    <ellipse cx="320" cy="360" rx="12" ry="3"/>
  </g>
  <!-- Green oxidation patches. -->
  <g fill="#4a6038" opacity="0.65">
    <ellipse cx="60" cy="365" rx="20" ry="5"/>
    <ellipse cx="180" cy="380" rx="25" ry="6"/>
    <ellipse cx="290" cy="385" rx="22" ry="5"/>
  </g>
  <!-- Coal grit individual granules. -->
  <g fill="#080404" opacity="0.7">
    <circle cx="30" cy="305" r="1"/>
    <circle cx="70" cy="315" r="1.2"/>
    <circle cx="120" cy="310" r="1"/>
    <circle cx="180" cy="320" r="1.3"/>
    <circle cx="250" cy="315" r="1"/>
    <circle cx="310" cy="320" r="1.2"/>
    <circle cx="50" cy="380" r="1"/>
    <circle cx="150" cy="395" r="1.2"/>
    <circle cx="250" cy="380" r="1"/>
  </g>

  <!-- WARM AMBER BACKLIGHT (city-glow from beyond gutter — backlights moss capsules). -->
  <ellipse cx="183" cy="0" rx="280" ry="80" fill="url(#p13p4cityBacklit)" filter="url(#p13p4strongBloom)"/>

  <!-- BLUE-VIOLET SCANNER BEAM cutting through from above (script-specific). -->
  <ellipse cx="183" cy="50" rx="200" ry="120" fill="url(#p13p4scannerBeam)" filter="url(#p13p4strongBloom)" opacity="0.85"/>
  <!-- Beam edges (diagonal rays). -->
  <g stroke="#a87af0" stroke-width="0.7" fill="none" opacity="0.65" filter="url(#p13p4bloom)">
    <line x1="183" y1="0" x2="80" y2="240"/>
    <line x1="183" y1="0" x2="120" y2="240"/>
    <line x1="183" y1="0" x2="246" y2="240"/>
    <line x1="183" y1="0" x2="286" y2="240"/>
  </g>
  <!-- Geometric pattern overlay on beam. -->
  <g stroke="#bfb0ff" stroke-width="0.5" fill="none" opacity="0.7" filter="url(#p13p4bloom)">
    <line x1="80" y1="100" x2="286" y2="100"/>
    <line x1="100" y1="160" x2="266" y2="160"/>
    <line x1="120" y1="220" x2="246" y2="220"/>
  </g>

  <!-- MOSS FRONDS — like fern trees. Stalks + capsule tops + water droplets. -->
  <g id="p13p4-moss-forest">

    <!-- Frond 1 (left, tall). -->
    <rect x="46" y="170" width="6" height="120" fill="url(#p13p4mossStalk)" rx="2"/>
    <line x1="48" y1="170" x2="48" y2="290" stroke="#a8c878" stroke-width="0.6" opacity="0.6"/>
    <ellipse cx="49" cy="166" rx="11" ry="14" fill="url(#p13p4mossCapsule)" filter="url(#p13p4bloom)"/>
    <ellipse cx="46" cy="160" rx="3" ry="5" fill="#c8d878" opacity="0.7"/>
    <!-- Amber backlight on capsule top. -->
    <ellipse cx="49" cy="156" rx="7" ry="3" fill="#f5d068" opacity="0.55" filter="url(#p13p4bloom)"/>
    <!-- Water droplet clinging mid-stalk. -->
    <ellipse cx="55" cy="220" rx="5" ry="6" fill="url(#p13p4droplet)" filter="url(#p13p4bloom)"/>
    <ellipse cx="55" cy="218" rx="2" ry="2.5" fill="#ffffff" opacity="0.95"/>
    <!-- Side foliage (small offshoots). -->
    <path d="M52,200 L62,205 L60,212" fill="url(#p13p4mossStalk)" stroke="#2a4830" stroke-width="0.4"/>
    <path d="M48,250 L40,255 L42,262" fill="url(#p13p4mossStalk)" stroke="#2a4830" stroke-width="0.4"/>

    <!-- Frond 2 (left-center, slight lean). -->
    <rect x="98" y="190" width="5" height="100" fill="url(#p13p4mossStalk)" rx="2"/>
    <line x1="100" y1="190" x2="100" y2="290" stroke="#a8c878" stroke-width="0.5" opacity="0.6"/>
    <ellipse cx="101" cy="186" rx="10" ry="13" fill="url(#p13p4mossCapsule)" filter="url(#p13p4bloom)"/>
    <ellipse cx="98" cy="180" rx="3" ry="4.5" fill="#c8d878" opacity="0.7"/>
    <ellipse cx="101" cy="178" rx="6" ry="3" fill="#f5d068" opacity="0.55" filter="url(#p13p4bloom)"/>
    <!-- Droplet. -->
    <ellipse cx="106" cy="240" rx="4.5" ry="5" fill="url(#p13p4droplet)" filter="url(#p13p4bloom)"/>
    <ellipse cx="106" cy="238" rx="1.7" ry="2" fill="#ffffff" opacity="0.95"/>

    <!-- Frond 3 (center, tallest, hero). -->
    <rect x="155" y="160" width="7" height="130" fill="url(#p13p4mossStalk)" rx="2"/>
    <line x1="158" y1="160" x2="158" y2="290" stroke="#a8c878" stroke-width="0.7" opacity="0.7"/>
    <ellipse cx="159" cy="156" rx="13" ry="16" fill="url(#p13p4mossCapsule)" filter="url(#p13p4bloom)"/>
    <ellipse cx="156" cy="148" rx="3.5" ry="5.5" fill="#c8d878" opacity="0.75"/>
    <ellipse cx="159" cy="144" rx="9" ry="4" fill="#f5d068" opacity="0.65" filter="url(#p13p4bloom)"/>
    <!-- Water droplets — multiple, prismatic. -->
    <ellipse cx="166" cy="200" rx="6" ry="7" fill="url(#p13p4droplet)" filter="url(#p13p4bloom)"/>
    <ellipse cx="166" cy="197" rx="2.5" ry="3" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="151" cy="240" rx="5" ry="6" fill="url(#p13p4droplet)" filter="url(#p13p4bloom)"/>
    <ellipse cx="151" cy="238" rx="2" ry="2.5" fill="#ffffff" opacity="0.95"/>
    <!-- Side branches. -->
    <path d="M161,180 L172,185 L170,193" fill="url(#p13p4mossStalk)" stroke="#2a4830" stroke-width="0.4"/>
    <path d="M156,210 L145,215 L147,223" fill="url(#p13p4mossStalk)" stroke="#2a4830" stroke-width="0.4"/>
    <path d="M161,260 L172,265 L170,273" fill="url(#p13p4mossStalk)" stroke="#2a4830" stroke-width="0.4"/>

    <!-- Frond 4 (right-center). -->
    <rect x="210" y="180" width="6" height="110" fill="url(#p13p4mossStalk)" rx="2"/>
    <line x1="213" y1="180" x2="213" y2="290" stroke="#a8c878" stroke-width="0.6" opacity="0.6"/>
    <ellipse cx="213" cy="176" rx="11" ry="14" fill="url(#p13p4mossCapsule)" filter="url(#p13p4bloom)"/>
    <ellipse cx="210" cy="170" rx="3" ry="5" fill="#c8d878" opacity="0.7"/>
    <ellipse cx="213" cy="166" rx="7" ry="3" fill="#f5d068" opacity="0.55" filter="url(#p13p4bloom)"/>
    <!-- Droplet. -->
    <ellipse cx="220" cy="225" rx="5" ry="6" fill="url(#p13p4droplet)" filter="url(#p13p4bloom)"/>
    <ellipse cx="220" cy="223" rx="2" ry="2.5" fill="#ffffff" opacity="0.95"/>

    <!-- Frond 5 (right). -->
    <rect x="270" y="200" width="5" height="90" fill="url(#p13p4mossStalk)" rx="2"/>
    <line x1="272" y1="200" x2="272" y2="290" stroke="#a8c878" stroke-width="0.5" opacity="0.6"/>
    <ellipse cx="273" cy="196" rx="10" ry="12" fill="url(#p13p4mossCapsule)" filter="url(#p13p4bloom)"/>
    <ellipse cx="270" cy="190" rx="3" ry="4" fill="#c8d878" opacity="0.7"/>
    <ellipse cx="273" cy="188" rx="6" ry="2.5" fill="#f5d068" opacity="0.55" filter="url(#p13p4bloom)"/>
    <ellipse cx="278" cy="245" rx="4.5" ry="5" fill="url(#p13p4droplet)" filter="url(#p13p4bloom)"/>
    <ellipse cx="278" cy="243" rx="1.7" ry="2" fill="#ffffff" opacity="0.95"/>

    <!-- Frond 6 (far right, smallest). -->
    <rect x="316" y="220" width="4" height="70" fill="url(#p13p4mossStalk)" rx="2"/>
    <ellipse cx="318" cy="216" rx="8" ry="10" fill="url(#p13p4mossCapsule)" filter="url(#p13p4bloom)"/>
    <ellipse cx="316" cy="212" rx="2.5" ry="3.5" fill="#c8d878" opacity="0.7"/>
    <ellipse cx="318" cy="208" rx="5" ry="2" fill="#f5d068" opacity="0.55" filter="url(#p13p4bloom)"/>
  </g>

  <!-- Geometric scanner pattern shadows on droplets (catching beam light). -->
  <g stroke="#bfb0ff" stroke-width="0.4" opacity="0.65" fill="none">
    <line x1="55" y1="217" x2="60" y2="223"/>
    <line x1="106" y1="237" x2="111" y2="243"/>
    <line x1="166" y1="197" x2="172" y2="203"/>
    <line x1="151" y1="237" x2="156" y2="243"/>
    <line x1="220" y1="222" x2="225" y2="228"/>
    <line x1="278" y1="242" x2="283" y2="248"/>
  </g>

  <!-- Meta tag. -->
  <g id="p13p4-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">4</text>
    <text x="362" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">MOSS AS FOREST</text>
  </g>
</svg>
