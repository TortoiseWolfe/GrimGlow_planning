<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 1 — Page 10 — Panel 3: Squad assembled — Wren delivers damage report</title>
  <desc>Medium wide eye level (35mm). All 5 squad in gutter. Sable+Wren right at main wreckage section. Thresh wall-left isolated arm-close watching weapon-hand. Jink center-attentive on dead leaf. Luma between scanner-in-hand divided. Cool wreckage fading + warm amber growing — alien light losing to Victorian. WREN long damage report + SABLE "What do you need?" + WREN "More than we have."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p3iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p10p3floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#180a08"/>
    </linearGradient>
    <radialGradient id="p10p3coolFade" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p3warmGrow" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p3warmEdge" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p10p3silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfc6d0"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p10p3copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <linearGradient id="p10p3sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5af0"/>
      <stop offset="100%" stop-color="#2a18a0"/>
    </linearGradient>
    <linearGradient id="p10p3ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <linearGradient id="p10p3emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a5a30"/>
    </linearGradient>
    <linearGradient id="p10p3leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a2008"/>
    </linearGradient>
    <filter id="p10p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p10p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Background. -->
  <rect width="742" height="300" fill="#0a0408"/>

  <!-- Curved gutter wall back. -->
  <path d="M0,40 Q371,18 742,40 L742,220 L0,220 Z" fill="url(#p10p3iron)"/>
  <line x1="0" y1="80" x2="742" y2="60" stroke="#080404" stroke-width="0.7" opacity="0.7"/>
  <line x1="0" y1="160" x2="742" y2="155" stroke="#080404" stroke-width="0.7" opacity="0.7"/>
  <g fill="#080404" opacity="0.85">
    <circle cx="60" cy="85" r="2"/>
    <circle cx="200" cy="68" r="2"/>
    <circle cx="540" cy="68" r="2"/>
    <circle cx="680" cy="85" r="2"/>
    <circle cx="60" cy="165" r="2"/>
    <circle cx="680" cy="165" r="2"/>
  </g>
  <g fill="#080404" opacity="0.55">
    <path d="M40,40 Q44,140 38,200"/>
    <path d="M280,40 Q284,140 278,200"/>
    <path d="M520,40 Q524,140 518,200"/>
    <path d="M698,40 Q702,140 696,200"/>
  </g>

  <!-- Cool wreckage glow on RIGHT (where Sable+Wren are at main wreck) — fading. -->
  <ellipse cx="600" cy="200" rx="160" ry="120" fill="url(#p10p3coolFade)" filter="url(#p10p3strongBloom)"/>

  <!-- Warm amber from city-glow creeping in from LEFT and BG (growing stronger). -->
  <ellipse cx="0" cy="200" rx="200" ry="120" fill="url(#p10p3warmGrow)" filter="url(#p10p3strongBloom)"/>
  <!-- Warm rim along bottom-edge. -->
  <ellipse cx="371" cy="280" rx="380" ry="40" fill="url(#p10p3warmEdge)" filter="url(#p10p3bloom)" opacity="0.7"/>

  <!-- Floor. -->
  <rect y="220" width="742" height="80" fill="url(#p10p3floor)"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#080404" stroke-width="1.2"/>

  <!-- Coal sediment + dead leaf scattered. -->
  <g fill="#080404" opacity="0.7">
    <circle cx="40" cy="252" r="1.6"/>
    <circle cx="120" cy="270" r="1.5"/>
    <circle cx="220" cy="258" r="1.6"/>
    <circle cx="320" cy="280" r="1.4"/>
    <circle cx="420" cy="258" r="1.5"/>
    <circle cx="540" cy="270" r="1.4"/>
    <circle cx="640" cy="280" r="1.6"/>
    <circle cx="60" cy="290" r="1.4"/>
    <circle cx="180" cy="288" r="1.5"/>
    <circle cx="450" cy="288" r="1.5"/>
  </g>

  <!-- LARGE WRECKAGE on RIGHT (the main hull section Wren is at). -->
  <g id="p10p3-wreckage" transform="translate(600, 220)">
    <path d="M-70,-30 L40,-50 L70,30 L40,60 L-50,60 L-80,10 Z" fill="#1a1a24" stroke="#080808" stroke-width="0.8"/>
    <ellipse cx="-10" cy="0" rx="40" ry="20" fill="#080404"/>
    <ellipse cx="-10" cy="0" rx="22" ry="10" fill="#5a808c" opacity="0.75"/>
    <ellipse cx="-10" cy="0" rx="20" ry="8" fill="#bfe4ff" filter="url(#p10p3bloom)" opacity="0.65"/>
    <!-- Faint flicker. -->
    <circle cx="-12" cy="-2" r="0.9" fill="#ffffff" filter="url(#p10p3bloom)"/>
  </g>
  <!-- Dead leaf bottom-left where Jink sits. -->
  <g id="p10p3-leaf-jink" transform="translate(380, 250)">
    <path d="M-30,18 Q-38,-8 -18,-22 Q5,-25 22,-15 Q32,5 22,20 Q5,25 -30,18 Z" fill="url(#p10p3leaf)" opacity="0.95"/>
    <path d="M-28,14 Q0,-12 22,-15" stroke="#3a1808" stroke-width="0.8" fill="none" opacity="0.7"/>
  </g>

  <!-- ============== 5 squad members ============== -->

  <!-- THRESH — sitting against gutter wall far-left (isolated, arm close, weapon hand). -->
  <g id="p10p3-thresh" transform="translate(80, 240)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p10p3ruby)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#dc2030" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#a8182a" stroke="#080408" stroke-width="0.4"/>
    <!-- Left arm held close (script: arm close). -->
    <path d="M-13,-8 L-9,15 L-12,30" fill="none" stroke="#a8182a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right arm to weapon. -->
    <path d="M13,-8 L15,12 L8,28" fill="none" stroke="url(#p10p3ruby)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Weapon resting beside leg. -->
    <rect x="0" y="28" width="16" height="3" rx="1" fill="#1a1820" stroke="#080404" stroke-width="0.4"/>
    <line x1="2" y1="29.5" x2="14" y2="29.5" stroke="#dc2030" stroke-width="0.4" opacity="0.85"/>
    <!-- Hand on weapon. -->
    <ellipse cx="8" cy="28" rx="2.5" ry="1.7" fill="#d8a880"/>
    <!-- Drawn-up legs. -->
    <path d="M-10,30 L-12,45 L-13,58" fill="none" stroke="#a8182a" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,30 L12,45 L13,58" fill="none" stroke="#a8182a" stroke-width="5" stroke-linecap="round"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#d8a880"/>
    <path d="M-7,-37 Q-2,-42 4,-40 L4,-32 L-7,-32 Z" fill="#a83a18"/>
    <!-- Eyes neutral, watching forward. -->
    <ellipse cx="-2" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-23" x2="3" y2="-23" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Faint warm catch (warm growing on left). -->
    <ellipse cx="-7" cy="-30" rx="2" ry="1.5" fill="#f5b860" opacity="0.5"/>
  </g>

  <!-- JINK — sitting forward on dead leaf, attentive, mid-frame. -->
  <g id="p10p3-jink" transform="translate(380, 218)">
    <path d="M-12,30 Q-15,5 -12,-15 L-2,-22 L12,-22 Q15,5 12,30 Z" fill="url(#p10p3emerald)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-12" cy="-19" rx="5" ry="3" fill="#2ed078" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="12" cy="-19" rx="5" ry="3" fill="#2ed078" stroke="#080408" stroke-width="0.4"/>
    <!-- Arms forward (sitting up forward, listening). -->
    <path d="M-12,-5 L-18,5 L-22,15" fill="none" stroke="#2ed078" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M12,-5 L18,5 L22,15" fill="none" stroke="#2ed078" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Legs stretched out (sitting on leaf). -->
    <path d="M-9,30 L-12,52 L-9,72" fill="none" stroke="#0a5a30" stroke-width="5" stroke-linecap="round"/>
    <path d="M9,30 L12,52 L9,72" fill="none" stroke="#0a5a30" stroke-width="5" stroke-linecap="round"/>
    <!-- Head w/ golden curls. -->
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#d8b890"/>
    <g fill="#f5d068">
      <circle cx="-4" cy="-37" r="3.5"/>
      <circle cx="0" cy="-40" r="3.5"/>
      <circle cx="4" cy="-37" r="3.5"/>
      <circle cx="-7" cy="-35" r="2.5"/>
      <circle cx="7" cy="-35" r="2.5"/>
    </g>
    <!-- Eyes attentive. -->
    <ellipse cx="-3" cy="-30" rx="1" ry="0.9" fill="#1a0808"/>
    <ellipse cx="3" cy="-30" rx="1" ry="0.9" fill="#1a0808"/>
    <!-- Lips slightly parted (engaged). -->
    <path d="M-3,-23 Q0,-21 3,-23" fill="none" stroke="#5a2818" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- LUMA — between groups, scanner in hand. -->
  <g id="p10p3-luma" transform="translate(465, 235)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p10p3sapphire)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#5a3ad8" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#5a3ad8" stroke="#080408" stroke-width="0.4"/>
    <!-- Right arm holding scanner. -->
    <path d="M13,-5 L24,5 L30,12" fill="none" stroke="#5a3ad8" stroke-width="4" stroke-linecap="round"/>
    <rect x="28" y="9" width="9" height="6" rx="1" fill="#1a1828" stroke="#a87af0" stroke-width="0.5"/>
    <ellipse cx="32" cy="12" rx="6" ry="4" fill="#a87af0" filter="url(#p10p3bloom)" opacity="0.5"/>
    <!-- Left arm relaxed. -->
    <path d="M-13,-5 L-18,12 L-15,28" fill="none" stroke="#5a3ad8" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs standing. -->
    <path d="M-10,30 L-13,50 L-13,70" fill="none" stroke="#3a2a8c" stroke-width="6" stroke-linecap="round"/>
    <path d="M10,30 L13,50 L13,70" fill="none" stroke="#3a2a8c" stroke-width="6" stroke-linecap="round"/>
    <!-- Head + braid. -->
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#a87850"/>
    <path d="M-7,-37 Q0,-42 7,-37 L7,-30 L-7,-30 Z" fill="#1a0a08"/>
    <path d="M5,-25 Q12,-15 16,-3" fill="none" stroke="#1a0a08" stroke-width="3" stroke-linecap="round"/>
    <!-- Active lenses. -->
    <ellipse cx="-3" cy="-30" rx="2.5" ry="1.7" fill="#a87af0" opacity="0.7"/>
    <ellipse cx="3" cy="-30" rx="2.5" ry="1.7" fill="#a87af0" opacity="0.7"/>
  </g>

  <!-- WREN — at main wreckage right side, half-turned to deliver report. -->
  <g id="p10p3-wren" transform="translate(560, 235)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p10p3copper)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#c87a35" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#c87a35" stroke="#080408" stroke-width="0.4"/>
    <path d="M-13,-5 L-22,12 L-15,28" fill="none" stroke="url(#p10p3copper)" stroke-width="4" stroke-linecap="round"/>
    <path d="M13,-5 L22,12 L18,28" fill="none" stroke="url(#p10p3copper)" stroke-width="4" stroke-linecap="round"/>
    <!-- Hydraulic stains. -->
    <path d="M-18,5 Q-15,10 -16,18" stroke="#1a0a08" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M18,5 Q15,10 17,18" stroke="#1a0a08" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M-10,30 L-13,52 L-13,72" fill="none" stroke="#a86028" stroke-width="6" stroke-linecap="round"/>
    <path d="M10,30 L13,52 L13,72" fill="none" stroke="#a86028" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#e0c0a0"/>
    <ellipse cx="-2" cy="-37" rx="6.5" ry="4" fill="#0a0408"/>
    <ellipse cx="3" cy="-39" rx="3" ry="3" fill="#0a0408"/>
    <ellipse cx="-2" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-23" x2="3" y2="-23" stroke="#5a2818" stroke-width="0.9"/>
  </g>

  <!-- SABLE — far-right, near Wren, arms crossed, listening. -->
  <g id="p10p3-sable" transform="translate(660, 235)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p10p3silver)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#9ba1aa" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#9ba1aa" stroke="#080408" stroke-width="0.4"/>
    <line x1="11" y1="-19" x2="15" y2="-17" stroke="#7ac8ff" stroke-width="0.6" filter="url(#p10p3bloom)" opacity="0.85"/>
    <!-- ARMS CROSSED. -->
    <path d="M-13,-5 L-2,5 L13,8" fill="none" stroke="url(#p10p3silver)" stroke-width="4" stroke-linecap="round"/>
    <path d="M13,-2 L0,8 L-13,12" fill="none" stroke="url(#p10p3silver)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-10,30 L-13,52 L-13,72" fill="none" stroke="#5a606a" stroke-width="6" stroke-linecap="round"/>
    <path d="M10,30 L13,52 L13,72" fill="none" stroke="#5a606a" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#5a3018"/>
    <path d="M-7,-37 Q-2,-42 4,-40 L4,-32 L-7,-32 Z" fill="#e8eaee"/>
    <ellipse cx="-2" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-23" x2="3" y2="-23" stroke="#3a1808" stroke-width="0.9"/>
    <!-- Faint warm catch from city behind. -->
    <ellipse cx="9" cy="-30" rx="2" ry="1.5" fill="#f5b860" opacity="0.5"/>
  </g>

  <!-- DIALOGUE — WREN long damage report top-right + SABLE "What do you need?" + WREN "More than we have." -->
  <g id="p10p3-dlg-wren1">
    <rect x="14" y="14" width="380" height="78" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Comms dead. Navigation dead. Drive intact</text>
    <text x="24" y="68" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">but separated. We're not calling for</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">extraction. Not leaving without a full rebuild.</text>
    <path d="M340,92 L358,92 L548,210 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="340" y1="92" x2="358" y2="92" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g id="p10p3-dlg-sable">
    <rect x="424" y="14" width="180" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="434" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="434" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">What do you need?</text>
    <path d="M548,60 L566,60 L660,210 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="548" y1="60" x2="566" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g id="p10p3-dlg-wren2">
    <rect x="430" y="100" width="174" height="46" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="440" y="120" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="440" y="138" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">More than we have.</text>
    <path d="M530,146 L548,146 L560,210 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="530" y1="146" x2="548" y2="146" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p10p3-meta">
    <text x="730" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">3</text>
    <text x="734" y="292" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SQUAD ASSEMBLED — BRIEFING</text>
  </g>
</svg>
