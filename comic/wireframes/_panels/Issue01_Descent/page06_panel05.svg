<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 364" width="240" height="364">
  <title>Issue 1 — Page 6 — Panel 5: ECU Theodore's hand on window glass, the gesture preserved</title>
  <desc>ECU at 135mm, eye level. Boy's hand pressed flat against cold window pane — fingers spread, reaching. Small hand, oil-stained fingertips, brass gear ring on index finger. Breath-fog surrounds handprint, moisture beading at finger edges. Through window past hand, night sky dark and empty — no trace of falling star. Warm candlelight from workshop behind catches edges of fingers, moisture, faint grime on glass. Handprint = gesture of longing toward something already vanished.</desc>

  <defs>
    <!-- Window night sky (dark, empty — star is gone). -->
    <linearGradient id="p6p5skyEmpty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1828"/>
      <stop offset="100%" stop-color="#0a0610"/>
    </linearGradient>
    <!-- Warm candlelight from behind. -->
    <radialGradient id="p6p5warmGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#ffe080" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#f5a850" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5a2812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p6p5skinWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c39e"/>
      <stop offset="50%" stop-color="#c89870"/>
      <stop offset="100%" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="p6p5leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <radialGradient id="p6p5breathFog" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p6p5softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p6p5dropShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <!-- Empty night sky beyond window. -->
  <rect width="240" height="364" fill="url(#p6p5skyEmpty)"/>
  <!-- A few faint stars (the warm-only world, no prismatic streak left). -->
  <g fill="#dce4f0" opacity="0.55">
    <circle cx="50" cy="80" r="0.5"/>
    <circle cx="130" cy="42" r="0.6"/>
    <circle cx="190" cy="60" r="0.5"/>
  </g>

  <!-- Warm candlelight wash from behind (glass interior tint). -->
  <rect width="240" height="364" fill="url(#p6p5warmGlow)" opacity="0.55"/>

  <!-- Window frame edge (right side mullion). -->
  <rect x="226" y="0" width="14" height="364" fill="#3a2010"/>
  <line x1="226" y1="0" x2="226" y2="364" stroke="#1a0e08" stroke-width="0.7"/>

  <!-- Window dust/grime streaks (catches warm light). -->
  <g stroke="#fff5d8" stroke-width="0.5" opacity="0.18">
    <path d="M30,80 Q60,82 90,80"/>
    <path d="M40,200 Q80,202 110,200"/>
    <path d="M180,260 Q200,258 218,260"/>
  </g>

  <!-- BREATH FOG patch around handprint. -->
  <g id="p6p5-fog">
    <ellipse cx="116" cy="160" rx="80" ry="60" fill="url(#p6p5breathFog)" filter="url(#p6p5softBloom)"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: HAND pressed flat against glass — small, child's hand -->
  <!-- with oil-stained fingertips, brass gear ring on index.       -->
  <!-- ========================================================== -->
  <g id="p6p5-hand" filter="url(#p6p5dropShadow)">
    <!-- Wrist + linen sleeve coming in from bottom. -->
    <path d="M70,260 Q90,250 116,248 Q142,250 162,260 L162,364 L70,364 Z" fill="#f5e8c8"/>
    <!-- Worn leather waistcoat edge. -->
    <path d="M70,290 Q116,288 162,290 L162,364 L70,364 Z" fill="url(#p6p5leather)"/>

    <!-- Hand back. -->
    <path d="M68,250 Q88,224 116,218 Q144,222 164,248 Q170,260 162,272 Q140,278 116,276 Q92,278 70,272 Q62,260 64,254 Q66,250 68,250 Z" fill="url(#p6p5skinWarm)"/>

    <!-- Knuckles. -->
    <ellipse cx="86" cy="244" rx="3.5" ry="2" fill="#fff0d8" opacity="0.85"/>
    <ellipse cx="103" cy="240" rx="3.8" ry="2" fill="#fff0d8" opacity="0.9"/>
    <ellipse cx="120" cy="238" rx="3.8" ry="2" fill="#fff0d8" opacity="0.9"/>
    <ellipse cx="137" cy="240" rx="3.5" ry="2" fill="#fff0d8" opacity="0.85"/>
    <ellipse cx="152" cy="246" rx="3" ry="1.8" fill="#fff0d8" opacity="0.8"/>

    <!-- Tendon ridges. -->
    <line x1="80" y1="258" x2="86" y2="245" stroke="#a87850" stroke-width="0.7" opacity="0.7"/>
    <line x1="93" y1="262" x2="103" y2="241" stroke="#a87850" stroke-width="0.8" opacity="0.75"/>
    <line x1="110" y1="264" x2="120" y2="239" stroke="#a87850" stroke-width="0.8" opacity="0.75"/>
    <line x1="127" y1="262" x2="137" y2="241" stroke="#a87850" stroke-width="0.8" opacity="0.7"/>
    <line x1="144" y1="258" x2="152" y2="247" stroke="#a87850" stroke-width="0.7" opacity="0.7"/>

    <!-- FINGERS — spread, pressed flat against cold glass. -->
    <!-- Index finger. -->
    <g id="p6p5-index">
      <path d="M86,242 Q82,200 80,168 Q82,156 90,156 Q98,166 96,200 Q94,232 92,248 Z" fill="url(#p6p5skinWarm)"/>
      <!-- Mid-finger crease. -->
      <path d="M82,206 Q88,208 96,206" fill="none" stroke="#7a4830" stroke-width="0.6" opacity="0.7"/>
      <!-- Fingertip nail (oil-stained). -->
      <ellipse cx="89" cy="160" rx="3" ry="3.5" fill="#a87850" opacity="0.85"/>
      <ellipse cx="89" cy="164" rx="2.5" ry="2.5" fill="#fff0d8" opacity="0.45"/>
      <!-- BRASS GEAR RING on index finger. -->
      <ellipse cx="84" cy="200" rx="6" ry="3" fill="none" stroke="#c89030" stroke-width="1.6"/>
      <!-- Gear teeth on ring. -->
      <line x1="78" y1="200" x2="76" y2="200" stroke="#c89030" stroke-width="1"/>
      <line x1="90" y1="200" x2="92" y2="200" stroke="#c89030" stroke-width="1"/>
      <line x1="84" y1="194" x2="84" y2="192" stroke="#c89030" stroke-width="1"/>
      <line x1="84" y1="206" x2="84" y2="208" stroke="#c89030" stroke-width="1"/>
    </g>

    <!-- Middle finger (longest). -->
    <g id="p6p5-middle">
      <path d="M104,238 Q102,196 100,156 Q102,144 110,144 Q118,154 116,196 Q114,232 112,248 Z" fill="url(#p6p5skinWarm)"/>
      <path d="M102,202 Q108,204 116,202" fill="none" stroke="#7a4830" stroke-width="0.6" opacity="0.7"/>
      <ellipse cx="109" cy="148" rx="3.2" ry="3.5" fill="#a87850" opacity="0.9"/>
      <ellipse cx="109" cy="152" rx="2.7" ry="2.5" fill="#fff0d8" opacity="0.5"/>
    </g>

    <!-- Ring finger. -->
    <g id="p6p5-ring">
      <path d="M122,238 Q124,196 128,160 Q132,150 138,152 Q140,162 134,200 Q132,232 128,248 Z" fill="url(#p6p5skinWarm)"/>
      <path d="M124,206 Q132,208 138,206" fill="none" stroke="#7a4830" stroke-width="0.6" opacity="0.7"/>
      <ellipse cx="135" cy="156" rx="3" ry="3.5" fill="#a87850" opacity="0.85"/>
      <ellipse cx="135" cy="160" rx="2.5" ry="2.5" fill="#fff0d8" opacity="0.45"/>
    </g>

    <!-- Pinky (shorter). -->
    <g id="p6p5-pinky">
      <path d="M140,242 Q146,200 150,176 Q156,168 160,170 Q160,180 156,200 Q152,234 148,250 Z" fill="url(#p6p5skinWarm)"/>
      <ellipse cx="156" cy="174" rx="2.6" ry="3" fill="#a87850" opacity="0.85"/>
      <ellipse cx="156" cy="178" rx="2.2" ry="2" fill="#fff0d8" opacity="0.45"/>
    </g>

    <!-- Thumb (folded back to side of hand-back, partially visible). -->
    <g id="p6p5-thumb">
      <path d="M70,256 Q56,254 50,266 Q48,278 56,280 Q66,276 72,266 Z" fill="url(#p6p5skinWarm)"/>
      <ellipse cx="55" cy="276" rx="2.4" ry="1.8" fill="#fff0d8" opacity="0.7"/>
    </g>

    <!-- Oil stains on fingertips (per script: "oil-stained at the fingertips"). -->
    <ellipse cx="89" cy="166" rx="2" ry="1" fill="#1a0e08" opacity="0.55"/>
    <ellipse cx="109" cy="154" rx="2" ry="1" fill="#1a0e08" opacity="0.55"/>
    <ellipse cx="135" cy="162" rx="2" ry="1" fill="#1a0e08" opacity="0.55"/>

    <!-- Warm rim on finger edges (catches candle from behind). -->
    <path d="M80,168 Q82,158 90,156" fill="none" stroke="#ffe080" stroke-width="0.8" opacity="0.6"/>
    <path d="M100,156 Q104,146 110,144" fill="none" stroke="#ffe080" stroke-width="0.8" opacity="0.6"/>
    <path d="M128,160 Q132,152 138,152" fill="none" stroke="#ffe080" stroke-width="0.8" opacity="0.6"/>
    <path d="M150,176 Q154,170 160,170" fill="none" stroke="#ffe080" stroke-width="0.7" opacity="0.55"/>
  </g>

  <!-- Moisture beads at finger edges (where breath-fog meets cold finger). -->
  <g id="p6p5-moisture" opacity="0.85">
    <circle cx="78" cy="240" r="0.8" fill="#dce4f0"/>
    <circle cx="148" cy="244" r="0.7" fill="#dce4f0"/>
    <circle cx="92" cy="180" r="0.6" fill="#dce4f0"/>
    <circle cx="116" cy="200" r="0.7" fill="#dce4f0"/>
    <circle cx="140" cy="180" r="0.6" fill="#dce4f0"/>
  </g>

  <g id="p6p5-meta">
    <text x="218" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">5</text>
    <text x="222" y="304" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">ECU</text>
  </g>
</svg>
