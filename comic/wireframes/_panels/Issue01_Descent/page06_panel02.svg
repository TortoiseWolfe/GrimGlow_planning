<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 1 — Page 6 — Panel 2: Theodore close-up at workshop window, pure wonder</title>
  <desc>Close-up at 85mm, slight low angle, looking up at boy's face pressed close to a window. Theodore — 12-13, lanky pre-teen NOT a young child, untidy sandy-brown hair, wide hazel eyes reflecting fading prismatic light from outside. Hand pressed flat against cold window glass, fingers spread. Breath-fog patch on pane. Pure wonder expression — awe and longing, child seeing the impossible and wanting more. Dual light: cool prismatic from outside (forehead, nose, eyes) + warm candlelight from workshop behind (back of hair, ear, cheek). The cool light is dying; the warm light is constant. Linen shirt + worn leather waistcoat too large.</desc>

  <defs>
    <!-- Cool prismatic from outside (fading). -->
    <radialGradient id="p6p2coolFade" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#a8b8e8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm candlelight from behind (workshop interior). -->
    <radialGradient id="p6p2warmGlow" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffe080" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a2812" stop-opacity="0"/>
    </radialGradient>

    <!-- Window pane (cold glass — slight reflection). -->
    <linearGradient id="p6p2glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1828" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a0e18" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Theodore skin (dual-lit: cool from glass side, warm from interior side). -->
    <linearGradient id="p6p2skinDual" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dce4f0"/>
      <stop offset="40%" stop-color="#e8c39e"/>
      <stop offset="100%" stop-color="#f5a850"/>
    </linearGradient>

    <!-- Hazel eye iris. -->
    <radialGradient id="p6p2hazel" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a87830"/>
      <stop offset="60%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </radialGradient>

    <!-- Sandy-brown hair (warm-amber-lit on back, cool-prismatic-lit on front). -->
    <linearGradient id="p6p2hair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#7a5230"/>
      <stop offset="100%" stop-color="#c89048"/>
    </linearGradient>

    <!-- Linen shirt (off-white, lit warm from behind). -->
    <linearGradient id="p6p2linen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e8c8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>

    <!-- Leather waistcoat (worn brown). -->
    <linearGradient id="p6p2leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>

    <!-- Breath fog. -->
    <radialGradient id="p6p2breathFog" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="p6p2bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="p6p2softBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="p6p2dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ========================================================== -->
  <!-- LAYER: workshop interior background (warm candlelit)         -->
  <!-- ========================================================== -->
  <g id="p6p2-workshop-bg">
    <rect width="366" height="364" fill="#1a0e08"/>
    <!-- Warm candlelight wash from upper-right (off-frame candle). -->
    <rect width="366" height="364" fill="url(#p6p2warmGlow)" opacity="0.9"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: window pane (cold glass — covers most of frame)       -->
  <!-- ========================================================== -->
  <g id="p6p2-window">
    <!-- Window frame (wood, wider — Theodore presses against the glass). -->
    <rect x="0" y="0" width="366" height="364" fill="url(#p6p2glass)"/>
    <!-- Cool prismatic light wash from outside (top of frame). -->
    <rect width="366" height="220" fill="url(#p6p2coolFade)"/>

    <!-- Wooden window frame (top mullion). -->
    <rect x="0" y="0" width="366" height="20" fill="#3a2010"/>
    <rect x="0" y="0" width="366" height="20" fill="#5a3018" opacity="0.85"/>
    <line x1="0" y1="20" x2="366" y2="20" stroke="#1a0e08" stroke-width="0.8"/>

    <!-- Wooden window frame (left + right mullions). -->
    <rect x="0" y="0" width="14" height="364" fill="#3a2010"/>
    <rect x="0" y="0" width="14" height="364" fill="#5a3018" opacity="0.85"/>
    <line x1="14" y1="0" x2="14" y2="364" stroke="#1a0e08" stroke-width="0.8"/>

    <rect x="352" y="0" width="14" height="364" fill="#3a2010"/>
    <rect x="352" y="0" width="14" height="364" fill="#5a3018" opacity="0.85"/>
    <line x1="352" y1="0" x2="352" y2="364" stroke="#1a0e08" stroke-width="0.8"/>

    <!-- Center vertical mullion (window divided into two panes). -->
    <rect x="180" y="20" width="6" height="344" fill="#3a2010"/>
    <line x1="180" y1="20" x2="180" y2="364" stroke="#1a0e08" stroke-width="0.7"/>
    <line x1="186" y1="20" x2="186" y2="364" stroke="#1a0e08" stroke-width="0.7"/>

    <!-- Subtle moisture/dust on glass (wear streaks). -->
    <g stroke="#ffffff" stroke-width="0.5" opacity="0.18">
      <path d="M30,80 Q60,82 90,80"/>
      <path d="M250,90 Q280,88 310,92"/>
      <path d="M50,200 Q80,202 110,200"/>
      <path d="M240,250 Q270,248 300,250"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: BREATH FOG patch on glass near Theodore's mouth       -->
  <!-- ========================================================== -->
  <g id="p6p2-breath-fog">
    <ellipse cx="220" cy="220" rx="48" ry="32" fill="url(#p6p2breathFog)" filter="url(#p6p2softBloom)"/>
    <ellipse cx="220" cy="220" rx="32" ry="22" fill="#ffffff" opacity="0.32"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: THEODORE — close-up face + hand pressed to glass      -->
  <!-- Looking up (chin slightly tilted up), camera at slight low   -->
  <!-- angle from inside the workshop, so we see his face mainly    -->
  <!-- through the glass. Cool light on his front (from outside)    -->
  <!-- + warm light on his ear and back-of-hair (from candle).      -->
  <!-- ========================================================== -->
  <g id="p6p2-theodore" filter="url(#p6p2dropShadow)">

    <!-- Shoulders + leather waistcoat below (extending fully to bottom of taller frame). -->
    <path d="M40,300 Q60,270 110,260 L260,260 Q310,270 326,300 L326,364 L40,364 Z" fill="url(#p6p2leather)"/>
    <!-- Linen shirt collar visible above waistcoat. -->
    <path d="M120,260 Q160,246 200,246 Q240,246 248,260 L228,270 Q200,264 170,266 Q140,270 120,260 Z" fill="url(#p6p2linen)"/>
    <!-- Waistcoat seam. -->
    <line x1="184" y1="260" x2="184" y2="364" stroke="#1a0808" stroke-width="0.8"/>
    <!-- Brass buttons on waistcoat (multiple buttons running down). -->
    <circle cx="184" cy="290" r="2.5" fill="#c89030"/>
    <circle cx="184" cy="290" r="1.2" fill="#fff5d8" opacity="0.6"/>
    <circle cx="184" cy="320" r="2.5" fill="#c89030"/>
    <circle cx="184" cy="320" r="1.2" fill="#fff5d8" opacity="0.6"/>
    <circle cx="184" cy="350" r="2.5" fill="#c89030"/>
    <circle cx="184" cy="350" r="1.2" fill="#fff5d8" opacity="0.6"/>

    <!-- Neck. -->
    <path d="M170,210 L170,238 L198,238 L198,210 Z" fill="url(#p6p2skinDual)"/>

    <!-- HEAD — chin lifted (looking up at sky), pressed close to window. -->
    <ellipse cx="184" cy="170" rx="56" ry="64" fill="url(#p6p2skinDual)"/>

    <!-- COOL PRISMATIC LIGHT washing on forehead, nose, left side of face (from outside). -->
    <ellipse cx="184" cy="120" rx="56" ry="36" fill="#bfe4ff" opacity="0.42" filter="url(#p6p2bloom)"/>
    <path d="M128,140 Q150,124 184,118 L184,180 Q160,180 138,160 Z" fill="#bfe4ff" opacity="0.32"/>
    <!-- Violet edge tint on temple/cheek. -->
    <path d="M132,150 Q150,140 168,148 Q160,168 142,170 Z" fill="#c8b8ff" opacity="0.32"/>

    <!-- WARM AMBER LIGHT washing back of hair, ear, right cheek (from candle behind). -->
    <path d="M240,140 Q252,160 244,200 Q230,210 220,190 L220,154 Z" fill="#f5a850" opacity="0.45"/>
    <!-- Warm cheek glow on right side. -->
    <ellipse cx="226" cy="184" rx="14" ry="20" fill="#ffe080" opacity="0.32"/>

    <!-- SANDY-BROWN UNTIDY HAIR — multi-tuft messy, lit warm from behind + cool from front. -->
    <g id="p6p2-hair">
      <!-- Base scalp coverage (warm-back, cool-front gradient via dual-light hair fill). -->
      <path d="M126,118 Q124,90 146,78 Q170,68 184,72 Q198,68 222,78 Q244,90 242,118 L240,134 Q220,118 184,114 Q148,118 128,134 Z" fill="url(#p6p2hair)"/>
      <!-- Untidy tufts/locks sticking up. -->
      <path d="M148,80 Q150,68 158,66 Q162,72 156,86 Z" fill="url(#p6p2hair)"/>
      <path d="M170,72 Q174,58 184,58 Q190,68 182,82 Z" fill="url(#p6p2hair)"/>
      <path d="M196,72 Q200,60 210,62 Q214,72 206,86 Z" fill="url(#p6p2hair)"/>
      <path d="M218,80 Q224,68 232,72 Q234,80 226,90 Z" fill="url(#p6p2hair)"/>
      <!-- Stray locks at temples and forehead. -->
      <path d="M138,108 Q132,118 134,128" fill="none" stroke="#3a2818" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M232,108 Q238,118 236,128" fill="none" stroke="#3a2818" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M170,114 Q176,124 184,118 Q192,124 198,114" fill="none" stroke="#3a2818" stroke-width="1" stroke-linecap="round"/>
      <!-- Warm glow on back-of-hair (from candle). -->
      <path d="M218,82 Q236,86 242,108" fill="none" stroke="#ffe080" stroke-width="1.5" opacity="0.65"/>
      <path d="M210,72 Q230,76 240,98" fill="none" stroke="#ffe080" stroke-width="1" opacity="0.5"/>
      <!-- Cool prismatic glint on front locks (from outside). -->
      <path d="M150,88 Q170,80 184,82" fill="none" stroke="#bfe4ff" stroke-width="1" opacity="0.65"/>
    </g>

    <!-- WIDE HAZEL EYES reflecting prismatic light. -->
    <g id="p6p2-eyes">
      <!-- Left eye (slightly more cool-lit). -->
      <ellipse cx="160" cy="160" rx="9" ry="6" fill="#ffffff"/>
      <!-- Iris hazel. -->
      <ellipse cx="160" cy="160" rx="6" ry="6" fill="url(#p6p2hazel)"/>
      <!-- Pupil — looking up. -->
      <circle cx="160" cy="158" r="2.5" fill="#0a0604"/>
      <!-- Reflection of falling-star prismatic light in pupil. -->
      <ellipse cx="161" cy="156" rx="1.5" ry="1.2" fill="#bfe4ff"/>
      <ellipse cx="161.5" cy="155.5" rx="0.6" ry="0.5" fill="#ffffff"/>

      <!-- Right eye. -->
      <ellipse cx="208" cy="160" rx="9" ry="6" fill="#ffffff"/>
      <ellipse cx="208" cy="160" rx="6" ry="6" fill="url(#p6p2hazel)"/>
      <circle cx="208" cy="158" r="2.5" fill="#0a0604"/>
      <ellipse cx="209" cy="156" rx="1.5" ry="1.2" fill="#bfe4ff"/>
      <ellipse cx="209.5" cy="155.5" rx="0.6" ry="0.5" fill="#ffffff"/>
    </g>

    <!-- Eyebrows — slightly raised (wonder, not fear). -->
    <path d="M150,148 Q160,144 172,148" fill="none" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>
    <path d="M196,148 Q208,144 220,148" fill="none" stroke="#3a2818" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose (lit cool on bridge from outside, warm on side from candle). -->
    <path d="M184,170 L178,200 Q184,206 190,200 Z" fill="#a87850" opacity="0.85"/>
    <!-- Nose bridge highlight (cool light catching). -->
    <line x1="184" y1="170" x2="184" y2="195" stroke="#bfe4ff" stroke-width="1" opacity="0.7"/>
    <!-- Nostrils (small dark). -->
    <ellipse cx="180" cy="200" rx="1.2" ry="0.8" fill="#3a1810" opacity="0.7"/>
    <ellipse cx="188" cy="200" rx="1.2" ry="0.8" fill="#3a1810" opacity="0.7"/>

    <!-- Mouth — slightly open (wonder breath). -->
    <ellipse cx="184" cy="222" rx="6" ry="3" fill="#3a1810"/>
    <line x1="178" y1="222" x2="190" y2="222" stroke="#1a0808" stroke-width="0.6"/>

    <!-- Cheek warmth (from candle behind). -->
    <ellipse cx="222" cy="194" rx="14" ry="10" fill="#ffe080" opacity="0.18"/>

    <!-- Ear (lit warm from candle behind — only one ear visible since face mostly toward viewer). -->
    <path d="M236,160 Q244,158 246,170 Q244,184 236,182 Z" fill="url(#p6p2skinDual)"/>
    <path d="M238,164 Q242,166 242,174 Q240,178 238,176" fill="none" stroke="#7a4830" stroke-width="0.7" opacity="0.85"/>
    <!-- Ear warm rim. -->
    <path d="M236,160 Q244,158 246,170" fill="none" stroke="#ffe080" stroke-width="1" opacity="0.65"/>

    <!-- HAND PRESSED FLAT against glass (right hand reaching up, fingers spread). -->
    <g id="p6p2-hand">
      <!-- Forearm/wrist coming in from lower-right. -->
      <path d="M280,260 Q292,250 308,244 L324,250 Q314,260 300,266 Z" fill="url(#p6p2leather)"/>
      <!-- Linen sleeve pushed up at wrist. -->
      <path d="M298,250 Q310,244 320,244 L320,236 Q306,238 298,242 Z" fill="url(#p6p2linen)"/>

      <!-- Hand back (small — child's hand). -->
      <path d="M268,236 Q280,222 296,222 L308,228 Q312,244 304,256 Q288,260 274,254 Q262,248 264,240 Q266,236 268,236 Z" fill="url(#p6p2skinDual)"/>

      <!-- Spread fingers pressed to glass (5 visible — index, middle, ring, pinky + thumb). -->
      <!-- Index. -->
      <path d="M276,228 Q280,212 282,196 Q286,188 290,188 Q294,196 290,212 Q288,228 286,234 Z" fill="url(#p6p2skinDual)"/>
      <ellipse cx="288" cy="190" rx="2.4" ry="3" fill="#dce4f0" opacity="0.7"/>
      <!-- Middle. -->
      <path d="M288,224 Q292,206 294,188 Q298,180 302,180 Q306,188 302,206 Q300,222 298,232 Z" fill="url(#p6p2skinDual)"/>
      <ellipse cx="300" cy="182" rx="2.5" ry="3" fill="#dce4f0" opacity="0.75"/>
      <!-- Ring. -->
      <path d="M300,224 Q304,208 306,194 Q310,186 314,186 Q316,196 312,210 Q310,224 308,232 Z" fill="url(#p6p2skinDual)"/>
      <ellipse cx="312" cy="188" rx="2.4" ry="3" fill="#dce4f0" opacity="0.7"/>
      <!-- Pinky. -->
      <path d="M312,228 Q314,214 316,202 Q320,196 322,198 Q322,208 320,218 Q318,228 316,234 Z" fill="url(#p6p2skinDual)"/>
      <ellipse cx="320" cy="200" rx="2" ry="2.5" fill="#dce4f0" opacity="0.65"/>
      <!-- Thumb folded back (across hand-back). -->
      <path d="M268,238 Q258,242 254,254 Q256,260 264,256 Q272,250 274,242 Z" fill="url(#p6p2skinDual)"/>

      <!-- Knuckles (small). -->
      <ellipse cx="280" cy="232" rx="3" ry="1.8" fill="#dce4f0" opacity="0.85"/>
      <ellipse cx="293" cy="226" rx="3" ry="1.8" fill="#dce4f0" opacity="0.85"/>
      <ellipse cx="305" cy="226" rx="3" ry="1.8" fill="#dce4f0" opacity="0.85"/>
      <ellipse cx="316" cy="230" rx="2.5" ry="1.6" fill="#dce4f0" opacity="0.85"/>

      <!-- Brass gear ring on index finger (per script: "brass gear ring on the index finger"). -->
      <ellipse cx="287" cy="206" rx="3" ry="2" fill="none" stroke="#c89030" stroke-width="1.4"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: panel meta                                           -->
  <!-- ========================================================== -->
  <g id="p6p2-meta">
    <text x="356" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="360" y="304" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">CU</text>
  </g>
</svg>
