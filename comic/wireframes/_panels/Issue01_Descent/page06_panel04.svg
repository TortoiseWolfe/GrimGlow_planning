<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 364" width="488" height="364">
  <title>Issue 1 — Page 6 — Panel 4: Lamplighter Hobday stopped, looking up at vanished star</title>
  <desc>Medium shot, low angle, 50mm. Lamplighter Jack Hobday — same as P5P2 — but stopped working. His brass pole rests against the lamp post. He stands still, looking up at empty sky where the star was. Hand on lamp post for support. Practical man unsettled by what he saw. Jaw set, eyes still on sky. Warm amber gaslight only, cool light is gone. Light unchanged but the man is different. HOBDAY (thought): "...the hell was that."</desc>

  <defs>
    <linearGradient id="p6p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="60%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p6p4fog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810" stop-opacity="0"/>
      <stop offset="60%" stop-color="#7a3818" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a85020" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="p6p4coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="60%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="p6p4skin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5a850"/>
      <stop offset="50%" stop-color="#c87830"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="p6p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p6p4iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#3a1810"/>
    </linearGradient>
    <linearGradient id="p6p4brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3a10"/>
      <stop offset="50%" stop-color="#c89030"/>
      <stop offset="100%" stop-color="#5a3a10"/>
    </linearGradient>
    <radialGradient id="p6p4flame" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffe080" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p4lampHalo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#f5a850" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p6p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="p6p4dropShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- Sky + fog. -->
  <rect width="488" height="364" fill="url(#p6p4sky)"/>
  <rect y="160" width="488" height="204" fill="url(#p6p4fog)"/>
  <ellipse cx="80" cy="220" rx="14" ry="6" fill="#c87830" opacity="0.45" filter="url(#p6p4bloom)"/>
  <ellipse cx="80" cy="220" rx="6" ry="3" fill="#fff5d8" opacity="0.6"/>
  <ellipse cx="408" cy="218" rx="14" ry="6" fill="#c87830" opacity="0.45" filter="url(#p6p4bloom)"/>
  <ellipse cx="408" cy="218" rx="6" ry="3" fill="#fff5d8" opacity="0.6"/>

  <!-- Terraced houses left + right (extended to match taller frame). -->
  <rect x="0" y="60" width="120" height="220" fill="url(#p6p4coat)" opacity="0.9"/>
  <rect x="368" y="60" width="120" height="220" fill="url(#p6p4coat)" opacity="0.9"/>
  <rect x="22" y="100" width="14" height="20" fill="#3a1810" opacity="0.85"/>
  <rect x="60" y="160" width="14" height="20" fill="#3a1810" opacity="0.85"/>
  <rect x="396" y="120" width="14" height="20" fill="#3a1810" opacity="0.85"/>
  <rect x="436" y="180" width="14" height="20" fill="#3a1810" opacity="0.85"/>

  <!-- Cobblestone street (extends to bottom of taller frame). -->
  <path d="M120,280 L368,280 L488,364 L0,364 Z" fill="url(#p6p4cobble)"/>
  <g stroke="#5a2810" stroke-width="0.5" fill="none" opacity="0.55">
    <path d="M50,260 Q70,265 90,260"/>
    <path d="M210,270 Q230,275 250,270"/>
    <path d="M370,260 Q390,265 410,260"/>
    <path d="M30,290 Q60,295 90,290"/>
    <path d="M270,295 Q300,300 330,295"/>
  </g>
  <ellipse cx="280" cy="270" rx="60" ry="12" fill="#c87830" opacity="0.25" filter="url(#p6p4bloom)"/>

  <!-- Cast-iron gas lamp (same as P5P2). -->
  <g id="p6p4-lamp">
    <ellipse cx="280" cy="50" rx="120" ry="60" fill="url(#p6p4lampHalo)" filter="url(#p6p4strongBloom)"/>
    <rect x="270" y="0" width="6" height="80" fill="url(#p6p4iron)"/>
    <rect x="240" y="20" width="40" height="3" fill="url(#p6p4iron)"/>
    <path d="M240,24 L284,24 L292,40 L286,68 L238,68 L232,40 Z" fill="url(#p6p4iron)"/>
    <rect x="244" y="32" width="36" height="32" fill="#fff5d8" opacity="0.4"/>
    <line x1="262" y1="32" x2="262" y2="64" stroke="#1a0e08" stroke-width="0.5"/>
    <line x1="244" y1="48" x2="280" y2="48" stroke="#1a0e08" stroke-width="0.5"/>
    <polygon points="260,8 268,8 272,16 256,16" fill="url(#p6p4iron)"/>
    <ellipse cx="262" cy="48" rx="10" ry="14" fill="url(#p6p4flame)" filter="url(#p6p4bloom)"/>
    <ellipse cx="262" cy="48" rx="5" ry="9" fill="#fff5d8" opacity="0.95"/>
    <ellipse cx="262" cy="44" rx="2.5" ry="5" fill="#ffffff"/>
  </g>

  <!-- BRASS POLE — now resting against the lamp post (vertical, not held). -->
  <g id="p6p4-pole-resting">
    <line x1="288" y1="80" x2="296" y2="270" stroke="url(#p6p4brass)" stroke-width="3" stroke-linecap="round"/>
    <line x1="289" y1="82" x2="297" y2="268" stroke="#fff5d8" stroke-width="0.6" opacity="0.6"/>
    <!-- Brass valve hook at top. -->
    <path d="M288,80 Q290,76 286,72" fill="none" stroke="#c89030" stroke-width="1.4"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: Jack Hobday — STOPPED, looking UP at empty sky        -->
  <!-- ========================================================== -->
  <g id="p6p4-jack" filter="url(#p6p4dropShadow)">
    <!-- Long shadow stretching back (shifted to new street level). -->
    <path d="M180,335 Q140,348 50,364 L80,364 L210,340 Z" fill="#0a0604" opacity="0.5"/>

    <!-- Legs (extended down to new floor level). -->
    <path d="M188,250 Q184,290 188,335 L208,335 Q212,290 208,250 Z" fill="url(#p6p4coat)"/>
    <path d="M212,250 Q216,290 220,335 L240,335 Q236,290 232,250 Z" fill="url(#p6p4coat)"/>
    <ellipse cx="198" cy="340" rx="14" ry="5" fill="#0a0604"/>
    <ellipse cx="226" cy="340" rx="14" ry="5" fill="#0a0604"/>

    <!-- Heavy coat torso (extended with extra body length). -->
    <path d="M170,160 Q158,210 168,260 L248,260 Q258,210 246,160 Q240,150 208,150 Q176,150 170,160 Z" fill="url(#p6p4coat)"/>
    <line x1="208" y1="152" x2="208" y2="258" stroke="#0a0604" stroke-width="1.2"/>
    <circle cx="208" cy="180" r="2" fill="#3a2010"/>
    <circle cx="208" cy="204" r="2" fill="#3a2010"/>
    <circle cx="208" cy="228" r="2" fill="#3a2010"/>
    <circle cx="208" cy="252" r="2" fill="#3a2010"/>
    <path d="M170,160 Q190,148 208,150" fill="none" stroke="#0a0604" stroke-width="0.8"/>
    <path d="M246,160 Q226,148 208,150" fill="none" stroke="#0a0604" stroke-width="0.8"/>

    <!-- Right arm — hand RESTING on lamp post for support (different from P5P2). -->
    <path d="M170,162 Q160,180 200,200 Q230,206 260,200 Q280,196 290,200 L292,212 Q280,216 260,214 Q230,218 200,212 Q170,210 168,180 Z" fill="url(#p6p4coat)"/>
    <ellipse cx="290" cy="208" rx="8" ry="6" fill="url(#p6p4skin)"/>
    <line x1="286" y1="206" x2="286" y2="214" stroke="#5a2812" stroke-width="0.7"/>
    <line x1="290" y1="204" x2="290" y2="212" stroke="#5a2812" stroke-width="0.7"/>
    <line x1="294" y1="206" x2="294" y2="214" stroke="#5a2812" stroke-width="0.7"/>

    <!-- Left arm at side. -->
    <path d="M246,160 Q260,200 254,238 L240,238 Q238,200 234,160 Z" fill="url(#p6p4coat)"/>
    <ellipse cx="248" cy="240" rx="6" ry="5" fill="url(#p6p4skin)"/>

    <!-- Neck collar. -->
    <path d="M196,140 Q208,134 220,140 L220,150 L196,150 Z" fill="url(#p6p4coat)"/>

    <!-- HEAD — chin LIFTED (looking up at sky), uplit. -->
    <ellipse cx="208" cy="118" rx="20" ry="24" fill="url(#p6p4skin)"/>

    <!-- Flat cap. -->
    <path d="M186,108 Q188,90 208,86 Q228,90 230,108 Q220,104 208,104 Q196,104 186,108 Z" fill="#1a0e08"/>
    <path d="M186,108 Q188,114 200,116 L216,116 Q228,114 230,108 Q218,108 208,108 Q198,108 186,108 Z" fill="#0a0604"/>

    <!-- Brow ridge with deeper shadow (now staring upward). -->
    <ellipse cx="200" cy="116" rx="5" ry="3" fill="#3a1810" opacity="0.85"/>
    <ellipse cx="216" cy="116" rx="5" ry="3" fill="#3a1810" opacity="0.85"/>

    <!-- Eyes — narrowed, searching empty sky (different expression from P5P2 — alert, unsettled). -->
    <ellipse cx="200" cy="118" rx="3" ry="1.4" fill="#1a0e08"/>
    <ellipse cx="216" cy="118" rx="3" ry="1.4" fill="#1a0e08"/>
    <!-- Pupils raised (looking up). -->
    <circle cx="200" cy="116" r="0.8" fill="#fff5d8" opacity="0.85"/>
    <circle cx="216" cy="116" r="0.8" fill="#fff5d8" opacity="0.85"/>
    <!-- Bushy eyebrows — drawn together (concerned). -->
    <path d="M194,113 Q200,111 206,113" fill="none" stroke="#1a0e08" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M210,113 Q216,111 222,113" fill="none" stroke="#1a0e08" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Strong nose. -->
    <path d="M208,118 L205,132 Q208,134 211,132 Z" fill="#5a2812"/>
    <line x1="208" y1="120" x2="208" y2="130" stroke="#fff5d8" stroke-width="0.8" opacity="0.55"/>

    <!-- Mustache. -->
    <path d="M198,134 Q202,138 208,138 Q214,138 218,134 Q216,140 208,141 Q200,140 198,134 Z" fill="#1a0e08"/>

    <!-- Mouth — set (jaw clenched). -->
    <line x1="204" y1="140" x2="212" y2="140" stroke="#3a1810" stroke-width="1.4"/>

    <!-- Stubble shadow. -->
    <path d="M196,134 Q208,144 220,134 Q220,140 208,142 Q196,140 196,134 Z" fill="#3a1810" opacity="0.55"/>
    <path d="M198,138 Q208,146 218,138" fill="none" stroke="#3a1810" stroke-width="0.6" opacity="0.7"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: thought balloon                                       -->
  <!-- ========================================================== -->
  <g id="p6p4-dialogue">
    <!-- Thought balloon (cloud shape, dashed border for thoughts). -->
    <ellipse cx="100" cy="40" rx="80" ry="22" fill="#ffffff" stroke="#5a4a30" stroke-width="2" stroke-dasharray="3,2" filter="url(#balloonShadow)"/>
    <text x="100" y="36" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a4a30" letter-spacing="0.3">HOBDAY</text>
    <text x="100" y="52" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#1a1a1a">...the hell was that.</text>
    <!-- Trailing thought bubbles. -->
    <circle cx="180" cy="68" r="6" fill="#ffffff" stroke="#5a4a30" stroke-width="1.5" stroke-dasharray="2,1.5"/>
    <circle cx="190" cy="84" r="3.5" fill="#ffffff" stroke="#5a4a30" stroke-width="1.2" stroke-dasharray="1.5,1"/>
    <circle cx="196" cy="96" r="2" fill="#ffffff" stroke="#5a4a30" stroke-width="0.9" stroke-dasharray="1,0.8"/>
  </g>
</svg>
