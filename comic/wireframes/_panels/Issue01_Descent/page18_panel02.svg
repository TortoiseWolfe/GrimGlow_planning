<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 560" width="366" height="560">
  <title>Issue 1 — Page 18 — Panel 2: Luma without lenses, asks how long</title>
  <desc>Close-up, slight low angle (85mm). Luma's face — holographic lenses deactivated and pushed up onto her forehead like reading glasses, spectral frames resting above eyes. Without lenses, eyes large dark expressive — vulnerable, more human. Composed, direct, faint tension around eyes. South Asian, warm brown skin, dark single thick braid. Sapphire-violet suit. Blue-violet light from suit nodes fainter without active lenses. Warm amber from below catches one side. LUMA: "How long do we have?" / "Suit power. Medical supplies. Holographic degradation rates."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p2bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="50%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="p18p2warmRim" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p2coolRim" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#7a5af0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1830" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p18p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8a880"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="p18p2sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5af0"/>
      <stop offset="100%" stop-color="#2a18a0"/>
    </linearGradient>
    <radialGradient id="p18p2nodeGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#c8a8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p18p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Background. -->
  <rect width="366" height="560" fill="url(#p18p2bg)"/>

  <!-- Warm rim from below-left (city). -->
  <ellipse cx="0" cy="450" rx="220" ry="260" fill="url(#p18p2warmRim)" filter="url(#p18p2strongBloom)"/>

  <!-- Cool sapphire-violet rim from right (her own suit nodes/wreckage residual). -->
  <ellipse cx="366" cy="280" rx="180" ry="280" fill="url(#p18p2coolRim)" filter="url(#p18p2strongBloom)" opacity="0.7"/>

  <!-- LUMA face CU (large, slightly low angle). -->
  <g id="p18p2-luma" transform="translate(183, 280)">

    <!-- Neck. -->
    <path d="M-22,140 L-15,108 L15,108 L22,140 Z" fill="url(#p18p2skin)" stroke="#3a1808" stroke-width="0.8"/>

    <!-- Sapphire-violet suit shoulder line at bottom. -->
    <path d="M-110,140 L-65,135 L-22,130 L22,130 L65,135 L110,140 L110,260 L-110,260 Z" fill="url(#p18p2sapphire)" stroke="#080408" stroke-width="0.8"/>
    <ellipse cx="-65" cy="138" rx="32" ry="14" fill="#5a3ad8" stroke="#080408" stroke-width="0.6"/>
    <ellipse cx="65" cy="138" rx="32" ry="14" fill="#5a3ad8" stroke="#080408" stroke-width="0.6"/>
    <ellipse cx="-65" cy="135" rx="22" ry="6" fill="#a87af0" opacity="0.55"/>
    <ellipse cx="65" cy="135" rx="22" ry="6" fill="#a87af0" opacity="0.55"/>
    <!-- Suit node on chest plate (faint, pulsing). -->
    <circle cx="0" cy="170" r="4" fill="#7a5af0"/>
    <circle cx="0" cy="170" r="2" fill="#c8a8ff" opacity="0.9"/>
    <ellipse cx="0" cy="170" rx="14" ry="10" fill="url(#p18p2nodeGlow)" filter="url(#p18p2bloom)" opacity="0.6"/>

    <!-- Long single thick braid coming over shoulder front (visible at right neck). -->
    <path d="M22,108 Q34,128 38,160 Q40,200 32,240" fill="none" stroke="#1a0a08" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M24,114 Q34,134 38,164 Q40,200 32,236" fill="none" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Plait segments + luminous filament accents. -->
    <line x1="28" y1="124" x2="34" y2="128" stroke="#5a3a18" stroke-width="0.8"/>
    <line x1="32" y1="148" x2="38" y2="152" stroke="#5a3a18" stroke-width="0.8"/>
    <line x1="36" y1="178" x2="40" y2="184" stroke="#5a3a18" stroke-width="0.8"/>
    <line x1="38" y1="208" x2="36" y2="216" stroke="#5a3a18" stroke-width="0.8"/>
    <circle cx="34" cy="138" r="0.7" fill="#a87af0" filter="url(#p18p2bloom)" opacity="0.95"/>
    <circle cx="38" cy="170" r="0.7" fill="#a87af0" filter="url(#p18p2bloom)" opacity="0.95"/>
    <circle cx="40" cy="200" r="0.7" fill="#a87af0" filter="url(#p18p2bloom)" opacity="0.95"/>
    <circle cx="32" cy="240" r="2.5" fill="#5a3a18"/>

    <!-- Head. -->
    <path d="M-58,108 Q-65,55 -55,5 Q-30,-40 0,-45 Q30,-40 55,5 Q65,55 58,108 Z" fill="url(#p18p2skin)" stroke="#3a1808" stroke-width="0.8"/>

    <!-- Hair top — smooth pulled-back. -->
    <path d="M-50,-3 Q-30,-40 0,-45 Q30,-40 50,-3 L50,15 L-50,15 Z" fill="#1a0a08"/>
    <path d="M-50,-3 Q0,-25 50,-3" fill="none" stroke="#3a1a08" stroke-width="0.8" opacity="0.8"/>
    <!-- Side hair coming down from temples. -->
    <path d="M-48,5 Q-52,20 -48,38" fill="#1a0a08"/>
    <path d="M48,5 Q52,20 48,38" fill="#1a0a08"/>
    <!-- Center part. -->
    <line x1="0" y1="-25" x2="0" y2="-3" stroke="#3a1a08" stroke-width="0.6" opacity="0.85"/>

    <!-- HOLOGRAPHIC LENSES PUSHED UP onto forehead (deactivated, like reading glasses). -->
    <g id="p18p2-lenses-up">
      <!-- Spectral frames resting on top of head. -->
      <ellipse cx="-15" cy="-20" rx="12" ry="6" fill="#1a1828" stroke="#7a5af0" stroke-width="1.2"/>
      <ellipse cx="15" cy="-20" rx="12" ry="6" fill="#1a1828" stroke="#7a5af0" stroke-width="1.2"/>
      <!-- Bridge between lenses. -->
      <line x1="-3" y1="-20" x2="3" y2="-20" stroke="#7a5af0" stroke-width="1.2"/>
      <!-- Side stems going back over ears. -->
      <line x1="-27" y1="-18" x2="-50" y2="-5" stroke="#7a5af0" stroke-width="1"/>
      <line x1="27" y1="-18" x2="50" y2="-5" stroke="#7a5af0" stroke-width="1"/>
      <!-- Faint deactivated glow (very subtle — they're OFF). -->
      <ellipse cx="-15" cy="-20" rx="10" ry="4" fill="#3a2a6c" opacity="0.4"/>
      <ellipse cx="15" cy="-20" rx="10" ry="4" fill="#3a2a6c" opacity="0.4"/>
    </g>

    <!-- EYES — large, dark, expressive (now visible without lenses). -->
    <ellipse cx="-22" cy="20" rx="11" ry="7" fill="#f5e8d0"/>
    <ellipse cx="22" cy="20" rx="11" ry="7" fill="#f5e8d0"/>
    <!-- Iris (warm dark brown, large). -->
    <ellipse cx="-22" cy="20" rx="6.5" ry="6" fill="#3a1808"/>
    <ellipse cx="22" cy="20" rx="6.5" ry="6" fill="#3a1808"/>
    <!-- Pupil. -->
    <ellipse cx="-22" cy="20" rx="3" ry="3" fill="#080404"/>
    <ellipse cx="22" cy="20" rx="3" ry="3" fill="#080404"/>
    <!-- Catch-light: WARM (from city below-left). -->
    <circle cx="-23" cy="18.5" r="1.3" fill="#fff5d0"/>
    <circle cx="21" cy="18.5" r="1.3" fill="#fff5d0"/>
    <!-- Tiny sapphire-violet pinprick reflection from her own nodes. -->
    <circle cx="-19" cy="22" r="0.5" fill="#a87af0"/>
    <circle cx="25" cy="22" r="0.5" fill="#a87af0"/>

    <!-- Eyelashes (subtle, dark — adds the "more human" feel). -->
    <path d="M-32,15 Q-22,12 -12,15" stroke="#1a0808" stroke-width="1.4" fill="none"/>
    <path d="M12,15 Q22,12 32,15" stroke="#1a0808" stroke-width="1.4" fill="none"/>

    <!-- Brow (faint tension). -->
    <path d="M-32,5 Q-22,2 -12,5" stroke="#3a1808" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M12,5 Q22,2 32,5" stroke="#3a1808" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Cheekbones (warm catch on left, cool catch on right). -->
    <ellipse cx="-32" cy="50" rx="10" ry="5" fill="#f0a878" opacity="0.55"/>
    <ellipse cx="32" cy="50" rx="10" ry="5" fill="#a87af0" opacity="0.4"/>

    <!-- Nose. -->
    <path d="M0,15 L-3,55 L3,55 Z" fill="#5a3818" opacity="0.45"/>
    <line x1="-2" y1="58" x2="2" y2="58" stroke="#3a1808" stroke-width="0.8"/>
    <ellipse cx="0" cy="35" rx="4" ry="14" fill="#a87850" opacity="0.25"/>

    <!-- Lips: composed, slight downward tension at corners (the question is hard to ask). -->
    <path d="M-15,75 Q-5,80 0,77 Q5,80 15,75" fill="none" stroke="#5a2818" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-13" y1="76" x2="13" y2="76" stroke="#3a1808" stroke-width="0.6" opacity="0.7"/>

    <!-- Jawline + chin emphasis. -->
    <path d="M-50,85 Q-28,108 0,108 Q28,108 50,85" fill="none" stroke="#3a1808" stroke-width="0.8" opacity="0.7"/>

    <!-- Warm wash on left side of face. -->
    <path d="M-58,108 Q-65,55 -55,5 Q-30,-40 0,-45 L0,108 Z" fill="#f5b860" opacity="0.18"/>
    <!-- Cool wash on right side. -->
    <path d="M0,-45 Q30,-40 55,5 Q65,55 58,108 L0,108 Z" fill="#7a5af0" opacity="0.13"/>
  </g>

  <!-- LUMA dialogue (top-left). 2 balloons stacked. -->
  <g id="p18p2-dlg-luma1">
    <rect x="22" y="22" width="180" height="46" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="32" y="42" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="32" y="60" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">How long do we have?</text>
    <path d="M120,68 L138,68 L132,82 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" stroke-linejoin="round"/>
    <line x1="120" y1="68" x2="138" y2="68" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g id="p18p2-dlg-luma2">
    <rect x="22" y="92" width="232" height="84" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="32" y="112" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="32" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Suit power. Medical</text>
    <text x="32" y="146" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">supplies. Holographic</text>
    <text x="32" y="162" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">degradation rates.</text>
    <path d="M150,176 L168,176 L172,200 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" stroke-linejoin="round"/>
    <line x1="150" y1="176" x2="168" y2="176" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p18p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="362" y="552" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">LUMA — HOW LONG</text>
  </g>
</svg>
