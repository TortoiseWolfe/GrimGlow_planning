<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 1 — Page 2 — Panel 2: ECU Jink's hand drumming on knee</title>
  <desc>Extreme close-up at eye level, 135mm. Hand drumming an impatient rhythm on a knee — fingers tapping. Pristine emerald metallic suit sleeve, wrist holographic emitter casts faint structured emerald-green geometric light across the fingers. Background soft, out of focus — prismatic temporal corridor visible through narrow rectangular viewport, blues and violets blurred into abstract luminous shapes. Tight detail, character-establishing insert. JINK (off-panel): "Observe. Tag. Extract. Just once I'd like a mission where something actually happens."</desc>

  <defs>
    <!-- Shared balloon drop shadow (dialogue-style.md). -->
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p2p2emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd9a0"/>
      <stop offset="20%" stop-color="#4ab078"/>
      <stop offset="50%" stop-color="#2a8a55"/>
      <stop offset="80%" stop-color="#16633a"/>
      <stop offset="100%" stop-color="#0a3a22"/>
    </linearGradient>
    <linearGradient id="p2p2emeraldHi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8f5e4" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="p2p2emeraldSeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082818"/>
      <stop offset="100%" stop-color="#03140c"/>
    </linearGradient>

    <linearGradient id="p2p2skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a575"/>
      <stop offset="50%" stop-color="#b88758"/>
      <stop offset="100%" stop-color="#8a6038"/>
    </linearGradient>
    <linearGradient id="p2p2skinHi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0d8b0" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="p2p2emeraldCore" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#a8f5c8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="p2p2emeraldGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a8f5c8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a3a22" stop-opacity="0"/>
    </radialGradient>

    <!-- Out-of-focus corridor streak background. -->
    <linearGradient id="p2p2streakBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1842" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#3a4a8a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#5a78c8" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#3a4a8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a1842" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="p2p2blurStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80c8ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#a8c8f5" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bfe4ff" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#a8c8f5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#80c8ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="p2p2prismStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff80c8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#80c8ff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#a8ff80" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#c880ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#80a8ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="p2p2heavyBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="p2p2bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="p2p2softBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="p2p2dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ========================================================== -->
  <!-- LAYER: out-of-focus corridor through viewport               -->
  <!-- ========================================================== -->
  <g id="p2p2-bg" filter="url(#p2p2heavyBlur)">
    <rect width="238" height="364" fill="#0a0e18"/>

    <!-- Suggestion of viewport frame (very blurry). -->
    <rect x="40" y="20" width="160" height="200" fill="#1a2238" opacity="0.85"/>
    <rect x="44" y="24" width="152" height="192" fill="url(#p2p2streakBg)"/>

    <!-- Streak motion bands. -->
    <rect x="44" y="40" width="152" height="6" fill="url(#p2p2blurStreak)" opacity="0.85"/>
    <rect x="44" y="58" width="152" height="4" fill="url(#p2p2prismStreak)" opacity="0.7"/>
    <rect x="44" y="78" width="152" height="6" fill="url(#p2p2blurStreak)" opacity="0.85"/>
    <rect x="44" y="98" width="152" height="4" fill="url(#p2p2prismStreak)" opacity="0.65"/>
    <rect x="44" y="118" width="152" height="6" fill="url(#p2p2blurStreak)" opacity="0.85"/>
    <rect x="44" y="140" width="152" height="4" fill="url(#p2p2prismStreak)" opacity="0.7"/>
    <rect x="44" y="160" width="152" height="6" fill="url(#p2p2blurStreak)" opacity="0.85"/>
    <rect x="44" y="184" width="152" height="4" fill="url(#p2p2prismStreak)" opacity="0.65"/>
  </g>

  <!-- Blur halos that aren't blurred but subtle (from emitter spill). -->
  <ellipse cx="120" cy="120" rx="80" ry="50" fill="url(#p2p2emeraldGlow)" opacity="0.18"/>

  <!-- ========================================================== -->
  <!-- LAYER: knee + thigh (sharp foreground)                      -->
  <!-- Flat knee plate (not hemispherical) takes lower 40% of frame -->
  <!-- ========================================================== -->
  <g id="p2p2-knee" filter="url(#p2p2dropShadow)">
    <!-- Thigh (rising up from bottom of frame, full emerald suit). -->
    <path d="M0,240 Q-8,300 0,364 L238,364 Q246,300 238,240 Q230,232 119,232 Q8,232 0,240 Z" fill="url(#p2p2emerald)"/>
    <path d="M0,240 Q-8,300 0,364 L238,364 Q246,300 238,240 Q230,232 119,232 Q8,232 0,240 Z" fill="url(#p2p2emeraldHi)"/>

    <!-- Knee plate (FLAT panel covering kneecap, with armor segmentation visible). -->
    <rect x="36" y="244" width="166" height="42" rx="6" fill="url(#p2p2emerald)"/>
    <rect x="36" y="244" width="166" height="42" rx="6" fill="url(#p2p2emeraldHi)" opacity="0.55"/>
    <!-- Plate edge bevel (lighter top edge to read flat). -->
    <line x1="36" y1="246" x2="202" y2="246" stroke="#a8f5c8" stroke-width="0.7" opacity="0.6"/>
    <!-- Plate inner segment seams — clearly armor, not skin. -->
    <line x1="76" y1="244" x2="76" y2="286" stroke="#082818" stroke-width="0.7" opacity="0.65"/>
    <line x1="119" y1="244" x2="119" y2="286" stroke="#082818" stroke-width="0.9" opacity="0.7"/>
    <line x1="162" y1="244" x2="162" y2="286" stroke="#082818" stroke-width="0.7" opacity="0.65"/>
    <!-- Knee accent node (hex centered on plate). -->
    <g filter="url(#p2p2bloom)" opacity="0.85">
      <polygon points="119,250 132,257 132,271 119,278 106,271 106,257" fill="url(#p2p2emeraldGlow)"/>
    </g>
    <polygon points="119,254 128,259 128,269 119,274 110,269 110,259" fill="url(#p2p2emeraldCore)"/>
    <polygon points="119,259 124,261 124,267 119,269 114,267 114,261" fill="#ffffff" opacity="0.85"/>

    <!-- Plate seams below knee (armor segmentation continues). -->
    <line x1="0" y1="296" x2="238" y2="296" stroke="#082818" stroke-width="0.7" opacity="0.55"/>
    <line x1="6" y1="316" x2="232" y2="316" stroke="#082818" stroke-width="0.7" opacity="0.5"/>
    <line x1="6" y1="338" x2="232" y2="338" stroke="#082818" stroke-width="0.6" opacity="0.45"/>
    <line x1="119" y1="296" x2="119" y2="364" stroke="#082818" stroke-width="0.8" opacity="0.6"/>

    <!-- Side suit highlight catching emitter light. -->
    <path d="M30,240 Q24,300 40,360 L72,360 Q60,300 72,242 Z" fill="#a8f5c8" opacity="0.2"/>
    <path d="M166,242 Q178,300 166,360 L198,360 Q210,300 208,240 Z" fill="#a8f5c8" opacity="0.18"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: forearm + hand drumming on knee                      -->
  <!-- Hand redrawn: palm-down on knee plate, knuckles UP, all 5    -->
  <!-- digits clearly separated, fingers tapping at varied heights. -->
  <!-- ========================================================== -->
  <g id="p2p2-forearm-hand" filter="url(#p2p2dropShadow)">

    <!-- Forearm (emerald suit sleeve, comes in from upper-left, broader/clearer angle). -->
    <path d="M-10,80 Q30,90 80,140 L120,134 Q90,110 50,90 Q20,75 -10,72 Z" fill="url(#p2p2emerald)"/>
    <path d="M-10,80 Q30,90 80,140 L120,134 Q90,110 50,90 Q20,75 -10,72 Z" fill="url(#p2p2emeraldHi)" opacity="0.65"/>
    <!-- Sleeve plate seams (armored sleeve segmentation). -->
    <line x1="10" y1="76" x2="80" y2="120" stroke="#082818" stroke-width="0.8" opacity="0.65"/>
    <line x1="6" y1="92" x2="78" y2="134" stroke="#082818" stroke-width="0.6" opacity="0.5"/>
    <!-- Copper-style trim line along sleeve edge (suit accent). -->
    <path d="M-10,86 Q22,84 60,98 Q90,114 120,138" fill="none" stroke="#0a3a22" stroke-width="2" opacity="0.85"/>

    <!-- Wrist cuff (where sleeve meets glove/hand). -->
    <path d="M118,140 L80,142 L100,162 L132,156 Z" fill="url(#p2p2emeraldSeam)"/>
    <path d="M118,140 L80,142 L100,162 L132,156 Z" fill="url(#p2p2emeraldHi)" opacity="0.45"/>
    <line x1="92" y1="148" x2="124" y2="148" stroke="#082818" stroke-width="0.9"/>

    <!-- WRIST EMITTER — bright structured emerald source on inner wrist. -->
    <g id="p2p2-wrist-emitter">
      <ellipse cx="106" cy="155" rx="22" ry="9" fill="url(#p2p2emeraldGlow)" filter="url(#p2p2bloom)" opacity="0.95"/>
      <ellipse cx="106" cy="155" rx="14" ry="5" fill="url(#p2p2emeraldCore)"/>
      <ellipse cx="106" cy="155" rx="14" ry="5" fill="none" stroke="#ffffff" stroke-width="0.7"/>
      <ellipse cx="106" cy="155" rx="9" ry="3" fill="#ffffff" opacity="0.9"/>
      <!-- Geometric scaffolding lines. -->
      <line x1="92" y1="155" x2="120" y2="155" stroke="#ffffff" stroke-width="0.5" opacity="0.85"/>
      <line x1="106" y1="150" x2="106" y2="160" stroke="#ffffff" stroke-width="0.5" opacity="0.85"/>
    </g>

    <!-- HAND — back of hand visible, palm down on knee plate, knuckles UP. -->
    <g id="p2p2-hand">
      <!-- Main back-of-hand mass (rectangular flat from wrist to knuckle line). -->
      <path d="M118,156 Q146,154 170,160 Q186,166 192,180 L186,210 Q176,212 156,210 Q132,206 116,196 Q104,184 110,168 Q114,160 118,156 Z" fill="url(#p2p2skinTone)"/>
      <path d="M118,156 Q146,154 170,160 Q186,166 192,180 L186,210 Q176,212 156,210 Q132,206 116,196 Q104,184 110,168 Q114,160 118,156 Z" fill="url(#p2p2skinHi)" opacity="0.55"/>

      <!-- KNUCKLES (4 visible bumps at top edge of hand back). -->
      <ellipse cx="138" cy="172" rx="6" ry="3.6" fill="#fff0d8" opacity="0.92"/>
      <ellipse cx="138" cy="172" rx="6" ry="3.6" fill="none" stroke="#a87a52" stroke-width="0.6"/>
      <ellipse cx="136" cy="170" rx="3" ry="1.4" fill="#ffffff" opacity="0.85"/>

      <ellipse cx="156" cy="170" rx="6.5" ry="3.6" fill="#fff0d8" opacity="0.92"/>
      <ellipse cx="156" cy="170" rx="6.5" ry="3.6" fill="none" stroke="#a87a52" stroke-width="0.6"/>
      <ellipse cx="154" cy="168" rx="3" ry="1.4" fill="#ffffff" opacity="0.9"/>

      <ellipse cx="174" cy="172" rx="6.5" ry="3.6" fill="#fff0d8" opacity="0.92"/>
      <ellipse cx="174" cy="172" rx="6.5" ry="3.6" fill="none" stroke="#a87a52" stroke-width="0.6"/>
      <ellipse cx="172" cy="170" rx="3" ry="1.4" fill="#ffffff" opacity="0.9"/>

      <ellipse cx="190" cy="178" rx="5.5" ry="3.4" fill="#fff0d8" opacity="0.92"/>
      <ellipse cx="190" cy="178" rx="5.5" ry="3.4" fill="none" stroke="#a87a52" stroke-width="0.6"/>
      <ellipse cx="188" cy="176" rx="2.5" ry="1.3" fill="#ffffff" opacity="0.85"/>

      <!-- Tendon ridges (extensor tendons running from wrist to knuckles). -->
      <line x1="124" y1="180" x2="138" y2="174" stroke="#a87a52" stroke-width="0.8" opacity="0.7"/>
      <line x1="130" y1="184" x2="156" y2="172" stroke="#a87a52" stroke-width="0.9" opacity="0.75"/>
      <line x1="136" y1="190" x2="174" y2="174" stroke="#a87a52" stroke-width="0.9" opacity="0.75"/>
      <line x1="146" y1="196" x2="190" y2="180" stroke="#a87a52" stroke-width="0.8" opacity="0.7"/>

      <!-- THUMB — branching off left side of hand, partially visible. -->
      <g id="p2p2-thumb">
        <path d="M118,156 Q108,162 100,176 Q96,188 102,194 Q110,196 118,188 Q124,178 122,166 Q120,158 118,156 Z" fill="url(#p2p2skinTone)"/>
        <path d="M104,180 Q108,184 114,180" fill="none" stroke="#7a5230" stroke-width="0.7" opacity="0.65"/>
        <!-- Thumbnail. -->
        <ellipse cx="105" cy="190" rx="2.5" ry="1.5" fill="#fff0d8" opacity="0.7"/>
      </g>

      <!-- FINGERS — drumming, captured mid-rhythm at varied heights. All 4 clearly distinct. -->

      <!-- INDEX (down — touching knee plate). -->
      <g id="p2p2-finger-index">
        <path d="M138,176 Q140,196 144,220 Q148,240 146,250 Q140,254 134,250 Q128,240 128,220 Q130,200 132,180 Q134,176 138,176 Z" fill="url(#p2p2skinTone)"/>
        <path d="M138,176 Q140,196 144,220" fill="none" stroke="#f0d8b0" stroke-width="0.5" opacity="0.5"/>
        <!-- Mid-finger crease. -->
        <path d="M134,212 Q140,214 146,212" fill="none" stroke="#7a5230" stroke-width="0.6" opacity="0.7"/>
        <!-- Fingernail. -->
        <ellipse cx="139" cy="248" rx="3" ry="1.4" fill="#fff0d8" opacity="0.75"/>
        <!-- Tap impact ripple on knee plate (this finger touching). -->
        <ellipse cx="140" cy="252" rx="10" ry="1.4" fill="#a8f5c8" opacity="0.55"/>
      </g>

      <!-- MIDDLE (lifted — mid-tap, fingertip raised above knee). -->
      <g id="p2p2-finger-middle">
        <path d="M156,174 Q160,194 162,212 Q164,228 162,236 Q156,238 152,236 Q148,228 148,212 Q150,194 152,176 Q154,172 156,174 Z" fill="url(#p2p2skinTone)"/>
        <path d="M156,174 Q160,194 162,212" fill="none" stroke="#f0d8b0" stroke-width="0.5" opacity="0.5"/>
        <path d="M150,206 Q156,208 162,206" fill="none" stroke="#7a5230" stroke-width="0.6" opacity="0.7"/>
        <!-- Fingernail (rounded, lifted off knee). -->
        <ellipse cx="155" cy="234" rx="3.2" ry="1.4" fill="#fff0d8" opacity="0.75"/>
        <!-- No tap-ripple (lifted). -->
      </g>

      <!-- RING (down — touching knee plate). -->
      <g id="p2p2-finger-ring">
        <path d="M174,176 Q178,196 180,218 Q182,234 178,246 Q172,248 168,244 Q164,232 164,216 Q166,196 168,178 Q170,174 174,176 Z" fill="url(#p2p2skinTone)"/>
        <path d="M174,176 Q178,196 180,218" fill="none" stroke="#f0d8b0" stroke-width="0.5" opacity="0.5"/>
        <path d="M166,212 Q172,214 180,212" fill="none" stroke="#7a5230" stroke-width="0.6" opacity="0.7"/>
        <ellipse cx="173" cy="244" rx="3.2" ry="1.4" fill="#fff0d8" opacity="0.75"/>
        <!-- Tap impact ripple. -->
        <ellipse cx="174" cy="250" rx="9" ry="1.4" fill="#a8f5c8" opacity="0.55"/>
      </g>

      <!-- PINKY (lifted slightly, shorter). -->
      <g id="p2p2-finger-pinky">
        <path d="M190,182 Q194,200 196,216 Q198,228 194,234 Q190,236 186,232 Q182,222 182,210 Q184,196 184,184 Q186,180 190,182 Z" fill="url(#p2p2skinTone)"/>
        <path d="M190,182 Q194,200 196,216" fill="none" stroke="#f0d8b0" stroke-width="0.5" opacity="0.5"/>
        <ellipse cx="190" cy="232" rx="2.6" ry="1.2" fill="#fff0d8" opacity="0.7"/>
      </g>

      <!-- Motion-blur ghosting — phantom finger positions to convey drumming rhythm. -->
      <g id="p2p2-motion-blur" opacity="0.32">
        <path d="M148,200 Q150,220 152,238" fill="none" stroke="#b88758" stroke-width="0.7"/>
        <path d="M165,202 Q167,222 168,236" fill="none" stroke="#b88758" stroke-width="0.6"/>
        <ellipse cx="155" cy="246" rx="6" ry="1" fill="#b88758"/>
      </g>
    </g>

    <!-- EMITTER LIGHT CASTING ON HAND/KNEE — structured emerald geometric grid. -->
    <g id="p2p2-emerald-cast">
      <!-- Geometric grid patterns thrown on hand back from wrist emitter. -->
      <line x1="106" y1="160" x2="138" y2="174" stroke="#a8f5c8" stroke-width="0.5" opacity="0.55"/>
      <line x1="110" y1="160" x2="156" y2="172" stroke="#a8f5c8" stroke-width="0.5" opacity="0.55"/>
      <line x1="114" y1="160" x2="174" y2="174" stroke="#a8f5c8" stroke-width="0.5" opacity="0.5"/>
      <line x1="118" y1="160" x2="190" y2="180" stroke="#a8f5c8" stroke-width="0.5" opacity="0.5"/>
      <!-- Hex projections on knee plate (from emitter spill). -->
      <polygon points="80,266 86,269 86,275 80,278 74,275 74,269" fill="none" stroke="#a8f5c8" stroke-width="0.5" opacity="0.55"/>
      <polygon points="160,268 166,271 166,277 160,280 154,277 154,271" fill="none" stroke="#a8f5c8" stroke-width="0.5" opacity="0.5"/>
      <!-- Spill onto knee around tap points. -->
      <ellipse cx="140" cy="254" rx="16" ry="3" fill="#a8f5c8" opacity="0.18"/>
      <ellipse cx="174" cy="252" rx="14" ry="2.5" fill="#a8f5c8" opacity="0.16"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: dialogue (off-panel)                                 -->
  <!-- ========================================================== -->
  <g id="p2p2-dialogue">
    <rect x="6" y="14" width="226" height="56" rx="6" fill="white" stroke="#2ed078" stroke-width="2" stroke-dasharray="3,2" filter="url(#balloonShadow)"/>
    <text x="14" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078">JINK (O.P.)</text>
    <text x="14" y="46" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">Observe. Tag. Extract. Just once</text>
    <text x="14" y="59" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">I'd like a mission where something</text>
    <text x="14" y="72" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">actually happens.</text>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: panel meta                                           -->
  <!-- ========================================================== -->
  <g id="p2p2-meta">
    <text x="228" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#888" opacity="0.7">2</text>
    <text x="232" y="356" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#888" opacity="0.6">ECU</text>
  </g>

</svg>
