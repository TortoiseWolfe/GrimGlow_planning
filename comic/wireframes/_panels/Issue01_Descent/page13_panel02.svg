<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 380" width="244" height="380">
  <title>Issue 1 — Page 13 — Panel 2: Thresh's hand on sidearm — soldier reaching for what she knows</title>
  <desc>ECU 135mm. Soldier's strong blunt fingers resting on compact angular sidearm lying on soot-coated iron surface. Fingers strong + blunt — not gripping, not drawing, just resting in contact. Weapon compact + angular w/ faint crimson holographic accent lines active along frame. Hand wears ruby gauntlet dented at wrist. Warm amber light catches crimson lines making them glow red-amber. Gutter floor around hand = dark soot-coated iron w/ coal grit. Deliberate parallel to Wren's dead crystal CU on Page 10: Wren holds dead component, Thresh touches living weapon. Both reaching for what they know. Silent.</desc>

  <defs>
    <linearGradient id="p13p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="p13p2warmHalo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p13p2ironFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p13p2gauntlet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <linearGradient id="p13p2skinHand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87850"/>
      <stop offset="100%" stop-color="#d8a880"/>
    </linearGradient>
    <linearGradient id="p13p2weapon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3848"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="p13p2crimsonGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f54848" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a1018" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p13p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Background — dim. -->
  <rect width="244" height="380" fill="url(#p13p2bg)"/>

  <!-- Warm amber halo around weapon (city-glow catching crimson lines red-amber). -->
  <ellipse cx="122" cy="220" rx="180" ry="130" fill="url(#p13p2warmHalo)" filter="url(#p13p2strongBloom)"/>

  <!-- IRON GUTTER FLOOR — soot-coated, fills lower 2/3. -->
  <rect y="180" width="244" height="200" fill="url(#p13p2ironFloor)"/>
  <line x1="0" y1="180" x2="244" y2="180" stroke="#080404" stroke-width="1"/>

  <!-- Coal grit + soot granules visible individually (script-specific). -->
  <g fill="#080404" opacity="0.85">
    <circle cx="20" cy="220" r="1.5"/>
    <circle cx="50" cy="240" r="1.4"/>
    <circle cx="80" cy="225" r="1.6"/>
    <circle cx="160" cy="250" r="1.5"/>
    <circle cx="200" cy="232" r="1.4"/>
    <circle cx="220" cy="265" r="1.6"/>
    <circle cx="35" cy="280" r="1.5"/>
    <circle cx="195" cy="295" r="1.4"/>
    <circle cx="40" cy="320" r="1.6"/>
    <circle cx="200" cy="335" r="1.5"/>
    <circle cx="60" cy="360" r="1.4"/>
    <circle cx="170" cy="365" r="1.5"/>
  </g>
  <g fill="#080404" opacity="0.6">
    <circle cx="35" cy="200" r="0.7"/>
    <circle cx="65" cy="215" r="0.7"/>
    <circle cx="100" cy="200" r="0.7"/>
    <circle cx="180" cy="210" r="0.7"/>
    <circle cx="215" cy="200" r="0.7"/>
    <circle cx="100" cy="280" r="0.7"/>
    <circle cx="155" cy="300" r="0.7"/>
    <circle cx="80" cy="335" r="0.7"/>
    <circle cx="125" cy="355" r="0.7"/>
  </g>

  <!-- COMPACT ANGULAR SIDEARM lying on iron, mid-frame. -->
  <g id="p13p2-weapon" transform="translate(122, 240)">
    <!-- Weapon body — angular polygonal main frame. -->
    <path d="M-50,0 L40,-8 L52,8 L42,18 L-46,18 L-58,8 Z" fill="url(#p13p2weapon)" stroke="#080404" stroke-width="0.8"/>
    <!-- Grip protrusion. -->
    <path d="M-30,18 L-20,18 L-22,30 L-32,28 Z" fill="url(#p13p2weapon)" stroke="#080404" stroke-width="0.7"/>
    <!-- Top sight rail. -->
    <rect x="-40" y="-8" width="70" height="3" fill="#1a1820"/>
    <line x1="-30" y1="-7" x2="20" y2="-7" stroke="#3a3848" stroke-width="0.5"/>
    <!-- Trigger guard. -->
    <ellipse cx="-20" cy="22" rx="6" ry="3" fill="none" stroke="#080404" stroke-width="0.7"/>
    <!-- Barrel end. -->
    <rect x="40" y="-2" width="14" height="6" fill="#0a0a14" stroke="#080404" stroke-width="0.5"/>
    <circle cx="50" cy="1" r="1.5" fill="#080404"/>

    <!-- CRIMSON HOLOGRAPHIC ACCENT LINES along frame (faint, still active). -->
    <line x1="-50" y1="3" x2="40" y2="-5" stroke="#dc2030" stroke-width="0.8" filter="url(#p13p2bloom)" opacity="0.95"/>
    <line x1="-46" y1="14" x2="42" y2="14" stroke="#dc2030" stroke-width="0.8" filter="url(#p13p2bloom)" opacity="0.95"/>
    <line x1="-40" y1="-5" x2="-40" y2="13" stroke="#f54848" stroke-width="0.6" filter="url(#p13p2bloom)" opacity="0.85"/>
    <line x1="20" y1="-7" x2="20" y2="13" stroke="#f54848" stroke-width="0.6" filter="url(#p13p2bloom)" opacity="0.85"/>
    <line x1="0" y1="-6" x2="0" y2="14" stroke="#f54848" stroke-width="0.6" filter="url(#p13p2bloom)" opacity="0.85"/>
    <!-- Crimson glow halo (warm amber light catching crimson = "red-amber" per script). -->
    <ellipse cx="0" cy="5" rx="62" ry="14" fill="url(#p13p2crimsonGlow)" filter="url(#p13p2strongBloom)" opacity="0.65"/>

    <!-- Tiny indicator dots glowing crimson. -->
    <circle cx="-20" cy="-3" r="0.9" fill="#f54848" filter="url(#p13p2bloom)" opacity="0.95"/>
    <circle cx="10" cy="-3" r="0.9" fill="#f54848" filter="url(#p13p2bloom)" opacity="0.95"/>
  </g>

  <!-- HAND — Thresh's hand resting on weapon, fingers in contact, not gripping. -->
  <g id="p13p2-hand" transform="translate(122, 200)">

    <!-- Forearm coming in from upper-right (gauntleted, dented at wrist). -->
    <path d="M58,-160 L80,-150 L100,-100 L80,-50 L40,-30 L20,-20 Z" fill="url(#p13p2gauntlet)" stroke="#080408" stroke-width="0.8"/>
    <!-- Gauntlet armor segments. -->
    <line x1="58" y1="-150" x2="40" y2="-110" stroke="#5a0810" stroke-width="0.7" opacity="0.85"/>
    <line x1="68" y1="-140" x2="50" y2="-90" stroke="#5a0810" stroke-width="0.7" opacity="0.85"/>
    <line x1="78" y1="-130" x2="60" y2="-70" stroke="#5a0810" stroke-width="0.7" opacity="0.85"/>
    <!-- Gauntlet highlights. -->
    <line x1="55" y1="-160" x2="78" y2="-150" stroke="#f54848" stroke-width="0.7" opacity="0.7"/>
    <!-- DENT at wrist (script-specific). -->
    <path d="M30,-30 Q40,-22 48,-30" fill="#5a0810" stroke="#080408" stroke-width="0.7"/>
    <line x1="35" y1="-26" x2="45" y2="-26" stroke="#1a0408" stroke-width="0.5"/>

    <!-- Wrist seam (where gauntlet meets skin). -->
    <line x1="20" y1="-20" x2="40" y2="-30" stroke="#080404" stroke-width="1"/>

    <!-- Hand back showing past wrist. -->
    <path d="M20,-20 L-20,5 L-30,30 L-15,45 L25,45 L40,30 Z" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.6"/>

    <!-- KNUCKLES — strong + blunt (4 visible). -->
    <ellipse cx="-15" cy="22" rx="5" ry="4" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <ellipse cx="-3" cy="18" rx="5" ry="4" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <ellipse cx="9" cy="18" rx="5" ry="4" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <ellipse cx="20" cy="22" rx="5" ry="4" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <!-- Knuckle highlights. -->
    <ellipse cx="-15" cy="20" rx="2" ry="1.5" fill="#f0c890" opacity="0.65"/>
    <ellipse cx="-3" cy="16" rx="2" ry="1.5" fill="#f0c890" opacity="0.65"/>
    <ellipse cx="9" cy="16" rx="2" ry="1.5" fill="#f0c890" opacity="0.65"/>
    <ellipse cx="20" cy="20" rx="2" ry="1.5" fill="#f0c890" opacity="0.65"/>

    <!-- FINGERS — strong, blunt, RESTING on weapon (not curled, just laid across). -->
    <path d="M-20,28 Q-22,42 -20,55 L-15,55 Q-13,42 -15,28 Z" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <path d="M-8,26 Q-10,42 -8,55 L-3,55 Q-1,42 -3,26 Z" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <path d="M4,26 Q2,42 4,55 L9,55 Q11,42 9,26 Z" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <path d="M16,28 Q14,42 16,55 L21,55 Q23,42 21,28 Z" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>

    <!-- Finger creases (knuckle joints). -->
    <g stroke="#5a3018" stroke-width="0.4" fill="none" opacity="0.8">
      <path d="M-20,38 Q-17,40 -15,38"/>
      <path d="M-8,36 Q-5,38 -3,36"/>
      <path d="M4,36 Q7,38 9,36"/>
      <path d="M16,38 Q19,40 21,38"/>
      <!-- Lower joint. -->
      <path d="M-20,48 Q-17,50 -15,48"/>
      <path d="M-8,48 Q-5,50 -3,48"/>
      <path d="M4,48 Q7,50 9,48"/>
      <path d="M16,48 Q19,50 21,48"/>
    </g>

    <!-- Thumb (visible side). -->
    <path d="M-22,12 Q-32,15 -36,25 Q-30,32 -22,28 Z" fill="url(#p13p2skinHand)" stroke="#5a3018" stroke-width="0.5"/>
    <ellipse cx="-32" cy="22" rx="2" ry="1.5" fill="#f0c890" opacity="0.6"/>

    <!-- Fingertips touching the top of the weapon (the "in contact" detail). -->
    <ellipse cx="-15" cy="55" rx="3.5" ry="2" fill="#a87850"/>
    <ellipse cx="-3" cy="55" rx="3.5" ry="2" fill="#a87850"/>
    <ellipse cx="9" cy="55" rx="3.5" ry="2" fill="#a87850"/>
    <ellipse cx="21" cy="55" rx="3.5" ry="2" fill="#a87850"/>
    <!-- Crimson glow reflecting on undersides of fingertips. -->
    <ellipse cx="0" cy="58" rx="22" ry="3" fill="#dc2030" filter="url(#p13p2bloom)" opacity="0.4"/>
  </g>

  <!-- Meta tag. -->
  <g id="p13p2-meta">
    <text x="236" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="240" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">HAND ON WEAPON</text>
  </g>
</svg>
