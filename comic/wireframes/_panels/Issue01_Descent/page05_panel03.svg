<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 278" width="240" height="278">
  <title>Issue 1 — Page 5 — Panel 3: Victorian woman first witness reaction</title>
  <desc>Medium close-up at 65mm, eye level. Working-class Victorian woman on brick doorstep, heavy wool shawl pulled tight, head turned upward, eyes wide, mouth slightly open. Middle-aged, careworn, hair under simple bonnet. Warm amber from doorway behind on one side; growing cool prismatic light from above touching upturned face on the other. Right hand moving toward chest beginning sign of cross. First moment cool alien light meets warm human face.</desc>

  <defs>
    <linearGradient id="p5p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a8a" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#15080a"/>
    </linearGradient>
    <radialGradient id="p5p3doorGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f5a850" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p5p3coolLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#a8b8e8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p5p3brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p5p3shawl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a302a"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="p5p3skinWarm" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5b878"/>
      <stop offset="100%" stop-color="#a87850"/>
    </linearGradient>
    <filter id="p5p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p5p3softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="p5p3dropShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <!-- Sky behind. -->
  <rect width="240" height="278" fill="url(#p5p3sky)"/>
  <!-- Cool prismatic wash from above (the falling-star light beginning). -->
  <rect width="240" height="160" fill="url(#p5p3coolLight)"/>

  <!-- Brick wall left. -->
  <rect x="0" y="60" width="100" height="218" fill="url(#p5p3brick)"/>
  <g stroke="#0a0204" stroke-width="0.4" opacity="0.7">
    <line x1="0" y1="80" x2="100" y2="80"/>
    <line x1="0" y1="100" x2="100" y2="100"/>
    <line x1="0" y1="120" x2="100" y2="120"/>
    <line x1="0" y1="140" x2="100" y2="140"/>
    <line x1="0" y1="160" x2="100" y2="160"/>
    <line x1="0" y1="180" x2="100" y2="180"/>
    <line x1="0" y1="200" x2="100" y2="200"/>
    <line x1="0" y1="220" x2="100" y2="220"/>
    <line x1="0" y1="240" x2="100" y2="240"/>
    <line x1="0" y1="260" x2="100" y2="260"/>
    <line x1="20" y1="70" x2="20" y2="90"/>
    <line x1="40" y1="90" x2="40" y2="110"/>
    <line x1="60" y1="110" x2="60" y2="130"/>
    <line x1="30" y1="130" x2="30" y2="150"/>
    <line x1="70" y1="150" x2="70" y2="170"/>
    <line x1="20" y1="170" x2="20" y2="190"/>
    <line x1="50" y1="190" x2="50" y2="210"/>
    <line x1="80" y1="210" x2="80" y2="230"/>
    <line x1="40" y1="230" x2="40" y2="250"/>
    <line x1="60" y1="250" x2="60" y2="278"/>
  </g>

  <!-- Open doorway behind, warm interior glow. -->
  <g id="p5p3-door">
    <rect x="0" y="68" width="48" height="210" fill="#0a0204"/>
    <rect x="6" y="76" width="36" height="202" fill="url(#p5p3doorGlow)" filter="url(#p5p3bloom)"/>
    <rect x="10" y="80" width="28" height="80" fill="#fff5d8" opacity="0.65"/>
    <rect x="12" y="82" width="24" height="74" fill="#ffe080" opacity="0.55"/>
    <line x1="48" y1="68" x2="48" y2="278" stroke="#5a2812" stroke-width="0.7"/>
    <line x1="0" y1="68" x2="48" y2="68" stroke="#5a2812" stroke-width="0.7"/>
  </g>

  <!-- Victorian woman, looking up. -->
  <g id="p5p3-woman" filter="url(#p5p3dropShadow)">
    <!-- Body / shoulders draped in heavy wool shawl. -->
    <path d="M80,180 Q70,228 80,278 L200,278 Q210,228 200,180 Q200,168 188,164 Q150,158 116,164 Q88,168 80,180 Z" fill="url(#p5p3shawl)"/>
    <!-- Shawl folds. -->
    <path d="M88,180 Q96,210 100,275" fill="none" stroke="#0a0604" stroke-width="0.8" opacity="0.65"/>
    <path d="M108,168 Q112,210 120,275" fill="none" stroke="#0a0604" stroke-width="0.8" opacity="0.65"/>
    <path d="M165,168 Q170,210 175,275" fill="none" stroke="#0a0604" stroke-width="0.8" opacity="0.65"/>
    <path d="M186,180 Q190,210 196,275" fill="none" stroke="#0a0604" stroke-width="0.8" opacity="0.65"/>
    <!-- Shawl collar / fold under chin. -->
    <path d="M120,160 Q140,156 160,160 L156,168 Q140,168 124,168 Z" fill="#1a1410"/>

    <!-- Right arm/hand moving toward chest. -->
    <path d="M155,168 Q170,180 168,210 L160,210 Q158,196 150,180 Z" fill="url(#p5p3shawl)"/>
    <ellipse cx="160" cy="206" rx="8" ry="6" fill="url(#p5p3skinWarm)"/>
    <!-- Fingers (about to make sign of cross). -->
    <line x1="156" y1="202" x2="158" y2="214" stroke="#7a4830" stroke-width="0.6"/>
    <line x1="160" y1="200" x2="162" y2="214" stroke="#7a4830" stroke-width="0.6"/>
    <line x1="164" y1="200" x2="166" y2="214" stroke="#7a4830" stroke-width="0.6"/>

    <!-- Neck. -->
    <path d="M132,140 L132,160 L148,160 L148,140 Z" fill="url(#p5p3skinWarm)"/>

    <!-- Head turned upward. -->
    <ellipse cx="140" cy="116" rx="24" ry="28" fill="url(#p5p3skinWarm)"/>

    <!-- Cool prismatic side (left from viewer). -->
    <path d="M116,116 Q120,86 140,80 L140,144 Q124,144 116,116 Z" fill="#bfe4ff" opacity="0.35"/>
    <path d="M125,100 Q135,100 140,108 L140,116 Q130,120 125,116 Z" fill="#c8b8ff" opacity="0.45"/>

    <!-- Warm amber side (right from viewer = doorway side). -->
    <path d="M140,80 Q160,86 164,116 Q160,144 140,144 Z" fill="#f5a850" opacity="0.32"/>

    <!-- Bonnet. -->
    <path d="M116,90 Q120,72 140,66 Q160,72 164,90 Q150,82 140,82 Q130,82 116,90 Z" fill="#1a1410"/>
    <path d="M120,128 Q130,140 132,136" fill="none" stroke="#1a1410" stroke-width="1.4"/>
    <path d="M160,128 Q150,140 148,136" fill="none" stroke="#1a1410" stroke-width="1.4"/>

    <!-- Hair temple edges. -->
    <path d="M120,90 Q122,100 124,116" fill="none" stroke="#3a2010" stroke-width="0.8" opacity="0.85"/>
    <path d="M160,90 Q158,100 156,116" fill="none" stroke="#3a2010" stroke-width="0.8" opacity="0.85"/>

    <!-- Eyes — wide, looking up, prismatic reflection. -->
    <ellipse cx="130" cy="106" rx="3.4" ry="2.4" fill="#ffffff"/>
    <ellipse cx="148" cy="106" rx="3.4" ry="2.4" fill="#ffffff"/>
    <ellipse cx="130" cy="104" rx="1.6" ry="1.4" fill="#1a0e08"/>
    <ellipse cx="148" cy="104" rx="1.6" ry="1.4" fill="#1a0e08"/>
    <ellipse cx="130.5" cy="103" rx="0.6" ry="0.5" fill="#bfe4ff"/>
    <ellipse cx="148.5" cy="103" rx="0.6" ry="0.5" fill="#bfe4ff"/>

    <!-- Eyebrows lifted. -->
    <path d="M124,96 Q130,94 136,97" fill="none" stroke="#1a0e08" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M142,97 Q148,94 154,96" fill="none" stroke="#1a0e08" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Nose (small triangle from below). -->
    <path d="M139,116 L137,128 Q140,130 142,128 L141,116 Z" fill="#7a4830" opacity="0.85"/>

    <!-- Mouth slightly open (gasp). -->
    <ellipse cx="140" cy="134" rx="3" ry="2" fill="#3a1810"/>
  </g>
</svg>
