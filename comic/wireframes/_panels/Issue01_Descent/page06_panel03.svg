<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 311" width="742" height="311">
  <title>Issue 1 — Page 6 — Panel 3: Same roofscape after the star, ultra-wide</title>
  <desc>Ultra-wide establishing at 18mm, slightly elevated angle. Same Victorian London roofscape as Page 5 Panel 1 but AFTER the event. Sky dark and clear, stars visible, prismatic streak completely gone. Fog resettles between dense chimney pots, slate roofs, church spires in thick amber-glowing layers. Gaslight rises from streets reclaiming night. A few lit windows. Chimney smoke drifts. City looks exactly as before — quiet, heavy, Victorian, entirely warm. No cool light anywhere. Reader knows: 5 tiny figures in a gutter pulling from wreckage. CAPTION: "The gas burns on. The city forgets."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p6p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1228"/>
      <stop offset="60%" stop-color="#15203a"/>
      <stop offset="100%" stop-color="#3a3018"/>
    </linearGradient>
    <linearGradient id="p6p3fog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818" stop-opacity="0"/>
      <stop offset="40%" stop-color="#5a3a18" stop-opacity="0.32"/>
      <stop offset="80%" stop-color="#a8682a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c8783a" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="p6p3gasGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#c87830" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p6p3brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#15080a"/>
    </linearGradient>
    <linearGradient id="p6p3slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1820"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <radialGradient id="p6p3windowGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f5a850" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="p6p3softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- Sky. -->
  <rect width="742" height="311" fill="url(#p6p3sky)"/>
  <!-- Stars (more visible because no streak distraction). -->
  <g fill="#dce4f0" opacity="0.85">
    <circle cx="68" cy="32" r="0.9"/>
    <circle cx="124" cy="18" r="0.7"/>
    <circle cx="186" cy="46" r="1.1"/>
    <circle cx="240" cy="12" r="0.8"/>
    <circle cx="298" cy="38" r="0.9"/>
    <circle cx="356" cy="24" r="1.3"/>
    <circle cx="408" cy="52" r="0.7"/>
    <circle cx="464" cy="18" r="1.0"/>
    <circle cx="522" cy="44" r="0.8"/>
    <circle cx="582" cy="22" r="0.9"/>
    <circle cx="638" cy="38" r="1.1"/>
    <circle cx="692" cy="12" r="0.7"/>
    <circle cx="42" cy="68" r="0.6"/>
    <circle cx="156" cy="82" r="0.7"/>
    <circle cx="278" cy="74" r="0.6"/>
    <circle cx="394" cy="88" r="0.7"/>
    <circle cx="512" cy="76" r="0.6"/>
    <circle cx="654" cy="84" r="0.7"/>
  </g>
  <g fill="#fff5d8" opacity="0.95">
    <circle cx="186" cy="46" r="1.6" filter="url(#p6p3softBloom)"/>
    <circle cx="356" cy="24" r="1.8" filter="url(#p6p3softBloom)"/>
    <circle cx="638" cy="38" r="1.6" filter="url(#p6p3softBloom)"/>
  </g>

  <!-- Fog band (slightly thicker than P5P1 — script says "resettling"). -->
  <rect y="160" width="742" height="151" fill="url(#p6p3fog)" opacity="0.95"/>
  <!-- Distant gaslight halos in fog. -->
  <ellipse cx="120" cy="240" rx="80" ry="32" fill="url(#p6p3gasGlow)" filter="url(#p6p3bloom)"/>
  <ellipse cx="320" cy="260" rx="100" ry="38" fill="url(#p6p3gasGlow)" filter="url(#p6p3bloom)"/>
  <ellipse cx="520" cy="245" rx="80" ry="32" fill="url(#p6p3gasGlow)" filter="url(#p6p3bloom)"/>
  <ellipse cx="680" cy="255" rx="60" ry="28" fill="url(#p6p3gasGlow)" filter="url(#p6p3bloom)"/>

  <!-- Distant rooftops + church spire (background). -->
  <path d="M0,140 L40,130 L60,136 L90,122 L130,130 L160,118 L200,126 L230,112 L270,122 L310,108 L340,118 L380,104 L420,114 L460,100 L500,112 L540,98 L580,108 L620,94 L660,106 L700,92 L742,104 L742,170 L0,170 Z" fill="url(#p6p3slate)" opacity="0.85"/>

  <!-- Distant church spire. -->
  <path d="M280,80 L290,60 L296,60 L300,40 L310,60 L316,60 L322,80 L322,170 L280,170 Z" fill="url(#p6p3slate)"/>
  <path d="M298,20 L302,20 L302,60 L298,60 Z" fill="url(#p6p3slate)"/>
  <line x1="300" y1="14" x2="300" y2="26" stroke="#1a1820" stroke-width="1.2"/>
  <line x1="296" y1="20" x2="304" y2="20" stroke="#1a1820" stroke-width="1.2"/>

  <!-- Distant chimney smoke plume. -->
  <ellipse cx="468" cy="100" rx="18" ry="38" fill="#3a2818" opacity="0.35" filter="url(#p6p3bloom)"/>
  <ellipse cx="476" cy="60" rx="14" ry="30" fill="#5a3a20" opacity="0.4" filter="url(#p6p3bloom)"/>

  <!-- Mid-ground rooftops + chimney pots (similar to P5P1). -->
  <path d="M0,190 L30,180 L60,188 L90,174 L120,184 L160,170 L200,180 L240,166 L280,178 L320,162 L360,174 L400,158 L440,170 L480,154 L520,166 L560,150 L600,162 L640,146 L680,158 L720,142 L742,152 L742,220 L0,220 Z" fill="url(#p6p3brick)"/>

  <!-- Chimney pot clusters. -->
  <g id="p6p3-chimneys">
    <rect x="50" y="160" width="8" height="22" fill="#3a1810"/>
    <rect x="60" y="156" width="8" height="26" fill="#3a1810"/>
    <rect x="48" y="158" width="22" height="3" fill="#5a2812"/>
    <rect x="148" y="158" width="6" height="20" fill="#3a1810"/>
    <rect x="156" y="154" width="6" height="24" fill="#3a1810"/>
    <rect x="164" y="158" width="6" height="20" fill="#3a1810"/>
    <rect x="146" y="156" width="26" height="3" fill="#5a2812"/>
    <rect x="358" y="160" width="8" height="20" fill="#3a1810"/>
    <rect x="368" y="156" width="8" height="24" fill="#3a1810"/>
    <rect x="378" y="158" width="8" height="22" fill="#3a1810"/>
    <rect x="356" y="158" width="32" height="3" fill="#5a2812"/>
    <rect x="498" y="158" width="6" height="22" fill="#3a1810"/>
    <rect x="506" y="154" width="6" height="26" fill="#3a1810"/>
    <rect x="514" y="156" width="6" height="24" fill="#3a1810"/>
    <rect x="496" y="156" width="26" height="3" fill="#5a2812"/>
    <rect x="618" y="156" width="6" height="22" fill="#3a1810"/>
    <rect x="626" y="152" width="8" height="26" fill="#3a1810"/>
    <rect x="616" y="154" width="20" height="3" fill="#5a2812"/>
  </g>

  <!-- Lit windows (warm amber points). -->
  <g id="p6p3-windows">
    <ellipse cx="222" cy="200" rx="20" ry="13" fill="url(#p6p3windowGlow)" filter="url(#p6p3bloom)"/>
    <rect x="214" y="192" width="16" height="18" fill="#fff5d8" opacity="0.95"/>
    <ellipse cx="468" cy="192" rx="16" ry="11" fill="url(#p6p3windowGlow)" filter="url(#p6p3bloom)"/>
    <rect x="462" y="186" width="12" height="14" fill="#fff5d8" opacity="0.9"/>
    <ellipse cx="600" cy="204" rx="14" ry="10" fill="url(#p6p3windowGlow)" filter="url(#p6p3bloom)" opacity="0.85"/>
    <rect x="595" y="199" width="10" height="12" fill="#fff5d8" opacity="0.85"/>
  </g>

  <!-- Foreground rooftop band. -->
  <path d="M0,260 L80,248 L150,256 L220,246 L290,256 L360,244 L430,254 L500,242 L570,252 L640,242 L720,252 L742,248 L742,311 L0,311 Z" fill="#0a0408"/>

  <!-- FG chimney stacks. -->
  <rect x="60" y="220" width="50" height="40" fill="#1a0810"/>
  <rect x="64" y="196" width="10" height="28" fill="#3a1810"/>
  <rect x="76" y="190" width="10" height="34" fill="#3a1810"/>
  <rect x="88" y="194" width="10" height="30" fill="#3a1810"/>
  <rect x="100" y="198" width="10" height="26" fill="#3a1810"/>
  <rect x="62" y="194" width="50" height="4" fill="#5a2812"/>
  <rect x="660" y="180" width="32" height="80" fill="#1a0810"/>
  <rect x="664" y="160" width="8" height="22" fill="#3a1810"/>
  <rect x="676" y="156" width="8" height="26" fill="#3a1810"/>
  <rect x="660" y="162" width="32" height="3" fill="#5a2812"/>

  <!-- Caption. -->
  <g id="p6p3-caption">
    <rect x="20" y="20" width="220" height="50" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="30" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="30" y="58" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">The gas burns on. The city forgets.</text>
  </g>

  <g id="p6p3-meta">
    <text x="730" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">3</text>
    <text x="734" y="304" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">WIDE</text>
  </g>
</svg>
