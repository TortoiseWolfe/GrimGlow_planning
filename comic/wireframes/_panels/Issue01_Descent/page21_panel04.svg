<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 1122" width="184" height="1122">
  <title>Issue 1 — Page 21 — Panel 4: Module locks, mask reassembled — "...damn."</title>
  <desc>MCU 65mm. Sable's thumb on data module pressing control — holographic display COLLAPSING, blue-white text vanishing, light dying. Face in profile turned slightly toward distant camp glows behind her. Command mask reassembled, almost perfect — but reader has seen underneath. Distant camp colored points + warm city-amber reassert at edges. Sable between the two lights again, but darkness she just encrypted is third kind reader knows. SABLE quiet whisper: "...damn."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p21p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p21p4silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa4b4"/>
      <stop offset="100%" stop-color="#3a3848"/>
    </linearGradient>
    <linearGradient id="p21p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#3a1810"/>
    </linearGradient>
    <radialGradient id="p21p4campGlow1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a87af0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a2acc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p4campGlow2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a1018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p4cityEdge" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p4dyingLight" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7ac8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p4fractureGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <filter id="p21p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p21p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Dark background. -->
  <rect width="184" height="1122" fill="url(#p21p4bg)"/>

  <!-- Distant warm city-glow at right edge. -->
  <ellipse cx="184" cy="600" rx="50" ry="700" fill="url(#p21p4cityEdge)" filter="url(#p21p4strongBloom)" opacity="0.6"/>

  <!-- Distant camp glows in BG-bottom (right side — toward camp behind her). -->
  <g id="p21p4-distant-camp">
    <ellipse cx="155" cy="1000" rx="22" ry="14" fill="url(#p21p4campGlow1)" filter="url(#p21p4strongBloom)" opacity="0.85"/>
    <circle cx="155" cy="1000" r="2" fill="#a87af0" filter="url(#p21p4bloom)" opacity="0.9"/>
    <ellipse cx="170" cy="1030" rx="18" ry="12" fill="url(#p21p4campGlow2)" filter="url(#p21p4strongBloom)" opacity="0.7"/>
    <circle cx="170" cy="1030" r="1.6" fill="#dc2030" filter="url(#p21p4bloom)" opacity="0.85"/>
  </g>

  <!-- Iron gutter floor. -->
  <rect y="1080" width="184" height="42" fill="#0a0408"/>
  <line x1="0" y1="1080" x2="184" y2="1080" stroke="#080404" stroke-width="0.8"/>
  <g fill="#080404" opacity="0.7">
    <circle cx="20" cy="1098" r="1.5"/>
    <circle cx="60" cy="1110" r="1.4"/>
    <circle cx="120" cy="1102" r="1.6"/>
    <circle cx="160" cy="1108" r="1.4"/>
  </g>

  <!-- Brick base of chimney stack at right edge (continuing visual from P21P1). -->
  <rect x="160" y="40" width="24" height="1080" fill="#3a1810" opacity="0.7"/>
  <g stroke="#080404" stroke-width="0.6" opacity="0.7">
    <line x1="160" y1="160" x2="184" y2="160"/>
    <line x1="160" y1="280" x2="184" y2="280"/>
    <line x1="160" y1="400" x2="184" y2="400"/>
    <line x1="160" y1="520" x2="184" y2="520"/>
    <line x1="160" y1="640" x2="184" y2="640"/>
    <line x1="160" y1="760" x2="184" y2="760"/>
    <line x1="160" y1="880" x2="184" y2="880"/>
    <line x1="160" y1="1000" x2="184" y2="1000"/>
  </g>

  <!-- SABLE — profile, turned right toward camp. Centered. -->
  <g id="p21p4-sable" transform="translate(80, 700)">

    <!-- Body in damaged silver suit, profile from left side. -->
    <path d="M-22,90 Q-26,30 -22,-15 L-12,-25 L18,-25 Q22,-15 22,90 Z" fill="url(#p21p4silver)" stroke="#3a3848" stroke-width="0.6"/>

    <!-- Cracked right shoulder (now closer to camera since she's turned). -->
    <ellipse cx="20" cy="-20" rx="7" ry="4" fill="#9ba1aa" stroke="#080408" stroke-width="0.4"/>
    <line x1="14" y1="-21" x2="26" y2="-18" stroke="#7ac8ff" stroke-width="1" filter="url(#p21p4bloom)" opacity="0.95"/>
    <ellipse cx="20" cy="-18" rx="14" ry="8" fill="url(#p21p4fractureGlow)" filter="url(#p21p4strongBloom)" opacity="0.45"/>

    <!-- Left shoulder. -->
    <ellipse cx="-22" cy="-20" rx="7" ry="4" fill="#5a606a" stroke="#080408" stroke-width="0.4"/>

    <!-- Right arm holding device, thumb pressing control. -->
    <path d="M22,-5 L20,15 L12,32" fill="none" stroke="url(#p21p4silver)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Hand. -->
    <ellipse cx="12" cy="32" rx="5" ry="4" fill="url(#p21p4skin)"/>
    <!-- Data module being held — light DYING. -->
    <rect x="-2" y="28" width="20" height="9" rx="2" fill="#1a1820" stroke="#080404" stroke-width="0.7"/>
    <rect x="0" y="30" width="16" height="2" fill="#3a4858"/>
    <!-- Just-extinguishing glow halo (smaller, fading). -->
    <ellipse cx="8" cy="32" rx="14" ry="6" fill="url(#p21p4dyingLight)" filter="url(#p21p4strongBloom)"/>
    <!-- Tiny last-flicker spark at the surface. -->
    <circle cx="6" cy="31" r="1" fill="#bfe4ff" filter="url(#p21p4bloom)" opacity="0.85"/>
    <!-- THUMB PRESSING control (visible from hand). -->
    <ellipse cx="6" cy="29" rx="2.5" ry="2" fill="url(#p21p4skin)"/>
    <!-- Faint last vertical residual text rising (almost gone). -->
    <g stroke="#bfe4ff" stroke-width="0.3" opacity="0.45">
      <line x1="4" y1="22" x2="12" y2="22"/>
      <line x1="6" y1="18" x2="10" y2="18"/>
    </g>

    <!-- Left arm at side (relaxed/composed now). -->
    <path d="M-22,-5 L-26,18 L-26,38" fill="none" stroke="url(#p21p4silver)" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-26" cy="38" rx="3.5" ry="2.5" fill="#5a3018"/>

    <!-- Legs. -->
    <path d="M-12,90 L-16,118 L-18,150" fill="none" stroke="#5a606a" stroke-width="7" stroke-linecap="round"/>
    <path d="M14,90 L18,118 L20,150" fill="none" stroke="#5a606a" stroke-width="7" stroke-linecap="round"/>

    <!-- HEAD — PROFILE turned right (toward camp). -->
    <ellipse cx="6" cy="-50" rx="13" ry="14" fill="url(#p21p4skin)" transform="rotate(15 6 -50)"/>
    <!-- Buzz cap silver-white. -->
    <path d="M-2,-58 Q4,-64 9,-64 Q14,-64 17,-58 L17,-50 L-2,-50 Z" fill="#e8eaee" transform="rotate(15 6 -50)"/>
    <path d="M-2,-58 Q9,-62 17,-58" fill="none" stroke="#9aa4b4" stroke-width="0.6" opacity="0.7" transform="rotate(15 6 -50)"/>
    <!-- Buzz stipple. -->
    <g fill="#5a606a" opacity="0.6" transform="rotate(15 6 -50)">
      <circle cx="2" cy="-60" r="0.5"/>
      <circle cx="6" cy="-61" r="0.5"/>
      <circle cx="10" cy="-62" r="0.5"/>
      <circle cx="14" cy="-60" r="0.5"/>
    </g>

    <!-- PROFILE FACE FEATURES (eye + lips visible from left side). -->
    <!-- Eye (small, set, looking right toward camp). -->
    <ellipse cx="2" cy="-50" rx="1.4" ry="0.9" fill="#1a0808"/>
    <ellipse cx="2" cy="-50" rx="0.6" ry="0.6" fill="#080404"/>
    <!-- Cool catch-light (dying device + cool fracture). -->
    <circle cx="1" cy="-50.5" r="0.3" fill="#dceaff"/>
    <!-- Brow set. -->
    <path d="M-2,-55 Q2,-56 6,-55" stroke="#3a1808" stroke-width="0.8" fill="none"/>
    <!-- Profile nose. -->
    <path d="M0,-46 L-3,-40 L-2,-37 L0,-37 Z" fill="#3a1808" opacity="0.6"/>
    <line x1="-2" y1="-37" x2="0" y2="-37" stroke="#1a0808" stroke-width="0.6"/>
    <!-- Lips (mouth slightly open — speaking the quiet "damn"). -->
    <path d="M-3,-30 Q0,-29 3,-30" stroke="#3a1808" stroke-width="1.2" fill="none"/>
    <line x1="-2" y1="-30" x2="2" y2="-30" stroke="#1a0808" stroke-width="0.6"/>
    <!-- Cheekbone (catching faint warm from city right side). -->
    <ellipse cx="8" cy="-44" rx="2.5" ry="1.4" fill="#a87850" opacity="0.55"/>
    <ellipse cx="9" cy="-44" rx="1.5" ry="0.8" fill="#f5b860" opacity="0.4"/>
    <!-- Jaw set. -->
    <path d="M-3,-37 Q4,-32 12,-37" fill="none" stroke="#1a0808" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- SABLE balloon (small, quiet, intimate — top center area). -->
  <g id="p21p4-dlg-sable">
    <rect x="14" y="14" width="120" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#3a3030">...damn.</text>
    <path d="M70,60 L88,60 L82,76 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="70" y1="60" x2="88" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p21p4-meta">
    <text x="176" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" opacity="0.85">4</text>
    <text x="180" y="1116" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="7" fill="#fff" opacity="0.7">MASK REASSEMBLED</text>
  </g>
</svg>
