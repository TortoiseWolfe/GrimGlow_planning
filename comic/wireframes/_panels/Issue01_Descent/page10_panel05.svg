<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 420" width="366" height="420">
  <title>Issue 1 — Page 10 — Panel 5: Sable receives report — commander's mask settling</title>
  <desc>MS slight low angle (50mm). Sable arms crossed chin slightly lowered eyes forward — absorbing info + already planning. Commander's mask settling: eyes level jaw firm smallest nod = acceptance weaponized into purpose. Behind shoulder distant Victorian cityscape gutter-edge — warm amber gaslight rooftops chimney stacks fog stretching to horizon. Warm amber rim light around silver hair + shoulder. Face mixed light: fading blue-white wreckage left + warm amber right. Amber winning. SABLE orders Wren+Luma+"Jink--" + JINK O.P. "I can fly."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p5sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p10p5cityHaze" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#c87830" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p10p5silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfc6d0"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <radialGradient id="p10p5fractureGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p5backRim" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p5coolFade" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p10p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="366" height="420" fill="url(#p10p5sky)"/>

  <!-- Stars top. -->
  <g fill="#dce4f0" opacity="0.6">
    <circle cx="40" cy="30" r="0.6"/>
    <circle cx="120" cy="42" r="0.5"/>
    <circle cx="220" cy="32" r="0.6"/>
    <circle cx="320" cy="40" r="0.5"/>
    <circle cx="80" cy="80" r="0.5"/>
    <circle cx="280" cy="78" r="0.5"/>
  </g>

  <!-- Distant Victorian cityscape (over Sable's shoulder). -->
  <rect y="160" width="366" height="120" fill="url(#p10p5cityHaze)" opacity="0.85"/>
  <g id="p10p5-far-city">
    <path d="M0,200 L40,196 L80,200 L120,192 L160,200 L200,190 L240,200 L280,188 L320,198 L366,194 L366,260 L0,260 Z" fill="#1a1820" opacity="0.85"/>
    <polygon points="80,178 86,200 74,200" fill="#1a1820"/>
    <polygon points="200,174 208,198 192,198" fill="#1a1820"/>
    <polygon points="320,176 326,196 314,196" fill="#1a1820"/>
    <rect x="148" y="168" width="5" height="32" fill="#0a0808"/>
    <ellipse cx="170" cy="158" rx="32" ry="9" fill="#3a2818" opacity="0.5"/>
    <!-- Mid roofs + chimney pots + lit windows. -->
    <path d="M0,260 L60,256 L120,262 L180,254 L240,262 L300,256 L360,262 L366,260 L366,290 L0,290 Z" fill="#0a0808"/>
    <g fill="#3a1810">
      <rect x="50" y="244" width="5" height="16"/>
      <rect x="160" y="242" width="5" height="18"/>
      <rect x="280" y="244" width="5" height="16"/>
    </g>
    <ellipse cx="100" cy="278" rx="6" ry="3" fill="#fff5d8" filter="url(#p10p5bloom)" opacity="0.85"/>
    <ellipse cx="280" cy="278" rx="5" ry="3" fill="#fff5d8" filter="url(#p10p5bloom)" opacity="0.7"/>
  </g>

  <!-- Distant streets w/ amber pools. -->
  <ellipse cx="80" cy="305" rx="50" ry="6" fill="url(#p10p5cityHaze)" filter="url(#p10p5bloom)" opacity="0.85"/>
  <ellipse cx="240" cy="308" rx="55" ry="7" fill="url(#p10p5cityHaze)" filter="url(#p10p5bloom)" opacity="0.95"/>

  <!-- Strong WARM AMBER backlight halo behind Sable (golden rim source). -->
  <ellipse cx="183" cy="240" rx="160" ry="120" fill="url(#p10p5backRim)" filter="url(#p10p5strongBloom)" opacity="0.7"/>

  <!-- Cool wreckage glow from FAR-LEFT (fading per script — fading blue-white from wreckage). -->
  <ellipse cx="0" cy="280" rx="120" ry="200" fill="url(#p10p5coolFade)" filter="url(#p10p5strongBloom)"/>

  <!-- SABLE — centered, slight low angle. Arms crossed. -->
  <g id="p10p5-sable" transform="translate(183, 290)">

    <!-- Body in damaged silver suit. -->
    <path d="M-26,90 Q-30,30 -25,-25 L-12,-40 L18,-40 Q24,-25 28,-25 Q32,30 26,90 Z" fill="url(#p10p5silver)" stroke="#3a3848" stroke-width="0.8"/>
    <!-- Cool wash on left side (fading wreckage). -->
    <path d="M-26,90 Q-30,30 -25,-25 L0,-25 L0,90 Z" fill="#7ac8ff" opacity="0.18"/>
    <!-- Warm wash on right side (winning amber). -->
    <path d="M0,-25 L18,-40 Q24,-25 28,-25 Q32,30 26,90 L0,90 Z" fill="#f5b860" opacity="0.22"/>

    <!-- CRACKED RIGHT shoulder bleeding blue-white. -->
    <ellipse cx="22" cy="-22" rx="9" ry="5" fill="#9ba1aa" stroke="#080408" stroke-width="0.5"/>
    <line x1="16" y1="-23" x2="28" y2="-20" stroke="#7ac8ff" stroke-width="1.2" filter="url(#p10p5bloom)" opacity="0.95"/>
    <ellipse cx="22" cy="-20" rx="14" ry="8" fill="url(#p10p5fractureGlow)" filter="url(#p10p5strongBloom)" opacity="0.5"/>
    <!-- Left shoulder. -->
    <ellipse cx="-22" cy="-22" rx="9" ry="5" fill="#9ba1aa" stroke="#080408" stroke-width="0.5"/>

    <!-- ARMS CROSSED across chest. -->
    <path d="M-22,-10 L0,5 L22,8" fill="none" stroke="url(#p10p5silver)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M22,-5 L0,8 L-22,12" fill="none" stroke="url(#p10p5silver)" stroke-width="6" stroke-linecap="round"/>
    <!-- Hands tucked. -->
    <ellipse cx="22" cy="8" rx="4.5" ry="3" fill="#5a3018"/>
    <ellipse cx="-22" cy="12" rx="4.5" ry="3" fill="#5a3018"/>

    <!-- Legs standing firm. -->
    <path d="M-12,90 L-16,118 L-18,140" fill="none" stroke="#5a606a" stroke-width="9" stroke-linecap="round"/>
    <path d="M14,90 L18,118 L20,140" fill="none" stroke="#5a606a" stroke-width="9" stroke-linecap="round"/>

    <!-- HEAD — chin slightly lowered, eyes forward (the absorptive posture per script). -->
    <ellipse cx="2" cy="-52" rx="13" ry="14" fill="#5a3018"/>
    <!-- Buzz cap silver-white. -->
    <path d="M-9,-60 Q-3,-66 2,-66 Q7,-66 13,-60 L13,-52 L-9,-52 Z" fill="#e8eaee"/>
    <path d="M-9,-60 Q2,-64 13,-60" fill="none" stroke="#9aa4b4" stroke-width="0.7" opacity="0.7"/>
    <!-- Buzz stipple. -->
    <g fill="#5a606a" opacity="0.6">
      <circle cx="-5" cy="-62" r="0.5"/>
      <circle cx="-1" cy="-63" r="0.5"/>
      <circle cx="3" cy="-64" r="0.5"/>
      <circle cx="7" cy="-63" r="0.5"/>
      <circle cx="11" cy="-60" r="0.5"/>
    </g>
    <!-- Soot dust. -->
    <g fill="#3a2818" opacity="0.5">
      <circle cx="0" cy="-65" r="0.7"/>
      <circle cx="6" cy="-66" r="0.6"/>
    </g>
    <!-- WARM AMBER rim catching silver hair (script-specific — golden rim around hair+shoulder). -->
    <path d="M-9,-60 Q2,-64 13,-60" fill="none" stroke="#f5b860" stroke-width="1" opacity="0.85" filter="url(#p10p5bloom)"/>
    <!-- Warm rim on right shoulder. -->
    <path d="M28,-25 Q32,30 26,90" fill="none" stroke="#f5b860" stroke-width="1.6" opacity="0.7" filter="url(#p10p5bloom)"/>

    <!-- Face: eyes level (commander focus), jaw firm. -->
    <ellipse cx="-3" cy="-52" rx="1.5" ry="1.1" fill="#1a0808"/>
    <ellipse cx="6" cy="-52" rx="1.5" ry="1.1" fill="#1a0808"/>
    <ellipse cx="-3" cy="-52.5" rx="0.6" ry="0.7" fill="#080404"/>
    <ellipse cx="6" cy="-52.5" rx="0.6" ry="0.7" fill="#080404"/>
    <!-- Mixed catch-lights: cool LEFT eye (fading wreckage) + warm RIGHT eye (winning amber). -->
    <circle cx="-3" cy="-53" r="0.4" fill="#dceaff"/>
    <circle cx="6" cy="-53" r="0.4" fill="#fff5d0"/>
    <!-- Brow level (commander focus, not surprise). -->
    <path d="M-7,-58 Q-3,-59 1,-58" stroke="#3a1808" stroke-width="0.9" fill="none"/>
    <path d="M3,-58 Q6,-59 9,-58" stroke="#3a1808" stroke-width="0.9" fill="none"/>
    <!-- Lips: firm set, smallest nod-of-acceptance. -->
    <line x1="-3" y1="-42" x2="7" y2="-42" stroke="#3a1808" stroke-width="1.2"/>
    <!-- Cheekbones cool-LEFT warm-RIGHT (the dual-light per script). -->
    <ellipse cx="-7" cy="-46" rx="3" ry="1.7" fill="#7a4830" opacity="0.5"/>
    <ellipse cx="9" cy="-46" rx="3" ry="1.7" fill="#a87850" opacity="0.6"/>
    <ellipse cx="-7" cy="-46" rx="2" ry="1" fill="#dceaff" opacity="0.3"/>
    <ellipse cx="9" cy="-46" rx="2" ry="1" fill="#f5d090" opacity="0.5"/>
    <!-- Nose. -->
    <path d="M2,-48 L0,-43 L4,-43 Z" fill="#3a1808" opacity="0.5"/>
  </g>

  <!-- SABLE long order balloon (top). -->
  <g id="p10p5-dlg-sable">
    <rect x="14" y="14" width="338" height="116" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Then we work with what we have.</text>
    <text x="24" y="68" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Wren, full inventory at first light.</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Luma, medical status — who can</text>
    <text x="24" y="100" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">move, who can't.</text>
    <text x="24" y="120" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Jink--</text>
    <path d="M150,130 L168,130 L186,250 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="150" y1="130" x2="168" y2="130" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- JINK O.P. response (dashed, no tail). -->
  <g id="p10p5-dlg-jink-op">
    <rect x="14" y="350" width="170" height="46" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-dasharray="4,3" filter="url(#balloonShadow)"/>
    <text x="24" y="370" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK (O.P.)</text>
    <text x="24" y="388" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">I can fly.</text>
  </g>

  <!-- Meta tag. -->
  <g id="p10p5-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">5</text>
    <text x="362" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE — MASK SETTLES</text>
  </g>
</svg>
