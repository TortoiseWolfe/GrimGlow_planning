<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 450" width="247" height="450">
  <title>Issue 1 — Page 17 — Panel 3: Sable absorbs the verdict — close-up</title>
  <desc>Close-up slight low angle 85mm. Sable's face DOMINATES frame. Jaw sets. Eyes narrow fractionally. Muscle tightens at temple. Controlled devastation transitioning to resolve in single heartbeat. Cool blue-white from cracked panels catches jaw + temple from RIGHT. Warm amber from below from LEFT, softening nothing. Face is a battlefield of light. SABLE: "What do you need?"</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p3bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="50%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#0a3050"/>
    </linearGradient>
    <radialGradient id="p17p3warmLeft" cx="0%" cy="100%" r="120%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p17p3coolRight" cx="100%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#dce4ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#7af0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p17p3silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dce0e8"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <radialGradient id="p17p3blueWhiteCrack">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7af0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p17p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p17p3deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark gradient (dual-source dark). -->
  <rect width="247" height="450" fill="url(#p17p3bg)"/>
  <!-- Strong WARM AMBER from below-left. -->
  <ellipse cx="0" cy="450" rx="350" ry="320" fill="url(#p17p3warmLeft)" filter="url(#p17p3deepBloom)" opacity="0.95"/>
  <!-- Strong COOL BLUE-WHITE from upper-right. -->
  <ellipse cx="247" cy="0" rx="350" ry="320" fill="url(#p17p3coolRight)" filter="url(#p17p3deepBloom)" opacity="0.85"/>

  <!-- SABLE FACE — close-up dominant in frame. Head fills upper 2/3. -->
  <g id="p17p3-sable" transform="translate(124, 220)">

    <!-- SUIT COLLAR + SHOULDERS BELOW — extending off bottom of frame. -->
    <path d="M-110,180 L-100,140 L-50,110 L-30,90 L30,90 L50,110 L100,140 L110,180 L110,250 L-110,250 Z" fill="url(#p17p3silver)" stroke="#080408" stroke-width="0.8"/>
    <!-- Shoulder accent seam. -->
    <line x1="-50" y1="115" x2="-30" y2="92" stroke="#dce4ff" stroke-width="0.8" opacity="0.7" filter="url(#p17p3bloom)"/>
    <line x1="50" y1="115" x2="30" y2="92" stroke="#dce4ff" stroke-width="0.8" opacity="0.7" filter="url(#p17p3bloom)"/>

    <!-- CRACKED RIGHT SHOULDER bleed (script-specific, source of cool light). -->
    <ellipse cx="60" cy="125" rx="18" ry="12" fill="url(#p17p3blueWhiteCrack)" filter="url(#p17p3strongBloom)" opacity="0.95"/>
    <g stroke="#080408" stroke-width="0.7" fill="none">
      <line x1="50" y1="118" x2="70" y2="135"/>
      <line x1="55" y1="125" x2="65" y2="115"/>
    </g>
    <g stroke="#dce4ff" stroke-width="0.7" filter="url(#p17p3bloom)">
      <line x1="55" y1="120" x2="65" y2="130"/>
      <line x1="60" y1="115" x2="62" y2="135"/>
    </g>

    <!-- NECK. -->
    <path d="M-26,40 L-30,90 L30,90 L26,40 Z" fill="#5a3818"/>
    <!-- Neck cool/warm dual catch. -->
    <ellipse cx="20" cy="65" rx="10" ry="15" fill="#dce4ff" opacity="0.5" filter="url(#p17p3bloom)"/>
    <ellipse cx="-20" cy="65" rx="10" ry="15" fill="#f5b860" opacity="0.5" filter="url(#p17p3bloom)"/>

    <!-- HEAD — large, dominant. -->
    <ellipse cx="0" cy="-30" rx="80" ry="90" fill="#5a3818"/>

    <!-- WARM AMBER WASH on LEFT half of face (script-specific). -->
    <path d="M-80,-90 Q-78,30 -56,75 L0,90 L-80,90 Z" fill="#f5b860" opacity="0.55" filter="url(#p17p3bloom)"/>
    <!-- COOL BLUE-WHITE catch on RIGHT half (script-specific). -->
    <path d="M0,-90 L80,-90 L80,30 Q60,15 50,55 L0,90 Z" fill="#dce4ff" opacity="0.45" filter="url(#p17p3bloom)"/>
    <!-- Stronger COOL CATCH on RIGHT TEMPLE (script: muscle tightens at temple). -->
    <ellipse cx="56" cy="-50" rx="18" ry="26" fill="#7af0ff" opacity="0.7" filter="url(#p17p3strongBloom)"/>
    <!-- Stronger COOL CATCH on RIGHT JAW. -->
    <ellipse cx="50" cy="40" rx="24" ry="18" fill="#dce4ff" opacity="0.75" filter="url(#p17p3bloom)"/>

    <!-- SILVER-WHITE CROPPED HAIR — buzz cap top. -->
    <path d="M-65,-70 Q-50,-92 -25,-100 Q0,-105 25,-100 Q50,-92 65,-70 L65,-40 L-65,-40 Z" fill="#c8ccd4"/>
    <!-- Hairline fade at bottom of buzz. -->
    <path d="M-65,-40 L65,-40" stroke="#a8acb4" stroke-width="0.7" opacity="0.85"/>
    <!-- Buzz stipples (heavy density). -->
    <g fill="#a8acb4" opacity="0.85">
      <circle cx="-40" cy="-78" r="1.2"/>
      <circle cx="-28" cy="-86" r="1.2"/>
      <circle cx="-15" cy="-92" r="1.2"/>
      <circle cx="0" cy="-95" r="1.2"/>
      <circle cx="15" cy="-92" r="1.2"/>
      <circle cx="28" cy="-86" r="1.2"/>
      <circle cx="40" cy="-78" r="1.2"/>
      <circle cx="-32" cy="-68" r="1"/>
      <circle cx="-8" cy="-78" r="1"/>
      <circle cx="20" cy="-72" r="1"/>
      <circle cx="-20" cy="-72" r="1"/>
      <circle cx="8" cy="-86" r="1"/>
      <circle cx="32" cy="-65" r="1"/>
      <circle cx="-50" cy="-60" r="0.8"/>
      <circle cx="50" cy="-60" r="0.8"/>
    </g>
    <!-- Silver hair COOL CATCH on right side (script-specific). -->
    <path d="M-15,-100 Q25,-100 65,-70" fill="none" stroke="#dce4ff" stroke-width="3" opacity="0.85" filter="url(#p17p3bloom)"/>
    <path d="M5,-95 Q35,-90 60,-65" fill="none" stroke="#7af0ff" stroke-width="1.5" opacity="0.65" filter="url(#p17p3bloom)"/>
    <!-- Silver hair WARM CATCH on left side. -->
    <path d="M-65,-70 Q-35,-90 -15,-100" fill="none" stroke="#f5e060" stroke-width="2" opacity="0.65" filter="url(#p17p3bloom)"/>

    <!-- FOREHEAD — slight furrow + tension lines (controlled devastation). -->
    <path d="M-40,-40 Q-25,-46 -10,-40" stroke="#3a1810" stroke-width="1.6" fill="none"/>
    <path d="M10,-40 Q25,-46 40,-40" stroke="#3a1810" stroke-width="1.6" fill="none"/>
    <!-- Tension line between brows. -->
    <line x1="0" y1="-32" x2="3" y2="-12" stroke="#3a1810" stroke-width="1.2" opacity="0.7"/>

    <!-- BROW set hard. -->
    <path d="M-42,-28 Q-25,-38 -8,-30" stroke="#080404" stroke-width="3" fill="none"/>
    <path d="M8,-30 Q25,-38 42,-28" stroke="#080404" stroke-width="3" fill="none"/>

    <!-- EYES — narrowed fractionally, looking PAST viewer (script-specific). -->
    <!-- Eye sockets. -->
    <ellipse cx="-22" cy="-18" rx="14" ry="6" fill="#3a2010" opacity="0.65"/>
    <ellipse cx="22" cy="-18" rx="14" ry="6" fill="#3a2010" opacity="0.65"/>
    <!-- Eye whites narrowed. -->
    <path d="M-32,-18 Q-22,-13 -12,-18 Q-22,-22 -32,-18 Z" fill="#3a2010"/>
    <path d="M12,-18 Q22,-13 32,-18 Q22,-22 12,-18 Z" fill="#3a2010"/>
    <!-- Iris (looking slightly off-camera). -->
    <ellipse cx="-21" cy="-17" rx="4" ry="3.5" fill="#1a0808"/>
    <ellipse cx="23" cy="-17" rx="4" ry="3.5" fill="#1a0808"/>
    <!-- Pupils. -->
    <circle cx="-21" cy="-17" r="2" fill="#080404"/>
    <circle cx="23" cy="-17" r="2" fill="#080404"/>
    <!-- Cool catch in right eye (from cracked panel side). -->
    <circle cx="25" cy="-19" r="1.2" fill="#dce4ff"/>
    <!-- Warm catch in left eye. -->
    <circle cx="-19" cy="-19" r="1.2" fill="#f5b860"/>

    <!-- DEFINED CHEEKBONES — sharp. -->
    <ellipse cx="-42" cy="14" rx="14" ry="7" fill="#3a2010" opacity="0.6"/>
    <ellipse cx="42" cy="14" rx="14" ry="7" fill="#3a2010" opacity="0.6"/>
    <!-- Cool catch on right cheekbone (script-specific). -->
    <ellipse cx="42" cy="13" rx="12" ry="5" fill="#7af0ff" opacity="0.65" filter="url(#p17p3bloom)"/>
    <!-- Warm catch on left cheekbone. -->
    <ellipse cx="-42" cy="13" rx="12" ry="5" fill="#f5b860" opacity="0.65" filter="url(#p17p3bloom)"/>

    <!-- NOSE shadow + nostril hint. -->
    <path d="M-3,-5 L0,15 L-3,22" stroke="#3a2010" stroke-width="1" fill="none" opacity="0.85"/>
    <path d="M3,-5 L4,15" stroke="#3a2010" stroke-width="0.5" fill="none" opacity="0.7"/>
    <ellipse cx="-3" cy="22" rx="2" ry="1" fill="#1a0808"/>
    <ellipse cx="3" cy="22" rx="2" ry="1" fill="#1a0808"/>

    <!-- LIPS — set firm, jaw clenched. -->
    <path d="M-16,40 Q0,42 18,40" stroke="#3a1810" stroke-width="3" fill="none"/>
    <line x1="-16" y1="40" x2="18" y2="40" stroke="#1a0810" stroke-width="0.9"/>
    <!-- Bottom lip. -->
    <path d="M-12,40 Q0,46 14,40" fill="#3a1810" opacity="0.55"/>

    <!-- JAW SET — visible muscle tension at TEMPLE (script-specific). -->
    <ellipse cx="56" cy="-30" rx="4" ry="9" fill="#3a1810" opacity="0.75"/>
    <!-- Temple muscle line (visible bulge). -->
    <line x1="56" y1="-40" x2="58" y2="-15" stroke="#3a1810" stroke-width="1" opacity="0.85"/>
    <!-- Jaw muscle bumps near jaw. -->
    <ellipse cx="48" cy="30" rx="4" ry="3" fill="#3a1810" opacity="0.75"/>
    <ellipse cx="-48" cy="30" rx="4" ry="3" fill="#3a1810" opacity="0.55"/>

    <!-- JAWLINE definition (sharp). -->
    <path d="M-66,40 Q-50,72 -25,88 L25,88 Q50,72 66,40" fill="none" stroke="#3a1810" stroke-width="1.2" opacity="0.7"/>

    <!-- CHIN catch (cool from right). -->
    <ellipse cx="3" cy="65" rx="18" ry="6" fill="#dce4ff" opacity="0.55" filter="url(#p17p3bloom)"/>
  </g>

  <!-- SABLE dialogue (top of frame). -->
  <g id="p17p3-dlg-sable">
    <rect x="14" y="14" width="218" height="44" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="33" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">What do you need?</text>
    <path d="M118,58 L136,58 L128,140 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="118" y1="58" x2="136" y2="58" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p17p3-meta">
    <text x="239" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">3</text>
    <text x="243" y="442" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE ABSORBS</text>
  </g>
</svg>
