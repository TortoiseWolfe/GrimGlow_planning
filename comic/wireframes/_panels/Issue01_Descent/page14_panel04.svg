<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 380" width="742" height="380">
  <title>Issue 1 — Page 14 — Panel 4: THE SECTION CLOSER — squad at threshold</title>
  <desc>Ultra-wide 18mm slight low angle from inside cast-iron rain gutter looking outward. Five figures stand facing vast Victorian cityscape beyond gutter lip. Center: Sable silver forward-facing set. Left: Wren copper arms folded calculating. Right: Luma sapphire-violet scanner at side head tilted curious. Behind-left: Thresh ruby standing now squared shoulders weapon holstered watchful. Behind-right: Jink emerald wing-pack folded still for once. Behind: wreckage DARK = dead alien tech twisted hull plating shattered panels NO MORE LIGHT. Ahead past gutter lip and drop: vast Victorian city to horizon — warm amber gaslight fog-glow chimney smoke dense rooftops church spires endless world of amber light. Alien light is dead. Entire panel lit by warm city. Only cool light = faint suit holographic accent nodes 5 different colors faintly through cracks/seams = they are their own light source now. SABLE survival declaration + "Questions?"</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="p14p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p14p4cityHaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="p14p4iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p14p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#180a08"/>
    </linearGradient>
    <radialGradient id="p14p4cityGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c87830" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p14p4windowDot" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffe0a0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p14p4silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfc6d0"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p14p4copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <linearGradient id="p14p4sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5af0"/>
      <stop offset="100%" stop-color="#2a18a0"/>
    </linearGradient>
    <linearGradient id="p14p4ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <linearGradient id="p14p4emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a5a30"/>
    </linearGradient>
    <filter id="p14p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p14p4softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p14p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="742" height="380" fill="url(#p14p4sky)"/>

  <!-- Stars. -->
  <g fill="#dce4f0" opacity="0.85">
    <circle cx="48" cy="22" r="0.7"/>
    <circle cx="120" cy="32" r="0.5"/>
    <circle cx="200" cy="22" r="0.8"/>
    <circle cx="280" cy="38" r="0.6"/>
    <circle cx="380" cy="28" r="0.9"/>
    <circle cx="460" cy="42" r="0.7"/>
    <circle cx="560" cy="22" r="0.7"/>
    <circle cx="640" cy="38" r="0.8"/>
    <circle cx="720" cy="28" r="0.7"/>
  </g>

  <!-- Distant amber haze. -->
  <rect y="100" width="742" height="80" fill="url(#p14p4cityHaze)" opacity="0.85"/>

  <!-- VAST VICTORIAN CITYSCAPE BEYOND — far horizon w/ St Paul's, spires, factories. -->
  <g id="p14p4-far-city">
    <path d="M0,160 L40,156 L60,162 L90,152 L130,162 L160,150 L200,162 L240,148 L280,160 L320,148 L360,160 L400,148 L440,160 L480,148 L520,162 L560,148 L600,160 L640,148 L680,160 L720,150 L742,160 L742,200 L0,200 Z" fill="#1a1820" opacity="0.85"/>
    <polygon points="118,138 124,160 112,160" fill="#1a1820"/>
    <polygon points="278,134 284,158 272,158" fill="#1a1820"/>
    <polygon points="438,138 444,160 432,160" fill="#1a1820"/>
    <polygon points="595,134 604,160 586,160" fill="#1a1820"/>
    <rect x="218" y="118" width="5" height="42" fill="#0a0808"/>
    <rect x="538" y="115" width="5" height="45" fill="#0a0808"/>
    <ellipse cx="240" cy="105" rx="38" ry="9" fill="#3a2818" opacity="0.5"/>
    <ellipse cx="560" cy="100" rx="42" ry="11" fill="#3a2818" opacity="0.5"/>
    <!-- St. Paul's dome. -->
    <g transform="translate(420, 160)">
      <path d="M-22,0 Q-22,-22 0,-30 Q22,-22 22,0 Z" fill="#1a1820"/>
      <rect x="-2" y="-38" width="4" height="8" fill="#1a1820"/>
      <ellipse cx="0" cy="-32" rx="4" ry="2" fill="#1a1820"/>
    </g>
  </g>

  <!-- Mid roofs + chimney pots + lit windows. -->
  <g id="p14p4-mid-roofs">
    <path d="M0,200 L30,196 L60,202 L90,194 L130,202 L160,194 L200,202 L240,194 L280,202 L320,194 L360,202 L400,194 L440,202 L480,194 L520,202 L560,194 L600,202 L640,194 L680,202 L720,194 L742,200 L742,235 L0,235 Z" fill="#0a0808"/>
    <g fill="#3a1810">
      <rect x="48" y="180" width="5" height="20"/>
      <rect x="148" y="180" width="5" height="20"/>
      <rect x="358" y="180" width="5" height="20"/>
      <rect x="498" y="180" width="5" height="20"/>
      <rect x="638" y="180" width="5" height="20"/>
    </g>
    <ellipse cx="222" cy="222" rx="11" ry="6" fill="url(#p14p4windowDot)" filter="url(#p14p4bloom)"/>
    <ellipse cx="468" cy="222" rx="10" ry="5" fill="url(#p14p4windowDot)" filter="url(#p14p4bloom)" opacity="0.85"/>
    <ellipse cx="640" cy="222" rx="10" ry="6" fill="url(#p14p4windowDot)" filter="url(#p14p4bloom)" opacity="0.85"/>
  </g>

  <!-- Distant streets w/ amber pools (visible far below horizon). -->
  <g>
    <ellipse cx="180" cy="240" rx="60" ry="6" fill="url(#p14p4cityGlow)" filter="url(#p14p4bloom)" opacity="0.85"/>
    <ellipse cx="380" cy="245" rx="80" ry="8" fill="url(#p14p4cityGlow)" filter="url(#p14p4bloom)" opacity="0.95"/>
    <ellipse cx="580" cy="240" rx="60" ry="6" fill="url(#p14p4cityGlow)" filter="url(#p14p4bloom)" opacity="0.85"/>
  </g>

  <!-- Strong warm amber city-glow rises (the light source for whole panel). -->
  <ellipse cx="371" cy="380" rx="500" ry="120" fill="url(#p14p4cityGlow)" filter="url(#p14p4strongBloom)" opacity="0.85"/>

  <!-- WRECKAGE BEHIND (dark, dead, BG-back area visible above gutter wall behind squad). -->
  <g id="p14p4-wreckage-behind" opacity="0.6">
    <path d="M40,80 L120,75 L130,110 L60,115 L20,108 Z" fill="#1a1a24"/>
    <path d="M620,82 L700,78 L720,108 L640,115 L600,110 Z" fill="#1a1a24"/>
    <!-- Dead-flat darkness (no lights). -->
  </g>

  <!-- IRON GUTTER LIP — curved across foreground. -->
  <g id="p14p4-gutter-lip">
    <path d="M0,240 Q371,232 742,240 L742,290 L0,290 Z" fill="url(#p14p4iron)"/>
    <line x1="0" y1="240" x2="742" y2="232" stroke="#080404" stroke-width="2"/>
    <!-- Iron rivets. -->
    <g fill="#080404" opacity="0.85">
      <circle cx="80" cy="248" r="2.5"/>
      <circle cx="240" cy="240" r="2.5"/>
      <circle cx="500" cy="240" r="2.5"/>
      <circle cx="660" cy="248" r="2.5"/>
    </g>
    <!-- Warm amber rim catching iron lip top. -->
    <path d="M0,240 Q371,232 742,240" fill="none" stroke="#f5b860" stroke-width="1.5" opacity="0.85" filter="url(#p14p4bloom)"/>
  </g>

  <!-- Floor inside gutter (where squad stands). -->
  <rect y="290" width="742" height="90" fill="url(#p14p4floor)"/>

  <!-- ===== 5 SQUAD MEMBERS ===== Center-grouped facing forward toward city. -->

  <!-- THRESH back-left (standing, weapon holstered). -->
  <g id="p14p4-thresh" transform="translate(220, 320)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p14p4ruby)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#dc2030" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#a8182a" stroke="#080408" stroke-width="0.4"/>
    <!-- Holstered weapon at hip (visible bulge). -->
    <rect x="-18" y="2" width="6" height="10" rx="1" fill="#1a1820" stroke="#080404" stroke-width="0.4"/>
    <line x1="-18" y1="6" x2="-12" y2="6" stroke="#dc2030" stroke-width="0.5" opacity="0.85"/>
    <!-- Arms (squared shoulders, ready). -->
    <path d="M-13,-5 L-15,15 L-13,28" fill="none" stroke="#a8182a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M13,-5 L15,15 L13,28" fill="none" stroke="#a8182a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-10,30 L-13,50 L-13,68" fill="none" stroke="#a8182a" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,30 L13,50 L13,68" fill="none" stroke="#a8182a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#d8a880"/>
    <path d="M-7,-37 Q-2,-42 4,-40 L4,-32 L-7,-32 Z" fill="#a83a18"/>
    <ellipse cx="-2" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <line x1="-2" y1="-23" x2="3" y2="-23" stroke="#3a1808" stroke-width="0.8"/>
    <!-- Faint ruby suit accent glow (tiny). -->
    <circle cx="-13" cy="-19" r="1" fill="#f54848" filter="url(#p14p4softBloom)" opacity="0.95"/>
  </g>

  <!-- WREN left of center (arms folded calculating). -->
  <g id="p14p4-wren" transform="translate(280, 325)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p14p4copper)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#c87a35" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#c87a35" stroke="#080408" stroke-width="0.4"/>
    <!-- Arms folded. -->
    <path d="M-13,-5 L-2,3 L13,5" fill="none" stroke="url(#p14p4copper)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M13,-2 L0,5 L-13,8" fill="none" stroke="url(#p14p4copper)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-10,30 L-13,52 L-13,68" fill="none" stroke="#a86028" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,30 L13,52 L13,68" fill="none" stroke="#a86028" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#e0c0a0"/>
    <ellipse cx="-2" cy="-37" rx="6.5" ry="4" fill="#0a0408"/>
    <ellipse cx="3" cy="-39" rx="3" ry="3" fill="#0a0408"/>
    <ellipse cx="-2" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <line x1="-2" y1="-23" x2="3" y2="-23" stroke="#5a2818" stroke-width="0.8"/>
    <circle cx="-13" cy="-19" r="1" fill="#f5c890" filter="url(#p14p4softBloom)" opacity="0.95"/>
  </g>

  <!-- SABLE CENTER (forward-facing, set). -->
  <g id="p14p4-sable" transform="translate(371, 318)">
    <path d="M-15,32 Q-18,5 -15,-17 L-2,-25 L16,-25 Q20,5 17,32 Z" fill="url(#p14p4silver)" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="-15" cy="-22" rx="5.5" ry="3.5" fill="#9ba1aa" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="15" cy="-22" rx="5.5" ry="3.5" fill="#9ba1aa" stroke="#080408" stroke-width="0.4"/>
    <!-- Cracked right shoulder still visible (faint blue-white). -->
    <line x1="13" y1="-22" x2="17" y2="-20" stroke="#7ac8ff" stroke-width="0.7" filter="url(#p14p4softBloom)" opacity="0.8"/>
    <!-- Arms at sides. -->
    <path d="M-15,-8 L-18,12 L-16,30" fill="none" stroke="url(#p14p4silver)" stroke-width="4" stroke-linecap="round"/>
    <path d="M15,-8 L18,12 L16,30" fill="none" stroke="url(#p14p4silver)" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs. -->
    <path d="M-12,32 L-15,55 L-15,75" fill="none" stroke="#5a606a" stroke-width="6" stroke-linecap="round"/>
    <path d="M12,32 L15,55 L15,75" fill="none" stroke="#5a606a" stroke-width="6" stroke-linecap="round"/>
    <!-- Head facing forward. -->
    <ellipse cx="0" cy="-34" rx="9" ry="10" fill="#5a3018"/>
    <path d="M-8,-42 Q0,-46 8,-42 L8,-34 L-8,-34 Z" fill="#e8eaee"/>
    <!-- WARM AMBER RIM on hair. -->
    <path d="M-8,-42 Q0,-46 8,-42" fill="none" stroke="#f5b860" stroke-width="0.7" opacity="0.85"/>
    <ellipse cx="-3" cy="-34" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-34" rx="0.9" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-26" x2="3" y2="-26" stroke="#3a1808" stroke-width="0.8"/>
    <!-- Faint silver suit glow. -->
    <circle cx="0" cy="0" r="1.2" fill="#dceaff" filter="url(#p14p4softBloom)" opacity="0.95"/>
  </g>

  <!-- LUMA right of center (scanner at side, head tilted). -->
  <g id="p14p4-luma" transform="translate(465, 325)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p14p4sapphire)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#5a3ad8" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#5a3ad8" stroke="#080408" stroke-width="0.4"/>
    <!-- Right arm w/ scanner at side. -->
    <path d="M13,-5 L18,12 L20,28" fill="none" stroke="#5a3ad8" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="18" y="26" width="8" height="6" rx="1" fill="#1a1828" stroke="#a87af0" stroke-width="0.4"/>
    <ellipse cx="22" cy="29" rx="6" ry="3" fill="#a87af0" filter="url(#p14p4softBloom)" opacity="0.55"/>
    <!-- Left arm. -->
    <path d="M-13,-5 L-18,12 L-15,28" fill="none" stroke="#5a3ad8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-10,30 L-13,52 L-13,68" fill="none" stroke="#3a2a8c" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,30 L13,52 L13,68" fill="none" stroke="#3a2a8c" stroke-width="5" stroke-linecap="round"/>
    <!-- Head tilted slightly (curiosity). -->
    <ellipse cx="2" cy="-30" rx="8" ry="9" fill="#a87850" transform="rotate(-8 2 -30)"/>
    <path d="M-5,-37 Q1,-42 8,-39 L8,-32 L-5,-32 Z" fill="#1a0a08" transform="rotate(-8 2 -30)"/>
    <!-- Braid. -->
    <path d="M7,-25 Q14,-15 18,-3" fill="none" stroke="#1a0a08" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-1" cy="-30" rx="2" ry="1.4" fill="#a87af0" opacity="0.7" transform="rotate(-8 2 -30)"/>
    <ellipse cx="5" cy="-30" rx="2" ry="1.4" fill="#a87af0" opacity="0.7" transform="rotate(-8 2 -30)"/>
    <line x1="-1" y1="-23" x2="4" y2="-23" stroke="#5a2818" stroke-width="0.8" transform="rotate(-8 2 -30)"/>
  </g>

  <!-- JINK back-right (wing-pack folded, still). -->
  <g id="p14p4-jink" transform="translate(525, 320)">
    <path d="M-13,30 Q-16,5 -13,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="url(#p14p4emerald)" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="-13" cy="-19" rx="5" ry="3" fill="#2ed078" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="13" cy="-19" rx="5" ry="3" fill="#2ed078" stroke="#080408" stroke-width="0.4"/>
    <!-- Wing-pack folded between shoulders (tiny visible bump). -->
    <rect x="-3" y="-22" width="6" height="8" rx="0.8" fill="#1a4828" stroke="#080408" stroke-width="0.4"/>
    <circle cx="-2" cy="-18" r="0.6" fill="#a8f5c8" filter="url(#p14p4softBloom)" opacity="0.95"/>
    <circle cx="2" cy="-18" r="0.6" fill="#a8f5c8" filter="url(#p14p4softBloom)" opacity="0.95"/>
    <!-- Arms at sides. -->
    <path d="M-13,-5 L-15,15 L-13,28" fill="none" stroke="#2ed078" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M13,-5 L15,15 L13,28" fill="none" stroke="#2ed078" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-10,30 L-13,52 L-13,68" fill="none" stroke="#0a5a30" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,30 L13,52 L13,68" fill="none" stroke="#0a5a30" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#d8b890"/>
    <g fill="#f5d068">
      <circle cx="-4" cy="-37" r="3.5"/>
      <circle cx="0" cy="-40" r="3.5"/>
      <circle cx="4" cy="-37" r="3.5"/>
      <circle cx="-7" cy="-35" r="2.5"/>
      <circle cx="7" cy="-35" r="2.5"/>
    </g>
    <ellipse cx="-3" cy="-30" rx="0.9" ry="0.8" fill="#1a0808"/>
    <ellipse cx="3" cy="-30" rx="0.9" ry="0.8" fill="#1a0808"/>
    <line x1="-2" y1="-23" x2="3" y2="-23" stroke="#5a2818" stroke-width="0.8"/>
    <circle cx="-13" cy="-19" r="1" fill="#a8f5c8" filter="url(#p14p4softBloom)" opacity="0.95"/>
  </g>

  <!-- SABLE survival declaration + Questions. -->
  <g id="p14p4-dlg-sable1">
    <rect x="14" y="14" width="380" height="80" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Survive the night. Salvage at first light.</text>
    <text x="24" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Find the rest of the wreckage.</text>
    <text x="24" y="88" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">And we get ourselves home.</text>
    <path d="M260,94 L278,94 L370,290 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="260" y1="94" x2="278" y2="94" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g id="p14p4-dlg-sable2">
    <rect x="424" y="14" width="146" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="434" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="434" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Questions?</text>
    <path d="M450,60 L468,60 L378,290 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="450" y1="60" x2="468" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p14p4-meta">
    <text x="730" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SECTION CLOSER — THRESHOLD</text>
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">4</text>
  </g>
</svg>
