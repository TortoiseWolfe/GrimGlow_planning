<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 1 — Page 7 — Panel 1: Gutter establishing wide, Sable face-down in wreckage</title>
  <desc>Ultra-wide worm's-eye shot from inside Victorian rooftop rain gutter at fairy scale (4-inch figures). Curved cast-iron walls rise on either side like canyon banks, riveted at seams, coated soot+grime. Floor littered with enormous dead leaves, twigs like fallen logs, gritty coal sediment. Scattered alien wreckage: twisted dark hull plating, shattered crystalline panels flickering blue-white, conduit bundles leaking luminescent fluid. Middle distance: tiny silver-suited figure face-down. Cool wreckage light dominant; faint warm city-glow from below outer edge. Devastation and silence.</desc>

  <defs>
    <linearGradient id="p7p1iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="p7p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <radialGradient id="p7p1coolGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5aa6dc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p1warmGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a2812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p7p1leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1a08"/>
    </linearGradient>
    <linearGradient id="p7p1silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ba1aa"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <radialGradient id="p7p1fluid" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a8f5c8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p7p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Background: deep darkness with warm city glow rising from below outer edge. -->
  <rect width="742" height="220" fill="#0a0408"/>
  <!-- Warm city glow (bottom-right rising — that's where outer gutter edge is). -->
  <ellipse cx="742" cy="220" rx="500" ry="100" fill="url(#p7p1warmGlow)"/>

  <!-- ========================================================== -->
  <!-- LAYER: gutter walls — curved cast iron, riveted, soot-coated -->
  <!-- Worm's-eye view = walls rise steeply on both sides            -->
  <!-- ========================================================== -->
  <g id="p7p1-gutter-walls">
    <!-- Far inner wall (slate-roof side, upper part of frame). -->
    <path d="M0,0 L742,0 L742,90 Q371,75 0,90 Z" fill="url(#p7p1iron)"/>
    <!-- Wall rivets along seam (every ~80px). -->
    <g fill="#5a3818">
      <circle cx="60" cy="80" r="2"/>
      <circle cx="140" cy="78" r="2"/>
      <circle cx="220" cy="76" r="2"/>
      <circle cx="300" cy="75" r="2"/>
      <circle cx="380" cy="74" r="2"/>
      <circle cx="460" cy="75" r="2"/>
      <circle cx="540" cy="76" r="2"/>
      <circle cx="620" cy="78" r="2"/>
      <circle cx="700" cy="80" r="2"/>
    </g>
    <!-- Soot streaks on far wall. -->
    <g stroke="#0a0204" stroke-width="0.6" opacity="0.85">
      <line x1="80" y1="20" x2="78" y2="80"/>
      <line x1="180" y1="18" x2="178" y2="78"/>
      <line x1="320" y1="16" x2="318" y2="76"/>
      <line x1="450" y1="18" x2="448" y2="78"/>
      <line x1="580" y1="20" x2="578" y2="78"/>
      <line x1="680" y1="22" x2="678" y2="80"/>
    </g>
    <!-- Vague slate roof line above gutter (top of frame). -->
    <path d="M0,0 L742,0 L742,12 L0,15 Z" fill="#0a0408"/>

    <!-- Near outer wall (city-side, lower part of frame, sloping down to lead flashing edge). -->
    <path d="M0,200 Q371,210 742,200 L742,220 L0,220 Z" fill="url(#p7p1iron)"/>
    <g fill="#5a3818">
      <circle cx="60" cy="208" r="1.8"/>
      <circle cx="180" cy="207" r="1.8"/>
      <circle cx="300" cy="206" r="1.8"/>
      <circle cx="420" cy="206" r="1.8"/>
      <circle cx="540" cy="207" r="1.8"/>
      <circle cx="660" cy="208" r="1.8"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: gutter floor — coal-sediment, soot, debris            -->
  <!-- ========================================================== -->
  <g id="p7p1-floor">
    <path d="M0,90 Q371,75 742,90 L742,200 Q371,210 0,200 Z" fill="url(#p7p1floor)"/>
    <!-- Coal grit texture (scattered tiny dark dots). -->
    <g fill="#0a0204">
      <circle cx="80" cy="130" r="0.8"/>
      <circle cx="120" cy="160" r="1.0"/>
      <circle cx="180" cy="120" r="0.8"/>
      <circle cx="240" cy="180" r="1.2"/>
      <circle cx="300" cy="140" r="0.8"/>
      <circle cx="360" cy="170" r="1.0"/>
      <circle cx="420" cy="130" r="0.8"/>
      <circle cx="480" cy="160" r="1.2"/>
      <circle cx="540" cy="140" r="0.8"/>
      <circle cx="600" cy="180" r="1.0"/>
      <circle cx="660" cy="120" r="0.8"/>
      <circle cx="700" cy="160" r="1.2"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: dead leaves (sleeping-bag-sized at fairy scale)       -->
  <!-- ========================================================== -->
  <g id="p7p1-leaves">
    <!-- Large curled leaf left foreground. -->
    <path d="M40,170 Q60,150 110,150 Q150,160 130,180 Q100,196 60,194 Q40,190 40,170 Z" fill="url(#p7p1leaf)"/>
    <line x1="60" y1="170" x2="120" y2="172" stroke="#1a0808" stroke-width="0.7" opacity="0.85"/>
    <g stroke="#3a1810" stroke-width="0.5" fill="none" opacity="0.7">
      <path d="M70,158 L80,180"/>
      <path d="M85,154 L92,184"/>
      <path d="M100,154 L106,188"/>
      <path d="M115,158 L114,184"/>
    </g>

    <!-- Mid-frame leaf cluster. -->
    <path d="M280,150 Q310,140 350,148 Q370,158 350,172 Q320,178 290,170 Q278,158 280,150 Z" fill="url(#p7p1leaf)" opacity="0.95"/>
    <line x1="290" y1="156" x2="350" y2="158" stroke="#1a0808" stroke-width="0.6"/>

    <!-- Right-side leaves. -->
    <path d="M540,170 Q570,158 620,160 Q650,170 630,184 Q600,194 560,188 Q540,180 540,170 Z" fill="url(#p7p1leaf)"/>
    <line x1="560" y1="174" x2="620" y2="176" stroke="#1a0808" stroke-width="0.6"/>

    <!-- Twigs scattered. -->
    <line x1="200" y1="180" x2="270" y2="172" stroke="#3a2010" stroke-width="3" stroke-linecap="round"/>
    <line x1="450" y1="174" x2="520" y2="186" stroke="#3a2010" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="640" y1="148" x2="710" y2="156" stroke="#3a2010" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: alien wreckage — twisted hull, shattered panels       -->
  <!-- ========================================================== -->
  <g id="p7p1-wreckage">
    <!-- Twisted hull plating (left). -->
    <polygon points="120,128 180,118 196,130 188,150 140,148 120,140" fill="#1a1d22"/>
    <polygon points="120,128 180,118 196,130" fill="none" stroke="#3a3a40" stroke-width="0.7"/>
    <line x1="140" y1="125" x2="180" y2="135" stroke="#5aa6dc" stroke-width="0.6" opacity="0.65" filter="url(#p7p1bloom)"/>

    <!-- Shattered crystalline panel (center-right) — flickering blue-white. -->
    <g filter="url(#p7p1bloom)">
      <polygon points="380,130 420,124 432,140 412,156 388,150 376,140" fill="url(#p7p1coolGlow)" opacity="0.85"/>
    </g>
    <polygon points="382,132 418,126 428,140 410,154 388,148 378,140" fill="none" stroke="#bfe4ff" stroke-width="0.8" opacity="0.95"/>
    <line x1="382" y1="132" x2="418" y2="148" stroke="#ffffff" stroke-width="0.6" opacity="0.95"/>
    <line x1="396" y1="126" x2="412" y2="156" stroke="#ffffff" stroke-width="0.6" opacity="0.95"/>
    <line x1="408" y1="126" x2="388" y2="150" stroke="#ffffff" stroke-width="0.5" opacity="0.85"/>

    <!-- Conduit bundle leaking luminescent fluid. -->
    <path d="M250,158 Q280,150 320,160 L325,168 Q280,160 250,168 Z" fill="#0a1228"/>
    <ellipse cx="278" cy="180" rx="20" ry="3" fill="url(#p7p1fluid)" filter="url(#p7p1bloom)" opacity="0.85"/>
    <line x1="285" y1="168" x2="285" y2="182" stroke="#a8f5c8" stroke-width="1" opacity="0.85"/>

    <!-- Sparking conduit (right). -->
    <path d="M580,140 Q610,130 640,140" stroke="#0a1228" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="610" cy="138" r="2" fill="#bfe4ff" filter="url(#p7p1bloom)"/>
    <circle cx="610" cy="138" r="0.8" fill="#ffffff"/>
    <circle cx="618" cy="135" r="0.7" fill="#bfe4ff" opacity="0.85"/>
    <circle cx="600" cy="142" r="0.6" fill="#bfe4ff" opacity="0.7"/>

    <!-- Smaller hull fragments scattered. -->
    <polygon points="450,180 470,176 472,186 452,188" fill="#1a1d22"/>
    <polygon points="540,168 558,164 560,174 542,178" fill="#1a1d22"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: SABLE face-down in middle distance                    -->
  <!-- Tiny silver-suited figure, motionless, arms splayed.         -->
  <!-- ========================================================== -->
  <g id="p7p1-sable-down">
    <!-- Body sprawl. -->
    <ellipse cx="370" cy="190" rx="22" ry="6" fill="url(#p7p1silver)"/>
    <ellipse cx="370" cy="188" rx="20" ry="3" fill="#c4c8cf" opacity="0.65"/>
    <!-- Head (small dark — face-down). -->
    <ellipse cx="350" cy="190" rx="6" ry="5" fill="#3a2418"/>
    <ellipse cx="350" cy="188" rx="5" ry="3" fill="#d4d6db" opacity="0.85"/>
    <!-- Arms splayed. -->
    <path d="M348,192 Q330,196 320,200 L322,204 Q335,200 350,196 Z" fill="url(#p7p1silver)"/>
    <path d="M390,192 Q408,196 418,200 L416,204 Q403,200 390,196 Z" fill="url(#p7p1silver)"/>
    <ellipse cx="320" cy="202" rx="3" ry="2" fill="#3a2418"/>
    <ellipse cx="418" cy="202" rx="3" ry="2" fill="#3a2418"/>
    <!-- Cracked panel on right shoulder leaking blue-white. -->
    <ellipse cx="386" cy="188" rx="3" ry="2" fill="#bfe4ff" filter="url(#p7p1bloom)" opacity="0.85"/>
    <ellipse cx="386" cy="188" rx="1.5" ry="1" fill="#ffffff"/>
    <!-- Soot/leaf debris on body. -->
    <circle cx="365" cy="188" r="0.8" fill="#0a0204"/>
    <circle cx="375" cy="190" r="0.8" fill="#0a0204"/>
    <circle cx="368" cy="192" r="0.6" fill="#0a0204"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: gutter recedes into darkness on both ends             -->
  <!-- ========================================================== -->
  <g id="p7p1-distance">
    <ellipse cx="0" cy="120" rx="60" ry="80" fill="#000000" opacity="0.85"/>
    <ellipse cx="742" cy="120" rx="60" ry="80" fill="#000000" opacity="0.85"/>
  </g>

  <!-- Faint wreckage glow halos on floor (light pools). -->
  <g opacity="0.45" filter="url(#p7p1strongBloom)">
    <ellipse cx="160" cy="135" rx="80" ry="25" fill="#5aa6dc"/>
    <ellipse cx="404" cy="140" rx="80" ry="25" fill="#5aa6dc"/>
    <ellipse cx="610" cy="138" rx="60" ry="20" fill="#5aa6dc"/>
  </g>

  <g id="p7p1-meta">
    <text x="730" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="734" y="212" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">WIDE</text>
  </g>
</svg>
