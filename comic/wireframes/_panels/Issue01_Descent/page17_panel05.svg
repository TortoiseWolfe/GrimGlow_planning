<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 450" width="247" height="450">
  <title>Issue 1 — Page 17 — Panel 5: Thresh silent — the loudest non-reaction</title>
  <desc>MCU eye level 65mm. Thresh slightly apart from group, weapon at hip, hands at sides. SILENT. Surface composed but eyes have gone far away inward, emptied of confidence that filled them on Page 1. Subdued ruby crimson + gentle warm amber. She is not the brightest thing — she is RECEDING. The silence IS the character beat. NO DIALOGUE.</desc>

  <defs>
    <linearGradient id="p17p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <radialGradient id="p17p5amberSubdued" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p17p5ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8182a"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <radialGradient id="p17p5crimsonMuted">
      <stop offset="0%" stop-color="#c84038" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a0810" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p17p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p17p5deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark + subdued (script: she's not the brightest thing — receding). -->
  <rect width="247" height="450" fill="url(#p17p5bg)"/>
  <!-- Gentle warm amber from below (subdued). -->
  <ellipse cx="124" cy="450" rx="280" ry="200" fill="url(#p17p5amberSubdued)" filter="url(#p17p5deepBloom)" opacity="0.85"/>
  <!-- Subdued crimson glow. -->
  <ellipse cx="124" cy="220" rx="180" ry="140" fill="url(#p17p5crimsonMuted)" filter="url(#p17p5deepBloom)" opacity="0.45"/>

  <!-- THRESH — MCU eye level. Standing slightly apart, hands at sides, weapon at hip. -->
  <g id="p17p5-thresh" transform="translate(124, 240)">

    <!-- Lower legs (greaves visible at bottom of frame). -->
    <path d="M-22,140 L-26,180 L-30,210" fill="none" stroke="#3a0810" stroke-width="13" stroke-linecap="round"/>
    <path d="M22,140 L26,180 L30,210" fill="none" stroke="#3a0810" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="-30" cy="208" rx="13" ry="3.5" fill="#080404"/>
    <ellipse cx="30" cy="208" rx="13" ry="3.5" fill="#080404"/>
    <!-- Subtle warm amber on lower legs (gentle per script). -->
    <path d="M-22,140 L-26,180 L-30,210" fill="none" stroke="#a85820" stroke-width="4" stroke-linecap="round" opacity="0.4" filter="url(#p17p5bloom)"/>
    <path d="M22,140 L26,180 L30,210" fill="none" stroke="#a85820" stroke-width="4" stroke-linecap="round" opacity="0.4" filter="url(#p17p5bloom)"/>

    <!-- Thighs. -->
    <path d="M-22,80 L-22,140 L0,140" fill="url(#p17p5ruby)" stroke="#080408" stroke-width="0.8"/>
    <path d="M22,80 L22,140 L0,140" fill="url(#p17p5ruby)" stroke="#080408" stroke-width="0.8"/>
    <!-- Hip belt. -->
    <rect x="-26" y="74" width="52" height="9" fill="#1a0408" stroke="#080408" stroke-width="0.5"/>

    <!-- WEAPON AT HIP (still holstered/at hip per script, hands at sides). -->
    <g id="p17p5-weapon" transform="translate(28, 86)">
      <rect x="-2" y="-3" width="20" height="8" rx="1" fill="#0a0408" stroke="#080404" stroke-width="0.5"/>
      <rect x="14" y="-1" width="6" height="4" fill="#1a0408" stroke="#080404" stroke-width="0.4"/>
      <!-- Power node — subdued (not active aim). -->
      <circle cx="2" cy="1" r="1.4" fill="#c84038" opacity="0.55"/>
      <!-- Sling. -->
      <path d="M-2,-3 Q-8,-15 -10,-25" stroke="#1a0408" stroke-width="0.7" fill="none"/>
    </g>

    <!-- TORSO — formal, hands at sides. -->
    <path d="M-30,-30 Q-36,5 -26,28 L26,28 Q36,5 30,-30 L12,-40 L-12,-40 Z" fill="url(#p17p5ruby)" stroke="#080408" stroke-width="0.9"/>
    <!-- Crimson seams (subdued). -->
    <line x1="0" y1="-26" x2="0" y2="22" stroke="#c84038" stroke-width="0.6" opacity="0.55" filter="url(#p17p5bloom)"/>
    <line x1="-20" y1="-22" x2="-20" y2="18" stroke="#c84038" stroke-width="0.4" opacity="0.45" filter="url(#p17p5bloom)"/>
    <line x1="20" y1="-22" x2="20" y2="18" stroke="#c84038" stroke-width="0.4" opacity="0.45" filter="url(#p17p5bloom)"/>
    <!-- Chest plate band. -->
    <line x1="-28" y1="-5" x2="28" y2="-5" stroke="#080408" stroke-width="0.6" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#c84038" opacity="0.18" filter="url(#p17p5strongBloom)"/>

    <!-- Shoulder pads (intact left, DENTED right per established Thresh design). -->
    <ellipse cx="-30" cy="-28" rx="11" ry="6" fill="#a8182a" stroke="#080408" stroke-width="0.7"/>
    <ellipse cx="-30" cy="-30" rx="6" ry="3" fill="#c84038" opacity="0.55"/>
    <ellipse cx="30" cy="-28" rx="11" ry="6" fill="#5a1018" stroke="#080408" stroke-width="0.7"/>
    <path d="M22,-30 Q30,-22 38,-30" fill="#3a0810" stroke="#080408" stroke-width="0.5"/>

    <!-- HANDS AT SIDES (script-specific). -->
    <path d="M-30,-22 L-36,5 L-32,30" fill="none" stroke="url(#p17p5ruby)" stroke-width="8" stroke-linecap="round"/>
    <path d="M30,-22 L36,5 L32,30" fill="none" stroke="url(#p17p5ruby)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="-32" cy="32" rx="6" ry="4" fill="#3a0810" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="32" cy="32" rx="6" ry="4" fill="#3a0810" stroke="#080408" stroke-width="0.5"/>

    <!-- HEAD — composed surface. -->
    <ellipse cx="2" cy="-66" rx="14" ry="15" fill="#d8a880"/>

    <!-- Copper-red BUZZ cap. -->
    <path d="M-9,-76 Q-3,-82 2,-82 Q7,-82 13,-76 L13,-66 L-9,-66 Z" fill="#a83a18"/>
    <path d="M-9,-76 Q2,-80 13,-76" fill="none" stroke="#5a1808" stroke-width="0.7" opacity="0.85"/>
    <g fill="#5a1808" opacity="0.85">
      <circle cx="-5" cy="-78" r="0.6"/>
      <circle cx="-1" cy="-79" r="0.6"/>
      <circle cx="3" cy="-80" r="0.6"/>
      <circle cx="7" cy="-79" r="0.6"/>
      <circle cx="11" cy="-76" r="0.6"/>
    </g>

    <!-- DEFINED CHEEKBONES. -->
    <ellipse cx="-9" cy="-60" rx="3.5" ry="1.6" fill="#a87850" opacity="0.55"/>
    <ellipse cx="9" cy="-60" rx="3.5" ry="1.6" fill="#a87850" opacity="0.55"/>
    <!-- FAINT crimson catch on jaw + cheekbones (script: faint red light at nodes along jaw + collar — subdued). -->
    <ellipse cx="-9" cy="-58" rx="3" ry="1.3" fill="#c84038" opacity="0.35" filter="url(#p17p5bloom)"/>
    <ellipse cx="9" cy="-58" rx="3" ry="1.3" fill="#c84038" opacity="0.35" filter="url(#p17p5bloom)"/>
    <!-- Faint red along jaw line. -->
    <path d="M-12,-48 Q0,-42 12,-48" fill="none" stroke="#c84038" stroke-width="0.7" opacity="0.45" filter="url(#p17p5bloom)"/>

    <!-- EYES — composed surface, but EMPTY (script: gone far away inward, emptied of confidence). -->
    <ellipse cx="-2" cy="-66" rx="2" ry="1.4" fill="#1a0808"/>
    <ellipse cx="6" cy="-66" rx="2" ry="1.4" fill="#1a0808"/>
    <!-- Pupils unfocused (slightly dilated, distant gaze). -->
    <ellipse cx="-2" cy="-66" rx="1.5" ry="1.2" fill="#3a1010" opacity="0.55"/>
    <ellipse cx="6" cy="-66" rx="1.5" ry="1.2" fill="#3a1010" opacity="0.55"/>
    <ellipse cx="-2" cy="-66" rx="0.7" ry="0.7" fill="#080404"/>
    <ellipse cx="6" cy="-66" rx="0.7" ry="0.7" fill="#080404"/>
    <!-- NO catch-light in eyes (the absence — eyes empty, not bright). -->

    <!-- BROW NEUTRAL (composed surface — not hard-set, not lifted, just there). -->
    <path d="M-7,-72 Q-3,-74 1,-72" stroke="#5a1808" stroke-width="0.9" fill="none"/>
    <path d="M3,-72 Q6,-74 9,-72" stroke="#5a1808" stroke-width="0.9" fill="none"/>

    <!-- LIPS — slightly parted, no expression (silence). -->
    <path d="M-3,-54 Q3,-53 6,-54" stroke="#3a1808" stroke-width="0.9" fill="none"/>
    <ellipse cx="2" cy="-53" rx="2" ry="0.5" fill="#1a0808"/>

    <!-- JAW visible but neither set nor slack — neutral. -->

    <!-- Subdued amber catch on neck (gentle per script). -->
    <ellipse cx="2" cy="-44" rx="10" ry="2" fill="#a85820" opacity="0.4" filter="url(#p17p5bloom)"/>
  </g>

  <!-- NO DIALOGUE — silence is the beat. -->

  <!-- Meta tag. -->
  <g id="p17p5-meta">
    <text x="239" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">5</text>
    <text x="243" y="442" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">THRESH SILENT</text>
  </g>
</svg>
