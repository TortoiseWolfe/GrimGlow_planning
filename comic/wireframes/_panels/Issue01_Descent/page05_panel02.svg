<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 566" width="488" height="566">
  <title>Issue 1 — Page 5 — Panel 2: Lamplighter Jack Hobday at his rounds</title>
  <desc>Medium shot at 50mm, slight low angle. Jack Hobday — late 40s, weathered, heavy coat and flat cap — mid-action reaching up to gas lamp valve with long brass pole. Cast-iron gas lamp at top of frame, flame burning steady amber. Street behind fades into fog with distant amber gaslight points. Long shadow stretches behind him. Composition all verticals — lamp post, man, pole, terraced houses on either side. Entirely warm — amber, gold, orange. Rembrandt-style uplighting from below. Calm habitual focus.</desc>

  <defs>
    <linearGradient id="p5p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="60%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p5p2fog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810" stop-opacity="0"/>
      <stop offset="60%" stop-color="#7a3818" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a85020" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="p5p2coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="60%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="p5p2skin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5a850"/>
      <stop offset="50%" stop-color="#c87830"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="p5p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p5p2brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3a10"/>
      <stop offset="50%" stop-color="#c89030"/>
      <stop offset="100%" stop-color="#5a3a10"/>
    </linearGradient>
    <linearGradient id="p5p2iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#3a1810"/>
    </linearGradient>
    <radialGradient id="p5p2flame" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffe080" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#f5a850" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p5p2lampHalo" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff5d8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#f5a850" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p5p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="p5p2dropShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- Sky / fog. -->
  <g id="p5p2-bg">
    <rect width="488" height="566" fill="url(#p5p2sky)"/>
    <rect y="280" width="488" height="286" fill="url(#p5p2fog)"/>
    <ellipse cx="80" cy="380" rx="14" ry="6" fill="#c87830" opacity="0.45" filter="url(#p5p2bloom)"/>
    <ellipse cx="80" cy="380" rx="6" ry="3" fill="#fff5d8" opacity="0.6"/>
    <ellipse cx="408" cy="378" rx="14" ry="6" fill="#c87830" opacity="0.45" filter="url(#p5p2bloom)"/>
    <ellipse cx="408" cy="378" rx="6" ry="3" fill="#fff5d8" opacity="0.6"/>
    <ellipse cx="244" cy="350" rx="10" ry="4" fill="#c87830" opacity="0.35" filter="url(#p5p2bloom)"/>
    <ellipse cx="244" cy="350" rx="4" ry="2" fill="#ffe080" opacity="0.55"/>
  </g>

  <!-- Terraced houses left + right. -->
  <g id="p5p2-houses">
    <rect x="0" y="120" width="120" height="320" fill="url(#p5p2coat)" opacity="0.9"/>
    <line x1="120" y1="120" x2="120" y2="440" stroke="#0a0604" stroke-width="0.7"/>
    <rect x="22" y="180" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="60" y="240" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="22" y="320" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="60" y="380" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="92" y="200" width="12" height="16" fill="#fff5d8" opacity="0.85" filter="url(#p5p2bloom)"/>

    <rect x="368" y="120" width="120" height="320" fill="url(#p5p2coat)" opacity="0.9"/>
    <line x1="368" y1="120" x2="368" y2="440" stroke="#0a0604" stroke-width="0.7"/>
    <rect x="396" y="200" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="436" y="280" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="396" y="360" width="14" height="20" fill="#3a1810" opacity="0.85"/>
    <rect x="376" y="180" width="12" height="16" fill="#fff5d8" opacity="0.7" filter="url(#p5p2bloom)"/>
  </g>

  <!-- Cobblestone street. -->
  <g id="p5p2-street">
    <path d="M120,440 L368,440 L488,566 L0,566 Z" fill="url(#p5p2cobble)"/>
    <g stroke="#5a2810" stroke-width="0.5" fill="none" opacity="0.55">
      <path d="M50,470 Q70,475 90,470"/>
      <path d="M130,475 Q150,480 170,475"/>
      <path d="M210,480 Q230,485 250,480"/>
      <path d="M290,475 Q310,480 330,475"/>
      <path d="M370,470 Q390,475 410,470"/>
      <path d="M30,510 Q60,515 90,510"/>
      <path d="M150,520 Q180,525 210,520"/>
      <path d="M270,525 Q300,530 330,525"/>
      <path d="M390,510 Q420,515 450,510"/>
      <path d="M50,550 Q90,555 130,550"/>
      <path d="M210,560 Q260,565 310,560"/>
      <path d="M370,555 Q410,560 450,555"/>
    </g>
    <ellipse cx="280" cy="490" rx="60" ry="14" fill="#c87830" opacity="0.25" filter="url(#p5p2bloom)"/>
    <ellipse cx="280" cy="494" rx="32" ry="7" fill="#ffe080" opacity="0.4" filter="url(#p5p2bloom)"/>
  </g>

  <!-- Cast-iron gas lamp at top. -->
  <g id="p5p2-lamp">
    <ellipse cx="280" cy="80" rx="140" ry="80" fill="url(#p5p2lampHalo)" filter="url(#p5p2strongBloom)"/>
    <rect x="270" y="0" width="6" height="120" fill="url(#p5p2iron)"/>
    <rect x="240" y="40" width="40" height="3" fill="url(#p5p2iron)"/>
    <path d="M240,44 L284,44 L292,60 L286,98 L238,98 L232,60 Z" fill="url(#p5p2iron)"/>
    <path d="M240,44 L284,44 L292,60 L286,98 L238,98 L232,60 Z" fill="none" stroke="#0a0604" stroke-width="0.7"/>
    <rect x="244" y="52" width="36" height="40" fill="#fff5d8" opacity="0.4"/>
    <line x1="262" y1="52" x2="262" y2="92" stroke="#1a0e08" stroke-width="0.5" opacity="0.85"/>
    <line x1="244" y1="72" x2="280" y2="72" stroke="#1a0e08" stroke-width="0.5" opacity="0.85"/>
    <path d="M252,44 L256,36 L260,44" fill="none" stroke="#1a0e08" stroke-width="1"/>
    <path d="M264,44 L268,34 L272,44" fill="none" stroke="#1a0e08" stroke-width="1"/>
    <polygon points="260,28 268,28 272,36 256,36" fill="url(#p5p2iron)"/>
    <ellipse cx="262" cy="72" rx="11" ry="16" fill="url(#p5p2flame)" filter="url(#p5p2bloom)"/>
    <ellipse cx="262" cy="72" rx="6" ry="11" fill="#fff5d8" opacity="0.95"/>
    <ellipse cx="262" cy="66" rx="3" ry="6" fill="#ffffff"/>
  </g>

  <!-- Brass pole diagonal from lamp valve down to hand. -->
  <g id="p5p2-pole">
    <line x1="220" y1="320" x2="252" y2="50" stroke="url(#p5p2brass)" stroke-width="3" stroke-linecap="round"/>
    <path d="M250,50 Q254,46 252,42 Q256,46 254,52" fill="none" stroke="#c89030" stroke-width="1.4"/>
    <line x1="221" y1="318" x2="253" y2="52" stroke="#fff5d8" stroke-width="0.6" opacity="0.65"/>
  </g>

  <!-- Jack Hobday — proper 7-head proportions, more vertical room. -->
  <g id="p5p2-jack" filter="url(#p5p2dropShadow)">
    <!-- Long shadow back-left. -->
    <path d="M180,500 Q140,520 50,566 L80,566 L210,510 Z" fill="#0a0604" opacity="0.5"/>

    <!-- Legs (longer with new vertical room). -->
    <path d="M188,360 Q184,420 188,510 L208,510 Q212,420 208,360 Z" fill="url(#p5p2coat)"/>
    <path d="M212,360 Q216,420 220,510 L240,510 Q236,420 232,360 Z" fill="url(#p5p2coat)"/>
    <ellipse cx="198" cy="518" rx="14" ry="6" fill="#0a0604"/>
    <ellipse cx="226" cy="518" rx="14" ry="6" fill="#0a0604"/>

    <!-- Long heavy coat (down to knees). -->
    <path d="M170,250 Q160,310 168,370 L248,370 Q256,310 246,250 Q240,240 208,240 Q176,240 170,250 Z" fill="url(#p5p2coat)"/>
    <line x1="208" y1="242" x2="208" y2="368" stroke="#0a0604" stroke-width="1.2"/>
    <circle cx="208" cy="278" r="2" fill="#3a2010"/>
    <circle cx="208" cy="304" r="2" fill="#3a2010"/>
    <circle cx="208" cy="330" r="2" fill="#3a2010"/>
    <circle cx="208" cy="356" r="2" fill="#3a2010"/>
    <path d="M170,250 Q190,238 208,240" fill="none" stroke="#0a0604" stroke-width="0.8"/>
    <path d="M246,250 Q226,238 208,240" fill="none" stroke="#0a0604" stroke-width="0.8"/>

    <!-- Right arm UP holding pole. -->
    <path d="M170,254 Q156,280 192,308 Q208,308 220,288 Q210,260 188,250 Z" fill="url(#p5p2coat)"/>
    <ellipse cx="220" cy="285" rx="9" ry="7" fill="url(#p5p2skin)"/>
    <line x1="216" y1="282" x2="216" y2="292" stroke="#5a2812" stroke-width="0.7"/>
    <line x1="220" y1="280" x2="220" y2="290" stroke="#5a2812" stroke-width="0.7"/>
    <line x1="224" y1="282" x2="224" y2="292" stroke="#5a2812" stroke-width="0.7"/>

    <!-- Left arm at side. -->
    <path d="M246,250 Q260,310 254,360 L240,360 Q238,310 234,250 Z" fill="url(#p5p2coat)"/>
    <ellipse cx="248" cy="362" rx="6" ry="5" fill="url(#p5p2skin)"/>

    <!-- Neck collar. -->
    <path d="M196,222 Q208,216 220,222 L220,238 L196,238 Z" fill="url(#p5p2coat)"/>

    <!-- HEAD with weathered features. -->
    <g id="p5p2-head">
      <ellipse cx="208" cy="190" rx="22" ry="26" fill="url(#p5p2skin)"/>
      <!-- Flat cap. -->
      <path d="M184,176 Q186,156 208,150 Q230,156 232,176 Q220,170 208,170 Q196,170 184,176 Z" fill="#1a0e08"/>
      <path d="M184,176 Q186,184 200,186 L216,186 Q230,184 232,176 Q220,178 208,178 Q196,178 184,176 Z" fill="#0a0604"/>

      <!-- Brow ridge with deep shadow. -->
      <ellipse cx="200" cy="188" rx="5" ry="3" fill="#3a1810" opacity="0.85"/>
      <ellipse cx="216" cy="188" rx="5" ry="3" fill="#3a1810" opacity="0.85"/>

      <!-- Eyes (squinting up at lamp). -->
      <line x1="197" y1="190" x2="203" y2="190" stroke="#1a0e08" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="213" y1="190" x2="219" y2="190" stroke="#1a0e08" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Bushy brows. -->
      <path d="M194,184 Q200,182 206,184" fill="none" stroke="#1a0e08" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M210,184 Q216,182 222,184" fill="none" stroke="#1a0e08" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Nose. -->
      <path d="M208,192 L205,208 Q208,210 211,208 Z" fill="#5a2812"/>
      <line x1="208" y1="194" x2="208" y2="206" stroke="#fff5d8" stroke-width="0.8" opacity="0.55"/>

      <!-- Mustache. -->
      <path d="M198,210 Q202,214 208,214 Q214,214 218,210 Q216,216 208,217 Q200,216 198,210 Z" fill="#1a0e08"/>

      <!-- Mouth. -->
      <line x1="204" y1="216" x2="212" y2="216" stroke="#5a2812" stroke-width="1"/>

      <!-- Stubble. -->
      <path d="M196,210 Q208,220 220,210 Q220,216 208,218 Q196,216 196,210 Z" fill="#3a1810" opacity="0.55"/>
      <path d="M198,214 Q208,222 218,214" fill="none" stroke="#3a1810" stroke-width="0.6" opacity="0.7"/>
    </g>
  </g>
</svg>
