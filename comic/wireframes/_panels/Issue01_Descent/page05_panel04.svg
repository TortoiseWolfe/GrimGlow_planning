<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 278" width="240" height="278">
  <title>Issue 1 — Page 5 — Panel 4: Hand completing the sign of the cross</title>
  <desc>Close-up at 85mm, slight high angle. Woman's hand completing sign of cross — fingers touching her left shoulder. Work-roughened. Heavy wool shawl drapes shoulder. Behind and above, out of focus, prismatic streak blazes across sky in brilliant blue-white and violet, geometric and alien, painting shoulder and hand in cool light overwhelming warm amber doorway glow. Contrast between ancient human gesture and alien light is the point. CAPTION: "A falling star."</desc>

  <defs>
    <linearGradient id="p5p4skyChaos" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#5a3ad8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0838"/>
    </linearGradient>
    <linearGradient id="p5p4streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#c8b8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p5p4streakBloom" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#bfe4ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p5p4shawl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a302a"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="p5p4handCool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dce4f0"/>
      <stop offset="50%" stop-color="#a8b8d0"/>
      <stop offset="100%" stop-color="#5a4030"/>
    </linearGradient>
    <radialGradient id="p5p4warmResidue" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p5p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="p5p4dropShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="240" height="278" fill="url(#p5p4skyChaos)"/>
  <!-- Warm residue from doorway. -->
  <rect width="240" height="278" fill="url(#p5p4warmResidue)" opacity="0.7"/>

  <!-- Prismatic streak diagonal across upper portion. -->
  <g id="p5p4-streak" filter="url(#p5p4strongBloom)">
    <ellipse cx="120" cy="80" rx="180" ry="80" fill="url(#p5p4streakBloom)"/>
    <path d="M-20,140 L260,40 L260,60 L-20,160 Z" fill="url(#p5p4streak)" opacity="0.95"/>
    <path d="M-20,120 L260,20 L260,30 L-20,130 Z" fill="#ffffff" opacity="0.85"/>
  </g>
  <g id="p5p4-streak-geometry" opacity="0.85">
    <polygon points="40,108 56,100 60,112 44,120" fill="none" stroke="#c8b8ff" stroke-width="0.8"/>
    <polygon points="100,82 116,74 120,86 104,94" fill="none" stroke="#c8b8ff" stroke-width="0.8"/>
    <polygon points="160,56 176,48 180,60 164,68" fill="none" stroke="#c8b8ff" stroke-width="0.8"/>
    <polygon points="200,30 216,22 220,34 204,42" fill="none" stroke="#c8b8ff" stroke-width="0.7"/>
    <polygon points="20,140 26,136 28,142 22,146" fill="#bfe4ff" opacity="0.85"/>
    <polygon points="80,112 86,108 88,114 82,118" fill="#bfe4ff" opacity="0.85"/>
    <polygon points="140,86 146,82 148,88 142,92" fill="#bfe4ff" opacity="0.85"/>
    <polygon points="200,60 206,56 208,62 202,66" fill="#bfe4ff" opacity="0.85"/>
  </g>

  <!-- Shoulder draped in shawl. -->
  <g id="p5p4-shoulder" filter="url(#p5p4dropShadow)">
    <path d="M0,140 Q40,134 100,140 Q140,146 180,154 L240,166 L240,278 L0,278 Z" fill="url(#p5p4shawl)"/>
    <!-- Folds. -->
    <path d="M30,154 Q40,200 50,260" fill="none" stroke="#0a0604" stroke-width="0.9" opacity="0.7"/>
    <path d="M80,148 Q90,200 100,260" fill="none" stroke="#0a0604" stroke-width="0.9" opacity="0.7"/>
    <path d="M140,156 Q150,210 160,272" fill="none" stroke="#0a0604" stroke-width="0.9" opacity="0.7"/>
    <path d="M200,170 Q210,220 220,272" fill="none" stroke="#0a0604" stroke-width="0.9" opacity="0.7"/>

    <!-- Cool prismatic wash on shoulder. -->
    <path d="M0,140 Q40,134 100,140 Q140,146 180,154 L180,180 Q120,164 60,166 L0,176 Z" fill="#bfe4ff" opacity="0.55" filter="url(#p5p4bloom)"/>
    <path d="M30,142 Q80,138 130,142 Q160,146 178,150" fill="none" stroke="#bfe4ff" stroke-width="1" opacity="0.85"/>
    <path d="M40,144 Q80,140 120,144 Q150,148 170,152" fill="none" stroke="#c8b8ff" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- HAND — fingers completing sign of cross, touching shoulder. -->
  <g id="p5p4-hand" filter="url(#p5p4dropShadow)">
    <!-- Wrist from upper-right. -->
    <path d="M150,116 Q170,104 200,98 Q220,94 240,98 L240,128 Q220,124 200,124 Q170,134 150,144 Z" fill="url(#p5p4handCool)"/>
    <path d="M210,94 Q230,92 240,94 L240,114 Q220,114 210,116 Z" fill="url(#p5p4shawl)"/>

    <!-- Hand back. -->
    <path d="M120,140 Q140,128 160,128 L180,134 Q186,156 178,180 Q170,194 154,196 Q138,194 124,184 Q110,170 116,150 Q118,144 120,140 Z" fill="url(#p5p4handCool)"/>

    <!-- Knuckles. -->
    <ellipse cx="142" cy="148" rx="5" ry="3" fill="#dce4f0" opacity="0.9"/>
    <ellipse cx="156" cy="146" rx="5" ry="3" fill="#dce4f0" opacity="0.9"/>
    <ellipse cx="170" cy="148" rx="5" ry="3" fill="#dce4f0" opacity="0.9"/>
    <ellipse cx="180" cy="156" rx="4" ry="2.5" fill="#dce4f0" opacity="0.85"/>

    <!-- Fingers extended toward shoulder (the cross). -->
    <!-- Index. -->
    <path d="M124,150 Q116,166 108,180 Q104,192 110,196 Q116,194 122,180 Q128,170 130,156 Z" fill="url(#p5p4handCool)"/>
    <ellipse cx="111" cy="194" rx="3" ry="1.4" fill="#dce4f0" opacity="0.85"/>
    <!-- Middle (the cross — touching shoulder). -->
    <path d="M138,156 Q130,180 124,210 Q120,222 128,228 Q136,224 140,210 Q146,194 148,164 Z" fill="url(#p5p4handCool)"/>
    <ellipse cx="129" cy="226" rx="3.5" ry="1.5" fill="#dce4f0" opacity="0.9"/>
    <!-- Ring. -->
    <path d="M152,156 Q146,180 140,210 Q138,220 146,222 Q152,218 156,206 Q160,196 160,162 Z" fill="url(#p5p4handCool)"/>
    <ellipse cx="146" cy="220" rx="3" ry="1.4" fill="#dce4f0" opacity="0.85"/>
    <!-- Pinky. -->
    <path d="M168,160 Q164,180 160,200 Q160,210 166,210 Q170,200 172,184 Q174,168 174,162 Z" fill="url(#p5p4handCool)"/>
    <ellipse cx="166" cy="208" rx="2.5" ry="1.2" fill="#dce4f0" opacity="0.8"/>
    <!-- Thumb folded. -->
    <path d="M120,144 Q108,148 100,156 Q96,168 104,170 Q114,164 120,156 Z" fill="url(#p5p4handCool)"/>

    <!-- Cool light intensity on fingers. -->
    <ellipse cx="145" cy="180" rx="40" ry="30" fill="#bfe4ff" opacity="0.18" filter="url(#p5p4bloom)"/>
  </g>

  <!-- Caption. -->
  <g id="p5p4-caption">
    <rect x="6" y="8" width="120" height="28" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="14" y="22" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="14" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a4a30">A falling star.</text>
  </g>
</svg>
