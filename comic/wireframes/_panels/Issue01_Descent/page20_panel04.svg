<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 380" width="742" height="380">
  <title>Issue 1 — Page 20 — Panel 4: Night camp wide gutter — precarious beauty</title>
  <desc>Wide shot at 28mm, eye level, looking along cast-iron rain gutter toward gaslit city beyond. Squad bedded down in gutter debris: Wren asleep beside wreckage hand-on-housing, Luma under leaf shelter scanner glowing, Jink curled on gutter lip arm-dangling-over-abyss wing-pack glowing faintly, Thresh sits rigid weapon across knees on watch, Sable far-end silver silhouette standing alone at gutter edge looking out at city. Dead leaves, soot, twigs, wreckage fragments. Warm amber city-glow from beyond gutter lip catches walls + sleeping forms. Faint suit accents like colored stars. Real stars above. CAPTION: "Thresh watches. Sable waits. The city breathes around them — vast, warm, and utterly indifferent."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="p20p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020208"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p20p4iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p20p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#180a08"/>
    </linearGradient>
    <radialGradient id="p20p4cityHaze" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#c87830" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p4leafGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a87af0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2acc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p4wreckGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p20p4leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a2008"/>
    </linearGradient>
    <filter id="p20p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p20p4softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p20p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="742" height="380" fill="url(#p20p4sky)"/>

  <!-- Real stars above. -->
  <g fill="#dce4f0" opacity="0.85">
    <circle cx="48" cy="22" r="0.7"/>
    <circle cx="120" cy="32" r="0.5"/>
    <circle cx="200" cy="22" r="0.8"/>
    <circle cx="280" cy="38" r="0.6"/>
    <circle cx="380" cy="28" r="0.9"/>
    <circle cx="460" cy="42" r="0.7"/>
    <circle cx="560" cy="22" r="0.7"/>
    <circle cx="640" cy="38" r="0.8"/>
    <circle cx="720" cy="28" r="0.7"/>
    <circle cx="80" cy="68" r="0.5"/>
    <circle cx="240" cy="78" r="0.6"/>
    <circle cx="420" cy="68" r="0.5"/>
    <circle cx="600" cy="78" r="0.6"/>
  </g>

  <!-- Chimney stacks rising from rooftop (top of frame). -->
  <g id="p20p4-chimneys-top">
    <rect x="80" y="40" width="22" height="100" fill="#0a0808"/>
    <rect x="78" y="38" width="26" height="3" fill="#1a0808"/>
    <rect x="84" y="20" width="4" height="20" fill="#3a1810"/>
    <rect x="92" y="18" width="4" height="22" fill="#3a1810"/>

    <rect x="650" y="50" width="20" height="90" fill="#0a0808"/>
    <rect x="648" y="48" width="24" height="3" fill="#1a0808"/>
    <rect x="654" y="30" width="4" height="20" fill="#3a1810"/>
    <rect x="662" y="32" width="4" height="18" fill="#3a1810"/>
  </g>

  <!-- Curved gutter wall (back). -->
  <path d="M0,140 Q371,120 742,140 L742,300 L0,300 Z" fill="url(#p20p4iron)"/>
  <line x1="0" y1="180" x2="742" y2="160" stroke="#080404" stroke-width="0.7" opacity="0.7"/>
  <line x1="0" y1="240" x2="742" y2="238" stroke="#080404" stroke-width="0.7" opacity="0.7"/>
  <g fill="#080404" opacity="0.85">
    <circle cx="50" cy="185" r="1.8"/>
    <circle cx="180" cy="165" r="1.8"/>
    <circle cx="320" cy="155" r="1.8"/>
    <circle cx="450" cy="155" r="1.8"/>
    <circle cx="580" cy="165" r="1.8"/>
    <circle cx="700" cy="185" r="1.8"/>
  </g>
  <g fill="#080404" opacity="0.45">
    <path d="M40,140 Q44,200 38,260"/>
    <path d="M280,140 Q284,200 278,260"/>
    <path d="M520,140 Q524,200 518,260"/>
    <path d="M700,140 Q704,200 698,260"/>
  </g>

  <!-- Strong warm amber city-glow from RIGHT side (gutter lip / city beyond). -->
  <ellipse cx="742" cy="240" rx="200" ry="200" fill="url(#p20p4cityHaze)" filter="url(#p20p4strongBloom)" opacity="0.85"/>

  <!-- Floor — dead leaves, soot, twigs scattered across full gutter length. -->
  <rect y="300" width="742" height="80" fill="url(#p20p4floor)"/>
  <line x1="0" y1="300" x2="742" y2="300" stroke="#080404" stroke-width="1.2"/>

  <!-- Floor debris. -->
  <g fill="#080404" opacity="0.7">
    <circle cx="40" cy="325" r="1.6"/>
    <circle cx="100" cy="345" r="1.4"/>
    <circle cx="200" cy="335" r="1.6"/>
    <circle cx="280" cy="355" r="1.4"/>
    <circle cx="380" cy="338" r="1.6"/>
    <circle cx="500" cy="350" r="1.4"/>
    <circle cx="600" cy="335" r="1.6"/>
    <circle cx="690" cy="350" r="1.4"/>
  </g>
  <!-- Scattered dead leaves. -->
  <path d="M340,358 Q335,338 355,335 Q372,338 372,358 Q360,370 340,358 Z" fill="#5a3018" opacity="0.85"/>
  <path d="M540,365 Q535,348 552,348 Q568,350 568,365 Q558,375 540,365 Z" fill="#5a3018" opacity="0.85"/>
  <!-- Twigs. -->
  <path d="M0,372 Q200,368 400,374 Q600,378 742,370" stroke="#3a1810" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- ========== ALL 5 SQUAD MEMBERS in their bedded positions ========== -->

  <!-- WREN asleep beside wreckage (left-of-center foreground). -->
  <g id="p20p4-wren" transform="translate(180, 350)">
    <!-- Body lying horizontal. -->
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="#c87a35"/>
    <!-- Head (left end). -->
    <ellipse cx="-20" cy="-2" rx="6" ry="5" fill="#e0c0a0"/>
    <ellipse cx="-22" cy="-5" rx="5" ry="3" fill="#0a0408"/>
    <!-- Eyes closed. -->
    <line x1="-23" y1="-3" x2="-19" y2="-3" stroke="#3a1808" stroke-width="0.6"/>
    <!-- Arm extended w/ hand on drive housing (the one "still touching" detail). -->
    <path d="M-15,2 L-2,16 L8,18" fill="none" stroke="#c87a35" stroke-width="3" stroke-linecap="round"/>
    <!-- Drive housing (cylindrical wreckage). -->
    <ellipse cx="14" cy="20" rx="14" ry="6" fill="#2a2a38" stroke="#080808" stroke-width="0.5"/>
    <ellipse cx="14" cy="20" rx="9" ry="3" fill="#1a1a24"/>
    <!-- Hand on housing (small detail). -->
    <ellipse cx="8" cy="18" rx="3" ry="2" fill="#e0c0a0"/>
    <!-- Wreckage glow + sparks. -->
    <ellipse cx="14" cy="20" rx="22" ry="10" fill="url(#p20p4wreckGlow)" filter="url(#p20p4strongBloom)" opacity="0.6"/>
    <circle cx="20" cy="22" r="0.9" fill="#ffffff" filter="url(#p20p4bloom)"/>
    <!-- Faint copper glow on body. -->
    <ellipse cx="0" cy="0" rx="22" ry="11" fill="#c87a35" opacity="0.25" filter="url(#p20p4bloom)"/>
  </g>

  <!-- LUMA under leaf shelter (center). -->
  <g id="p20p4-luma" transform="translate(330, 340)">
    <!-- Dead oak leaf shelter (large, lean-to). -->
    <path d="M-32,18 Q-38,-20 -20,-30 Q5,-35 25,-25 Q35,-10 30,15 Q15,22 -32,18 Z" fill="url(#p20p4leaf)" opacity="0.95"/>
    <path d="M-30,15 Q-10,-8 25,-22" stroke="#3a1808" stroke-width="0.8" fill="none" opacity="0.7"/>
    <!-- Lobes. -->
    <path d="M-20,-30 Q-22,-36 -12,-36 Q-12,-30 -16,-28 Z" fill="url(#p20p4leaf)" opacity="0.95"/>
    <path d="M5,-35 Q12,-38 18,-32 Q12,-28 8,-30 Z" fill="url(#p20p4leaf)" opacity="0.95"/>
    <!-- Luma body curled under leaf. -->
    <ellipse cx="0" cy="6" rx="13" ry="8" fill="#5a3ad8"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-3" rx="5" ry="5.5" fill="#a87850"/>
    <ellipse cx="-1" cy="-7" rx="4" ry="2.5" fill="#1a0a08"/>
    <!-- Braid. -->
    <path d="M3,-3 Q8,4 10,12" fill="none" stroke="#1a0a08" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Scanner glowing beside her. -->
    <rect x="6" y="6" width="6" height="4" rx="1" fill="#1a1828" stroke="#a87af0" stroke-width="0.5"/>
    <ellipse cx="9" cy="8" rx="14" ry="6" fill="url(#p20p4leafGlow)" filter="url(#p20p4strongBloom)" opacity="0.85"/>
    <ellipse cx="9" cy="8" rx="3" ry="2" fill="#c8a8ff" opacity="0.95"/>
  </g>

  <!-- JINK curled on gutter lip (foreground right). One arm dangling over abyss. -->
  <g id="p20p4-jink" transform="translate(610, 308)">
    <!-- Body curled small on the very lip. -->
    <ellipse cx="0" cy="0" rx="18" ry="9" fill="#2ed078"/>
    <!-- Head + curls (curled into chest). -->
    <ellipse cx="-12" cy="-3" rx="6" ry="5" fill="#d8b890"/>
    <g fill="#f5d068">
      <circle cx="-14" cy="-6" r="3.5"/>
      <circle cx="-10" cy="-8" r="3"/>
      <circle cx="-8" cy="-5" r="3"/>
    </g>
    <!-- Eyes closed. -->
    <line x1="-15" y1="-4" x2="-11" y2="-4" stroke="#3a1808" stroke-width="0.6"/>
    <!-- Knees curled up (right side). -->
    <ellipse cx="10" cy="2" rx="6" ry="5" fill="#0a5a30"/>
    <!-- ARM DANGLING OVER ABYSS (off the gutter lip — extending below the iron). -->
    <path d="M16,3 L24,12 L28,22" fill="none" stroke="#2ed078" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="28" cy="22" rx="2.5" ry="1.8" fill="#f0d088"/>
    <!-- Faint emerald wing-pack lattice glow. -->
    <ellipse cx="0" cy="0" rx="22" ry="13" fill="#2ed078" opacity="0.35" filter="url(#p20p4bloom)"/>
    <g stroke="#a8f5c8" stroke-width="0.5" fill="none" opacity="0.65">
      <line x1="-5" y1="-8" x2="-15" y2="-12"/>
      <line x1="0" y1="-9" x2="0" y2="-14"/>
      <line x1="5" y1="-8" x2="15" y2="-12"/>
    </g>
  </g>

  <!-- THRESH sits rigid against wall (mid-far right, watching). -->
  <g id="p20p4-thresh" transform="translate(540, 320)">
    <!-- Body sitting upright. -->
    <path d="M-15,30 Q-18,5 -15,-15 L-2,-22 L14,-22 Q18,5 15,30 Z" fill="#dc2030" stroke="#080408" stroke-width="0.4"/>
    <!-- Shoulders. -->
    <ellipse cx="-15" cy="-19" rx="5" ry="3" fill="#dc2030" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="15" cy="-19" rx="5" ry="3" fill="#a8182a" stroke="#080408" stroke-width="0.4"/>
    <!-- Arms holding weapon across knees. -->
    <path d="M-15,-5 L-12,15 L-8,28" fill="none" stroke="#a8182a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M15,-5 L12,15 L8,28" fill="none" stroke="#a8182a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Weapon. -->
    <rect x="-15" y="30" width="30" height="4" rx="1" fill="#1a1820" stroke="#080404" stroke-width="0.4"/>
    <line x1="-10" y1="32" x2="10" y2="32" stroke="#dc2030" stroke-width="0.6" opacity="0.85"/>
    <!-- Drawn-up legs. -->
    <path d="M-10,30 L-15,55 L-13,72" fill="none" stroke="#a8182a" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,30 L15,55 L13,72" fill="none" stroke="#a8182a" stroke-width="5" stroke-linecap="round"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-30" rx="8" ry="9" fill="#d8a880"/>
    <path d="M-7,-37 Q-2,-42 3,-40 L4,-32 L-7,-32 Z" fill="#a83a18"/>
    <!-- Eyes scanning right. -->
    <ellipse cx="-1" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="4" cy="-30" rx="0.9" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-23" x2="3" y2="-23" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Faint ruby glow. -->
    <ellipse cx="0" cy="0" rx="20" ry="22" fill="#dc2030" opacity="0.2" filter="url(#p20p4bloom)"/>
  </g>

  <!-- SABLE far end, silhouette standing alone at gutter edge. (Far right edge of panel) -->
  <g id="p20p4-sable" transform="translate(700, 305)">
    <!-- Body standing — silver suit silhouette backlit by city. -->
    <path d="M-9,40 Q-12,5 -9,-15 L-2,-22 L8,-22 Q12,5 9,40 Z" fill="#5a606a" stroke="#080408" stroke-width="0.4"/>
    <!-- Cracked right shoulder. -->
    <line x1="6" y1="-15" x2="10" y2="-12" stroke="#7ac8ff" stroke-width="0.7" filter="url(#p20p4bloom)" opacity="0.95"/>
    <!-- Arms at sides. -->
    <path d="M-9,-8 L-12,12 L-13,30" fill="none" stroke="#5a606a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M9,-8 L12,12 L13,30" fill="none" stroke="#5a606a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Legs. -->
    <path d="M-5,40 L-8,55 L-9,68" fill="none" stroke="#5a606a" stroke-width="5" stroke-linecap="round"/>
    <path d="M5,40 L8,55 L9,68" fill="none" stroke="#5a606a" stroke-width="5" stroke-linecap="round"/>
    <!-- Head — back/profile (looking out at city). -->
    <ellipse cx="0" cy="-32" rx="7" ry="7.5" fill="#5a3018"/>
    <path d="M-6,-37 Q-1,-42 6,-37 L6,-30 L-6,-30 Z" fill="#e8eaee"/>
    <!-- Strong warm amber rim from city. -->
    <path d="M-6,-37 Q-1,-42 6,-37" fill="none" stroke="#f5b860" stroke-width="0.9" opacity="0.85" filter="url(#p20p4softBloom)"/>
    <path d="M9,-15 Q12,5 9,40" fill="none" stroke="#f5b860" stroke-width="1.2" opacity="0.8" filter="url(#p20p4softBloom)"/>
  </g>

  <!-- CAPTION at bottom-left (parchment). -->
  <g id="p20p4-caption">
    <rect x="14" y="14" width="476" height="50" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="252" y="34" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" font-style="italic" fill="#5a4a30" letter-spacing="0.3">Thresh watches. Sable waits. The city breathes around them —</text>
    <text x="252" y="52" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">vast, warm, and utterly indifferent.</text>
  </g>

  <!-- Meta tag. -->
  <g id="p20p4-meta">
    <text x="730" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">NIGHT CAMP — PRECARIOUS BEAUTY</text>
    <text x="734" y="376" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="0.1" fill="#fff" opacity="0">.</text>
  </g>
</svg>
