<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 380" width="742" height="380">
  <title>Issue 1 — Page 19 — Panel 4: Bird's-eye gutter pull-back, scale-devastating</title>
  <desc>Wide shot from directly above, bird's-eye at 24mm, pulled back. Cast-iron rain gutter runs along edge of slate rooftop — narrow channel, insignificant in landscape of dark Welsh slate, massive chimney stacks, iron weathervanes. Inside: 5 tiny figures identifiable only by colored suit glow (silver, copper, emerald, ruby, sapphire-violet) surrounded by dark debris + flickering blue-white wreckage. Beyond: city sprawls — gaslit streets, dense rooftops, church spires, amber fog, distant Thames glint. 5 holographic accents = tiny colored sparks in vast warm darkness. CAPTION: "The gutter is four inches wide. The city is twenty-seven miles across. They begin."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="p19p4slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2830"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="p19p4gutter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="p19p4cityHaze" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#c87830" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p4windowGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffe0a0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c87830" stop-opacity="0"/>
    </radialGradient>
    <filter id="p19p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p19p4softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p19p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky background (top of frame is dark sky, since looking down). -->
  <rect width="742" height="380" fill="#020208"/>

  <!-- City sprawls beyond gutter — bottom 3/4 of frame. -->
  <rect y="80" width="742" height="300" fill="#0a0810"/>

  <!-- Distant amber haze layer (city rises in warm haze beyond). -->
  <rect y="220" width="742" height="160" fill="url(#p19p4cityHaze)" opacity="0.7"/>

  <!-- Welsh slate rooftop horizontal band — where gutter sits (top quarter). -->
  <rect y="80" width="742" height="160" fill="url(#p19p4slate)"/>

  <!-- Slate seam pattern. -->
  <g stroke="#0a0810" stroke-width="0.5" opacity="0.85">
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="220" x2="742" y2="220"/>
  </g>
  <!-- Slate offset pattern. -->
  <g stroke="#0a0810" stroke-width="0.4" opacity="0.7">
    <line x1="40" y1="100" x2="60" y2="120"/>
    <line x1="120" y1="100" x2="140" y2="120"/>
    <line x1="200" y1="100" x2="220" y2="120"/>
    <line x1="280" y1="100" x2="300" y2="120"/>
    <line x1="360" y1="100" x2="380" y2="120"/>
    <line x1="440" y1="100" x2="460" y2="120"/>
    <line x1="520" y1="100" x2="540" y2="120"/>
    <line x1="600" y1="100" x2="620" y2="120"/>
    <line x1="680" y1="100" x2="700" y2="120"/>
  </g>

  <!-- LEAD FLASHING strip (where gutter meets slate). -->
  <rect x="0" y="80" width="742" height="14" fill="#2a2830" opacity="0.85"/>
  <line x1="0" y1="94" x2="742" y2="94" stroke="#080404" stroke-width="0.7"/>
  <!-- Riveted seams in flashing. -->
  <g fill="#0a0810" opacity="0.85">
    <circle cx="80" cy="87" r="0.7"/>
    <circle cx="160" cy="87" r="0.7"/>
    <circle cx="240" cy="87" r="0.7"/>
    <circle cx="320" cy="87" r="0.7"/>
    <circle cx="400" cy="87" r="0.7"/>
    <circle cx="480" cy="87" r="0.7"/>
    <circle cx="560" cy="87" r="0.7"/>
    <circle cx="640" cy="87" r="0.7"/>
  </g>

  <!-- THE GUTTER — thin horizontal cast-iron channel running across top, just below flashing. -->
  <g id="p19p4-gutter">
    <rect x="0" y="60" width="742" height="20" fill="url(#p19p4gutter)"/>
    <line x1="0" y1="60" x2="742" y2="60" stroke="#080404" stroke-width="1.2"/>
    <line x1="0" y1="80" x2="742" y2="80" stroke="#080404" stroke-width="0.8"/>
    <!-- Inner curved bottom of gutter (visible from above). -->
    <ellipse cx="371" cy="70" rx="380" ry="6" fill="#1a0a08"/>
  </g>

  <!-- WRECKAGE inside gutter — fading blue-white pulses scattered. -->
  <g id="p19p4-wreckage">
    <ellipse cx="200" cy="68" rx="22" ry="6" fill="#bfe4ff" filter="url(#p19p4strongBloom)" opacity="0.5"/>
    <ellipse cx="280" cy="69" rx="26" ry="7" fill="#bfe4ff" filter="url(#p19p4strongBloom)" opacity="0.65"/>
    <ellipse cx="380" cy="68" rx="22" ry="6" fill="#bfe4ff" filter="url(#p19p4strongBloom)" opacity="0.55"/>
    <ellipse cx="480" cy="68" rx="20" ry="5" fill="#bfe4ff" filter="url(#p19p4strongBloom)" opacity="0.45"/>
    <!-- Wreckage fragments (small angular). -->
    <g fill="#1a1a24" stroke="#bfe4ff" stroke-width="0.4">
      <polygon points="195,67 210,65 213,71 198,73"/>
      <polygon points="275,68 290,66 293,73 277,75"/>
      <polygon points="375,67 390,65 393,71 378,73"/>
      <polygon points="475,67 488,65 491,71 478,73"/>
    </g>
    <!-- Spark points. -->
    <g fill="#ffffff" filter="url(#p19p4bloom)">
      <circle cx="202" cy="68" r="0.9"/>
      <circle cx="282" cy="69" r="1.0"/>
      <circle cx="382" cy="68" r="0.9"/>
      <circle cx="482" cy="68" r="0.7"/>
    </g>
  </g>

  <!-- 5 TINY SQUAD FIGURES inside gutter — colored sparks. -->
  <g id="p19p4-squad">
    <!-- Sable (silver) — center. -->
    <circle cx="385" cy="70" r="3" fill="#bfc6d0"/>
    <circle cx="385" cy="70" r="1.6" fill="#5a606a"/>
    <ellipse cx="385" cy="70" rx="6" ry="3" fill="#bfc6d0" opacity="0.3" filter="url(#p19p4bloom)"/>
    <!-- Wren (copper) — left of center. -->
    <circle cx="320" cy="70" r="2.8" fill="#c87a35"/>
    <circle cx="320" cy="70" r="1.4" fill="#7a3818"/>
    <ellipse cx="320" cy="70" rx="6" ry="3" fill="#c87a35" opacity="0.3" filter="url(#p19p4bloom)"/>
    <!-- Luma (sapphire-violet) — center-right. -->
    <circle cx="430" cy="70" r="2.8" fill="#5a3ad8"/>
    <circle cx="430" cy="70" r="1.4" fill="#2a18a0"/>
    <ellipse cx="430" cy="70" rx="6" ry="3" fill="#a87af0" opacity="0.4" filter="url(#p19p4bloom)"/>
    <!-- Thresh (ruby) — far left. -->
    <circle cx="240" cy="70" r="2.8" fill="#dc2030"/>
    <circle cx="240" cy="70" r="1.4" fill="#5a1018"/>
    <ellipse cx="240" cy="70" rx="6" ry="3" fill="#dc2030" opacity="0.3" filter="url(#p19p4bloom)"/>
    <!-- Jink (emerald) — far right. -->
    <circle cx="510" cy="70" r="2.8" fill="#2ed078"/>
    <circle cx="510" cy="70" r="1.4" fill="#0a5a30"/>
    <ellipse cx="510" cy="70" rx="6" ry="3" fill="#2ed078" opacity="0.3" filter="url(#p19p4bloom)"/>
  </g>

  <!-- CHIMNEY STACKS rising from rooftop (massive, casting shadows). -->
  <g id="p19p4-chimney-stacks">
    <!-- Stack 1 (left). -->
    <rect x="80" y="120" width="38" height="60" fill="#1a0e08"/>
    <rect x="78" y="118" width="42" height="3" fill="#3a1810"/>
    <rect x="84" y="100" width="6" height="20" fill="#3a1810"/>
    <rect x="92" y="96" width="6" height="24" fill="#3a1810"/>
    <rect x="100" y="98" width="6" height="22" fill="#3a1810"/>
    <rect x="108" y="100" width="6" height="20" fill="#3a1810"/>
    <!-- Cast shadow on slate. -->
    <path d="M120,180 L155,210 L155,235 L80,235 L80,180 Z" fill="#0a0808" opacity="0.7"/>

    <!-- Stack 2 (center-left). -->
    <rect x="220" y="135" width="32" height="55" fill="#1a0e08"/>
    <rect x="218" y="133" width="36" height="3" fill="#3a1810"/>
    <rect x="224" y="118" width="5" height="18" fill="#3a1810"/>
    <rect x="232" y="115" width="5" height="20" fill="#3a1810"/>
    <rect x="240" y="118" width="5" height="18" fill="#3a1810"/>
    <path d="M252,190 L280,215 L280,230 L220,230 L220,190 Z" fill="#0a0808" opacity="0.65"/>

    <!-- Stack 3 (center-right). -->
    <rect x="450" y="125" width="40" height="60" fill="#1a0e08"/>
    <rect x="448" y="123" width="44" height="3" fill="#3a1810"/>
    <rect x="454" y="105" width="6" height="20" fill="#3a1810"/>
    <rect x="462" y="100" width="6" height="25" fill="#3a1810"/>
    <rect x="470" y="103" width="6" height="22" fill="#3a1810"/>
    <rect x="478" y="105" width="6" height="20" fill="#3a1810"/>
    <path d="M490,185 L520,215 L520,232 L450,232 L450,185 Z" fill="#0a0808" opacity="0.7"/>

    <!-- Stack 4 (right). -->
    <rect x="620" y="130" width="36" height="58" fill="#1a0e08"/>
    <rect x="618" y="128" width="40" height="3" fill="#3a1810"/>
    <rect x="624" y="110" width="6" height="20" fill="#3a1810"/>
    <rect x="632" y="106" width="6" height="24" fill="#3a1810"/>
    <rect x="640" y="110" width="6" height="20" fill="#3a1810"/>
    <path d="M656,188 L685,215 L685,232 L620,232 L620,188 Z" fill="#0a0808" opacity="0.65"/>
  </g>

  <!-- IRON WEATHERVANE on stack 1. -->
  <g id="p19p4-weathervane" transform="translate(95, 100)">
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#080404" stroke-width="1.2"/>
    <line x1="-6" y1="-15" x2="6" y2="-15" stroke="#080404" stroke-width="0.8"/>
    <text x="-5" y="-12" font-size="4" fill="#080404">N</text>
    <text x="3" y="-12" font-size="4" fill="#080404">S</text>
    <polygon points="-2,-22 2,-22 4,-18 -4,-18" fill="#080404"/>
  </g>

  <!-- Cityscape beyond (bottom 1/3 of frame from this aerial view). -->
  <g id="p19p4-city-beyond">
    <!-- Rooftops continuing beyond gutter edge (bottom). -->
    <path d="M0,260 L80,254 L160,262 L240,254 L320,262 L400,254 L480,262 L560,254 L640,262 L720,254 L742,260 L742,380 L0,380 Z" fill="#0a0408"/>
    <!-- Distant church spires. -->
    <polygon points="118,242 126,260 110,260" fill="#080808"/>
    <polygon points="278,240 286,260 270,260" fill="#080808"/>
    <polygon points="438,242 446,260 430,260" fill="#080808"/>
    <polygon points="598,240 604,260 592,260" fill="#080808"/>

    <!-- Amber gas pools — winding streets visible from above. -->
    <ellipse cx="120" cy="320" rx="60" ry="10" fill="url(#p19p4cityHaze)" filter="url(#p19p4bloom)" opacity="0.85"/>
    <ellipse cx="320" cy="335" rx="80" ry="12" fill="url(#p19p4cityHaze)" filter="url(#p19p4bloom)" opacity="0.95"/>
    <ellipse cx="540" cy="325" rx="70" ry="11" fill="url(#p19p4cityHaze)" filter="url(#p19p4bloom)" opacity="0.85"/>

    <!-- Gas lamp pinpricks. -->
    <g>
      <circle cx="100" cy="318" r="1.0" fill="#ffd060" filter="url(#p19p4softBloom)"/>
      <circle cx="140" cy="320" r="0.9" fill="#ffd060" filter="url(#p19p4softBloom)"/>
      <circle cx="290" cy="335" r="1.1" fill="#ffd060" filter="url(#p19p4softBloom)"/>
      <circle cx="335" cy="338" r="1.2" fill="#ffd060" filter="url(#p19p4softBloom)"/>
      <circle cx="380" cy="335" r="0.9" fill="#ffd060" filter="url(#p19p4softBloom)"/>
      <circle cx="510" cy="324" r="1.0" fill="#ffd060" filter="url(#p19p4softBloom)"/>
      <circle cx="555" cy="328" r="1.0" fill="#ffd060" filter="url(#p19p4softBloom)"/>
      <circle cx="600" cy="324" r="0.9" fill="#ffd060" filter="url(#p19p4softBloom)"/>
    </g>
    <!-- Distant lit windows. -->
    <ellipse cx="55" cy="285" rx="6" ry="3" fill="url(#p19p4windowGlow)" filter="url(#p19p4bloom)"/>
    <rect x="51" y="282" width="6" height="6" fill="#fff5d8" opacity="0.85"/>
    <ellipse cx="225" cy="285" rx="5" ry="3" fill="url(#p19p4windowGlow)" filter="url(#p19p4bloom)" opacity="0.85"/>
    <rect x="221" y="282" width="6" height="6" fill="#fff5d8" opacity="0.8"/>
    <ellipse cx="495" cy="285" rx="5" ry="3" fill="url(#p19p4windowGlow)" filter="url(#p19p4bloom)" opacity="0.7"/>
    <rect x="491" y="282" width="6" height="6" fill="#fff5d8" opacity="0.7"/>
    <ellipse cx="685" cy="285" rx="5" ry="3" fill="url(#p19p4windowGlow)" filter="url(#p19p4bloom)" opacity="0.85"/>
    <rect x="681" y="282" width="6" height="6" fill="#fff5d8" opacity="0.85"/>
  </g>

  <!-- THAMES distant glint at very bottom. -->
  <path d="M0,360 Q200,355 400,362 Q600,365 742,358" stroke="#1a2a3c" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="280" cy="358" r="0.8" fill="#ffd060" filter="url(#p19p4softBloom)"/>
  <circle cx="500" cy="362" r="0.7" fill="#ffd060" filter="url(#p19p4softBloom)"/>

  <!-- CAPTION at bottom (parchment). -->
  <g id="p19p4-caption">
    <rect x="100" y="14" width="542" height="42" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="371" y="38" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" font-style="italic" fill="#5a4a30" letter-spacing="0.3">The gutter is four inches wide. The city is twenty-seven miles across.</text>
    <text x="371" y="52" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.4">They begin.</text>
  </g>

  <!-- Meta tag. -->
  <g id="p19p4-meta">
    <text x="730" y="370" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">BIRD'S-EYE — PULL BACK — SCALE</text>
    <text x="734" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">4</text>
  </g>
</svg>
