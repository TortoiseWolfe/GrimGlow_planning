<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 400" width="366" height="400">
  <title>Issue 1 — Page 19 — Panel 3: Luma + Thresh — spectrum of recovery</title>
  <desc>Medium shot, slight low angle (50mm). Two-shot: Luma foreground w/ holographic lenses active again (scrolling blue-violet data), scanner in hand, steady ready gaze. Thresh background slightly turned toward group — listening, guarded. Blue-violet bright in foreground (engaged) vs. ruby muted in background (subdued). One forward, one hesitating. LUMA: "I'll need Wren's power draw projections. And environmental baselines for this era — atmosphere, pathogens, water composition. We don't know what's safe to breathe long-term."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1828"/>
      <stop offset="100%" stop-color="#080406"/>
    </linearGradient>
    <radialGradient id="p19p3lumaGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a87af0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2acc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p3threshGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a1018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19p3sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5af0"/>
      <stop offset="100%" stop-color="#2a18a0"/>
    </linearGradient>
    <linearGradient id="p19p3ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <linearGradient id="p19p3skinL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87850"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="p19p3skinT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4830"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <filter id="p19p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p19p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Background — gutter interior. -->
  <rect width="366" height="400" fill="url(#p19p3bg)"/>

  <!-- Iron wall texture. -->
  <g stroke="#080404" stroke-width="0.6" opacity="0.6">
    <line x1="0" y1="60" x2="366" y2="50"/>
    <line x1="0" y1="180" x2="366" y2="178"/>
    <line x1="0" y1="320" x2="366" y2="318"/>
  </g>
  <g fill="#080404" opacity="0.85">
    <circle cx="40" cy="65" r="2"/>
    <circle cx="320" cy="65" r="2"/>
    <circle cx="40" cy="185" r="2"/>
    <circle cx="320" cy="183" r="2"/>
  </g>

  <!-- Strong blue-violet halo from Luma's active lenses (foreground, bright). -->
  <ellipse cx="120" cy="200" rx="180" ry="200" fill="url(#p19p3lumaGlow)" filter="url(#p19p3strongBloom)"/>

  <!-- Faint ruby halo around Thresh BG (muted, subdued). -->
  <ellipse cx="280" cy="170" rx="100" ry="140" fill="url(#p19p3threshGlow)" filter="url(#p19p3strongBloom)" opacity="0.55"/>

  <!-- THRESH in BACKGROUND (right, smaller — slight low angle so she's set behind). -->
  <g id="p19p3-thresh" transform="translate(282, 200) scale(0.85)">
    <!-- Body, slightly turned toward group (3/4 turn). -->
    <path d="M-15,32 Q-19,5 -16,-15 L-2,-22 L18,-22 Q21,5 18,32 Z" fill="url(#p19p3ruby)" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="-15" cy="-19" rx="6" ry="3.5" fill="#dc2030" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="18" cy="-19" rx="6" ry="3.5" fill="#a8182a" stroke="#080408" stroke-width="0.4"/>
    <!-- Dented left pauldron. -->
    <path d="M14,-22 Q18,-15 22,-22" fill="#5a0810" stroke="#080408" stroke-width="0.4"/>
    <!-- Arms at sides. -->
    <path d="M-15,-10 L-19,12 L-18,30" fill="none" stroke="#a8182a" stroke-width="4" stroke-linecap="round"/>
    <path d="M18,-10 L22,12 L20,30" fill="none" stroke="#a8182a" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs. -->
    <path d="M-9,32 L-13,55 L-15,80" fill="none" stroke="#a8182a" stroke-width="6" stroke-linecap="round"/>
    <path d="M9,32 L13,55 L15,80" fill="none" stroke="#a8182a" stroke-width="6" stroke-linecap="round"/>
    <!-- Head — turned slightly toward group (3/4). -->
    <ellipse cx="0" cy="-30" rx="9" ry="10" fill="url(#p19p3skinT)"/>
    <path d="M-7,-37 Q-2,-42 3,-40 L4,-32 L-7,-32 Z" fill="#a83a18"/>
    <g fill="#5a1808" opacity="0.85">
      <circle cx="-4" cy="-39" r="0.5"/>
      <circle cx="-1" cy="-40" r="0.5"/>
      <circle cx="2" cy="-39" r="0.5"/>
    </g>
    <!-- Eyes (looking sideways toward group, guarded). -->
    <ellipse cx="-2" cy="-29" rx="0.9" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-29" rx="0.9" ry="0.7" fill="#1a0808"/>
    <!-- Lips: hard set. -->
    <line x1="-3" y1="-23" x2="3" y2="-23" stroke="#3a1808" stroke-width="0.8"/>
    <!-- Faint ruby suit-light glow. -->
    <ellipse cx="0" cy="0" rx="20" ry="30" fill="#dc2030" opacity="0.2" filter="url(#p19p3bloom)"/>
  </g>

  <!-- LUMA in FOREGROUND (left, larger — closer, bright). -->
  <g id="p19p3-luma" transform="translate(130, 240)">
    <!-- Body in sapphire-violet. -->
    <path d="M-26,90 Q-30,30 -26,-20 L-12,-30 L18,-30 Q22,-20 26,-20 Q30,30 26,90 Z" fill="url(#p19p3sapphire)" stroke="#080408" stroke-width="0.8"/>
    <!-- Front-lit blue-violet wash. -->
    <ellipse cx="0" cy="0" rx="22" ry="35" fill="#a87af0" opacity="0.18"/>
    <!-- Shoulder pads. -->
    <ellipse cx="-22" cy="-22" rx="8" ry="5" fill="#5a3ad8" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="22" cy="-22" rx="8" ry="5" fill="#5a3ad8" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="-22" cy="-23" rx="5" ry="2" fill="#a87af0" opacity="0.7"/>
    <ellipse cx="22" cy="-23" rx="5" ry="2" fill="#a87af0" opacity="0.7"/>
    <!-- Suit chest node (bright). -->
    <circle cx="0" cy="-5" r="4" fill="#7a5af0"/>
    <circle cx="0" cy="-5" r="2" fill="#c8a8ff" opacity="0.95"/>
    <ellipse cx="0" cy="-5" rx="14" ry="10" fill="#a87af0" filter="url(#p19p3bloom)" opacity="0.55"/>

    <!-- Right arm holding scanner forward. -->
    <path d="M22,-15 L34,-2 L46,8" fill="none" stroke="#5a3ad8" stroke-width="6" stroke-linecap="round"/>
    <!-- Scanner. -->
    <rect x="42" y="3" width="12" height="9" rx="1.5" fill="#1a1828" stroke="#a87af0" stroke-width="0.8"/>
    <rect x="44" y="5" width="9" height="2" fill="#a87af0" opacity="0.85"/>
    <rect x="44" y="8" width="6" height="1.5" fill="#c8a8ff" opacity="0.95"/>
    <ellipse cx="48" cy="7" rx="9" ry="6" fill="#a87af0" filter="url(#p19p3bloom)" opacity="0.45"/>

    <!-- Left arm at side. -->
    <path d="M-22,-15 L-26,12 L-24,30" fill="none" stroke="#5a3ad8" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Legs standing. -->
    <path d="M-12,90 L-18,118 L-18,140" fill="none" stroke="#3a2a8c" stroke-width="8" stroke-linecap="round"/>
    <path d="M14,90 L20,118 L20,140" fill="none" stroke="#3a2a8c" stroke-width="8" stroke-linecap="round"/>

    <!-- HEAD. -->
    <ellipse cx="0" cy="-46" rx="14" ry="15" fill="url(#p19p3skinL)"/>
    <!-- Hair top smooth pulled-back. -->
    <path d="M-10,-54 Q-3,-60 0,-60 Q4,-60 12,-54 L12,-46 L-10,-46 Z" fill="#1a0a08"/>
    <path d="M-10,-54 Q0,-58 12,-54" fill="none" stroke="#3a1a08" stroke-width="0.7" opacity="0.85"/>
    <!-- Side hair. -->
    <path d="M-10,-46 Q-12,-32 -10,-22" fill="#1a0a08"/>
    <path d="M10,-46 Q12,-32 10,-22" fill="#1a0a08"/>
    <!-- Single thick braid trailing right. -->
    <path d="M9,-22 Q22,-12 32,5 Q40,18 36,30" fill="none" stroke="#1a0a08" stroke-width="5" stroke-linecap="round"/>
    <line x1="14" y1="-15" x2="20" y2="-12" stroke="#5a3a18" stroke-width="0.7"/>
    <line x1="22" y1="-8" x2="28" y2="-4" stroke="#5a3a18" stroke-width="0.7"/>
    <line x1="32" y1="6" x2="36" y2="14" stroke="#5a3a18" stroke-width="0.7"/>
    <circle cx="36" cy="30" r="2" fill="#5a3a18"/>
    <circle cx="22" cy="-6" r="0.7" fill="#a87af0" filter="url(#p19p3bloom)" opacity="0.95"/>
    <circle cx="34" cy="14" r="0.7" fill="#a87af0" filter="url(#p19p3bloom)" opacity="0.95"/>

    <!-- HOLOGRAPHIC LENSES ACTIVE (scrolling blue-violet data). -->
    <g id="p19p3-luma-lenses">
      <!-- Lens frames. -->
      <ellipse cx="-6" cy="-46" rx="5" ry="3.5" fill="#1a1828" stroke="#a87af0" stroke-width="0.8"/>
      <ellipse cx="6" cy="-46" rx="5" ry="3.5" fill="#1a1828" stroke="#a87af0" stroke-width="0.8"/>
      <line x1="-1" y1="-46" x2="1" y2="-46" stroke="#a87af0" stroke-width="0.6"/>
      <!-- Stems. -->
      <line x1="-11" y1="-45" x2="-14" y2="-43" stroke="#a87af0" stroke-width="0.6"/>
      <line x1="11" y1="-45" x2="14" y2="-43" stroke="#a87af0" stroke-width="0.6"/>
      <!-- ACTIVE: scrolling data (lines + tiny readout marks). -->
      <ellipse cx="-6" cy="-46" rx="4.5" ry="3" fill="#a87af0" opacity="0.55"/>
      <ellipse cx="6" cy="-46" rx="4.5" ry="3" fill="#a87af0" opacity="0.55"/>
      <line x1="-9" y1="-47" x2="-3" y2="-47" stroke="#c8a8ff" stroke-width="0.4" opacity="0.9"/>
      <line x1="-9" y1="-45" x2="-2" y2="-45" stroke="#c8a8ff" stroke-width="0.4" opacity="0.9"/>
      <line x1="3" y1="-47" x2="9" y2="-47" stroke="#c8a8ff" stroke-width="0.4" opacity="0.9"/>
      <line x1="3" y1="-45" x2="10" y2="-45" stroke="#c8a8ff" stroke-width="0.4" opacity="0.9"/>
      <!-- Bright lens glow. -->
      <ellipse cx="-6" cy="-46" rx="6" ry="4" fill="#a87af0" filter="url(#p19p3bloom)" opacity="0.45"/>
      <ellipse cx="6" cy="-46" rx="6" ry="4" fill="#a87af0" filter="url(#p19p3bloom)" opacity="0.45"/>
    </g>

    <!-- Brow + lips. -->
    <path d="M-9,-52 Q-5,-53 -1,-52" stroke="#3a1808" stroke-width="0.9" fill="none"/>
    <path d="M1,-52 Q5,-53 9,-52" stroke="#3a1808" stroke-width="0.9" fill="none"/>
    <line x1="-5" y1="-34" x2="5" y2="-34" stroke="#5a2818" stroke-width="1.2"/>
    <ellipse cx="-9" cy="-40" rx="2.5" ry="1.5" fill="#a87850" opacity="0.5"/>
    <ellipse cx="9" cy="-40" rx="2.5" ry="1.5" fill="#a87850" opacity="0.5"/>
  </g>

  <!-- LUMA dialogue — large balloon top w/ multi-line. -->
  <g id="p19p3-dlg-luma">
    <rect x="14" y="14" width="338" height="116" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I'll need Wren's power draw</text>
    <text x="24" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">projections. And environmental</text>
    <text x="24" y="86" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">baselines — atmosphere, pathogens,</text>
    <text x="24" y="102" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">water. We don't know what's safe</text>
    <text x="24" y="118" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">to breathe long-term.</text>
    <path d="M120,130 L138,130 L130,160 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" stroke-linejoin="round"/>
    <line x1="120" y1="130" x2="138" y2="130" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p19p3-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">3</text>
    <text x="362" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">LUMA + THRESH</text>
  </g>
</svg>
