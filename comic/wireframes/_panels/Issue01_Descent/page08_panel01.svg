<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 380" width="488" height="380">
  <title>Issue 1 — Page 8 — Panel 1: Sable assesses Thresh in the gutter</title>
  <desc>Medium wide at eye level (35mm). In rain gutter at fairy scale, Sable crouches beside seated Thresh. Thresh's left pauldron has a deep dent. Sable's hand on Thresh's good shoulder, brief contact. Dead leaf curls upward like shelter wall between them. Crumpled hull plating sparks blue-white at one seam in BG. Cool wreckage light + warm city-glow touching Sable's hair. SABLE: "Shoulder?" THRESH: "Dislocated on impact. Luma can set it." SABLE: "Can you fight?" THRESH: "Yes."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p1iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="p8p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#180a08"/>
    </linearGradient>
    <radialGradient id="p8p1coolGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5aa6dc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p8p1warmGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p8p1leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a2008"/>
    </linearGradient>
    <linearGradient id="p8p1silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfc6d0"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p8p1ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a0810"/>
    </linearGradient>
    <filter id="p8p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p8p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Background: gutter interior, deep darkness with warm city glow at top edge. -->
  <rect width="488" height="380" fill="#0a0408"/>

  <!-- Curved cast-iron gutter wall (back, rising). -->
  <path d="M0,80 Q244,50 488,80 L488,280 L0,280 Z" fill="url(#p8p1iron)"/>
  <!-- Iron seam rivets. -->
  <g fill="#1a0a08" opacity="0.85">
    <circle cx="50" cy="120" r="2.5"/>
    <circle cx="120" cy="105" r="2.5"/>
    <circle cx="200" cy="92" r="2.5"/>
    <circle cx="290" cy="92" r="2.5"/>
    <circle cx="370" cy="105" r="2.5"/>
    <circle cx="440" cy="120" r="2.5"/>
    <circle cx="50" cy="180" r="2.5"/>
    <circle cx="125" cy="178" r="2.5"/>
    <circle cx="365" cy="178" r="2.5"/>
    <circle cx="438" cy="180" r="2.5"/>
  </g>
  <!-- Iron seam strips. -->
  <line x1="0" y1="125" x2="488" y2="105" stroke="#1a0808" stroke-width="1.2" opacity="0.7"/>
  <line x1="0" y1="190" x2="488" y2="180" stroke="#1a0808" stroke-width="1.2" opacity="0.7"/>

  <!-- Soot streaking. -->
  <g fill="#080404" opacity="0.6">
    <path d="M30,80 Q35,150 28,250"/>
    <path d="M180,90 Q185,160 178,250"/>
    <path d="M390,90 Q395,160 388,250"/>
  </g>

  <!-- Cool wreckage glow back-right. -->
  <ellipse cx="430" cy="200" rx="160" ry="110" fill="url(#p8p1coolGlow)" filter="url(#p8p1strongBloom)" opacity="0.7"/>

  <!-- Warm city-glow rim at top edge. -->
  <ellipse cx="244" cy="60" rx="280" ry="38" fill="url(#p8p1warmGlow)" filter="url(#p8p1bloom)"/>

  <!-- Gutter floor with debris. -->
  <rect y="280" width="488" height="100" fill="url(#p8p1floor)"/>
  <line x1="0" y1="280" x2="488" y2="280" stroke="#080404" stroke-width="1.2"/>

  <!-- Coal sediment + grit on floor. -->
  <g fill="#080404" opacity="0.7">
    <circle cx="60" cy="305" r="2"/>
    <circle cx="98" cy="320" r="1.4"/>
    <circle cx="140" cy="335" r="2.2"/>
    <circle cx="200" cy="312" r="1.6"/>
    <circle cx="260" cy="345" r="2"/>
    <circle cx="320" cy="320" r="1.4"/>
    <circle cx="385" cy="338" r="2.4"/>
    <circle cx="448" cy="316" r="1.6"/>
    <circle cx="36" cy="358" r="1.4"/>
    <circle cx="155" cy="365" r="2"/>
    <circle cx="290" cy="368" r="1.6"/>
    <circle cx="425" cy="360" r="2"/>
  </g>
  <!-- Twig in foreground. -->
  <path d="M0,360 Q120,348 240,358 Q330,365 420,355" stroke="#3a1810" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M0,360 Q120,348 240,358 Q330,365 420,355" stroke="#5a3018" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Crumpled hull plating BG-right (sparking). -->
  <g id="p8p1-hull" transform="translate(360, 230)">
    <path d="M-40,0 L20,-30 L60,-15 L70,30 L40,55 L-30,40 Z" fill="#1a1a24" stroke="#080808" stroke-width="1"/>
    <path d="M-40,0 L20,-30 L60,-15" fill="none" stroke="#5a606a" stroke-width="0.8" opacity="0.6"/>
    <!-- Torn panel revealing inner conduit. -->
    <polygon points="-10,15 8,5 16,28 -2,38" fill="#080808"/>
    <line x1="0" y1="22" x2="10" y2="20" stroke="#7ac8ff" stroke-width="1.2" filter="url(#p8p1bloom)" opacity="0.95"/>
    <!-- Sparking seam. -->
    <line x1="22" y1="-22" x2="40" y2="-15" stroke="#ffffff" stroke-width="2" filter="url(#p8p1strongBloom)" opacity="0.95"/>
    <line x1="22" y1="-22" x2="40" y2="-15" stroke="#bfe4ff" stroke-width="1" opacity="0.95"/>
    <g fill="#ffffff" filter="url(#p8p1bloom)">
      <circle cx="28" cy="-25" r="1.6"/>
      <circle cx="35" cy="-18" r="1.3"/>
      <circle cx="42" cy="-22" r="1.4"/>
      <circle cx="38" cy="-12" r="1.2"/>
    </g>
  </g>

  <!-- Dead leaf shelter wall between figures. -->
  <g id="p8p1-leaf" transform="translate(244, 240)">
    <path d="M-50,40 Q-65,-5 -38,-50 Q-15,-70 18,-65 Q52,-58 60,-15 Q56,30 35,55 Q5,70 -25,65 Q-45,58 -50,40 Z" fill="url(#p8p1leaf)" opacity="0.95"/>
    <!-- Leaf veins. -->
    <path d="M-30,55 Q0,15 30,-50" stroke="#3a1808" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M-15,50 Q-2,15 5,-25" stroke="#3a1808" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M10,50 Q12,15 18,-30" stroke="#3a1808" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M28,30 Q22,8 14,-22" stroke="#3a1808" stroke-width="0.5" fill="none" opacity="0.6"/>
    <!-- Curled brown highlight rim. -->
    <path d="M-50,40 Q-65,-5 -38,-50 Q-15,-70 18,-65 Q52,-58 60,-15" fill="none" stroke="#a87038" stroke-width="1.5" opacity="0.6"/>
    <!-- Brittle edge cracks. -->
    <path d="M-38,-50 L-30,-55" stroke="#1a0808" stroke-width="0.8"/>
    <path d="M52,-58 L60,-50" stroke="#1a0808" stroke-width="0.8"/>
  </g>

  <!-- THRESH sitting against gutter wall (left of leaf). -->
  <g id="p8p1-thresh" transform="translate(140, 270)">
    <!-- Body in seated position, left arm held close. -->
    <path d="M-22,30 Q-26,10 -24,-15 L24,-15 Q26,10 22,30 Z" fill="url(#p8p1ruby)" stroke="#080408" stroke-width="0.6"/>
    <!-- Right shoulder pad (intact). -->
    <ellipse cx="22" cy="-12" rx="9" ry="6" fill="#dc2030" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="22" cy="-13" rx="5" ry="2.5" fill="#f54848" opacity="0.7"/>
    <!-- LEFT pauldron with deep dent inward. -->
    <ellipse cx="-22" cy="-12" rx="9" ry="6" fill="#a8182a" stroke="#080408" stroke-width="0.6"/>
    <path d="M-28,-14 Q-22,-4 -16,-12" fill="#5a0808" stroke="#080408" stroke-width="0.7"/>
    <path d="M-26,-13 Q-22,-9 -18,-13" fill="none" stroke="#1a0408" stroke-width="0.8"/>
    <!-- Left arm held close to body (cradled). -->
    <path d="M-22,-5 L-15,15 L-8,28" fill="none" stroke="#a8182a" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-8" cy="28" rx="4" ry="3.5" fill="#d8a880"/>
    <!-- Right arm relaxed, hand on lap. -->
    <path d="M22,-2 L28,18 L24,32" fill="none" stroke="#dc2030" stroke-width="5.5" stroke-linecap="round"/>
    <ellipse cx="24" cy="32" rx="4" ry="3.5" fill="#d8a880"/>
    <!-- Legs extended forward (sitting). -->
    <path d="M-16,30 L-10,55 L-5,75 L0,90" fill="none" stroke="#a8182a" stroke-width="7" stroke-linecap="round"/>
    <path d="M16,30 L20,55 L22,75 L26,90" fill="none" stroke="#a8182a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="90" rx="5" ry="3" fill="#1a0808"/>
    <ellipse cx="26" cy="90" rx="5" ry="3" fill="#1a0808"/>
    <!-- Head: pale skin, copper-red buzz cut. -->
    <ellipse cx="0" cy="-30" rx="11" ry="12" fill="#d8a880"/>
    <!-- Buzz cap. -->
    <path d="M-10,-37 Q-6,-42 0,-42 Q6,-42 10,-37 L10,-30 L-10,-30 Z" fill="#a83a18"/>
    <!-- Buzz stipple. -->
    <g fill="#5a1a08" opacity="0.85">
      <circle cx="-7" cy="-38" r="0.6"/>
      <circle cx="-3" cy="-39" r="0.6"/>
      <circle cx="1" cy="-40" r="0.6"/>
      <circle cx="5" cy="-39" r="0.6"/>
      <circle cx="-5" cy="-36" r="0.6"/>
      <circle cx="0" cy="-37" r="0.6"/>
      <circle cx="6" cy="-36" r="0.6"/>
    </g>
    <!-- Defined cheekbones (subtle). -->
    <ellipse cx="-7" cy="-26" rx="3" ry="1.8" fill="#a87850" opacity="0.55"/>
    <ellipse cx="7" cy="-26" rx="3" ry="1.8" fill="#a87850" opacity="0.55"/>
    <!-- Eyes meeting Sable's, steady. -->
    <ellipse cx="-4" cy="-30" rx="1.2" ry="0.9" fill="#1a0808"/>
    <ellipse cx="4" cy="-30" rx="1.2" ry="0.9" fill="#1a0808"/>
    <!-- Set jaw. -->
    <line x1="-5" y1="-22" x2="5" y2="-22" stroke="#5a3018" stroke-width="0.8" opacity="0.7"/>
    <!-- Cool wreckage light reflection on right side of body (red→red-violet shift). -->
    <path d="M22,-15 Q24,5 22,30" fill="none" stroke="#a878dc" stroke-width="1.5" opacity="0.45"/>
  </g>

  <!-- SABLE crouching beside Thresh, hand on her good (right) shoulder. -->
  <g id="p8p1-sable" transform="translate(220, 290)">
    <!-- Crouching body lean toward Thresh. -->
    <path d="M-12,15 Q-16,-5 -10,-25 L18,-30 Q24,-10 18,15 Z" fill="url(#p8p1silver)" stroke="#3a3848" stroke-width="0.6"/>
    <!-- Cracked right shoulder panel (her own injury). -->
    <ellipse cx="18" cy="-25" rx="7" ry="4.5" fill="#9ba1aa" stroke="#080408" stroke-width="0.5"/>
    <path d="M14,-26 L22,-22" stroke="#7ac8ff" stroke-width="1.2" filter="url(#p8p1bloom)" opacity="0.95"/>
    <!-- Left arm extended, hand on Thresh's right shoulder. -->
    <path d="M-10,-15 L-30,-5 L-50,5 L-70,15" fill="none" stroke="#9ba1aa" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-70" cy="15" rx="4" ry="3" fill="#5a3018"/>
    <!-- Right arm braced on knee. -->
    <path d="M18,-5 L25,15 L20,30" fill="none" stroke="#9ba1aa" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="20" cy="30" rx="4" ry="3" fill="#5a3018"/>
    <!-- Crouched leg (folded under). -->
    <path d="M-2,15 L-8,40 L-12,55" fill="none" stroke="#5a606a" stroke-width="7" stroke-linecap="round"/>
    <path d="M14,15 L25,40 L18,60" fill="none" stroke="#5a606a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="-12" cy="55" rx="6" ry="3" fill="#1a0808"/>
    <ellipse cx="18" cy="60" rx="6" ry="3" fill="#1a0808"/>
    <!-- Head: dark brown skin, silver-white buzz cut. -->
    <ellipse cx="2" cy="-40" rx="10" ry="11" fill="#5a3018"/>
    <!-- Hair cap (short military buzz). -->
    <path d="M-7,-46 Q-3,-51 2,-51 Q7,-51 11,-46 L11,-40 L-7,-40 Z" fill="#e8eaee"/>
    <path d="M-7,-46 Q2,-49 11,-46" fill="none" stroke="#9aa4b4" stroke-width="0.5" opacity="0.7"/>
    <!-- Buzz stipple. -->
    <g fill="#5a606a" opacity="0.7">
      <circle cx="-4" cy="-47" r="0.5"/>
      <circle cx="-1" cy="-48" r="0.5"/>
      <circle cx="2" cy="-49" r="0.5"/>
      <circle cx="5" cy="-48" r="0.5"/>
      <circle cx="8" cy="-47" r="0.5"/>
    </g>
    <!-- Profile eye (Sable looking right toward Thresh). -->
    <ellipse cx="6" cy="-39" rx="1.2" ry="0.9" fill="#1a0808"/>
    <!-- Warm uplighting on Sable's hair from city below. -->
    <path d="M-7,-46 Q2,-49 11,-46" fill="none" stroke="#f5b860" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- Sable's hand contact glow on Thresh's shoulder. -->
  <ellipse cx="162" cy="258" rx="6" ry="3" fill="#dce4f0" opacity="0.4"/>

  <!-- DIALOGUE: 4 lines split across 4 balloons (or 2 stacked pairs). Place L→R reading order: Sable left of Thresh. -->
  <!-- Sable balloon 1 (top-left). -->
  <g id="p8p1-dlg-sable1">
    <rect x="14" y="14" width="120" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Shoulder?</text>
    <path d="M62,60 L78,60 L74,72 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="62" y1="60" x2="78" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Thresh balloon 1 (top-right). -->
  <g id="p8p1-dlg-thresh1">
    <rect x="252" y="14" width="222" height="64" rx="8" fill="#ffffff" stroke="#dc2030" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="262" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#dc2030" letter-spacing="0.3">THRESH</text>
    <text x="262" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Dislocated on impact.</text>
    <text x="262" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Luma can set it.</text>
    <path d="M260,78 L274,78 L246,98 Z" fill="#ffffff" stroke="#dc2030" stroke-width="2" stroke-linejoin="round"/>
    <line x1="260" y1="78" x2="274" y2="78" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Sable balloon 2 (mid-left). -->
  <g id="p8p1-dlg-sable2">
    <rect x="14" y="92" width="142" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="112" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Can you fight?</text>
    <path d="M76,138 L92,138 L86,150 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="76" y1="138" x2="92" y2="138" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Thresh balloon 2 (mid-right). -->
  <g id="p8p1-dlg-thresh2">
    <rect x="350" y="92" width="124" height="46" rx="8" fill="#ffffff" stroke="#dc2030" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="360" y="112" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#dc2030" letter-spacing="0.3">THRESH</text>
    <text x="360" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Yes.</text>
    <path d="M348,138 L362,138 L312,168 Z" fill="#ffffff" stroke="#dc2030" stroke-width="2" stroke-linejoin="round"/>
    <line x1="348" y1="138" x2="362" y2="138" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p8p1-meta">
    <text x="478" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="482" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE+THRESH</text>
  </g>
</svg>
