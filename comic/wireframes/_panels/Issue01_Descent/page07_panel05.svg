<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 550" width="742" height="550">
  <title>Issue 1 — Page 7 — Panel 5: Bird's-eye reveal of full crash site, 5 figures in gutter</title>
  <desc>Wide bird's-eye shot, slightly elevated angle. Cast-iron half-round rain gutter running diagonally across composition. Filled with alien wreckage (twisted dark hull, shattered crystalline panels flickering blue-white, sparking conduits) mixed with dead leaves. 5 tiny figures scattered through ruin: silver center upright (Sable), copper nearby sitting (Wren), ruby-crimson leaning against wall (Thresh), emerald farther sprawled (Jink), sapphire-violet moving toward another (Luma). Gutter narrow against vast Welsh slate roof stretching away one side. Other side drops to lead flashing edge + abyss of city far below, warm amber gaslight rising from streets. Chimney stacks rise like dark towers. Cool blue-white pools in gutter. Warm amber rims outer edge. Figures tiny, gutter tiny, city enormous. SABLE: "One at a time. Injuries." 4 squad responses.</desc>

  <defs>
    <linearGradient id="p7p5slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1820"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="p7p5iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="p7p5floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="p7p5cityGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810" stop-opacity="0"/>
      <stop offset="60%" stop-color="#a85020" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c8783a" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="p7p5coolGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p7p5silver" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c4c8cf"/><stop offset="100%" stop-color="#5a606a"/></linearGradient>
    <linearGradient id="p7p5copper" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e6e3dc"/><stop offset="60%" stop-color="#9a968c"/><stop offset="100%" stop-color="#58544c"/></linearGradient>
    <linearGradient id="p7p5emerald" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#7dd9a0"/><stop offset="100%" stop-color="#0a3a22"/></linearGradient>
    <linearGradient id="p7p5ruby" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e85068"/><stop offset="100%" stop-color="#3a0610"/></linearGradient>
    <linearGradient id="p7p5sapphire" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#a690e8"/><stop offset="100%" stop-color="#1c1242"/></linearGradient>
    <filter id="p7p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p7p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="p7p5dropShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- ========================================================== -->
  <!-- LAYER: vast slate roof (upper-left side, dark stone plain)  -->
  <!-- ========================================================== -->
  <g id="p7p5-slate-roof">
    <path d="M0,0 L742,0 L520,500 L0,400 Z" fill="url(#p7p5slate)"/>
    <!-- Slate tile texture (overlapping rows). -->
    <g stroke="#0a0810" stroke-width="0.6" opacity="0.85">
      <path d="M0,80 L640,40"/>
      <path d="M0,140 L600,90"/>
      <path d="M0,200 L560,140"/>
      <path d="M0,260 L520,190"/>
      <path d="M0,320 L500,240"/>
      <path d="M0,380 L520,290"/>
    </g>
    <!-- Tile vertical seams. -->
    <g stroke="#0a0810" stroke-width="0.4" opacity="0.7">
      <line x1="80" y1="20" x2="100" y2="380"/>
      <line x1="200" y1="40" x2="220" y2="350"/>
      <line x1="320" y1="60" x2="340" y2="320"/>
      <line x1="440" y1="80" x2="460" y2="280"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: gutter cuts diagonally across composition             -->
  <!-- ========================================================== -->
  <g id="p7p5-gutter">
    <!-- Inner edge (where gutter meets slate roof). -->
    <path d="M520,500 L742,0 L742,80 L560,500 Z" fill="url(#p7p5iron)"/>
    <!-- Gutter floor (lower part of frame, deep brown). -->
    <path d="M560,500 L742,80 L742,200 L600,500 Z" fill="url(#p7p5floor)"/>
    <!-- Gutter rivets along inner seam. -->
    <g fill="#5a3818">
      <circle cx="572" cy="440" r="2"/>
      <circle cx="600" cy="380" r="2"/>
      <circle cx="630" cy="320" r="2"/>
      <circle cx="656" cy="260" r="2"/>
      <circle cx="684" cy="200" r="2"/>
      <circle cx="712" cy="140" r="2"/>
    </g>
    <!-- Outer edge (lead flashing dropping to abyss). -->
    <path d="M600,500 L742,200 L742,260 L640,500 Z" fill="#3a2010"/>
    <!-- Lead flashing texture. -->
    <line x1="608" y1="490" x2="742" y2="220" stroke="#5a3018" stroke-width="0.7" opacity="0.85"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: warm city-glow rising from below outer edge (the abyss) -->
  <!-- ========================================================== -->
  <g id="p7p5-city-glow">
    <path d="M640,500 L742,260 L742,550 L640,550 Z" fill="url(#p7p5cityGlow)"/>
    <!-- Distant gaslight points in fog (tiny). -->
    <circle cx="700" cy="380" r="1.5" fill="#fff5d8" opacity="0.85" filter="url(#p7p5bloom)"/>
    <circle cx="680" cy="460" r="1.5" fill="#fff5d8" opacity="0.85" filter="url(#p7p5bloom)"/>
    <circle cx="720" cy="500" r="1" fill="#ffe080" opacity="0.7" filter="url(#p7p5bloom)"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: chimney stacks rising from slate roof (dark towers)   -->
  <!-- ========================================================== -->
  <g id="p7p5-chimneys">
    <!-- Chimney 1 (left). -->
    <rect x="60" y="100" width="40" height="120" fill="#0a0408"/>
    <rect x="64" y="80" width="8" height="22" fill="#3a1810"/>
    <rect x="76" y="76" width="8" height="26" fill="#3a1810"/>
    <rect x="88" y="78" width="8" height="24" fill="#3a1810"/>
    <rect x="62" y="78" width="40" height="3" fill="#5a2812"/>

    <!-- Chimney 2 (center). -->
    <rect x="280" y="120" width="50" height="160" fill="#0a0408"/>
    <rect x="284" y="96" width="10" height="26" fill="#3a1810"/>
    <rect x="298" y="92" width="10" height="30" fill="#3a1810"/>
    <rect x="312" y="94" width="10" height="28" fill="#3a1810"/>
    <rect x="326" y="98" width="4" height="24" fill="#3a1810"/>
    <rect x="282" y="94" width="50" height="3" fill="#5a2812"/>
    <!-- Faint smoke. -->
    <ellipse cx="304" cy="60" rx="14" ry="22" fill="#3a2818" opacity="0.4" filter="url(#p7p5bloom)"/>

    <!-- Chimney 3 (right of center). -->
    <rect x="450" y="180" width="36" height="100" fill="#0a0408"/>
    <rect x="454" y="160" width="8" height="22" fill="#3a1810"/>
    <rect x="466" y="156" width="8" height="26" fill="#3a1810"/>
    <rect x="478" y="160" width="6" height="22" fill="#3a1810"/>
    <rect x="452" y="158" width="36" height="3" fill="#5a2812"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: wreckage scattered through gutter                     -->
  <!-- ========================================================== -->
  <g id="p7p5-gutter-wreckage">
    <!-- Wreckage piece 1 (upper). -->
    <polygon points="650,180 680,170 690,190 670,200" fill="#1a1d22"/>
    <line x1="660" y1="180" x2="685" y2="195" stroke="#bfe4ff" stroke-width="0.8" opacity="0.85" filter="url(#p7p5bloom)"/>

    <!-- Wreckage piece 2 (mid). -->
    <polygon points="610,300 650,290 660,310 615,320" fill="#1a1d22"/>
    <ellipse cx="635" cy="305" rx="18" ry="6" fill="url(#p7p5coolGlow)" opacity="0.65" filter="url(#p7p5bloom)"/>

    <!-- Wreckage piece 3 (lower). -->
    <polygon points="595,420 625,410 635,430 600,438" fill="#1a1d22"/>
    <circle cx="615" cy="424" r="2" fill="#bfe4ff" filter="url(#p7p5bloom)"/>

    <!-- Dead leaves scattered. -->
    <ellipse cx="640" cy="240" rx="14" ry="6" fill="#5a3818"/>
    <ellipse cx="600" cy="380" rx="16" ry="7" fill="#5a3818"/>
    <ellipse cx="630" cy="460" rx="12" ry="5" fill="#5a3818"/>

    <!-- Sparking conduit trails. -->
    <path d="M660,200 Q672,210 680,220" stroke="#bfe4ff" stroke-width="0.7" fill="none" opacity="0.85" filter="url(#p7p5bloom)"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: 5 SQUAD MEMBERS scattered through gutter (tiny)       -->
  <!-- All ~16-22px tall (worm's-eye scale).                         -->
  <!-- ========================================================== -->

  <!-- SABLE (silver, center, upright — the anchor). -->
  <g id="p7p5-sable" filter="url(#p7p5dropShadow)" transform="translate(630, 290)">
    <ellipse cx="0" cy="22" rx="6" ry="3" fill="#000000" opacity="0.55"/>
    <!-- Body upright. -->
    <ellipse cx="0" cy="10" rx="6" ry="10" fill="url(#p7p5silver)"/>
    <!-- Cracked shoulder leaks blue. -->
    <ellipse cx="4" cy="6" rx="2" ry="1.5" fill="#bfe4ff" filter="url(#p7p5bloom)"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-4" rx="4" ry="5" fill="#3a2418"/>
    <!-- Hair. -->
    <ellipse cx="0" cy="-7" rx="3.5" ry="2.5" fill="#d4d6db" opacity="0.95"/>
    <!-- Chest accent. -->
    <circle cx="0" cy="10" r="1.5" fill="#bfe4ff" filter="url(#p7p5bloom)"/>
  </g>

  <!-- WREN (copper, nearby Sable, sitting). -->
  <g id="p7p5-wren" filter="url(#p7p5dropShadow)" transform="translate(670, 250)">
    <ellipse cx="0" cy="14" rx="6" ry="2.5" fill="#000000" opacity="0.5"/>
    <ellipse cx="0" cy="8" rx="6" ry="8" fill="url(#p7p5copper)"/>
    <!-- Copper trim. -->
    <line x1="0" y1="0" x2="0" y2="16" stroke="#c87a35" stroke-width="0.8"/>
    <ellipse cx="0" cy="-4" rx="3.5" ry="4.5" fill="#a87648"/>
    <!-- Hair (high knot). -->
    <ellipse cx="0" cy="-8" rx="2.5" ry="2" fill="#0e0a08"/>
    <ellipse cx="0" cy="-6" rx="3" ry="1.5" fill="#0e0a08"/>
    <circle cx="0" cy="6" r="1.2" fill="#f5a850" filter="url(#p7p5bloom)"/>
  </g>

  <!-- THRESH (ruby-crimson, leaning against gutter wall — rightward). -->
  <g id="p7p5-thresh" filter="url(#p7p5dropShadow)" transform="translate(700, 360) rotate(-15)">
    <ellipse cx="0" cy="18" rx="7" ry="3" fill="#000000" opacity="0.55"/>
    <!-- Body leaned, slightly larger (heavier build). -->
    <ellipse cx="0" cy="8" rx="7" ry="10" fill="url(#p7p5ruby)"/>
    <ellipse cx="0" cy="-2" rx="4" ry="5" fill="#e8c4ae"/>
    <!-- Pomp visible from above. -->
    <path d="M-3,-7 Q0,-12 3,-7 Q4,-5 -4,-5 Z" fill="#a83012"/>
    <circle cx="0" cy="8" r="1.5" fill="#ff8090" filter="url(#p7p5bloom)"/>
  </g>

  <!-- JINK (emerald, farther away, sprawled). -->
  <g id="p7p5-jink" filter="url(#p7p5dropShadow)" transform="translate(595, 440) rotate(20)">
    <ellipse cx="0" cy="20" rx="8" ry="3" fill="#000000" opacity="0.5"/>
    <!-- Body sprawled (longer shape). -->
    <ellipse cx="0" cy="10" rx="6" ry="12" fill="url(#p7p5emerald)"/>
    <!-- Arm splayed. -->
    <path d="M-6,8 Q-12,12 -16,16 L-14,18 Q-9,16 -6,12 Z" fill="url(#p7p5emerald)"/>
    <ellipse cx="0" cy="-4" rx="3.5" ry="4" fill="#b88758"/>
    <!-- Curly blonde tufts. -->
    <circle cx="-2" cy="-8" r="2" fill="#f5d878"/>
    <circle cx="2" cy="-8" r="2" fill="#f5d878"/>
    <circle cx="0" cy="-10" r="1.8" fill="#f5d878"/>
    <circle cx="0" cy="8" r="1.2" fill="#a8f5c8" filter="url(#p7p5bloom)"/>
  </g>

  <!-- LUMA (sapphire-violet, moving toward Jink). -->
  <g id="p7p5-luma" filter="url(#p7p5dropShadow)" transform="translate(620, 410)">
    <ellipse cx="0" cy="14" rx="6" ry="2.5" fill="#000000" opacity="0.5"/>
    <ellipse cx="0" cy="8" rx="6" ry="9" fill="url(#p7p5sapphire)"/>
    <ellipse cx="0" cy="-3" rx="3.5" ry="4.5" fill="#a87648"/>
    <!-- Hair pulled back. -->
    <ellipse cx="0" cy="-7" rx="3" ry="2.5" fill="#0e0604"/>
    <!-- Visible braid trailing. -->
    <path d="M3,-3 Q5,4 6,12 L4,12 Q3,4 1,-3 Z" fill="#0e0604"/>
    <circle cx="0" cy="8" r="1.2" fill="#c8b8ff" filter="url(#p7p5bloom)"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: cool light pools on gutter floor from wreckage        -->
  <!-- ========================================================== -->
  <g opacity="0.4" filter="url(#p7p5strongBloom)">
    <ellipse cx="635" cy="305" rx="40" ry="14" fill="#5aa6dc"/>
    <ellipse cx="615" cy="424" rx="34" ry="12" fill="#5aa6dc"/>
    <ellipse cx="670" cy="195" rx="34" ry="12" fill="#5aa6dc"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: dialogue (5 voices — small balloons at panel margins) -->
  <!-- ========================================================== -->
  <g id="p7p5-dialogue">
    <!-- WREN -->
    <rect x="6" y="10" width="84" height="32" rx="6" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="14" y="24" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#c87a35">WREN</text>
    <text x="14" y="38" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#1a1a1a">Here.</text>

    <!-- THRESH -->
    <rect x="100" y="10" width="100" height="32" rx="6" fill="#ffffff" stroke="#dc2030" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="108" y="24" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#dc2030">THRESH</text>
    <text x="108" y="38" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#1a1a1a">...here.</text>

    <!-- JINK -->
    <rect x="210" y="10" width="116" height="32" rx="6" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="218" y="24" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#2ed078">JINK</text>
    <text x="218" y="38" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#1a1a1a">Present. Ow.</text>

    <!-- LUMA -->
    <rect x="336" y="10" width="138" height="32" rx="6" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="344" y="24" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#5a3ad8">LUMA</text>
    <text x="344" y="38" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#1a1a1a">Here. Is everyone—</text>

    <!-- SABLE (cuts off Luma) -->
    <rect x="6" y="500" width="220" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="14" y="518" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a">SABLE</text>
    <text x="14" y="534" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#1a1a1a">One at a time. Injuries.</text>
  </g>

  <g id="p7p5-meta">
    <text x="730" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">5</text>
    <text x="734" y="542" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">BIRDSEYE</text>
  </g>
</svg>
