<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 1 — Page 15 — Panel 1: Gutter establishing wide — squad in their environment</title>
  <desc>Wide establishing 18mm worm's-eye from gutter floor along channel. Curved cast-iron walls rising like canyon. 5 squad scattered: Sable center scanning, Wren crouched left over wreckage, Jink right perched on twig at lip, Thresh sentinel near roof wall, Luma kneeling by equipment. Beyond gutter lip: gaslit cityscape sprawling vertiginously. Warm amber from below + cool wreckage glow + 5 suit accent colors. Two light worlds overlap on iron. CAPTION: "The city does not know they are here."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="p15p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p15p1iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p15p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#180a08"/>
    </linearGradient>
    <radialGradient id="p15p1cityHaze" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p15p1wreckGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p15p1leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a2008"/>
    </linearGradient>
    <linearGradient id="p15p1twig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p15p1silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfc6d0"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p15p1copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a060"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <linearGradient id="p15p1ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <linearGradient id="p15p1emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a5a30"/>
    </linearGradient>
    <linearGradient id="p15p1sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5af0"/>
      <stop offset="100%" stop-color="#2a18a0"/>
    </linearGradient>
    <filter id="p15p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p15p1softBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p15p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky background. -->
  <rect width="742" height="320" fill="url(#p15p1sky)"/>

  <!-- Stars + chimney smoke top. -->
  <g fill="#dce4f0" opacity="0.7">
    <circle cx="80" cy="22" r="0.6"/>
    <circle cx="220" cy="32" r="0.5"/>
    <circle cx="460" cy="22" r="0.6"/>
    <circle cx="640" cy="32" r="0.5"/>
  </g>
  <ellipse cx="500" cy="40" rx="80" ry="14" fill="#3a2818" opacity="0.55"/>

  <!-- Chimney stack rising at top-right (industrial tower). -->
  <g id="p15p1-chimney">
    <rect x="500" y="0" width="48" height="80" fill="#1a0808"/>
    <rect x="496" y="0" width="56" height="3" fill="#3a1810"/>
    <ellipse cx="524" cy="-2" rx="40" ry="10" fill="#3a2818" opacity="0.7" filter="url(#p15p1strongBloom)"/>
  </g>

  <!-- Distant city silhouette beyond gutter lip (right side). -->
  <g id="p15p1-far-city" opacity="0.85">
    <path d="M450,180 L490,178 L530,184 L580,176 L620,184 L680,176 L742,180 L742,240 L450,240 Z" fill="#1a1820"/>
    <polygon points="540,168 546,184 534,184" fill="#1a1820"/>
    <polygon points="640,170 646,184 634,184" fill="#1a1820"/>
    <rect x="610" y="160" width="4" height="24" fill="#0a0808"/>
  </g>

  <!-- Vertiginous drop visible right edge — amber pinpricks far below. -->
  <g>
    <ellipse cx="700" cy="265" rx="60" ry="10" fill="url(#p15p1cityHaze)" filter="url(#p15p1bloom)" opacity="0.85"/>
    <circle cx="680" cy="260" r="0.8" fill="#ffd060" filter="url(#p15p1softBloom)"/>
    <circle cx="700" cy="263" r="1" fill="#ffd060" filter="url(#p15p1softBloom)"/>
    <circle cx="725" cy="266" r="0.8" fill="#ffd060" filter="url(#p15p1softBloom)"/>
  </g>

  <!-- Strong warm amber rises from gutter lip + city. -->
  <ellipse cx="600" cy="280" rx="280" ry="80" fill="url(#p15p1cityHaze)" filter="url(#p15p1strongBloom)"/>

  <!-- Gutter wall (back, curving up). -->
  <path d="M0,140 Q371,118 488,140 L488,260 L0,260 Z" fill="url(#p15p1iron)"/>
  <line x1="0" y1="180" x2="488" y2="160" stroke="#080404" stroke-width="0.7" opacity="0.7"/>
  <line x1="0" y1="220" x2="488" y2="218" stroke="#080404" stroke-width="0.7" opacity="0.7"/>
  <g fill="#080404" opacity="0.85">
    <circle cx="60" cy="185" r="1.7"/>
    <circle cx="180" cy="167" r="1.7"/>
    <circle cx="320" cy="160" r="1.7"/>
    <circle cx="440" cy="170" r="1.7"/>
    <circle cx="60" cy="225" r="1.7"/>
    <circle cx="440" cy="223" r="1.7"/>
  </g>
  <g fill="#080404" opacity="0.55">
    <path d="M40,140 Q44,200 38,250"/>
    <path d="M280,140 Q284,200 278,250"/>
  </g>

  <!-- Gutter LIP across right side (where Jink perches). -->
  <rect x="480" y="232" width="262" height="14" fill="url(#p15p1iron)"/>
  <line x1="480" y1="232" x2="742" y2="232" stroke="#080404" stroke-width="1"/>
  <path d="M480,232 L742,232" fill="none" stroke="#f5b860" stroke-width="1.4" opacity="0.85" filter="url(#p15p1bloom)"/>

  <!-- Floor. -->
  <rect y="260" width="742" height="60" fill="url(#p15p1floor)"/>
  <line x1="0" y1="260" x2="742" y2="260" stroke="#080404" stroke-width="1.2"/>

  <!-- TWIG-LOG running across foreground floor (where Jink will perch on far end). -->
  <g id="p15p1-twig">
    <path d="M380,290 Q500,285 620,288 Q680,290 720,288" stroke="url(#p15p1twig)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g stroke="#3a1808" stroke-width="0.7" fill="none" opacity="0.85">
      <path d="M420,287 Q422,292 418,297"/>
      <path d="M520,285 Q522,290 518,295"/>
      <path d="M620,288 Q622,293 618,298"/>
    </g>
    <!-- Moss patches. -->
    <ellipse cx="460" cy="285" rx="14" ry="2" fill="#4a8048" opacity="0.85"/>
    <ellipse cx="560" cy="285" rx="14" ry="2" fill="#4a8048" opacity="0.85"/>
  </g>

  <!-- DEAD LEAVES scattered on floor. -->
  <g fill="url(#p15p1leaf)" opacity="0.92">
    <path d="M50,300 Q45,288 60,285 Q72,288 72,300 Q60,308 50,300 Z"/>
    <path d="M180,300 Q175,288 190,285 Q205,288 205,300 Q190,308 180,300 Z"/>
    <path d="M280,302 Q275,290 290,288 Q302,290 302,302 Q290,310 280,302 Z"/>
  </g>
  <!-- Coal sediment. -->
  <g fill="#080404" opacity="0.7">
    <circle cx="40" cy="282" r="1.3"/>
    <circle cx="100" cy="295" r="1.4"/>
    <circle cx="160" cy="285" r="1.3"/>
    <circle cx="240" cy="290" r="1.4"/>
    <circle cx="340" cy="298" r="1.3"/>
    <circle cx="660" cy="296" r="1.3"/>
  </g>

  <!-- WRECKAGE pieces scattered (left side, glowing faintly). -->
  <g id="p15p1-wreckage-pieces">
    <polygon points="80,265 110,260 120,275 90,285" fill="#1a1a24" stroke="#080808" stroke-width="0.5"/>
    <ellipse cx="100" cy="272" rx="20" ry="6" fill="url(#p15p1wreckGlow)" filter="url(#p15p1bloom)" opacity="0.7"/>
    <circle cx="100" cy="272" r="1" fill="#ffffff" filter="url(#p15p1bloom)" opacity="0.95"/>
    <polygon points="200,275 230,270 240,285 210,290" fill="#1a1a24" stroke="#080808" stroke-width="0.5"/>
    <ellipse cx="220" cy="280" rx="16" ry="5" fill="url(#p15p1wreckGlow)" filter="url(#p15p1bloom)" opacity="0.6"/>
    <circle cx="220" cy="278" r="0.8" fill="#ffffff" filter="url(#p15p1bloom)" opacity="0.85"/>
  </g>

  <!-- ===== 5 SQUAD MEMBERS scattered (small at this wide scale). ===== -->

  <!-- THRESH sentinel near roof wall (far-left back). -->
  <g id="p15p1-thresh" transform="translate(45, 240)">
    <ellipse cx="0" cy="0" rx="6" ry="9" fill="url(#p15p1ruby)"/>
    <ellipse cx="0" cy="-12" rx="3.5" ry="4" fill="#d8a880"/>
    <ellipse cx="0" cy="-15" rx="3" ry="2" fill="#a83a18"/>
    <line x1="-5" y1="3" x2="-7" y2="14" stroke="#a8182a" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="3" x2="7" y2="14" stroke="#a8182a" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="9" x2="-3" y2="20" stroke="#a8182a" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="9" x2="3" y2="20" stroke="#a8182a" stroke-width="3" stroke-linecap="round"/>
    <!-- Faint ruby suit accent. -->
    <ellipse cx="0" cy="0" rx="9" ry="11" fill="#dc2030" opacity="0.25" filter="url(#p15p1bloom)"/>
  </g>

  <!-- WREN crouched left over wreckage. -->
  <g id="p15p1-wren" transform="translate(160, 250)">
    <ellipse cx="0" cy="0" rx="7" ry="6" fill="url(#p15p1copper)"/>
    <ellipse cx="0" cy="-8" rx="3.5" ry="4" fill="#e0c0a0"/>
    <ellipse cx="-1" cy="-11" rx="3" ry="2" fill="#0a0408"/>
    <!-- Arms reaching forward (crouching). -->
    <path d="M-5,2 L-12,8 L-15,12" fill="none" stroke="#a86028" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M5,2 L12,8 L15,12" fill="none" stroke="#a86028" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Crouched legs. -->
    <line x1="-3" y1="6" x2="-5" y2="14" stroke="#a86028" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="6" x2="5" y2="14" stroke="#a86028" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="9" ry="8" fill="#c87a35" opacity="0.25" filter="url(#p15p1bloom)"/>
  </g>

  <!-- LUMA kneeling by equipment center-back. -->
  <g id="p15p1-luma" transform="translate(280, 247)">
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="url(#p15p1sapphire)"/>
    <ellipse cx="0" cy="-10" rx="3.5" ry="4" fill="#a87850"/>
    <ellipse cx="0" cy="-13" rx="3" ry="2" fill="#1a0a08"/>
    <path d="M3,-10 Q7,-5 9,3" fill="none" stroke="#1a0a08" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="3" x2="-9" y2="9" stroke="#3a2a8c" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="3" x2="9" y2="9" stroke="#3a2a8c" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="6" x2="-3" y2="14" stroke="#3a2a8c" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="6" x2="3" y2="14" stroke="#3a2a8c" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="9" ry="11" fill="#5a3ad8" opacity="0.3" filter="url(#p15p1bloom)"/>
    <!-- Small scanner with bluish glow. -->
    <rect x="6" y="2" width="5" height="4" fill="#1a1828"/>
    <ellipse cx="8" cy="4" rx="6" ry="3" fill="#a87af0" filter="url(#p15p1bloom)" opacity="0.45"/>
  </g>

  <!-- SABLE center scanning. -->
  <g id="p15p1-sable" transform="translate(380, 240)">
    <ellipse cx="0" cy="0" rx="7" ry="10" fill="url(#p15p1silver)"/>
    <ellipse cx="0" cy="-13" rx="4" ry="4.5" fill="#5a3018"/>
    <ellipse cx="0" cy="-16" rx="3.5" ry="2" fill="#e8eaee"/>
    <line x1="-6" y1="3" x2="-9" y2="14" stroke="#5a606a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="3" x2="9" y2="14" stroke="#5a606a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-3" y1="10" x2="-3" y2="22" stroke="#5a606a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="3" y1="10" x2="3" y2="22" stroke="#5a606a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Faint silver accent + cracked shoulder. -->
    <ellipse cx="0" cy="0" rx="11" ry="13" fill="#dceaff" opacity="0.25" filter="url(#p15p1bloom)"/>
    <line x1="6" y1="-5" x2="9" y2="-3" stroke="#7ac8ff" stroke-width="0.6" filter="url(#p15p1softBloom)" opacity="0.85"/>
  </g>

  <!-- JINK perched on twig at gutter lip (right). -->
  <g id="p15p1-jink" transform="translate(560, 270)">
    <ellipse cx="0" cy="0" rx="6" ry="7" fill="url(#p15p1emerald)"/>
    <ellipse cx="0" cy="-9" rx="3.5" ry="4" fill="#d8b890"/>
    <g fill="#f5d068">
      <circle cx="-2" cy="-12" r="2.5"/>
      <circle cx="2" cy="-13" r="2.5"/>
      <circle cx="0" cy="-14" r="2.5"/>
    </g>
    <!-- Legs dangling. -->
    <line x1="-3" y1="6" x2="-3" y2="18" stroke="#0a5a30" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3" y1="6" x2="3" y2="18" stroke="#0a5a30" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arm at side. -->
    <line x1="-5" y1="2" x2="-7" y2="6" stroke="#2ed078" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="2" x2="7" y2="6" stroke="#2ed078" stroke-width="2" stroke-linecap="round"/>
    <!-- Faint emerald wing-pack accent. -->
    <ellipse cx="0" cy="0" rx="9" ry="9" fill="#2ed078" opacity="0.3" filter="url(#p15p1bloom)"/>
  </g>

  <!-- CAPTION (parchment, italic, top). -->
  <g id="p15p1-caption">
    <rect x="80" y="14" width="356" height="38" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="258" y="38" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" font-style="italic" fill="#5a4a30" letter-spacing="0.4">The city does not know they are here.</text>
  </g>

  <!-- Meta tag. -->
  <g id="p15p1-meta">
    <text x="730" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">FIRST NIGHT — ESTABLISHING</text>
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
  </g>
</svg>
