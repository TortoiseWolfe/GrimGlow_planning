<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 320" width="175" height="320">
  <title>Issue 1 — Page 7 — Panel 4: Sable face close-up scanning, command activating</title>
  <desc>Close-up at 85mm, eye level, tight framing on Sable's face. Late thirties, dark brown skin, very short military-cropped silver-white hair matted with debris and soot. Sharp features, soot streaking left cheek and forehead. Eyes sharp and alert, scanning — disorientation gone, replaced by command focus. At right edge of frame, cracked silver suit shoulder panel leaks blue-white from hairline fractures. Cool from cracked panel illuminates right side of face from below. Warm amber from city sky-glow touches left cheek where soot streaks skin. Two lights divide face precisely. SABLE: "Sound off."</desc>

  <defs>
    <linearGradient id="p7p4skin" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bfe4ff"/>
      <stop offset="40%" stop-color="#5d3d2a"/>
      <stop offset="100%" stop-color="#a85020"/>
    </linearGradient>
    <linearGradient id="p7p4silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4c8cf"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <radialGradient id="p7p4coolGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p4warmRim" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#f5a850" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5a2812" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p7p4dropShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- Background — dark wreckage area. -->
  <rect width="175" height="320" fill="#0a0e18"/>
  <rect width="175" height="320" fill="url(#p7p4warmRim)"/>
  <ellipse cx="175" cy="240" rx="80" ry="110" fill="#bfe4ff" opacity="0.28" filter="url(#p7p4bloom)"/>

  <!-- ========================================================== -->
  <!-- LAYER: Sable head — tight close-up                           -->
  <!-- ========================================================== -->
  <g id="p7p4-sable" filter="url(#p7p4dropShadow)" transform="translate(0, 30)">
    <!-- Cracked shoulder panel at right edge of frame. -->
    <path d="M150,210 L175,220 L175,260 L160,250 Z" fill="url(#p7p4silver)"/>
    <path d="M152,212 L172,222" stroke="#bfe4ff" stroke-width="1.4" opacity="0.95" filter="url(#p7p4bloom)"/>
    <path d="M158,238 L172,248" stroke="#bfe4ff" stroke-width="1" opacity="0.85" filter="url(#p7p4bloom)"/>
    <!-- Shoulder accent node. -->
    <ellipse cx="166" cy="232" rx="7" ry="5" fill="url(#p7p4coolGlow)" filter="url(#p7p4bloom)"/>
    <ellipse cx="166" cy="232" rx="3" ry="2.5" fill="#bfe4ff"/>

    <!-- Neck. -->
    <path d="M70,220 L70,260 L120,260 L120,220 Z" fill="url(#p7p4skin)"/>
    <!-- Suit collar. -->
    <path d="M50,250 Q90,238 130,250 L122,260 L62,260 Z" fill="url(#p7p4silver)"/>

    <!-- Head — divided by light. -->
    <ellipse cx="90" cy="150" rx="62" ry="78" fill="url(#p7p4skin)"/>

    <!-- Cool wreckage light wash on RIGHT side of face (from cracked panel below-right). -->
    <path d="M90,80 Q120,80 150,150 Q150,210 100,224 L100,80 Z" fill="#bfe4ff" opacity="0.32"/>
    <!-- Cool rim on cheek. -->
    <path d="M118,160 Q140,166 145,180 Q140,200 122,202 Z" fill="#a8d4f5" opacity="0.4"/>

    <!-- Warm city-glow on LEFT side of face. -->
    <path d="M90,80 Q60,80 30,150 Q30,210 80,224 L80,80 Z" fill="#f5a850" opacity="0.32"/>

    <!-- Silver-white hair matted with debris. -->
    <path d="M28,90 Q26,50 90,40 Q154,50 152,90 L148,108 Q145,60 90,56 Q35,60 32,108 Z" fill="#d4d6db"/>
    <!-- Soot streaks on hair. -->
    <ellipse cx="60" cy="62" rx="8" ry="3" fill="#0a0204" opacity="0.7"/>
    <ellipse cx="100" cy="56" rx="10" ry="3.5" fill="#0a0204" opacity="0.65"/>
    <ellipse cx="135" cy="65" rx="6" ry="2.5" fill="#0a0204" opacity="0.7"/>
    <!-- Buzz stipple. -->
    <g stroke="#9ea1a8" stroke-width="0.6" stroke-linecap="round" opacity="0.65">
      <line x1="50" y1="68" x2="52" y2="74"/>
      <line x1="68" y1="60" x2="70" y2="66"/>
      <line x1="86" y1="56" x2="88" y2="62"/>
      <line x1="106" y1="58" x2="108" y2="64"/>
      <line x1="124" y1="62" x2="126" y2="68"/>
      <line x1="142" y1="68" x2="144" y2="74"/>
      <line x1="58" y1="80" x2="60" y2="86"/>
      <line x1="76" y1="74" x2="78" y2="80"/>
      <line x1="96" y1="72" x2="98" y2="78"/>
      <line x1="116" y1="74" x2="118" y2="80"/>
      <line x1="134" y1="80" x2="136" y2="86"/>
    </g>
    <!-- Hairline edge. -->
    <path d="M32,108 Q90,98 148,108" fill="none" stroke="#7a7d83" stroke-width="0.8" opacity="0.85"/>

    <!-- Soot streak across LEFT cheek + forehead (per script). -->
    <path d="M40,120 Q60,118 80,130" fill="none" stroke="#0a0204" stroke-width="3.5" opacity="0.7"/>
    <path d="M50,170 Q70,180 90,176" fill="none" stroke="#0a0204" stroke-width="3" opacity="0.65"/>

    <!-- EYES — sharp, alert, SCANNING (slightly turned, looking right). -->
    <ellipse cx="60" cy="138" rx="8" ry="5" fill="#ffffff"/>
    <ellipse cx="60" cy="138" rx="5" ry="5" fill="#1a0e08"/>
    <!-- Pupil (slightly right — scanning). -->
    <circle cx="62" cy="138" r="2" fill="#000000"/>
    <!-- Cool light reflection. -->
    <ellipse cx="63" cy="136" rx="0.8" ry="0.7" fill="#bfe4ff"/>

    <ellipse cx="120" cy="138" rx="8" ry="5" fill="#ffffff"/>
    <ellipse cx="120" cy="138" rx="5" ry="5" fill="#1a0e08"/>
    <circle cx="122" cy="138" r="2" fill="#000000"/>
    <ellipse cx="123" cy="136" rx="0.8" ry="0.7" fill="#bfe4ff"/>

    <!-- Brows — focused/angled (command activating). -->
    <path d="M48,124 Q60,118 72,124" fill="none" stroke="#15100b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M108,124 Q120,118 132,124" fill="none" stroke="#15100b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M90,150 L84,184 Q90,188 96,184 Z" fill="#3a1f12" opacity="0.85"/>
    <!-- Nose bridge cool highlight. -->
    <line x1="90" y1="152" x2="90" y2="180" stroke="#bfe4ff" stroke-width="0.7" opacity="0.55"/>

    <!-- Mouth — set, firm (command). -->
    <path d="M76,200 Q90,202 104,200" fill="none" stroke="#2a1006" stroke-width="2" stroke-linecap="round"/>

    <!-- Jaw definition. -->
    <path d="M60,210 Q90,222 120,210" fill="none" stroke="#3a1810" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- Dialogue. -->
  <g id="p7p4-dialogue">
    <rect x="6" y="10" width="100" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <polygon points="60,50 72,50 56,66" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="61" y1="50" x2="71" y2="50" stroke="#ffffff" stroke-width="3"/>
    <text x="16" y="28" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="16" y="44" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Sound off.</text>
  </g>

  <g id="p7p4-meta">
    <text x="165" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">4</text>
    <text x="169" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">CU</text>
  </g>
</svg>
