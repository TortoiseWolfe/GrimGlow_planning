<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 380" width="488" height="380">
  <title>Issue 1 — Page 10 — Panel 2: Reverse OTS from inside wrecked hull — Wren silhouetted in torn panel</title>
  <desc>Wide 28mm slight low angle from inside wreckage looking out through torn access panel at Wren upper body silhouetted in framed by panel edges. Catastrophic interior: bent structural spars at wrong angles, shattered dark holographic surfaces (one weakly flickering), severed conduit bundles hanging like cut tendons, control surfaces cracked, twisted cockpit framework, dead leaves penetrating through hull breaches. Almost dark inside; intermittent blue-white strobing; through panel: amber gutter outside backlight. Two WREN balloons damage report.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p2interior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#020208"/>
    </linearGradient>
    <radialGradient id="p10p2outsideAmber" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p2flickerGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#bfe4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p10p2spar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3848"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="p10p2copperSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a3818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p10p2leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <filter id="p10p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p10p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Interior background — almost dark. -->
  <rect width="488" height="380" fill="url(#p10p2interior)"/>

  <!-- Bent structural spars at wrong angles (foreground frame elements). -->
  <g id="p10p2-spars">
    <!-- Top spar curving down-right (broken). -->
    <path d="M0,40 L120,90 L240,75 L380,110 L488,85" stroke="url(#p10p2spar)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M0,42 L120,92 L240,77 L380,112 L488,87" stroke="#5a606a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- Bottom spar bent upward at wrong angle. -->
    <path d="M0,330 L80,310 L180,335 L300,315 L420,340 L488,325" stroke="url(#p10p2spar)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Vertical spar broken at sharp angle. -->
    <path d="M70,40 L65,150 L120,180 L130,330" stroke="url(#p10p2spar)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M380,40 L385,140 L350,180 L365,330" stroke="url(#p10p2spar)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <!-- SHATTERED HOLOGRAPHIC SURFACES (multiple panels — most dark, one weakly flickering). -->
  <g id="p10p2-holo-surfaces">
    <!-- Dark shattered (top-left area). -->
    <g fill="#1a1a24" stroke="#3a3848" stroke-width="0.6">
      <polygon points="20,140 80,135 78,180 22,180"/>
      <polygon points="320,130 388,130 385,170 322,168"/>
    </g>
    <!-- Crack lines on dark surfaces. -->
    <g stroke="#080404" stroke-width="0.7" fill="none">
      <line x1="30" y1="145" x2="55" y2="170"/>
      <line x1="60" y1="140" x2="40" y2="178"/>
      <line x1="335" y1="140" x2="370" y2="160"/>
      <line x1="350" y1="135" x2="340" y2="165"/>
    </g>

    <!-- ONE weakly flickering display (large, central-bottom area, dim blue strobe). -->
    <g id="p10p2-dying-display" transform="translate(244, 245)">
      <rect x="-50" y="-30" width="100" height="55" rx="3" fill="#1a2a3c" stroke="#3a4858" stroke-width="0.8"/>
      <ellipse cx="0" cy="0" rx="64" ry="38" fill="url(#p10p2flickerGlow)" filter="url(#p10p2strongBloom)" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="40" ry="22" fill="#bfe4ff" filter="url(#p10p2bloom)" opacity="0.65"/>
      <!-- Flickering data bands. -->
      <g stroke="#bfe4ff" stroke-width="0.6" fill="none" opacity="0.8">
        <line x1="-44" y1="-18" x2="44" y2="-18"/>
        <line x1="-44" y1="-12" x2="36" y2="-12"/>
        <line x1="-44" y1="-6" x2="44" y2="-6"/>
        <line x1="-44" y1="0" x2="32" y2="0" stroke-dasharray="3,1"/>
        <line x1="-44" y1="6" x2="40" y2="6"/>
        <line x1="-44" y1="12" x2="28" y2="12" stroke-dasharray="2,1"/>
        <line x1="-44" y1="18" x2="44" y2="18"/>
      </g>
      <!-- Strobe artifacts (broken segments). -->
      <g fill="#ffffff" filter="url(#p10p2bloom)">
        <circle cx="-22" cy="-8" r="0.9"/>
        <circle cx="14" cy="4" r="0.7"/>
        <circle cx="32" cy="-10" r="0.8"/>
      </g>
    </g>
  </g>

  <!-- SEVERED CONDUIT BUNDLES hanging like cut tendons. -->
  <g id="p10p2-conduits">
    <g stroke="#1a1820" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.95">
      <path d="M180,40 Q175,80 165,120"/>
      <path d="M210,40 Q200,90 195,140"/>
      <path d="M280,40 Q290,80 295,120"/>
      <path d="M310,40 Q315,90 322,140"/>
    </g>
    <!-- Inner wires (lighter). -->
    <g stroke="#3a3848" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M178,40 Q173,70 163,110"/>
      <path d="M278,40 Q288,70 293,110"/>
    </g>
    <!-- Tiny sparks at cut ends. -->
    <g fill="#ffffff" filter="url(#p10p2bloom)">
      <circle cx="165" cy="120" r="0.7"/>
      <circle cx="195" cy="140" r="0.7"/>
      <circle cx="295" cy="120" r="0.7"/>
      <circle cx="322" cy="140" r="0.7"/>
    </g>
  </g>

  <!-- Cracked control surfaces (panels with crack lines). -->
  <g id="p10p2-control-surfaces">
    <rect x="160" y="200" width="50" height="35" fill="#1a1820" stroke="#3a3848" stroke-width="0.5"/>
    <line x1="170" y1="205" x2="200" y2="232" stroke="#080404" stroke-width="0.8"/>
    <rect x="290" y="205" width="55" height="32" fill="#1a1820" stroke="#3a3848" stroke-width="0.5"/>
    <line x1="305" y1="210" x2="335" y2="234" stroke="#080404" stroke-width="0.8"/>
  </g>

  <!-- Dead leaves penetrating through hull breaches (script-specific). -->
  <g id="p10p2-leaves-penetrated">
    <path d="M30,300 Q28,280 38,275 Q50,275 52,290 Q48,302 38,303 Z" fill="url(#p10p2leaf)" opacity="0.85"/>
    <path d="M460,295 Q462,275 472,275 Q482,278 480,295 Q472,303 462,300 Z" fill="url(#p10p2leaf)" opacity="0.85"/>
    <path d="M180,365 Q178,350 188,348 Q198,350 196,360 Q190,370 180,365 Z" fill="url(#p10p2leaf)" opacity="0.85"/>
  </g>
  <!-- Coal soot debris penetrating. -->
  <g fill="#080404" opacity="0.7">
    <circle cx="60" cy="345" r="1.4"/>
    <circle cx="90" cy="362" r="1.2"/>
    <circle cx="240" cy="350" r="1.3"/>
    <circle cx="380" cy="355" r="1.4"/>
    <circle cx="420" cy="368" r="1.2"/>
  </g>

  <!-- TORN ACCESS PANEL — ragged opening top-center where Wren is framed. -->
  <g id="p10p2-torn-panel">
    <!-- Ragged opening cut into the spars/frame, showing outside. -->
    <path d="M180,30 L300,28 L320,75 L300,150 L240,160 L185,140 L165,90 Z" fill="none" stroke="#080404" stroke-width="1.5"/>
    <!-- Torn edge marks. -->
    <g stroke="#080404" stroke-width="0.7" fill="none">
      <path d="M180,30 L172,38"/>
      <path d="M300,28 L308,36"/>
      <path d="M320,75 L328,80"/>
      <path d="M300,150 L308,160"/>
      <path d="M240,160 L240,170"/>
      <path d="M185,140 L177,150"/>
      <path d="M165,90 L155,90"/>
    </g>
  </g>

  <!-- AMBER OUTSIDE WORLD seen through torn panel. -->
  <g id="p10p2-outside" clip-path="inset(28px 165px 220px 168px)">
    <rect x="165" y="28" width="160" height="135" fill="#3a2818"/>
    <ellipse cx="245" cy="120" rx="120" ry="80" fill="url(#p10p2outsideAmber)" filter="url(#p10p2strongBloom)"/>
  </g>

  <!-- WREN SILHOUETTED in panel opening — upper body framed, soldier-shaped. -->
  <g id="p10p2-wren-silhouette" transform="translate(244, 95)">
    <!-- Body silhouette (dark copper backlit). -->
    <path d="M-22,30 Q-26,5 -22,-15 L-12,-25 L18,-25 Q22,-15 22,30 Z" fill="url(#p10p2copperSilhouette)" stroke="#080404" stroke-width="0.7"/>
    <!-- Hands BRACED on panel edges (script-specific). -->
    <path d="M-22,-10 L-40,-2 L-50,5" fill="none" stroke="#7a3818" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M22,-10 L40,-2 L50,5" fill="none" stroke="#7a3818" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="-50" cy="5" rx="3.5" ry="2.5" fill="#3a1808"/>
    <ellipse cx="50" cy="5" rx="3.5" ry="2.5" fill="#3a1808"/>
    <!-- Head silhouette (back/profile). -->
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#3a1808"/>
    <!-- Bun. -->
    <ellipse cx="-1" cy="-48" rx="9" ry="6" fill="#0a0408"/>
    <!-- Backlit edge highlights (amber from outside catching shoulder rims). -->
    <path d="M-22,-15 L-12,-25 L18,-25 L22,-15" fill="none" stroke="#f5b860" stroke-width="1.4" opacity="0.8" filter="url(#p10p2bloom)"/>
    <!-- Hair backlit edge. -->
    <path d="M-9,-50 Q0,-58 11,-50" fill="none" stroke="#f5b860" stroke-width="0.9" opacity="0.6"/>
  </g>

  <!-- WREN dialogues — large quote split across 2 balloons. -->
  <g id="p10p2-dlg-wren1">
    <rect x="14" y="14" width="150" height="116" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Drive housing</text>
    <text x="24" y="68" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">separated from</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">frame. Power</text>
    <text x="24" y="100" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">distribution</text>
    <text x="24" y="116" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">severed. Comms--</text>
    <path d="M120,130 L140,130 L160,140 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="120" y1="130" x2="140" y2="130" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g id="p10p2-dlg-wren2">
    <rect x="324" y="14" width="150" height="80" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="334" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="334" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Nothing here to</text>
    <text x="334" y="70" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">call anyone with.</text>
    <path d="M334,94 L354,94 L300,140 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="334" y1="94" x2="354" y2="94" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p10p2-meta">
    <text x="478" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="482" y="372" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">DEATH OF A MACHINE</text>
  </g>
</svg>
