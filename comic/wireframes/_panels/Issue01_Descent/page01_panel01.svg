<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 1 — Page 1 — Panel 1: Establishing wide — recon vessel in temporal corridor</title>
  <desc>Full-width establishing shot. Compact angular dark-hulled military recon vessel in profile, predatory-fish silhouette, blue-white seam light, conduit lines on underbelly, moving through a vast prismatic geometric temporal corridor with hexagonal lattice scaffolding stretching to infinity. Slightly low camera angle, 28mm wide. Cool prismatic illumination only — no warm light sources. Caption: "Temporal corridor seven. Inbound to convergence point C-1886." SABLE (from inside): "Final approach in four minutes. Kit check."</desc>

  <defs>
    <!-- Shared balloon drop shadow (dialogue-style.md). -->
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Corridor depth gradient: brighter prismatic energy at the center vanishing point. -->
    <radialGradient id="p1corridorDepth" cx="58%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f0e8ff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#a8c8f5" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#5a78c8" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#2a3a78" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a0e2a" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Top corridor wall: prismatic blue/violet wash. -->
    <linearGradient id="p1corridorTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1842"/>
      <stop offset="50%" stop-color="#3a4a8a"/>
      <stop offset="100%" stop-color="#7a98d8"/>
    </linearGradient>

    <linearGradient id="p1corridorBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1a1842"/>
      <stop offset="50%" stop-color="#3a4a8a"/>
      <stop offset="100%" stop-color="#7a98d8"/>
    </linearGradient>

    <!-- Prismatic shimmer band — chromatic streaks across corridor walls. -->
    <linearGradient id="p1prismShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff80c8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#80c8ff" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#a8ff80" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffe080" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#c880ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#80a8ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ship hull: dark, angular, mirror-reflective. -->
    <linearGradient id="p1shipHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4250"/>
      <stop offset="40%" stop-color="#1a1e26"/>
      <stop offset="70%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <linearGradient id="p1shipReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8c8f5" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#5a78c8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a2842" stop-opacity="0"/>
    </linearGradient>

    <!-- Seam light glow (blue-white running lights). -->
    <radialGradient id="p1seamGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#bfe4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a8ccc" stop-opacity="0"/>
    </radialGradient>

    <filter id="p1bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="p1softBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- ========================================================== -->
  <!-- LAYER: corridor void (deep background)                      -->
  <!-- ========================================================== -->
  <g id="p1-corridor-void">
    <!-- Outer prismatic darkness. -->
    <rect width="742" height="364" fill="#0a0e2a"/>
    <!-- Corridor depth — vanishing point right of center, slightly above midline. -->
    <ellipse cx="430" cy="170" rx="380" ry="220" fill="url(#p1corridorDepth)"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: corridor walls (top + bottom prismatic surfaces)     -->
  <!-- Geometric hexagonal lattice converging to vanishing point.  -->
  <!-- ========================================================== -->
  <g id="p1-corridor-walls">
    <!-- Top wall plane (perspective trapezoid). -->
    <path d="M0,0 L742,0 L520,140 L220,140 Z" fill="url(#p1corridorTop)" opacity="0.85"/>
    <!-- Bottom wall plane. -->
    <path d="M0,364 L742,364 L520,200 L220,200 Z" fill="url(#p1corridorBottom)" opacity="0.85"/>

    <!-- Hexagonal lattice — top wall. Tiles converging in perspective. -->
    <g id="p1-hex-top" stroke="#a8c8f5" stroke-width="0.6" fill="none" opacity="0.55">
      <!-- Row 1 (foreground, large). -->
      <polygon points="40,0 100,0 130,30 100,60 40,60 10,30"/>
      <polygon points="160,0 220,0 250,30 220,60 160,60 130,30"/>
      <polygon points="280,0 340,0 370,30 340,60 280,60 250,30"/>
      <polygon points="400,0 460,0 490,30 460,60 400,60 370,30"/>
      <polygon points="520,0 580,0 610,30 580,60 520,60 490,30"/>
      <polygon points="640,0 700,0 730,30 700,60 640,60 610,30"/>
      <!-- Row 2 (mid, smaller). -->
      <polygon points="100,60 160,60 190,90 160,120 100,120 70,90"/>
      <polygon points="220,60 280,60 310,90 280,120 220,120 190,90"/>
      <polygon points="340,60 400,60 430,90 400,120 340,120 310,90"/>
      <polygon points="460,60 520,60 550,90 520,120 460,120 430,90"/>
      <polygon points="580,60 640,60 670,90 640,120 580,120 550,90"/>
      <!-- Row 3 (smaller, near vanishing point). -->
      <polygon points="240,120 290,120 315,140 290,160 240,160 215,140"/>
      <polygon points="340,120 390,120 415,140 390,160 340,160 315,140"/>
      <polygon points="440,120 490,120 515,140 490,160 440,160 415,140"/>
    </g>

    <!-- Hexagonal lattice — bottom wall. -->
    <g id="p1-hex-bottom" stroke="#a8c8f5" stroke-width="0.6" fill="none" opacity="0.55">
      <polygon points="40,364 100,364 130,334 100,304 40,304 10,334"/>
      <polygon points="160,364 220,364 250,334 220,304 160,304 130,334"/>
      <polygon points="280,364 340,364 370,334 340,304 280,304 250,334"/>
      <polygon points="400,364 460,364 490,334 460,304 400,304 370,334"/>
      <polygon points="520,364 580,364 610,334 580,304 520,304 490,334"/>
      <polygon points="640,364 700,364 730,334 700,304 640,304 610,334"/>
      <polygon points="100,304 160,304 190,274 160,244 100,244 70,274"/>
      <polygon points="220,304 280,304 310,274 280,244 220,244 190,274"/>
      <polygon points="340,304 400,304 430,274 400,244 340,244 310,274"/>
      <polygon points="460,304 520,304 550,274 520,244 460,244 430,274"/>
      <polygon points="580,304 640,304 670,274 640,244 580,244 550,274"/>
      <polygon points="240,244 290,244 315,224 290,204 240,204 215,224"/>
      <polygon points="340,244 390,244 415,224 390,204 340,204 315,224"/>
      <polygon points="440,244 490,244 515,224 490,204 440,204 415,224"/>
    </g>

    <!-- Prismatic shimmer streaks racing along walls. -->
    <rect x="0" y="100" width="742" height="6" fill="url(#p1prismShimmer)" opacity="0.55"/>
    <rect x="0" y="260" width="742" height="6" fill="url(#p1prismShimmer)" opacity="0.55"/>

    <!-- Perspective speed lines converging on vanishing point. -->
    <g stroke="#bfe4ff" stroke-width="0.7" opacity="0.5" fill="none">
      <line x1="0" y1="20" x2="430" y2="170"/>
      <line x1="0" y1="80" x2="430" y2="170"/>
      <line x1="0" y1="180" x2="430" y2="170"/>
      <line x1="0" y1="280" x2="430" y2="170"/>
      <line x1="0" y1="340" x2="430" y2="170"/>
      <line x1="742" y1="60" x2="430" y2="170"/>
      <line x1="742" y1="300" x2="430" y2="170"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: deep-corridor luminescence (vanishing point glow)    -->
  <!-- ========================================================== -->
  <g id="p1-corridor-vanish">
    <ellipse cx="430" cy="170" rx="60" ry="40" fill="#ffffff" opacity="0.85" filter="url(#p1bloom)"/>
    <ellipse cx="430" cy="170" rx="20" ry="14" fill="#ffffff"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: ship (compact angular vessel, predatory-fish profile) -->
  <!-- Positioned mid-foreground, slightly low angle.              -->
  <!-- ========================================================== -->
  <g id="p1-ship" transform="translate(180, 188)">
    <!-- Ship shadow halo on corridor (subtle). -->
    <ellipse cx="120" cy="50" rx="180" ry="14" fill="#000" opacity="0.35" filter="url(#p1bloom)"/>

    <!-- Main hull body — predatory fish silhouette, sharp pointed nose, swept tail. -->
    <path d="M0,40 L20,32 L60,22 L120,16 L180,18 L220,28 L240,42 L235,48 L220,56 L180,62 L120,64 L60,60 L20,52 L5,48 Z" fill="url(#p1shipHull)"/>
    <!-- Top hull highlight (catches corridor light from above). -->
    <path d="M20,32 L60,22 L120,16 L180,18 L220,28 L218,32 L180,22 L120,20 L60,26 L25,36 Z" fill="url(#p1shipReflect)"/>

    <!-- Forward sensor / nose cone. -->
    <path d="M235,40 L260,42 L235,48 Z" fill="#1a1e26"/>
    <path d="M260,42 L268,42 L264,44 L260,44 Z" fill="#3a4a6a"/>

    <!-- Dorsal fin / vertical stabilizer (predatory fish dorsal). -->
    <path d="M120,16 L130,2 L160,0 L170,12 L160,16 Z" fill="url(#p1shipHull)"/>
    <path d="M130,2 L160,0 L170,12 L160,4 L140,4 Z" fill="url(#p1shipReflect)" opacity="0.6"/>

    <!-- Lower fin / belly stabilizer. -->
    <path d="M120,64 L140,76 L170,76 L160,64 Z" fill="url(#p1shipHull)"/>

    <!-- Rear engine pods. -->
    <ellipse cx="10" cy="34" rx="14" ry="8" fill="#1a1e26"/>
    <ellipse cx="10" cy="50" rx="14" ry="8" fill="#1a1e26"/>
    <!-- Engine intake glow (faint blue-white at rear, drive cores). -->
    <circle cx="6" cy="34" r="5" fill="#3a8ccc" opacity="0.7" filter="url(#p1softBloom)"/>
    <circle cx="6" cy="34" r="2.5" fill="#bfe4ff"/>
    <circle cx="6" cy="50" r="5" fill="#3a8ccc" opacity="0.7" filter="url(#p1softBloom)"/>
    <circle cx="6" cy="50" r="2.5" fill="#bfe4ff"/>

    <!-- Hull seam lines — narrow rectangular viewports glowing blue-white. -->
    <g id="p1-ship-viewports" filter="url(#p1softBloom)">
      <rect x="60" y="34" width="14" height="3" fill="#bfe4ff"/>
      <rect x="80" y="34" width="14" height="3" fill="#bfe4ff"/>
      <rect x="100" y="34" width="14" height="3" fill="#bfe4ff"/>
      <rect x="120" y="34" width="14" height="3" fill="#bfe4ff"/>
      <rect x="140" y="36" width="12" height="3" fill="#bfe4ff"/>
      <rect x="158" y="36" width="12" height="3" fill="#bfe4ff"/>
      <rect x="176" y="38" width="10" height="3" fill="#bfe4ff"/>
    </g>

    <!-- Hull plate seams (structural lines). -->
    <line x1="20" y1="40" x2="220" y2="40" stroke="#3a4a6a" stroke-width="0.5" opacity="0.85"/>
    <line x1="60" y1="22" x2="60" y2="60" stroke="#3a4a6a" stroke-width="0.5" opacity="0.7"/>
    <line x1="120" y1="16" x2="120" y2="64" stroke="#3a4a6a" stroke-width="0.5" opacity="0.7"/>
    <line x1="180" y1="18" x2="180" y2="62" stroke="#3a4a6a" stroke-width="0.5" opacity="0.7"/>

    <!-- Underbelly conduit lines (per script: "conduit lines tracing the underbelly"). -->
    <g id="p1-ship-conduits" stroke="#3a8ccc" stroke-width="0.7" fill="none" opacity="0.85">
      <path d="M30,56 Q80,62 160,60 Q200,60 220,54"/>
      <path d="M40,60 Q90,66 160,64 Q200,64 215,58"/>
      <path d="M30,58 L50,60"/>
    </g>
    <!-- Conduit junction glow nodes. -->
    <circle cx="80" cy="60" r="1.5" fill="#bfe4ff"/>
    <circle cx="140" cy="62" r="1.5" fill="#bfe4ff"/>
    <circle cx="195" cy="58" r="1.5" fill="#bfe4ff"/>

    <!-- Running lights at extremities. -->
    <circle cx="0" cy="40" r="2" fill="#bfe4ff" opacity="0.95" filter="url(#p1softBloom)"/>
    <circle cx="240" cy="42" r="1.5" fill="#bfe4ff" opacity="0.95" filter="url(#p1softBloom)"/>
    <circle cx="160" cy="0" r="1.5" fill="#bfe4ff" opacity="0.95" filter="url(#p1softBloom)"/>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: dialogue + caption                                   -->
  <!-- ========================================================== -->
  <g id="p1-dialogue">
    <!-- Caption box (top-left). -->
    <!-- CAPTION — top-left, parchment style. Two-line wrap so text fits. -->
    <rect x="14" y="14" width="430" height="58" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">Temporal corridor seven. Inbound to convergence</text>
    <text x="24" y="68" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">point C-1886.</text>

    <!-- Sable speech-from-ship (broadcast-style, mid-left). -->
    <rect x="14" y="290" width="320" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <!-- Tail pointing toward ship. -->
    <polygon points="100,330 116,330 92,346" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="101" y1="330" x2="115" y2="330" stroke="#ffffff" stroke-width="3"/>
    <text x="22" y="307" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="22" y="321" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">Final approach in four minutes. Kit check.</text>
  </g>

  <!-- ========================================================== -->
  <!-- LAYER: panel metadata badges                                -->
  <!-- ========================================================== -->
  <g id="p1-meta">
    <text x="730" y="20" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#888" opacity="0.7">1</text>
    <text x="734" y="356" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#888" opacity="0.6">EST</text>
  </g>

</svg>
