<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 13 — Panel 1: Luma asks Theodore about fair folk</title>
  <desc>50mm medium wide. Luma center, lenses scrolling data, recording. Theodore's face above through gap. Other squad in BG. Luma: Theodore. When you first saw Jink, you called them 'fair folk.' What does that mean to your people? What do your stories say about beings like us? / Theodore: Oh. Oh, there's ever so much. You really want to know?</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p13p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p13p1floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p13p1theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p13p1lumaSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p13p1sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p13p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p13p1emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <linearGradient id="p13p1copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p13p1gapDay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <radialGradient id="p13p1lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p13p1bg)"/>

  <!-- Top: floorboard with gap showing Theodore -->
  <rect x="0" y="0" width="742" height="60" fill="url(#p13p1floorboard)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="20" x2="742" y2="20"/>
    <line x1="0" y1="44" x2="742" y2="44"/>
  </g>
  <g>
    <rect x="280" y="20" width="184" height="22" fill="url(#p13p1gapDay)"/>
    <rect x="280" y="20" width="184" height="2" fill="#1a0c04"/>
    <rect x="280" y="40" width="184" height="2" fill="#1a0c04"/>
    <ellipse cx="372" cy="30" rx="60" ry="10" fill="url(#p13p1theoSkin)"/>
    <!-- Theodore eyes — eager, leaning in -->
    <ellipse cx="356" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="358" cy="30" r="2" fill="#7a5028"/>
    <circle cx="358" cy="30" r="1" fill="#0a0604"/>
    <ellipse cx="388" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="390" cy="30" r="2" fill="#7a5028"/>
    <circle cx="390" cy="30" r="1" fill="#0a0604"/>
    <!-- Mouth — slightly open, eager -->
    <ellipse cx="372" cy="38" rx="6" ry="2" fill="#a85838"/>
  </g>

  <!-- Brick BG -->
  <rect x="0" y="80" width="60" height="200" fill="#2a1810" opacity="0.7"/>
  <rect x="682" y="80" width="60" height="200" fill="#2a1810" opacity="0.7"/>

  <!-- Beam -->
  <rect x="40" y="280" width="662" height="40" fill="url(#p13p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="40" y1="282" x2="702" y2="282"/>
    <line x1="40" y1="316" x2="702" y2="316"/>
  </g>

  <!-- Squad BG (mostly Sable, Wren, Jink visible at edges) -->
  <g opacity="0.7">
    <g transform="translate(180 282)">
      <ellipse cx="0" cy="0" rx="11" ry="2" fill="#0a0604" opacity="0.5"/>
      <path d="M-6,-32 L-9,-2 L-3,0 L-1,-32 Z" fill="url(#p13p1silver)"/>
      <path d="M1,-32 L3,0 L9,-2 L6,-32 Z" fill="url(#p13p1silver)"/>
      <path d="M-11,-58 L-13,-32 L13,-32 L11,-58 Z" fill="url(#p13p1silver)"/>
      <ellipse cx="0" cy="-70" rx="7" ry="9" fill="#5a3828"/>
      <path d="M-7,-77 Q-7,-81 0,-82 Q7,-81 7,-77" fill="#dad5d0"/>
    </g>
    <g transform="translate(260 282)">
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#0a0604" opacity="0.5"/>
      <path d="M-5,-30 L-8,-2 L-2,0 L0,-30 Z" fill="url(#p13p1copper)"/>
      <path d="M0,-30 L2,0 L8,-2 L5,-30 Z" fill="url(#p13p1copper)"/>
      <path d="M-9,-54 L-11,-30 L11,-30 L9,-54 Z" fill="url(#p13p1copper)"/>
      <ellipse cx="0" cy="-66" rx="6" ry="8" fill="url(#p13p1lumaSkin)"/>
      <ellipse cx="0" cy="-78" rx="4" ry="3" fill="#1a0c04"/>
    </g>
    <g transform="translate(620 282)">
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#0a0604" opacity="0.5"/>
      <path d="M-5,-30 L-8,-2 L-2,0 L0,-30 Z" fill="url(#p13p1emerald)"/>
      <path d="M0,-30 L2,0 L8,-2 L5,-30 Z" fill="url(#p13p1emerald)"/>
      <path d="M-9,-54 L-11,-30 L11,-30 L9,-54 Z" fill="url(#p13p1emerald)"/>
      <ellipse cx="0" cy="-66" rx="6" ry="8" fill="url(#p13p1lumaSkin)"/>
      <g fill="#d8a838">
        <circle cx="-5" cy="-72" r="2"/>
        <circle cx="0" cy="-74" r="2.4"/>
        <circle cx="5" cy="-72" r="2"/>
      </g>
    </g>
  </g>

  <!-- LUMA — center, recording posture -->
  <g transform="translate(420 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p13p1sapphire)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p13p1sapphire)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p13p1sapphire)"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p13p1sapphire)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p13p1sapphire)"/>
    <circle cx="-10" cy="-86" r="1" fill="#a888ff" filter="url(#p13p1bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#a888ff" filter="url(#p13p1bloom)"/>

    <!-- Hand raised holding personal data core (small device for recording) -->
    <path d="M15,-76 Q22,-66 24,-50 L16,-48 Q14,-62 10,-74 Z" fill="url(#p13p1sapphire)"/>
    <ellipse cx="22" cy="-50" rx="3" ry="2" fill="url(#p13p1lumaSkin)"/>
    <!-- Personal data core (small recording device) -->
    <rect x="20" y="-58" width="6" height="6" fill="#3a1a78"/>
    <ellipse cx="23" cy="-55" rx="2" ry="1.4" fill="#a888ff" filter="url(#p13p1bloom)"/>
    <!-- INK STAINS -->
    <ellipse cx="22" cy="-50" rx="1.4" ry="0.7" fill="#1a0838" opacity="0.7"/>
    <!-- Left arm at side -->
    <path d="M-15,-76 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p13p1sapphire)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p13p1lumaSkin)"/>
    <ellipse cx="-15" cy="-44" rx="1.4" ry="0.7" fill="#1a0838" opacity="0.7"/>

    <!-- Head — turned UP toward Theodore -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p13p1lumaSkin)"/>
    <g fill="#1a0c04">
      <path d="M-9,-112 Q-9,-118 0,-120 Q9,-118 9,-112 L7,-106 Q3,-112 -3,-112 Q-7,-112 -9,-106 Z"/>
      <path d="M7,-110 Q14,-94 16,-78" stroke="#1a0c04" stroke-width="2.4" fill="none"/>
    </g>
    <line x1="7" y1="-110" x2="16" y2="-78" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#p13p1bloom)"/>
    <!-- Lenses with halos -->
    <ellipse cx="-3" cy="-104" rx="3" ry="2" fill="url(#p13p1lensGlow)" filter="url(#p13p1bloom)"/>
    <ellipse cx="3" cy="-104" rx="3" ry="2" fill="url(#p13p1lensGlow)" filter="url(#p13p1bloom)"/>
    <ellipse cx="-3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.65" stroke="#7a5ad8" stroke-width="0.4"/>
    <ellipse cx="3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.65" stroke="#7a5ad8" stroke-width="0.4"/>
    <path d="M2,-105 L4,-103" stroke="#3a1a78" stroke-width="0.4"/>
    <!-- Mouth -->
    <ellipse cx="0" cy="-98" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- DIALOGUE — Luma: long question -->
  <g>
    <rect x="14" y="76" width="558" height="58" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M390,76 L394,66 L398,76 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M392,76 L396,76" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Theodore. When you first saw Jink, you called them 'fair folk.'</text>
  <text x="22" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">What does that mean to your people? What do your stories say about beings like us?</text>

  <!-- DIALOGUE — Theodore: Oh. Oh, there's ever so much. You really want to know? -->
  <g>
    <rect x="200" y="160" width="430" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M380,160 L386,150 L390,160 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M384,160 L388,160" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="208" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="208" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">Oh. Oh, there's ever so much. You really want to know?</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
