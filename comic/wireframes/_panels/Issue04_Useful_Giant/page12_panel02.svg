<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 12 — Panel 2: Condition One — tell no one. Theodore acknowledges</title>
  <desc>50mm. Sable delivering condition 1 with raised one finger gesture. Theodore through gap above. Sable: Condition one. You tell no one. Not a friend. Not a relative. No one. / Theodore: I understand.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p12p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p12p2timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p12p2floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p12p2darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p12p2silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p12p2hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="p12p2theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p12p2gapDay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <filter id="p12p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p12p2bg)"/>

  <!-- Top: floorboard with gap showing Theodore -->
  <rect x="0" y="0" width="366" height="60" fill="url(#p12p2floorboard)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="20" x2="366" y2="20"/>
    <line x1="0" y1="44" x2="366" y2="44"/>
  </g>
  <g>
    <rect x="100" y="20" width="166" height="22" fill="url(#p12p2gapDay)"/>
    <rect x="100" y="20" width="166" height="2" fill="#1a0c04"/>
    <rect x="100" y="40" width="166" height="2" fill="#1a0c04"/>
    <ellipse cx="183" cy="30" rx="60" ry="10" fill="url(#p12p2theoSkin)"/>
    <ellipse cx="167" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="169" cy="30" r="2" fill="#7a5028"/>
    <circle cx="169" cy="30" r="1" fill="#0a0604"/>
    <ellipse cx="199" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="201" cy="30" r="2" fill="#7a5028"/>
    <circle cx="201" cy="30" r="1" fill="#0a0604"/>
  </g>

  <!-- Brick walls -->
  <rect x="0" y="60" width="60" height="220" fill="#2a1810" opacity="0.7"/>
  <rect x="306" y="60" width="60" height="220" fill="#2a1810" opacity="0.7"/>

  <!-- Beam -->
  <rect x="40" y="280" width="286" height="44" fill="url(#p12p2timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="40" y1="282" x2="326" y2="282"/>
    <line x1="40" y1="316" x2="326" y2="316"/>
  </g>

  <!-- SABLE — center, RAISING ONE FINGER -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="20" ry="3.5" fill="#0a0604" opacity="0.7"/>
    <path d="M-8,-50 L-12,-2 L-3,0 L-1,-50 Z" fill="url(#p12p2silver)"/>
    <path d="M1,-50 L3,0 L12,-2 L8,-50 Z" fill="url(#p12p2silver)"/>
    <path d="M-14,-86 L-16,-50 L16,-50 L14,-86 Z" fill="url(#p12p2silver)"/>
    <ellipse cx="14" cy="-84" rx="6" ry="4" fill="#3a3038" opacity="0.75"/>
    <path d="M-16,-86 Q-22,-94 -16,-100 L-9,-100 Z" fill="url(#p12p2silver)"/>
    <path d="M16,-86 Q22,-94 16,-100 L9,-100 Z" fill="url(#p12p2silver)"/>
    <circle cx="-10" cy="-94" r="1" fill="#fff8e8" filter="url(#p12p2bloom)"/>
    <circle cx="10" cy="-94" r="1" fill="#fff8e8" filter="url(#p12p2bloom)"/>
    <!-- LEFT arm RAISED with one finger up -->
    <path d="M-16,-86 Q-26,-110 -22,-130 L-14,-132 Q-12,-110 -8,-86 Z" fill="url(#p12p2silver)"/>
    <ellipse cx="-18" cy="-134" rx="3.5" ry="3" fill="url(#p12p2darkSkin)"/>
    <!-- ONE FINGER pointing UP -->
    <path d="M-20,-138 L-20,-156 Q-18,-160 -16,-156 L-16,-138 Z" fill="url(#p12p2darkSkin)"/>
    <!-- Right arm at side -->
    <path d="M16,-78 Q22,-58 16,-46 L10,-50 Q14,-62 10,-76 Z" fill="url(#p12p2silver)"/>
    <ellipse cx="14" cy="-46" rx="2.4" ry="1.4" fill="url(#p12p2darkSkin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-114" rx="11" ry="13" fill="url(#p12p2darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-9,-122 Q-10,-128 0,-130 Q10,-128 9,-122 L7,-117 Q3,-122 -3,-122 Q-7,-122 -9,-117 Z"/>
    </g>
    <ellipse cx="-3" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-114" r="0.6" fill="#0a0604"/>
    <ellipse cx="3" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-114" r="0.6" fill="#0a0604"/>
    <path d="M-7,-118 L-1,-119" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M1,-119 L7,-118" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M-3,-108 L3,-108" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- DIALOGUE — Sable: Condition one. You tell no one. Not a friend. Not a relative. No one. -->
  <g>
    <rect x="14" y="64" width="338" height="58" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,122 L190,122 L182,134 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M182,122 L188,122" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Condition one. You tell no one. Not a friend.</text>
  <text x="22" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Not a relative. <tspan font-weight="700">No one.</tspan></text>

  <!-- DIALOGUE — Theodore: I understand. -->
  <g>
    <rect x="220" y="138" width="132" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,138 L266,128 L272,138 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M264,138 L270,138" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="228" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="228" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">I understand.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,260 Q120,262 240,258 Q300,256 366,260"/>
  </g>
</svg>
