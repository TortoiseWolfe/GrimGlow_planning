<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 17 — Panel 3: Luma's face — the moment of discovery — between awe and dread</title>
  <desc>85mm CU. Tight frame. Luma has turned from the scanner display to the wall. Lenses projecting overlay. Lips parted. Eyes wide. The scientist finding evidence she was not looking for of something that should not exist.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0c1a"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p17p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="50%" stop-color="#a86848"/>
      <stop offset="100%" stop-color="#5a3828"/>
    </linearGradient>
    <linearGradient id="p17p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p17p3coolWashLeft" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a888e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p17p3warmLensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p17p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p17p3bg)"/>

  <!-- Distant brick texture, dim -->
  <g opacity="0.45">
    <rect x="0" y="0" width="366" height="364" fill="#2a1810"/>
    <g stroke="#0a0604" stroke-width="0.4">
      <path d="M0,40 Q120,42 240,38 Q320,36 366,40"/>
      <path d="M0,80 Q120,78 240,82 Q320,84 366,80"/>
      <path d="M0,160 Q120,158 240,162 Q320,164 366,160"/>
      <path d="M0,240 Q120,238 240,242 Q320,244 366,240"/>
      <path d="M0,320 Q120,318 240,322 Q320,324 366,320"/>
    </g>
  </g>

  <!-- Cool wash from left (scanner is left of frame, off-panel) -->
  <rect width="366" height="364" fill="url(#p17p3coolWashLeft)"/>

  <!-- LUMA face — TIGHT FRAME, near 3/4 to camera, looking left toward (off-panel) glyph -->
  <g transform="translate(190 200)">
    <!-- NECK + collar -->
    <path d="M-50,140 L-60,90 L60,90 L50,140 Z" fill="url(#p17p3suit)"/>
    <line x1="-30" y1="100" x2="30" y2="100" stroke="#a888e8" stroke-width="1.6" opacity="0.85" filter="url(#p17p3bloom)"/>
    <line x1="0" y1="90" x2="0" y2="118" stroke="#a888e8" stroke-width="0.9" opacity="0.7"/>

    <!-- HEAD shape -->
    <ellipse cx="0" cy="0" rx="120" ry="148" fill="url(#p17p3skin)"/>
    <!-- Hair top — dark crown -->
    <path d="M-90,-110 Q-70,-160 0,-168 Q70,-160 96,-104 Q96,-90 86,-86 Q60,-130 0,-130 Q-60,-130 -86,-90 Z" fill="#1a0c04"/>
    <!-- BRAID over right shoulder -->
    <path d="M58,86 Q88,140 92,200 Q92,234 84,260" stroke="#1a0c04" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M60,90 Q86,142 90,196" stroke="#3a1c08" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M62,94 Q84,144 86,192" stroke="#5a2c10" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- SAPPHIRE FILAMENT in braid -->
    <path d="M58,86 Q90,140 92,200" stroke="#a888e8" stroke-width="2" fill="none" opacity="0.9" filter="url(#p17p3bloom)"/>
    <circle cx="76" cy="124" r="2" fill="#fff8e8" filter="url(#p17p3bloom)"/>
    <circle cx="88" cy="172" r="2" fill="#fff8e8" filter="url(#p17p3bloom)"/>
    <circle cx="92" cy="216" r="1.6" fill="#fff8e8" filter="url(#p17p3bloom)"/>

    <!-- EYES — WIDE, looking left -->
    <ellipse cx="-44" cy="-16" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="-44" cy="-12" rx="14" ry="11" fill="#3a2010"/>
    <circle cx="-44" cy="-12" r="8" fill="#0a0604"/>
    <!-- Catchlight -->
    <circle cx="-42" cy="-16" r="3" fill="#fff8e8" filter="url(#p17p3bloom)"/>
    <ellipse cx="44" cy="-16" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="44" cy="-12" rx="14" ry="11" fill="#3a2010"/>
    <circle cx="44" cy="-12" r="8" fill="#0a0604"/>
    <circle cx="46" cy="-16" r="3" fill="#fff8e8" filter="url(#p17p3bloom)"/>
    <!-- Brows up + arched (awe) -->
    <path d="M-66,-46 L-22,-52" stroke="#1a0c04" stroke-width="4" stroke-linecap="round"/>
    <path d="M22,-52 L66,-46" stroke="#1a0c04" stroke-width="4" stroke-linecap="round"/>
    <!-- Lower lid lift -->
    <path d="M-58,-4 Q-44,2 -28,-4" fill="none" stroke="#3a2010" stroke-width="1.2"/>
    <path d="M28,-4 Q44,2 60,-4" fill="none" stroke="#3a2010" stroke-width="1.2"/>

    <!-- Nose -->
    <path d="M-8,4 L-4,40 Q0,46 6,44 L10,4 Z" fill="url(#p17p3skin)" opacity="0.85"/>
    <ellipse cx="-2" cy="40" rx="3" ry="1.6" fill="#3a1c08" opacity="0.5"/>
    <ellipse cx="6" cy="40" rx="3" ry="1.6" fill="#3a1c08" opacity="0.5"/>

    <!-- MOUTH — lips parted (the moment before words) -->
    <ellipse cx="0" cy="68" rx="14" ry="6" fill="#3a1808" opacity="0.7"/>
    <path d="M-14,68 L14,68" stroke="#3a1808" stroke-width="1.4"/>
    <path d="M-14,62 Q0,58 14,62" fill="none" stroke="#5a2818" stroke-width="0.9"/>
    <path d="M-14,74 Q0,82 14,74" fill="none" stroke="#5a2818" stroke-width="0.9"/>

    <!-- HOLO LENSES — WARM GOLD overlay, geometric frames around eyes (analysis active) -->
    <g opacity="0.95">
      <ellipse cx="-44" cy="-12" rx="36" ry="32" fill="url(#p17p3warmLensGlow)" filter="url(#p17p3glow)"/>
      <ellipse cx="44" cy="-12" rx="36" ry="32" fill="url(#p17p3warmLensGlow)" filter="url(#p17p3glow)"/>
      <!-- Geometric frame LEFT -->
      <rect x="-72" y="-32" width="56" height="40" rx="2" fill="none" stroke="#ffd078" stroke-width="1.6" filter="url(#p17p3bloom)"/>
      <line x1="-72" y1="-22" x2="-16" y2="-22" stroke="#ffd078" stroke-width="0.8" opacity="0.85"/>
      <line x1="-72" y1="-2" x2="-16" y2="-2" stroke="#ffd078" stroke-width="0.6" opacity="0.7"/>
      <!-- corner ticks -->
      <path d="M-72,-32 L-66,-32 L-72,-26 Z" fill="#ffd078"/>
      <path d="M-16,-32 L-22,-32 L-16,-26 Z" fill="#ffd078"/>
      <!-- CRACK on left lens (her right — canon) -->
      <line x1="-58" y1="-32" x2="-50" y2="-22" stroke="#ffd078" stroke-width="0.8"/>
      <line x1="-50" y1="-22" x2="-54" y2="-8" stroke="#ffd078" stroke-width="0.8"/>
      <line x1="-54" y1="-8" x2="-44" y2="2" stroke="#ffd078" stroke-width="0.6"/>
      <!-- Geometric frame RIGHT -->
      <rect x="16" y="-32" width="56" height="40" rx="2" fill="none" stroke="#ffd078" stroke-width="1.6" filter="url(#p17p3bloom)"/>
      <line x1="16" y1="-22" x2="72" y2="-22" stroke="#ffd078" stroke-width="0.8" opacity="0.85"/>
      <line x1="16" y1="-2" x2="72" y2="-2" stroke="#ffd078" stroke-width="0.6" opacity="0.7"/>
      <path d="M16,-32 L22,-32 L16,-26 Z" fill="#ffd078"/>
      <path d="M72,-32 L66,-32 L72,-26 Z" fill="#ffd078"/>
      <!-- Scrolling data dots / glyph hints -->
      <circle cx="-50" cy="-2" r="0.9" fill="#fff8e8" filter="url(#p17p3bloom)"/>
      <circle cx="-38" cy="-2" r="0.9" fill="#fff8e8" filter="url(#p17p3bloom)"/>
      <circle cx="-26" cy="-2" r="0.9" fill="#fff8e8" filter="url(#p17p3bloom)"/>
      <circle cx="26" cy="-2" r="0.9" fill="#fff8e8" filter="url(#p17p3bloom)"/>
      <circle cx="38" cy="-2" r="0.9" fill="#fff8e8" filter="url(#p17p3bloom)"/>
      <circle cx="50" cy="-2" r="0.9" fill="#fff8e8" filter="url(#p17p3bloom)"/>
    </g>

    <!-- Cool light edge (left side) — washes left cheek -->
    <ellipse cx="-90" cy="0" rx="40" ry="120" fill="#a888e8" opacity="0.18" filter="url(#p17p3glow)"/>
    <!-- Hand drifting up — barely visible at right bottom edge -->
  </g>

  <!-- LUMA whisper "Oh no." -->
  <g>
    <rect x="14" y="14" width="86" height="46" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
    <polygon points="50,60 62,60 54,72" fill="white" stroke="#5a3ad8" stroke-width="0.85" stroke-dasharray="3 2"/>
    <line x1="50.5" y1="60" x2="61.5" y2="60" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1410" font-style="italic">Oh no.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,300 Q90,302 180,298 Q280,296 366,300"/>
  </g>
</svg>
