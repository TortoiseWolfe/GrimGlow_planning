<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 4 — Page 7 — Panel 4: Wren steps in, both of you stop</title>
  <desc>Narrow CU. Wren stepping forward, hand raised slightly to halt the argument. Hair UP messy bun. Calculating but firm — has reached a decision. Copper-gold hologram glow at collar. Wren: Both of you. Stop.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p7p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p7p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="50%" stop-color="#c87533"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <filter id="p7p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="238" height="364" fill="url(#p7p4bg)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="238" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="238" y2="80"/>
    <line x1="0" y1="140" x2="238" y2="140"/>
    <line x1="0" y1="200" x2="238" y2="200"/>
  </g>

  <!-- WREN — MCU stepping forward -->
  <g transform="translate(120 240)">
    <ellipse cx="0" cy="100" rx="20" ry="3" fill="#0a0604" opacity="0.65"/>

    <!-- Body — torso + shoulders -->
    <path d="M-50,100 L-50,40 L50,40 L50,100 Z" fill="url(#p7p4suit)"/>
    <path d="M-50,40 Q-30,18 0,8 Q30,18 50,40 L40,52 L-40,52 Z" fill="url(#p7p4suit)"/>
    <!-- SCORCH MARK on left shoulder -->
    <ellipse cx="-30" cy="20" rx="8" ry="5" fill="#1a0c04" opacity="0.75"/>
    <!-- Hologram glow at collar nodes -->
    <circle cx="-22" cy="46" r="1.6" fill="#ffd888" filter="url(#p7p4bloom)"/>
    <circle cx="22" cy="46" r="1.6" fill="#ffd888" filter="url(#p7p4bloom)"/>
    <line x1="-22" y1="46" x2="22" y2="46" stroke="#ffd888" stroke-width="0.55" opacity="0.7"/>

    <!-- Left arm RAISED slightly (halting gesture) -->
    <path d="M-46,40 Q-58,30 -56,18 L-46,16 Q-42,28 -38,40 Z" fill="url(#p7p4suit)"/>
    <ellipse cx="-58" cy="14" rx="5" ry="3.5" fill="url(#p7p4skin)"/>
    <!-- Open palm gesture -->
    <g fill="url(#p7p4skin)">
      <ellipse cx="-62" cy="8" rx="3" ry="1.6" transform="rotate(-30 -62 8)"/>
      <ellipse cx="-66" cy="14" rx="3" ry="1.6" transform="rotate(-50 -66 14)"/>
      <ellipse cx="-66" cy="20" rx="3" ry="1.6" transform="rotate(-70 -66 20)"/>
    </g>
    <!-- OIL stains -->
    <ellipse cx="-58" cy="14" rx="2.4" ry="1.4" fill="#1a0c04" opacity="0.6"/>

    <!-- Right arm at side -->
    <path d="M50,40 Q58,60 50,90 L42,90 Q44,62 38,40 Z" fill="url(#p7p4suit)"/>
    <ellipse cx="46" cy="92" rx="3" ry="2" fill="url(#p7p4skin)"/>
    <ellipse cx="46" cy="92" rx="2" ry="1.2" fill="#1a0c04" opacity="0.5"/>

    <!-- HEAD — facing front, slight tilt down (commanding stop) -->
    <ellipse cx="-2" cy="-40" rx="36" ry="44" fill="url(#p7p4skin)"/>
    <path d="M-32,-12 Q-28,20 -10,30 L8,30 Q26,20 30,-2 L26,-12 Z" fill="url(#p7p4skin)"/>

    <!-- HAIR — dark with bun on top -->
    <g fill="#1a0c04">
      <path d="M-32,-66 Q-32,-78 -2,-82 Q26,-78 26,-66 L24,-58 Q12,-70 -2,-70 Q-22,-70 -30,-58 Z"/>
      <!-- Bun -->
      <ellipse cx="-4" cy="-90" rx="14" ry="11"/>
      <!-- Strands escaping -->
      <path d="M-26,-66 Q-30,-58 -26,-48" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
      <path d="M22,-66 Q26,-58 22,-48" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
    </g>

    <!-- Brows — drawn down, FIRM -->
    <path d="M-22,-50 L-8,-54" stroke="#1a0c04" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0,-54 L18,-50" stroke="#1a0c04" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Eyes — direct, command authority newly assumed -->
    <ellipse cx="-12" cy="-40" rx="4.5" ry="2.4" fill="#fff8e8"/>
    <ellipse cx="-12" cy="-40" rx="2.6" ry="1.8" fill="#3a2010"/>
    <circle cx="-12" cy="-40" r="1.4" fill="#0a0604"/>
    <ellipse cx="-13" cy="-41" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <ellipse cx="10" cy="-40" rx="4.5" ry="2.4" fill="#fff8e8"/>
    <ellipse cx="10" cy="-40" rx="2.6" ry="1.8" fill="#3a2010"/>
    <circle cx="10" cy="-40" r="1.4" fill="#0a0604"/>
    <ellipse cx="9" cy="-41" rx="0.85" ry="0.55" fill="#fff8e8"/>

    <!-- NOSE -->
    <path d="M-2,-38 L-4,-22 Q-2,-20 2,-22 L0,-38 Z" fill="#a87858" opacity="0.65"/>

    <!-- MOUTH — set, just spoken -->
    <path d="M-8,-12 L8,-12" stroke="#3a1808" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- DIALOGUE — Wren: Both of you. Stop. -->
  <g>
    <rect x="14" y="14" width="186" height="46" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M88,60 L98,60 L90,72 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M90,60 L96,60" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Both of you. Stop.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 238,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 238,300"/>
  </g>
</svg>
