<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 4 — Page 13 — Panel 5: Jink CU delighted by mythology — they're not wrong</title>
  <desc>CU Jink. Big GRIN, vindicated. Catching cradle blue-white in golden curls, emerald glow at suit. Jink: Fairy knights. Wings of light. I mean... they're not wrong.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p13p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <radialGradient id="p13p5hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#f8e088"/>
      <stop offset="60%" stop-color="#d8a838"/>
      <stop offset="100%" stop-color="#a87828"/>
    </radialGradient>
    <linearGradient id="p13p5suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <radialGradient id="p13p5coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="241" height="364" fill="url(#p13p5bg)"/>
  <rect width="241" height="364" fill="url(#p13p5coolWash)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="241" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- JINK CU — DELIGHTED -->
  <g transform="translate(120 240)">
    <!-- Shoulders -->
    <path d="M-70,90 L-70,40 L70,40 L70,90 Z" fill="url(#p13p5suit)"/>
    <path d="M-70,40 Q-50,16 0,8 Q50,16 70,40 L60,52 L-60,52 Z" fill="url(#p13p5suit)"/>
    <path d="M-22,30 Q-2,38 12,28 Q-2,46 -10,50 Z" fill="#3a2818" opacity="0.7"/>
    <line x1="-30" y1="42" x2="-22" y2="38" stroke="#9aff9a" stroke-width="1" opacity="0.85"/>
    <line x1="22" y1="38" x2="30" y2="42" stroke="#9aff9a" stroke-width="1" opacity="0.85"/>
    <circle cx="-22" cy="42" r="2" fill="#d8ffe8" filter="url(#p13p5bloom)"/>
    <circle cx="22" cy="42" r="2" fill="#d8ffe8" filter="url(#p13p5bloom)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-60" rx="38" ry="46" fill="url(#p13p5skin)"/>
    <path d="M-32,-12 Q-28,20 -10,30 L8,30 Q26,20 30,-2 L26,-12 Z" fill="url(#p13p5skin)"/>
    <!-- Wild golden curls catching cradle light from off-frame -->
    <g fill="url(#p13p5hair)">
      <circle cx="-30" cy="-100" r="11"/>
      <circle cx="-12" cy="-110" r="13"/>
      <circle cx="6" cy="-112" r="13"/>
      <circle cx="22" cy="-106" r="11"/>
      <circle cx="32" cy="-92" r="9"/>
      <circle cx="-32" cy="-82" r="9"/>
      <circle cx="-20" cy="-118" r="10"/>
      <circle cx="14" cy="-118" r="10"/>
      <circle cx="-2" cy="-122" r="9"/>
      <!-- Highlights -->
      <ellipse cx="-12" cy="-110" rx="4" ry="2.4" fill="#fff8e8" opacity="0.65"/>
      <ellipse cx="6" cy="-112" rx="4" ry="2.4" fill="#fff8e8" opacity="0.65"/>
      <ellipse cx="-20" cy="-104" rx="3" ry="1.6" fill="#a8c0e0" opacity="0.7"/>
    </g>

    <!-- Brows raised in delight -->
    <path d="M-22,-72 L-6,-78" stroke="#88603a" stroke-width="2" stroke-linecap="round"/>
    <path d="M2,-78 L22,-72" stroke="#88603a" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes — bright, twinkling -->
    <ellipse cx="-12" cy="-62" rx="4.5" ry="3" fill="#fff8e8"/>
    <ellipse cx="-12" cy="-62" rx="2.6" ry="2.2" fill="#1a4830"/>
    <circle cx="-12" cy="-62" r="1.4" fill="#0a0604"/>
    <ellipse cx="-13" cy="-63" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <ellipse cx="12" cy="-62" rx="4.5" ry="3" fill="#fff8e8"/>
    <ellipse cx="12" cy="-62" rx="2.6" ry="2.2" fill="#1a4830"/>
    <circle cx="12" cy="-62" r="1.4" fill="#0a0604"/>
    <ellipse cx="11" cy="-63" rx="0.85" ry="0.55" fill="#fff8e8"/>

    <!-- NOSE -->
    <path d="M0,-58 L-3,-44 Q0,-42 3,-44 L0,-58 Z" fill="#7a4830" opacity="0.65"/>

    <!-- MOUTH — BIG GRIN -->
    <path d="M-12,-30 Q0,-20 12,-30" fill="#5a2818"/>
    <path d="M-12,-30 Q0,-22 12,-30" stroke="#3a1808" stroke-width="1" fill="none"/>
    <path d="M-12,-30 Q0,-26 12,-30" stroke="#fff8e8" stroke-width="1" fill="none"/>

    <!-- Cheekbones lifted -->
    <path d="M-30,-32 Q-26,-22 -16,-18" fill="none" stroke="#7a4830" stroke-width="0.5" opacity="0.55"/>
    <path d="M30,-32 Q26,-22 16,-18" fill="none" stroke="#7a4830" stroke-width="0.5" opacity="0.55"/>
  </g>

  <!-- DIALOGUE — Jink: Fairy knights. Wings of light. I mean... they're not wrong. -->
  <g>
    <rect x="14" y="14" width="216" height="58" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,72 L130,72 L122,84 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M122,72 L128,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Fairy knights. Wings of light. I mean...</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#1a1a1a">they're not wrong.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 241,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 241,300"/>
  </g>
</svg>
