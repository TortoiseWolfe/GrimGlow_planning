<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 19 — Panel 1: Luma returns to camp through perimeter — full squad present — the lie that no one questions</title>
  <desc>28mm medium wide. Luma crosses the holographic perimeter line back into camp warmth. Wren works on cradle modifications. Jink perched on beam tossing screw. Sable arms-crossed at gap watching evening. Thresh at post. Wall gap shows empty street. The camp continues.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="p19p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p19p1cradleBrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p19p1lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <linearGradient id="p19p1wrenSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p19p1jinkSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a8848"/>
    </linearGradient>
    <linearGradient id="p19p1sableSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p19p1threshSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <radialGradient id="p19p1amberHearth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffaa48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p1gapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p19p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p19p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p19p1bg)"/>

  <!-- Wall-cavity ceiling (timber joists hint) -->
  <g fill="#3a2818">
    <rect x="0" y="0" width="742" height="40" opacity="0.85"/>
  </g>
  <g stroke="#1a0c04" stroke-width="1.4" opacity="0.5">
    <line x1="180" y1="0" x2="180" y2="40"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="580" y1="0" x2="580" y2="40"/>
  </g>

  <!-- Lath-and-plaster wall (left) -->
  <rect x="0" y="40" width="80" height="290" fill="#5a4838"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="60" x2="80" y2="60"/>
    <line x1="0" y1="80" x2="80" y2="80"/>
    <line x1="0" y1="100" x2="80" y2="100"/>
    <line x1="0" y1="120" x2="80" y2="120"/>
    <line x1="0" y1="140" x2="80" y2="140"/>
    <line x1="0" y1="160" x2="80" y2="160"/>
    <line x1="0" y1="180" x2="80" y2="180"/>
    <line x1="0" y1="200" x2="80" y2="200"/>
    <line x1="0" y1="220" x2="80" y2="220"/>
    <line x1="0" y1="240" x2="80" y2="240"/>
    <line x1="0" y1="260" x2="80" y2="260"/>
    <line x1="0" y1="280" x2="80" y2="280"/>
    <line x1="0" y1="300" x2="80" y2="300"/>
    <line x1="0" y1="320" x2="80" y2="320"/>
  </g>

  <!-- Brick wall (right) — with WALL GAP showing fading street outside -->
  <rect x="620" y="40" width="122" height="290" fill="#5a2818"/>
  <g stroke="#0a0604" stroke-width="0.5" opacity="0.6">
    <path d="M620,80 Q680,82 742,78"/>
    <path d="M620,120 Q680,118 742,122"/>
    <path d="M620,160 Q680,162 742,158"/>
    <path d="M620,200 Q680,198 742,202"/>
    <path d="M620,240 Q680,242 742,238"/>
    <path d="M620,280 Q680,278 742,282"/>
    <path d="M620,320 Q680,322 742,318"/>
  </g>
  <!-- WALL GAP -->
  <rect x="660" y="160" width="50" height="62" fill="#0a0604"/>
  <ellipse cx="685" cy="190" rx="34" ry="42" fill="url(#p19p1gapGlow)" filter="url(#p19p1bloom)"/>
  <ellipse cx="685" cy="190" rx="14" ry="20" fill="#ffaa48" opacity="0.45" filter="url(#p19p1bloom)"/>

  <!-- Floor — timber joist -->
  <rect x="80" y="290" width="540" height="40" fill="url(#p19p1floor)"/>
  <g stroke="#0a0604" stroke-width="0.4" opacity="0.55">
    <line x1="180" y1="290" x2="180" y2="330"/>
    <line x1="380" y1="290" x2="380" y2="330"/>
    <line x1="580" y1="290" x2="580" y2="330"/>
  </g>

  <!-- Holographic perimeter LINE — Luma is just crossing it -->
  <line x1="180" y1="290" x2="180" y2="40" stroke="#a8c0ff" stroke-width="0.7" opacity="0.55" filter="url(#p19p1bloom)" stroke-dasharray="2 1.5"/>
  <!-- emitter base on floor -->
  <rect x="178" y="288" width="4" height="3" fill="#3a4868"/>
  <circle cx="180" cy="288" r="1.4" fill="#88aaff" filter="url(#p19p1bloom)"/>

  <!-- Power cell on timber ledge — back-left -->
  <g transform="translate(120 130)">
    <rect x="-8" y="-8" width="16" height="16" rx="1.5" fill="#3a2068" stroke="#a888e8" stroke-width="0.6"/>
    <rect x="-6" y="-6" width="12" height="12" fill="#ffaa48" filter="url(#p19p1bloom)" opacity="0.85"/>
    <rect x="-7" y="14" width="14" height="3" fill="#3a2818"/>
    <ellipse cx="0" cy="-2" rx="20" ry="20" fill="url(#p19p1amberHearth)" filter="url(#p19p1glow)" opacity="0.7"/>
  </g>

  <!-- Cradle — middle area, Wren is working on it -->
  <g transform="translate(280 270)">
    <rect x="-22" y="-14" width="44" height="26" fill="#3a2818" rx="1"/>
    <!-- brass strips -->
    <path d="M-22,-14 L-18,-30 L18,-30 L22,-14" fill="none" stroke="url(#p19p1cradleBrass)" stroke-width="2.4"/>
    <!-- copper coils -->
    <ellipse cx="0" cy="-12" rx="14" ry="6" fill="none" stroke="#c87838" stroke-width="0.8"/>
    <ellipse cx="0" cy="-8" rx="14" ry="6" fill="none" stroke="#c87838" stroke-width="0.8"/>
    <ellipse cx="0" cy="-4" rx="14" ry="6" fill="none" stroke="#c87838" stroke-width="0.8"/>
    <!-- cell glowing inside -->
    <rect x="-6" y="-12" width="12" height="14" rx="0.6" fill="#ffd078" opacity="0.85" filter="url(#p19p1bloom)"/>
    <ellipse cx="0" cy="-6" rx="22" ry="12" fill="url(#p19p1amberHearth)" filter="url(#p19p1glow)" opacity="0.6"/>
  </g>

  <!-- WREN — at cradle, hair-up bun, oil-stained, scorch-mark left shoulder -->
  <g transform="translate(245 250)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="20" width="4" height="20" fill="url(#p19p1wrenSuit)"/>
    <rect x="1" y="20" width="4" height="20" fill="url(#p19p1wrenSuit)"/>
    <ellipse cx="-3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <path d="M-7,20 L-7,-12 L7,-12 L7,20 Z" fill="url(#p19p1wrenSuit)"/>
    <line x1="-5" y1="-6" x2="5" y2="-6" stroke="#ffd078" stroke-width="0.7" opacity="0.85" filter="url(#p19p1bloom)"/>
    <!-- scorch mark left shoulder -->
    <ellipse cx="-7" cy="-12" rx="3.5" ry="2.4" fill="#1a0c04" opacity="0.85"/>
    <!-- arms reaching down to cradle -->
    <path d="M-7,-12 L-12,4 L-8,16 L-4,12 L-9,2 L-3,-8 Z" fill="url(#p19p1wrenSuit)"/>
    <path d="M7,-12 L12,4 L18,12 L22,8 L14,2 L3,-8 Z" fill="url(#p19p1wrenSuit)"/>
    <!-- forearms oil-stained -->
    <ellipse cx="-9" cy="6" rx="2" ry="3" fill="#1a0c04" opacity="0.6"/>
    <ellipse cx="14" cy="6" rx="2" ry="3" fill="#1a0c04" opacity="0.6"/>
    <ellipse cx="0" cy="-20" rx="6" ry="8" fill="#a86838"/>
    <!-- bun (top knot) -->
    <ellipse cx="0" cy="-30" rx="3" ry="2.4" fill="#0a0604"/>
    <ellipse cx="0" cy="-32" rx="2" ry="1.6" fill="#1a0c04"/>
    <!-- wisps -->
    <path d="M-5,-22 Q-7,-18 -6,-14" stroke="#0a0604" stroke-width="0.6" fill="none" opacity="0.7"/>
    <path d="M5,-22 Q7,-18 6,-14" stroke="#0a0604" stroke-width="0.6" fill="none" opacity="0.7"/>
    <!-- profile features -->
    <ellipse cx="-2" cy="-22" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.5" fill="#0a0604"/>
    <ellipse cx="3" cy="-22" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="3" cy="-22" r="0.5" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.6"/>
  </g>

  <!-- JINK perched on a high beam — left, tossing a screw -->
  <g transform="translate(140 110)">
    <!-- beam -->
    <rect x="-30" y="14" width="60" height="6" fill="#3a2818"/>
    <!-- Jink seated -->
    <ellipse cx="-4" cy="6" rx="2.6" ry="2" fill="url(#p19p1jinkSuit)"/>
    <ellipse cx="4" cy="6" rx="2.6" ry="2" fill="url(#p19p1jinkSuit)"/>
    <!-- legs dangling -->
    <rect x="-5" y="6" width="4" height="14" fill="url(#p19p1jinkSuit)"/>
    <rect x="1" y="6" width="4" height="14" fill="url(#p19p1jinkSuit)"/>
    <!-- torso bent forward -->
    <path d="M-7,-14 L-7,8 L7,8 L7,-14 Z" fill="url(#p19p1jinkSuit)"/>
    <!-- soot streak on chest -->
    <ellipse cx="0" cy="-2" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>
    <!-- arm extended up tossing screw -->
    <path d="M7,-14 L12,-22 L14,-26 L11,-20 L7,-12 Z" fill="url(#p19p1jinkSuit)"/>
    <!-- screw mid-air -->
    <circle cx="14" cy="-32" r="0.9" fill="#888"/>
    <!-- arc trail -->
    <path d="M11,-26 Q14,-32 17,-26" stroke="#888" stroke-width="0.3" fill="none" opacity="0.45" stroke-dasharray="1 1"/>
    <!-- left arm casual -->
    <rect x="-12" y="-14" width="4" height="18" fill="url(#p19p1jinkSuit)"/>
    <!-- head -->
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#d8a878"/>
    <!-- golden curls -->
    <path d="M-5,-30 Q-3,-34 0,-34 Q3,-34 5,-30 L5,-26 Q2,-30 0,-30 Q-2,-30 -5,-26 Z" fill="#ffd078"/>
    <circle cx="-3" cy="-32" r="1.3" fill="#ffd078"/>
    <circle cx="3" cy="-30" r="1.5" fill="#ffd078"/>
    <!-- profile -->
    <ellipse cx="2" cy="-22" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.5" fill="#0a0604"/>
    <path d="M0,-15 L4,-15" stroke="#3a1808" stroke-width="0.5"/>
    <!-- Wing pack, not deployed -->
    <path d="M-6,-12 L-9,-2 L-7,2 L-5,-2 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="-7" y1="-8" x2="-7" y2="0" stroke="#2ed078" stroke-width="0.4" opacity="0.7" filter="url(#p19p1bloom)"/>
  </g>

  <!-- SABLE — right of perimeter, near wall gap, arms crossed, watching evening -->
  <g transform="translate(540 250)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="20" width="4" height="20" fill="url(#p19p1sableSuit)"/>
    <rect x="1" y="20" width="4" height="20" fill="url(#p19p1sableSuit)"/>
    <ellipse cx="-3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <path d="M-8,20 L-8,-12 L8,-12 L8,20 Z" fill="url(#p19p1sableSuit)"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#a8c0ff" stroke-width="0.7" opacity="0.85" filter="url(#p19p1bloom)"/>
    <!-- soot bloom right shoulder -->
    <ellipse cx="8" cy="-12" rx="3.5" ry="2.4" fill="#3a3038" opacity="0.85"/>
    <!-- ARMS CROSSED -->
    <path d="M-8,-12 L-14,-2 L-2,4 L8,-4 L8,-12 Z" fill="url(#p19p1sableSuit)"/>
    <path d="M8,-12 L14,-2 L2,4 L-8,-4 L-8,-12 Z" fill="url(#p19p1sableSuit)" opacity="0.92"/>
    <ellipse cx="0" cy="-22" rx="5.5" ry="7" fill="#7a4838"/>
    <!-- silver-buzz hair top -->
    <path d="M-5,-30 Q-4,-32 0,-32 Q4,-32 5,-30 L5,-26 Q2,-29 0,-29 Q-2,-29 -5,-26 Z" fill="#e0d8d0"/>
    <ellipse cx="-2" cy="-22" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.5" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.6"/>
  </g>

  <!-- THRESH — at post on far right -->
  <g transform="translate(595 240)">
    <ellipse cx="-3" cy="50" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="50" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="28" width="4" height="22" fill="url(#p19p1threshSuit)"/>
    <rect x="1" y="28" width="4" height="22" fill="url(#p19p1threshSuit)"/>
    <!-- leg scuffs -->
    <ellipse cx="-3" cy="42" rx="2" ry="1" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="3" cy="42" rx="2" ry="1" fill="#1a0c04" opacity="0.7"/>
    <path d="M-9,28 L-9,-2 L9,-2 L9,28 Z" fill="url(#p19p1threshSuit)"/>
    <!-- dented LEFT pauldron -->
    <ellipse cx="-9" cy="-2" rx="4" ry="3" fill="#5a0818"/>
    <ellipse cx="-10" cy="-1" rx="2" ry="1.4" fill="#3a0818"/>
    <!-- arms -->
    <rect x="-13" y="-2" width="4" height="22" fill="url(#p19p1threshSuit)"/>
    <rect x="9" y="-2" width="4" height="22" fill="url(#p19p1threshSuit)"/>
    <!-- rifle white-knuckle grip -->
    <rect x="9" y="6" width="14" height="2" fill="#3a3030"/>
    <rect x="22" y="5" width="3" height="4" fill="#1a1a1a"/>
    <ellipse cx="12" cy="7" rx="2" ry="1.4" fill="#fff8e8" opacity="0.8"/>
    <ellipse cx="0" cy="-12" rx="6" ry="7" fill="#a86838"/>
    <!-- copper-red buzz cut -->
    <path d="M-5,-19 Q-4,-21 0,-21 Q4,-21 5,-19 L4,-15 Q2,-18 0,-18 Q-2,-18 -4,-15 Z" fill="#c84838"/>
    <ellipse cx="-2" cy="-12" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="-2" cy="-12" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-12" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="2" cy="-12" r="0.5" fill="#0a0604"/>
    <path d="M-3,-5 L3,-5" stroke="#3a1808" stroke-width="0.6"/>
  </g>

  <!-- LUMA — center-left, just crossing the perimeter — composed -->
  <g transform="translate(220 250)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="20" width="4" height="20" fill="url(#p19p1lumaSuit)"/>
    <rect x="1" y="20" width="4" height="20" fill="url(#p19p1lumaSuit)"/>
    <ellipse cx="-3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <!-- TORSO — slightly too rigid (script directs) -->
    <path d="M-7,20 L-7,-12 L7,-12 L7,20 Z" fill="url(#p19p1lumaSuit)"/>
    <line x1="-5" y1="-6" x2="5" y2="-6" stroke="#a888e8" stroke-width="0.7" opacity="0.85" filter="url(#p19p1bloom)"/>
    <!-- Arms tight at sides — controlled -->
    <rect x="-11" y="-12" width="4" height="22" fill="url(#p19p1lumaSuit)"/>
    <rect x="7" y="-12" width="4" height="22" fill="url(#p19p1lumaSuit)"/>
    <ellipse cx="-9" cy="12" rx="2.4" ry="1.6" fill="#5a3828"/>
    <ellipse cx="9" cy="12" rx="2.4" ry="1.6" fill="#5a3828"/>
    <!-- head -->
    <ellipse cx="0" cy="-22" rx="5.5" ry="7" fill="#7a4838"/>
    <path d="M-5,-30 Q-4,-32 0,-32 Q4,-32 5,-30 L5,-26 Q2,-29 0,-29 Q-2,-29 -5,-26 Z" fill="#0a0604"/>
    <!-- BRAID -->
    <path d="M5,-18 Q9,-2 10,18" stroke="#0a0604" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M5,-18 Q9,-2 10,18" stroke="#a888e8" stroke-width="0.5" fill="none" opacity="0.85" filter="url(#p19p1bloom)"/>
    <ellipse cx="-2" cy="-22" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.5" fill="#0a0604"/>
    <!-- cracked right lens (her right) -->
    <line x1="-3" y1="-25" x2="-1" y2="-21" stroke="#ffd078" stroke-width="0.4"/>
    <!-- Mouth — neutral, slightly tight -->
    <path d="M-3,-14 L3,-14" stroke="#3a1808" stroke-width="0.6"/>
  </g>

  <!-- WREN dialogue (top) — without looking up -->
  <g>
    <rect x="14" y="14" width="138" height="38" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="240,52 252,52 244,62" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="240.5" y1="52" x2="251.5" y2="52" stroke="white" stroke-width="1.5"/>
    <line x1="152" y1="32" x2="240" y2="52" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="152" y1="32" x2="240" y2="52" stroke="white" stroke-width="0.45"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN (without looking up)</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Wall survey?</text>

  <!-- LUMA dialogue — the lie -->
  <g>
    <rect x="180" y="80" width="280" height="36" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="220,116 232,116 224,126" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="220.5" y1="116" x2="231.5" y2="116" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="188" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="188" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Structural assessment complete. Nothing of concern.</text>

  <!-- WREN second beat (bottom-left) -->
  <g>
    <rect x="14" y="146" width="346" height="36" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="220,182 232,182 224,192" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="220.5" y1="182" x2="231.5" y2="182" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Good. I need the east section clear for a secondary cache.</text>

  <!-- LUMA reply (bottom-right) -->
  <g>
