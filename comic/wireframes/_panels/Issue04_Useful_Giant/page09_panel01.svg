<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 249" width="742" height="249">
  <title>Issue 4 — Page 9 — Panel 1: THE AUDITION — cradle from below at fairy scale, monumental</title>
  <desc>28mm widescreen wide. Fairy POV from inside camp looking UP at gap. Theodore's enormous hands hold charging cradle above gap, tilted so squad can see. Cradle monumental from below — brass scaffolding, copper cables, glowing power cell-orb-the-size-of-a-person. Power cell glow is dominant light source — pours down through gap painting camp interior. Fairy light from human hands. Wren: That's a Type-4 cell. / It's at eighty percent charge. / Luma: How—</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p9p1floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p9p1skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p9p1brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="50%" stop-color="#c89858"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="p9p1copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a868"/>
      <stop offset="100%" stop-color="#5a3010"/>
    </linearGradient>
    <radialGradient id="p9p1cellGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e8f0ff" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p9p1cellCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a8c0e0"/>
      <stop offset="70%" stop-color="#c0a8e0"/>
      <stop offset="100%" stop-color="#5a4878"/>
    </linearGradient>
    <radialGradient id="p9p1downwash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p1bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p9p1glow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="742" height="249" fill="url(#p9p1bg)"/>

  <!-- COOL DOWNWASH (light from cradle pouring down through gap onto camp) -->
  <rect width="742" height="249" fill="url(#p9p1downwash)"/>

  <!-- FLOORBOARD edges framing gap (top of frame) -->
  <rect x="0" y="0" width="180" height="50" fill="url(#p9p1floorboard)"/>
  <rect x="562" y="0" width="180" height="50" fill="url(#p9p1floorboard)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="44" x2="180" y2="44"/>
    <line x1="562" y1="44" x2="742" y2="44"/>
  </g>

  <!-- THE GAP shape (visible top center) — light pours through -->
  <rect x="180" y="0" width="382" height="44" fill="#a89888"/>
  <rect x="180" y="0" width="382" height="2" fill="#1a0c04"/>

  <!-- THEODORE'S ENORMOUS HANDS framing the cradle (above gap, holding it down through) -->
  <!-- Hands enter from edges of gap -->
  <g>
    <!-- Left hand fingers from gap left edge -->
    <path d="M180,2 L260,4 L262,28 L210,32 Z" fill="url(#p9p1skin)"/>
    <ellipse cx="220" cy="22" rx="22" ry="6" fill="url(#p9p1skin)"/>
    <ellipse cx="240" cy="20" rx="20" ry="5" fill="url(#p9p1skin)"/>
    <!-- Right hand fingers -->
    <path d="M482,4 L562,2 L552,28 L492,32 Z" fill="url(#p9p1skin)"/>
    <ellipse cx="500" cy="22" rx="22" ry="6" fill="url(#p9p1skin)"/>
    <ellipse cx="520" cy="20" rx="20" ry="5" fill="url(#p9p1skin)"/>
    <!-- Brass gear ring on left index -->
    <ellipse cx="232" cy="20" rx="3" ry="2" fill="#c89858" stroke="#7a5028" stroke-width="0.5"/>
    <!-- Oil stains -->
    <ellipse cx="220" cy="22" rx="6" ry="1.6" fill="#1a0c04" opacity="0.5"/>
    <ellipse cx="510" cy="22" rx="6" ry="1.6" fill="#1a0c04" opacity="0.5"/>
  </g>

  <!-- ===== THE CRADLE — MONUMENTAL from below ===== -->
  <g transform="translate(371 130)">
    <!-- MASSIVE bright halo (cradle's light dominates) -->
    <ellipse cx="0" cy="0" rx="280" ry="120" fill="url(#p9p1cellGlow)" filter="url(#p9p1glow)" opacity="0.85"/>

    <!-- BRASS FRAMEWORK — like industrial scaffolding from this scale -->
    <g>
      <!-- Outer cradle curve (large) -->
      <path d="M-100,40 Q-110,60 -80,80 L80,80 Q110,60 100,40" fill="none" stroke="url(#p9p1brass)" stroke-width="9" stroke-linecap="round"/>
      <!-- Vertical struts -->
      <path d="M-100,-20 Q-104,12 -100,40" fill="none" stroke="url(#p9p1brass)" stroke-width="8"/>
      <path d="M100,-20 Q104,12 100,40" fill="none" stroke="url(#p9p1brass)" stroke-width="8"/>
      <!-- Diagonal cross supports -->
      <path d="M-90,-18 L-30,40" fill="none" stroke="url(#p9p1brass)" stroke-width="6"/>
      <path d="M90,-18 L30,40" fill="none" stroke="url(#p9p1brass)" stroke-width="6"/>
      <path d="M-60,-10 L0,40" fill="none" stroke="url(#p9p1brass)" stroke-width="5"/>
      <path d="M60,-10 L0,40" fill="none" stroke="url(#p9p1brass)" stroke-width="5"/>
      <!-- Solder/welding joints -->
      <circle cx="-100" cy="40" r="6" fill="#a86828"/>
      <circle cx="100" cy="40" r="6" fill="#a86828"/>
      <circle cx="-90" cy="-18" r="4" fill="#a86828"/>
      <circle cx="90" cy="-18" r="4" fill="#a86828"/>
      <!-- Brass rivets along curves -->
      <circle cx="-50" cy="74" r="2" fill="#7a5028"/>
      <circle cx="50" cy="74" r="2" fill="#7a5028"/>
    </g>

    <!-- COPPER WIRE COILS — wound around brass, much larger at this scale -->
    <g stroke="url(#p9p1copper)" stroke-width="3.5" fill="none">
      <path d="M-100,-10 Q-70,-18 -40,-14 Q0,-10 40,-14 Q70,-18 100,-10"/>
      <path d="M-104,4 Q-72,-2 -40,2 Q0,6 40,2 Q72,-2 104,4"/>
      <path d="M-104,18 Q-72,12 -40,16 Q0,20 40,16 Q72,12 104,18"/>
      <path d="M-100,32 Q-70,26 -40,30 Q0,34 40,30 Q70,26 100,32"/>
      <path d="M-94,46 Q-66,40 -40,44 Q0,48 40,44 Q66,40 94,46"/>
    </g>

    <!-- CENTRAL POWER CELL — orb the size of a person -->
    <g>
      <!-- Inner halo -->
      <ellipse cx="0" cy="6" rx="80" ry="48" fill="#ffffff" opacity="0.95" filter="url(#p9p1bloom)"/>
      <!-- Crystal facets -->
      <path d="M-44,-12 L-8,-44 L36,-32 L48,12 L24,48 L-24,52 L-54,24 Z"
            fill="url(#p9p1cellCore)" stroke="#5a4878" stroke-width="1.5"/>
      <!-- Internal facets -->
      <g opacity="0.9" stroke="#fff8e8" stroke-width="1.4" fill="none">
        <path d="M-36,-6 L0,-30 L30,-12"/>
        <path d="M-24,12 L12,24"/>
        <path d="M-30,30 L0,6 L24,24"/>
        <path d="M-6,-24 L-6,36"/>
      </g>
      <!-- Bright core -->
      <ellipse cx="0" cy="6" rx="20" ry="10" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="-6" cy="0" rx="8" ry="4" fill="#ffffff"/>
      <!-- Geometric pattern moving inside (overlay) -->
      <g opacity="0.8" stroke="#a8c0e0" stroke-width="0.85" fill="none">
        <path d="M-30,-6 L0,-24 L30,-6 L0,18 Z"/>
        <path d="M-15,3 L0,-6 L15,3 L0,12 Z"/>
      </g>
    </g>

    <!-- Wires extending from cradle to off-frame -->
    <path d="M-100,40 Q-130,60 -160,68" fill="none" stroke="url(#p9p1copper)" stroke-width="2"/>
    <path d="M100,40 Q130,60 160,68" fill="none" stroke="url(#p9p1copper)" stroke-width="2"/>
  </g>

  <!-- 5 SQUAD SILHOUETTES below in shadow (looking up, only outlines visible against rim light) -->
  <g opacity="0.75">
    <!-- Far-bottom silhouettes are beyond visible frame; show partial heads/shoulders -->
    <g transform="translate(120 240)">
      <ellipse cx="0" cy="-10" rx="8" ry="9" fill="#a85a48"/>
      <path d="M-8,-2 L-10,10 L10,10 L8,-2 Z" fill="#a83040"/>
    </g>
    <g transform="translate(240 240)">
      <ellipse cx="0" cy="-10" rx="7" ry="8" fill="#a87858"/>
      <path d="M-7,-2 L-9,10 L9,10 L7,-2 Z" fill="#c87a35"/>
    </g>
    <g transform="translate(371 240)">
      <ellipse cx="0" cy="-10" rx="8" ry="9" fill="#9a9098"/>
      <path d="M-8,-2 L-10,10 L10,10 L8,-2 Z" fill="#bab8c0"/>
    </g>
    <g transform="translate(490 240)">
      <ellipse cx="0" cy="-10" rx="7" ry="8" fill="#a87858"/>
      <path d="M-7,-2 L-9,10 L9,10 L7,-2 Z" fill="#5a3ad8"/>
    </g>
    <g transform="translate(610 240)">
      <ellipse cx="0" cy="-10" rx="7" ry="8" fill="#a87858"/>
      <path d="M-7,-2 L-9,10 L9,10 L7,-2 Z" fill="#2e8b57"/>
    </g>
  </g>

  <!-- DIALOGUE — Wren: That's a Type-4 cell. -->
  <g>
    <rect x="14" y="14" width="158" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M14,40 L4,50 L14,40 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M10,46 L18,40" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">That's a Type-4 cell.</text>

  <!-- DIALOGUE — Wren: It's at eighty percent charge. -->
  <g>
    <rect x="552" y="74" width="182" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M620,118 L630,118 L622,130 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M622,118 L628,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="560" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="560" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">It's at <tspan font-weight="700">eighty percent</tspan> charge.</text>

  <!-- DIALOGUE — Luma: How— -->
  <g>
    <rect x="14" y="200" width="86" height="40" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M30,240 L40,240 L32,250 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M32,240 L38,240" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">How—</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,180 Q200,182 400,178 Q580,176 742,180"/>
  </g>
</svg>
