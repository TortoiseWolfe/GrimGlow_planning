<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 20 — Panel 3: Theodore looks up at the first stars — dual light, the act of looking up changed forever</title>
  <desc>50mm medium. Theodore at street corner, head up. First stars through chimney smoke. Breath fogs. One hand raised unconsciously, brass gear ring catching gaslight. Upturned face in dual light: warm amber from below, cool starlight from above. The boy who knows what falling stars can be.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p20p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="60%" stop-color="#3a2858"/>
      <stop offset="100%" stop-color="#5a3858"/>
    </linearGradient>
    <linearGradient id="p20p3roofline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p20p3theoSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p20p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#6a3828"/>
    </linearGradient>
    <radialGradient id="p20p3lampPool" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p20p3glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <!-- DARKENING SKY — first stars -->
  <rect width="366" height="220" fill="url(#p20p3sky)"/>

  <!-- Stars — pale, faint, just emerging through dusk + chimney smoke -->
  <g fill="#fff8e8" filter="url(#p20p3bloom)">
    <circle cx="60" cy="40" r="0.8" opacity="0.85"/>
    <circle cx="140" cy="20" r="0.7" opacity="0.7"/>
    <circle cx="220" cy="50" r="0.9" opacity="0.85"/>
    <circle cx="300" cy="30" r="0.6" opacity="0.6"/>
    <circle cx="80" cy="70" r="0.6" opacity="0.55"/>
    <circle cx="180" cy="60" r="0.8" opacity="0.75"/>
    <circle cx="260" cy="80" r="0.7" opacity="0.65"/>
    <circle cx="40" cy="100" r="0.6" opacity="0.5"/>
    <circle cx="320" cy="90" r="0.85" opacity="0.8"/>
    <circle cx="120" cy="100" r="0.5" opacity="0.45"/>
    <circle cx="240" cy="120" r="0.7" opacity="0.65"/>
    <circle cx="200" cy="140" r="0.5" opacity="0.4"/>
    <circle cx="60" cy="150" r="0.55" opacity="0.45"/>
  </g>

  <!-- Thin star with subtle radiating shimmer -->
  <g fill="#fff8e8" opacity="0.85" filter="url(#p20p3bloom)">
    <circle cx="160" cy="36" r="1.4"/>
    <line x1="158" y1="36" x2="162" y2="36" stroke="#fff8e8" stroke-width="0.4" opacity="0.5"/>
    <line x1="160" y1="34" x2="160" y2="38" stroke="#fff8e8" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- ROOFLINE silhouettes -->
  <g fill="url(#p20p3roofline)">
    <path d="M0,180 L0,220 L60,220 L60,160 L100,160 L100,140 L140,140 L140,180 L200,180 L200,150 L250,150 L250,170 L290,170 L290,130 L330,130 L330,160 L366,160 L366,220 Z"/>
  </g>
  <!-- Chimneys -->
  <g fill="#0a0408">
    <rect x="30" y="164" width="10" height="18"/>
    <rect x="100" y="124" width="9" height="18"/>
    <rect x="180" y="134" width="10" height="18"/>
    <rect x="290" y="114" width="9" height="18"/>
    <rect x="330" y="144" width="10" height="18"/>
  </g>
  <!-- Chimney smoke -->
  <g opacity="0.55" fill="#5a4838">
    <ellipse cx="36" cy="158" rx="14" ry="5"/>
    <ellipse cx="106" cy="118" rx="12" ry="4.4"/>
    <ellipse cx="186" cy="128" rx="14" ry="4.4"/>
    <ellipse cx="298" cy="108" rx="12" ry="4"/>
    <ellipse cx="338" cy="138" rx="14" ry="4.4"/>
  </g>

  <!-- BUILDING (corner — two streets meet) -->
  <rect x="0" y="200" width="366" height="164" fill="#1a0c08"/>
  <!-- Slight corner geometry -->
  <line x1="280" y1="220" x2="280" y2="364" stroke="#0a0604" stroke-width="0.7"/>
  <!-- A window dim -->
  <rect x="40" y="240" width="34" height="40" fill="#3a2818"/>
  <rect x="44" y="244" width="26" height="32" fill="#3a2828" opacity="0.7"/>
  <rect x="160" y="250" width="34" height="36" fill="#3a2818"/>
  <rect x="164" y="254" width="26" height="28" fill="#1a0c04" opacity="0.85"/>

  <!-- GAS LAMP nearby — out of frame to the bottom-left, casts amber pool from below right -->
  <ellipse cx="183" cy="364" rx="200" ry="100" fill="url(#p20p3lampPool)" filter="url(#p20p3glow)" opacity="0.9"/>

  <!-- THEODORE — center, head LIFTED up, hand raised unconsciously -->
  <g transform="translate(183 280)">
    <!-- Boots -->
    <ellipse cx="-5" cy="80" rx="6" ry="3" fill="#1a0c04"/>
    <ellipse cx="5" cy="80" rx="6" ry="3" fill="#1a0c04"/>
    <!-- Trousers -->
    <rect x="-7" y="46" width="6" height="34" fill="url(#p20p3theoSuit)"/>
    <rect x="1" y="46" width="6" height="34" fill="url(#p20p3theoSuit)"/>
    <!-- Shirt collar -->
    <rect x="-5" y="-2" width="10" height="6" fill="#d8c8a8"/>
    <!-- Waistcoat -->
    <path d="M-12,46 L-12,0 L12,0 L12,46 Z" fill="#5a2828"/>
    <line x1="0" y1="0" x2="0" y2="44" stroke="#3a1808" stroke-width="0.7"/>
    <circle cx="0" cy="8" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="18" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="28" r="0.7" fill="#5a3818"/>
    <!-- Shoulders -->
    <path d="M-12,0 Q-8,-12 -2,-14 Q4,-14 8,-10 L12,0 Z" fill="#5a2828"/>
    <!-- Right arm — RAISED unconsciously, hand extended -->
    <path d="M12,0 L20,-20 L26,-44 L30,-50 L26,-52 L22,-46 L18,-26 L8,-2 Z" fill="#5a2828"/>
    <ellipse cx="28" cy="-50" rx="5" ry="4" fill="url(#p20p3skin)"/>
    <!-- BRASS GEAR RING catching gaslight (left index) -->
    <circle cx="28" cy="-50" r="2" fill="none" stroke="#e8a850" stroke-width="0.85" filter="url(#p20p3bloom)"/>
    <circle cx="28" cy="-50" r="1.4" fill="none" stroke="#ffd078" stroke-width="0.4" filter="url(#p20p3bloom)" opacity="0.85"/>
    <!-- Oil stains -->
    <circle cx="26" cy="-49" r="0.9" fill="#1a0c04" opacity="0.7"/>
    <circle cx="29" cy="-52" r="0.7" fill="#1a0c04" opacity="0.65"/>
    <!-- Fingers extended -->
    <ellipse cx="32" cy="-54" rx="1.6" ry="1" fill="url(#p20p3skin)"/>
    <ellipse cx="33" cy="-50" rx="1.6" ry="1" fill="url(#p20p3skin)"/>
    <ellipse cx="32" cy="-46" rx="1.6" ry="1" fill="url(#p20p3skin)"/>
    <!-- Left arm — at side, hand visible -->
    <path d="M-12,0 L-16,18 L-14,32 L-8,32 L-8,16 L-10,4 Z" fill="#5a2828"/>
    <ellipse cx="-12" cy="34" rx="3.5" ry="2.4" fill="url(#p20p3skin)"/>

    <!-- HEAD — TILTED UP, looking sky -->
    <ellipse cx="0" cy="-32" rx="13" ry="16" fill="url(#p20p3skin)"/>
    <!-- Sky-side highlight (cool starlight on forehead) -->
    <ellipse cx="0" cy="-44" rx="9" ry="6" fill="#a8c0e8" opacity="0.45" filter="url(#p20p3bloom)"/>
    <!-- Lamplight catches chin/cheek from BELOW (warm) -->
    <ellipse cx="0" cy="-22" rx="10" ry="6" fill="#ffd078" opacity="0.5" filter="url(#p20p3bloom)"/>
    <!-- Sandy-brown hair -->
    <path d="M-10,-44 Q-9,-50 0,-50 Q9,-50 10,-44 L10,-38 Q5,-44 0,-44 Q-5,-44 -10,-38 Z" fill="#a87838"/>
    <path d="M-4,-46 L-2,-40" stroke="#7a5028" stroke-width="0.85" opacity="0.85"/>
    <path d="M2,-46 L4,-40" stroke="#7a5028" stroke-width="0.7" opacity="0.7"/>
    <!-- Freckles -->
    <circle cx="-4" cy="-30" r="0.5" fill="#5a3018" opacity="0.85"/>
    <circle cx="-2" cy="-28" r="0.45" fill="#5a3018" opacity="0.85"/>
    <circle cx="3" cy="-30" r="0.5" fill="#5a3018" opacity="0.85"/>
    <circle cx="5" cy="-28" r="0.5" fill="#5a3018" opacity="0.85"/>
    <!-- EYES — wide reflecting first stars -->
    <ellipse cx="-4" cy="-34" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="-4" cy="-33" rx="1.6" ry="1.1" fill="#7a4818"/>
    <circle cx="-4" cy="-33" r="0.9" fill="#0a0604"/>
    <circle cx="-3" cy="-34" r="0.4" fill="#fff8e8" filter="url(#p20p3bloom)"/>
    <ellipse cx="4" cy="-34" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="4" cy="-33" rx="1.6" ry="1.1" fill="#7a4818"/>
    <circle cx="4" cy="-33" r="0.9" fill="#0a0604"/>
    <circle cx="5" cy="-34" r="0.4" fill="#fff8e8" filter="url(#p20p3bloom)"/>
    <!-- Brows up — awe -->
    <path d="M-9,-42 L-1,-44" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M1,-44 L9,-42" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M-1,-28 L0,-22 Q1,-20 3,-20 L3,-26 Z" fill="#7a4838" opacity="0.85"/>
    <!-- Mouth — slightly open, awe -->
    <ellipse cx="0" cy="-15" rx="2" ry="1" fill="#3a1808" opacity="0.7"/>
    <!-- Breath fog — visible -->
    <ellipse cx="2" cy="-9" rx="5" ry="2.4" fill="#fff8e8" opacity="0.55" filter="url(#p20p3bloom)"/>
    <ellipse cx="6" cy="-4" rx="4" ry="1.8" fill="#fff8e8" opacity="0.4" filter="url(#p20p3bloom)"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,290 Q90,288 180,292 Q280,294 366,290"/>
  </g>
</svg>
