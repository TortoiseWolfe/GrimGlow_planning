<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 422" width="238" height="422">
  <title>Issue 4 — Page 9 — Panel 4: Jink ghost-of-grin returns, relief</title>
  <desc>50mm narrow vertical. Jink standing apart, reads room. Sees Sable's hand move from device. Sees Wren's respect. The TIDE TURNING. Ghost of grin returns — one corner of mouth lifts, eyes still wary, shoulders dropping half-inch. Emerald glow + cradle blue-white catching golden curls.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p9p4timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p9p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <radialGradient id="p9p4hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#f8e088"/>
      <stop offset="60%" stop-color="#d8a838"/>
      <stop offset="100%" stop-color="#a87828"/>
    </radialGradient>
    <linearGradient id="p9p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="50%" stop-color="#2e8b57"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <radialGradient id="p9p4topGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p4bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="238" height="422" fill="url(#p9p4bg)"/>
  <rect width="238" height="422" fill="url(#p9p4topGlow)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="238" height="280" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="100" x2="238" y2="100"/>
    <line x1="0" y1="180" x2="238" y2="180"/>
    <line x1="0" y1="260" x2="238" y2="260"/>
  </g>

  <!-- Timber beam -->
  <rect x="0" y="320" width="238" height="44" fill="url(#p9p4timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="322" x2="238" y2="322"/>
    <line x1="0" y1="358" x2="238" y2="358"/>
  </g>

  <!-- JINK — standing on beam, slightly apart -->
  <g transform="translate(120 322)">
    <ellipse cx="0" cy="0" rx="22" ry="3" fill="#0a0604" opacity="0.7"/>

    <!-- Legs (relaxed slightly, weight even) -->
    <path d="M-10,-66 L-14,-2 L-4,2 L-2,-66 Z" fill="url(#p9p4suit)"/>
    <path d="M2,-66 L4,2 L14,-2 L10,-66 Z" fill="url(#p9p4suit)"/>
    <ellipse cx="-10" cy="2" rx="6" ry="2" fill="#1a4830"/>
    <ellipse cx="10" cy="2" rx="6" ry="2" fill="#1a4830"/>
    <line x1="-13" y1="-64" x2="-15" y2="-2" stroke="#9aff9a" stroke-width="0.85" opacity="0.7"/>
    <line x1="13" y1="-64" x2="15" y2="-2" stroke="#9aff9a" stroke-width="0.85" opacity="0.7"/>

    <!-- Torso — shoulders slightly lower (relief tell) -->
    <path d="M-22,-130 L-24,-66 L24,-66 L22,-130 Z" fill="url(#p9p4suit)"/>
    <path d="M-16,-122 Q-2,-114 6,-124 Q-2,-104 -10,-100 Z" fill="#3a2818" opacity="0.7"/>
    <path d="M-22,-130 Q-30,-138 -22,-144 L-12,-142 L-15,-128 Z" fill="url(#p9p4suit)"/>
    <path d="M22,-130 Q30,-138 22,-144 L12,-142 L15,-128 Z" fill="url(#p9p4suit)"/>
    <!-- Wing-pack glow -->
    <line x1="-23" y1="-130" x2="-19" y2="-118" stroke="#9aff9a" stroke-width="1" opacity="0.85"/>
    <line x1="23" y1="-130" x2="19" y2="-118" stroke="#9aff9a" stroke-width="1" opacity="0.85"/>
    <circle cx="-20" cy="-124" r="2" fill="#d8ffe8" filter="url(#p9p4bloom)"/>
    <circle cx="20" cy="-124" r="2" fill="#d8ffe8" filter="url(#p9p4bloom)"/>

    <!-- Arms relaxed at sides -->
    <path d="M-22,-128 Q-30,-110 -26,-78 L-18,-80 Q-22,-110 -18,-126 Z" fill="url(#p9p4suit)"/>
    <path d="M22,-128 Q30,-110 26,-78 L18,-80 Q22,-110 18,-126 Z" fill="url(#p9p4suit)"/>
    <ellipse cx="-26" cy="-78" rx="4" ry="2.4" fill="url(#p9p4skin)"/>
    <ellipse cx="26" cy="-78" rx="4" ry="2.4" fill="url(#p9p4skin)"/>

    <!-- Head — chin neutral, looking at scene -->
    <ellipse cx="0" cy="-170" rx="14" ry="17" fill="url(#p9p4skin)"/>
    <!-- Wild golden curls (catching cradle light = highlights blue-white tinged) -->
    <g fill="url(#p9p4hair)">
      <circle cx="-12" cy="-184" r="5"/>
      <circle cx="-2" cy="-190" r="6"/>
      <circle cx="10" cy="-186" r="5"/>
      <circle cx="-15" cy="-178" r="4"/>
      <circle cx="15" cy="-178" r="4"/>
      <circle cx="-5" cy="-194" r="3.5"/>
      <circle cx="6" cy="-194" r="3.5"/>
      <!-- Highlights from cradle blue-white catching curls -->
      <ellipse cx="-12" cy="-184" rx="2" ry="1.4" fill="#a8c0e0" opacity="0.7"/>
      <ellipse cx="-2" cy="-190" rx="2.4" ry="1.4" fill="#a8c0e0" opacity="0.7"/>
      <ellipse cx="10" cy="-186" rx="2" ry="1.4" fill="#a8c0e0" opacity="0.7"/>
    </g>

    <!-- Brows relaxed -->
    <path d="M-10,-176 L-3,-178" stroke="#88603a" stroke-width="1" stroke-linecap="round"/>
    <path d="M3,-178 L10,-176" stroke="#88603a" stroke-width="1" stroke-linecap="round"/>

    <!-- Eyes — wary but easing -->
    <ellipse cx="-5" cy="-170" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="-5" cy="-170" rx="1.4" ry="1.1" fill="#1a4830"/>
    <circle cx="-5" cy="-170" r="0.85" fill="#0a0604"/>
    <ellipse cx="5" cy="-170" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="5" cy="-170" rx="1.4" ry="1.1" fill="#1a4830"/>
    <circle cx="5" cy="-170" r="0.85" fill="#0a0604"/>

    <!-- Nose -->
    <path d="M0,-164 L-2,-156 Q0,-154 2,-156 Z" fill="#7a4830" opacity="0.65"/>

    <!-- MOUTH — GHOST OF GRIN (one corner up, asymmetric) -->
    <path d="M-5,-148 Q0,-146 7,-150" fill="none" stroke="#3a1808" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 238,80"/>
    <path d="M0,360 Q60,362 120,358 Q180,356 238,360"/>
  </g>
</svg>
