<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 15 — Panel 1: Theodore epiphany, Luma confirms, Sable denies</title>
  <desc>Wide. Theodore from above, Luma center, Sable right with hand raised in dismissal. Theodore: You're saying... the stories are real? Not about you lot. About someone before you? / Luma: I'm saying someone taught your ancestors what fairies look like. And that someone had wings and holographic light and was very, very small. / Sable: Speculation. We don't have evidence of prior insertion.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p15p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p15p1floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p15p1theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p15p1lumaSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p15p1darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p15p1sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p15p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <radialGradient id="p15p1gapDay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <filter id="p15p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p15p1bg)"/>

  <!-- Top floorboard with Theodore -->
  <rect x="0" y="0" width="742" height="60" fill="url(#p15p1floorboard)"/>
  <g>
    <rect x="240" y="20" width="262" height="22" fill="url(#p15p1gapDay)"/>
    <rect x="240" y="20" width="262" height="2" fill="#1a0c04"/>
    <rect x="240" y="40" width="262" height="2" fill="#1a0c04"/>
    <ellipse cx="372" cy="32" rx="80" ry="10" fill="url(#p15p1theoSkin)"/>
    <!-- Theodore eyes — wide with epiphany -->
    <ellipse cx="356" cy="32" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="358" cy="32" r="2.4" fill="#7a5028"/>
    <circle cx="358" cy="32" r="1.2" fill="#0a0604"/>
    <ellipse cx="388" cy="32" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="390" cy="32" r="2.4" fill="#7a5028"/>
    <circle cx="390" cy="32" r="1.2" fill="#0a0604"/>
    <ellipse cx="372" cy="38" rx="6" ry="2" fill="#a85838"/>
  </g>

  <!-- Brick BG -->
  <rect x="0" y="80" width="742" height="200" fill="#2a1810" opacity="0.65"/>

  <!-- Beam -->
  <rect x="0" y="280" width="742" height="44" fill="url(#p15p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="742" y2="282"/>
    <line x1="0" y1="316" x2="742" y2="316"/>
  </g>

  <!-- LUMA — left, projecting hologram (still showing pattern data) -->
  <g transform="translate(220 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p15p1sapphire)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p15p1sapphire)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p15p1sapphire)"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p15p1sapphire)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p15p1sapphire)"/>
    <circle cx="-10" cy="-86" r="1" fill="#a888ff" filter="url(#p15p1bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#a888ff" filter="url(#p15p1bloom)"/>
    <path d="M-15,-76 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p15p1sapphire)"/>
    <path d="M15,-76 Q22,-58 16,-44 L10,-46 Q12,-58 10,-74 Z" fill="url(#p15p1sapphire)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p15p1lumaSkin)"/>
    <ellipse cx="15" cy="-44" rx="2.4" ry="1.4" fill="url(#p15p1lumaSkin)"/>
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p15p1lumaSkin)"/>
    <g fill="#1a0c04">
      <path d="M-9,-112 Q-9,-118 0,-120 Q9,-118 9,-112 L7,-106 Q3,-112 -3,-112 Q-7,-112 -9,-106 Z"/>
      <path d="M7,-110 Q14,-94 16,-78" stroke="#1a0c04" stroke-width="2.4" fill="none"/>
    </g>
    <line x1="7" y1="-110" x2="16" y2="-78" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#p15p1bloom)"/>
    <ellipse cx="-3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p15p1bloom)"/>
    <ellipse cx="3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p15p1bloom)"/>
    <ellipse cx="0" cy="-98" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- SABLE — right, hand raised in DISMISSAL gesture -->
  <g transform="translate(560 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.7"/>
    <path d="M-8,-50 L-12,-2 L-3,0 L-1,-50 Z" fill="url(#p15p1silver)"/>
    <path d="M1,-50 L3,0 L12,-2 L8,-50 Z" fill="url(#p15p1silver)"/>
    <path d="M-14,-86 L-16,-50 L16,-50 L14,-86 Z" fill="url(#p15p1silver)"/>
    <ellipse cx="14" cy="-84" rx="6" ry="4" fill="#3a3038" opacity="0.75"/>
    <path d="M-16,-86 Q-22,-94 -16,-100 L-9,-100 Z" fill="url(#p15p1silver)"/>
    <path d="M16,-86 Q22,-94 16,-100 L9,-100 Z" fill="url(#p15p1silver)"/>
    <circle cx="-10" cy="-94" r="1" fill="#fff8e8" filter="url(#p15p1bloom)"/>
    <circle cx="10" cy="-94" r="1" fill="#fff8e8" filter="url(#p15p1bloom)"/>
    <!-- Right arm CHOPPING DOWN (dismissive) -->
    <path d="M16,-86 Q34,-72 36,-56 L28,-50 Q24,-66 10,-84 Z" fill="url(#p15p1silver)"/>
    <ellipse cx="36" cy="-56" rx="3.5" ry="3" fill="url(#p15p1darkSkin)"/>
    <!-- Left arm at side -->
    <path d="M-16,-86 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p15p1silver)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p15p1darkSkin)"/>
    <!-- Head — turned toward Luma (left), tense -->
    <ellipse cx="-2" cy="-114" rx="11" ry="13" fill="url(#p15p1darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-11,-122 Q-12,-128 -2,-130 Q8,-128 7,-122 L5,-117 Q1,-122 -3,-122 Q-7,-122 -11,-117 Z"/>
    </g>
    <ellipse cx="-5" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="-5" cy="-114" r="0.6" fill="#0a0604"/>
    <ellipse cx="1" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="1" cy="-114" r="0.6" fill="#0a0604"/>
    <!-- Brow — drawn down hard (the lie) -->
    <path d="M-9,-118 L-3,-119" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M-1,-119 L5,-118" stroke="#3a3028" stroke-width="0.85"/>
    <!-- Mouth — TIGHT, line -->
    <path d="M-5,-108 L1,-108" stroke="#3a1808" stroke-width="0.85"/>
    <!-- Subtle glance toward sidearm/data module — anxiety tell -->
    <ellipse cx="-12" cy="-58" rx="6" ry="4" fill="#1a1820"/>
    <rect x="-14" y="-62" width="4" height="6" fill="#3a3038"/>
  </g>

  <!-- DIALOGUE — Theodore: You're saying... the stories are real? Not about you lot. About someone before you? -->
  <g>
    <rect x="14" y="80" width="538" height="58" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M380,80 L386,70 L390,80 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M384,80 L388,80" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">You're saying... the stories are real? Not about you lot.</text>
  <text x="22" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">About someone <tspan font-weight="700">before</tspan> you?</text>

  <!-- DIALOGUE — Luma: someone taught your ancestors... -->
  <g>
    <rect x="14" y="150" width="554" height="60" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,210 L270,210 L262,222 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M262,210 L268,210" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I'm saying someone taught your ancestors what fairies look like.</text>
  <text x="22" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">And that someone had wings and holographic light and was <tspan font-weight="700">very, very small.</tspan></text>

  <!-- DIALOGUE — Sable: Speculation. (THE LIE) -->
  <g>
    <rect x="220" y="226" width="364" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M540,226 L546,216 L550,226 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M544,226 L548,226" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="228" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="228" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Speculation. We don't have evidence of prior insertion.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
