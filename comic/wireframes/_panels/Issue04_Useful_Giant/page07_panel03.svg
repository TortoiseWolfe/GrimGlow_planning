<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 7 — Panel 3: Sable CU, dismisses Luma's risk argument coldly</title>
  <desc>65mm CU. Sable's face turned slightly toward Luma (off-frame left). Cold dismissal. Eyes fixed, mouth flat. Cool blue-white camp light + warm rim from gap. Sable: Risk. Not certainty. Luma (off-panel): Significant risk. To a child. Sable: Noted.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p7p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p7p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="50%" stop-color="#a8a0a0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p7p3hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <radialGradient id="p7p3coolWash" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p3warmRim" cx="100%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p7p3bg)"/>
  <rect width="366" height="364" fill="url(#p7p3coolWash)"/>
  <rect width="366" height="364" fill="url(#p7p3warmRim)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
  </g>

  <!-- SABLE close-up -->
  <g transform="translate(180 250)">
    <!-- Shoulders/torso filling lower frame -->
    <path d="M-110,90 L-110,40 L110,40 L110,90 Z" fill="url(#p7p3suit)"/>
    <path d="M-110,40 Q-80,16 -40,8 L-30,32 Q-70,32 -100,42 Z" fill="url(#p7p3suit)"/>
    <path d="M110,40 Q80,16 40,8 L30,32 Q70,32 100,42 Z" fill="url(#p7p3suit)"/>
    <line x1="0" y1="20" x2="0" y2="90" stroke="#5a5860" stroke-width="0.85"/>
    <!-- SOOT BLOOM right shoulder -->
    <ellipse cx="80" cy="20" rx="22" ry="14" fill="#3a3038" opacity="0.75"/>
    <!-- Hologram nodes -->
    <circle cx="-50" cy="20" r="2" fill="#fff8e8" filter="url(#p7p3bloom)"/>
    <circle cx="50" cy="20" r="2" fill="#fff8e8" filter="url(#p7p3bloom)"/>

    <!-- HEAD — three-quarter slightly toward left (Luma off-frame) -->
    <g transform="translate(0 -10)">
      <ellipse cx="0" cy="0" rx="40" ry="46" fill="url(#p7p3skin)"/>
      <path d="M-38,-2 Q-32,30 -10,40 L8,42 Q28,38 36,16 L34,-2 Z" fill="url(#p7p3skin)"/>
      <ellipse cx="-30" cy="-2" rx="5" ry="9" fill="url(#p7p3skin)"/>
      <ellipse cx="-30" cy="-2" rx="2.4" ry="5" fill="#3a2010" opacity="0.5"/>

      <!-- HAIR silver-white buzz -->
      <g fill="url(#p7p3hair)">
        <path d="M-38,-36 Q-38,-50 0,-54 Q34,-50 34,-36 L30,-26 Q14,-40 0,-40 Q-26,-40 -34,-26 Z"/>
        <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
          <line x1="-26" y1="-44" x2="-26" y2="-40"/>
          <line x1="-12" y1="-50" x2="-12" y2="-46"/>
          <line x1="0" y1="-52" x2="0" y2="-48"/>
          <line x1="12" y1="-50" x2="12" y2="-46"/>
          <line x1="26" y1="-42" x2="26" y2="-38"/>
        </g>
      </g>

      <!-- Brow drawn down hard -->
      <path d="M-26,-12 L-8,-16" stroke="#3a3028" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M2,-16 L22,-12" stroke="#3a3028" stroke-width="2.4" stroke-linecap="round"/>

      <!-- Eyes — narrow, locked left at Luma -->
      <ellipse cx="-18" cy="-4" rx="5" ry="2.4" fill="#fff8e8"/>
      <ellipse cx="-20" cy="-4" rx="3" ry="2" fill="#3a2010"/>
      <circle cx="-20" cy="-4" r="1.4" fill="#0a0604"/>
      <ellipse cx="6" cy="-4" rx="4.5" ry="2.4" fill="#fff8e8"/>
      <ellipse cx="4" cy="-4" rx="2.6" ry="1.8" fill="#3a2010"/>
      <circle cx="4" cy="-4" r="1.4" fill="#0a0604"/>
      <ellipse cx="-21" cy="-5" rx="0.85" ry="0.55" fill="#fff8e8"/>
      <ellipse cx="3" cy="-5" rx="0.85" ry="0.55" fill="#fff8e8"/>

      <path d="M-22,0 Q-18,3 -14,0" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M0,0 Q4,3 10,0" fill="none" stroke="#3a2010" stroke-width="0.55"/>

      <!-- Nose -->
      <path d="M-6,2 L-3,18 Q-1,22 1,22 L4,20 L0,4 Z" fill="url(#p7p3skin)"/>

      <!-- Mouth FLAT, dismissive -->
      <path d="M-16,32 L8,30" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Cheekbone shadow -->
      <path d="M-32,8 Q-28,18 -16,24" fill="none" stroke="#3a2010" stroke-width="0.5" opacity="0.55"/>

      <!-- Cool light on left -->
      <g opacity="0.45">
        <path d="M-38,-4 L-26,-6 L-24,-2 L-38,2 Z" fill="#a888ff"/>
        <path d="M-36,12 L-24,10 L-22,14 L-36,18 Z" fill="#a888ff"/>
      </g>
    </g>
  </g>

  <!-- DIALOGUE — Sable: Risk. Not certainty. -->
  <g>
    <rect x="14" y="14" width="174" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M40,58 L50,58 L42,70 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M42,58 L48,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Risk. Not certainty.</text>

  <!-- DIALOGUE — Luma (off-panel): Significant risk. To a child. -->
  <g>
    <rect x="160" y="74" width="200" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" stroke-dasharray="4,2" filter="url(#balloonShadow)"/>
    <path d="M348,118 L360,118 L350,128 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" stroke-dasharray="2,1.5"/>
    <path d="M350,118 L356,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="168" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="168" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Significant risk. To a child.</text>

  <!-- DIALOGUE — Sable: Noted. -->
  <g>
    <rect x="14" y="134" width="100" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M40,178 L50,178 L42,190 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M42,178 L48,178" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Noted.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
