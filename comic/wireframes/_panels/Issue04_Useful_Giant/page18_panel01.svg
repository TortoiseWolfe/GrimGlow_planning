<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 18 — Panel 1: ECU MACRO of glyph — hand-carved geometric script with wavering tool slips and grime in grooves</title>
  <desc>Macro detail. The glyph fills the frame. Hex-cross fairy script carved by hand into ancient brick. Lines waver where the tool slipped. Depth varies with the brick. Each carved line glows residually under scanner. Spider silk in one corner. Centuries old.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p18p1glyphAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0d8ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#88aaff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p1scannerWash" cx="0%" cy="50%" r="120%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p18p1glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- ANCIENT BRICK SURFACE — high magnification -->
  <rect width="366" height="364" fill="url(#p18p1bg)"/>

  <!-- Rough brick texture — at magnification, brick is a landscape -->
  <g opacity="0.7" stroke="#1a0c04" stroke-width="0.6" fill="none">
    <path d="M0,40 Q60,42 120,38 Q180,36 240,40 Q300,44 366,40"/>
    <path d="M0,90 Q60,92 120,88 Q180,84 240,90 Q300,94 366,90"/>
    <path d="M0,140 Q60,142 120,138 Q180,134 240,140 Q300,144 366,140"/>
    <path d="M0,200 Q60,202 120,198 Q180,194 240,200 Q300,204 366,200"/>
    <path d="M0,260 Q60,262 120,258 Q180,254 240,260 Q300,264 366,260"/>
    <path d="M0,320 Q60,322 120,318 Q180,314 240,320 Q300,324 366,320"/>
  </g>

  <!-- Brick aggregate — pebbles + mineral inclusions visible at macro -->
  <g opacity="0.55">
    <ellipse cx="40" cy="60" rx="6" ry="3" fill="#7a4838"/>
    <ellipse cx="80" cy="110" rx="4" ry="2.5" fill="#3a1808"/>
    <ellipse cx="120" cy="80" rx="5" ry="3" fill="#5a3828"/>
    <ellipse cx="280" cy="60" rx="6" ry="3.5" fill="#7a4838"/>
    <ellipse cx="320" cy="120" rx="4" ry="2.5" fill="#3a1808"/>
    <ellipse cx="50" cy="220" rx="5" ry="2.8" fill="#5a3828"/>
    <ellipse cx="90" cy="280" rx="4" ry="2.5" fill="#3a1808"/>
    <ellipse cx="290" cy="220" rx="6" ry="3.5" fill="#7a4838"/>
    <ellipse cx="330" cy="280" rx="5" ry="3" fill="#5a3828"/>
    <ellipse cx="180" cy="40" rx="3" ry="2" fill="#3a1808"/>
    <ellipse cx="180" cy="330" rx="3" ry="2" fill="#3a1808"/>
  </g>

  <!-- Surface pitting + age stains -->
  <g opacity="0.45">
    <ellipse cx="60" cy="160" rx="14" ry="6" fill="#1a0c04"/>
    <ellipse cx="220" cy="100" rx="12" ry="5" fill="#1a0c04"/>
    <ellipse cx="306" cy="180" rx="10" ry="4" fill="#1a0c04"/>
    <ellipse cx="50" cy="290" rx="14" ry="6" fill="#1a0c04"/>
    <ellipse cx="280" cy="290" rx="12" ry="5" fill="#1a0c04"/>
  </g>

  <!-- Scanner wash from left -->
  <rect width="366" height="364" fill="url(#p18p1scannerWash)"/>

  <!-- ====== GLYPH MACRO ====== -->
  <!-- At ECU, the glyph is large — fills central area. Hand-carved. -->
  <g transform="translate(183 195)">
    <!-- Outer aura -->
    <ellipse cx="0" cy="0" rx="170" ry="170" fill="url(#p18p1glyphAura)" filter="url(#p18p1glow)"/>
    <!-- Recessed brick patch (smoother, where carving lives) -->
    <ellipse cx="0" cy="0" rx="130" ry="130" fill="#3a1c08" opacity="0.45"/>

    <!-- Hand-carved hexagon outer — IRREGULAR + WAVERING (script demands "lines waver where tool slipped") -->
    <g fill="none" stroke="#88aaff" stroke-width="3.6" filter="url(#p18p1bloom)" opacity="0.9" stroke-linecap="round">
      <!-- Top-left edge — slight slip -->
      <path d="M-92,-50 L-50,-100"/>
      <!-- Top edge — wavers -->
      <path d="M-50,-100 Q-20,-104 16,-104 Q42,-104 48,-102"/>
      <!-- Top-right -->
      <path d="M48,-102 L94,-50"/>
      <!-- Right edge -->
      <path d="M94,-50 Q98,-20 96,12 Q94,40 92,52"/>
      <!-- Bottom-right -->
      <path d="M92,52 L46,100"/>
      <!-- Bottom — wavers, with one notable slip -->
      <path d="M46,100 Q20,104 -8,104 Q-32,104 -50,98"/>
      <!-- Bottom-left -->
      <path d="M-50,98 L-94,46"/>
      <!-- Left -->
      <path d="M-94,46 Q-98,18 -96,-12 Q-94,-38 -92,-50"/>
    </g>

    <!-- Inner hex — depth varies (script demands "depth varying with the brick") -->
    <g fill="none" stroke="#a8c0ff" stroke-width="2.6" filter="url(#p18p1bloom)" opacity="0.92" stroke-linecap="round">
      <path d="M-58,-32 L-32,-66"/>
      <path d="M-32,-66 Q-10,-68 14,-68 Q30,-68 32,-66"/>
      <path d="M32,-66 L62,-32"/>
      <path d="M62,-32 Q66,-8 64,18 Q62,30 60,34"/>
      <path d="M60,34 L30,68"/>
      <path d="M30,68 Q4,70 -16,70 Q-32,70 -34,66"/>
      <path d="M-34,66 L-62,32"/>
      <path d="M-62,32 Q-66,6 -64,-18 Q-62,-26 -60,-30"/>
    </g>

    <!-- Vertical cross arm — wider stroke at top (deeper carve), thinner at bottom (tool dragged) -->
    <line x1="0" y1="-104" x2="0" y2="-50" stroke="#c0d8ff" stroke-width="4.5" stroke-linecap="round" filter="url(#p18p1bloom)" opacity="0.95"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#c0d8ff" stroke-width="3.8" stroke-linecap="round" filter="url(#p18p1bloom)" opacity="0.95"/>
    <line x1="0" y1="50" x2="0" y2="100" stroke="#c0d8ff" stroke-width="3" stroke-linecap="round" filter="url(#p18p1bloom)" opacity="0.9"/>

    <!-- Horizontal cross arm — slip near right end (the line wavers and dips) -->
    <line x1="-94" y1="0" x2="-46" y2="0" stroke="#c0d8ff" stroke-width="3.6" stroke-linecap="round" filter="url(#p18p1bloom)" opacity="0.95"/>
    <line x1="-46" y1="0" x2="50" y2="-2" stroke="#c0d8ff" stroke-width="4" stroke-linecap="round" filter="url(#p18p1bloom)" opacity="0.95"/>
    <line x1="50" y1="-2" x2="94" y2="2" stroke="#c0d8ff" stroke-width="3.4" stroke-linecap="round" filter="url(#p18p1bloom)" opacity="0.95"/>

    <!-- Diagonal carved tics inside hex -->
    <g stroke="#a8c0ff" stroke-width="2.2" stroke-linecap="round" filter="url(#p18p1bloom)" opacity="0.88">
      <line x1="-52" y1="-52" x2="-26" y2="-26"/>
      <line x1="52" y1="-52" x2="26" y2="-26"/>
      <line x1="-52" y1="52" x2="-26" y2="26"/>
      <line x1="52" y1="52" x2="26" y2="26"/>
    </g>

    <!-- Center beat -->
    <circle cx="0" cy="0" r="6" fill="#fff8e8" filter="url(#p18p1bloom)" opacity="0.9"/>
    <circle cx="0" cy="0" r="14" fill="#c0d8ff" opacity="0.4" filter="url(#p18p1bloom)"/>

    <!-- Tool slip evidence — shallow trailing cut below bottom edge -->
    <path d="M-12,108 Q-4,114 8,114 Q14,112 18,108" stroke="#5a78c8" stroke-width="1.2" fill="none" opacity="0.7" filter="url(#p18p1bloom)"/>

    <!-- Visible grime in the GROOVES — script demands "Dust and grime fill the grooves" -->
    <g opacity="0.65">
      <circle cx="-30" cy="-50" r="2.2" fill="#0a0604"/>
      <circle cx="20" cy="-72" r="2" fill="#0a0604"/>
      <circle cx="62" cy="-12" r="2.2" fill="#0a0604"/>
      <circle cx="32" cy="48" r="2" fill="#0a0604"/>
      <circle cx="-44" cy="20" r="2" fill="#0a0604"/>
      <circle cx="-22" cy="68" r="1.8" fill="#0a0604"/>
      <circle cx="48" cy="-50" r="1.6" fill="#0a0604"/>
      <ellipse cx="-72" cy="-26" rx="3" ry="1.4" fill="#0a0604"/>
      <ellipse cx="78" cy="32" rx="3" ry="1.4" fill="#0a0604"/>
      <ellipse cx="-2" cy="-90" rx="2" ry="1" fill="#0a0604"/>
      <ellipse cx="0" cy="86" rx="2" ry="1" fill="#0a0604"/>
    </g>

    <!-- Carved imperfections — chip + tool drag -->
    <ellipse cx="-78" cy="62" rx="4" ry="2" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="80" cy="-58" rx="3" ry="1.6" fill="#1a0c04" opacity="0.7"/>
  </g>

  <!-- SPIDER SILK across one corner — bottom-right, script demands -->
  <g stroke="#a89888" stroke-width="0.5" fill="none" opacity="0.5">
    <path d="M260,260 Q286,250 312,260 Q336,272 360,266"/>
    <path d="M280,254 Q310,272 340,272"/>
    <path d="M260,260 L312,260"/>
    <path d="M260,260 L336,272"/>
    <path d="M312,260 L336,272"/>
    <!-- silk strand droop -->
    <path d="M340,272 Q346,288 352,302" opacity="0.4"/>
  </g>

  <!-- LUMA off-panel dialogue — top -->
  <g>
    <rect x="14" y="14" width="338" height="44" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="170,58 182,58 174,68" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="170.5" y1="58" x2="181.5" y2="58" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a3ad8" font-weight="700">LUMA (off-panel, reading)</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">It's a marker. A waypoint glyph. Standard survey notation.</text>

  <!-- LUMA off-panel — second beat (the realization) -->
  <g>
    <rect x="14" y="306" width="338" height="44" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="170,306 182,306 174,296" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="170.5" y1="306" x2="181.5" y2="306" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a3ad8" font-weight="700">LUMA (off-panel)</text>
  <text x="22" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Standard survey notation from <tspan font-style="italic">our service.</tspan></text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,290 Q90,292 180,288 Q280,286 366,290"/>
  </g>
</svg>
