<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 18 — Panel 2: Luma documenting — multiple holographic displays — composure cracking</title>
  <desc>50mm MCU. Luma surrounded by floating displays — rotating glyph image, spectral analysis, age dating, side-by-side script comparison. Hands work the interfaces. Face tight, controlled. Breath fog visible. Documenting because that is what she knows how to do.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#1a0c14"/>
    </linearGradient>
    <linearGradient id="p18p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="50%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a3828"/>
    </linearGradient>
    <linearGradient id="p18p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p18p2displayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p2bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="p18p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p18p2bg)"/>

  <!-- Background brick texture, dim -->
  <g opacity="0.35">
    <rect width="366" height="364" fill="#2a1810"/>
    <g stroke="#0a0604" stroke-width="0.4">
      <path d="M0,40 Q120,42 240,38 Q320,36 366,40"/>
      <path d="M0,120 Q120,122 240,118 Q320,116 366,120"/>
      <path d="M0,200 Q120,198 240,202 Q320,204 366,200"/>
      <path d="M0,280 Q120,282 240,278 Q320,276 366,280"/>
    </g>
  </g>

  <!-- DISPLAY 1 — top-left: rotating glyph 3D capture -->
  <g transform="translate(60 90)">
    <ellipse cx="0" cy="0" rx="48" ry="44" fill="url(#p18p2displayGlow)" filter="url(#p18p2glow)" opacity="0.85"/>
    <rect x="-32" y="-30" width="64" height="56" rx="2" fill="none" stroke="#a888e8" stroke-width="1" filter="url(#p18p2bloom)" opacity="0.85"/>
    <!-- Rotating glyph in display - smaller hex-cross -->
    <g stroke="#c0d8ff" stroke-width="1.2" fill="none" filter="url(#p18p2bloom)" opacity="0.95">
      <path d="M-18,-12 L-10,-22 L8,-22 L18,-12 L18,12 L8,22 L-10,22 L-20,12 Z" transform="rotate(15)"/>
      <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(15)"/>
      <line x1="-18" y1="0" x2="18" y2="0" transform="rotate(15)"/>
    </g>
    <!-- Rotation arc indicator -->
    <path d="M-30,-26 Q0,-32 30,-26" stroke="#fff8e8" stroke-width="0.4" fill="none" opacity="0.6"/>
    <path d="M28,-26 L30,-22" stroke="#fff8e8" stroke-width="0.4"/>
    <!-- corner ticks -->
    <path d="M-32,-30 L-26,-30 L-32,-24 Z" fill="#a888e8"/>
    <path d="M32,-30 L26,-30 L32,-24 Z" fill="#a888e8"/>
  </g>

  <!-- DISPLAY 2 — top-right: spectral analysis chart -->
  <g transform="translate(306 80)">
    <ellipse cx="0" cy="0" rx="44" ry="40" fill="url(#p18p2displayGlow)" filter="url(#p18p2glow)" opacity="0.8"/>
    <rect x="-30" y="-26" width="60" height="48" rx="2" fill="none" stroke="#a888e8" stroke-width="1" filter="url(#p18p2bloom)" opacity="0.85"/>
    <!-- Wave pattern -->
    <path d="M-26,8 L-18,-4 L-12,2 L-6,-12 L0,4 L8,-8 L14,2 L20,-6 L26,4" stroke="#fff8e8" stroke-width="0.7" fill="none" filter="url(#p18p2bloom)" opacity="0.85"/>
    <line x1="-26" y1="14" x2="26" y2="14" stroke="#a888e8" stroke-width="0.5" opacity="0.7"/>
    <!-- Tick marks -->
    <g stroke="#a888e8" stroke-width="0.4" opacity="0.65">
      <line x1="-20" y1="12" x2="-20" y2="16"/>
      <line x1="-8" y1="12" x2="-8" y2="16"/>
      <line x1="4" y1="12" x2="4" y2="16"/>
      <line x1="16" y1="12" x2="16" y2="16"/>
    </g>
    <!-- Header text -->
    <text x="-26" y="-18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4" fill="#fff8e8" opacity="0.9">SPECTRAL</text>
  </g>

  <!-- DISPLAY 3 — bottom-left: side-by-side script comparison -->
  <g transform="translate(70 290)">
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="url(#p18p2displayGlow)" filter="url(#p18p2glow)" opacity="0.8"/>
    <rect x="-46" y="-26" width="92" height="48" rx="2" fill="none" stroke="#a888e8" stroke-width="1" filter="url(#p18p2bloom)" opacity="0.85"/>
    <!-- LEFT side: ancient -->
    <g stroke="#c0d8ff" stroke-width="0.9" fill="none" filter="url(#p18p2bloom)" opacity="0.85">
      <path d="M-38,-14 L-32,-20 L-26,-20 L-22,-14 L-22,-4 L-26,2 L-32,2 L-38,-4 Z"/>
      <line x1="-30" y1="-20" x2="-30" y2="2"/>
      <line x1="-38" y1="-9" x2="-22" y2="-9"/>
    </g>
    <text x="-44" y="-22" font-size="3.6" fill="#fff8e8" opacity="0.85">300+ YR</text>
    <!-- Vertical divider -->
    <line x1="0" y1="-26" x2="0" y2="22" stroke="#fff8e8" stroke-width="0.5" stroke-dasharray="2 1.5" opacity="0.7"/>
    <!-- RIGHT side: modern -->
    <g stroke="#c0d8ff" stroke-width="0.9" fill="none" filter="url(#p18p2bloom)" opacity="0.95">
      <path d="M22,-14 L28,-20 L34,-20 L38,-14 L38,-4 L34,2 L28,2 L22,-4 Z"/>
      <line x1="30" y1="-20" x2="30" y2="2"/>
      <line x1="22" y1="-9" x2="38" y2="-9"/>
    </g>
    <text x="14" y="-22" font-size="3.6" fill="#fff8e8" opacity="0.85">CURRENT</text>
    <!-- Match indicator -->
    <text x="-12" y="14" font-size="4.2" fill="#80ff80" opacity="0.95" filter="url(#p18p2bloom)">MATCH 94.2%</text>
  </g>

  <!-- DISPLAY 4 — bottom-right: age date scrolling -->
  <g transform="translate(304 270)">
    <ellipse cx="0" cy="0" rx="44" ry="38" fill="url(#p18p2displayGlow)" filter="url(#p18p2glow)" opacity="0.78"/>
    <rect x="-30" y="-24" width="60" height="44" rx="2" fill="none" stroke="#a888e8" stroke-width="1" filter="url(#p18p2bloom)" opacity="0.85"/>
    <text x="-26" y="-14" font-size="4" fill="#fff8e8" opacity="0.95">AGE DATING</text>
    <text x="-26" y="-6" font-size="4.2" fill="#fff8e8" opacity="0.95">PRE-1600</text>
    <text x="-26" y="2" font-size="3.8" fill="#fff8e8" opacity="0.8">CONFIDENCE</text>
    <text x="-26" y="10" font-size="4.4" fill="#80ff80" filter="url(#p18p2bloom)" opacity="0.95">94.2%</text>
    <!-- progress bar -->
    <rect x="-26" y="14" width="52" height="2" fill="#3a2068" stroke="#a888e8" stroke-width="0.2"/>
    <rect x="-26" y="14" width="48.8" height="2" fill="#80ff80" filter="url(#p18p2bloom)"/>
  </g>

  <!-- LUMA — center, MCU framed by floating displays -->
  <g transform="translate(183 200)">
    <!-- Body -->
    <path d="M-46,164 L-58,80 L58,80 L46,164 Z" fill="url(#p18p2suit)"/>
    <line x1="-30" y1="92" x2="30" y2="92" stroke="#a888e8" stroke-width="1.6" opacity="0.85" filter="url(#p18p2bloom)"/>
    <line x1="0" y1="80" x2="0" y2="108" stroke="#a888e8" stroke-width="0.9" opacity="0.7"/>
    <!-- Shoulders -->
    <path d="M-58,80 Q-44,60 -10,52 Q14,52 44,60 Q58,80 56,86 L-56,86 Z" fill="url(#p18p2suit)"/>
    <!-- LEFT arm reaching forward to display -->
    <path d="M-58,80 L-86,90 L-104,80 L-104,68 L-86,76 L-58,68 Z" fill="url(#p18p2suit)"/>
    <ellipse cx="-100" cy="74" rx="6" ry="4" fill="url(#p18p2skin)"/>
    <!-- INK STAINS -->
    <circle cx="-98" cy="72" r="1.4" fill="#1a1c34" opacity="0.75"/>
    <circle cx="-104" cy="76" r="1" fill="#1a1c34" opacity="0.7"/>
    <!-- RIGHT arm reaching toward another display -->
    <path d="M58,80 L86,72 L102,84 L102,94 L88,86 L58,90 Z" fill="url(#p18p2suit)"/>
    <ellipse cx="98" cy="86" rx="6" ry="4" fill="url(#p18p2skin)"/>
    <circle cx="98" cy="84" r="1.2" fill="#1a1c34" opacity="0.7"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="32" ry="40" fill="url(#p18p2skin)"/>
    <!-- Hair top -->
    <path d="M-24,-30 Q-20,-44 0,-46 Q22,-44 26,-28 Q24,-22 22,-22 Q14,-32 0,-32 Q-16,-32 -22,-22 Z" fill="#0a0604"/>
    <!-- BRAID over right shoulder -->
    <path d="M16,32 Q26,80 28,140 Q28,160 24,180" stroke="#0a0604" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M16,34 Q24,80 28,140" stroke="#3a1c08" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- SAPPHIRE FILAMENT -->
    <path d="M16,32 Q26,80 28,140" stroke="#a888e8" stroke-width="1" fill="none" opacity="0.85" filter="url(#p18p2bloom)"/>
    <circle cx="22" cy="64" r="1" fill="#fff8e8" filter="url(#p18p2bloom)"/>
    <circle cx="26" cy="100" r="1" fill="#fff8e8" filter="url(#p18p2bloom)"/>
    <circle cx="28" cy="138" r="0.9" fill="#fff8e8" filter="url(#p18p2bloom)"/>

    <!-- Eyes — precise, focused, controlled -->
    <ellipse cx="-12" cy="-4" rx="6" ry="3.5" fill="#fff8e8"/>
    <ellipse cx="-12" cy="-2" rx="3.6" ry="2.6" fill="#3a2010"/>
    <circle cx="-12" cy="-2" r="2" fill="#0a0604"/>
    <circle cx="-11" cy="-4" r="0.6" fill="#fff8e8" filter="url(#p18p2bloom)"/>
    <ellipse cx="12" cy="-4" rx="6" ry="3.5" fill="#fff8e8"/>
    <ellipse cx="12" cy="-2" rx="3.6" ry="2.6" fill="#3a2010"/>
    <circle cx="12" cy="-2" r="2" fill="#0a0604"/>
    <circle cx="13" cy="-4" r="0.6" fill="#fff8e8" filter="url(#p18p2bloom)"/>
    <!-- Brows level + tight -->
    <path d="M-20,-13 L-4,-15" stroke="#0a0604" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M4,-15 L20,-13" stroke="#0a0604" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M-3,2 L-1,12 Q1,14 3,12 L4,2 Z" fill="url(#p18p2skin)" opacity="0.85"/>
    <!-- Mouth — JAW SET, TIGHT -->
    <path d="M-8,20 L8,20" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>

    <!-- HOLO LENSES — dimmer than P17 P3 (cycling but not in initial flare) -->
    <g opacity="0.9">
      <rect x="-22" y="-14" width="20" height="14" rx="1" fill="none" stroke="#ffd078" stroke-width="0.9" filter="url(#p18p2bloom)"/>
      <line x1="-22" y1="-9" x2="-2" y2="-9" stroke="#ffd078" stroke-width="0.4" opacity="0.7"/>
      <!-- CRACK -->
      <line x1="-16" y1="-14" x2="-12" y2="-9" stroke="#ffd078" stroke-width="0.4"/>
      <line x1="-12" y1="-9" x2="-14" y2="-1" stroke="#ffd078" stroke-width="0.4"/>
      <rect x="2" y="-14" width="20" height="14" rx="1" fill="none" stroke="#ffd078" stroke-width="0.9" filter="url(#p18p2bloom)"/>
      <line x1="2" y1="-9" x2="22" y2="-9" stroke="#ffd078" stroke-width="0.4" opacity="0.7"/>
    </g>

    <!-- BREATH FOG — script demands "faint fog in the cold void air" -->
    <g opacity="0.5">
      <ellipse cx="0" cy="22" rx="8" ry="3" fill="#fff8e8" filter="url(#p18p2bloom)"/>
      <ellipse cx="-2" cy="26" rx="6" ry="2" fill="#fff8e8" filter="url(#p18p2bloom)" opacity="0.6"/>
      <ellipse cx="2" cy="30" rx="4" ry="1.4" fill="#fff8e8" filter="url(#p18p2bloom)" opacity="0.4"/>
    </g>
  </g>

  <!-- LUMA dialogue — clinical (top right of frame) -->
  <g>
    <rect x="14" y="14" width="182" height="100" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA (clinical)</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Glyph photographed.</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Spectral analysis confirms</text>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">fairy-script substrate,</text>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">pre-1600. Material match</text>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">at 94.2 percent.</text>

  <!-- LUMA — clinical tone CRACKING, lower right -->
  <g>
    <rect x="156" y="316" width="200" height="36" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="180,316 192,316 184,306" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="180.5" y1="316" x2="191.5" y2="316" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="164" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="164" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410" font-weight="500">Someone from our service was here.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,290 Q90,288 180,292 Q280,294 366,290"/>
  </g>
</svg>
