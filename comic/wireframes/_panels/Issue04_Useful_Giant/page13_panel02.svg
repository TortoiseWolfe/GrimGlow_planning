<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 13 — Panel 2: Theodore monologues — fair folk, courts, Seelie/Unseelie</title>
  <desc>Wide. Theodore's animated face dominates upper frame, eyes shining, hands gesturing. Folklore monologue. Theodore: Well, fairies — the fair folk, the good neighbours, the gentle people — you never call them by their true name, see, or they take offence— / They live in hollow hills and under bridges and in the spaces between. They've got courts and kings and queens. Some are kind, the Seelie sort. And some are... / ...the other kind.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p13p2skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p13p2hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p13p2vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p13p2shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
  </defs>

  <rect width="742" height="364" fill="url(#p13p2bg)"/>

  <!-- Grimy window detail in BG -->
  <rect x="540" y="40" width="50" height="60" fill="#a89888" opacity="0.85"/>
  <line x1="565" y1="40" x2="565" y2="100" stroke="#3a2818" stroke-width="0.5"/>
  <line x1="540" y1="70" x2="590" y2="70" stroke="#3a2818" stroke-width="0.5"/>

  <!-- Floorboard texture -->
  <g stroke="#1a0c04" stroke-width="0.7" opacity="0.6">
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="280" x2="742" y2="280"/>
    <line x1="0" y1="340" x2="742" y2="340"/>
  </g>

  <!-- THEODORE — animated, mid-monologue, hands gesturing -->
  <g transform="translate(280 240)">
    <!-- Body — leaning forward, animated -->
    <path d="M-90,80 L-100,160 L100,160 L120,80 Z" fill="url(#p13p2vest)"/>
    <!-- Shirt arms gesturing wide -->
    <path d="M-90,80 Q-130,40 -160,20 L-150,-2 Q-110,20 -70,60 Z" fill="url(#p13p2shirt)"/>
    <path d="M120,80 Q170,30 200,20 L210,2 Q170,30 120,60 Z" fill="url(#p13p2shirt)"/>
    <!-- Hands — open, gesturing (storyteller's hands) -->
    <ellipse cx="-150" cy="0" rx="14" ry="10" fill="url(#p13p2skin)"/>
    <g fill="url(#p13p2skin)">
      <ellipse cx="-160" cy="-12" rx="6" ry="3" transform="rotate(-30 -160 -12)"/>
      <ellipse cx="-166" cy="-2" rx="6" ry="3" transform="rotate(-50 -166 -2)"/>
      <ellipse cx="-164" cy="10" rx="6" ry="3" transform="rotate(-70 -164 10)"/>
    </g>
    <ellipse cx="210" cy="0" rx="14" ry="10" fill="url(#p13p2skin)"/>
    <g fill="url(#p13p2skin)">
      <ellipse cx="220" cy="-12" rx="6" ry="3" transform="rotate(30 220 -12)"/>
      <ellipse cx="226" cy="-2" rx="6" ry="3" transform="rotate(50 226 -2)"/>
      <ellipse cx="224" cy="10" rx="6" ry="3" transform="rotate(70 224 10)"/>
    </g>
    <!-- Brass gear ring -->
    <ellipse cx="220" cy="-12" rx="3" ry="2" fill="#c89858" stroke="#7a5028" stroke-width="0.5"/>
    <!-- Oil stains -->
    <ellipse cx="-150" cy="0" rx="6" ry="2" fill="#1a0c04" opacity="0.5"/>
    <ellipse cx="210" cy="0" rx="6" ry="2" fill="#1a0c04" opacity="0.5"/>

    <!-- Head — animated face, eyes shining, mouth open mid-word -->
    <ellipse cx="0" cy="-30" rx="60" ry="68" fill="url(#p13p2skin)"/>
    <g fill="url(#p13p2hair)">
      <path d="M-58,-90 Q-58,-104 0,-108 Q58,-104 58,-90 L52,-74 Q26,-92 0,-92 Q-26,-92 -52,-74 Z"/>
      <!-- Strands -->
      <path d="M-44,-74 Q-42,-50 -34,-30 L-26,-32 Q-36,-50 -40,-74 Z"/>
      <path d="M-14,-86 Q-12,-50 -4,-30 L4,-32 Q-6,-50 -10,-86 Z"/>
      <path d="M16,-86 Q18,-50 26,-30 L34,-32 Q24,-50 22,-86 Z"/>
      <path d="M44,-74 Q46,-50 54,-30 L62,-32 Q52,-50 48,-74 Z"/>
    </g>
    <!-- Brows raised (animated) -->
    <path d="M-36,-50 Q-20,-56 -10,-50" stroke="#5a4030" stroke-width="3" fill="none"/>
    <path d="M10,-50 Q20,-56 36,-50" stroke="#5a4030" stroke-width="3" fill="none"/>
    <!-- Eyes — wide, shining (the tell of an excited storyteller) -->
    <ellipse cx="-22" cy="-30" rx="9" ry="6" fill="#fff8e8"/>
    <ellipse cx="-20" cy="-30" rx="5" ry="3.5" fill="#7a5028"/>
    <circle cx="-20" cy="-30" r="2.4" fill="#0a0604"/>
    <ellipse cx="-22" cy="-32" rx="2" ry="1" fill="#fff8e8"/>
    <ellipse cx="22" cy="-30" rx="9" ry="6" fill="#fff8e8"/>
    <ellipse cx="20" cy="-30" rx="5" ry="3.5" fill="#7a5028"/>
    <circle cx="20" cy="-30" r="2.4" fill="#0a0604"/>
    <ellipse cx="18" cy="-32" rx="2" ry="1" fill="#fff8e8"/>
    <!-- Nose -->
    <path d="M0,-22 L-8,4 Q0,8 8,4 Z" fill="#a87858" opacity="0.55"/>
    <!-- Mouth — OPEN mid-word, animated -->
    <ellipse cx="0" cy="22" rx="14" ry="6" fill="#a85838"/>
    <path d="M-14,20 Q0,28 14,20" fill="none" stroke="#5a2818" stroke-width="0.85"/>
    <!-- Teeth -->
    <rect x="-8" y="20" width="16" height="3" fill="#f0e8d8" opacity="0.85"/>
    <!-- Freckles -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="-30" cy="-12" r="1.4"/>
      <circle cx="-20" cy="-6" r="1.4"/>
      <circle cx="0" cy="-10" r="1.2"/>
      <circle cx="20" cy="-6" r="1.4"/>
      <circle cx="30" cy="-12" r="1.4"/>
    </g>
  </g>

  <!-- DIALOGUE BALLOON 1 — Theodore: Well, fairies — the fair folk, the good neighbours, the gentle people... -->
  <g>
    <rect x="14" y="14" width="558" height="58" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,72 L270,72 L262,84 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M262,72 L268,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Well, fairies — the fair folk, the good neighbours, the gentle people —</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">you never call them by their true name, see, or they take offence—</text>

  <!-- DIALOGUE BALLOON 2 — Theodore: They live in hollow hills... -->
  <g>
    <rect x="180" y="86" width="548" height="58" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M380,144 L390,144 L382,156 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M382,144 L388,144" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="188" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="188" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">They live in hollow hills and under bridges and in the spaces between.</text>
  <text x="188" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">They've got courts and kings and queens. Some are kind — the Seelie sort. And some are...</text>

  <!-- DIALOGUE BALLOON 3 — Theodore: ...the other kind. -->
  <g>
    <rect x="520" y="270" width="208" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M580,270 L586,260 L590,270 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M584,270 L588,270" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="528" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="528" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#1a1a1a">...the other kind.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
