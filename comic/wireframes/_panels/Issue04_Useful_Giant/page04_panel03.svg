<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 4 — Panel 3: Jink at gap threshold, addresses Sable inside</title>
  <desc>50mm at fairy scale. Jink stands at threshold of brick gap (a doorway at their scale), facing inward toward dim camp where blue-white shapes watch. Posture squared, jaw set, resolved. Half-lit by warm grey daylight from outside, half by cool blue-white from camp. Threshold between two worlds. Jink: Captain. He found us on his own. He followed Wren's tool marks. / We need to talk to him.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p4p3warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p4p3cool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p4p3brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p4p3jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p4p3emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <radialGradient id="p4p3perim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p4p3bloom"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="p4p3soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <!-- LEFT half: cool camp interior (where Jink looks) -->
  <rect x="0" y="0" width="183" height="364" fill="url(#p4p3cool)"/>
  <!-- RIGHT half: warm daylight (behind Jink) -->
  <rect x="183" y="0" width="183" height="364" fill="url(#p4p3warm)"/>

  <!-- BRICK WALL framing the gap (vertical strip at center showing gap edges) -->
  <rect x="120" y="0" width="20" height="364" fill="url(#p4p3brick)"/>
  <rect x="240" y="0" width="20" height="364" fill="url(#p4p3brick)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="120" y1="60" x2="140" y2="60"/>
    <line x1="120" y1="120" x2="140" y2="120"/>
    <line x1="120" y1="180" x2="140" y2="180"/>
    <line x1="120" y1="240" x2="140" y2="240"/>
    <line x1="120" y1="300" x2="140" y2="300"/>
    <line x1="240" y1="60" x2="260" y2="60"/>
    <line x1="240" y1="120" x2="260" y2="120"/>
    <line x1="240" y1="180" x2="260" y2="180"/>
    <line x1="240" y1="240" x2="260" y2="240"/>
    <line x1="240" y1="300" x2="260" y2="300"/>
  </g>

  <!-- The doorway/gap (between the two brick edges) — Jink stands here -->
  <!-- Far depth visible in cool light -->
  <rect x="140" y="0" width="100" height="364" fill="#1a1a28" opacity="0.85"/>

  <!-- BG: dim camp shapes deep inside (BLURRED) -->
  <g filter="url(#p4p3soft)" opacity="0.85">
    <!-- Sable silhouette standing rigid -->
    <g transform="translate(170 240)">
      <ellipse cx="0" cy="-12" rx="9" ry="10" fill="#9a9098"/>
      <path d="M-9,-4 L-12,16 L12,16 L9,-4 Z" fill="#9a9098"/>
    </g>
    <!-- Wren -->
    <g transform="translate(200 244)">
      <ellipse cx="0" cy="-10" rx="7" ry="8" fill="#a87858"/>
      <path d="M-7,-2 L-9,14 L9,14 L7,-2 Z" fill="#c87a35"/>
    </g>
    <!-- Thresh -->
    <g transform="translate(150 240)">
      <ellipse cx="0" cy="-12" rx="9" ry="10" fill="#a85a48"/>
      <path d="M-9,-4 L-11,16 L11,16 L9,-4 Z" fill="#a83040"/>
    </g>
  </g>

  <!-- HOLOGRAPHIC PERIMETER EMITTERS in BG depth -->
  <g transform="translate(160 280)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="url(#p4p3perim)" filter="url(#p4p3bloom)"/>
    <path d="M-3,-4 L0,-6 L3,-4 L4,0 L2,4 L-2,4 L-4,0 Z" fill="#a8c0e0"/>
    <circle cx="0" cy="0" r="0.85" fill="#fff8e8"/>
  </g>
  <g transform="translate(220 280)">
    <ellipse cx="0" cy="0" rx="12" ry="9" fill="url(#p4p3perim)" filter="url(#p4p3bloom)" opacity="0.85"/>
    <path d="M-3,-4 L0,-6 L3,-4 L4,0 L2,4 L-2,4 L-4,0 Z" fill="#a8c0e0"/>
  </g>

  <!-- Cool wash bleeding from camp toward Jink -->
  <ellipse cx="180" cy="240" rx="120" ry="100" fill="#a8c0e0" opacity="0.18" filter="url(#p4p3bloom)"/>

  <!-- Distant brick interior wall -->
  <rect x="140" y="40" width="100" height="160" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.35" opacity="0.45">
    <line x1="140" y1="80" x2="240" y2="80"/>
    <line x1="140" y1="120" x2="240" y2="120"/>
    <line x1="140" y1="160" x2="240" y2="160"/>
  </g>

  <!-- JINK — at threshold, three-quarter back, facing into camp (LEFT) -->
  <g transform="translate(190 290)">
    <ellipse cx="0" cy="40" rx="22" ry="3" fill="#0a0604" opacity="0.7"/>

    <!-- Legs -->
    <path d="M-12,-44 L-16,40 L-6,42 L-2,-44 Z" fill="url(#p4p3emerald)"/>
    <path d="M2,-44 L6,42 L16,40 L12,-44 Z" fill="url(#p4p3emerald)"/>
    <ellipse cx="-12" cy="42" rx="6" ry="2" fill="#1a4830"/>
    <ellipse cx="12" cy="42" rx="6" ry="2" fill="#1a4830"/>
    <!-- Hologram seams -->
    <line x1="-15" y1="-40" x2="-17" y2="38" stroke="#9aff9a" stroke-width="0.85" opacity="0.85"/>
    <line x1="15" y1="-40" x2="17" y2="38" stroke="#9aff9a" stroke-width="0.85" opacity="0.85"/>
    <!-- Dust at knees -->
    <ellipse cx="-12" cy="-12" rx="4" ry="1" fill="#7a6858" opacity="0.45"/>
    <ellipse cx="12" cy="-12" rx="4" ry="1" fill="#7a6858" opacity="0.45"/>

    <!-- Torso (back view, slightly turned) -->
    <path d="M-22,-94 L-26,-44 L26,-44 L22,-94 Z" fill="url(#p4p3emerald)"/>
    <!-- Shoulders (BACK) -->
    <path d="M-22,-94 Q-30,-104 -22,-110 L-12,-108 L-16,-90 Z" fill="url(#p4p3emerald)"/>
    <path d="M22,-94 Q30,-104 22,-110 L12,-108 L16,-90 Z" fill="url(#p4p3emerald)"/>

    <!-- WING-PACK on back (VISIBLE — back angle) -->
    <g>
      <!-- Pack housing -->
      <path d="M-16,-90 L-12,-66 L12,-66 L16,-90 Z" fill="#1a5a38"/>
      <!-- Geometric lattice nodes -->
      <line x1="-12" y1="-86" x2="12" y2="-86" stroke="#9aff9a" stroke-width="0.85" opacity="0.85"/>
      <line x1="-10" y1="-78" x2="10" y2="-78" stroke="#9aff9a" stroke-width="0.7" opacity="0.7"/>
      <line x1="0" y1="-90" x2="0" y2="-66" stroke="#9aff9a" stroke-width="0.85" opacity="0.85"/>
      <!-- Power nodes -->
      <circle cx="-8" cy="-78" r="1.6" fill="#d8ffe8" filter="url(#p4p3bloom)"/>
      <circle cx="8" cy="-78" r="1.6" fill="#d8ffe8" filter="url(#p4p3bloom)"/>
      <circle cx="0" cy="-72" r="1.4" fill="#d8ffe8" filter="url(#p4p3bloom)"/>
    </g>

    <!-- Arms at sides, back of arms visible -->
    <path d="M-22,-94 Q-30,-78 -26,-50 L-20,-52 Q-22,-78 -18,-92 Z" fill="url(#p4p3emerald)"/>
    <path d="M22,-94 Q30,-78 26,-50 L20,-52 Q22,-78 18,-92 Z" fill="url(#p4p3emerald)"/>
    <ellipse cx="-22" cy="-50" rx="3.5" ry="2.4" fill="url(#p4p3jinkSkin)"/>
    <ellipse cx="22" cy="-50" rx="3.5" ry="2.4" fill="url(#p4p3jinkSkin)"/>

    <!-- Head — three-quarter back, slightly turned -->
    <ellipse cx="0" cy="-122" rx="13" ry="15" fill="url(#p4p3jinkSkin)"/>
    <!-- HAIR — wild golden curls (back) -->
    <g fill="#d8a838">
      <circle cx="-10" cy="-130" r="4"/>
      <circle cx="-2" cy="-134" r="4.5"/>
      <circle cx="6" cy="-132" r="4"/>
      <circle cx="11" cy="-126" r="3.4"/>
      <circle cx="-12" cy="-124" r="3"/>
      <circle cx="14" cy="-118" r="2.6"/>
      <circle cx="-14" cy="-118" r="2.4"/>
      <circle cx="-4" cy="-138" r="2.6"/>
      <circle cx="4" cy="-138" r="2.6"/>
      <!-- Highlights from cool side -->
      <ellipse cx="-10" cy="-130" rx="1.4" ry="0.85" fill="#a8c0e0" opacity="0.65"/>
      <ellipse cx="-2" cy="-134" rx="1.6" ry="0.85" fill="#a8c0e0" opacity="0.65"/>
      <!-- Highlights from warm side -->
      <ellipse cx="11" cy="-126" rx="1.2" ry="0.7" fill="#fff8e8" opacity="0.7"/>
    </g>
    <!-- Ear (right) -->
    <ellipse cx="11" cy="-122" rx="2.4" ry="3.4" fill="url(#p4p3jinkSkin)"/>
    <!-- Hint of profile (cheek + jawline) -->
    <path d="M11,-118 L14,-110 L11,-108 Z" fill="url(#p4p3jinkSkin)"/>
    <!-- Eye visible (right side, looking into camp) -->
    <ellipse cx="6" cy="-122" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="7" cy="-122" r="0.6" fill="#0a0604"/>
    <!-- Set jaw -->
    <path d="M5,-110 L11,-110" stroke="#3a1808" stroke-width="0.7"/>
    <!-- LIGHT SPLIT on Jink — left side cool, right side warm -->
    <path d="M-14,-130 L-10,-100 Q-12,-66 -22,-50 L-20,-50 L-14,-110 Z" fill="#a8c0e0" opacity="0.3"/>
    <path d="M14,-130 L10,-100 Q12,-66 22,-50 L20,-50 L14,-110 Z" fill="#d8c8a8" opacity="0.35"/>
  </g>

  <!-- DIALOGUE — Jink: Captain. He found us on his own. He followed Wren's tool marks. -->
  <g>
    <rect x="14" y="14" width="338" height="58" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,72 L190,72 L182,84 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M182,72 L188,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Captain. He found us on his own.</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">He followed Wren's tool marks.</text>

  <!-- DIALOGUE — Jink: We need to talk to him. -->
  <g>
    <rect x="14" y="86" width="218" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,130 L130,130 L122,142 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M122,130 L128,130" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">We need to talk to him.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 180,82 Q300,84 366,80"/>
    <path d="M0,260 Q60,262 180,258 Q300,256 366,260"/>
  </g>
</svg>
