<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 10 — Panel 1: SPLIT COMPOSITION — Sable below + Theodore through gap above, final conditions</title>
  <desc>50mm split composition. Top half: Theodore's face through gap looking down, solemn nodding. Bottom half: Sable from BEHIND, silver-white hair bright against dark camp, rigid posture, looking up. Gap = boundary line between warm (above) and cool (below). Sable: Three. We are not fairies. We are not magic. We are soldiers, stranded, trying to get home. You do not make us into a story. / Theodore (nodding, each nod enormous): Yes, ma'am. / Sable: And understand this. If you compromise us — if you tell, or lead someone here, or put this squad at risk— / We disappear. And we take your memory of us with us.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p1bgTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p10p1bgBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p10p1floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p10p1theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p10p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p10p1darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p10p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p10p1hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <radialGradient id="p10p1cradleGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p1bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- TOP HALF: Theodore's world (warm grey daylight) -->
  <rect x="0" y="0" width="742" height="180" fill="url(#p10p1bgTop)"/>

  <!-- BOTTOM HALF: camp interior (cool dark) -->
  <rect x="0" y="184" width="742" height="180" fill="url(#p10p1bgBot)"/>
  <rect x="0" y="184" width="742" height="180" fill="url(#p10p1cradleGlow)"/>

  <!-- The GAP / FLOORBOARD BOUNDARY across center -->
  <rect x="0" y="174" width="742" height="20" fill="url(#p10p1floorboard)"/>
  <rect x="0" y="174" width="742" height="2" fill="#1a0c04"/>
  <rect x="0" y="192" width="742" height="2" fill="#1a0c04"/>

  <!-- TOP: THEODORE'S FACE through gap, looking down (solemn) -->
  <g transform="translate(371 90)">
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="180" ry="120" fill="url(#p10p1theoSkin)"/>
    <!-- HAIR -->
    <g fill="url(#p10p1theoHair)">
      <path d="M-180,-100 Q-100,-130 0,-130 Q100,-130 180,-100 L160,-80 Q80,-100 0,-100 Q-80,-100 -160,-80 Z"/>
      <!-- Falling forward strands -->
      <path d="M-100,-80 Q-98,-50 -90,-30 L-80,-32 Q-92,-50 -96,-80 Z"/>
      <path d="M-40,-90 Q-38,-50 -30,-20 L-22,-22 Q-32,-50 -36,-90 Z"/>
      <path d="M30,-90 Q32,-50 40,-20 L48,-22 Q38,-50 34,-90 Z"/>
      <path d="M90,-80 Q92,-50 100,-30 L110,-32 Q98,-50 94,-80 Z"/>
    </g>

    <!-- Eyebrows -->
    <path d="M-66,-44 Q-30,-56 -10,-50" stroke="#5a4030" stroke-width="3" fill="none"/>
    <path d="M10,-50 Q30,-56 66,-44" stroke="#5a4030" stroke-width="3" fill="none"/>

    <!-- Eyes — looking DOWN, solemn -->
    <ellipse cx="-40" cy="-22" rx="14" ry="6" fill="#fff8e8"/>
    <ellipse cx="-38" cy="-22" rx="8" ry="4.5" fill="#7a5028"/>
    <circle cx="-38" cy="-22" r="3.5" fill="#0a0604"/>
    <ellipse cx="-40" cy="-24" rx="2" ry="1" fill="#fff8e8"/>
    <ellipse cx="40" cy="-22" rx="14" ry="6" fill="#fff8e8"/>
    <ellipse cx="42" cy="-22" rx="8" ry="4.5" fill="#7a5028"/>
    <circle cx="42" cy="-22" r="3.5" fill="#0a0604"/>
    <ellipse cx="40" cy="-24" rx="2" ry="1" fill="#fff8e8"/>

    <!-- Nose -->
    <path d="M0,-12 L-10,16 Q0,20 10,16 Z" fill="#a87858" opacity="0.55"/>

    <!-- Mouth — closed, serious (between nods) -->
    <path d="M-26,42 Q0,46 26,42" fill="none" stroke="#5a2818" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Freckles -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="-50" cy="0" r="1.6"/>
      <circle cx="-30" cy="6" r="1.4"/>
      <circle cx="-10" cy="0" r="1.4"/>
      <circle cx="10" cy="0" r="1.4"/>
      <circle cx="30" cy="6" r="1.4"/>
      <circle cx="50" cy="0" r="1.6"/>
    </g>

    <!-- Cool light tinge on lower face from camp glow below -->
    <path d="M-160,60 Q0,90 160,60 L150,90 Q0,110 -150,90 Z" fill="#a8c0e0" opacity="0.3"/>
  </g>

  <!-- BOTTOM: SABLE FROM BEHIND, silver-white hair bright against dark -->
  <g transform="translate(371 280)">
    <!-- Hip + legs hint (back view) -->
    <path d="M-26,80 L-30,120 L-12,124 L-2,80 Z" fill="url(#p10p1silver)"/>
    <path d="M2,80 L12,124 L30,120 L26,80 Z" fill="url(#p10p1silver)"/>
    <ellipse cx="-22" cy="124" rx="6" ry="2" fill="#3a3838"/>
    <ellipse cx="22" cy="124" rx="6" ry="2" fill="#3a3838"/>

    <!-- Torso BACK -->
    <path d="M-44,0 L-50,80 L50,80 L44,0 Z" fill="url(#p10p1silver)"/>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#7a7080" stroke-width="0.85"/>
    <!-- SOOT BLOOM right shoulder (her right = our left in back view) -->
    <ellipse cx="-32" cy="0" rx="14" ry="9" fill="#3a3038" opacity="0.75"/>

    <!-- Shoulders BACK -->
    <path d="M-44,0 Q-54,-20 -44,-30 L-32,-30 L-36,-4 Z" fill="url(#p10p1silver)"/>
    <path d="M44,0 Q54,-20 44,-30 L32,-30 L36,-4 Z" fill="url(#p10p1silver)"/>
    <!-- Hologram seams -->
    <circle cx="-32" cy="-16" r="2" fill="#fff8e8" filter="url(#p10p1bloom)"/>
    <circle cx="32" cy="-16" r="2" fill="#fff8e8" filter="url(#p10p1bloom)"/>

    <!-- Arms at sides (back view) -->
    <path d="M-44,0 Q-54,40 -50,80 L-42,80 Q-46,40 -38,0 Z" fill="url(#p10p1silver)"/>
    <path d="M44,0 Q54,40 50,80 L42,80 Q46,40 38,0 Z" fill="url(#p10p1silver)"/>

    <!-- HEAD — back of head, silver-white BUZZ visible bright -->
    <ellipse cx="0" cy="-66" rx="22" ry="26" fill="url(#p10p1darkSkin)"/>
    <g fill="url(#p10p1hair)">
      <!-- Back of skull buzz -->
      <path d="M-22,-90 Q-22,-86 0,-86 Q22,-86 22,-90 L20,-66 Q14,-72 0,-72 Q-14,-72 -20,-66 Z"/>
      <!-- Buzz texture (back) -->
      <g stroke="#dad5d0" stroke-width="0.5" opacity="0.7">
        <line x1="-18" y1="-84" x2="-18" y2="-78"/>
        <line x1="-12" y1="-86" x2="-12" y2="-80"/>
        <line x1="-6" y1="-88" x2="-6" y2="-82"/>
        <line x1="0" y1="-88" x2="0" y2="-82"/>
        <line x1="6" y1="-88" x2="6" y2="-82"/>
        <line x1="12" y1="-86" x2="12" y2="-80"/>
        <line x1="18" y1="-84" x2="18" y2="-78"/>
      </g>
    </g>
    <!-- WARM RIM LIGHT from gap above on top of head -->
    <path d="M-22,-90 Q0,-95 22,-90" fill="none" stroke="#e8d8b8" stroke-width="2" opacity="0.85" filter="url(#p10p1bloom)"/>

    <!-- Ears -->
    <ellipse cx="-22" cy="-66" rx="3" ry="6" fill="url(#p10p1darkSkin)"/>
    <ellipse cx="22" cy="-66" rx="3" ry="6" fill="url(#p10p1darkSkin)"/>
    <!-- Cool light on lower body -->
    <path d="M-50,80 L50,80 L46,100 L-46,100 Z" fill="#a8c0e0" opacity="0.18"/>
  </g>

  <!-- DIALOGUE — Sable: Three. We are not fairies. ... story. -->
  <g>
    <rect x="14" y="14" width="558" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,58 L266,68 L272,58 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M264,58 L270,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Three. We are not fairies. We are not magic. We are soldiers, stranded, trying to get home. You do not make us into a story.</text>

  <!-- DIALOGUE — Theodore: Yes, ma'am. -->
  <g>
    <rect x="588" y="74" width="138" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M620,118 L630,118 L622,130 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M622,118 L628,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="596" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="596" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Yes, ma'am.</text>

  <!-- DIALOGUE — Sable: And understand this. If you compromise us... -->
  <g>
    <rect x="14" y="280" width="404" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,280 L186,270 L190,280 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M184,280 L188,280" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">And understand this. If you compromise us — if you tell, or lead someone here...</text>

  <!-- DIALOGUE — Sable: We disappear. And we take your memory of us with us. -->
  <g>
    <rect x="14" y="332" width="500" height="26" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2.4" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">We disappear. And we take your memory of us with us.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
