<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 4 — Page 13 — Panel 4: Wren CU impatient — does any of this help fix the drive</title>
  <desc>CU Wren. Working on cradle in lap, looks up impatiently. Wren: Does any of this help us fix the drive? / No? Then I'm busy.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p13p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p13p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p13p4cellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p4bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="241" height="364" fill="url(#p13p4bg)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="241" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- WREN CU — leaning over the cradle she's modifying -->
  <g transform="translate(120 240)">
    <!-- Shoulders -->
    <path d="M-70,90 L-70,40 L70,40 L70,90 Z" fill="url(#p13p4suit)"/>
    <path d="M-70,40 Q-40,16 0,10 Q40,16 70,40 L60,52 L-60,52 Z" fill="url(#p13p4suit)"/>
    <ellipse cx="-50" cy="20" rx="10" ry="6" fill="#1a0c04" opacity="0.75"/>
    <circle cx="-30" cy="46" r="1.6" fill="#ffd888" filter="url(#p13p4bloom)"/>
    <circle cx="30" cy="46" r="1.6" fill="#ffd888" filter="url(#p13p4bloom)"/>

    <!-- Hands holding cradle (visible at frame edge) -->
    <ellipse cx="-26" cy="50" rx="10" ry="5" fill="url(#p13p4skin)"/>
    <ellipse cx="26" cy="50" rx="10" ry="5" fill="url(#p13p4skin)"/>
    <ellipse cx="-26" cy="50" rx="5" ry="2" fill="#1a0c04" opacity="0.5"/>
    <ellipse cx="26" cy="50" rx="5" ry="2" fill="#1a0c04" opacity="0.5"/>
    <!-- Cradle hint between hands -->
    <ellipse cx="0" cy="56" rx="20" ry="10" fill="url(#p13p4cellGlow)" filter="url(#p13p4bloom)" opacity="0.65"/>
    <path d="M-12,52 Q-13,58 -8,60 L8,60 Q13,58 12,52" fill="none" stroke="#c89858" stroke-width="2"/>
    <ellipse cx="0" cy="56" rx="6" ry="4" fill="#a8c0e0" opacity="0.85"/>
    <ellipse cx="0" cy="56" rx="2" ry="1.4" fill="#fff8e8"/>

    <!-- Head — looking up FROM her work -->
    <ellipse cx="0" cy="-60" rx="36" ry="44" fill="url(#p13p4skin)"/>
    <path d="M-32,-12 Q-28,20 -10,30 L8,30 Q26,20 30,-2 L26,-12 Z" fill="url(#p13p4skin)"/>
    <g fill="#1a0c04">
      <path d="M-32,-94 Q-32,-106 -2,-108 Q26,-106 26,-94 L24,-86 Q12,-98 -2,-98 Q-22,-98 -30,-86 Z"/>
      <ellipse cx="-2" cy="-118" rx="14" ry="11"/>
      <path d="M-26,-94 Q-30,-86 -26,-76" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
      <path d="M22,-94 Q26,-86 22,-76" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
    </g>

    <!-- BROWS — drawn down, IMPATIENT/SKEPTICAL -->
    <path d="M-22,-72 L-8,-76" stroke="#1a0c04" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0,-76 L18,-72" stroke="#1a0c04" stroke-width="2.4" stroke-linecap="round"/>

    <!-- EYES — narrowed -->
    <ellipse cx="-12" cy="-64" rx="4.5" ry="2.4" fill="#fff8e8"/>
    <ellipse cx="-12" cy="-64" rx="2.6" ry="1.6" fill="#3a2010"/>
    <circle cx="-12" cy="-64" r="1.4" fill="#0a0604"/>
    <ellipse cx="10" cy="-64" rx="4.5" ry="2.4" fill="#fff8e8"/>
    <ellipse cx="10" cy="-64" rx="2.6" ry="1.6" fill="#3a2010"/>
    <circle cx="10" cy="-64" r="1.4" fill="#0a0604"/>

    <!-- NOSE -->
    <path d="M-2,-58 L-4,-46 Q-2,-44 2,-46 L0,-58 Z" fill="#a87858" opacity="0.65"/>

    <!-- MOUTH — pressed thin (irritated) -->
    <path d="M-12,-30 L8,-32" stroke="#3a1808" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- DIALOGUE — Wren: Does any of this help us fix the drive? -->
  <g>
    <rect x="14" y="14" width="216" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,58 L130,58 L122,70 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M122,58 L128,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Does any of this help us fix the drive?</text>

  <!-- DIALOGUE — Wren: No? Then I'm busy. -->
  <g>
    <rect x="14" y="74" width="156" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M40,118 L50,118 L42,130 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M42,118 L48,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">No? Then I'm busy.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 241,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 241,300"/>
  </g>
</svg>
