<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 8 — Panel 1: Sable warns of civilian-child risk, Wren counters</title>
  <desc>MCU. Sable rigid arguing with Wren. Cool blue-white camp light + warm rim. Sable: He is a civilian child. In a city full of people he talks to. We put our survival in his hands and he tells one friend — ONE — and we are done. / Wren: He hasn't told anyone yet. / Sable: You do not know that.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p8p1darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p8p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p8p1hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="p8p1wrenSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p8p1copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p8p1coolWash" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p8p1warmRim" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p8p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p8p1bg)"/>
  <rect width="366" height="364" fill="url(#p8p1coolWash)"/>
  <rect width="366" height="364" fill="url(#p8p1warmRim)"/>

  <!-- Brick BG -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
  </g>

  <!-- WREN BG (slightly soft, right side) -->
  <g transform="translate(280 250)" opacity="0.85">
    <ellipse cx="0" cy="40" rx="14" ry="2.5" fill="#0a0604" opacity="0.6"/>
    <path d="M-7,-2 L-10,38 L-3,40 L-1,-2 Z" fill="url(#p8p1copper)"/>
    <path d="M1,-2 L3,40 L10,38 L7,-2 Z" fill="url(#p8p1copper)"/>
    <path d="M-13,-30 L-15,-2 L15,-2 L13,-30 Z" fill="url(#p8p1copper)"/>
    <ellipse cx="-13" cy="-28" rx="4" ry="3" fill="#1a0c04" opacity="0.75"/>
    <path d="M-15,-30 Q-19,-38 -13,-42 L-7,-40 Z" fill="url(#p8p1copper)"/>
    <path d="M15,-30 Q19,-38 13,-42 L7,-40 Z" fill="url(#p8p1copper)"/>
    <!-- Arms folded -->
    <path d="M-15,-26 Q-16,-18 -8,-14 L8,-16 Q16,-20 15,-26 L8,-24 Q-2,-18 -8,-24 Z" fill="url(#p8p1copper)"/>
    <ellipse cx="-6" cy="-18" rx="5" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="6" cy="-18" rx="5" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="0" cy="-46" rx="8" ry="10" fill="url(#p8p1wrenSkin)"/>
    <g fill="#1a0c04">
      <path d="M-7,-53 Q-8,-60 0,-61 Q8,-60 7,-53 L5,-48 Q2,-54 -2,-54 Q-5,-54 -7,-48 Z"/>
      <ellipse cx="0" cy="-64" rx="5" ry="4"/>
    </g>
    <ellipse cx="-3" cy="-46" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-46" r="0.6" fill="#1a0c04"/>
    <ellipse cx="3" cy="-46" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-46" r="0.6" fill="#1a0c04"/>
    <path d="M-3,-40 Q0,-39 3,-40" fill="none" stroke="#3a2010" stroke-width="0.55"/>
  </g>

  <!-- SABLE foreground left -->
  <g transform="translate(120 280)">
    <ellipse cx="0" cy="60" rx="22" ry="3.5" fill="#0a0604" opacity="0.7"/>

    <!-- Body — torso fills lower frame -->
    <path d="M-50,60 L-50,0 L50,0 L50,60 Z" fill="url(#p8p1silver)"/>
    <path d="M-50,0 Q-30,-22 0,-30 Q30,-22 50,0 L40,12 L-40,12 Z" fill="url(#p8p1silver)"/>
    <line x1="0" y1="-12" x2="0" y2="60" stroke="#5a5860" stroke-width="0.85"/>
    <ellipse cx="40" cy="-20" rx="14" ry="9" fill="#3a3038" opacity="0.75"/>
    <circle cx="-22" cy="-20" r="1.6" fill="#fff8e8" filter="url(#p8p1bloom)"/>
    <circle cx="22" cy="-20" r="1.6" fill="#fff8e8" filter="url(#p8p1bloom)"/>

    <!-- Right arm gesturing forward (emphasizing point) -->
    <g transform="translate(50 -18)">
      <path d="M0,8 Q30,-2 56,4 L52,14 Q26,8 4,16 Z" fill="url(#p8p1silver)"/>
      <ellipse cx="58" cy="6" rx="5" ry="3" fill="url(#p8p1darkSkin)"/>
      <!-- Pointing finger -->
      <path d="M62,4 L82,2 Q86,4 86,8 L82,12 L64,12 Z" fill="url(#p8p1darkSkin)"/>
    </g>

    <!-- Left arm at side -->
    <path d="M-50,0 Q-58,30 -50,60 L-42,60 Q-46,30 -42,0 Z" fill="url(#p8p1silver)"/>

    <!-- HEAD -->
    <g transform="translate(-30 -50)">
      <ellipse cx="0" cy="0" rx="32" ry="38" fill="url(#p8p1darkSkin)"/>
      <path d="M-30,-4 Q-26,18 -10,32 L4,34 Q22,30 30,12 L26,-4 Z" fill="url(#p8p1darkSkin)"/>
      <ellipse cx="22" cy="0" rx="4" ry="7" fill="url(#p8p1darkSkin)"/>
      <ellipse cx="22" cy="0" rx="2" ry="4" fill="#3a2010" opacity="0.5"/>
      <g fill="url(#p8p1hair)">
        <path d="M-30,-30 Q-30,-42 -2,-46 Q24,-42 24,-30 L22,-22 Q12,-32 -2,-32 Q-22,-32 -28,-22 Z"/>
        <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
          <line x1="-22" y1="-38" x2="-22" y2="-34"/>
          <line x1="-12" y1="-42" x2="-12" y2="-38"/>
          <line x1="-2" y1="-44" x2="-2" y2="-40"/>
          <line x1="10" y1="-40" x2="10" y2="-36"/>
          <line x1="20" y1="-36" x2="20" y2="-32"/>
        </g>
      </g>
      <path d="M-22,-12 L-8,-16" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,-16 L18,-12" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="-14" cy="-4" rx="4" ry="2" fill="#fff8e8"/>
      <ellipse cx="-12" cy="-4" rx="2.4" ry="1.6" fill="#3a2010"/>
      <circle cx="-12" cy="-4" r="1.2" fill="#0a0604"/>
      <ellipse cx="6" cy="-4" rx="3.5" ry="2" fill="#fff8e8"/>
      <ellipse cx="8" cy="-4" rx="2" ry="1.4" fill="#3a2010"/>
      <circle cx="8" cy="-4" r="1.1" fill="#0a0604"/>
      <path d="M-6,0 L-4,18 Q-2,22 0,22 L4,20 L0,2 Z" fill="url(#p8p1darkSkin)"/>
      <path d="M-14,32 L8,30" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- DIALOGUE — Sable: He is a civilian child... -->
  <g>
    <rect x="14" y="14" width="338" height="76" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,90 L130,90 L122,104 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M122,90 L128,90" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">He is a civilian child. In a city full of people he talks</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">to. We put our survival in his hands and he tells one</text>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">friend — <tspan font-weight="700">ONE</tspan> — and we are done.</text>

  <!-- DIALOGUE — Wren: He hasn't told anyone yet. -->
  <g>
    <rect x="180" y="106" width="172" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M218,150 L228,150 L220,162 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M220,150 L226,150" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="188" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="188" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">He hasn't told anyone yet.</text>

  <!-- DIALOGUE — Sable: You do not know that. -->
  <g>
    <rect x="14" y="166" width="160" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M40,210 L50,210 L42,222 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M42,210 L48,210" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">You do not know that.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 366,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 366,300"/>
  </g>
</svg>
