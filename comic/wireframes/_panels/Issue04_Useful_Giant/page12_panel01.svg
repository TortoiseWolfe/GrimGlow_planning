<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 12 — Panel 1: Sable announces, Jink interjects, Sable rebukes</title>
  <desc>50mm medium wide. Sable center-left, formal announcement posture. Jink right, half-grin breaking through. Sable: The boy stays. Under conditions. / Jink: Finally. / Sable: Do not test me, Scout.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p12p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p12p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p12p1darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p12p1jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p12p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p12p1emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <linearGradient id="p12p1hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <radialGradient id="p12p1coolWash" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p12p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p12p1bg)"/>
  <rect width="742" height="364" fill="url(#p12p1coolWash)"/>

  <!-- Brick BG + perimeter glow -->
  <rect x="0" y="40" width="742" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#a8c0e0" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M0,200 L60,198 L62,202 L120,200"/>
    <path d="M620,200 L680,198 L682,202 L742,200"/>
  </g>

  <!-- Beam -->
  <rect x="0" y="280" width="742" height="44" fill="url(#p12p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="742" y2="282"/>
    <line x1="0" y1="320" x2="742" y2="320"/>
  </g>

  <!-- SABLE — left of center, formal posture -->
  <g transform="translate(280 282)">
    <ellipse cx="0" cy="0" rx="20" ry="3.5" fill="#0a0604" opacity="0.7"/>
    <path d="M-8,-50 L-12,-2 L-3,0 L-1,-50 Z" fill="url(#p12p1silver)"/>
    <path d="M1,-50 L3,0 L12,-2 L8,-50 Z" fill="url(#p12p1silver)"/>
    <ellipse cx="-8" cy="-26" rx="3" ry="0.85" fill="#7a7080" opacity="0.5"/>
    <ellipse cx="8" cy="-26" rx="3" ry="0.85" fill="#7a7080" opacity="0.5"/>
    <path d="M-14,-86 L-16,-50 L16,-50 L14,-86 Z" fill="url(#p12p1silver)"/>
    <ellipse cx="14" cy="-84" rx="6" ry="4" fill="#3a3038" opacity="0.75"/>
    <path d="M-16,-86 Q-22,-94 -16,-100 L-9,-100 Z" fill="url(#p12p1silver)"/>
    <path d="M16,-86 Q22,-94 16,-100 L9,-100 Z" fill="url(#p12p1silver)"/>
    <circle cx="-10" cy="-94" r="1" fill="#fff8e8" filter="url(#p12p1bloom)"/>
    <circle cx="10" cy="-94" r="1" fill="#fff8e8" filter="url(#p12p1bloom)"/>
    <!-- Arms — slightly clasped behind back (formal) -->
    <path d="M-16,-78 Q-26,-58 -22,-44 L-14,-46 Q-14,-58 -10,-76 Z" fill="url(#p12p1silver)"/>
    <path d="M16,-78 Q26,-58 22,-44 L14,-46 Q14,-58 10,-76 Z" fill="url(#p12p1silver)"/>
    <ellipse cx="-22" cy="-44" rx="3" ry="2" fill="url(#p12p1darkSkin)"/>
    <ellipse cx="22" cy="-44" rx="3" ry="2" fill="url(#p12p1darkSkin)"/>
    <!-- HEAD — chin up, formal -->
    <ellipse cx="0" cy="-114" rx="11" ry="13" fill="url(#p12p1darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-9,-122 Q-10,-128 0,-130 Q10,-128 9,-122 L7,-117 Q3,-122 -3,-122 Q-7,-122 -9,-117 Z"/>
    </g>
    <ellipse cx="-3" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-114" r="0.6" fill="#0a0604"/>
    <ellipse cx="3" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-114" r="0.6" fill="#0a0604"/>
    <path d="M-7,-118 L-1,-119" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M1,-119 L7,-118" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M-3,-108 L3,-108" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- JINK — right of center, half-grin -->
  <g transform="translate(540 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p12p1emerald)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p12p1emerald)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p12p1emerald)"/>
    <path d="M-9,-72 Q-2,-66 5,-72 Q-2,-58 -8,-54 Z" fill="#3a2818" opacity="0.7"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p12p1emerald)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p12p1emerald)"/>
    <circle cx="-10" cy="-86" r="1" fill="#9aff9a" filter="url(#p12p1bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#9aff9a" filter="url(#p12p1bloom)"/>
    <!-- Arms relaxed -->
    <path d="M-15,-76 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p12p1emerald)"/>
    <path d="M15,-76 Q22,-58 16,-44 L10,-46 Q12,-58 10,-74 Z" fill="url(#p12p1emerald)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p12p1jinkSkin)"/>
    <ellipse cx="15" cy="-44" rx="2.4" ry="1.4" fill="url(#p12p1jinkSkin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p12p1jinkSkin)"/>
    <g fill="#d8a838">
      <circle cx="-9" cy="-114" r="3.5"/>
      <circle cx="-2" cy="-118" r="4"/>
      <circle cx="6" cy="-114" r="3.5"/>
      <circle cx="-12" cy="-110" r="2.4"/>
      <circle cx="12" cy="-110" r="2.4"/>
    </g>
    <ellipse cx="-4" cy="-104" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="-4" cy="-104" r="0.6" fill="#1a4830"/>
    <ellipse cx="4" cy="-104" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="4" cy="-104" r="0.6" fill="#1a4830"/>
    <!-- HALF-GRIN -->
    <path d="M-5,-96 Q0,-94 7,-98" fill="none" stroke="#3a1808" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- DIALOGUE — Sable: The boy stays. Under conditions. -->
  <g>
    <rect x="14" y="14" width="240" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,58 L130,58 L122,70 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M122,58 L128,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">The boy stays. Under conditions.</text>

  <!-- DIALOGUE — Jink: Finally. -->
  <g>
    <rect x="608" y="74" width="120" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M626,118 L636,118 L628,130 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M628,118 L634,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="616" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="616" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#1a1a1a">Finally.</text>

  <!-- DIALOGUE — Sable: Do not test me, Scout. -->
  <g>
    <rect x="14" y="134" width="200" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M40,178 L50,178 L42,190 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M42,178 L48,178" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Do not test me, Scout.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
