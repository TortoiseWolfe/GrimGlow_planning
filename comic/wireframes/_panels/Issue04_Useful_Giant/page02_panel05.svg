<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 2 — Panel 5: Sable's face, controlled fury, raised fist HOLD signal</title>
  <desc>85mm close-up. Sable's face inside dim wall cavity camp. Dark brown skin, sharp angular features, military-cropped silver-white hair. Controlled fury behind professional composure — jaw set so hard muscles visible, eyes locked on gap. One hand raised in HOLD fist. Silver suit shows soot bloom on right shoulder, dust on forearms. Cool blue-white holographic light casts geometric pattern across left side of face. Sable: Nobody. Move.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p2p5cavityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a28"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="p2p5skinS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p2p5suitS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="50%" stop-color="#a8a0a0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p2p5hairS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <radialGradient id="p2p5coolGlow" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#a8c0e0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p5warmRim" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#a89888" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p5bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- BG cavity dark -->
  <rect width="366" height="364" fill="url(#p2p5cavityBg)"/>

  <!-- Cool blue-white wash from left (camp interior) -->
  <rect width="366" height="364" fill="url(#p2p5coolGlow)"/>
  <!-- Warm rim wash from right -->
  <rect width="366" height="364" fill="url(#p2p5warmRim)"/>

  <!-- Distant rough brick interior wall (soft) -->
  <rect x="0" y="40" width="366" height="180" fill="#2a1810" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
  </g>
  <!-- Geometric ward line pattern on wall (perimeter glow) -->
  <g stroke="#a8c0e0" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M0,160 L40,158 L42,162 L80,160"/>
    <path d="M0,220 L60,218 L62,222 L120,220"/>
  </g>

  <!-- HOLOGRAPHIC PERIMETER EMITTER deep BG (left) -->
  <g transform="translate(40 200)">
    <ellipse cx="0" cy="0" rx="32" ry="24" fill="#a8c0e0" filter="url(#p2p5bloom)" opacity="0.45"/>
    <path d="M-6,-9 L0,-13 L6,-9 L9,0 L5,9 L-5,9 L-9,0 Z" fill="#c0d8f0" opacity="0.85"/>
    <circle cx="0" cy="0" r="2.2" fill="#fff8e8"/>
  </g>

  <!-- SABLE — close-up, head + shoulders, three-quarter facing left -->
  <g transform="translate(180 220)">
    <!-- RAISED FIST (HOLD signal) — left side of frame, at shoulder level -->
    <g transform="translate(-130 -90)">
      <!-- Forearm extending up -->
      <path d="M-16,30 L-12,-12 Q-2,-20 8,-12 L12,30 Z" fill="url(#p2p5suitS)"/>
      <!-- Suit seam -->
      <line x1="0" y1="-12" x2="0" y2="28" stroke="#7a7080" stroke-width="0.5" opacity="0.7"/>
      <!-- Holographic accent at wrist seam -->
      <circle cx="0" cy="20" r="1.6" fill="#e8f0ff" filter="url(#p2p5bloom)"/>
      <!-- THE FIST -->
      <ellipse cx="0" cy="-22" rx="13" ry="11" fill="url(#p2p5skinS)"/>
      <!-- Knuckles -->
      <g fill="#7a4838">
        <ellipse cx="-8" cy="-30" rx="3" ry="2"/>
        <ellipse cx="-2" cy="-32" rx="3" ry="2"/>
        <ellipse cx="4" cy="-32" rx="3" ry="2"/>
        <ellipse cx="9" cy="-30" rx="2.5" ry="1.8"/>
      </g>
      <!-- Knuckle highlights -->
      <g fill="#9a6848">
        <ellipse cx="-8" cy="-32" rx="1.5" ry="0.8"/>
        <ellipse cx="-2" cy="-34" rx="1.5" ry="0.8"/>
        <ellipse cx="4" cy="-34" rx="1.5" ry="0.8"/>
      </g>
      <!-- Knuckle creases -->
      <path d="M-12,-22 Q0,-18 12,-22" fill="none" stroke="#3a2010" stroke-width="0.7"/>
      <!-- Thumb wrapped over -->
      <path d="M12,-22 Q14,-12 8,-6 L4,-12 Q8,-18 10,-22 Z" fill="url(#p2p5skinS)"/>
      <!-- Cool light on fist (camp side) -->
      <path d="M-12,-30 L-12,-12 Q-8,-14 -8,-30 Z" fill="#a8c0e0" opacity="0.35"/>
    </g>

    <!-- LEFT shoulder + suit (with SOOT BLOOM on right shoulder = our left in three-quarter view) -->
    <path d="M-100,40 L-100,140 L100,140 L80,40 Q40,30 0,28 Q-40,30 -80,38 Z" fill="url(#p2p5suitS)"/>
    <!-- Shoulder plates -->
    <path d="M-90,40 Q-80,20 -50,18 L-40,42 Q-70,40 -88,52 Z" fill="url(#p2p5suitS)"/>
    <path d="M90,40 Q80,20 50,18 L40,42 Q70,40 88,52 Z" fill="url(#p2p5suitS)"/>
    <!-- Shoulder seams -->
    <path d="M-90,40 L-50,18" fill="none" stroke="#5a5860" stroke-width="0.85"/>
    <path d="M90,40 L50,18" fill="none" stroke="#5a5860" stroke-width="0.85"/>
    <!-- Center chest seam -->
    <line x1="0" y1="28" x2="0" y2="140" stroke="#5a5860" stroke-width="0.7"/>
    <!-- Department holographic accents at collar + shoulder seams -->
    <circle cx="-30" cy="32" r="2" fill="#fff8e8" filter="url(#p2p5bloom)"/>
    <circle cx="30" cy="32" r="2" fill="#fff8e8" filter="url(#p2p5bloom)"/>
    <line x1="-50" y1="22" x2="-30" y2="32" stroke="#e8f0ff" stroke-width="0.6" opacity="0.7"/>

    <!-- SOOT BLOOM on right shoulder (her right, our left in mirrored close-up — story says right shoulder) -->
    <ellipse cx="60" cy="40" rx="22" ry="12" fill="#3a3038" opacity="0.7"/>
    <ellipse cx="56" cy="44" rx="14" ry="6" fill="#1a1820" opacity="0.55"/>
    <!-- Dust on forearms area (visible at edges) -->
    <ellipse cx="-90" cy="100" rx="14" ry="3" fill="#7a7080" opacity="0.4"/>
    <ellipse cx="90" cy="100" rx="14" ry="3" fill="#7a7080" opacity="0.4"/>

    <!-- HEAD — three-quarter facing the gap (viewer's left) -->
    <ellipse cx="-10" cy="-30" rx="42" ry="48" fill="url(#p2p5skinS)"/>
    <!-- Sharp angular jawline -->
    <path d="M-50,-10 Q-46,16 -32,28 L-8,32 Q14,28 22,12 L20,-10 Z" fill="url(#p2p5skinS)"/>
    <!-- Ear (right, partially visible) -->
    <ellipse cx="22" cy="-26" rx="6" ry="10" fill="url(#p2p5skinS)"/>
    <ellipse cx="22" cy="-26" rx="3" ry="6" fill="#3a2010" opacity="0.5"/>

    <!-- HAIR — silver-white, very short military-cropped, almost buzz-cut -->
    <g fill="url(#p2p5hairS)">
      <path d="M-50,-58 Q-50,-68 -10,-72 Q26,-68 24,-56 L22,-44 Q14,-58 -10,-58 Q-32,-58 -48,-46 Z"/>
      <!-- Buzz-cut texture: very short stubble -->
      <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
        <line x1="-44" y1="-62" x2="-44" y2="-58"/>
        <line x1="-36" y1="-66" x2="-36" y2="-62"/>
        <line x1="-28" y1="-68" x2="-28" y2="-64"/>
        <line x1="-20" y1="-70" x2="-20" y2="-66"/>
        <line x1="-12" y1="-70" x2="-12" y2="-66"/>
        <line x1="-4" y1="-70" x2="-4" y2="-66"/>
        <line x1="4" y1="-68" x2="4" y2="-64"/>
        <line x1="12" y1="-66" x2="12" y2="-62"/>
        <line x1="20" y1="-62" x2="20" y2="-58"/>
      </g>
    </g>
    <!-- Hair edge — top of skull -->
    <path d="M-50,-58 Q-10,-72 24,-56" fill="none" stroke="#a8a098" stroke-width="0.7"/>

    <!-- Cool blue-white geometric light pattern on left side of face -->
    <g opacity="0.45">
      <path d="M-50,-30 L-28,-32 L-26,-26 L-46,-22 Z" fill="#a8c0e0"/>
      <path d="M-46,-10 L-30,-12 L-28,-6 L-46,-2 Z" fill="#a8c0e0"/>
      <path d="M-44,12 L-26,8 L-24,14 L-42,20 Z" fill="#a8c0e0"/>
    </g>

    <!-- EYEBROWS — drawn down, set hard -->
    <path d="M-38,-44 L-22,-48" stroke="#3a3028" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-12,-48 L8,-44" stroke="#3a3028" stroke-width="2.4" stroke-linecap="round"/>

    <!-- EYES — narrowed, locked on gap (viewer's left), cold -->
    <g>
      <!-- Left eye (closer to viewer) -->
      <ellipse cx="-30" cy="-36" rx="6" ry="3.5" fill="#fff8e8"/>
      <ellipse cx="-30" cy="-36" rx="6" ry="2.4" fill="#fff8e8"/>
      <ellipse cx="-29" cy="-36" rx="3" ry="2.4" fill="#3a2010"/>
      <circle cx="-29" cy="-36" r="1.6" fill="#0a0604"/>
      <ellipse cx="-30" cy="-37" rx="0.8" ry="0.5" fill="#fff8e8"/>
      <!-- Right eye (further) -->
      <ellipse cx="-2" cy="-36" rx="5" ry="3" fill="#fff8e8"/>
      <ellipse cx="-1" cy="-36" rx="2.6" ry="2" fill="#3a2010"/>
      <circle cx="-1" cy="-36" r="1.4" fill="#0a0604"/>
      <ellipse cx="-2" cy="-37" rx="0.7" ry="0.5" fill="#fff8e8"/>
    </g>
    <!-- Lower eyelid lines -->
    <path d="M-36,-32 Q-30,-30 -24,-32" fill="none" stroke="#3a2010" stroke-width="0.7"/>
    <path d="M-7,-32 Q-1,-30 4,-32" fill="none" stroke="#3a2010" stroke-width="0.7"/>

    <!-- NOSE — sharp, angular -->
    <path d="M-12,-32 L-8,-12 Q-6,-8 -4,-8 L0,-10 L-4,-30 Z" fill="url(#p2p5skinS)"/>
    <path d="M-8,-10 Q-6,-8 -4,-8" fill="none" stroke="#3a2010" stroke-width="0.5"/>

    <!-- MOUTH — a line, jaw set so hard muscles visible -->
    <path d="M-22,4 L8,2" stroke="#3a1808" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Jaw muscle tension -->
    <path d="M-30,16 Q-24,22 -16,24" fill="none" stroke="#3a2010" stroke-width="0.55" opacity="0.65"/>
    <path d="M14,14 Q10,20 4,22" fill="none" stroke="#3a2010" stroke-width="0.55" opacity="0.65"/>

    <!-- Cheekbone shadow -->
    <path d="M-44,-20 Q-40,0 -34,8" fill="none" stroke="#3a2010" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- DIALOGUE — Sable (low, clipped, command): Nobody. Move. -->
  <g>
    <rect x="14" y="14" width="170" height="64" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M70,78 L84,78 L74,92 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M73,78 L81,78" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1a1a1a">Nobody.</text>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1a1a1a">Move.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,78 240,82 Q300,84 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
