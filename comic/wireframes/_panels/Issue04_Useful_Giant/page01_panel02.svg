<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 1 — Panel 2: Theodore tracing the scratch on cobblestones, notebook on knee</title>
  <desc>50mm low-angle medium shot from cobblestone level. Theodore crouched, tracing a shallow scratch with fingertip. Notebook visible on knee with rough courtyard map and X marks. Brass gear ring on left index finger. Concentrated focus, lower lip caught between teeth.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p1p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a094"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <linearGradient id="p1p2cobbleFG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a5a48"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p1p2cobbleWet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a7868"/>
      <stop offset="100%" stop-color="#5a4838"/>
    </linearGradient>
    <linearGradient id="p1p2theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p1p2theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p1p2vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p1p2shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p1p2trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2c20"/>
    </linearGradient>
  </defs>

  <!-- BG sky -->
  <rect width="366" height="120" fill="url(#p1p2sky)"/>
  <!-- Distant courtyard wall hint -->
  <rect x="0" y="80" width="366" height="80" fill="#5a3828" opacity="0.85"/>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.5">
    <line x1="0" y1="100" x2="366" y2="100"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="155" x2="366" y2="155"/>
  </g>

  <!-- COBBLESTONES — extreme FG, fills bottom 2/3 -->
  <rect x="0" y="160" width="366" height="204" fill="url(#p1p2cobbleFG)"/>

  <!-- Receding cobblestone perspective lines -->
  <g stroke="#1a0c04" stroke-width="0.6" opacity="0.7">
    <path d="M0,180 Q100,178 220,182 Q300,184 366,180"/>
    <path d="M0,210 Q100,208 220,212 Q300,214 366,210"/>
    <path d="M0,250 Q100,248 220,252 Q300,254 366,250"/>
    <path d="M0,295 Q100,293 220,297 Q300,299 366,295"/>
    <path d="M0,340 Q100,338 220,342 Q300,344 366,340"/>
  </g>
  <!-- Wet patches catching light -->
  <g fill="url(#p1p2cobbleWet)" opacity="0.65">
    <ellipse cx="80" cy="240" rx="40" ry="6"/>
    <ellipse cx="220" cy="260" rx="50" ry="5"/>
    <ellipse cx="320" cy="290" rx="32" ry="4"/>
  </g>
  <!-- Individual cobble dots -->
  <g fill="#1a0c04" opacity="0.7">
    <circle cx="60" cy="200" r="1.4"/>
    <circle cx="140" cy="208" r="1.4"/>
    <circle cx="220" cy="200" r="1.4"/>
    <circle cx="300" cy="208" r="1.4"/>
    <circle cx="100" cy="240" r="1.4"/>
    <circle cx="180" cy="248" r="1.4"/>
    <circle cx="260" cy="240" r="1.4"/>
    <circle cx="340" cy="248" r="1.4"/>
    <circle cx="40" cy="290" r="1.6"/>
    <circle cx="160" cy="298" r="1.6"/>
    <circle cx="280" cy="290" r="1.6"/>
    <circle cx="80" cy="335" r="1.6"/>
    <circle cx="200" cy="343" r="1.6"/>
    <circle cx="310" cy="335" r="1.6"/>
  </g>

  <!-- THE SCRATCH — diagonal, too straight for a cart, too small for a boot scrape -->
  <g>
    <line x1="60" y1="320" x2="220" y2="270" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <line x1="60" y1="320" x2="220" y2="270" stroke="#a89070" stroke-width="0.55" opacity="0.65"/>
    <!-- Faint resonant secondary -->
    <line x1="80" y1="325" x2="200" y2="280" stroke="#1a0c04" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- THEODORE — crouched, low angle from cobblestone level, looking up -->
  <g transform="translate(220 220)">
    <!-- Trousers folded — knees up, calves under -->
    <path d="M-30,40 Q-26,20 -16,18 L-2,18 L-2,42 L-30,42 Z" fill="url(#p1p2trousers)"/>
    <path d="M2,42 L2,18 L16,18 Q26,20 30,40 Z" fill="url(#p1p2trousers)"/>
    <!-- Patches -->
    <rect x="-22" y="22" width="6" height="6" fill="#3a2010" opacity="0.7"/>
    <rect x="14" y="28" width="5" height="5" fill="#3a2010" opacity="0.7"/>
    <!-- Boots -->
    <ellipse cx="-18" cy="46" rx="6" ry="2" fill="#1a0c04"/>
    <ellipse cx="18" cy="46" rx="6" ry="2" fill="#1a0c04"/>

    <!-- Vest covering torso -->
    <path d="M-22,-30 L-26,18 L26,18 L22,-30 Z" fill="url(#p1p2vest)"/>
    <!-- Shirt collar / chest -->
    <path d="M-10,-40 L-8,-30 L8,-30 L10,-40 Z" fill="url(#p1p2shirt)"/>

    <!-- Right arm — reaching down toward scratch -->
    <path d="M-22,-26 Q-40,-10 -54,12 L-50,18 Q-36,2 -22,-18 Z" fill="url(#p1p2shirt)"/>
    <!-- Right hand (oil-stained), index finger extended toward scratch -->
    <ellipse cx="-58" cy="14" rx="6" ry="4" fill="url(#p1p2theoSkin)"/>
    <path d="M-62,16 L-72,22" stroke="url(#p1p2theoSkin)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Faint oil stain on hand -->
    <ellipse cx="-58" cy="13" rx="3" ry="1.5" fill="#3a2818" opacity="0.4"/>

    <!-- Left arm holding notebook on knee -->
    <path d="M22,-26 Q34,-10 28,16 L20,18 Q22,-6 18,-22 Z" fill="url(#p1p2shirt)"/>
    <!-- Left hand on notebook -->
    <ellipse cx="20" cy="20" rx="5" ry="3.5" fill="url(#p1p2theoSkin)"/>
    <!-- BRASS GEAR RING on left index finger — visible glint -->
    <circle cx="22" cy="22" r="1.6" fill="#c89858" stroke="#7a5028" stroke-width="0.4"/>
    <circle cx="22" cy="22" r="0.7" fill="#a86828"/>

    <!-- NOTEBOOK on knee -->
    <g transform="rotate(8 8 22)">
      <rect x="-2" y="-2" width="42" height="36" fill="#d8c8a8" stroke="#7a5848" stroke-width="0.6"/>
      <rect x="-2" y="-2" width="42" height="3" fill="#7a5848"/>
      <!-- Sketches on page — courtyard map with X marks -->
      <rect x="2" y="4" width="34" height="26" fill="none" stroke="#3a2010" stroke-width="0.3"/>
      <text x="6" y="11" font-family="Helvetica Neue" font-size="3.5" fill="#3a2010" font-weight="700">×</text>
      <text x="14" y="14" font-family="Helvetica Neue" font-size="3.5" fill="#3a2010" font-weight="700">×</text>
      <text x="22" y="11" font-family="Helvetica Neue" font-size="3.5" fill="#3a2010" font-weight="700">×</text>
      <text x="30" y="20" font-family="Helvetica Neue" font-size="3.5" fill="#3a2010" font-weight="700">×</text>
      <line x1="6" y1="11" x2="30" y2="20" stroke="#3a2010" stroke-width="0.25" stroke-dasharray="0.8,0.6"/>
      <!-- Small drawing of a mark -->
      <path d="M6,24 L18,28" stroke="#3a2010" stroke-width="0.4"/>
      <path d="M22,26 L34,28" stroke="#3a2010" stroke-width="0.4"/>
    </g>

    <!-- Head — three-quarter, looking down at scratch -->
    <ellipse cx="0" cy="-58" rx="13" ry="15" fill="url(#p1p2theoSkin)"/>
    <!-- Hair sandy-brown, falling over forehead -->
    <g fill="url(#p1p2theoHair)">
      <path d="M-12,-72 Q-13,-82 0,-86 Q13,-82 12,-72 L8,-68 Q4,-78 -4,-78 Q-12,-78 -16,-68 Z"/>
      <path d="M-7,-82 L-9,-92 L-3,-82 Z"/>
      <path d="M-1,-86 L-1,-94 L3,-82 Z"/>
      <path d="M5,-86 L9,-94 L7,-82 Z"/>
    </g>
    <!-- Eyes — narrowed, focused, looking down -->
    <ellipse cx="-4" cy="-58" rx="2" ry="1.2" fill="#fff8e8"/>
    <ellipse cx="-4" cy="-57" rx="1.4" ry="1" fill="#7a5028"/>
    <circle cx="-4" cy="-57" r="0.6" fill="#1a0c04"/>
    <ellipse cx="4" cy="-58" rx="2" ry="1.2" fill="#fff8e8"/>
    <ellipse cx="4" cy="-57" rx="1.4" ry="1" fill="#7a5028"/>
    <circle cx="4" cy="-57" r="0.6" fill="#1a0c04"/>
    <!-- Brow furrowed -->
    <path d="M-8,-64 L-2,-66" stroke="#3a2010" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M2,-66 L8,-64" stroke="#3a2010" stroke-width="0.7" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M0,-54 L-2,-48 Q0,-47 2,-48 Z" fill="#7a5848" opacity="0.55"/>
    <!-- Lower lip caught between teeth — faint detail -->
    <path d="M-3,-44 Q0,-43 3,-44" fill="none" stroke="#5a3818" stroke-width="0.55" stroke-linecap="round"/>
    <path d="M-3,-44 Q0,-42 3,-44" fill="#a85838" opacity="0.6"/>
    <!-- Freckles -->
    <circle cx="-7" cy="-52" r="0.5" fill="#7a5848"/>
    <circle cx="7" cy="-52" r="0.5" fill="#7a5848"/>
    <circle cx="-3" cy="-50" r="0.4" fill="#7a5848"/>
  </g>

  <!-- DIALOGUE — Theodore muttering -->
  <!-- Balloon 1 -->
  <g>
    <rect x="14" y="14" width="232" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,58 L130,58 L122,70 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M122,58 L128,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Too straight for a cart. Wrong angle for a boot scrape.</text>

  <!-- Balloon 2 -->
  <g>
    <rect x="140" y="74" width="212" height="42" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,116 L190,116 L182,128 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M182,116 L188,116" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="148" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="148" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Same as the ones on the step.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.35" opacity="0.16" fill="none">
    <path d="M0,170 Q100,175 220,170 Q300,168 366,172"/>
    <path d="M0,260 Q100,265 220,260 Q300,258 366,262"/>
  </g>
</svg>
