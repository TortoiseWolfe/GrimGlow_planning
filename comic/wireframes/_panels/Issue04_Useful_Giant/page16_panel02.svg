<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 4 — Page 16 — Panel 2: Jink vindicated, Luma observes Theodore's instinct</title>
  <desc>Medium. Jink left grinning, Luma right observing. Jink: Told you he was worth it. Luma: He built a charging cradle from clockwork. Without understanding the power cell's frequency modulation. He just... saw how it worked. / That's not training. That's instinct.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p16p2timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p16p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p16p2emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <linearGradient id="p16p2sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <radialGradient id="p16p2coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#p16p2bg)"/>
  <rect width="494" height="364" fill="url(#p16p2coolWash)"/>

  <!-- Brick BG -->
  <rect x="0" y="40" width="494" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="494" y2="80"/>
    <line x1="0" y1="160" x2="494" y2="160"/>
    <line x1="0" y1="220" x2="494" y2="220"/>
  </g>

  <!-- Beam -->
  <rect x="0" y="280" width="494" height="44" fill="url(#p16p2timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="494" y2="282"/>
    <line x1="0" y1="316" x2="494" y2="316"/>
  </g>

  <!-- JINK left — ARMS CROSSED, GRINNING -->
  <g transform="translate(140 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p16p2emerald)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p16p2emerald)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p16p2emerald)"/>
    <path d="M-9,-72 Q-2,-66 5,-72 Q-2,-58 -8,-54 Z" fill="#3a2818" opacity="0.7"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p16p2emerald)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p16p2emerald)"/>
    <circle cx="-10" cy="-86" r="1.2" fill="#9aff9a" filter="url(#p16p2bloom)"/>
    <circle cx="10" cy="-86" r="1.2" fill="#9aff9a" filter="url(#p16p2bloom)"/>
    <!-- Arms folded -->
    <path d="M-15,-72 Q-17,-62 -10,-58 L10,-60 Q17,-64 15,-72 L8,-70 Q-2,-64 -10,-68 Z" fill="url(#p16p2emerald)"/>
    <ellipse cx="-8" cy="-62" rx="5" ry="2" fill="url(#p16p2skin)"/>
    <ellipse cx="8" cy="-62" rx="5" ry="2" fill="url(#p16p2skin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p16p2skin)"/>
    <g fill="#d8a838">
      <circle cx="-9" cy="-114" r="3.5"/>
      <circle cx="-2" cy="-118" r="4"/>
      <circle cx="6" cy="-114" r="3.5"/>
      <circle cx="-12" cy="-110" r="2.4"/>
      <circle cx="12" cy="-110" r="2.4"/>
    </g>
    <ellipse cx="-4" cy="-104" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="-4" cy="-104" r="0.6" fill="#1a4830"/>
    <ellipse cx="4" cy="-104" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="4" cy="-104" r="0.6" fill="#1a4830"/>
    <!-- Big grin -->
    <path d="M-7,-96 Q0,-90 7,-96" fill="#5a2818"/>
    <path d="M-7,-96 Q0,-92 7,-96" stroke="#3a1808" stroke-width="0.85" fill="none"/>
  </g>

  <!-- LUMA right — observing posture, lenses scrolling -->
  <g transform="translate(360 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p16p2sapphire)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p16p2sapphire)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p16p2sapphire)"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p16p2sapphire)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p16p2sapphire)"/>
    <circle cx="-10" cy="-86" r="1" fill="#a888ff" filter="url(#p16p2bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#a888ff" filter="url(#p16p2bloom)"/>
    <!-- One hand at chin in thought -->
    <path d="M-15,-76 Q-22,-78 -22,-90 L-14,-92 Q-12,-82 -10,-74 Z" fill="url(#p16p2sapphire)"/>
    <ellipse cx="-22" cy="-94" rx="3" ry="2.4" fill="url(#p16p2skin)"/>
    <ellipse cx="-22" cy="-94" rx="1.4" ry="0.7" fill="#1a0838" opacity="0.7"/>
    <path d="M15,-76 Q22,-58 16,-44 L10,-46 Q12,-58 10,-74 Z" fill="url(#p16p2sapphire)"/>
    <ellipse cx="15" cy="-44" rx="2.4" ry="1.4" fill="url(#p16p2skin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p16p2skin)"/>
    <g fill="#1a0c04">
      <path d="M-9,-112 Q-9,-118 0,-120 Q9,-118 9,-112 L7,-106 Q3,-112 -3,-112 Q-7,-112 -9,-106 Z"/>
      <path d="M7,-110 Q14,-94 16,-78" stroke="#1a0c04" stroke-width="2.4" fill="none"/>
    </g>
    <line x1="7" y1="-110" x2="16" y2="-78" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#p16p2bloom)"/>
    <ellipse cx="-3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p16p2bloom)"/>
    <ellipse cx="3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p16p2bloom)"/>
    <!-- Mouth — slight pensive -->
    <path d="M-3,-96 Q0,-94 3,-96" fill="none" stroke="#3a1a78" stroke-width="0.7"/>
  </g>

  <!-- DIALOGUE — Jink: Told you he was worth it. -->
  <g>
    <rect x="14" y="14" width="220" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M120,58 L130,58 L122,70 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M122,58 L128,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Told you he was worth it.</text>

  <!-- DIALOGUE — Luma: He built a charging cradle from clockwork... -->
  <g>
    <rect x="14" y="86" width="466" height="74" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,160 L270,160 L262,172 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M262,160 L268,160" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">He built a charging cradle from clockwork. Without understanding</text>
  <text x="22" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">the power cell's frequency modulation. He just...</text>
  <text x="22" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a"><tspan font-style="italic">saw how it worked.</tspan></text>

  <!-- DIALOGUE — Luma: That's not training. That's instinct. -->
  <g>
    <rect x="14" y="172" width="316" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M120,216 L130,216 L122,228 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M122,216 L128,216" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">That's not training. That's instinct.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q380,76 494,80"/>
    <path d="M0,260 Q120,262 240,258 Q380,256 494,260"/>
  </g>
</svg>
