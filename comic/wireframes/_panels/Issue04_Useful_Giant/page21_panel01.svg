<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 21 — Panel 1: Theodore approaches HOROLOGY at evening — street cat crosses cobblestones, his new wariness</title>
  <desc>35mm medium wide. Theodore walks toward dark Cribbage shop. HOROLOGY in gold leaf barely visible. Side door to upper rooms. Street emptying. A cat crosses ahead — amber eyes catching gaslight. Theodore watches with new protective concern: to his fairies, this would be a monster.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p21p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#3a2858"/>
    </linearGradient>
    <linearGradient id="p21p1building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p21p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p21p1theoSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p21p1catFur" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p21p1lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p1catEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p21p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p21p1glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <!-- SKY — deepening November evening -->
  <rect width="742" height="160" fill="url(#p21p1sky)"/>

  <!-- ROOFLINE silhouettes -->
  <g fill="#0a0408">
    <path d="M0,120 L0,160 L140,160 L140,90 L260,90 L260,110 L380,110 L380,80 L500,80 L500,100 L620,100 L620,90 L742,90 L742,160 Z"/>
  </g>
  <g fill="#0a0408">
    <rect x="80" y="98" width="10" height="22"/>
    <rect x="280" y="68" width="9" height="22"/>
    <rect x="420" y="68" width="10" height="20"/>
    <rect x="540" y="78" width="9" height="22"/>
    <rect x="660" y="68" width="10" height="22"/>
  </g>
  <!-- Star -->
  <g fill="#fff8e8" opacity="0.85" filter="url(#p21p1bloom)">
    <circle cx="200" cy="40" r="0.8"/>
    <circle cx="380" cy="60" r="0.7"/>
    <circle cx="540" cy="40" r="0.85"/>
    <circle cx="120" cy="60" r="0.55"/>
    <circle cx="640" cy="50" r="0.65"/>
  </g>
  <!-- Chimney smoke -->
  <g opacity="0.45" fill="#5a4838">
    <ellipse cx="86" cy="92" rx="14" ry="5"/>
    <ellipse cx="286" cy="62" rx="12" ry="4.4"/>
    <ellipse cx="426" cy="62" rx="14" ry="4.4"/>
    <ellipse cx="546" cy="72" rx="12" ry="4"/>
  </g>

  <!-- BUILDING — Cribbage shop and neighbours -->
  <rect x="0" y="160" width="742" height="160" fill="url(#p21p1building)"/>

  <!-- HOROLOGY SHOP — center-left -->
  <rect x="240" y="160" width="220" height="160" fill="#1a0c08"/>
  <!-- Sign panel -->
  <rect x="240" y="170" width="220" height="22" fill="#2a1408"/>
  <text x="350" y="186" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#a87838" font-weight="700" font-style="italic" opacity="0.78" letter-spacing="2">HOROLOGY</text>
  <!-- Faint gold-leaf trace on sign edges -->
  <line x1="244" y1="170" x2="456" y2="170" stroke="#a87838" stroke-width="0.5" opacity="0.55"/>
  <line x1="244" y1="192" x2="456" y2="192" stroke="#a87838" stroke-width="0.5" opacity="0.55"/>
  <!-- Shop window — DARK (closed up) -->
  <rect x="260" y="200" width="180" height="80" fill="#3a2818"/>
  <rect x="266" y="206" width="168" height="68" fill="#1a0c04" opacity="0.92"/>
  <line x1="350" y1="206" x2="350" y2="274" stroke="#1a0c04" stroke-width="0.7"/>
  <line x1="266" y1="240" x2="434" y2="240" stroke="#1a0c04" stroke-width="0.7"/>
  <!-- Faint reflections of streetlight in dark window -->
  <ellipse cx="290" cy="222" rx="4" ry="6" fill="#ffaa48" opacity="0.18" filter="url(#p21p1bloom)"/>
  <ellipse cx="400" cy="248" rx="4" ry="6" fill="#ffaa48" opacity="0.15" filter="url(#p21p1bloom)"/>
  <!-- Front door (main shop entrance, also dark) -->
  <rect x="276" y="280" width="34" height="40" fill="#1a0c04"/>
  <rect x="280" y="284" width="26" height="32" fill="#3a2010"/>
  <circle cx="302" cy="302" r="0.9" fill="#a87838"/>

  <!-- SIDE DOOR — left of shop (Theodore's entry) -->
  <rect x="220" y="220" width="20" height="100" fill="#2a1408"/>
  <rect x="222" y="222" width="16" height="96" fill="#1a0c04"/>
  <circle cx="234" cy="280" r="0.8" fill="#a87838"/>

  <!-- Neighbour buildings -->
  <rect x="0" y="160" width="240" height="160" fill="#0a0408"/>
  <rect x="20" y="200" width="40" height="50" fill="#3a2818"/>
  <rect x="24" y="204" width="32" height="42" fill="#1a0c04" opacity="0.85"/>
  <rect x="100" y="220" width="40" height="60" fill="#3a2818"/>
  <rect x="104" y="224" width="32" height="52" fill="#3a2828" opacity="0.7"/>
  <ellipse cx="120" cy="250" rx="20" ry="20" fill="#ffd078" opacity="0.18" filter="url(#p21p1bloom)"/>
  <rect x="170" y="240" width="40" height="40" fill="#3a2818"/>
  <rect x="174" y="244" width="32" height="32" fill="#1a0c04" opacity="0.85"/>

  <rect x="460" y="160" width="282" height="160" fill="#0a0408"/>
  <rect x="500" y="220" width="40" height="60" fill="#3a2818"/>
  <rect x="504" y="224" width="32" height="52" fill="#1a0c04" opacity="0.85"/>
  <rect x="600" y="200" width="40" height="60" fill="#3a2818"/>
  <rect x="604" y="204" width="32" height="52" fill="#3a2828" opacity="0.7"/>
  <ellipse cx="620" cy="230" rx="20" ry="20" fill="#ffd078" opacity="0.15" filter="url(#p21p1bloom)"/>

  <!-- COBBLESTONES -->
  <rect x="0" y="320" width="742" height="44" fill="url(#p21p1cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55">
    <path d="M0,338 Q200,336 400,340 Q580,342 742,338"/>
    <path d="M0,355 Q200,357 400,353 Q580,351 742,355"/>
  </g>
  <g fill="#1a0c04" opacity="0.55">
    <circle cx="60" cy="328" r="1"/>
    <circle cx="180" cy="334" r="1"/>
    <circle cx="280" cy="328" r="1"/>
    <circle cx="500" cy="334" r="1"/>
    <circle cx="620" cy="328" r="1"/>
    <circle cx="100" cy="350" r="1"/>
    <circle cx="240" cy="356" r="1"/>
    <circle cx="380" cy="350" r="1"/>
    <circle cx="540" cy="356" r="1"/>
  </g>

  <!-- GASLIGHT POOLS along street -->
  <ellipse cx="120" cy="340" rx="100" ry="22" fill="url(#p21p1lampPool)" filter="url(#p21p1glow)" opacity="0.85"/>
  <ellipse cx="350" cy="340" rx="90" ry="20" fill="url(#p21p1lampPool)" filter="url(#p21p1glow)" opacity="0.65"/>
  <ellipse cx="620" cy="340" rx="100" ry="22" fill="url(#p21p1lampPool)" filter="url(#p21p1glow)" opacity="0.7"/>

  <!-- Lamp post indicator (out of frame at left + right edges) -->
  <g fill="#fff8e8" filter="url(#p21p1bloom)">
    <circle cx="120" cy="340" r="1"/>
    <circle cx="620" cy="340" r="1"/>
  </g>

  <!-- ===== STREET CAT — crossing cobblestones ahead of Theodore (mid-frame, walking right-to-left) ===== -->
  <g transform="translate(380 340)">
    <!-- Tail trailing -->
    <path d="M28,-6 Q40,-12 46,-10 Q50,-6 48,-2" fill="none" stroke="#1a0c04" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M28,-6 Q40,-12 46,-10 Q50,-6 48,-2" fill="none" stroke="#3a2818" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <!-- Body — long lithe -->
    <ellipse cx="0" cy="-6" rx="28" ry="8" fill="url(#p21p1catFur)"/>
    <!-- Back legs -->
    <ellipse cx="14" cy="2" rx="3" ry="6" fill="#1a0c04"/>
    <ellipse cx="20" cy="4" rx="2.4" ry="5" fill="#1a0c04"/>
    <!-- Front legs -->
    <ellipse cx="-14" cy="2" rx="3" ry="6" fill="#1a0c04"/>
    <ellipse cx="-20" cy="4" rx="2.4" ry="5" fill="#1a0c04"/>
    <!-- Head — facing camera-left, slightly turned -->
    <ellipse cx="-30" cy="-10" rx="9" ry="7" fill="url(#p21p1catFur)"/>
    <!-- Ears -->
    <path d="M-36,-15 L-34,-22 L-30,-17 Z" fill="#1a0c04"/>
    <path d="M-26,-15 L-24,-22 L-21,-17 Z" fill="#1a0c04"/>
    <path d="M-35,-16 L-33,-19 L-31,-17 Z" fill="#3a2818"/>
    <path d="M-25,-16 L-23,-19 L-22,-17 Z" fill="#3a2818"/>
    <!-- EYES — amber catching gaslight, glowing -->
    <ellipse cx="-34" cy="-11" rx="2" ry="1.4" fill="#000"/>
    <ellipse cx="-28" cy="-11" rx="2" ry="1.4" fill="#000"/>
    <ellipse cx="-34" cy="-11" rx="1.6" ry="1.2" fill="url(#p21p1catEyeGlow)" filter="url(#p21p1bloom)"/>
    <ellipse cx="-28" cy="-11" rx="1.6" ry="1.2" fill="url(#p21p1catEyeGlow)" filter="url(#p21p1bloom)"/>
    <ellipse cx="-34" cy="-10" rx="0.4" ry="0.9" fill="#0a0604"/>
    <ellipse cx="-28" cy="-10" rx="0.4" ry="0.9" fill="#0a0604"/>
    <!-- Glow halo on cat -->
    <ellipse cx="-30" cy="-11" rx="14" ry="9" fill="#ffaa48" opacity="0.25" filter="url(#p21p1glow)"/>
    <!-- Nose + whiskers -->
    <path d="M-32,-7 L-29,-7 L-30.5,-5 Z" fill="#3a1808"/>
    <line x1="-26" y1="-8" x2="-18" y2="-9" stroke="#a89888" stroke-width="0.4" opacity="0.65"/>
    <line x1="-26" y1="-7" x2="-18" y2="-6" stroke="#a89888" stroke-width="0.4" opacity="0.65"/>
    <line x1="-34" y1="-8" x2="-42" y2="-9" stroke="#a89888" stroke-width="0.4" opacity="0.65"/>
    <line x1="-34" y1="-7" x2="-42" y2="-6" stroke="#a89888" stroke-width="0.4" opacity="0.65"/>
    <!-- Slight ground shadow -->
    <ellipse cx="0" cy="6" rx="22" ry="2.4" fill="#0a0408" opacity="0.55"/>
  </g>

  <!-- THEODORE — right of frame, watching cat with new wariness -->
  <g transform="translate(580 290)">
    <!-- Boots -->
    <ellipse cx="-5" cy="64" rx="6" ry="3" fill="#1a0c04"/>
    <ellipse cx="5" cy="64" rx="6" ry="3" fill="#1a0c04"/>
    <!-- Trousers -->
    <rect x="-8" y="32" width="7" height="32" fill="url(#p21p1theoSuit)"/>
    <rect x="1" y="32" width="7" height="32" fill="url(#p21p1theoSuit)"/>
    <!-- Shirt -->
    <rect x="-5" y="-6" width="10" height="6" fill="#d8c8a8"/>
    <!-- Waistcoat -->
    <path d="M-13,32 L-13,-4 L13,-4 L13,32 Z" fill="#5a2828"/>
    <line x1="0" y1="-4" x2="0" y2="30" stroke="#3a1808" stroke-width="0.7"/>
    <circle cx="0" cy="4" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="14" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="24" r="0.7" fill="#5a3818"/>
    <!-- Shoulders -->
    <path d="M-13,-4 Q-9,-14 -2,-16 Q4,-16 9,-12 L13,-4 Z" fill="#5a2828"/>
    <!-- Arms -->
    <path d="M-13,-4 L-18,16 L-16,30 L-10,30 L-10,12 L-12,0 Z" fill="#5a2828"/>
    <ellipse cx="-13" cy="32" rx="3.5" ry="2.4" fill="#a86838"/>
    <!-- right hand in pocket -->
    <path d="M13,-4 L18,18 L13,30 L4,32 L4,28 L10,22 L11,12 L11,0 Z" fill="#5a2828"/>
    <ellipse cx="9" cy="34" rx="4" ry="3" fill="url(#p21p1theoSuit)"/>
    <!-- pocket glow -->
    <ellipse cx="9" cy="36" rx="6" ry="4" fill="#88aaff" opacity="0.3" filter="url(#p21p1glow)"/>

    <!-- Head — turned slightly LEFT to watch cat -->
    <ellipse cx="-2" cy="-22" rx="11" ry="13" fill="#a86838"/>
    <ellipse cx="-7" cy="-22" rx="6" ry="9" fill="#ffd078" opacity="0.45" filter="url(#p21p1bloom)"/>
    <!-- Hair -->
    <path d="M-11,-32 Q-10,-37 -2,-38 Q8,-37 9,-32 L9,-26 Q4,-30 -2,-30 Q-8,-30 -11,-26 Z" fill="#a87838"/>
    <path d="M-5,-34 L-3,-28" stroke="#7a5028" stroke-width="0.85" opacity="0.85"/>
    <!-- Freckles -->
    <circle cx="-5" cy="-22" r="0.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="-3" cy="-20" r="0.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="2" cy="-22" r="0.4" fill="#5a3018" opacity="0.85"/>
    <!-- Eyes — narrowed in wariness, looking left toward cat -->
    <ellipse cx="-6" cy="-22" rx="2" ry="1.1" fill="#fff8e8"/>
    <ellipse cx="-7" cy="-21" rx="1.4" ry="0.9" fill="#7a4818"/>
    <circle cx="-7" cy="-21" r="0.7" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="2" ry="1.1" fill="#fff8e8"/>
    <ellipse cx="1" cy="-21" rx="1.4" ry="0.9" fill="#7a4818"/>
    <circle cx="1" cy="-21" r="0.7" fill="#0a0604"/>
    <!-- Brows down — focused, protective -->
    <path d="M-10,-28 L-2,-30" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M-2,-30 L6,-28" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — set in line, watchful -->
    <path d="M-4,-13 L4,-13" stroke="#3a1808" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Breath fog -->
    <ellipse cx="-2" cy="-9" rx="3" ry="1.4" fill="#fff8e8" opacity="0.4" filter="url(#p21p1bloom)"/>
  </g>

  <!-- THEODORE thought caption 1 (top-left) -->
  <g>
    <rect x="14" y="14" width="200" height="36" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="700">THEODORE (thought)</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">A cat. Just a cat.</text>

  <!-- THEODORE thought caption 2 (top-right) — the realization -->
  <g>
    <rect x="500" y="14" width="228" height="36" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
  </g>
  <text x="508" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="700">THEODORE (thought)</text>
  <text x="508" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="500">To them, it would be a monster.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
