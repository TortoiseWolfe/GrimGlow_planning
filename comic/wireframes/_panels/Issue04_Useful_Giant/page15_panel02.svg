<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 15 — Panel 2: Wren CU — caught the lie, watches Sable</title>
  <desc>CU Wren. Looking SIDEWAYS at Sable, eye narrowed slightly. The engineer who knows when something doesn't add up. She's noticed the lie — but not yet calling it out. Silent recognition. (Mid-panel: no dialogue.)</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p15p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p15p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="50%" stop-color="#c87533"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p15p2coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p15p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p15p2bg)"/>
  <rect width="366" height="364" fill="url(#p15p2coolWash)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- WREN CU -->
  <g transform="translate(180 240)">
    <!-- Body shoulders + collar -->
    <path d="M-100,140 L-100,40 L100,40 L100,140 Z" fill="url(#p15p2suit)"/>
    <path d="M-100,40 Q-70,16 0,8 Q70,16 100,40 L80,52 L-80,52 Z" fill="url(#p15p2suit)"/>
    <ellipse cx="-70" cy="20" rx="14" ry="9" fill="#1a0c04" opacity="0.75"/>
    <circle cx="-40" cy="46" r="2" fill="#ffd888" filter="url(#p15p2bloom)"/>
    <circle cx="40" cy="46" r="2" fill="#ffd888" filter="url(#p15p2bloom)"/>

    <!-- HEAD — turned LEFT toward Sable -->
    <g transform="translate(-8 -50)">
      <ellipse cx="0" cy="0" rx="36" ry="44" fill="url(#p15p2skin)"/>
      <path d="M-32,-12 Q-28,20 -10,30 L8,30 Q26,20 30,-2 L26,-12 Z" fill="url(#p15p2skin)"/>
      <ellipse cx="-30" cy="-2" rx="5" ry="9" fill="url(#p15p2skin)"/>
      <ellipse cx="-30" cy="-2" rx="2" ry="4" fill="#3a2010" opacity="0.5"/>
      <g fill="#1a0c04">
        <path d="M-32,-44 Q-32,-58 0,-62 Q26,-58 26,-44 L24,-36 Q12,-46 0,-46 Q-22,-46 -30,-36 Z"/>
        <ellipse cx="-2" cy="-72" rx="14" ry="11"/>
        <path d="M-26,-44 Q-30,-36 -26,-26" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
        <path d="M22,-44 Q26,-36 22,-26" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
      </g>
      <!-- Brow — slight raise (skeptical/noticing) -->
      <path d="M-22,-12 L-8,-16" stroke="#1a0c04" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,-16 L18,-12" stroke="#1a0c04" stroke-width="2" stroke-linecap="round"/>
      <!-- Eyes — looking SIDEWAYS LEFT toward Sable -->
      <ellipse cx="-14" cy="-4" rx="5" ry="2.4" fill="#fff8e8"/>
      <ellipse cx="-18" cy="-4" rx="3" ry="1.8" fill="#3a2010"/>
      <circle cx="-18" cy="-4" r="1.6" fill="#0a0604"/>
      <ellipse cx="-19" cy="-5" rx="0.85" ry="0.55" fill="#fff8e8"/>
      <ellipse cx="6" cy="-4" rx="4" ry="2" fill="#fff8e8"/>
      <ellipse cx="3" cy="-4" rx="2.4" ry="1.6" fill="#3a2010"/>
      <circle cx="3" cy="-4" r="1.4" fill="#0a0604"/>
      <ellipse cx="2" cy="-5" rx="0.7" ry="0.45" fill="#fff8e8"/>
      <!-- Subtle lower-lid lift (thinking) -->
      <path d="M-22,-1 Q-18,1 -14,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M-1,-1 Q3,1 9,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <!-- Nose -->
      <path d="M-2,0 L-4,16 Q-2,20 0,20 L4,18 L0,2 Z" fill="url(#p15p2skin)"/>
      <!-- Mouth — slightly compressed (the recognition) -->
      <path d="M-12,30 L8,28" stroke="#3a1808" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- (No dialogue this panel — silent recognition) -->
  <!-- Subtle off-panel arrow indicating Wren's gaze direction -->
  <g opacity="0.4" stroke="#fff8e8" stroke-width="0.85" fill="none">
    <path d="M40,180 L20,180" stroke-dasharray="2,2"/>
    <path d="M22,178 L20,180 L22,182" />
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
