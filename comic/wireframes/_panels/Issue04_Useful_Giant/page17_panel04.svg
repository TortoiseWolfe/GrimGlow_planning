<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 17 — Panel 4: REVEAL — ancient fairy glyph carved in brick at fairy height — three hundred years old</title>
  <desc>28mm wide. Scanner beam illuminates a glyph scratched into old brick at fairy height. Geometric. Precise. Alien. Centuries of grime in the grooves. Under the beam it glows faintly with residual charge — exhausted ghost signal. Luma's silhouette before it, scale matching the carving exactly. The discovery that changes the mission.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="50%" stop-color="#1a0c14"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p17p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p17p4suit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2068"/>
      <stop offset="50%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p17p4scannerCone" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p17p4glyphAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0d8ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#88aaff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p17p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="p17p4softShadow"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <!-- Near-black background -->
  <rect width="742" height="364" fill="url(#p17p4bg)"/>

  <!-- ANCIENT BRICK WALL — full panel surface, hand-formed, irregular -->
  <rect x="0" y="40" width="742" height="324" fill="url(#p17p4brick)"/>

  <!-- Hand-formed brick courses — IRREGULAR (Georgian/earlier, not machine-pressed) -->
  <g stroke="#0a0604" stroke-width="0.7" opacity="0.7">
    <path d="M0,80 Q120,82 240,78 Q380,76 500,80 Q620,82 742,79"/>
    <path d="M0,118 Q140,120 260,116 Q400,114 520,120 Q640,118 742,116"/>
    <path d="M0,156 Q120,154 260,158 Q400,160 520,156 Q640,154 742,158"/>
    <path d="M0,194 Q140,196 260,192 Q400,190 520,196 Q640,194 742,192"/>
    <path d="M0,232 Q120,234 240,230 Q380,228 500,232 Q620,234 742,231"/>
    <path d="M0,270 Q140,272 260,268 Q400,266 520,272 Q640,270 742,268"/>
    <path d="M0,308 Q120,306 260,310 Q400,312 520,306 Q640,304 742,308"/>
    <path d="M0,344 Q140,346 260,342 Q400,340 520,346 Q640,344 742,342"/>
  </g>
  <g stroke="#0a0604" stroke-width="0.6" opacity="0.55">
    <line x1="80" y1="40" x2="80" y2="80"/>
    <line x1="180" y1="80" x2="180" y2="118"/>
    <line x1="60" y1="118" x2="60" y2="156"/>
    <line x1="220" y1="156" x2="220" y2="194"/>
    <line x1="120" y1="194" x2="120" y2="232"/>
    <line x1="80" y1="232" x2="80" y2="270"/>
    <line x1="200" y1="270" x2="200" y2="308"/>
    <line x1="40" y1="308" x2="40" y2="344"/>
    <line x1="280" y1="80" x2="280" y2="118"/>
    <line x1="320" y1="118" x2="320" y2="156"/>
    <line x1="380" y1="156" x2="380" y2="194"/>
    <line x1="280" y1="194" x2="280" y2="232"/>
    <line x1="340" y1="232" x2="340" y2="270"/>
    <line x1="300" y1="270" x2="300" y2="308"/>
    <line x1="600" y1="80" x2="600" y2="118"/>
    <line x1="640" y1="118" x2="640" y2="156"/>
    <line x1="580" y1="156" x2="580" y2="194"/>
    <line x1="660" y1="194" x2="660" y2="232"/>
    <line x1="600" y1="232" x2="600" y2="270"/>
    <line x1="640" y1="270" x2="640" y2="308"/>
    <line x1="600" y1="308" x2="600" y2="344"/>
  </g>

  <!-- Mortar erosion patches -->
  <g opacity="0.6">
    <ellipse cx="120" cy="100" rx="14" ry="3.5" fill="#1a0c04"/>
    <ellipse cx="280" cy="180" rx="12" ry="3" fill="#1a0c04"/>
    <ellipse cx="60" cy="260" rx="16" ry="4" fill="#1a0c04"/>
    <ellipse cx="630" cy="120" rx="12" ry="3" fill="#1a0c04"/>
    <ellipse cx="700" cy="220" rx="14" ry="3.5" fill="#1a0c04"/>
    <ellipse cx="200" cy="320" rx="14" ry="3" fill="#1a0c04"/>
  </g>
  <g opacity="0.45">
    <ellipse cx="180" cy="140" rx="20" ry="6" fill="#5a3828"/>
    <ellipse cx="340" cy="240" rx="22" ry="6" fill="#5a3828"/>
    <ellipse cx="660" cy="290" rx="20" ry="6" fill="#5a3828"/>
  </g>

  <!-- Spider silk corner -->
  <g stroke="#a89888" stroke-width="0.4" fill="none" opacity="0.4">
    <path d="M520,260 Q540,250 560,265 Q580,280 600,270"/>
    <path d="M520,260 L600,270"/>
    <path d="M540,250 L580,280"/>
    <path d="M560,265 L600,270"/>
  </g>

  <!-- SCANNER CONE — entering from left, hitting glyph at center-right -->
  <g transform="translate(180 200)">
    <path d="M0,-50 L260,-95 L260,75 L0,50 Z" fill="url(#p17p4scannerCone)" filter="url(#p17p4bloom)" opacity="0.9"/>
    <line x1="0" y1="-50" x2="260" y2="-95" stroke="#a888e8" stroke-width="0.6" opacity="0.5"/>
    <line x1="0" y1="50" x2="260" y2="75" stroke="#a888e8" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- ============== ANCIENT FAIRY GLYPH ============== -->
  <!-- Centered at (440, 200) — fairy-height level. Hex-cross language but HAND-CARVED, ANCIENT, WORN. -->
  <g transform="translate(440 200)">
    <!-- Worn outer aura (residual charge responding to scanner) -->
    <ellipse cx="0" cy="0" rx="68" ry="68" fill="url(#p17p4glyphAura)" filter="url(#p17p4glow)"/>

    <!-- Recessed brick patch (smoother surface where carving sits) -->
    <ellipse cx="0" cy="0" rx="56" ry="56" fill="#3a1c08" opacity="0.5"/>

    <!-- THE GLYPH — central hex-cross marker, MATCHES MODERN waypoint glyph language but worn and irregular -->
    <!-- Hexagon outer ring — irregular hand-carved -->
    <g fill="none" stroke="#88aaff" stroke-width="1.8" opacity="0.95" filter="url(#p17p4bloom)">
      <path d="M-40,-22 L-22,-44 L20,-46 L42,-22 L40,22 L20,46 L-22,44 L-42,20 Z"/>
    </g>
    <!-- Inner hex (deeper carved) -->
    <g fill="none" stroke="#a8c0ff" stroke-width="1.4" opacity="0.95" filter="url(#p17p4bloom)">
      <path d="M-26,-14 L-14,-28 L14,-30 L28,-14 L26,16 L14,30 L-14,28 L-28,14 Z"/>
    </g>
    <!-- Cross arms — extending from hex through center -->
    <g stroke="#c0d8ff" stroke-width="2.2" opacity="0.95" filter="url(#p17p4bloom)" stroke-linecap="round">
      <line x1="0" y1="-44" x2="0" y2="44"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
    </g>
    <!-- Diagonal carved tics -->
    <g stroke="#88aaff" stroke-width="1.2" opacity="0.85" filter="url(#p17p4bloom)" stroke-linecap="round">
      <line x1="-22" y1="-22" x2="-12" y2="-12"/>
      <line x1="22" y1="-22" x2="12" y2="-12"/>
      <line x1="-22" y1="22" x2="-12" y2="12"/>
      <line x1="22" y1="22" x2="12" y2="12"/>
    </g>
    <!-- Small inner dot — center beat -->
    <circle cx="0" cy="0" r="2.4" fill="#fff8e8" filter="url(#p17p4bloom)"/>
    <circle cx="0" cy="0" r="5" fill="#c0d8ff" opacity="0.55" filter="url(#p17p4bloom)"/>

    <!-- WAVERING EVIDENCE — these are the "imperfections" the script names. The carving wandered. -->
    <!-- Faint break in the hexagon (where a slip happened) -->
    <path d="M-22,-44 L-18,-42" stroke="#5a78c8" stroke-width="2.4" opacity="0.7" filter="url(#p17p4bloom)"/>
    <!-- Filled-in groove dots (centuries of grime in carved depressions) -->
    <g opacity="0.55">
      <circle cx="-30" cy="-18" r="1.2" fill="#0a0604"/>
      <circle cx="22" cy="-32" r="1" fill="#0a0604"/>
      <circle cx="34" cy="14" r="1.2" fill="#0a0604"/>
      <circle cx="-12" cy="32" r="1" fill="#0a0604"/>
      <circle cx="-36" cy="6" r="1.2" fill="#0a0604"/>
    </g>
    <!-- Carved chip / tool slip mark below -->
    <path d="M14,38 L20,42 L18,46" stroke="#5a78c8" stroke-width="1" opacity="0.6" filter="url(#p17p4bloom)" fill="none"/>
    <!-- Tiny cross at bottom right corner of hex — secondary marking? -->
    <line x1="46" y1="36" x2="50" y2="40" stroke="#88aaff" stroke-width="1" opacity="0.7" filter="url(#p17p4bloom)"/>
    <line x1="48" y1="36" x2="48" y2="40" stroke="#88aaff" stroke-width="1" opacity="0.7" filter="url(#p17p4bloom)"/>
  </g>
  <!-- ============== END GLYPH ============== -->

  <!-- LUMA in silhouette — left of glyph, scale matching glyph height -->
  <g transform="translate(310 200)">
    <!-- Boots -->
    <ellipse cx="-6" cy="60" rx="6" ry="3" fill="#0a0408"/>
    <ellipse cx="6" cy="60" rx="6" ry="3" fill="#0a0408"/>
    <!-- Legs -->
    <rect x="-9" y="20" width="7" height="40" fill="url(#p17p4suit)"/>
    <rect x="2" y="20" width="7" height="40" fill="url(#p17p4suit)"/>
    <!-- Torso -->
    <path d="M-14,20 L-14,-26 L14,-26 L14,20 Z" fill="url(#p17p4suit)"/>
    <line x1="-10" y1="-18" x2="10" y2="-18" stroke="#a888e8" stroke-width="1" opacity="0.7" filter="url(#p17p4bloom)"/>
    <!-- Right arm raised — scanner forward toward glyph -->
    <path d="M14,-26 L14,-18 L40,-26 L46,-22 L46,-16 L40,-18 L14,-10 Z" fill="url(#p17p4suit)"/>
    <!-- Scanner -->
    <rect x="40" y="-30" width="14" height="14" rx="1.5" fill="#3a2068" stroke="#a888e8" stroke-width="0.7"/>
    <rect x="42" y="-28" width="10" height="10" fill="#5a3ad8" filter="url(#p17p4bloom)"/>
    <!-- Beam tip -->
    <circle cx="52" cy="-23" r="1.8" fill="#fff8e8" filter="url(#p17p4bloom)"/>
    <!-- Left arm — drifting up toward face -->
    <path d="M-14,-26 L-14,-12 L-22,-2 L-26,2 L-26,-2 L-18,-10 L-14,-22 Z" fill="url(#p17p4suit)"/>
    <ellipse cx="-25" cy="0" rx="3" ry="2.4" fill="#5a3828"/>

    <!-- Head -->
    <ellipse cx="0" cy="-38" rx="11" ry="14" fill="#5a3828"/>
    <!-- Hair top -->
    <path d="M-9,-50 Q-7,-60 0,-62 Q8,-60 10,-50 L8,-44 Q4,-50 0,-50 Q-4,-50 -8,-44 Z" fill="#0a0604"/>
    <!-- BRAID over right back shoulder, trailing down -->
    <path d="M8,-30 Q14,-12 16,8 Q16,28 14,38" stroke="#0a0604" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- SAPPHIRE FILAMENT -->
    <path d="M8,-30 Q14,-12 16,8" stroke="#a888e8" stroke-width="0.8" fill="none" opacity="0.85" filter="url(#p17p4bloom)"/>
    <circle cx="14" cy="-8" r="0.9" fill="#fff8e8" filter="url(#p17p4bloom)"/>
    <circle cx="16" cy="14" r="0.8" fill="#fff8e8" filter="url(#p17p4bloom)"/>

    <!-- Profile toward right (toward glyph) -->
    <path d="M6,-42 L10,-40 L8,-34 L4,-34 Z" fill="#7a4838" opacity="0.85"/>
    <!-- Eye looking right -->
    <ellipse cx="6" cy="-42" rx="1.6" ry="1" fill="#fff8e8"/>
    <circle cx="6" cy="-42" r="0.8" fill="#0a0604"/>
    <!-- Mouth slightly open -->
    <ellipse cx="2" cy="-32" rx="1.8" ry="0.6" fill="#3a1808"/>
    <!-- HOLO LENS warm gold ahead of eye -->
    <rect x="9" y="-46" width="9" height="6" rx="0.6" fill="none" stroke="#ffd078" stroke-width="0.7" opacity="0.85"/>
    <line x1="9" y1="-43" x2="18" y2="-43" stroke="#ffd078" stroke-width="0.4" opacity="0.7"/>

    <!-- DUST at knees -->
    <ellipse cx="-6" cy="20" rx="6" ry="1.4" fill="#5a4838" opacity="0.5"/>
    <ellipse cx="6" cy="20" rx="6" ry="1.4" fill="#5a4838" opacity="0.5"/>
  </g>

  <!-- Cool wash falling on Luma's silhouette from glyph + scanner -->
  <ellipse cx="380" cy="200" rx="160" ry="110" fill="#a888e8" opacity="0.05" filter="url(#p17p4glow)"/>

  <!-- CAPTION 1 — bottom left -->
  <g>
    <rect x="14" y="14" width="450" height="36" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Scratched into the brick at fairy height. Geometric. Precise. Three hundred years old.</text>

  <!-- CAPTION 2 — bottom-right (the second one — "Someone was here before them.") -->
  <g>
    <rect x="490" y="316" width="244" height="34" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="498" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="498" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-weight="500" font-style="italic">Someone was here before them.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
