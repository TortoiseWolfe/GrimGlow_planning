<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 4 — Page 3 — Panel 2: Thresh MCU, compact rifle braced, fear beneath discipline</title>
  <desc>65mm. Thresh aiming compact rifle toward viewer (gap). Pale skin, copper-red buzz cut, ruby-crimson suit with dented left pauldron and leg scuffs. Textbook military stance. White-knuckle grip, faint tremor. Eyes locked, jaw clenched, breathing fast. Crimson holographic glow at armor edges + blue-white camp light + warm daylight on right side. Thresh: Sable. Orders.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p3p2cavityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p3p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8a888"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p3p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e84050"/>
      <stop offset="50%" stop-color="#a82030"/>
      <stop offset="100%" stop-color="#5a0810"/>
    </linearGradient>
    <linearGradient id="p3p2chestPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82030"/>
      <stop offset="100%" stop-color="#5a0810"/>
    </linearGradient>
    <linearGradient id="p3p2hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d83820"/>
      <stop offset="100%" stop-color="#7a1808"/>
    </linearGradient>
    <radialGradient id="p3p2crimsonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8090" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8090" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3p2coolWash" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3p2warmRim" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p3p2bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- BG cavity -->
  <rect width="241" height="364" fill="url(#p3p2cavityBg)"/>
  <!-- Cool wash from left (camp interior) -->
  <rect width="241" height="364" fill="url(#p3p2coolWash)"/>
  <!-- Warm rim from right (gap) -->
  <rect width="241" height="364" fill="url(#p3p2warmRim)"/>

  <!-- Distant brick wall texture -->
  <rect x="0" y="40" width="241" height="200" fill="#2a1810" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="241" y2="80"/>
    <line x1="0" y1="120" x2="241" y2="120"/>
    <line x1="0" y1="160" x2="241" y2="160"/>
    <line x1="0" y1="200" x2="241" y2="200"/>
    <line x1="100" y1="40" x2="100" y2="80"/>
    <line x1="60" y1="120" x2="60" y2="160"/>
    <line x1="180" y1="160" x2="180" y2="200"/>
  </g>

  <!-- Geometric ward line pattern (perimeter) -->
  <g stroke="#a8c0e0" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M0,140 L40,138 L42,142 L80,140"/>
    <path d="M0,200 L60,198 L62,202 L120,200"/>
  </g>

  <!-- THRESH — main subject, weapon up, three-quarter facing right -->
  <g transform="translate(120 230)">
    <!-- Hip + legs visible -->
    <path d="M-26,40 L-30,134 L-12,136 L-8,40 Z" fill="url(#p3p2suit)"/>
    <path d="M8,40 L12,136 L30,134 L26,40 Z" fill="url(#p3p2suit)"/>
    <!-- LEG SCUFFS -->
    <ellipse cx="-22" cy="80" rx="4" ry="1" fill="#3a0808" opacity="0.7"/>
    <ellipse cx="22" cy="100" rx="4" ry="1" fill="#3a0808" opacity="0.7"/>
    <ellipse cx="-18" cy="120" rx="3" ry="0.85" fill="#3a0808" opacity="0.65"/>

    <!-- TORSO (broad shoulders) -->
    <path d="M-50,-38 L-58,40 L58,40 L50,-38 Z" fill="url(#p3p2suit)"/>

    <!-- ARMORED CHEST PLATE -->
    <g>
      <path d="M-44,-30 L-44,30 L44,30 L44,-30 Q22,-38 0,-38 Q-22,-38 -44,-30 Z" fill="url(#p3p2chestPlate)"/>
      <line x1="0" y1="-38" x2="0" y2="30" stroke="#3a0808" stroke-width="0.85"/>
      <!-- Plate seams -->
      <line x1="-44" y1="-10" x2="44" y2="-10" stroke="#3a0808" stroke-width="0.55"/>
      <line x1="-44" y1="10" x2="44" y2="10" stroke="#3a0808" stroke-width="0.55"/>
      <!-- Holographic core glow at chest center -->
      <circle cx="0" cy="0" r="3" fill="#ff8090" filter="url(#p3p2bloom)"/>
      <circle cx="0" cy="0" r="1.4" fill="#fff8e8"/>
    </g>

    <!-- LEFT SHOULDER PLATE — DENTED (visible on viewer's left = her left in mirrored shot) -->
    <g transform="translate(-50 -38)">
      <path d="M0,0 Q-12,-12 -8,-22 L8,-20 L4,8 Z" fill="#a82030"/>
      <!-- THE DENT -->
      <ellipse cx="-2" cy="-12" rx="5" ry="3" fill="#3a0808"/>
      <ellipse cx="-3" cy="-13" rx="3" ry="1.6" fill="#1a0408"/>
      <!-- Crimson hologram seam at edge -->
      <line x1="-8" y1="-22" x2="8" y2="-20" stroke="#ff8090" stroke-width="0.55" opacity="0.7"/>
    </g>
    <!-- Right shoulder plate (clean, no dent) -->
    <g transform="translate(50 -38)">
      <path d="M0,0 Q12,-12 8,-22 L-8,-20 L-4,8 Z" fill="#a82030"/>
      <line x1="-8" y1="-22" x2="8" y2="-20" stroke="#ff8090" stroke-width="0.55" opacity="0.7"/>
    </g>

    <!-- ARMS — extended forward, gripping rifle -->
    <!-- Right arm (closer, viewer's right) -->
    <path d="M50,-32 Q70,-20 84,-4 L78,4 Q60,-12 44,-22 Z" fill="url(#p3p2suit)"/>
    <!-- Left arm (further, partially behind weapon) -->
    <path d="M-50,-32 Q-30,-22 -14,-12 L-8,-22 Q-30,-32 -44,-32 Z" fill="url(#p3p2suit)"/>

    <!-- HANDS gripping rifle — WHITE-KNUCKLED -->
    <!-- Right hand (forward grip) -->
    <ellipse cx="80" cy="0" rx="9" ry="6" fill="url(#p3p2skin)"/>
    <!-- Knuckles (white-knuckled — paler than rest) -->
    <g fill="#f0d8b8">
      <ellipse cx="76" cy="-4" rx="2" ry="1.4"/>
      <ellipse cx="80" cy="-5" rx="2" ry="1.4"/>
      <ellipse cx="84" cy="-4" rx="2" ry="1.4"/>
    </g>
    <!-- Left hand (rear grip on stock) -->
    <ellipse cx="-12" cy="-8" rx="8" ry="6" fill="url(#p3p2skin)"/>
    <g fill="#f0d8b8">
      <ellipse cx="-16" cy="-12" rx="1.8" ry="1.2"/>
      <ellipse cx="-12" cy="-13" rx="1.8" ry="1.2"/>
      <ellipse cx="-8" cy="-12" rx="1.8" ry="1.2"/>
    </g>

    <!-- COMPACT RIFLE — pointed at viewer (foreshortened) -->
    <g>
      <!-- Stock (rear) -->
      <rect x="-26" y="-14" width="20" height="10" fill="#3a3038"/>
      <!-- Receiver -->
      <rect x="-6" y="-12" width="60" height="8" fill="#1a1820"/>
      <!-- Sight rail -->
      <rect x="-2" y="-14" width="56" height="2" fill="#5a4838"/>
      <!-- Barrel (extending toward viewer, foreshortened) -->
      <rect x="54" y="-11" width="36" height="5" fill="#1a1820"/>
      <!-- Muzzle (slight visible opening) -->
      <circle cx="92" cy="-9" r="2.5" fill="#0a0604"/>
      <!-- Trigger guard -->
      <circle cx="14" cy="0" r="6" fill="none" stroke="#3a3038" stroke-width="2"/>
      <!-- Crimson power node on receiver -->
      <circle cx="20" cy="-8" r="1.4" fill="#ff8090" filter="url(#p3p2bloom)"/>
    </g>

    <!-- HEAD — turned to align with weapon, head over rear stock -->
    <g transform="translate(-30 -68)">
      <ellipse cx="0" cy="0" rx="22" ry="26" fill="url(#p3p2skin)"/>
      <!-- HAIR — copper-red buzz cut -->
      <g fill="url(#p3p2hair)">
        <path d="M-20,-18 Q-22,-26 0,-30 Q22,-26 20,-18 L18,-12 Q10,-20 0,-20 Q-10,-20 -18,-12 Z"/>
        <!-- Buzz texture -->
        <g stroke="#e84028" stroke-width="0.5" opacity="0.7">
          <line x1="-15" y1="-22" x2="-15" y2="-18"/>
          <line x1="-10" y1="-26" x2="-10" y2="-22"/>
          <line x1="-5" y1="-28" x2="-5" y2="-24"/>
          <line x1="0" y1="-28" x2="0" y2="-24"/>
          <line x1="5" y1="-28" x2="5" y2="-24"/>
          <line x1="10" y1="-26" x2="10" y2="-22"/>
          <line x1="15" y1="-22" x2="15" y2="-18"/>
        </g>
      </g>

      <!-- BROW — set hard, drawn down -->
      <path d="M-18,-2 L-4,-6" stroke="#5a1808" stroke-width="2" stroke-linecap="round"/>
      <path d="M2,-6 L18,-2" stroke="#5a1808" stroke-width="2" stroke-linecap="round"/>

      <!-- EYES — locked on target, narrowed -->
      <ellipse cx="-10" cy="4" rx="3.5" ry="1.8" fill="#fff8e8"/>
      <ellipse cx="-10" cy="4" rx="2" ry="1.4" fill="#3a4828"/>
      <circle cx="-10" cy="4" r="1" fill="#0a0604"/>
      <ellipse cx="10" cy="4" rx="3.5" ry="1.8" fill="#fff8e8"/>
      <ellipse cx="10" cy="4" rx="2" ry="1.4" fill="#3a4828"/>
      <circle cx="10" cy="4" r="1" fill="#0a0604"/>

      <!-- Lower lid lines -->
      <path d="M-14,8 Q-10,10 -6,8" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M6,8 Q10,10 14,8" fill="none" stroke="#3a2010" stroke-width="0.55"/>

      <!-- NOSE -->
      <path d="M0,4 L-2,16 Q0,18 2,16 L0,4 Z" fill="#a8786a" opacity="0.65"/>

      <!-- MOUTH — jaw clenched, lips closed tight -->
      <path d="M-6,22 L6,22" stroke="#5a1808" stroke-width="1" stroke-linecap="round"/>

      <!-- Cheekbone definition -->
      <path d="M-20,8 Q-18,18 -10,22" fill="none" stroke="#a8786a" stroke-width="0.4" opacity="0.55"/>
      <path d="M20,8 Q18,18 10,22" fill="none" stroke="#a8786a" stroke-width="0.4" opacity="0.55"/>

      <!-- Cool light on left side -->
      <path d="M-22,-4 L-14,-6 Q-12,4 -16,12 Z" fill="#a8c0e0" opacity="0.3"/>
      <!-- Warm light on right -->
      <path d="M22,-4 L14,-6 Q12,4 16,12 Z" fill="#d8c8a8" opacity="0.35"/>
    </g>
  </g>

  <!-- DIALOGUE — Thresh: Sable. Orders. -->
  <g>
    <rect x="14" y="14" width="142" height="44" rx="8" fill="#ffffff" stroke="#dc2030" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M76,58 L86,58 L78,70 Z" fill="#ffffff" stroke="#dc2030" stroke-width="2"/>
    <path d="M78,58 L84,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#dc2030">THRESH</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Sable. Orders.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 241,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 241,300"/>
  </g>
</svg>
