<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 1 — Panel 1: Establishing wide. Theodore alone in Clerkenwell courtyard, three days searching</title>
  <desc>28mm wide high-angle establishing shot looking down into a cramped Victorian courtyard behind row of brick terraces. Theodore crouches near base of brick wall, examining cobblestones, notebook on knee. Cat watches from roofline. Grey-gold morning light. Caption only — He had been looking for three days.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p1p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a948a"/>
      <stop offset="100%" stop-color="#b8b0a4"/>
    </linearGradient>
    <linearGradient id="p1p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="p1p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a3028"/>
    </linearGradient>
    <linearGradient id="p1p1brickShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="p1p1theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p1p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p1p1vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
  </defs>

  <!-- SKY band visible above rooftops -->
  <rect width="742" height="80" fill="url(#p1p1sky)"/>
  <!-- Faint fog wisps -->
  <g fill="none" stroke="#a89888" stroke-width="0.6" opacity="0.4">
    <path d="M0,30 Q371,28 742,32"/>
    <path d="M0,55 Q371,57 742,52"/>
  </g>

  <!-- LEFT building (terraced workshop wall) -->
  <g>
    <rect x="0" y="40" width="220" height="324" fill="url(#p1p1brickShadow)"/>
    <g stroke="#2a1810" stroke-width="0.45" opacity="0.55">
      <line x1="0" y1="60" x2="220" y2="60"/>
      <line x1="0" y1="80" x2="220" y2="80"/>
      <line x1="0" y1="100" x2="220" y2="100"/>
      <line x1="0" y1="120" x2="220" y2="120"/>
      <line x1="0" y1="140" x2="220" y2="140"/>
      <line x1="0" y1="160" x2="220" y2="160"/>
      <line x1="0" y1="180" x2="220" y2="180"/>
      <line x1="0" y1="200" x2="220" y2="200"/>
      <line x1="0" y1="220" x2="220" y2="220"/>
      <line x1="0" y1="240" x2="220" y2="240"/>
      <line x1="0" y1="260" x2="220" y2="260"/>
      <line x1="0" y1="280" x2="220" y2="280"/>
      <line x1="0" y1="300" x2="220" y2="300"/>
      <line x1="0" y1="320" x2="220" y2="320"/>
      <line x1="0" y1="340" x2="220" y2="340"/>
      <line x1="40" y1="40" x2="40" y2="80"/>
      <line x1="100" y1="80" x2="100" y2="120"/>
      <line x1="60" y1="160" x2="60" y2="200"/>
      <line x1="140" y1="220" x2="140" y2="260"/>
      <line x1="80" y1="280" x2="80" y2="320"/>
    </g>
    <!-- Small grimy windows -->
    <rect x="40" y="100" width="32" height="40" fill="#3a2818" opacity="0.85"/>
    <rect x="44" y="104" width="24" height="32" fill="#5a4838" opacity="0.7"/>
    <line x1="56" y1="104" x2="56" y2="136" stroke="#1a0c04" stroke-width="0.45"/>
    <rect x="140" y="100" width="32" height="40" fill="#3a2818" opacity="0.85"/>
    <rect x="144" y="104" width="24" height="32" fill="#5a4838" opacity="0.7"/>
    <line x1="156" y1="104" x2="156" y2="136" stroke="#1a0c04" stroke-width="0.45"/>
    <rect x="80" y="220" width="32" height="36" fill="#3a2818" opacity="0.85"/>
    <rect x="84" y="224" width="24" height="28" fill="#5a4838" opacity="0.7"/>
  </g>

  <!-- RIGHT building (taller, the wall with the gap) -->
  <g>
    <rect x="540" y="40" width="202" height="324" fill="url(#p1p1brick)"/>
    <g stroke="#3a2010" stroke-width="0.45" opacity="0.55">
      <line x1="540" y1="60" x2="742" y2="60"/>
      <line x1="540" y1="80" x2="742" y2="80"/>
      <line x1="540" y1="100" x2="742" y2="100"/>
      <line x1="540" y1="120" x2="742" y2="120"/>
      <line x1="540" y1="140" x2="742" y2="140"/>
      <line x1="540" y1="160" x2="742" y2="160"/>
      <line x1="540" y1="180" x2="742" y2="180"/>
      <line x1="540" y1="200" x2="742" y2="200"/>
      <line x1="540" y1="220" x2="742" y2="220"/>
      <line x1="540" y1="240" x2="742" y2="240"/>
      <line x1="540" y1="260" x2="742" y2="260"/>
      <line x1="540" y1="280" x2="742" y2="280"/>
      <line x1="540" y1="300" x2="742" y2="300"/>
      <line x1="540" y1="320" x2="742" y2="320"/>
      <line x1="580" y1="40" x2="580" y2="80"/>
      <line x1="640" y1="80" x2="640" y2="120"/>
      <line x1="600" y1="160" x2="600" y2="200"/>
      <line x1="680" y1="240" x2="680" y2="280"/>
    </g>
    <!-- A few windows -->
    <rect x="600" y="80" width="36" height="44" fill="#3a2818"/>
    <rect x="604" y="84" width="28" height="36" fill="#5a4838" opacity="0.75"/>
    <line x1="618" y1="84" x2="618" y2="120" stroke="#1a0c04" stroke-width="0.5"/>
    <rect x="680" y="160" width="34" height="40" fill="#3a2818"/>
    <rect x="684" y="164" width="26" height="32" fill="#5a4838" opacity="0.75"/>
    <!-- THE WALL GAP — barely visible at base of right building -->
    <rect x="700" y="340" width="14" height="6" fill="#0a0604"/>
  </g>

  <!-- LAUNDRY LINE crossing overhead -->
  <g>
    <path d="M40,30 Q371,90 700,40" fill="none" stroke="#3a2818" stroke-width="0.85"/>
    <!-- Hung clothes -->
    <rect x="180" y="60" width="20" height="30" fill="#a89070" opacity="0.85"/>
    <rect x="280" y="68" width="22" height="34" fill="#7a6858" opacity="0.85"/>
    <rect x="380" y="74" width="18" height="28" fill="#8a7a6a" opacity="0.85"/>
    <rect x="480" y="68" width="20" height="30" fill="#a89888" opacity="0.85"/>
  </g>

  <!-- ROOFLINE EDGE FG (top suggesting elevated angle) — chimney pots, cat -->
  <g>
    <rect x="0" y="0" width="742" height="40" fill="#3a2818"/>
    <rect x="80" y="-2" width="14" height="42" fill="#1a0c04"/>
    <rect x="78" y="6" width="18" height="6" fill="#1a0c04"/>
    <rect x="220" y="-4" width="12" height="44" fill="#1a0c04"/>
    <rect x="218" y="4" width="16" height="6" fill="#1a0c04"/>
    <rect x="500" y="-2" width="14" height="42" fill="#1a0c04"/>
    <rect x="498" y="6" width="18" height="6" fill="#1a0c04"/>
    <!-- Cat on ledge -->
    <g transform="translate(330 36)">
      <path d="M-12,0 L-12,-10 Q0,-14 12,-10 L12,0 Z" fill="#3a2010"/>
      <ellipse cx="-10" cy="-8" rx="3" ry="3" fill="#3a2010"/>
      <path d="M-12,-10 L-14,-15 L-10,-12 Z" fill="#3a2010"/>
      <path d="M-8,-10 L-6,-15 L-4,-12 Z" fill="#3a2010"/>
      <ellipse cx="-10.5" cy="-7.5" rx="0.6" ry="0.6" fill="#c8a868"/>
      <ellipse cx="-9" cy="-7.5" rx="0.6" ry="0.6" fill="#c8a868"/>
    </g>
  </g>

  <!-- COURTYARD FLOOR (cobblestones receding) -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p1p1cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <path d="M220,240 Q380,238 540,242"/>
    <path d="M220,260 Q380,262 540,258"/>
    <path d="M220,280 Q380,278 540,282"/>
    <path d="M220,300 Q380,302 540,298"/>
    <path d="M220,320 Q380,318 540,322"/>
    <path d="M220,340 Q380,342 540,338"/>
  </g>
  <g fill="#1a1410" opacity="0.5">
    <circle cx="280" cy="250" r="1.6"/>
    <circle cx="340" cy="262" r="1.6"/>
    <circle cx="400" cy="252" r="1.6"/>
    <circle cx="460" cy="262" r="1.6"/>
    <circle cx="320" cy="290" r="1.6"/>
    <circle cx="380" cy="280" r="1.6"/>
    <circle cx="440" cy="290" r="1.6"/>
    <circle cx="300" cy="320" r="1.6"/>
    <circle cx="380" cy="312" r="1.6"/>
    <circle cx="460" cy="320" r="1.6"/>
  </g>

  <!-- COURTYARD CLUTTER — rain barrel + crates -->
  <g>
    <!-- Rain barrel left of theodore -->
    <ellipse cx="270" cy="262" rx="22" ry="6" fill="#3a2818"/>
    <rect x="248" y="250" width="44" height="34" fill="#5a3818"/>
    <ellipse cx="270" cy="250" rx="22" ry="6" fill="#7a5028"/>
    <ellipse cx="270" cy="250" rx="18" ry="4" fill="#1a0c04" opacity="0.6"/>
    <line x1="248" y1="262" x2="292" y2="262" stroke="#1a0c04" stroke-width="0.65"/>
    <line x1="248" y1="274" x2="292" y2="274" stroke="#1a0c04" stroke-width="0.65"/>
    <!-- Stacked crates right of frame -->
    <rect x="490" y="260" width="44" height="28" fill="#5a3818"/>
    <line x1="490" y1="270" x2="534" y2="270" stroke="#1a0c04" stroke-width="0.5"/>
    <rect x="494" y="240" width="36" height="22" fill="#5a3818"/>
    <line x1="494" y1="250" x2="530" y2="250" stroke="#1a0c04" stroke-width="0.5"/>
  </g>

  <!-- Fallen leaves scattered -->
  <g fill="#a86838" opacity="0.7">
    <ellipse cx="350" cy="305" rx="4" ry="2.5" transform="rotate(15 350 305)"/>
    <ellipse cx="410" cy="320" rx="4" ry="2.5" transform="rotate(-25 410 320)"/>
    <ellipse cx="460" cy="335" rx="4" ry="2.5" transform="rotate(40 460 335)"/>
    <ellipse cx="500" cy="310" rx="3.5" ry="2" transform="rotate(-15 500 310)"/>
    <ellipse cx="380" cy="345" rx="4" ry="2.5" transform="rotate(60 380 345)"/>
  </g>

  <!-- THEODORE — crouched, small in courtyard, seen from above -->
  <g transform="translate(395 290)">
    <!-- Long faint shadow on cobbles -->
    <ellipse cx="0" cy="22" rx="20" ry="4" fill="#1a0c04" opacity="0.55"/>
    <!-- Crouched body — knees folded under -->
    <path d="M-14,-4 Q-18,12 -14,22 L14,22 Q18,12 14,-4 Z" fill="url(#p1p1vest)"/>
    <!-- Trousers folded under -->
    <path d="M-12,8 L-16,22 L-2,22 Z" fill="#3a2818"/>
    <path d="M2,22 L16,22 L12,8 Z" fill="#3a2818"/>
    <!-- Boots peeking -->
    <ellipse cx="-10" cy="22" rx="4" ry="1.5" fill="#1a0c04"/>
    <ellipse cx="10" cy="22" rx="4" ry="1.5" fill="#1a0c04"/>
    <!-- Shirt sleeve / arm reaching toward ground -->
    <path d="M-14,-4 L-22,8 L-18,12 L-10,0 Z" fill="#a89070"/>
    <!-- Hand fingertip on cobblestone -->
    <ellipse cx="-23" cy="10" rx="3" ry="2" fill="url(#p1p1theoSkin)"/>
    <!-- Notebook on knee -->
    <path d="M0,4 L10,8 L8,14 L-2,12 Z" fill="#d8c8a8"/>
    <line x1="2" y1="8" x2="6" y2="11" stroke="#5a4030" stroke-width="0.3"/>
    <!-- Head from above (top-of-head visible) -->
    <ellipse cx="0" cy="-12" rx="9" ry="8" fill="url(#p1p1theoSkin)"/>
    <!-- Hair tousled (sandy-brown, top-down view) -->
    <g fill="url(#p1p1theoHair)">
      <path d="M-9,-18 Q-10,-22 0,-22 Q10,-22 9,-18 L7,-12 Q0,-14 -7,-12 Z"/>
      <path d="M-4,-22 L-3,-26 L-1,-22 Z"/>
      <path d="M2,-22 L4,-26 L3,-22 Z"/>
    </g>
  </g>

  <!-- CAPTION: He had been looking for three days. -->
  <g>
    <rect x="14" y="14" width="318" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5a4a30" font-style="italic">He had been looking for three days.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,30 Q200,40 400,32"/>
    <path d="M400,32 Q600,40 742,30"/>
    <path d="M0,200 Q200,205 400,200"/>
    <path d="M400,200 Q600,205 742,200"/>
  </g>
</svg>
