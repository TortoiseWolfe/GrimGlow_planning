<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 14 — Panel 1: Luma asks about rules, Theodore answers, Luma analyzes</title>
  <desc>MCU Luma. Luma's lenses scrolling data, scanning. Theodore's face above through gap. Luma: The stories have rules? Consistent rules across regions? / Theodore: Oh, yes! Cold iron keeps them away — keeps you away, I mean. Sorry. And you can't lie, fairies can't lie, and— / Luma: Structured mythology. Consistent internal logic across an oral tradition. That's not random folklore. That's cultural encoding.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p14p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p14p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p14p1floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p14p1theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p14p1lumaSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p14p1sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <radialGradient id="p14p1gapDay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <radialGradient id="p14p1lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p14p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p14p1bg)"/>

  <!-- Top: gap with Theodore -->
  <rect x="0" y="0" width="366" height="40" fill="url(#p14p1floorboard)"/>
  <g>
    <rect x="100" y="20" width="166" height="20" fill="url(#p14p1gapDay)"/>
    <rect x="100" y="20" width="166" height="2" fill="#1a0c04"/>
    <rect x="100" y="38" width="166" height="2" fill="#1a0c04"/>
    <ellipse cx="183" cy="30" rx="50" ry="8" fill="url(#p14p1theoSkin)"/>
    <ellipse cx="170" cy="30" rx="5" ry="3" fill="#fff8e8"/>
    <circle cx="171" cy="30" r="1.6" fill="#7a5028"/>
    <circle cx="171" cy="30" r="0.85" fill="#0a0604"/>
    <ellipse cx="196" cy="30" rx="5" ry="3" fill="#fff8e8"/>
    <circle cx="197" cy="30" r="1.6" fill="#7a5028"/>
    <circle cx="197" cy="30" r="0.85" fill="#0a0604"/>
  </g>

  <!-- Brick BG -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- Beam -->
  <rect x="0" y="280" width="366" height="44" fill="url(#p14p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="366" y2="282"/>
    <line x1="0" y1="316" x2="366" y2="316"/>
  </g>

  <!-- LUMA — center, lenses + scrolling data, recording -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="20" ry="3.5" fill="#0a0604" opacity="0.7"/>
    <path d="M-8,-50 L-12,-2 L-3,0 L-1,-50 Z" fill="url(#p14p1sapphire)"/>
    <path d="M1,-50 L3,0 L12,-2 L8,-50 Z" fill="url(#p14p1sapphire)"/>
    <path d="M-14,-86 L-16,-50 L16,-50 L14,-86 Z" fill="url(#p14p1sapphire)"/>
    <path d="M-16,-86 Q-22,-94 -16,-100 L-9,-100 Z" fill="url(#p14p1sapphire)"/>
    <path d="M16,-86 Q22,-94 16,-100 L9,-100 Z" fill="url(#p14p1sapphire)"/>
    <circle cx="-10" cy="-94" r="1" fill="#a888ff" filter="url(#p14p1bloom)"/>
    <circle cx="10" cy="-94" r="1" fill="#a888ff" filter="url(#p14p1bloom)"/>
    <!-- Both arms forward — recording posture, palms up -->
    <path d="M-16,-78 Q-22,-58 -22,-40 L-14,-40 Q-12,-58 -10,-76 Z" fill="url(#p14p1sapphire)"/>
    <path d="M16,-78 Q22,-58 22,-40 L14,-40 Q12,-58 10,-76 Z" fill="url(#p14p1sapphire)"/>
    <ellipse cx="-22" cy="-40" rx="3.5" ry="2.4" fill="url(#p14p1lumaSkin)"/>
    <ellipse cx="22" cy="-40" rx="3.5" ry="2.4" fill="url(#p14p1lumaSkin)"/>
    <ellipse cx="-22" cy="-40" rx="2" ry="1.2" fill="#1a0838" opacity="0.7"/>
    <ellipse cx="22" cy="-40" rx="2" ry="1.2" fill="#1a0838" opacity="0.7"/>
    <!-- Head -->
    <ellipse cx="0" cy="-114" rx="11" ry="13" fill="url(#p14p1lumaSkin)"/>
    <g fill="#1a0c04">
      <path d="M-9,-122 Q-9,-128 0,-130 Q9,-128 9,-122 L7,-116 Q3,-122 -3,-122 Q-7,-122 -9,-116 Z"/>
      <path d="M7,-120 Q14,-104 16,-88" stroke="#1a0c04" stroke-width="2.4" fill="none"/>
    </g>
    <line x1="7" y1="-120" x2="16" y2="-88" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#p14p1bloom)"/>
    <!-- Lenses with halos -->
    <ellipse cx="-3" cy="-114" rx="3" ry="2" fill="url(#p14p1lensGlow)" filter="url(#p14p1bloom)"/>
    <ellipse cx="3" cy="-114" rx="3" ry="2" fill="url(#p14p1lensGlow)" filter="url(#p14p1bloom)"/>
    <ellipse cx="-3" cy="-114" rx="2" ry="1.4" fill="#a888ff" opacity="0.65" stroke="#7a5ad8" stroke-width="0.4"/>
    <ellipse cx="3" cy="-114" rx="2" ry="1.4" fill="#a888ff" opacity="0.65" stroke="#7a5ad8" stroke-width="0.4"/>
    <path d="M2,-115 L4,-113" stroke="#3a1a78" stroke-width="0.4"/>
    <ellipse cx="0" cy="-108" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- DIALOGUE — Luma: rules question -->
  <g>
    <rect x="14" y="14" width="338" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,14 L186,4 L190,14 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M184,14 L188,14" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">The stories have rules? Consistent rules across regions?</text>

  <!-- DIALOGUE — Theodore: Oh, yes! Cold iron... -->
  <g>
    <rect x="14" y="74" width="338" height="58" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,74 L186,64 L190,74 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M184,74 L188,74" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Oh, yes! Cold iron keeps them away — keeps</text>
  <text x="22" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">you away, I mean. Sorry. And you can't lie...</text>

  <!-- DIALOGUE — Luma: structured mythology -->
  <g>
    <rect x="14" y="148" width="338" height="74" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,222 L190,222 L182,234 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M182,222 L188,222" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Structured mythology. Consistent internal logic</text>
  <text x="22" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">across an oral tradition. That's not random folklore.</text>
  <text x="22" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">That's cultural encoding.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
