<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 22 — Panel 2: Luma's face between ancient + modern script projections — same alphabet, three centuries apart</title>
  <desc>35mm MCU. Luma's face split-illuminated by two projections side by side. Left: ancient carved glyph rendered in ghostly blue-white. Right: modern reference in clean blue-white. The match is unmistakable — same script, same notation, same service. Three hundred years.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p22p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="p22p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="50%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a3828"/>
    </linearGradient>
    <linearGradient id="p22p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p22p2ancientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#88aaff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p2modernGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0d8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a8c0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p2warmLensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p22p2glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p22p2bg)"/>

  <!-- ===== LEFT PROJECTION — ANCIENT GLYPH ===== -->
  <g transform="translate(150 180)">
    <ellipse cx="0" cy="0" rx="120" ry="120" fill="url(#p22p2ancientGlow)" filter="url(#p22p2glow)" opacity="0.85"/>
    <!-- Frame -->
    <rect x="-90" y="-90" width="180" height="180" rx="2" fill="none" stroke="#88aaff" stroke-width="0.85" filter="url(#p22p2bloom)" opacity="0.65"/>
    <text x="-86" y="-78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" opacity="0.75" font-weight="700">ANCIENT — 300+ YEARS</text>

    <!-- The HAND-CARVED HEX-CROSS GLYPH (with imperfections) -->
    <g fill="none" stroke="#a8c0ff" stroke-width="1.85" filter="url(#p22p2bloom)" opacity="0.9" stroke-linecap="round">
      <path d="M-44,-26 L-26,-50"/>
      <path d="M-26,-50 Q-10,-52 14,-52 Q26,-52 28,-50"/>
      <path d="M28,-50 L48,-26"/>
      <path d="M48,-26 Q52,-2 50,22 Q48,34 46,38"/>
      <path d="M46,38 L24,68"/>
      <path d="M24,68 Q4,70 -16,68 Q-30,68 -34,64"/>
      <path d="M-34,64 L-58,32"/>
      <path d="M-58,32 Q-62,8 -60,-12 Q-58,-22 -56,-26"/>
    </g>
    <!-- Inner hex -->
    <g fill="none" stroke="#c0d8ff" stroke-width="1.4" filter="url(#p22p2bloom)" opacity="0.92" stroke-linecap="round">
      <path d="M-30,-18 L-18,-32 L14,-34 L30,-18 L28,16 L18,32 L-14,30 L-32,16 Z"/>
    </g>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#c0d8ff" stroke-width="2.4" filter="url(#p22p2bloom)" stroke-linecap="round"/>
    <line x1="-46" y1="-2" x2="46" y2="-2" stroke="#c0d8ff" stroke-width="2.2" filter="url(#p22p2bloom)" stroke-linecap="round"/>
    <g stroke="#a8c0ff" stroke-width="1.4" stroke-linecap="round" filter="url(#p22p2bloom)">
      <line x1="-26" y1="-26" x2="-12" y2="-12"/>
      <line x1="26" y1="-26" x2="12" y2="-12"/>
      <line x1="-26" y1="26" x2="-12" y2="12"/>
      <line x1="26" y1="26" x2="12" y2="12"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#fff8e8" filter="url(#p22p2bloom)" opacity="0.85"/>
    <!-- Grime in grooves (ancient marks) -->
    <g opacity="0.5">
      <circle cx="-30" cy="-22" r="1.2" fill="#0a0604"/>
      <circle cx="22" cy="-32" r="1" fill="#0a0604"/>
      <circle cx="34" cy="14" r="1.1" fill="#0a0604"/>
      <circle cx="-12" cy="32" r="1" fill="#0a0604"/>
    </g>
    <!-- Tool slip mark -->
    <path d="M14,40 L20,44" stroke="#5a78c8" stroke-width="0.85" opacity="0.65" filter="url(#p22p2bloom)" fill="none"/>
  </g>

  <!-- ===== RIGHT PROJECTION — MODERN REFERENCE ===== -->
  <g transform="translate(592 180)">
    <ellipse cx="0" cy="0" rx="120" ry="120" fill="url(#p22p2modernGlow)" filter="url(#p22p2glow)" opacity="0.95"/>
    <rect x="-90" y="-90" width="180" height="180" rx="2" fill="none" stroke="#c0d8ff" stroke-width="0.9" filter="url(#p22p2bloom)" opacity="0.85"/>
    <text x="-86" y="-78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" opacity="0.95" font-weight="700">CURRENT-ISSUE — REFERENCE</text>

    <!-- THE SAME HEX-CROSS GLYPH — but CLEAN, PROJECTED, regular -->
    <g fill="none" stroke="#c0d8ff" stroke-width="2.4" filter="url(#p22p2bloom)" opacity="0.95" stroke-linecap="round">
      <path d="M-44,-26 L-22,-50 L22,-50 L44,-26 L44,26 L22,50 L-22,50 L-44,26 Z"/>
    </g>
    <g fill="none" stroke="#fff8e8" stroke-width="1.8" filter="url(#p22p2bloom)" opacity="0.95" stroke-linecap="round">
      <path d="M-30,-18 L-14,-34 L14,-34 L30,-18 L30,18 L14,34 L-14,34 L-30,18 Z"/>
    </g>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#fff8e8" stroke-width="2.6" filter="url(#p22p2bloom)" stroke-linecap="round"/>
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#fff8e8" stroke-width="2.4" filter="url(#p22p2bloom)" stroke-linecap="round"/>
    <g stroke="#c0d8ff" stroke-width="1.6" stroke-linecap="round" filter="url(#p22p2bloom)">
      <line x1="-26" y1="-26" x2="-12" y2="-12"/>
      <line x1="26" y1="-26" x2="12" y2="-12"/>
      <line x1="-26" y1="26" x2="-12" y2="12"/>
      <line x1="26" y1="26" x2="12" y2="12"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#fff8e8" filter="url(#p22p2bloom)"/>
    <circle cx="0" cy="0" r="6" fill="#c0d8ff" opacity="0.65" filter="url(#p22p2bloom)"/>
  </g>

  <!-- MATCH indicator between -->
  <g transform="translate(371 180)">
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#fff8e8" stroke-width="0.7" stroke-dasharray="3 2" opacity="0.7" filter="url(#p22p2bloom)"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#80ff80" font-weight="700" filter="url(#p22p2bloom)">MATCH 94.2%</text>
  </g>

  <!-- ===== LUMA — face between projections ===== -->
  <g transform="translate(371 200)">
    <!-- Body suggested -->
    <path d="M-30,90 L-40,40 L40,40 L30,90 Z" fill="url(#p22p2suit)"/>
    <line x1="-20" y1="50" x2="20" y2="50" stroke="#a888e8" stroke-width="1" opacity="0.85" filter="url(#p22p2bloom)"/>
    <!-- Shoulders -->
    <path d="M-40,40 Q-32,20 -8,12 Q14,12 32,20 Q40,40 38,42 L-38,42 Z" fill="url(#p22p2suit)"/>
    <!-- Head — between two lights, split illumination -->
    <ellipse cx="0" cy="-22" rx="36" ry="46" fill="url(#p22p2skin)"/>
    <!-- LEFT side wash (ancient — cooler ghostlier light) -->
    <ellipse cx="-18" cy="-18" rx="20" ry="32" fill="#88aaff" opacity="0.45" filter="url(#p22p2bloom)"/>
    <!-- RIGHT side wash (modern — brighter cleaner) -->
    <ellipse cx="18" cy="-18" rx="20" ry="32" fill="#c0d8ff" opacity="0.55" filter="url(#p22p2bloom)"/>
    <!-- Hair top -->
    <path d="M-28,-50 Q-22,-66 0,-68 Q24,-66 28,-50 L26,-44 Q14,-58 0,-58 Q-14,-58 -26,-44 Z" fill="#0a0604"/>
    <!-- BRAID trailing right-back -->
    <path d="M16,18 Q26,46 28,72" stroke="#0a0604" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M16,20 Q26,46 28,68" stroke="#3a1c08" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M16,18 Q26,46 28,72" stroke="#a888e8" stroke-width="0.85" fill="none" opacity="0.9" filter="url(#p22p2bloom)"/>
    <circle cx="22" cy="36" r="1.2" fill="#fff8e8" filter="url(#p22p2bloom)"/>
    <circle cx="26" cy="58" r="1" fill="#fff8e8" filter="url(#p22p2bloom)"/>

    <!-- Eyes — staring forward, certainty -->
    <ellipse cx="-12" cy="-22" rx="6" ry="3.6" fill="#fff8e8"/>
    <ellipse cx="-12" cy="-21" rx="3.4" ry="2.6" fill="#3a2010"/>
    <circle cx="-12" cy="-21" r="1.8" fill="#0a0604"/>
    <circle cx="-11" cy="-22" r="0.55" fill="#fff8e8" filter="url(#p22p2bloom)"/>
    <ellipse cx="12" cy="-22" rx="6" ry="3.6" fill="#fff8e8"/>
    <ellipse cx="12" cy="-21" rx="3.4" ry="2.6" fill="#3a2010"/>
    <circle cx="12" cy="-21" r="1.8" fill="#0a0604"/>
    <circle cx="13" cy="-22" r="0.55" fill="#fff8e8" filter="url(#p22p2bloom)"/>
    <!-- Brows level — confirmed certainty -->
    <path d="M-19,-32 L-5,-34" stroke="#0a0604" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M5,-34 L19,-32" stroke="#0a0604" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M-2,-12 L0,2 Q2,4 4,2 L6,-12 Z" fill="url(#p22p2skin)" opacity="0.85"/>
    <!-- Mouth — slightly open whispering -->
    <ellipse cx="0" cy="14" rx="4" ry="1.6" fill="#3a1808" opacity="0.7"/>
    <path d="M-4,14 L4,14" stroke="#3a1808" stroke-width="0.85"/>

    <!-- HOLO LENSES warm gold cycling overlay data -->
    <g opacity="0.95">
      <ellipse cx="-12" cy="-21" rx="14" ry="10" fill="url(#p22p2warmLensGlow)" filter="url(#p22p2glow)"/>
      <ellipse cx="12" cy="-21" rx="14" ry="10" fill="url(#p22p2warmLensGlow)" filter="url(#p22p2glow)"/>
      <rect x="-22" y="-30" width="20" height="14" rx="1" fill="none" stroke="#ffd078" stroke-width="0.85" filter="url(#p22p2bloom)"/>
      <line x1="-22" y1="-23" x2="-2" y2="-23" stroke="#ffd078" stroke-width="0.5" opacity="0.85"/>
      <!-- crack -->
      <line x1="-16" y1="-30" x2="-12" y2="-23" stroke="#ffd078" stroke-width="0.5"/>
      <rect x="2" y="-30" width="20" height="14" rx="1" fill="none" stroke="#ffd078" stroke-width="0.85" filter="url(#p22p2bloom)"/>
      <line x1="2" y1="-23" x2="22" y2="-23" stroke="#ffd078" stroke-width="0.5" opacity="0.85"/>
      <!-- Scrolling data dots -->
      <circle cx="-16" cy="-21" r="0.6" fill="#fff8e8" filter="url(#p22p2bloom)"/>
      <circle cx="-8" cy="-21" r="0.6" fill="#fff8e8" filter="url(#p22p2bloom)"/>
      <circle cx="8" cy="-21" r="0.6" fill="#fff8e8" filter="url(#p22p2bloom)"/>
      <circle cx="16" cy="-21" r="0.6" fill="#fff8e8" filter="url(#p22p2bloom)"/>
    </g>
  </g>

  <!-- LUMA whisper (top-left) -->
  <g>
    <rect x="14" y="14" width="306" height="34" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
    <polygon points="180,48 192,48 184,58" fill="white" stroke="#5a3ad8" stroke-width="0.85" stroke-dasharray="3 2"/>
    <line x1="180.5" y1="48" x2="191.5" y2="48" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA (whisper)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Same service. Same notation. Same survey protocol.</text>

  <!-- LUMA second beat — three hundred years -->
  <g>
    <rect x="500" y="316" width="228" height="34" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="540,316 552,316 544,306" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="540.5" y1="316" x2="551.5" y2="316" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="508" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="508" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Three hundred years.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
