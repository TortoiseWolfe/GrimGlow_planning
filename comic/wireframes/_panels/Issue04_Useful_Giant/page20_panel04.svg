<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 20 — Panel 4: Bird's eye on the street corner — Theodore the only upturned face — biggest secret a boy had ever kept</title>
  <desc>28mm high angle from rooftop. Theodore at street corner below, upturned face distinct among downturned heads. Cobblestone geometry, building shadows, gaslight pools at intervals. Caption: The biggest secret a boy had ever kept. And no one to tell.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p20p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p20p4buildingShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="p20p4lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffaa48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p4theoFaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p20p4glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <!-- Cobblestone street (whole panel as the street) -->
  <rect width="742" height="364" fill="url(#p20p4cobble)"/>

  <!-- BUILDING SHADOWS — corner geometry -->
  <g fill="url(#p20p4buildingShadow)" opacity="0.95">
    <!-- Top-left building -->
    <path d="M0,0 L0,140 L160,140 L160,0 Z"/>
    <!-- Top-right building -->
    <path d="M580,0 L580,120 L742,120 L742,0 Z"/>
    <!-- Bottom-left -->
    <path d="M0,250 L0,364 L120,364 L120,260 Z"/>
    <!-- Bottom-right -->
    <path d="M620,260 L620,364 L742,364 L742,260 Z"/>
  </g>
  <!-- Slight roof edge highlights catching light -->
  <g stroke="#3a2010" stroke-width="0.7" opacity="0.65" fill="none">
    <line x1="0" y1="140" x2="160" y2="140"/>
    <line x1="160" y1="0" x2="160" y2="140"/>
    <line x1="580" y1="0" x2="580" y2="120"/>
    <line x1="580" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="250" x2="120" y2="250"/>
    <line x1="120" y1="250" x2="120" y2="364"/>
    <line x1="620" y1="260" x2="620" y2="364"/>
    <line x1="620" y1="260" x2="742" y2="260"/>
  </g>

  <!-- COBBLESTONE GEOMETRY — radiating from intersection -->
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55" fill="none">
    <!-- Horizontal courses -->
    <path d="M120,180 Q300,182 460,178"/>
    <path d="M120,200 Q300,202 460,198"/>
    <path d="M120,220 Q300,222 460,218"/>
    <path d="M120,240 Q300,242 460,238"/>
    <!-- Side street running up-right -->
    <path d="M460,140 L580,160"/>
    <path d="M460,160 L580,180"/>
    <path d="M460,180 L580,200"/>
    <path d="M460,200 L580,220"/>
    <path d="M460,220 L580,240"/>
    <!-- Lower section -->
    <path d="M120,260 Q300,262 480,258"/>
    <path d="M120,290 Q300,292 480,288"/>
    <!-- Shadowy lateral lines -->
    <path d="M0,160 L160,160"/>
    <path d="M0,170 L160,170"/>
  </g>
  <!-- Cobblestone pebble dots -->
  <g fill="#1a0c04" opacity="0.55">
    <circle cx="160" cy="180" r="1"/>
    <circle cx="240" cy="190" r="1"/>
    <circle cx="320" cy="180" r="1"/>
    <circle cx="400" cy="200" r="1"/>
    <circle cx="180" cy="210" r="1"/>
    <circle cx="280" cy="220" r="1"/>
    <circle cx="360" cy="210" r="1"/>
    <circle cx="440" cy="220" r="1"/>
    <circle cx="200" cy="240" r="1"/>
    <circle cx="320" cy="250" r="1"/>
    <circle cx="380" cy="240" r="1"/>
    <circle cx="500" cy="180" r="1"/>
    <circle cx="540" cy="200" r="1"/>
    <circle cx="180" cy="280" r="1"/>
    <circle cx="280" cy="290" r="1"/>
    <circle cx="380" cy="280" r="1"/>
    <circle cx="500" cy="290" r="1"/>
    <circle cx="200" cy="320" r="1"/>
    <circle cx="380" cy="330" r="1"/>
    <circle cx="500" cy="320" r="1"/>
  </g>

  <!-- GASLIGHT POOLS at intervals — amber circles -->
  <ellipse cx="200" cy="200" rx="60" ry="42" fill="url(#p20p4lampPool)" filter="url(#p20p4glow)" opacity="0.7"/>
  <ellipse cx="300" cy="230" rx="80" ry="50" fill="url(#p20p4lampPool)" filter="url(#p20p4glow)" opacity="0.85"/>
  <ellipse cx="500" cy="200" rx="60" ry="42" fill="url(#p20p4lampPool)" filter="url(#p20p4glow)" opacity="0.7"/>
  <ellipse cx="540" cy="320" rx="55" ry="40" fill="url(#p20p4lampPool)" filter="url(#p20p4glow)" opacity="0.6"/>
  <ellipse cx="180" cy="320" rx="55" ry="40" fill="url(#p20p4lampPool)" filter="url(#p20p4glow)" opacity="0.6"/>

  <!-- LAMP POSTS — small dots from above -->
  <g fill="#0a0604">
    <circle cx="200" cy="200" r="2"/>
    <circle cx="500" cy="200" r="2"/>
    <circle cx="180" cy="320" r="2"/>
    <circle cx="540" cy="320" r="2"/>
  </g>
  <g fill="#fff8e8" filter="url(#p20p4bloom)">
    <circle cx="200" cy="200" r="0.85"/>
    <circle cx="500" cy="200" r="0.85"/>
    <circle cx="180" cy="320" r="0.85"/>
    <circle cx="540" cy="320" r="0.85"/>
  </g>

  <!-- ===== FIGURES from above ===== -->

  <!-- THEODORE — center, only upturned face — pale upturned oval distinct -->
  <g transform="translate(370 230)">
    <!-- Subtle lamp pool envelops him -->
    <ellipse cx="0" cy="0" rx="36" ry="28" fill="url(#p20p4theoFaceGlow)" filter="url(#p20p4glow)" opacity="0.55"/>
    <!-- BODY (tiny from above — shoulders + waistcoat) -->
    <ellipse cx="0" cy="6" rx="9" ry="7" fill="#5a2828"/>
    <!-- Trousers -->
    <rect x="-5" y="10" width="10" height="14" fill="#3a2010"/>
    <!-- Boots -->
    <ellipse cx="-3" cy="24" rx="3" ry="1.4" fill="#1a0c04"/>
    <ellipse cx="3" cy="24" rx="3" ry="1.4" fill="#1a0c04"/>
    <!-- HEAD — UPTURNED — visible as pale oval (FACE catching light) -->
    <ellipse cx="0" cy="-2" rx="6.5" ry="6.5" fill="#a86838"/>
    <!-- Hair (from above — sandy brown crown w/ a swirl) -->
    <path d="M-5,-7 Q-3,-9 0,-9 Q3,-9 5,-7 Q4,-3 0,-3 Q-4,-3 -5,-7 Z" fill="#a87838"/>
    <!-- FACE FEATURES tiny from above -->
    <circle cx="-1.5" cy="-2" r="0.5" fill="#0a0604"/>
    <circle cx="1.5" cy="-2" r="0.5" fill="#0a0604"/>
    <ellipse cx="0" cy="0.5" rx="1" ry="0.5" fill="#3a1808" opacity="0.7"/>
    <!-- Highlight on cheek (light from below catches face) -->
    <ellipse cx="0" cy="-1" rx="3" ry="2" fill="#ffd078" opacity="0.4" filter="url(#p20p4bloom)"/>
  </g>

  <!-- Other pedestrians — heads DOWN, dark crowns visible -->

  <!-- Pedestrian 1 — going right on main street -->
  <g transform="translate(260 220)">
    <ellipse cx="0" cy="6" rx="7" ry="6" fill="#3a2010"/>
    <rect x="-4" y="10" width="8" height="12" fill="#2a1810"/>
    <ellipse cx="-2" cy="22" rx="2" ry="1" fill="#1a0c04"/>
    <ellipse cx="2" cy="22" rx="2" ry="1" fill="#1a0c04"/>
    <!-- HEAD (cap from above) -->
    <ellipse cx="0" cy="-2" rx="5" ry="4.5" fill="#1a0c04"/>
    <ellipse cx="0" cy="-2" rx="3" ry="2.4" fill="#3a2010"/>
  </g>

  <!-- Pedestrian 2 — going left on main street -->
  <g transform="translate(440 250)">
    <ellipse cx="0" cy="6" rx="9" ry="7" fill="#5a2030"/>
    <!-- Skirt — bell from above -->
    <path d="M-9,10 L-12,22 L12,22 L9,10 Z" fill="#3a1828"/>
    <!-- Bonnet -->
    <ellipse cx="0" cy="-2" rx="6" ry="5" fill="#3a1828"/>
    <ellipse cx="0" cy="-2" rx="4" ry="3.4" fill="#5a2030"/>
    <!-- Basket -->
    <rect x="9" y="2" width="6" height="6" fill="#5a3018"/>
  </g>

  <!-- Pedestrian 3 — running right -->
  <g transform="translate(300 280)">
    <ellipse cx="0" cy="6" rx="6" ry="5" fill="#3a2010"/>
    <rect x="-3" y="10" width="6" height="10" fill="#2a1810"/>
    <ellipse cx="-2" cy="20" rx="1.6" ry="0.8" fill="#1a0c04"/>
    <ellipse cx="3" cy="22" rx="1.6" ry="0.8" fill="#1a0c04"/>
    <ellipse cx="0" cy="-1" rx="4" ry="3.4" fill="#0a0604"/>
  </g>

  <!-- Pedestrian 4 — distant, cap, downturned -->
  <g transform="translate(220 290)">
    <ellipse cx="0" cy="6" rx="7" ry="6" fill="#3a2010"/>
    <rect x="-4" y="10" width="8" height="12" fill="#2a1810"/>
    <ellipse cx="-2" cy="22" rx="2" ry="1" fill="#1a0c04"/>
    <ellipse cx="2" cy="22" rx="2" ry="1" fill="#1a0c04"/>
    <ellipse cx="0" cy="-2" rx="5" ry="4.5" fill="#1a0c04"/>
  </g>

  <!-- Pedestrian 5 — far right, downturned -->
  <g transform="translate(490 240)">
    <ellipse cx="0" cy="6" rx="7" ry="6" fill="#3a2010"/>
    <rect x="-4" y="10" width="8" height="12" fill="#2a1810"/>
    <ellipse cx="-2" cy="22" rx="2" ry="1" fill="#1a0c04"/>
    <ellipse cx="2" cy="22" rx="2" ry="1" fill="#1a0c04"/>
    <ellipse cx="0" cy="-2" rx="5" ry="4.5" fill="#1a0c04"/>
  </g>

  <!-- Pedestrian 6 — bottom-left, downturned shawled -->
  <g transform="translate(260 320)">
    <ellipse cx="0" cy="6" rx="9" ry="7" fill="#5a2030"/>
    <path d="M-9,10 L-12,22 L12,22 L9,10 Z" fill="#3a1828"/>
    <ellipse cx="0" cy="-2" rx="6" ry="5" fill="#3a1828"/>
  </g>

  <!-- Faint chimney smoke drift across panel from outside (top edges) -->
  <g opacity="0.35" fill="#5a4838">
    <ellipse cx="40" cy="40" rx="40" ry="10"/>
    <ellipse cx="220" cy="60" rx="50" ry="12"/>
    <ellipse cx="450" cy="40" rx="50" ry="12"/>
    <ellipse cx="650" cy="60" rx="40" ry="10"/>
  </g>

  <!-- CAPTION — top-left -->
  <g>
    <rect x="14" y="14" width="402" height="36" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="500">The biggest secret a boy had ever kept. And no one to tell.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
