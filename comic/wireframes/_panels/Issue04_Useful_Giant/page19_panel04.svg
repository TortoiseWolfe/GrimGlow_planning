<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 19 — Panel 4: Bird's-eye camp from above — five points of holographic light — section 4 closes</title>
  <desc>28mm wide from high angle. Five colored points on the timber beams below — silver, copper, emerald, crimson, sapphire-violet — equipment around them, holographic perimeter. Wall gap shows fading amber gaslight. Vast darkness surrounds. The camp is a constellation in the building's infrastructure. Caption — Two secrets in the same camp. Neither one ready to be told.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="p19p4beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="50%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p19p4gapAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p4silverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dad5d0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a5860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p4copperGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p4emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a8848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p4crimsonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8a0828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p4sapphireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p19p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p19p4glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- Vast dark void surrounding the camp -->
  <rect width="742" height="364" fill="url(#p19p4bg)"/>

  <!-- Timber beam structure visible from above — beams crossing -->
  <g opacity="0.6">
    <rect x="0" y="80" width="742" height="14" fill="url(#p19p4beam)"/>
    <rect x="0" y="170" width="742" height="14" fill="url(#p19p4beam)"/>
    <rect x="0" y="260" width="742" height="14" fill="url(#p19p4beam)"/>
    <rect x="120" y="0" width="14" height="364" fill="url(#p19p4beam)"/>
    <rect x="320" y="0" width="14" height="364" fill="url(#p19p4beam)"/>
    <rect x="600" y="0" width="14" height="364" fill="url(#p19p4beam)"/>
  </g>
  <g opacity="0.45">
    <rect x="80" y="40" width="6" height="324" fill="#1a0c04"/>
    <rect x="500" y="40" width="6" height="324" fill="#1a0c04"/>
    <rect x="700" y="40" width="6" height="324" fill="#1a0c04"/>
  </g>

  <!-- Holographic perimeter — geometric border around the camp area (center 180-580 wide, 130-260 tall) -->
  <g stroke="#a8c0ff" stroke-width="0.6" fill="none" opacity="0.55" filter="url(#p19p4bloom)" stroke-dasharray="3 2">
    <rect x="180" y="130" width="400" height="130"/>
  </g>
  <!-- Perimeter emitter dots at corners -->
  <g fill="#88aaff" filter="url(#p19p4bloom)">
    <circle cx="180" cy="130" r="1.6"/>
    <circle cx="580" cy="130" r="1.6"/>
    <circle cx="180" cy="260" r="1.6"/>
    <circle cx="580" cy="260" r="1.6"/>
    <circle cx="380" cy="130" r="1.4"/>
    <circle cx="380" cy="260" r="1.4"/>
  </g>

  <!-- WALL GAP — amber from outside (right side) -->
  <g transform="translate(660 200)">
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="url(#p19p4gapAmber)" filter="url(#p19p4glow)" opacity="0.85"/>
    <rect x="-22" y="-26" width="44" height="52" fill="#ffaa48" opacity="0.45" filter="url(#p19p4bloom)"/>
    <rect x="-18" y="-22" width="36" height="44" fill="#ffd078" opacity="0.55" filter="url(#p19p4bloom)"/>
    <rect x="-12" y="-16" width="24" height="32" fill="#fff8e8" opacity="0.7" filter="url(#p19p4bloom)"/>
  </g>

  <!-- ====== FIVE POINTS OF LIGHT ====== arranged on beams below -->

  <!-- SILVER (Sable) — center-left -->
  <g transform="translate(280 200)">
    <ellipse cx="0" cy="0" rx="36" ry="36" fill="url(#p19p4silverGlow)" filter="url(#p19p4glow)" opacity="0.7"/>
    <circle cx="0" cy="0" r="6" fill="#dad5d0" filter="url(#p19p4bloom)"/>
    <circle cx="0" cy="0" r="2.4" fill="#fff8e8" filter="url(#p19p4bloom)"/>
    <!-- equipment around -->
    <rect x="-12" y="-6" width="4" height="3" fill="#3a3038" opacity="0.85"/>
    <rect x="8" y="-6" width="4" height="3" fill="#3a3038" opacity="0.85"/>
  </g>

  <!-- COPPER (Wren) — center-bottom, near cradle -->
  <g transform="translate(420 235)">
    <ellipse cx="0" cy="0" rx="34" ry="34" fill="url(#p19p4copperGlow)" filter="url(#p19p4glow)" opacity="0.75"/>
    <circle cx="0" cy="0" r="5" fill="#ffd078" filter="url(#p19p4bloom)"/>
    <circle cx="0" cy="0" r="2" fill="#fff8e8" filter="url(#p19p4bloom)"/>
    <!-- cradle visible: brass + glow -->
    <rect x="-8" y="6" width="16" height="6" fill="#a86838" rx="1" opacity="0.9"/>
    <ellipse cx="0" cy="9" rx="14" ry="6" fill="#ffd078" opacity="0.6" filter="url(#p19p4bloom)"/>
  </g>

  <!-- EMERALD (Jink) — top, on a beam -->
  <g transform="translate(220 145)">
    <ellipse cx="0" cy="0" rx="30" ry="30" fill="url(#p19p4emeraldGlow)" filter="url(#p19p4glow)" opacity="0.75"/>
    <circle cx="0" cy="0" r="4.5" fill="#2ed078" filter="url(#p19p4bloom)"/>
    <circle cx="0" cy="0" r="1.8" fill="#fff8e8" filter="url(#p19p4bloom)"/>
    <!-- Wing-pack folded indicators -->
    <path d="M-5,3 L-7,7 M5,3 L7,7" stroke="#2ed078" stroke-width="0.5" opacity="0.7" filter="url(#p19p4bloom)"/>
  </g>

  <!-- CRIMSON (Thresh) — right, near gap -->
  <g transform="translate(540 220)">
    <ellipse cx="0" cy="0" rx="32" ry="32" fill="url(#p19p4crimsonGlow)" filter="url(#p19p4glow)" opacity="0.75"/>
    <circle cx="0" cy="0" r="5" fill="#dc2030" filter="url(#p19p4bloom)"/>
    <circle cx="0" cy="0" r="2" fill="#fff8e8" filter="url(#p19p4bloom)"/>
    <!-- rifle hint -->
    <rect x="2" y="-1" width="9" height="1.2" fill="#3a3030" opacity="0.85"/>
  </g>

  <!-- SAPPHIRE-VIOLET (Luma) — bottom-left, at her station -->
  <g transform="translate(310 245)">
    <ellipse cx="0" cy="0" rx="32" ry="32" fill="url(#p19p4sapphireGlow)" filter="url(#p19p4glow)" opacity="0.75"/>
    <circle cx="0" cy="0" r="5" fill="#5a3ad8" filter="url(#p19p4bloom)"/>
    <circle cx="0" cy="0" r="2" fill="#fff8e8" filter="url(#p19p4bloom)"/>
    <!-- display projection — small rectangle of cool data -->
    <rect x="6" y="-3" width="10" height="6" fill="none" stroke="#a888e8" stroke-width="0.4" opacity="0.85"/>
  </g>

  <!-- Faint bloom of the off-panel ANCIENT GLYPH from far darkness — invisible from this angle but suggested -->
  <!-- (script demands "from this height, the camp is fragile and small. Somewhere in the surrounding darkness, unseen from this angle, an ancient secret waits") -->
  <!-- We show a TINY hint at far edge, very faint -->
  <ellipse cx="40" cy="320" rx="18" ry="14" fill="#88aaff" opacity="0.04" filter="url(#p19p4glow)"/>

  <!-- Power cell faint amber pinpoint — visible from above -->
  <circle cx="195" cy="225" r="2" fill="#ffaa48" filter="url(#p19p4bloom)"/>
  <ellipse cx="195" cy="225" rx="10" ry="8" fill="#ffaa48" opacity="0.18" filter="url(#p19p4glow)"/>

  <!-- Subtle dust particles in the void -->
  <g fill="#5a4838" opacity="0.5">
    <circle cx="60" cy="60" r="0.7"/>
    <circle cx="120" cy="40" r="0.6"/>
    <circle cx="640" cy="60" r="0.7"/>
    <circle cx="700" cy="100" r="0.6"/>
    <circle cx="40" cy="160" r="0.7"/>
    <circle cx="80" cy="280" r="0.6"/>
    <circle cx="660" cy="320" r="0.7"/>
    <circle cx="700" cy="280" r="0.6"/>
  </g>

  <!-- CAPTION closing Section 4 -->
  <g>
    <rect x="14" y="14" width="382" height="36" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="500">Two secrets in the same camp. Neither one ready to be told.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
