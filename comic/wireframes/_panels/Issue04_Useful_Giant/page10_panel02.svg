<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 4 — Page 10 — Panel 2: Theodore's vow + the something-better moment</title>
  <desc>50mm slight high angle. Theodore at human scale, has pulled charging cradle back against his chest cradling it like proof. Crash shard in pocket glows in sympathy with cell. Solemn earnest Victorian working-class vow posture. Theodore: I give you my word. Not a soul. / And I know you're not fairies. I know you're something better.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p2floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5838"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="p10p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p10p2hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p10p2vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p10p2shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p10p2brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="100%" stop-color="#7a5028"/>
    </linearGradient>
    <radialGradient id="p10p2cellGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p2shardGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8e0f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p2dayLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#e8d8b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p2bloom"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="p10p2glow"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#p10p2floor)"/>
  <rect width="494" height="364" fill="url(#p10p2dayLight)"/>

  <!-- Floorboards -->
  <g stroke="#1a0c04" stroke-width="0.85" opacity="0.7">
    <line x1="0" y1="100" x2="494" y2="100"/>
    <line x1="0" y1="220" x2="494" y2="220"/>
    <line x1="0" y1="320" x2="494" y2="320"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.5" fill="none">
    <path d="M40,40 Q200,46 400,40 Q480,42 494,40"/>
    <path d="M40,160 Q200,154 400,160 Q480,162 494,160"/>
    <path d="M40,260 Q200,266 400,260 Q480,258 494,260"/>
  </g>

  <!-- Gap visible right edge -->
  <g>
    <rect x="430" y="220" width="64" height="6" fill="#0a0604"/>
    <ellipse cx="462" cy="223" rx="34" ry="8" fill="#a8c0e0" opacity="0.5" filter="url(#p10p2bloom)"/>
  </g>

  <!-- THEODORE — sitting back from gap, cradle pulled to chest, solemn -->
  <g transform="translate(220 200)">
    <!-- Body torso (front view, slightly turned) -->
    <path d="M-100,40 L-110,140 L110,150 L120,40 Q60,20 0,16 Q-60,20 -100,40 Z" fill="url(#p10p2vest)"/>

    <!-- Shirt sleeves (arms cradling) -->
    <path d="M-100,40 Q-130,56 -130,90 L-100,100 Q-90,70 -70,40 Z" fill="url(#p10p2shirt)"/>
    <path d="M120,40 Q150,56 150,90 L120,100 Q110,70 90,40 Z" fill="url(#p10p2shirt)"/>

    <!-- Both arms come around cradling object at chest -->
    <path d="M-100,100 Q-60,120 -10,120 L-10,140 Q-60,140 -110,140 Z" fill="url(#p10p2shirt)"/>
    <path d="M120,100 Q80,120 30,120 L30,140 Q80,140 130,140 Z" fill="url(#p10p2shirt)"/>

    <!-- HANDS at front (cradling) -->
    <ellipse cx="-50" cy="120" rx="22" ry="13" fill="url(#p10p2skin)"/>
    <ellipse cx="60" cy="120" rx="22" ry="13" fill="url(#p10p2skin)"/>
    <!-- Brass gear ring on forward hand -->
    <ellipse cx="60" cy="118" rx="3" ry="2" fill="#c89858" stroke="#7a5028" stroke-width="0.5"/>
    <!-- Oil stains -->
    <ellipse cx="-50" cy="120" rx="6" ry="2" fill="#1a0c04" opacity="0.5"/>
    <ellipse cx="60" cy="120" rx="6" ry="2" fill="#1a0c04" opacity="0.5"/>

    <!-- ===== CHARGING CRADLE held at chest center ===== -->
    <g transform="translate(0 110)">
      <ellipse cx="0" cy="0" rx="60" ry="40" fill="url(#p10p2cellGlow)" filter="url(#p10p2glow)" opacity="0.85"/>
      <!-- Brass frame -->
      <path d="M-20,12 Q-22,18 -14,22 L14,22 Q22,18 20,12" fill="none" stroke="url(#p10p2brass)" stroke-width="3"/>
      <path d="M-22,-6 Q-25,2 -22,12" fill="none" stroke="url(#p10p2brass)" stroke-width="2.4"/>
      <path d="M22,-6 Q25,2 22,12" fill="none" stroke="url(#p10p2brass)" stroke-width="2.4"/>
      <path d="M-20,-4 L-8,12" fill="none" stroke="url(#p10p2brass)" stroke-width="1.6"/>
      <path d="M20,-4 L8,12" fill="none" stroke="url(#p10p2brass)" stroke-width="1.6"/>
      <!-- Copper coils -->
      <g stroke="#c87833" stroke-width="1" fill="none">
        <path d="M-22,-2 Q-12,-6 0,-3 Q12,-1 22,-2"/>
        <path d="M-22,4 Q-12,2 0,5 Q12,4 22,4"/>
        <path d="M-22,12 Q-12,8 0,11 Q12,10 22,12"/>
      </g>
      <!-- Power cell -->
      <ellipse cx="0" cy="2" rx="18" ry="13" fill="#e8f0ff" opacity="0.85" filter="url(#p10p2bloom)"/>
      <path d="M-8,-2 L0,-8 L8,-4 L10,4 L4,10 L-4,10 L-12,4 Z" fill="#a8c0e0" stroke="#5a4878" stroke-width="0.7"/>
      <ellipse cx="0" cy="2" rx="6" ry="3" fill="#ffffff"/>
      <ellipse cx="-2" cy="0" rx="2" ry="1" fill="#ffffff"/>
    </g>

    <!-- CRASH SHARD GLOW — from waistcoat pocket below cradle (resonance) -->
    <g transform="translate(0 200)">
      <ellipse cx="0" cy="0" rx="40" ry="14" fill="url(#p10p2shardGlow)" filter="url(#p10p2bloom)" opacity="0.65"/>
      <ellipse cx="0" cy="0" rx="6" ry="3" fill="#a8c0e0" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="2.4" ry="1.2" fill="#fff8e8"/>
    </g>

    <!-- HEAD — large, looking down at cradle/forward, solemn -->
    <ellipse cx="0" cy="-60" rx="60" ry="68" fill="url(#p10p2skin)"/>
    <g fill="url(#p10p2hair)">
      <path d="M-60,-120 Q-60,-138 0,-142 Q60,-138 60,-120 L54,-104 Q28,-118 0,-118 Q-28,-118 -54,-104 Z"/>
      <path d="M-44,-104 Q-42,-80 -34,-58 L-26,-60 Q-36,-80 -40,-104 Z"/>
      <path d="M-14,-114 Q-12,-80 -4,-58 L4,-60 Q-6,-80 -10,-114 Z"/>
      <path d="M14,-114 Q16,-80 24,-58 L32,-60 Q22,-80 18,-114 Z"/>
      <path d="M44,-104 Q46,-80 54,-58 L62,-60 Q52,-80 48,-104 Z"/>
    </g>
    <!-- Eyebrows -->
    <path d="M-36,-72 Q-20,-78 -8,-72" stroke="#5a4030" stroke-width="3" fill="none"/>
    <path d="M8,-72 Q20,-78 36,-72" stroke="#5a4030" stroke-width="3" fill="none"/>
    <!-- Eyes — looking down -->
    <ellipse cx="-22" cy="-58" rx="8" ry="4.5" fill="#fff8e8"/>
    <ellipse cx="-20" cy="-58" rx="5" ry="3" fill="#7a5028"/>
    <circle cx="-20" cy="-58" r="2.4" fill="#0a0604"/>
    <ellipse cx="-22" cy="-60" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="22" cy="-58" rx="8" ry="4.5" fill="#fff8e8"/>
    <ellipse cx="20" cy="-58" rx="5" ry="3" fill="#7a5028"/>
    <circle cx="20" cy="-58" r="2.4" fill="#0a0604"/>
    <ellipse cx="18" cy="-60" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <!-- Nose -->
    <path d="M0,-50 L-8,-26 Q0,-22 8,-26 Z" fill="#a87858" opacity="0.55"/>
    <!-- Mouth — closed, serious vow posture -->
    <path d="M-16,-8 Q0,-4 16,-8" fill="none" stroke="#5a2818" stroke-width="1"/>
    <!-- Freckles -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="-30" cy="-38" r="1.4"/>
      <circle cx="-20" cy="-32" r="1.4"/>
      <circle cx="0" cy="-38" r="1.4"/>
      <circle cx="20" cy="-32" r="1.4"/>
      <circle cx="30" cy="-38" r="1.4"/>
    </g>
    <!-- Cool light from cradle below illuminating chin/jaw from below -->
    <path d="M-50,-20 Q0,0 50,-20 L50,0 Q0,16 -50,0 Z" fill="#a8c0e0" opacity="0.4"/>
  </g>

  <!-- DIALOGUE — Theodore: I give you my word. Not a soul. -->
  <g>
    <rect x="14" y="14" width="240" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M120,58 L130,58 L122,70 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M122,58 L128,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">I give you my word. Not a soul.</text>

  <!-- DIALOGUE — Theodore: And I know you're not fairies. I know you're something better. -->
  <g>
    <rect x="124" y="74" width="356" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,118 L270,118 L262,130 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M262,118 L268,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="132" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="132" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#1a1a1a">And I know you're not fairies. I know you're something better.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q380,76 494,80"/>
    <path d="M0,260 Q120,262 240,258 Q380,256 494,260"/>
  </g>
</svg>
