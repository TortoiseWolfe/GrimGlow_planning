<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 12 — Panel 3: Conditions Two and Three — operational orders + we are soldiers</title>
  <desc>50mm. Sable continuing — two fingers raised, then three. Sable: Condition two. You follow operational instructions without improvisation. When I say withdraw, you withdraw. When I say silent, you are silent. / Condition three. You understand what we are. We are not spirits. Not fair folk. Not magical beings from your stories. We are soldiers. Stranded soldiers.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p12p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p12p3timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p12p3darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p12p3silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p12p3hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <filter id="p12p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p12p3bg)"/>

  <!-- Brick BG -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- Beam -->
  <rect x="0" y="280" width="366" height="44" fill="url(#p12p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="366" y2="282"/>
    <line x1="0" y1="316" x2="366" y2="316"/>
  </g>

  <!-- SABLE — wide stance, both arms extended (counting conditions) -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="20" ry="3.5" fill="#0a0604" opacity="0.7"/>
    <path d="M-8,-50 L-12,-2 L-3,0 L-1,-50 Z" fill="url(#p12p3silver)"/>
    <path d="M1,-50 L3,0 L12,-2 L8,-50 Z" fill="url(#p12p3silver)"/>
    <path d="M-14,-86 L-16,-50 L16,-50 L14,-86 Z" fill="url(#p12p3silver)"/>
    <ellipse cx="14" cy="-84" rx="6" ry="4" fill="#3a3038" opacity="0.75"/>
    <path d="M-16,-86 Q-22,-94 -16,-100 L-9,-100 Z" fill="url(#p12p3silver)"/>
    <path d="M16,-86 Q22,-94 16,-100 L9,-100 Z" fill="url(#p12p3silver)"/>
    <circle cx="-10" cy="-94" r="1" fill="#fff8e8" filter="url(#p12p3bloom)"/>
    <circle cx="10" cy="-94" r="1" fill="#fff8e8" filter="url(#p12p3bloom)"/>

    <!-- LEFT ARM — TWO FINGERS UP (condition 2) -->
    <path d="M-16,-86 Q-30,-100 -32,-126 L-24,-130 Q-22,-104 -10,-86 Z" fill="url(#p12p3silver)"/>
    <ellipse cx="-30" cy="-130" rx="3.5" ry="3" fill="url(#p12p3darkSkin)"/>
    <!-- Two fingers up -->
    <path d="M-32,-134 L-32,-152 Q-30,-156 -28,-152 L-28,-134 Z" fill="url(#p12p3darkSkin)"/>
    <path d="M-26,-134 L-26,-150 Q-24,-154 -22,-150 L-22,-134 Z" fill="url(#p12p3darkSkin)"/>

    <!-- RIGHT ARM — THREE FINGERS UP (condition 3) -->
    <path d="M16,-86 Q30,-100 32,-126 L24,-130 Q22,-104 10,-86 Z" fill="url(#p12p3silver)"/>
    <ellipse cx="30" cy="-130" rx="3.5" ry="3" fill="url(#p12p3darkSkin)"/>
    <!-- Three fingers up -->
    <path d="M22,-134 L22,-148 Q24,-152 26,-148 L26,-134 Z" fill="url(#p12p3darkSkin)"/>
    <path d="M28,-134 L28,-152 Q30,-156 32,-152 L32,-134 Z" fill="url(#p12p3darkSkin)"/>
    <path d="M34,-134 L34,-150 Q36,-154 38,-150 L38,-134 Z" fill="url(#p12p3darkSkin)"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="-114" rx="11" ry="13" fill="url(#p12p3darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-9,-122 Q-10,-128 0,-130 Q10,-128 9,-122 L7,-117 Q3,-122 -3,-122 Q-7,-122 -9,-117 Z"/>
    </g>
    <ellipse cx="-3" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-114" r="0.6" fill="#0a0604"/>
    <ellipse cx="3" cy="-114" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-114" r="0.6" fill="#0a0604"/>
    <path d="M-7,-118 L-1,-119" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M1,-119 L7,-118" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M-3,-108 L3,-108" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- DIALOGUE — Sable: Condition two. You follow operational instructions without improvisation. When I say withdraw, you withdraw. When I say silent, you are silent. -->
  <g>
    <rect x="14" y="14" width="338" height="74" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,88 L130,88 L122,100 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M122,88 L128,88" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">Condition two. You follow operational</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">instructions without improvisation. When I say</text>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">withdraw, you withdraw. When I say silent, silent.</text>

  <!-- DIALOGUE — Sable: Condition three. We are soldiers. Stranded soldiers. -->
  <g>
    <rect x="14" y="104" width="338" height="92" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,196 L130,196 L122,208 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M122,196 L128,196" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">Condition three. You understand what we</text>
  <text x="22" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">are. We are not spirits. Not fair folk.</text>
  <text x="22" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">Not magical beings from your stories.</text>
  <text x="22" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">We are soldiers. Stranded soldiers.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,260 Q120,262 240,258 Q300,256 366,260"/>
  </g>
</svg>
