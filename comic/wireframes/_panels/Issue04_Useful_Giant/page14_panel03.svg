<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 14 — Panel 3: Iron taboo + Jink notices coincidence + Luma fascinated</title>
  <desc>Wide. Theodore's animated face above. Jink at left, Luma at right. Theodore: ...you must always leave a coin for the fairies, at a crossroads, or they'll lead you astray. And iron — cold iron — that's the strongest protection against fairy magic. / Jink: Iron? Really? We use iron in our hull plating. It's a structural component. / Theodore: Well, there you are, then. It all fits. / Luma: Cross-cultural ironwork taboo. Fascinating.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p14p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p14p3timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p14p3floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p14p3theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p14p3jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p14p3emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <linearGradient id="p14p3sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <radialGradient id="p14p3gapDay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <radialGradient id="p14p3lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p14p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p14p3bg)"/>

  <!-- Top: floorboard with Theodore's face animated -->
  <rect x="0" y="0" width="742" height="80" fill="url(#p14p3floorboard)"/>
  <g>
    <rect x="240" y="20" width="262" height="60" fill="url(#p14p3gapDay)"/>
    <rect x="240" y="20" width="262" height="2" fill="#1a0c04"/>
    <rect x="240" y="78" width="262" height="2" fill="#1a0c04"/>
    <ellipse cx="372" cy="50" rx="100" ry="22" fill="url(#p14p3theoSkin)"/>
    <ellipse cx="350" cy="48" rx="9" ry="6" fill="#fff8e8"/>
    <circle cx="352" cy="48" r="3" fill="#7a5028"/>
    <circle cx="352" cy="48" r="1.4" fill="#0a0604"/>
    <ellipse cx="394" cy="48" rx="9" ry="6" fill="#fff8e8"/>
    <circle cx="396" cy="48" r="3" fill="#7a5028"/>
    <circle cx="396" cy="48" r="1.4" fill="#0a0604"/>
    <!-- Mouth — open, animated -->
    <ellipse cx="372" cy="64" rx="14" ry="4" fill="#a85838"/>
  </g>

  <!-- Brick BG -->
  <rect x="0" y="80" width="60" height="200" fill="#2a1810" opacity="0.7"/>
  <rect x="682" y="80" width="60" height="200" fill="#2a1810" opacity="0.7"/>

  <!-- Beam -->
  <rect x="40" y="280" width="662" height="40" fill="url(#p14p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="40" y1="282" x2="702" y2="282"/>
    <line x1="40" y1="316" x2="702" y2="316"/>
  </g>

  <!-- JINK left — pointing UP at his suit (the iron coincidence) -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p14p3emerald)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p14p3emerald)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p14p3emerald)"/>
    <path d="M-9,-72 Q-2,-66 5,-72 Q-2,-58 -8,-54 Z" fill="#3a2818" opacity="0.7"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p14p3emerald)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p14p3emerald)"/>
    <circle cx="-10" cy="-86" r="1" fill="#9aff9a" filter="url(#p14p3bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#9aff9a" filter="url(#p14p3bloom)"/>
    <!-- Right arm — pointing at chest plate (their own suit) -->
    <path d="M15,-76 Q20,-66 14,-58 L8,-60 Q12,-66 10,-74 Z" fill="url(#p14p3emerald)"/>
    <ellipse cx="14" cy="-60" rx="2.4" ry="1.4" fill="url(#p14p3jinkSkin)"/>
    <!-- Left arm at side -->
    <path d="M-15,-76 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p14p3emerald)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p14p3jinkSkin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p14p3jinkSkin)"/>
    <g fill="#d8a838">
      <circle cx="-9" cy="-114" r="3.5"/>
      <circle cx="-2" cy="-118" r="4"/>
      <circle cx="6" cy="-114" r="3.5"/>
      <circle cx="-12" cy="-110" r="2.4"/>
      <circle cx="12" cy="-110" r="2.4"/>
    </g>
    <!-- Eyes wide, surprised -->
    <ellipse cx="-4" cy="-104" rx="1.5" ry="1.1" fill="#fff8e8"/>
    <circle cx="-4" cy="-104" r="0.7" fill="#1a4830"/>
    <ellipse cx="4" cy="-104" rx="1.5" ry="1.1" fill="#fff8e8"/>
    <circle cx="4" cy="-104" r="0.7" fill="#1a4830"/>
    <!-- Brows raised -->
    <path d="M-7,-110 L-1,-112" stroke="#88603a" stroke-width="0.85"/>
    <path d="M1,-112 L7,-110" stroke="#88603a" stroke-width="0.85"/>
    <!-- Mouth — slightly open in epiphany -->
    <ellipse cx="0" cy="-96" rx="2.4" ry="1.2" fill="#5a2818"/>
  </g>

  <!-- LUMA right — fascinated, lenses scrolling -->
  <g transform="translate(560 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p14p3sapphire)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p14p3sapphire)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p14p3sapphire)"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p14p3sapphire)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p14p3sapphire)"/>
    <circle cx="-10" cy="-86" r="1" fill="#a888ff" filter="url(#p14p3bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#a888ff" filter="url(#p14p3bloom)"/>
    <!-- Hands gesturing as if ticking off pattern points -->
    <path d="M-15,-76 Q-22,-66 -22,-50 L-14,-50 Q-12,-66 -10,-74 Z" fill="url(#p14p3sapphire)"/>
    <ellipse cx="-22" cy="-50" rx="2.4" ry="1.4" fill="url(#p14p3jinkSkin)"/>
    <ellipse cx="-22" cy="-50" rx="1.4" ry="0.7" fill="#1a0838" opacity="0.7"/>
    <path d="M15,-76 Q22,-66 22,-50 L14,-50 Q12,-66 10,-74 Z" fill="url(#p14p3sapphire)"/>
    <ellipse cx="22" cy="-50" rx="2.4" ry="1.4" fill="url(#p14p3jinkSkin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p14p3jinkSkin)"/>
    <g fill="#1a0c04">
      <path d="M-9,-112 Q-9,-118 0,-120 Q9,-118 9,-112 L7,-106 Q3,-112 -3,-112 Q-7,-112 -9,-106 Z"/>
      <path d="M7,-110 Q14,-94 16,-78" stroke="#1a0c04" stroke-width="2.4" fill="none"/>
    </g>
    <line x1="7" y1="-110" x2="16" y2="-78" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#p14p3bloom)"/>
    <ellipse cx="-3" cy="-104" rx="3" ry="2" fill="url(#p14p3lensGlow)" filter="url(#p14p3bloom)"/>
    <ellipse cx="3" cy="-104" rx="3" ry="2" fill="url(#p14p3lensGlow)" filter="url(#p14p3bloom)"/>
    <ellipse cx="-3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.65" stroke="#7a5ad8" stroke-width="0.4"/>
    <ellipse cx="3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.65" stroke="#7a5ad8" stroke-width="0.4"/>
    <!-- Slight smile (fascination breakthrough) -->
    <path d="M-3,-96 Q0,-94 3,-96" fill="none" stroke="#3a1a78" stroke-width="0.7"/>
  </g>

  <!-- DIALOGUE — Theodore (long iron taboo line) -->
  <g>
    <rect x="14" y="100" width="572" height="58" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,100 L266,90 L270,100 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M264,100 L268,100" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">And you must always leave a coin for the fairies, at a crossroads, or they'll lead you astray.</text>
  <text x="22" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">And iron — <tspan font-weight="700">cold iron</tspan> — that's the strongest protection against fairy magic.</text>

  <!-- DIALOGUE — Jink: Iron? Really? Hull plating. -->
  <g>
    <rect x="14" y="170" width="498" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,214 L130,214 L122,226 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M122,214 L128,214" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Iron? Really? We use iron in our hull plating. It's a structural component.</text>

  <!-- DIALOGUE — Theodore: Well, there you are, then. It all fits. -->
  <g>
    <rect x="200" y="226" width="280" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M340,226 L346,216 L350,226 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M344,226 L348,226" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="208" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="208" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Well, there you are, then. It all fits.</text>

  <!-- DIALOGUE — Luma: Cross-cultural ironwork taboo. Fascinating. -->
  <g>
    <rect x="438" y="282" width="290" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M580,326 L590,326 L582,338 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M582,326 L588,326" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="446" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="446" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">Cross-cultural ironwork taboo. Fascinating.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,100 Q200,102 400,98 Q580,96 742,100"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
