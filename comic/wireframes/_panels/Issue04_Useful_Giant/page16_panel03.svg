<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 4 — Page 16 — Panel 3: Sable CU silent — listening, processing</title>
  <desc>Narrow CU. Sable's face. Eyes calculating. She has heard everything — Luma's pattern, Wren's validation, Theodore's instinct. Silent panel. The weight of decision becoming permanent.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p16p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p16p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p16p3hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <radialGradient id="p16p3coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="238" height="364" fill="url(#p16p3bg)"/>
  <rect width="238" height="364" fill="url(#p16p3coolWash)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="238" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- SABLE CU -->
  <g transform="translate(120 240)">
    <!-- Shoulders -->
    <path d="M-70,90 L-70,40 L70,40 L70,90 Z" fill="url(#p16p3suit)"/>
    <path d="M-70,40 Q-50,16 0,8 Q50,16 70,40 L60,52 L-60,52 Z" fill="url(#p16p3suit)"/>
    <ellipse cx="50" cy="20" rx="14" ry="9" fill="#3a3038" opacity="0.75"/>
    <circle cx="-30" cy="20" r="2" fill="#fff8e8" filter="url(#p16p3bloom)"/>
    <circle cx="30" cy="20" r="2" fill="#fff8e8" filter="url(#p16p3bloom)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-60" rx="36" ry="44" fill="url(#p16p3skin)"/>
    <g fill="url(#p16p3hair)">
      <path d="M-32,-92 Q-32,-104 0,-108 Q26,-104 26,-92 L24,-84 Q12,-94 0,-94 Q-22,-94 -30,-84 Z"/>
    </g>
    <!-- Brow drawn down (calculating) -->
    <path d="M-22,-72 L-8,-76" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,-76 L18,-72" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes — narrow, looking down/inward (deciding) -->
    <ellipse cx="-14" cy="-64" rx="4.5" ry="2.4" fill="#fff8e8"/>
    <ellipse cx="-14" cy="-62" rx="2.6" ry="1.6" fill="#3a2010"/>
    <circle cx="-14" cy="-62" r="1.4" fill="#0a0604"/>
    <ellipse cx="6" cy="-64" rx="4" ry="2" fill="#fff8e8"/>
    <ellipse cx="6" cy="-62" rx="2.4" ry="1.4" fill="#3a2010"/>
    <circle cx="6" cy="-62" r="1.2" fill="#0a0604"/>
    <!-- Lower lid lift (thinking) -->
    <path d="M-18,-60 Q-14,-58 -10,-60" fill="none" stroke="#3a2010" stroke-width="0.55"/>
    <path d="M2,-60 Q6,-58 10,-60" fill="none" stroke="#3a2010" stroke-width="0.55"/>
    <!-- Nose -->
    <path d="M-6,-58 L-4,-42 Q-2,-38 0,-38 L4,-40 L0,-56 Z" fill="url(#p16p3skin)"/>
    <!-- Mouth — line, complex emotion (not warmth, not fury — calculation) -->
    <path d="M-14,-26 L8,-26" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Cool light pattern -->
    <g opacity="0.45">
      <path d="M-32,-60 L-22,-62 L-20,-58 L-32,-54 Z" fill="#a8c0e0"/>
      <path d="M-32,-44 L-22,-46 L-20,-42 L-32,-38 Z" fill="#a8c0e0"/>
    </g>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 238,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 238,300"/>
  </g>
</svg>
