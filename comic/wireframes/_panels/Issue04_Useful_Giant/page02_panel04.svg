<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 2 — Panel 4: Jink frozen on timber beam, "Oh no"</title>
  <desc>50mm medium shot inside wall cavity. Jink sits frozen on timber beam, legs dangling, staring toward gap behind viewer where warm light floods in. Light brown skin, golden blonde curly hair, emerald metallic suit with chest soot streak from I3, dust at arms. Frozen recognition + alarm — eyes wide, mouth open, no grin. Squad shapes turn behind. Cool blue-white perimeter glow + warm daylight wash from gap. Jink (under breath): Oh no.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p2p4cavityBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="p2p4timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p2p4skinJ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <radialGradient id="p2p4hairJ" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#f8e088"/>
      <stop offset="60%" stop-color="#d8a838"/>
      <stop offset="100%" stop-color="#a87828"/>
    </radialGradient>
    <linearGradient id="p2p4suitJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="50%" stop-color="#2e8b57"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <radialGradient id="p2p4perimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p4dayWash" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#a89888" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p4bloom"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- INTERIOR -->
  <rect width="366" height="364" fill="url(#p2p4cavityBg)"/>

  <!-- WARM DAYLIGHT WASHING IN FROM LEFT (the gap is off-frame left) -->
  <rect width="366" height="364" fill="url(#p2p4dayWash)"/>

  <!-- BACK WALL — rough brick interior -->
  <rect x="0" y="40" width="366" height="200" fill="#3a2010" opacity="0.85"/>
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55">
    <line x1="0" y1="60" x2="366" y2="60"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="100" x2="366" y2="100"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="180" x2="366" y2="180"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="220" x2="366" y2="220"/>
    <line x1="60" y1="40" x2="60" y2="60"/>
    <line x1="180" y1="80" x2="180" y2="100"/>
    <line x1="120" y1="120" x2="120" y2="140"/>
    <line x1="280" y1="160" x2="280" y2="180"/>
    <line x1="40" y1="200" x2="40" y2="220"/>
    <line x1="220" y1="200" x2="220" y2="220"/>
  </g>

  <!-- LEFT EDGE timber stud (vertical) -->
  <rect x="0" y="0" width="42" height="364" fill="url(#p2p4timber)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M8,30 Q22,40 36,30"/>
    <path d="M8,90 Q22,100 36,90"/>
    <path d="M8,150 Q22,160 36,150"/>
    <path d="M8,220 Q22,230 36,220"/>
    <path d="M8,300 Q22,310 36,300"/>
  </g>

  <!-- HORIZONTAL TIMBER BEAM (Jink sits on it) -->
  <rect x="42" y="220" width="324" height="36" fill="url(#p2p4timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="42" y1="222" x2="366" y2="222"/>
    <line x1="42" y1="252" x2="366" y2="252"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.35" opacity="0.5" fill="none">
    <path d="M60,232 Q160,238 260,232 Q330,228 366,232"/>
    <path d="M60,244 Q160,238 260,244 Q330,248 366,244"/>
  </g>
  <!-- Knot in timber -->
  <ellipse cx="280" cy="238" rx="6" ry="3" fill="#1a0c04" opacity="0.65"/>

  <!-- FLOOR/joist below beam — dark -->
  <rect x="42" y="256" width="324" height="108" fill="#1a0c04"/>
  <g stroke="#0a0604" stroke-width="0.5" opacity="0.7">
    <line x1="42" y1="280" x2="366" y2="280"/>
    <line x1="42" y1="320" x2="366" y2="320"/>
  </g>

  <!-- HOLOGRAPHIC PERIMETER EMITTER (right BG) -->
  <g transform="translate(310 184)">
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="url(#p2p4perimGlow)" filter="url(#p2p4bloom)"/>
    <path d="M-5,-7 L0,-10 L5,-7 L7,0 L4,7 L-4,7 L-7,0 Z" fill="#a8c0e0" opacity="0.85"/>
    <circle cx="0" cy="0" r="1.6" fill="#fff8e8"/>
  </g>

  <!-- BG SQUAD SHAPES (turning, alarmed) — silhouettes deeper in cavity -->
  <g opacity="0.75">
    <!-- Sable silhouette (silver) -->
    <g transform="translate(220 200)">
      <ellipse cx="0" cy="-12" rx="6" ry="7" fill="#9a9098"/>
      <path d="M-6,-6 L-8,8 L8,8 L6,-6 Z" fill="#9a9098"/>
      <path d="M-8,-12 Q0,-18 8,-12 L6,-8 L-6,-8 Z" fill="#bab8c0"/>
    </g>
    <!-- Wren (copper) — smaller, further -->
    <g transform="translate(266 196)">
      <ellipse cx="0" cy="-10" rx="5" ry="6" fill="#a87858"/>
      <path d="M-5,-4 L-6,8 L6,8 L5,-4 Z" fill="#c87a35"/>
    </g>
    <!-- Thresh (crimson) — weapon up -->
    <g transform="translate(180 200)">
      <ellipse cx="0" cy="-12" rx="6" ry="7" fill="#a85a48"/>
      <path d="M-7,-6 L-8,8 L8,8 L7,-6 Z" fill="#a83040"/>
      <!-- Weapon sketch -->
      <line x1="6" y1="-2" x2="14" y2="-6" stroke="#3a2010" stroke-width="1.5"/>
    </g>
    <!-- Luma (sapphire) -->
    <g transform="translate(140 198)">
      <ellipse cx="0" cy="-10" rx="5" ry="6" fill="#a87858"/>
      <path d="M-5,-4 L-6,8 L6,8 L5,-4 Z" fill="#5a3ad8"/>
    </g>
  </g>

  <!-- JINK — main subject, frozen on timber beam, legs dangling -->
  <g transform="translate(170 260)">
    <!-- Body shadow on beam -->
    <ellipse cx="0" cy="0" rx="22" ry="3" fill="#0a0604" opacity="0.65"/>

    <!-- Right leg dangling down off beam -->
    <path d="M-12,0 L-16,38 L-8,46 L-4,4 Z" fill="url(#p2p4suitJ)"/>
    <!-- Left leg dangling -->
    <path d="M4,4 L8,46 L16,38 L12,0 Z" fill="url(#p2p4suitJ)"/>
    <!-- Boots -->
    <ellipse cx="-12" cy="48" rx="5" ry="2" fill="#1a4830"/>
    <ellipse cx="12" cy="48" rx="5" ry="2" fill="#1a4830"/>
    <!-- Hologram seams on legs -->
    <line x1="-14" y1="6" x2="-15" y2="36" stroke="#9aff9a" stroke-width="0.6" opacity="0.7"/>
    <line x1="14" y1="6" x2="15" y2="36" stroke="#9aff9a" stroke-width="0.6" opacity="0.7"/>

    <!-- Torso — emerald suit -->
    <path d="M-16,-32 L-20,2 L20,2 L16,-32 Z" fill="url(#p2p4suitJ)"/>
    <!-- CHEST SOOT STREAK (carries from I3) -->
    <path d="M-12,-26 Q-2,-22 8,-28 Q-4,-12 -10,-8 Z" fill="#3a2818" opacity="0.65"/>
    <!-- Suit seams + holographic accent -->
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#9aff9a" stroke-width="0.7" opacity="0.7"/>
    <circle cx="0" cy="-22" r="1.4" fill="#d8ffe8" filter="url(#p2p4bloom)"/>
    <circle cx="-10" cy="-18" r="1" fill="#9aff9a"/>
    <circle cx="10" cy="-18" r="1" fill="#9aff9a"/>

    <!-- Arms — frozen mid-motion, slightly back, gripping beam -->
    <path d="M-16,-30 Q-26,-16 -28,2 L-22,4 Q-20,-14 -18,-28 Z" fill="url(#p2p4suitJ)"/>
    <path d="M16,-30 Q26,-16 28,2 L22,4 Q20,-14 18,-28 Z" fill="url(#p2p4suitJ)"/>
    <!-- Hands gripping beam -->
    <ellipse cx="-26" cy="2" rx="3.5" ry="2.5" fill="url(#p2p4skinJ)"/>
    <ellipse cx="26" cy="2" rx="3.5" ry="2.5" fill="url(#p2p4skinJ)"/>
    <!-- Dust at arms (early-wear) -->
    <ellipse cx="-22" cy="-12" rx="3" ry="1" fill="#7a6858" opacity="0.5"/>
    <ellipse cx="22" cy="-12" rx="3" ry="1" fill="#7a6858" opacity="0.5"/>

    <!-- Head — turned toward viewer's left (the gap), slight upward angle -->
    <ellipse cx="0" cy="-50" rx="11" ry="13" fill="url(#p2p4skinJ)"/>
    <!-- HAIR — wild bright golden blonde curly -->
    <g fill="url(#p2p4hairJ)">
      <path d="M-12,-58 Q-16,-72 0,-78 Q16,-72 12,-58 L8,-52 Q4,-66 -4,-66 Q-12,-66 -16,-52 Z"/>
      <!-- Curls -->
      <circle cx="-10" cy="-72" r="3"/>
      <circle cx="-2" cy="-78" r="3.4"/>
      <circle cx="6" cy="-76" r="3"/>
      <circle cx="12" cy="-70" r="2.6"/>
      <circle cx="-14" cy="-66" r="2.4"/>
      <circle cx="14" cy="-62" r="2"/>
      <circle cx="-8" cy="-80" r="2"/>
      <circle cx="4" cy="-82" r="2"/>
    </g>
    <!-- Eyes — WIDE, frozen -->
    <ellipse cx="-3.5" cy="-50" rx="2.4" ry="1.8" fill="#fff8e8"/>
    <circle cx="-3" cy="-50" r="1" fill="#1a4830"/>
    <circle cx="-3" cy="-50" r="0.6" fill="#0a0604"/>
    <ellipse cx="3.5" cy="-50" rx="2.4" ry="1.8" fill="#fff8e8"/>
    <circle cx="4" cy="-50" r="1" fill="#1a4830"/>
    <circle cx="4" cy="-50" r="0.6" fill="#0a0604"/>
    <!-- Brows raised -->
    <path d="M-8,-58 L-2,-60" stroke="#88603a" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M2,-60 L8,-58" stroke="#88603a" stroke-width="0.7" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M0,-46 L-1.4,-42 Q0,-41 1.4,-42 Z" fill="#7a4830" opacity="0.55"/>
    <!-- Mouth — slightly open, NOT a grin -->
    <ellipse cx="0" cy="-38" rx="2.8" ry="1.4" fill="#5a2818" opacity="0.85"/>
    <path d="M-3,-38 Q0,-40 3,-38" fill="none" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Cool light on face from camp interior + warm rim from gap -->
    <path d="M-11,-50 L-7,-60 Q-4,-62 -8,-44 Z" fill="#a8c0e0" opacity="0.35"/>
    <path d="M11,-50 L7,-44 Q4,-42 8,-58 Z" fill="#d8c8a8" opacity="0.4"/>
  </g>

  <!-- DIALOGUE — Jink (under breath, to no one): Oh no. -->
  <g>
    <rect x="14" y="14" width="116" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" stroke-dasharray="4,2" filter="url(#balloonShadow)"/>
    <path d="M68,58 L78,58 L70,70 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M70,58 L76,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">Oh no.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,78 240,82 Q300,84 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
