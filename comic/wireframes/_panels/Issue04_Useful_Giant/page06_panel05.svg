<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 6 — Panel 5: Theodore from above hears "Wipe", expression shifts to fear/assessment</title>
  <desc>50mm slight high angle. Theodore lying on dusty wooden workshop floor, face near gap between warped floorboards. Expression has SHIFTED — wonder gone, jaw tight, eyes wide but assessing. Hands curled inward — protective. Sandy-brown hair against dust, freckles, oil-stained fingers. Faintest cool blue-white from gap. Warm grey daylight from grimy windows. Theodore (whispered, to himself): Wipe...</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p5floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5838"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="p6p5floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p6p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p6p5hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p6p5shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p6p5vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p6p5gapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p5dayLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#e8d8b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p5bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- BG: warm workshop floor (top-down view) -->
  <rect width="366" height="364" fill="url(#p6p5floor)"/>
  <rect width="366" height="364" fill="url(#p6p5dayLight)"/>

  <!-- Floorboard texture (long planks running horizontally) -->
  <g stroke="#1a0c04" stroke-width="0.85" opacity="0.7">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
    <line x1="0" y1="310" x2="366" y2="310"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.5" fill="none">
    <path d="M40,40 Q200,46 360,40"/>
    <path d="M40,120 Q200,114 360,120"/>
    <path d="M40,200 Q200,206 360,200"/>
    <path d="M40,280 Q200,274 360,280"/>
  </g>
  <!-- Dust on floor -->
  <g fill="#8a7868" opacity="0.5">
    <ellipse cx="60" cy="60" rx="14" ry="3"/>
    <ellipse cx="220" cy="100" rx="20" ry="4"/>
    <ellipse cx="300" cy="200" rx="14" ry="3"/>
    <ellipse cx="80" cy="280" rx="16" ry="3"/>
  </g>

  <!-- THE GAP between floorboards (where Theodore's face is near) -->
  <g>
    <rect x="180" y="158" width="186" height="6" fill="#0a0604"/>
    <ellipse cx="220" cy="161" rx="50" ry="6" fill="url(#p6p5gapGlow)" filter="url(#p6p5bloom)" opacity="0.6"/>
    <!-- Crumbled wood splinters at edges -->
    <ellipse cx="200" cy="165" rx="4" ry="1" fill="#5a3818" opacity="0.7"/>
    <ellipse cx="280" cy="165" rx="4" ry="1" fill="#5a3818" opacity="0.7"/>
  </g>

  <!-- THEODORE — TOP-DOWN view, lying flat on floor, head near gap -->
  <g transform="translate(160 220)">
    <!-- Body extending DOWN/right (away from gap) -->
    <!-- Vest -->
    <path d="M-50,30 L-30,180 L80,180 L100,30 Z" fill="url(#p6p5vest)"/>
    <!-- Shirt sleeves -->
    <path d="M-50,30 Q-90,80 -120,150 L-100,160 Q-70,80 -40,30 Z" fill="url(#p6p5shirt)"/>
    <path d="M100,30 Q140,80 170,150 L150,160 Q120,80 90,30 Z" fill="url(#p6p5shirt)"/>

    <!-- HANDS — CURLED INWARD (protective) -->
    <!-- Left hand near gap -->
    <ellipse cx="-110" cy="158" rx="22" ry="14" fill="url(#p6p5skin)"/>
    <!-- Curled fingers -->
    <g fill="url(#p6p5skin)">
      <ellipse cx="-122" cy="148" rx="10" ry="5" transform="rotate(-30 -122 148)"/>
      <ellipse cx="-128" cy="158" rx="9" ry="4" transform="rotate(-50 -128 158)"/>
      <ellipse cx="-128" cy="170" rx="9" ry="4" transform="rotate(-70 -128 170)"/>
    </g>
    <!-- Right hand -->
    <ellipse cx="160" cy="158" rx="22" ry="14" fill="url(#p6p5skin)"/>
    <g fill="url(#p6p5skin)">
      <ellipse cx="172" cy="148" rx="10" ry="5" transform="rotate(30 172 148)"/>
      <ellipse cx="178" cy="158" rx="9" ry="4" transform="rotate(50 178 158)"/>
      <ellipse cx="178" cy="170" rx="9" ry="4" transform="rotate(70 178 170)"/>
    </g>
    <!-- Brass gear ring on left index -->
    <ellipse cx="-122" cy="148" rx="3" ry="2" fill="#c89858" stroke="#7a5028" stroke-width="0.5"/>
    <!-- Oil stains -->
    <ellipse cx="-115" cy="156" rx="6" ry="2.4" fill="#1a0c04" opacity="0.5"/>
    <ellipse cx="155" cy="156" rx="6" ry="2.4" fill="#1a0c04" opacity="0.5"/>

    <!-- HEAD — top-down, near gap, face turned toward gap (forehead toward gap = up in frame) -->
    <ellipse cx="0" cy="-20" rx="46" ry="56" fill="url(#p6p5skin)"/>
    <!-- HAIR -->
    <g fill="url(#p6p5hair)">
      <!-- Hair from above (top of head) -->
      <path d="M-46,30 Q-46,60 0,72 Q46,60 46,30 L40,20 Q24,40 0,40 Q-24,40 -40,20 Z"/>
      <!-- Strands hanging forward toward gap -->
      <path d="M-30,-50 Q-30,-30 -22,-10 L-12,-12 Q-22,-30 -28,-50 Z"/>
      <path d="M-10,-58 Q-10,-30 0,-10 L8,-12 Q0,-30 -2,-58 Z"/>
      <path d="M14,-58 Q14,-30 24,-10 L34,-12 Q24,-30 22,-58 Z"/>
      <!-- Top of head visible from behind (he's looking down at gap) -->
      <path d="M-30,30 Q-30,50 0,52 Q30,50 30,30 L24,12 Q0,30 -24,12 Z" fill="#5a4838"/>
    </g>

    <!-- EYE — looking toward gap (down in frame), wide but tight, no longer awed -->
    <!-- Left eye visible -->
    <ellipse cx="-18" cy="-30" rx="6" ry="3.5" fill="#fff8e8"/>
    <ellipse cx="-18" cy="-30" rx="3" ry="2.4" fill="#7a5028"/>
    <circle cx="-18" cy="-30" r="1.4" fill="#0a0604"/>
    <ellipse cx="-19" cy="-31" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <!-- Right eye -->
    <ellipse cx="18" cy="-30" rx="6" ry="3.5" fill="#fff8e8"/>
    <ellipse cx="18" cy="-30" rx="3" ry="2.4" fill="#7a5028"/>
    <circle cx="18" cy="-30" r="1.4" fill="#0a0604"/>
    <ellipse cx="17" cy="-31" rx="0.85" ry="0.55" fill="#fff8e8"/>

    <!-- BROW DRAWN DOWN (no longer raised in awe — assessing) -->
    <path d="M-26,-40 L-10,-42" stroke="#5a4030" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M10,-42 L26,-40" stroke="#5a4030" stroke-width="2.4" stroke-linecap="round"/>

    <!-- NOSE -->
    <path d="M0,-20 L-4,-2 Q0,2 4,-2 Z" fill="#a87858" opacity="0.65"/>

    <!-- MOUTH — set, lips closed tight (jaw tight) -->
    <path d="M-12,18 L12,18" stroke="#3a1808" stroke-width="1.4" stroke-linecap="round"/>

    <!-- FRECKLES -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="-26" cy="-12" r="1.4"/>
      <circle cx="-14" cy="-6" r="1.4"/>
      <circle cx="0" cy="-12" r="1.4"/>
      <circle cx="14" cy="-6" r="1.4"/>
      <circle cx="26" cy="-12" r="1.4"/>
      <circle cx="-8" cy="0" r="1.2"/>
      <circle cx="8" cy="0" r="1.2"/>
    </g>

    <!-- Cool light on lower face (closer to gap) -->
    <path d="M-40,8 L40,8 L36,28 Q0,32 -36,28 Z" fill="#a8c0e0" opacity="0.25"/>
  </g>

  <!-- Distant grimy window (warm light source) -->
  <rect x="306" y="40" width="50" height="60" fill="#a89888" opacity="0.85"/>
  <line x1="331" y1="40" x2="331" y2="100" stroke="#3a2818" stroke-width="0.5"/>
  <line x1="306" y1="70" x2="356" y2="70" stroke="#3a2818" stroke-width="0.5"/>

  <!-- DIALOGUE — Theodore (whispered, to himself, NOT into gap): Wipe... -->
  <g>
    <rect x="14" y="14" width="100" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" stroke-dasharray="4,2" filter="url(#balloonShadow)"/>
    <path d="M50,58 L60,58 L52,70 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2" stroke-dasharray="2,1.5"/>
    <path d="M52,58 L58,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-style="italic">Wipe...</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 180,82 Q300,84 366,80"/>
    <path d="M0,300 Q60,302 180,298 Q300,296 366,300"/>
  </g>
</svg>
