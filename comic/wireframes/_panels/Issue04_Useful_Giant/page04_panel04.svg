<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 4 — Panel 4: Sable yields under conditions, Wren scanning in BG</title>
  <desc>65mm MCU inside camp. Sable stares at Jink with compressed fury — not resolved, stored. Hand lifted from sidearm, jaw still clenched. BG: Wren slightly out of focus, arms folded, head tilted, watching, hair UP messy bun, copper suit heavily stained. Faint copper-amber scanner sweep. Cool blue-white camp light, warm daylight cut by Jink's silhouette. Sable: Bring him to the beam. Wren, perimeter scan — if anyone else followed, I want to know. / Thresh. Weapon down but ready. Wren: Already scanning.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p4p4cavityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p4p4skinS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p4p4suitS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p4p4hairS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="p4p4skinW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p4p4suitW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p4p4scannerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p4p4coolWash" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p4p4warmRim" cx="100%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p4p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p4p4softBg"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- BG cavity -->
  <rect width="366" height="364" fill="url(#p4p4cavityBg)"/>
  <rect width="366" height="364" fill="url(#p4p4coolWash)"/>
  <rect width="366" height="364" fill="url(#p4p4warmRim)"/>

  <!-- Brick interior wall -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="60" y1="140" x2="60" y2="200"/>
  </g>
  <!-- Geometric ward pattern -->
  <g stroke="#a8c0e0" stroke-width="0.4" opacity="0.4" fill="none">
    <path d="M0,160 L40,158 L42,162 L80,160"/>
  </g>

  <!-- WREN in BG — out of focus, arms folded, watching -->
  <g transform="translate(280 230)" filter="url(#p4p4softBg)" opacity="0.85">
    <ellipse cx="0" cy="20" rx="12" ry="2" fill="#0a0604" opacity="0.55"/>
    <!-- Legs -->
    <path d="M-7,-30 L-9,18 L-3,20 L-1,-30 Z" fill="url(#p4p4suitW)"/>
    <path d="M1,-30 L3,20 L9,18 L7,-30 Z" fill="url(#p4p4suitW)"/>
    <ellipse cx="-7" cy="20" rx="3.5" ry="1.4" fill="#5a2810"/>
    <ellipse cx="7" cy="20" rx="3.5" ry="1.4" fill="#5a2810"/>
    <!-- COPPER DUST at knees -->
    <ellipse cx="-7" cy="-2" rx="3" ry="0.8" fill="#a86838" opacity="0.55"/>
    <ellipse cx="7" cy="-2" rx="3" ry="0.8" fill="#a86838" opacity="0.55"/>
    <!-- Torso -->
    <path d="M-12,-60 L-14,-30 L14,-30 L12,-60 Z" fill="url(#p4p4suitW)"/>
    <!-- SCORCH MARK on left shoulder -->
    <ellipse cx="-12" cy="-58" rx="4" ry="3" fill="#1a0c04" opacity="0.75"/>
    <!-- Shoulders -->
    <path d="M-14,-60 Q-20,-68 -14,-72 L-7,-70 L-10,-56 Z" fill="url(#p4p4suitW)"/>
    <path d="M14,-60 Q20,-68 14,-72 L7,-70 L10,-56 Z" fill="url(#p4p4suitW)"/>
    <!-- Holographic copper-gold accent -->
    <circle cx="-10" cy="-66" r="1" fill="#ffd888" filter="url(#p4p4bloom)"/>
    <circle cx="10" cy="-66" r="1" fill="#ffd888" filter="url(#p4p4bloom)"/>
    <!-- ARMS FOLDED -->
    <path d="M-14,-60 Q-16,-50 -8,-46 L8,-48 Q16,-52 14,-60 L8,-58 Q-2,-54 -8,-58 Z" fill="url(#p4p4suitW)"/>
    <!-- OIL-STAINED forearms -->
    <ellipse cx="-6" cy="-50" rx="6" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="6" cy="-50" rx="6" ry="2" fill="#1a0c04" opacity="0.55"/>
    <!-- Head — tilted slightly -->
    <ellipse cx="2" cy="-78" rx="8" ry="10" fill="url(#p4p4skinW)"/>
    <!-- HAIR UP messy bun -->
    <g fill="#1a0c04">
      <path d="M-5,-86 Q-6,-92 4,-93 Q12,-92 11,-86 L9,-82 Q6,-86 2,-86 Q-3,-86 -5,-82 Z"/>
      <ellipse cx="6" cy="-96" rx="5" ry="4"/>
      <!-- Strands escaping -->
      <path d="M-4,-90 Q-6,-86 -5,-80" stroke="#1a0c04" stroke-width="0.5" fill="none"/>
      <path d="M10,-90 Q12,-86 11,-80" stroke="#1a0c04" stroke-width="0.5" fill="none"/>
    </g>
    <!-- Eyes — narrow -->
    <ellipse cx="-1" cy="-78" rx="1.4" ry="0.7" fill="#fff8e8"/>
    <circle cx="-1" cy="-78" r="0.5" fill="#1a0c04"/>
    <ellipse cx="5" cy="-78" rx="1.4" ry="0.7" fill="#fff8e8"/>
    <circle cx="5" cy="-78" r="0.5" fill="#1a0c04"/>
    <!-- Mouth set -->
    <path d="M-1,-72 Q2,-71 5,-72" fill="none" stroke="#3a2010" stroke-width="0.5"/>

    <!-- COPPER-AMBER SCANNER SWEEP from wrist -->
    <ellipse cx="-12" cy="-46" rx="40" ry="28" fill="url(#p4p4scannerGlow)" filter="url(#p4p4bloom)" opacity="0.65"/>
    <!-- Scan arc lines -->
    <g stroke="#ffd888" stroke-width="0.55" opacity="0.7" fill="none">
      <path d="M-30,-50 Q-12,-72 8,-50"/>
      <path d="M-26,-44 Q-12,-58 4,-44"/>
      <path d="M-20,-40 Q-12,-48 0,-40"/>
    </g>
    <!-- Wrist diagnostic core -->
    <circle cx="-12" cy="-50" r="1.6" fill="#ffe8a8" filter="url(#p4p4bloom)"/>
  </g>

  <!-- SABLE — main subject MCU, three-quarter facing right (toward gap = Jink off-frame right) -->
  <g transform="translate(140 250)">
    <!-- Torso -->
    <path d="M-46,40 L-50,114 L40,114 L46,40 Q22,30 0,28 Q-22,30 -46,40 Z" fill="url(#p4p4suitS)"/>
    <line x1="0" y1="28" x2="0" y2="114" stroke="#5a5860" stroke-width="0.85"/>

    <!-- Shoulders -->
    <path d="M-46,40 Q-56,16 -36,8 L-26,32 Q-44,32 -54,42 Z" fill="url(#p4p4suitS)"/>
    <path d="M46,40 Q56,16 36,8 L26,32 Q44,32 54,42 Z" fill="url(#p4p4suitS)"/>
    <!-- Hologram seams -->
    <line x1="-46" y1="40" x2="-36" y2="8" stroke="#7a7080" stroke-width="0.7"/>
    <line x1="46" y1="40" x2="36" y2="8" stroke="#7a7080" stroke-width="0.7"/>
    <circle cx="-22" cy="20" r="1.6" fill="#fff8e8" filter="url(#p4p4bloom)"/>
    <circle cx="22" cy="20" r="1.6" fill="#fff8e8" filter="url(#p4p4bloom)"/>

    <!-- SOOT BLOOM on right shoulder -->
    <ellipse cx="40" cy="20" rx="14" ry="8" fill="#3a3038" opacity="0.75"/>
    <ellipse cx="36" cy="22" rx="9" ry="4" fill="#1a1820" opacity="0.55"/>

    <!-- Right arm — RAISED off sidearm (just lifted) -->
    <g transform="translate(46 22)">
      <path d="M0,8 Q14,-2 28,8 L24,16 Q12,8 4,16 Z" fill="url(#p4p4suitS)"/>
      <ellipse cx="28" cy="10" rx="4" ry="3" fill="url(#p4p4skinS)"/>
      <!-- Hand half-open (just released sidearm) -->
      <ellipse cx="32" cy="14" rx="3" ry="2" fill="url(#p4p4skinS)"/>
    </g>

    <!-- Left arm — at side -->
    <path d="M-46,40 Q-56,60 -50,90 L-42,90 Q-46,60 -42,38 Z" fill="url(#p4p4suitS)"/>
    <ellipse cx="-46" cy="92" rx="3.5" ry="2.4" fill="url(#p4p4skinS)"/>

    <!-- SIDEARM holstered at hip — HAND JUST LIFTED -->
    <rect x="-28" y="58" width="10" height="14" fill="#1a1820"/>
    <rect x="-26" y="60" width="6" height="10" fill="#3a3038"/>
    <line x1="-23" y1="60" x2="-23" y2="70" stroke="#1a1820" stroke-width="0.5"/>

    <!-- HEAD — three-quarter facing right -->
    <g transform="translate(0 -10)">
      <ellipse cx="0" cy="0" rx="32" ry="38" fill="url(#p4p4skinS)"/>
      <!-- Sharp angular jaw -->
      <path d="M-30,-4 Q-26,18 -10,32 L4,34 Q22,30 30,12 L26,-4 Z" fill="url(#p4p4skinS)"/>
      <!-- Ear right -->
      <ellipse cx="22" cy="0" rx="4" ry="7" fill="url(#p4p4skinS)"/>
      <ellipse cx="22" cy="0" rx="2" ry="4" fill="#3a2010" opacity="0.5"/>

      <!-- HAIR — silver-white buzz cut -->
      <g fill="url(#p4p4hairS)">
        <path d="M-30,-30 Q-30,-42 -2,-46 Q24,-42 24,-30 L22,-22 Q12,-32 -2,-32 Q-22,-32 -28,-22 Z"/>
        <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
          <line x1="-26" y1="-36" x2="-26" y2="-32"/>
          <line x1="-20" y1="-40" x2="-20" y2="-36"/>
          <line x1="-14" y1="-42" x2="-14" y2="-38"/>
          <line x1="-8" y1="-42" x2="-8" y2="-38"/>
          <line x1="-2" y1="-44" x2="-2" y2="-40"/>
          <line x1="4" y1="-42" x2="4" y2="-38"/>
          <line x1="10" y1="-40" x2="10" y2="-36"/>
          <line x1="16" y1="-38" x2="16" y2="-34"/>
          <line x1="22" y1="-34" x2="22" y2="-30"/>
        </g>
      </g>
      <!-- Warm rim on hair (top) -->
      <path d="M-30,-30 Q-30,-42 -2,-46 Q24,-42 24,-30" fill="none" stroke="#e8d8b8" stroke-width="0.7" opacity="0.65"/>

      <!-- BROW — drawn down -->
      <path d="M-22,-12 L-8,-16" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,-16 L18,-12" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>

      <!-- EYES — narrow, locked on Jink (off-frame right) -->
      <ellipse cx="-14" cy="-4" rx="4" ry="2" fill="#fff8e8"/>
      <ellipse cx="-12" cy="-4" rx="2.4" ry="1.6" fill="#3a2010"/>
      <circle cx="-12" cy="-4" r="1.2" fill="#0a0604"/>
      <ellipse cx="6" cy="-4" rx="3.5" ry="2" fill="#fff8e8"/>
      <ellipse cx="8" cy="-4" rx="2" ry="1.4" fill="#3a2010"/>
      <circle cx="8" cy="-4" r="1.1" fill="#0a0604"/>

      <!-- Lower lid lines -->
      <path d="M-18,-1 Q-12,2 -8,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M2,-1 Q8,2 12,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>

      <!-- NOSE -->
      <path d="M-6,0 L-4,18 Q-2,22 0,22 L4,20 L0,2 Z" fill="url(#p4p4skinS)"/>

      <!-- MOUTH — A LINE, jaw still clenched -->
      <path d="M-14,32 L8,30" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Jaw muscle -->
      <path d="M-26,18 Q-22,26 -14,30" fill="none" stroke="#3a2010" stroke-width="0.5" opacity="0.6"/>

      <!-- Cool light pattern on left -->
      <g opacity="0.4">
        <path d="M-30,-4 L-18,-6 L-16,-2 L-30,2 Z" fill="#a8c0e0"/>
        <path d="M-30,12 L-18,10 L-16,14 L-30,18 Z" fill="#a8c0e0"/>
      </g>
    </g>
  </g>

  <!-- DIALOGUE — Sable: Bring him to the beam. Wren, perimeter scan — if anyone else followed, I want to know. -->
  <g>
    <rect x="14" y="14" width="338" height="58" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,72 L190,72 L182,84 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M182,72 L188,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Bring him to the beam. Wren, perimeter</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">scan — if anyone else followed, I want to know.</text>

  <!-- DIALOGUE — Sable: Thresh. Weapon down but ready. -->
  <g>
    <rect x="14" y="86" width="266" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M150,130 L160,130 L152,142 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M152,130 L158,130" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Thresh. Weapon down but ready.</text>

  <!-- DIALOGUE — Wren (off-panel, calm): Already scanning. -->
  <g>
    <rect x="160" y="144" width="170" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-dasharray="3,2" filter="url(#balloonShadow)"/>
    <path d="M310,188 L320,188 L312,200 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-dasharray="2,1.5"/>
    <path d="M312,188 L318,188" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="168" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="168" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">Already scanning.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 180,82 Q300,84 366,80"/>
    <path d="M0,300 Q60,302 180,298 Q300,296 366,300"/>
  </g>
</svg>
