<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 10 — Panel 4: Wren analyzes cradle's resonance principle</title>
  <desc>Medium shot. Wren examining cradle from below (it's still up at gap), her finger tracing in air over a copper-gold projection of the resonance equations. Engineer mode. Wren: If the resonance charger scales... the induction ratio...</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p10p4timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p10p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p10p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p10p4projGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p10p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p10p4bg)"/>

  <!-- BG brick -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
  </g>

  <!-- Beam -->
  <rect x="0" y="280" width="366" height="44" fill="url(#p10p4timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="366" y2="282"/>
    <line x1="0" y1="320" x2="366" y2="320"/>
  </g>

  <!-- HOLOGRAPHIC PROJECTION (resonance equations + cradle schematic) — large above Wren -->
  <g transform="translate(220 130)">
    <ellipse cx="0" cy="0" rx="100" ry="68" fill="url(#p10p4projGlow)" filter="url(#p10p4glow)" opacity="0.6"/>
    <!-- Schematic of the cradle -->
    <g stroke="#ffd888" stroke-width="0.85" fill="none" opacity="0.85">
      <!-- Cradle outline -->
      <path d="M-30,8 Q-32,18 -22,22 L22,22 Q32,18 30,8"/>
      <path d="M-32,-8 Q-36,2 -32,8"/>
      <path d="M32,-8 Q36,2 32,8"/>
      <!-- Cell -->
      <ellipse cx="0" cy="4" rx="14" ry="9"/>
      <!-- Annotation arrows -->
      <path d="M-30,8 L-50,-4"/>
      <path d="M30,8 L50,-4"/>
    </g>
    <!-- Equations / labels -->
    <text x="-66" y="-4" font-family="Helvetica Neue" font-size="6" fill="#ffd888" font-weight="700">RATIO</text>
    <text x="-66" y="4" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" opacity="0.85">3:7</text>
    <text x="46" y="-4" font-family="Helvetica Neue" font-size="6" fill="#ffd888" font-weight="700">SHOULD BE</text>
    <text x="46" y="4" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" opacity="0.85">5:9</text>
    <text x="-30" y="-30" font-family="Helvetica Neue" font-size="5" fill="#fff8e8" opacity="0.9">RESONANCE Hz: 142.3</text>
    <text x="-30" y="40" font-family="Helvetica Neue" font-size="5" fill="#fff8e8" opacity="0.9">EFFICIENCY: 80% (CRUDE)</text>
    <!-- Tiny tick marks -->
    <g stroke="#fff8e8" stroke-width="0.4" opacity="0.7">
      <line x1="-50" y1="48" x2="-40" y2="48"/>
      <line x1="-30" y1="48" x2="-20" y2="48"/>
      <line x1="-10" y1="48" x2="0" y2="48"/>
      <line x1="10" y1="48" x2="20" y2="48"/>
    </g>
  </g>

  <!-- WREN — looking up at projection, finger pointing/tracing -->
  <g transform="translate(140 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p10p4suit)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p10p4suit)"/>
    <ellipse cx="-7" cy="-1" rx="3.5" ry="1.4" fill="#5a2810"/>
    <ellipse cx="7" cy="-1" rx="3.5" ry="1.4" fill="#5a2810"/>
    <ellipse cx="-7" cy="-26" rx="3" ry="0.85" fill="#a86838" opacity="0.55"/>
    <ellipse cx="7" cy="-26" rx="3" ry="0.85" fill="#a86838" opacity="0.55"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p10p4suit)"/>
    <ellipse cx="-13" cy="-76" rx="4" ry="3" fill="#1a0c04" opacity="0.75"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p10p4suit)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p10p4suit)"/>
    <circle cx="-10" cy="-86" r="1" fill="#ffd888" filter="url(#p10p4bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#ffd888" filter="url(#p10p4bloom)"/>
    <!-- RIGHT arm RAISED tracing in air -->
    <path d="M15,-78 Q34,-66 50,-50 L46,-44 Q30,-58 12,-72 Z" fill="url(#p10p4suit)"/>
    <ellipse cx="50" cy="-48" rx="4.5" ry="3" fill="url(#p10p4skin)"/>
    <!-- Finger pointing (extending) -->
    <path d="M52,-50 L66,-58 Q70,-56 70,-52 L66,-46 L54,-44 Z" fill="url(#p10p4skin)"/>
    <!-- Glow at fingertip (interacting with hologram) -->
    <circle cx="68" cy="-54" r="2.4" fill="#ffd888" filter="url(#p10p4bloom)"/>
    <ellipse cx="50" cy="-48" rx="2.4" ry="1.4" fill="#1a0c04" opacity="0.55"/>
    <!-- Left arm at side -->
    <path d="M-15,-78 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-76 Z" fill="url(#p10p4suit)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p10p4skin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="9" ry="11" fill="url(#p10p4skin)"/>
    <g fill="#1a0c04">
      <path d="M-7,-111 Q-8,-118 0,-119 Q8,-118 7,-111 L5,-106 Q2,-112 -2,-112 Q-5,-112 -7,-106 Z"/>
      <ellipse cx="0" cy="-122" rx="5" ry="4"/>
    </g>
    <!-- Eyes — focused, looking at hologram -->
    <ellipse cx="-3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.55" fill="#1a0c04"/>
    <ellipse cx="3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-104" r="0.55" fill="#1a0c04"/>
    <!-- Brow furrowed -->
    <path d="M-7,-110 L-1,-110" stroke="#1a0c04" stroke-width="0.85"/>
    <path d="M1,-110 L7,-110" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Mouth — slightly open, calculating -->
    <ellipse cx="0" cy="-98" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- DIALOGUE — Wren: If the resonance charger scales... the induction ratio... -->
  <g>
    <rect x="14" y="14" width="338" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,58 L190,58 L182,70 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M182,58 L188,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">If the resonance charger scales... the induction ratio...</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
