<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 16 — Panel 4: Section 3 closes — exterior wall view, brick gap glowing softly</title>
  <desc>28mm wide. Exterior view of the brick wall — the wall gap visible at base with soft cool glow leaking. Late afternoon Clerkenwell light, gas lamp starting to ignite. Caption — He had described fairy courts in hollow hills. And then he looked into the wall and saw one.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#c8a888"/>
    </linearGradient>
    <linearGradient id="p16p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p16p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <radialGradient id="p16p4gapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p16p4gasLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p16p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- Sky — late-afternoon -->
  <rect width="742" height="80" fill="url(#p16p4sky)"/>
  <!-- BRICK WALL fills frame -->
  <rect x="0" y="60" width="742" height="180" fill="url(#p16p4brick)"/>
  <g stroke="#3a2010" stroke-width="0.45" opacity="0.55">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="220" x2="742" y2="220"/>
    <line x1="80" y1="60" x2="80" y2="100"/>
    <line x1="220" y1="100" x2="220" y2="140"/>
    <line x1="160" y1="140" x2="160" y2="180"/>
    <line x1="380" y1="160" x2="380" y2="200"/>
    <line x1="540" y1="60" x2="540" y2="100"/>
    <line x1="660" y1="100" x2="660" y2="140"/>
    <line x1="600" y1="180" x2="600" y2="220"/>
  </g>
  <g opacity="0.45">
    <ellipse cx="120" cy="120" rx="14" ry="4" fill="#6a3828"/>
    <ellipse cx="320" cy="180" rx="12" ry="4" fill="#7a4030"/>
    <ellipse cx="540" cy="100" rx="10" ry="3.5" fill="#6a3828"/>
    <ellipse cx="660" cy="180" rx="12" ry="4" fill="#7a4030"/>
  </g>

  <!-- GAS LAMP starting to ignite (late afternoon, lamplighter has just been by) -->
  <g transform="translate(660 80)">
    <!-- Halo -->
    <ellipse cx="0" cy="-12" rx="50" ry="40" fill="url(#p16p4gasLamp)" filter="url(#p16p4glow)" opacity="0.6"/>
    <!-- Lamp post -->
    <rect x="-3" y="0" width="6" height="160" fill="#1a0c04"/>
    <rect x="-9" y="-4" width="18" height="6" fill="#1a0c04"/>
    <rect x="-11" y="-12" width="22" height="14" fill="#3a2818"/>
    <!-- Faint warm glow -->
    <circle cx="0" cy="-6" r="6" fill="#ffd888" opacity="0.85" filter="url(#p16p4bloom)"/>
    <circle cx="0" cy="-6" r="2.4" fill="#fff8e8"/>
  </g>

  <!-- Workshop window -->
  <rect x="240" y="100" width="80" height="100" fill="#3a2818"/>
  <rect x="244" y="104" width="72" height="92" fill="#5a4838" opacity="0.75"/>
  <line x1="280" y1="104" x2="280" y2="196" stroke="#1a0c04" stroke-width="0.5"/>
  <line x1="244" y1="150" x2="316" y2="150" stroke="#1a0c04" stroke-width="0.5"/>
  <ellipse cx="280" cy="148" rx="36" ry="40" fill="#d8c8a8" opacity="0.18"/>

  <!-- Wall gap base — soft cool glow leaking -->
  <g>
    <rect x="450" y="220" width="34" height="6" fill="#0a0604"/>
    <ellipse cx="467" cy="222" rx="34" ry="6" fill="url(#p16p4gapGlow)" filter="url(#p16p4bloom)"/>
    <ellipse cx="448" cy="226" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="486" cy="226" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
  </g>

  <!-- Moss -->
  <g>
    <ellipse cx="180" cy="222" rx="32" ry="3" fill="#4a5828" opacity="0.6"/>
    <ellipse cx="600" cy="222" rx="36" ry="3" fill="#4a5828" opacity="0.6"/>
  </g>

  <!-- COBBLESTONES -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p16p4cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.65">
    <path d="M0,250 Q160,248 320,252 Q500,254 742,250"/>
    <path d="M0,290 Q160,292 320,288 Q500,286 742,290"/>
    <path d="M0,330 Q160,328 320,332 Q500,334 742,330"/>
  </g>
  <g fill="#1a0c04" opacity="0.5">
    <circle cx="60" cy="262" r="1.4"/>
    <circle cx="180" cy="270" r="1.4"/>
    <circle cx="280" cy="262" r="1.4"/>
    <circle cx="500" cy="270" r="1.4"/>
    <circle cx="620" cy="262" r="1.4"/>
    <circle cx="100" cy="305" r="1.4"/>
    <circle cx="240" cy="315" r="1.4"/>
    <circle cx="380" cy="305" r="1.4"/>
    <circle cx="540" cy="315" r="1.4"/>
    <circle cx="80" cy="345" r="1.4"/>
    <circle cx="220" cy="355" r="1.4"/>
    <circle cx="360" cy="345" r="1.4"/>
    <circle cx="500" cy="355" r="1.4"/>
    <circle cx="640" cy="345" r="1.4"/>
  </g>
  <!-- Warm gas-lamp pool on cobblestones -->
  <ellipse cx="660" cy="290" rx="80" ry="20" fill="#ffd888" opacity="0.18" filter="url(#p16p4glow)"/>

  <!-- CAPTION closing Section 3 -->
  <g>
    <rect x="14" y="14" width="468" height="44" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">He had described fairy courts in hollow hills. And then he looked into the wall and saw one.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,40 Q200,38 400,42 Q580,44 742,40"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
