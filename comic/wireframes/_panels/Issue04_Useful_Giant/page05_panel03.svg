<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 224" width="150" height="224">
  <title>Issue 4 — Page 5 — Panel 3: Luma inset, scientific wonder, scanning Theodore</title>
  <desc>85mm narrow vertical close-up. Luma's face tilted up, holographic lenses hovering before her eyes scrolling blue-violet geometric data. South Asian features, warm brown skin, dark long braided hair with sapphire filament. Sapphire-violet suit collar visible. Intellectual hunger — fascination. Blue-violet light casts geometric patterns across face.</desc>

  <defs>
    <linearGradient id="p5p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="50%" stop-color="#3a3038"/>
      <stop offset="100%" stop-color="#1a1424"/>
    </linearGradient>
    <linearGradient id="p5p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p5p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <radialGradient id="p5p3lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p3bloom"><feGaussianBlur stdDeviation="0.85"/></filter>
  </defs>

  <!-- BG -->
  <rect width="150" height="224" fill="url(#p5p3bg)"/>

  <!-- Luma face tilted up -->
  <g transform="translate(75 140)">
    <!-- Neck/collar -->
    <path d="M-44,80 L-44,40 L44,40 L44,80 Z" fill="url(#p5p3suit)"/>
    <!-- Sapphire hologram nodes -->
    <circle cx="-22" cy="48" r="1.6" fill="#a888ff" filter="url(#p5p3bloom)"/>
    <circle cx="22" cy="48" r="1.6" fill="#a888ff" filter="url(#p5p3bloom)"/>
    <line x1="-22" y1="48" x2="22" y2="48" stroke="#a888ff" stroke-width="0.55" opacity="0.6"/>

    <!-- Face -->
    <ellipse cx="0" cy="0" rx="32" ry="40" fill="url(#p5p3skin)"/>
    <path d="M-26,-2 Q-22,28 -8,38 L6,38 Q22,28 26,8 L22,-4 Z" fill="url(#p5p3skin)"/>

    <!-- HAIR — dark long braided (gathered back, but visible at sides) -->
    <g fill="#1a0c04">
      <path d="M-30,-26 Q-30,-40 0,-44 Q30,-40 30,-26 L26,-18 Q14,-30 0,-30 Q-14,-30 -26,-18 Z"/>
      <!-- Braid hanging back from one side (visible left edge) -->
      <path d="M-26,-22 Q-32,-12 -34,4 Q-32,18 -28,30" stroke="#1a0c04" stroke-width="2.4" fill="none"/>
    </g>
    <!-- SAPPHIRE FILAMENT in braid -->
    <path d="M-26,-22 Q-32,-12 -34,4 Q-32,18 -28,30" stroke="#a888ff" stroke-width="0.7" fill="none" opacity="0.85" filter="url(#p5p3bloom)"/>

    <!-- HOLOGRAPHIC LENSES — semi-transparent floating in front of eyes, scrolling data -->
    <g>
      <!-- Lens halos -->
      <ellipse cx="-12" cy="-2" rx="9" ry="6" fill="url(#p5p3lensGlow)" filter="url(#p5p3bloom)"/>
      <ellipse cx="12" cy="-2" rx="9" ry="6" fill="url(#p5p3lensGlow)" filter="url(#p5p3bloom)"/>
      <!-- Lens shapes -->
      <ellipse cx="-12" cy="-2" rx="6" ry="4" fill="#a888ff" opacity="0.45" stroke="#7a5ad8" stroke-width="0.55"/>
      <ellipse cx="12" cy="-2" rx="6" ry="4" fill="#a888ff" opacity="0.45" stroke="#7a5ad8" stroke-width="0.55"/>
      <!-- CRACK on right lens -->
      <path d="M14,-3 L18,0 L16,2" stroke="#3a1a78" stroke-width="0.55" fill="none"/>
      <path d="M16,-1 L13,1" stroke="#3a1a78" stroke-width="0.4"/>
      <!-- Scrolling data inside lenses (geometric tick marks) -->
      <g stroke="#fff8e8" stroke-width="0.4" opacity="0.85">
        <line x1="-16" y1="-3" x2="-12" y2="-3"/>
        <line x1="-10" y1="-1" x2="-7" y2="-1"/>
        <line x1="-15" y1="1" x2="-9" y2="1"/>
        <line x1="9" y1="-3" x2="15" y2="-3"/>
        <line x1="9" y1="0" x2="13" y2="0"/>
        <line x1="11" y1="2" x2="15" y2="2"/>
      </g>
      <!-- Eyes BEHIND lenses (faintly visible) -->
      <ellipse cx="-12" cy="-2" rx="2.4" ry="1.6" fill="#3a2010" opacity="0.5"/>
      <ellipse cx="12" cy="-2" rx="2.4" ry="1.6" fill="#3a2010" opacity="0.5"/>
      <circle cx="-12" cy="-2" r="0.8" fill="#0a0604"/>
      <circle cx="12" cy="-2" r="0.8" fill="#0a0604"/>
    </g>

    <!-- BROW raised slightly (curiosity/wonder) -->
    <path d="M-20,-12 L-6,-14" stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M6,-14 L20,-12" stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round"/>

    <!-- NOSE -->
    <path d="M0,4 L-2,16 Q0,18 2,16 L0,4 Z" fill="#7a5848" opacity="0.65"/>

    <!-- MOUTH — slightly parted in fascination -->
    <ellipse cx="0" cy="22" rx="5" ry="2" fill="#5a2818" opacity="0.85"/>
    <path d="M-5,22 Q0,24 5,22" fill="none" stroke="#3a1808" stroke-width="0.55"/>

    <!-- BLUE-VIOLET light cast across face from lenses (geometric pattern) -->
    <g opacity="0.45">
      <path d="M-26,-2 L-18,-6 L-16,-2 L-26,2 Z" fill="#a888ff"/>
      <path d="M16,-2 L24,-6 L26,-2 L16,2 Z" fill="#a888ff"/>
      <path d="M-22,12 L-14,8 L-12,12 L-22,16 Z" fill="#a888ff"/>
      <path d="M12,12 L20,8 L22,12 L12,16 Z" fill="#a888ff"/>
    </g>

    <!-- Warm rim from above -->
    <path d="M-30,-26 Q0,-44 30,-26 L24,-22 Q0,-36 -24,-22 Z" fill="#d8c8a8" opacity="0.4"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.35" opacity="0.16" fill="none">
    <path d="M0,40 Q40,38 80,42 Q120,44 150,40"/>
    <path d="M0,180 Q40,182 80,178 Q120,176 150,180"/>
  </g>
</svg>
