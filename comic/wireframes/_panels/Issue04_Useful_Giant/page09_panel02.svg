<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 422" width="366" height="422">
  <title>Issue 4 — Page 9 — Panel 2: Wren CU, reluctant respect, copper-gold diagnostic active</title>
  <desc>85mm CU. Wren's face cycling through disbelief→confirmation→reluctant respect. Copper-gold holographic schematic projects from forearm. Eyebrows raised, lips parted. Impressed against will. Wren: Copper wire induction coils. He's built a primitive resonance charger. / It shouldn't work. / It works.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p9p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p9p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="50%" stop-color="#c87533"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p9p2copperGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p2coolWash" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p9p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="422" fill="url(#p9p2bg)"/>
  <rect width="366" height="422" fill="url(#p9p2coolWash)"/>

  <!-- BG brick -->
  <rect x="0" y="60" width="366" height="280" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
  </g>

  <!-- WREN — face + shoulders + raised wrist projecting diagnostic -->
  <g transform="translate(180 280)">
    <!-- Body -->
    <path d="M-90,140 L-90,40 L90,40 L90,140 Z" fill="url(#p9p2suit)"/>
    <path d="M-90,40 Q-60,16 0,8 Q60,16 90,40 L80,52 L-80,52 Z" fill="url(#p9p2suit)"/>
    <ellipse cx="-50" cy="20" rx="10" ry="6" fill="#1a0c04" opacity="0.75"/>
    <circle cx="-32" cy="44" r="2" fill="#ffd888" filter="url(#p9p2bloom)"/>
    <circle cx="32" cy="44" r="2" fill="#ffd888" filter="url(#p9p2bloom)"/>

    <!-- LEFT arm raised (showing diagnostic) -->
    <path d="M-86,40 Q-110,30 -110,4 L-100,2 Q-92,28 -82,40 Z" fill="url(#p9p2suit)"/>
    <ellipse cx="-110" cy="0" rx="6" ry="4" fill="url(#p9p2skin)"/>
    <ellipse cx="-110" cy="0" rx="3" ry="1.6" fill="#1a0c04" opacity="0.55"/>

    <!-- COPPER-GOLD HOLOGRAPHIC SCHEMATIC projecting upward from her wrist -->
    <g transform="translate(-110 -40)">
      <ellipse cx="0" cy="0" rx="58" ry="40" fill="url(#p9p2copperGlow)" filter="url(#p9p2glow)" opacity="0.6"/>
      <!-- Schematic content: induction coil diagram -->
      <g stroke="#ffd888" stroke-width="0.85" fill="none" opacity="0.85">
        <!-- Resonance frequency curve -->
        <path d="M-40,4 Q-30,-12 -20,4 Q-10,20 0,4 Q10,-12 20,4 Q30,20 40,4"/>
        <!-- Coil schematic -->
        <circle cx="-20" cy="-18" r="5"/>
        <circle cx="-20" cy="-18" r="3"/>
        <!-- Battery cell -->
        <rect x="14" y="-22" width="14" height="8" stroke-width="0.85"/>
        <line x1="18" y1="-20" x2="18" y2="-16"/>
        <line x1="22" y1="-22" x2="22" y2="-14"/>
        <!-- Connecting line -->
        <line x1="-15" y1="-18" x2="14" y2="-18"/>
      </g>
      <!-- Diagnostic ticks -->
      <g stroke="#fff8e8" stroke-width="0.55" opacity="0.85">
        <line x1="-35" y1="22" x2="-25" y2="22"/>
        <line x1="-20" y1="22" x2="-10" y2="22"/>
        <line x1="-5" y1="22" x2="5" y2="22"/>
        <line x1="10" y1="22" x2="20" y2="22"/>
      </g>
      <!-- Reading: "80%" -->
      <text x="-12" y="-30" font-family="Helvetica Neue" font-size="7" fill="#ffd888" font-weight="700" opacity="0.9">80%</text>
    </g>

    <!-- Right arm at side -->
    <path d="M86,40 Q108,90 90,140 L78,140 Q86,90 78,40 Z" fill="url(#p9p2suit)"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="-50" rx="36" ry="44" fill="url(#p9p2skin)"/>
    <path d="M-30,-20 Q-26,12 -8,22 L8,22 Q26,12 30,-10 L26,-20 Z" fill="url(#p9p2skin)"/>

    <!-- HAIR with bun -->
    <g fill="#1a0c04">
      <path d="M-32,-72 Q-32,-86 -2,-90 Q26,-86 26,-72 L24,-64 Q12,-76 -2,-76 Q-22,-76 -30,-64 Z"/>
      <ellipse cx="-4" cy="-100" rx="14" ry="11"/>
      <path d="M-26,-72 Q-30,-64 -26,-54" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
      <path d="M22,-72 Q26,-64 22,-54" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
    </g>

    <!-- BROWS — slightly RAISED (the surprise/respect tell) -->
    <path d="M-22,-58 L-8,-64" stroke="#1a0c04" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0,-64 L18,-58" stroke="#1a0c04" stroke-width="2.4" stroke-linecap="round"/>

    <!-- EYES — open wider -->
    <ellipse cx="-12" cy="-50" rx="5" ry="3.5" fill="#fff8e8"/>
    <ellipse cx="-12" cy="-50" rx="3" ry="2.4" fill="#3a2010"/>
    <circle cx="-12" cy="-50" r="1.6" fill="#0a0604"/>
    <ellipse cx="-13" cy="-51" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <ellipse cx="10" cy="-50" rx="5" ry="3.5" fill="#fff8e8"/>
    <ellipse cx="10" cy="-50" rx="3" ry="2.4" fill="#3a2010"/>
    <circle cx="10" cy="-50" r="1.6" fill="#0a0604"/>
    <ellipse cx="9" cy="-51" rx="0.85" ry="0.55" fill="#fff8e8"/>

    <!-- NOSE -->
    <path d="M-2,-48 L-4,-32 Q-2,-30 2,-32 L0,-48 Z" fill="#a87858" opacity="0.65"/>

    <!-- MOUTH — slightly parted (the admission) -->
    <ellipse cx="0" cy="-22" rx="6" ry="2.4" fill="#5a2818" opacity="0.85"/>
    <path d="M-6,-22 Q0,-19 6,-22" fill="none" stroke="#3a1808" stroke-width="0.7"/>

    <!-- Cool light from above (cradle glow) on top of head/forehead -->
    <path d="M-30,-72 Q0,-86 30,-72 L24,-66 Q0,-78 -24,-66 Z" fill="#a8c0e0" opacity="0.4"/>
  </g>

  <!-- DIALOGUE — Wren: Copper wire induction coils. He's built a primitive resonance charger. -->
  <g>
    <rect x="14" y="14" width="338" height="58" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,72 L190,72 L182,84 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M182,72 L188,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Copper wire induction coils. He's built a primitive</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">resonance charger.</text>

  <!-- DIALOGUE — Wren (quieter): It shouldn't work. -->
  <g>
    <rect x="200" y="86" width="152" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-dasharray="4,2" filter="url(#balloonShadow)"/>
    <path d="M240,130 L250,130 L242,142 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-dasharray="2,1.5"/>
    <path d="M242,130 L248,130" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="208" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="208" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">It shouldn't work.</text>

  <!-- DIALOGUE — Wren: It works. -->
  <g>
    <rect x="14" y="146" width="100" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M40,190 L50,190 L42,202 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M42,190 L48,190" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">It works.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,360 Q120,362 240,358 Q300,356 366,360"/>
  </g>
</svg>
