<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 4 — Page 2 — Panel 1: Theodore lowers to hands and knees, approaches the gap</title>
  <desc>50mm slightly low angle. Theodore on hands and knees before narrow brick gap, approaching like a naturalist stalking a burrow. Mouth closed, breathing through nose. Eyes wide but steady. Damp cobblestones, old brick with crumbling mortar, moss at wall's base. Grey-gold morning light from behind casts shadow toward wall. Gap is dark, revealing nothing. No dialogue.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p2p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a094"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <linearGradient id="p2p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p2p1mortar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8b89a"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p2p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a5a48"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p2p1theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p2p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p2p1vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p2p1shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p2p1trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2c20"/>
    </linearGradient>
  </defs>

  <!-- BG sky strip (small at top) -->
  <rect width="494" height="50" fill="url(#p2p1sky)"/>

  <!-- BRICK WALL (right half + extending up) -->
  <rect x="0" y="40" width="494" height="180" fill="url(#p2p1brick)"/>
  <g stroke="#3a2010" stroke-width="0.45" opacity="0.55">
    <line x1="0" y1="60" x2="494" y2="60"/>
    <line x1="0" y1="80" x2="494" y2="80"/>
    <line x1="0" y1="100" x2="494" y2="100"/>
    <line x1="0" y1="120" x2="494" y2="120"/>
    <line x1="0" y1="140" x2="494" y2="140"/>
    <line x1="0" y1="160" x2="494" y2="160"/>
    <line x1="0" y1="180" x2="494" y2="180"/>
    <line x1="0" y1="200" x2="494" y2="200"/>
    <line x1="0" y1="220" x2="494" y2="220"/>
    <line x1="60" y1="40" x2="60" y2="80"/>
    <line x1="180" y1="80" x2="180" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="160"/>
    <line x1="240" y1="160" x2="240" y2="200"/>
    <line x1="60" y1="200" x2="60" y2="220"/>
    <line x1="320" y1="60" x2="320" y2="100"/>
    <line x1="400" y1="120" x2="400" y2="160"/>
    <line x1="380" y1="180" x2="380" y2="220"/>
    <line x1="160" y1="40" x2="160" y2="60"/>
    <line x1="260" y1="40" x2="260" y2="60"/>
  </g>
  <!-- Brick texture pits -->
  <g opacity="0.45">
    <ellipse cx="80" cy="120" rx="14" ry="4" fill="#6a3828"/>
    <ellipse cx="220" cy="180" rx="12" ry="4" fill="#7a4030"/>
    <ellipse cx="360" cy="100" rx="10" ry="3.5" fill="#6a3828"/>
    <ellipse cx="440" cy="180" rx="12" ry="4" fill="#7a4030"/>
    <circle cx="50" cy="160" r="1.5" fill="#3a1808"/>
    <circle cx="160" cy="120" r="1.5" fill="#3a1808"/>
    <circle cx="300" cy="160" r="1.5" fill="#3a1808"/>
    <circle cx="420" cy="80" r="1.5" fill="#3a1808"/>
  </g>

  <!-- MOSS at wall base -->
  <g>
    <ellipse cx="280" cy="222" rx="40" ry="3" fill="#4a5828" opacity="0.65"/>
    <ellipse cx="380" cy="222" rx="32" ry="3" fill="#4a5828" opacity="0.65"/>
    <ellipse cx="120" cy="222" rx="30" ry="3" fill="#4a5828" opacity="0.55"/>
    <!-- Moss strands -->
    <g fill="#5a6830" opacity="0.65">
      <ellipse cx="270" cy="218" rx="3" ry="1"/>
      <ellipse cx="290" cy="220" rx="3" ry="1"/>
      <ellipse cx="380" cy="218" rx="3" ry="1"/>
      <ellipse cx="400" cy="220" rx="2.5" ry="1"/>
    </g>
  </g>

  <!-- THE WALL GAP — narrow at base of wall, between bricks -->
  <g>
    <rect x="318" y="216" width="32" height="6" fill="#0a0604"/>
    <!-- Crumbled mortar around gap edges -->
    <ellipse cx="316" cy="222" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="350" cy="222" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="334" cy="223" rx="2" ry="0.7" fill="#7a6858" opacity="0.7"/>
  </g>

  <!-- COBBLESTONES -->
  <rect x="0" y="220" width="494" height="144" fill="url(#p2p1cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.65">
    <path d="M0,250 Q160,248 320,252 Q420,254 494,250"/>
    <path d="M0,290 Q160,292 320,288 Q420,286 494,290"/>
    <path d="M0,330 Q160,328 320,332 Q420,334 494,330"/>
    <path d="M0,355 Q160,357 320,353 Q420,351 494,355"/>
  </g>
  <g fill="#1a1410" opacity="0.5">
    <circle cx="40" cy="262" r="1.4"/>
    <circle cx="120" cy="270" r="1.4"/>
    <circle cx="220" cy="262" r="1.4"/>
    <circle cx="400" cy="270" r="1.4"/>
    <circle cx="80" cy="305" r="1.4"/>
    <circle cx="180" cy="315" r="1.4"/>
    <circle cx="280" cy="305" r="1.4"/>
    <circle cx="380" cy="315" r="1.4"/>
    <circle cx="60" cy="345" r="1.4"/>
    <circle cx="160" cy="355" r="1.4"/>
    <circle cx="260" cy="345" r="1.4"/>
    <circle cx="440" cy="355" r="1.4"/>
  </g>

  <!-- THEODORE — on hands and knees, profile/three-quarter facing right toward gap -->
  <g transform="translate(140 250)">
    <!-- Long shadow stretching toward wall -->
    <path d="M-30,90 L120,82 L130,98 L-20,108 Z" fill="#1a0c04" opacity="0.45"/>

    <!-- Trousers — folded under, knees on cobbles -->
    <!-- Right leg (back leg, tucked) -->
    <path d="M-26,-12 L-46,30 Q-50,40 -42,46 L-20,40 L-12,0 Z" fill="url(#p2p1trousers)"/>
    <!-- Left leg (front, knee bent forward) -->
    <path d="M-12,4 L-22,40 L0,52 L20,42 L12,0 Z" fill="url(#p2p1trousers)"/>
    <!-- Boot soles (visible from side) -->
    <ellipse cx="-44" cy="48" rx="8" ry="2.5" fill="#1a0c04"/>
    <ellipse cx="20" cy="52" rx="8" ry="2.5" fill="#1a0c04"/>
    <!-- Patches -->
    <rect x="-28" y="14" width="6" height="6" fill="#3a2010" opacity="0.7"/>
    <rect x="0" y="20" width="5" height="5" fill="#3a2010" opacity="0.7"/>

    <!-- Vest hanging down (back) -->
    <path d="M-22,-50 L-30,-12 L40,-22 L36,-58 Z" fill="url(#p2p1vest)"/>
    <!-- Shirt sleeve along arched back -->
    <path d="M36,-58 Q60,-50 80,-30 Q92,-12 100,-2 L92,4 Q80,-8 70,-22 L36,-44 Z" fill="url(#p2p1shirt)"/>
    <!-- Right arm (back) supporting body -->
    <path d="M-22,-50 Q-32,-30 -28,-10 L-20,-12 Q-22,-30 -16,-46 Z" fill="url(#p2p1shirt)"/>

    <!-- Right hand on cobblestones -->
    <ellipse cx="-26" cy="-6" rx="6" ry="3" fill="url(#p2p1theoSkin)"/>
    <!-- Fingers splayed flat -->
    <g fill="url(#p2p1theoSkin)">
      <ellipse cx="-32" cy="-2" rx="3" ry="1.4" transform="rotate(-15 -32 -2)"/>
      <ellipse cx="-22" cy="-1" rx="3" ry="1.4" transform="rotate(5 -22 -1)"/>
    </g>
    <!-- Oil stains -->
    <ellipse cx="-26" cy="-6" rx="2" ry="1" fill="#1a0c04" opacity="0.45"/>

    <!-- Left/forward hand reaching toward gap -->
    <ellipse cx="100" cy="-2" rx="6" ry="3.5" fill="url(#p2p1theoSkin)"/>
    <g fill="url(#p2p1theoSkin)">
      <ellipse cx="106" cy="0" rx="3" ry="1.4" transform="rotate(10 106 0)"/>
      <ellipse cx="98" cy="-6" rx="3" ry="1.4" transform="rotate(-15 98 -6)"/>
    </g>
    <!-- Brass gear ring on forward hand index -->
    <ellipse cx="106" cy="0" rx="1.6" ry="1" fill="#c89858" stroke="#7a5028" stroke-width="0.4"/>

    <!-- Head — lowered toward gap, three-quarter profile facing right -->
    <ellipse cx="56" cy="-58" rx="14" ry="14" fill="url(#p2p1theoSkin)"/>
    <!-- Hair sandy-brown, falling forward -->
    <g fill="url(#p2p1theoHair)">
      <path d="M44,-72 Q44,-82 58,-86 Q72,-82 70,-72 L66,-66 Q62,-76 56,-76 Q48,-76 44,-66 Z"/>
      <path d="M48,-82 L46,-90 L52,-82 Z"/>
      <path d="M55,-86 L57,-92 L60,-82 Z"/>
      <path d="M64,-86 L68,-92 L66,-82 Z"/>
      <!-- Forehead fall -->
      <path d="M44,-66 Q48,-58 52,-58 L60,-58 Q64,-58 68,-66 L62,-62 Q58,-58 50,-62 Z"/>
    </g>
    <!-- Eye visible (right side) — wide but steady -->
    <ellipse cx="64" cy="-58" rx="2.4" ry="1.5" fill="#fff8e8"/>
    <ellipse cx="65" cy="-57.5" rx="1.7" ry="1.2" fill="#7a5028"/>
    <circle cx="65" cy="-57.5" r="0.8" fill="#1a0c04"/>
    <!-- Other eye (further) -->
    <ellipse cx="51" cy="-58" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="51.5" cy="-57.5" r="0.7" fill="#1a0c04"/>
    <!-- Brow set, breathing through nose -->
    <path d="M48,-64 L54,-66" stroke="#3a2010" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M60,-66 L68,-64" stroke="#3a2010" stroke-width="0.7" stroke-linecap="round"/>
    <!-- Nose (profile-leaning) -->
    <path d="M68,-58 L72,-52 Q68,-50 66,-52 Z" fill="#7a5848" opacity="0.65"/>
    <!-- Mouth closed -->
    <path d="M62,-46 Q66,-44 70,-46" fill="none" stroke="#3a2010" stroke-width="0.55"/>
    <!-- Freckles -->
    <circle cx="58" cy="-52" r="0.5" fill="#7a5848"/>
    <circle cx="63" cy="-50" r="0.5" fill="#7a5848"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,40 Q120,38 240,42 Q380,44 494,40"/>
    <path d="M0,200 Q120,202 240,198 Q380,196 494,200"/>
  </g>
</svg>
