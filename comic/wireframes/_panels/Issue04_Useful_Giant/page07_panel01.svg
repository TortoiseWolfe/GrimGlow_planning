<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 7 — Panel 1: Luma presents medical assessment with holographic brain schematic</title>
  <desc>35mm medium wide. Luma center, holographic brain schematic projection floating above her hand showing developing-human-brain anatomy with prefrontal cortex highlighted. Cracked right lens. Sapphire-violet glow dominates. Memory-wipe device visible on ledge. Luma: Captain. Before we consider the neural modifier — I need to present a medical assessment. / Sable: You've had three minutes. / Luma: Three minutes and a full neural scan through the floorboards. His brain is still developing. The prefrontal cortex alone—</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p7p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p7p1jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p7p1sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p7p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p7p1darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <radialGradient id="p7p1brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7a5ad8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p1deviceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p1bloom"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="p7p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p7p1bg)"/>

  <!-- BG brick interior -->
  <rect x="0" y="40" width="742" height="180" fill="#2a1810" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="180" y1="40" x2="180" y2="80"/>
    <line x1="380" y1="80" x2="380" y2="140"/>
    <line x1="560" y1="140" x2="560" y2="200"/>
  </g>

  <!-- TIMBER BEAM/floor -->
  <rect x="0" y="280" width="742" height="44" fill="url(#p7p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="742" y2="282"/>
    <line x1="0" y1="320" x2="742" y2="320"/>
  </g>

  <!-- MEMORY-WIPE DEVICE on left ledge (still visible) -->
  <g transform="translate(80 270)">
    <ellipse cx="0" cy="-2" rx="32" ry="18" fill="url(#p7p1deviceGlow)" filter="url(#p7p1bloom)" opacity="0.6"/>
    <rect x="-14" y="-12" width="28" height="10" fill="#a8a8b8"/>
    <rect x="-12" y="-10" width="24" height="2" fill="#3a3848"/>
    <ellipse cx="20" cy="-5" rx="4" ry="2.4" fill="#e8f0ff" filter="url(#p7p1bloom)"/>
  </g>

  <!-- HOLOGRAPHIC BRAIN SCHEMATIC — large, floating above Luma's hand -->
  <g transform="translate(371 130)">
    <!-- Glow halo around schematic -->
    <ellipse cx="0" cy="0" rx="100" ry="70" fill="url(#p7p1brainGlow)" filter="url(#p7p1glow)" opacity="0.85"/>

    <!-- Brain SHAPE — semi-transparent holographic anatomy -->
    <!-- Outer cortex outline -->
    <path d="M-60,-30 Q-66,-50 -40,-58 Q-12,-66 14,-62 Q40,-58 56,-44 Q68,-26 64,-4 Q60,16 50,30 Q34,42 14,42 L-14,42 Q-34,38 -50,28 Q-62,12 -64,-12 Z"
          fill="none" stroke="#c0a8ff" stroke-width="1.6" opacity="0.85"/>
    <!-- Cortex secondary -->
    <path d="M-50,-20 Q-54,-40 -32,-46 Q-6,-54 18,-50 Q40,-46 50,-32 Q56,-16 52,2 Q48,18 38,28 Q22,36 4,36 L-12,36 Q-30,32 -42,22 Q-50,6 -52,-12 Z"
          fill="none" stroke="#c0a8ff" stroke-width="0.85" opacity="0.6"/>
    <!-- Brain folds (gyri) -->
    <g stroke="#c0a8ff" stroke-width="0.55" fill="none" opacity="0.65">
      <path d="M-30,-30 Q-20,-20 -10,-30"/>
      <path d="M0,-40 Q10,-30 20,-40"/>
      <path d="M30,-20 Q40,-10 50,-22"/>
      <path d="M-40,0 Q-30,10 -20,0"/>
      <path d="M-10,10 Q0,20 10,10"/>
      <path d="M20,12 Q30,22 40,10"/>
      <path d="M-30,22 Q-20,32 -10,22"/>
      <path d="M0,28 Q10,38 20,28"/>
    </g>
    <!-- Central fissure -->
    <line x1="-40" y1="-50" x2="50" y2="20" stroke="#c0a8ff" stroke-width="0.7" opacity="0.6"/>

    <!-- PREFRONTAL CORTEX HIGHLIGHTED — front of brain (left side) glows brighter -->
    <path d="M-66,-12 Q-66,-32 -40,-58 Q-30,-60 -20,-58 L-22,-30 Q-40,-20 -50,-10 Z"
          fill="#fff8e8" opacity="0.4"/>
    <path d="M-66,-12 Q-66,-32 -40,-58 Q-30,-60 -20,-58"
          fill="none" stroke="#fff8e8" stroke-width="1" opacity="0.85"/>
    <!-- Highlight glow on prefrontal area -->
    <ellipse cx="-44" cy="-32" rx="22" ry="18" fill="#e8d8ff" opacity="0.45" filter="url(#p7p1bloom)"/>

    <!-- DATA TICKS / annotations -->
    <g stroke="#fff8e8" stroke-width="0.55" opacity="0.85">
      <line x1="-44" y1="-32" x2="-90" y2="-46"/>
      <line x1="-90" y1="-46" x2="-110" y2="-46"/>
    </g>
    <text x="-130" y="-44" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" opacity="0.85" font-weight="700">PFC</text>
    <text x="-130" y="-36" font-family="Helvetica Neue" font-size="5" fill="#c0a8ff" opacity="0.85">DEVELOPING</text>

    <g stroke="#fff8e8" stroke-width="0.55" opacity="0.85">
      <line x1="40" y1="20" x2="80" y2="40"/>
      <line x1="80" y1="40" x2="106" y2="40"/>
    </g>
    <text x="84" y="38" font-family="Helvetica Neue" font-size="5" fill="#c0a8ff" opacity="0.85">CEREBELLUM</text>

    <!-- Scanning grid overlay (subtle hexagonal mesh) -->
    <g stroke="#a888ff" stroke-width="0.3" opacity="0.4" fill="none">
      <path d="M-60,-30 L-30,-30 L-15,-12 L-30,6 L-60,6 L-75,-12 Z"/>
      <path d="M0,-30 L30,-30 L45,-12 L30,6 L0,6 L-15,-12 Z"/>
    </g>

    <!-- Tiny diagnostic data scrolling at bottom -->
    <g stroke="#fff8e8" stroke-width="0.4" opacity="0.7">
      <line x1="-30" y1="56" x2="-20" y2="56"/>
      <line x1="-15" y1="56" x2="-5" y2="56"/>
      <line x1="0" y1="56" x2="14" y2="56"/>
      <line x1="20" y1="56" x2="30" y2="56"/>
    </g>
  </g>

  <!-- Projector beam from Luma's hand UP to schematic -->
  <g opacity="0.65">
    <path d="M371,260 L321,180 L421,180 Z" fill="url(#p7p1brainGlow)" filter="url(#p7p1bloom)" opacity="0.4"/>
  </g>

  <!-- LUMA — centered, hand raised projecting schematic, addressing Sable (off-frame right) -->
  <g transform="translate(371 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <!-- Legs -->
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p7p1sapphire)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p7p1sapphire)"/>
    <ellipse cx="-7" cy="-1" rx="3.5" ry="1.4" fill="#1a0838"/>
    <ellipse cx="7" cy="-1" rx="3.5" ry="1.4" fill="#1a0838"/>
    <!-- Torso -->
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p7p1sapphire)"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p7p1sapphire)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p7p1sapphire)"/>
    <!-- Hologram seams -->
    <circle cx="-10" cy="-86" r="1" fill="#a888ff" filter="url(#p7p1bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#a888ff" filter="url(#p7p1bloom)"/>

    <!-- LEFT arm RAISED (projecting schematic up) -->
    <path d="M-15,-78 Q-26,-50 -22,-22 L-14,-22 Q-14,-50 -10,-76 Z" fill="url(#p7p1sapphire)"/>
    <ellipse cx="-22" cy="-22" rx="3.5" ry="2.4" fill="url(#p7p1jinkSkin)"/>
    <!-- Holographic projector on wrist -->
    <circle cx="-22" cy="-22" r="2" fill="#a888ff" filter="url(#p7p1bloom)"/>
    <!-- INK STAINS on hand -->
    <ellipse cx="-22" cy="-21" rx="1.4" ry="0.7" fill="#1a0838" opacity="0.8"/>

    <!-- Right arm at side -->
    <path d="M15,-78 Q22,-58 16,-44 L10,-46 Q12,-58 10,-76 Z" fill="url(#p7p1sapphire)"/>
    <ellipse cx="14" cy="-46" rx="2.4" ry="1.4" fill="url(#p7p1jinkSkin)"/>

    <!-- Head — turned toward Sable (right) -->
    <ellipse cx="2" cy="-104" rx="9" ry="11" fill="url(#p7p1jinkSkin)"/>
    <g fill="#1a0c04">
      <path d="M-6,-112 Q-6,-120 2,-122 Q10,-120 10,-112 L8,-106 Q5,-112 -1,-112 Q-4,-112 -6,-106 Z"/>
      <!-- Braid hanging back -->
      <path d="M8,-110 Q14,-98 16,-82" stroke="#1a0c04" stroke-width="2" fill="none"/>
    </g>
    <line x1="8" y1="-110" x2="16" y2="-82" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#p7p1bloom)"/>
    <!-- Holographic LENSES -->
    <ellipse cx="-1" cy="-106" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p7p1bloom)"/>
    <ellipse cx="5" cy="-106" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p7p1bloom)"/>
    <!-- CRACK on right lens -->
    <path d="M4,-107 L6,-105" stroke="#3a1a78" stroke-width="0.4"/>
    <!-- Mouth set, speaking -->
    <ellipse cx="2" cy="-98" rx="1.4" ry="0.7" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- SABLE in BG (right side, partial, listening) -->
  <g transform="translate(620 282)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-46 L-10,-2 L-3,0 L-1,-46 Z" fill="url(#p7p1silver)"/>
    <path d="M1,-46 L3,0 L10,-2 L7,-46 Z" fill="url(#p7p1silver)"/>
    <path d="M-13,-78 L-15,-46 L15,-46 L13,-78 Z" fill="url(#p7p1silver)"/>
    <ellipse cx="13" cy="-76" rx="6" ry="4" fill="#3a3038" opacity="0.75"/>
    <path d="M-15,-78 Q-22,-86 -15,-92 L-8,-92 Z" fill="url(#p7p1silver)"/>
    <path d="M15,-78 Q22,-86 15,-92 L8,-92 Z" fill="url(#p7p1silver)"/>
    <!-- Arms at sides -->
    <path d="M-15,-78 Q-22,-58 -16,-46 L-10,-50 Q-14,-62 -10,-76 Z" fill="url(#p7p1silver)"/>
    <path d="M15,-78 Q22,-58 16,-46 L10,-50 Q14,-62 10,-76 Z" fill="url(#p7p1silver)"/>
    <!-- Head -->
    <ellipse cx="-2" cy="-104" rx="9" ry="11" fill="url(#p7p1darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-9,-112 Q-10,-117 -2,-119 Q6,-117 5,-112 L3,-108 Q0,-112 -4,-112 Q-7,-112 -9,-108 Z"/>
    </g>
    <ellipse cx="-5" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-5" cy="-104" r="0.6" fill="#0a0604"/>
    <ellipse cx="1" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="1" cy="-104" r="0.6" fill="#0a0604"/>
    <path d="M-5,-98 L1,-98" stroke="#3a1808" stroke-width="0.7"/>
  </g>

  <!-- DIALOGUE — Luma: Captain. Before we consider the neural modifier — I need to present a medical assessment. -->
  <g>
    <rect x="14" y="14" width="438" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,58 L270,58 L262,70 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M262,58 L268,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Captain. Before we consider the neural modifier — I need to present a medical assessment.</text>

  <!-- DIALOGUE — Sable: You've had three minutes. -->
  <g>
    <rect x="540" y="74" width="190" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M620,118 L630,118 L622,130 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M622,118 L628,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="548" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="548" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">You've had three minutes.</text>

  <!-- DIALOGUE — Luma: Three minutes and a full neural scan through the floorboards. His brain is still developing. The prefrontal cortex alone— -->
  <g>
    <rect x="14" y="220" width="572" height="58" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,278 L270,278 L262,290 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M262,278 L268,278" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Three minutes and a full neural scan through the floorboards. His brain is still</text>
  <text x="22" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">developing. The prefrontal cortex alone—</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
