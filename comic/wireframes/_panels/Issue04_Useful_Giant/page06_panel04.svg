<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 6 — Panel 4: Sable's hand on memory-wipe device, threat presented</title>
  <desc>65mm MCU. Sable reaches for memory-wipe device on timber ledge — compact handheld, medical-looking, cool blue-white emitter. Hand placed on device (NOT picked up — gesture is statement). Cold command. Hand steady. Eyes not. Cool blue-white from device adds upward light across her face. Warm rim from gap above creates light on silver-white hair. Sable: Or we wipe him. The neural modifier can target specific memory clusters. He forgets us. He goes home. Problem contained.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p6p4timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p6p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p6p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p6p4hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="p6p4device" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b8"/>
      <stop offset="100%" stop-color="#5a5868"/>
    </linearGradient>
    <radialGradient id="p6p4emitterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a8c0e0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p4warmRim" cx="80%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p4bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p6p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p6p4bg)"/>
  <rect width="366" height="364" fill="url(#p6p4warmRim)"/>

  <!-- BG brick -->
  <rect x="0" y="40" width="366" height="200" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
  </g>

  <!-- TIMBER LEDGE — runs across mid-frame, MEMORY-WIPE DEVICE sits on it -->
  <rect x="0" y="240" width="366" height="44" fill="url(#p6p4timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="242" x2="366" y2="242"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.5" fill="none">
    <path d="M40,254 Q160,260 280,254 Q330,250 366,254"/>
    <path d="M40,268 Q160,262 280,268 Q330,272 366,268"/>
  </g>

  <!-- Floor below ledge -->
  <rect x="0" y="284" width="366" height="80" fill="#1a0c04"/>

  <!-- MEMORY-WIPE DEVICE — center of frame, sits on ledge, glowing blue-white -->
  <g transform="translate(220 234)">
    <!-- Bigger glow halo -->
    <ellipse cx="0" cy="-2" rx="60" ry="36" fill="url(#p6p4emitterGlow)" filter="url(#p6p4glow)" opacity="0.7"/>
    <!-- Device body — compact handheld, medical -->
    <rect x="-22" y="-14" width="44" height="14" fill="url(#p6p4device)" stroke="#3a3848" stroke-width="0.85"/>
    <!-- Top panel detail -->
    <rect x="-18" y="-12" width="36" height="3" fill="#3a3848"/>
    <line x1="-18" y1="-9" x2="18" y2="-9" stroke="#5a5868" stroke-width="0.5"/>
    <!-- Buttons / details -->
    <circle cx="-12" cy="-6" r="1.4" fill="#1a1820"/>
    <circle cx="-6" cy="-6" r="1.4" fill="#1a1820"/>
    <circle cx="0" cy="-6" r="1.4" fill="#5a606a"/>
    <!-- EMITTER (right end) — cool blue-white glow -->
    <rect x="22" y="-10" width="10" height="6" fill="#1a1820"/>
    <ellipse cx="32" cy="-7" rx="6" ry="4" fill="#e8f0ff" filter="url(#p6p4bloom)"/>
    <ellipse cx="32" cy="-7" rx="2" ry="1.4" fill="#ffffff"/>
    <!-- Subtle warning markings -->
    <text x="-10" y="-1" font-family="Helvetica Neue" font-size="3" fill="#7a8090" font-weight="700">⚠</text>
  </g>

  <!-- SABLE — three-quarter MCU, hand on device, leaning slightly forward -->
  <g transform="translate(140 240)">
    <!-- Body extending out left edge of frame -->
    <path d="M-140,40 L-140,124 L60,124 L60,40 Q40,30 0,28 Q-60,30 -140,40 Z" fill="url(#p6p4suit)"/>
    <!-- Center seam -->
    <line x1="0" y1="28" x2="0" y2="124" stroke="#5a5860" stroke-width="0.85"/>

    <!-- Shoulders -->
    <path d="M-30,40 Q-40,18 -10,8 L-10,32 Q-30,32 -38,42 Z" fill="url(#p6p4suit)"/>
    <path d="M60,40 Q70,18 50,8 L40,32 Q60,32 68,42 Z" fill="url(#p6p4suit)"/>
    <!-- Hologram seams -->
    <circle cx="-20" cy="20" r="1.6" fill="#fff8e8" filter="url(#p6p4bloom)"/>
    <circle cx="40" cy="20" r="1.6" fill="#fff8e8" filter="url(#p6p4bloom)"/>

    <!-- SOOT BLOOM right shoulder -->
    <ellipse cx="50" cy="20" rx="10" ry="6" fill="#3a3038" opacity="0.75"/>

    <!-- RIGHT ARM extending toward device on ledge -->
    <g transform="translate(60 22)">
      <path d="M0,8 Q14,-2 28,-6 L34,2 Q22,8 4,16 Z" fill="url(#p6p4suit)"/>
      <path d="M28,-6 Q40,-12 52,-12 L52,-2 Q40,-2 32,2 Z" fill="url(#p6p4suit)"/>
      <ellipse cx="56" cy="-8" rx="6" ry="4" fill="url(#p6p4skin)"/>
      <!-- Hand on device -->
      <ellipse cx="60" cy="-6" rx="4" ry="2.5" fill="url(#p6p4skin)"/>
      <!-- Knuckle creases -->
      <path d="M58,-8 Q60,-6 62,-8" fill="none" stroke="#3a2010" stroke-width="0.4"/>
      <!-- Cool light on hand from device -->
      <path d="M52,-12 L62,-8 Q64,-2 58,2 Z" fill="#a8c0e0" opacity="0.45"/>
    </g>

    <!-- LEFT ARM at side -->
    <path d="M-30,40 Q-50,60 -50,90 L-42,90 Q-40,60 -32,40 Z" fill="url(#p6p4suit)"/>

    <!-- HEAD — three-quarter facing right (toward device) -->
    <g transform="translate(-40 -10)">
      <ellipse cx="0" cy="0" rx="32" ry="38" fill="url(#p6p4skin)"/>
      <path d="M-30,-4 Q-26,18 -10,32 L4,34 Q22,30 30,12 L26,-4 Z" fill="url(#p6p4skin)"/>
      <ellipse cx="22" cy="0" rx="4" ry="7" fill="url(#p6p4skin)"/>
      <ellipse cx="22" cy="0" rx="2" ry="4" fill="#3a2010" opacity="0.5"/>
      <!-- Hair silver-white buzz -->
      <g fill="url(#p6p4hair)">
        <path d="M-30,-30 Q-30,-42 -2,-46 Q24,-42 24,-30 L22,-22 Q12,-32 -2,-32 Q-22,-32 -28,-22 Z"/>
        <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
          <line x1="-22" y1="-38" x2="-22" y2="-34"/>
          <line x1="-12" y1="-42" x2="-12" y2="-38"/>
          <line x1="-2" y1="-44" x2="-2" y2="-40"/>
          <line x1="10" y1="-40" x2="10" y2="-36"/>
          <line x1="20" y1="-36" x2="20" y2="-32"/>
        </g>
      </g>
      <!-- Warm rim on hair from gap above -->
      <path d="M-30,-30 Q-30,-42 -2,-46 Q24,-42 24,-30" fill="none" stroke="#e8d8b8" stroke-width="0.7" opacity="0.65"/>

      <!-- BROW set hard -->
      <path d="M-22,-12 L-8,-16" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,-16 L18,-12" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>

      <!-- EYES — narrow, looking at device (down-right) -->
      <ellipse cx="-14" cy="-4" rx="4" ry="2" fill="#fff8e8"/>
      <ellipse cx="-12" cy="-4" rx="2.4" ry="1.6" fill="#3a2010"/>
      <circle cx="-12" cy="-4" r="1.2" fill="#0a0604"/>
      <ellipse cx="6" cy="-4" rx="3.5" ry="2" fill="#fff8e8"/>
      <ellipse cx="8" cy="-4" rx="2" ry="1.4" fill="#3a2010"/>
      <circle cx="8" cy="-4" r="1.1" fill="#0a0604"/>

      <!-- Lower lid (subtle wetness — eyes not steady) -->
      <path d="M-18,-1 Q-12,2 -8,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M2,-1 Q8,2 12,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <!-- Faint catchlight -->
      <ellipse cx="-13" cy="-5" rx="0.7" ry="0.45" fill="#a8c0e0"/>
      <ellipse cx="7" cy="-5" rx="0.7" ry="0.45" fill="#a8c0e0"/>

      <!-- NOSE -->
      <path d="M-6,0 L-4,18 Q-2,22 0,22 L4,20 L0,2 Z" fill="url(#p6p4skin)"/>

      <!-- MOUTH — A LINE -->
      <path d="M-14,32 L8,30" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>

      <!-- COOL GEOMETRIC LIGHT on left side of face from the device -->
      <g opacity="0.55">
        <path d="M-30,4 L-18,2 L-16,8 L-30,12 Z" fill="#a8c0e0"/>
        <path d="M-30,18 L-18,14 L-16,20 L-30,24 Z" fill="#a8c0e0"/>
        <path d="M-26,-6 L-14,-10 L-12,-2 L-26,2 Z" fill="#a8c0e0"/>
      </g>
    </g>
  </g>

  <!-- DIALOGUE — Sable: Or we wipe him. The neural modifier can target specific memory clusters. He forgets us. He goes home. Problem contained. -->
  <g>
    <rect x="14" y="14" width="338" height="76" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,90 L190,90 L182,104 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M182,90 L188,90" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Or we wipe him. The neural modifier can</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">target specific memory clusters. He forgets us.</text>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">He goes home. Problem contained.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 180,82 Q300,84 366,80"/>
    <path d="M0,300 Q60,302 180,298 Q300,296 366,300"/>
  </g>
</svg>
