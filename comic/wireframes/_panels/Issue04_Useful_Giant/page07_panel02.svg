<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 7 — Panel 2: Luma CU detailed risk explanation, neural architecture comparison</title>
  <desc>50mm CU. Luma turned to address Sable directly. Holographic display shows neural architecture comparison — fairy schematic next to human schematic. Cracked right lens. Sapphire-violet glow dominates. Concerned but composed scientific authority. Luma: His neural architecture isn't like ours. The modifier was calibrated for our species. Applied to a human — to a developing human brain — the risk of collateral erasure is significant. / I'm not talking about headaches. I'm talking about language. Motor function. Self-recognition.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p7p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p7p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <radialGradient id="p7p2lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p2hologramGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p2bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p7p2bg)"/>

  <!-- BG brick -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
  </g>

  <!-- HOLOGRAPHIC NEURAL COMPARISON DISPLAY (right of Luma, smaller) -->
  <g transform="translate(280 130)">
    <ellipse cx="0" cy="0" rx="68" ry="60" fill="url(#p7p2hologramGlow)" filter="url(#p7p2bloom)" opacity="0.7"/>
    <!-- Two brain schematics side by side -->
    <!-- LEFT: Fairy brain (their species) -->
    <g transform="translate(-26 0)">
      <path d="M-20,-12 Q-22,-22 -8,-26 Q8,-30 18,-22 Q22,-12 18,4 Q12,16 0,18 L-10,16 Q-18,8 -22,-2 Z"
            fill="none" stroke="#c0a8ff" stroke-width="0.85" opacity="0.85"/>
      <g stroke="#c0a8ff" stroke-width="0.4" fill="none" opacity="0.6">
        <path d="M-12,-10 Q-4,-2 4,-10"/>
        <path d="M-8,2 Q0,10 8,2"/>
      </g>
      <text x="-18" y="28" font-family="Helvetica Neue" font-size="4.5" fill="#c0a8ff" font-weight="700">OURS</text>
    </g>
    <!-- RIGHT: Human brain (developing) -->
    <g transform="translate(26 0)">
      <path d="M-22,-14 Q-26,-26 -8,-30 Q12,-34 22,-24 Q26,-12 20,4 Q14,18 0,20 L-12,18 Q-22,8 -24,-4 Z"
            fill="none" stroke="#fff8e8" stroke-width="0.85" opacity="0.85"/>
      <g stroke="#fff8e8" stroke-width="0.4" fill="none" opacity="0.6">
        <path d="M-12,-12 Q-4,-2 6,-12"/>
        <path d="M-8,2 Q2,10 10,0"/>
        <path d="M-18,8 Q-12,16 -4,12"/>
      </g>
      <!-- Prefrontal highlighted brighter -->
      <ellipse cx="-16" cy="-14" rx="10" ry="8" fill="#fff8e8" opacity="0.4"/>
      <text x="-22" y="28" font-family="Helvetica Neue" font-size="4.5" fill="#fff8e8" font-weight="700">HUMAN</text>
    </g>
    <!-- COMPARISON INDICATOR (mismatch arrows / X) -->
    <g stroke="#dc2030" stroke-width="0.7" opacity="0.7">
      <line x1="-6" y1="-4" x2="6" y2="4"/>
      <line x1="6" y1="-4" x2="-6" y2="4"/>
    </g>
    <!-- Data ticks -->
    <g stroke="#fff8e8" stroke-width="0.4" opacity="0.7">
      <line x1="-30" y1="-50" x2="-20" y2="-50"/>
      <line x1="20" y1="-50" x2="30" y2="-50"/>
      <line x1="-30" y1="50" x2="-20" y2="50"/>
      <line x1="20" y1="50" x2="30" y2="50"/>
    </g>
  </g>

  <!-- LUMA — turned facing right toward Sable (off-frame), three-quarter -->
  <g transform="translate(120 250)">
    <ellipse cx="0" cy="60" rx="14" ry="3" fill="#0a0604" opacity="0.65"/>
    <!-- Legs -->
    <path d="M-7,16 L-10,58 L-3,60 L-1,16 Z" fill="url(#p7p2suit)"/>
    <path d="M1,16 L3,60 L10,58 L7,16 Z" fill="url(#p7p2suit)"/>
    <!-- Torso -->
    <path d="M-13,-14 L-15,16 L15,16 L13,-14 Z" fill="url(#p7p2suit)"/>
    <path d="M-15,-14 Q-22,-24 -15,-28 L-8,-28 Z" fill="url(#p7p2suit)"/>
    <path d="M15,-14 Q22,-24 15,-28 L8,-28 Z" fill="url(#p7p2suit)"/>
    <circle cx="-10" cy="-22" r="1.4" fill="#a888ff" filter="url(#p7p2bloom)"/>
    <circle cx="10" cy="-22" r="1.4" fill="#a888ff" filter="url(#p7p2bloom)"/>

    <!-- Right arm — gesturing toward holographic display -->
    <path d="M15,-14 Q40,-2 60,8 L56,18 Q35,12 12,6 Z" fill="url(#p7p2suit)"/>
    <ellipse cx="62" cy="10" rx="4" ry="3" fill="url(#p7p2skin)"/>
    <!-- Holographic projector on wrist (the source of the display) -->
    <circle cx="64" cy="8" r="2.4" fill="#a888ff" filter="url(#p7p2bloom)"/>
    <ellipse cx="64" cy="8" rx="1.2" ry="0.7" fill="#fff8e8"/>
    <!-- INK STAINS -->
    <ellipse cx="62" cy="10" rx="2" ry="1" fill="#1a0838" opacity="0.7"/>

    <!-- Left arm at side -->
    <path d="M-15,-14 Q-22,4 -16,18 L-10,16 Q-14,2 -10,-12 Z" fill="url(#p7p2suit)"/>
    <ellipse cx="-15" cy="18" rx="2.4" ry="1.4" fill="url(#p7p2skin)"/>

    <!-- HEAD — three-quarter facing right, slightly forward (concerned, leaning in to argue) -->
    <ellipse cx="2" cy="-50" rx="14" ry="17" fill="url(#p7p2skin)"/>
    <!-- Hair -->
    <g fill="#1a0c04">
      <path d="M-10,-62 Q-10,-72 4,-74 Q14,-72 14,-62 L12,-54 Q8,-62 0,-62 Q-8,-62 -10,-54 Z"/>
      <!-- Braid hanging back -->
      <path d="M12,-60 Q22,-44 26,-22" stroke="#1a0c04" stroke-width="3" fill="none"/>
    </g>
    <!-- SAPPHIRE FILAMENT -->
    <line x1="12" y1="-60" x2="26" y2="-22" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#p7p2bloom)"/>

    <!-- HOLOGRAPHIC LENSES (with glow halos) -->
    <ellipse cx="-3" cy="-52" rx="8" ry="6" fill="url(#p7p2lensGlow)" filter="url(#p7p2bloom)" opacity="0.7"/>
    <ellipse cx="9" cy="-52" rx="8" ry="6" fill="url(#p7p2lensGlow)" filter="url(#p7p2bloom)" opacity="0.7"/>
    <ellipse cx="-3" cy="-52" rx="3.5" ry="2.4" fill="#a888ff" opacity="0.55" stroke="#7a5ad8" stroke-width="0.55"/>
    <ellipse cx="9" cy="-52" rx="3.5" ry="2.4" fill="#a888ff" opacity="0.55" stroke="#7a5ad8" stroke-width="0.55"/>
    <!-- CRACK on right lens -->
    <path d="M9,-53 L13,-50" stroke="#3a1a78" stroke-width="0.55"/>
    <path d="M11,-52 L8,-50" stroke="#3a1a78" stroke-width="0.4"/>
    <!-- Eyes faintly visible behind -->
    <ellipse cx="-3" cy="-52" rx="2" ry="1.4" fill="#3a2010" opacity="0.5"/>
    <ellipse cx="9" cy="-52" rx="2" ry="1.4" fill="#3a2010" opacity="0.5"/>
    <circle cx="-3" cy="-52" r="0.6" fill="#0a0604"/>
    <circle cx="9" cy="-52" r="0.6" fill="#0a0604"/>
    <!-- Scrolling data -->
    <g stroke="#fff8e8" stroke-width="0.4" opacity="0.85">
      <line x1="-7" y1="-53" x2="-2" y2="-53"/>
      <line x1="0" y1="-51" x2="3" y2="-51"/>
      <line x1="6" y1="-53" x2="11" y2="-53"/>
      <line x1="8" y1="-51" x2="11" y2="-51"/>
    </g>

    <!-- Brow concerned -->
    <path d="M-12,-62 L-5,-62" stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M5,-62 L13,-62" stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M2,-44 L0,-36 Q2,-34 5,-36 L2,-44 Z" fill="#7a4830" opacity="0.65"/>
    <!-- Mouth - speaking -->
    <ellipse cx="3" cy="-30" rx="3" ry="1.4" fill="#5a2818" opacity="0.85"/>
    <path d="M0,-30 Q3,-28 6,-30" fill="none" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- DIALOGUE — Luma (long technical): His neural architecture isn't like ours. The modifier was calibrated for our species. Applied to a human — to a developing human brain — the risk of collateral erasure is significant. -->
  <g>
    <rect x="14" y="14" width="338" height="86" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,100 L130,100 L122,114 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M122,100 L128,100" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">His neural architecture isn't like ours. The modifier was</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">calibrated for our species. Applied to a human — to a</text>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">developing human brain — the risk of collateral erasure</text>
  <text x="22" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">is significant.</text>

  <!-- DIALOGUE — Luma: I'm not talking about headaches. I'm talking about language. Motor function. Self-recognition. -->
  <g>
    <rect x="14" y="116" width="338" height="60" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,176 L130,176 L122,188 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M122,176 L128,176" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I'm not talking about headaches. I'm talking about</text>
  <text x="22" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">language. Motor function. Self-recognition.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
