<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 4 — Page 11 — Panel 3: Sable introduces the squad by name</title>
  <desc>Wide shot of squad on beam in formation — Sable center, others arrayed. Each has a small title flag/glow at their position. Sable: Captain Sable. The engineer is Wren. The scout you already know is Jink. The soldier is Thresh. The medic is Luma. / You address me as Captain or ma'am. Clear? / Theodore: Clear, Captain.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p11p3timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p11p3silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p11p3emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <linearGradient id="p11p3crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d83040"/>
      <stop offset="100%" stop-color="#7a1018"/>
    </linearGradient>
    <linearGradient id="p11p3copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <linearGradient id="p11p3sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p11p3darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p11p3jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p11p3wrenSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p11p3threshSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8a888"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <radialGradient id="p11p3coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p3bloom"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>

  <rect width="241" height="364" fill="url(#p11p3bg)"/>
  <rect width="241" height="364" fill="url(#p11p3coolWash)"/>

  <!-- Brick BG -->
  <rect x="0" y="40" width="241" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- Beam -->
  <rect x="0" y="280" width="241" height="40" fill="url(#p11p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="241" y2="282"/>
    <line x1="0" y1="316" x2="241" y2="316"/>
  </g>

  <!-- 5 squad members lined up -->
  <!-- Thresh -->
  <g transform="translate(40 282)">
    <ellipse cx="0" cy="0" rx="9" ry="2" fill="#0a0604" opacity="0.55"/>
    <path d="M-5,-30 L-7,-2 L-2,0 L0,-30 Z" fill="url(#p11p3crimson)"/>
    <path d="M0,-30 L2,0 L7,-2 L5,-30 Z" fill="url(#p11p3crimson)"/>
    <path d="M-9,-54 L-11,-30 L11,-30 L9,-54 Z" fill="url(#p11p3crimson)"/>
    <path d="M-9,-54 Q-13,-60 -9,-64 L-3,-64 L-5,-52 Z" fill="#a82030"/>
    <ellipse cx="-11" cy="-60" rx="2" ry="1" fill="#5a0810" opacity="0.85"/>
    <path d="M9,-54 Q13,-60 9,-64 L3,-64 Z" fill="url(#p11p3crimson)"/>
    <ellipse cx="0" cy="-72" rx="6" ry="8" fill="url(#p11p3threshSkin)"/>
    <path d="M-5,-78 Q-5,-82 0,-83 Q5,-82 5,-78 L4,-74 Q2,-78 -2,-78 Q-4,-78 -5,-74 Z" fill="#a83018"/>
    <!-- Title -->
    <text x="0" y="14" text-anchor="middle" font-family="Helvetica Neue" font-size="6.5" fill="#ff8090" font-weight="700">THRESH</text>
  </g>

  <!-- Wren -->
  <g transform="translate(85 282)">
    <ellipse cx="0" cy="0" rx="8" ry="2" fill="#0a0604" opacity="0.55"/>
    <path d="M-5,-28 L-7,-2 L-2,0 L0,-28 Z" fill="url(#p11p3copper)"/>
    <path d="M0,-28 L2,0 L7,-2 L5,-28 Z" fill="url(#p11p3copper)"/>
    <path d="M-8,-50 L-10,-28 L10,-28 L8,-50 Z" fill="url(#p11p3copper)"/>
    <ellipse cx="-8" cy="-48" rx="3" ry="2" fill="#1a0c04" opacity="0.75"/>
    <path d="M-8,-50 Q-12,-56 -8,-60 L-3,-60 Z" fill="url(#p11p3copper)"/>
    <path d="M8,-50 Q12,-56 8,-60 L3,-60 Z" fill="url(#p11p3copper)"/>
    <ellipse cx="0" cy="-68" rx="6" ry="8" fill="url(#p11p3wrenSkin)"/>
    <g fill="#1a0c04">
      <path d="M-5,-74 Q-5,-78 0,-79 Q5,-78 5,-74 L4,-71 Q2,-74 -2,-74 Q-4,-74 -5,-71 Z"/>
      <ellipse cx="0" cy="-82" rx="3" ry="2.4"/>
    </g>
    <text x="0" y="14" text-anchor="middle" font-family="Helvetica Neue" font-size="6.5" fill="#ffd888" font-weight="700">WREN</text>
  </g>

  <!-- SABLE (CENTER, presenting) -->
  <g transform="translate(120 282)">
    <ellipse cx="0" cy="0" rx="11" ry="2.4" fill="#0a0604" opacity="0.65"/>
    <path d="M-5,-32 L-8,-2 L-2,0 L0,-32 Z" fill="url(#p11p3silver)"/>
    <path d="M0,-32 L2,0 L8,-2 L5,-32 Z" fill="url(#p11p3silver)"/>
    <path d="M-10,-58 L-12,-32 L12,-32 L10,-58 Z" fill="url(#p11p3silver)"/>
    <ellipse cx="10" cy="-56" rx="4" ry="2.4" fill="#3a3038" opacity="0.75"/>
    <path d="M-10,-58 Q-14,-64 -10,-68 L-5,-68 Z" fill="url(#p11p3silver)"/>
    <path d="M10,-58 Q14,-64 10,-68 L5,-68 Z" fill="url(#p11p3silver)"/>
    <circle cx="-7" cy="-64" r="0.85" fill="#fff8e8" filter="url(#p11p3bloom)"/>
    <circle cx="7" cy="-64" r="0.85" fill="#fff8e8" filter="url(#p11p3bloom)"/>
    <!-- Right arm slightly out (gestural — presenting) -->
    <path d="M10,-58 Q18,-50 22,-40 L18,-36 Q12,-46 6,-56 Z" fill="url(#p11p3silver)"/>
    <ellipse cx="22" cy="-38" rx="2.4" ry="1.4" fill="url(#p11p3darkSkin)"/>
    <ellipse cx="0" cy="-76" rx="7" ry="9" fill="url(#p11p3darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-6,-82 Q-6,-86 0,-87 Q6,-86 6,-82 L5,-78 Q2,-82 -2,-82 Q-4,-82 -6,-78 Z"/>
    </g>
    <!-- Title — gold ring around her -->
    <text x="0" y="14" text-anchor="middle" font-family="Helvetica Neue" font-size="7" fill="#fff8e8" font-weight="800">SABLE</text>
    <text x="0" y="22" text-anchor="middle" font-family="Helvetica Neue" font-size="5" fill="#fff8e8" font-weight="500" opacity="0.85">CAPT</text>
  </g>

  <!-- Luma -->
  <g transform="translate(160 282)">
    <ellipse cx="0" cy="0" rx="8" ry="2" fill="#0a0604" opacity="0.55"/>
    <path d="M-5,-28 L-7,-2 L-2,0 L0,-28 Z" fill="url(#p11p3sapphire)"/>
    <path d="M0,-28 L2,0 L7,-2 L5,-28 Z" fill="url(#p11p3sapphire)"/>
    <path d="M-8,-50 L-10,-28 L10,-28 L8,-50 Z" fill="url(#p11p3sapphire)"/>
    <path d="M-8,-50 Q-12,-56 -8,-60 L-3,-60 Z" fill="url(#p11p3sapphire)"/>
    <path d="M8,-50 Q12,-56 8,-60 L3,-60 Z" fill="url(#p11p3sapphire)"/>
    <ellipse cx="0" cy="-68" rx="6" ry="8" fill="url(#p11p3jinkSkin)"/>
    <g fill="#1a0c04">
      <path d="M-6,-74 Q-6,-78 0,-79 Q6,-78 6,-74 L5,-70 Q2,-74 -2,-74 Q-4,-74 -6,-70 Z"/>
    </g>
    <ellipse cx="-2" cy="-68" rx="1.4" ry="1" fill="#a888ff" filter="url(#p11p3bloom)"/>
    <ellipse cx="2" cy="-68" rx="1.4" ry="1" fill="#a888ff" filter="url(#p11p3bloom)"/>
    <text x="0" y="14" text-anchor="middle" font-family="Helvetica Neue" font-size="6.5" fill="#a888ff" font-weight="700">LUMA</text>
  </g>

  <!-- Jink -->
  <g transform="translate(202 282)">
    <ellipse cx="0" cy="0" rx="8" ry="2" fill="#0a0604" opacity="0.55"/>
    <path d="M-5,-28 L-7,-2 L-2,0 L0,-28 Z" fill="url(#p11p3emerald)"/>
    <path d="M0,-28 L2,0 L7,-2 L5,-28 Z" fill="url(#p11p3emerald)"/>
    <path d="M-8,-50 L-10,-28 L10,-28 L8,-50 Z" fill="url(#p11p3emerald)"/>
    <path d="M-7,-46 Q-2,-44 3,-48 Q-2,-38 -5,-36 Z" fill="#3a2818" opacity="0.7"/>
    <path d="M-8,-50 Q-12,-56 -8,-60 L-3,-60 Z" fill="url(#p11p3emerald)"/>
    <path d="M8,-50 Q12,-56 8,-60 L3,-60 Z" fill="url(#p11p3emerald)"/>
    <ellipse cx="0" cy="-68" rx="6" ry="8" fill="url(#p11p3jinkSkin)"/>
    <g fill="#d8a838">
      <circle cx="-4" cy="-74" r="2"/>
      <circle cx="0" cy="-77" r="2.4"/>
      <circle cx="4" cy="-74" r="2"/>
    </g>
    <text x="0" y="14" text-anchor="middle" font-family="Helvetica Neue" font-size="6.5" fill="#9aff9a" font-weight="700">JINK</text>
  </g>

  <!-- DIALOGUE — Sable: Captain Sable. The engineer is Wren. The scout you already know is Jink. The soldier is Thresh. The medic is Luma. -->
  <g>
    <rect x="14" y="14" width="216" height="76" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,90 L130,90 L122,104 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M122,90 L128,90" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">Captain Sable. Engineer Wren.</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">Scout Jink. Soldier Thresh.</text>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">Medic Luma.</text>

  <!-- DIALOGUE — Sable: You address me as Captain or ma'am. Clear? -->
  <g>
    <rect x="14" y="106" width="216" height="60" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,166 L130,166 L122,178 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M122,166 L128,166" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">You address me as Captain</text>
  <text x="22" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">or ma'am. Clear?</text>

  <!-- DIALOGUE — Theodore: Clear, Captain. -->
  <g>
    <rect x="14" y="186" width="180" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M88,186 L96,176 L104,186 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M92,186 L100,186" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Clear, Captain.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 241,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 241,300"/>
  </g>
</svg>
