<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 4 — Page 7 — Panel 5: Wren delivers component list — solution argument</title>
  <desc>Medium shot. Wren standing, holographic copper-gold component list displayed beside her — INDUCTION COILS, PRECISION LENS, CONDUCTOR WIRE, etc. Engineer's argument. Squad watches. Wren: We need copper induction coils from a telegraph station. A precision lens from a lighthouse. Conductor wire from a foundry. And that's the SHORT list. / Every item is behind a human door, on a human shelf, in a human building. We are FOUR INCHES TALL. / He's not a problem. He's a solution.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p5bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p7p5timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p7p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p7p5suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p7p5listGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p5bloom"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="p7p5glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#p7p5bg)"/>

  <!-- BG brick -->
  <rect x="0" y="40" width="494" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="494" y2="80"/>
    <line x1="0" y1="140" x2="494" y2="140"/>
    <line x1="0" y1="200" x2="494" y2="200"/>
  </g>

  <!-- Timber beam at foot level -->
  <rect x="0" y="280" width="494" height="44" fill="url(#p7p5timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="494" y2="282"/>
    <line x1="0" y1="320" x2="494" y2="320"/>
  </g>

  <!-- HOLOGRAPHIC COMPONENT LIST — copper-gold, floating right of Wren -->
  <g transform="translate(330 130)">
    <!-- Glow halo -->
    <ellipse cx="0" cy="0" rx="120" ry="80" fill="url(#p7p5listGlow)" filter="url(#p7p5glow)" opacity="0.6"/>

    <!-- List items as iconic geometric symbols -->
    <!-- Header -->
    <rect x="-90" y="-58" width="180" height="14" fill="none" stroke="#ffd888" stroke-width="0.7" opacity="0.85"/>
    <text x="-86" y="-48" font-family="Helvetica Neue" font-size="6" fill="#ffd888" font-weight="700">REQUISITION:</text>

    <!-- Item 1: induction coils -->
    <g transform="translate(-78 -28)">
      <!-- Coil icon -->
      <g stroke="#ffd888" stroke-width="0.55" fill="none" opacity="0.85">
        <circle cx="0" cy="0" r="6"/>
        <circle cx="0" cy="0" r="4"/>
        <circle cx="0" cy="0" r="2"/>
      </g>
      <text x="14" y="3" font-family="Helvetica Neue" font-size="5.5" fill="#ffd888" font-weight="700">INDUCTION COILS — TELEGRAPH</text>
    </g>

    <!-- Item 2: precision lens -->
    <g transform="translate(-78 -8)">
      <!-- Lens icon -->
      <g stroke="#ffd888" stroke-width="0.55" fill="none" opacity="0.85">
        <ellipse cx="0" cy="0" rx="6" ry="4"/>
        <line x1="-6" y1="0" x2="6" y2="0"/>
      </g>
      <text x="14" y="3" font-family="Helvetica Neue" font-size="5.5" fill="#ffd888" font-weight="700">PRECISION LENS — LIGHTHOUSE</text>
    </g>

    <!-- Item 3: conductor wire -->
    <g transform="translate(-78 12)">
      <g stroke="#ffd888" stroke-width="0.55" fill="none" opacity="0.85">
        <path d="M-6,0 L-4,-2 L-2,2 L0,-2 L2,2 L4,-2 L6,0"/>
      </g>
      <text x="14" y="3" font-family="Helvetica Neue" font-size="5.5" fill="#ffd888" font-weight="700">CONDUCTOR WIRE — FOUNDRY</text>
    </g>

    <!-- More dots indicating "and more" -->
    <g transform="translate(-78 32)">
      <text x="-2" y="3" font-family="Helvetica Neue" font-size="6" fill="#ffd888" font-weight="700" opacity="0.7">⋮</text>
      <text x="14" y="3" font-family="Helvetica Neue" font-size="5.5" fill="#ffd888" font-weight="700" opacity="0.65">+ 8 MORE</text>
    </g>

    <!-- Tiny ticks animating -->
    <g stroke="#fff8e8" stroke-width="0.4" opacity="0.7">
      <line x1="-90" y1="46" x2="-80" y2="46"/>
      <line x1="-72" y1="46" x2="-62" y2="46"/>
      <line x1="-54" y1="46" x2="-44" y2="46"/>
    </g>
  </g>

  <!-- Beam from Wren's wrist projecting up to list -->
  <g opacity="0.55">
    <path d="M180,260 L240,180 L290,180 Z" fill="#ffd888" filter="url(#p7p5bloom)" opacity="0.4"/>
  </g>

  <!-- WREN — left side, projecting list, addressing squad -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <!-- Legs -->
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p7p5suit)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p7p5suit)"/>
    <ellipse cx="-7" cy="-1" rx="3.5" ry="1.4" fill="#5a2810"/>
    <ellipse cx="7" cy="-1" rx="3.5" ry="1.4" fill="#5a2810"/>
    <!-- COPPER DUST at knees -->
    <ellipse cx="-7" cy="-22" rx="3" ry="0.8" fill="#a86838" opacity="0.55"/>
    <ellipse cx="7" cy="-22" rx="3" ry="0.8" fill="#a86838" opacity="0.55"/>
    <!-- Torso -->
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p7p5suit)"/>
    <!-- SCORCH MARK left shoulder -->
    <ellipse cx="-13" cy="-76" rx="4" ry="3" fill="#1a0c04" opacity="0.75"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p7p5suit)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p7p5suit)"/>
    <circle cx="-10" cy="-86" r="1" fill="#ffd888" filter="url(#p7p5bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#ffd888" filter="url(#p7p5bloom)"/>

    <!-- RIGHT arm — wrist projector raised toward list -->
    <path d="M15,-78 Q26,-50 22,-22 L14,-22 Q14,-50 10,-76 Z" fill="url(#p7p5suit)"/>
    <ellipse cx="22" cy="-22" rx="3.5" ry="2.4" fill="url(#p7p5skin)"/>
    <!-- Copper-gold wrist diagnostic -->
    <circle cx="22" cy="-22" r="2.4" fill="#ffd888" filter="url(#p7p5bloom)"/>
    <ellipse cx="22" cy="-22" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <!-- OIL stains -->
    <ellipse cx="22" cy="-22" rx="2" ry="1" fill="#1a0c04" opacity="0.55"/>

    <!-- Left arm at side -->
    <path d="M-15,-78 Q-22,-58 -16,-44 L-10,-46 Q-14,-58 -10,-76 Z" fill="url(#p7p5suit)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p7p5skin)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="9" ry="11" fill="url(#p7p5skin)"/>
    <g fill="#1a0c04">
      <path d="M-7,-111 Q-8,-117 0,-119 Q8,-117 7,-111 L5,-106 Q2,-112 -2,-112 Q-5,-112 -7,-106 Z"/>
      <ellipse cx="0" cy="-122" rx="5" ry="4"/>
    </g>
    <ellipse cx="-3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.6" fill="#1a0c04"/>
    <ellipse cx="3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-104" r="0.6" fill="#1a0c04"/>
    <!-- Brow set -->
    <path d="M-7,-110 L-1,-110" stroke="#1a0c04" stroke-width="0.85"/>
    <path d="M1,-110 L7,-110" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Mouth speaking -->
    <ellipse cx="0" cy="-98" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- DIALOGUE — Wren: We need copper induction coils from a telegraph station. A precision lens from a lighthouse. Conductor wire from a foundry. And that's the SHORT list. -->
  <g>
    <rect x="14" y="14" width="466" height="58" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,72 L190,72 L182,84 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M182,72 L188,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">We need copper induction coils from a telegraph station. A precision lens from a</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">lighthouse. Conductor wire from a foundry. And that's the <tspan font-weight="700">SHORT</tspan> list.</text>

  <!-- DIALOGUE — Wren: Every item is behind a human door, on a human shelf, in a human building. We are FOUR INCHES TALL. -->
  <g>
    <rect x="14" y="86" width="466" height="58" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,144 L190,144 L182,156 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M182,144 L188,144" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Every item is behind a human door, on a human shelf, in a human</text>
  <text x="22" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">building. We are <tspan font-weight="700">FOUR INCHES TALL.</tspan></text>

  <!-- DIALOGUE — Wren: He's not a problem. He's a solution. -->
  <g>
    <rect x="14" y="158" width="270" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M150,202 L160,202 L152,214 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M152,202 L158,202" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">He's not a problem. He's a solution.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q380,76 494,80"/>
    <path d="M0,260 Q120,262 240,258 Q380,256 494,260"/>
  </g>
</svg>
