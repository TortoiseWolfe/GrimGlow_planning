<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 422" width="366" height="422">
  <title>Issue 4 — Page 9 — Panel 3: Sable CU watching Wren, tactical reassessment, hand moves from device</title>
  <desc>65mm CU. Sable not looking at cradle but sideways at Wren. Cold strategic reassessment — fury gone, replaced by recognition that circumstances have outmaneuvered her. Hand moved away from memory-wipe device on ledge (visible at frame edge). Cool blue-white dominant, brighter from cradle above. Sable: You're sure? / Wren (off-panel): I'm sure.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p9p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p9p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="50%" stop-color="#a8a0a0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p9p3hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="p9p3device" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b8"/>
      <stop offset="100%" stop-color="#5a5868"/>
    </linearGradient>
    <radialGradient id="p9p3coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p3deviceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="422" fill="url(#p9p3bg)"/>
  <rect width="366" height="422" fill="url(#p9p3coolWash)"/>

  <!-- Distant brick -->
  <rect x="0" y="60" width="366" height="280" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
  </g>

  <!-- MEMORY-WIPE DEVICE on ledge at frame bottom-right (Sable's hand has just moved away) -->
  <g transform="translate(320 360)">
    <ellipse cx="0" cy="0" rx="34" ry="20" fill="url(#p9p3deviceGlow)" filter="url(#p9p3bloom)" opacity="0.55"/>
    <rect x="-22" y="-2" width="44" height="6" fill="#3a2818"/>
    <rect x="-18" y="-12" width="36" height="12" fill="url(#p9p3device)" stroke="#3a3848" stroke-width="0.7"/>
    <ellipse cx="20" cy="-6" rx="4" ry="2.4" fill="#e8f0ff" filter="url(#p9p3bloom)"/>
  </g>

  <!-- SABLE — turned slightly toward viewer's left (looking at Wren off-frame), CU -->
  <g transform="translate(170 280)">
    <!-- Body -->
    <path d="M-100,140 L-100,40 L100,40 L100,140 Z" fill="url(#p9p3suit)"/>
    <path d="M-100,40 Q-70,16 0,8 Q70,16 100,40 L80,52 L-80,52 Z" fill="url(#p9p3suit)"/>
    <line x1="0" y1="20" x2="0" y2="140" stroke="#5a5860" stroke-width="0.85"/>
    <ellipse cx="60" cy="20" rx="22" ry="14" fill="#3a3038" opacity="0.75"/>
    <circle cx="-40" cy="20" r="2" fill="#fff8e8" filter="url(#p9p3bloom)"/>
    <circle cx="40" cy="20" r="2" fill="#fff8e8" filter="url(#p9p3bloom)"/>

    <!-- Right hand visible at frame bottom edge — moved AWAY from device (raised slightly) -->
    <g transform="translate(80 60)">
      <path d="M0,8 Q14,2 30,4 L30,14 Q14,12 4,16 Z" fill="url(#p9p3suit)"/>
      <ellipse cx="36" cy="6" rx="6" ry="4" fill="url(#p9p3skin)"/>
      <!-- Cool reflected light on hand -->
      <ellipse cx="36" cy="4" rx="4" ry="2" fill="#a8c0e0" opacity="0.45"/>
    </g>

    <!-- HEAD — turned LEFT (looking at Wren) -->
    <g transform="translate(-10 -30)">
      <ellipse cx="0" cy="0" rx="42" ry="48" fill="url(#p9p3skin)"/>
      <path d="M-40,-2 Q-34,32 -10,42 L4,42 Q26,38 36,16 L34,-2 Z" fill="url(#p9p3skin)"/>
      <ellipse cx="-32" cy="-2" rx="5" ry="9" fill="url(#p9p3skin)"/>
      <ellipse cx="-32" cy="-2" rx="2.4" ry="5" fill="#3a2010" opacity="0.5"/>

      <g fill="url(#p9p3hair)">
        <path d="M-40,-40 Q-40,-54 -2,-58 Q34,-54 34,-40 L30,-30 Q14,-44 -2,-44 Q-26,-44 -36,-30 Z"/>
        <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
          <line x1="-30" y1="-46" x2="-30" y2="-42"/>
          <line x1="-18" y1="-50" x2="-18" y2="-46"/>
          <line x1="-2" y1="-54" x2="-2" y2="-50"/>
          <line x1="14" y1="-50" x2="14" y2="-46"/>
          <line x1="28" y1="-44" x2="28" y2="-40"/>
        </g>
      </g>

      <!-- BROW relaxed (fury gone) — neutral, calculating -->
      <path d="M-30,-12 L-12,-16" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <path d="M-2,-16 L18,-12" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>

      <!-- EYES — looking left toward Wren -->
      <ellipse cx="-22" cy="-4" rx="6" ry="3" fill="#fff8e8"/>
      <ellipse cx="-26" cy="-4" rx="3.5" ry="2" fill="#3a2010"/>
      <circle cx="-26" cy="-4" r="1.6" fill="#0a0604"/>
      <ellipse cx="-27" cy="-5" rx="0.85" ry="0.55" fill="#fff8e8"/>
      <ellipse cx="6" cy="-4" rx="5" ry="2.4" fill="#fff8e8"/>
      <ellipse cx="2" cy="-4" rx="3" ry="1.8" fill="#3a2010"/>
      <circle cx="2" cy="-4" r="1.4" fill="#0a0604"/>
      <ellipse cx="1" cy="-5" rx="0.7" ry="0.45" fill="#fff8e8"/>

      <path d="M-26,1 Q-22,4 -16,1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M0,1 Q4,4 8,1" fill="none" stroke="#3a2010" stroke-width="0.55"/>

      <!-- NOSE -->
      <path d="M-8,2 L-6,18 Q-4,22 -2,22 L2,20 L-2,4 Z" fill="url(#p9p3skin)"/>

      <!-- MOUTH — line, pensive -->
      <path d="M-18,32 L4,30" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Cool light dominates left side (Wren-side gets warm light from cradle) -->
      <g opacity="0.5">
        <path d="M-40,-4 L-26,-8 L-24,-2 L-40,2 Z" fill="#a8c0e0"/>
        <path d="M-40,12 L-26,8 L-24,14 L-40,18 Z" fill="#a8c0e0"/>
      </g>
    </g>
  </g>

  <!-- DIALOGUE — Sable: You're sure? -->
  <g>
    <rect x="14" y="14" width="120" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M40,58 L50,58 L42,70 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M42,58 L48,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">You're sure?</text>

  <!-- DIALOGUE — Wren (off-panel): I'm sure. -->
  <g>
    <rect x="240" y="74" width="112" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-dasharray="4,2" filter="url(#balloonShadow)"/>
    <path d="M340,118 L352,118 L342,128 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-dasharray="2,1.5"/>
    <path d="M342,118 L348,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="248" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="248" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I'm sure.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,360 Q120,362 240,358 Q300,356 366,360"/>
  </g>
</svg>
