<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 4 — Page 1 — Panel 5: Theodore stands, sees the wall gap</title>
  <desc>50mm medium shot. Theodore from behind/three-quarter back, standing facing the far corner of the courtyard where old brick wall meets building. Shoulders squared, chin up — resolve, not wonder. The wall gap visible as narrow dark slit at base of brick wall. Backlit by overcast sky. There you are.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p1p5sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a094"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <linearGradient id="p1p5brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p1p5brickFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="p1p5cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a5a48"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p1p5theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p1p5theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p1p5vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p1p5shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p1p5trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2c20"/>
    </linearGradient>
  </defs>

  <!-- BG sky strip -->
  <rect width="238" height="60" fill="url(#p1p5sky)"/>
  <!-- Far building wall (FAR CORNER) -->
  <rect x="0" y="40" width="238" height="180" fill="url(#p1p5brickFar)"/>
  <g stroke="#2a1810" stroke-width="0.45" opacity="0.55">
    <line x1="0" y1="60" x2="238" y2="60"/>
    <line x1="0" y1="80" x2="238" y2="80"/>
    <line x1="0" y1="100" x2="238" y2="100"/>
    <line x1="0" y1="120" x2="238" y2="120"/>
    <line x1="0" y1="140" x2="238" y2="140"/>
    <line x1="0" y1="160" x2="238" y2="160"/>
    <line x1="0" y1="180" x2="238" y2="180"/>
    <line x1="0" y1="200" x2="238" y2="200"/>
    <line x1="0" y1="220" x2="238" y2="220"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="120" y1="80" x2="120" y2="120"/>
    <line x1="80" y1="140" x2="80" y2="180"/>
    <line x1="180" y1="180" x2="180" y2="220"/>
  </g>
  <!-- Where buildings meet — the corner crease -->
  <rect x="158" y="40" width="2" height="200" fill="#1a0c04" opacity="0.7"/>
  <rect x="160" y="40" width="78" height="200" fill="url(#p1p5brick)"/>
  <g stroke="#3a2010" stroke-width="0.45" opacity="0.55">
    <line x1="160" y1="60" x2="238" y2="60"/>
    <line x1="160" y1="80" x2="238" y2="80"/>
    <line x1="160" y1="100" x2="238" y2="100"/>
    <line x1="160" y1="120" x2="238" y2="120"/>
    <line x1="160" y1="140" x2="238" y2="140"/>
    <line x1="160" y1="160" x2="238" y2="160"/>
    <line x1="160" y1="180" x2="238" y2="180"/>
    <line x1="160" y1="200" x2="238" y2="200"/>
    <line x1="160" y1="220" x2="238" y2="220"/>
    <line x1="200" y1="40" x2="200" y2="80"/>
    <line x1="180" y1="120" x2="180" y2="160"/>
    <line x1="220" y1="180" x2="220" y2="220"/>
  </g>
  <!-- Window on right wall -->
  <rect x="180" y="100" width="32" height="36" fill="#3a2818"/>
  <rect x="184" y="104" width="24" height="28" fill="#5a4838" opacity="0.75"/>
  <line x1="196" y1="104" x2="196" y2="132" stroke="#1a0c04" stroke-width="0.45"/>

  <!-- THE WALL GAP — narrow dark slit at base of right wall, where mortar crumbles -->
  <g>
    <rect x="170" y="216" width="22" height="6" fill="#0a0604"/>
    <!-- Subtle prismatic hint at gap edge — barely there -->
    <rect x="170" y="215" width="22" height="1" fill="#a8b8c8" opacity="0.25"/>
    <!-- Crumbled mortar -->
    <ellipse cx="172" cy="222" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="178" cy="223" rx="2" ry="0.8" fill="#7a6858" opacity="0.7"/>
  </g>

  <!-- COBBLESTONES -->
  <rect x="0" y="220" width="238" height="144" fill="url(#p1p5cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.65">
    <path d="M0,240 Q80,238 160,242 Q200,244 238,240"/>
    <path d="M0,270 Q80,272 160,268 Q200,266 238,270"/>
    <path d="M0,310 Q80,308 160,312 Q200,314 238,310"/>
    <path d="M0,345 Q80,347 160,343 Q200,341 238,345"/>
  </g>
  <g fill="#1a1410" opacity="0.5">
    <circle cx="40" cy="252" r="1.4"/>
    <circle cx="120" cy="262" r="1.4"/>
    <circle cx="200" cy="252" r="1.4"/>
    <circle cx="60" cy="295" r="1.4"/>
    <circle cx="160" cy="305" r="1.4"/>
    <circle cx="200" cy="295" r="1.4"/>
    <circle cx="40" cy="335" r="1.4"/>
    <circle cx="140" cy="345" r="1.4"/>
    <circle cx="200" cy="335" r="1.4"/>
  </g>

  <!-- THEODORE — standing, three-quarter back/profile, facing far corner -->
  <g transform="translate(78 240)">
    <!-- Long shadow on cobbles toward viewer (backlit) -->
    <ellipse cx="2" cy="100" rx="22" ry="4" fill="#1a0c04" opacity="0.55"/>
    <path d="M0,98 L-32,108 L-30,118 L4,104 Z" fill="#1a0c04" opacity="0.45"/>

    <!-- Trousers (legs standing, slightly turned) -->
    <path d="M-8,8 L-12,72 L-4,82 L0,8 Z" fill="url(#p1p5trousers)"/>
    <path d="M2,8 L4,72 L14,82 L8,8 Z" fill="url(#p1p5trousers)"/>
    <ellipse cx="-8" cy="86" rx="6" ry="2" fill="#1a0c04"/>
    <ellipse cx="9" cy="86" rx="6" ry="2" fill="#1a0c04"/>
    <!-- Patches -->
    <rect x="-9" y="32" width="6" height="6" fill="#3a2010" opacity="0.7"/>
    <rect x="2" y="48" width="5" height="5" fill="#3a2010" opacity="0.7"/>

    <!-- Vest (back view, slightly turned) -->
    <path d="M-16,-50 L-20,8 L20,8 L16,-50 Z" fill="url(#p1p5vest)"/>
    <!-- Notebook tucked in waistcoat front (corner peeking) -->
    <rect x="6" y="-18" width="14" height="18" fill="#d8c8a8" opacity="0.95" stroke="#7a5848" stroke-width="0.4"/>

    <!-- Shirt collar from back -->
    <path d="M-6,-60 L-4,-50 L4,-50 L6,-60 Z" fill="url(#p1p5shirt)"/>

    <!-- Arms (at sides, hands free) -->
    <path d="M-16,-44 Q-22,-22 -20,4 L-14,8 Q-12,-22 -10,-44 Z" fill="url(#p1p5shirt)"/>
    <path d="M16,-44 Q22,-22 20,4 L14,8 Q12,-22 10,-44 Z" fill="url(#p1p5shirt)"/>
    <!-- Hands -->
    <ellipse cx="-20" cy="6" rx="3.5" ry="2.5" fill="url(#p1p5theoSkin)"/>
    <ellipse cx="20" cy="6" rx="3.5" ry="2.5" fill="url(#p1p5theoSkin)"/>

    <!-- Head — turned slightly to look at corner (right side), three-quarter back -->
    <ellipse cx="0" cy="-78" rx="13" ry="15" fill="url(#p1p5theoSkin)"/>
    <!-- Hair tousled, sandy-brown -->
    <g fill="url(#p1p5theoHair)">
      <path d="M-12,-92 Q-13,-104 0,-108 Q14,-104 12,-92 L8,-86 Q3,-94 -4,-94 Q-12,-94 -16,-86 Z"/>
      <path d="M-7,-104 L-9,-114 L-3,-104 Z"/>
      <path d="M-1,-108 L-1,-116 L4,-104 Z"/>
      <path d="M5,-108 L9,-116 L7,-104 Z"/>
      <!-- Back of hair -->
      <path d="M-12,-86 Q-14,-78 -10,-72 L-2,-72 Q-2,-80 -8,-84 Z"/>
      <path d="M12,-86 Q14,-78 10,-72 L2,-72 Q2,-80 8,-84 Z"/>
    </g>
    <!-- Ear (right) -->
    <ellipse cx="11" cy="-78" rx="2" ry="3" fill="url(#p1p5theoSkin)"/>
    <!-- Hint of profile (only edge of nose visible from this angle) -->
    <path d="M12,-78 L14,-72 L12,-70 Z" fill="url(#p1p5theoSkin)"/>
    <!-- Single eye visible (facing right toward gap) -->
    <ellipse cx="6" cy="-78" rx="1.6" ry="1" fill="#fff8e8"/>
    <circle cx="7" cy="-78" r="0.6" fill="#1a0c04"/>
    <!-- Set jaw -->
    <path d="M5,-66 Q9,-64 12,-66" fill="none" stroke="#3a2010" stroke-width="0.5"/>
    <!-- Freckles on visible cheek -->
    <circle cx="8" cy="-72" r="0.4" fill="#7a5848"/>
    <circle cx="10" cy="-74" r="0.4" fill="#7a5848"/>
  </g>

  <!-- DIALOGUE — Theodore (quiet): "There you are." -->
  <g>
    <rect x="14" y="14" width="138" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M82,58 L92,58 L84,70 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M84,58 L90,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">There you are.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,40 Q60,38 120,42 Q180,44 238,40"/>
    <path d="M0,200 Q60,202 120,198 Q180,196 238,200"/>
  </g>
</svg>
