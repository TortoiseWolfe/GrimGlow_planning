<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 4 — Page 22 — Panel 4: CLOSING IMAGE — CU on Luma's eyes — the loneliest knowledge — Issue 4 ends here</title>
  <desc>85mm CU. Tight frame. Projections shut down. Near-darkness. Only suit minimum sapphire-violet glow + fading warm gold from lenses. Luma stares forward — not at data, at the implication. Eyes still, heavy, certain. Caption: Someone was here before them. Someone stayed. This changed everything.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p22p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="p22p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p22p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2068"/>
      <stop offset="100%" stop-color="#1a0c38"/>
    </linearGradient>
    <radialGradient id="p22p4suitMin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p4lensFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p4bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="p22p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- Near-darkness -->
  <rect width="238" height="364" fill="url(#p22p4bg)"/>

  <!-- Suit's MINIMUM ambient glow at chest, behind face -->
  <g transform="translate(119 220)">
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="url(#p22p4suitMin)" filter="url(#p22p4glow)" opacity="0.6"/>
  </g>

  <!-- LUMA face — TIGHT FRAME, CLOSING IMAGE -->
  <g transform="translate(119 200)">
    <!-- Faint suit collar visible -->
    <path d="M-50,140 L-60,90 L60,90 L50,140 Z" fill="url(#p22p4suit)"/>
    <line x1="-26" y1="100" x2="26" y2="100" stroke="#a888e8" stroke-width="1.4" opacity="0.85" filter="url(#p22p4bloom)"/>
    <line x1="0" y1="90" x2="0" y2="120" stroke="#a888e8" stroke-width="0.7" opacity="0.65"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="0" rx="100" ry="130" fill="url(#p22p4skin)"/>
    <!-- Hair top -->
    <path d="M-78,-100 Q-60,-138 0,-144 Q60,-138 80,-94 L78,-80 Q56,-110 0,-110 Q-56,-110 -78,-80 Z" fill="#0a0604"/>
    <!-- BRAID over right shoulder, trailing (mostly off-frame at this CU) -->
    <path d="M44,72 Q66,116 70,160 Q70,180 64,200" stroke="#0a0604" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M44,72 Q66,116 70,160" stroke="#3a1c08" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M44,72 Q66,116 70,160 Q70,180 64,200" stroke="#a888e8" stroke-width="1.4" fill="none" opacity="0.7" filter="url(#p22p4bloom)"/>
    <circle cx="60" cy="108" r="1.4" fill="#fff8e8" filter="url(#p22p4bloom)"/>
    <circle cx="68" cy="148" r="1.2" fill="#fff8e8" filter="url(#p22p4bloom)"/>

    <!-- EYES — STILL, heavy, certain. The CLOSING IMAGE. The light barely catches them. -->
    <ellipse cx="-32" cy="0" rx="22" ry="12" fill="#fff8e8" opacity="0.65"/>
    <ellipse cx="-32" cy="2" rx="14" ry="9" fill="#3a2010"/>
    <circle cx="-32" cy="2" r="8" fill="#0a0604"/>
    <!-- Catchlight — minimal. The light in her eyes is the only light in the frame -->
    <circle cx="-30" cy="-2" r="2.4" fill="#fff8e8" filter="url(#p22p4bloom)"/>
    <circle cx="-29" cy="-3" r="1.2" fill="#fff8e8"/>

    <ellipse cx="32" cy="0" rx="22" ry="12" fill="#fff8e8" opacity="0.65"/>
    <ellipse cx="32" cy="2" rx="14" ry="9" fill="#3a2010"/>
    <circle cx="32" cy="2" r="8" fill="#0a0604"/>
    <circle cx="34" cy="-2" r="2.4" fill="#fff8e8" filter="url(#p22p4bloom)"/>
    <circle cx="35" cy="-3" r="1.2" fill="#fff8e8"/>

    <!-- Brows level — heavy, settled, not reactive -->
    <path d="M-54,-26 L-12,-32" stroke="#0a0604" stroke-width="3" stroke-linecap="round"/>
    <path d="M12,-32 L54,-26" stroke="#0a0604" stroke-width="3" stroke-linecap="round"/>
    <!-- Lower lid lift (barely held) -->
    <path d="M-46,12 Q-32,18 -18,12" fill="none" stroke="#3a2010" stroke-width="0.85" opacity="0.8"/>
    <path d="M18,12 Q32,18 46,12" fill="none" stroke="#3a2010" stroke-width="0.85" opacity="0.8"/>

    <!-- Nose -->
    <path d="M-6,18 L-2,46 Q2,52 8,50 L10,18 Z" fill="url(#p22p4skin)" opacity="0.85"/>
    <ellipse cx="-2" cy="48" rx="3" ry="1.6" fill="#3a1c08" opacity="0.5"/>
    <ellipse cx="6" cy="48" rx="3" ry="1.6" fill="#3a1c08" opacity="0.5"/>

    <!-- Mouth — pressed, not tight. Settled. -->
    <path d="M-16,76 L16,76" stroke="#3a1808" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Slight upward curve at corners (acceptance, not denial) -->
    <path d="M-16,72 Q-10,72 -4,74" stroke="#5a2818" stroke-width="0.85" opacity="0.65" fill="none"/>

    <!-- HOLO LENSES — fading warm gold (almost off) -->
    <g opacity="0.55">
      <ellipse cx="-32" cy="2" rx="18" ry="14" fill="url(#p22p4lensFade)" filter="url(#p22p4glow)"/>
      <ellipse cx="32" cy="2" rx="18" ry="14" fill="url(#p22p4lensFade)" filter="url(#p22p4glow)"/>
      <rect x="-58" y="-20" width="52" height="36" rx="2" fill="none" stroke="#ffd078" stroke-width="0.85" opacity="0.55" filter="url(#p22p4bloom)"/>
      <line x1="-58" y1="0" x2="-6" y2="0" stroke="#ffd078" stroke-width="0.4" opacity="0.5"/>
      <!-- crack -->
      <line x1="-46" y1="-20" x2="-38" y2="-6" stroke="#ffd078" stroke-width="0.4"/>
      <line x1="-38" y1="-6" x2="-44" y2="14" stroke="#ffd078" stroke-width="0.4"/>
      <rect x="6" y="-20" width="52" height="36" rx="2" fill="none" stroke="#ffd078" stroke-width="0.85" opacity="0.55" filter="url(#p22p4bloom)"/>
      <line x1="6" y1="0" x2="58" y2="0" stroke="#ffd078" stroke-width="0.4" opacity="0.5"/>
    </g>

    <!-- Subtle cool wash on cheeks from suit's ambient -->
    <ellipse cx="-50" cy="40" rx="14" ry="20" fill="#a888e8" opacity="0.18" filter="url(#p22p4glow)"/>
    <ellipse cx="50" cy="40" rx="14" ry="20" fill="#a888e8" opacity="0.18" filter="url(#p22p4glow)"/>
  </g>

  <!-- CAPTION 1 — top, the discovery distilled -->
  <g>
    <rect x="14" y="14" width="210" height="46" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a4a30" font-style="italic">Someone was here before them.</text>
  <text x="22" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a4a30" font-style="italic" font-weight="500">Someone stayed.</text>

  <!-- CAPTION 2 — bottom, the implication — ISSUE 4 ENDS -->
  <g>
    <rect x="14" y="306" width="210" height="44" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="700">This changed everything.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q60,82 120,78 Q180,76 238,80"/>
    <path d="M0,300 Q60,298 120,302 Q180,304 238,300"/>
  </g>
</svg>
