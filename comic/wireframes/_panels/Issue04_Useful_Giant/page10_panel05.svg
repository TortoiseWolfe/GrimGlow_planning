<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 10 — Panel 5: Wren delivers verdict — clever / useful</title>
  <desc>MCU. Wren in working analysis posture, Luma visible at edge. Wren: He got the principle right. The execution is crude — coil ratios are wrong, the brass is too impure to sustain clean resonance. / But the principle. He reverse-engineered resonance charging from a dead shard. / Luma: He's clever. / Wren: He's useful.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p10p5timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p10p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p10p5suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <linearGradient id="p10p5lumaSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p10p5sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <radialGradient id="p10p5lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p10p5bg)"/>

  <!-- BG brick -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- Beam -->
  <rect x="0" y="280" width="366" height="44" fill="url(#p10p5timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="366" y2="282"/>
    <line x1="0" y1="320" x2="366" y2="320"/>
  </g>

  <!-- LUMA in BG (right edge) -->
  <g transform="translate(310 282)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="13" ry="2.4" fill="#0a0604" opacity="0.55"/>
    <path d="M-7,-40 L-10,-2 L-3,0 L-1,-40 Z" fill="url(#p10p5sapphire)"/>
    <path d="M1,-40 L3,0 L10,-2 L7,-40 Z" fill="url(#p10p5sapphire)"/>
    <path d="M-12,-70 L-14,-40 L14,-40 L12,-70 Z" fill="url(#p10p5sapphire)"/>
    <path d="M-14,-70 Q-19,-78 -13,-82 L-7,-80 Z" fill="url(#p10p5sapphire)"/>
    <path d="M14,-70 Q19,-78 13,-82 L7,-80 Z" fill="url(#p10p5sapphire)"/>
    <path d="M-14,-68 Q-19,-58 -16,-44 L-10,-46 Q-12,-58 -10,-66 Z" fill="url(#p10p5sapphire)"/>
    <path d="M14,-68 Q19,-58 16,-44 L10,-46 Q12,-58 10,-66 Z" fill="url(#p10p5sapphire)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p10p5lumaSkin)"/>
    <ellipse cx="15" cy="-44" rx="2.4" ry="1.4" fill="url(#p10p5lumaSkin)"/>
    <ellipse cx="0" cy="-86" rx="8" ry="10" fill="url(#p10p5lumaSkin)"/>
    <g fill="#1a0c04">
      <path d="M-8,-94 Q-8,-100 0,-102 Q8,-100 8,-94 L6,-88 Q3,-94 -3,-94 Q-6,-94 -8,-88 Z"/>
      <path d="M6,-92 Q12,-78 14,-62" stroke="#1a0c04" stroke-width="2" fill="none"/>
    </g>
    <line x1="6" y1="-92" x2="14" y2="-62" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#p10p5bloom)"/>
    <ellipse cx="-3" cy="-86" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p10p5bloom)"/>
    <ellipse cx="3" cy="-86" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p10p5bloom)"/>
  </g>

  <!-- WREN — MCU foreground -->
  <g transform="translate(140 282)">
    <ellipse cx="0" cy="0" rx="20" ry="3.5" fill="#0a0604" opacity="0.7"/>
    <path d="M-8,-50 L-12,-2 L-4,0 L-2,-50 Z" fill="url(#p10p5suit)"/>
    <path d="M2,-50 L4,0 L12,-2 L8,-50 Z" fill="url(#p10p5suit)"/>
    <path d="M-22,-100 L-24,-50 L24,-50 L22,-100 Z" fill="url(#p10p5suit)"/>
    <ellipse cx="-22" cy="-98" rx="6" ry="4.5" fill="#1a0c04" opacity="0.75"/>
    <path d="M-22,-100 Q-30,-108 -22,-114 L-13,-114 Z" fill="url(#p10p5suit)"/>
    <path d="M22,-100 Q30,-108 22,-114 L13,-114 Z" fill="url(#p10p5suit)"/>
    <circle cx="-15" cy="-108" r="1.4" fill="#ffd888" filter="url(#p10p5bloom)"/>
    <circle cx="15" cy="-108" r="1.4" fill="#ffd888" filter="url(#p10p5bloom)"/>

    <!-- Arms — folded -->
    <path d="M-22,-94 Q-26,-82 -14,-78 L14,-80 Q26,-84 22,-94 L14,-92 Q-2,-84 -14,-90 Z" fill="url(#p10p5suit)"/>
    <ellipse cx="-10" cy="-84" rx="5" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="10" cy="-84" rx="5" ry="2" fill="#1a0c04" opacity="0.55"/>

    <!-- Head -->
    <ellipse cx="0" cy="-130" rx="14" ry="17" fill="url(#p10p5skin)"/>
    <g fill="#1a0c04">
      <path d="M-12,-142 Q-12,-152 0,-154 Q12,-152 12,-142 L10,-134 Q4,-142 0,-142 Q-4,-142 -10,-134 Z"/>
      <ellipse cx="0" cy="-160" rx="8" ry="6"/>
      <path d="M-9,-144 Q-12,-138 -10,-128" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
      <path d="M9,-144 Q12,-138 10,-128" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
    </g>
    <!-- Brows: one slightly raised (skeptical/analytical) -->
    <path d="M-10,-138 L-3,-140" stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M3,-141 L10,-138" stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="-5" cy="-130" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="-5" cy="-130" rx="1.4" ry="1.1" fill="#3a2010"/>
    <circle cx="-5" cy="-130" r="0.85" fill="#0a0604"/>
    <ellipse cx="5" cy="-130" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="5" cy="-130" rx="1.4" ry="1.1" fill="#3a2010"/>
    <circle cx="5" cy="-130" r="0.85" fill="#0a0604"/>
    <!-- Nose -->
    <path d="M0,-126 L-2,-114 Q0,-112 2,-114 Z" fill="#a87858" opacity="0.65"/>
    <!-- Mouth — analytical, slight focus expression -->
    <path d="M-7,-104 Q0,-102 7,-105" fill="none" stroke="#3a1808" stroke-width="1"/>
  </g>

  <!-- DIALOGUE — Wren: He got the principle right. The execution is crude — coil ratios are wrong, the brass is too impure to sustain clean resonance. -->
  <g>
    <rect x="14" y="14" width="338" height="76" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,90 L130,90 L122,104 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M122,90 L128,90" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">He got the principle right. The execution is crude — coil</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">ratios are wrong, the brass is too impure to sustain clean</text>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">resonance.</text>

  <!-- DIALOGUE — Wren: But the principle. He reverse-engineered resonance charging from a dead shard. -->
  <g>
    <rect x="14" y="106" width="338" height="60" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,166 L130,166 L122,178 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M122,166 L128,166" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">But the principle. He reverse-engineered resonance</text>
  <text x="22" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">charging from a dead shard.</text>

  <!-- DIALOGUE — Luma: He's clever. -->
  <g>
    <rect x="14" y="184" width="120" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M40,228 L50,228 L42,240 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M42,228 L48,228" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">He's clever.</text>

  <!-- DIALOGUE — Wren: He's useful. (the verdict) -->
  <g>
    <rect x="220" y="244" width="132" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M260,288 L270,288 L262,300 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M262,288 L268,288" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="228" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="228" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">He's useful.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
