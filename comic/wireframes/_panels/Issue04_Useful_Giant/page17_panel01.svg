<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 17 — Panel 1: Luma walking the wall void with scanner — methodical survey, camp glow distant behind</title>
  <desc>28mm wide. Fairy scale. Luma walks the brick void, scanner sweeping. Camp glow distant behind. Brickwork transition ahead — Victorian stock to hand-formed Georgian. Cobwebs, dust motes, blue-violet beam. Routine — but the void is narrowing.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p1bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="40%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="p17p1leftBrick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p17p1rightBrick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p17p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="p17p1suit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2068"/>
      <stop offset="50%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <linearGradient id="p17p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <radialGradient id="p17p1campGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffaa48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p17p1scannerCone" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#5a3ad8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p17p1glow"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <!-- Dark void background -->
  <rect width="742" height="364" fill="url(#p17p1bg)"/>

  <!-- LEFT WALL — Victorian stock brick transitioning to hand-formed (left side near camp = newer) -->
  <rect x="0" y="0" width="80" height="364" fill="url(#p17p1leftBrick)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="40" x2="80" y2="40"/>
    <line x1="0" y1="65" x2="80" y2="65"/>
    <line x1="0" y1="90" x2="80" y2="90"/>
    <line x1="0" y1="115" x2="80" y2="115"/>
    <line x1="0" y1="140" x2="80" y2="140"/>
    <line x1="0" y1="165" x2="80" y2="165"/>
    <line x1="0" y1="190" x2="80" y2="190"/>
    <line x1="0" y1="215" x2="80" y2="215"/>
    <line x1="0" y1="240" x2="80" y2="240"/>
    <line x1="0" y1="265" x2="80" y2="265"/>
    <line x1="0" y1="290" x2="80" y2="290"/>
    <line x1="0" y1="315" x2="80" y2="315"/>
    <line x1="40" y1="40" x2="40" y2="65"/>
    <line x1="20" y1="65" x2="20" y2="90"/>
    <line x1="60" y1="90" x2="60" y2="115"/>
    <line x1="40" y1="115" x2="40" y2="140"/>
    <line x1="20" y1="140" x2="20" y2="165"/>
    <line x1="60" y1="190" x2="60" y2="215"/>
    <line x1="40" y1="240" x2="40" y2="265"/>
    <line x1="20" y1="290" x2="20" y2="315"/>
  </g>

  <!-- RIGHT WALL — older hand-formed Georgian brick (further from camp = older) -->
  <rect x="662" y="0" width="80" height="364" fill="url(#p17p1rightBrick)"/>
  <g stroke="#0a0604" stroke-width="0.5" opacity="0.7">
    <path d="M662,38 Q702,40 742,37"/>
    <path d="M662,72 Q702,74 742,70"/>
    <path d="M662,108 Q702,106 742,110"/>
    <path d="M662,144 Q702,148 742,142"/>
    <path d="M662,180 Q702,178 742,184"/>
    <path d="M662,218 Q702,222 742,216"/>
    <path d="M662,254 Q702,250 742,256"/>
    <path d="M662,290 Q702,294 742,286"/>
    <path d="M662,326 Q702,322 742,330"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="690" cy="100" rx="6" ry="2" fill="#5a2818"/>
    <ellipse cx="715" cy="170" rx="5" ry="1.6" fill="#3a1808"/>
    <ellipse cx="700" cy="240" rx="7" ry="2.2" fill="#5a2818"/>
    <ellipse cx="720" cy="305" rx="5" ry="1.4" fill="#3a1808"/>
  </g>

  <!-- TRANSITION ZONE — middle of right wall where new meets old (faint vertical seam) -->
  <line x1="662" y1="0" x2="662" y2="364" stroke="#1a0c04" stroke-width="0.6" opacity="0.7"/>

  <!-- FLOOR — dust on timber base -->
  <rect x="80" y="290" width="582" height="74" fill="url(#p17p1floor)"/>
  <g stroke="#0a0604" stroke-width="0.4" opacity="0.55">
    <line x1="80" y1="305" x2="662" y2="308"/>
    <line x1="80" y1="325" x2="662" y2="328"/>
    <line x1="80" y1="345" x2="662" y2="348"/>
  </g>
  <!-- Dust patches -->
  <g opacity="0.4" fill="#5a4838">
    <ellipse cx="180" cy="320" rx="20" ry="3"/>
    <ellipse cx="320" cy="335" rx="24" ry="3"/>
    <ellipse cx="500" cy="325" rx="22" ry="3"/>
    <ellipse cx="600" cy="345" rx="18" ry="3"/>
  </g>

  <!-- CAMP GLOW — distant point behind Luma (left edge) -->
  <ellipse cx="50" cy="200" rx="55" ry="60" fill="url(#p17p1campGlow)" filter="url(#p17p1glow)"/>
  <ellipse cx="50" cy="200" rx="20" ry="22" fill="#ffaa48" opacity="0.45" filter="url(#p17p1bloom)"/>
  <ellipse cx="50" cy="200" rx="6" ry="6" fill="#fff8e8" opacity="0.7" filter="url(#p17p1bloom)"/>

  <!-- COBWEBS across passage — middle to right -->
  <g stroke="#a89888" stroke-width="0.4" fill="none" opacity="0.45">
    <path d="M530,80 Q570,90 600,75 Q630,60 660,80"/>
    <path d="M530,80 L600,75"/>
    <path d="M530,80 L630,60"/>
    <path d="M540,82 Q580,100 620,90"/>
    <path d="M620,180 Q640,200 660,190"/>
    <path d="M620,180 L660,190"/>
  </g>

  <!-- DUST MOTES suspended in scanner beam path -->
  <g fill="#a888e8" opacity="0.6">
    <circle cx="350" cy="190" r="0.9"/>
    <circle cx="380" cy="195" r="1.1"/>
    <circle cx="410" cy="185" r="0.8"/>
    <circle cx="440" cy="200" r="1.0"/>
    <circle cx="470" cy="190" r="0.7"/>
    <circle cx="500" cy="200" r="1.0"/>
    <circle cx="530" cy="195" r="0.9"/>
  </g>
  <g fill="#fff8e8" opacity="0.5">
    <circle cx="365" cy="170" r="0.6"/>
    <circle cx="395" cy="175" r="0.7"/>
    <circle cx="425" cy="180" r="0.5"/>
    <circle cx="485" cy="175" r="0.6"/>
    <circle cx="515" cy="180" r="0.7"/>
  </g>

  <!-- LUMA — walking right, scanner forward -->
  <g transform="translate(280 285)">
    <!-- Trailing scanner cone — sweeps right toward old brick -->
    <path d="M48,-50 L290,-90 L290,-30 L48,-30 Z" fill="url(#p17p1scannerCone)" filter="url(#p17p1bloom)" opacity="0.85"/>
    <!-- Scanner beam structured edges -->
    <line x1="48" y1="-50" x2="290" y2="-90" stroke="#a888e8" stroke-width="0.5" opacity="0.4"/>
    <line x1="48" y1="-30" x2="290" y2="-30" stroke="#a888e8" stroke-width="0.5" opacity="0.4"/>

    <!-- Boots -->
    <ellipse cx="-4" cy="0" rx="5" ry="2.4" fill="#1a0c1a"/>
    <ellipse cx="6" cy="0" rx="5" ry="2.4" fill="#1a0c1a"/>
    <!-- Legs -->
    <rect x="-7" y="-30" width="6" height="30" fill="url(#p17p1suit)"/>
    <rect x="3" y="-30" width="6" height="30" fill="url(#p17p1suit)"/>
    <line x1="-4" y1="-12" x2="-4" y2="-2" stroke="#5a3828" stroke-width="0.5" opacity="0.6"/>
    <!-- Torso -->
    <path d="M-12,-30 L-12,-66 L12,-66 L12,-30 Z" fill="url(#p17p1suit)"/>
    <!-- Sapphire chest accent line -->
    <line x1="-9" y1="-58" x2="9" y2="-58" stroke="#a888e8" stroke-width="1" opacity="0.7" filter="url(#p17p1bloom)"/>
    <line x1="0" y1="-66" x2="0" y2="-44" stroke="#a888e8" stroke-width="0.6" opacity="0.55"/>
    <!-- Arms — left along body, right forward holding scanner -->
    <rect x="-15" y="-66" width="6" height="32" fill="url(#p17p1suit)"/>
    <path d="M9,-66 L9,-58 L40,-50 L46,-44 L46,-38 L40,-40 L9,-50 Z" fill="url(#p17p1suit)"/>
    <!-- Right hand on scanner -->
    <ellipse cx="42" cy="-40" rx="4" ry="3" fill="url(#p17p1skin)"/>
    <!-- SCANNER device -->
    <rect x="38" y="-54" width="14" height="14" rx="1.5" fill="#3a2068" stroke="#a888e8" stroke-width="0.7"/>
    <rect x="40" y="-52" width="10" height="10" fill="#5a3ad8" filter="url(#p17p1bloom)"/>
    <rect x="40" y="-52" width="10" height="2" fill="#a888e8" opacity="0.8"/>
    <rect x="40" y="-46" width="10" height="1" fill="#a888e8" opacity="0.6"/>
    <!-- Scanner tip emitter -->
    <circle cx="50" cy="-47" r="1.4" fill="#fff8e8" filter="url(#p17p1bloom)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-78" rx="9" ry="11" fill="url(#p17p1skin)"/>
    <!-- BRAID NOT LOOSE — back braid trailing left (she's walking right) -->
    <path d="M-7,-72 Q-12,-50 -16,-30 Q-18,-12 -16,-2" stroke="#1a0c04" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M-9,-66 Q-13,-46 -15,-26" stroke="#3a1c08" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- SAPPHIRE FILAMENT in braid -->
    <path d="M-8,-68 Q-12,-48 -14,-28" stroke="#a888e8" stroke-width="0.6" fill="none" opacity="0.85" filter="url(#p17p1bloom)"/>
    <circle cx="-13" cy="-50" r="0.7" fill="#fff8e8" filter="url(#p17p1bloom)"/>
    <circle cx="-15" cy="-30" r="0.6" fill="#fff8e8" filter="url(#p17p1bloom)"/>

    <!-- Profile features (looking right toward beam) -->
    <path d="M5,-80 L9,-78 L8,-74 L4,-74 Z" fill="url(#p17p1skin)" opacity="0.9"/>
    <ellipse cx="5" cy="-80" rx="1.4" ry="0.9" fill="#fff8e8"/>
    <circle cx="5" cy="-80" r="0.7" fill="#0a0604"/>
    <path d="M3,-72 L7,-72" stroke="#3a1808" stroke-width="0.7" stroke-linecap="round"/>

    <!-- HOLO LENS — right side, projected before face -->
    <rect x="11" y="-86" width="9" height="6" rx="1" fill="none" stroke="#ffd078" stroke-width="0.7" opacity="0.85"/>
    <line x1="11" y1="-83" x2="20" y2="-83" stroke="#ffd078" stroke-width="0.4" opacity="0.7"/>
    <!-- LEFT lens — CRACKED right is the canon — but profile shows right side. Add subtle cracked line. -->
    <line x1="13" y1="-86" x2="15" y2="-83" stroke="#ffd078" stroke-width="0.4" opacity="0.55"/>
    <line x1="15" y1="-83" x2="14" y2="-80" stroke="#ffd078" stroke-width="0.4" opacity="0.55"/>

    <!-- INK STAINS on right hand -->
    <circle cx="40" cy="-37" r="0.9" fill="#1a1c34" opacity="0.75"/>
    <circle cx="44" cy="-39" r="0.6" fill="#1a1c34" opacity="0.7"/>
    <!-- DUST at knees -->
    <ellipse cx="-4" cy="-3" rx="6" ry="1.4" fill="#5a4838" opacity="0.5"/>
    <ellipse cx="6" cy="-3" rx="6" ry="1.4" fill="#5a4838" opacity="0.5"/>
  </g>

  <!-- LUMA dialogue — recorder narration, top-left -->
  <g>
    <rect x="14" y="14" width="394" height="68" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="120,82 132,82 124,92" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="120.5" y1="82" x2="131.5" y2="82" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a3ad8" font-weight="700">LUMA (recorder)</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Wall survey, section seven. Brickwork transition from machine-pressed</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">to hand-formed at approximately three metres from camp. Mortar</text>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">degradation suggests pre-Victorian construction. Interesting.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
