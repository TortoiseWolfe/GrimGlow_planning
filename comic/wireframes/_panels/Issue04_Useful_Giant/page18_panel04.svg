<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 18 — Panel 4: Pull-back — Luma small between two darknesses — secret kept</title>
  <desc>28mm pull back. Luma a single point of sapphire-violet light in the void. Glyph fading behind her. Camp's distant warmth in one direction. Unknown darkness in the other. She has decided not to tell.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0c14"/>
      <stop offset="50%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="p18p4leftWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p18p4rightWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="p18p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p18p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p18p4campGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#88ddff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffaa48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p4suitPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p4glyphFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#88aaff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p18p4glow"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <!-- Deep void background -->
  <rect width="742" height="364" fill="url(#p18p4bg)"/>

  <!-- LEFT WALL (timber + Victorian brick zone — toward camp) -->
  <rect x="0" y="0" width="120" height="364" fill="url(#p18p4leftWall)"/>
  <g stroke="#0a0604" stroke-width="0.4" opacity="0.5">
    <line x1="0" y1="40" x2="120" y2="40"/>
    <line x1="0" y1="80" x2="120" y2="80"/>
    <line x1="0" y1="120" x2="120" y2="120"/>
    <line x1="0" y1="160" x2="120" y2="160"/>
    <line x1="0" y1="200" x2="120" y2="200"/>
    <line x1="0" y1="240" x2="120" y2="240"/>
    <line x1="0" y1="280" x2="120" y2="280"/>
    <line x1="0" y1="320" x2="120" y2="320"/>
    <line x1="60" y1="40" x2="60" y2="80"/>
    <line x1="40" y1="80" x2="40" y2="120"/>
    <line x1="80" y1="120" x2="80" y2="160"/>
    <line x1="60" y1="200" x2="60" y2="240"/>
    <line x1="40" y1="280" x2="40" y2="320"/>
  </g>
  <!-- Timber column at left near camp -->
  <rect x="0" y="0" width="20" height="364" fill="#3a2818"/>

  <!-- RIGHT WALL (older brick — deeper into void) -->
  <rect x="622" y="0" width="120" height="364" fill="url(#p18p4rightWall)"/>
  <g stroke="#0a0604" stroke-width="0.5" opacity="0.65">
    <path d="M622,40 Q682,42 742,38"/>
    <path d="M622,90 Q682,88 742,92"/>
    <path d="M622,140 Q682,142 742,138"/>
    <path d="M622,190 Q682,188 742,192"/>
    <path d="M622,240 Q682,242 742,238"/>
    <path d="M622,290 Q682,288 742,292"/>
    <path d="M622,340 Q682,342 742,338"/>
  </g>

  <!-- FLOOR -->
  <rect x="120" y="290" width="502" height="74" fill="url(#p18p4floor)"/>

  <!-- Cobwebs in middle ceiling -->
  <g stroke="#a89888" stroke-width="0.4" fill="none" opacity="0.3">
    <path d="M280,60 Q340,80 400,70 Q460,60 520,80"/>
    <path d="M280,60 L520,80"/>
    <path d="M340,80 L460,60"/>
  </g>

  <!-- Distant CAMP GLOW — left edge -->
  <ellipse cx="60" cy="200" rx="100" ry="100" fill="url(#p18p4campGlow)" filter="url(#p18p4glow)" opacity="0.7"/>
  <ellipse cx="60" cy="200" rx="40" ry="40" fill="#ffaa48" opacity="0.35" filter="url(#p18p4bloom)"/>
  <ellipse cx="60" cy="200" rx="14" ry="14" fill="#fff8e8" opacity="0.65" filter="url(#p18p4bloom)"/>
  <!-- Multicolored emitter accent dots in camp glow -->
  <circle cx="80" cy="190" r="2" fill="#88ddff" opacity="0.7" filter="url(#p18p4bloom)"/>
  <circle cx="48" cy="208" r="2" fill="#dc6030" opacity="0.65" filter="url(#p18p4bloom)"/>
  <circle cx="56" cy="190" r="1.8" fill="#2ed078" opacity="0.7" filter="url(#p18p4bloom)"/>

  <!-- GLYPH — fading behind Luma, on the far right wall behind her -->
  <g transform="translate(600 195)">
    <ellipse cx="0" cy="0" rx="36" ry="36" fill="url(#p18p4glyphFade)" filter="url(#p18p4glow)" opacity="0.85"/>
    <g fill="none" stroke="#88aaff" stroke-width="1.2" opacity="0.6" filter="url(#p18p4bloom)">
      <path d="M-16,-9 L-9,-18 L9,-18 L18,-9 L18,9 L9,18 L-9,18 L-18,9 Z"/>
    </g>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#a8c0ff" stroke-width="1" opacity="0.55" filter="url(#p18p4bloom)"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#a8c0ff" stroke-width="1" opacity="0.55" filter="url(#p18p4bloom)"/>
    <circle cx="0" cy="0" r="2" fill="#fff8e8" opacity="0.55" filter="url(#p18p4bloom)"/>
  </g>

  <!-- LUMA — small, center-left of frame, point of sapphire-violet light -->
  <g transform="translate(380 230)">
    <!-- Suit point glow -->
    <ellipse cx="0" cy="-30" rx="38" ry="46" fill="url(#p18p4suitPoint)" filter="url(#p18p4glow)" opacity="0.7"/>
    <!-- Boots -->
    <ellipse cx="-4" cy="38" rx="4" ry="2" fill="#0a0408"/>
    <ellipse cx="4" cy="38" rx="4" ry="2" fill="#0a0408"/>
    <!-- Legs -->
    <rect x="-6" y="6" width="5" height="32" fill="url(#p18p4suit)"/>
    <rect x="1" y="6" width="5" height="32" fill="url(#p18p4suit)"/>
    <!-- Torso -->
    <path d="M-10,6 L-10,-32 L10,-32 L10,6 Z" fill="url(#p18p4suit)"/>
    <line x1="-7" y1="-22" x2="7" y2="-22" stroke="#a888e8" stroke-width="0.8" opacity="0.85" filter="url(#p18p4bloom)"/>
    <line x1="0" y1="-32" x2="0" y2="-12" stroke="#a888e8" stroke-width="0.5" opacity="0.7"/>
    <!-- Arms at sides -->
    <rect x="-13" y="-32" width="5" height="32" fill="url(#p18p4suit)"/>
    <rect x="8" y="-32" width="5" height="32" fill="url(#p18p4suit)"/>
    <ellipse cx="-10" cy="2" rx="2.5" ry="2" fill="#5a3828"/>
    <ellipse cx="10" cy="2" rx="2.5" ry="2" fill="#5a3828"/>

    <!-- Head -->
    <ellipse cx="0" cy="-44" rx="7" ry="9" fill="#5a3828"/>
    <path d="M-6,-52 Q-5,-58 0,-60 Q5,-58 6,-52 L5,-48 Q3,-52 0,-52 Q-3,-52 -5,-48 Z" fill="#0a0604"/>
    <!-- BRAID over right shoulder, trailing -->
    <path d="M5,-38 Q9,-22 10,-2 Q10,14 8,22" stroke="#0a0604" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M5,-38 Q9,-22 10,-2" stroke="#a888e8" stroke-width="0.5" fill="none" opacity="0.75" filter="url(#p18p4bloom)"/>
    <circle cx="9" cy="-12" r="0.5" fill="#fff8e8" filter="url(#p18p4bloom)"/>
    <circle cx="10" cy="6" r="0.4" fill="#fff8e8" filter="url(#p18p4bloom)"/>

    <!-- Profile (looking down — introspection) -->
    <ellipse cx="3" cy="-44" rx="1" ry="0.6" fill="#fff8e8"/>
    <path d="M2,-46 L4,-46" stroke="#0a0604" stroke-width="0.5"/>
    <path d="M0,-38 L4,-38" stroke="#3a1808" stroke-width="0.7"/>

    <!-- Tiny scanner — display turned off -->
    <rect x="8" y="-2" width="6" height="6" rx="0.5" fill="#3a2068" stroke="#5a3ad8" stroke-width="0.3" opacity="0.7"/>
    <!-- (No display glow — she has turned it off per script) -->
  </g>

  <!-- Cool wash extends from Luma -->
  <ellipse cx="380" cy="200" rx="100" ry="80" fill="#a888e8" opacity="0.06" filter="url(#p18p4glow)"/>

  <!-- LUMA — to herself (interrupted) -->
  <g>
    <rect x="14" y="14" width="278" height="46" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
    <polygon points="180,60 192,60 184,72" fill="white" stroke="#5a3ad8" stroke-width="0.85" stroke-dasharray="3 2"/>
    <line x1="180.5" y1="60" x2="191.5" y2="60" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a3ad8" font-weight="700">LUMA (to herself)</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Not yet. I need more data before I—</text>

  <!-- LUMA — stopping herself -->
  <g>
    <rect x="476" y="316" width="252" height="34" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
    <polygon points="510,316 522,316 514,306" fill="white" stroke="#5a3ad8" stroke-width="0.85" stroke-dasharray="3 2"/>
    <line x1="510.5" y1="316" x2="521.5" y2="316" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="484" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="484" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">I need more data.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,78 400,82 Q580,84 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
