<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 4 — Page 13 — Panel 3: Sable CU dismissive — courts and kings is pantomime</title>
  <desc>CU Sable. Eye-roll, irritated. Sable: Courts and kings. We're a recon squad, not a pantomime.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p13p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p13p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p13p3hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <radialGradient id="p13p3coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="241" height="364" fill="url(#p13p3bg)"/>
  <rect width="241" height="364" fill="url(#p13p3coolWash)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="241" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- SABLE CU -->
  <g transform="translate(120 240)">
    <!-- Shoulders -->
    <path d="M-70,90 L-70,40 L70,40 L70,90 Z" fill="url(#p13p3suit)"/>
    <path d="M-70,40 Q-50,16 0,8 Q50,16 70,40 L60,52 L-60,52 Z" fill="url(#p13p3suit)"/>
    <ellipse cx="50" cy="20" rx="14" ry="9" fill="#3a3038" opacity="0.75"/>
    <circle cx="-30" cy="20" r="2" fill="#fff8e8" filter="url(#p13p3bloom)"/>
    <circle cx="30" cy="20" r="2" fill="#fff8e8" filter="url(#p13p3bloom)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-60" rx="36" ry="44" fill="url(#p13p3skin)"/>
    <g fill="url(#p13p3hair)">
      <path d="M-32,-92 Q-32,-104 0,-108 Q26,-104 26,-92 L24,-84 Q12,-94 0,-94 Q-22,-94 -30,-84 Z"/>
    </g>
    <!-- Brow drawn down — annoyed -->
    <path d="M-22,-72 L-8,-76" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,-76 L18,-72" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes — slight EYEROLL (look up + away) -->
    <ellipse cx="-14" cy="-64" rx="4.5" ry="2.4" fill="#fff8e8"/>
    <ellipse cx="-15" cy="-66" rx="2.6" ry="1.6" fill="#3a2010"/>
    <circle cx="-15" cy="-66" r="1.4" fill="#0a0604"/>
    <ellipse cx="6" cy="-64" rx="3.5" ry="2" fill="#fff8e8"/>
    <ellipse cx="5" cy="-66" rx="2" ry="1.4" fill="#3a2010"/>
    <circle cx="5" cy="-66" r="1.1" fill="#0a0604"/>
    <!-- Lower lid lines -->
    <path d="M-18,-60 Q-12,-58 -8,-60" fill="none" stroke="#3a2010" stroke-width="0.55"/>
    <path d="M2,-60 Q8,-58 12,-60" fill="none" stroke="#3a2010" stroke-width="0.55"/>
    <!-- NOSE -->
    <path d="M-6,-58 L-4,-42 Q-2,-38 0,-38 L4,-40 L0,-56 Z" fill="url(#p13p3skin)"/>
    <!-- MOUTH — LINE, dismissive smirk -->
    <path d="M-14,-26 Q-2,-22 8,-30" fill="none" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- DIALOGUE — Sable: Courts and kings. We're a recon squad, not a pantomime. -->
  <g>
    <rect x="14" y="14" width="216" height="58" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,72 L130,72 L122,84 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M122,72 L128,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Courts and kings. We're a recon</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">squad, not a pantomime.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 241,80"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 241,300"/>
  </g>
</svg>
