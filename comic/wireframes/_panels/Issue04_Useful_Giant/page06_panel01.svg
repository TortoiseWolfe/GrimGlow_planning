<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 4 — Page 6 — Panel 1: Sable confronts Jink, three feet apart on beam</title>
  <desc>50mm two-shot inside camp. Sable rigid, hands fisted, silver suit catches cool light. Jink weight on one leg, defensive but not backing down. Other three squad members watch from BG. Cool blue-white camp light + warm daylight from above gap. Sable: You had contact. Unsanctioned. Unreported. And you said NOTHING. / Jink: I was going to— / Sable: When? When were you going to report that a human knows where we live?</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p6p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p6p1darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p6p1jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p6p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p6p1emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <radialGradient id="p6p1coolFill" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p1warmTop" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p1bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p6p1soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#p6p1bg)"/>
  <rect width="494" height="364" fill="url(#p6p1coolFill)"/>
  <rect width="494" height="364" fill="url(#p6p1warmTop)"/>

  <!-- BG brick + ceiling joist -->
  <rect x="0" y="0" width="494" height="40" fill="url(#p6p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.6" fill="none">
    <path d="M40,12 Q200,18 380,12 Q440,16 494,12"/>
    <path d="M40,28 Q200,32 380,28 Q440,30 494,28"/>
  </g>
  <rect x="0" y="40" width="494" height="220" fill="#2a1810" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="494" y2="80"/>
    <line x1="0" y1="140" x2="494" y2="140"/>
    <line x1="0" y1="200" x2="494" y2="200"/>
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="280" y1="80" x2="280" y2="140"/>
    <line x1="380" y1="140" x2="380" y2="200"/>
  </g>

  <!-- TIMBER BEAM (foot level) -->
  <rect x="0" y="280" width="494" height="44" fill="url(#p6p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="494" y2="282"/>
    <line x1="0" y1="320" x2="494" y2="320"/>
  </g>

  <!-- BG: 3 OTHER SQUAD MEMBERS WATCHING (soft focus) -->
  <g filter="url(#p6p1soft)" opacity="0.7">
    <!-- Thresh BG -->
    <g transform="translate(70 280)">
      <ellipse cx="0" cy="-12" rx="6" ry="7" fill="#a85a48"/>
      <path d="M-6,-6 L-8,12 L8,12 L6,-6 Z" fill="#a83040"/>
    </g>
    <!-- Wren BG -->
    <g transform="translate(180 280)">
      <ellipse cx="0" cy="-10" rx="5" ry="6" fill="#a87858"/>
      <path d="M-5,-4 L-7,12 L7,12 L5,-4 Z" fill="#c87a35"/>
    </g>
    <!-- Luma BG -->
    <g transform="translate(440 280)">
      <ellipse cx="0" cy="-10" rx="5" ry="6" fill="#a87858"/>
      <path d="M-5,-4 L-7,12 L7,12 L5,-4 Z" fill="#5a3ad8"/>
    </g>
  </g>

  <!-- SABLE (left, RIGID, fists, facing right toward Jink) -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="16" ry="3" fill="#0a0604" opacity="0.7"/>

    <!-- Legs -->
    <path d="M-8,-50 L-12,-2 L-3,0 L-1,-50 Z" fill="url(#p6p1silver)"/>
    <path d="M1,-50 L3,0 L12,-2 L8,-50 Z" fill="url(#p6p1silver)"/>
    <ellipse cx="-8" cy="-1" rx="4" ry="1.4" fill="#3a3838"/>
    <ellipse cx="8" cy="-1" rx="4" ry="1.4" fill="#3a3838"/>
    <!-- DUST AT KNEES -->
    <ellipse cx="-8" cy="-26" rx="3" ry="0.85" fill="#7a7080" opacity="0.5"/>
    <ellipse cx="8" cy="-26" rx="3" ry="0.85" fill="#7a7080" opacity="0.5"/>
    <!-- Torso -->
    <path d="M-14,-86 L-16,-50 L16,-50 L14,-86 Z" fill="url(#p6p1silver)"/>
    <!-- SOOT BLOOM right shoulder -->
    <ellipse cx="14" cy="-84" rx="6" ry="4" fill="#3a3038" opacity="0.75"/>
    <path d="M-16,-86 Q-22,-94 -16,-100 L-9,-100 L-12,-84 Z" fill="url(#p6p1silver)"/>
    <path d="M16,-86 Q22,-94 16,-100 L9,-100 L12,-84 Z" fill="url(#p6p1silver)"/>
    <circle cx="-10" cy="-94" r="1" fill="#fff8e8" filter="url(#p6p1bloom)"/>
    <circle cx="10" cy="-94" r="1" fill="#fff8e8" filter="url(#p6p1bloom)"/>

    <!-- ARMS — fists at sides (rigid) -->
    <path d="M-16,-86 Q-24,-66 -22,-44 L-14,-46 Q-14,-66 -10,-84 Z" fill="url(#p6p1silver)"/>
    <path d="M16,-86 Q24,-66 22,-44 L14,-46 Q14,-66 10,-84 Z" fill="url(#p6p1silver)"/>
    <!-- FISTS -->
    <ellipse cx="-22" cy="-44" rx="4" ry="3" fill="url(#p6p1darkSkin)"/>
    <ellipse cx="22" cy="-44" rx="4" ry="3" fill="url(#p6p1darkSkin)"/>
    <!-- Knuckle creases -->
    <path d="M-25,-46 Q-22,-44 -19,-46" fill="none" stroke="#3a2010" stroke-width="0.4"/>
    <path d="M19,-46 Q22,-44 25,-46" fill="none" stroke="#3a2010" stroke-width="0.4"/>

    <!-- Head — turned toward Jink (right) -->
    <ellipse cx="2" cy="-110" rx="9" ry="11" fill="url(#p6p1darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-5,-117 Q-6,-123 2,-125 Q10,-123 9,-117 L7,-112 Q4,-117 0,-117 Q-3,-117 -5,-112 Z"/>
      <g stroke="#f0e8d8" stroke-width="0.4" opacity="0.7">
        <line x1="-3" y1="-120" x2="-3" y2="-117"/>
        <line x1="0" y1="-122" x2="0" y2="-119"/>
        <line x1="3" y1="-122" x2="3" y2="-119"/>
        <line x1="6" y1="-120" x2="6" y2="-117"/>
      </g>
    </g>
    <!-- Eyes (looking right) -->
    <ellipse cx="0" cy="-110" rx="1.6" ry="0.85" fill="#fff8e8"/>
    <circle cx="1" cy="-110" r="0.6" fill="#0a0604"/>
    <ellipse cx="6" cy="-110" rx="1.6" ry="0.85" fill="#fff8e8"/>
    <circle cx="6.5" cy="-110" r="0.6" fill="#0a0604"/>
    <path d="M-3,-114 L0,-115" stroke="#3a3028" stroke-width="0.7"/>
    <path d="M3,-115 L9,-114" stroke="#3a3028" stroke-width="0.7"/>
    <path d="M0,-104 L7,-104" stroke="#3a1808" stroke-width="0.7"/>
  </g>

  <!-- JINK (right, defensive stance, weight on one leg, arms slightly out) -->
  <g transform="translate(340 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>

    <!-- Legs - weight on left leg (their right) -->
    <path d="M-7,-44 L-12,-2 L-4,0 L-2,-44 Z" fill="url(#p6p1emerald)"/>
    <path d="M2,-44 L4,0 L10,-2 L7,-44 Z" fill="url(#p6p1emerald)"/>
    <ellipse cx="-8" cy="-1" rx="4" ry="1.4" fill="#1a4830"/>
    <ellipse cx="7" cy="-1" rx="4" ry="1.4" fill="#1a4830"/>
    <line x1="-9" y1="-42" x2="-11" y2="-2" stroke="#9aff9a" stroke-width="0.55" opacity="0.7"/>
    <line x1="9" y1="-42" x2="11" y2="-2" stroke="#9aff9a" stroke-width="0.55" opacity="0.7"/>
    <!-- Torso (slightly turned, defensive) -->
    <path d="M-14,-78 L-16,-44 L16,-44 L14,-78 Z" fill="url(#p6p1emerald)"/>
    <path d="M-10,-72 Q-2,-66 6,-72 Q-2,-58 -8,-54 Z" fill="#3a2818" opacity="0.7"/>
    <path d="M-16,-78 Q-22,-86 -16,-92 L-9,-92 Z" fill="url(#p6p1emerald)"/>
    <path d="M16,-78 Q22,-86 16,-92 L9,-92 Z" fill="url(#p6p1emerald)"/>
    <circle cx="-10" cy="-86" r="1" fill="#9aff9a" filter="url(#p6p1bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#9aff9a" filter="url(#p6p1bloom)"/>

    <!-- ARMS slightly out, defensive -->
    <path d="M-16,-78 Q-26,-62 -28,-44 L-22,-44 Q-22,-62 -12,-76 Z" fill="url(#p6p1emerald)"/>
    <path d="M16,-78 Q26,-62 28,-44 L22,-44 Q22,-62 12,-76 Z" fill="url(#p6p1emerald)"/>
    <ellipse cx="-26" cy="-44" rx="3" ry="2" fill="url(#p6p1jinkSkin)"/>
    <ellipse cx="26" cy="-44" rx="3" ry="2" fill="url(#p6p1jinkSkin)"/>

    <!-- Head — turned toward Sable (left) -->
    <ellipse cx="-2" cy="-104" rx="9" ry="11" fill="url(#p6p1jinkSkin)"/>
    <g fill="#d8a838">
      <circle cx="-9" cy="-112" r="3"/>
      <circle cx="-2" cy="-116" r="3.4"/>
      <circle cx="5" cy="-112" r="3"/>
      <circle cx="-11" cy="-108" r="2.2"/>
      <circle cx="9" cy="-108" r="2.2"/>
    </g>
    <ellipse cx="-5" cy="-104" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="-5.5" cy="-104" r="0.6" fill="#1a4830"/>
    <ellipse cx="1" cy="-104" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="0.5" cy="-104" r="0.6" fill="#1a4830"/>
    <path d="M-9,-108 L-3,-109" stroke="#88603a" stroke-width="0.6"/>
    <path d="M-1,-109 L5,-108" stroke="#88603a" stroke-width="0.6"/>
    <!-- Mouth - slight defensive set, no grin -->
    <path d="M-5,-98 L3,-98" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- DIALOGUE — Sable: You had contact. Unsanctioned. Unreported. And you said NOTHING. -->
  <g>
    <rect x="14" y="14" width="402" height="58" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,72 L190,72 L182,84 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M182,72 L188,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">You had contact. Unsanctioned. Unreported.</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">And you said <tspan font-weight="700">NOTHING.</tspan></text>

  <!-- DIALOGUE — Jink: I was going to— -->
  <g>
    <rect x="280" y="86" width="160" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M380,130 L390,130 L382,142 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M382,130 L388,130" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="288" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="288" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I was going to—</text>

  <!-- DIALOGUE — Sable: When? When were you going to report... -->
  <g>
    <rect x="14" y="148" width="436" height="60" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,208 L190,208 L182,220 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M182,208 L188,208" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">When? When were you going to report</text>
  <text x="22" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">that a human knows where we live?</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,40 Q120,38 240,42 Q380,44 494,40"/>
    <path d="M0,260 Q120,262 240,258 Q380,256 494,260"/>
  </g>
</svg>
