<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 15 — Panel 3: Sable CU defensive — hand drifts to data module</title>
  <desc>CU Sable. Eyes carefully neutral, mouth tight line. Hand at hip — visible faint outline of data module clipped to belt. The PRIOR file is dead but the gesture-tell is the same. Cool blue-white wash. Silent panel.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p15p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p15p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p15p3hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <radialGradient id="p15p3coolWash" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p15p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p15p3bg)"/>
  <rect width="366" height="364" fill="url(#p15p3coolWash)"/>

  <!-- Distant brick -->
  <rect x="0" y="40" width="366" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- SABLE CU -->
  <g transform="translate(180 240)">
    <!-- Body shoulders/torso -->
    <path d="M-100,140 L-100,40 L100,40 L100,140 Z" fill="url(#p15p3suit)"/>
    <path d="M-100,40 Q-70,16 0,8 Q70,16 100,40 L80,52 L-80,52 Z" fill="url(#p15p3suit)"/>
    <ellipse cx="70" cy="20" rx="14" ry="9" fill="#3a3038" opacity="0.75"/>
    <circle cx="-30" cy="20" r="2" fill="#fff8e8" filter="url(#p15p3bloom)"/>
    <circle cx="30" cy="20" r="2" fill="#fff8e8" filter="url(#p15p3bloom)"/>

    <!-- DATA MODULE clipped to belt — fingertip near it (the tell) -->
    <rect x="60" y="80" width="14" height="20" fill="#1a1820"/>
    <rect x="62" y="82" width="10" height="3" fill="#3a3038"/>
    <circle cx="67" cy="92" r="1.4" fill="#5a606a"/>
    <!-- Hand fingertip just above (drifting toward) -->
    <ellipse cx="68" cy="76" rx="6" ry="4" fill="url(#p15p3skin)"/>
    <g fill="url(#p15p3skin)">
      <ellipse cx="74" cy="80" rx="3" ry="1.4" transform="rotate(40 74 80)"/>
    </g>

    <!-- HEAD -->
    <g transform="translate(0 -50)">
      <ellipse cx="0" cy="0" rx="36" ry="44" fill="url(#p15p3skin)"/>
      <path d="M-30,-4 Q-26,18 -10,32 L4,34 Q22,30 30,12 L26,-4 Z" fill="url(#p15p3skin)"/>
      <ellipse cx="22" cy="0" rx="4" ry="7" fill="url(#p15p3skin)"/>
      <ellipse cx="22" cy="0" rx="2" ry="4" fill="#3a2010" opacity="0.5"/>
      <g fill="url(#p15p3hair)">
        <path d="M-30,-44 Q-30,-58 -2,-62 Q24,-58 24,-44 L22,-32 Q12,-46 -2,-46 Q-22,-46 -28,-32 Z"/>
        <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
          <line x1="-22" y1="-50" x2="-22" y2="-46"/>
          <line x1="-12" y1="-54" x2="-12" y2="-50"/>
          <line x1="-2" y1="-56" x2="-2" y2="-52"/>
          <line x1="10" y1="-54" x2="10" y2="-50"/>
          <line x1="22" y1="-50" x2="22" y2="-46"/>
        </g>
      </g>
      <!-- Brow CAREFULLY NEUTRAL but slightly drawn down -->
      <path d="M-22,-12 L-8,-16" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,-16 L18,-12" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <!-- Eyes — looking forward, NOT at Wren -->
      <ellipse cx="-14" cy="-4" rx="4.5" ry="2.4" fill="#fff8e8"/>
      <ellipse cx="-14" cy="-4" rx="2.6" ry="1.6" fill="#3a2010"/>
      <circle cx="-14" cy="-4" r="1.4" fill="#0a0604"/>
      <ellipse cx="-15" cy="-5" rx="0.85" ry="0.55" fill="#fff8e8"/>
      <ellipse cx="6" cy="-4" rx="4" ry="2" fill="#fff8e8"/>
      <ellipse cx="6" cy="-4" rx="2.4" ry="1.4" fill="#3a2010"/>
      <circle cx="6" cy="-4" r="1.2" fill="#0a0604"/>
      <ellipse cx="5" cy="-5" rx="0.7" ry="0.45" fill="#fff8e8"/>
      <!-- Lower-lid (subtle tension) -->
      <path d="M-18,-1 Q-14,1 -10,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M2,-1 Q6,1 10,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <!-- Nose -->
      <path d="M-6,0 L-4,18 Q-2,22 0,22 L4,20 L0,2 Z" fill="url(#p15p3skin)"/>
      <!-- Mouth — TIGHT LINE -->
      <path d="M-14,32 L8,30" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Cool light pattern on left -->
      <g opacity="0.45">
        <path d="M-30,-4 L-18,-6 L-16,-2 L-30,2 Z" fill="#a8c0e0"/>
        <path d="M-30,12 L-18,10 L-16,14 L-30,18 Z" fill="#a8c0e0"/>
      </g>
    </g>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q300,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q300,296 366,300"/>
  </g>
</svg>
