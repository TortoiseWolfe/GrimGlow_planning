<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 16 — Panel 1: Wren lists components, Theodore commits</title>
  <desc>Wide. Wren projecting copper-gold component list, Theodore through gap above. Wren: precision gears, copper induction coils, optical lens, conductor wire — sourced across the city. Theodore: I know every clockmaker and tinker in Clerkenwell. Holborn. Hatton Garden. Wren: You're serious. Theodore: Ma'am, I've been fixing clocks since I was nine.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p16p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p16p1floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p16p1theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p16p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p16p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <radialGradient id="p16p1gapDay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <radialGradient id="p16p1listGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p16p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p16p1bg)"/>

  <!-- Top: floorboard with Theodore -->
  <rect x="0" y="0" width="742" height="60" fill="url(#p16p1floorboard)"/>
  <g>
    <rect x="240" y="20" width="262" height="22" fill="url(#p16p1gapDay)"/>
    <rect x="240" y="20" width="262" height="2" fill="#1a0c04"/>
    <rect x="240" y="40" width="262" height="2" fill="#1a0c04"/>
    <ellipse cx="372" cy="32" rx="80" ry="10" fill="url(#p16p1theoSkin)"/>
    <ellipse cx="356" cy="32" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="358" cy="32" r="2.4" fill="#7a5028"/>
    <circle cx="358" cy="32" r="1.2" fill="#0a0604"/>
    <ellipse cx="388" cy="32" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="390" cy="32" r="2.4" fill="#7a5028"/>
    <circle cx="390" cy="32" r="1.2" fill="#0a0604"/>
    <ellipse cx="372" cy="38" rx="6" ry="2" fill="#a85838"/>
  </g>

  <!-- Brick BG -->
  <rect x="0" y="80" width="60" height="200" fill="#2a1810" opacity="0.7"/>
  <rect x="682" y="80" width="60" height="200" fill="#2a1810" opacity="0.7"/>

  <!-- HOLOGRAPHIC COMPONENT LIST projecting from Wren -->
  <g transform="translate(420 130)">
    <ellipse cx="0" cy="0" rx="100" ry="60" fill="url(#p16p1listGlow)" filter="url(#p16p1glow)" opacity="0.55"/>
    <!-- Header -->
    <rect x="-72" y="-46" width="144" height="12" fill="none" stroke="#ffd888" stroke-width="0.55" opacity="0.85"/>
    <text x="-66" y="-38" font-family="Helvetica Neue" font-size="6" fill="#ffd888" font-weight="700">SHOPPING LIST</text>
    <!-- Items -->
    <g font-family="Helvetica Neue" fill="#ffd888" font-weight="500" opacity="0.85">
      <text x="-66" y="-22" font-size="6">▸ PRECISION GEARS</text>
      <text x="-66" y="-12" font-size="6">▸ COPPER INDUCTION COILS</text>
      <text x="-66" y="-2" font-size="6">▸ OPTICAL LENS</text>
      <text x="-66" y="8" font-size="6">▸ CONDUCTOR WIRE</text>
    </g>
    <!-- Tiny coil/lens icons next to items -->
    <g stroke="#ffd888" stroke-width="0.45" fill="none" opacity="0.7">
      <circle cx="40" cy="-22" r="3"/>
      <circle cx="40" cy="-22" r="1.6"/>
      <circle cx="50" cy="-12" r="3"/>
      <circle cx="50" cy="-12" r="1.6"/>
      <ellipse cx="40" cy="-2" rx="3.5" ry="2"/>
      <line x1="36" y1="-2" x2="44" y2="-2"/>
      <path d="M40,8 L44,4 L48,8 L52,4 L56,8 L60,4"/>
    </g>
    <!-- Tiny location annotations -->
    <text x="-66" y="22" font-family="Helvetica Neue" font-size="5" fill="#fff8e8" opacity="0.75">SOURCED ACROSS LONDON</text>
  </g>

  <!-- Beam projecting from Wren -->
  <g opacity="0.55">
    <path d="M180,260 L300,180 L420,180 Z" fill="#ffd888" filter="url(#p16p1bloom)" opacity="0.4"/>
  </g>

  <!-- Beam (foot level) -->
  <rect x="40" y="280" width="662" height="40" fill="url(#p16p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="40" y1="282" x2="702" y2="282"/>
    <line x1="40" y1="316" x2="702" y2="316"/>
  </g>

  <!-- WREN — projecting list -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p16p1suit)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p16p1suit)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p16p1suit)"/>
    <ellipse cx="-13" cy="-76" rx="4" ry="3" fill="#1a0c04" opacity="0.75"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p16p1suit)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p16p1suit)"/>
    <circle cx="-10" cy="-86" r="1" fill="#ffd888" filter="url(#p16p1bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#ffd888" filter="url(#p16p1bloom)"/>
    <!-- Right arm projecting -->
    <path d="M15,-78 Q34,-66 50,-50 L46,-44 Q30,-58 12,-72 Z" fill="url(#p16p1suit)"/>
    <ellipse cx="50" cy="-48" rx="4.5" ry="3" fill="url(#p16p1skin)"/>
    <circle cx="52" cy="-50" r="2.4" fill="#ffd888" filter="url(#p16p1bloom)"/>
    <ellipse cx="50" cy="-48" rx="2.4" ry="1.4" fill="#1a0c04" opacity="0.55"/>
    <!-- Left arm at side -->
    <path d="M-15,-76 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p16p1suit)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p16p1skin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="9" ry="11" fill="url(#p16p1skin)"/>
    <g fill="#1a0c04">
      <path d="M-7,-111 Q-8,-118 0,-119 Q8,-118 7,-111 L5,-106 Q2,-112 -2,-112 Q-5,-112 -7,-106 Z"/>
      <ellipse cx="0" cy="-122" rx="5" ry="4"/>
    </g>
    <ellipse cx="-3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.55" fill="#1a0c04"/>
    <ellipse cx="3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-104" r="0.55" fill="#1a0c04"/>
    <ellipse cx="0" cy="-98" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- DIALOGUE — Wren: drive components list -->
  <g>
    <rect x="14" y="80" width="558" height="58" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,80 L186,70 L190,80 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M184,80 L188,80" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">The drive needs precision gears, copper induction coils, an optical lens,</text>
  <text x="22" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">conductor wire. Sourced from workshops and factories across the city.</text>

  <!-- DIALOGUE — Theodore: I know every clockmaker... -->
  <g>
    <rect x="14" y="150" width="586" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M380,150 L386,140 L390,150 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M384,150 L388,150" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I know every clockmaker and tinker in Clerkenwell. And Holborn, and Hatton Garden.</text>

  <!-- DIALOGUE — Wren: You're serious. -->
  <g>
    <rect x="540" y="206" width="186" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M580,250 L590,250 L582,262 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M582,250 L588,250" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="548" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="548" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#1a1a1a">You're serious.</text>

  <!-- DIALOGUE — Theodore: Ma'am, I've been fixing clocks since I was nine. -->
  <g>
    <rect x="14" y="270" width="380" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M180,270 L186,260 L190,270 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M184,270 L188,270" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Ma'am, I've been fixing clocks since I was nine.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
