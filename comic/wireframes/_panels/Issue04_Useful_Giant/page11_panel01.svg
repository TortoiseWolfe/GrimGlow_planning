<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 11 — Panel 1: Wren projects drive schematic, Theodore commits</title>
  <desc>35mm medium wide. Wren standing at left projecting full copper-gold holographic drive assembly schematic into the air at fairy scale. Theodore visible through gap above watching solemnly. Sable + others in BG. Wren: The temporal drive requires six components we can't manufacture at our scale. Each one exists in this city, in human workshops and institutions. / You're going to help us get them. / Theodore: Tell me what you need.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p11p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p11p1floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p11p1theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p11p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p11p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <linearGradient id="p11p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p11p1emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <linearGradient id="p11p1sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p11p1crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d83040"/>
      <stop offset="100%" stop-color="#7a1018"/>
    </linearGradient>
    <radialGradient id="p11p1schematicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p1gapLight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <filter id="p11p1bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="p11p1glow"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p11p1bg)"/>

  <!-- Top: floorboard ceiling with GAP showing Theodore -->
  <rect x="0" y="0" width="742" height="60" fill="url(#p11p1floorboard)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="20" x2="742" y2="20"/>
    <line x1="0" y1="44" x2="742" y2="44"/>
  </g>
  <g>
    <rect x="280" y="20" width="184" height="22" fill="url(#p11p1gapLight)"/>
    <rect x="280" y="20" width="184" height="2" fill="#1a0c04"/>
    <rect x="280" y="40" width="184" height="2" fill="#1a0c04"/>
    <!-- Theodore face strip — solemn, listening -->
    <ellipse cx="372" cy="30" rx="60" ry="10" fill="url(#p11p1theoSkin)"/>
    <ellipse cx="356" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="358" cy="30" r="2" fill="#7a5028"/>
    <circle cx="358" cy="30" r="1" fill="#0a0604"/>
    <ellipse cx="388" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="390" cy="30" r="2" fill="#7a5028"/>
    <circle cx="390" cy="30" r="1" fill="#0a0604"/>
  </g>

  <!-- Brick walls -->
  <rect x="0" y="60" width="60" height="220" fill="#2a1810" opacity="0.7"/>
  <rect x="682" y="60" width="60" height="220" fill="#2a1810" opacity="0.7"/>

  <!-- Beam -->
  <rect x="40" y="280" width="662" height="40" fill="url(#p11p1timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="40" y1="282" x2="702" y2="282"/>
    <line x1="40" y1="316" x2="702" y2="316"/>
  </g>

  <!-- ===== HOLOGRAPHIC DRIVE SCHEMATIC — large copper-gold display center frame ===== -->
  <g transform="translate(420 160)">
    <ellipse cx="0" cy="0" rx="180" ry="100" fill="url(#p11p1schematicGlow)" filter="url(#p11p1glow)" opacity="0.6"/>
    <!-- Drive assembly schematic -->
    <g stroke="#ffd888" stroke-width="0.85" fill="none" opacity="0.85">
      <!-- Central drive ring -->
      <circle cx="0" cy="0" r="36"/>
      <circle cx="0" cy="0" r="24"/>
      <!-- Outer drive housing -->
      <path d="M-60,-40 L-44,-40 L-44,-30 L-60,-30 Z"/>
      <path d="M44,-40 L60,-40 L60,-30 L44,-30 Z"/>
      <path d="M-60,30 L-44,30 L-44,40 L-60,40 Z"/>
      <path d="M44,30 L60,30 L60,40 L44,40 Z"/>
      <!-- Connecting struts -->
      <path d="M-44,-30 L-24,-12"/>
      <path d="M44,-30 L24,-12"/>
      <path d="M-44,30 L-24,12"/>
      <path d="M44,30 L24,12"/>
      <!-- Power flow indicators -->
      <path d="M-26,0 L-14,0"/>
      <path d="M14,0 L26,0"/>
      <!-- Six component callouts (the 6 things needed) -->
      <line x1="-44" y1="-40" x2="-90" y2="-58"/>
      <line x1="44" y1="-40" x2="90" y2="-58"/>
      <line x1="-60" y1="-30" x2="-104" y2="-32"/>
      <line x1="60" y1="-30" x2="104" y2="-32"/>
      <line x1="-44" y1="40" x2="-90" y2="58"/>
      <line x1="44" y1="40" x2="90" y2="58"/>
    </g>
    <!-- Component labels -->
    <g font-family="Helvetica Neue" fill="#ffd888" font-weight="700" opacity="0.9">
      <text x="-145" y="-54" font-size="6">INDUCTION</text>
      <text x="-145" y="-46" font-size="6">COILS</text>
      <text x="98" y="-54" font-size="6">PRECISION</text>
      <text x="98" y="-46" font-size="6">LENS</text>
      <text x="-156" y="-28" font-size="6">CONDUCTOR</text>
      <text x="-156" y="-20" font-size="6">WIRE</text>
      <text x="110" y="-28" font-size="6">QUARTZ</text>
      <text x="110" y="-20" font-size="6">CRYSTAL</text>
      <text x="-145" y="60" font-size="6">MERCURY</text>
      <text x="98" y="60" font-size="6">PLATINUM</text>
    </g>
    <!-- "TEMPORAL DRIVE" header -->
    <text x="-30" y="-72" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" font-weight="700">TEMPORAL DRIVE</text>
    <line x1="-32" y1="-68" x2="32" y2="-68" stroke="#fff8e8" stroke-width="0.4" opacity="0.85"/>
  </g>

  <!-- Beam from Wren wrist to schematic -->
  <g opacity="0.55">
    <path d="M180,260 L300,180 L420,180 Z" fill="#ffd888" filter="url(#p11p1bloom)" opacity="0.4"/>
  </g>

  <!-- WREN — left, projecting schematic -->
  <g transform="translate(180 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p11p1suit)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p11p1suit)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p11p1suit)"/>
    <ellipse cx="-13" cy="-76" rx="4" ry="3" fill="#1a0c04" opacity="0.75"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p11p1suit)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p11p1suit)"/>
    <circle cx="-10" cy="-86" r="1" fill="#ffd888" filter="url(#p11p1bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#ffd888" filter="url(#p11p1bloom)"/>
    <!-- Right arm raised projecting -->
    <path d="M15,-78 Q34,-66 50,-50 L46,-44 Q30,-58 12,-72 Z" fill="url(#p11p1suit)"/>
    <ellipse cx="50" cy="-48" rx="4.5" ry="3" fill="url(#p11p1skin)"/>
    <circle cx="52" cy="-50" r="2.4" fill="#ffd888" filter="url(#p11p1bloom)"/>
    <ellipse cx="50" cy="-48" rx="2.4" ry="1.4" fill="#1a0c04" opacity="0.55"/>
    <!-- Left arm at side -->
    <path d="M-15,-78 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-76 Z" fill="url(#p11p1suit)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p11p1skin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="9" ry="11" fill="url(#p11p1skin)"/>
    <g fill="#1a0c04">
      <path d="M-7,-111 Q-8,-118 0,-119 Q8,-118 7,-111 L5,-106 Q2,-112 -2,-112 Q-5,-112 -7,-106 Z"/>
      <ellipse cx="0" cy="-122" rx="5" ry="4"/>
    </g>
    <ellipse cx="-3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.55" fill="#1a0c04"/>
    <ellipse cx="3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-104" r="0.55" fill="#1a0c04"/>
    <ellipse cx="0" cy="-98" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- BG squad — Sable, Jink, Luma, Thresh visible deeper in soft focus -->
  <g opacity="0.7">
    <g transform="translate(620 282)">
      <ellipse cx="0" cy="0" rx="11" ry="2.2" fill="#0a0604" opacity="0.5"/>
      <path d="M-6,-34 L-9,-2 L-3,0 L-1,-34 Z" fill="url(#p11p1silver)"/>
      <path d="M1,-34 L3,0 L9,-2 L6,-34 Z" fill="url(#p11p1silver)"/>
      <path d="M-11,-60 L-13,-34 L13,-34 L11,-60 Z" fill="url(#p11p1silver)"/>
      <ellipse cx="0" cy="-72" rx="7" ry="9" fill="#5a3828"/>
      <path d="M-7,-79 Q-7,-83 0,-84 Q7,-83 7,-79" fill="#dad5d0"/>
    </g>
    <g transform="translate(550 282)">
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#0a0604" opacity="0.5"/>
      <path d="M-5,-30 L-8,-2 L-2,0 L0,-30 Z" fill="url(#p11p1emerald)"/>
      <path d="M0,-30 L2,0 L8,-2 L5,-30 Z" fill="url(#p11p1emerald)"/>
      <path d="M-9,-54 L-11,-30 L11,-30 L9,-54 Z" fill="url(#p11p1emerald)"/>
      <ellipse cx="0" cy="-66" rx="6" ry="8" fill="url(#p11p1skin)"/>
      <g fill="#d8a838">
        <circle cx="-5" cy="-72" r="2"/>
        <circle cx="0" cy="-74" r="2.4"/>
        <circle cx="5" cy="-72" r="2"/>
      </g>
    </g>
    <g transform="translate(486 282)">
      <ellipse cx="0" cy="0" rx="9" ry="2" fill="#0a0604" opacity="0.5"/>
      <path d="M-5,-30 L-8,-2 L-2,0 L0,-30 Z" fill="url(#p11p1sapphire)"/>
      <path d="M0,-30 L2,0 L8,-2 L5,-30 Z" fill="url(#p11p1sapphire)"/>
      <path d="M-9,-54 L-11,-30 L11,-30 L9,-54 Z" fill="url(#p11p1sapphire)"/>
      <ellipse cx="0" cy="-66" rx="6" ry="8" fill="url(#p11p1skin)"/>
      <ellipse cx="-2" cy="-66" rx="1.4" ry="1" fill="#a888ff" filter="url(#p11p1bloom)"/>
      <ellipse cx="2" cy="-66" rx="1.4" ry="1" fill="#a888ff" filter="url(#p11p1bloom)"/>
    </g>
    <g transform="translate(264 282)">
      <ellipse cx="0" cy="0" rx="11" ry="2.2" fill="#0a0604" opacity="0.5"/>
      <path d="M-6,-32 L-9,-2 L-3,0 L-1,-32 Z" fill="url(#p11p1crimson)"/>
      <path d="M1,-32 L3,0 L9,-2 L6,-32 Z" fill="url(#p11p1crimson)"/>
      <path d="M-11,-58 L-13,-32 L13,-32 L11,-58 Z" fill="url(#p11p1crimson)"/>
      <ellipse cx="0" cy="-70" rx="7" ry="9" fill="url(#p11p1skin)"/>
      <path d="M-6,-77 Q-6,-81 0,-82 Q6,-81 6,-77" fill="#a83018"/>
    </g>
  </g>

  <!-- DIALOGUE — Wren: The temporal drive requires six components we can't manufacture at our scale. Each one exists in this city, in human workshops and institutions. -->
  <g>
    <rect x="14" y="14" width="556" height="58" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,72 L190,72 L182,84 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M182,72 L188,72" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">The temporal drive requires six components we can't manufacture at our scale.</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Each one exists in this city, in human workshops and institutions.</text>

  <!-- DIALOGUE — Wren: You're going to help us get them. -->
  <g>
    <rect x="14" y="86" width="294" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M120,130 L130,130 L122,142 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M122,130 L128,130" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">You're going to help us get them.</text>

  <!-- DIALOGUE — Theodore: Tell me what you need. -->
  <g>
    <rect x="14" y="144" width="194" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M120,144 L126,134 L132,144 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M124,144 L128,144" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Tell me what you need.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
