<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 4 — Page 3 — Panel 4: Sable points at Jink, controlled fury, command identifies the breach</title>
  <desc>65mm MCU. Sable's HOLD fist has opened to a steady pointed finger aimed off-frame at Jink. Dark brown skin, military-cropped silver-white hair. Controlled incandescent rage — quiet fury, eyes narrow, mouth a line, finger absolutely steady. Silver suit with soot bloom right shoulder. Cool blue-white camp light + warm rim light from gap. BG: Jink shrinks. Sable: Jink. You did this.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p3p4cavityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p3p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p3p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="50%" stop-color="#a8a0a0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p3p4hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="p3p4skinJ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p3p4emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <radialGradient id="p3p4coolWash" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3p4warmRim" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <filter id="p3p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p3p4softBg"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <!-- BG cavity -->
  <rect width="241" height="364" fill="url(#p3p4cavityBg)"/>
  <rect width="241" height="364" fill="url(#p3p4coolWash)"/>
  <rect width="241" height="364" fill="url(#p3p4warmRim)"/>

  <!-- Distant rough brick wall -->
  <rect x="0" y="40" width="241" height="220" fill="#2a1810" opacity="0.65"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="80" x2="241" y2="80"/>
    <line x1="0" y1="140" x2="241" y2="140"/>
    <line x1="0" y1="200" x2="241" y2="200"/>
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="60" y1="140" x2="60" y2="200"/>
  </g>
  <!-- Geometric ward pattern -->
  <g stroke="#a8c0e0" stroke-width="0.4" opacity="0.4" fill="none">
    <path d="M0,160 L40,158 L42,162 L80,160"/>
  </g>

  <!-- BACKGROUND — JINK shrinking, soft focus -->
  <g transform="translate(180 240)" filter="url(#p3p4softBg)" opacity="0.85">
    <!-- Body slumped, head down -->
    <ellipse cx="0" cy="14" rx="14" ry="3" fill="#0a0604" opacity="0.55"/>
    <path d="M-10,-30 L-12,14 L12,14 L10,-30 Z" fill="url(#p3p4emerald)"/>
    <!-- Soot streak -->
    <path d="M-6,-22 Q0,-18 4,-24 Q-2,-12 -4,-10 Z" fill="#3a2818" opacity="0.6"/>
    <!-- Shoulders dropped -->
    <path d="M-12,-30 Q-14,-24 -10,-22 Z" fill="url(#p3p4emerald)"/>
    <path d="M12,-30 Q14,-24 10,-22 Z" fill="url(#p3p4emerald)"/>
    <!-- Arms hanging -->
    <path d="M-12,-28 Q-16,-12 -14,4 L-8,4 Q-10,-12 -8,-26 Z" fill="url(#p3p4emerald)"/>
    <path d="M12,-28 Q16,-12 14,4 L8,4 Q10,-12 8,-26 Z" fill="url(#p3p4emerald)"/>
    <!-- Head LOWERED -->
    <ellipse cx="0" cy="-40" rx="7" ry="8" fill="url(#p3p4skinJ)"/>
    <!-- Curls -->
    <g fill="#d8a838">
      <circle cx="-6" cy="-46" r="2.4"/>
      <circle cx="0" cy="-50" r="2.6"/>
      <circle cx="6" cy="-46" r="2.4"/>
      <circle cx="-7" cy="-42" r="1.8"/>
      <circle cx="7" cy="-42" r="1.8"/>
    </g>
    <!-- Face DOWN — only top of head visible -->
    <!-- Hint of jaw line -->
    <path d="M-5,-36 Q0,-34 5,-36" stroke="#5a2818" stroke-width="0.4" fill="none" opacity="0.6"/>
  </g>

  <!-- SABLE — main subject MCU, three-quarter facing right (toward Jink) -->
  <g transform="translate(110 240)">
    <!-- Torso (chest + shoulders) -->
    <path d="M-46,40 L-50,124 L50,124 L46,40 Q22,30 0,28 Q-22,30 -46,40 Z" fill="url(#p3p4suit)"/>
    <!-- Chest seam -->
    <line x1="0" y1="28" x2="0" y2="124" stroke="#5a5860" stroke-width="0.85"/>
    <!-- Shoulder plates -->
    <path d="M-46,40 Q-56,16 -36,8 L-26,32 Q-44,32 -54,42 Z" fill="url(#p3p4suit)"/>
    <path d="M46,40 Q56,16 36,8 L26,32 Q44,32 54,42 Z" fill="url(#p3p4suit)"/>
    <!-- Hologram seams -->
    <line x1="-46" y1="40" x2="-36" y2="8" stroke="#7a7080" stroke-width="0.7"/>
    <line x1="46" y1="40" x2="36" y2="8" stroke="#7a7080" stroke-width="0.7"/>
    <!-- Hologram nodes glowing -->
    <circle cx="-22" cy="20" r="1.6" fill="#fff8e8" filter="url(#p3p4bloom)"/>
    <circle cx="22" cy="20" r="1.6" fill="#fff8e8" filter="url(#p3p4bloom)"/>
    <line x1="-36" y1="8" x2="-22" y2="20" stroke="#e8f0ff" stroke-width="0.55" opacity="0.7"/>

    <!-- SOOT BLOOM on right shoulder (her right = our right in three-quarter facing right) -->
    <ellipse cx="40" cy="20" rx="14" ry="8" fill="#3a3038" opacity="0.75"/>
    <ellipse cx="36" cy="22" rx="9" ry="4" fill="#1a1820" opacity="0.55"/>

    <!-- DUST on forearm hint -->
    <ellipse cx="-46" cy="92" rx="9" ry="2.5" fill="#7a7080" opacity="0.4"/>

    <!-- POINTING ARM — extending toward viewer's right (toward Jink) -->
    <g transform="translate(46 22)">
      <!-- Shoulder to elbow -->
      <path d="M0,8 Q20,-2 40,4 L46,12 Q26,8 4,16 Z" fill="url(#p3p4suit)"/>
      <!-- Elbow to wrist -->
      <path d="M40,4 Q60,-2 78,2 L80,12 Q60,12 46,12 Z" fill="url(#p3p4suit)"/>
      <!-- Hand wrist -->
      <ellipse cx="80" cy="6" rx="6" ry="4" fill="url(#p3p4skin)"/>
      <!-- INDEX FINGER POINTING — long, steady -->
      <path d="M84,4 L116,-4 Q120,-2 120,2 L116,6 L86,10 Z" fill="url(#p3p4skin)"/>
      <!-- Other fingers curled -->
      <ellipse cx="84" cy="14" rx="4" ry="2.5" fill="url(#p3p4skin)"/>
      <ellipse cx="82" cy="20" rx="3.5" ry="2" fill="url(#p3p4skin)"/>
      <!-- Thumb -->
      <ellipse cx="76" cy="-2" rx="3" ry="2" fill="url(#p3p4skin)"/>
      <!-- Knuckle creases -->
      <path d="M84,4 Q86,2 90,3" fill="none" stroke="#3a2010" stroke-width="0.45"/>
      <path d="M86,10 Q88,8 92,9" fill="none" stroke="#3a2010" stroke-width="0.45"/>
      <!-- Cool light on finger -->
      <path d="M86,2 L116,-4 Q118,-1 116,2 L88,8 Z" fill="#a8c0e0" opacity="0.25"/>
    </g>

    <!-- LEFT ARM at side -->
    <path d="M-46,40 Q-56,60 -50,90 L-42,90 Q-46,60 -42,38 Z" fill="url(#p3p4suit)"/>
    <ellipse cx="-46" cy="92" rx="3.5" ry="2.4" fill="url(#p3p4skin)"/>
    <!-- Sidearm holstered (visible at hip) -->
    <rect x="-44" y="64" width="8" height="12" fill="#1a1820"/>
    <rect x="-43" y="66" width="6" height="10" fill="#3a3038"/>

    <!-- HEAD — three-quarter facing right, cropped silver-white -->
    <g transform="translate(0 -10)">
      <ellipse cx="0" cy="0" rx="32" ry="38" fill="url(#p3p4skin)"/>
      <!-- Sharp angular jaw -->
      <path d="M-30,-4 Q-26,18 -10,32 L4,34 Q22,30 30,12 L26,-4 Z" fill="url(#p3p4skin)"/>
      <!-- Ear (right partial) -->
      <ellipse cx="22" cy="0" rx="4" ry="7" fill="url(#p3p4skin)"/>
      <ellipse cx="22" cy="0" rx="2" ry="4" fill="#3a2010" opacity="0.5"/>

      <!-- HAIR — silver-white very short military buzz -->
      <g fill="url(#p3p4hair)">
        <path d="M-30,-30 Q-30,-42 -2,-46 Q24,-42 24,-30 L22,-22 Q12,-32 -2,-32 Q-22,-32 -28,-22 Z"/>
        <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
          <line x1="-26" y1="-36" x2="-26" y2="-32"/>
          <line x1="-20" y1="-40" x2="-20" y2="-36"/>
          <line x1="-14" y1="-42" x2="-14" y2="-38"/>
          <line x1="-8" y1="-42" x2="-8" y2="-38"/>
          <line x1="-2" y1="-44" x2="-2" y2="-40"/>
          <line x1="4" y1="-42" x2="4" y2="-38"/>
          <line x1="10" y1="-40" x2="10" y2="-36"/>
          <line x1="16" y1="-38" x2="16" y2="-34"/>
          <line x1="22" y1="-34" x2="22" y2="-30"/>
        </g>
      </g>
      <!-- Warm rim light on hair -->
      <path d="M-30,-30 Q-30,-42 -2,-46 Q24,-42 24,-30" fill="none" stroke="#e8d8b8" stroke-width="0.6" opacity="0.55"/>

      <!-- BROW — drawn down hard -->
      <path d="M-22,-12 L-8,-16" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,-16 L18,-12" stroke="#3a3028" stroke-width="2" stroke-linecap="round"/>

      <!-- EYES — narrow, locked -->
      <ellipse cx="-14" cy="-4" rx="4" ry="2" fill="#fff8e8"/>
      <ellipse cx="-14" cy="-4" rx="2.4" ry="1.6" fill="#3a2010"/>
      <circle cx="-14" cy="-4" r="1.2" fill="#0a0604"/>
      <ellipse cx="6" cy="-4" rx="3.5" ry="2" fill="#fff8e8"/>
      <ellipse cx="6" cy="-4" rx="2" ry="1.4" fill="#3a2010"/>
      <circle cx="6" cy="-4" r="1.1" fill="#0a0604"/>
      <!-- Catchlight -->
      <ellipse cx="-15" cy="-5" rx="0.7" ry="0.4" fill="#fff8e8"/>
      <ellipse cx="5" cy="-5" rx="0.7" ry="0.4" fill="#fff8e8"/>

      <!-- Lower lid lines -->
      <path d="M-18,-1 Q-14,1 -10,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>
      <path d="M2,-1 Q6,1 10,-1" fill="none" stroke="#3a2010" stroke-width="0.55"/>

      <!-- NOSE — sharp, angular -->
      <path d="M-6,0 L-4,18 Q-2,22 0,22 L4,20 L0,2 Z" fill="url(#p3p4skin)"/>
      <path d="M-2,22 Q0,24 4,20" stroke="#3a2010" stroke-width="0.5" fill="none"/>

      <!-- MOUTH — A LINE -->
      <path d="M-14,32 L8,30" stroke="#3a1808" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Jaw muscle tension marks -->
      <path d="M-26,18 Q-22,26 -14,30" fill="none" stroke="#3a2010" stroke-width="0.5" opacity="0.6"/>

      <!-- Cool light pattern on left -->
      <g opacity="0.4">
        <path d="M-30,-4 L-18,-6 L-16,-2 L-30,2 Z" fill="#a8c0e0"/>
        <path d="M-30,12 L-18,10 L-16,14 L-30,18 Z" fill="#a8c0e0"/>
      </g>
    </g>
  </g>

  <!-- DIALOGUE — Sable: Jink. / You did this. -->
  <g>
    <rect x="14" y="14" width="100" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M50,58 L60,58 L52,70 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M52,58 L58,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1a1a1a">Jink.</text>

  <g>
    <rect x="100" y="74" width="130" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M156,118 L166,118 L158,130 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M158,118 L164,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="108" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="108" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a1a1a">You did this.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,140 Q60,138 120,142 Q180,144 241,140"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 241,300"/>
  </g>
</svg>
