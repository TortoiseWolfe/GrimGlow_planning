<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 422" width="494" height="422">
  <title>Issue 4 — Page 9 — Panel 5: Sable directly under gap, dictates conditions to giant Theodore</title>
  <desc>50mm medium wide. Sable steps to center of camp directly under floorboard gap. Looks STRAIGHT UP at Theodore's face above. Tiny commanding upward at giant — absolute authority undiminished by scale. Cradle's blue-white glow bathes her. Sable: Conditions. Non-negotiable. / One. You tell no one. Not a friend. Not family. Not a prayer whispered in church. NO ONE. / Two. You follow instructions. Mine. Not Jink's. MINE.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p9p5timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p9p5floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p9p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p9p5suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p9p5hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#a8a098"/>
    </linearGradient>
    <linearGradient id="p9p5theoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p9p5gapDay" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <radialGradient id="p9p5cradleGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#a8c0e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p5bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <rect width="494" height="422" fill="url(#p9p5bg)"/>
  <rect width="494" height="422" fill="url(#p9p5cradleGlow)"/>

  <!-- TOP: floorboard ceiling with gap showing Theodore -->
  <rect x="0" y="0" width="494" height="60" fill="url(#p9p5floorboard)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="20" x2="494" y2="20"/>
    <line x1="0" y1="44" x2="494" y2="44"/>
  </g>

  <!-- THE GAP centered above Sable -->
  <g>
    <rect x="160" y="20" width="174" height="22" fill="url(#p9p5gapDay)"/>
    <rect x="160" y="20" width="174" height="2" fill="#1a0c04"/>
    <rect x="160" y="40" width="174" height="2" fill="#1a0c04"/>
    <!-- Theodore's face strip (eye + nose) -->
    <ellipse cx="247" cy="30" rx="60" ry="10" fill="url(#p9p5theoSkin)"/>
    <ellipse cx="230" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="232" cy="30" r="2" fill="#7a5028"/>
    <circle cx="232" cy="30" r="1" fill="#0a0604"/>
    <ellipse cx="264" cy="30" rx="6" ry="4" fill="#fff8e8"/>
    <circle cx="266" cy="30" r="2" fill="#7a5028"/>
    <circle cx="266" cy="30" r="1" fill="#0a0604"/>
    <!-- Cradle visible above gap (faint glow source) -->
    <ellipse cx="247" cy="14" rx="40" ry="10" fill="#fff8e8" opacity="0.85" filter="url(#p9p5bloom)"/>
  </g>

  <!-- COOL DOWNWASH from cradle through gap -->
  <ellipse cx="247" cy="120" rx="160" ry="60" fill="#a8c0e0" opacity="0.35" filter="url(#p9p5bloom)"/>

  <!-- Brick walls -->
  <rect x="0" y="60" width="60" height="280" fill="#2a1810" opacity="0.7"/>
  <rect x="434" y="60" width="60" height="280" fill="#2a1810" opacity="0.7"/>

  <!-- Timber beam (foot level) -->
  <rect x="40" y="320" width="414" height="44" fill="url(#p9p5timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="40" y1="322" x2="454" y2="322"/>
    <line x1="40" y1="358" x2="454" y2="358"/>
  </g>

  <!-- SABLE — center of camp, looking STRAIGHT UP at Theodore -->
  <g transform="translate(247 322)">
    <ellipse cx="0" cy="0" rx="22" ry="3.5" fill="#0a0604" opacity="0.7"/>

    <!-- Legs — feet planted -->
    <path d="M-10,-80 L-14,-2 L-4,2 L-2,-80 Z" fill="url(#p9p5suit)"/>
    <path d="M2,-80 L4,2 L14,-2 L10,-80 Z" fill="url(#p9p5suit)"/>
    <ellipse cx="-10" cy="2" rx="6" ry="2" fill="#3a3838"/>
    <ellipse cx="10" cy="2" rx="6" ry="2" fill="#3a3838"/>
    <ellipse cx="-10" cy="-50" rx="4" ry="1" fill="#7a7080" opacity="0.5"/>
    <ellipse cx="10" cy="-50" rx="4" ry="1" fill="#7a7080" opacity="0.5"/>

    <!-- Torso — RIGID, chin UP -->
    <path d="M-22,-150 L-24,-80 L24,-80 L22,-150 Z" fill="url(#p9p5suit)"/>
    <ellipse cx="22" cy="-148" rx="9" ry="6" fill="#3a3038" opacity="0.75"/>
    <path d="M-22,-150 Q-30,-160 -22,-166 L-13,-166 L-16,-148 Z" fill="url(#p9p5suit)"/>
    <path d="M22,-150 Q30,-160 22,-166 L13,-166 L16,-148 Z" fill="url(#p9p5suit)"/>
    <circle cx="-15" cy="-160" r="1.6" fill="#fff8e8" filter="url(#p9p5bloom)"/>
    <circle cx="15" cy="-160" r="1.6" fill="#fff8e8" filter="url(#p9p5bloom)"/>

    <!-- Arms at sides — rigid -->
    <path d="M-22,-148 Q-30,-110 -28,-78 L-20,-80 Q-22,-110 -18,-146 Z" fill="url(#p9p5suit)"/>
    <path d="M22,-148 Q30,-110 28,-78 L20,-80 Q22,-110 18,-146 Z" fill="url(#p9p5suit)"/>
    <ellipse cx="-22" cy="-78" rx="4" ry="2" fill="url(#p9p5skin)"/>
    <ellipse cx="22" cy="-78" rx="4" ry="2" fill="url(#p9p5skin)"/>

    <!-- HEAD — TILTED UP, looking at Theodore through gap -->
    <ellipse cx="0" cy="-188" rx="14" ry="17" fill="url(#p9p5skin)"/>
    <g fill="url(#p9p5hair)">
      <path d="M-12,-200 Q-12,-210 0,-212 Q12,-210 12,-200 L10,-194 Q4,-200 -4,-200 Q-8,-200 -12,-194 Z"/>
      <g stroke="#dad5d0" stroke-width="0.4" opacity="0.7">
        <line x1="-8" y1="-204" x2="-8" y2="-200"/>
        <line x1="-3" y1="-206" x2="-3" y2="-202"/>
        <line x1="3" y1="-206" x2="3" y2="-202"/>
        <line x1="8" y1="-204" x2="8" y2="-200"/>
      </g>
    </g>
    <!-- Warm rim from gap on top of head -->
    <path d="M-12,-200 Q0,-212 12,-200" fill="none" stroke="#e8d8b8" stroke-width="0.85" opacity="0.7"/>

    <!-- Eyes — looking UP -->
    <ellipse cx="-3" cy="-189" rx="1.6" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-190" r="0.7" fill="#0a0604"/>
    <ellipse cx="3" cy="-189" rx="1.6" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-190" r="0.7" fill="#0a0604"/>
    <!-- Brow set hard -->
    <path d="M-7,-194 L-1,-194" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M1,-194 L7,-194" stroke="#3a3028" stroke-width="0.85"/>
    <!-- Mouth a line -->
    <path d="M-3,-180 L3,-180" stroke="#3a1808" stroke-width="1"/>
    <!-- Cool light bath from above -->
    <path d="M-14,-200 L14,-200 L12,-180 Q0,-176 -12,-180 Z" fill="#a8c0e0" opacity="0.4"/>
  </g>

  <!-- DIALOGUE — Sable: Conditions. Non-negotiable. -->
  <g>
    <rect x="14" y="14" width="260" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <!-- Tail UP toward Theodore in gap -->
    <path d="M180,14 L184,4 L188,14 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M182,14 L186,14" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Conditions. Non-negotiable.</text>

  <!-- DIALOGUE — Sable: One. You tell no one. ... NO ONE. -->
  <g>
    <rect x="14" y="74" width="466" height="74" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,148 L186,138 L190,148 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M184,148 L188,148" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">One. You tell no one. Not a friend. Not family.</text>
  <text x="22" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Not a prayer whispered in church.</text>
  <text x="22" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a1a1a">NO ONE.</text>

  <!-- DIALOGUE — Sable: Two. You follow instructions. Mine. Not Jink's. MINE. -->
  <g>
    <rect x="14" y="166" width="466" height="58" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,224 L186,214 L190,224 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M184,224 L188,224" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Two. You follow instructions. Mine. Not Jink's.</text>
  <text x="22" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a1a1a">MINE.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q120,82 240,78 Q380,76 494,80"/>
    <path d="M0,360 Q120,362 240,358 Q380,356 494,360"/>
  </g>
</svg>
