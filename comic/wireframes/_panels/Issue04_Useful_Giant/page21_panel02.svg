<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 21 — Panel 2: Theodore at side door — profile, key in hand, looking back at street — He stood at his own door and felt the weight of it</title>
  <desc>50mm medium. Theodore in profile at the dark side door, key in hand, looking back over his shoulder at the gaslit Clerkenwell street he has walked through every evening of his apprenticeship. Bravery that does not yet know it is bravery.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p21p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#3a2858"/>
    </linearGradient>
    <linearGradient id="p21p2building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p21p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p21p2theoSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p21p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#6a3828"/>
    </linearGradient>
    <radialGradient id="p21p2lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p2backlight" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p21p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p21p2glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- SKY — small strip top (he is in shadow of his own building) -->
  <rect width="742" height="80" fill="url(#p21p2sky)"/>
  <!-- Stars -->
  <g fill="#fff8e8" opacity="0.85" filter="url(#p21p2bloom)">
    <circle cx="200" cy="30" r="0.85"/>
    <circle cx="380" cy="20" r="0.65"/>
    <circle cx="540" cy="40" r="0.85"/>
    <circle cx="120" cy="50" r="0.5"/>
    <circle cx="640" cy="36" r="0.7"/>
  </g>

  <!-- BUILDING facade — Theodore's home -->
  <rect x="0" y="80" width="742" height="240" fill="url(#p21p2building)"/>

  <!-- Door FRAME (he is at left side of the building) -->
  <!-- Side door (wooden, dark) — center-right of frame -->
  <rect x="380" y="120" width="80" height="200" fill="#2a1408"/>
  <rect x="384" y="124" width="72" height="192" fill="#1a0c04"/>
  <!-- Door panels -->
  <line x1="420" y1="124" x2="420" y2="316" stroke="#0a0604" stroke-width="0.6"/>
  <line x1="384" y1="220" x2="456" y2="220" stroke="#0a0604" stroke-width="0.6"/>
  <!-- Doorknob -->
  <circle cx="442" cy="232" r="2" fill="#a87838" filter="url(#p21p2bloom)"/>
  <!-- Keyhole below -->
  <rect x="441" y="240" width="2" height="3" fill="#0a0604"/>
  <circle cx="442" cy="240" r="1" fill="#0a0604"/>

  <!-- Wall texture — Victorian brick -->
  <g opacity="0.4" stroke="#0a0604" stroke-width="0.4" fill="none">
    <path d="M0,120 Q160,118 320,122 Q380,124 380,124"/>
    <path d="M0,160 Q160,162 320,158 Q380,156 380,156"/>
    <path d="M0,200 Q160,198 320,202 Q380,204 380,204"/>
    <path d="M0,240 Q160,242 320,238 Q380,236 380,236"/>
    <path d="M0,280 Q160,278 320,282 Q380,284 380,284"/>
    <path d="M460,120 Q580,122 742,118"/>
    <path d="M460,160 Q580,158 742,162"/>
    <path d="M460,200 Q580,202 742,198"/>
    <path d="M460,240 Q580,238 742,242"/>
    <path d="M460,280 Q580,282 742,278"/>
  </g>

  <!-- Distant gas lamp glow back-right (illuminating Theodore's profile) -->
  <ellipse cx="742" cy="240" rx="200" ry="120" fill="url(#p21p2backlight)" filter="url(#p21p2glow)" opacity="0.7"/>
  <!-- Cobblestones edge in foreground -->
  <rect x="0" y="320" width="742" height="44" fill="url(#p21p2cobble)"/>
  <ellipse cx="640" cy="340" rx="120" ry="22" fill="url(#p21p2lampPool)" filter="url(#p21p2glow)" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55">
    <path d="M0,338 Q200,336 400,340 Q580,342 742,338"/>
    <path d="M0,358 Q200,356 400,360 Q580,362 742,358"/>
  </g>
  <g fill="#1a0c04" opacity="0.55">
    <circle cx="80" cy="334" r="1"/>
    <circle cx="200" cy="338" r="1"/>
    <circle cx="320" cy="332" r="1"/>
    <circle cx="500" cy="338" r="1"/>
    <circle cx="180" cy="354" r="1"/>
    <circle cx="320" cy="350" r="1"/>
    <circle cx="500" cy="354" r="1"/>
  </g>

  <!-- THEODORE — at the door, PROFILE, looking back over shoulder -->
  <g transform="translate(380 230)">
    <!-- Boots -->
    <ellipse cx="-7" cy="86" rx="7" ry="3" fill="#1a0c04"/>
    <ellipse cx="3" cy="86" rx="7" ry="3" fill="#1a0c04"/>
    <!-- Trousers -->
    <rect x="-10" y="50" width="8" height="36" fill="url(#p21p2theoSuit)"/>
    <rect x="0" y="50" width="8" height="36" fill="url(#p21p2theoSuit)"/>
    <!-- Patch -->
    <rect x="-10" y="64" width="6" height="6" fill="#7a4838" opacity="0.85" stroke="#5a3818" stroke-width="0.3"/>
    <!-- Shirt -->
    <rect x="-7" y="-2" width="14" height="8" fill="#d8c8a8"/>
    <!-- Waistcoat — TURN PROFILE -->
    <path d="M-15,50 L-15,-2 L15,-2 L15,50 Z" fill="#5a2828"/>
    <line x1="0" y1="-2" x2="0" y2="48" stroke="#3a1808" stroke-width="0.7"/>
    <circle cx="0" cy="6" r="0.85" fill="#5a3818"/>
    <circle cx="0" cy="16" r="0.85" fill="#5a3818"/>
    <circle cx="0" cy="26" r="0.85" fill="#5a3818"/>
    <circle cx="0" cy="36" r="0.85" fill="#5a3818"/>
    <!-- Backlight catches edge of body -->
    <line x1="15" y1="-2" x2="15" y2="50" stroke="#ffd078" stroke-width="1" opacity="0.5" filter="url(#p21p2bloom)"/>
    <!-- Shoulders -->
    <path d="M-15,-2 Q-12,-12 -2,-14 Q4,-14 12,-10 L15,-2 Z" fill="#5a2828"/>
    <!-- Right arm — at door, key in hand -->
    <path d="M15,-2 L25,8 L34,18 L40,28 L46,30 L46,26 L40,22 L30,12 L20,2 Z" fill="#5a2828"/>
    <!-- HAND with key -->
    <ellipse cx="48" cy="32" rx="5" ry="4" fill="url(#p21p2skin)"/>
    <!-- KEY -->
    <rect x="50" y="30" width="14" height="2" fill="#a87838"/>
    <circle cx="64" cy="31" r="3" fill="none" stroke="#a87838" stroke-width="1.4" filter="url(#p21p2bloom)"/>
    <line x1="56" y1="30" x2="56" y2="34" stroke="#a87838" stroke-width="0.7"/>
    <line x1="60" y1="30" x2="60" y2="34" stroke="#a87838" stroke-width="0.7"/>
    <!-- Brass gear ring on left index — catches light -->
    <ellipse cx="48" cy="32" rx="2" ry="1.4" fill="none" stroke="#e8a850" stroke-width="0.7" filter="url(#p21p2bloom)"/>
    <!-- Oil stains -->
    <circle cx="46" cy="31" r="0.7" fill="#1a0c04" opacity="0.65"/>
    <!-- Left arm — at side, hand also visible -->
    <path d="M-15,-2 L-22,16 L-22,32 L-16,32 L-14,16 L-12,2 Z" fill="#5a2828"/>
    <ellipse cx="-19" cy="34" rx="4" ry="3" fill="url(#p21p2skin)"/>

    <!-- HEAD — TURNED BACK over shoulder (looking right at street) -->
    <ellipse cx="0" cy="-22" rx="14" ry="18" fill="url(#p21p2skin)"/>
    <!-- Backlight on profile catches cheek + edge of hair -->
    <ellipse cx="9" cy="-20" rx="6" ry="13" fill="#ffd078" opacity="0.55" filter="url(#p21p2bloom)"/>
    <!-- Hair -->
    <path d="M-11,-34 Q-10,-40 0,-42 Q11,-40 12,-32 L11,-26 Q5,-32 0,-32 Q-6,-32 -11,-26 Z" fill="#a87838"/>
    <path d="M-4,-37 L-2,-30" stroke="#7a5028" stroke-width="1" opacity="0.85"/>
    <!-- Hair edge highlight from gaslight -->
    <path d="M11,-32 Q9,-38 4,-42" stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.6" filter="url(#p21p2bloom)"/>
    <!-- Profile — face turned to right, so eye in profile -->
    <!-- Eye -->
    <ellipse cx="6" cy="-22" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="7" cy="-21" rx="1.4" ry="1" fill="#7a4818"/>
    <circle cx="7" cy="-21" r="0.85" fill="#0a0604"/>
    <circle cx="8" cy="-22" r="0.4" fill="#fff8e8" filter="url(#p21p2bloom)"/>
    <!-- Brow lifted slightly — bravery that does not know -->
    <path d="M2,-30 L11,-29" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Freckles -->
    <circle cx="3" cy="-20" r="0.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="6" cy="-18" r="0.4" fill="#5a3018" opacity="0.85"/>
    <!-- Nose profile -->
    <path d="M11,-22 L14,-18 Q14,-14 11,-14 L9,-16 Z" fill="url(#p21p2skin)"/>
    <!-- MOUTH set, chin lifted -->
    <path d="M5,-10 L11,-10" stroke="#3a1808" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Chin -->
    <path d="M11,-6 Q12,-2 9,0" fill="none" stroke="#5a3018" stroke-width="0.5" opacity="0.5"/>
    <!-- Breath fog from profile mouth -->
    <ellipse cx="16" cy="-7" rx="4" ry="1.6" fill="#fff8e8" opacity="0.45" filter="url(#p21p2bloom)"/>
  </g>

  <!-- CAPTION (bottom-left) -->
  <g>
    <rect x="14" y="14" width="364" height="36" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="500">He stood at his own door and felt the weight of it.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
