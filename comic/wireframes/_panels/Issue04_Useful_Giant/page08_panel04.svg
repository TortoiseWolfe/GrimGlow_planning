<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 8 — Panel 4: HERO PANEL — Charging cradle FIRST REVEAL</title>
  <desc>50mm medium shot from above at human scale. Theodore pushed back from gap, holds out crude charging cradle — bent brass strips in cradle shape, copper wire coils around frame, fairy power cell sitting inside glowing blue-white. Workshop materials cradling alien tech. Crash shard in pocket glows in resonance. Quiet pride. Theodore: I made this. From workshop brass and copper wire. / I studied the piece — the shard Jink left. How the light moves inside it. The geometric patterns. / I worked out how to feed it.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5838"/>
      <stop offset="100%" stop-color="#3a2018"/>
    </linearGradient>
    <linearGradient id="p8p4floorboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p8p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p8p4hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p8p4shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p8p4vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p8p4brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="50%" stop-color="#c89858"/>
      <stop offset="100%" stop-color="#7a5028"/>
    </linearGradient>
    <linearGradient id="p8p4copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a868"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <radialGradient id="p8p4cellGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a8c0e0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p8p4cellCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="40%" stop-color="#a8c0e0"/>
      <stop offset="70%" stop-color="#c0a8e0"/>
      <stop offset="100%" stop-color="#5a4878"/>
    </linearGradient>
    <radialGradient id="p8p4dayLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#e8d8b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p8p4shardGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8e0f0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p8p4bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p8p4glow"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <!-- Workshop floor BG -->
  <rect width="742" height="364" fill="url(#p8p4floor)"/>
  <rect width="742" height="364" fill="url(#p8p4dayLight)"/>

  <!-- Floorboard texture (long planks horizontal) -->
  <g stroke="#1a0c04" stroke-width="0.85" opacity="0.7">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="280" x2="742" y2="280"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.5" fill="none">
    <path d="M40,40 Q200,46 400,40 Q580,42 700,40"/>
    <path d="M40,120 Q200,114 400,120 Q580,118 700,120"/>
    <path d="M40,220 Q200,226 400,220 Q580,222 700,220"/>
    <path d="M40,320 Q200,316 400,320 Q580,318 700,320"/>
  </g>
  <!-- Dust on floor -->
  <g fill="#8a7868" opacity="0.45">
    <ellipse cx="80" cy="60" rx="14" ry="3"/>
    <ellipse cx="220" cy="120" rx="20" ry="4"/>
    <ellipse cx="500" cy="220" rx="14" ry="3"/>
    <ellipse cx="640" cy="320" rx="16" ry="3"/>
  </g>

  <!-- THE GAP at far edge of frame (visible bottom right) -->
  <g>
    <rect x="640" y="180" width="100" height="6" fill="#0a0604"/>
    <ellipse cx="690" cy="184" rx="40" ry="6" fill="#a8c0e0" opacity="0.45" filter="url(#p8p4bloom)"/>
  </g>

  <!-- THEODORE — pushed back from gap, facing toward gap (right), holding cradle near gap -->
  <g transform="translate(280 220)">
    <!-- Body — torso visible (he's lying-ish, leaning on one elbow) -->
    <!-- Vest -->
    <path d="M-220,40 L-200,140 L60,150 L80,40 Z" fill="url(#p8p4vest)"/>
    <!-- Shirt arm -->
    <path d="M80,40 Q120,40 160,60 L160,80 Q120,60 80,60 Z" fill="url(#p8p4shirt)"/>
    <!-- Right arm extended right toward gap (holding cradle) -->
    <path d="M80,40 Q120,30 160,40 L200,60 Q220,80 240,90 L240,110 Q220,100 180,80 Q140,60 80,60 Z" fill="url(#p8p4shirt)"/>

    <!-- HANDS holding cradle -->
    <ellipse cx="240" cy="100" rx="40" ry="22" fill="url(#p8p4skin)"/>
    <!-- Other supporting hand below (left of cradle) -->
    <ellipse cx="200" cy="120" rx="34" ry="18" fill="url(#p8p4skin)"/>
    <!-- Fingers around cradle -->
    <g fill="url(#p8p4skin)">
      <ellipse cx="260" cy="86" rx="14" ry="5" transform="rotate(20 260 86)"/>
      <ellipse cx="276" cy="98" rx="14" ry="5" transform="rotate(40 276 98)"/>
      <ellipse cx="276" cy="112" rx="14" ry="5" transform="rotate(60 276 112)"/>
    </g>
    <!-- Brass gear ring -->
    <ellipse cx="260" cy="86" rx="3" ry="2" fill="#c89858" stroke="#7a5028" stroke-width="0.5"/>
    <!-- Oil stains -->
    <ellipse cx="240" cy="100" rx="10" ry="3" fill="#1a0c04" opacity="0.5"/>
    <ellipse cx="200" cy="120" rx="8" ry="2.4" fill="#1a0c04" opacity="0.5"/>

    <!-- ===== THE CHARGING CRADLE — center of frame, in his hands ===== -->
    <g transform="translate(240 70)">
      <!-- Massive blue-white halo from charged cell -->
      <ellipse cx="0" cy="0" rx="100" ry="60" fill="url(#p8p4cellGlow)" filter="url(#p8p4glow)" opacity="0.85"/>

      <!-- BRASS CRADLE FRAME — bent strips forming a rough basket -->
      <g>
        <!-- Bottom curve -->
        <path d="M-30,18 Q-32,28 -22,32 L22,32 Q32,28 30,18" fill="none" stroke="url(#p8p4brass)" stroke-width="3.5"/>
        <!-- Outer left strip -->
        <path d="M-32,-10 Q-36,4 -32,18" fill="none" stroke="url(#p8p4brass)" stroke-width="3"/>
        <!-- Outer right strip -->
        <path d="M32,-10 Q36,4 32,18" fill="none" stroke="url(#p8p4brass)" stroke-width="3"/>
        <!-- Diagonal cross strips (rough cradle structure) -->
        <path d="M-28,-8 L-12,18" fill="none" stroke="url(#p8p4brass)" stroke-width="2"/>
        <path d="M28,-8 L12,18" fill="none" stroke="url(#p8p4brass)" stroke-width="2"/>
        <path d="M-20,-8 Q-4,8 12,16" fill="none" stroke="url(#p8p4brass)" stroke-width="1.5"/>
        <!-- Solder joints / rough welds -->
        <circle cx="-32" cy="18" r="2" fill="#a86828"/>
        <circle cx="32" cy="18" r="2" fill="#a86828"/>
        <circle cx="-28" cy="-8" r="1.6" fill="#a86828"/>
        <circle cx="28" cy="-8" r="1.6" fill="#a86828"/>
      </g>

      <!-- COPPER WIRE COILS — wound around the brass frame -->
      <g stroke="url(#p8p4copper)" stroke-width="1.4" fill="none">
        <!-- Coiled around cradle, multiple loops -->
        <path d="M-32,-10 Q-22,-14 -10,-12 Q4,-10 18,-12 Q28,-14 32,-10"/>
        <path d="M-34,-2 Q-24,-6 -10,-4 Q4,-2 18,-4 Q28,-6 34,-2"/>
        <path d="M-34,6 Q-24,2 -10,4 Q4,6 18,4 Q28,2 34,6"/>
        <path d="M-32,14 Q-22,10 -10,12 Q4,14 18,12 Q28,10 32,14"/>
        <path d="M-30,22 Q-20,18 -10,20 Q4,22 18,20 Q28,18 30,22"/>
      </g>

      <!-- FAIRY POWER CELL inside cradle (geometric crystal, fully charged + glowing) -->
      <g>
        <!-- Bright halo behind cell -->
        <ellipse cx="0" cy="2" rx="28" ry="20" fill="#e8f0ff" opacity="0.85" filter="url(#p8p4bloom)"/>
        <!-- Crystal facets -->
        <path d="M-14,-4 L-2,-14 L12,-10 L16,4 L8,16 L-8,18 L-18,8 Z" fill="url(#p8p4cellCore)" stroke="#5a4878" stroke-width="0.7"/>
        <!-- Internal geometric facets -->
        <g opacity="0.85" stroke="#fff8e8" stroke-width="0.55" fill="none">
          <path d="M-12,-2 L0,-10 L10,-4"/>
          <path d="M-8,4 L4,8"/>
          <path d="M-10,10 L0,2 L8,8"/>
          <path d="M-2,-8 L-2,12"/>
        </g>
        <!-- Bright core -->
        <ellipse cx="0" cy="2" rx="6" ry="3.5" fill="#ffffff" opacity="0.85"/>
        <ellipse cx="-2" cy="0" rx="2.4" ry="1.4" fill="#ffffff"/>
        <!-- Geometric pattern overlays (the patterns moving inside) -->
        <g opacity="0.75" stroke="#a8c0e0" stroke-width="0.4" fill="none">
          <path d="M-10,-2 L0,-8 L10,-2 L0,8 Z"/>
        </g>
      </g>

      <!-- Wires extending out of cradle to nowhere (improvisation) -->
      <path d="M-32,18 Q-44,28 -52,32" fill="none" stroke="#7a4818" stroke-width="0.85"/>
      <path d="M32,18 Q44,28 52,32" fill="none" stroke="#7a4818" stroke-width="0.85"/>
    </g>

    <!-- HEAD — large, looking down at cradle in his hands, slight quiet pride -->
    <ellipse cx="-100" cy="-80" rx="60" ry="68" fill="url(#p8p4skin)"/>
    <g fill="url(#p8p4hair)">
      <path d="M-160,-140 Q-160,-160 -100,-164 Q-40,-160 -40,-140 L-46,-122 Q-72,-138 -100,-138 Q-128,-138 -154,-122 Z"/>
      <!-- Strands -->
      <path d="M-140,-122 Q-138,-100 -130,-80 L-122,-82 Q-132,-100 -136,-122 Z"/>
      <path d="M-110,-130 Q-108,-100 -100,-80 L-92,-82 Q-102,-100 -106,-130 Z"/>
      <path d="M-80,-130 Q-78,-100 -70,-80 L-62,-82 Q-72,-100 -76,-130 Z"/>
      <path d="M-50,-122 Q-48,-100 -40,-80 L-32,-82 Q-42,-100 -46,-122 Z"/>
    </g>
    <!-- Eyebrows -->
    <path d="M-130,-92 Q-118,-100 -106,-94" stroke="#5a4030" stroke-width="3" fill="none"/>
    <path d="M-94,-94 Q-82,-100 -70,-92" stroke="#5a4030" stroke-width="3" fill="none"/>
    <!-- Eyes — looking down (right) at cradle -->
    <ellipse cx="-118" cy="-78" rx="8" ry="5" fill="#fff8e8"/>
    <ellipse cx="-114" cy="-77" rx="5" ry="3.5" fill="#7a5028"/>
    <circle cx="-114" cy="-77" r="2.4" fill="#0a0604"/>
    <ellipse cx="-116" cy="-79" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="-82" cy="-78" rx="8" ry="5" fill="#fff8e8"/>
    <ellipse cx="-78" cy="-77" rx="5" ry="3.5" fill="#7a5028"/>
    <circle cx="-78" cy="-77" r="2.4" fill="#0a0604"/>
    <ellipse cx="-80" cy="-79" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <!-- Nose -->
    <path d="M-100,-70 L-108,-44 Q-100,-40 -92,-44 Z" fill="#a87858" opacity="0.55"/>
    <!-- Mouth — soft determined line, faint quiet pride -->
    <path d="M-114,-22 Q-100,-18 -86,-22" fill="none" stroke="#5a2818" stroke-width="0.85"/>
    <!-- Freckles -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="-130" cy="-58" r="1.4"/>
      <circle cx="-120" cy="-50" r="1.4"/>
      <circle cx="-100" cy="-58" r="1.4"/>
      <circle cx="-80" cy="-50" r="1.4"/>
      <circle cx="-70" cy="-58" r="1.4"/>
    </g>
    <!-- COOL light from cradle illuminating face from below -->
    <path d="M-150,-50 Q-100,-30 -50,-50 L-50,-30 Q-100,-12 -150,-30 Z" fill="#a8c0e0" opacity="0.4"/>

    <!-- CRASH SHARD glowing in waistcoat pocket (resonating) -->
    <g transform="translate(-80 80)">
      <ellipse cx="0" cy="0" rx="34" ry="20" fill="url(#p8p4shardGlow)" filter="url(#p8p4bloom)" opacity="0.65"/>
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#a8c0e0" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="2.5" ry="1.5" fill="#fff8e8" opacity="0.85"/>
    </g>
  </g>

  <!-- DIALOGUE — Theodore: I made this. From workshop brass and copper wire. -->
  <g>
    <rect x="14" y="14" width="324" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,58 L190,58 L182,70 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M182,58 L188,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I made this. From workshop brass and copper wire.</text>

  <!-- DIALOGUE — Theodore: I studied the piece — the shard Jink left. How the light moves inside it. The geometric patterns. -->
  <g>
    <rect x="14" y="74" width="624" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,118 L270,118 L262,130 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M262,118 L268,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I studied the piece — the shard Jink left. How the light moves inside it. The geometric patterns.</text>

  <!-- DIALOGUE — Theodore: I worked out how to feed it. -->
  <g>
    <rect x="14" y="134" width="200" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M100,178 L110,178 L102,190 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M102,178 L108,178" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="700">I worked out how to feed it.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
