<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 11 — Panel 5: Exterior establishing — Clerkenwell street unaware of camp inside</title>
  <desc>28mm wide low angle. Exterior view of brick building wall from courtyard side. The wall gap visible at base, ordinary unmarked. Workshop window at human level. Above, the floorboards of empty room. Pedestrians walking past unaware. Three captions close Section 2.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p5sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a948a"/>
      <stop offset="100%" stop-color="#b8b0a4"/>
    </linearGradient>
    <linearGradient id="p11p5brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p11p5cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <radialGradient id="p11p5gapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p5bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="742" height="80" fill="url(#p11p5sky)"/>

  <!-- BRICK WALL — fills frame -->
  <rect x="0" y="60" width="742" height="180" fill="url(#p11p5brick)"/>
  <g stroke="#3a2010" stroke-width="0.45" opacity="0.55">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="220" x2="742" y2="220"/>
    <line x1="80" y1="60" x2="80" y2="100"/>
    <line x1="220" y1="100" x2="220" y2="140"/>
    <line x1="160" y1="140" x2="160" y2="180"/>
    <line x1="380" y1="160" x2="380" y2="200"/>
    <line x1="540" y1="60" x2="540" y2="100"/>
    <line x1="660" y1="100" x2="660" y2="140"/>
    <line x1="600" y1="180" x2="600" y2="220"/>
  </g>
  <g opacity="0.45">
    <ellipse cx="120" cy="120" rx="14" ry="4" fill="#6a3828"/>
    <ellipse cx="320" cy="180" rx="12" ry="4" fill="#7a4030"/>
    <ellipse cx="540" cy="100" rx="10" ry="3.5" fill="#6a3828"/>
    <ellipse cx="660" cy="180" rx="12" ry="4" fill="#7a4030"/>
  </g>

  <!-- WORKSHOP WINDOW (Theodore's room) at human-level -->
  <rect x="240" y="100" width="80" height="100" fill="#3a2818"/>
  <rect x="244" y="104" width="72" height="92" fill="#5a4838" opacity="0.75"/>
  <line x1="280" y1="104" x2="280" y2="196" stroke="#1a0c04" stroke-width="0.5"/>
  <line x1="244" y1="150" x2="316" y2="150" stroke="#1a0c04" stroke-width="0.5"/>
  <!-- Faint warm glow inside (workshop activity) -->
  <ellipse cx="280" cy="148" rx="32" ry="36" fill="#d8c8a8" opacity="0.18"/>

  <!-- THE WALL GAP at base — ordinary, unmarked, faint glow leak only -->
  <g>
    <rect x="450" y="220" width="34" height="6" fill="#0a0604"/>
    <ellipse cx="467" cy="222" rx="22" ry="4" fill="url(#p11p5gapGlow)" filter="url(#p11p5bloom)"/>
    <ellipse cx="448" cy="226" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="486" cy="226" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
  </g>

  <!-- Moss at wall base -->
  <g>
    <ellipse cx="180" cy="222" rx="32" ry="3" fill="#4a5828" opacity="0.6"/>
    <ellipse cx="600" cy="222" rx="36" ry="3" fill="#4a5828" opacity="0.6"/>
  </g>

  <!-- COBBLESTONES -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p11p5cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.65">
    <path d="M0,250 Q160,248 320,252 Q500,254 742,250"/>
    <path d="M0,290 Q160,292 320,288 Q500,286 742,290"/>
    <path d="M0,330 Q160,328 320,332 Q500,334 742,330"/>
  </g>
  <g fill="#1a0c04" opacity="0.5">
    <circle cx="60" cy="262" r="1.4"/>
    <circle cx="180" cy="270" r="1.4"/>
    <circle cx="280" cy="262" r="1.4"/>
    <circle cx="500" cy="270" r="1.4"/>
    <circle cx="620" cy="262" r="1.4"/>
    <circle cx="100" cy="305" r="1.4"/>
    <circle cx="240" cy="315" r="1.4"/>
    <circle cx="380" cy="305" r="1.4"/>
    <circle cx="540" cy="315" r="1.4"/>
    <circle cx="80" cy="345" r="1.4"/>
    <circle cx="220" cy="355" r="1.4"/>
    <circle cx="360" cy="345" r="1.4"/>
    <circle cx="500" cy="355" r="1.4"/>
    <circle cx="640" cy="345" r="1.4"/>
  </g>

  <!-- Pedestrians walking past (unaware) -->
  <!-- Pedestrian 1 left -->
  <g transform="translate(80 320)">
    <path d="M-6,-30 L-8,-2 L-2,0 L0,-30 Z" fill="#3a2818"/>
    <path d="M0,-30 L2,0 L8,-2 L6,-30 Z" fill="#3a2818"/>
    <path d="M-10,-50 L-12,-30 L12,-30 L10,-50 Z" fill="#7a5028"/>
    <ellipse cx="0" cy="-58" rx="6" ry="8" fill="#a89070"/>
    <path d="M-7,-66 Q-6,-72 0,-72 Q6,-72 7,-66 L6,-60 L-6,-60 Z" fill="#1a0c04"/>
    <!-- Top hat -->
    <rect x="-4" y="-78" width="8" height="6" fill="#1a0c04"/>
    <rect x="-7" y="-72" width="14" height="2" fill="#1a0c04"/>
  </g>
  <!-- Pedestrian 2 (woman with shawl, mid-distance) -->
  <g transform="translate(680 326)">
    <path d="M-7,-26 L-9,-2 L-3,0 L-1,-26 Z" fill="#5a3030"/>
    <path d="M1,-26 L3,0 L9,-2 L7,-26 Z" fill="#5a3030"/>
    <path d="M-12,-50 L-14,-26 L14,-26 L12,-50 Z" fill="#3a2818"/>
    <ellipse cx="0" cy="-58" rx="5" ry="7" fill="#a89070"/>
    <path d="M-7,-64 Q-7,-50 0,-50 Q7,-50 7,-64" fill="#3a2818"/>
  </g>
  <!-- Distant pedestrians -->
  <g opacity="0.7">
    <ellipse cx="380" cy="280" rx="3" ry="8" fill="#3a2818"/>
    <ellipse cx="380" cy="272" rx="2" ry="2" fill="#3a2818"/>
    <ellipse cx="180" cy="276" rx="3" ry="8" fill="#3a2818"/>
    <ellipse cx="180" cy="268" rx="2" ry="2" fill="#3a2818"/>
  </g>

  <!-- CAPTIONS closing Section 2 -->
  <g>
    <rect x="14" y="14" width="394" height="44" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Inside, a boy was learning to be useful.</text>

  <g>
    <rect x="14" y="74" width="468" height="44" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Inside, five soldiers were learning to need a giant.</text>

  <g>
    <rect x="412" y="134" width="316" height="44" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="420" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="420" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Outside, London noticed nothing at all.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,40 Q200,38 400,42 Q580,44 742,40"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
