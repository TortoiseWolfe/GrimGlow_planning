<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 2 — Panel 3: Fairy POV through gap, Theodore's enormous face fills opening</title>
  <desc>28mm wide from inside wall cavity looking out through brick gap. Gap is barn-door sized at fairy scale. Theodore's enormous face fills it — eye, nose, cheekbone visible, sandy-brown hair across forehead. Holographic perimeter emitters frame edges of gap with cool blue-white. Inside cavity: timber beams, glowing power cell. Warm daylight floods in. Theodore: Hello? Caption: His voice filled their entire world.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p2p3cavityFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p2p3cavityWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="p2p3timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p2p3brickFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p2p3sky" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8c8a8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </radialGradient>
    <linearGradient id="p2p3skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p2p3hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <radialGradient id="p2p3iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="20%" stop-color="#5a3818"/>
      <stop offset="55%" stop-color="#8a6028"/>
      <stop offset="85%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </radialGradient>
    <radialGradient id="p2p3perimeter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#a8c0e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p3powerCell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd888" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d8a838" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a87828" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p3bloom"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="p2p3glow"><feGaussianBlur stdDeviation="3.4"/></filter>
  </defs>

  <!-- INTERIOR cavity — dark base color -->
  <rect width="742" height="364" fill="url(#p2p3cavityWall)"/>

  <!-- TIMBER BEAMS framing the cavity (FG suggesting interior) -->
  <!-- Left vertical timber stud -->
  <rect x="0" y="0" width="80" height="364" fill="url(#p2p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.7">
    <line x1="40" y1="0" x2="40" y2="364"/>
    <line x1="20" y1="60" x2="60" y2="60"/>
    <line x1="20" y1="160" x2="60" y2="160"/>
    <line x1="20" y1="260" x2="60" y2="260"/>
  </g>
  <!-- Wood grain -->
  <g stroke="#1a0c04" stroke-width="0.35" opacity="0.55" fill="none">
    <path d="M10,40 Q40,50 70,40"/>
    <path d="M10,120 Q40,130 70,120"/>
    <path d="M10,200 Q40,210 70,200"/>
    <path d="M10,300 Q40,310 70,300"/>
  </g>

  <!-- Right vertical timber stud -->
  <rect x="662" y="0" width="80" height="364" fill="url(#p2p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.7">
    <line x1="702" y1="0" x2="702" y2="364"/>
    <line x1="682" y1="80" x2="722" y2="80"/>
    <line x1="682" y1="200" x2="722" y2="200"/>
    <line x1="682" y1="320" x2="722" y2="320"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.35" opacity="0.55" fill="none">
    <path d="M672,40 Q702,50 732,40"/>
    <path d="M672,140 Q702,150 732,140"/>
    <path d="M672,240 Q702,250 732,240"/>
    <path d="M672,320 Q702,330 732,320"/>
  </g>

  <!-- Top horizontal joist -->
  <rect x="0" y="0" width="742" height="48" fill="url(#p2p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.6" fill="none">
    <path d="M40,12 Q200,18 380,12 Q520,16 700,12"/>
    <path d="M40,30 Q200,36 380,30 Q520,34 700,30"/>
  </g>
  <!-- Bottom floorboard -->
  <rect x="0" y="320" width="742" height="44" fill="url(#p2p3cavityFloor)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="320" x2="742" y2="320"/>
    <line x1="0" y1="338" x2="742" y2="338"/>
    <line x1="160" y1="320" x2="160" y2="364"/>
    <line x1="320" y1="320" x2="320" y2="364"/>
    <line x1="480" y1="320" x2="480" y2="364"/>
    <line x1="640" y1="320" x2="640" y2="364"/>
  </g>

  <!-- POWER CELL — FG, bottom-left, on timber ledge, casting amber glow -->
  <g transform="translate(110 296)">
    <!-- Glow halo -->
    <ellipse cx="0" cy="0" rx="80" ry="40" fill="url(#p2p3powerCell)" filter="url(#p2p3glow)" opacity="0.6"/>
    <!-- Ledge shelf -->
    <rect x="-30" y="-2" width="60" height="6" fill="#3a2818"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#1a0c04" stroke-width="0.5"/>
    <!-- Cell body — geometric crystal -->
    <path d="M-12,-22 L0,-32 L12,-22 L14,-2 L-14,-2 Z" fill="#d8a838" opacity="0.85"/>
    <!-- Internal facets -->
    <path d="M-10,-22 L0,-30 L10,-22 L0,-12 Z" fill="#ffd888" opacity="0.85"/>
    <path d="M-12,-22 L-10,-22 L-12,-2 Z" fill="#a87828" opacity="0.65"/>
    <path d="M12,-22 L10,-22 L12,-2 Z" fill="#a87828" opacity="0.65"/>
    <!-- Wiring -->
    <path d="M-14,-2 Q-26,4 -36,2" fill="none" stroke="#7a5028" stroke-width="1"/>
    <path d="M14,-2 Q26,4 36,2" fill="none" stroke="#7a5028" stroke-width="1"/>
    <!-- Bright core -->
    <circle cx="0" cy="-18" r="4" fill="#ffe8a8"/>
  </g>

  <!-- HOLOGRAPHIC PERIMETER EMITTER — small geometric device, top-left FG corner -->
  <g transform="translate(70 220)">
    <ellipse cx="0" cy="0" rx="24" ry="22" fill="url(#p2p3perimeter)" filter="url(#p2p3bloom)"/>
    <path d="M-6,-8 L0,-12 L6,-8 L8,0 L4,8 L-4,8 L-8,0 Z" fill="#a8c0e0" opacity="0.85"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    <!-- Geometric ward lines extending -->
    <g stroke="#a8c0e0" stroke-width="0.5" opacity="0.7" fill="none">
      <path d="M-8,0 L-30,-8"/>
      <path d="M8,0 L30,-8"/>
      <path d="M0,8 L0,30"/>
      <path d="M0,-12 L0,-24"/>
    </g>
  </g>
  <!-- Right-side perimeter emitter (smaller, deeper into camp) -->
  <g transform="translate(672 270)">
    <ellipse cx="0" cy="0" rx="18" ry="16" fill="url(#p2p3perimeter)" filter="url(#p2p3bloom)" opacity="0.85"/>
    <path d="M-4,-6 L0,-9 L4,-6 L6,0 L3,6 L-3,6 L-6,0 Z" fill="#a8c0e0" opacity="0.85"/>
  </g>

  <!-- BRICK GAP FRAME — the rectangle showing the outside world -->
  <!-- (positioned center, perimeter emitters at edges) -->
  <g>
    <!-- Slight inset for crumbled mortar visible -->
    <rect x="100" y="50" width="540" height="260" fill="url(#p2p3sky)"/>
    <!-- Gap edges — brick interior surface, in shadow -->
    <rect x="100" y="50" width="540" height="6" fill="#3a1808"/>
    <rect x="100" y="304" width="540" height="6" fill="#3a1808"/>
    <rect x="100" y="50" width="6" height="260" fill="#3a1808"/>
    <rect x="634" y="50" width="6" height="260" fill="#3a1808"/>
    <!-- Crumbled mortar bits at gap edges -->
    <ellipse cx="120" cy="56" rx="6" ry="2" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="500" cy="56" rx="5" ry="2" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="160" cy="306" rx="6" ry="2" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="560" cy="306" rx="6" ry="2" fill="#7a6858" opacity="0.7"/>
  </g>

  <!-- THEODORE'S ENORMOUS FACE — fills the gap -->
  <g transform="translate(370 180)" clip-path="inset(0 0 0 0)">
    <!-- Face fills the visible gap area -->
    <!-- Limit to gap interior: x [-264,264] y [-124,124] approx -->

    <!-- Face/skin base -->
    <ellipse cx="0" cy="20" rx="280" ry="160" fill="url(#p2p3skin)"/>

    <!-- HAIR — sandy-brown, falling across forehead from top -->
    <g fill="url(#p2p3hair)">
      <!-- Hair mass at top -->
      <path d="M-280,-120 L280,-120 L280,-80 Q150,-50 0,-58 Q-150,-66 -280,-78 Z"/>
      <!-- Falling strands -->
      <path d="M-200,-78 Q-194,-50 -186,-30 L-176,-32 Q-184,-58 -190,-78 Z"/>
      <path d="M-120,-72 Q-114,-40 -106,-18 L-94,-20 Q-104,-50 -112,-72 Z"/>
      <path d="M-40,-66 Q-34,-30 -22,-6 L-10,-8 Q-22,-40 -32,-66 Z"/>
      <path d="M50,-66 Q56,-32 64,-8 L78,-10 Q66,-42 60,-66 Z"/>
      <path d="M140,-72 Q146,-46 152,-22 L162,-24 Q156,-52 150,-72 Z"/>
      <path d="M220,-76 Q226,-50 230,-30 L240,-32 Q234,-56 230,-76 Z"/>
    </g>

    <!-- EYEBROW arch -->
    <g fill="url(#p2p3hair)" opacity="0.85">
      <path d="M-170,-10 Q-80,-30 30,-20 Q90,-14 100,-8 Q-40,-18 -170,4 Z"/>
    </g>

    <!-- THE EYE — center-left, peering -->
    <g transform="translate(-50 30)">
      <!-- Eye socket shadow -->
      <ellipse cx="0" cy="0" rx="100" ry="48" fill="#7a5848" opacity="0.4"/>
      <!-- Eye white -->
      <ellipse cx="0" cy="0" rx="92" ry="38" fill="#fff8e8"/>
      <!-- Iris (hazel, large) -->
      <circle cx="0" cy="0" r="36" fill="url(#p2p3iris)"/>
      <!-- Iris detail rays -->
      <g stroke="#3a2010" stroke-width="0.7" fill="none" opacity="0.7">
        <line x1="0" y1="-36" x2="0" y2="-22"/>
        <line x1="18" y1="-31" x2="11" y2="-19"/>
        <line x1="31" y1="-18" x2="19" y2="-11"/>
        <line x1="36" y1="0" x2="22" y2="0"/>
        <line x1="31" y1="18" x2="19" y2="11"/>
        <line x1="18" y1="31" x2="11" y2="19"/>
        <line x1="0" y1="36" x2="0" y2="22"/>
        <line x1="-18" y1="31" x2="-11" y2="19"/>
        <line x1="-31" y1="18" x2="-19" y2="11"/>
        <line x1="-36" y1="0" x2="-22" y2="0"/>
        <line x1="-31" y1="-18" x2="-19" y2="-11"/>
        <line x1="-18" y1="-31" x2="-11" y2="-19"/>
      </g>
      <!-- Gold flecks -->
      <g fill="#c89858" opacity="0.85">
        <ellipse cx="-12" cy="-6" rx="4" ry="2"/>
        <ellipse cx="10" cy="10" rx="3.5" ry="2"/>
        <ellipse cx="-6" cy="14" rx="2.5" ry="1.4"/>
        <ellipse cx="16" cy="-4" rx="2.5" ry="1.4"/>
      </g>
      <!-- Pupil — DILATED (adjusting to dark) -->
      <circle cx="0" cy="0" r="22" fill="#000"/>
      <!-- Catchlight — warm daylight -->
      <ellipse cx="-10" cy="-12" rx="6" ry="4" fill="#fff8e8" opacity="0.9"/>
      <ellipse cx="-13" cy="-14" rx="2.4" ry="1.6" fill="#ffffff"/>
      <!-- Upper eyelid arch -->
      <path d="M-92,-2 Q0,-44 92,-2" fill="none" stroke="#3a2010" stroke-width="2.4"/>
      <!-- Eyelashes -->
      <g stroke="#3a2010" stroke-width="1.2" stroke-linecap="round">
        <line x1="-60" y1="-20" x2="-62" y2="-32"/>
        <line x1="-30" y1="-32" x2="-32" y2="-46"/>
        <line x1="0" y1="-38" x2="0" y2="-52"/>
        <line x1="30" y1="-32" x2="32" y2="-46"/>
        <line x1="60" y1="-20" x2="62" y2="-32"/>
      </g>
      <!-- Lower lid -->
      <path d="M-92,4 Q0,28 92,4" fill="none" stroke="#5a3818" stroke-width="1.2"/>
    </g>

    <!-- NOSE BRIDGE — right of eye -->
    <path d="M68,30 Q88,50 100,90 Q108,130 100,160 L80,158 Q92,128 86,98 Q80,72 68,52 Z" fill="url(#p2p3skin)"/>
    <!-- Nostril hint -->
    <ellipse cx="92" cy="148" rx="6" ry="3" fill="#5a3828" opacity="0.45"/>

    <!-- MOUTH — slightly open (Hello?) — at bottom of frame -->
    <g transform="translate(-30 156)">
      <path d="M-72,0 Q0,-12 72,0 Q60,16 0,18 Q-60,16 -72,0 Z" fill="#a85838"/>
      <path d="M-72,0 Q0,8 72,0" fill="none" stroke="#5a2818" stroke-width="0.85"/>
      <!-- Teeth hint -->
      <rect x="-16" y="2" width="32" height="6" fill="#f0e8d8" opacity="0.85"/>
    </g>

    <!-- CHEEKBONE highlight (warm light from outside) -->
    <ellipse cx="-130" cy="100" rx="60" ry="30" fill="#d8c8b8" opacity="0.45"/>

    <!-- Freckles -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="50" cy="100" r="1.4"/>
      <circle cx="60" cy="120" r="1.4"/>
      <circle cx="40" cy="116" r="1.2"/>
      <circle cx="-110" cy="100" r="1.4"/>
      <circle cx="-90" cy="118" r="1.4"/>
      <circle cx="-130" cy="116" r="1.2"/>
    </g>
  </g>

  <!-- DUST MOTES floating in light beams (warm daylight) -->
  <g fill="#fff8e8" opacity="0.65">
    <circle cx="160" cy="120" r="1.4"/>
    <circle cx="220" cy="180" r="1.2"/>
    <circle cx="320" cy="100" r="1"/>
    <circle cx="420" cy="160" r="1.2"/>
    <circle cx="510" cy="100" r="1"/>
    <circle cx="580" cy="180" r="1.4"/>
  </g>

  <!-- DIALOGUE — Theodore (enormous, resonating) -->
  <!-- Dramatic large balloon, wavy to suggest resonance -->
  <g>
    <rect x="14" y="14" width="158" height="50" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="3" filter="url(#balloonShadow)"/>
    <path d="M70,64 L84,64 L74,80 Z" fill="#ffffff" stroke="#6a4220" stroke-width="3"/>
    <path d="M73,64 L81,64" stroke="#ffffff" stroke-width="3"/>
  </g>
  <text x="22" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1a1a1a">Hello?</text>

  <!-- CAPTION — His voice filled their entire world. -->
  <g>
    <rect x="500" y="14" width="228" height="46" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="508" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="508" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">His voice filled their entire world.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,40 Q200,38 400,42 Q580,44 742,40"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
