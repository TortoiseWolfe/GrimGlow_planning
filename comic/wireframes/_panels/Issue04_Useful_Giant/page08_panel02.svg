<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 4 — Page 8 — Panel 2: Theodore from above promises and offers to show</title>
  <desc>MCU. Theodore from above (slight high angle, fairy-POV looking up). Earnest, formal Victorian boy, hand near collar/waistcoat. Hazel eyes serious. Theodore: Ma'am. I haven't told anyone. I won't. / But I can show you something. If you'll let me.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#3a3038"/>
    </linearGradient>
    <linearGradient id="p8p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p8p2hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p8p2vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p8p2shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p8p2gapGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p8p2bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p8p2bg)"/>
  <rect width="366" height="364" fill="url(#p8p2gapGlow)"/>

  <!-- Theodore — large face dominant, slightly high angle (we're seeing him from below + slightly to side) -->
  <g transform="translate(180 200)">
    <!-- Body shoulders/torso visible at bottom -->
    <path d="M-90,160 L-80,80 L80,80 L90,160 Z" fill="url(#p8p2vest)"/>
    <!-- Shirt collar -->
    <path d="M-30,80 L-26,100 L26,100 L30,80 Z" fill="url(#p8p2shirt)"/>
    <!-- Right hand near collar (formal, hand on heart-ish, sincere posture) -->
    <ellipse cx="40" cy="90" rx="24" ry="16" fill="url(#p8p2skin)"/>
    <g fill="url(#p8p2skin)">
      <ellipse cx="56" cy="80" rx="10" ry="5" transform="rotate(20 56 80)"/>
      <ellipse cx="60" cy="92" rx="10" ry="5"/>
    </g>
    <!-- Brass gear ring -->
    <ellipse cx="56" cy="80" rx="3" ry="2" fill="#c89858" stroke="#7a5028" stroke-width="0.5"/>
    <!-- Oil stains -->
    <ellipse cx="42" cy="92" rx="6" ry="2" fill="#1a0c04" opacity="0.5"/>

    <!-- HEAD — large, looking down (toward camp/fairy POV looking up at him) -->
    <ellipse cx="0" cy="-30" rx="80" ry="86" fill="url(#p8p2skin)"/>
    <!-- HAIR (sandy-brown, falling forward + over ears) -->
    <g fill="url(#p8p2hair)">
      <path d="M-78,-90 Q-78,-110 0,-115 Q78,-110 78,-90 L72,-72 Q44,-92 0,-92 Q-44,-92 -72,-72 Z"/>
      <!-- Strands -->
      <path d="M-50,-72 Q-48,-50 -40,-30 L-30,-32 Q-42,-50 -46,-72 Z"/>
      <path d="M-20,-86 Q-18,-60 -10,-36 L-2,-38 Q-12,-60 -16,-86 Z"/>
      <path d="M16,-86 Q18,-60 26,-36 L34,-38 Q24,-60 22,-86 Z"/>
      <path d="M44,-72 Q46,-50 54,-30 L64,-32 Q52,-50 48,-72 Z"/>
    </g>

    <!-- EYEBROWS — neutral, sincere -->
    <path d="M-44,-44 Q-26,-50 -10,-44" stroke="#5a4030" stroke-width="3" fill="none"/>
    <path d="M10,-44 Q26,-50 44,-44" stroke="#5a4030" stroke-width="3" fill="none"/>

    <!-- EYES — open, sincere, looking down (toward the gap = toward viewer) -->
    <ellipse cx="-26" cy="-30" rx="12" ry="7" fill="#fff8e8"/>
    <ellipse cx="-22" cy="-28" rx="7" ry="5" fill="#7a5028"/>
    <circle cx="-22" cy="-28" r="3.5" fill="#0a0604"/>
    <ellipse cx="-24" cy="-30" rx="2" ry="1.2" fill="#fff8e8"/>

    <ellipse cx="26" cy="-30" rx="12" ry="7" fill="#fff8e8"/>
    <ellipse cx="30" cy="-28" rx="7" ry="5" fill="#7a5028"/>
    <circle cx="30" cy="-28" r="3.5" fill="#0a0604"/>
    <ellipse cx="28" cy="-30" rx="2" ry="1.2" fill="#fff8e8"/>

    <!-- Eyelashes -->
    <g stroke="#3a2010" stroke-width="1" stroke-linecap="round">
      <line x1="-32" y1="-38" x2="-34" y2="-46"/>
      <line x1="-22" y1="-40" x2="-22" y2="-50"/>
      <line x1="-12" y1="-38" x2="-10" y2="-46"/>
      <line x1="12" y1="-38" x2="14" y2="-46"/>
      <line x1="22" y1="-40" x2="22" y2="-50"/>
      <line x1="32" y1="-38" x2="34" y2="-46"/>
    </g>

    <!-- NOSE -->
    <path d="M0,-22 L-8,4 Q0,8 8,4 Z" fill="#a87858" opacity="0.55"/>

    <!-- MOUTH — slightly open, speaking earnestly -->
    <ellipse cx="0" cy="22" rx="14" ry="4" fill="#a85838"/>
    <path d="M-14,20 Q0,24 14,20" fill="none" stroke="#5a2818" stroke-width="0.85"/>

    <!-- FRECKLES -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="-30" cy="-14" r="1.4"/>
      <circle cx="-20" cy="-8" r="1.4"/>
      <circle cx="-10" cy="-14" r="1.2"/>
      <circle cx="0" cy="-10" r="1.2"/>
      <circle cx="10" cy="-14" r="1.2"/>
      <circle cx="20" cy="-8" r="1.4"/>
      <circle cx="30" cy="-14" r="1.4"/>
    </g>

    <!-- Cool light tinge from below (camp glow) -->
    <path d="M-78,40 Q0,80 78,40 L70,80 Q0,90 -70,80 Z" fill="#a8c0e0" opacity="0.25"/>
  </g>

  <!-- Faint floorboard frame at bottom (we're looking from camp up through gap) -->
  <rect x="0" y="340" width="366" height="24" fill="#3a2010" opacity="0.85"/>
  <line x1="0" y1="344" x2="366" y2="344" stroke="#1a0c04" stroke-width="0.85"/>

  <!-- DIALOGUE — Theodore: Ma'am. I haven't told anyone. I won't. -->
  <g>
    <rect x="14" y="14" width="280" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M150,58 L160,58 L152,70 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M152,58 L158,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Ma'am. I haven't told anyone. I won't.</text>

  <!-- DIALOGUE — Theodore: But I can show you something. If you'll let me. -->
  <g>
    <rect x="60" y="74" width="296" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,118 L190,118 L182,130 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M182,118 L188,118" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="68" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="68" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">But I can show you something. If you'll let me.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 180,82 Q300,84 366,80"/>
    <path d="M0,300 Q60,302 180,298 Q300,296 366,300"/>
  </g>
</svg>
