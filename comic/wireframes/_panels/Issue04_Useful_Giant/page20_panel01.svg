<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 20 — Panel 1: Theodore walks home through Clerkenwell at dusk — lamplighter, workers, last sunset</title>
  <desc>28mm wide establishing. Human scale. Theodore walks right-to-left, hands in pockets. Lamplighter igniting a gas lamp ahead, mantle catching with warm flare. Workers pass other direction. Shop windows glow. Chimney smoke into violet-grey sky with last bruised orange of sunset behind rooflines. The boy with the secret moves through ordinary world.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p20p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2858"/>
      <stop offset="35%" stop-color="#5a3858"/>
      <stop offset="65%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#c87848"/>
    </linearGradient>
    <linearGradient id="p20p1buildings" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="p20p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p20p1theoSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p20p1lampFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffaa48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p1lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p1shopWindow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p20p1glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- SKY — deep violet-grey with last bruised orange at horizon -->
  <rect width="742" height="180" fill="url(#p20p1sky)"/>

  <!-- ROOFLINE silhouettes — Victorian London -->
  <g fill="#1a0c08">
    <path d="M0,140 L0,180 L80,180 L80,120 L120,120 L120,100 L160,100 L160,140 L220,140 L220,110 L280,110 L280,130 L320,130 L320,90 L360,90 L360,120 L420,120 L420,140 L480,140 L480,100 L540,100 L540,130 L600,130 L600,110 L660,110 L660,140 L742,140 L742,180 Z"/>
  </g>
  <!-- CHIMNEYS -->
  <g fill="#0a0604">
    <rect x="40" y="124" width="14" height="20"/>
    <rect x="120" y="84" width="12" height="22"/>
    <rect x="240" y="94" width="14" height="20"/>
    <rect x="320" y="74" width="12" height="20"/>
    <rect x="380" y="104" width="14" height="20"/>
    <rect x="500" y="84" width="12" height="22"/>
    <rect x="600" y="94" width="14" height="20"/>
    <rect x="680" y="124" width="12" height="22"/>
  </g>
  <!-- CHIMNEY SMOKE — drifting -->
  <g opacity="0.55" fill="#5a4838">
    <ellipse cx="46" cy="118" rx="14" ry="6"/>
    <ellipse cx="50" cy="106" rx="12" ry="4.4"/>
    <ellipse cx="56" cy="94" rx="10" ry="3.4"/>
    <ellipse cx="126" cy="78" rx="14" ry="5"/>
    <ellipse cx="136" cy="64" rx="14" ry="4"/>
    <ellipse cx="146" cy="50" rx="12" ry="3"/>
    <ellipse cx="246" cy="88" rx="14" ry="5"/>
    <ellipse cx="386" cy="98" rx="14" ry="5"/>
    <ellipse cx="394" cy="84" rx="14" ry="4"/>
    <ellipse cx="506" cy="78" rx="14" ry="5"/>
    <ellipse cx="606" cy="88" rx="14" ry="5"/>
  </g>

  <!-- BUILDINGS — front face -->
  <rect x="0" y="180" width="742" height="120" fill="url(#p20p1buildings)"/>

  <!-- WINDOWS — lit from within (warm) and dark -->
  <g>
    <!-- Shop on left (pie shop) -->
    <rect x="40" y="200" width="80" height="60" fill="#3a2818"/>
    <rect x="44" y="204" width="72" height="52" fill="#ffd078" opacity="0.85" filter="url(#p20p1bloom)"/>
    <ellipse cx="80" cy="230" rx="60" ry="40" fill="url(#p20p1shopWindow)" filter="url(#p20p1glow)" opacity="0.7"/>
    <line x1="80" y1="204" x2="80" y2="256" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="44" y1="230" x2="116" y2="230" stroke="#1a0c04" stroke-width="0.7"/>
    <!-- Shop sign -->
    <rect x="36" y="190" width="88" height="12" fill="#3a1808"/>
    <text x="80" y="199" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#ffd078" font-style="italic" font-weight="700" opacity="0.85">PIES</text>

    <!-- Mid-distance windows (warm, smaller) -->
    <rect x="200" y="210" width="40" height="44" fill="#3a2818"/>
    <rect x="204" y="214" width="32" height="36" fill="#ffd078" opacity="0.65"/>
    <ellipse cx="220" cy="232" rx="32" ry="22" fill="url(#p20p1shopWindow)" filter="url(#p20p1glow)" opacity="0.45"/>

    <!-- Right-side dark windows -->
    <rect x="540" y="200" width="40" height="48" fill="#3a2818"/>
    <rect x="544" y="204" width="32" height="40" fill="#1a0c04" opacity="0.85"/>
    <rect x="600" y="210" width="40" height="40" fill="#3a2818"/>
    <rect x="604" y="214" width="32" height="32" fill="#1a0c04" opacity="0.8"/>
    <rect x="640" y="220" width="40" height="36" fill="#3a2818"/>
    <rect x="644" y="224" width="32" height="28" fill="#3a2828" opacity="0.7"/>
  </g>

  <!-- COBBLESTONES with reflective gaslight -->
  <rect x="0" y="300" width="742" height="64" fill="url(#p20p1cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <path d="M0,320 Q200,318 400,322 Q580,324 742,320"/>
    <path d="M0,340 Q200,342 400,338 Q580,336 742,340"/>
    <path d="M0,358 Q200,356 400,360 Q580,362 742,358"/>
  </g>
  <g fill="#1a0c04" opacity="0.55">
    <circle cx="60" cy="312" r="1.2"/>
    <circle cx="180" cy="318" r="1.2"/>
    <circle cx="280" cy="312" r="1.2"/>
    <circle cx="500" cy="318" r="1.2"/>
    <circle cx="620" cy="312" r="1.2"/>
    <circle cx="100" cy="335" r="1.2"/>
    <circle cx="240" cy="345" r="1.2"/>
    <circle cx="380" cy="335" r="1.2"/>
    <circle cx="540" cy="345" r="1.2"/>
    <circle cx="80" cy="356" r="1.2"/>
    <circle cx="220" cy="350" r="1.2"/>
    <circle cx="360" cy="356" r="1.2"/>
    <circle cx="500" cy="350" r="1.2"/>
    <circle cx="640" cy="356" r="1.2"/>
  </g>

  <!-- Cobblestone amber pools (where gaslight reaches) -->
  <ellipse cx="80" cy="340" rx="100" ry="22" fill="#ffaa48" opacity="0.18" filter="url(#p20p1glow)"/>
  <ellipse cx="380" cy="340" rx="120" ry="24" fill="#ffaa48" opacity="0.22" filter="url(#p20p1glow)"/>

  <!-- ===== GAS LAMP being lit, mid-frame ===== -->
  <g transform="translate(380 196)">
    <!-- Halo + flare -->
    <ellipse cx="0" cy="0" rx="80" ry="65" fill="url(#p20p1lampFlare)" filter="url(#p20p1glow)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="22" ry="18" fill="#fff8e8" opacity="0.85" filter="url(#p20p1bloom)"/>
    <!-- Lamp post -->
    <rect x="-3" y="0" width="6" height="100" fill="#1a0c04"/>
    <rect x="-7" y="100" width="14" height="6" fill="#1a0c04"/>
    <!-- Lamp head -->
    <rect x="-12" y="-12" width="24" height="14" fill="#3a2818" stroke="#0a0604" stroke-width="0.6"/>
    <rect x="-10" y="-10" width="20" height="10" fill="#1a0c04"/>
    <!-- Flame -->
    <circle cx="0" cy="-6" r="6" fill="#fff8e8" filter="url(#p20p1bloom)"/>
    <circle cx="0" cy="-6" r="3" fill="#ffd078"/>
    <!-- Crossbar (lamplighter ladder rests) -->
    <line x1="-9" y1="-15" x2="9" y2="-15" stroke="#3a2818" stroke-width="1"/>
  </g>

  <!-- LAMPLIGHTER — at base of lamp post, pole reaching up -->
  <g transform="translate(360 280)">
    <!-- Lamplighter pole -->
    <line x1="0" y1="0" x2="20" y2="-90" stroke="#3a2018" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Hook end of pole -->
    <path d="M20,-90 L24,-92 L22,-86" fill="none" stroke="#3a2018" stroke-width="1.4"/>
    <!-- BODY -->
    <ellipse cx="-6" cy="40" rx="3.5" ry="1.5" fill="#0a0408"/>
    <ellipse cx="6" cy="40" rx="3.5" ry="1.5" fill="#0a0408"/>
    <rect x="-8" y="14" width="6" height="26" fill="#3a2010"/>
    <rect x="2" y="14" width="6" height="26" fill="#3a2010"/>
    <path d="M-12,14 L-12,-14 L12,-14 L12,14 Z" fill="#3a2010"/>
    <!-- Coat tail -->
    <path d="M-12,14 L-14,30 L-2,32 L-2,14 Z" fill="#3a2010"/>
    <!-- Right arm holding pole, raised -->
    <path d="M12,-14 L20,-30 L26,-44 L20,-46 L14,-32 L8,-14 Z" fill="#3a2010"/>
    <ellipse cx="24" cy="-44" rx="3" ry="2.4" fill="#a86838"/>
    <!-- Left arm down -->
    <rect x="-16" y="-14" width="4" height="22" fill="#3a2010"/>
    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="6" ry="7.5" fill="#a86838"/>
    <!-- Cap -->
    <path d="M-6,-30 L-6,-26 Q-6,-32 0,-32 Q6,-32 6,-26 L6,-30 Z" fill="#0a0604"/>
    <ellipse cx="0" cy="-30" rx="6" ry="2" fill="#0a0604"/>
    <!-- Brim -->
    <ellipse cx="3" cy="-26" rx="4" ry="1" fill="#1a0c04"/>
    <!-- Eyes/mouth (looking up at his work) -->
    <circle cx="-1" cy="-22" r="0.7" fill="#0a0604"/>
    <circle cx="3" cy="-22" r="0.7" fill="#0a0604"/>
  </g>

  <!-- Worker passing right (man w/ cap) -->
  <g transform="translate(280 296)">
    <ellipse cx="-3" cy="32" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="32" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="10" width="4" height="22" fill="#2a1810"/>
    <rect x="1" y="10" width="4" height="22" fill="#2a1810"/>
    <path d="M-9,10 L-9,-10 L9,-10 L9,10 Z" fill="#3a2010"/>
    <path d="M-9,10 L-12,28 L0,28 L0,10 Z" fill="#3a2010"/>
    <rect x="-13" y="-10" width="4" height="20" fill="#3a2010"/>
    <rect x="9" y="-10" width="4" height="20" fill="#3a2010"/>
    <ellipse cx="0" cy="-16" rx="5" ry="6" fill="#a86838"/>
    <!-- cap -->
    <path d="M-5,-22 Q-4,-26 0,-26 Q4,-26 5,-22 L4,-19 L-4,-19 Z" fill="#0a0604"/>
    <ellipse cx="3" cy="-19" rx="3.5" ry="0.8" fill="#1a0c04"/>
    <circle cx="-1" cy="-16" r="0.5" fill="#0a0604"/>
    <circle cx="2" cy="-16" r="0.5" fill="#0a0604"/>
  </g>

  <!-- Woman with basket -->
  <g transform="translate(220 296)">
    <ellipse cx="-3" cy="32" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="32" rx="3" ry="1.5" fill="#0a0408"/>
    <!-- Long skirt -->
    <path d="M-9,10 L-12,32 L12,32 L9,10 Z" fill="#3a2030"/>
    <path d="M-9,10 L-9,-8 L9,-8 L9,10 Z" fill="#5a2030"/>
    <!-- Shawl -->
    <path d="M-10,-8 L-12,2 L0,4 L0,-8 Z" fill="#3a1828"/>
    <rect x="-13" y="-8" width="4" height="20" fill="#5a2030"/>
    <rect x="9" y="-8" width="4" height="14" fill="#5a2030"/>
    <!-- Basket -->
    <rect x="11" y="6" width="10" height="8" fill="#5a3018" stroke="#3a1808" stroke-width="0.5"/>
    <ellipse cx="16" cy="6" rx="5" ry="1" fill="#3a1808"/>
    <ellipse cx="0" cy="-14" rx="5" ry="6" fill="#a86838"/>
    <!-- Bonnet -->
    <path d="M-6,-22 Q-5,-26 0,-26 Q5,-26 6,-22 L5,-18 L-5,-18 Z" fill="#3a1828"/>
    <circle cx="-1" cy="-14" r="0.5" fill="#0a0604"/>
    <circle cx="2" cy="-14" r="0.5" fill="#0a0604"/>
  </g>

  <!-- Errand boy younger than Theodore, running -->
  <g transform="translate(180 304)">
    <ellipse cx="-3" cy="22" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="6" cy="22" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="6" width="4" height="16" fill="#2a1810"/>
    <rect x="3" y="2" width="4" height="20" fill="#2a1810"/>
    <path d="M-7,6 L-7,-8 L7,-8 L7,6 Z" fill="#3a2010"/>
    <rect x="-11" y="-8" width="4" height="14" fill="#3a2010"/>
    <rect x="7" y="-8" width="4" height="14" fill="#3a2010"/>
    <ellipse cx="0" cy="-14" rx="4" ry="5" fill="#a86838"/>
    <!-- Cap -->
    <path d="M-5,-20 Q-4,-23 0,-23 Q4,-23 5,-20 L4,-17 L-4,-17 Z" fill="#0a0604"/>
    <circle cx="-1" cy="-13" r="0.5" fill="#0a0604"/>
    <circle cx="2" cy="-13" r="0.5" fill="#0a0604"/>
  </g>

  <!-- THEODORE — center-right, walking right-to-left, hands in pockets, hunched against cold -->
  <g transform="translate(540 280)">
    <!-- Boots -->
    <ellipse cx="-4" cy="50" rx="5" ry="2.4" fill="#1a0c04"/>
    <ellipse cx="4" cy="50" rx="5" ry="2.4" fill="#1a0c04"/>
    <!-- Scuff marks on boots -->
    <ellipse cx="-3" cy="48" rx="2" ry="0.7" fill="#5a4838" opacity="0.7"/>
    <ellipse cx="5" cy="48" rx="2" ry="0.7" fill="#5a4838" opacity="0.7"/>
    <!-- Patched wool trousers -->
    <rect x="-7" y="22" width="6" height="28" fill="url(#p20p1theoSuit)"/>
    <rect x="1" y="22" width="6" height="28" fill="url(#p20p1theoSuit)"/>
    <!-- patch -->
    <rect x="-6" y="34" width="4" height="4" fill="#7a4838" opacity="0.85" stroke="#5a3818" stroke-width="0.3"/>
    <!-- Linen shirt visible at neck -->
    <rect x="-5" y="-8" width="10" height="6" fill="#d8c8a8"/>
    <!-- Leather waistcoat (too large) -->
    <path d="M-12,22 L-12,-6 L12,-6 L12,22 Z" fill="#5a2828"/>
    <line x1="0" y1="-6" x2="0" y2="20" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Buttons -->
    <circle cx="0" cy="0" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="6" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="12" r="0.7" fill="#5a3818"/>
    <!-- Shoulders hunched against cold -->
    <path d="M-12,-6 Q-8,-14 -2,-16 Q4,-16 8,-12 L12,-6 Z" fill="#5a2828"/>
    <!-- Arms in pockets - tucked tight -->
    <path d="M-12,-6 L-16,8 L-10,16 L-2,18 L-2,16 L-8,12 L-10,4 L-10,-4 Z" fill="#5a2828"/>
    <path d="M12,-6 L16,8 L10,16 L2,18 L2,16 L8,12 L10,4 L10,-4 Z" fill="#5a2828"/>
    <!-- Hands tucked into pockets — bumps in fabric -->
    <ellipse cx="-7" cy="20" rx="4" ry="3" fill="url(#p20p1theoSuit)"/>
    <ellipse cx="7" cy="20" rx="4" ry="3" fill="url(#p20p1theoSuit)"/>
    <!-- FAINT BLUE-WHITE GLOW from pocket — the shard -->
    <ellipse cx="7" cy="22" rx="6" ry="4" fill="#88aaff" opacity="0.3" filter="url(#p20p1glow)"/>

    <!-- Head (3/4 angle facing slightly left as he walks left) -->
    <ellipse cx="0" cy="-26" rx="9" ry="11" fill="#a86838"/>
    <!-- Sandy-brown hair -->
    <path d="M-7,-36 Q-6,-39 0,-40 Q6,-40 7,-36 L7,-30 Q4,-34 0,-34 Q-4,-34 -7,-30 Z" fill="#a87838"/>
    <path d="M-3,-37 L-2,-32" stroke="#7a5028" stroke-width="0.7" opacity="0.85"/>
    <!-- Freckles -->
    <circle cx="-3" cy="-25" r="0.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="3" cy="-25" r="0.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="0" cy="-23" r="0.4" fill="#5a3018" opacity="0.85"/>
    <!-- Eyes — bright + secret -->
    <ellipse cx="-3" cy="-26" rx="1.6" ry="1" fill="#fff8e8"/>
    <ellipse cx="-3" cy="-25" rx="1" ry="0.7" fill="#7a4818"/>
    <circle cx="-3" cy="-25" r="0.5" fill="#0a0604"/>
    <circle cx="-3" cy="-26" r="0.3" fill="#fff8e8" filter="url(#p20p1bloom)"/>
    <ellipse cx="3" cy="-26" rx="1.6" ry="1" fill="#fff8e8"/>
    <ellipse cx="3" cy="-25" rx="1" ry="0.7" fill="#7a4818"/>
    <circle cx="3" cy="-25" r="0.5" fill="#0a0604"/>
    <circle cx="3" cy="-26" r="0.3" fill="#fff8e8" filter="url(#p20p1bloom)"/>
    <!-- Mouth — set in line that could be suppressed grin or anxiety -->
    <path d="M-3,-19 Q0,-18 3,-19" stroke="#3a1808" stroke-width="0.7" fill="none"/>
    <!-- Breath fog -->
    <ellipse cx="0" cy="-15" rx="3" ry="1.4" fill="#fff8e8" opacity="0.45" filter="url(#p20p1bloom)"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
