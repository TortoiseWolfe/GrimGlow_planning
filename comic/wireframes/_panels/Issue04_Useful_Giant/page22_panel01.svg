<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 22 — Panel 1: Camp at night — sleeping squad — Luma alone with vigil at the margin</title>
  <desc>28mm wide. Wall-cavity camp in near-darkness. Wren curled near her gear, Jink sprawled on high beam arm dangling, Sable rigid on back clutching data module, Thresh seated upright against post weapon across knees eyes closed. Perimeter pulses minimum. At the far end a small blue-violet light glows where Luma sits alone with a projection.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p22p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="p22p1beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="p22p1silverPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dad5d0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a5860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p1copperPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p1emeraldPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a8848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p1crimsonPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a0828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p1sapphireProjection" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p22p1glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- Deep void -->
  <rect width="742" height="364" fill="url(#p22p1bg)"/>

  <!-- Timber beams structure (camp interior) -->
  <g opacity="0.85">
    <rect x="0" y="40" width="742" height="14" fill="url(#p22p1beam)"/>
    <rect x="0" y="180" width="742" height="14" fill="url(#p22p1beam)"/>
    <rect x="0" y="320" width="742" height="14" fill="url(#p22p1beam)"/>
    <rect x="20" y="0" width="14" height="364" fill="url(#p22p1beam)"/>
    <rect x="200" y="0" width="14" height="364" fill="url(#p22p1beam)"/>
    <rect x="380" y="0" width="14" height="364" fill="url(#p22p1beam)"/>
    <rect x="540" y="0" width="14" height="364" fill="url(#p22p1beam)"/>
  </g>

  <!-- Brick visible behind -->
  <g opacity="0.4">
    <path d="M40,80 Q140,82 200,78" stroke="#5a2818" stroke-width="0.6" fill="none"/>
    <path d="M214,80 Q300,82 380,78" stroke="#5a2818" stroke-width="0.6" fill="none"/>
    <path d="M394,80 Q460,82 540,78" stroke="#5a2818" stroke-width="0.6" fill="none"/>
    <path d="M40,140 Q140,138 200,140" stroke="#5a2818" stroke-width="0.6" fill="none"/>
    <path d="M214,140 Q300,138 380,140" stroke="#5a2818" stroke-width="0.6" fill="none"/>
  </g>

  <!-- HOLOGRAPHIC PERIMETER — minimum pulse, dim -->
  <g stroke="#a8c0ff" stroke-width="0.4" fill="none" opacity="0.35" filter="url(#p22p1bloom)" stroke-dasharray="2 2">
    <rect x="80" y="60" width="380" height="220"/>
  </g>
  <g fill="#88aaff" opacity="0.6" filter="url(#p22p1bloom)">
    <circle cx="80" cy="60" r="0.85"/>
    <circle cx="460" cy="60" r="0.85"/>
    <circle cx="80" cy="280" r="0.85"/>
    <circle cx="460" cy="280" r="0.85"/>
  </g>

  <!-- POWER CELL on ledge — minimum -->
  <g transform="translate(140 230)">
    <rect x="-6" y="-5" width="12" height="10" fill="#3a2068" stroke="#a888e8" stroke-width="0.4" opacity="0.85"/>
    <rect x="-4" y="-3" width="8" height="6" fill="#ffaa48" filter="url(#p22p1bloom)" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#ffaa48" opacity="0.18" filter="url(#p22p1glow)"/>
  </g>

  <!-- ===== SLEEPING SQUAD ===== -->

  <!-- WREN curled near gear (mid-left, on lower beam) -->
  <g transform="translate(180 285)">
    <ellipse cx="0" cy="0" rx="34" ry="24" fill="url(#p22p1copperPulse)" filter="url(#p22p1glow)" opacity="0.45"/>
    <!-- curled body shape -->
    <path d="M-12,8 Q-6,-8 8,-8 Q14,-6 16,2 Q14,8 6,10 Q-2,12 -10,10 Z" fill="#3a2010" stroke="#1a0c04" stroke-width="0.4"/>
    <!-- Hand still touching component -->
    <ellipse cx="14" cy="6" rx="3" ry="2" fill="#a86838" opacity="0.85"/>
    <!-- tiny brass component beside her -->
    <rect x="18" y="4" width="6" height="4" fill="#a87838" opacity="0.85"/>
    <!-- Suit accent -->
    <line x1="-6" y1="-2" x2="8" y2="-2" stroke="#ffd078" stroke-width="0.6" opacity="0.65" filter="url(#p22p1bloom)"/>
    <!-- bun -->
    <circle cx="-10" cy="-6" r="2" fill="#0a0604"/>
  </g>

  <!-- JINK sprawled on high beam, arm dangling (left-center, top beam) -->
  <g transform="translate(120 60)">
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="url(#p22p1emeraldPulse)" filter="url(#p22p1glow)" opacity="0.45"/>
    <!-- Body sprawled -->
    <ellipse cx="0" cy="-2" rx="14" ry="6" fill="#0a8848" opacity="0.85"/>
    <ellipse cx="-6" cy="-4" rx="5" ry="4" fill="#0a8848" opacity="0.85"/>
    <!-- Head turned to side -->
    <ellipse cx="-12" cy="-4" rx="4" ry="3" fill="#a86838"/>
    <!-- Golden curls -->
    <ellipse cx="-13" cy="-7" rx="4" ry="2" fill="#ffd078"/>
    <!-- ARM DANGLING down -->
    <path d="M14,2 L16,8 L18,18 L16,20 L14,16 L13,8 Z" fill="#0a8848" opacity="0.85"/>
    <ellipse cx="17" cy="22" rx="2.4" ry="1.6" fill="#a86838"/>
    <!-- Suit dot accent -->
    <circle cx="0" cy="-2" r="0.8" fill="#2ed078" filter="url(#p22p1bloom)"/>
  </g>

  <!-- SABLE on back, RIGID, clutching data module to chest (center) -->
  <g transform="translate(280 200)">
    <ellipse cx="0" cy="0" rx="34" ry="14" fill="url(#p22p1silverPulse)" filter="url(#p22p1glow)" opacity="0.4"/>
    <!-- Body laid flat, rigid -->
    <rect x="-22" y="-6" width="44" height="12" fill="#5a5860" rx="1.4" opacity="0.85"/>
    <!-- DATA MODULE clutched to chest -->
    <rect x="-4" y="-10" width="8" height="6" fill="#3a3038" stroke="#5a606a" stroke-width="0.4" opacity="0.95"/>
    <ellipse cx="0" cy="-7" rx="2" ry="1.4" fill="#a8c0ff" opacity="0.45" filter="url(#p22p1bloom)"/>
    <!-- Hands on top of module (clutching) -->
    <ellipse cx="-4" cy="-6" rx="3" ry="1.6" fill="#7a4838" opacity="0.85"/>
    <ellipse cx="4" cy="-6" rx="3" ry="1.6" fill="#7a4838" opacity="0.85"/>
    <!-- Head -->
    <ellipse cx="-26" cy="0" rx="5" ry="4" fill="#7a4838"/>
    <!-- Silver buzz -->
    <ellipse cx="-26" cy="-3" rx="4" ry="1.6" fill="#e0d8d0"/>
    <!-- Eyes closed, lashes -->
    <line x1="-29" y1="-1" x2="-26" y2="-1" stroke="#0a0604" stroke-width="0.55"/>
    <line x1="-26" y1="-1" x2="-23" y2="-1" stroke="#0a0604" stroke-width="0.55"/>
    <!-- Suit accent line -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#a8c0ff" stroke-width="0.5" opacity="0.65" filter="url(#p22p1bloom)"/>
  </g>

  <!-- THRESH seated upright against post, weapon across knees, eyes closed but watching -->
  <g transform="translate(420 240)">
    <ellipse cx="0" cy="0" rx="28" ry="36" fill="url(#p22p1crimsonPulse)" filter="url(#p22p1glow)" opacity="0.4"/>
    <!-- Body seated upright -->
    <rect x="-7" y="-22" width="14" height="34" fill="#8a0828" rx="1" opacity="0.92"/>
    <!-- Head leaning slightly forward -->
    <ellipse cx="0" cy="-28" rx="5" ry="6" fill="#a86838"/>
    <!-- Copper-red buzz -->
    <ellipse cx="0" cy="-31" rx="4" ry="1.4" fill="#c84838"/>
    <!-- Eyes CLOSED -->
    <line x1="-3" y1="-28" x2="-1" y2="-28" stroke="#0a0604" stroke-width="0.5"/>
    <line x1="1" y1="-28" x2="3" y2="-28" stroke="#0a0604" stroke-width="0.5"/>
    <!-- Mouth set -->
    <path d="M-2,-23 L2,-23" stroke="#3a1808" stroke-width="0.5"/>
    <!-- Dented LEFT pauldron -->
    <ellipse cx="-7" cy="-22" rx="3" ry="2" fill="#5a0818"/>
    <!-- WEAPON across knees -->
    <rect x="-22" y="14" width="44" height="3" fill="#3a3030"/>
    <rect x="22" y="13" width="3" height="5" fill="#1a1a1a"/>
    <!-- White-knuckle grip -->
    <ellipse cx="-16" cy="15" rx="3" ry="1.4" fill="#fff8e8" opacity="0.7"/>
    <!-- Legs out flat -->
    <rect x="-8" y="12" width="6" height="12" fill="#dc2030" opacity="0.85"/>
    <rect x="2" y="12" width="6" height="12" fill="#dc2030" opacity="0.85"/>
    <!-- Leg scuffs -->
    <ellipse cx="-5" cy="20" rx="2" ry="0.8" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="5" cy="20" rx="2" ry="0.8" fill="#1a0c04" opacity="0.7"/>
  </g>

  <!-- ===== LUMA — far end, alone with projection ===== -->
  <g transform="translate(620 230)">
    <!-- Sapphire-violet projection halo -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="url(#p22p1sapphireProjection)" filter="url(#p22p1glow)" opacity="0.92"/>
    <!-- Floating projection (geometric script) — small from this distance -->
    <g stroke="#a8c0ff" stroke-width="0.5" fill="none" opacity="0.85" filter="url(#p22p1bloom)">
      <path d="M-18,-12 L-12,-18 L0,-18 L6,-12 L6,0 L0,6 L-12,6 L-18,0 Z"/>
      <line x1="-6" y1="-18" x2="-6" y2="6"/>
      <line x1="-18" y1="-6" x2="6" y2="-6"/>
    </g>
    <!-- Luma seated against timber upright -->
    <!-- Body -->
    <rect x="2" y="-2" width="9" height="22" fill="#5a3ad8" rx="0.85"/>
    <!-- Legs folded -->
    <ellipse cx="14" cy="22" rx="6" ry="3" fill="#5a3ad8"/>
    <!-- Head -->
    <ellipse cx="6" cy="-12" rx="3.4" ry="4.4" fill="#7a4838"/>
    <!-- Hair top -->
    <ellipse cx="6" cy="-15" rx="3" ry="1.4" fill="#0a0604"/>
    <!-- Braid trailing -->
    <path d="M9,-9 Q12,-2 14,8" stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M9,-9 Q12,-2 14,8" stroke="#a888e8" stroke-width="0.4" fill="none" opacity="0.85" filter="url(#p22p1bloom)"/>
    <!-- Eyes (looking at projection, awake) -->
    <ellipse cx="4" cy="-12" rx="0.6" ry="0.4" fill="#fff8e8"/>
    <circle cx="4" cy="-12" r="0.3" fill="#0a0604"/>
    <ellipse cx="8" cy="-12" rx="0.6" ry="0.4" fill="#fff8e8"/>
    <circle cx="8" cy="-12" r="0.3" fill="#0a0604"/>
    <!-- Suit accent -->
    <line x1="3" y1="2" x2="10" y2="2" stroke="#a888e8" stroke-width="0.4" opacity="0.85" filter="url(#p22p1bloom)"/>
  </g>

  <!-- Faint dust particles in void -->
  <g fill="#5a4838" opacity="0.45">
    <circle cx="80" cy="120" r="0.65"/>
    <circle cx="320" cy="100" r="0.7"/>
    <circle cx="500" cy="150" r="0.55"/>
    <circle cx="660" cy="120" r="0.6"/>
    <circle cx="140" cy="160" r="0.65"/>
    <circle cx="40" cy="220" r="0.7"/>
    <circle cx="700" cy="200" r="0.55"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
