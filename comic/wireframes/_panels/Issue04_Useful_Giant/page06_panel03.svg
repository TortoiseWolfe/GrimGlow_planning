<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 6 — Panel 3: Squad positions on upper level, Sable presents two options</title>
  <desc>35mm medium wide. Five squad arranged near floorboard gap above. Sable center-facing-group, Jink right-isolated, Thresh behind hand-on-holster, Wren leaning timber-arms-crossed, Luma between-Sable-and-gap with active lenses. Theodore's warm silhouette through gap above. Sable: This is a containment problem. We have two options. / We relocate. Abandon this position. He has no way to follow. / Wren: And the second option?</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p6p3timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <radialGradient id="p6p3gapGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#d8c8a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a89888" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p6p3silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p6p3emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <linearGradient id="p6p3crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d83040"/>
      <stop offset="100%" stop-color="#7a1018"/>
    </linearGradient>
    <linearGradient id="p6p3copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88a45"/>
      <stop offset="100%" stop-color="#88481a"/>
    </linearGradient>
    <linearGradient id="p6p3sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p6p3darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p6p3jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p6p3threshSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8a888"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="p6p3wrenSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <radialGradient id="p6p3perim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p3bloom"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p6p3bg)"/>

  <!-- Top: floorboard ceiling with gap visible (Theodore's silhouette) -->
  <rect x="0" y="0" width="742" height="60" fill="url(#p6p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="20" x2="742" y2="20"/>
    <line x1="0" y1="44" x2="742" y2="44"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M40,30 Q200,36 400,30 Q580,32 700,30"/>
  </g>

  <!-- THE GAP in floorboards (Theodore's silhouette through it) -->
  <g>
    <rect x="280" y="20" width="184" height="20" fill="url(#p6p3gapGlow)" filter="url(#p6p3bloom)"/>
    <rect x="280" y="20" width="184" height="20" fill="#a89888" opacity="0.65"/>
    <!-- Theodore's eye + nose silhouette through gap -->
    <ellipse cx="372" cy="30" rx="40" ry="8" fill="#5a3828" opacity="0.85"/>
    <circle cx="360" cy="30" r="3" fill="#1a0c04"/>
    <circle cx="384" cy="30" r="3" fill="#1a0c04"/>
    <!-- Gap edges -->
    <rect x="280" y="20" width="184" height="2" fill="#1a0c04"/>
    <rect x="280" y="38" width="184" height="2" fill="#1a0c04"/>
  </g>

  <!-- Brick walls hint -->
  <rect x="0" y="60" width="60" height="220" fill="#2a1810" opacity="0.7"/>
  <rect x="682" y="60" width="60" height="220" fill="#2a1810" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.4">
    <line x1="0" y1="100" x2="60" y2="100"/>
    <line x1="0" y1="160" x2="60" y2="160"/>
    <line x1="0" y1="220" x2="60" y2="220"/>
    <line x1="682" y1="100" x2="742" y2="100"/>
    <line x1="682" y1="160" x2="742" y2="160"/>
    <line x1="682" y1="220" x2="742" y2="220"/>
  </g>

  <!-- LEFT timber upright (Wren leans on this) -->
  <rect x="80" y="40" width="36" height="240" fill="url(#p6p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.5" fill="none">
    <path d="M88,80 Q96,90 104,80"/>
    <path d="M88,160 Q96,170 104,160"/>
  </g>
  <!-- RIGHT timber upright -->
  <rect x="626" y="40" width="36" height="240" fill="url(#p6p3timber)"/>

  <!-- TIMBER BEAM (foot level for squad) -->
  <rect x="40" y="280" width="662" height="40" fill="url(#p6p3timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="40" y1="282" x2="702" y2="282"/>
    <line x1="40" y1="316" x2="702" y2="316"/>
  </g>

  <!-- Perimeter emitters at far corners -->
  <g transform="translate(140 270)">
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="url(#p6p3perim)" filter="url(#p6p3bloom)"/>
    <path d="M-3,-5 L0,-7 L3,-5 L4,0 L2,5 L-2,5 L-4,0 Z" fill="#a8c0e0"/>
  </g>
  <g transform="translate(620 270)">
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="url(#p6p3perim)" filter="url(#p6p3bloom)"/>
    <path d="M-3,-5 L0,-7 L3,-5 L4,0 L2,5 L-2,5 L-4,0 Z" fill="#a8c0e0"/>
  </g>

  <!-- Power cell on right ledge -->
  <rect x="540" y="248" width="30" height="6" fill="#3a2818"/>
  <g transform="translate(555 240)">
    <path d="M-9,-12 L0,-18 L9,-12 L10,0 L-10,0 Z" fill="#d8a838"/>
    <ellipse cx="0" cy="-10" r="4" fill="#ffe8a8"/>
  </g>

  <!-- ===== SQUAD POSITIONS ===== -->

  <!-- Wren (FAR LEFT, leaning on timber upright, arms crossed) -->
  <g transform="translate(140 282)">
    <ellipse cx="0" cy="0" rx="13" ry="2.4" fill="#0a0604" opacity="0.6"/>
    <!-- Legs (slightly leaning) -->
    <path d="M-7,-40 L-10,-2 L-3,0 L-1,-40 Z" fill="url(#p6p3copper)"/>
    <path d="M1,-40 L3,0 L10,-2 L7,-40 Z" fill="url(#p6p3copper)"/>
    <ellipse cx="-7" cy="-1" rx="3.5" ry="1.4" fill="#5a2810"/>
    <ellipse cx="7" cy="-1" rx="3.5" ry="1.4" fill="#5a2810"/>
    <!-- Copper dust at knees -->
    <ellipse cx="-7" cy="-22" rx="3" ry="0.85" fill="#a86838" opacity="0.55"/>
    <ellipse cx="7" cy="-22" rx="3" ry="0.85" fill="#a86838" opacity="0.55"/>
    <!-- Torso leaning back -->
    <path d="M-12,-70 L-14,-40 L14,-40 L12,-70 Z" fill="url(#p6p3copper)"/>
    <!-- Scorch mark left shoulder -->
    <ellipse cx="-12" cy="-68" rx="4" ry="3" fill="#1a0c04" opacity="0.75"/>
    <path d="M-14,-70 Q-19,-78 -13,-82 L-7,-80 Z" fill="url(#p6p3copper)"/>
    <path d="M14,-70 Q19,-78 13,-82 L7,-80 Z" fill="url(#p6p3copper)"/>
    <!-- ARMS CROSSED -->
    <path d="M-14,-66 Q-16,-58 -8,-54 L8,-56 Q16,-60 14,-66 L8,-64 Q-2,-58 -8,-64 Z" fill="url(#p6p3copper)"/>
    <ellipse cx="-6" cy="-58" rx="5" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="6" cy="-58" rx="5" ry="2" fill="#1a0c04" opacity="0.55"/>
    <!-- Head -->
    <ellipse cx="0" cy="-86" rx="8" ry="10" fill="url(#p6p3wrenSkin)"/>
    <g fill="#1a0c04">
      <path d="M-7,-93 Q-8,-100 0,-101 Q8,-100 7,-93 L5,-88 Q2,-94 -2,-94 Q-5,-94 -7,-88 Z"/>
      <ellipse cx="0" cy="-104" rx="5" ry="4"/>
    </g>
    <ellipse cx="-3" cy="-86" rx="1.4" ry="0.7" fill="#fff8e8"/>
    <circle cx="-3" cy="-86" r="0.5" fill="#1a0c04"/>
    <ellipse cx="3" cy="-86" rx="1.4" ry="0.7" fill="#fff8e8"/>
    <circle cx="3" cy="-86" r="0.5" fill="#1a0c04"/>
    <path d="M-3,-80 Q0,-79 3,-80" fill="none" stroke="#3a2010" stroke-width="0.55"/>
  </g>

  <!-- Thresh (LEFT-CENTER, behind Sable, hand on holster, watching gap) -->
  <g transform="translate(280 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p6p3crimson)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p6p3crimson)"/>
    <ellipse cx="-7" cy="-1" rx="4" ry="1.4" fill="#3a0808"/>
    <ellipse cx="7" cy="-1" rx="4" ry="1.4" fill="#3a0808"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p6p3crimson)"/>
    <path d="M-12,-72 L-12,-50 L12,-50 L12,-72 Z" fill="#a82030" opacity="0.8"/>
    <!-- DENTED LEFT PAULDRON -->
    <path d="M-13,-78 Q-19,-86 -13,-92 L-7,-92 L-9,-76 Z" fill="#a82030"/>
    <ellipse cx="-15" cy="-86" rx="3" ry="1.4" fill="#5a0810" opacity="0.85"/>
    <path d="M13,-78 Q19,-86 13,-92 L7,-92 L9,-76 Z" fill="url(#p6p3crimson)"/>
    <!-- Holstered weapon at hip + hand resting -->
    <rect x="9" y="-58" width="6" height="8" fill="#3a3038"/>
    <ellipse cx="13" cy="-54" rx="3" ry="2" fill="url(#p6p3threshSkin)"/>
    <!-- Other arm at side -->
    <path d="M-13,-76 Q-19,-58 -16,-46 L-10,-48 Q-12,-58 -10,-74 Z" fill="url(#p6p3crimson)"/>
    <ellipse cx="-13" cy="-46" rx="2.4" ry="1.4" fill="url(#p6p3threshSkin)"/>
    <!-- Head — looking UP at gap -->
    <ellipse cx="0" cy="-94" rx="9" ry="11" fill="url(#p6p3threshSkin)"/>
    <g fill="#a83018">
      <path d="M-8,-102 Q-9,-108 0,-110 Q9,-108 8,-102 L6,-96 Q3,-102 -3,-102 Q-6,-102 -8,-96 Z"/>
    </g>
    <ellipse cx="-3" cy="-93" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-94" r="0.55" fill="#0a0604"/>
    <ellipse cx="3" cy="-93" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-94" r="0.55" fill="#0a0604"/>
  </g>

  <!-- SABLE (CENTER) -->
  <g transform="translate(371 282)">
    <ellipse cx="0" cy="0" rx="16" ry="3" fill="#0a0604" opacity="0.7"/>
    <path d="M-8,-50 L-12,-2 L-3,0 L-1,-50 Z" fill="url(#p6p3silver)"/>
    <path d="M1,-50 L3,0 L12,-2 L8,-50 Z" fill="url(#p6p3silver)"/>
    <ellipse cx="-8" cy="-1" rx="4" ry="1.4" fill="#3a3838"/>
    <ellipse cx="8" cy="-1" rx="4" ry="1.4" fill="#3a3838"/>
    <ellipse cx="-8" cy="-26" rx="3" ry="0.85" fill="#7a7080" opacity="0.5"/>
    <ellipse cx="8" cy="-26" rx="3" ry="0.85" fill="#7a7080" opacity="0.5"/>
    <path d="M-14,-86 L-16,-50 L16,-50 L14,-86 Z" fill="url(#p6p3silver)"/>
    <ellipse cx="14" cy="-84" rx="6" ry="4" fill="#3a3038" opacity="0.75"/>
    <path d="M-16,-86 Q-22,-94 -16,-100 L-9,-100 Z" fill="url(#p6p3silver)"/>
    <path d="M16,-86 Q22,-94 16,-100 L9,-100 Z" fill="url(#p6p3silver)"/>
    <circle cx="-10" cy="-94" r="1" fill="#fff8e8" filter="url(#p6p3bloom)"/>
    <circle cx="10" cy="-94" r="1" fill="#fff8e8" filter="url(#p6p3bloom)"/>
    <!-- Arms gesturing slightly outward (presenting options) -->
    <path d="M-16,-86 Q-26,-66 -22,-44 L-14,-46 Q-14,-66 -10,-84 Z" fill="url(#p6p3silver)"/>
    <path d="M16,-86 Q26,-66 22,-44 L14,-46 Q14,-66 10,-84 Z" fill="url(#p6p3silver)"/>
    <ellipse cx="-22" cy="-44" rx="3" ry="2" fill="url(#p6p3darkSkin)"/>
    <ellipse cx="22" cy="-44" rx="3" ry="2" fill="url(#p6p3darkSkin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-110" rx="9" ry="11" fill="url(#p6p3darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-7,-117 Q-8,-123 0,-125 Q8,-123 7,-117 L5,-112 Q2,-117 -2,-117 Q-5,-117 -7,-112 Z"/>
    </g>
    <ellipse cx="-3" cy="-110" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-110" r="0.6" fill="#0a0604"/>
    <ellipse cx="3" cy="-110" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-110" r="0.6" fill="#0a0604"/>
    <path d="M-3,-104 L3,-104" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- LUMA (between Sable and gap, lenses scrolling data) -->
  <g transform="translate(450 282)">
    <ellipse cx="0" cy="0" rx="13" ry="2.4" fill="#0a0604" opacity="0.6"/>
    <path d="M-7,-40 L-10,-2 L-3,0 L-1,-40 Z" fill="url(#p6p3sapphire)"/>
    <path d="M1,-40 L3,0 L10,-2 L7,-40 Z" fill="url(#p6p3sapphire)"/>
    <ellipse cx="-7" cy="-1" rx="3.5" ry="1.4" fill="#1a0838"/>
    <ellipse cx="7" cy="-1" rx="3.5" ry="1.4" fill="#1a0838"/>
    <path d="M-12,-70 L-14,-40 L14,-40 L12,-70 Z" fill="url(#p6p3sapphire)"/>
    <path d="M-14,-70 Q-19,-78 -13,-82 L-7,-80 Z" fill="url(#p6p3sapphire)"/>
    <path d="M14,-70 Q19,-78 13,-82 L7,-80 Z" fill="url(#p6p3sapphire)"/>
    <circle cx="-10" cy="-78" r="0.85" fill="#a888ff" filter="url(#p6p3bloom)"/>
    <circle cx="10" cy="-78" r="0.85" fill="#a888ff" filter="url(#p6p3bloom)"/>
    <path d="M-14,-68 Q-19,-58 -16,-44 L-10,-46 Q-12,-58 -10,-66 Z" fill="url(#p6p3sapphire)"/>
    <path d="M14,-68 Q19,-58 16,-44 L10,-46 Q12,-58 10,-66 Z" fill="url(#p6p3sapphire)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p6p3jinkSkin)"/>
    <ellipse cx="15" cy="-44" rx="2.4" ry="1.4" fill="url(#p6p3jinkSkin)"/>
    <!-- Head + lenses -->
    <ellipse cx="0" cy="-84" rx="8" ry="10" fill="url(#p6p3jinkSkin)"/>
    <g fill="#1a0c04">
      <path d="M-8,-92 Q-8,-100 0,-102 Q8,-100 8,-92 L6,-86 Q3,-92 -3,-92 Q-6,-92 -8,-86 Z"/>
      <path d="M6,-90 Q12,-78 14,-62" stroke="#1a0c04" stroke-width="2" fill="none"/>
    </g>
    <ellipse cx="-3" cy="-86" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p6p3bloom)"/>
    <ellipse cx="3" cy="-86" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p6p3bloom)"/>
  </g>

  <!-- Jink (FAR RIGHT, isolated) -->
  <g transform="translate(560 282)">
    <ellipse cx="0" cy="0" rx="13" ry="2.4" fill="#0a0604" opacity="0.6"/>
    <path d="M-6,-40 L-9,-2 L-3,0 L-1,-40 Z" fill="url(#p6p3emerald)"/>
    <path d="M1,-40 L2,0 L9,-2 L6,-40 Z" fill="url(#p6p3emerald)"/>
    <ellipse cx="-6" cy="-1" rx="3.5" ry="1.4" fill="#1a4830"/>
    <ellipse cx="6" cy="-1" rx="3.5" ry="1.4" fill="#1a4830"/>
    <path d="M-11,-70 L-13,-40 L13,-40 L11,-70 Z" fill="url(#p6p3emerald)"/>
    <path d="M-9,-66 Q-2,-62 4,-66 Q-2,-54 -6,-50 Z" fill="#3a2818" opacity="0.7"/>
    <path d="M-13,-70 Q-19,-78 -13,-82 L-7,-80 Z" fill="url(#p6p3emerald)"/>
    <path d="M13,-70 Q19,-78 13,-82 L7,-80 Z" fill="url(#p6p3emerald)"/>
    <circle cx="-9" cy="-76" r="1" fill="#9aff9a" filter="url(#p6p3bloom)"/>
    <circle cx="9" cy="-76" r="1" fill="#9aff9a" filter="url(#p6p3bloom)"/>
    <path d="M-13,-68 Q-20,-58 -16,-44 L-10,-46 Q-12,-58 -10,-66 Z" fill="url(#p6p3emerald)"/>
    <path d="M13,-68 Q20,-58 16,-44 L10,-46 Q12,-58 10,-66 Z" fill="url(#p6p3emerald)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p6p3jinkSkin)"/>
    <ellipse cx="15" cy="-44" rx="2.4" ry="1.4" fill="url(#p6p3jinkSkin)"/>
    <ellipse cx="0" cy="-84" rx="8" ry="10" fill="url(#p6p3jinkSkin)"/>
    <g fill="#d8a838">
      <circle cx="-7" cy="-92" r="3"/>
      <circle cx="0" cy="-96" r="3.4"/>
      <circle cx="7" cy="-92" r="3"/>
      <circle cx="-9" cy="-88" r="2.2"/>
      <circle cx="9" cy="-88" r="2.2"/>
    </g>
    <ellipse cx="-3" cy="-84" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-84" r="0.6" fill="#1a4830"/>
    <ellipse cx="3" cy="-84" rx="1.5" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-84" r="0.6" fill="#1a4830"/>
  </g>

  <!-- DIALOGUE BOXES -->
  <!-- Sable: This is a containment problem. We have two options. -->
  <g>
    <rect x="14" y="58" width="324" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M180,102 L190,102 L182,116 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M182,102 L188,102" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">This is a containment problem. We have two options.</text>

  <!-- Sable: We relocate. ... -->
  <g>
    <rect x="14" y="124" width="566" height="58" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,182 L270,182 L262,194 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M262,182 L268,182" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">We relocate. Abandon this position, find a new camp,</text>
  <text x="22" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">disappear. He has no way to follow if we don't want to be found.</text>

  <!-- Wren: And the second option? -->
  <g>
    <rect x="14" y="200" width="178" height="44" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M88,244 L98,244 L90,256 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2"/>
    <path d="M90,244 L96,244" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35">WREN</text>
  <text x="22" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">And the second option?</text>

  <!-- Brushwork overlay -->
