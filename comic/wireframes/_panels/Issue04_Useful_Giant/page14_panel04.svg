<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 14 — Panel 4: Luma raises prior-insertion theory + Sable warns</title>
  <desc>Wide. Luma center holding a holographic British Isles map with red-violet cluster pinpoints — Ireland, Scotland, Cornwall, Brittany. Sable left, hand half-raised in warning. Luma: Theodore. These stories — they're consistent across regions you've never communicated with. Ireland, Scotland, Cornwall, Brittany. Same rules. Same creatures. Same fears. / Oral traditions don't do that without a source. / Sable: Luma. / Luma: I know. I know what I'm suggesting.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p14p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1424"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <linearGradient id="p14p4timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p14p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p14p4darkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="100%" stop-color="#7a4838"/>
    </linearGradient>
    <linearGradient id="p14p4sapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5ad8"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p14p4silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <radialGradient id="p14p4mapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0a8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a888ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p14p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p14p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p14p4bg)"/>

  <!-- Brick BG -->
  <rect x="0" y="40" width="742" height="220" fill="#2a1810" opacity="0.65"/>

  <!-- Beam -->
  <rect x="0" y="280" width="742" height="44" fill="url(#p14p4timber)"/>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="282" x2="742" y2="282"/>
    <line x1="0" y1="316" x2="742" y2="316"/>
  </g>

  <!-- HOLOGRAPHIC BRITISH ISLES MAP — large, floating, Luma projecting -->
  <g transform="translate(450 130)">
    <!-- Glow halo -->
    <ellipse cx="0" cy="0" rx="120" ry="100" fill="url(#p14p4mapGlow)" filter="url(#p14p4glow)" opacity="0.6"/>
    <!-- British Isles outline (stylized, not literal) -->
    <g stroke="#a888ff" stroke-width="0.85" fill="none" opacity="0.85">
      <!-- Britain (mainland, larger) -->
      <path d="M0,-50 Q-12,-40 -18,-22 Q-26,-2 -18,18 Q-22,38 -10,46 Q4,40 14,30 Q24,10 18,-10 Q12,-30 4,-46 Q2,-50 0,-50 Z"/>
      <!-- Ireland (left, smaller) -->
      <path d="M-50,-12 Q-58,-2 -56,16 Q-50,30 -38,28 Q-30,18 -32,2 Q-36,-12 -50,-12 Z"/>
      <!-- Brittany hint (lower right corner peninsula) -->
      <path d="M14,30 Q20,40 30,42 Q34,38 30,32 Z"/>
    </g>
    <!-- CLUSTER PINPOINTS — fairy sighting clusters -->
    <g>
      <!-- Ireland cluster -->
      <circle cx="-44" cy="6" r="4" fill="#dc2030" opacity="0.85"/>
      <circle cx="-44" cy="6" r="7" fill="none" stroke="#dc2030" stroke-width="0.7" opacity="0.6"/>
      <text x="-50" y="-22" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" font-weight="700" opacity="0.9">IRELAND</text>
      <!-- Scotland cluster (top of Britain) -->
      <circle cx="-2" cy="-30" r="3.5" fill="#dc2030" opacity="0.85"/>
      <circle cx="-2" cy="-30" r="6" fill="none" stroke="#dc2030" stroke-width="0.7" opacity="0.6"/>
      <text x="2" y="-46" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" font-weight="700" opacity="0.9">SCOTLAND</text>
      <!-- Cornwall (bottom of Britain) -->
      <circle cx="-12" cy="32" r="3.5" fill="#dc2030" opacity="0.85"/>
      <circle cx="-12" cy="32" r="6" fill="none" stroke="#dc2030" stroke-width="0.7" opacity="0.6"/>
      <text x="-32" y="46" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" font-weight="700" opacity="0.9">CORNWALL</text>
      <!-- Brittany (lowest point) -->
      <circle cx="26" cy="38" r="3" fill="#dc2030" opacity="0.85"/>
      <circle cx="26" cy="38" r="5" fill="none" stroke="#dc2030" stroke-width="0.7" opacity="0.6"/>
      <text x="14" y="56" font-family="Helvetica Neue" font-size="6" fill="#fff8e8" font-weight="700" opacity="0.9">BRITTANY</text>
    </g>
    <!-- Connecting arcs (the IMPOSSIBLE pattern) -->
    <g stroke="#fff8e8" stroke-width="0.5" opacity="0.7" fill="none" stroke-dasharray="2,1.5">
      <path d="M-44,6 Q-22,-12 -2,-30"/>
      <path d="M-44,6 Q-26,18 -12,32"/>
      <path d="M-12,32 Q8,38 26,38"/>
    </g>
    <!-- Title bar -->
    <rect x="-58" y="-72" width="116" height="14" fill="none" stroke="#a888ff" stroke-width="0.55" opacity="0.85"/>
    <text x="-54" y="-62" font-family="Helvetica Neue" font-size="6" fill="#a888ff" font-weight="700">FOLKLORE CONSISTENCY MAP</text>
    <!-- Tiny tick marks -->
    <g stroke="#fff8e8" stroke-width="0.4" opacity="0.7">
      <line x1="-50" y1="62" x2="-40" y2="62"/>
      <line x1="-30" y1="62" x2="-20" y2="62"/>
      <line x1="-10" y1="62" x2="0" y2="62"/>
      <line x1="10" y1="62" x2="20" y2="62"/>
    </g>
  </g>

  <!-- Beam from Luma's wrist to map -->
  <g opacity="0.55">
    <path d="M340,260 L380,180 L450,180 Z" fill="#a888ff" filter="url(#p14p4bloom)" opacity="0.4"/>
  </g>

  <!-- LUMA — center-left, projecting map -->
  <g transform="translate(300 282)">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p14p4sapphire)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p14p4sapphire)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p14p4sapphire)"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p14p4sapphire)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p14p4sapphire)"/>
    <circle cx="-10" cy="-86" r="1" fill="#a888ff" filter="url(#p14p4bloom)"/>
    <circle cx="10" cy="-86" r="1" fill="#a888ff" filter="url(#p14p4bloom)"/>
    <!-- Right arm raised projecting -->
    <path d="M15,-76 Q34,-60 50,-50 L46,-44 Q30,-54 12,-72 Z" fill="url(#p14p4sapphire)"/>
    <ellipse cx="50" cy="-48" rx="4.5" ry="3" fill="url(#p14p4skin)"/>
    <circle cx="52" cy="-50" r="2.4" fill="#a888ff" filter="url(#p14p4bloom)"/>
    <ellipse cx="50" cy="-48" rx="2.4" ry="1.4" fill="#1a0838" opacity="0.7"/>
    <!-- Left arm at side -->
    <path d="M-15,-76 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p14p4sapphire)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p14p4skin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p14p4skin)"/>
    <g fill="#1a0c04">
      <path d="M-9,-112 Q-9,-118 0,-120 Q9,-118 9,-112 L7,-106 Q3,-112 -3,-112 Q-7,-112 -9,-106 Z"/>
      <path d="M7,-110 Q14,-94 16,-78" stroke="#1a0c04" stroke-width="2.4" fill="none"/>
    </g>
    <line x1="7" y1="-110" x2="16" y2="-78" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#p14p4bloom)"/>
    <ellipse cx="-3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p14p4bloom)"/>
    <ellipse cx="3" cy="-104" rx="2" ry="1.4" fill="#a888ff" opacity="0.85" filter="url(#p14p4bloom)"/>
    <!-- Mouth — quietly speaking -->
    <ellipse cx="0" cy="-98" rx="2" ry="0.85" fill="#5a2818" opacity="0.85"/>
  </g>

  <!-- SABLE in BG (left) — hand half-raised in WARNING gesture -->
  <g transform="translate(140 282)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="14" ry="2.5" fill="#0a0604" opacity="0.65"/>
    <path d="M-7,-44 L-10,-2 L-3,0 L-1,-44 Z" fill="url(#p14p4silver)"/>
    <path d="M1,-44 L3,0 L10,-2 L7,-44 Z" fill="url(#p14p4silver)"/>
    <path d="M-13,-78 L-15,-44 L15,-44 L13,-78 Z" fill="url(#p14p4silver)"/>
    <ellipse cx="13" cy="-76" rx="5" ry="3.5" fill="#3a3038" opacity="0.75"/>
    <path d="M-15,-78 Q-21,-86 -15,-92 L-8,-92 Z" fill="url(#p14p4silver)"/>
    <path d="M15,-78 Q21,-86 15,-92 L8,-92 Z" fill="url(#p14p4silver)"/>
    <circle cx="-9" cy="-86" r="0.85" fill="#fff8e8" filter="url(#p14p4bloom)"/>
    <circle cx="9" cy="-86" r="0.85" fill="#fff8e8" filter="url(#p14p4bloom)"/>
    <!-- Right arm RAISED HALFWAY (warning) -->
    <path d="M15,-78 Q24,-90 22,-110 L14,-112 Q14,-94 10,-78 Z" fill="url(#p14p4silver)"/>
    <ellipse cx="22" cy="-114" rx="3.5" ry="3" fill="url(#p14p4darkSkin)"/>
    <!-- Open palm -->
    <path d="M20,-118 L20,-130 Q22,-132 26,-130 L26,-114 Z" fill="url(#p14p4darkSkin)"/>
    <!-- Left arm at side -->
    <path d="M-15,-76 Q-22,-58 -16,-44 L-10,-46 Q-12,-58 -10,-74 Z" fill="url(#p14p4silver)"/>
    <ellipse cx="-15" cy="-44" rx="2.4" ry="1.4" fill="url(#p14p4darkSkin)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="url(#p14p4darkSkin)"/>
    <g fill="#dad5d0">
      <path d="M-9,-112 Q-10,-117 0,-119 Q10,-117 9,-112 L7,-107 Q3,-112 -3,-112 Q-7,-112 -9,-107 Z"/>
    </g>
    <ellipse cx="-3" cy="-104" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.6" fill="#0a0604"/>
    <ellipse cx="3" cy="-104" rx="1.5" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-104" r="0.6" fill="#0a0604"/>
    <!-- Brow set in warning -->
    <path d="M-7,-110 L-1,-110" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M1,-110 L7,-110" stroke="#3a3028" stroke-width="0.85"/>
    <path d="M-3,-98 L3,-98" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- DIALOGUE — Luma: Theodore. These stories... -->
  <g>
    <rect x="14" y="14" width="558" height="60" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M260,74 L270,74 L262,86 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M262,74 L268,74" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Theodore. These stories — they're consistent across regions you've never</text>
  <text x="22" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">communicated with. Ireland, Scotland, Cornwall, Brittany. Same rules. Same creatures. Same fears.</text>

  <!-- DIALOGUE — Luma: Oral traditions don't do that without a source. -->
  <g>
    <rect x="180" y="86" width="430" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M380,130 L390,130 L382,142 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M382,130 L388,130" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="188" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="188" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Oral traditions don't do that without a source.</text>

  <!-- DIALOGUE — Sable: Luma. -->
  <g>
    <rect x="14" y="208" width="100" height="44" rx="4" fill="#ffffff" stroke="#5a606a" stroke-width="2.4" filter="url(#balloonShadow)"/>
    <path d="M40,252 L50,252 L42,264 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2"/>
    <path d="M42,252 L48,252" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a">SABLE</text>
  <text x="22" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Luma.</text>

  <!-- DIALOGUE — Luma: I know. I know what I'm suggesting. -->
  <g>
    <rect x="200" y="276" width="300" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M280,276 L286,266 L290,276 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2"/>
    <path d="M284,276 L288,276" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="208" y="294" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a3ad8">LUMA</text>
  <text x="208" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#1a1a1a">I know. I know what I'm suggesting.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
