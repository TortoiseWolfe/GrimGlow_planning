<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 4 — Page 4 — Panel 1: Jink emerges from gap, looks up at giant Theodore</title>
  <desc>35mm low angle at cobble level. Jink emerges from brick gap, plants feet, looks up at Theodore who kneels enormous above. Light brown skin, golden blonde curls, emerald suit with chest soot streak. Serious, braced, no grin. Theodore: I followed the marks. Jink: You found us. / Of course you did.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p4p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a948a"/>
      <stop offset="100%" stop-color="#b8b0a4"/>
    </linearGradient>
    <linearGradient id="p4p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p4p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="p4p1theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p4p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p4p1vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p4p1shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p4p1trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2c20"/>
    </linearGradient>
    <linearGradient id="p4p1jinkSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#c89878"/>
    </linearGradient>
    <linearGradient id="p4p1emeraldSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aa868"/>
      <stop offset="50%" stop-color="#2e8b57"/>
      <stop offset="100%" stop-color="#1a5a38"/>
    </linearGradient>
    <radialGradient id="p4p1gapGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0e0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p4p1bloom"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- Sky strip -->
  <rect width="742" height="60" fill="url(#p4p1sky)"/>
  <!-- BRICK WALL fills upper-mid frame -->
  <rect x="0" y="40" width="742" height="180" fill="url(#p4p1brick)"/>
  <g stroke="#3a2010" stroke-width="0.45" opacity="0.55">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="80" y1="40" x2="80" y2="80"/>
    <line x1="220" y1="80" x2="220" y2="120"/>
    <line x1="160" y1="120" x2="160" y2="160"/>
    <line x1="380" y1="160" x2="380" y2="200"/>
    <line x1="540" y1="40" x2="540" y2="80"/>
    <line x1="660" y1="80" x2="660" y2="120"/>
    <line x1="600" y1="160" x2="600" y2="200"/>
  </g>
  <!-- Brick texture -->
  <g opacity="0.45">
    <ellipse cx="120" cy="120" rx="14" ry="4" fill="#6a3828"/>
    <ellipse cx="320" cy="180" rx="12" ry="4" fill="#7a4030"/>
    <ellipse cx="540" cy="100" rx="10" ry="3.5" fill="#6a3828"/>
    <ellipse cx="660" cy="180" rx="12" ry="4" fill="#7a4030"/>
  </g>
  <!-- Moss -->
  <g>
    <ellipse cx="280" cy="222" rx="32" ry="3" fill="#4a5828" opacity="0.6"/>
    <ellipse cx="450" cy="222" rx="36" ry="3" fill="#4a5828" opacity="0.6"/>
  </g>

  <!-- THE GAP behind Jink (to right of Jink position) -->
  <g>
    <rect x="540" y="216" width="34" height="6" fill="#0a0604"/>
    <ellipse cx="557" cy="218" rx="36" ry="6" fill="url(#p4p1gapGlow)" filter="url(#p4p1bloom)"/>
    <!-- Faint shapes inside -->
    <g opacity="0.85">
      <circle cx="555" cy="220" r="0.85" fill="#a8c0e0"/>
      <circle cx="563" cy="219" r="0.85" fill="#e8f0ff"/>
    </g>
    <ellipse cx="538" cy="222" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
    <ellipse cx="572" cy="222" rx="3" ry="1" fill="#7a6858" opacity="0.7"/>
  </g>

  <!-- COBBLESTONES -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p4p1cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.7">
    <path d="M0,250 Q160,248 320,252 Q500,254 742,250"/>
    <path d="M0,290 Q160,292 320,288 Q500,286 742,290"/>
    <path d="M0,330 Q160,328 320,332 Q500,334 742,330"/>
  </g>
  <g fill="#1a0c04" opacity="0.6">
    <circle cx="60" cy="262" r="1.4"/>
    <circle cx="180" cy="270" r="1.4"/>
    <circle cx="280" cy="262" r="1.4"/>
    <circle cx="500" cy="270" r="1.4"/>
    <circle cx="620" cy="262" r="1.4"/>
    <circle cx="100" cy="305" r="1.4"/>
    <circle cx="240" cy="315" r="1.4"/>
    <circle cx="380" cy="305" r="1.4"/>
    <circle cx="540" cy="315" r="1.4"/>
    <circle cx="680" cy="305" r="1.4"/>
    <circle cx="80" cy="345" r="1.4"/>
    <circle cx="220" cy="355" r="1.4"/>
    <circle cx="360" cy="345" r="1.4"/>
    <circle cx="500" cy="355" r="1.4"/>
    <circle cx="640" cy="345" r="1.4"/>
  </g>

  <!-- THEODORE — kneeling enormous above, BG dominant figure -->
  <g transform="translate(280 -120)">
    <!-- Long shadow on ground in front of him toward Jink -->
    <ellipse cx="280" cy="368" rx="220" ry="14" fill="#1a0c04" opacity="0.55"/>

    <!-- Trousers — kneeling shape, knees on cobble -->
    <path d="M-180,180 L-220,360 Q-218,372 -190,372 L-130,372 L-100,180 Z" fill="url(#p4p1trousers)"/>
    <path d="M-100,180 L-130,372 L-30,372 L-50,180 Z" fill="url(#p4p1trousers)"/>
    <path d="M40,180 L-30,372 L120,372 L80,180 Z" fill="url(#p4p1trousers)"/>
    <!-- Boot soles visible -->
    <ellipse cx="-200" cy="376" rx="32" ry="6" fill="#1a0c04"/>
    <ellipse cx="120" cy="378" rx="32" ry="6" fill="#1a0c04"/>
    <!-- Patches -->
    <rect x="-180" y="220" width="22" height="22" fill="#3a2010" opacity="0.7"/>
    <rect x="40" y="240" width="20" height="20" fill="#3a2010" opacity="0.7"/>

    <!-- Vest -->
    <path d="M-130,40 L-180,180 L160,180 L120,40 Z" fill="url(#p4p1vest)"/>
    <!-- Buttons -->
    <circle cx="-30" cy="80" r="3" fill="#7a5028"/>
    <circle cx="-30" cy="120" r="3" fill="#7a5028"/>
    <circle cx="-30" cy="160" r="3" fill="#7a5028"/>

    <!-- Shirt -->
    <path d="M-50,-40 L-50,40 L60,40 L60,-40 Z" fill="url(#p4p1shirt)"/>

    <!-- Arms — knuckles down on cobble (kneeling forward) -->
    <path d="M-130,40 Q-180,100 -200,180 L-180,200 Q-150,140 -110,40 Z" fill="url(#p4p1shirt)"/>
    <path d="M120,40 Q170,100 190,180 L170,200 Q140,140 100,40 Z" fill="url(#p4p1shirt)"/>
    <!-- Hands flat on cobblestones -->
    <ellipse cx="-200" cy="218" rx="32" ry="14" fill="url(#p4p1theoSkin)"/>
    <ellipse cx="190" cy="218" rx="32" ry="14" fill="url(#p4p1theoSkin)"/>
    <!-- Fingers -->
    <g fill="url(#p4p1theoSkin)">
      <ellipse cx="-220" cy="232" rx="14" ry="6"/>
      <ellipse cx="-200" cy="234" rx="14" ry="6"/>
      <ellipse cx="-180" cy="234" rx="14" ry="6"/>
      <ellipse cx="-160" cy="232" rx="12" ry="5"/>
      <ellipse cx="170" cy="232" rx="12" ry="5"/>
      <ellipse cx="190" cy="234" rx="14" ry="6"/>
      <ellipse cx="210" cy="234" rx="14" ry="6"/>
      <ellipse cx="228" cy="232" rx="13" ry="5"/>
    </g>
    <!-- Brass gear ring on left index -->
    <ellipse cx="190" cy="234" rx="3" ry="2" fill="#c89858" stroke="#7a5028" stroke-width="0.5"/>
    <!-- Oil stains -->
    <ellipse cx="-200" cy="218" rx="8" ry="3" fill="#1a0c04" opacity="0.4"/>
    <ellipse cx="190" cy="218" rx="8" ry="3" fill="#1a0c04" opacity="0.4"/>

    <!-- Head — looking down, three-quarter forward -->
    <ellipse cx="0" cy="-86" rx="60" ry="68" fill="url(#p4p1theoSkin)"/>
    <!-- Hair -->
    <g fill="url(#p4p1theoHair)">
      <path d="M-58,-150 Q-60,-160 0,-164 Q60,-160 58,-150 L52,-130 Q24,-148 0,-148 Q-24,-148 -52,-130 Z"/>
      <!-- Strands hanging forward -->
      <path d="M-44,-130 Q-44,-110 -38,-86 L-30,-90 Q-38,-110 -42,-130 Z"/>
      <path d="M-18,-138 Q-18,-114 -10,-90 L-2,-94 Q-12,-114 -16,-138 Z"/>
      <path d="M16,-138 Q16,-114 24,-90 L32,-94 Q22,-114 18,-138 Z"/>
      <path d="M40,-130 Q42,-110 48,-86 L56,-90 Q48,-110 44,-130 Z"/>
    </g>
    <!-- Eyebrows -->
    <path d="M-36,-100 Q-20,-108 -8,-104" stroke="#5a4030" stroke-width="3" fill="none"/>
    <path d="M8,-104 Q20,-108 36,-100" stroke="#5a4030" stroke-width="3" fill="none"/>
    <!-- Eyes — looking down at Jink, gentle -->
    <ellipse cx="-22" cy="-84" rx="8" ry="5" fill="#fff8e8"/>
    <ellipse cx="-22" cy="-83" rx="5" ry="3.5" fill="#7a5028"/>
    <circle cx="-22" cy="-83" r="2.4" fill="#0a0604"/>
    <ellipse cx="-23" cy="-85" rx="1.4" ry="0.8" fill="#fff8e8"/>
    <ellipse cx="22" cy="-84" rx="8" ry="5" fill="#fff8e8"/>
    <ellipse cx="22" cy="-83" rx="5" ry="3.5" fill="#7a5028"/>
    <circle cx="22" cy="-83" r="2.4" fill="#0a0604"/>
    <ellipse cx="21" cy="-85" rx="1.4" ry="0.8" fill="#fff8e8"/>
    <!-- Nose -->
    <path d="M0,-78 L-8,-50 Q0,-46 8,-50 Z" fill="#a87858" opacity="0.55"/>
    <!-- Mouth — slightly open, gentle -->
    <ellipse cx="0" cy="-30" rx="14" ry="4" fill="#a85838"/>
    <path d="M-14,-32 Q0,-28 14,-32" fill="none" stroke="#5a2818" stroke-width="0.85"/>
    <!-- Freckles -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="-30" cy="-58" r="1.6"/>
      <circle cx="-20" cy="-52" r="1.4"/>
      <circle cx="0" cy="-58" r="1.4"/>
      <circle cx="20" cy="-52" r="1.4"/>
      <circle cx="30" cy="-58" r="1.6"/>
      <circle cx="-10" cy="-46" r="1.2"/>
      <circle cx="10" cy="-46" r="1.2"/>
    </g>
  </g>

  <!-- JINK — at cobble level, tiny but the subject — emerged from gap -->
  <g transform="translate(560 320)">
    <ellipse cx="0" cy="22" rx="14" ry="2.5" fill="#0a0604" opacity="0.7"/>
    <!-- Theodore's shadow falling across Jink (subtle darkening) -->
    <ellipse cx="0" cy="0" rx="40" ry="40" fill="#1a0c04" opacity="0.18"/>

    <!-- Legs — feet planted -->
    <path d="M-7,-46 L-10,18 L-3,22 L-1,-46 Z" fill="url(#p4p1emeraldSuit)"/>
    <path d="M1,-46 L3,22 L10,18 L7,-46 Z" fill="url(#p4p1emeraldSuit)"/>
    <ellipse cx="-7" cy="22" rx="4" ry="1.4" fill="#1a4830"/>
    <ellipse cx="7" cy="22" rx="4" ry="1.4" fill="#1a4830"/>
    <!-- Leg hologram seams (faint emerald) -->
    <line x1="-9" y1="-44" x2="-11" y2="16" stroke="#9aff9a" stroke-width="0.55" opacity="0.7"/>
    <line x1="9" y1="-44" x2="11" y2="16" stroke="#9aff9a" stroke-width="0.55" opacity="0.7"/>
    <!-- New dust from scouting -->
    <ellipse cx="-7" cy="-26" rx="3" ry="0.8" fill="#7a6858" opacity="0.45"/>
    <ellipse cx="7" cy="-26" rx="3" ry="0.8" fill="#7a6858" opacity="0.45"/>

    <!-- Torso — chin up, shoulders back -->
    <path d="M-14,-86 L-16,-46 L16,-46 L14,-86 Z" fill="url(#p4p1emeraldSuit)"/>
    <!-- CHEST SOOT STREAK (carries from I3) -->
    <path d="M-10,-78 Q-2,-72 6,-80 Q-2,-62 -8,-58 Z" fill="#3a2818" opacity="0.7"/>
    <!-- WING-PACK SEAMS faintly glow at shoulders/back -->
    <line x1="-15" y1="-86" x2="-12" y2="-72" stroke="#9aff9a" stroke-width="0.7" opacity="0.85"/>
    <line x1="15" y1="-86" x2="12" y2="-72" stroke="#9aff9a" stroke-width="0.7" opacity="0.85"/>
    <!-- Wing-pack node halos -->
    <circle cx="-13" cy="-80" r="1.6" fill="#d8ffe8" filter="url(#p4p1bloom)"/>
    <circle cx="13" cy="-80" r="1.6" fill="#d8ffe8" filter="url(#p4p1bloom)"/>
    <!-- Shoulders -->
    <path d="M-14,-86 Q-20,-94 -14,-100 L-7,-98 L-10,-82 Z" fill="url(#p4p1emeraldSuit)"/>
    <path d="M14,-86 Q20,-94 14,-100 L7,-98 L10,-82 Z" fill="url(#p4p1emeraldSuit)"/>

    <!-- Arms at sides, stiff -->
    <path d="M-14,-84 Q-20,-72 -16,-50 L-10,-52 Q-12,-72 -10,-82 Z" fill="url(#p4p1emeraldSuit)"/>
    <path d="M14,-84 Q20,-72 16,-50 L10,-52 Q12,-72 10,-82 Z" fill="url(#p4p1emeraldSuit)"/>
    <ellipse cx="-15" cy="-50" rx="2.4" ry="1.4" fill="url(#p4p1jinkSkin)"/>
    <ellipse cx="15" cy="-50" rx="2.4" ry="1.4" fill="url(#p4p1jinkSkin)"/>

    <!-- Head — chin up, looking up at Theodore -->
    <ellipse cx="0" cy="-110" rx="9" ry="11" fill="url(#p4p1jinkSkin)"/>
    <!-- HAIR — wild golden curls -->
    <g fill="#d8a838">
      <circle cx="-7" cy="-118" r="3"/>
      <circle cx="0" cy="-122" r="3.4"/>
      <circle cx="7" cy="-118" r="3"/>
      <circle cx="-9" cy="-114" r="2.2"/>
      <circle cx="9" cy="-114" r="2.2"/>
      <circle cx="-3" cy="-124" r="2"/>
      <circle cx="4" cy="-124" r="2"/>
      <circle cx="11" cy="-110" r="1.8"/>
      <circle cx="-11" cy="-110" r="1.8"/>
    </g>
    <!-- Eyes — looking up, serious -->
    <ellipse cx="-3" cy="-110" rx="1.6" ry="1.2" fill="#fff8e8"/>
    <ellipse cx="-3" cy="-111" rx="1" ry="0.8" fill="#1a4830"/>
    <circle cx="-3" cy="-111" r="0.5" fill="#0a0604"/>
    <ellipse cx="3" cy="-110" rx="1.6" ry="1.2" fill="#fff8e8"/>
    <ellipse cx="3" cy="-111" rx="1" ry="0.8" fill="#1a4830"/>
    <circle cx="3" cy="-111" r="0.5" fill="#0a0604"/>
    <!-- Brows neutral, set -->
    <path d="M-7,-115 L-1,-116" stroke="#88603a" stroke-width="0.6"/>
    <path d="M1,-116 L7,-115" stroke="#88603a" stroke-width="0.6"/>
    <!-- Nose -->
    <path d="M0,-106 L-1.4,-102 Q0,-101 1.4,-102 Z" fill="#7a4830" opacity="0.55"/>
    <!-- Mouth — closed, NO grin, jaw set -->
    <path d="M-3,-98 L3,-98" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- DIALOGUE — Jink: You found us. -->
  <g>
    <rect x="14" y="14" width="142" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M84,58 L94,58 L86,70 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M86,58 L92,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">You found us.</text>

  <!-- DIALOGUE — Theodore: I followed the marks. In the courtyard. The scratches on the brick. -->
  <g>
    <rect x="320" y="14" width="408" height="44" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M510,58 L520,58 L512,70 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M512,58 L518,58" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="328" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="328" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">I followed the marks. In the courtyard. The scratches on the brick.</text>

  <!-- DIALOGUE — Jink: Of course you did. -->
  <g>
    <rect x="14" y="78" width="166" height="44" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2" filter="url(#balloonShadow)"/>
    <path d="M96,122 L106,122 L98,134 Z" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <path d="M98,122 L104,122" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2e8b57">JINK</text>
  <text x="22" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">Of course you did.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,40 Q200,38 400,42 Q580,44 742,40"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
