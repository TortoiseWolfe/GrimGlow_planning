<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 4 — Page 2 — Panel 2: Theodore's eye at ground level catches blue-white camp reflection</title>
  <desc>100mm extreme close-up. Theodore's hazel eye, cheek pressed to damp cobblestones, peering into narrow brick gap. Iris catches blue-white geometric reflection from camp interior. Crash shard pulses in waistcoat pocket pressed against ground. Eye widens — recognition, not surprise. Whisper: I knew it.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p2p2skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8a8"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p2p2hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <radialGradient id="p2p2iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="20%" stop-color="#5a3818"/>
      <stop offset="55%" stop-color="#8a6028"/>
      <stop offset="85%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </radialGradient>
    <linearGradient id="p2p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="p2p2brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p2p2campGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8e8ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <!-- BG: warm grey daylight on skin/cobblestones (top), brick wall (bottom-right) -->
  <rect width="238" height="364" fill="#a8a094"/>

  <!-- COBBLESTONE EDGE FG running across bottom-left -->
  <rect x="0" y="240" width="238" height="124" fill="url(#p2p2cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.7">
    <path d="M0,260 Q60,258 120,262 Q180,264 238,260"/>
    <path d="M0,290 Q60,292 120,288 Q180,286 238,290"/>
    <path d="M0,330 Q60,328 120,332 Q180,334 238,330"/>
  </g>
  <g fill="#1a0a04" opacity="0.6">
    <circle cx="40" cy="270" r="1.5"/>
    <circle cx="100" cy="278" r="1.5"/>
    <circle cx="160" cy="270" r="1.5"/>
    <circle cx="220" cy="278" r="1.5"/>
    <circle cx="60" cy="305" r="1.5"/>
    <circle cx="120" cy="315" r="1.5"/>
    <circle cx="180" cy="305" r="1.5"/>
    <circle cx="80" cy="345" r="1.5"/>
    <circle cx="140" cy="355" r="1.5"/>
    <circle cx="200" cy="345" r="1.5"/>
  </g>
  <!-- Wet sheen on cobblestones -->
  <g fill="#7a6858" opacity="0.45">
    <ellipse cx="80" cy="284" rx="40" ry="3"/>
    <ellipse cx="180" cy="316" rx="36" ry="3"/>
  </g>

  <!-- BRICK WALL — extreme right edge of frame, suggesting the wall just below face -->
  <rect x="158" y="240" width="80" height="40" fill="url(#p2p2brick)"/>
  <g stroke="#1a0a04" stroke-width="0.4" opacity="0.55">
    <line x1="158" y1="260" x2="238" y2="260"/>
    <line x1="200" y1="240" x2="200" y2="260"/>
  </g>

  <!-- THE GAP — visible at right edge of frame, leaking blue-white -->
  <g>
    <rect x="184" y="276" width="44" height="6" fill="#0a0604"/>
    <!-- Camp glow leaking out of gap -->
    <ellipse cx="206" cy="278" rx="36" ry="6" fill="url(#p2p2campGlow)" filter="url(#p2p2bloom)"/>
    <!-- Visible structured light points inside -->
    <g opacity="0.85">
      <circle cx="194" cy="279" r="1.2" fill="#d8e8ff"/>
      <circle cx="206" cy="278" r="1.4" fill="#e8f0ff"/>
      <circle cx="218" cy="279" r="1.1" fill="#a8c0e0"/>
      <line x1="200" y1="278" x2="212" y2="278" stroke="#a8c0e0" stroke-width="0.3" opacity="0.8"/>
    </g>
  </g>

  <!-- THEODORE'S FACE — extreme close, cheek pressed to ground, eye dominates frame -->
  <g>
    <!-- Cheek/face filling top-left of frame -->
    <path d="M0,0 L238,0 L238,210 Q200,232 154,242 L100,238 Q60,222 30,200 L0,158 Z" fill="url(#p2p2skin)"/>
    <!-- Subtle skin tone shading -->
    <path d="M40,40 L200,30 Q220,80 200,140 L120,180 L60,160 L40,100 Z" fill="#d8c8b8" opacity="0.4"/>

    <!-- HAIR — sandy-brown, falling across forehead from top -->
    <g fill="url(#p2p2hair)">
      <path d="M0,0 L238,0 L238,40 Q160,46 80,38 Q40,32 0,40 Z"/>
      <!-- Strands falling forward -->
      <path d="M40,38 Q44,60 52,80 L62,78 Q56,58 50,38 Z"/>
      <path d="M80,38 Q86,60 94,82 L104,80 Q98,58 90,38 Z"/>
      <path d="M130,38 Q134,58 142,80 L152,78 Q146,56 140,38 Z"/>
      <path d="M180,38 Q186,58 192,80 L200,78 Q194,56 190,38 Z"/>
      <!-- Wisps over forehead -->
      <path d="M30,40 Q40,50 36,70" stroke="#3a3028" stroke-width="0.6" fill="none"/>
      <path d="M120,40 Q126,52 122,72" stroke="#3a3028" stroke-width="0.6" fill="none"/>
      <path d="M170,40 Q176,52 172,72" stroke="#3a3028" stroke-width="0.6" fill="none"/>
    </g>

    <!-- Eyebrow — sandy fine hair above eye -->
    <g fill="url(#p2p2hair)" opacity="0.8">
      <path d="M30,118 Q70,108 130,114 Q150,118 144,124 Q90,118 30,128 Z"/>
    </g>

    <!-- THE EYE — central, dominant -->
    <g transform="translate(85 165)">
      <!-- Eye socket shadow -->
      <ellipse cx="0" cy="0" rx="80" ry="34" fill="#7a5848" opacity="0.25"/>
      <!-- Lower eyelid faint shadow -->
      <path d="M-78,2 Q0,16 78,2 Q70,28 0,30 Q-70,28 -78,2 Z" fill="#a89070" opacity="0.4"/>
      <!-- Eye white -->
      <ellipse cx="0" cy="0" rx="74" ry="26" fill="#fff8e8"/>
      <!-- Eye white veining (subtle) -->
      <g stroke="#e8c8a8" stroke-width="0.4" fill="none" opacity="0.6">
        <path d="M-60,4 Q-40,10 -20,4"/>
        <path d="M40,4 Q60,8 70,4"/>
      </g>
      <!-- Iris (hazel) -->
      <circle cx="0" cy="0" r="22" fill="url(#p2p2iris)"/>
      <!-- Iris detail rays -->
      <g stroke="#3a2010" stroke-width="0.4" fill="none" opacity="0.7">
        <line x1="0" y1="-22" x2="0" y2="-12"/>
        <line x1="11" y1="-19" x2="6" y2="-10"/>
        <line x1="19" y1="-11" x2="11" y2="-6"/>
        <line x1="22" y1="0" x2="13" y2="0"/>
        <line x1="19" y1="11" x2="11" y2="6"/>
        <line x1="11" y1="19" x2="6" y2="10"/>
        <line x1="0" y1="22" x2="0" y2="13"/>
        <line x1="-11" y1="19" x2="-6" y2="10"/>
        <line x1="-19" y1="11" x2="-11" y2="6"/>
        <line x1="-22" y1="0" x2="-13" y2="0"/>
        <line x1="-19" y1="-11" x2="-11" y2="-6"/>
        <line x1="-11" y1="-19" x2="-6" y2="-10"/>
      </g>
      <!-- Inner iris detail (gold flecks) -->
      <g fill="#c89858" opacity="0.85">
        <ellipse cx="-8" cy="-4" rx="2" ry="1"/>
        <ellipse cx="6" cy="6" rx="2" ry="1"/>
        <ellipse cx="-4" cy="10" rx="1.5" ry="0.8"/>
        <ellipse cx="10" cy="-2" rx="1.5" ry="0.8"/>
      </g>
      <!-- Pupil (slightly dilated) -->
      <circle cx="0" cy="0" r="9" fill="#0a0604"/>
      <!-- BLUE-WHITE GEOMETRIC REFLECTION inside iris (the camp's holographic perimeter) -->
      <g opacity="0.85">
        <circle cx="2" cy="-2" r="1.4" fill="#e8f0ff"/>
        <circle cx="-3" cy="3" r="1" fill="#a8c0e0"/>
        <circle cx="6" cy="4" r="0.8" fill="#c0d8f0"/>
        <line x1="-2" y1="2" x2="2" y2="-2" stroke="#a8c0e0" stroke-width="0.4"/>
        <line x1="2" y1="-2" x2="6" y2="4" stroke="#c0d8f0" stroke-width="0.4"/>
      </g>
      <!-- Pupil core -->
      <circle cx="0" cy="0" r="3.5" fill="#000"/>
      <!-- Catchlight (warm daylight from behind) -->
      <ellipse cx="-7" cy="-7" rx="3.5" ry="2.4" fill="#fff8e8" opacity="0.9"/>
      <ellipse cx="-9" cy="-8" rx="1.4" ry="1" fill="#ffffff"/>
      <!-- Upper eyelid arch -->
      <path d="M-78,-2 Q0,-30 78,-2" fill="none" stroke="#3a2010" stroke-width="1.6"/>
      <!-- Eyelashes -->
      <g stroke="#3a2010" stroke-width="0.7" stroke-linecap="round">
        <line x1="-50" y1="-12" x2="-52" y2="-22"/>
        <line x1="-30" y1="-22" x2="-32" y2="-32"/>
        <line x1="-10" y1="-26" x2="-12" y2="-36"/>
        <line x1="10" y1="-26" x2="12" y2="-36"/>
        <line x1="30" y1="-22" x2="32" y2="-32"/>
        <line x1="50" y1="-12" x2="52" y2="-22"/>
      </g>
      <!-- Lower lid line -->
      <path d="M-78,2 Q0,18 78,2" fill="none" stroke="#5a3818" stroke-width="0.85"/>
    </g>

    <!-- NOSE BRIDGE (lower right of eye, suggesting profile) -->
    <path d="M168,168 Q186,180 196,202 Q198,222 188,236 L182,228 Q188,210 184,196 Q180,184 168,176 Z" fill="url(#p2p2skin)"/>

    <!-- FRECKLES across nose bridge and cheek -->
    <g fill="#7a5848" opacity="0.7">
      <circle cx="180" cy="186" r="0.7"/>
      <circle cx="186" cy="200" r="0.7"/>
      <circle cx="172" cy="194" r="0.6"/>
      <circle cx="160" cy="200" r="0.6"/>
      <circle cx="140" cy="208" r="0.7"/>
      <circle cx="120" cy="210" r="0.6"/>
      <circle cx="100" cy="208" r="0.6"/>
      <circle cx="80" cy="206" r="0.6"/>
      <circle cx="160" cy="218" r="0.5"/>
      <circle cx="140" cy="222" r="0.5"/>
    </g>
  </g>

  <!-- SHARD GLOW peeking from corner of frame (waistcoat pocket pressed to ground) -->
  <g transform="translate(218 320)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#p2p2campGlow)" filter="url(#p2p2bloom)" opacity="0.7"/>
    <path d="M-5,-2 L0,-5 L4,-3 L4,3 L0,5 L-4,3 Z" fill="#a8c0e0"/>
    <ellipse cx="0" cy="0" rx="2" ry="1" fill="#fff8e8"/>
  </g>

  <!-- DIALOGUE — Theodore (whisper): I knew it. -->
  <g>
    <rect x="14" y="14" width="120" height="46" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" stroke-dasharray="4,2" filter="url(#balloonShadow)"/>
    <path d="M62,60 L72,60 L64,72 Z" fill="#ffffff" stroke="#6a4220" stroke-width="2"/>
    <path d="M64,60 L70,60" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic">I knew it.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.16" fill="none">
    <path d="M0,80 Q60,78 120,82 Q180,84 238,80"/>
    <path d="M0,250 Q60,252 120,248 Q180,246 238,250"/>
  </g>
</svg>
