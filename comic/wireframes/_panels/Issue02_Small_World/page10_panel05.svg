<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 420" width="247" height="420">
  <title>Issue 2 — Page 10 — Panel 5: Over Sable's shoulder, wreckage sighted at alley end</title>
  <desc>CU 85mm over silver-suited shoulder looking down narrow Victorian alley fairy scale dark canyon brick walls fifty feet to brighter opening far end. Through opening courtyard partially visible against base brick wall half-obscured debris newspaper leaves canvas — dark angular shape that does not belong, not Victorian not natural, ship wreckage catching no light, angles wrong for this world. Silver collar holographic nodes pulse faintly brighter — geometric light responding to dead technology recognizing its own. Alley deep shadow courtyard beyond grey light tunnel end. SABLE quiet I see it.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p5alley" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p10p5wallLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p10p5wallRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p10p5courtyard">
      <stop offset="0%" stop-color="#a8b0bc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a3e48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p10p5wreckage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="p10p5silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <radialGradient id="p10p5silverPulse">
      <stop offset="0%" stop-color="#dce4f0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a8b0bc" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5a606a" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p10p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p10p5deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- BG dark alley (deep shadow). -->
  <rect width="247" height="420" fill="url(#p10p5alley)"/>

  <!-- BRICK WALLS — left and right of alley, perspective converging. -->
  <path d="M0,0 L0,420 L80,420 L60,180 L80,0 Z" fill="url(#p10p5wallLeft)" stroke="#080404" stroke-width="0.7"/>
  <path d="M247,0 L247,420 L167,420 L187,180 L167,0 Z" fill="url(#p10p5wallRight)" stroke="#080404" stroke-width="0.7"/>

  <!-- Brick courses on walls. -->
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="40" x2="76" y2="40"/>
    <line x1="0" y1="80" x2="74" y2="80"/>
    <line x1="0" y1="120" x2="72" y2="120"/>
    <line x1="0" y1="160" x2="70" y2="160"/>
    <line x1="0" y1="200" x2="68" y2="200"/>
    <line x1="0" y1="240" x2="68" y2="240"/>
    <line x1="0" y1="280" x2="70" y2="280"/>
    <line x1="0" y1="320" x2="72" y2="320"/>
    <line x1="0" y1="360" x2="74" y2="360"/>
    <line x1="247" y1="40" x2="171" y2="40"/>
    <line x1="247" y1="80" x2="173" y2="80"/>
    <line x1="247" y1="120" x2="175" y2="120"/>
    <line x1="247" y1="160" x2="177" y2="160"/>
    <line x1="247" y1="200" x2="179" y2="200"/>
    <line x1="247" y1="240" x2="179" y2="240"/>
    <line x1="247" y1="280" x2="177" y2="280"/>
    <line x1="247" y1="320" x2="175" y2="320"/>
    <line x1="247" y1="360" x2="173" y2="360"/>
  </g>

  <!-- DARK ALLEY FLOOR receding. -->
  <path d="M80,420 L60,180 L187,180 L167,420 Z" fill="#080404"/>

  <!-- COURTYARD LIGHT at alley far end. -->
  <ellipse cx="124" cy="180" rx="50" ry="30" fill="url(#p10p5courtyard)" filter="url(#p10p5deepBloom)" opacity="0.85"/>
  <!-- Brighter spot center far. -->
  <ellipse cx="124" cy="180" rx="20" ry="14" fill="#a8b0bc" opacity="0.65" filter="url(#p10p5strongBloom)"/>

  <!-- WRECKAGE — dark angular shape at base of brick wall in courtyard (far end). -->
  <g id="p10p5-wreckage">
    <!-- Main hull silhouette (angular, wrong). -->
    <path d="M104,180 L114,160 L124,158 L138,164 L148,176 L150,184 L142,190 L120,192 L106,188 Z" fill="url(#p10p5wreckage)" stroke="#1a0810" stroke-width="0.7"/>
    <!-- Sharp panel angles. -->
    <line x1="114" y1="160" x2="120" y2="170" stroke="#080404" stroke-width="0.5"/>
    <line x1="138" y1="164" x2="132" y2="174" stroke="#080404" stroke-width="0.5"/>
    <line x1="120" y1="170" x2="132" y2="174" stroke="#080404" stroke-width="0.5"/>
    <!-- Hull breach. -->
    <path d="M124,170 L130,178 L120,182 Z" fill="#1a0408" stroke="#080404" stroke-width="0.4"/>

    <!-- DEBRIS (newspaper, leaves, canvas) partially obscuring. -->
    <g fill="#a89868" opacity="0.85">
      <!-- Newspaper torn edges. -->
      <polygon points="100,184 108,182 110,188 104,190" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="146,182 154,184 152,188 144,186" stroke="#5a4a30" stroke-width="0.3"/>
    </g>
    <!-- Leaves. -->
    <g fill="#5a8848" opacity="0.85">
      <ellipse cx="110" cy="190" rx="3" ry="1.4" transform="rotate(20 110 190)"/>
      <ellipse cx="135" cy="188" rx="3" ry="1.4" transform="rotate(-15 135 188)"/>
    </g>
    <!-- Canvas scrap. -->
    <path d="M118,192 L138,194 L136,200 L116,198 Z" fill="#3a2818" opacity="0.85" stroke="#1a0808" stroke-width="0.3"/>
  </g>

  <!-- Distant brick wall behind wreckage (courtyard). -->
  <rect x="60" y="178" width="127" height="6" fill="#5a3018" opacity="0.85"/>
  <line x1="60" y1="180" x2="187" y2="180" stroke="#3a1810" stroke-width="0.5"/>

  <!-- Faint rain visible through alley toward courtyard. -->
  <g stroke="#a8b8c8" stroke-width="0.3" opacity="0.55">
    <line x1="100" y1="100" x2="98" y2="125"/>
    <line x1="135" y1="110" x2="133" y2="135"/>
    <line x1="115" y1="135" x2="113" y2="160"/>
  </g>

  <!-- SABLE'S SHOULDER (silhouette dominant left foreground — over-shoulder POV). -->
  <g id="p10p5-sable-shoulder">
    <!-- Big silver shoulder/upper-back filling lower-left third of frame. -->
    <path d="M0,200 L20,160 L60,140 L120,150 L130,200 L140,260 L130,420 L0,420 Z" fill="url(#p10p5silver)" stroke="#080404" stroke-width="0.7"/>

    <!-- CRACKED right shoulder (continuity — visible on the silhouette). -->
    <g stroke="#a8d8f8" stroke-width="0.85" opacity="0.95" filter="url(#p10p5bloom)">
      <path d="M70,160 L90,180 L85,200 L100,220"/>
      <path d="M85,180 L100,195"/>
      <path d="M85,210 L95,220"/>
    </g>

    <!-- COLLAR holographic nodes — PULSING BRIGHTER (script-specific). -->
    <ellipse cx="80" cy="155" rx="40" ry="14" fill="url(#p10p5silverPulse)" filter="url(#p10p5strongBloom)" opacity="0.95"/>
    <g fill="#dce4f0" opacity="0.95" filter="url(#p10p5bloom)">
      <circle cx="60" cy="158" r="2"/>
      <circle cx="80" cy="156" r="2.5"/>
      <circle cx="100" cy="158" r="2"/>
    </g>
    <!-- Geometric hex pattern (responding signal). -->
    <g stroke="#dce4f0" stroke-width="0.5" fill="none" opacity="0.95">
      <path d="M55,158 L60,156 L65,158 L65,160 L60,162 L55,160 Z"/>
      <path d="M75,156 L80,154 L85,156 L85,158 L80,160 L75,158 Z"/>
      <path d="M95,158 L100,156 L105,158 L105,160 L100,162 L95,160 Z"/>
    </g>
    <!-- Suit mud streaks. -->
    <g fill="#3a2818" opacity="0.85">
      <ellipse cx="40" cy="280" rx="6" ry="2" transform="rotate(-20 40 280)"/>
      <ellipse cx="80" cy="320" rx="8" ry="2"/>
      <ellipse cx="60" cy="380" rx="6" ry="2"/>
    </g>
    <!-- Wet sheen on shoulder top. -->
    <g fill="#dce4f0" opacity="0.45" filter="url(#p10p5bloom)">
      <ellipse cx="40" cy="160" rx="20" ry="3"/>
      <ellipse cx="100" cy="150" rx="20" ry="3"/>
    </g>

    <!-- Back of head silhouette (right edge). -->
    <ellipse cx="98" cy="118" rx="24" ry="28" fill="#1a0808"/>
    <!-- Silver-white buzz back-of-head. -->
    <path d="M76,98 Q98,85 120,98 L120,118 L76,118 Z" fill="#dce4f0"/>
    <g fill="#a8b0bc" opacity="0.85"><circle cx="84" cy="98" r="0.9"/><circle cx="98" cy="92" r="0.9"/><circle cx="112" cy="98" r="0.9"/></g>
  </g>

  <!-- DIALOGUE — SABLE quiet. -->
  <g id="p10p5-bal-sable">
    <rect x="14" y="14" width="160" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="68" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a4a30">(quiet)</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I see it.</text>
    <path d="M70,60 L84,60 L78,72 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="70" y1="60" x2="84" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p10p5-meta">
    <text x="239" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">5</text>
    <text x="243" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">WRECKAGE SIGHTED</text>
  </g>
</svg>
