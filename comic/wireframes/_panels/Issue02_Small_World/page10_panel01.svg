<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 10 — Panel 1: Scale-shift, human-perspective Victorian street</title>
  <desc>Wide establishing 28mm human scale. Same Victorian street ordinary morning — rain falling cobblestones gas lamp burning low daylight drain grate flush in road. Costermonger pushing barrow wheels rumbling, woman shawl crossing basket. Terraced London stock brick buildings shop fronts sash windows. Nobody looks down. Indifference of scale. CAPTION same street same rain world that doesn't know they exist.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#7a8088"/>
    </linearGradient>
    <linearGradient id="p10p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86028"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p10p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="p10p1lampGlow">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p10p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p10p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG sky upper. -->
  <rect width="742" height="120" fill="url(#p10p1sky)"/>

  <!-- Rain veil. -->
  <g stroke="#a8b8c8" stroke-width="0.4" opacity="0.55">
    <line x1="40" y1="20" x2="38" y2="60"/>
    <line x1="120" y1="10" x2="118" y2="50"/>
    <line x1="200" y1="25" x2="198" y2="65"/>
    <line x1="280" y1="15" x2="278" y2="55"/>
    <line x1="360" y1="30" x2="358" y2="70"/>
    <line x1="440" y1="20" x2="438" y2="60"/>
    <line x1="520" y1="35" x2="518" y2="75"/>
    <line x1="600" y1="20" x2="598" y2="60"/>
    <line x1="680" y1="40" x2="678" y2="80"/>
    <line x1="80" y1="80" x2="78" y2="115"/>
    <line x1="240" y1="90" x2="238" y2="125"/>
    <line x1="400" y1="85" x2="398" y2="120"/>
    <line x1="560" y1="95" x2="558" y2="130"/>
    <line x1="700" y1="85" x2="698" y2="120"/>
    <line x1="160" y1="170" x2="158" y2="210"/>
    <line x1="320" y1="180" x2="318" y2="220"/>
    <line x1="480" y1="175" x2="478" y2="215"/>
    <line x1="640" y1="185" x2="638" y2="225"/>
  </g>

  <!-- VICTORIAN BUILDINGS LEFT side. -->
  <g id="p10p1-bldg-left">
    <rect x="0" y="20" width="180" height="240" fill="url(#p10p1brick)" stroke="#3a1810" stroke-width="0.7"/>
    <!-- Brick courses. -->
    <g stroke="#3a1810" stroke-width="0.4" opacity="0.65">
      <line x1="0" y1="40" x2="180" y2="40"/>
      <line x1="0" y1="60" x2="180" y2="60"/>
      <line x1="0" y1="80" x2="180" y2="80"/>
      <line x1="0" y1="100" x2="180" y2="100"/>
      <line x1="0" y1="120" x2="180" y2="120"/>
      <line x1="0" y1="140" x2="180" y2="140"/>
      <line x1="0" y1="160" x2="180" y2="160"/>
      <line x1="0" y1="180" x2="180" y2="180"/>
      <line x1="0" y1="200" x2="180" y2="200"/>
      <line x1="0" y1="220" x2="180" y2="220"/>
      <line x1="0" y1="240" x2="180" y2="240"/>
    </g>
    <!-- Sash windows upper. -->
    <g fill="#1a1010" stroke="#080404" stroke-width="0.7">
      <rect x="20" y="30" width="32" height="44" rx="1"/>
      <rect x="74" y="30" width="32" height="44" rx="1"/>
      <rect x="128" y="30" width="32" height="44" rx="1"/>
      <rect x="20" y="98" width="32" height="44" rx="1"/>
      <rect x="74" y="98" width="32" height="44" rx="1"/>
      <rect x="128" y="98" width="32" height="44" rx="1"/>
    </g>
    <!-- Window cross-bars. -->
    <g stroke="#3a2010" stroke-width="0.5" opacity="0.85">
      <line x1="36" y1="30" x2="36" y2="74"/>
      <line x1="20" y1="52" x2="52" y2="52"/>
      <line x1="90" y1="30" x2="90" y2="74"/>
      <line x1="74" y1="52" x2="106" y2="52"/>
      <line x1="144" y1="30" x2="144" y2="74"/>
      <line x1="128" y1="52" x2="160" y2="52"/>
      <line x1="36" y1="98" x2="36" y2="142"/>
      <line x1="20" y1="120" x2="52" y2="120"/>
      <line x1="90" y1="98" x2="90" y2="142"/>
      <line x1="74" y1="120" x2="106" y2="120"/>
      <line x1="144" y1="98" x2="144" y2="142"/>
      <line x1="128" y1="120" x2="160" y2="120"/>
    </g>
    <!-- Faint window glow (gas inside). -->
    <g fill="#f5b860" opacity="0.45" filter="url(#p10p1bloom)">
      <ellipse cx="36" cy="52" rx="14" ry="20"/>
      <ellipse cx="90" cy="52" rx="14" ry="20"/>
    </g>
    <!-- SHOP FRONT — ground level. -->
    <rect x="20" y="170" width="100" height="80" fill="#3a2818" stroke="#1a0808" stroke-width="0.8"/>
    <rect x="22" y="172" width="96" height="50" fill="#080404" stroke="#1a0808" stroke-width="0.5"/>
    <!-- Faint shop sign. -->
    <rect x="20" y="160" width="100" height="14" fill="#5a3018" stroke="#1a0808" stroke-width="0.5"/>
    <text x="70" y="170" font-family="serif" font-size="6" fill="#f0d878" font-weight="700" text-anchor="middle" opacity="0.85">·  HARTLEY  ·</text>
    <!-- Door. -->
    <rect x="130" y="190" width="34" height="60" fill="#3a1810" stroke="#1a0808" stroke-width="0.8"/>
    <circle cx="158" cy="220" r="1" fill="#a86028"/>
  </g>

  <!-- VICTORIAN BUILDINGS RIGHT side. -->
  <g id="p10p1-bldg-right">
    <rect x="562" y="20" width="180" height="240" fill="url(#p10p1brick)" stroke="#3a1810" stroke-width="0.7"/>
    <g stroke="#3a1810" stroke-width="0.4" opacity="0.65">
      <line x1="562" y1="40" x2="742" y2="40"/>
      <line x1="562" y1="60" x2="742" y2="60"/>
      <line x1="562" y1="80" x2="742" y2="80"/>
      <line x1="562" y1="100" x2="742" y2="100"/>
      <line x1="562" y1="120" x2="742" y2="120"/>
      <line x1="562" y1="140" x2="742" y2="140"/>
      <line x1="562" y1="160" x2="742" y2="160"/>
      <line x1="562" y1="180" x2="742" y2="180"/>
      <line x1="562" y1="200" x2="742" y2="200"/>
      <line x1="562" y1="220" x2="742" y2="220"/>
      <line x1="562" y1="240" x2="742" y2="240"/>
    </g>
    <g fill="#1a1010" stroke="#080404" stroke-width="0.7">
      <rect x="582" y="30" width="32" height="44" rx="1"/>
      <rect x="636" y="30" width="32" height="44" rx="1"/>
      <rect x="690" y="30" width="32" height="44" rx="1"/>
      <rect x="582" y="98" width="32" height="44" rx="1"/>
      <rect x="636" y="98" width="32" height="44" rx="1"/>
      <rect x="690" y="98" width="32" height="44" rx="1"/>
    </g>
    <g stroke="#3a2010" stroke-width="0.5" opacity="0.85">
      <line x1="598" y1="30" x2="598" y2="74"/>
      <line x1="582" y1="52" x2="614" y2="52"/>
      <line x1="652" y1="30" x2="652" y2="74"/>
      <line x1="636" y1="52" x2="668" y2="52"/>
      <line x1="706" y1="30" x2="706" y2="74"/>
      <line x1="690" y1="52" x2="722" y2="52"/>
      <line x1="598" y1="98" x2="598" y2="142"/>
      <line x1="582" y1="120" x2="614" y2="120"/>
      <line x1="652" y1="98" x2="652" y2="142"/>
      <line x1="636" y1="120" x2="668" y2="120"/>
      <line x1="706" y1="98" x2="706" y2="142"/>
      <line x1="690" y1="120" x2="722" y2="120"/>
    </g>
    <g fill="#f5b860" opacity="0.45" filter="url(#p10p1bloom)">
      <ellipse cx="598" cy="52" rx="14" ry="20"/>
      <ellipse cx="652" cy="52" rx="14" ry="20"/>
    </g>
    <rect x="582" y="170" width="100" height="80" fill="#3a2818" stroke="#1a0808" stroke-width="0.8"/>
    <rect x="584" y="172" width="96" height="50" fill="#080404" stroke="#1a0808" stroke-width="0.5"/>
    <rect x="692" y="190" width="34" height="60" fill="#3a1810" stroke="#1a0808" stroke-width="0.8"/>
    <circle cx="720" cy="220" r="1" fill="#a86028"/>
  </g>

  <!-- COBBLESTONE STREET ground. -->
  <rect x="0" y="260" width="742" height="80" fill="url(#p10p1cobble)"/>
  <!-- Street cobble pattern. -->
  <g fill="url(#p10p1cobble)" stroke="#1a1a20" stroke-width="0.5" opacity="0.85">
    <rect x="20" y="262" width="48" height="14" rx="2"/>
    <rect x="72" y="262" width="50" height="14" rx="2"/>
    <rect x="126" y="262" width="48" height="14" rx="2"/>
    <rect x="178" y="262" width="50" height="14" rx="2"/>
    <rect x="232" y="262" width="48" height="14" rx="2"/>
    <rect x="284" y="262" width="50" height="14" rx="2"/>
    <rect x="338" y="262" width="48" height="14" rx="2"/>
    <rect x="390" y="262" width="50" height="14" rx="2"/>
    <rect x="444" y="262" width="48" height="14" rx="2"/>
    <rect x="496" y="262" width="50" height="14" rx="2"/>
    <rect x="550" y="262" width="48" height="14" rx="2"/>
    <rect x="602" y="262" width="50" height="14" rx="2"/>
    <rect x="656" y="262" width="48" height="14" rx="2"/>
    <rect x="708" y="262" width="34" height="14" rx="2"/>

    <rect x="0" y="280" width="50" height="16" rx="2"/>
    <rect x="54" y="280" width="52" height="16" rx="2"/>
    <rect x="110" y="280" width="50" height="16" rx="2"/>
    <rect x="164" y="280" width="52" height="16" rx="2"/>
    <rect x="220" y="280" width="50" height="16" rx="2"/>
    <rect x="274" y="280" width="52" height="16" rx="2"/>
    <rect x="330" y="280" width="50" height="16" rx="2"/>
    <rect x="384" y="280" width="52" height="16" rx="2"/>
    <rect x="440" y="280" width="50" height="16" rx="2"/>
    <rect x="494" y="280" width="52" height="16" rx="2"/>
    <rect x="550" y="280" width="50" height="16" rx="2"/>
    <rect x="604" y="280" width="52" height="16" rx="2"/>
    <rect x="660" y="280" width="50" height="16" rx="2"/>
    <rect x="714" y="280" width="28" height="16" rx="2"/>

    <rect x="20" y="300" width="56" height="20" rx="3"/>
    <rect x="80" y="300" width="58" height="20" rx="3"/>
    <rect x="142" y="300" width="56" height="20" rx="3"/>
    <rect x="202" y="300" width="58" height="20" rx="3"/>
    <rect x="264" y="300" width="56" height="20" rx="3"/>
    <rect x="324" y="300" width="58" height="20" rx="3"/>
    <rect x="386" y="300" width="56" height="20" rx="3"/>
    <rect x="446" y="300" width="58" height="20" rx="3"/>
    <rect x="508" y="300" width="56" height="20" rx="3"/>
    <rect x="568" y="300" width="58" height="20" rx="3"/>
    <rect x="630" y="300" width="56" height="20" rx="3"/>
    <rect x="690" y="300" width="52" height="20" rx="3"/>
  </g>
  <g fill="#a8b0bc" opacity="0.45" filter="url(#p10p1bloom)">
    <ellipse cx="80" cy="304" rx="22" ry="2"/>
    <ellipse cx="180" cy="304" rx="22" ry="2"/>
    <ellipse cx="280" cy="304" rx="22" ry="2"/>
    <ellipse cx="380" cy="304" rx="22" ry="2"/>
    <ellipse cx="480" cy="304" rx="22" ry="2"/>
    <ellipse cx="580" cy="304" rx="22" ry="2"/>
    <ellipse cx="680" cy="304" rx="22" ry="2"/>
  </g>

  <!-- DRAIN GRATE flush in road (small, unremarkable from human scale). -->
  <g id="p10p1-grate">
    <rect x="290" y="260" width="120" height="50" fill="#1a0808" stroke="#080404" stroke-width="0.6"/>
    <line x1="310" y1="260" x2="310" y2="310" stroke="#3a1810" stroke-width="0.7"/>
    <line x1="330" y1="260" x2="330" y2="310" stroke="#3a1810" stroke-width="0.7"/>
    <line x1="350" y1="260" x2="350" y2="310" stroke="#3a1810" stroke-width="0.7"/>
    <line x1="370" y1="260" x2="370" y2="310" stroke="#3a1810" stroke-width="0.7"/>
    <line x1="390" y1="260" x2="390" y2="310" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- GAS LAMP burning low in daylight (right side). -->
  <g id="p10p1-lamp">
    <line x1="520" y1="80" x2="520" y2="270" stroke="#1a1010" stroke-width="2.5"/>
    <rect x="514" y="55" width="12" height="28" rx="1" fill="#3a2010" stroke="#080404" stroke-width="0.5"/>
    <rect x="510" y="44" width="20" height="14" rx="1" fill="#1a1010" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="520" cy="60" rx="80" ry="40" fill="url(#p10p1lampGlow)" filter="url(#p10p1deepBloom)" opacity="0.65"/>
    <ellipse cx="520" cy="60" rx="3" ry="6" fill="#ffe8a0" filter="url(#p10p1strongBloom)" opacity="0.85"/>
  </g>

  <!-- COSTERMONGER WITH BARROW (left foreground, human scale). -->
  <g id="p10p1-coster" transform="translate(220, 235)">
    <!-- Body. -->
    <ellipse cx="0" cy="0" rx="9" ry="20" fill="#3a2818" stroke="#080404" stroke-width="0.6"/>
    <!-- Head with cap. -->
    <circle cx="0" cy="-25" r="7" fill="#a87850"/>
    <ellipse cx="0" cy="-30" rx="8" ry="3" fill="#1a1010"/>
    <ellipse cx="3" cy="-30" rx="3" ry="2" fill="#1a1010"/>
    <!-- Arms grasping barrow handles. -->
    <path d="M9,-5 L25,5 L23,8 L9,0 Z" fill="#3a2818" stroke="#080404" stroke-width="0.5"/>
    <path d="M-9,-5 L-25,5 L-23,8 L-9,0 Z" fill="#3a2818" stroke="#080404" stroke-width="0.5"/>
    <!-- Legs. -->
    <path d="M-5,18 L-7,40 L-3,40 L-2,20 Z" fill="#1a1010" stroke="#080404" stroke-width="0.5"/>
    <path d="M2,20 L3,40 L7,40 L5,18 Z" fill="#1a1010" stroke="#080404" stroke-width="0.5"/>

    <!-- BARROW. -->
    <rect x="20" y="0" width="50" height="20" fill="#5a3018" stroke="#1a0808" stroke-width="0.6"/>
    <line x1="20" y1="3" x2="70" y2="3" stroke="#3a1810" stroke-width="0.4"/>
    <line x1="20" y1="9" x2="70" y2="9" stroke="#3a1810" stroke-width="0.4"/>
    <line x1="20" y1="15" x2="70" y2="15" stroke="#3a1810" stroke-width="0.4"/>
    <!-- Wheel. -->
    <circle cx="55" cy="28" r="9" fill="#3a1810" stroke="#1a0808" stroke-width="0.7"/>
    <circle cx="55" cy="28" r="3" fill="#5a3018" stroke="#1a0808" stroke-width="0.5"/>
    <g stroke="#1a0808" stroke-width="0.5">
      <line x1="55" y1="19" x2="55" y2="37"/>
      <line x1="46" y1="28" x2="64" y2="28"/>
      <line x1="49" y1="22" x2="61" y2="34"/>
      <line x1="49" y1="34" x2="61" y2="22"/>
    </g>
    <!-- Goods (vegetables). -->
    <g fill="#5a8848" opacity="0.85">
      <circle cx="30" cy="-2" r="3"/>
      <circle cx="38" cy="-3" r="3"/>
      <circle cx="46" cy="-2" r="3"/>
      <circle cx="55" cy="-3" r="3"/>
      <circle cx="63" cy="-2" r="3"/>
    </g>
  </g>

  <!-- WOMAN IN SHAWL crossing (right of center). -->
  <g id="p10p1-woman" transform="translate(440, 240)">
    <!-- Body in shawl. -->
    <path d="M-12,40 L-14,5 L-12,-15 L-5,-25 L5,-25 L12,-15 L14,5 L12,40 Z" fill="#3a2010" stroke="#080404" stroke-width="0.6"/>
    <!-- Shawl draping. -->
    <path d="M-14,-5 L-18,15 L-12,18 L-10,-10 Z" fill="#1a0808" stroke="#080404" stroke-width="0.5"/>
    <path d="M14,-5 L18,15 L12,18 L10,-10 Z" fill="#1a0808" stroke="#080404" stroke-width="0.5"/>
    <!-- Head with hat/bonnet. -->
    <ellipse cx="0" cy="-32" rx="8" ry="9" fill="#d8a880"/>
    <path d="M-9,-38 Q0,-44 9,-38 L9,-30 L-9,-30 Z" fill="#1a0808"/>
    <!-- Skirt bottom. -->
    <path d="M-12,40 L-16,55 L16,55 L12,40 Z" fill="#3a2010" stroke="#080404" stroke-width="0.5"/>
    <!-- Wicker basket. -->
    <ellipse cx="-20" cy="20" rx="8" ry="6" fill="#a86028" stroke="#3a1810" stroke-width="0.6"/>
    <line x1="-26" y1="14" x2="-14" y2="14" stroke="#3a1810" stroke-width="0.5"/>
    <path d="M-26,14 Q-20,8 -14,14" stroke="#3a1810" stroke-width="0.5" fill="none"/>
    <g stroke="#3a1810" stroke-width="0.4" opacity="0.85">
      <line x1="-25" y1="18" x2="-15" y2="18"/>
      <line x1="-26" y1="22" x2="-14" y2="22"/>
    </g>
  </g>

  <!-- CAPTION BOX. -->
  <g id="p10p1-caption">
    <rect x="14" y="14" width="380" height="46" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="24" y="36" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">The same street. The same rain. A world that doesn't know they exist.</text>
  </g>

  <!-- Meta. -->
  <g id="p10p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">SCALE-SHIFT</text>
  </g>
</svg>
