<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 12 — Panel 1: Crash site full reveal — shattered cathedral of dead hull</title>
  <desc>Wide establishing 24mm slightly elevated. Narrow Victorian courtyard cracked flagstones weeds brick walls three sides strip grey sky overhead. Largest fragment hull rests against base brick wall buried under newspaper drift dead leaves canvas scrap. Human-scale rubbish reads at fairy scale as shattered cathedral of dark hull plating dead holographic panels building-size. Squad at courtyard edge: Wren walking ahead of others toward wreckage, Sable assessing, Jink wide-eyed scale, Thresh weapon up perimeter, Luma cataloguing distance. SABLE primary hull section / WREN can see drive housing twenty minutes.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p12p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p12p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p12p1flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p12p1hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="50%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p12p1silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p12p1copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p12p1rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p12p1sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p12p1emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <linearGradient id="p12p1weedGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8848"/>
      <stop offset="100%" stop-color="#1a3008"/>
    </linearGradient>
    <filter id="p12p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p12p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG sky strip. -->
  <rect width="742" height="40" fill="url(#p12p1sky)"/>

  <!-- Brick walls — three sides framing courtyard. -->
  <rect x="0" y="40" width="80" height="240" fill="url(#p12p1brick)" stroke="#080404" stroke-width="0.85"/>
  <rect x="662" y="40" width="80" height="240" fill="url(#p12p1brick)" stroke="#080404" stroke-width="0.85"/>
  <rect x="80" y="40" width="582" height="200" fill="url(#p12p1brick)" stroke="#080404" stroke-width="0.7"/>

  <!-- Brick courses. -->
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="220" x2="742" y2="220"/>
    <line x1="0" y1="240" x2="80" y2="240"/>
    <line x1="662" y1="240" x2="742" y2="240"/>
    <line x1="0" y1="260" x2="80" y2="260"/>
    <line x1="662" y1="260" x2="742" y2="260"/>
  </g>

  <!-- Light drizzle. -->
  <g stroke="#a8b8c8" stroke-width="0.4" opacity="0.45">
    <line x1="120" y1="20" x2="118" y2="40"/>
    <line x1="280" y1="10" x2="278" y2="30"/>
    <line x1="440" y1="25" x2="438" y2="40"/>
    <line x1="600" y1="20" x2="598" y2="40"/>
  </g>

  <!-- WRECKAGE — BIG, dominant against far wall, center. Larger than P11/P11.5 versions. -->
  <g id="p12p1-wreckage">
    <!-- Main hull mass. -->
    <path d="M260,240 L290,140 L340,80 L420,60 L520,55 L590,75 L640,120 L660,180 L662,240 Z" fill="url(#p12p1hull)" stroke="#080404" stroke-width="1.4"/>
    <!-- Sharp panel angles. -->
    <g stroke="#080404" stroke-width="0.6" fill="none">
      <line x1="340" y1="80" x2="380" y2="120"/>
      <line x1="380" y1="60" x2="380" y2="180"/>
      <line x1="450" y1="58" x2="450" y2="200"/>
      <line x1="520" y1="55" x2="520" y2="220"/>
      <line x1="380" y1="120" x2="450" y2="120"/>
      <line x1="450" y1="180" x2="590" y2="180"/>
      <line x1="450" y1="200" x2="640" y2="200"/>
      <line x1="380" y1="160" x2="520" y2="160"/>
    </g>
    <!-- ETCHED holographic channels (dead). -->
    <g stroke="#1a1a20" stroke-width="0.6" fill="none" opacity="0.85">
      <path d="M310,90 L340,90 L350,100 L380,100"/>
      <path d="M390,70 L430,70 L440,80"/>
      <path d="M460,55 L500,55 L520,75"/>
      <path d="M390,140 L430,140 L430,160"/>
      <path d="M470,140 L520,140"/>
      <path d="M540,80 L580,80 L600,100 L620,100"/>
      <!-- Hex nodes (dead). -->
      <path d="M345,87 L350,84 L355,87 L355,93 L350,96 L345,93 Z"/>
      <path d="M425,137 L430,134 L435,137 L435,143 L430,146 L425,143 Z"/>
      <path d="M515,137 L520,134 L525,137 L525,143 L520,146 L515,143 Z"/>
      <path d="M605,97 L610,94 L615,97 L615,103 L610,106 L605,103 Z"/>
    </g>
    <!-- Hull breach. -->
    <path d="M460,170 L500,200 L530,210 L520,225 L470,210 L450,195 Z" fill="#080404" stroke="#080404" stroke-width="0.7"/>
    <!-- Impact fractures. -->
    <g stroke="#080404" stroke-width="0.85" fill="none">
      <path d="M380,80 L420,110 L440,130 L460,140"/>
      <path d="M510,90 L530,120 L540,140"/>
      <path d="M460,50 L450,100 L470,130"/>
    </g>

    <!-- DEBRIS at base. -->
    <g fill="#a89868" opacity="0.85">
      <polygon points="260,238 290,232 300,250 270,252" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="350,236 400,230 410,250 360,252" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="500,234 545,232 555,252 510,252" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="610,238 650,232 658,250 615,252" stroke="#5a4a30" stroke-width="0.3"/>
    </g>
    <g stroke="#5a4a30" stroke-width="0.3" opacity="0.65">
      <line x1="270" y1="240" x2="296" y2="238"/>
      <line x1="362" y1="240" x2="404" y2="236"/>
      <line x1="514" y1="240" x2="548" y2="236"/>
      <line x1="618" y1="242" x2="648" y2="240"/>
    </g>
    <!-- Dead leaves. -->
    <g fill="#5a3018" opacity="0.85">
      <ellipse cx="320" cy="244" rx="5" ry="2" transform="rotate(20 320 244)"/>
      <ellipse cx="430" cy="246" rx="5" ry="2" transform="rotate(-15 430 246)"/>
      <ellipse cx="475" cy="245" rx="4" ry="2" transform="rotate(30 475 245)"/>
      <ellipse cx="580" cy="244" rx="5" ry="2"/>
    </g>
    <!-- Canvas scrap. -->
    <path d="M390,234 L460,233 L460,250 L388,250 Z" fill="#3a2818" opacity="0.85" stroke="#1a0808" stroke-width="0.3"/>
  </g>

  <!-- COURTYARD FLAGSTONE GROUND foreground. -->
  <rect x="80" y="240" width="582" height="100" fill="url(#p12p1flag)" stroke="#1a1a20" stroke-width="0.85"/>
  <line x1="180" y1="240" x2="180" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
  <line x1="280" y1="240" x2="280" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
  <line x1="380" y1="240" x2="380" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
  <line x1="480" y1="240" x2="480" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
  <line x1="580" y1="240" x2="580" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
  <!-- Cracks. -->
  <g stroke="#1a1a20" stroke-width="0.7" opacity="0.85">
    <path d="M120,240 L130,290 L125,340"/>
    <path d="M220,240 L235,300 L228,340"/>
    <path d="M330,240 L342,295 L338,340"/>
    <path d="M440,240 L455,310 L450,340"/>
    <path d="M540,240 L555,295 L550,335"/>
    <path d="M620,240 L635,300 L630,340"/>
  </g>
  <g fill="#a8b0bc" opacity="0.45" filter="url(#p12p1bloom)">
    <ellipse cx="140" cy="260" rx="38" ry="2"/>
    <ellipse cx="240" cy="260" rx="38" ry="2"/>
    <ellipse cx="340" cy="260" rx="38" ry="2"/>
    <ellipse cx="440" cy="260" rx="38" ry="2"/>
    <ellipse cx="540" cy="260" rx="38" ry="2"/>
    <ellipse cx="640" cy="260" rx="38" ry="2"/>
  </g>

  <!-- Weeds. -->
  <g stroke="#5a8848" stroke-width="1" fill="none" opacity="0.85">
    <path d="M125,330 L122,300 L128,295 L130,280"/>
    <path d="M229,335 L228,295 L235,290 L233,275"/>
    <path d="M338,335 L338,300 L344,295"/>
    <path d="M445,335 L450,300 L455,290"/>
    <path d="M548,335 L555,295 L560,280"/>
    <path d="M625,338 L630,300 L632,290"/>
  </g>
  <g fill="url(#p12p1weedGreen)" opacity="0.85">
    <ellipse cx="130" cy="280" rx="3" ry="1.4" transform="rotate(60 130 280)"/>
    <ellipse cx="234" cy="278" rx="3.5" ry="1.4" transform="rotate(50 234 278)"/>
    <ellipse cx="345" cy="285" rx="3" ry="1.4" transform="rotate(70 345 285)"/>
    <ellipse cx="453" cy="278" rx="3.5" ry="1.4" transform="rotate(45 453 278)"/>
    <ellipse cx="558" cy="282" rx="3" ry="1.4" transform="rotate(60 558 282)"/>
  </g>

  <!-- 5 SQUAD MEMBERS at courtyard edge. -->
  <!-- WREN walking ahead toward wreckage (most foreground/right). -->
  <g id="p12p1-wren" transform="translate(225, 290)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p12p1copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f0a868" opacity="0.85" filter="url(#p12p1bloom)"/>
    <g fill="#1a0808" opacity="0.85"><ellipse cx="-12" cy="6" rx="2.5" ry="1.4"/><ellipse cx="12" cy="8" rx="2.5" ry="1.4"/></g>
    <g fill="#3a2010" opacity="0.85"><ellipse cx="-5" cy="0" rx="3" ry="1.4"/><ellipse cx="6" cy="14" rx="3" ry="1.4"/></g>
    <ellipse cx="2" cy="-37" rx="9" ry="10" fill="#e0c098"/>
    <ellipse cx="-1" cy="-46" rx="6" ry="4" fill="#1a0808"/>
    <line x1="-3" y1="-48" x2="2" y2="-45" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="2" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="8" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- SABLE — assessment, behind. -->
  <g id="p12p1-sable" transform="translate(160, 295)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p12p1silverDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M9,-12 L14,-3 L16,10 L14,20" fill="url(#p12p1silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p12p1bloom)"><path d="M11,-5 L14,5"/></g>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#dce4f0" opacity="0.45" filter="url(#p12p1bloom)"/>
    <ellipse cx="2" cy="-37" rx="9" ry="10" fill="#3a2818"/>
    <path d="M-7,-44 Q2,-49 11,-44 L11,-37 L-7,-37 Z" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="6" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- LUMA — observing analytically. -->
  <g id="p12p1-luma" transform="translate(110, 298)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p12p1sapphireDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#a878f8" opacity="0.65" filter="url(#p12p1bloom)"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#a87850"/>
    <path d="M-7,-32 Q-13,-22 -12,-10 Q-11,2 -13,12" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <line x1="-9" y1="-28" x2="-12" y2="10" stroke="#a878f8" stroke-width="0.4" opacity="0.85" filter="url(#p12p1bloom)"/>
    <ellipse cx="3" cy="-37" rx="3.5" ry="2.5" fill="#a878f8" opacity="0.65" stroke="#a878f8" stroke-width="0.4"/>
    <line x1="3" y1="-37" x2="6" y2="-35" stroke="#dce4f0" stroke-width="0.3" opacity="0.85"/>
    <ellipse cx="0" cy="-38" rx="1.2" ry="0.9" fill="#dce4f0"/>
    <ellipse cx="0" cy="-38" rx="0.6" ry="0.6" fill="#1a0808"/>
    <line x1="-2" y1="-30" x2="3" y2="-30" stroke="#3a1810" stroke-width="0.5"/>
  </g>

  <!-- THRESH — perimeter, weapon up. -->
  <g id="p12p1-thresh" transform="translate(680, 300)">
    <path d="M-11,28 L-13,5 L-11,-15 L-5,-25 L5,-25 L11,-15 L13,5 L11,28 Z" fill="url(#p12p1rubyDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M-11,-13 L-18,-3 L-18,12 L-11,18" fill="url(#p12p1rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-15,2 Q-13,8 -12,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f54848" opacity="0.65" filter="url(#p12p1bloom)"/>
    <rect x="-8" y="-2" width="22" height="5" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="-4" cy="0" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8a880"/>
    <path d="M-9,-44 Q0,-49 9,-44 L9,-37 L-9,-37 Z" fill="#a83a18"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- JINK — wide-eyed at scale. -->
  <g id="p12p1-jink" transform="translate(60, 302)">
    <ellipse cx="-8" cy="-12" rx="10" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(45 -8 -12)" filter="url(#p12p1bloom)"/>
    <ellipse cx="8" cy="-12" rx="10" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(-45 8 -12)" filter="url(#p12p1bloom)"/>
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p12p1emeraldDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#7af0b0" opacity="0.55" filter="url(#p12p1bloom)"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8b890"/>
    <path d="M-9,-44 Q0,-50 9,-44 L9,-37 L-9,-37 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-4" cy="-46" r="1.2"/><circle cx="0" cy="-48" r="1.2"/><circle cx="4" cy="-46" r="1.2"/></g>
    <!-- WIDE eyes. -->
    <ellipse cx="-3" cy="-39" rx="1.6" ry="1.2" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.6" ry="1.2" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.8" ry="0.8" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.8" ry="0.8" fill="#1a0808"/>
    <!-- Mouth slightly open. -->
    <ellipse cx="0" cy="-31" rx="2" ry="1" fill="#3a1010"/>
  </g>

  <!-- DIALOGUE -->
  <g id="p12p1-bal-sable">
    <rect x="14" y="14" width="220" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">That's the primary hull section.</text>
    <path d="M150,54 L162,54 L156,68 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="150" y1="54" x2="162" y2="54" stroke="#ffffff" stroke-width="3"/>
  </g>

  <g id="p12p1-bal-wren">
    <rect x="244" y="14" width="280" height="60" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="254" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="254" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I can see the drive housing</text>
    <text x="254" y="67" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">from here. Give me twenty minutes.</text>
    <path d="M280,74 L292,74 L286,86 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="280" y1="74" x2="292" y2="74" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p12p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">CRASH SITE</text>
  </g>
</svg>
