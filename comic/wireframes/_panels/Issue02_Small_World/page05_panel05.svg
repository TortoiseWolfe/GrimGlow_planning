<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 440" width="487" height="440">
  <title>Issue 2 — Page 5 — Panel 5: Sable decides — scale-shift composition</title>
  <desc>MW 35mm scale-shift split-focus. LEFT: Sable on bracket ledge, expression shifting calculation→decision (chin lifting). Cracked shoulder bleed. RIGHT: vast Victorian street beyond building edge — gas lamp lighthouse tower w/ amber sun glow in rain, granite setts boulder field, shop fronts, mist at ground level. Composition makes visual argument: crossing impossible without scout in air. SABLE multi-line orders + JINK off + SABLE warning + JINK off reply.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p5p5leaden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p5p5brick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="50%" stop-color="#1a1010"/>
      <stop offset="100%" stop-color="#3a2820"/>
    </linearGradient>
    <linearGradient id="p5p5silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a8b4"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="p5p5amberSun">
      <stop offset="0%" stop-color="#f5e060" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p5p5cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="p5p5crackBleed">
      <stop offset="0%" stop-color="#dce4ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7af0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p5p5mistBase" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a8a8b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a3e48" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p5p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p5p5deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG sky leaden grey. -->
  <rect width="487" height="240" fill="url(#p5p5leaden)"/>

  <!-- BG raindrops descending streaks. -->
  <g stroke="#a8b8c8" stroke-width="0.6" opacity="0.55" filter="url(#p5p5bloom)">
    <line x1="80" y1="20" x2="80" y2="60"/>
    <line x1="180" y1="40" x2="180" y2="80"/>
    <line x1="260" y1="20" x2="260" y2="60"/>
    <line x1="340" y1="40" x2="340" y2="80"/>
    <line x1="420" y1="20" x2="420" y2="60"/>
  </g>

  <!-- LEFT SIDE — BRICK WALL where Sable stands on bracket. -->
  <g id="p5p5-brick-wall-left">
    <rect x="0" y="0" width="200" height="380" fill="url(#p5p5brick)"/>
    <!-- Brick courses. -->
    <g stroke="#5a3818" stroke-width="0.4" opacity="0.55">
      <line x1="0" y1="40" x2="200" y2="40"/>
      <line x1="0" y1="80" x2="200" y2="80"/>
      <line x1="0" y1="120" x2="200" y2="120"/>
      <line x1="0" y1="160" x2="200" y2="160"/>
      <line x1="0" y1="200" x2="200" y2="200"/>
      <line x1="0" y1="240" x2="200" y2="240"/>
      <line x1="0" y1="280" x2="200" y2="280"/>
      <line x1="0" y1="320" x2="200" y2="320"/>
    </g>
    <g stroke="#5a3818" stroke-width="0.3" opacity="0.45">
      <line x1="50" y1="0" x2="50" y2="40"/>
      <line x1="120" y1="40" x2="120" y2="80"/>
      <line x1="60" y1="80" x2="60" y2="120"/>
      <line x1="140" y1="120" x2="140" y2="160"/>
      <line x1="80" y1="160" x2="80" y2="200"/>
      <line x1="160" y1="200" x2="160" y2="240"/>
      <line x1="100" y1="240" x2="100" y2="280"/>
      <line x1="40" y1="280" x2="40" y2="320"/>
    </g>
    <!-- Wet sheen. -->
    <g stroke="#7af0ff" stroke-width="0.4" opacity="0.55" filter="url(#p5p5bloom)">
      <line x1="40" y1="0" x2="42" y2="380"/>
      <line x1="100" y1="0" x2="98" y2="380"/>
      <line x1="160" y1="0" x2="162" y2="380"/>
    </g>
    <!-- Building edge (where wall meets street view — vertical edge mid-frame). -->
    <line x1="200" y1="0" x2="200" y2="380" stroke="#080404" stroke-width="2"/>
    <line x1="201" y1="0" x2="201" y2="380" stroke="#3a2018" stroke-width="0.7"/>
  </g>

  <!-- DRAINPIPE BRACKET LEDGE on left side (where Sable stands). -->
  <g id="p5p5-bracket">
    <rect x="0" y="280" width="200" height="20" fill="#3a3a45"/>
    <line x1="0" y1="280" x2="200" y2="280" stroke="#080a14" stroke-width="1.4"/>
    <line x1="0" y1="300" x2="200" y2="300" stroke="#080a14" stroke-width="0.7"/>
    <g fill="#080a14">
      <circle cx="40" cy="290" r="2"/>
      <circle cx="120" cy="290" r="2"/>
    </g>
  </g>

  <!-- RIGHT SIDE — VAST VICTORIAN STREET (script-specific scale-shift). -->
  <g id="p5p5-street-vast">
    <!-- Distant shop fronts. -->
    <rect x="200" y="120" width="287" height="220" fill="#1a1010" opacity="0.85"/>
    <!-- Shop windows. -->
    <rect x="240" y="180" width="80" height="100" fill="#3a3838" opacity="0.7"/>
    <rect x="240" y="180" width="80" height="100" fill="none" stroke="#080a14" stroke-width="0.5"/>
    <line x1="280" y1="180" x2="280" y2="280" stroke="#080a14" stroke-width="0.4"/>
    <ellipse cx="280" cy="220" rx="35" ry="25" fill="#a85820" opacity="0.45" filter="url(#p5p5bloom)"/>

    <rect x="380" y="160" width="100" height="120" fill="#3a3838" opacity="0.7"/>
    <rect x="380" y="160" width="100" height="120" fill="none" stroke="#080a14" stroke-width="0.5"/>
    <line x1="430" y1="160" x2="430" y2="280" stroke="#080a14" stroke-width="0.4"/>

    <!-- Cornice / architectural line. -->
    <rect x="200" y="120" width="287" height="6" fill="#0a0808"/>
  </g>

  <!-- GAS LAMP POST as LIGHTHOUSE TOWER (script-specific 24x height — visible in street, smaller than P5P1 reference). -->
  <g id="p5p5-gas-lamp">
    <!-- Base. -->
    <rect x="306" y="320" width="14" height="10" fill="#1a1820"/>
    <!-- Tall post. -->
    <rect x="311" y="160" width="4" height="160" fill="#1a1820"/>
    <!-- Lantern at top. -->
    <rect x="304" y="140" width="18" height="20" fill="#3a2818" stroke="#080a14" stroke-width="0.5"/>
    <!-- Lantern roof. -->
    <path d="M302,140 L313,128 L324,140 Z" fill="#1a1820"/>
    <!-- Top finial. -->
    <rect x="312" y="124" width="2" height="4" fill="#1a1820"/>
    <!-- AMBER SUN GLOW (script-specific). -->
    <ellipse cx="313" cy="150" rx="60" ry="50" fill="url(#p5p5amberSun)" filter="url(#p5p5deepBloom)" opacity="0.95"/>
    <ellipse cx="313" cy="150" rx="9" ry="8" fill="#fae898" filter="url(#p5p5bloom)"/>
  </g>

  <!-- KERBSTONE running across right side foreground. -->
  <g>
    <rect x="200" y="320" width="287" height="14" fill="#3a3e48"/>
    <line x1="200" y1="320" x2="487" y2="320" stroke="#080a14" stroke-width="0.7"/>
    <line x1="200" y1="334" x2="487" y2="334" stroke="#080a14" stroke-width="0.5"/>
  </g>

  <!-- GRANITE SETTS boulder field below kerb. -->
  <g id="p5p5-setts">
    <g fill="url(#p5p5cobble)" stroke="#080a14" stroke-width="0.5">
      <ellipse cx="240" cy="360" rx="22" ry="9"/>
      <ellipse cx="290" cy="362" rx="22" ry="9"/>
      <ellipse cx="340" cy="360" rx="22" ry="9"/>
      <ellipse cx="390" cy="362" rx="22" ry="9"/>
      <ellipse cx="440" cy="360" rx="22" ry="9"/>
      <ellipse cx="480" cy="362" rx="14" ry="7"/>

      <ellipse cx="220" cy="395" rx="20" ry="8"/>
      <ellipse cx="270" cy="397" rx="20" ry="8"/>
      <ellipse cx="320" cy="395" rx="20" ry="8"/>
      <ellipse cx="370" cy="397" rx="20" ry="8"/>
      <ellipse cx="420" cy="395" rx="20" ry="8"/>
      <ellipse cx="470" cy="397" rx="18" ry="7"/>
    </g>
    <!-- Wet sheen. -->
    <g fill="#7a7e88" opacity="0.55" filter="url(#p5p5bloom)">
      <ellipse cx="240" cy="356" rx="14" ry="2"/>
      <ellipse cx="340" cy="356" rx="14" ry="2"/>
      <ellipse cx="440" cy="356" rx="14" ry="2"/>
    </g>
  </g>

  <!-- PERMANENT MIST at ground level (script-specific). -->
  <ellipse cx="343" cy="430" rx="200" ry="18" fill="url(#p5p5mistBase)" filter="url(#p5p5deepBloom)" opacity="0.7"/>

  <!-- AMBER GASLIGHT REFLECTIONS on wet cobbles. -->
  <g fill="#f5b860" opacity="0.5" filter="url(#p5p5bloom)">
    <ellipse cx="290" cy="395" rx="26" ry="3"/>
    <ellipse cx="370" cy="395" rx="20" ry="3"/>
  </g>

  <!-- SABLE on bracket ledge (left side, script-specific scale-shift). Larger figure than typical. -->
  <g id="p5p5-sable" transform="translate(120, 220)">

    <!-- Lower legs. -->
    <path d="M-13,55 L-15,65" fill="none" stroke="#3a3a45" stroke-width="11" stroke-linecap="round"/>
    <path d="M13,55 L15,65" fill="none" stroke="#3a3a45" stroke-width="11" stroke-linecap="round"/>

    <!-- Thighs. -->
    <path d="M-15,5 L-13,55 L0,55" fill="url(#p5p5silver)" stroke="#080408" stroke-width="0.7"/>
    <path d="M15,5 L13,55 L0,55" fill="url(#p5p5silver)" stroke="#080408" stroke-width="0.7"/>
    <rect x="-15" y="0" width="30" height="6" fill="#3a3a45" stroke="#080408" stroke-width="0.4"/>

    <!-- Torso. -->
    <path d="M-20,-30 Q-26,5 -16,32 L16,32 Q26,5 20,-30 L10,-38 L-10,-38 Z" fill="url(#p5p5silver)" stroke="#080408" stroke-width="0.8"/>
    <line x1="0" y1="-26" x2="0" y2="28" stroke="#dce4ff" stroke-width="0.6" opacity="0.7" filter="url(#p5p5bloom)"/>

    <!-- Water spots. -->
    <g fill="#080a14" opacity="0.55">
      <circle cx="-14" cy="-18" r="1.2"/>
      <circle cx="14" cy="-18" r="1.2"/>
      <circle cx="-10" cy="-5" r="0.9"/>
      <circle cx="10" cy="-5" r="0.9"/>
    </g>

    <!-- Shoulders. -->
    <ellipse cx="-20" cy="-28" rx="8" ry="4" fill="#a8a8b0" stroke="#080408" stroke-width="0.5"/>
    <!-- CRACKED right shoulder bright bleed (continuity). -->
    <ellipse cx="20" cy="-28" rx="8" ry="4" fill="#a8a8b0" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="20" cy="-28" rx="13" ry="9" fill="url(#p5p5crackBleed)" filter="url(#p5p5strongBloom)" opacity="0.95"/>
    <g stroke="#080408" stroke-width="0.6" fill="none">
      <line x1="14" y1="-30" x2="26" y2="-22"/>
      <line x1="20" y1="-32" x2="22" y2="-22"/>
    </g>
    <g stroke="#dce4ff" stroke-width="0.5" filter="url(#p5p5bloom)" opacity="0.85">
      <line x1="14" y1="-30" x2="26" y2="-22"/>
    </g>

    <!-- Arms — left at side, right toward Jink/decision pose. -->
    <path d="M-20,-15 L-22,5 L-20,28" fill="none" stroke="url(#p5p5silver)" stroke-width="6" stroke-linecap="round"/>
    <path d="M20,-15 L22,5 L20,28" fill="none" stroke="url(#p5p5silver)" stroke-width="6" stroke-linecap="round"/>

    <!-- Head — chin lifting (the tell of decision per script). -->
    <ellipse cx="0" cy="-58" rx="13" ry="14" fill="#5a3818"/>
    <!-- Silver buzz. -->
    <path d="M-9,-66 Q0,-70 9,-66 L9,-58 L-9,-58 Z" fill="#c8ccd4"/>
    <g fill="#a8acb4" opacity="0.85">
      <circle cx="-5" cy="-68" r="0.6"/>
      <circle cx="0" cy="-69" r="0.6"/>
      <circle cx="5" cy="-68" r="0.6"/>
    </g>
    <!-- Eyes (chin up = looking slightly upward). -->
    <ellipse cx="-4" cy="-56" rx="1.4" ry="1" fill="#080404"/>
    <ellipse cx="4" cy="-56" rx="1.4" ry="1" fill="#080404"/>
    <circle cx="-3" cy="-57" r="0.4" fill="#dce4ff"/>
    <circle cx="5" cy="-57" r="0.4" fill="#dce4ff"/>
    <!-- Brow set (decisive). -->
    <path d="M-7,-62 Q-3,-64 -1,-62" stroke="#3a2810" stroke-width="1" fill="none"/>
    <path d="M1,-62 Q3,-64 7,-62" stroke="#3a2810" stroke-width="1" fill="none"/>
    <!-- Cheekbones. -->
    <ellipse cx="-9" cy="-50" rx="3" ry="1.5" fill="#3a2010" opacity="0.55"/>
    <ellipse cx="9" cy="-50" rx="3" ry="1.5" fill="#3a2010" opacity="0.55"/>
    <!-- Lips firm (decision made). -->
    <line x1="-3" y1="-44" x2="3" y2="-44" stroke="#3a1810" stroke-width="1.2"/>
    <!-- Cool catch under jaw. -->
    <ellipse cx="0" cy="-40" rx="9" ry="2" fill="#dce4ff" opacity="0.55" filter="url(#p5p5bloom)"/>
  </g>

  <!-- SABLE multi-line orders dialogue (top). -->
  <g id="p5p5-dlg-sable">
    <rect x="14" y="14" width="240" height="76" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="33" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="51" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Low and fast. Map route.</text>
    <text x="24" y="68" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Identify cover positions.</text>
    <text x="24" y="85" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" font-style="italic" fill="#3a3030">Do NOT engage anything.</text>
    <path d="M118,90 L136,90 L130,160 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="118" y1="90" x2="136" y2="90" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- JINK off-panel reply 1. -->
  <g id="p5p5-dlg-jink-off-1">
    <rect x="266" y="14" width="100" height="32" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-dasharray="6,3" filter="url(#balloonShadow)"/>
    <text x="276" y="31" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK (OFF)</text>
    <text x="276" y="42" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Copy!</text>
    <path d="M340,46 L356,46 L380,80 Z" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3,2"/>
  </g>

  <!-- SABLE warning. -->
  <g id="p5p5-dlg-sable-warning">
    <rect x="14" y="380" width="220" height="44" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="398" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="416" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="800" fill="#1a1a1a">Jink. I mean it. Nothing.</text>
    <path d="M120,380 L138,380 L130,260 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="120" y1="380" x2="138" y2="380" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- JINK off reply 2 (subdued). -->
  <g id="p5p5-dlg-jink-off-2">
    <rect x="266" y="380" width="120" height="32" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-dasharray="6,3" filter="url(#balloonShadow)"/>
    <text x="276" y="397" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK (OFF)</text>
    <text x="276" y="408" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#3a3030">...copy.</text>
    <path d="M340,380 L356,380 L380,360 Z" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3,2"/>
  </g>

  <!-- Meta tag. -->
  <g id="p5p5-meta">
    <text x="479" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">5</text>
    <text x="483" y="432" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE DECIDES — SCALE SHIFT</text>
  </g>
</svg>
