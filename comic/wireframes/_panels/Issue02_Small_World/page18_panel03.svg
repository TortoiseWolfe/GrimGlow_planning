<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 700" width="366" height="700">
  <title>Issue 2 — Page 18 — Panel 3: Night, squad sleeping, dimmed amber, perimeter steady</title>
  <desc>MS 50mm low angle floor level looking up wall cavity night. Amber power cell dimmed low warm ember glow. Above: Jink emerald curled up narrow wooden lath one arm dangling golden curls falling over edge face peaceful sleep restless energy finally still. Below: Luma sapphire-violet lying side timber joist atop scrap old sacking eyes closed lenses deactivated dark scanner beside hand. Long dark braid filament faint pulse light. Background: blue-white perimeter lines glow steadily entrance gap brightest light frame. Deep shadows cavity. Emerald seams faint above. Intimate exhausted quiet. NO DIALOGUE — silence.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p3night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p18p3plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p18p3lath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p18p3joist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p18p3sacking" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4828"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p18p3sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p18p3emeraldDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <radialGradient id="p18p3amberEmber">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p3perimSteady">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p18p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p18p3deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG night cavity. -->
  <rect width="366" height="700" fill="url(#p18p3night)"/>

  <!-- Plaster wall hint. -->
  <rect x="0" y="0" width="366" height="700" fill="url(#p18p3plaster)" opacity="0.65"/>
  <g stroke="#1a0808" stroke-width="0.7" opacity="0.65">
    <line x1="0" y1="100" x2="366" y2="100"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="300" x2="366" y2="300"/>
    <line x1="0" y1="400" x2="366" y2="400"/>
    <line x1="0" y1="500" x2="366" y2="500"/>
    <line x1="0" y1="600" x2="366" y2="600"/>
  </g>

  <!-- LATH high in frame. -->
  <rect x="0" y="120" width="366" height="14" fill="url(#p18p3lath)" stroke="#080404" stroke-width="0.85"/>

  <!-- BLUE-WHITE PERIMETER glowing background — far end (entrance). -->
  <ellipse cx="320" cy="350" rx="80" ry="120" fill="url(#p18p3perimSteady)" filter="url(#p18p3deepBloom)" opacity="0.85"/>
  <g stroke="#a8d8f8" stroke-width="0.7" fill="none" opacity="0.85" filter="url(#p18p3bloom)">
    <path d="M320,260 L350,255"/>
    <path d="M320,440 L350,430"/>
    <path d="M320,260 L320,440"/>
    <path d="M350,255 L350,430"/>
    <path d="M320,350 L350,350"/>
  </g>
  <g fill="#dce4f0" opacity="0.85" filter="url(#p18p3bloom)">
    <circle cx="320" cy="262" r="0.85"/>
    <circle cx="350" cy="257" r="0.85"/>
    <circle cx="320" cy="438" r="0.85"/>
    <circle cx="350" cy="428" r="0.85"/>
  </g>

  <!-- AMBER EMBER glow from power cell. -->
  <ellipse cx="180" cy="500" rx="240" ry="160" fill="url(#p18p3amberEmber)" filter="url(#p18p3deepBloom)" opacity="0.85"/>
  <g transform="translate(180, 500)">
    <path d="M-8,0 L-6,-7 L0,-9 L6,-7 L8,0 L6,7 L0,9 L-6,7 Z" fill="#3a3a44" stroke="#080404" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="3" fill="#a85820" opacity="0.85" filter="url(#p18p3bloom)"/>
  </g>

  <!-- Timber JOIST FLOOR. -->
  <rect x="0" y="540" width="366" height="160" fill="url(#p18p3joist)" stroke="#080404" stroke-width="0.85"/>
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.85">
    <line x1="0" y1="560" x2="366" y2="560"/>
    <line x1="0" y1="600" x2="366" y2="600"/>
    <line x1="0" y1="640" x2="366" y2="640"/>
  </g>

  <!-- SACKING SHEET on joist (under Luma). -->
  <path d="M40,545 L260,540 L270,580 L50,585 Z" fill="url(#p18p3sacking)" stroke="#080404" stroke-width="0.5"/>
  <g stroke="#3a2818" stroke-width="0.3" opacity="0.85">
    <line x1="50" y1="555" x2="265" y2="552"/>
    <line x1="50" y1="565" x2="265" y2="562"/>
    <line x1="50" y1="575" x2="265" y2="572"/>
  </g>

  <!-- JINK curled on lath (asleep). -->
  <g id="p18p3-jink" transform="translate(120, 110)">
    <!-- Wing-pack stowed faint emerald. -->
    <ellipse cx="-8" cy="0" rx="14" ry="5" fill="#3aa078" opacity="0.45" transform="rotate(40 -8 0)" filter="url(#p18p3bloom)"/>
    <ellipse cx="8" cy="0" rx="14" ry="5" fill="#3aa078" opacity="0.45" transform="rotate(-40 8 0)" filter="url(#p18p3bloom)"/>

    <!-- Body curled side (head right). -->
    <path d="M-30,15 L-32,-2 L-25,-15 L-12,-15 L0,-13 L15,-12 L25,-10 L30,5 L25,18 L0,22 Z" fill="url(#p18p3emeraldDim)" stroke="#080404" stroke-width="0.6"/>

    <!-- One arm DANGLING off lath. -->
    <path d="M-25,15 L-32,40 L-26,42 L-19,18 Z" fill="url(#p18p3emeraldDim)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="-30" cy="44" rx="4" ry="3" fill="#d8b890" stroke="#3a1808" stroke-width="0.4"/>

    <!-- Head (right side, asleep). -->
    <ellipse cx="25" cy="-3" rx="11" ry="11" fill="#d8b890"/>
    <!-- Curls falling over edge. -->
    <path d="M30,8 Q35,16 32,28" stroke="#f0d878" stroke-width="2" fill="none"/>
    <path d="M28,10 Q30,20 26,30" stroke="#f0d878" stroke-width="2" fill="none"/>
    <path d="M22,12 Q24,22 19,32" stroke="#f0d878" stroke-width="2" fill="none"/>
    <!-- Top curls. -->
    <path d="M16,-12 Q25,-18 34,-12 L34,-3 L16,-3 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="20" cy="-14" r="1.4"/><circle cx="25" cy="-16" r="1.4"/><circle cx="30" cy="-14" r="1.4"/></g>
    <!-- Eyes closed (lash lines). -->
    <path d="M22,-5 Q24,-3 26,-5" stroke="#1a0808" stroke-width="0.85" fill="none"/>
    <path d="M28,-5 Q30,-3 32,-5" stroke="#1a0808" stroke-width="0.85" fill="none"/>
    <!-- Mouth peaceful. -->
    <line x1="25" y1="3" x2="29" y2="3" stroke="#1a0808" stroke-width="0.6"/>
  </g>

  <!-- LUMA lying side on sacking. -->
  <g id="p18p3-luma" transform="translate(160, 560)">
    <!-- Body lying side (horizontal). -->
    <path d="M-100,15 L-95,-5 L-85,-12 L-50,-15 L-15,-15 L20,-12 L50,-10 L75,-3 L85,8 L80,18 L-100,25 Z" fill="url(#p18p3sapphireDirty)" stroke="#080404" stroke-width="0.7"/>
    <!-- Head right side. -->
    <ellipse cx="80" cy="-15" rx="14" ry="13" fill="#a87850"/>
    <!-- Long braid extending behind. -->
    <path d="M70,-15 Q60,-15 50,-20 Q40,-25 35,-20 Q30,-15 25,-22" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <line x1="68" y1="-14" x2="27" y2="-21" stroke="#a878f8" stroke-width="0.5" opacity="0.85" filter="url(#p18p3bloom)"/>
    <!-- Filament pulse along braid. -->
    <g fill="#a878f8" opacity="0.95" filter="url(#p18p3bloom)">
      <circle cx="60" cy="-17" r="0.85"/>
      <circle cx="48" cy="-21" r="0.85"/>
      <circle cx="35" cy="-22" r="0.85"/>
    </g>
    <!-- Cracked right lens deactivated (dark). -->
    <ellipse cx="86" cy="-15" rx="3.5" ry="2.5" fill="#3a2810" stroke="#1a0808" stroke-width="0.4"/>
    <line x1="86" y1="-15" x2="89" y2="-12" stroke="#5a4828" stroke-width="0.3" opacity="0.85"/>
    <!-- Eye CLOSED. -->
    <path d="M76,-15 Q80,-13 84,-15" stroke="#1a0808" stroke-width="0.85" fill="none"/>
    <!-- Mouth peaceful. -->
    <line x1="80" y1="-8" x2="85" y2="-8" stroke="#1a0808" stroke-width="0.6"/>

    <!-- Hand near scanner (ready even asleep). -->
    <ellipse cx="-90" cy="20" rx="6" ry="4" fill="#a87850" stroke="#3a1808" stroke-width="0.5"/>
    <!-- DARK SCANNER beside hand. -->
    <rect x="-110" y="15" width="14" height="9" rx="1" fill="#3a3a44" stroke="#080404" stroke-width="0.5"/>
  </g>

  <!-- NO DIALOGUE. -->

  <!-- Meta. -->
  <g id="p18p3-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">3</text>
    <text x="362" y="692" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">NIGHT IN THE WALL</text>
  </g>
</svg>
