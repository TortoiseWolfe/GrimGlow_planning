<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 16 — Panel 1: Jink perched on lath, restless in confinement</title>
  <desc>MS 50mm eye level. Jink emerald perches on horizontal wooden lath high inside cavity — one leg dangling other drawn up restless. Wing-pack stowed glows faint emerald seams. One hand traces idle dust patterns plaster wall. Restless fidgeting constrained — scout caged confined space. Warm amber light from below uplighting face emerald reflecting amber. Lath-and-plaster shadow behind narrow lath barely wide enough perch. JINK so we just wait here in a wall / SABLE OP rest plan prepare in that order / JINK not good at first one.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p1dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p16p1plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4828"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p16p1lath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p16p1amberUp">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p16p1emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <radialGradient id="p16p1wingDim">
      <stop offset="0%" stop-color="#7af0b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p16p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p16p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark cavity. -->
  <rect width="366" height="320" fill="url(#p16p1dark)"/>

  <!-- LATH-AND-PLASTER WALL (background, fills frame). -->
  <rect width="366" height="320" fill="url(#p16p1plaster)" opacity="0.85"/>
  <!-- Horizontal lath strips. -->
  <g stroke="#1a0808" stroke-width="0.85" opacity="0.85">
    <line x1="0" y1="20" x2="366" y2="20"/>
    <line x1="0" y1="40" x2="366" y2="40"/>
    <line x1="0" y1="60" x2="366" y2="60"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="100" x2="366" y2="100"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="180" x2="366" y2="180"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="220" x2="366" y2="220"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
    <line x1="0" y1="260" x2="366" y2="260"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
    <line x1="0" y1="300" x2="366" y2="300"/>
  </g>
  <!-- Plaster bulging through lath gaps. -->
  <g fill="#a89870" opacity="0.55">
    <ellipse cx="40" cy="30" rx="20" ry="3"/>
    <ellipse cx="120" cy="50" rx="22" ry="3"/>
    <ellipse cx="220" cy="70" rx="20" ry="3"/>
    <ellipse cx="320" cy="50" rx="22" ry="3"/>
    <ellipse cx="60" cy="110" rx="22" ry="3"/>
    <ellipse cx="180" cy="130" rx="20" ry="3"/>
    <ellipse cx="280" cy="110" rx="22" ry="3"/>
    <ellipse cx="40" cy="220" rx="20" ry="3"/>
    <ellipse cx="160" cy="240" rx="22" ry="3"/>
    <ellipse cx="280" cy="220" rx="20" ry="3"/>
  </g>

  <!-- DUST patterns/scratches Jink has been tracing on the plaster. -->
  <g stroke="#a89870" stroke-width="0.5" fill="none" opacity="0.65">
    <path d="M260,150 Q270,160 275,170"/>
    <path d="M280,155 Q290,165 295,180"/>
    <path d="M260,180 L290,185"/>
    <path d="M270,200 L295,200 L295,210"/>
  </g>

  <!-- AMBER UPLIGHTING from below. -->
  <ellipse cx="183" cy="320" rx="280" ry="180" fill="url(#p16p1amberUp)" filter="url(#p16p1deepBloom)" opacity="0.85"/>

  <!-- THE LATH PERCH — slightly thicker horizontal strip Jink sits on. -->
  <rect x="0" y="195" width="366" height="14" fill="url(#p16p1lath)" stroke="#080404" stroke-width="0.85"/>
  <!-- Lath edge highlights. -->
  <line x1="0" y1="197" x2="366" y2="197" stroke="#5a3a18" stroke-width="0.4" opacity="0.85"/>
  <!-- Iron nails securing lath. -->
  <g fill="#080404">
    <circle cx="80" cy="202" r="1.2"/>
    <circle cx="180" cy="202" r="1.2"/>
    <circle cx="280" cy="202" r="1.2"/>
  </g>

  <!-- JINK perched on lath, side view. -->
  <g id="p16p1-jink" transform="translate(180, 195)">
    <!-- Wing-pack stowed at back, glowing. -->
    <ellipse cx="-22" cy="-30" rx="18" ry="6" fill="url(#p16p1wingDim)" opacity="0.85" transform="rotate(35 -22 -30)" filter="url(#p16p1bloom)"/>
    <ellipse cx="-22" cy="-15" rx="14" ry="5" fill="url(#p16p1wingDim)" opacity="0.65" transform="rotate(35 -22 -15)" filter="url(#p16p1bloom)"/>
    <!-- Wing seams emerald glow. -->
    <g stroke="#7af0b0" stroke-width="0.5" fill="none" opacity="0.95" filter="url(#p16p1bloom)">
      <line x1="-12" y1="-25" x2="-30" y2="-35"/>
      <line x1="-12" y1="-15" x2="-30" y2="-25"/>
    </g>

    <!-- Body sitting (slight forward lean). -->
    <path d="M-12,40 L-15,5 L-12,-15 L-6,-25 L6,-25 L12,-15 L15,5 L12,40 Z" fill="url(#p16p1emeraldDirty)" stroke="#080404" stroke-width="0.7"/>
    <!-- Emerald collar pulse. -->
    <ellipse cx="0" cy="-25" rx="9" ry="2.5" fill="#7af0b0" opacity="0.85" filter="url(#p16p1bloom)"/>

    <!-- ONE LEG DANGLING (right leg over edge). -->
    <path d="M3,40 L8,80 L4,82 L-1,42 Z" fill="url(#p16p1emeraldDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="6" cy="84" rx="4" ry="2" fill="#1a1a20" stroke="#080810" stroke-width="0.4"/>
    <!-- OTHER LEG DRAWN UP (knee bent). -->
    <path d="M-3,40 L-8,30 L-12,5 L-6,-2 L-2,30 Z" fill="url(#p16p1emeraldDirty)" stroke="#080404" stroke-width="0.5"/>
    <!-- Drawn knee top visible. -->
    <ellipse cx="-12" cy="5" rx="3" ry="2" fill="url(#p16p1emeraldDirty)" stroke="#080404" stroke-width="0.4"/>

    <!-- HAND TRACING dust on plaster (right hand reaching to wall). -->
    <path d="M14,-5 L26,-15 L30,-12 L18,-2 Z" fill="url(#p16p1emeraldDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="32" cy="-13" rx="3" ry="2" fill="#d8b890" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Fingers tracing. -->
    <line x1="34" y1="-15" x2="40" y2="-18" stroke="#d8b890" stroke-width="0.7"/>

    <!-- HEAD looking down (at squad below). -->
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#d8b890"/>
    <!-- Curls. -->
    <path d="M-9,-44 Q0,-50 9,-44 L9,-37 L-9,-37 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-4" cy="-46" r="1.2"/><circle cx="0" cy="-48" r="1.2"/><circle cx="4" cy="-46" r="1.2"/></g>
    <!-- Eyes looking down. -->
    <ellipse cx="-3" cy="-35" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-35" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-34" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-34" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Slight smirk. -->
    <path d="M-3,-28 Q0,-26 3,-28" stroke="#1a0808" stroke-width="0.7" fill="none"/>

    <!-- Amber catch on face (uplighting). -->
    <ellipse cx="0" cy="-30" rx="14" ry="10" fill="#ffe8a0" opacity="0.55" filter="url(#p16p1strongBloom)"/>
  </g>

  <!-- DIALOGUE -->
  <g id="p16p1-bal-jink1">
    <rect x="14" y="14" width="240" height="46" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">So we just... wait here? In a wall?</text>
  </g>

  <g id="p16p1-bal-sable-op">
    <rect x="14" y="64" width="240" height="62" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-dasharray="4,3" filter="url(#balloonShadow)"/>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE (O.P.)</text>
    <text x="24" y="104" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">We rest. We plan. We prepare.</text>
    <text x="24" y="121" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">In that order.</text>
  </g>

  <g id="p16p1-bal-jink2">
    <rect x="14" y="262" width="240" height="46" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="302" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I'm not good at the first one.</text>
  </g>

  <!-- Meta. -->
  <g id="p16p1-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">CAGED</text>
  </g>
</svg>
