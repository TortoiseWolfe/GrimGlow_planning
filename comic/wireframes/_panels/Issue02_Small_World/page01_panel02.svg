<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 340" width="366" height="340">
  <title>Issue 2 — Page 1 — Panel 2: Sable + data module — silent reading</title>
  <desc>MCU 50mm profile. Sable sits LARGE against gutter inner wall. Lead lining riveted seams behind her at fairy scale. Holds DATA MODULE in lap. Screen casts blue-white geometric light UP onto jaw + throat + cracked right shoulder fractures. Tight controlled-concern. Reading bad news, deciding to keep it. NO DIALOGUE.</desc>

  <defs>
    <linearGradient id="p1p2grey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5e68"/>
      <stop offset="100%" stop-color="#2a2e38"/>
    </linearGradient>
    <linearGradient id="p1p2lead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#5a5e68"/>
    </linearGradient>
    <linearGradient id="p1p2silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a8b4"/>
      <stop offset="50%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="p1p2screenGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#7af0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1p2crackBleed">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7af0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p1p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p1p2deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- BG grey ambient. -->
  <rect width="366" height="340" fill="url(#p1p2grey)"/>

  <!-- LEAD GUTTER WALL behind Sable (riveted seams visible at fairy scale). -->
  <g id="p1p2-gutter-wall">
    <rect x="0" y="0" width="366" height="340" fill="url(#p1p2lead)"/>
    <!-- Riveted plate seams (vertical). -->
    <g stroke="#0a0c10" stroke-width="0.8" opacity="0.85">
      <line x1="100" y1="0" x2="100" y2="340"/>
      <line x1="260" y1="0" x2="260" y2="340"/>
    </g>
    <!-- Horizontal seams. -->
    <g stroke="#0a0c10" stroke-width="0.6" opacity="0.7">
      <line x1="0" y1="80" x2="366" y2="80"/>
      <line x1="0" y1="180" x2="366" y2="180"/>
      <line x1="0" y1="280" x2="366" y2="280"/>
    </g>
    <!-- Rivets along seams. -->
    <g fill="#0a0c10" opacity="0.85">
      <circle cx="100" cy="100" r="2.5"/>
      <circle cx="100" cy="200" r="2.5"/>
      <circle cx="100" cy="300" r="2.5"/>
      <circle cx="260" cy="100" r="2.5"/>
      <circle cx="260" cy="200" r="2.5"/>
      <circle cx="260" cy="300" r="2.5"/>
      <circle cx="100" cy="40" r="2"/>
      <circle cx="260" cy="40" r="2"/>
    </g>
    <!-- Lead patina texture. -->
    <g fill="#1a1c20" opacity="0.55">
      <circle cx="40" cy="120" r="1.4"/>
      <circle cx="180" cy="220" r="1.2"/>
      <circle cx="320" cy="260" r="1.4"/>
      <circle cx="60" cy="280" r="1.2"/>
      <circle cx="320" cy="100" r="1.2"/>
      <circle cx="180" cy="40" r="1"/>
    </g>
  </g>

  <!-- SABLE LARGE PROFILE — sitting against wall, dominant in frame. Knees up, holding device in lap. Facing right. -->
  <g id="p1p2-sable" transform="translate(180, 180)">

    <!-- Lower legs (extending down + to right — boots). -->
    <path d="M-26,90 Q-12,108 12,118 L52,128 L70,140" fill="none" stroke="#3a3a45" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="68" cy="142" rx="14" ry="5" fill="#080408"/>
    <!-- Greave plates. -->
    <ellipse cx="20" cy="118" rx="10" ry="6" fill="#5a606a" stroke="#080408" stroke-width="0.5"/>

    <!-- Thighs raised (knees up profile). -->
    <path d="M-26,30 Q-32,55 -22,90 L20,90 Q26,55 22,30 Z" fill="url(#p1p2silver)" stroke="#080408" stroke-width="0.8"/>
    <!-- Knee cap. -->
    <ellipse cx="0" cy="35" rx="20" ry="8" fill="#a0a8b4"/>
    <!-- Hip belt. -->
    <rect x="-26" y="24" width="52" height="9" fill="#3a3a45" stroke="#080408" stroke-width="0.5"/>
    <rect x="-6" y="24" width="12" height="9" fill="#5a606a" stroke="#080408" stroke-width="0.4"/>

    <!-- TORSO leaning slightly forward (looking down at lap). -->
    <path d="M-32,-50 Q-38,-15 -28,18 L28,18 Q38,-15 32,-50 L14,-58 L-14,-58 Z" fill="url(#p1p2silver)" stroke="#080408" stroke-width="0.9"/>
    <!-- Suit chest seam glow (subtle). -->
    <line x1="0" y1="-46" x2="0" y2="14" stroke="#dce4ff" stroke-width="0.6" opacity="0.6" filter="url(#p1p2bloom)"/>
    <!-- Chest plate band. -->
    <line x1="-28" y1="-25" x2="28" y2="-25" stroke="#080408" stroke-width="0.6" opacity="0.85"/>

    <!-- WATER SPOT MARKS on shoulders (script: first marks). -->
    <g fill="#080a14" opacity="0.55">
      <circle cx="-26" cy="-40" r="1.5"/>
      <circle cx="-30" cy="-32" r="1"/>
      <circle cx="-22" cy="-26" r="1"/>
      <circle cx="-18" cy="-15" r="0.8"/>
      <circle cx="26" cy="-40" r="1.5"/>
      <circle cx="30" cy="-32" r="1"/>
      <circle cx="22" cy="-26" r="1"/>
      <circle cx="18" cy="-15" r="0.8"/>
    </g>
    <!-- Subtle water bead highlights. -->
    <g fill="#7af0ff" opacity="0.45" filter="url(#p1p2bloom)">
      <circle cx="-26" cy="-41" r="0.7"/>
      <circle cx="26" cy="-41" r="0.7"/>
    </g>

    <!-- LEFT shoulder facing camera (body in profile facing right). -->
    <ellipse cx="-32" cy="-48" rx="12" ry="7" fill="#a8a8b0" stroke="#080408" stroke-width="0.7"/>
    <ellipse cx="-32" cy="-50" rx="7" ry="3" fill="#dce4ff" opacity="0.7"/>

    <!-- RIGHT shoulder CRACKED — visible in profile (continuity from Issue 1). -->
    <ellipse cx="32" cy="-48" rx="12" ry="7" fill="#a8a8b0" stroke="#080408" stroke-width="0.7"/>
    <!-- Hairline fractures bleed. -->
    <ellipse cx="32" cy="-48" rx="18" ry="11" fill="url(#p1p2crackBleed)" filter="url(#p1p2strongBloom)" opacity="0.95"/>
    <g stroke="#080408" stroke-width="0.7" fill="none">
      <line x1="24" y1="-50" x2="40" y2="-42"/>
      <line x1="28" y1="-46" x2="40" y2="-46"/>
      <line x1="32" y1="-54" x2="36" y2="-42"/>
    </g>
    <g stroke="#dce4ff" stroke-width="0.6" filter="url(#p1p2bloom)" opacity="0.95">
      <line x1="26" y1="-48" x2="36" y2="-43"/>
      <line x1="32" y1="-54" x2="34" y2="-44"/>
    </g>
    <!-- Particle sparks. -->
    <g fill="#dce4ff" opacity="0.7" filter="url(#p1p2bloom)">
      <circle cx="42" cy="-50" r="0.5"/>
      <circle cx="44" cy="-44" r="0.4"/>
    </g>

    <!-- BOTH ARMS extending forward + down to lap (holding device). -->
    <path d="M-32,-30 L-28,-5 L-12,15 L4,22" fill="none" stroke="url(#p1p2silver)" stroke-width="9" stroke-linecap="round"/>
    <path d="M32,-30 L36,-5 L20,18 L4,22" fill="none" stroke="url(#p1p2silver)" stroke-width="9" stroke-linecap="round"/>
    <!-- Hands holding device. -->
    <ellipse cx="-2" cy="22" rx="6" ry="4" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="10" cy="22" rx="6" ry="4" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>

    <!-- DATA MODULE (NEW PROP) in lap — small handheld device. -->
    <g id="p1p2-data-module">
      <!-- Device body. -->
      <rect x="-22" y="14" width="44" height="20" rx="2.5" fill="#1a1c20" stroke="#080408" stroke-width="0.9"/>
      <!-- Bezel. -->
      <rect x="-20" y="16" width="40" height="16" rx="2" fill="#0a0c10" stroke="#080408" stroke-width="0.5"/>
      <!-- BRIGHT SCREEN. -->
      <rect x="-17" y="18" width="34" height="12" fill="#7af0ff" filter="url(#p1p2bloom)" opacity="0.95"/>
      <!-- Geometric script glyphs (alien data text). -->
      <g stroke="#0a3050" stroke-width="0.5" opacity="0.85" fill="none">
        <line x1="-13" y1="20" x2="13" y2="20"/>
        <line x1="-13" y1="22" x2="9" y2="22"/>
        <line x1="-13" y1="24" x2="13" y2="24"/>
        <line x1="-13" y1="26" x2="6" y2="26"/>
        <line x1="-13" y1="28" x2="11" y2="28"/>
        <!-- Tiny hex glyphs. -->
        <polygon points="9,21 11,21 12,22 11,23 9,23 8,22"/>
        <polygon points="11,25 13,25 14,26 13,27 11,27 10,26"/>
      </g>
      <!-- Screen rim glow. -->
      <rect x="-17" y="18" width="34" height="12" fill="none" stroke="#dce4ff" stroke-width="0.5" opacity="0.85" filter="url(#p1p2bloom)"/>
      <!-- BRIGHT UPWARD BEAM (script-specific: casts blue-white UP). -->
      <path d="M-17,18 L-50,-50 L50,-50 L17,18 Z" fill="url(#p1p2screenGlow)" filter="url(#p1p2deepBloom)" opacity="0.65"/>
    </g>

    <!-- HEAD profile (looking down at module). -->
    <ellipse cx="6" cy="-80" rx="16" ry="17" fill="#5a3818" transform="rotate(20 6 -80)"/>

    <!-- Profile nose hint right side. -->
    <path d="M22,-78 Q26,-76 22,-72" fill="#5a3818" stroke="#3a2010" stroke-width="0.5" transform="rotate(20 6 -80)"/>

    <!-- SILVER-WHITE CROPPED HAIR — buzz. -->
    <g transform="rotate(20 6 -80)">
      <path d="M-9,-92 Q1,-98 7,-98 Q17,-98 16,-90 L16,-78 L-9,-78 Z" fill="#c8ccd4"/>
      <g fill="#a8acb4" opacity="0.85">
        <circle cx="-4" cy="-94" r="0.7"/>
        <circle cx="0" cy="-95" r="0.7"/>
        <circle cx="4" cy="-96" r="0.7"/>
        <circle cx="9" cy="-95" r="0.7"/>
        <circle cx="13" cy="-93" r="0.7"/>
        <circle cx="-6" cy="-90" r="0.6"/>
        <circle cx="2" cy="-92" r="0.6"/>
        <circle cx="9" cy="-90" r="0.6"/>
      </g>
      <!-- Hair WARM grey from above (overcast). -->
      <ellipse cx="4" cy="-95" rx="9" ry="2" fill="#8a8e98" opacity="0.65"/>
    </g>

    <!-- Eyes (looking DOWN at module). -->
    <ellipse cx="6" cy="-78" rx="2" ry="1.4" fill="#080404" transform="rotate(20 6 -80)"/>
    <ellipse cx="14" cy="-78" rx="2" ry="1.4" fill="#080404" transform="rotate(20 6 -80)"/>
    <circle cx="6" cy="-77" r="0.8" fill="#080404" transform="rotate(20 6 -80)"/>
    <circle cx="14" cy="-77" r="0.8" fill="#080404" transform="rotate(20 6 -80)"/>
    <!-- Cool catch in eyes (from screen — script-specific). -->
    <circle cx="6" cy="-78" r="0.5" fill="#dce4ff" transform="rotate(20 6 -80)"/>
    <circle cx="14" cy="-78" r="0.5" fill="#dce4ff" transform="rotate(20 6 -80)"/>
    <!-- Brow set hard. -->
    <path d="M2,-84 Q6,-87 10,-84" stroke="#3a2810" stroke-width="1.4" fill="none" transform="rotate(20 6 -80)"/>
    <path d="M11,-84 Q14,-87 18,-84" stroke="#3a2810" stroke-width="1.4" fill="none" transform="rotate(20 6 -80)"/>
    <!-- Lips a line (script-specific). -->
    <line x1="3" y1="-66" x2="14" y2="-66" stroke="#3a1810" stroke-width="1.5" transform="rotate(20 6 -80)"/>
    <!-- Cheekbone definition. -->
    <ellipse cx="-4" cy="-72" rx="3.5" ry="1.6" fill="#3a2010" opacity="0.55" transform="rotate(20 6 -80)"/>
    <ellipse cx="11" cy="-70" rx="3.5" ry="1.6" fill="#3a2010" opacity="0.55" transform="rotate(20 6 -80)"/>
    <!-- Jaw definition. -->
    <ellipse cx="-7" cy="-64" rx="3" ry="1.2" fill="#3a1810" opacity="0.55" transform="rotate(20 6 -80)"/>
    <ellipse cx="13" cy="-62" rx="3" ry="1.2" fill="#3a1810" opacity="0.55" transform="rotate(20 6 -80)"/>

    <!-- COOL BLUE-WHITE WASH on UNDERSIDE of jaw + throat (script-specific, FROM SCREEN BELOW). -->
    <ellipse cx="6" cy="-58" rx="20" ry="4" fill="#dce4ff" opacity="0.85" filter="url(#p1p2bloom)"/>
    <ellipse cx="6" cy="-54" rx="14" ry="3" fill="#7af0ff" opacity="0.7" filter="url(#p1p2bloom)"/>
    <!-- Strong cool catch on right cheekbone. -->
    <ellipse cx="14" cy="-66" rx="4" ry="2" fill="#7af0ff" opacity="0.55" filter="url(#p1p2bloom)" transform="rotate(20 6 -80)"/>
    <!-- Cool catch on neck/throat. -->
    <ellipse cx="0" cy="-44" rx="14" ry="3" fill="#dce4ff" opacity="0.7" filter="url(#p1p2bloom)"/>
  </g>

  <!-- Meta tag. -->
  <g id="p1p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">2</text>
    <text x="362" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">DATA MODULE — SILENT</text>
  </g>
</svg>
