<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 13 — Panel 1: Wren delivers verdict, holographic schematic floats between</title>
  <desc>MW 35mm eye level. 5 squad gathered before exposed drive housing. Wren faces them beside wreckage hand on hull, re-activated holographic interface — simplified ship schematic floats between her and squad in copper-gold geometric light. Schematic colour-coded: green intact, amber damaged, red destroyed. Most of diagram is RED. Wren clinical controlled professional. Sable still-faced. Jink arms crossed reading. Thresh watching Wren not diagram. Luma data lenses scrolling. WREN temporal drive core intact, miracle / WREN everything around it gone.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p13p1hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p13p1flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p13p1silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p13p1copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p13p1rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p13p1sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p13p1emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <radialGradient id="p13p1schematic">
      <stop offset="0%" stop-color="#f0d878" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p13p1redWash">
      <stop offset="0%" stop-color="#f54848" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a0810" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p13p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p13p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG sky strip. -->
  <rect width="742" height="60" fill="url(#p13p1sky)"/>

  <!-- Wreckage background fills middle. -->
  <rect x="0" y="60" width="742" height="200" fill="url(#p13p1hull)"/>
  <!-- Etched dead channels. -->
  <g stroke="#080404" stroke-width="0.5" fill="none" opacity="0.85">
    <path d="M0,100 L80,100 L100,120 L160,120"/>
    <path d="M200,80 L280,80 L300,100"/>
    <path d="M340,90 L420,90 L440,110"/>
    <path d="M480,80 L560,80 L580,100"/>
    <path d="M620,90 L720,90"/>
    <path d="M0,180 L80,180 L100,200 L180,200"/>
    <path d="M220,160 L300,160 L320,180"/>
    <path d="M360,170 L440,170 L460,190"/>
    <path d="M500,160 L580,160 L600,180"/>
    <path d="M620,180 L720,180"/>
  </g>

  <!-- Access panel opening (where Wren stood before — visible right). -->
  <rect x="540" y="80" width="120" height="160" fill="#080404" stroke="#1a1a20" stroke-width="0.7"/>
  <ellipse cx="600" cy="160" rx="30" ry="50" fill="#1a1010" stroke="#080404" stroke-width="0.5"/>

  <!-- COURTYARD FLAGSTONE GROUND foreground. -->
  <rect x="0" y="260" width="742" height="80" fill="url(#p13p1flag)" stroke="#1a1a20" stroke-width="0.85"/>
  <line x1="100" y1="260" x2="100" y2="340" stroke="#1a1a20" stroke-width="1.2"/>
  <line x1="220" y1="260" x2="220" y2="340" stroke="#1a1a20" stroke-width="1.2"/>
  <line x1="340" y1="260" x2="340" y2="340" stroke="#1a1a20" stroke-width="1.2"/>
  <line x1="460" y1="260" x2="460" y2="340" stroke="#1a1a20" stroke-width="1.2"/>
  <line x1="580" y1="260" x2="580" y2="340" stroke="#1a1a20" stroke-width="1.2"/>

  <!-- HOLOGRAPHIC SHIP SCHEMATIC — floats center-frame between Wren (right) and squad (left). -->
  <g id="p13p1-schematic">
    <!-- Halo glow. -->
    <ellipse cx="370" cy="190" rx="180" ry="80" fill="url(#p13p1schematic)" filter="url(#p13p1deepBloom)" opacity="0.85"/>
    <!-- Red wash overlay (most diagram is red). -->
    <ellipse cx="370" cy="190" rx="160" ry="60" fill="url(#p13p1redWash)" filter="url(#p13p1strongBloom)" opacity="0.65"/>

    <!-- Ship outline (top-down view). -->
    <g stroke="#f0d878" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#p13p1bloom)">
      <!-- Hull outline (wedge shape). -->
      <path d="M280,170 L300,160 L380,150 L460,160 L470,180 L460,210 L380,220 L300,210 L280,200 Z"/>
      <!-- Section dividers. -->
      <line x1="320" y1="158" x2="320" y2="212"/>
      <line x1="380" y1="150" x2="380" y2="220"/>
      <line x1="430" y1="158" x2="430" y2="212"/>
    </g>

    <!-- GREEN section (intact core) — small area. -->
    <ellipse cx="380" cy="185" rx="14" ry="14" fill="#7af0b0" opacity="0.85" filter="url(#p13p1bloom)"/>
    <ellipse cx="380" cy="185" rx="20" ry="20" fill="#7af0b0" opacity="0.45" filter="url(#p13p1strongBloom)"/>
    <text x="395" y="170" font-family="Courier, monospace" font-size="6" fill="#7af0b0" opacity="0.95">CORE</text>
    <text x="395" y="178" font-family="Courier, monospace" font-size="5" fill="#7af0b0" opacity="0.95">INTACT</text>

    <!-- AMBER section (damaged but holding) — tiny. -->
    <rect x="320" y="195" width="20" height="14" fill="#f5b860" opacity="0.65" filter="url(#p13p1bloom)"/>

    <!-- RED sections (destroyed) — most of diagram. -->
    <g fill="#f54848" opacity="0.65" filter="url(#p13p1bloom)">
      <!-- Drive assembly (around core). -->
      <path d="M348,170 L412,170 L412,200 L348,200 Z"/>
      <!-- Navigation. -->
      <path d="M280,170 L320,170 L320,200 L280,200 Z"/>
      <!-- Comms. -->
      <path d="M430,165 L470,180 L470,200 L430,210 Z"/>
    </g>
    <!-- Red section labels. -->
    <g font-family="Courier, monospace" font-size="6" fill="#f54848" opacity="0.95">
      <text x="290" y="195">NAV: GONE</text>
      <text x="350" y="225">DRIVE: ↘</text>
      <text x="438" y="225">COMM: GONE</text>
    </g>

    <!-- Hex nodes hanging in the air around schematic. -->
    <g stroke="#f0d878" stroke-width="0.5" fill="none" opacity="0.85">
      <path d="M255,150 L260,145 L265,150 L265,160 L260,165 L255,160 Z"/>
      <path d="M485,150 L490,145 L495,150 L495,160 L490,165 L485,160 Z"/>
      <path d="M255,220 L260,215 L265,220 L265,230 L260,235 L255,230 Z"/>
      <path d="M485,220 L490,215 L495,220 L495,230 L490,235 L485,230 Z"/>
    </g>
  </g>

  <!-- WREN — right of frame, beside wreckage, hand on hull, pointing at schematic. -->
  <g id="p13p1-wren" transform="translate(560, 290)">
    <path d="M-12,40 L-15,5 L-12,-15 L-6,-25 L6,-25 L12,-15 L15,5 L12,40 Z" fill="url(#p13p1copperDirty)" stroke="#080404" stroke-width="0.7"/>
    <ellipse cx="0" cy="-25" rx="8" ry="2.5" fill="#f0a868" opacity="0.85" filter="url(#p13p1bloom)"/>
    <g fill="#1a0808" opacity="0.85"><ellipse cx="-13" cy="6" rx="2.5" ry="1.4"/><ellipse cx="13" cy="8" rx="2.5" ry="1.4"/></g>
    <g fill="#3a2010" opacity="0.85"><ellipse cx="-5" cy="20" rx="3" ry="1.4"/></g>
    <!-- Right arm POINTING at schematic (left). -->
    <path d="M-12,-10 L-50,5 L-50,12 L-10,0 Z" fill="url(#p13p1copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="-54" cy="9" rx="3" ry="2" fill="#e0c098" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Pointing fingertip (slight glow). -->
    <circle cx="-54" cy="9" r="1.4" fill="#f0d878" opacity="0.95" filter="url(#p13p1bloom)"/>
    <!-- Head turned forward facing squad. -->
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#e0c098"/>
    <ellipse cx="-2" cy="-46" rx="8" ry="5" fill="#1a0808"/>
    <line x1="-4" y1="-48" x2="2" y2="-45" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- SABLE — listening, still-faced. -->
  <g id="p13p1-sable" transform="translate(110, 295)">
    <path d="M-11,40 L-14,5 L-11,-15 L-6,-25 L6,-25 L11,-15 L14,5 L11,40 Z" fill="url(#p13p1silverDirty)" stroke="#080404" stroke-width="0.7"/>
    <path d="M11,-12 L17,-2 L19,12 L17,24" fill="url(#p13p1silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p13p1bloom)"><path d="M13,-5 L17,5 L15,15"/></g>
    <ellipse cx="0" cy="-25" rx="8" ry="2.5" fill="#dce4f0" opacity="0.55" filter="url(#p13p1bloom)"/>
    <ellipse cx="2" cy="-37" rx="11" ry="12" fill="#3a2818"/>
    <path d="M-7,-44 Q3,-49 12,-44 L12,-37 L-7,-37 Z" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="6" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
    <!-- Red wash on face. -->
    <ellipse cx="2" cy="-37" rx="14" ry="10" fill="#f54848" opacity="0.25" filter="url(#p13p1strongBloom)"/>
  </g>

  <!-- LUMA — data lenses scrolling. -->
  <g id="p13p1-luma" transform="translate(180, 298)">
    <path d="M-11,40 L-14,5 L-11,-15 L-6,-25 L6,-25 L11,-15 L14,5 L11,40 Z" fill="url(#p13p1sapphireDirty)" stroke="#080404" stroke-width="0.7"/>
    <ellipse cx="0" cy="-25" rx="8" ry="2.5" fill="#a878f8" opacity="0.65" filter="url(#p13p1bloom)"/>
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#a87850"/>
    <path d="M-8,-32 Q-15,-22 -14,-10 Q-13,2 -15,12" stroke="#1a0808" stroke-width="4" fill="none"/>
    <line x1="-10" y1="-28" x2="-14" y2="10" stroke="#a878f8" stroke-width="0.5" opacity="0.85" filter="url(#p13p1bloom)"/>
    <ellipse cx="3" cy="-37" rx="4" ry="3" fill="#a878f8" opacity="0.85" stroke="#a878f8" stroke-width="0.4" filter="url(#p13p1bloom)"/>
    <line x1="3" y1="-37" x2="6" y2="-34" stroke="#dce4f0" stroke-width="0.3" opacity="0.85"/>
    <g font-family="Courier, monospace" font-size="2" fill="#dce4f0" opacity="0.95">
      <text x="0" y="-39">CRIT</text>
      <text x="0" y="-37">α=98</text>
    </g>
    <ellipse cx="-3" cy="-38" rx="1.2" ry="0.9" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-38" rx="0.6" ry="0.6" fill="#1a0808"/>
    <line x1="-4" y1="-30" x2="3" y2="-30" stroke="#3a1810" stroke-width="0.5"/>
  </g>

  <!-- JINK — arms crossed, reading. -->
  <g id="p13p1-jink" transform="translate(250, 296)">
    <ellipse cx="-8" cy="-10" rx="9" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(45 -8 -10)" filter="url(#p13p1bloom)"/>
    <ellipse cx="8" cy="-10" rx="9" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(-45 8 -10)" filter="url(#p13p1bloom)"/>
    <path d="M-11,38 L-14,5 L-11,-15 L-6,-25 L6,-25 L11,-15 L14,5 L11,38 Z" fill="url(#p13p1emeraldDirty)" stroke="#080404" stroke-width="0.7"/>
    <ellipse cx="0" cy="-25" rx="8" ry="2.5" fill="#7af0b0" opacity="0.55" filter="url(#p13p1bloom)"/>
    <!-- Arms folded across chest. -->
    <path d="M-11,-2 L11,-2 L13,8 L-13,8 Z" fill="url(#p13p1emeraldDirty)" stroke="#080404" stroke-width="0.5"/>
    <line x1="-2" y1="-2" x2="2" y2="8" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#d8b890"/>
    <path d="M-9,-44 Q0,-50 9,-44 L9,-37 L-9,-37 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-4" cy="-46" r="1.2"/><circle cx="0" cy="-48" r="1.2"/><circle cx="4" cy="-46" r="1.2"/></g>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.6"/>
    <!-- Red wash. -->
    <ellipse cx="0" cy="-37" rx="14" ry="10" fill="#f54848" opacity="0.25" filter="url(#p13p1strongBloom)"/>
  </g>

  <!-- THRESH — watching Wren not the diagram. -->
  <g id="p13p1-thresh" transform="translate(320, 295)">
    <path d="M-13,40 L-15,5 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,5 L13,40 Z" fill="url(#p13p1rubyDirty)" stroke="#080404" stroke-width="0.7"/>
    <path d="M-13,-13 L-22,-3 L-22,12 L-13,18" fill="url(#p13p1rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-19,2 Q-15,8 -14,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="9" ry="2.5" fill="#f54848" opacity="0.85" filter="url(#p13p1bloom)"/>
    <!-- Weapon held forward (low). -->
    <rect x="-10" y="3" width="22" height="5" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <!-- Head turned slightly RIGHT looking at Wren. -->
    <ellipse cx="3" cy="-37" rx="11" ry="12" fill="#d8a880"/>
    <path d="M-7,-44 Q3,-50 13,-44 L13,-37 L-7,-37 Z" fill="#a83a18"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="2" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="8" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
    <!-- Heavy red wash on suit (under fire-tone). -->
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="#f54848" opacity="0.25" filter="url(#p13p1strongBloom)"/>
  </g>

  <!-- DIALOGUE — WREN STACK. -->
  <g id="p13p1-bal-wren1">
    <rect x="14" y="14" width="280" height="60" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">The temporal drive core is</text>
    <text x="24" y="71" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">intact. That's the miracle.</text>
  </g>
  <g id="p13p1-bal-wren2">
    <rect x="304" y="14" width="280" height="46" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="314" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="314" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Everything around it is gone.</text>
    <path d="M510,60 L524,60 L518,72 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="510" y1="60" x2="524" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p13p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">VERDICT</text>
  </g>
</svg>
