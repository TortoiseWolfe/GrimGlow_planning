<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 2 — Page 1 — Panel 1: Bird's-eye gutter establishing — Clerkenwell dawn</title>
  <desc>24mm extreme wide bird's-eye DOWN into rain gutter. Lead-lined half-round channel as dry riverbed stretching across frame. Gutter lip wall LEFT, slate cliff faces RIGHT. Dead-leaf shelters along channel. 5 tiny squad figures (4 sleeping, Sable upright). Beyond gutter lip: vast Victorian roofscape (chimney stacks as towers, slate plateaus, distant church spires in grey morning fog). Flat grey overcast pre-dawn. Faint amber gaslight underglow from street far below. 5 faint holo department-color glows. CAPTION (parchment): "Clerkenwell. 14 November, 1886." + "0617 hours. Ambient temperature: four degrees. Wind: northeast, six knots."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p1p1grey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7e88"/>
      <stop offset="100%" stop-color="#4a4e58"/>
    </linearGradient>
    <linearGradient id="p1p1lead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5e68"/>
      <stop offset="100%" stop-color="#2a2e38"/>
    </linearGradient>
    <linearGradient id="p1p1slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2830"/>
      <stop offset="100%" stop-color="#1a1820"/>
    </linearGradient>
    <radialGradient id="p1p1amberStreet" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p1p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- BG sky/distant rooftops grey overcast. -->
  <rect width="742" height="300" fill="url(#p1p1grey)"/>

  <!-- DISTANT ROOFTOP HORIZON (top of frame, beyond gutter lip) — chimneys, spires, fog. -->
  <g id="p1p1-distant-roofscape" opacity="0.85">
    <!-- Far chimney stacks (silhouettes). -->
    <rect x="60" y="20" width="14" height="60" fill="#3a3840"/>
    <rect x="56" y="18" width="22" height="3" fill="#2a2830"/>
    <rect x="180" y="14" width="16" height="66" fill="#3a3840"/>
    <rect x="176" y="12" width="24" height="3" fill="#2a2830"/>
    <rect x="320" y="22" width="12" height="58" fill="#3a3840"/>
    <rect x="316" y="20" width="20" height="3" fill="#2a2830"/>
    <rect x="500" y="18" width="14" height="62" fill="#3a3840"/>
    <rect x="496" y="16" width="22" height="3" fill="#2a2830"/>
    <rect x="640" y="22" width="12" height="58" fill="#3a3840"/>

    <!-- DISTANT CHURCH SPIRES (script: as distant mountains in grey morning fog). -->
    <path d="M250,80 L256,30 L262,80 Z" fill="#3a3840"/>
    <rect x="251" y="80" width="11" height="14" fill="#3a3840"/>
    <path d="M420,80 L425,40 L430,80 Z" fill="#3a3840"/>
    <rect x="421" y="80" width="9" height="12" fill="#3a3840"/>

    <!-- Distant slate roof plateaus. -->
    <path d="M0,80 L80,80 L100,90 L200,90 L220,80 L340,80 L360,92 L460,92 L490,82 L580,82 L600,90 L742,90 L742,120 L0,120 Z" fill="url(#p1p1slate)" opacity="0.85"/>

    <!-- Morning fog (subtle haze across distant). -->
    <ellipse cx="371" cy="85" rx="380" ry="18" fill="#a8a8b0" opacity="0.4" filter="url(#p1p1strongBloom)"/>

    <!-- Smoke wisps from a couple chimneys. -->
    <ellipse cx="68" cy="14" rx="14" ry="4" fill="#5a5860" opacity="0.55" filter="url(#p1p1bloom)"/>
    <ellipse cx="190" cy="8" rx="16" ry="5" fill="#5a5860" opacity="0.55" filter="url(#p1p1bloom)"/>
    <ellipse cx="510" cy="12" rx="14" ry="4" fill="#5a5860" opacity="0.55" filter="url(#p1p1bloom)"/>
  </g>

  <!-- SLATE CLIFF FACE on RIGHT side (bird's-eye looking down — slate roof rising right). -->
  <g id="p1p1-slate-cliff-right">
    <path d="M620,120 L660,130 L700,125 L742,135 L742,300 L620,300 Z" fill="url(#p1p1slate)"/>
    <!-- Slate tile rows. -->
    <g stroke="#0a0810" stroke-width="0.4" opacity="0.7">
      <line x1="620" y1="160" x2="742" y2="160"/>
      <line x1="620" y1="200" x2="742" y2="200"/>
      <line x1="620" y1="240" x2="742" y2="240"/>
      <line x1="620" y1="280" x2="742" y2="280"/>
    </g>
    <g stroke="#0a0810" stroke-width="0.3" opacity="0.55">
      <line x1="640" y1="160" x2="650" y2="200"/>
      <line x1="680" y1="160" x2="690" y2="200"/>
      <line x1="720" y1="200" x2="730" y2="240"/>
      <line x1="660" y1="240" x2="670" y2="280"/>
    </g>
    <!-- Moss in gaps. -->
    <ellipse cx="640" cy="200" rx="3" ry="1" fill="#3a4818" opacity="0.85"/>
    <ellipse cx="700" cy="240" rx="2.5" ry="1" fill="#3a4818" opacity="0.85"/>
  </g>

  <!-- GUTTER LIP wall on LEFT side (low wall, bird's-eye). -->
  <g id="p1p1-gutter-lip-left">
    <path d="M0,120 L40,125 L60,135 L60,300 L0,300 Z" fill="url(#p1p1lead)"/>
    <!-- Top edge of lip (curved fairy-scale rim). -->
    <path d="M0,120 L40,125 L60,135" fill="none" stroke="#0a0c10" stroke-width="1.4"/>
    <!-- Faint amber rim catch (gaslight from below). -->
    <path d="M0,120 L40,125 L60,135" fill="none" stroke="#a85820" stroke-width="0.9" opacity="0.55" filter="url(#p1p1bloom)"/>
  </g>

  <!-- LEAD-LINED GUTTER FLOOR — half-round channel running across center. -->
  <g id="p1p1-gutter-floor">
    <!-- Channel bottom. -->
    <path d="M40,140 L620,140 L620,260 L60,260 Z" fill="url(#p1p1lead)"/>
    <!-- Riveted seams (industrial plating at fairy scale). -->
    <g stroke="#0a0c10" stroke-width="0.5" opacity="0.85">
      <line x1="120" y1="140" x2="115" y2="260"/>
      <line x1="240" y1="140" x2="235" y2="260"/>
      <line x1="360" y1="140" x2="355" y2="260"/>
      <line x1="480" y1="140" x2="475" y2="260"/>
      <line x1="600" y1="140" x2="595" y2="260"/>
    </g>
    <!-- Rivets along seams. -->
    <g fill="#0a0c10" opacity="0.85">
      <circle cx="120" cy="160" r="1.4"/>
      <circle cx="120" cy="200" r="1.4"/>
      <circle cx="120" cy="240" r="1.4"/>
      <circle cx="240" cy="160" r="1.4"/>
      <circle cx="240" cy="200" r="1.4"/>
      <circle cx="240" cy="240" r="1.4"/>
      <circle cx="360" cy="160" r="1.4"/>
      <circle cx="360" cy="200" r="1.4"/>
      <circle cx="360" cy="240" r="1.4"/>
      <circle cx="480" cy="160" r="1.4"/>
      <circle cx="480" cy="200" r="1.4"/>
      <circle cx="600" cy="200" r="1.4"/>
    </g>
    <!-- Lead patina texture stipple. -->
    <g fill="#1a1c20" opacity="0.55">
      <circle cx="80" cy="180" r="1"/>
      <circle cx="160" cy="220" r="1"/>
      <circle cx="280" cy="170" r="1"/>
      <circle cx="380" cy="230" r="1"/>
      <circle cx="440" cy="190" r="1"/>
      <circle cx="540" cy="240" r="1"/>
    </g>

    <!-- AMBER GASLIGHT UNDERGLOW catching gutter floor (script: faint amber underglow from street far below). -->
    <ellipse cx="371" cy="270" rx="380" ry="40" fill="url(#p1p1amberStreet)" filter="url(#p1p1strongBloom)" opacity="0.6"/>
  </g>

  <!-- DEAD LEAF SHELTERS scattered along channel (script: as crude lean-to shelters). -->
  <g id="p1p1-leaf-shelters">
    <!-- Big oak leaf shelter near left. -->
    <g transform="translate(115, 175)">
      <path d="M-20,0 Q-25,-12 -10,-15 Q5,-18 15,-12 Q22,-3 18,8 Q10,18 -5,15 Q-18,10 -20,0 Z" fill="#5a3018"/>
      <path d="M-15,-2 Q0,-6 14,-2" stroke="#3a1808" stroke-width="0.4" fill="none"/>
      <line x1="-12" y1="-8" x2="-2" y2="-2" stroke="#3a1808" stroke-width="0.3"/>
      <line x1="2" y1="-2" x2="12" y2="0" stroke="#3a1808" stroke-width="0.3"/>
    </g>
    <!-- Mid-channel leaf. -->
    <g transform="translate(290, 220)">
      <path d="M-22,0 Q-28,-14 -10,-16 Q8,-20 18,-13 Q24,-3 20,8 Q12,18 -4,16 Q-20,10 -22,0 Z" fill="#5a3018"/>
      <path d="M-18,-2 Q-2,-6 16,-2" stroke="#3a1808" stroke-width="0.4" fill="none"/>
    </g>
    <!-- Right side leaf. -->
    <g transform="translate(525, 180)">
      <path d="M-20,0 Q-25,-12 -8,-15 Q8,-18 16,-12 Q22,-3 18,8 Q10,18 -5,15 Q-18,10 -20,0 Z" fill="#5a3018"/>
      <path d="M-15,-2 Q0,-6 14,-2" stroke="#3a1808" stroke-width="0.4" fill="none"/>
    </g>
    <!-- Smaller debris leaves. -->
    <g fill="#5a3018" opacity="0.85">
      <ellipse cx="200" cy="240" rx="9" ry="4"/>
      <ellipse cx="420" cy="170" rx="8" ry="3.5"/>
      <ellipse cx="580" cy="230" rx="9" ry="4"/>
    </g>
    <!-- Grit terrain stipple on floor. -->
    <g fill="#080404" opacity="0.55">
      <circle cx="90" cy="220" r="0.7"/>
      <circle cx="180" cy="180" r="0.7"/>
      <circle cx="260" cy="200" r="0.7"/>
      <circle cx="350" cy="180" r="0.7"/>
      <circle cx="450" cy="240" r="0.7"/>
      <circle cx="500" cy="200" r="0.7"/>
    </g>
  </g>

  <!-- 5 SQUAD FIGURES tiny in gutter — 4 SLEEPING + Sable UPRIGHT. -->

  <!-- WREN curled near left leaf-shelter (sleeping). -->
  <g id="p1p1-wren" transform="translate(135, 195)">
    <ellipse cx="0" cy="0" rx="9" ry="3.5" fill="#c87a35"/>
    <circle cx="-7" cy="-1" r="2.2" fill="#d8b088"/>
    <ellipse cx="-7" cy="-2.5" rx="2" ry="1.4" fill="#0a0a14"/>
    <!-- Faint copper holo glow. -->
    <ellipse cx="0" cy="0" rx="11" ry="5" fill="#f5a868" opacity="0.35" filter="url(#p1p1bloom)"/>
  </g>

  <!-- LUMA curled mid-left (sleeping). -->
  <g id="p1p1-luma" transform="translate(245, 235)">
    <ellipse cx="0" cy="0" rx="9" ry="3.5" fill="#5a3ad8"/>
    <circle cx="-7" cy="-1" r="2.2" fill="#a87850"/>
    <ellipse cx="-7" cy="-2.5" rx="2" ry="1.4" fill="#1a1018"/>
    <!-- Faint sapphire holo glow. -->
    <ellipse cx="0" cy="0" rx="11" ry="5" fill="#a890f0" opacity="0.4" filter="url(#p1p1bloom)"/>
  </g>

  <!-- THRESH curled mid (sleeping, hand still on weapon). -->
  <g id="p1p1-thresh" transform="translate(335, 195)">
    <ellipse cx="0" cy="0" rx="10" ry="4" fill="#dc2030"/>
    <circle cx="-8" cy="-1" r="2.4" fill="#d8a880"/>
    <ellipse cx="-8" cy="-2.5" rx="2" ry="1.4" fill="#a83a18"/>
    <!-- Tiny weapon at hand. -->
    <rect x="2" y="-2" width="6" height="2" rx="0.4" fill="#1a0810"/>
    <!-- Faint crimson holo glow. -->
    <ellipse cx="0" cy="0" rx="13" ry="6" fill="#f54848" opacity="0.4" filter="url(#p1p1bloom)"/>
  </g>

  <!-- JINK curled right of Thresh (sleeping, curls visible). -->
  <g id="p1p1-jink" transform="translate(450, 200)">
    <ellipse cx="0" cy="0" rx="9" ry="3.5" fill="#2ed078"/>
    <circle cx="-7" cy="-1" r="2.2" fill="#e8c8a0"/>
    <!-- Golden curls. -->
    <g fill="#f5d860">
      <circle cx="-8" cy="-3" r="1.3"/>
      <circle cx="-6" cy="-3.5" r="1"/>
      <circle cx="-9" cy="-1" r="0.9"/>
    </g>
    <!-- Faint emerald glow. -->
    <ellipse cx="0" cy="0" rx="11" ry="5" fill="#7af0b0" opacity="0.4" filter="url(#p1p1bloom)"/>
  </g>

  <!-- SABLE UPRIGHT — sitting against gutter wall, knees drawn, staring (script: already awake). -->
  <g id="p1p1-sable-upright" transform="translate(560, 215)">
    <!-- Body upright. -->
    <ellipse cx="0" cy="0" rx="6" ry="9" fill="#a8b0c0"/>
    <!-- Knees drawn forward. -->
    <ellipse cx="0" cy="6" rx="8" ry="3" fill="#a8b0c0"/>
    <!-- Head. -->
    <circle cx="0" cy="-12" r="3.5" fill="#5a3818"/>
    <!-- Silver buzz. -->
    <ellipse cx="0" cy="-14" rx="3" ry="1.5" fill="#c8ccd4"/>
    <!-- Cracked shoulder bleed (continuity from Issue 1). -->
    <ellipse cx="4" cy="-6" rx="2.5" ry="1.5" fill="#dce4ff" opacity="0.85" filter="url(#p1p1bloom)"/>
    <!-- Silver holo accent glow. -->
    <ellipse cx="0" cy="0" rx="11" ry="11" fill="#dce4ff" opacity="0.35" filter="url(#p1p1bloom)"/>
  </g>

  <!-- TELEGRAPH WIRE crossing distant roofscape (subtle Victorian detail). -->
  <line x1="0" y1="100" x2="742" y2="105" stroke="#1a1820" stroke-width="0.5" opacity="0.55"/>

  <!-- CAPTION (parchment) top-left corner. -->
  <g id="p1p1-caption">
    <rect x="14" y="14" width="246" height="60" rx="3" fill="#f5ecd8" stroke="#5a4a30" stroke-width="1.2" filter="url(#balloonShadow)"/>
    <line x1="14" y1="22" x2="260" y2="22" stroke="#a89868" stroke-width="0.3" opacity="0.55"/>
    <line x1="14" y1="66" x2="260" y2="66" stroke="#a89868" stroke-width="0.3" opacity="0.55"/>
    <text x="137" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" font-weight="700" fill="#5a4a30">Clerkenwell. 14 November, 1886.</text>
    <text x="137" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#5a4a30">0617 hours. Ambient: 4°.</text>
    <text x="137" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#5a4a30">Wind: NE, six knots.</text>
  </g>

  <!-- Meta tag. -->
  <g id="p1p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="738" y="292" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">CLERKENWELL DAWN</text>
  </g>
</svg>
