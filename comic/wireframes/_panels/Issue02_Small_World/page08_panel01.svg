<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 2 — Page 8 — Panel 1: Cat lunges, paw sweeps cobblestones, squad scatters</title>
  <desc>Wide action 24mm slightly elevated. Cat paw enormous mid-sweep across cobblestones. Pink pads, partially extended claws scraping granite. Sable+Thresh diving left into sett gap, Wren dropping right behind boulder, Luma flat on ground. Emerald flash above (Jink wing-pack ignition). SCRRRK SFX claw on granite. JINK MOVE off-panel.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e34"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p8p1stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#2a2e34"/>
    </linearGradient>
    <linearGradient id="p8p1pawFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>
    <radialGradient id="p8p1pawPad">
      <stop offset="0%" stop-color="#f5a8a0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a85020" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="p8p1emeraldFlash">
      <stop offset="0%" stop-color="#7af0b0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p8p1amberGlint">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <filter id="p8p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p8p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p8p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="p8p1motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4 0"/>
    </filter>
  </defs>

  <!-- BG. -->
  <rect width="742" height="300" fill="url(#p8p1bg)"/>

  <!-- Distant rain veil. -->
  <g stroke="#a8b8c8" stroke-width="0.5" opacity="0.55">
    <line x1="40" y1="20" x2="48" y2="60"/>
    <line x1="120" y1="10" x2="128" y2="50"/>
    <line x1="200" y1="25" x2="208" y2="65"/>
    <line x1="280" y1="15" x2="288" y2="55"/>
    <line x1="360" y1="30" x2="368" y2="70"/>
    <line x1="440" y1="20" x2="448" y2="60"/>
    <line x1="520" y1="35" x2="528" y2="75"/>
    <line x1="600" y1="20" x2="608" y2="60"/>
    <line x1="680" y1="40" x2="688" y2="80"/>
  </g>

  <!-- COBBLESTONE FIELD ground. -->
  <g fill="url(#p8p1stone)" stroke="#1a1a20" stroke-width="0.7">
    <rect x="-5" y="178" width="92" height="32" rx="4"/>
    <rect x="95" y="178" width="94" height="32" rx="4"/>
    <rect x="197" y="178" width="92" height="32" rx="4"/>
    <rect x="297" y="178" width="96" height="32" rx="4"/>
    <rect x="401" y="178" width="92" height="32" rx="4"/>
    <rect x="501" y="178" width="94" height="32" rx="4"/>
    <rect x="603" y="178" width="92" height="32" rx="4"/>
    <rect x="703" y="178" width="44" height="32" rx="4"/>
  </g>
  <g fill="url(#p8p1stone)" stroke="#080810" stroke-width="1">
    <rect x="-10" y="218" width="118" height="50" rx="6"/>
    <rect x="116" y="218" width="122" height="50" rx="6"/>
    <rect x="246" y="218" width="118" height="50" rx="6"/>
    <rect x="372" y="218" width="122" height="50" rx="6"/>
    <rect x="502" y="218" width="118" height="50" rx="6"/>
    <rect x="628" y="218" width="122" height="50" rx="6"/>
  </g>
  <g fill="#c0d0e0" opacity="0.35" filter="url(#p8p1bloom)">
    <ellipse cx="50" cy="222" rx="42" ry="2.5"/>
    <ellipse cx="180" cy="222" rx="44" ry="2.5"/>
    <ellipse cx="310" cy="222" rx="42" ry="2.5"/>
    <ellipse cx="440" cy="222" rx="44" ry="2.5"/>
    <ellipse cx="570" cy="222" rx="42" ry="2.5"/>
    <ellipse cx="700" cy="222" rx="44" ry="2.5"/>
  </g>

  <!-- EMERALD FLASH upper left (Jink's wing-pack igniting). -->
  <ellipse cx="80" cy="40" rx="120" ry="80" fill="url(#p8p1emeraldFlash)" filter="url(#p8p1deepBloom)" opacity="0.85"/>
  <g stroke="#7af0b0" stroke-width="0.7" opacity="0.85" filter="url(#p8p1bloom)">
    <line x1="20" y1="20" x2="50" y2="30"/>
    <line x1="40" y1="50" x2="70" y2="40"/>
    <line x1="80" y1="20" x2="100" y2="40"/>
    <line x1="100" y1="60" x2="130" y2="50"/>
  </g>

  <!-- AMBER GASLIGHT GLINT on paw underside (right). -->
  <ellipse cx="500" cy="80" rx="180" ry="80" fill="url(#p8p1amberGlint)" filter="url(#p8p1deepBloom)" opacity="0.55"/>

  <!-- CAT PAW — enormous, mid-sweep, dominates frame center-right. -->
  <g id="p8p1-paw" filter="url(#p8p1motionBlur)">
    <!-- Forearm/leg coming down from upper right. -->
    <path d="M620,0 L740,40 L740,170 L580,200 L500,180 L420,150 L350,130 L300,110 Q320,60 440,30 Q540,-10 620,0 Z" fill="url(#p8p1pawFur)" stroke="#080404" stroke-width="0.7"/>
    <!-- Paw front face curved. -->
    <path d="M300,110 Q260,140 250,170 L300,200 L420,200 L500,180 Z" fill="url(#p8p1pawFur)"/>

    <!-- TOE PADS — pink underside. -->
    <ellipse cx="280" cy="180" rx="32" ry="24" fill="url(#p8p1pawPad)" stroke="#3a1010" stroke-width="0.7"/>
    <ellipse cx="340" cy="186" rx="34" ry="26" fill="url(#p8p1pawPad)" stroke="#3a1010" stroke-width="0.7"/>
    <ellipse cx="408" cy="186" rx="32" ry="25" fill="url(#p8p1pawPad)" stroke="#3a1010" stroke-width="0.7"/>
    <ellipse cx="475" cy="180" rx="30" ry="24" fill="url(#p8p1pawPad)" stroke="#3a1010" stroke-width="0.7"/>
    <!-- Main pad (heel). -->
    <path d="M310,200 Q360,235 410,235 Q460,235 480,210 Q450,210 410,210 Q360,210 310,210 Z" fill="url(#p8p1pawPad)" stroke="#3a1010" stroke-width="0.7"/>

    <!-- CLAWS partially extended — long curved white. -->
    <g fill="#dce4f0" stroke="#3a3030" stroke-width="0.7">
      <path d="M260,200 L240,220 L235,240 L246,232 L268,218 Z"/>
      <path d="M325,212 L310,234 L308,256 L322,246 L338,226 Z"/>
      <path d="M395,212 L380,234 L378,256 L392,246 L408,226 Z"/>
      <path d="M465,206 L450,228 L448,250 L462,240 L478,220 Z"/>
    </g>
    <!-- Granite chips spraying. -->
    <g fill="#a8b0bc" stroke="#5a606a" stroke-width="0.4">
      <polygon points="240,250 244,260 250,255 246,248"/>
      <polygon points="256,265 260,275 268,270 264,260"/>
      <polygon points="320,260 324,270 332,265 328,255"/>
      <polygon points="380,265 386,278 394,270 388,258"/>
      <polygon points="450,260 456,272 466,267 460,255"/>
    </g>
    <!-- Scrape lines on cobble. -->
    <g stroke="#1a1010" stroke-width="1.2" opacity="0.85">
      <line x1="244" y1="248" x2="232" y2="263"/>
      <line x1="316" y1="255" x2="304" y2="272"/>
      <line x1="386" y1="256" x2="374" y2="272"/>
      <line x1="456" y1="250" x2="446" y2="266"/>
    </g>
  </g>

  <!-- TINY SQUAD scattering (foreground action). -->
  <!-- SABLE + THRESH diving left into ravine (silver + ruby). -->
  <g id="p8p1-sable-thresh">
    <!-- Tucked positions in ravine gap (x ~95). -->
    <g transform="translate(95, 250) rotate(-15)">
      <ellipse cx="0" cy="0" rx="6" ry="3" fill="#8a909a"/>
      <circle cx="-5" cy="-1" r="2" fill="#5a3a28"/>
      <ellipse cx="-1" cy="-1" rx="2.5" ry="1" fill="#dce4f0" opacity="0.65" filter="url(#p8p1bloom)"/>
    </g>
    <g transform="translate(108, 252) rotate(-10)">
      <ellipse cx="0" cy="0" rx="6.5" ry="3" fill="#dc2030"/>
      <circle cx="-5" cy="-1" r="2" fill="#d8a880"/>
      <line x1="3" y1="-1" x2="7" y2="-3" stroke="#1a0808" stroke-width="0.7"/>
    </g>
  </g>

  <!-- WREN — dropping right behind cobblestone (copper). -->
  <g id="p8p1-wren" transform="translate(530, 250) rotate(20)">
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="#c87a35"/>
    <circle cx="5" cy="-1" r="2" fill="#e0c098"/>
    <ellipse cx="3" cy="-3" rx="2.5" ry="1.5" fill="#1a0808"/>
    <!-- Hair-up bun (small). -->
    <line x1="7" y1="-1" x2="9" y2="0" stroke="#3a1808" stroke-width="0.5"/>
  </g>

  <!-- LUMA — flat on ground (sapphire-violet). -->
  <g id="p8p1-luma" transform="translate(660, 268)">
    <ellipse cx="0" cy="0" rx="9" ry="2.5" fill="#5a3ad8"/>
    <circle cx="-7" cy="0" r="2" fill="#a87850"/>
    <line x1="-9" y1="0" x2="-12" y2="2" stroke="#1a0808" stroke-width="1.5"/>
    <!-- Sapphire glint. -->
    <circle cx="0" cy="-1" r="0.8" fill="#a878f8" opacity="0.85" filter="url(#p8p1bloom)"/>
  </g>

  <!-- RAIN — fist-sized drops descending. -->
  <g fill="#dce4f0" opacity="0.85" filter="url(#p8p1bloom)">
    <ellipse cx="60" cy="100" rx="3" ry="5"/>
    <ellipse cx="160" cy="120" rx="3" ry="5"/>
    <ellipse cx="220" cy="60" rx="3" ry="5"/>
    <ellipse cx="640" cy="180" rx="3" ry="5"/>
  </g>

  <!-- SFX: SCRRRK — claw on granite. -->
  <g id="p8p1-sfx-scrrrk" transform="translate(310, 260) rotate(-10)">
    <text font-family="Impact, sans-serif" font-size="44" font-weight="900"
          stroke="#1a0408" stroke-width="4" stroke-linejoin="round"
          paint-order="stroke fill" fill="#ffe080">SCRRRK!</text>
  </g>

  <!-- DIALOGUE — JINK off-panel upper-left (above emerald flash). -->
  <g id="p8p1-bal-jink-op">
    <rect x="14" y="120" width="120" height="40" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-dasharray="4,3" filter="url(#balloonShadow)"/>
    <text x="24" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK (O.P.)</text>
    <text x="24" y="156" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">MOVE!</text>
  </g>

  <!-- Meta. -->
  <g id="p8p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="292" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">PAW LUNGE</text>
  </g>
</svg>
