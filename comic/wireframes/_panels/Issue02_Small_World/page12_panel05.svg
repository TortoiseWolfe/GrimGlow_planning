<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 247 420" width="247" height="420">
  <title>Issue 2 — Page 12 — Panel 5: Wren steps back, posture before verdict, others approach</title>
  <desc>MS 50mm slight high angle. Wren stands before exposed drive housing schematic collapsed arms at sides. Shoulders slightly dropped head tilted — body language engineer who measured gap necessity vs reality. Behind: dark exposed shattered machinery temporal drive. Background: 4 figures silver emerald ruby sapphire-violet cross courtyard flagstones toward her. Grey overcast flat. Wren copper accents glow faintly seams only warmth. Dead wreckage catches no light. WREN alright gather round say this once.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p12p5sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p12p5flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p12p5hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p12p5copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p12p5silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p12p5rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p12p5sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p12p5emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <filter id="p12p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p12p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG sky strip. -->
  <rect width="247" height="40" fill="url(#p12p5sky)"/>

  <!-- WRECKAGE BACKGROUND (full width, dark, looms). -->
  <rect x="0" y="40" width="247" height="200" fill="url(#p12p5hull)"/>
  <!-- Etched dead channels. -->
  <g stroke="#080404" stroke-width="0.5" fill="none" opacity="0.85">
    <path d="M0,80 L60,80 L80,100 L120,100"/>
    <path d="M150,60 L200,60 L220,80 L247,80"/>
    <path d="M0,140 L80,140 L100,160 L160,160"/>
    <path d="M180,120 L220,120 L247,140"/>
    <path d="M0,200 L60,200 L80,220 L130,220"/>
    <!-- Hex dead nodes. -->
    <path d="M75,77 L80,74 L85,77 L85,83 L80,86 L75,83 Z"/>
    <path d="M115,97 L120,94 L125,97 L125,103 L120,106 L115,103 Z"/>
    <path d="M155,157 L160,154 L165,157 L165,163 L160,166 L155,163 Z"/>
  </g>

  <!-- ACCESS PANEL OPENING (Wren stepped back from). -->
  <rect x="100" y="100" width="80" height="120" fill="#080404" stroke="#1a1a20" stroke-width="0.7"/>
  <!-- Hint of shattered machinery inside. -->
  <ellipse cx="140" cy="160" rx="22" ry="36" fill="#1a1010" stroke="#080404" stroke-width="0.5"/>
  <polygon points="130,140 140,130 150,140 150,170 140,180 130,170" fill="#3a2820" stroke="#080404" stroke-width="0.5"/>
  <g stroke="#080404" stroke-width="0.7" fill="none">
    <path d="M132,135 L145,165"/>
    <path d="M148,135 L135,170"/>
  </g>

  <!-- COURTYARD FLAGSTONE GROUND (foreground). -->
  <rect x="0" y="240" width="247" height="180" fill="url(#p12p5flag)" stroke="#1a1a20" stroke-width="0.7"/>
  <line x1="80" y1="240" x2="80" y2="420" stroke="#1a1a20" stroke-width="1.2"/>
  <line x1="160" y1="240" x2="160" y2="420" stroke="#1a1a20" stroke-width="1.2"/>
  <g stroke="#1a1a20" stroke-width="0.6" opacity="0.85">
    <path d="M40,240 L50,300 L45,360 L60,420"/>
    <path d="M120,240 L130,310 L125,380 L140,420"/>
    <path d="M210,240 L220,310 L215,380 L230,420"/>
  </g>
  <g fill="#a8b0bc" opacity="0.45" filter="url(#p12p5bloom)">
    <ellipse cx="40" cy="250" rx="30" ry="2"/>
    <ellipse cx="120" cy="250" rx="30" ry="2"/>
    <ellipse cx="210" cy="250" rx="30" ry="2"/>
  </g>

  <!-- WREN — center foreground, standing arms at sides. -->
  <g id="p12p5-wren" transform="translate(125, 285)">
    <!-- Body. -->
    <path d="M-15,80 L-18,30 L-15,-15 L-8,-30 L8,-30 L15,-15 L18,30 L15,80 Z" fill="url(#p12p5copperDirty)" stroke="#080404" stroke-width="0.85"/>
    <!-- Pauldrons. -->
    <path d="M-15,-12 L-26,0 L-26,18 L-15,22" fill="url(#p12p5copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M15,-12 L26,0 L26,18 L15,22" fill="url(#p12p5copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <!-- Copper collar dim (tools off). -->
    <ellipse cx="0" cy="-30" rx="10" ry="3" fill="#f0a868" opacity="0.55" filter="url(#p12p5bloom)"/>

    <!-- Mud streaks. -->
    <g fill="#3a2010" opacity="0.85">
      <ellipse cx="-7" cy="20" rx="4" ry="2" transform="rotate(-15 -7 20)"/>
      <ellipse cx="8" cy="40" rx="4" ry="2"/>
      <ellipse cx="-5" cy="60" rx="3" ry="1.5"/>
    </g>

    <!-- Arms at sides — slight droop. -->
    <path d="M-26,4 L-30,40 L-22,80 L-18,80 L-22,40 L-20,8 Z" fill="url(#p12p5copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M26,4 L30,40 L22,80 L18,80 L22,40 L20,8 Z" fill="url(#p12p5copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <!-- Oil stains. -->
    <g fill="#1a0808" opacity="0.85">
      <ellipse cx="-26" cy="50" rx="3" ry="1.5"/>
      <ellipse cx="-23" cy="65" rx="2.5" ry="1.5"/>
      <ellipse cx="26" cy="50" rx="3" ry="1.5"/>
      <ellipse cx="23" cy="65" rx="2.5" ry="1.5"/>
    </g>
    <!-- Fingertips. -->
    <ellipse cx="-22" cy="82" rx="3" ry="2" fill="#e0c098" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="22" cy="82" rx="3" ry="2" fill="#e0c098" stroke="#080408" stroke-width="0.4"/>

    <!-- Head tilted slightly down (head tilt body language). -->
    <ellipse cx="-2" cy="-46" rx="11" ry="12" fill="#e0c098"/>
    <!-- HAIR UP IN BUN. -->
    <ellipse cx="-4" cy="-58" rx="8" ry="6" fill="#1a0808"/>
    <ellipse cx="-4" cy="-58" rx="6" ry="4" fill="none" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="-7" y1="-60" x2="-1" y2="-56" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Eyes (looking down/forward, neutral). -->
    <ellipse cx="-5" cy="-46" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="1" cy="-46" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-5" cy="-46" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="1" cy="-46" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Mouth — set firm professional. -->
    <line x1="-5" y1="-38" x2="3" y2="-38" stroke="#3a1810" stroke-width="0.85"/>
    <!-- Slight brow furrow. -->
    <path d="M-9,-52 Q-3,-55 0,-53" stroke="#3a1808" stroke-width="0.85" fill="none"/>
    <path d="M0,-53 Q3,-55 7,-52" stroke="#3a1808" stroke-width="0.85" fill="none"/>
  </g>

  <!-- 4 SQUAD MEMBERS approaching from background (smaller). -->
  <!-- SABLE silver. -->
  <g id="p12p5-sable-back" transform="translate(40, 360)">
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#p12p5silverDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#3a2818"/>
    <ellipse cx="-2" cy="-15" rx="3" ry="1.5" fill="#dce4f0"/>
    <!-- Cracked shoulder hint. -->
    <line x1="3" y1="-6" x2="5" y2="0" stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p12p5bloom)"/>
  </g>
  <!-- LUMA sapphire. -->
  <g id="p12p5-luma-back" transform="translate(80, 365)">
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#p12p5sapphireDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#a87850"/>
    <path d="M-3,-10 Q-7,-2 -7,8" stroke="#1a0808" stroke-width="2" fill="none"/>
    <ellipse cx="2" cy="-12" rx="2" ry="1.4" fill="#a878f8" opacity="0.65"/>
  </g>
  <!-- THRESH ruby. -->
  <g id="p12p5-thresh-back" transform="translate(195, 360)">
    <ellipse cx="0" cy="0" rx="6.5" ry="14" fill="url(#p12p5rubyDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#d8a880"/>
    <path d="M-3,-15 Q0,-17 3,-15 L3,-12 L-3,-12 Z" fill="#a83a18"/>
    <line x1="3" y1="-2" x2="8" y2="-4" stroke="#1a0808" stroke-width="1"/>
    <!-- Dent on left pauldron. -->
    <ellipse cx="-5" cy="-2" rx="1.4" ry="0.8" fill="#3a0810"/>
  </g>
  <!-- JINK emerald. -->
  <g id="p12p5-jink-back" transform="translate(225, 365)">
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#p12p5emeraldDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#d8b890"/>
    <path d="M-3,-15 Q0,-17 3,-15 L3,-12 L-3,-12 Z" fill="#f0d878"/>
  </g>

  <!-- DIALOGUE — WREN. -->
  <g id="p12p5-bal-wren">
    <rect x="14" y="14" width="220" height="60" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Alright. Gather round.</text>
    <text x="24" y="71" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I'll say this once.</text>
    <path d="M120,76 L132,76 L126,90 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="120" y1="76" x2="132" y2="76" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p12p5-meta">
    <text x="239" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">5</text>
    <text x="243" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">VERDICT</text>
  </g>
</svg>
