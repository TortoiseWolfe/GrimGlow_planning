<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 400" width="742" height="400">
  <title>Issue 2 — Page 6 — Panel 1: Jink launches — money shot</title>
  <desc>Dynamic wide low angle 24mm tracking. Jink launches from bracket ledge into open air above Victorian street w/ wing-pack FULLY DEPLOYED — 2 pairs translucent holographic dragonfly wings emerald geometric lattice trailing prismatic light. Banking hard right between fist-sized raindrops, body angled, one hand trailing emerald arc, golden curls whipping. Rain surrounds w/ drops deflected by wing-pack holo field. Below: vast street + cobblestones + gas lamp tower amber. Behind on wall: 4 squad as tiny colored dots. PURE EXHILARATION. SFX VWWMMM + JINK + SABLE tiny.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p1leaden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p6p1brick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#1a1010"/>
    </linearGradient>
    <linearGradient id="p6p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="p6p1amberHaze">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p6p1emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4828"/>
    </linearGradient>
    <radialGradient id="p6p1emeraldGlow">
      <stop offset="0%" stop-color="#7af0b0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p1wingMembrane">
      <stop offset="0%" stop-color="#7af0b0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="p6p1raindrop">
      <stop offset="0%" stop-color="#dce4f0" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#a8b8c8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a606a" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="p6p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p6p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p6p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG sky leaden grey rain. -->
  <rect width="742" height="280" fill="url(#p6p1leaden)"/>

  <!-- BRICK WALL on right (where squad watches from). -->
  <g id="p6p1-brick-wall">
    <rect x="600" y="0" width="142" height="400" fill="url(#p6p1brick)"/>
    <g stroke="#5a3818" stroke-width="0.4" opacity="0.55">
      <line x1="600" y1="40" x2="742" y2="40"/>
      <line x1="600" y1="80" x2="742" y2="80"/>
      <line x1="600" y1="120" x2="742" y2="120"/>
      <line x1="600" y1="160" x2="742" y2="160"/>
      <line x1="600" y1="200" x2="742" y2="200"/>
      <line x1="600" y1="240" x2="742" y2="240"/>
      <line x1="600" y1="280" x2="742" y2="280"/>
    </g>
    <!-- Drainpipe edge. -->
    <rect x="660" y="0" width="20" height="400" fill="#0a0c10"/>
    <line x1="670" y1="0" x2="670" y2="400" stroke="#3a3a45" stroke-width="0.6" opacity="0.55"/>
    <!-- Bracket. -->
    <rect x="654" y="200" width="32" height="6" fill="#1a1820"/>
    <!-- Wet sheen. -->
    <g stroke="#7af0ff" stroke-width="0.4" opacity="0.55" filter="url(#p6p1bloom)">
      <line x1="640" y1="0" x2="642" y2="400"/>
      <line x1="700" y1="0" x2="698" y2="400"/>
    </g>
  </g>

  <!-- 4 SQUAD MEMBERS on wall (tiny colored dots — script-specific). -->
  <g id="p6p1-squad-on-wall" transform="translate(670, 210)">
    <circle cx="0" cy="0" r="3" fill="#a8b0c0"/>
    <ellipse cx="0" cy="0" rx="5" ry="5" fill="#dce4ff" opacity="0.7" filter="url(#p6p1bloom)"/>
    <ellipse cx="2" cy="-1" rx="1.5" ry="0.8" fill="#dce4ff" opacity="0.85" filter="url(#p6p1bloom)"/>

    <circle cx="-12" cy="6" r="2.5" fill="#c87a35"/>
    <ellipse cx="-12" cy="6" rx="4" ry="4" fill="#f5a868" opacity="0.7" filter="url(#p6p1bloom)"/>

    <circle cx="12" cy="8" r="2.5" fill="#5a3ad8"/>
    <ellipse cx="12" cy="8" rx="4" ry="4" fill="#a890f0" opacity="0.7" filter="url(#p6p1bloom)"/>

    <circle cx="0" cy="14" r="3" fill="#dc2030"/>
    <ellipse cx="0" cy="14" rx="5" ry="5" fill="#f54848" opacity="0.7" filter="url(#p6p1bloom)"/>
  </g>

  <!-- DISTANT GAS LAMP in BG (script-specific amber contrast). -->
  <g id="p6p1-gas-lamp">
    <rect x="240" y="180" width="3" height="100" fill="#1a1820"/>
    <rect x="234" y="160" width="14" height="20" fill="#3a2818" stroke="#080a14" stroke-width="0.4"/>
    <ellipse cx="241" cy="170" rx="40" ry="32" fill="url(#p6p1amberHaze)" filter="url(#p6p1deepBloom)" opacity="0.85"/>
    <ellipse cx="241" cy="170" rx="6" ry="5" fill="#fae898" filter="url(#p6p1bloom)"/>
  </g>

  <!-- KERBSTONE + GRANITE SETTS at street level (BG, low). -->
  <g id="p6p1-street">
    <rect x="0" y="280" width="600" height="14" fill="#3a3e48"/>
    <line x1="0" y1="280" x2="600" y2="280" stroke="#080a14" stroke-width="0.7"/>
    <g fill="url(#p6p1cobble)" stroke="#080a14" stroke-width="0.4">
      <ellipse cx="60" cy="320" rx="20" ry="8"/>
      <ellipse cx="120" cy="322" rx="20" ry="8"/>
      <ellipse cx="180" cy="320" rx="20" ry="8"/>
      <ellipse cx="320" cy="320" rx="20" ry="8"/>
      <ellipse cx="380" cy="322" rx="20" ry="8"/>
      <ellipse cx="440" cy="320" rx="20" ry="8"/>
      <ellipse cx="500" cy="322" rx="20" ry="8"/>
      <ellipse cx="560" cy="320" rx="20" ry="8"/>

      <ellipse cx="80" cy="350" rx="18" ry="7"/>
      <ellipse cx="140" cy="352" rx="18" ry="7"/>
      <ellipse cx="220" cy="350" rx="18" ry="7"/>
      <ellipse cx="340" cy="352" rx="18" ry="7"/>
      <ellipse cx="400" cy="350" rx="18" ry="7"/>
      <ellipse cx="460" cy="352" rx="18" ry="7"/>
      <ellipse cx="520" cy="350" rx="18" ry="7"/>
    </g>
    <!-- Wet sheen + amber gaslight reflection. -->
    <g fill="#f5b860" opacity="0.45" filter="url(#p6p1bloom)">
      <ellipse cx="240" cy="320" rx="50" ry="3"/>
      <ellipse cx="240" cy="350" rx="40" ry="2"/>
    </g>
  </g>

  <!-- RAIN — many fist-sized drops falling everywhere. -->
  <g id="p6p1-rain-drops">
    <g fill="url(#p6p1raindrop)" filter="url(#p6p1bloom)">
      <ellipse cx="80" cy="60" rx="6" ry="9"/>
      <ellipse cx="180" cy="100" rx="5" ry="7"/>
      <ellipse cx="280" cy="40" rx="6" ry="9"/>
      <ellipse cx="450" cy="80" rx="5" ry="7"/>
      <ellipse cx="520" cy="40" rx="6" ry="8"/>
      <ellipse cx="100" cy="200" rx="6" ry="8"/>
      <ellipse cx="200" cy="240" rx="5" ry="7"/>
      <ellipse cx="540" cy="200" rx="5" ry="7"/>
    </g>
    <!-- Specular highlights. -->
    <g fill="#dce4f0" opacity="0.85">
      <circle cx="78" cy="58" r="1.4"/>
      <circle cx="178" cy="98" r="1.2"/>
      <circle cx="278" cy="38" r="1.4"/>
      <circle cx="448" cy="78" r="1.2"/>
      <circle cx="518" cy="38" r="1.4"/>
      <circle cx="98" cy="198" r="1.4"/>
      <circle cx="198" cy="238" r="1.2"/>
      <circle cx="538" cy="198" r="1.2"/>
    </g>
    <!-- Trajectory streaks. -->
    <g stroke="#a8b8c8" stroke-width="0.7" opacity="0.55" filter="url(#p6p1bloom)">
      <line x1="80" y1="20" x2="80" y2="50"/>
      <line x1="180" y1="60" x2="180" y2="90"/>
      <line x1="280" y1="0" x2="280" y2="30"/>
      <line x1="450" y1="40" x2="450" y2="70"/>
      <line x1="520" y1="0" x2="520" y2="30"/>
    </g>
  </g>

  <!-- JINK MID-LAUNCH center-frame banking right. Wing-pack fully deployed. -->
  <g id="p6p1-jink" transform="translate(371, 160) rotate(15)">

    <!-- BIG EMERALD GLOW HALO (the flare). -->
    <ellipse cx="0" cy="0" rx="120" ry="80" fill="url(#p6p1emeraldGlow)" filter="url(#p6p1deepBloom)" opacity="0.85"/>

    <!-- WING-PACK — 2 PAIRS of translucent dragonfly wings (script-specific). -->
    <g id="p6p1-wings" filter="url(#p6p1bloom)">
      <!-- Wing 1 — upper-left. -->
      <path d="M-8,-8 Q-50,-30 -90,-15 Q-60,-2 -8,0 Z" fill="url(#p6p1wingMembrane)" stroke="#7af0b0" stroke-width="0.7" opacity="0.85"/>
      <g stroke="#7af0b0" stroke-width="0.5" opacity="0.85" fill="none">
        <line x1="-8" y1="-5" x2="-90" y2="-15"/>
        <line x1="-8" y1="-5" x2="-50" y2="-30"/>
        <line x1="-30" y1="-15" x2="-50" y2="-15"/>
      </g>
      <!-- Wing 2 — upper-right (forward). -->
      <path d="M8,-8 Q40,-32 80,-12 Q60,-2 8,0 Z" fill="url(#p6p1wingMembrane)" stroke="#7af0b0" stroke-width="0.7" opacity="0.85"/>
      <g stroke="#7af0b0" stroke-width="0.5" opacity="0.85" fill="none">
        <line x1="8" y1="-5" x2="80" y2="-12"/>
        <line x1="8" y1="-5" x2="40" y2="-32"/>
        <line x1="30" y1="-15" x2="50" y2="-22"/>
      </g>
      <!-- Wing 3 — lower-left back. -->
      <path d="M-8,4 Q-40,18 -70,8 Q-50,0 -8,2 Z" fill="url(#p6p1wingMembrane)" stroke="#7af0b0" stroke-width="0.6" opacity="0.7"/>
      <g stroke="#7af0b0" stroke-width="0.4" opacity="0.7" fill="none">
        <line x1="-8" y1="2" x2="-70" y2="8"/>
        <line x1="-25" y1="6" x2="-40" y2="14"/>
      </g>
      <!-- Wing 4 — lower-right back. -->
      <path d="M8,4 Q35,18 60,10 Q45,0 8,2 Z" fill="url(#p6p1wingMembrane)" stroke="#7af0b0" stroke-width="0.6" opacity="0.7"/>
      <g stroke="#7af0b0" stroke-width="0.4" opacity="0.7" fill="none">
        <line x1="8" y1="2" x2="60" y2="10"/>
        <line x1="25" y1="6" x2="40" y2="14"/>
      </g>

      <!-- Brilliant central bloom (wing-pack source). -->
      <ellipse cx="0" cy="-2" rx="18" ry="12" fill="#7af0b0" filter="url(#p6p1deepBloom)" opacity="0.95"/>
      <ellipse cx="0" cy="-2" rx="9" ry="6" fill="#ffffff" filter="url(#p6p1bloom)" opacity="0.85"/>
    </g>

    <!-- JINK BODY (body angled, banking). -->
    <g id="p6p1-body">
      <!-- Torso. -->
      <path d="M-8,-2 Q-10,12 -8,22 L8,22 Q10,12 8,-2 L4,-7 L-4,-7 Z" fill="url(#p6p1emerald)" stroke="#080408" stroke-width="0.6"/>
      <line x1="0" y1="-2" x2="0" y2="20" stroke="#7af0b0" stroke-width="0.5" opacity="0.85" filter="url(#p6p1bloom)"/>

      <!-- Legs trailing back (mid-flight). -->
      <path d="M-5,22 L-10,38" fill="none" stroke="#0a4828" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M5,22 L10,38" fill="none" stroke="#0a4828" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-10" cy="40" rx="3" ry="1.4" fill="#080408"/>
      <ellipse cx="10" cy="40" rx="3" ry="1.4" fill="#080408"/>

      <!-- ONE HAND TRAILING EMERALD ARC (script-specific). -->
      <path d="M-8,2 L-22,-8 L-32,-15" fill="none" stroke="url(#p6p1emerald)" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-32" cy="-15" rx="3" ry="2" fill="#e8c8a0"/>
      <!-- Trailing emerald arc from hand. -->
      <path d="M-32,-15 Q-50,-22 -65,-30" stroke="#7af0b0" stroke-width="2" fill="none" opacity="0.85" filter="url(#p6p1bloom)"/>
      <path d="M-32,-15 Q-50,-22 -65,-30" stroke="#dce4f0" stroke-width="0.7" fill="none" opacity="0.85"/>

      <!-- Other arm forward. -->
      <path d="M8,2 L18,-2 L25,0" fill="none" stroke="url(#p6p1emerald)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Head with whipping golden curls. -->
      <ellipse cx="0" cy="-15" rx="6" ry="7" fill="#e8c8a0"/>

      <!-- WHIPPING GOLDEN CURLS (script-specific). -->
      <g fill="#f5d860">
        <circle cx="-3" cy="-22" r="2.5"/>
        <circle cx="0" cy="-25" r="2.8"/>
        <circle cx="3" cy="-22" r="2.5"/>
        <!-- Whipped trailing curls. -->
        <circle cx="-7" cy="-19" r="1.8"/>
        <circle cx="-12" cy="-14" r="1.4"/>
        <circle cx="-16" cy="-10" r="1"/>
      </g>
      <!-- Curl whip motion lines. -->
      <g stroke="#f5d860" stroke-width="0.5" opacity="0.55" filter="url(#p6p1bloom)">
        <path d="M-12,-14 Q-20,-12 -26,-8"/>
        <path d="M-7,-19 Q-14,-18 -20,-15"/>
      </g>

      <!-- Eyes (alive, exhilarated). -->
      <ellipse cx="-2" cy="-15" rx="1.4" ry="0.8" fill="#dce4f0"/>
      <ellipse cx="2" cy="-15" rx="1.4" ry="0.8" fill="#dce4f0"/>
      <ellipse cx="-2" cy="-15" rx="0.7" ry="0.5" fill="#1a3010"/>
      <ellipse cx="2" cy="-15" rx="0.7" ry="0.5" fill="#1a3010"/>

      <!-- BIG GRIN — mouth open, exhilarated. -->
      <ellipse cx="0" cy="-9" rx="2.5" ry="1.5" fill="#1a0808"/>
      <path d="M-3,-10 Q0,-6 3,-10" stroke="#3a2010" stroke-width="0.7" fill="none"/>
      <line x1="-3" y1="-10" x2="3" y2="-10" stroke="#dce4f0" stroke-width="0.5"/>
    </g>

    <!-- PRISMATIC TRAILS streaming behind (from wing tips). -->
    <g stroke="#7af0b0" stroke-width="1.4" opacity="0.85" fill="none" filter="url(#p6p1bloom)">
      <path d="M-90,-15 Q-130,-10 -160,0"/>
      <path d="M-70,8 Q-110,15 -140,25"/>
      <path d="M80,-12 Q60,15 50,40"/>
      <path d="M60,10 Q60,30 50,50"/>
    </g>
    <!-- Geometric prismatic glyphs in trails. -->
    <g stroke="#7af0b0" stroke-width="0.6" opacity="0.7" fill="none" filter="url(#p6p1bloom)">
      <polygon points="-100,-12 -95,-15 -95,-9"/>
      <polygon points="-130,-5 -125,-8 -125,-2"/>
      <polygon points="-90,12 -85,9 -85,15"/>
      <polygon points="-120,18 -115,15 -115,21"/>
    </g>
    <!-- Particle sparks. -->
    <g fill="#dce4f0" opacity="0.85" filter="url(#p6p1bloom)">
      <circle cx="-100" cy="-8" r="0.6"/>
      <circle cx="-130" cy="-2" r="0.5"/>
      <circle cx="-150" cy="5" r="0.6"/>
      <circle cx="-90" cy="15" r="0.5"/>
    </g>
  </g>

  <!-- DEFLECTED RAINDROPS near Jink (illuminated by wing-pack — script-specific). -->
  <g id="p6p1-deflected-drops">
    <g fill="#7af0b0" opacity="0.85" filter="url(#p6p1bloom)">
      <ellipse cx="320" cy="120" rx="9" ry="14"/>
      <ellipse cx="430" cy="160" rx="8" ry="12"/>
    </g>
    <g fill="#dce4f0" opacity="0.85">
      <circle cx="318" cy="118" r="2"/>
      <circle cx="428" cy="158" r="1.8"/>
    </g>
    <!-- Spray from deflection. -->
    <g fill="#7af0b0" opacity="0.7" filter="url(#p6p1bloom)">
      <circle cx="335" cy="115" r="1"/>
      <circle cx="345" cy="125" r="0.8"/>
      <circle cx="445" cy="155" r="0.9"/>
      <circle cx="455" cy="170" r="0.7"/>
    </g>
  </g>

  <!-- SFX VWWMMM (wing-pack hum). -->
  <g id="p6p1-sfx-wing">
    <text x="120" y="380" font-family="Impact, Haettenschweiler, sans-serif" font-size="32" font-weight="900" stroke="#1a1820" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill" fill="#7af0b0" transform="rotate(-7 120 380)" opacity="0.9">VWWMMM</text>
  </g>

  <!-- JINK exhilarated. -->
  <g id="p6p1-dlg-jink">
    <rect x="14" y="14" width="140" height="40" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="33" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" font-style="italic" fill="#1a1a1a">WHOOOO!</text>
    <path d="M88,54 L106,54 L320,160 Z" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-linejoin="round"/>
    <line x1="88" y1="54" x2="106" y2="54" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- SABLE tiny (from the wall). -->
  <g id="p6p1-dlg-sable-tiny">
    <rect x="540" y="240" width="180" height="36" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="1.5" filter="url(#balloonShadow)" opacity="0.92"/>
    <text x="550" y="256" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE (tiny)</text>
    <text x="550" y="270" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="500" fill="#1a1a1a">Low and fast, Jink. LOW and FAST.</text>
    <path d="M620,240 L638,240 L660,210 Z" fill="#ffffff" stroke="#5a606a" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="620" y1="240" x2="638" y2="240" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p6p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">1</text>
    <text x="738" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">JINK LAUNCHES — MONEY SHOT</text>
  </g>
</svg>
