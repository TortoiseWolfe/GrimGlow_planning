<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 700" width="366" height="700">
  <title>Issue 2 — Page 18 — Panel 4: Sable + Thresh silent exchange, command as recognition</title>
  <desc>MCU 65mm two-shot dim wall cavity. Two women regard each other across space. Left: Sable dark brown skin silver-white buzz silver suit cracked right shoulder — micro-expression recognition smallest warmth allowed barely visible nod. Right: Thresh pale skin copper-red buzz ruby armored dented left pauldron weapon across knees — jaw tight eyes watchful steadied by acknowledgment returning nod. Between: warm amber power cell light catches both faces low golden illumination connecting across dark space. Blue-white perimeter behind Thresh entrance. Both faces warm light — warmth is the point. NO DIALOGUE silent exchange.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p4night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p18p4joist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p18p4silverWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89880"/>
      <stop offset="50%" stop-color="#787060"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="p18p4rubyWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82838"/>
      <stop offset="50%" stop-color="#5a1820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <radialGradient id="p18p4amberConnect">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p4perim">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p18p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p18p4deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG night. -->
  <rect width="366" height="700" fill="url(#p18p4night)"/>

  <!-- AMBER POWER CELL between them — center frame. -->
  <ellipse cx="183" cy="400" rx="220" ry="280" fill="url(#p18p4amberConnect)" filter="url(#p18p4deepBloom)" opacity="0.95"/>
  <!-- Power cell visible at center. -->
  <g transform="translate(183, 600)">
    <path d="M-12,0 L-8,-9 L0,-12 L8,-9 L12,0 L8,9 L0,12 L-8,9 Z" fill="#3a3a44" stroke="#080404" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#ffe8a0" opacity="0.95" filter="url(#p18p4bloom)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" filter="url(#p18p4bloom)"/>
  </g>

  <!-- Blue-white perimeter behind Thresh (right). -->
  <ellipse cx="320" cy="350" rx="80" ry="200" fill="url(#p18p4perim)" filter="url(#p18p4deepBloom)" opacity="0.65"/>
  <g stroke="#a8d8f8" stroke-width="0.5" fill="none" opacity="0.85" filter="url(#p18p4bloom)">
    <path d="M340,260 L360,255"/>
    <path d="M340,440 L360,430"/>
    <path d="M340,260 L340,440"/>
  </g>

  <!-- Timber JOIST FLOOR. -->
  <rect x="0" y="640" width="366" height="60" fill="url(#p18p4joist)" stroke="#080404" stroke-width="0.85"/>
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.85">
    <line x1="0" y1="660" x2="366" y2="660"/>
    <line x1="0" y1="680" x2="366" y2="680"/>
  </g>

  <!-- SABLE — left side, MCU. -->
  <g id="p18p4-sable" transform="translate(80, 380)">
    <!-- Body upper torso. -->
    <path d="M-50,260 L-55,80 L-45,30 L-25,5 L-10,-15 L10,-15 L25,5 L45,30 L55,80 L50,260 Z" fill="url(#p18p4silverWarm)" stroke="#080404" stroke-width="0.85"/>
    <!-- CRACKED RIGHT SHOULDER. -->
    <path d="M25,5 L48,18 L52,42 L48,68" fill="url(#p18p4silverWarm)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.7" opacity="0.85" filter="url(#p18p4bloom)">
      <path d="M30,12 L36,24 L34,38 L40,52"/>
      <path d="M34,28 L40,40"/>
    </g>
    <!-- Silver collar lit warm amber. -->
    <ellipse cx="0" cy="-15" rx="14" ry="3" fill="#dce4f0" opacity="0.65" filter="url(#p18p4bloom)"/>
    <ellipse cx="0" cy="-15" rx="22" ry="6" fill="#f5b860" opacity="0.65" filter="url(#p18p4strongBloom)"/>

    <!-- Mud streaks. -->
    <g fill="#3a2818" opacity="0.85">
      <ellipse cx="-15" cy="60" rx="6" ry="3"/>
      <ellipse cx="20" cy="100" rx="5" ry="3"/>
      <ellipse cx="-15" cy="160" rx="6" ry="3"/>
      <ellipse cx="20" cy="200" rx="5" ry="3"/>
    </g>

    <!-- HEAD facing right (toward Thresh). -->
    <ellipse cx="3" cy="-50" rx="32" ry="34" fill="#3a2818"/>
    <!-- Silver-white buzz. -->
    <path d="M-22,-78 Q3,-90 28,-78 L28,-65 L-22,-65 L-22,-78 Z" fill="#f0e8d8"/>
    <line x1="-22" y1="-65" x2="28" y2="-65" stroke="#3a3a44" stroke-width="0.85" opacity="0.85"/>
    <ellipse cx="3" cy="-78" rx="20" ry="6" fill="#f5b860" opacity="0.45" filter="url(#p18p4strongBloom)"/>
    <g fill="#5a606a" opacity="0.85">
      <circle cx="-10" cy="-82" r="0.85"/>
      <circle cx="0" cy="-86" r="0.85"/>
      <circle cx="10" cy="-86" r="0.85"/>
      <circle cx="20" cy="-82" r="0.85"/>
    </g>
    <!-- Brow soft (recognition). -->
    <path d="M-18,-58 Q-8,-62 0,-60" stroke="#1a0808" stroke-width="2" fill="none"/>
    <path d="M0,-60 Q8,-62 20,-58" stroke="#1a0808" stroke-width="2" fill="none"/>
    <!-- Eyes — looking right (at Thresh), softer. -->
    <ellipse cx="-8" cy="-46" rx="5" ry="3.5" fill="#dce4f0"/>
    <ellipse cx="14" cy="-46" rx="5" ry="3.5" fill="#dce4f0"/>
    <ellipse cx="-6" cy="-46" rx="2" ry="2" fill="#5a3a18"/>
    <ellipse cx="16" cy="-46" rx="2" ry="2" fill="#5a3a18"/>
    <ellipse cx="-6" cy="-46" rx="1.2" ry="1.2" fill="#080404"/>
    <ellipse cx="16" cy="-46" rx="1.2" ry="1.2" fill="#080404"/>
    <circle cx="-4" cy="-48" r="0.85" fill="#ffe8a0" opacity="0.95" filter="url(#p18p4bloom)"/>
    <circle cx="18" cy="-48" r="0.85" fill="#ffe8a0" opacity="0.95" filter="url(#p18p4bloom)"/>
    <!-- Cheekbones lit warm. -->
    <ellipse cx="-18" cy="-22" rx="9" ry="5" fill="#a87850" opacity="0.55" filter="url(#p18p4bloom)"/>
    <ellipse cx="22" cy="-22" rx="9" ry="5" fill="#a87850" opacity="0.55" filter="url(#p18p4bloom)"/>
    <ellipse cx="0" cy="-30" rx="34" ry="20" fill="#f5b860" opacity="0.45" filter="url(#p18p4strongBloom)"/>
    <!-- Lips — barely visible nod, slightly upturn corner. -->
    <path d="M-8,-2 Q3,0 12,-2" stroke="#1a0808" stroke-width="1.4" fill="none"/>
  </g>

  <!-- THRESH — right side, MCU. -->
  <g id="p18p4-thresh" transform="translate(285, 380)">
    <path d="M-50,260 L-55,80 L-45,30 L-25,5 L-10,-15 L10,-15 L25,5 L45,30 L55,80 L50,260 Z" fill="url(#p18p4rubyWarm)" stroke="#080404" stroke-width="0.85"/>
    <!-- DENTED LEFT pauldron. -->
    <path d="M-25,5 L-48,18 L-48,42 L-25,48" fill="url(#p18p4rubyWarm)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-44,22 Q-38,32 -32,28 Q-40,18 -46,22 Z" fill="#3a0810" stroke="#080404" stroke-width="0.4"/>
    <!-- Right pauldron. -->
    <path d="M25,5 L48,18 L48,42 L25,48" fill="url(#p18p4rubyWarm)" stroke="#080404" stroke-width="0.5"/>
    <!-- Crimson collar pulse. -->
    <ellipse cx="0" cy="-15" rx="20" ry="4" fill="#f54848" opacity="0.85" filter="url(#p18p4bloom)"/>
    <ellipse cx="0" cy="-15" rx="28" ry="6" fill="#f5b860" opacity="0.55" filter="url(#p18p4strongBloom)"/>

    <!-- Mud streaks. -->
    <g fill="#3a1010" opacity="0.85">
      <ellipse cx="-15" cy="60" rx="6" ry="3"/>
      <ellipse cx="20" cy="100" rx="5" ry="3"/>
      <ellipse cx="-15" cy="160" rx="6" ry="3"/>
      <ellipse cx="20" cy="200" rx="5" ry="3"/>
    </g>

    <!-- WEAPON ACROSS KNEES (visible at lower frame). -->
    <rect x="-50" y="240" width="100" height="14" rx="1" fill="#1a0810" stroke="#080404" stroke-width="0.85"/>

    <!-- HEAD facing LEFT (toward Sable). -->
    <ellipse cx="-3" cy="-50" rx="32" ry="34" fill="#d8a880"/>
    <!-- BUZZ. -->
    <path d="M-30,-78 Q-3,-90 24,-78 L24,-65 L-30,-65 L-30,-78 Z" fill="#a83a18"/>
    <line x1="-30" y1="-65" x2="24" y2="-65" stroke="#5a1808" stroke-width="0.85" opacity="0.85"/>
    <ellipse cx="-3" cy="-78" rx="20" ry="6" fill="#f5b860" opacity="0.45" filter="url(#p18p4strongBloom)"/>
    <g fill="#5a1808" opacity="0.85">
      <circle cx="-22" cy="-82" r="0.85"/>
      <circle cx="-12" cy="-86" r="0.85"/>
      <circle cx="0" cy="-86" r="0.85"/>
      <circle cx="12" cy="-86" r="0.85"/>
    </g>
    <!-- Brow set, but softer (steadied). -->
    <path d="M-22,-58 Q-12,-63 0,-60" stroke="#5a1808" stroke-width="2.5" fill="none"/>
    <path d="M0,-60 Q12,-63 18,-58" stroke="#5a1808" stroke-width="2.5" fill="none"/>
    <!-- Eyes — looking LEFT (at Sable). -->
    <ellipse cx="-15" cy="-46" rx="5" ry="3.5" fill="#dce4f0"/>
    <ellipse cx="9" cy="-46" rx="5" ry="3.5" fill="#dce4f0"/>
    <ellipse cx="-17" cy="-46" rx="2" ry="2" fill="#3a2010"/>
    <ellipse cx="7" cy="-46" rx="2" ry="2" fill="#3a2010"/>
    <ellipse cx="-17" cy="-46" rx="1.2" ry="1.2" fill="#080404"/>
    <ellipse cx="7" cy="-46" rx="1.2" ry="1.2" fill="#080404"/>
    <circle cx="-19" cy="-48" r="0.85" fill="#ffe8a0" opacity="0.95" filter="url(#p18p4bloom)"/>
    <circle cx="5" cy="-48" r="0.85" fill="#ffe8a0" opacity="0.95" filter="url(#p18p4bloom)"/>

    <!-- Cheekbones warm. -->
    <ellipse cx="-22" cy="-22" rx="9" ry="5" fill="#a87850" opacity="0.55" filter="url(#p18p4bloom)"/>
    <ellipse cx="20" cy="-22" rx="9" ry="5" fill="#a87850" opacity="0.55" filter="url(#p18p4bloom)"/>
    <ellipse cx="0" cy="-30" rx="34" ry="20" fill="#f5b860" opacity="0.45" filter="url(#p18p4strongBloom)"/>

    <!-- Lips — slight return nod. -->
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#1a0808" stroke-width="2"/>

    <!-- Jaw still tight. -->
    <ellipse cx="-22" cy="-12" rx="3" ry="2" fill="#5a3a18" opacity="0.55"/>
    <ellipse cx="22" cy="-12" rx="3" ry="2" fill="#5a3a18" opacity="0.55"/>
  </g>

  <!-- NO DIALOGUE — silent exchange. -->

  <!-- Meta. -->
  <g id="p18p4-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">4</text>
    <text x="362" y="692" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">SEEN</text>
  </g>
</svg>
