<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 360" width="742" height="360">
  <title>Issue 2 — Page 20 — Panel 1: Sable glances back, checks squad sleeping, retrieves data module</title>
  <desc>MS 65mm eye level vertical isolation. Sable far end cavity glances back over shoulder — checking others asleep. Mid-ground partially obscured by timber stud sleeping squad visible: dim amber glow coloured suit accents resting bodies. Thresh silhouette on watch facing entrance away. No one looking. Sable turns back to brick wall reaches into compartment damaged suit draws data module dark. Two zones: warm amber world of squad behind, cold dark corner Sable with secret. NO DIALOGUE.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p20p1dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p20p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p20p1timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p20p1silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#787068"/>
      <stop offset="100%" stop-color="#2a2820"/>
    </linearGradient>
    <radialGradient id="p20p1amberDistant">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5a2818" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p1perimDistant">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p20p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p20p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark cavity. -->
  <rect width="742" height="360" fill="url(#p20p1dark)"/>

  <!-- BRICK wall back (far end where Sable sits). -->
  <rect x="0" y="0" width="742" height="360" fill="url(#p20p1brick)" opacity="0.85"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
    <line x1="0" y1="300" x2="742" y2="300"/>
  </g>

  <!-- AMBER zone (right side, distant — sleeping squad). -->
  <ellipse cx="600" cy="200" rx="240" ry="200" fill="url(#p20p1amberDistant)" filter="url(#p20p1deepBloom)" opacity="0.85"/>

  <!-- TIMBER STUD partially screening Sable from squad (mid-frame). -->
  <rect x="380" y="0" width="40" height="360" fill="url(#p20p1timber)" stroke="#080404" stroke-width="0.85"/>
  <line x1="385" y1="0" x2="385" y2="360" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>
  <line x1="395" y1="0" x2="395" y2="360" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>
  <line x1="405" y1="0" x2="405" y2="360" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>
  <line x1="415" y1="0" x2="415" y2="360" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>

  <!-- DISTANT SLEEPING SQUAD visible behind timber stud (mid-right). -->
  <g id="p20p1-squad" opacity="0.85">
    <!-- Power cell glowing dim. -->
    <ellipse cx="600" cy="280" rx="14" ry="10" fill="#a85820" opacity="0.65" filter="url(#p20p1bloom)"/>
    <circle cx="600" cy="280" r="3" fill="#f5b860" opacity="0.85" filter="url(#p20p1bloom)"/>
    <!-- Sleeping figures (blurred suggestion). -->
    <ellipse cx="540" cy="290" rx="20" ry="8" fill="#5a3ad8" opacity="0.55" filter="url(#p20p1bloom)"/>
    <ellipse cx="640" cy="295" rx="14" ry="8" fill="#a86528" opacity="0.55" filter="url(#p20p1bloom)"/>
    <!-- Tiny suit accent dots. -->
    <circle cx="540" cy="285" r="1.4" fill="#a878f8" opacity="0.95" filter="url(#p20p1bloom)"/>
    <circle cx="640" cy="290" r="1.4" fill="#f0a868" opacity="0.95" filter="url(#p20p1bloom)"/>
    <!-- Jink emerald (above on lath). -->
    <ellipse cx="580" cy="100" rx="6" ry="4" fill="#3aa078" opacity="0.65" filter="url(#p20p1bloom)"/>
    <circle cx="580" cy="100" r="0.85" fill="#7af0b0" opacity="0.95" filter="url(#p20p1bloom)"/>
  </g>

  <!-- THRESH silhouette on watch (right edge, facing entrance — facing AWAY from Sable). -->
  <g id="p20p1-thresh-far" opacity="0.85">
    <ellipse cx="700" cy="290" rx="8" ry="14" fill="#3a0810"/>
    <circle cx="700" cy="278" r="4" fill="#1a0808"/>
    <circle cx="700" cy="285" r="0.85" fill="#f54848" opacity="0.95" filter="url(#p20p1bloom)"/>
  </g>

  <!-- BLUE-WHITE PERIMETER (faint, far right). -->
  <ellipse cx="742" cy="220" rx="80" ry="120" fill="url(#p20p1perimDistant)" filter="url(#p20p1deepBloom)" opacity="0.65"/>
  <g stroke="#a8d8f8" stroke-width="0.4" fill="none" opacity="0.65" filter="url(#p20p1bloom)">
    <line x1="730" y1="160" x2="742" y2="155"/>
    <line x1="730" y1="280" x2="742" y2="270"/>
  </g>

  <!-- SABLE — far LEFT of frame (deepest recess), turned to brick wall, just glanced back. -->
  <g id="p20p1-sable" transform="translate(160, 220)">
    <!-- Body seated against brick wall. -->
    <path d="M-15,140 L-18,40 L-15,-15 L-8,-30 L8,-30 L15,-15 L18,40 L15,140 Z" fill="url(#p20p1silverDirty)" stroke="#080404" stroke-width="0.7"/>
    <!-- CRACKED RIGHT SHOULDER. -->
    <path d="M15,-12 L25,-2 L28,18 L25,38" fill="url(#p20p1silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p20p1bloom)">
      <path d="M18,-5 L24,8 L22,22"/>
    </g>
    <!-- Silver collar dim. -->
    <ellipse cx="0" cy="-30" rx="10" ry="3" fill="#dce4f0" opacity="0.45" filter="url(#p20p1bloom)"/>

    <!-- Mud streaks. -->
    <g fill="#3a2818" opacity="0.85">
      <ellipse cx="-10" cy="40" rx="6" ry="2.5"/>
      <ellipse cx="12" cy="80" rx="6" ry="2.5"/>
    </g>

    <!-- HAND reaching into suit compartment (chest area). -->
    <path d="M-15,5 L-30,12 L-32,18 L-13,15 Z" fill="url(#p20p1silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="-32" cy="14" rx="5" ry="3" fill="#3a2818" stroke="#080404" stroke-width="0.4"/>
    <!-- Suit chest compartment open. -->
    <rect x="-14" y="6" width="14" height="10" rx="1" fill="#080404" stroke="#3a3a44" stroke-width="0.5"/>

    <!-- DATA MODULE in hand (still dark — not yet activated). -->
    <rect x="-38" y="8" width="14" height="10" rx="1" fill="#1a1820" stroke="#5a606a" stroke-width="0.85"/>

    <!-- HEAD turned back over shoulder LOOKING right toward squad (CHECKING). -->
    <ellipse cx="6" cy="-46" rx="11" ry="12" fill="#3a2818"/>
    <!-- Silver-white buzz. -->
    <path d="M-6,-54 Q6,-58 16,-54 L16,-46 L-6,-46 Z" fill="#787068"/>
    <!-- Eye looking right (over shoulder). -->
    <ellipse cx="3" cy="-48" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="11" cy="-48" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="5" cy="-48" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="13" cy="-48" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Sharp brow checking. -->
    <line x1="0" y1="-54" x2="14" y2="-54" stroke="#1a0808" stroke-width="1.4"/>
    <!-- Tense lips. -->
    <line x1="3" y1="-40" x2="11" y2="-40" stroke="#3a1810" stroke-width="0.85"/>
    <!-- Jaw tense. -->
    <ellipse cx="-4" cy="-42" rx="3" ry="2" fill="#1a0808" opacity="0.55"/>
    <ellipse cx="14" cy="-42" rx="3" ry="2" fill="#1a0808" opacity="0.55"/>
  </g>

  <!-- NO DIALOGUE — silence. -->

  <!-- Meta. -->
  <g id="p20p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="352" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">CHECK</text>
  </g>
</svg>
