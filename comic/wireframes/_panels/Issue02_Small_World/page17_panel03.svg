<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 340" width="366" height="340">
  <title>Issue 2 — Page 17 — Panel 3: Jink hangs from lath, scout volunteers, restless interest</title>
  <desc>MS 50mm eye level. Jink hangs from thin horizontal wooden lath inside wall cavity — one arm gripping lath both legs hooked other arm dangling. Lean androgynous young-adult late teens early 20s. Bright golden blonde curly hair catching amber light below light brown skin. Wing-pack seams pulse faint emerald between shoulder blades. Restless interest — partial grin returning eyes bright already volunteering scouting mission. Layered new awareness. Warm amber uplighting. Lath-and-plaster wall behind shadow. JINK I can scout gear thing find cover ground from air / SABLE OP not tonight tonight rest / JINK first light then / SABLE OP we'll see.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p3dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p17p3plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4828"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p17p3lath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p17p3amberUp">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p17p3emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <radialGradient id="p17p3wingDim">
      <stop offset="0%" stop-color="#7af0b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p17p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p17p3deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG cavity. -->
  <rect width="366" height="340" fill="url(#p17p3dark)"/>

  <!-- Lath-and-plaster wall background. -->
  <rect width="366" height="340" fill="url(#p17p3plaster)" opacity="0.85"/>
  <g stroke="#1a0808" stroke-width="0.85" opacity="0.85">
    <line x1="0" y1="20" x2="366" y2="20"/>
    <line x1="0" y1="40" x2="366" y2="40"/>
    <line x1="0" y1="60" x2="366" y2="60"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="100" x2="366" y2="100"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="180" x2="366" y2="180"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="220" x2="366" y2="220"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
    <line x1="0" y1="260" x2="366" y2="260"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
    <line x1="0" y1="300" x2="366" y2="300"/>
    <line x1="0" y1="320" x2="366" y2="320"/>
  </g>

  <!-- AMBER UPLIGHTING from below. -->
  <ellipse cx="183" cy="340" rx="280" ry="180" fill="url(#p17p3amberUp)" filter="url(#p17p3deepBloom)" opacity="0.85"/>

  <!-- THE LATH PERCH (horizontal across upper area). -->
  <rect x="0" y="80" width="366" height="14" fill="url(#p17p3lath)" stroke="#080404" stroke-width="0.85"/>
  <line x1="0" y1="82" x2="366" y2="82" stroke="#5a3a18" stroke-width="0.4" opacity="0.85"/>
  <g fill="#080404">
    <circle cx="80" cy="87" r="1.2"/>
    <circle cx="180" cy="87" r="1.2"/>
    <circle cx="280" cy="87" r="1.2"/>
  </g>

  <!-- JINK hanging from lath — body inverted/horizontal. -->
  <g id="p17p3-jink" transform="translate(180, 100)">
    <!-- Wing-pack visible at back (between shoulder blades). -->
    <ellipse cx="-12" cy="50" rx="14" ry="4" fill="url(#p17p3wingDim)" opacity="0.85" transform="rotate(-30 -12 50)" filter="url(#p17p3bloom)"/>
    <ellipse cx="12" cy="50" rx="14" ry="4" fill="url(#p17p3wingDim)" opacity="0.85" transform="rotate(30 12 50)" filter="url(#p17p3bloom)"/>

    <!-- Body — sloped forward (one arm gripping lath up, both legs hooked, leaning down). -->
    <path d="M-13,40 L-15,75 L-13,110 L-5,140 L5,140 L13,110 L15,75 L13,40 Z" fill="url(#p17p3emeraldDirty)" stroke="#080404" stroke-width="0.7"/>

    <!-- LEGS hooked over lath (going UP from body). -->
    <path d="M-7,40 L-12,5 L-8,-12 L-2,-12 L-2,40 Z" fill="url(#p17p3emeraldDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M2,40 L2,-12 L8,-12 L12,5 L7,40 Z" fill="url(#p17p3emeraldDirty)" stroke="#080404" stroke-width="0.5"/>

    <!-- ONE ARM up gripping lath. -->
    <path d="M-13,75 L-32,18 L-26,12 L-7,72 Z" fill="url(#p17p3emeraldDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="-32" cy="14" rx="4" ry="3" fill="#d8b890" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Knuckles gripping lath. -->
    <g stroke="#3a1808" stroke-width="0.5">
      <line x1="-35" y1="11" x2="-35" y2="6"/>
      <line x1="-32" y1="11" x2="-32" y2="6"/>
      <line x1="-29" y1="11" x2="-29" y2="6"/>
    </g>

    <!-- OTHER ARM dangling DOWN. -->
    <path d="M13,75 L18,120 L24,120 L18,75 Z" fill="url(#p17p3emeraldDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="22" cy="124" rx="4" ry="3" fill="#d8b890" stroke="#3a1808" stroke-width="0.4"/>

    <!-- Emerald collar. -->
    <ellipse cx="0" cy="40" rx="9" ry="2" fill="#7af0b0" opacity="0.85" filter="url(#p17p3bloom)"/>

    <!-- HEAD — looking down (toward squad below, body upright but head turned). -->
    <ellipse cx="0" cy="155" rx="13" ry="14" fill="#d8b890"/>
    <!-- Curls falling down (gravity). -->
    <path d="M-11,168 Q-12,180 -8,190" stroke="#f0d878" stroke-width="2" fill="none"/>
    <path d="M-5,170 Q-4,184 -2,194" stroke="#f0d878" stroke-width="2" fill="none"/>
    <path d="M5,170 Q4,184 2,194" stroke="#f0d878" stroke-width="2" fill="none"/>
    <path d="M11,168 Q12,180 8,190" stroke="#f0d878" stroke-width="2" fill="none"/>
    <!-- Top of head curls (compressed). -->
    <path d="M-11,148 Q0,140 11,148 L11,155 L-11,155 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-5" cy="146" r="1.4"/><circle cx="0" cy="143" r="1.4"/><circle cx="5" cy="146" r="1.4"/></g>
    <!-- Eyes (looking down/toward viewer). -->
    <ellipse cx="-3" cy="158" rx="1.6" ry="1.2" fill="#dce4f0"/>
    <ellipse cx="3" cy="158" rx="1.6" ry="1.2" fill="#dce4f0"/>
    <ellipse cx="-3" cy="158" rx="0.8" ry="0.8" fill="#1a0808"/>
    <ellipse cx="3" cy="158" rx="0.8" ry="0.8" fill="#1a0808"/>
    <!-- Partial grin returning. -->
    <path d="M-4,164 Q0,167 4,164" stroke="#1a0808" stroke-width="0.85" fill="none"/>
    <!-- Amber catch on face (uplighting). -->
    <ellipse cx="0" cy="160" rx="14" ry="10" fill="#ffe8a0" opacity="0.55" filter="url(#p17p3strongBloom)"/>
  </g>

  <!-- DIALOGUE -->
  <g id="p17p3-bal-jink1">
    <rect x="14" y="14" width="240" height="60" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I can scout. The gear thing —</text>
    <text x="24" y="71" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I'll find it. From the air.</text>
  </g>

  <g id="p17p3-bal-sable-op1">
    <rect x="120" y="220" width="232" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-dasharray="4,3" filter="url(#balloonShadow)"/>
    <text x="130" y="240" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE (O.P.)</text>
    <text x="130" y="256" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Not tonight. Tonight we rest.</text>
  </g>

  <g id="p17p3-bal-jink2">
    <rect x="14" y="266" width="180" height="40" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="284" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="300" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">First light, then.</text>
  </g>

  <g id="p17p3-bal-sable-op2">
    <rect x="200" y="266" width="152" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-dasharray="4,3" filter="url(#balloonShadow)"/>
    <text x="210" y="284" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE (O.P.)</text>
    <text x="210" y="300" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">We'll see.</text>
  </g>

  <!-- Meta. -->
  <g id="p17p3-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">3</text>
    <text x="362" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">VOLUNTEER</text>
  </g>
</svg>
