<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 11 — Panel 1: Squad emerges from alley into courtyard, wreckage visible far wall</title>
  <desc>Wide low angle 24mm emerging from alley into courtyard — brick canyon walls rising three sides, strip grey sky above. Cracked flagstones with weeds pushing through gaps as head-high grass at fairy scale. Rain eased to drizzle. Far wall: dark angular wreckage half-buried under debris. Squad walks loose formation: Sable leads stride shorter, Wren pulled ahead drawn to wreckage, Jink walks instead of flies, Thresh rear scanning back. CAPTION one city block, one hour, brought to edge by house cat and rain puddle.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p11p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p11p1flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p11p1wreckage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p11p1weeds" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8848"/>
      <stop offset="100%" stop-color="#1a3008"/>
    </linearGradient>
    <linearGradient id="p11p1silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p11p1copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p11p1rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p11p1sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p11p1emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <filter id="p11p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p11p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Strip of grey sky upper. -->
  <rect width="742" height="80" fill="url(#p11p1sky)"/>

  <!-- Light drizzle. -->
  <g stroke="#a8b8c8" stroke-width="0.4" opacity="0.55">
    <line x1="60" y1="20" x2="58" y2="50"/>
    <line x1="180" y1="10" x2="178" y2="40"/>
    <line x1="300" y1="25" x2="298" y2="55"/>
    <line x1="420" y1="15" x2="418" y2="45"/>
    <line x1="540" y1="30" x2="538" y2="60"/>
    <line x1="660" y1="20" x2="658" y2="50"/>
  </g>

  <!-- BRICK WALLS — three sides of canyon. -->
  <!-- Left wall. -->
  <rect x="0" y="80" width="80" height="220" fill="url(#p11p1brick)" stroke="#080404" stroke-width="0.85"/>
  <!-- Brick courses. -->
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="100" x2="80" y2="100"/>
    <line x1="0" y1="120" x2="80" y2="120"/>
    <line x1="0" y1="140" x2="80" y2="140"/>
    <line x1="0" y1="160" x2="80" y2="160"/>
    <line x1="0" y1="180" x2="80" y2="180"/>
    <line x1="0" y1="200" x2="80" y2="200"/>
    <line x1="0" y1="220" x2="80" y2="220"/>
    <line x1="0" y1="240" x2="80" y2="240"/>
    <line x1="0" y1="260" x2="80" y2="260"/>
    <line x1="0" y1="280" x2="80" y2="280"/>
  </g>

  <!-- Right wall. -->
  <rect x="662" y="80" width="80" height="220" fill="url(#p11p1brick)" stroke="#080404" stroke-width="0.85"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="662" y1="100" x2="742" y2="100"/>
    <line x1="662" y1="120" x2="742" y2="120"/>
    <line x1="662" y1="140" x2="742" y2="140"/>
    <line x1="662" y1="160" x2="742" y2="160"/>
    <line x1="662" y1="180" x2="742" y2="180"/>
    <line x1="662" y1="200" x2="742" y2="200"/>
    <line x1="662" y1="220" x2="742" y2="220"/>
    <line x1="662" y1="240" x2="742" y2="240"/>
    <line x1="662" y1="260" x2="742" y2="260"/>
    <line x1="662" y1="280" x2="742" y2="280"/>
  </g>

  <!-- Far wall (back). -->
  <rect x="80" y="80" width="582" height="180" fill="url(#p11p1brick)" stroke="#080404" stroke-width="0.7"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="80" y1="100" x2="662" y2="100"/>
    <line x1="80" y1="120" x2="662" y2="120"/>
    <line x1="80" y1="140" x2="662" y2="140"/>
    <line x1="80" y1="160" x2="662" y2="160"/>
    <line x1="80" y1="180" x2="662" y2="180"/>
    <line x1="80" y1="200" x2="662" y2="200"/>
    <line x1="80" y1="220" x2="662" y2="220"/>
    <line x1="80" y1="240" x2="662" y2="240"/>
  </g>

  <!-- ALLEY OPENING (left) — squad emerges from here. -->
  <rect x="20" y="180" width="60" height="120" fill="#080404" stroke="#1a0808" stroke-width="0.7"/>
  <ellipse cx="50" cy="200" rx="22" ry="40" fill="#1a0808" opacity="0.85"/>

  <!-- WRECKAGE — far wall, left of center, half-buried. -->
  <g id="p11p1-wreckage">
    <!-- Main hull silhouette. -->
    <path d="M280,260 L300,200 L340,180 L420,178 L470,194 L510,220 L520,240 L515,260 Z" fill="url(#p11p1wreckage)" stroke="#080404" stroke-width="0.85"/>
    <!-- Sharp panel angles. -->
    <line x1="320" y1="200" x2="340" y2="220" stroke="#080404" stroke-width="0.5"/>
    <line x1="420" y1="178" x2="400" y2="200" stroke="#080404" stroke-width="0.5"/>
    <line x1="450" y1="190" x2="470" y2="220" stroke="#080404" stroke-width="0.5"/>
    <line x1="380" y1="200" x2="420" y2="220" stroke="#080404" stroke-width="0.5"/>
    <!-- Hull breach. -->
    <path d="M380,210 L400,235 L420,225 Z" fill="#080404" stroke="#1a0808" stroke-width="0.4"/>
    <!-- Etched holographic channels (dead, no glow). -->
    <g stroke="#1a0808" stroke-width="0.4" fill="none" opacity="0.85">
      <path d="M310,210 L330,210 L340,220 L350,220"/>
      <path d="M380,195 L400,195 L410,205"/>
      <path d="M440,200 L460,200 L470,210"/>
    </g>

    <!-- DEBRIS — newspaper, leaves, canvas. -->
    <!-- Newspaper drift. -->
    <g fill="#a89868" opacity="0.85">
      <polygon points="270,256 290,250 295,262 280,266" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="350,260 380,254 388,266 360,268" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="490,258 515,254 520,265 498,266" stroke="#5a4a30" stroke-width="0.3"/>
    </g>
    <!-- Newspaper text rendered as faint lines. -->
    <g stroke="#5a4a30" stroke-width="0.3" opacity="0.65">
      <line x1="275" y1="258" x2="290" y2="256"/>
      <line x1="356" y1="260" x2="380" y2="258"/>
      <line x1="496" y1="260" x2="515" y2="258"/>
    </g>
    <!-- Dead leaves. -->
    <g fill="#5a3018" opacity="0.85">
      <ellipse cx="320" cy="262" rx="5" ry="2" transform="rotate(20 320 262)"/>
      <ellipse cx="430" cy="262" rx="5" ry="2" transform="rotate(-15 430 262)"/>
      <ellipse cx="475" cy="263" rx="4" ry="2" transform="rotate(30 475 263)"/>
    </g>
    <!-- Canvas scrap. -->
    <path d="M390,255 L470,255 L468,266 L388,265 Z" fill="#3a2818" opacity="0.85" stroke="#1a0808" stroke-width="0.3"/>
  </g>

  <!-- COURTYARD FLAGSTONES (cracked, weedy). -->
  <g id="p11p1-flagstones">
    <rect x="80" y="260" width="582" height="80" fill="url(#p11p1flag)" stroke="#1a1a20" stroke-width="0.85"/>
    <!-- Flagstone seams. -->
    <line x1="180" y1="260" x2="180" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
    <line x1="280" y1="260" x2="280" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
    <line x1="380" y1="260" x2="380" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
    <line x1="480" y1="260" x2="480" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
    <line x1="580" y1="260" x2="580" y2="340" stroke="#1a1a20" stroke-width="1.4"/>
    <!-- Cracks. -->
    <g stroke="#1a1a20" stroke-width="0.7" opacity="0.85">
      <path d="M120,260 L130,290 L125,320 L140,340"/>
      <path d="M220,260 L235,300 L228,340"/>
      <path d="M330,260 L342,295 L338,330"/>
      <path d="M440,260 L455,310 L450,340"/>
      <path d="M540,260 L555,295 L550,335"/>
      <path d="M620,260 L635,300 L630,340"/>
    </g>
    <!-- Flagstone wet sheen. -->
    <g fill="#a8b0bc" opacity="0.45" filter="url(#p11p1bloom)">
      <ellipse cx="140" cy="280" rx="40" ry="2"/>
      <ellipse cx="240" cy="280" rx="40" ry="2"/>
      <ellipse cx="340" cy="280" rx="40" ry="2"/>
      <ellipse cx="440" cy="280" rx="40" ry="2"/>
      <ellipse cx="540" cy="280" rx="40" ry="2"/>
      <ellipse cx="620" cy="280" rx="40" ry="2"/>
    </g>
  </g>

  <!-- WEEDS pushing through cracks (head-high grass at fairy scale). -->
  <g id="p11p1-weeds">
    <!-- Tall weed clumps. -->
    <g stroke="#5a8848" stroke-width="1" fill="none" opacity="0.85">
      <path d="M125,330 L122,300 L128,295 L130,280"/>
      <path d="M127,335 L130,310"/>
      <path d="M229,335 L228,295 L235,290 L233,275"/>
      <path d="M232,335 L236,310"/>
      <path d="M338,335 L338,300 L344,295"/>
      <path d="M340,335 L344,310"/>
      <path d="M445,335 L450,300 L455,290 L452,275"/>
      <path d="M448,338 L455,308"/>
      <path d="M548,335 L555,295 L560,280"/>
      <path d="M552,338 L558,310"/>
      <path d="M625,338 L630,300 L632,290"/>
    </g>
    <!-- Leaf shapes on weeds. -->
    <g fill="url(#p11p1weeds)" opacity="0.85">
      <ellipse cx="130" cy="280" rx="3" ry="1.4" transform="rotate(60 130 280)"/>
      <ellipse cx="234" cy="278" rx="3.5" ry="1.4" transform="rotate(50 234 278)"/>
      <ellipse cx="345" cy="285" rx="3" ry="1.4" transform="rotate(70 345 285)"/>
      <ellipse cx="453" cy="278" rx="3.5" ry="1.4" transform="rotate(45 453 278)"/>
      <ellipse cx="558" cy="282" rx="3" ry="1.4" transform="rotate(60 558 282)"/>
    </g>
  </g>

  <!-- 5 SQUAD MEMBERS in loose formation walking toward wreckage. -->
  <!-- WREN pulled ahead — closer to wreckage (left of center, walking right). -->
  <g id="p11p1-wren" transform="translate(280, 285)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p11p1copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f0a868" opacity="0.65" filter="url(#p11p1bloom)"/>
    <g fill="#1a0808" opacity="0.85"><ellipse cx="-12" cy="6" rx="2.5" ry="1.4"/><ellipse cx="12" cy="8" rx="2.5" ry="1.4"/></g>
    <g fill="#3a2010" opacity="0.85"><ellipse cx="-5" cy="0" rx="3" ry="1.4"/><ellipse cx="6" cy="14" rx="3" ry="1.4"/></g>
    <ellipse cx="2" cy="-37" rx="9" ry="10" fill="#e0c098"/>
    <ellipse cx="-1" cy="-46" rx="6" ry="4" fill="#1a0808"/>
    <line x1="-3" y1="-48" x2="2" y2="-45" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="2" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="8" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- SABLE second front. -->
  <g id="p11p1-sable" transform="translate(220, 290)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p11p1silverDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M9,-12 L14,-3 L16,10 L14,20" fill="url(#p11p1silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p11p1bloom)"><path d="M11,-5 L14,5 L13,15"/></g>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#dce4f0" opacity="0.45" filter="url(#p11p1bloom)"/>
    <g fill="#3a2818" opacity="0.85"><ellipse cx="-5" cy="10" rx="3" ry="1.4"/><ellipse cx="6" cy="20" rx="3" ry="1.4"/></g>
    <ellipse cx="2" cy="-37" rx="9" ry="10" fill="#3a2818"/>
    <path d="M-7,-44 Q2,-49 11,-44 L11,-37 L-7,-37 Z" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="6" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- LUMA mid-formation. -->
  <g id="p11p1-luma" transform="translate(170, 295)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p11p1sapphireDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#a878f8" opacity="0.65" filter="url(#p11p1bloom)"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#a87850"/>
    <path d="M-7,-32 Q-13,-22 -12,-10 Q-11,2 -13,12" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <line x1="-9" y1="-28" x2="-12" y2="10" stroke="#a878f8" stroke-width="0.4" opacity="0.85" filter="url(#p11p1bloom)"/>
    <ellipse cx="3" cy="-37" rx="3.5" ry="2.5" fill="#a878f8" opacity="0.55" stroke="#a878f8" stroke-width="0.4"/>
    <line x1="3" y1="-37" x2="6" y2="-35" stroke="#dce4f0" stroke-width="0.3" opacity="0.85"/>
    <ellipse cx="0" cy="-38" rx="1.2" ry="0.9" fill="#dce4f0"/>
    <ellipse cx="0" cy="-38" rx="0.6" ry="0.6" fill="#1a0808"/>
    <line x1="-2" y1="-30" x2="3" y2="-30" stroke="#3a1810" stroke-width="0.5"/>
  </g>

  <!-- JINK walking instead of flying. -->
  <g id="p11p1-jink" transform="translate(125, 298)">
    <!-- Wings folded behind. -->
    <ellipse cx="-8" cy="-12" rx="10" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(45 -8 -12)" filter="url(#p11p1bloom)"/>
    <ellipse cx="8" cy="-12" rx="10" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(-45 8 -12)" filter="url(#p11p1bloom)"/>
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p11p1emeraldDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#7af0b0" opacity="0.55" filter="url(#p11p1bloom)"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8b890"/>
    <path d="M-9,-44 Q0,-50 9,-44 L9,-37 L-9,-37 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-4" cy="-46" r="1.2"/><circle cx="0" cy="-48" r="1.2"/><circle cx="4" cy="-46" r="1.2"/></g>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- THRESH rear, looking back. -->
  <g id="p11p1-thresh" transform="translate(95, 305)">
    <path d="M-11,28 L-13,5 L-11,-15 L-5,-25 L5,-25 L11,-15 L13,5 L11,28 Z" fill="url(#p11p1rubyDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M-11,-13 L-18,-3 L-18,12 L-11,18" fill="url(#p11p1rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-15,2 Q-13,8 -12,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f54848" opacity="0.65" filter="url(#p11p1bloom)"/>
    <g fill="#3a1010" opacity="0.85"><ellipse cx="-5" cy="10" rx="3" ry="1.4"/><ellipse cx="6" cy="20" rx="3" ry="1.4"/></g>
    <!-- Weapon slung back, scanning. -->
    <line x1="-12" y1="-22" x2="14" y2="20" stroke="#1a0810" stroke-width="3"/>
    <!-- Head turned LEFT (looking back). -->
    <ellipse cx="-2" cy="-37" rx="9" ry="10" fill="#d8a880"/>
    <path d="M-11,-44 Q-2,-49 7,-44 L7,-37 L-11,-37 Z" fill="#a83a18"/>
    <ellipse cx="-6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-7" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="-1" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-7" y1="-31" x2="0" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- CAPTION. -->
  <g id="p11p1-caption">
    <rect x="14" y="14" width="380" height="62" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">One city block. One hour. Five who could fight wars in the</text>
    <text x="24" y="71" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">thirty-second century — brought to the edge by a house cat.</text>
  </g>

  <!-- Meta. -->
  <g id="p11p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">ARRIVAL</text>
  </g>
</svg>
