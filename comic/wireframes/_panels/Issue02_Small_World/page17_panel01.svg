<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 17 — Panel 1: Base from above, Jink's perspective, foxhole composition</title>
  <desc>MW 28mm slightly elevated angle looking down into Victorian wall cavity at fairy scale — Jink's perspective from above. Full base layout: timber joist floor salvaged equipment arranged zones medical station engineering work area against rough brick wall. Warm amber power cell glows center small hearth. Blue-white holographic perimeter lines trace entrance gap background. 5 figures: Sable paces silver, Thresh sits watch ruby weapon across knees static tension, Wren works copper at brick wall absorbed, Luma organises medical sapphire-violet methodical. Reads as both shelter and trap. Warm amber island surrounded cool blue-white border deep shadow. SABLE status check / LUMA injuries inventory / SABLE weapons / THRESH sidearm pulse rifle Jink blade arsenal.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p1dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p17p1joist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p17p1plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89870"/>
      <stop offset="100%" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="p17p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <radialGradient id="p17p1amberHearth">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p17p1bluePerim">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p17p1silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p17p1copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p17p1rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82030"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p17p1sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <filter id="p17p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p17p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p17p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark cavity. -->
  <rect width="742" height="340" fill="url(#p17p1dark)"/>

  <!-- LATH-AND-PLASTER WALL background (left strip — looking down so receding to top). -->
  <rect x="0" y="0" width="100" height="340" fill="url(#p17p1plaster)" opacity="0.85"/>
  <g stroke="#1a0808" stroke-width="0.6" opacity="0.85">
    <line x1="0" y1="20" x2="100" y2="20"/>
    <line x1="0" y1="40" x2="100" y2="40"/>
    <line x1="0" y1="60" x2="100" y2="60"/>
    <line x1="0" y1="80" x2="100" y2="80"/>
    <line x1="0" y1="100" x2="100" y2="100"/>
    <line x1="0" y1="120" x2="100" y2="120"/>
    <line x1="0" y1="140" x2="100" y2="140"/>
    <line x1="0" y1="160" x2="100" y2="160"/>
    <line x1="0" y1="180" x2="100" y2="180"/>
    <line x1="0" y1="200" x2="100" y2="200"/>
    <line x1="0" y1="220" x2="100" y2="220"/>
    <line x1="0" y1="240" x2="100" y2="240"/>
    <line x1="0" y1="260" x2="100" y2="260"/>
    <line x1="0" y1="280" x2="100" y2="280"/>
    <line x1="0" y1="300" x2="100" y2="300"/>
    <line x1="0" y1="320" x2="100" y2="320"/>
  </g>

  <!-- BRICK WALL background (right strip). -->
  <rect x="642" y="0" width="100" height="340" fill="url(#p17p1brick)"/>
  <g stroke="#080404" stroke-width="0.5" opacity="0.85">
    <line x1="642" y1="40" x2="742" y2="40"/>
    <line x1="642" y1="80" x2="742" y2="80"/>
    <line x1="642" y1="120" x2="742" y2="120"/>
    <line x1="642" y1="160" x2="742" y2="160"/>
    <line x1="642" y1="200" x2="742" y2="200"/>
    <line x1="642" y1="240" x2="742" y2="240"/>
    <line x1="642" y1="280" x2="742" y2="280"/>
    <line x1="642" y1="320" x2="742" y2="320"/>
  </g>

  <!-- ENTRANCE GAP (right) with blue perimeter. -->
  <path d="M642,80 L700,75 L702,200 L642,210 Z" fill="#5a606a" opacity="0.85"/>
  <ellipse cx="670" cy="140" rx="100" ry="120" fill="url(#p17p1bluePerim)" filter="url(#p17p1deepBloom)" opacity="0.85"/>
  <g stroke="#a8d8f8" stroke-width="0.7" fill="none" opacity="0.95" filter="url(#p17p1bloom)">
    <path d="M642,80 L700,75"/>
    <path d="M642,210 L702,200"/>
    <path d="M642,80 L642,210"/>
    <path d="M700,75 L702,200"/>
    <path d="M642,140 L702,140"/>
  </g>
  <g fill="#dce4f0" opacity="0.95" filter="url(#p17p1bloom)">
    <circle cx="642" cy="82" r="0.85"/>
    <circle cx="700" cy="77" r="0.85"/>
    <circle cx="642" cy="208" r="0.85"/>
    <circle cx="702" cy="198" r="0.85"/>
  </g>

  <!-- TIMBER STUDS framing left/right. -->
  <rect x="100" y="0" width="30" height="340" fill="url(#p17p1joist)" stroke="#080404" stroke-width="0.85"/>
  <rect x="612" y="0" width="30" height="340" fill="url(#p17p1joist)" stroke="#080404" stroke-width="0.85"/>

  <!-- TIMBER JOIST FLOOR (broad floor across mid-bottom — overhead view angle). -->
  <rect x="130" y="220" width="482" height="120" fill="url(#p17p1joist)" stroke="#080404" stroke-width="0.85"/>
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.85">
    <line x1="130" y1="240" x2="612" y2="240"/>
    <line x1="130" y1="270" x2="612" y2="270"/>
    <line x1="130" y1="300" x2="612" y2="300"/>
    <line x1="130" y1="330" x2="612" y2="330"/>
  </g>

  <!-- AMBER HEARTH at center. -->
  <ellipse cx="371" cy="280" rx="280" ry="80" fill="url(#p17p1amberHearth)" filter="url(#p17p1deepBloom)" opacity="0.95"/>
  <!-- Power cell at center. -->
  <g transform="translate(371, 280)">
    <path d="M-10,0 L-7,-7 L0,-10 L7,-7 L10,0 L7,7 L0,10 L-7,7 Z" fill="#3a3a44" stroke="#080404" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffe8a0" opacity="0.95" filter="url(#p17p1bloom)"/>
  </g>

  <!-- EQUIPMENT zones laid out. -->
  <!-- Triage area (component fragments). -->
  <g fill="#1a1a20" stroke="#080404" stroke-width="0.5">
    <rect x="160" y="245" width="36" height="14" rx="1"/>
    <rect x="200" y="247" width="36" height="14" rx="1"/>
    <rect x="240" y="245" width="36" height="14" rx="1"/>
  </g>
  <g fill="#5a606a" opacity="0.85" filter="url(#p17p1bloom)">
    <ellipse cx="178" cy="247" rx="14" ry="1"/>
    <ellipse cx="218" cy="249" rx="14" ry="1"/>
    <ellipse cx="258" cy="247" rx="14" ry="1"/>
  </g>

  <!-- Medical kit (Luma's zone). -->
  <g fill="#3a3a44" stroke="#080404" stroke-width="0.5">
    <rect x="450" y="245" width="40" height="14" rx="1"/>
  </g>
  <ellipse cx="470" cy="250" rx="8" ry="2" fill="#a878f8" opacity="0.65" filter="url(#p17p1bloom)"/>

  <!-- Engineering toolset (Wren's zone). -->
  <g fill="#5a3018" stroke="#080404" stroke-width="0.5">
    <rect x="510" y="245" width="40" height="14" rx="1"/>
  </g>
  <g fill="#f0d878" opacity="0.85" filter="url(#p17p1bloom)">
    <circle cx="520" cy="252" r="1.4"/>
    <circle cx="528" cy="252" r="1.4"/>
    <circle cx="536" cy="252" r="1.4"/>
    <circle cx="544" cy="252" r="1.4"/>
  </g>

  <!-- 5 SQUAD MEMBERS visible from above. -->
  <!-- SABLE pacing (mid-frame, 3 strides). -->
  <g id="p17p1-sable" transform="translate(330, 290)">
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#p17p1silverDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#3a2818"/>
    <ellipse cx="-2" cy="-15" rx="3" ry="1.5" fill="#dce4f0"/>
    <!-- Slight movement blur. -->
    <ellipse cx="-8" cy="0" rx="3" ry="10" fill="url(#p17p1silverDirty)" opacity="0.45" filter="url(#p17p1bloom)"/>
    <!-- Cracked shoulder hint. -->
    <line x1="3" y1="-6" x2="5" y2="0" stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p17p1bloom)"/>
  </g>

  <!-- THRESH sitting watch (right near entrance). -->
  <g id="p17p1-thresh" transform="translate(580, 290)">
    <ellipse cx="0" cy="0" rx="7" ry="14" fill="url(#p17p1rubyDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#d8a880"/>
    <path d="M-3,-15 Q0,-17 3,-15 L3,-12 L-3,-12 Z" fill="#a83a18"/>
    <!-- Weapon across knees. -->
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#1a0810" stroke-width="2"/>
    <!-- Dent on left pauldron. -->
    <ellipse cx="-5" cy="-3" rx="1.4" ry="0.85" fill="#3a0810"/>
    <!-- Cool blue cast. -->
    <ellipse cx="0" cy="0" rx="9" ry="14" fill="#a8d8f8" opacity="0.25" filter="url(#p17p1strongBloom)"/>
  </g>

  <!-- WREN at brick wall right (working). -->
  <g id="p17p1-wren" transform="translate(540, 280)">
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#p17p1copperDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#e0c098"/>
    <ellipse cx="-1" cy="-15" rx="3" ry="1.5" fill="#1a0808"/>
    <!-- Copper hex orbit. -->
    <g stroke="#f0d878" stroke-width="0.4" fill="none" opacity="0.85" filter="url(#p17p1bloom)">
      <circle cx="0" cy="-2" r="6"/>
    </g>
  </g>

  <!-- LUMA organising medical (left mid). -->
  <g id="p17p1-luma" transform="translate(440, 290)">
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#p17p1sapphireDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#a87850"/>
    <path d="M-3,-10 Q-7,-2 -7,8" stroke="#1a0808" stroke-width="2" fill="none"/>
    <ellipse cx="2" cy="-12" rx="2" ry="1.4" fill="#a878f8" opacity="0.65"/>
  </g>

  <!-- JINK on lath above (visible at upper-left edge of frame, looking down). -->
  <g id="p17p1-jink" transform="translate(180, 60)">
    <ellipse cx="0" cy="0" rx="5" ry="10" fill="#3aa078"/>
    <circle cx="0" cy="-8" r="3" fill="#d8b890"/>
    <path d="M-2,-10 Q0,-12 2,-10 L2,-8 L-2,-8 Z" fill="#f0d878"/>
    <ellipse cx="0" cy="-3" rx="6" ry="2" fill="#7af0b0" opacity="0.55" filter="url(#p17p1bloom)"/>
  </g>

  <!-- DIALOGUE STACK -->
  <g id="p17p1-bal-sable1">
    <rect x="14" y="14" width="180" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Status check. Injuries first.</text>
  </g>

  <g id="p17p1-bal-luma">
    <rect x="14" y="62" width="350" height="80" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="98" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Thresh — bone bruise on the left forearm.</text>
    <text x="24" y="115" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Jink — laceration on the right palm,</text>
    <text x="24" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">superficial. Contusions all around. Nothing disabling.</text>
  </g>

  <g id="p17p1-bal-sable2">
    <rect x="380" y="14" width="160" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="390" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="390" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Weapons?</text>
  </g>

  <g id="p17p1-bal-thresh">
    <rect x="380" y="62" width="350" height="80" rx="8" fill="#ffffff" stroke="#dc2030" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="390" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#dc2030" letter-spacing="0.3">THRESH</text>
    <text x="390" y="98" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">My sidearm and the pulse rifle.</text>
    <text x="390" y="115" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Full charge on both. Jink has a blade.</text>
    <text x="390" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">That is our arsenal.</text>
  </g>

  <!-- Meta. -->
  <g id="p17p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">FOXHOLE FROM ABOVE</text>
  </g>
</svg>
