<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 10 — Panel 3: Round puddle, rain intensifies, degradation accumulates</title>
  <desc>MS 50mm low angle. Squad rounds puddle pressed against raised flagstone lip 6in ridge minimal shelter. Sable leads hand trailing edge balance. Rain intensifies — drops larger, percussive splash spray across path. Wren shields face arm copper suit streaming, mud-streaked rain-soaked scuffed cat encounter. Suits degraded from pristine — water-logged but holo accents glow faintly through grime. Thresh weapon slung back accepted move not fight. WREN shouting alley mouth how far / JINK fifteen feet overhang doorstep.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e34"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p10p3flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#2a2e34"/>
    </linearGradient>
    <linearGradient id="p10p3silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p10p3copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p10p3rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <filter id="p10p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p10p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG (darker — rain intensifies). -->
  <rect width="366" height="160" fill="url(#p10p3sky)"/>

  <!-- HEAVY RAIN diagonal slashing. -->
  <g stroke="#a8b8c8" stroke-width="0.85" opacity="0.85" filter="url(#p10p3bloom)">
    <line x1="40" y1="20" x2="55" y2="65"/>
    <line x1="80" y1="10" x2="98" y2="55"/>
    <line x1="120" y1="25" x2="138" y2="70"/>
    <line x1="160" y1="15" x2="178" y2="55"/>
    <line x1="200" y1="30" x2="218" y2="75"/>
    <line x1="240" y1="20" x2="258" y2="60"/>
    <line x1="280" y1="35" x2="298" y2="78"/>
    <line x1="320" y1="20" x2="338" y2="60"/>
    <line x1="60" y1="80" x2="80" y2="125"/>
    <line x1="140" y1="90" x2="160" y2="135"/>
    <line x1="220" y1="85" x2="240" y2="130"/>
    <line x1="300" y1="95" x2="320" y2="138"/>
    <line x1="40" y1="170" x2="60" y2="215"/>
    <line x1="180" y1="180" x2="200" y2="225"/>
    <line x1="320" y1="175" x2="340" y2="220"/>
    <line x1="100" y1="240" x2="120" y2="285"/>
    <line x1="260" y1="250" x2="280" y2="295"/>
  </g>

  <!-- FLAGSTONE LIP — raised ridge running diagonally. -->
  <g id="p10p3-lip">
    <path d="M-10,200 L380,180 L380,220 L-10,240 Z" fill="url(#p10p3flag)" stroke="#1a1a20" stroke-width="0.85"/>
    <line x1="-10" y1="200" x2="380" y2="180" stroke="#080810" stroke-width="1.2"/>
    <!-- Wet streaming sheen. -->
    <g fill="#a8b0bc" opacity="0.65" filter="url(#p10p3bloom)">
      <ellipse cx="100" cy="195" rx="60" ry="2"/>
      <ellipse cx="280" cy="190" rx="60" ry="2"/>
    </g>
  </g>

  <!-- FLAGSTONE GROUND beyond/below the lip. -->
  <g fill="url(#p10p3flag)" stroke="#1a1a20" stroke-width="0.7">
    <rect x="-10" y="240" width="200" height="80" rx="3"/>
    <rect x="194" y="240" width="186" height="80" rx="3"/>
  </g>

  <!-- SPLASH BURSTS — percussive. -->
  <g stroke="#dce4f0" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#p10p3bloom)">
    <circle cx="50" cy="252" r="8"/>
    <circle cx="50" cy="252" r="14"/>
    <line x1="50" y1="244" x2="50" y2="240"/>
    <line x1="44" y1="248" x2="40" y2="244"/>
    <line x1="56" y1="248" x2="60" y2="244"/>
    <circle cx="200" cy="270" r="9"/>
    <circle cx="200" cy="270" r="14"/>
    <line x1="200" y1="262" x2="200" y2="256"/>
    <circle cx="320" cy="260" r="8"/>
    <circle cx="320" cy="260" r="14"/>
    <line x1="320" y1="252" x2="320" y2="248"/>
  </g>

  <!-- 3 FIGURES along ridge — Sable lead, Wren mid shielding face, Thresh trail behind. -->

  <!-- SABLE — front-right, leading. -->
  <g id="p10p3-sable" transform="translate(280, 175)">
    <path d="M-10,30 L-13,5 L-10,-15 L-5,-25 L5,-25 L10,-15 L13,5 L10,30 Z" fill="url(#p10p3silverDirty)" stroke="#080404" stroke-width="0.6"/>
    <!-- CRACKED right shoulder. -->
    <path d="M10,-12 L16,-2 L18,12 L16,22" fill="url(#p10p3silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p10p3bloom)"><path d="M12,-5 L16,5 L14,15"/></g>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#dce4f0" opacity="0.45" filter="url(#p10p3bloom)"/>
    <!-- Mud streaks on suit (degradation). -->
    <g fill="#3a2818" opacity="0.85">
      <ellipse cx="-5" cy="10" rx="4" ry="2" transform="rotate(-15 -5 10)"/>
      <ellipse cx="6" cy="20" rx="3" ry="1.5" transform="rotate(20 6 20)"/>
      <ellipse cx="-8" cy="-5" rx="3" ry="1.5"/>
    </g>
    <!-- Trailing arm hand on lip edge for balance. -->
    <path d="M-12,5 L-25,18 L-22,24 L-10,15 Z" fill="url(#p10p3silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="-25" cy="22" rx="4" ry="2.5" fill="#3a2818" stroke="#080404" stroke-width="0.4"/>
    <!-- Head forward. -->
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#3a2818"/>
    <path d="M-9,-44 Q0,-49 9,-44 L9,-37 L-9,-37 Z" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- WREN — middle, shielding face. -->
  <g id="p10p3-wren" transform="translate(180, 185)">
    <path d="M-9,28 L-12,5 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,5 L9,28 Z" fill="url(#p10p3copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f0a868" opacity="0.45" filter="url(#p10p3bloom)"/>
    <!-- Heavy oil-stained forearms (worsened). -->
    <g fill="#1a0808" opacity="0.85">
      <ellipse cx="-12" cy="6" rx="3" ry="1.4"/>
      <ellipse cx="-9" cy="14" rx="3" ry="1.2"/>
      <ellipse cx="12" cy="8" rx="3" ry="1.4"/>
      <ellipse cx="9" cy="16" rx="3" ry="1.2"/>
    </g>
    <!-- Mud streaks on suit. -->
    <g fill="#3a2010" opacity="0.85">
      <ellipse cx="-5" cy="0" rx="3" ry="1.5" transform="rotate(-25 -5 0)"/>
      <ellipse cx="6" cy="14" rx="3" ry="1.5" transform="rotate(15 6 14)"/>
    </g>
    <!-- ARM RAISED shielding face. -->
    <path d="M-8,-15 L-25,-30 L-22,-26 L-7,-12 Z" fill="url(#p10p3copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="-25" cy="-30" rx="5" ry="3" fill="url(#p10p3copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <!-- Other arm down. -->
    <path d="M9,-8 L20,0 L18,5 L7,-3 Z" fill="url(#p10p3copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <!-- Water streaming off arm raised. -->
    <g stroke="#a8b8c8" stroke-width="0.6" opacity="0.85" filter="url(#p10p3bloom)">
      <line x1="-22" y1="-25" x2="-26" y2="-15"/>
      <line x1="-18" y1="-22" x2="-22" y2="-12"/>
    </g>
    <!-- Head — partially hidden behind raised arm. -->
    <ellipse cx="2" cy="-37" rx="9" ry="10" fill="#e0c098" opacity="0.95"/>
    <ellipse cx="-1" cy="-46" rx="6" ry="4" fill="#1a0808"/>
    <line x1="-3" y1="-48" x2="2" y2="-45" stroke="#3a1808" stroke-width="0.4"/>
    <!-- One eye visible (other behind arm). -->
    <ellipse cx="3" cy="-39" rx="1.2" ry="0.9" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="0.6" ry="0.6" fill="#1a0808"/>
    <!-- Set jaw. -->
    <line x1="0" y1="-30" x2="6" y2="-30" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- THRESH — back-left, weapon SLUNG ACROSS BACK. -->
  <g id="p10p3-thresh" transform="translate(80, 200)">
    <path d="M-11,28 L-13,5 L-11,-15 L-5,-25 L5,-25 L11,-15 L13,5 L11,28 Z" fill="url(#p10p3rubyDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M-11,-13 L-18,-3 L-18,12 L-11,18" fill="url(#p10p3rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-15,2 Q-13,8 -12,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f54848" opacity="0.65" filter="url(#p10p3bloom)"/>
    <!-- WEAPON SLUNG ACROSS BACK (diagonal). -->
    <line x1="-12" y1="-22" x2="14" y2="20" stroke="#080404" stroke-width="0.6"/>
    <rect x="-13" y="-22" width="32" height="6" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4" transform="rotate(45 0 -22) translate(0 12)"/>
    <!-- Mud streaks. -->
    <g fill="#3a2818" opacity="0.85">
      <ellipse cx="-5" cy="10" rx="3" ry="1.4" transform="rotate(20 -5 10)"/>
      <ellipse cx="7" cy="0" rx="2.5" ry="1.4"/>
    </g>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8a880"/>
    <path d="M-9,-44 Q0,-49 9,-44 L9,-37 L-9,-37 Z" fill="#a83a18"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- DIALOGUE — WREN shouting (jagged border for emphasis would help; using thicker stroke). -->
  <g id="p10p3-bal-wren">
    <rect x="14" y="14" width="220" height="46" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2.5" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="68" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a4a30">(over rain)</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Alley mouth — how far?!</text>
  </g>

  <!-- JINK from above. -->
  <g id="p10p3-bal-jink">
    <rect x="14" y="244" width="220" height="60" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-dasharray="4,3" filter="url(#balloonShadow)"/>
    <text x="24" y="262" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK (O.P.)</text>
    <text x="24" y="282" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Fifteen feet. There's cover</text>
    <text x="24" y="299" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">— a doorstep overhang.</text>
  </g>

  <!-- Meta. -->
  <g id="p10p3-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">3</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">DEGRADATION</text>
  </g>
</svg>
