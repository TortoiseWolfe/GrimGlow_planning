<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 22 — Panel 1: Victorian pub interior, Hobday tells story, four men listening</title>
  <desc>MW 35mm eye level. Small Victorian pub interior — dark wood brass fittings bar pewter tankards along one side cast-iron fireplace crackling other. Gaslight wall brackets tobacco smoke layered air. Small round tables working-class men waistcoats flat caps coats nursing pints mild ale. Near fireplace Hobday late 40s weathered flat cap pushed back heavy dark coat sits with three companions around small table mid-story hands gesturing earnestly over untouched pint. One companion eyebrows raised slight smirk skeptical. Another grins amused. Third — older grey-haired quieter — listens without smiling hands wrapped tankard. Atmosphere thick smoke warmth conversation. All warm light gaslight amber firelight ruddy orange brass pewter gleam. NO cool light sources. HOBDAY telling lights moved Saffron Hill / SKEPTIC three hours / AMUSED will-o-wisps fairies drainpipe.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p22p1pubBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p22p1darkWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p22p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p22p1brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </linearGradient>
    <radialGradient id="p22p1firelight">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p1gaslight">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p1smoke">
      <stop offset="0%" stop-color="#a89870" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p22p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p22p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG warm pub. -->
  <rect width="742" height="340" fill="url(#p22p1pubBg)"/>

  <!-- DARK WOOD WALLS panelling. -->
  <rect x="0" y="0" width="742" height="220" fill="url(#p22p1darkWood)"/>
  <g stroke="#080404" stroke-width="0.5" opacity="0.85">
    <!-- Wood panel divisions. -->
    <line x1="120" y1="0" x2="120" y2="220"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="360" y1="0" x2="360" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <!-- Dado rail. -->
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
  </g>

  <!-- TOBACCO SMOKE haze (atmospheric). -->
  <ellipse cx="200" cy="60" rx="180" ry="40" fill="url(#p22p1smoke)" filter="url(#p22p1deepBloom)" opacity="0.65"/>
  <ellipse cx="540" cy="40" rx="200" ry="30" fill="url(#p22p1smoke)" filter="url(#p22p1deepBloom)" opacity="0.65"/>

  <!-- FIREPLACE LEFT side. -->
  <g id="p22p1-fireplace">
    <!-- Cast-iron grate frame. -->
    <rect x="20" y="120" width="120" height="100" fill="#080404" stroke="#1a0808" stroke-width="0.85"/>
    <!-- Mantel. -->
    <rect x="10" y="115" width="140" height="8" fill="#3a2010" stroke="#080404" stroke-width="0.4"/>
    <!-- Fire glow. -->
    <ellipse cx="80" cy="170" rx="60" ry="40" fill="url(#p22p1firelight)" filter="url(#p22p1deepBloom)" opacity="0.95"/>
    <!-- Flames. -->
    <g fill="#ffe8a0" filter="url(#p22p1bloom)" opacity="0.95">
      <path d="M40,210 Q42,180 50,170 Q55,180 56,200 Q60,180 64,170 Q68,180 70,200 Q73,180 80,170 Q85,180 86,205 Q90,180 95,170 Q100,180 102,200 Q105,180 110,170 Q115,180 116,210 Z"/>
    </g>
    <!-- Inner glowing coals. -->
    <g fill="#ffd060" opacity="0.85" filter="url(#p22p1bloom)">
      <ellipse cx="50" cy="200" rx="6" ry="3"/>
      <ellipse cx="80" cy="200" rx="8" ry="3"/>
      <ellipse cx="110" cy="200" rx="6" ry="3"/>
    </g>
    <!-- Iron bars on grate. -->
    <g stroke="#080404" stroke-width="1">
      <line x1="35" y1="120" x2="35" y2="220"/>
      <line x1="55" y1="120" x2="55" y2="220"/>
      <line x1="75" y1="120" x2="75" y2="220"/>
      <line x1="95" y1="120" x2="95" y2="220"/>
      <line x1="115" y1="120" x2="115" y2="220"/>
      <line x1="125" y1="120" x2="125" y2="220"/>
    </g>
  </g>

  <!-- BAR RIGHT SIDE. -->
  <g id="p22p1-bar">
    <rect x="600" y="140" width="142" height="80" fill="url(#p22p1darkWood)" stroke="#080404" stroke-width="0.85"/>
    <!-- Brass rail along bar top. -->
    <rect x="600" y="138" width="142" height="6" fill="url(#p22p1brass)" stroke="#5a2818" stroke-width="0.4"/>
    <!-- Pewter tankards on bar. -->
    <g fill="#5a606a" stroke="#3a3a44" stroke-width="0.5">
      <ellipse cx="620" cy="142" rx="6" ry="3"/>
      <rect x="615" y="142" width="10" height="14" rx="1"/>
      <ellipse cx="650" cy="142" rx="6" ry="3"/>
      <rect x="645" y="142" width="10" height="14" rx="1"/>
      <ellipse cx="700" cy="142" rx="6" ry="3"/>
      <rect x="695" y="142" width="10" height="14" rx="1"/>
    </g>
    <!-- Tankard highlights. -->
    <g fill="#a8b0bc" opacity="0.85" filter="url(#p22p1bloom)">
      <ellipse cx="620" cy="143" rx="3" ry="0.85"/>
      <ellipse cx="650" cy="143" rx="3" ry="0.85"/>
      <ellipse cx="700" cy="143" rx="3" ry="0.85"/>
    </g>
    <!-- Bottles behind bar. -->
    <g fill="#3a1810" stroke="#1a0808" stroke-width="0.4">
      <rect x="610" y="80" width="8" height="50" rx="1"/>
      <rect x="625" y="80" width="8" height="50" rx="1"/>
      <rect x="640" y="80" width="8" height="50" rx="1"/>
    </g>
  </g>

  <!-- GAS LAMP brackets on walls (multiple amber points). -->
  <g id="p22p1-gaslamps">
    <g fill="url(#p22p1brass)" stroke="#3a1808" stroke-width="0.4">
      <rect x="180" y="60" width="6" height="20"/>
      <rect x="174" y="56" width="18" height="6"/>
    </g>
    <ellipse cx="183" cy="58" rx="20" ry="14" fill="url(#p22p1gaslight)" filter="url(#p22p1strongBloom)" opacity="0.95"/>
    <ellipse cx="183" cy="58" rx="2" ry="3" fill="#ffffff" filter="url(#p22p1bloom)" opacity="0.95"/>

    <g fill="url(#p22p1brass)" stroke="#3a1808" stroke-width="0.4">
      <rect x="380" y="60" width="6" height="20"/>
      <rect x="374" y="56" width="18" height="6"/>
    </g>
    <ellipse cx="383" cy="58" rx="20" ry="14" fill="url(#p22p1gaslight)" filter="url(#p22p1strongBloom)" opacity="0.95"/>
    <ellipse cx="383" cy="58" rx="2" ry="3" fill="#ffffff" filter="url(#p22p1bloom)" opacity="0.95"/>

    <g fill="url(#p22p1brass)" stroke="#3a1808" stroke-width="0.4">
      <rect x="540" y="60" width="6" height="20"/>
      <rect x="534" y="56" width="18" height="6"/>
    </g>
    <ellipse cx="543" cy="58" rx="20" ry="14" fill="url(#p22p1gaslight)" filter="url(#p22p1strongBloom)" opacity="0.95"/>
    <ellipse cx="543" cy="58" rx="2" ry="3" fill="#ffffff" filter="url(#p22p1bloom)" opacity="0.95"/>
  </g>

  <!-- FLOOR. -->
  <rect x="0" y="220" width="742" height="120" fill="url(#p22p1floor)"/>
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="245" x2="742" y2="245"/>
    <line x1="0" y1="280" x2="742" y2="280"/>
    <line x1="0" y1="315" x2="742" y2="315"/>
  </g>

  <!-- HOBDAY'S TABLE (center-right, near fireplace area). -->
  <g id="p22p1-table">
    <ellipse cx="320" cy="270" rx="80" ry="14" fill="#3a1810" stroke="#080404" stroke-width="0.85"/>
    <ellipse cx="320" cy="262" rx="80" ry="8" fill="#5a3018" stroke="#080404" stroke-width="0.4"/>
    <!-- Tankards on table. -->
    <g fill="#5a606a" stroke="#3a3a44" stroke-width="0.5">
      <ellipse cx="280" cy="258" rx="6" ry="2"/>
      <rect x="275" y="258" width="10" height="14" rx="1"/>
      <ellipse cx="320" cy="258" rx="6" ry="2"/>
      <rect x="315" y="258" width="10" height="14" rx="1"/>
      <ellipse cx="360" cy="258" rx="6" ry="2"/>
      <rect x="355" y="258" width="10" height="14" rx="1"/>
    </g>
    <!-- Ale meniscus highlights. -->
    <g fill="#f5b860" opacity="0.65" filter="url(#p22p1bloom)">
      <ellipse cx="280" cy="259" rx="3" ry="0.85"/>
      <ellipse cx="320" cy="259" rx="3" ry="0.85"/>
      <ellipse cx="360" cy="259" rx="3" ry="0.85"/>
    </g>
  </g>

  <!-- 4 MEN at table. -->

  <!-- HOBDAY (front-center, hands gesturing). -->
  <g id="p22p1-hobday" transform="translate(330, 240)">
    <!-- Body forward, leaning. -->
    <path d="M-15,40 L-18,5 L-15,-15 L-7,-30 L7,-30 L15,-15 L18,5 L15,40 Z" fill="#3a2818" stroke="#080404" stroke-width="0.6"/>
    <!-- ARMS gesturing forward (hands cupped/expressive). -->
    <path d="M-15,-5 L-30,5 L-32,15 L-22,18 L-13,5 Z" fill="#3a2818" stroke="#080404" stroke-width="0.5"/>
    <path d="M15,-5 L30,5 L32,15 L22,18 L13,5 Z" fill="#3a2818" stroke="#080404" stroke-width="0.5"/>
    <!-- Hands cupped. -->
    <ellipse cx="-32" cy="14" rx="4" ry="3" fill="#a87850" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="32" cy="14" rx="4" ry="3" fill="#a87850" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Head — late 40s weathered. -->
    <ellipse cx="0" cy="-40" rx="11" ry="11" fill="#a87850"/>
    <!-- Flat cap pushed back. -->
    <path d="M-12,-46 Q0,-52 12,-46 L14,-42 L-14,-42 Z" fill="#3a2818"/>
    <ellipse cx="-2" cy="-44" rx="6" ry="2" fill="#1a0808"/>
    <!-- Weathered eyes earnest. -->
    <ellipse cx="-3" cy="-42" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-42" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-42" rx="0.7" ry="0.7" fill="#3a1808"/>
    <ellipse cx="3" cy="-42" rx="0.7" ry="0.7" fill="#3a1808"/>
    <circle cx="-2" cy="-43" r="0.5" fill="#ffe8a0" opacity="0.95" filter="url(#p22p1bloom)"/>
    <!-- Mouth open speaking. -->
    <ellipse cx="0" cy="-32" rx="3" ry="1.5" fill="#3a1010"/>
    <!-- Beard stubble. -->
    <g fill="#1a0808" opacity="0.65">
      <circle cx="-7" cy="-32" r="0.5"/>
      <circle cx="-3" cy="-30" r="0.5"/>
      <circle cx="3" cy="-30" r="0.5"/>
      <circle cx="7" cy="-32" r="0.5"/>
    </g>
  </g>

  <!-- SKEPTIC (left of table, eyebrows raised, smirk). -->
  <g id="p22p1-skeptic" transform="translate(250, 250)">
    <path d="M-13,30 L-15,3 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,3 L13,30 Z" fill="#5a3018" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-37" rx="11" ry="11" fill="#d8a880"/>
    <path d="M-12,-43 Q0,-48 12,-43 L13,-39 L-13,-39 Z" fill="#3a2818"/>
    <!-- Smirking. -->
    <ellipse cx="-3" cy="-39" rx="1.4" ry="0.85" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="0.85" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.6" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.6" fill="#1a0808"/>
    <!-- Eyebrow raised. -->
    <line x1="-7" y1="-44" x2="2" y2="-46" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="2" y1="-46" x2="7" y2="-43" stroke="#1a0808" stroke-width="0.85"/>
    <!-- Smirk. -->
    <path d="M-3,-32 Q3,-29 6,-32" stroke="#1a0808" stroke-width="0.85" fill="none"/>
  </g>

  <!-- AMUSED COMPANION (right of table, grinning). -->
  <g id="p22p1-amused" transform="translate(420, 250)">
    <path d="M-13,30 L-15,3 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,3 L13,30 Z" fill="#a85820" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-37" rx="11" ry="11" fill="#a87850"/>
    <path d="M-12,-43 Q0,-48 12,-43 L13,-39 L-13,-39 Z" fill="#3a2818"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="0.7" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="0.7" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.5" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.5" fill="#1a0808"/>
    <!-- Grin (open mouth, teeth). -->
    <path d="M-5,-31 Q0,-26 5,-31 Q5,-29 0,-28 Q-5,-29 -5,-31 Z" fill="#3a0810"/>
    <g fill="#f5e8c8">
      <rect x="-3" y="-30" width="2" height="2" rx="0.4"/>
      <rect x="0" y="-30" width="2" height="2" rx="0.4"/>
    </g>
  </g>

  <!-- TOM (older, behind table, pensive). -->
  <g id="p22p1-tom" transform="translate(140, 250)">
    <path d="M-13,30 L-15,3 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,3 L13,30 Z" fill="#3a2010" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-37" rx="11" ry="11" fill="#d8a880"/>
    <!-- Bowler hat. -->
    <path d="M-13,-45 Q0,-52 13,-45 L13,-43 L-13,-43 Z" fill="#1a0808"/>
    <rect x="-13" y="-43" width="26" height="3" fill="#1a0808"/>
    <!-- Grey hair under. -->
    <path d="M-12,-42 Q-10,-40 -8,-40" stroke="#a8a8a0" stroke-width="0.5" fill="none"/>
    <path d="M8,-42 Q10,-40 12,-40" stroke="#a8a8a0" stroke-width="0.5" fill="none"/>
    <!-- Eyes downcast (looking into ale). -->
    <ellipse cx="-3" cy="-37" rx="1.2" ry="0.6" fill="#1a0808"/>
    <ellipse cx="3" cy="-37" rx="1.2" ry="0.6" fill="#1a0808"/>
    <!-- Mouth neutral. -->
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
    <!-- Hands wrapped around tankard (visible on table). -->
    <ellipse cx="0" cy="0" rx="14" ry="3" fill="#5a3018" stroke="#080404" stroke-width="0.4"/>
  </g>

  <!-- DIALOGUE -->
  <g id="p22p1-bal-hobday">
    <rect x="14" y="14" width="380" height="78" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#6a4220" letter-spacing="0.3">HOBDAY</text>
    <text x="24" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I'm telling you, I saw them. Saffron Hill,</text>
    <text x="24" y="67" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">night before last. Lights — not reflections,</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">not gas. Lights that moved.</text>
  </g>

  <g id="p22p1-bal-skeptic">
    <rect x="404" y="14" width="324" height="40" rx="8" fill="#ffffff" stroke="#5a4a30" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="414" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a4a30" letter-spacing="0.3">SKEPTIC</text>
    <text x="414" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Three hours in the pub before your round, Jack.</text>
  </g>

  <g id="p22p1-bal-amused">
    <rect x="404" y="62" width="324" height="40" rx="8" fill="#ffffff" stroke="#5a4a30" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="414" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a4a30" letter-spacing="0.3">AMUSED</text>
    <text x="414" y="96" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Will-o'-the-wisps, was it? Fairies in the drainpipe?</text>
  </g>

  <!-- Meta. -->
  <g id="p22p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">THE STORY BEGINS</text>
  </g>
</svg>
