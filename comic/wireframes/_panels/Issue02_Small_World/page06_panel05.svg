<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 420" width="366" height="420">
  <title>Issue 2 — Page 6 — Panel 5: Squad on wall — grounded contrast</title>
  <desc>MW eye level 35mm. 4 squad members on rain-soaked brick wall around drainpipe base. Thresh climbing down using mortar joints as handholds. Wren mapping route w/ hand on brick. Sable on bracket ledge, palm extended for Luma's blue-violet holographic medical scanner treating cut. Sable's eyes track Jink's distant emerald streak in grey rain BG. Rain pouring. The grounded vs the airborne contrast. LUMA: "Hold still. 10 sec." SABLE: "We do not have 10 seconds." LUMA: "You have 10. The street will wait."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p5leaden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p6p5brick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#1a1010"/>
    </linearGradient>
    <linearGradient id="p6p5silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a8b4"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p6p5copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c87a35"/>
      <stop offset="100%" stop-color="#5a3010"/>
    </linearGradient>
    <linearGradient id="p6p5ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <linearGradient id="p6p5sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#1a1058"/>
    </linearGradient>
    <radialGradient id="p6p5sapphireScanner">
      <stop offset="0%" stop-color="#a890f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p5crackBleed">
      <stop offset="0%" stop-color="#dce4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a3050" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p6p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG sky leaden grey w/ Jink's distant emerald streak. -->
  <rect width="366" height="420" fill="url(#p6p5leaden)"/>

  <!-- Rain streaks. -->
  <g stroke="#a8b8c8" stroke-width="0.5" opacity="0.55" filter="url(#p6p5bloom)">
    <line x1="60" y1="20" x2="60" y2="60"/>
    <line x1="160" y1="40" x2="160" y2="80"/>
    <line x1="260" y1="20" x2="260" y2="60"/>
    <line x1="40" y1="100" x2="40" y2="140"/>
    <line x1="320" y1="100" x2="320" y2="140"/>
  </g>

  <!-- DISTANT JINK EMERALD STREAK in BG (script-specific: faint). -->
  <g id="p6p5-jink-distant">
    <line x1="240" y1="50" x2="320" y2="100" stroke="#7af0b0" stroke-width="2.5" opacity="0.85" filter="url(#p6p5strongBloom)"/>
    <line x1="240" y1="50" x2="320" y2="100" stroke="#dce4f0" stroke-width="0.8" opacity="0.7"/>
    <!-- Tiny Jink dot. -->
    <circle cx="320" cy="100" r="2.5" fill="#7af0b0" filter="url(#p6p5bloom)"/>
    <!-- Trail particles. -->
    <g fill="#dce4f0" opacity="0.85" filter="url(#p6p5bloom)">
      <circle cx="265" cy="65" r="0.7"/>
      <circle cx="285" cy="78" r="0.6"/>
      <circle cx="305" cy="92" r="0.6"/>
    </g>
  </g>

  <!-- BRICK WALL backdrop (rain-soaked). -->
  <rect width="366" height="420" fill="url(#p6p5brick)" opacity="0.85" y="80"/>
  <g stroke="#5a3818" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
    <line x1="0" y1="320" x2="366" y2="320"/>
    <line x1="0" y1="360" x2="366" y2="360"/>
  </g>
  <!-- Brick verticals. -->
  <g stroke="#5a3818" stroke-width="0.3" opacity="0.45">
    <line x1="60" y1="80" x2="60" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="160"/>
    <line x1="220" y1="160" x2="220" y2="200"/>
    <line x1="80" y1="200" x2="80" y2="240"/>
    <line x1="280" y1="240" x2="280" y2="280"/>
    <line x1="160" y1="280" x2="160" y2="320"/>
    <line x1="40" y1="320" x2="40" y2="360"/>
    <line x1="220" y1="360" x2="220" y2="420"/>
  </g>

  <!-- Wet sheen — water streaming down brick. -->
  <g stroke="#7af0ff" stroke-width="0.4" opacity="0.55" filter="url(#p6p5bloom)">
    <line x1="40" y1="80" x2="42" y2="420"/>
    <line x1="100" y1="80" x2="98" y2="420"/>
    <line x1="180" y1="80" x2="182" y2="420"/>
    <line x1="260" y1="80" x2="258" y2="420"/>
    <line x1="320" y1="80" x2="322" y2="420"/>
  </g>

  <!-- DRAINPIPE descending right side. -->
  <rect x="290" y="80" width="20" height="340" fill="#0a0c10"/>
  <line x1="300" y1="80" x2="300" y2="420" stroke="#3a3a45" stroke-width="0.6" opacity="0.55"/>
  <!-- Bracket ledge mid-frame. -->
  <rect x="0" y="240" width="366" height="20" fill="#3a3a45"/>
  <line x1="0" y1="240" x2="366" y2="240" stroke="#080a14" stroke-width="1.2"/>
  <line x1="0" y1="260" x2="366" y2="260" stroke="#080a14" stroke-width="0.7"/>
  <g fill="#080a14">
    <circle cx="100" cy="250" r="2"/>
    <circle cx="240" cy="250" r="2"/>
  </g>

  <!-- THRESH climbing DOWN (script-specific: mortar joint handholds). -->
  <g id="p6p5-thresh" transform="translate(70, 340)">
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="url(#p6p5ruby)" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="18" ry="24" fill="#f54848" opacity="0.55" filter="url(#p6p5bloom)"/>
    <!-- Head down (climbing). -->
    <ellipse cx="0" cy="-20" rx="6" ry="7" fill="#d8a880"/>
    <path d="M-5,-25 Q0,-28 5,-25 L5,-20 L-5,-20 Z" fill="#a83a18"/>
    <!-- Arms reaching/gripping. -->
    <path d="M-13,-5 L-22,-12 L-26,-18" fill="none" stroke="#5a1018" stroke-width="3" stroke-linecap="round"/>
    <path d="M13,-5 L22,2 L24,12" fill="none" stroke="#5a1018" stroke-width="3" stroke-linecap="round"/>
    <!-- Hands gripping mortar. -->
    <ellipse cx="-26" cy="-18" rx="3" ry="2" fill="#d8a880"/>
    <ellipse cx="24" cy="14" rx="3" ry="2" fill="#d8a880"/>
    <!-- Legs descending. -->
    <line x1="-3" y1="20" x2="-5" y2="32" stroke="#5a1018" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="20" x2="5" y2="32" stroke="#5a1018" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- WREN mapping route w/ hand on brick. -->
  <g id="p6p5-wren" transform="translate(150, 320)">
    <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#p6p5copper)" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="16" ry="22" fill="#f5a868" opacity="0.55" filter="url(#p6p5bloom)"/>
    <!-- Head turned, mapping. -->
    <ellipse cx="-2" cy="-18" rx="6" ry="7" fill="#d8b088"/>
    <!-- Bun. -->
    <ellipse cx="-2" cy="-23" rx="3.5" ry="2.5" fill="#0a0a14"/>
    <ellipse cx="-2" cy="-21" rx="3" ry="0.7" fill="#3a2810" opacity="0.85"/>
    <!-- One hand on brick wall (left, tracing route). -->
    <path d="M-12,-3 L-24,-8" stroke="url(#p6p5copper)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-24" cy="-8" rx="3" ry="2" fill="#5a3010"/>
    <!-- Oil stain on forearm (continuity). -->
    <ellipse cx="-18" cy="-5" rx="2.5" ry="1.5" fill="#1a0a08" opacity="0.65"/>
    <!-- Other arm. -->
    <line x1="12" y1="-3" x2="14" y2="10" stroke="url(#p6p5copper)" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs. -->
    <line x1="-3" y1="18" x2="-4" y2="30" stroke="#5a3010" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="18" x2="4" y2="30" stroke="#5a3010" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- SABLE on bracket — palm extended for Luma's scanner. -->
  <g id="p6p5-sable" transform="translate(220, 220)">
    <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#p6p5silver)" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="16" ry="22" fill="#dce4ff" opacity="0.4" filter="url(#p6p5bloom)"/>
    <!-- Cracked shoulder bleed (continuity). -->
    <ellipse cx="9" cy="-10" rx="6" ry="4" fill="url(#p6p5crackBleed)" filter="url(#p6p5bloom)" opacity="0.95"/>
    <!-- Head looking off-frame at Jink streak. -->
    <ellipse cx="3" cy="-20" rx="6" ry="7" fill="#5a3818"/>
    <path d="M-2,-25 Q3,-28 8,-25 L8,-20 L-2,-20 Z" fill="#c8ccd4"/>
    <!-- Eyes tracking distant streak (looking up-right). -->
    <ellipse cx="2" cy="-19" rx="1.2" ry="0.8" fill="#080404"/>
    <ellipse cx="6" cy="-19" rx="1.2" ry="0.8" fill="#080404"/>
    <!-- Faint emerald reflection in eyes. -->
    <circle cx="3" cy="-20" r="0.4" fill="#7af0b0"/>
    <circle cx="7" cy="-20" r="0.4" fill="#7af0b0"/>
    <!-- ARMS — left at side, right extended palm-up for treatment. -->
    <line x1="-12" y1="-3" x2="-15" y2="6" stroke="url(#p6p5silver)" stroke-width="3" stroke-linecap="round"/>
    <path d="M12,-3 L24,-8 L36,-12" fill="none" stroke="url(#p6p5silver)" stroke-width="3" stroke-linecap="round"/>
    <!-- Palm UP. -->
    <ellipse cx="36" cy="-12" rx="6" ry="4" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>
    <!-- Cut on palm (small line). -->
    <line x1="33" y1="-13" x2="38" y2="-11" stroke="#a83018" stroke-width="0.7" opacity="0.85"/>
    <!-- Legs. -->
    <line x1="-3" y1="18" x2="-4" y2="30" stroke="#3a3a45" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="18" x2="4" y2="30" stroke="#3a3a45" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- LUMA treating Sable's palm. -->
  <g id="p6p5-luma" transform="translate(290, 220)">
    <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#p6p5sapphire)" stroke="#080408" stroke-width="0.5"/>
    <ellipse cx="0" cy="0" rx="16" ry="22" fill="#a890f0" opacity="0.55" filter="url(#p6p5bloom)"/>
    <!-- Head bent toward Sable's palm. -->
    <ellipse cx="-2" cy="-18" rx="6" ry="7" fill="#a87850"/>
    <!-- Hair w/ braid. -->
    <path d="M-7,-23 Q-2,-26 3,-23 L3,-20 L-7,-20 Z" fill="#1a1018"/>
    <path d="M2,-20 Q3,-12 2,-3" stroke="#1a1018" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Sapphire filament in braid (continuity). -->
    <path d="M2,-20 Q3,-12 2,-3" stroke="#a890f0" stroke-width="0.4" fill="none" filter="url(#p6p5bloom)" opacity="0.85"/>
    <!-- Holo lens (one cracked). -->
    <ellipse cx="-3" cy="-18" rx="1.4" ry="1" fill="#a890f0" opacity="0.85"/>
    <ellipse cx="0" cy="-18" rx="1.4" ry="1" fill="#a890f0" opacity="0.55"/>
    <line x1="-1" y1="-19" x2="1" y2="-17" stroke="#080408" stroke-width="0.3"/>
    <!-- Arm reaching with scanner toward Sable's palm. -->
    <path d="M-10,-3 L-22,-8 L-32,-12" fill="none" stroke="url(#p6p5sapphire)" stroke-width="3" stroke-linecap="round"/>
    <!-- Holo medical SCANNER glow casting BLUE-VIOLET light (script-specific). -->
    <circle cx="-32" cy="-12" r="3" fill="#a890f0" filter="url(#p6p5bloom)"/>
    <ellipse cx="-32" cy="-12" rx="11" ry="7" fill="url(#p6p5sapphireScanner)" filter="url(#p6p5strongBloom)" opacity="0.85"/>
    <!-- Scan beam striking Sable's palm. -->
    <line x1="-32" y1="-12" x2="-44" y2="-12" stroke="#a890f0" stroke-width="2" opacity="0.85" filter="url(#p6p5bloom)"/>
    <!-- Diagnostic glyphs in scan light. -->
    <g stroke="#dce4ff" stroke-width="0.4" opacity="0.85" fill="none">
      <line x1="-40" y1="-15" x2="-32" y2="-15"/>
      <line x1="-40" y1="-9" x2="-32" y2="-9"/>
    </g>
    <!-- Right arm at side. -->
    <line x1="10" y1="-3" x2="12" y2="10" stroke="url(#p6p5sapphire)" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs. -->
    <line x1="-3" y1="18" x2="-4" y2="30" stroke="#1a1058" stroke-width="3" stroke-linecap="round"/>
    <line x1="3" y1="18" x2="4" y2="30" stroke="#1a1058" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- LUMA dialogue. -->
  <g id="p6p5-dlg-luma">
    <rect x="14" y="14" width="200" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" fill="#1a1a1a">Hold still. 10 seconds.</text>
    <path d="M120,58 L138,58 L260,210 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" stroke-linejoin="round"/>
    <line x1="120" y1="58" x2="138" y2="58" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- SABLE response. -->
  <g id="p6p5-dlg-sable">
    <rect x="14" y="350" width="200" height="44" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="368" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="384" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#3a3030">We do not have 10 seconds.</text>
    <path d="M118,350 L136,350 L220,260 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="118" y1="350" x2="136" y2="350" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- LUMA reply. -->
  <g id="p6p5-dlg-luma-2">
    <rect x="220" y="370" width="140" height="44" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="230" y="388" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="230" y="404" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#3a3030">You have 10. Street waits.</text>
    <path d="M260,370 L278,370 L290,260 Z" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" stroke-linejoin="round"/>
    <line x1="260" y1="370" x2="278" y2="370" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p6p5-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">5</text>
    <text x="362" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">GROUNDED SQUAD</text>
  </g>
</svg>
