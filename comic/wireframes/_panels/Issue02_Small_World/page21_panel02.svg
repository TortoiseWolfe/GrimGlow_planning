<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 550" width="742" height="550">
  <title>Issue 2 — Page 21 — Panel 2: Sable locks module, mask reassembles, returns to warm amber</title>
  <desc>MS 50mm slight high angle looking down. Sable locks data module — thumb pressing control small blue-white pulse confirming encryption then device dark. Slides into suit compartment seals. Posture mid-transformation: shoulders squaring jaw setting spine straightening — command mask reassembling deliberately like armour buckled. Turns toward warm amber glow sleeping squad. Thresh background sits watch entrance unchanged facing away unaware. Silver-white catches amber light as turns. Damaged silver suit cracked right shoulder. Blue-white gone — re-enters warm amber world power cell squad warmth. Behind shadows deeper than before. Resolved alone. CAPTION she locked file she locked face / CAPTION same encryption.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p21p2dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p21p2brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p21p2timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p21p2joist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p21p2silverWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89880"/>
      <stop offset="50%" stop-color="#787060"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <radialGradient id="p21p2amberWarmth">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p2encryptPulse">
      <stop offset="0%" stop-color="#dce4f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p2perimDistant">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <filter id="p21p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p21p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p21p2deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark. -->
  <rect width="742" height="550" fill="url(#p21p2dark)"/>

  <!-- BRICK wall (Sable's corner). -->
  <rect width="742" height="550" fill="url(#p21p2brick)" opacity="0.85"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
    <line x1="0" y1="320" x2="742" y2="320"/>
    <line x1="0" y1="400" x2="742" y2="400"/>
    <line x1="0" y1="480" x2="742" y2="480"/>
  </g>

  <!-- AMBER WARMTH from squad direction (right side, the destination). -->
  <ellipse cx="600" cy="275" rx="260" ry="280" fill="url(#p21p2amberWarmth)" filter="url(#p21p2deepBloom)" opacity="0.85"/>
  <!-- Power cell visible distant right. -->
  <g transform="translate(600, 380)">
    <path d="M-10,0 L-7,-7 L0,-10 L7,-7 L10,0 L7,7 L0,10 L-7,7 Z" fill="#3a3a44" stroke="#080404" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffe8a0" opacity="0.95" filter="url(#p21p2bloom)"/>
  </g>

  <!-- TIMBER STUD partial screen mid-frame. -->
  <rect x="430" y="0" width="40" height="550" fill="url(#p21p2timber)" stroke="#080404" stroke-width="0.85"/>
  <line x1="435" y1="0" x2="435" y2="550" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>
  <line x1="445" y1="0" x2="445" y2="550" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>
  <line x1="455" y1="0" x2="455" y2="550" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>
  <line x1="465" y1="0" x2="465" y2="550" stroke="#1a0808" stroke-width="0.4" opacity="0.85"/>

  <!-- THRESH SILHOUETTE distant background right (on watch, facing away). -->
  <g id="p21p2-thresh-bg" opacity="0.85">
    <ellipse cx="690" cy="380" rx="9" ry="14" fill="#3a0810"/>
    <circle cx="690" cy="365" r="4" fill="#1a0808"/>
    <!-- Crimson collar pulse. -->
    <ellipse cx="690" cy="370" rx="3" ry="0.85" fill="#f54848" opacity="0.85" filter="url(#p21p2bloom)"/>
    <!-- Weapon. -->
    <line x1="681" y1="380" x2="699" y2="380" stroke="#1a0810" stroke-width="2"/>
  </g>

  <!-- Sleeping squad hints (right of stud). -->
  <g id="p21p2-sleepers" opacity="0.65">
    <ellipse cx="540" cy="395" rx="22" ry="9" fill="#5a3ad8" opacity="0.55" filter="url(#p21p2bloom)"/>
    <ellipse cx="630" cy="395" rx="14" ry="9" fill="#a86528" opacity="0.55" filter="url(#p21p2bloom)"/>
    <circle cx="540" cy="390" r="0.85" fill="#a878f8" opacity="0.95" filter="url(#p21p2bloom)"/>
    <circle cx="630" cy="390" r="0.85" fill="#f0a868" opacity="0.95" filter="url(#p21p2bloom)"/>
  </g>

  <!-- Distant blue perimeter glow. -->
  <ellipse cx="742" cy="330" rx="80" ry="120" fill="url(#p21p2perimDistant)" filter="url(#p21p2deepBloom)" opacity="0.55"/>

  <!-- Timber JOIST FLOOR foreground. -->
  <rect x="0" y="490" width="742" height="60" fill="url(#p21p2joist)" stroke="#080404" stroke-width="0.85"/>

  <!-- SABLE — left side of frame, mid-turn toward squad. -->
  <g id="p21p2-sable" transform="translate(220, 350)">
    <!-- Body torso (3/4 turn — facing right/squad). -->
    <path d="M-90,150 L-100,30 L-80,-15 L-50,-35 L-20,-50 L20,-50 L50,-35 L80,-15 L100,30 L90,150 Z" fill="url(#p21p2silverWarm)" stroke="#080404" stroke-width="0.85"/>

    <!-- CRACKED RIGHT SHOULDER (now lit warm). -->
    <path d="M50,-35 L92,-22 L98,2 L92,28" fill="url(#p21p2silverWarm)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.7" opacity="0.85" filter="url(#p21p2bloom)">
      <path d="M62,-28 L72,-12 L68,2 L74,18"/>
      <path d="M68,-12 L74,-2"/>
    </g>
    <!-- Silver collar caught warm. -->
    <ellipse cx="0" cy="-50" rx="22" ry="4" fill="#dce4f0" opacity="0.55" filter="url(#p21p2bloom)"/>
    <ellipse cx="0" cy="-50" rx="32" ry="6" fill="#f5b860" opacity="0.45" filter="url(#p21p2strongBloom)"/>

    <!-- Mud streaks. -->
    <g fill="#3a2818" opacity="0.85">
      <ellipse cx="-15" cy="20" rx="6" ry="2.5"/>
      <ellipse cx="20" cy="60" rx="6" ry="2.5"/>
      <ellipse cx="-15" cy="100" rx="6" ry="2.5"/>
    </g>

    <!-- HAND sealing chest compartment (the encryption beat). -->
    <path d="M-15,-30 L-15,-15 L25,-22 L25,-32 Z" fill="url(#p21p2silverWarm)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="22" cy="-26" rx="5" ry="3" fill="#3a2818" stroke="#080404" stroke-width="0.4"/>
    <!-- Compartment closed (faint seam). -->
    <line x1="-12" y1="-26" x2="14" y2="-30" stroke="#080404" stroke-width="0.5"/>
    <!-- ENCRYPTION PULSE — small bright spot at thumb (just confirmed). -->
    <circle cx="22" cy="-28" r="2.5" fill="#dce4f0" opacity="0.95" filter="url(#p21p2bloom)"/>
    <ellipse cx="22" cy="-28" rx="14" ry="5" fill="url(#p21p2encryptPulse)" filter="url(#p21p2strongBloom)" opacity="0.85"/>

    <!-- HEAD turning right toward squad — 3/4 facing. -->
    <ellipse cx="6" cy="-78" rx="22" ry="24" fill="#3a2818"/>
    <!-- Silver-white buzz catching warm. -->
    <path d="M-12,-100 Q6,-110 24,-100 L24,-90 L-12,-90 Z" fill="#a8a890"/>
    <ellipse cx="6" cy="-100" rx="14" ry="4" fill="#f5b860" opacity="0.45" filter="url(#p21p2strongBloom)"/>
    <line x1="-12" y1="-90" x2="24" y2="-90" stroke="#3a3a44" stroke-width="0.85" opacity="0.85"/>
    <g fill="#5a606a" opacity="0.85">
      <circle cx="-4" cy="-104" r="0.7"/>
      <circle cx="6" cy="-106" r="0.7"/>
      <circle cx="16" cy="-104" r="0.7"/>
    </g>

    <!-- Brow set RESOLVED (mask reassembling). -->
    <path d="M-10,-86 Q-2,-90 6,-86" stroke="#1a0808" stroke-width="2" fill="none"/>
    <path d="M6,-86 Q14,-90 22,-86" stroke="#1a0808" stroke-width="2" fill="none"/>

    <!-- EYES turned right (toward squad), hardening. -->
    <ellipse cx="-3" cy="-78" rx="3.5" ry="2.5" fill="#dce4f0"/>
    <ellipse cx="15" cy="-78" rx="3.5" ry="2.5" fill="#dce4f0"/>
    <ellipse cx="-1" cy="-78" rx="1.4" ry="1.4" fill="#5a3a18"/>
    <ellipse cx="17" cy="-78" rx="1.4" ry="1.4" fill="#5a3a18"/>
    <ellipse cx="-1" cy="-78" rx="0.85" ry="0.85" fill="#080404"/>
    <ellipse cx="17" cy="-78" rx="0.85" ry="0.85" fill="#080404"/>
    <!-- Warm catch-light. -->
    <circle cx="0" cy="-79" r="0.55" fill="#ffe8a0" opacity="0.95" filter="url(#p21p2bloom)"/>
    <circle cx="18" cy="-79" r="0.55" fill="#ffe8a0" opacity="0.95" filter="url(#p21p2bloom)"/>

    <!-- Cheekbones warm. -->
    <ellipse cx="-12" cy="-62" rx="6" ry="3" fill="#a87850" opacity="0.55" filter="url(#p21p2bloom)"/>
    <ellipse cx="22" cy="-62" rx="6" ry="3" fill="#a87850" opacity="0.55" filter="url(#p21p2bloom)"/>
    <ellipse cx="6" cy="-65" rx="22" ry="14" fill="#f5b860" opacity="0.35" filter="url(#p21p2strongBloom)"/>

    <!-- Nose. -->
    <path d="M5,-72 L7,-58 L4,-52" stroke="#1a0808" stroke-width="0.85" fill="none" opacity="0.85"/>

    <!-- LIPS — set firm (mask back). -->
    <line x1="-2" y1="-46" x2="14" y2="-46" stroke="#1a0808" stroke-width="2"/>

    <!-- Jaw firm. -->
    <ellipse cx="-12" cy="-56" rx="3" ry="2" fill="#1a0808" opacity="0.55"/>
    <ellipse cx="22" cy="-56" rx="3" ry="2" fill="#1a0808" opacity="0.55"/>
  </g>

  <!-- CAPTIONS. -->
  <g id="p21p2-cap1">
    <rect x="14" y="14" width="280" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">She locked the file. She locked her face.</text>
  </g>
  <g id="p21p2-cap2">
    <rect x="14" y="62" width="200" height="32" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">Same encryption.</text>
  </g>

  <!-- Meta. -->
  <g id="p21p2-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="738" y="540" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">SAME ENCRYPTION</text>
  </g>
</svg>
