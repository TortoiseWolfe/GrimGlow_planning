<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 400" width="245" height="400">
  <title>Issue 2 — Page 11 — Panel 5: Squad ensemble watches Wren begin work, weight of one block</title>
  <desc>MS 50mm eye level. Four squad members framed against wreckage — Sable Jink Thresh Luma watching Wren begin. Wreckage fills background dark enormous. Battered wet exhausted standing sheltered courtyard staging ground. Sable arms folded watching commander between operations. Jink weight shifting restless looking around courtyard. Thresh scanning courtyard edges weapon back hand standing guard. Luma eyes on wreckage holographic lenses scrolling data already studying. JINK quiet we crossed one block / LUMA yes / JINK one block nearly killed us / LUMA yes.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p5hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p11p5flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#2a2e34"/>
    </linearGradient>
    <linearGradient id="p11p5silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p11p5rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p11p5sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p11p5emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <linearGradient id="p11p5copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <filter id="p11p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p11p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG hull plating wall fills upper two-thirds. -->
  <rect x="0" y="0" width="245" height="280" fill="url(#p11p5hull)"/>
  <!-- Dead etched channels. -->
  <g stroke="#080404" stroke-width="0.5" fill="none" opacity="0.85">
    <path d="M0,40 L60,40 L80,60 L120,60"/>
    <path d="M150,30 L200,30 L220,50"/>
    <path d="M0,100 L80,100 L100,120 L160,120"/>
    <path d="M180,80 L220,80 L245,100"/>
    <path d="M0,180 L60,180 L80,200 L140,200"/>
    <path d="M170,160 L220,160 L245,180"/>
    <path d="M0,240 L60,240 L80,260"/>
    <!-- Hex nodes (dead). -->
    <path d="M75,37 L80,34 L85,37 L85,43 L80,46 L75,43 Z"/>
    <path d="M115,57 L120,54 L125,57 L125,63 L120,66 L115,63 Z"/>
    <path d="M155,117 L160,114 L165,117 L165,123 L160,126 L155,123 Z"/>
    <path d="M75,237 L80,234 L85,237 L85,243 L80,246 L75,243 Z"/>
  </g>
  <!-- Impact fractures. -->
  <g stroke="#080404" stroke-width="0.85" fill="none">
    <path d="M30,0 L50,40 L70,80"/>
    <path d="M180,0 L160,40 L150,80 L170,120"/>
    <path d="M50,160 L70,200 L90,240"/>
    <path d="M200,160 L180,200 L200,240 L210,260"/>
  </g>

  <!-- COURTYARD FLAGSTONE GROUND foreground. -->
  <rect x="0" y="280" width="245" height="120" fill="url(#p11p5flag)"/>
  <line x1="80" y1="280" x2="80" y2="400" stroke="#1a1a20" stroke-width="1.4"/>
  <line x1="160" y1="280" x2="160" y2="400" stroke="#1a1a20" stroke-width="1.4"/>
  <g stroke="#1a1a20" stroke-width="0.6" opacity="0.85">
    <path d="M40,280 L50,310 L45,340 L60,400"/>
    <path d="M120,280 L130,310 L125,340 L140,400"/>
    <path d="M210,280 L220,310 L215,340 L230,400"/>
  </g>
  <g fill="#a8b0bc" opacity="0.45" filter="url(#p11p5bloom)">
    <ellipse cx="40" cy="290" rx="28" ry="2"/>
    <ellipse cx="120" cy="290" rx="28" ry="2"/>
    <ellipse cx="200" cy="290" rx="28" ry="2"/>
  </g>

  <!-- 4 SQUAD MEMBERS in a line + Wren further back near hull (left edge). -->
  <!-- WREN further back, working at hull (silhouette near left edge). -->
  <g id="p11p5-wren-back" transform="translate(20, 270)">
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="url(#p11p5copperDirty)"/>
    <circle cx="0" cy="-12" r="4" fill="#e0c098"/>
    <ellipse cx="-1" cy="-15" rx="3" ry="1.5" fill="#1a0808"/>
    <!-- Hand reaching to hull. -->
    <line x1="-4" y1="-2" x2="-12" y2="-8" stroke="#5a2818" stroke-width="2"/>
    <!-- Faint copper glow at forearm. -->
    <ellipse cx="-2" cy="-2" rx="6" ry="3" fill="#f0a868" opacity="0.55" filter="url(#p11p5strongBloom)"/>
  </g>

  <!-- SABLE — arms folded, watching. -->
  <g id="p11p5-sable" transform="translate(70, 320)">
    <path d="M-12,40 L-15,5 L-12,-15 L-6,-25 L6,-25 L12,-15 L15,5 L12,40 Z" fill="url(#p11p5silverDirty)" stroke="#080404" stroke-width="0.7"/>
    <!-- CRACKED right shoulder. -->
    <path d="M12,-12 L18,-2 L20,12 L18,28" fill="url(#p11p5silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.6" opacity="0.85" filter="url(#p11p5bloom)">
      <path d="M14,-5 L18,5 L16,15 L20,22"/>
    </g>
    <ellipse cx="0" cy="-25" rx="9" ry="2.5" fill="#dce4f0" opacity="0.55" filter="url(#p11p5bloom)"/>
    <!-- Mud streaks. -->
    <g fill="#3a2818" opacity="0.85">
      <ellipse cx="-5" cy="10" rx="3" ry="1.5"/>
      <ellipse cx="6" cy="25" rx="3" ry="1.5"/>
    </g>
    <!-- ARMS FOLDED (across chest). -->
    <path d="M-12,-2 L12,-2 L14,8 L-14,8 Z" fill="url(#p11p5silverDirty)" stroke="#080404" stroke-width="0.6"/>
    <line x1="-2" y1="-2" x2="2" y2="8" stroke="#080404" stroke-width="0.4"/>
    <!-- Hand of one arm visible at opposite elbow. -->
    <ellipse cx="11" cy="3" rx="3" ry="2" fill="#3a2818" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="-11" cy="3" rx="3" ry="2" fill="#3a2818" stroke="#080404" stroke-width="0.4"/>
    <!-- Head facing forward (toward Wren). -->
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#3a2818"/>
    <path d="M-9,-44 Q0,-50 9,-44 L9,-37 L-9,-37 Z" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- JINK — restless, looking around. -->
  <g id="p11p5-jink" transform="translate(115, 325)">
    <ellipse cx="-8" cy="-12" rx="8" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(45 -8 -12)" filter="url(#p11p5bloom)"/>
    <ellipse cx="8" cy="-12" rx="8" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(-45 8 -12)" filter="url(#p11p5bloom)"/>
    <path d="M-10,38 L-13,3 L-10,-15 L-5,-25 L5,-25 L10,-15 L13,3 L10,38 Z" fill="url(#p11p5emeraldDirty)" stroke="#080404" stroke-width="0.7"/>
    <ellipse cx="0" cy="-25" rx="7" ry="2" fill="#7af0b0" opacity="0.55" filter="url(#p11p5bloom)"/>
    <!-- Head turned LEFT (looking around). -->
    <ellipse cx="-3" cy="-37" rx="11" ry="12" fill="#d8b890"/>
    <path d="M-12,-44 Q-3,-50 6,-44 L6,-37 L-12,-37 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-7" cy="-46" r="1.2"/><circle cx="-3" cy="-48" r="1.2"/><circle cx="1" cy="-46" r="1.2"/></g>
    <ellipse cx="-7" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-1" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-8" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="-2" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-7" y1="-31" x2="0" y2="-31" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- THRESH — scanning courtyard edges, weapon ready. -->
  <g id="p11p5-thresh" transform="translate(160, 322)">
    <path d="M-13,40 L-15,5 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,5 L13,40 Z" fill="url(#p11p5rubyDirty)" stroke="#080404" stroke-width="0.7"/>
    <path d="M-13,-13 L-22,-3 L-22,12 L-13,18" fill="url(#p11p5rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-19,2 Q-15,8 -14,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="9" ry="2.5" fill="#f54848" opacity="0.65" filter="url(#p11p5bloom)"/>
    <g fill="#3a1010" opacity="0.85"><ellipse cx="-5" cy="10" rx="3" ry="1.5"/><ellipse cx="6" cy="25" rx="3" ry="1.5"/></g>
    <!-- Weapon held lateral, scanning. -->
    <rect x="-10" y="-2" width="26" height="6" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="-5" cy="1" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <ellipse cx="11" cy="1" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <!-- Head turned RIGHT (scanning). -->
    <ellipse cx="3" cy="-37" rx="11" ry="12" fill="#d8a880"/>
    <path d="M-7,-44 Q3,-50 13,-44 L13,-37 L-7,-37 Z" fill="#a83a18"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="2" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="8" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- LUMA — eyes on wreckage, lenses scrolling. -->
  <g id="p11p5-luma" transform="translate(210, 322)">
    <path d="M-11,40 L-14,5 L-11,-15 L-6,-25 L6,-25 L11,-15 L14,5 L11,40 Z" fill="url(#p11p5sapphireDirty)" stroke="#080404" stroke-width="0.7"/>
    <ellipse cx="0" cy="-25" rx="8" ry="2.5" fill="#a878f8" opacity="0.65" filter="url(#p11p5bloom)"/>
    <g fill="#3a2010" opacity="0.85"><ellipse cx="-5" cy="10" rx="3" ry="1.5"/><ellipse cx="5" cy="25" rx="3" ry="1.5"/></g>
    <!-- Head looking up-left (at wreckage). -->
    <ellipse cx="-2" cy="-37" rx="11" ry="12" fill="#a87850"/>
    <path d="M-8,-32 Q-15,-22 -14,-10 Q-13,2 -15,12" stroke="#1a0808" stroke-width="4" fill="none"/>
    <line x1="-10" y1="-28" x2="-14" y2="10" stroke="#a878f8" stroke-width="0.5" opacity="0.85" filter="url(#p11p5bloom)"/>
    <!-- Cracked right lens with active scrolling data. -->
    <ellipse cx="3" cy="-37" rx="4" ry="3" fill="#a878f8" opacity="0.65" stroke="#a878f8" stroke-width="0.4"/>
    <line x1="3" y1="-37" x2="6" y2="-34" stroke="#dce4f0" stroke-width="0.3" opacity="0.85"/>
    <g font-family="Courier, monospace" font-size="2" fill="#dce4f0" opacity="0.85">
      <text x="0" y="-39">SCAN</text>
      <text x="0" y="-37">ANL</text>
      <text x="0" y="-35">α=0</text>
    </g>
    <ellipse cx="-4" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-4" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-5" y1="-31" x2="2" y2="-31" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- DIALOGUE STACK — quiet exchange. -->
  <g id="p11p5-bal-jink1">
    <rect x="14" y="14" width="220" height="40" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">We crossed one block.</text>
  </g>

  <g id="p11p5-bal-luma1">
    <rect x="14" y="58" width="100" height="40" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="76" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="92" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Yes.</text>
  </g>

  <g id="p11p5-bal-jink2">
    <rect x="14" y="102" width="220" height="58" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="120" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="138" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">One block, and it</text>
    <text x="24" y="155" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">nearly killed us.</text>
  </g>

  <g id="p11p5-bal-luma2">
    <rect x="14" y="164" width="100" height="40" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="182" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="198" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Yes.</text>
  </g>

  <!-- Meta. -->
  <g id="p11p5-meta">
    <text x="237" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">5</text>
    <text x="241" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">ONE BLOCK</text>
  </g>
</svg>
