<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 19 — Panel 2: Victorian woman + child walk past, oblivious to gap</title>
  <desc>MS 50mm human scale eye level. Victorian working-class woman shawl bonnet heavy skirts tired face holds hand small girl about five drags feet looking down. Pass directly in front gap brickwork base wall. Skirt hem brushes wall near gap. Neither looks. Warm amber gaslight street lamp ordinary domestic tired. Gap dark shadow base building. Wet cobblestones reflect amber. Pedestrian mundanity is point — inside wall five tiny people sleeping. NO DIALOGUE.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p2nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1820"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p19p2brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p19p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4a30"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <radialGradient id="p19p2lampWash">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19p2skirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <filter id="p19p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p19p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p19p2deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG sky. -->
  <rect width="366" height="40" fill="url(#p19p2nightSky)"/>

  <!-- BUILDING WALL (full width). -->
  <rect x="0" y="40" width="366" height="220" fill="url(#p19p2brick)"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="60" x2="366" y2="60"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="100" x2="366" y2="100"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="180" x2="366" y2="180"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="220" x2="366" y2="220"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
  </g>
  <g fill="#080404" opacity="0.55">
    <ellipse cx="60" cy="100" rx="20" ry="22"/>
    <ellipse cx="280" cy="120" rx="22" ry="24"/>
    <ellipse cx="180" cy="180" rx="18" ry="20"/>
    <ellipse cx="320" cy="200" rx="20" ry="22"/>
  </g>

  <!-- Gas-lamp wash. -->
  <ellipse cx="183" cy="0" rx="280" ry="200" fill="url(#p19p2lampWash)" filter="url(#p19p2deepBloom)" opacity="0.65"/>

  <!-- Drainpipe. -->
  <rect x="240" y="60" width="14" height="200" fill="#1a1010" stroke="#080404" stroke-width="0.5"/>
  <rect x="236" y="160" width="22" height="6" fill="#080404"/>

  <!-- THE GAP — center frame ground level. -->
  <rect x="270" y="240" width="14" height="20" fill="#080404" stroke="#1a0808" stroke-width="0.5"/>

  <!-- COBBLESTONE STREET. -->
  <rect x="0" y="260" width="366" height="60" fill="url(#p19p2cobble)"/>
  <g stroke="#080404" stroke-width="0.5" opacity="0.85">
    <rect x="20" y="265" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="65" y="265" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="110" y="265" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="155" y="265" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="200" y="265" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="245" y="265" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="290" y="265" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="335" y="265" width="30" height="14" fill="#3a2818" rx="2"/>
    <rect x="40" y="285" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="85" y="285" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="130" y="285" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="175" y="285" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="220" y="285" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="265" y="285" width="40" height="14" fill="#3a2818" rx="2"/>
    <rect x="310" y="285" width="40" height="14" fill="#3a2818" rx="2"/>
  </g>
  <g fill="#a8b0bc" opacity="0.45" filter="url(#p19p2bloom)">
    <ellipse cx="100" cy="275" rx="40" ry="2"/>
    <ellipse cx="280" cy="290" rx="40" ry="2"/>
  </g>
  <g fill="#f5b860" opacity="0.45" filter="url(#p19p2bloom)">
    <ellipse cx="100" cy="293" rx="80" ry="3"/>
  </g>

  <!-- WOMAN walking past (left of center). -->
  <g id="p19p2-woman" transform="translate(140, 195)">
    <!-- Shawl/upper body. -->
    <path d="M-20,40 L-28,15 L-24,-5 L-12,-25 L12,-25 L24,-5 L28,15 L20,40 Z" fill="#3a2010" stroke="#080404" stroke-width="0.7"/>
    <!-- Shawl draping. -->
    <path d="M-24,-5 L-32,5 L-30,18 L-22,12 Z" fill="#1a0808" stroke="#080404" stroke-width="0.5"/>
    <path d="M24,-5 L32,5 L30,18 L22,12 Z" fill="#1a0808" stroke="#080404" stroke-width="0.5"/>
    <!-- Bonnet/head. -->
    <ellipse cx="0" cy="-32" rx="11" ry="12" fill="#d8a880"/>
    <path d="M-13,-40 Q0,-46 13,-40 L13,-30 L-13,-30 Z" fill="#1a0808"/>
    <ellipse cx="0" cy="-44" rx="4" ry="3" fill="#1a0808"/>
    <!-- Tired face. -->
    <ellipse cx="-3" cy="-32" rx="1.4" ry="1" fill="#5a3a18"/>
    <ellipse cx="3" cy="-32" rx="1.4" ry="1" fill="#5a3a18"/>
    <line x1="-2" y1="-25" x2="2" y2="-25" stroke="#3a1810" stroke-width="0.7"/>
    <!-- Heavy skirts (long). -->
    <path d="M-20,40 L-30,80 L30,80 L20,40 Z" fill="url(#p19p2skirt)" stroke="#080404" stroke-width="0.7"/>
    <path d="M-30,80 L-30,120 L30,120 L30,80 Z" fill="url(#p19p2skirt)" stroke="#080404" stroke-width="0.5"/>
    <!-- Skirt hem details (folds). -->
    <g stroke="#1a0808" stroke-width="0.4" opacity="0.85">
      <line x1="-25" y1="80" x2="-25" y2="120"/>
      <line x1="-15" y1="80" x2="-15" y2="120"/>
      <line x1="0" y1="80" x2="0" y2="120"/>
      <line x1="15" y1="80" x2="15" y2="120"/>
      <line x1="25" y1="80" x2="25" y2="120"/>
    </g>
    <!-- Hand holding child's hand. -->
    <ellipse cx="32" cy="35" rx="6" ry="5" fill="#d8a880" stroke="#3a1808" stroke-width="0.4"/>
  </g>

  <!-- CHILD (right of woman, smaller, hand held). -->
  <g id="p19p2-child" transform="translate(195, 230)">
    <!-- Body smaller. -->
    <path d="M-12,28 L-15,5 L-12,-12 L-6,-22 L6,-22 L12,-12 L15,5 L12,28 Z" fill="#5a4828" stroke="#080404" stroke-width="0.6"/>
    <!-- Smaller skirt. -->
    <path d="M-12,28 L-18,55 L18,55 L12,28 Z" fill="#5a4828" stroke="#080404" stroke-width="0.5"/>
    <!-- Hand holding mother's. -->
    <ellipse cx="-13" cy="0" rx="3" ry="2" fill="#d8a880" stroke="#3a1808" stroke-width="0.3"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-30" rx="9" ry="10" fill="#d8a880"/>
    <!-- Hair (loose dark). -->
    <path d="M-9,-37 Q0,-42 9,-37 L9,-28 L-9,-28 Z" fill="#1a0808"/>
    <!-- Eyes looking DOWN (dragging feet). -->
    <ellipse cx="-3" cy="-28" rx="1" ry="0.8" fill="#1a0808"/>
    <ellipse cx="3" cy="-28" rx="1" ry="0.8" fill="#1a0808"/>
    <!-- Tiny mouth. -->
    <line x1="-2" y1="-22" x2="2" y2="-22" stroke="#3a1810" stroke-width="0.5"/>
  </g>

  <!-- The skirt hem brushing the wall NEAR THE GAP. -->
  <path d="M155,275 L172,275 L170,278 L153,278 Z" fill="url(#p19p2skirt)" opacity="0.85"/>

  <!-- NO DIALOGUE — silence. -->

  <!-- Meta. -->
  <g id="p19p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">UNAWARE</text>
  </g>
</svg>
