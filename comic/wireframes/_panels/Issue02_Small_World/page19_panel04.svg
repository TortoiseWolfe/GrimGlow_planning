<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 420" width="742" height="420">
  <title>Issue 2 — Page 19 — Panel 4: First night in the wall, all five rest, dual lighting closes Section 4</title>
  <desc>MW 35mm fairy scale eye level inside cavity night. Squad sleeps. Sable silver leans rough brick wall near entrance eyes half-closed head tilted back not quite sleeping silver-white hair against dark brick. Thresh ruby maintains watch unchanged weapon across knees copper-red buzz eyes fixed gap. Dim amber glow between: Jink emerald curled lath above golden curls falling edge wing-pack seams pulse faint emerald slow breathing. Luma sapphire-violet lying side joist lenses dark long braid faintly luminous filament. Wren copper slumped work area fallen asleep over salvage hand on component holographic tools dimmed dying copper-gold embers drifting fingers. Amber power cell low warm center. Blue-white perimeter steady entrance. Five coloured suit-lights stars in dark. CAPTION tomorrow stealing future from past / CAPTION tonight slept wall called home.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p4night" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p19p4timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p19p4plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p19p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <radialGradient id="p19p4amberHearth">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5a2818" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p4perim">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19p4silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p19p4copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p19p4rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82030"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p19p4sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p19p4emeraldDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <filter id="p19p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p19p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p19p4deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG night cavity. -->
  <rect width="742" height="420" fill="url(#p19p4night)"/>

  <!-- Plaster wall left, brick wall right. -->
  <rect x="0" y="0" width="100" height="420" fill="url(#p19p4plaster)"/>
  <g stroke="#1a0808" stroke-width="0.7" opacity="0.65">
    <line x1="0" y1="40" x2="100" y2="40"/>
    <line x1="0" y1="80" x2="100" y2="80"/>
    <line x1="0" y1="120" x2="100" y2="120"/>
    <line x1="0" y1="160" x2="100" y2="160"/>
    <line x1="0" y1="200" x2="100" y2="200"/>
    <line x1="0" y1="240" x2="100" y2="240"/>
    <line x1="0" y1="280" x2="100" y2="280"/>
    <line x1="0" y1="320" x2="100" y2="320"/>
  </g>
  <rect x="640" y="0" width="102" height="420" fill="url(#p19p4brick)"/>
  <g stroke="#080404" stroke-width="0.5" opacity="0.85">
    <line x1="640" y1="40" x2="742" y2="40"/>
    <line x1="640" y1="80" x2="742" y2="80"/>
    <line x1="640" y1="120" x2="742" y2="120"/>
    <line x1="640" y1="160" x2="742" y2="160"/>
    <line x1="640" y1="200" x2="742" y2="200"/>
    <line x1="640" y1="240" x2="742" y2="240"/>
    <line x1="640" y1="280" x2="742" y2="280"/>
    <line x1="640" y1="320" x2="742" y2="320"/>
  </g>

  <!-- Timber studs. -->
  <rect x="100" y="0" width="30" height="420" fill="url(#p19p4timber)" stroke="#080404" stroke-width="0.85"/>
  <rect x="610" y="0" width="30" height="420" fill="url(#p19p4timber)" stroke="#080404" stroke-width="0.85"/>

  <!-- Lath high in frame (Jink's perch). -->
  <rect x="130" y="60" width="480" height="14" fill="url(#p19p4timber)" stroke="#080404" stroke-width="0.85"/>

  <!-- ENTRANCE GAP w/ blue perimeter (right). -->
  <path d="M640,140 L700,135 L702,260 L640,270 Z" fill="#3a3e48" opacity="0.85"/>
  <ellipse cx="670" cy="200" rx="80" ry="120" fill="url(#p19p4perim)" filter="url(#p19p4deepBloom)" opacity="0.85"/>
  <g stroke="#a8d8f8" stroke-width="0.7" fill="none" opacity="0.95" filter="url(#p19p4bloom)">
    <path d="M640,140 L700,135"/>
    <path d="M640,270 L702,260"/>
    <path d="M640,140 L640,270"/>
    <path d="M700,135 L702,260"/>
    <path d="M640,200 L702,200"/>
  </g>
  <g fill="#dce4f0" opacity="0.95" filter="url(#p19p4bloom)">
    <circle cx="640" cy="142" r="0.85"/>
    <circle cx="700" cy="137" r="0.85"/>
    <circle cx="640" cy="268" r="0.85"/>
    <circle cx="702" cy="258" r="0.85"/>
  </g>

  <!-- Timber JOIST FLOOR. -->
  <rect x="130" y="340" width="480" height="80" fill="url(#p19p4timber)" stroke="#080404" stroke-width="0.85"/>

  <!-- AMBER HEARTH at center (low warm ember). -->
  <ellipse cx="371" cy="280" rx="280" ry="180" fill="url(#p19p4amberHearth)" filter="url(#p19p4deepBloom)" opacity="0.95"/>
  <g transform="translate(371, 320)">
    <path d="M-10,0 L-7,-7 L0,-10 L7,-7 L10,0 L7,7 L0,10 L-7,7 Z" fill="#3a3a44" stroke="#080404" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="3.5" fill="#a85820" opacity="0.85" filter="url(#p19p4bloom)"/>
    <circle cx="0" cy="0" r="2" fill="#f5b860" filter="url(#p19p4bloom)"/>
  </g>

  <!-- SACKING for Luma. -->
  <path d="M250,335 L420,330 L430,360 L255,365 Z" fill="#5a4828" opacity="0.85" stroke="#080404" stroke-width="0.4"/>

  <!-- 5 SQUAD MEMBERS — all visible. -->

  <!-- JINK on lath — curled asleep. -->
  <g id="p19p4-jink" transform="translate(220, 50)">
    <ellipse cx="-8" cy="0" rx="14" ry="4" fill="#3aa078" opacity="0.65" transform="rotate(40 -8 0)" filter="url(#p19p4bloom)"/>
    <ellipse cx="8" cy="0" rx="14" ry="4" fill="#3aa078" opacity="0.65" transform="rotate(-40 8 0)" filter="url(#p19p4bloom)"/>
    <path d="M-25,15 L-28,-2 L-22,-12 L-10,-12 L0,-10 L15,-9 L25,-7 L28,5 L22,15 Z" fill="url(#p19p4emeraldDim)" stroke="#080404" stroke-width="0.5"/>
    <!-- Arm dangling. -->
    <path d="M-22,12 L-30,32 L-25,34 L-18,15 Z" fill="url(#p19p4emeraldDim)" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="-28" cy="35" rx="3" ry="2" fill="#d8b890" stroke="#3a1808" stroke-width="0.3"/>
    <!-- Head right side. -->
    <ellipse cx="22" cy="-2" rx="9" ry="9" fill="#d8b890"/>
    <!-- Curls falling. -->
    <path d="M28,5 Q30,16 28,24" stroke="#f0d878" stroke-width="1.5" fill="none"/>
    <path d="M22,8 Q23,18 21,26" stroke="#f0d878" stroke-width="1.5" fill="none"/>
    <path d="M16,7 Q15,18 13,26" stroke="#f0d878" stroke-width="1.5" fill="none"/>
    <path d="M14,-9 Q22,-13 30,-9 L30,-2 L14,-2 Z" fill="#f0d878"/>
    <path d="M19,-3 Q21,-1 23,-3" stroke="#1a0808" stroke-width="0.7" fill="none"/>
    <path d="M25,-3 Q27,-1 29,-3" stroke="#1a0808" stroke-width="0.7" fill="none"/>
  </g>

  <!-- LUMA on joist sleeping side. -->
  <g id="p19p4-luma" transform="translate(335, 350)">
    <path d="M-80,12 L-75,-5 L-65,-12 L-30,-15 L0,-15 L30,-12 L60,-10 L75,-5 L80,8 L75,15 L-80,18 Z" fill="url(#p19p4sapphireDirty)" stroke="#080404" stroke-width="0.6"/>
    <!-- Head right. -->
    <ellipse cx="76" cy="-15" rx="11" ry="11" fill="#a87850"/>
    <!-- Long braid. -->
    <path d="M68,-15 Q58,-15 48,-20 Q38,-25 30,-22 Q22,-19 15,-22" stroke="#1a0808" stroke-width="3" fill="none"/>
    <line x1="65" y1="-14" x2="17" y2="-21" stroke="#a878f8" stroke-width="0.5" opacity="0.85" filter="url(#p19p4bloom)"/>
    <g fill="#a878f8" opacity="0.95" filter="url(#p19p4bloom)">
      <circle cx="55" cy="-17" r="0.7"/>
      <circle cx="40" cy="-22" r="0.7"/>
      <circle cx="25" cy="-22" r="0.7"/>
    </g>
    <!-- Cracked lens dark. -->
    <ellipse cx="82" cy="-15" rx="3" ry="2" fill="#3a2810" stroke="#1a0808" stroke-width="0.3"/>
    <!-- Eye closed. -->
    <path d="M73,-15 Q76,-13 80,-15" stroke="#1a0808" stroke-width="0.7" fill="none"/>
  </g>

  <!-- WREN slumped over work area (right side, near brick wall). -->
  <g id="p19p4-wren" transform="translate(560, 320)">
    <!-- Body slumped forward (head down on arms). -->
    <path d="M-35,40 L-40,-5 L-30,-22 L-15,-30 L20,-32 L35,-22 L42,-5 L40,40 Z" fill="url(#p19p4copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <!-- Head slumped down on hand. -->
    <ellipse cx="-5" cy="-22" rx="11" ry="10" fill="#e0c098"/>
    <!-- Hair UP bun visible top. -->
    <ellipse cx="-7" cy="-30" rx="6" ry="4" fill="#1a0808"/>
    <!-- Eyes closed. -->
    <path d="M-9,-22 Q-7,-21 -5,-22" stroke="#1a0808" stroke-width="0.7" fill="none"/>
    <!-- ARM extended forward with hand on component. -->
    <path d="M-30,-22 L-10,-15 L-5,-10 L-25,-15 Z" fill="url(#p19p4copperDirty)" stroke="#080404" stroke-width="0.4"/>
    <!-- Salvaged component beneath hand. -->
    <rect x="-15" y="-12" width="14" height="8" rx="1" fill="#1a1a20" stroke="#080404" stroke-width="0.4"/>
    <!-- Dimming copper-gold tools — drifting embers. -->
    <g fill="#a85820" opacity="0.65" filter="url(#p19p4bloom)">
      <circle cx="-15" cy="-18" r="1.4"/>
      <circle cx="-10" cy="-22" r="1"/>
      <circle cx="-3" cy="-15" r="1.4"/>
      <circle cx="2" cy="-20" r="1"/>
      <circle cx="-20" cy="-25" r="1"/>
    </g>
    <!-- Faint orbit lines (dying). -->
    <g stroke="#a85820" stroke-width="0.3" fill="none" opacity="0.45" filter="url(#p19p4bloom)">
      <circle cx="-10" cy="-12" r="14"/>
    </g>
  </g>

  <!-- THRESH near entrance, watching, weapon across knees. -->
  <g id="p19p4-thresh" transform="translate(595, 320)">
    <path d="M-13,40 L-15,5 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,5 L13,40 Z" fill="url(#p19p4rubyDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M-13,-13 L-22,-3 L-22,12 L-13,18" fill="url(#p19p4rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-19,2 Q-15,8 -14,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="8" ry="2" fill="#f54848" opacity="0.85" filter="url(#p19p4bloom)"/>
    <!-- Weapon across knees. -->
    <rect x="-13" y="-2" width="26" height="5" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.3"/>
    <!-- Head turned right (entrance). -->
    <ellipse cx="3" cy="-37" rx="9" ry="9" fill="#d8a880"/>
    <path d="M-7,-44 Q3,-49 13,-44 L13,-37 L-7,-37 Z" fill="#a83a18"/>
    <!-- Eyes alert (watching gap). -->
    <ellipse cx="0" cy="-39" rx="1.2" ry="0.8" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.2" ry="0.8" fill="#dce4f0"/>
    <ellipse cx="2" cy="-39" rx="0.6" ry="0.6" fill="#1a0808"/>
    <ellipse cx="8" cy="-39" rx="0.6" ry="0.6" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.5"/>
  </g>

  <!-- SABLE leaning against brick wall near entrance, eyes half-closed. -->
  <g id="p19p4-sable" transform="translate(155, 305)">
    <path d="M-13,55 L-15,15 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,15 L13,55 Z" fill="url(#p19p4silverDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M13,-12 L20,-2 L22,15 L20,30" fill="url(#p19p4silverDirty)" stroke="#080404" stroke-width="0.4"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p19p4bloom)"><path d="M16,-5 L20,8"/></g>
    <ellipse cx="0" cy="-25" rx="8" ry="2" fill="#dce4f0" opacity="0.65" filter="url(#p19p4bloom)"/>
    <!-- Head TILTED back against brick. -->
    <ellipse cx="0" cy="-37" rx="9" ry="9" fill="#3a2818"/>
    <!-- Silver-white buzz. -->
    <path d="M-9,-44 Q0,-48 9,-44 L9,-37 L-9,-37 Z" fill="#dce4f0"/>
    <!-- EYES HALF-CLOSED. -->
    <ellipse cx="-3" cy="-38" rx="1.4" ry="0.6" fill="#dce4f0"/>
    <ellipse cx="3" cy="-38" rx="1.4" ry="0.6" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-37" rx="0.6" ry="0.4" fill="#1a0808"/>
    <ellipse cx="3" cy="-37" rx="0.6" ry="0.4" fill="#1a0808"/>
    <line x1="-2" y1="-30" x2="3" y2="-30" stroke="#3a1810" stroke-width="0.5"/>
  </g>

  <!-- CAPTIONS — bottom of frame. -->
  <g id="p19p4-cap1">
    <rect x="14" y="14" width="380" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="24" y="36" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">Tomorrow they would begin stealing the future from the past.</text>
  </g>
  <g id="p19p4-cap2">
    <rect x="404" y="14" width="324" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="414" y="36" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">Tonight they slept in a wall and called it home.</text>
  </g>

  <!-- Meta. -->
  <g id="p19p4-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">4</text>
    <text x="738" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">FIRST NIGHT</text>
  </g>
</svg>
