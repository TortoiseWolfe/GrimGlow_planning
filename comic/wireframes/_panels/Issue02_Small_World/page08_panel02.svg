<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 320" width="175" height="320">
  <title>Issue 2 — Page 8 — Panel 2: Ravine — Sable + Thresh wedged, cat eye fills opening</title>
  <desc>CU 85mm extreme low angle from inside ravine between two cobblestones. Sable and Thresh pressed against granite walls of gap, rain pooling boots. Above them cat's massive head swings overhead — single amber eye fills opening, vertical slit pupil, looking down. Dark sheltered gap. Only light: cat eye amber + faint silver/crimson holo accents. SABLE whisper don't move don't breathe.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p2dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p8p2granite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e34"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <radialGradient id="p8p2catEye">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f5b860" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="p8p2eyeAmber">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p8p2silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8b0bc"/>
      <stop offset="100%" stop-color="#3a4048"/>
    </linearGradient>
    <linearGradient id="p8p2ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <filter id="p8p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p8p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG — dark ravine interior. -->
  <rect width="175" height="320" fill="url(#p8p2dark)"/>

  <!-- AMBER EYE GLOW filling upper opening. -->
  <ellipse cx="87" cy="50" rx="120" ry="80" fill="url(#p8p2eyeAmber)" filter="url(#p8p2strongBloom)" opacity="0.85"/>

  <!-- LEFT GRANITE WALL — vertical. -->
  <path d="M0,0 L40,0 L48,80 L46,150 L50,220 L48,320 L0,320 Z" fill="url(#p8p2granite)" stroke="#080404" stroke-width="0.8"/>
  <!-- Wall texture. -->
  <g stroke="#5a606a" stroke-width="0.5" opacity="0.55">
    <line x1="10" y1="40" x2="44" y2="50"/>
    <line x1="14" y1="80" x2="46" y2="90"/>
    <line x1="12" y1="120" x2="48" y2="130"/>
    <line x1="16" y1="160" x2="48" y2="170"/>
    <line x1="14" y1="200" x2="50" y2="210"/>
    <line x1="12" y1="240" x2="48" y2="250"/>
    <line x1="16" y1="280" x2="48" y2="290"/>
  </g>

  <!-- RIGHT GRANITE WALL — vertical. -->
  <path d="M175,0 L135,0 L128,80 L130,150 L126,220 L128,320 L175,320 Z" fill="url(#p8p2granite)" stroke="#080404" stroke-width="0.8"/>
  <g stroke="#5a606a" stroke-width="0.5" opacity="0.55">
    <line x1="165" y1="40" x2="132" y2="50"/>
    <line x1="161" y1="80" x2="130" y2="90"/>
    <line x1="163" y1="120" x2="128" y2="130"/>
    <line x1="159" y1="160" x2="128" y2="170"/>
    <line x1="161" y1="200" x2="126" y2="210"/>
    <line x1="163" y1="240" x2="128" y2="250"/>
    <line x1="159" y1="280" x2="128" y2="290"/>
  </g>

  <!-- CAT EYE — fills opening above. Massive amber w/ vertical slit. -->
  <g id="p8p2-cat-eye">
    <!-- Eye lens overall. -->
    <ellipse cx="87" cy="50" rx="50" ry="40" fill="url(#p8p2catEye)"/>
    <!-- Outer rim. -->
    <ellipse cx="87" cy="50" rx="50" ry="40" fill="none" stroke="#1a0e08" stroke-width="2"/>
    <!-- Vertical slit pupil massive. -->
    <ellipse cx="87" cy="50" rx="5" ry="35" fill="#1a0408"/>
    <!-- Catch-light. -->
    <ellipse cx="80" cy="38" rx="4" ry="6" fill="#ffe8a0" opacity="0.95" filter="url(#p8p2bloom)"/>
    <!-- Brow line above. -->
    <path d="M30,15 Q87,5 144,15" stroke="#1a0e08" stroke-width="2.5" fill="none"/>
    <!-- Fur stippling around eye. -->
    <g fill="#1a0e08" opacity="0.85">
      <line x1="42" y1="70" x2="48" y2="78" stroke="#1a0e08" stroke-width="0.5"/>
      <line x1="60" y1="80" x2="66" y2="88" stroke="#1a0e08" stroke-width="0.5"/>
      <line x1="100" y1="82" x2="106" y2="90" stroke="#1a0e08" stroke-width="0.5"/>
      <line x1="120" y1="78" x2="126" y2="86" stroke="#1a0e08" stroke-width="0.5"/>
    </g>
  </g>

  <!-- WATER POOLING at boots. -->
  <g fill="#0a0e14" opacity="0.85">
    <ellipse cx="87" cy="305" rx="44" ry="6"/>
  </g>
  <g fill="#5a606a" opacity="0.55" filter="url(#p8p2bloom)">
    <ellipse cx="87" cy="303" rx="40" ry="3"/>
  </g>

  <!-- SABLE — pressed against left wall. -->
  <g id="p8p2-sable" transform="translate(70, 220)">
    <!-- Body. -->
    <path d="M-15,80 L-18,30 L-15,-10 L-8,-25 L8,-25 L12,-10 L15,30 L12,80 Z" fill="url(#p8p2silver)" stroke="#080404" stroke-width="0.6"/>
    <!-- CRACKED RIGHT SHOULDER (continuity). -->
    <path d="M12,-8 L20,2 L22,18 L18,28" fill="url(#p8p2silver)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.95" filter="url(#p8p2bloom)">
      <path d="M14,0 L18,10 L16,20"/>
      <path d="M16,8 L20,16"/>
    </g>
    <!-- Silver collar accent. -->
    <ellipse cx="0" cy="-25" rx="8" ry="2" fill="#dce4f0" opacity="0.65" filter="url(#p8p2bloom)"/>
    <!-- ARM across Thresh. -->
    <path d="M14,5 L40,-2 L48,2 L40,15 L14,12 Z" fill="url(#p8p2silver)" stroke="#080404" stroke-width="0.5"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-38" rx="10" ry="11" fill="#3a2818"/>
    <!-- Silver-white buzz. -->
    <path d="M-9,-46 Q0,-50 9,-46 L9,-38 L-9,-38 Z" fill="#dce4f0"/>
    <!-- Eyes locked upward. -->
    <ellipse cx="-3" cy="-40" rx="1.5" ry="1.2" fill="#dce4f0"/>
    <ellipse cx="3" cy="-40" rx="1.5" ry="1.2" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-41" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-41" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Lips pressed. -->
    <line x1="-3" y1="-32" x2="3" y2="-32" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- THRESH — wedged against right wall. -->
  <g id="p8p2-thresh" transform="translate(105, 225)">
    <!-- Body. -->
    <path d="M-15,75 L-18,28 L-15,-12 L-8,-26 L8,-26 L12,-12 L15,28 L12,75 Z" fill="url(#p8p2ruby)" stroke="#080404" stroke-width="0.6"/>
    <!-- DENTED LEFT PAULDRON (continuity). -->
    <path d="M-15,-10 L-22,0 L-22,18 L-15,22" fill="url(#p8p2ruby)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-19,6 Q-17,12 -16,8 Z" fill="#3a0810"/>
    <!-- Crimson collar pulse. -->
    <ellipse cx="0" cy="-26" rx="8" ry="2" fill="#f54848" opacity="0.95" filter="url(#p8p2bloom)"/>
    <!-- WEAPON CLUTCHED to chest. -->
    <rect x="-12" y="0" width="24" height="6" rx="0.7" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <circle cx="0" cy="3" r="1.2" fill="#c84038" opacity="0.65" filter="url(#p8p2bloom)"/>
    <!-- HANDS clutching weapon. -->
    <ellipse cx="-10" cy="3" rx="4" ry="2.5" fill="#d8a880" stroke="#080408" stroke-width="0.4"/>
    <ellipse cx="10" cy="3" rx="4" ry="2.5" fill="#d8a880" stroke="#080408" stroke-width="0.4"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-40" rx="10" ry="11" fill="#d8a880"/>
    <!-- Buzz. -->
    <path d="M-9,-48 Q0,-52 9,-48 L9,-40 L-9,-40 Z" fill="#a83a18"/>
    <!-- Eyes wide. -->
    <ellipse cx="-3" cy="-42" rx="1.8" ry="1.4" fill="#dce4f0"/>
    <ellipse cx="3" cy="-42" rx="1.8" ry="1.4" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-43" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-43" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Jaw locked. -->
    <line x1="-4" y1="-34" x2="4" y2="-34" stroke="#3a1810" stroke-width="1"/>
  </g>

  <!-- DIALOGUE — SABLE whisper, lower middle. -->
  <g id="p8p2-bal-sable">
    <rect x="6" y="240" width="164" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="16" y="260" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="62" y="260" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a4a30">(whisper)</text>
    <text x="16" y="278" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Don't move. Don't breathe.</text>
  </g>

  <!-- Meta. -->
  <g id="p8p2-meta">
    <text x="167" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="171" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">RAVINE</text>
  </g>
</svg>
