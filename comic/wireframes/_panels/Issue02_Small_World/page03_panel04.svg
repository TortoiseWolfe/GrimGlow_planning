<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 400" width="366" height="400">
  <title>Issue 2 — Page 3 — Panel 4: Sable beckons — Jink/Luma running through flooding gutter</title>
  <desc>MS rack focus. FG SHARP Sable's HAND beckoning urgent (silver sleeve speckled w/ rain spots). BG sharp Jink + Luma running through thin water sheet on gutter floor. Raindrop impact between them sends up wall of spray catching their emerald + sapphire holo glows. Water on floor reflects leaden sky. SABLE: "Jink. Luma. Move."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p3p4leaden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="p3p4leadWet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="p3p4silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a8b4"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="p3p4splatter">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#dce4f0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8b8c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p3p4emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4828"/>
    </linearGradient>
    <linearGradient id="p3p4sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#1a1058"/>
    </linearGradient>
    <filter id="p3p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="p3p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p3p4dofBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <!-- BG sky leaden grey. -->
  <rect width="366" height="220" fill="url(#p3p4leaden)"/>

  <!-- BG raindrops descending streaks. -->
  <g stroke="#a8b8c8" stroke-width="0.8" opacity="0.55" filter="url(#p3p4bloom)">
    <line x1="40" y1="20" x2="40" y2="60"/>
    <line x1="100" y1="40" x2="100" y2="80"/>
    <line x1="180" y1="20" x2="180" y2="55"/>
    <line x1="260" y1="35" x2="260" y2="70"/>
    <line x1="320" y1="20" x2="320" y2="50"/>
  </g>

  <!-- BG GUTTER WALLS rising either side (slight). -->
  <g id="p3p4-gutter-walls">
    <path d="M0,180 L50,200 L50,400 L0,400 Z" fill="#1a1820"/>
    <path d="M366,180 L316,200 L316,400 L366,400 Z" fill="#1a1820"/>
  </g>

  <!-- BG GUTTER FLOOR — wet, water sheet (script-specific: thin sheet of water). -->
  <g id="p3p4-gutter-floor">
    <rect x="50" y="200" width="266" height="200" fill="url(#p3p4leadWet)"/>
    <!-- Water reflection of leaden sky. -->
    <rect x="50" y="220" width="266" height="40" fill="#5a606a" opacity="0.45" filter="url(#p3p4bloom)"/>
    <!-- Subtle wet shimmer. -->
    <line x1="50" y1="280" x2="316" y2="280" stroke="#7a7e88" stroke-width="0.5" opacity="0.55"/>
    <line x1="50" y1="320" x2="316" y2="320" stroke="#7a7e88" stroke-width="0.5" opacity="0.55"/>
  </g>

  <!-- BG JINK + LUMA running through gutter (slightly soft per rack focus, but readable). -->
  <g filter="url(#p3p4dofBlur)">

    <!-- JINK running (left of impact). -->
    <g id="p3p4-jink-bg" transform="translate(120, 280)">
      <ellipse cx="0" cy="0" rx="13" ry="20" fill="url(#p3p4emerald)" stroke="#080408" stroke-width="0.4" transform="rotate(8)"/>
      <ellipse cx="0" cy="0" rx="16" ry="24" fill="#7af0b0" opacity="0.55" filter="url(#p3p4bloom)" transform="rotate(8)"/>
      <!-- Head turned looking forward. -->
      <ellipse cx="2" cy="-20" rx="6" ry="7" fill="#e8c8a0" transform="rotate(8)"/>
      <!-- Wild curls. -->
      <g fill="#f5d860" transform="rotate(8)">
        <circle cx="-3" cy="-26" r="2.2"/>
        <circle cx="0" cy="-28" r="2.5"/>
        <circle cx="3" cy="-26" r="2.2"/>
      </g>
      <!-- Eyes head-up watching drops. -->
      <ellipse cx="0" cy="-20" rx="1.2" ry="0.7" fill="#080404" transform="rotate(8)"/>
      <ellipse cx="4" cy="-20" rx="1.2" ry="0.7" fill="#080404" transform="rotate(8)"/>
      <!-- Running legs (one extended forward). -->
      <line x1="-3" y1="20" x2="-8" y2="32" stroke="#0a4828" stroke-width="3.5" stroke-linecap="round" transform="rotate(8)"/>
      <line x1="3" y1="20" x2="8" y2="34" stroke="#0a4828" stroke-width="3.5" stroke-linecap="round" transform="rotate(8)"/>
      <!-- Arms pumping. -->
      <line x1="-12" y1="-2" x2="-18" y2="-12" stroke="#0a4828" stroke-width="3" stroke-linecap="round" transform="rotate(8)"/>
      <line x1="12" y1="-2" x2="18" y2="2" stroke="#0a4828" stroke-width="3" stroke-linecap="round" transform="rotate(8)"/>
      <!-- Splash water at feet. -->
      <ellipse cx="0" cy="36" rx="14" ry="3" fill="#a8b8c8" opacity="0.7" filter="url(#p3p4bloom)"/>
    </g>

    <!-- LUMA running (right of impact). -->
    <g id="p3p4-luma-bg" transform="translate(260, 285)">
      <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#p3p4sapphire)" stroke="#080408" stroke-width="0.4" transform="rotate(-5)"/>
      <ellipse cx="0" cy="0" rx="15" ry="22" fill="#a890f0" opacity="0.55" filter="url(#p3p4bloom)" transform="rotate(-5)"/>
      <!-- Head bent forward. -->
      <ellipse cx="-2" cy="-18" rx="6" ry="7" fill="#a87850" transform="rotate(-5)"/>
      <!-- Hair w/ braid + filament. -->
      <path d="M-5,-22 Q0,-25 5,-22 L5,-18 L-5,-18 Z" fill="#1a1018" transform="rotate(-5)"/>
      <path d="M5,-18 Q7,-10 6,-2" stroke="#1a1018" stroke-width="1.5" fill="none" stroke-linecap="round" transform="rotate(-5)"/>
      <path d="M5,-18 Q7,-10 6,-2" stroke="#a890f0" stroke-width="0.4" fill="none" filter="url(#p3p4bloom)" opacity="0.85" transform="rotate(-5)"/>
      <!-- Lens glints. -->
      <ellipse cx="-3" cy="-18" rx="1.2" ry="0.8" fill="#a890f0" opacity="0.85" transform="rotate(-5)"/>
      <ellipse cx="3" cy="-18" rx="1.2" ry="0.8" fill="#a890f0" opacity="0.55" transform="rotate(-5)"/>
      <line x1="2" y1="-19" x2="4" y2="-17" stroke="#080408" stroke-width="0.3" transform="rotate(-5)"/>
      <!-- Arms shielding scanner -->
      <line x1="-12" y1="-2" x2="-16" y2="-10" stroke="#1a1058" stroke-width="3" stroke-linecap="round" transform="rotate(-5)"/>
      <line x1="12" y1="-2" x2="16" y2="-10" stroke="#1a1058" stroke-width="3" stroke-linecap="round" transform="rotate(-5)"/>
      <!-- Scanner tucked under arm (faint glow). -->
      <ellipse cx="0" cy="-8" rx="6" ry="3" fill="#a890f0" opacity="0.7" filter="url(#p3p4bloom)" transform="rotate(-5)"/>
      <!-- Running legs. -->
      <line x1="-3" y1="18" x2="-8" y2="30" stroke="#1a1058" stroke-width="3.5" stroke-linecap="round" transform="rotate(-5)"/>
      <line x1="3" y1="18" x2="8" y2="32" stroke="#1a1058" stroke-width="3.5" stroke-linecap="round" transform="rotate(-5)"/>
      <!-- Splash water. -->
      <ellipse cx="0" cy="34" rx="14" ry="3" fill="#a8b8c8" opacity="0.7" filter="url(#p3p4bloom)"/>
    </g>

  </g>

  <!-- RAINDROP IMPACT BETWEEN THEM (script-specific: wall of spray). -->
  <g id="p3p4-impact" filter="url(#p3p4bloom)">
    <!-- Crater on lead. -->
    <ellipse cx="190" cy="290" rx="34" ry="9" fill="#a8b8c8" opacity="0.85"/>
    <!-- WALL of spray (script-specific). -->
    <ellipse cx="190" cy="240" rx="26" ry="55" fill="url(#p3p4splatter)" filter="url(#p3p4strongBloom)" opacity="0.85"/>
    <!-- Spray droplets. -->
    <g fill="#ffffff">
      <circle cx="180" cy="220" r="1.4"/>
      <circle cx="195" cy="200" r="1.6"/>
      <circle cx="190" cy="180" r="1.4"/>
      <circle cx="200" cy="160" r="1.2"/>
      <circle cx="183" cy="240" r="1.4"/>
      <circle cx="200" cy="245" r="1.4"/>
      <circle cx="175" cy="260" r="1.4"/>
      <circle cx="205" cy="265" r="1.4"/>
      <circle cx="172" cy="275" r="1.2"/>
      <circle cx="208" cy="275" r="1.2"/>
    </g>
    <!-- Spray catches EMERALD + SAPPHIRE holo glow (script-specific). -->
    <ellipse cx="190" cy="245" rx="22" ry="40" fill="#7af0b0" opacity="0.4" filter="url(#p3p4strongBloom)"/>
    <ellipse cx="190" cy="245" rx="20" ry="40" fill="#a890f0" opacity="0.4" filter="url(#p3p4strongBloom)"/>
  </g>

  <!-- FG SHARP — SABLE'S HAND beckoning urgent (script-specific). Large foreground hand. -->
  <g id="p3p4-sable-hand" transform="translate(280, 220)">

    <!-- Forearm in silver sleeve. -->
    <path d="M50,100 L70,80 L84,55 L92,30 L94,5" fill="none" stroke="url(#p3p4silver)" stroke-width="36" stroke-linecap="round"/>
    <!-- Suit edge highlight. -->
    <line x1="56" y1="95" x2="98" y2="10" stroke="#dce4ff" stroke-width="0.7" opacity="0.7" filter="url(#p3p4bloom)"/>
    <!-- WATER SPOTS speckled (script-specific). -->
    <g fill="#080a14" opacity="0.65">
      <circle cx="65" cy="80" r="2"/>
      <circle cx="75" cy="60" r="2.5"/>
      <circle cx="85" cy="40" r="2.2"/>
      <circle cx="90" cy="20" r="2"/>
      <circle cx="58" cy="92" r="1.6"/>
      <circle cx="70" cy="70" r="1.6"/>
      <circle cx="80" cy="50" r="1.6"/>
    </g>
    <!-- Water bead highlights. -->
    <g fill="#7af0ff" opacity="0.55" filter="url(#p3p4bloom)">
      <circle cx="65" cy="80" r="0.8"/>
      <circle cx="75" cy="60" r="1"/>
      <circle cx="85" cy="40" r="0.9"/>
    </g>
    <!-- Suit cuff (narrow band where wrist meets glove). -->
    <ellipse cx="92" cy="0" rx="22" ry="6" fill="#3a3a45" stroke="#080408" stroke-width="0.6" transform="rotate(-30 92 0)"/>

    <!-- HAND beckoning gesture (palm facing camera, fingers curling inward). -->
    <g transform="translate(80, -10)">
      <!-- Palm. -->
      <path d="M-22,-30 Q-30,-50 -10,-60 Q10,-65 25,-55 Q35,-40 30,-20 Q22,-5 0,-2 Q-15,-8 -22,-30 Z" fill="#5a3818" stroke="#080408" stroke-width="0.7"/>

      <!-- Fingers curled in beckoning pose. -->
      <!-- Index finger curling. -->
      <path d="M5,-58 Q15,-70 25,-65 Q30,-55 22,-50" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>
      <!-- Middle finger curled. -->
      <path d="M-2,-62 Q5,-72 15,-70 Q22,-65 18,-58" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>
      <!-- Ring + pinky curled tighter. -->
      <path d="M-12,-58 Q-5,-66 5,-64 Q12,-58 8,-52" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>
      <path d="M-18,-50 Q-12,-56 -3,-54 Q3,-50 0,-44" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>

      <!-- Thumb extended. -->
      <path d="M-22,-30 Q-32,-22 -34,-14 Q-30,-8 -24,-12" fill="#5a3818" stroke="#080408" stroke-width="0.5"/>

      <!-- Palm shadow + crease lines. -->
      <path d="M-12,-32 Q0,-30 18,-32" stroke="#3a1810" stroke-width="0.5" fill="none" opacity="0.85"/>
      <path d="M-15,-22 Q0,-18 15,-22" stroke="#3a1810" stroke-width="0.5" fill="none" opacity="0.85"/>
      <path d="M-10,-12 Q0,-10 12,-12" stroke="#3a1810" stroke-width="0.4" fill="none" opacity="0.7"/>

      <!-- Knuckle definition. -->
      <ellipse cx="20" cy="-50" rx="2" ry="1.5" fill="#3a1810" opacity="0.55"/>
      <ellipse cx="13" cy="-58" rx="2" ry="1.5" fill="#3a1810" opacity="0.55"/>
      <ellipse cx="3" cy="-58" rx="2" ry="1.5" fill="#3a1810" opacity="0.55"/>
      <ellipse cx="-8" cy="-52" rx="2" ry="1.5" fill="#3a1810" opacity="0.55"/>

      <!-- Skin highlight on palm (catching grey light). -->
      <ellipse cx="0" cy="-30" rx="14" ry="6" fill="#a87850" opacity="0.45"/>
    </g>
  </g>

  <!-- SABLE dialogue. -->
  <g id="p3p4-dlg-sable">
    <rect x="14" y="14" width="200" height="44" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="33" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a1a1a">Jink. Luma. Move.</text>
    <path d="M118,58 L136,58 L260,210 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="118" y1="58" x2="136" y2="58" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta tag. -->
  <g id="p3p4-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">4</text>
    <text x="362" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">SABLE BECKONS</text>
  </g>
</svg>
