<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 13 — Panel 2: Technical autopsy — 4 system close-ups composite</title>
  <desc>Wide composite 85mm equiv each sub-frame. 4 connected close-up views of holographic ship schematic in copper-gold geometric light. Sub-1: drive core sphere inside geometric cage GREEN intact but dark. Sub-2: drive assembly ring structure RED shattered. Sub-3: navigation array antenna RED with dashed outline missing. Sub-4: comms array RED similarly absent. In each Wren copper hand pointing oil-stained fingers precise against holographic light. WREN walking through 4 systems sub-frame by sub-frame.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p13p2copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <radialGradient id="p13p2copperGlow">
      <stop offset="0%" stop-color="#f0d878" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p13p2green">
      <stop offset="0%" stop-color="#7af0b0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p13p2red">
      <stop offset="0%" stop-color="#f54848" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a0810" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p13p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p13p2deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- BG dark. -->
  <rect width="742" height="340" fill="url(#p13p2bg)"/>

  <!-- 4 SUB-FRAME DIVIDERS. Vertical divider lines at 185, 371, 557. -->
  <g stroke="#3a3a44" stroke-width="0.85">
    <line x1="185" y1="0" x2="185" y2="340"/>
    <line x1="371" y1="0" x2="371" y2="340"/>
    <line x1="557" y1="0" x2="557" y2="340"/>
  </g>

  <!-- SUB-FRAME 1: TEMPORAL DRIVE CORE — GREEN intact. -->
  <g id="p13p2-sub1" transform="translate(92, 0)">
    <!-- Subtitle. -->
    <text x="0" y="28" text-anchor="middle" font-family="Courier, monospace" font-size="10" font-weight="700" fill="#f0d878" opacity="0.95">DRIVE CORE</text>
    <!-- Geometric cage around core. -->
    <g stroke="#f0d878" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#p13p2bloom)">
      <!-- Outer cage hexagonal frame. -->
      <path d="M-50,140 L-40,100 L0,90 L40,100 L50,140 L40,180 L0,190 L-40,180 Z"/>
      <line x1="-40" y1="100" x2="40" y2="180"/>
      <line x1="40" y1="100" x2="-40" y2="180"/>
      <!-- Inner cage. -->
      <path d="M-30,140 L-22,110 L0,105 L22,110 L30,140 L22,170 L0,175 L-22,170 Z"/>
    </g>
    <!-- Core sphere — GREEN intact glow. -->
    <circle cx="0" cy="140" r="18" fill="url(#p13p2green)" filter="url(#p13p2strongBloom)" opacity="0.95"/>
    <circle cx="0" cy="140" r="10" fill="#7af0b0" opacity="0.95" filter="url(#p13p2bloom)"/>
    <circle cx="0" cy="140" r="4" fill="#dce4f0" opacity="0.95" filter="url(#p13p2bloom)"/>
    <!-- Status text. -->
    <text x="0" y="220" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#7af0b0" opacity="0.95">INTACT</text>
    <text x="0" y="232" text-anchor="middle" font-family="Courier, monospace" font-size="6" fill="#7af0b0" opacity="0.85">but inert</text>
    <!-- Wren's hand pointing at core. -->
    <g transform="translate(50, 250)">
      <ellipse cx="0" cy="0" rx="8" ry="14" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.5"/>
      <path d="M-3,-12 L-3,-22 L0,-26 L3,-22 L3,-12 Z" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.4"/>
      <ellipse cx="0" cy="-26" rx="2" ry="3" fill="#e0c098" stroke="#3a1808" stroke-width="0.3"/>
      <!-- Fingertip glow. -->
      <circle cx="0" cy="-28" r="1.4" fill="#f0d878" opacity="0.95" filter="url(#p13p2bloom)"/>
      <!-- Oil stains. -->
      <ellipse cx="-5" cy="0" rx="2" ry="1" fill="#1a0808" opacity="0.85"/>
    </g>
  </g>

  <!-- SUB-FRAME 2: DRIVE ASSEMBLY — RED shattered. -->
  <g id="p13p2-sub2" transform="translate(278, 0)">
    <text x="0" y="28" text-anchor="middle" font-family="Courier, monospace" font-size="10" font-weight="700" fill="#f0d878" opacity="0.95">DRIVE ASSEMBLY</text>
    <!-- Outer ring (intact). -->
    <ellipse cx="0" cy="140" rx="50" ry="40" fill="none" stroke="#f0d878" stroke-width="0.85" opacity="0.65" stroke-dasharray="3,2" filter="url(#p13p2bloom)"/>
    <!-- Shattered ring (red). -->
    <g stroke="#f54848" stroke-width="1.2" fill="none" opacity="0.95" filter="url(#p13p2bloom)">
      <path d="M-50,140 L-40,118 L-30,138"/>
      <path d="M-30,138 L-15,114"/>
      <path d="M-15,114 L0,140"/>
      <path d="M0,140 L18,116"/>
      <path d="M18,116 L35,140"/>
      <path d="M35,140 L50,118"/>
      <path d="M-45,160 L-30,144"/>
      <path d="M-30,144 L-12,166"/>
      <path d="M-12,166 L8,142"/>
      <path d="M8,142 L25,164"/>
      <path d="M25,164 L42,148"/>
    </g>
    <!-- Red wash glow. -->
    <ellipse cx="0" cy="140" rx="60" ry="50" fill="url(#p13p2red)" filter="url(#p13p2deepBloom)" opacity="0.55"/>
    <!-- Status text. -->
    <text x="0" y="220" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#f54848" opacity="0.95">DESTROYED</text>
    <text x="0" y="232" text-anchor="middle" font-family="Courier, monospace" font-size="6" fill="#f54848" opacity="0.85">on impact</text>
    <!-- Wren hand. -->
    <g transform="translate(50, 250)">
      <ellipse cx="0" cy="0" rx="8" ry="14" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.5"/>
      <path d="M-3,-12 L-3,-22 L0,-26 L3,-22 L3,-12 Z" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.4"/>
      <ellipse cx="0" cy="-26" rx="2" ry="3" fill="#e0c098" stroke="#3a1808" stroke-width="0.3"/>
      <circle cx="0" cy="-28" r="1.4" fill="#f54848" opacity="0.95" filter="url(#p13p2bloom)"/>
      <ellipse cx="-5" cy="0" rx="2" ry="1" fill="#1a0808" opacity="0.85"/>
    </g>
  </g>

  <!-- SUB-FRAME 3: NAVIGATION ARRAY — RED missing/dashed. -->
  <g id="p13p2-sub3" transform="translate(464, 0)">
    <text x="0" y="28" text-anchor="middle" font-family="Courier, monospace" font-size="10" font-weight="700" fill="#f0d878" opacity="0.95">NAVIGATION</text>
    <!-- Antenna structure outline (dashed = absent). -->
    <g stroke="#f54848" stroke-width="0.85" fill="none" stroke-dasharray="3,3" opacity="0.85" filter="url(#p13p2bloom)">
      <line x1="0" y1="180" x2="0" y2="100"/>
      <line x1="-30" y1="120" x2="30" y2="120"/>
      <line x1="-25" y1="140" x2="25" y2="140"/>
      <line x1="-20" y1="160" x2="20" y2="160"/>
      <line x1="-30" y1="120" x2="-30" y2="100"/>
      <line x1="30" y1="120" x2="30" y2="100"/>
      <!-- Hex top. -->
      <path d="M-8,95 L0,90 L8,95 L8,105 L0,110 L-8,105 Z"/>
    </g>
    <!-- Empty space marker (where it WAS). -->
    <rect x="-40" y="90" width="80" height="100" fill="none" stroke="#f54848" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.55"/>
    <text x="0" y="220" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#f54848" opacity="0.95">GONE</text>
    <text x="0" y="232" text-anchor="middle" font-family="Courier, monospace" font-size="6" fill="#f54848" opacity="0.85">not found</text>
    <!-- Red wash. -->
    <ellipse cx="0" cy="140" rx="60" ry="60" fill="url(#p13p2red)" filter="url(#p13p2deepBloom)" opacity="0.55"/>
    <!-- Wren hand. -->
    <g transform="translate(50, 250)">
      <ellipse cx="0" cy="0" rx="8" ry="14" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.5"/>
      <path d="M-3,-12 L-3,-22 L0,-26 L3,-22 L3,-12 Z" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.4"/>
      <ellipse cx="0" cy="-26" rx="2" ry="3" fill="#e0c098" stroke="#3a1808" stroke-width="0.3"/>
      <circle cx="0" cy="-28" r="1.4" fill="#f54848" opacity="0.95" filter="url(#p13p2bloom)"/>
      <ellipse cx="-5" cy="0" rx="2" ry="1" fill="#1a0808" opacity="0.85"/>
    </g>
  </g>

  <!-- SUB-FRAME 4: COMMS ARRAY — RED also missing. -->
  <g id="p13p2-sub4" transform="translate(650, 0)">
    <text x="0" y="28" text-anchor="middle" font-family="Courier, monospace" font-size="10" font-weight="700" fill="#f0d878" opacity="0.95">COMMS</text>
    <!-- Comms dish outline (dashed = absent). -->
    <g stroke="#f54848" stroke-width="0.85" fill="none" stroke-dasharray="3,3" opacity="0.85" filter="url(#p13p2bloom)">
      <ellipse cx="0" cy="130" rx="40" ry="14"/>
      <ellipse cx="0" cy="130" rx="30" ry="10"/>
      <ellipse cx="0" cy="130" rx="20" ry="6"/>
      <line x1="0" y1="130" x2="0" y2="180"/>
      <line x1="-40" y1="130" x2="-40" y2="135"/>
      <line x1="40" y1="130" x2="40" y2="135"/>
    </g>
    <rect x="-50" y="115" width="100" height="80" fill="none" stroke="#f54848" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.55"/>
    <text x="0" y="220" text-anchor="middle" font-family="Courier, monospace" font-size="8" font-weight="700" fill="#f54848" opacity="0.95">GONE</text>
    <text x="0" y="232" text-anchor="middle" font-family="Courier, monospace" font-size="6" fill="#f54848" opacity="0.85">no signal out</text>
    <ellipse cx="0" cy="140" rx="60" ry="55" fill="url(#p13p2red)" filter="url(#p13p2deepBloom)" opacity="0.55"/>
    <!-- Wren hand. -->
    <g transform="translate(40, 250)">
      <ellipse cx="0" cy="0" rx="8" ry="14" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.5"/>
      <path d="M-3,-12 L-3,-22 L0,-26 L3,-22 L3,-12 Z" fill="url(#p13p2copperDirty)" stroke="#080404" stroke-width="0.4"/>
      <ellipse cx="0" cy="-26" rx="2" ry="3" fill="#e0c098" stroke="#3a1808" stroke-width="0.3"/>
      <circle cx="0" cy="-28" r="1.4" fill="#f54848" opacity="0.95" filter="url(#p13p2bloom)"/>
      <ellipse cx="-5" cy="0" rx="2" ry="1" fill="#1a0808" opacity="0.85"/>
    </g>
  </g>

  <!-- DIALOGUE — WREN narrative, lower band. -->
  <g id="p13p2-bal-wren-narrative">
    <rect x="14" y="290" width="714" height="40" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="68" y="308" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a4a30">(walking the schematic)</text>
    <text x="24" y="324" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Core: intact, inert. Drive assembly: shattered on impact. Nav: scattered, no fragments. Comms: gone — we're not calling anyone.</text>
  </g>

  <!-- Meta. -->
  <g id="p13p2-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">SYSTEM AUTOPSY</text>
  </g>
</svg>
