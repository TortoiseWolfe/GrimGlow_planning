<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 10 — Panel 2: Puddle-lake at fairy scale, squad debates route</title>
  <desc>MW 35mm fairy-scale eye level. Squad reaches flagstone pavement, massive puddle 6in across forms shallow depression — at fairy scale a dark lake opaque street grime, surface cratered raindrops. Wren frustrated arms half-raised, Sable assessing, Thresh scanning, Luma scientific interest, Jink landing wings dimming gesturing route. WREN we could wade not deep / LUMA bacterial load / SABLE around Jink how far / JINK twenty feet sheltered route alley.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p10p2flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="p10p2puddle">
      <stop offset="0%" stop-color="#3a3e48" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2a2e34" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080404" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="p10p2silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8b0bc"/>
      <stop offset="100%" stop-color="#3a4048"/>
    </linearGradient>
    <linearGradient id="p10p2copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e89548"/>
      <stop offset="100%" stop-color="#783818"/>
    </linearGradient>
    <linearGradient id="p10p2ruby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <linearGradient id="p10p2sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5af0"/>
      <stop offset="100%" stop-color="#3a1a78"/>
    </linearGradient>
    <linearGradient id="p10p2emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7af0b0"/>
      <stop offset="100%" stop-color="#0a4828"/>
    </linearGradient>
    <radialGradient id="p10p2wingDim">
      <stop offset="0%" stop-color="#7af0b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p10p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG sky. -->
  <rect width="366" height="120" fill="url(#p10p2sky)"/>

  <!-- Distant rain. -->
  <g stroke="#a8b8c8" stroke-width="0.5" opacity="0.55" filter="url(#p10p2bloom)">
    <line x1="40" y1="20" x2="38" y2="60"/>
    <line x1="120" y1="10" x2="118" y2="50"/>
    <line x1="200" y1="25" x2="198" y2="65"/>
    <line x1="280" y1="15" x2="278" y2="55"/>
    <line x1="60" y1="80" x2="58" y2="115"/>
    <line x1="240" y1="90" x2="238" y2="120"/>
    <line x1="320" y1="85" x2="318" y2="115"/>
  </g>

  <!-- FLAGSTONE PAVEMENT (smooth, larger plates than cobble). -->
  <g fill="url(#p10p2flag)" stroke="#1a1a20" stroke-width="0.85">
    <rect x="-10" y="120" width="200" height="80" rx="3"/>
    <rect x="194" y="120" width="186" height="80" rx="3"/>
    <rect x="-10" y="204" width="186" height="80" rx="3"/>
    <rect x="180" y="204" width="200" height="80" rx="3"/>
    <rect x="-10" y="288" width="200" height="40" rx="3"/>
    <rect x="194" y="288" width="186" height="40" rx="3"/>
  </g>
  <!-- Flagstone wet sheen. -->
  <g fill="#c0d0e0" opacity="0.45" filter="url(#p10p2bloom)">
    <ellipse cx="80" cy="125" rx="80" ry="3"/>
    <ellipse cx="280" cy="125" rx="80" ry="3"/>
    <ellipse cx="80" cy="208" rx="80" ry="3"/>
    <ellipse cx="280" cy="208" rx="80" ry="3"/>
  </g>

  <!-- PUDDLE — massive lake center-frame, opaque street grime. -->
  <g id="p10p2-puddle">
    <ellipse cx="183" cy="240" rx="120" ry="48" fill="url(#p10p2puddle)" stroke="#1a1a20" stroke-width="0.7"/>
    <!-- Sky reflection (mirror of grey). -->
    <ellipse cx="183" cy="232" rx="100" ry="14" fill="#5a606a" opacity="0.45" filter="url(#p10p2strongBloom)"/>
    <!-- Raindrop craters concentric. -->
    <g fill="none" stroke="#a8b8c8" stroke-width="0.6" opacity="0.85">
      <circle cx="120" cy="232" r="3"/>
      <circle cx="120" cy="232" r="6"/>
      <circle cx="170" cy="248" r="3"/>
      <circle cx="170" cy="248" r="6"/>
      <circle cx="220" cy="235" r="3"/>
      <circle cx="220" cy="235" r="6"/>
      <circle cx="265" cy="248" r="3"/>
      <circle cx="265" cy="248" r="5"/>
      <circle cx="145" cy="262" r="2.5"/>
      <circle cx="200" cy="265" r="2.5"/>
      <circle cx="250" cy="262" r="2.5"/>
    </g>
    <!-- Surface texture (grime). -->
    <g fill="#3a2818" opacity="0.65">
      <ellipse cx="100" cy="252" rx="6" ry="2"/>
      <ellipse cx="180" cy="270" rx="8" ry="2"/>
      <ellipse cx="240" cy="258" rx="6" ry="2"/>
    </g>
  </g>

  <!-- 5 SQUAD MEMBERS at edge of puddle. -->
  <!-- WREN frustrated arms half-raised — far left. -->
  <g id="p10p2-wren" transform="translate(40, 195)">
    <path d="M-9,28 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,28 Z" fill="url(#p10p2copper)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f0a868" opacity="0.65" filter="url(#p10p2bloom)"/>
    <g fill="#3a2010" opacity="0.85"><ellipse cx="-11" cy="6" rx="2" ry="1"/><ellipse cx="11" cy="8" rx="2" ry="1"/></g>
    <!-- Arms half-raised (frustration). -->
    <path d="M-9,-12 L-22,-22 L-19,-18 L-7,-8 Z" fill="url(#p10p2copper)" stroke="#080404" stroke-width="0.5"/>
    <path d="M9,-12 L22,-22 L19,-18 L7,-8 Z" fill="url(#p10p2copper)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="-22" cy="-22" rx="3" ry="2" fill="#e0c098" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="22" cy="-22" rx="3" ry="2" fill="#e0c098" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#e0c098"/>
    <ellipse cx="-1" cy="-46" rx="6" ry="4" fill="#1a0808"/>
    <line x1="-3" y1="-48" x2="2" y2="-45" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Frown. -->
    <path d="M-3,-30 Q0,-32 3,-30" stroke="#3a1810" stroke-width="0.7" fill="none"/>
  </g>

  <!-- SABLE assessing — center-left. -->
  <g id="p10p2-sable" transform="translate(98, 200)">
    <path d="M-9,28 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,28 Z" fill="url(#p10p2silver)" stroke="#080404" stroke-width="0.6"/>
    <path d="M9,-12 L14,-3 L16,10 L14,20" fill="url(#p10p2silver)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p10p2bloom)"><path d="M11,-5 L14,5"/></g>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#dce4f0" opacity="0.55" filter="url(#p10p2bloom)"/>
    <!-- Head turning to look at puddle. -->
    <ellipse cx="2" cy="-37" rx="9" ry="10" fill="#3a2818"/>
    <path d="M-7,-44 Q2,-49 11,-44 L11,-37 L-7,-37 Z" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="6" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-2" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- LUMA studying water — center. -->
  <g id="p10p2-luma" transform="translate(160, 198)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p10p2sapphire)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#a878f8" opacity="0.65" filter="url(#p10p2bloom)"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#a87850"/>
    <path d="M-7,-32 Q-13,-22 -12,-10 Q-11,2 -13,12" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <line x1="-9" y1="-28" x2="-12" y2="10" stroke="#a878f8" stroke-width="0.4" opacity="0.85" filter="url(#p10p2bloom)"/>
    <ellipse cx="3" cy="-37" rx="3.5" ry="2.5" fill="#a878f8" opacity="0.55" stroke="#a878f8" stroke-width="0.4"/>
    <line x1="3" y1="-37" x2="6" y2="-35" stroke="#dce4f0" stroke-width="0.3" opacity="0.85"/>
    <!-- Eyes looking down at water. -->
    <ellipse cx="0" cy="-36" rx="1.2" ry="0.8" fill="#dce4f0"/>
    <ellipse cx="0" cy="-36" rx="0.6" ry="0.6" fill="#1a0808"/>
    <line x1="-2" y1="-30" x2="3" y2="-30" stroke="#3a1810" stroke-width="0.5"/>
    <!-- Holographic data strip beside hand. -->
    <g fill="none" stroke="#a878f8" stroke-width="0.5" opacity="0.85" filter="url(#p10p2bloom)">
      <rect x="14" y="-2" width="14" height="2"/>
      <line x1="14" y1="2" x2="26" y2="2"/>
      <circle cx="20" cy="0" r="1.4"/>
    </g>
  </g>

  <!-- THRESH scanning surface — right. -->
  <g id="p10p2-thresh" transform="translate(220, 200)">
    <path d="M-11,28 L-13,3 L-11,-15 L-5,-25 L5,-25 L11,-15 L13,3 L11,28 Z" fill="url(#p10p2ruby)" stroke="#080404" stroke-width="0.6"/>
    <path d="M-11,-13 L-18,-3 L-18,12 L-11,18" fill="url(#p10p2ruby)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-15,2 Q-13,8 -12,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f54848" opacity="0.65" filter="url(#p10p2bloom)"/>
    <!-- Weapon held lateral scanning. -->
    <rect x="-8" y="-2" width="22" height="5" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="-4" cy="0" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8a880"/>
    <path d="M-9,-44 Q0,-49 9,-44 L9,-37 L-9,-37 Z" fill="#a83a18"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-1.5" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="4.5" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- JINK landing nearby — far right. -->
  <g id="p10p2-jink" transform="translate(290, 195)">
    <!-- Wings dimming during land. -->
    <ellipse cx="-12" cy="-12" rx="20" ry="7" fill="url(#p10p2wingDim)" stroke="#7af0b0" stroke-width="0.5" opacity="0.65" transform="rotate(20 -12 -12)" filter="url(#p10p2bloom)"/>
    <ellipse cx="12" cy="-12" rx="20" ry="7" fill="url(#p10p2wingDim)" stroke="#7af0b0" stroke-width="0.5" opacity="0.65" transform="rotate(-20 12 -12)" filter="url(#p10p2bloom)"/>
    <path d="M-9,28 L-11,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L11,3 L9,28 Z" fill="url(#p10p2emerald)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#7af0b0" opacity="0.85" filter="url(#p10p2bloom)"/>
    <!-- Pointing arm gesturing route. -->
    <path d="M9,-8 L28,-12 L30,-8 L11,-2 Z" fill="url(#p10p2emerald)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="32" cy="-10" rx="3" ry="2" fill="#d8b890" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8b890"/>
    <path d="M-9,-44 Q0,-49 9,-44 L9,-37 L-9,-37 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-4" cy="-46" r="1"/><circle cx="0" cy="-48" r="1"/><circle cx="4" cy="-46" r="1"/></g>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- DIALOGUE STACK -->
  <!-- WREN. -->
  <g id="p10p2-bal-wren">
    <rect x="14" y="14" width="220" height="40" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">We could wade. Not deep.</text>
  </g>
  <!-- LUMA. -->
  <g id="p10p2-bal-luma">
    <rect x="14" y="58" width="220" height="40" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="76" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="92" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Horse-traffic runoff. Bacterial—</text>
  </g>
  <!-- SABLE. -->
  <g id="p10p2-bal-sable">
    <rect x="244" y="14" width="110" height="60" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="254" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="254" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Around. Jink,</text>
    <text x="254" y="67" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">how far?</text>
  </g>
  <!-- JINK. -->
  <g id="p10p2-bal-jink">
    <rect x="244" y="78" width="110" height="60" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="254" y="96" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="254" y="114" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Twenty feet.</text>
    <text x="254" y="131" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Sheltered route.</text>
    <path d="M280,138 L294,138 L290,150 Z" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-linejoin="round"/>
    <line x1="280" y1="138" x2="294" y2="138" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p10p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">PUDDLE-LAKE</text>
  </g>
</svg>
