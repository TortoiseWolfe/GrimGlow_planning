<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 19 — Panel 3: Reverse from inside cavity, child's shoe fills frame</title>
  <desc>CU 85mm fairy scale from inside wall cavity looking out through gap. Blue-white holographic perimeter lines geometric patterns frame opening doorway alien light. Filling half visible space beyond gap: enormous sole child's shoe passing — worn leather scuffed hobnailed size of building four-inch scale. Mid-step momentary already moving. Beyond it amber-lit street: warm gaslight wet cobblestones vast glowing. Interior dark. Blue-white frame amber exterior monstrous shoe between. Scale contrast devastating — child's foot natural disaster. NO DIALOGUE.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p3interior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p19p3wallLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p19p3wallRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p19p3amberStreet">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f5b860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p3perimGlow">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19p3leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <filter id="p19p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p19p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p19p3deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark interior. -->
  <rect width="366" height="320" fill="url(#p19p3interior)"/>

  <!-- BRICK WALL framing left/right of gap (interior side). -->
  <rect x="0" y="0" width="100" height="320" fill="url(#p19p3wallLeft)"/>
  <rect x="266" y="0" width="100" height="320" fill="url(#p19p3wallRight)"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.85">
    <line x1="0" y1="40" x2="100" y2="40"/>
    <line x1="0" y1="80" x2="100" y2="80"/>
    <line x1="0" y1="120" x2="100" y2="120"/>
    <line x1="0" y1="160" x2="100" y2="160"/>
    <line x1="0" y1="200" x2="100" y2="200"/>
    <line x1="0" y1="240" x2="100" y2="240"/>
    <line x1="0" y1="280" x2="100" y2="280"/>
    <line x1="266" y1="40" x2="366" y2="40"/>
    <line x1="266" y1="80" x2="366" y2="80"/>
    <line x1="266" y1="120" x2="366" y2="120"/>
    <line x1="266" y1="160" x2="366" y2="160"/>
    <line x1="266" y1="200" x2="366" y2="200"/>
    <line x1="266" y1="240" x2="366" y2="240"/>
    <line x1="266" y1="280" x2="366" y2="280"/>
  </g>

  <!-- AMBER STREET visible through gap (background). -->
  <rect x="100" y="0" width="166" height="320" fill="url(#p19p3amberStreet)" opacity="0.95"/>
  <ellipse cx="183" cy="160" rx="120" ry="200" fill="url(#p19p3amberStreet)" filter="url(#p19p3deepBloom)" opacity="0.65"/>
  <!-- Cobblestones visible at lower portion. -->
  <g fill="#3a2818" stroke="#080404" stroke-width="0.4" opacity="0.85">
    <rect x="100" y="280" width="40" height="14" rx="2"/>
    <rect x="145" y="280" width="40" height="14" rx="2"/>
    <rect x="190" y="280" width="40" height="14" rx="2"/>
    <rect x="235" y="280" width="31" height="14" rx="2"/>
    <rect x="100" y="298" width="40" height="14" rx="2"/>
    <rect x="145" y="298" width="40" height="14" rx="2"/>
    <rect x="190" y="298" width="40" height="14" rx="2"/>
    <rect x="235" y="298" width="31" height="14" rx="2"/>
  </g>

  <!-- ENORMOUS CHILD'S SHOE filling half visible space. -->
  <g id="p19p3-shoe">
    <!-- Sole bottom (the bulk of the shoe — viewer is at ground level inside). -->
    <path d="M100,150 L266,140 L266,260 L100,250 Z" fill="url(#p19p3leather)" stroke="#080404" stroke-width="1.4"/>
    <!-- Shoe upper. -->
    <path d="M100,80 L266,70 L266,150 L100,160 Z" fill="url(#p19p3leather)" opacity="0.95" stroke="#080404" stroke-width="0.85"/>
    <!-- Sole edge. -->
    <line x1="100" y1="160" x2="266" y2="150" stroke="#080404" stroke-width="1.4"/>
    <line x1="100" y1="155" x2="266" y2="145" stroke="#5a3a18" stroke-width="0.85" opacity="0.85"/>

    <!-- HOBNAILS — array on sole. -->
    <g fill="#3a3a44" stroke="#080404" stroke-width="0.4">
      <circle cx="120" cy="180" r="2.5"/>
      <circle cx="148" cy="178" r="2.5"/>
      <circle cx="176" cy="176" r="2.5"/>
      <circle cx="204" cy="174" r="2.5"/>
      <circle cx="232" cy="172" r="2.5"/>
      <circle cx="260" cy="170" r="2.5"/>
      <circle cx="120" cy="210" r="2.5"/>
      <circle cx="148" cy="208" r="2.5"/>
      <circle cx="176" cy="206" r="2.5"/>
      <circle cx="204" cy="204" r="2.5"/>
      <circle cx="232" cy="202" r="2.5"/>
      <circle cx="260" cy="200" r="2.5"/>
      <circle cx="120" cy="240" r="2.5"/>
      <circle cx="148" cy="238" r="2.5"/>
      <circle cx="176" cy="236" r="2.5"/>
      <circle cx="204" cy="234" r="2.5"/>
      <circle cx="232" cy="232" r="2.5"/>
      <circle cx="260" cy="230" r="2.5"/>
    </g>
    <!-- Hobnail highlights. -->
    <g fill="#a8b0bc" opacity="0.85" filter="url(#p19p3bloom)">
      <circle cx="119" cy="179" r="0.85"/>
      <circle cx="147" cy="177" r="0.85"/>
      <circle cx="175" cy="175" r="0.85"/>
      <circle cx="203" cy="173" r="0.85"/>
      <circle cx="231" cy="171" r="0.85"/>
      <circle cx="259" cy="169" r="0.85"/>
    </g>

    <!-- Scuffs/wear marks. -->
    <g fill="#080404" opacity="0.85">
      <ellipse cx="140" cy="120" rx="14" ry="3"/>
      <ellipse cx="200" cy="115" rx="20" ry="4"/>
      <ellipse cx="240" cy="105" rx="14" ry="3"/>
    </g>
    <!-- Stitching detail upper. -->
    <g stroke="#080404" stroke-width="0.4" stroke-dasharray="1,1" opacity="0.85">
      <path d="M100,100 Q183,90 266,80"/>
      <path d="M100,130 Q183,125 266,110"/>
    </g>
  </g>

  <!-- BLUE-WHITE PERIMETER LINES framing gap (FROM INSIDE — glowing on edges). -->
  <ellipse cx="183" cy="160" rx="100" ry="180" fill="url(#p19p3perimGlow)" filter="url(#p19p3deepBloom)" opacity="0.55"/>
  <g stroke="#a8d8f8" stroke-width="1" fill="none" opacity="0.95" filter="url(#p19p3bloom)">
    <!-- Top edge. -->
    <path d="M100,0 L100,320"/>
    <path d="M266,0 L266,320"/>
    <!-- Hex nodes. -->
    <path d="M95,40 L100,37 L105,40 L105,46 L100,49 L95,46 Z"/>
    <path d="M261,40 L266,37 L271,40 L271,46 L266,49 L261,46 Z"/>
    <path d="M95,160 L100,157 L105,160 L105,166 L100,169 L95,166 Z"/>
    <path d="M261,160 L266,157 L271,160 L271,166 L266,169 L261,166 Z"/>
    <path d="M95,280 L100,277 L105,280 L105,286 L100,289 L95,286 Z"/>
    <path d="M261,280 L266,277 L271,280 L271,286 L266,289 L261,286 Z"/>
  </g>
  <g fill="#dce4f0" opacity="0.95" filter="url(#p19p3bloom)">
    <circle cx="100" cy="42" r="0.85"/>
    <circle cx="266" cy="42" r="0.85"/>
    <circle cx="100" cy="162" r="0.85"/>
    <circle cx="266" cy="162" r="0.85"/>
    <circle cx="100" cy="282" r="0.85"/>
    <circle cx="266" cy="282" r="0.85"/>
  </g>

  <!-- Meta. -->
  <g id="p19p3-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">3</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">SHOE</text>
  </g>
</svg>
