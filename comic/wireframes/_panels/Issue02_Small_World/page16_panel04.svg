<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 420" width="487" height="420">
  <title>Issue 2 — Page 16 — Panel 4: Luma scans gas pipe, low-angle, hazard discovered</title>
  <desc>MS 50mm low angle looking up at massive iron gas pipe vertical through dark wall cavity. Luma sapphire-violet stands base scanning holographic device blue-violet light across corroded iron surface. South Asian warm brown skin braid sapphire filament. Holo lenses flickering atmospheric data. Concern — scientific assessment turning practical alarm. Cast-iron pipe enormous fairy scale industrial column corroded patches secured timber stud iron bracket. Scanner light reveals texture corrosion sharp detail dark metal. Warm amber from below secondary. Pipe recedes upward darkness. LUMA gas supply pipe iron town gas / LUMA seep upper joint slow accumulates enclosed / SABLE OP can we seal / LUMA monitor wren patch ventilation entrance clear.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p4dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p16p4joist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p16p4gasPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="40%" stop-color="#3a3a44"/>
      <stop offset="70%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p16p4sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <radialGradient id="p16p4scannerBeam">
      <stop offset="0%" stop-color="#a878f8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#5a3ad8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#28157a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p16p4amberFloor">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p16p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p16p4deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark cavity. -->
  <rect width="487" height="420" fill="url(#p16p4dark)"/>

  <!-- AMBER WARMTH from floor (power cell well below frame). -->
  <ellipse cx="243" cy="420" rx="320" ry="120" fill="url(#p16p4amberFloor)" filter="url(#p16p4deepBloom)" opacity="0.65"/>

  <!-- Timber joist FLOOR. -->
  <rect x="0" y="380" width="487" height="40" fill="url(#p16p4joist)" stroke="#080404" stroke-width="0.85"/>

  <!-- GAS PIPE — vertical column dominates frame, recedes upward into darkness. -->
  <rect x="200" y="0" width="80" height="380" fill="url(#p16p4gasPipe)" stroke="#080404" stroke-width="0.85"/>
  <!-- Pipe surface highlight strip. -->
  <line x1="240" y1="0" x2="240" y2="380" stroke="#7a8088" stroke-width="0.7" opacity="0.85"/>
  <!-- Corrosion patches. -->
  <g fill="#5a3018" opacity="0.85">
    <ellipse cx="220" cy="40" rx="14" ry="6"/>
    <ellipse cx="260" cy="80" rx="12" ry="5"/>
    <ellipse cx="225" cy="160" rx="14" ry="7"/>
    <ellipse cx="255" cy="220" rx="12" ry="6"/>
    <ellipse cx="220" cy="290" rx="14" ry="5"/>
    <ellipse cx="260" cy="340" rx="12" ry="5"/>
  </g>
  <g fill="#a86028" opacity="0.65" filter="url(#p16p4bloom)">
    <ellipse cx="220" cy="40" rx="8" ry="3"/>
    <ellipse cx="260" cy="80" rx="6" ry="3"/>
    <ellipse cx="225" cy="160" rx="8" ry="3"/>
    <ellipse cx="255" cy="220" rx="6" ry="3"/>
  </g>

  <!-- IRON BRACKET securing pipe (mid-height). -->
  <g fill="#080404" stroke="#1a0808" stroke-width="0.7">
    <rect x="186" y="180" width="108" height="14" rx="2"/>
    <rect x="186" y="190" width="108" height="6"/>
  </g>
  <!-- Bracket bolts. -->
  <g fill="#3a3a44" opacity="0.85">
    <circle cx="194" cy="187" r="1.4"/>
    <circle cx="220" cy="187" r="1.4"/>
    <circle cx="260" cy="187" r="1.4"/>
    <circle cx="286" cy="187" r="1.4"/>
  </g>

  <!-- UPPER JOINT visible (where seep occurs) — at top of pipe area. -->
  <g id="p16p4-joint">
    <rect x="190" y="100" width="100" height="14" fill="#3a1810" stroke="#080404" stroke-width="0.7"/>
    <!-- Hemp wrapping. -->
    <g stroke="#a89870" stroke-width="0.5" opacity="0.85">
      <line x1="195" y1="103" x2="285" y2="103"/>
      <line x1="195" y1="106" x2="285" y2="106"/>
      <line x1="195" y1="109" x2="285" y2="109"/>
      <line x1="195" y1="112" x2="285" y2="112"/>
    </g>
    <!-- Crumbling red lead paste hint. -->
    <g fill="#5a2018" opacity="0.85">
      <ellipse cx="220" cy="105" rx="2" ry="1"/>
      <ellipse cx="245" cy="108" rx="2" ry="1"/>
      <ellipse cx="270" cy="106" rx="2" ry="1"/>
    </g>
    <!-- Gas seep (faint shimmer). -->
    <g stroke="#a878f8" stroke-width="0.5" opacity="0.65" filter="url(#p16p4bloom)">
      <path d="M225,100 Q227,90 224,80 Q227,70 225,60"/>
      <path d="M250,100 Q253,90 250,80 Q253,70 250,60"/>
      <path d="M270,100 Q273,90 270,80 Q273,70 270,60"/>
    </g>
  </g>

  <!-- Pipe extends upward into darkness — gradient fade. -->
  <rect x="200" y="0" width="80" height="60" fill="#080404" opacity="0.85"/>

  <!-- LUMA — at base of pipe, scanning. -->
  <g id="p16p4-luma" transform="translate(120, 320)">
    <!-- Body standing. -->
    <path d="M-12,60 L-15,15 L-12,-15 L-6,-25 L6,-25 L12,-15 L15,15 L12,60 Z" fill="url(#p16p4sapphireDirty)" stroke="#080404" stroke-width="0.85"/>
    <ellipse cx="0" cy="-25" rx="9" ry="2.5" fill="#a878f8" opacity="0.85" filter="url(#p16p4bloom)"/>

    <!-- Head looking UP (at pipe joint above). -->
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#a87850"/>
    <!-- Long braid w/ filament. -->
    <path d="M-7,-32 Q-15,-22 -14,-10 Q-13,2 -15,12 Q-13,22 -15,32" stroke="#1a0808" stroke-width="4" fill="none"/>
    <line x1="-9" y1="-28" x2="-15" y2="30" stroke="#a878f8" stroke-width="0.5" opacity="0.85" filter="url(#p16p4bloom)"/>

    <!-- Cracked right lens with active scrolling. -->
    <ellipse cx="3" cy="-37" rx="5" ry="3.5" fill="#a878f8" opacity="0.85" stroke="#a878f8" stroke-width="0.4" filter="url(#p16p4bloom)"/>
    <line x1="3" y1="-37" x2="6" y2="-34" stroke="#dce4f0" stroke-width="0.3" opacity="0.85"/>
    <g font-family="Courier, monospace" font-size="2" fill="#dce4f0" opacity="0.95">
      <text x="0" y="-40">CO/H2</text>
      <text x="0" y="-37">5ppm</text>
      <text x="0" y="-34">↑↑↑</text>
    </g>

    <!-- Eyes looking up (concerned). -->
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-40" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Brow concern. -->
    <path d="M-7,-44 Q-3,-46 1,-44" stroke="#3a1808" stroke-width="0.7" fill="none"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.6"/>

    <!-- ARM RAISED UP scanning toward pipe. -->
    <path d="M12,-15 L40,-100 L48,-95 L20,-10 Z" fill="url(#p16p4sapphireDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="44" cy="-98" rx="3" ry="2" fill="#a87850" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Scanner device in hand. -->
    <rect x="40" y="-104" width="9" height="6" rx="1" fill="#3a3a44" stroke="#080404" stroke-width="0.5"/>
    <!-- Scanner BEAM upward toward pipe joint. -->
    <ellipse cx="120" cy="-200" rx="80" ry="120" fill="url(#p16p4scannerBeam)" filter="url(#p16p4deepBloom)" opacity="0.85" transform="rotate(15 120 -200)"/>
    <g stroke="#a878f8" stroke-width="0.5" fill="none" opacity="0.95" filter="url(#p16p4bloom)">
      <path d="M44,-100 L100,-160 L160,-220"/>
      <path d="M40,-104 L96,-164 L156,-224"/>
      <path d="M48,-100 L104,-160 L164,-220"/>
    </g>
  </g>

  <!-- DIALOGUE -->
  <g id="p16p4-bal-luma1">
    <rect x="14" y="14" width="240" height="78" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Sable. Gas supply pipe</text>
    <text x="24" y="67" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">in our wall. Town gas —</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">CO, hydrogen.</text>
  </g>

  <g id="p16p4-bal-luma2">
    <rect x="14" y="100" width="240" height="60" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="118" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="24" y="136" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Seep at the upper joint.</text>
    <text x="24" y="153" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Slow — but enclosed space...</text>
  </g>

  <g id="p16p4-bal-sable-op">
    <rect x="264" y="14" width="200" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-dasharray="4,3" filter="url(#balloonShadow)"/>
    <text x="274" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE (O.P.)</text>
    <text x="274" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Can we seal it?</text>
  </g>

  <g id="p16p4-bal-luma3">
    <rect x="264" y="62" width="220" height="80" rx="8" fill="#ffffff" stroke="#5a3ad8" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="274" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a3ad8" letter-spacing="0.3">LUMA</text>
    <text x="274" y="98" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">I'll monitor. Wren can</text>
    <text x="274" y="115" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">patch when she's free.</text>
    <text x="274" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Keep entrance clear.</text>
  </g>

  <!-- Meta. -->
  <g id="p16p4-meta">
    <text x="479" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">4</text>
    <text x="483" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">PIPE HAZARD</text>
  </g>
</svg>
