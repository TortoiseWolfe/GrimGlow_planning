<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 15 — Panel 1: Wall cavity interior, Sable silhouetted in entrance</title>
  <desc>Wide establishing 24mm fairy scale inside Victorian wall cavity — space between plaster and brick. Two timber studs frame composition columns floor-ceiling. Lath-and-plaster wall left horizontal laths ladder pattern plaster bulging. Brick wall right rough mortar joints. Floor broad timber joist dusty mouse droppings plaster fragments. Far end grey daylight irregular gap half-brick crumbled. Sable silhouetted entrance hand on brick edge. Dust motes shaft of light. Cobwebs. Squad behind waiting. SABLE narrow approach single entry vertical escape / SABLE Wren perimeter Thresh clear everyone inside.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p1interior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p15p1timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3a18"/>
      <stop offset="50%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p15p1plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89870"/>
      <stop offset="100%" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="p15p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p15p1joist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3a18"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <radialGradient id="p15p1daylight">
      <stop offset="0%" stop-color="#a8b0bc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a606a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p15p1silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <filter id="p15p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p15p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p15p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG cavity dark interior. -->
  <rect width="742" height="340" fill="url(#p15p1interior)"/>

  <!-- LATH-AND-PLASTER WALL (foreground left). Horizontal laths nailed to studs. -->
  <rect x="0" y="0" width="120" height="340" fill="url(#p15p1plaster)"/>
  <!-- Lath horizontal lines (ladder pattern). -->
  <g stroke="#1a0808" stroke-width="1.2" opacity="0.85">
    <line x1="0" y1="20" x2="120" y2="20"/>
    <line x1="0" y1="36" x2="120" y2="36"/>
    <line x1="0" y1="52" x2="120" y2="52"/>
    <line x1="0" y1="68" x2="120" y2="68"/>
    <line x1="0" y1="84" x2="120" y2="84"/>
    <line x1="0" y1="100" x2="120" y2="100"/>
    <line x1="0" y1="116" x2="120" y2="116"/>
    <line x1="0" y1="132" x2="120" y2="132"/>
    <line x1="0" y1="148" x2="120" y2="148"/>
    <line x1="0" y1="164" x2="120" y2="164"/>
    <line x1="0" y1="180" x2="120" y2="180"/>
    <line x1="0" y1="196" x2="120" y2="196"/>
    <line x1="0" y1="212" x2="120" y2="212"/>
    <line x1="0" y1="228" x2="120" y2="228"/>
    <line x1="0" y1="244" x2="120" y2="244"/>
    <line x1="0" y1="260" x2="120" y2="260"/>
  </g>
  <!-- Plaster bulging through gaps. -->
  <g fill="#a89870" opacity="0.85">
    <ellipse cx="40" cy="28" rx="15" ry="3"/>
    <ellipse cx="80" cy="60" rx="14" ry="3"/>
    <ellipse cx="30" cy="92" rx="14" ry="3"/>
    <ellipse cx="70" cy="124" rx="14" ry="3"/>
    <ellipse cx="50" cy="156" rx="14" ry="3"/>
    <ellipse cx="80" cy="188" rx="14" ry="3"/>
    <ellipse cx="30" cy="220" rx="14" ry="3"/>
    <ellipse cx="60" cy="252" rx="14" ry="3"/>
  </g>

  <!-- BRICK WALL (right side). Rough inner face. -->
  <rect x="622" y="0" width="120" height="340" fill="url(#p15p1brick)"/>
  <g stroke="#080404" stroke-width="0.7" opacity="0.85">
    <line x1="622" y1="40" x2="742" y2="40"/>
    <line x1="622" y1="80" x2="742" y2="80"/>
    <line x1="622" y1="120" x2="742" y2="120"/>
    <line x1="622" y1="160" x2="742" y2="160"/>
    <line x1="622" y1="200" x2="742" y2="200"/>
    <line x1="622" y1="240" x2="742" y2="240"/>
    <line x1="622" y1="280" x2="742" y2="280"/>
    <!-- Vertical mortar joints. -->
    <line x1="660" y1="0" x2="660" y2="40"/>
    <line x1="700" y1="40" x2="700" y2="80"/>
    <line x1="660" y1="80" x2="660" y2="120"/>
    <line x1="700" y1="120" x2="700" y2="160"/>
    <line x1="660" y1="160" x2="660" y2="200"/>
    <line x1="700" y1="200" x2="700" y2="240"/>
    <line x1="660" y1="240" x2="660" y2="280"/>
    <line x1="700" y1="280" x2="700" y2="320"/>
  </g>

  <!-- TIMBER STUDS — column-like vertical beams at fairy scale (frame the composition). -->
  <rect x="120" y="0" width="40" height="340" fill="url(#p15p1timber)" stroke="#080404" stroke-width="0.85"/>
  <rect x="582" y="0" width="40" height="340" fill="url(#p15p1timber)" stroke="#080404" stroke-width="0.85"/>
  <!-- Timber grain. -->
  <g stroke="#1a0808" stroke-width="0.5" opacity="0.85">
    <line x1="125" y1="0" x2="125" y2="340"/>
    <line x1="135" y1="0" x2="135" y2="340"/>
    <line x1="145" y1="0" x2="145" y2="340"/>
    <line x1="155" y1="0" x2="155" y2="340"/>
    <line x1="587" y1="0" x2="587" y2="340"/>
    <line x1="597" y1="0" x2="597" y2="340"/>
    <line x1="607" y1="0" x2="607" y2="340"/>
    <line x1="617" y1="0" x2="617" y2="340"/>
  </g>
  <!-- Iron nails. -->
  <g fill="#080404">
    <circle cx="135" cy="40" r="1.4"/>
    <circle cx="145" cy="120" r="1.4"/>
    <circle cx="135" cy="200" r="1.4"/>
    <circle cx="145" cy="280" r="1.4"/>
    <circle cx="597" cy="40" r="1.4"/>
    <circle cx="607" cy="120" r="1.4"/>
    <circle cx="597" cy="200" r="1.4"/>
    <circle cx="607" cy="280" r="1.4"/>
  </g>

  <!-- TIMBER JOIST FLOOR (broad beam at bottom). -->
  <rect x="160" y="280" width="422" height="60" fill="url(#p15p1joist)" stroke="#080404" stroke-width="0.85"/>
  <g stroke="#1a0808" stroke-width="0.5" opacity="0.85">
    <line x1="160" y1="290" x2="582" y2="290"/>
    <line x1="160" y1="305" x2="582" y2="305"/>
    <line x1="160" y1="320" x2="582" y2="320"/>
  </g>
  <!-- Mouse droppings, plaster fragments on joist. -->
  <g fill="#3a2010" opacity="0.85">
    <ellipse cx="220" cy="290" rx="2.5" ry="1.4"/>
    <ellipse cx="240" cy="295" rx="2" ry="1.2"/>
    <ellipse cx="380" cy="290" rx="2.5" ry="1.4"/>
    <ellipse cx="420" cy="295" rx="2" ry="1.2"/>
    <ellipse cx="500" cy="290" rx="2.5" ry="1.4"/>
  </g>
  <g fill="#a89870" opacity="0.85">
    <polygon points="280,289 286,287 288,292 282,294"/>
    <polygon points="350,295 358,293 360,298 354,300"/>
    <polygon points="450,290 458,288 460,293 452,295"/>
  </g>

  <!-- COBWEBS between beams. -->
  <g stroke="#a89870" stroke-width="0.4" fill="none" opacity="0.55">
    <path d="M160,40 Q220,80 280,40"/>
    <path d="M160,40 Q220,80 280,40 M180,30 L220,80 M260,30 L220,80"/>
    <path d="M450,60 Q500,100 580,60"/>
    <path d="M450,60 L500,100 L580,60 M480,50 L500,100 M540,50 L500,100"/>
  </g>

  <!-- ENTRANCE GAP — irregular hole far end (right wall area), grey daylight. -->
  <g id="p15p1-entrance">
    <!-- Gap shape (where half-brick crumbled). -->
    <path d="M540,80 L580,75 L582,200 L540,210 Z" fill="url(#p15p1daylight)" opacity="0.95"/>
    <path d="M540,80 L582,75" stroke="#080404" stroke-width="0.85"/>
    <path d="M582,200 L540,210" stroke="#080404" stroke-width="0.85"/>
    <!-- Crumbled edge texture. -->
    <g stroke="#3a1810" stroke-width="0.5" fill="none" opacity="0.85">
      <path d="M540,90 L545,95"/>
      <path d="M540,140 L545,138"/>
      <path d="M540,175 L545,180"/>
    </g>
    <!-- DUST MOTES in shaft. -->
    <g fill="#dce4f0" opacity="0.45" filter="url(#p15p1bloom)">
      <circle cx="500" cy="120" r="0.85"/>
      <circle cx="480" cy="160" r="0.7"/>
      <circle cx="460" cy="100" r="0.85"/>
      <circle cx="440" cy="180" r="0.7"/>
      <circle cx="420" cy="140" r="0.85"/>
      <circle cx="380" cy="170" r="0.7"/>
      <circle cx="340" cy="120" r="0.85"/>
      <circle cx="300" cy="160" r="0.7"/>
    </g>
    <!-- Light shaft volumetric. -->
    <path d="M540,80 L300,200 L300,220 L540,210 Z" fill="#a8b0bc" opacity="0.15" filter="url(#p15p1deepBloom)"/>
  </g>

  <!-- SABLE — silhouetted in entrance gap. -->
  <g id="p15p1-sable" transform="translate(560, 200)">
    <!-- Body silhouette dark. -->
    <path d="M-12,55 L-15,15 L-12,-30 L-6,-50 L6,-50 L12,-30 L15,15 L12,55 Z" fill="url(#p15p1silverDirty)" stroke="#080404" stroke-width="0.85"/>
    <!-- Cracked right shoulder lit by daylight edge. -->
    <path d="M12,-25 L18,-15 L20,5 L18,25" fill="url(#p15p1silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p15p1bloom)"><path d="M14,-18 L18,-8 L16,4"/></g>
    <ellipse cx="0" cy="-50" rx="9" ry="2.5" fill="#dce4f0" opacity="0.55" filter="url(#p15p1bloom)"/>
    <!-- HAND tracing brick edge (right). -->
    <path d="M14,-15 L24,-12 L24,-8 L13,-10 Z" fill="url(#p15p1silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="26" cy="-10" rx="3" ry="2" fill="#3a2818" stroke="#080404" stroke-width="0.4"/>
    <!-- Head silhouette w/ silver-white hair edge. -->
    <ellipse cx="0" cy="-62" rx="11" ry="12" fill="#3a2818"/>
    <path d="M-9,-69 Q0,-74 9,-69 L9,-62 L-9,-62 Z" fill="#dce4f0"/>
    <!-- Edge light on profile. -->
    <ellipse cx="-3" cy="-64" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-64" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-64" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-64" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-56" x2="3" y2="-56" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- DIALOGUE -->
  <g id="p15p1-bal-sable1">
    <rect x="14" y="14" width="240" height="62" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">This will work. Narrow approach.</text>
    <text x="24" y="71" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Single entry. Vertical escape.</text>
  </g>

  <g id="p15p1-bal-sable2">
    <rect x="264" y="14" width="280" height="62" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="274" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="274" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Wren — perimeter. Thresh — clear.</text>
    <text x="274" y="71" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Everyone else, inside.</text>
    <path d="M460,76 L474,76 L468,90 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="460" y1="76" x2="474" y2="76" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p15p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">CAVITY FOUND</text>
  </g>
</svg>
