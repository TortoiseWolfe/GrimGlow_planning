<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 550" width="742" height="550">
  <title>Issue 2 — Page 21 — Panel 1: Sable face after file dies, the mask stripped, fear precise</title>
  <desc>MCU 65mm eye level. Sable stares data module in hand display dead holographic text gone last fragments file consumed corruption. Module surface faint residual blue-white fading. Late 30s dark brown silver-white buzz catches last traces dying holographic. Mask stripped away — not panic but precise fear someone seen shape dark cannot determine threat or shadow. Eyes fixed dying module. Lips slightly parted. Cold light dying leaving increasing shadow. Warm amber distant power cell creeps back edges as holographic recedes — passing cold light secret back toward warm light squad. Slow transition threshold visible. SABLE whispered what happened to them.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p21p1dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p21p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p21p1silverFading" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5868"/>
      <stop offset="50%" stop-color="#3a3848"/>
      <stop offset="100%" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="p21p1moduleResidual">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#5a808a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a2840" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p1amberCreep">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0"/>
    </radialGradient>
    <filter id="p21p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p21p1strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p21p1deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark. -->
  <rect width="742" height="550" fill="url(#p21p1dark)"/>

  <!-- BRICK wall behind. -->
  <rect width="742" height="550" fill="url(#p21p1brick)" opacity="0.85"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
    <line x1="0" y1="320" x2="742" y2="320"/>
    <line x1="0" y1="400" x2="742" y2="400"/>
    <line x1="0" y1="480" x2="742" y2="480"/>
  </g>

  <!-- AMBER CREEPING IN at edges — the warmth returning. -->
  <ellipse cx="0" cy="275" rx="200" ry="320" fill="url(#p21p1amberCreep)" filter="url(#p21p1deepBloom)" opacity="0.55"/>
  <ellipse cx="742" cy="275" rx="200" ry="320" fill="url(#p21p1amberCreep)" filter="url(#p21p1deepBloom)" opacity="0.55"/>

  <!-- DATA MODULE at lower frame — residual fading glow. -->
  <ellipse cx="371" cy="480" rx="120" ry="60" fill="url(#p21p1moduleResidual)" filter="url(#p21p1deepBloom)" opacity="0.85"/>
  <g id="p21p1-module">
    <rect x="346" y="470" width="50" height="22" rx="2" fill="#1a1820" stroke="#3a3a44" stroke-width="0.7"/>
    <ellipse cx="371" cy="472" rx="14" ry="2" fill="#a8d8f8" opacity="0.45" filter="url(#p21p1bloom)"/>
    <!-- Last residual glyphs flickering. -->
    <g stroke="#a8d8f8" stroke-width="0.4" fill="none" opacity="0.45" filter="url(#p21p1bloom)">
      <path d="M360,468 L362,464 M370,468 L372,464 M380,468 L378,464"/>
    </g>
  </g>

  <!-- SABLE FACE — center frame MCU. -->
  <g id="p21p1-sable" transform="translate(371, 350)">
    <!-- Body upper torso. -->
    <path d="M-90,200 L-100,80 L-80,30 L-50,10 L-15,-2 L15,-2 L50,10 L80,30 L100,80 L90,200 Z" fill="url(#p21p1silverFading)" stroke="#080404" stroke-width="0.85"/>
    <!-- Cracked right shoulder. -->
    <path d="M50,10 L92,22 L98,46 L92,72" fill="url(#p21p1silverFading)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.7" opacity="0.85" filter="url(#p21p1bloom)">
      <path d="M62,16 L72,30 L68,44 L74,60"/>
      <path d="M68,30 L74,40"/>
    </g>
    <!-- Silver collar. -->
    <ellipse cx="0" cy="-2" rx="22" ry="4" fill="#5a606a" opacity="0.65" filter="url(#p21p1bloom)"/>

    <!-- HEAD ECU. -->
    <ellipse cx="0" cy="-50" rx="60" ry="68" fill="#3a2818"/>

    <!-- Silver-white buzz catching last traces of cold light. -->
    <path d="M-44,-110 Q-22,-128 0,-130 Q22,-128 44,-110 L44,-90 L-44,-90 Z" fill="#787890"/>
    <line x1="-44" y1="-90" x2="44" y2="-90" stroke="#3a3a44" stroke-width="0.85" opacity="0.85"/>
    <ellipse cx="0" cy="-110" rx="22" ry="6" fill="#a8d8f8" opacity="0.35" filter="url(#p21p1strongBloom)"/>
    <g fill="#3a3a44" opacity="0.85">
      <circle cx="-22" cy="-118" r="0.85"/>
      <circle cx="-12" cy="-124" r="0.85"/>
      <circle cx="0" cy="-128" r="0.85"/>
      <circle cx="12" cy="-124" r="0.85"/>
      <circle cx="22" cy="-118" r="0.85"/>
    </g>

    <!-- Cheekbones — half cool half warm (transition). -->
    <ellipse cx="-30" cy="-30" rx="14" ry="6" fill="#a87850" opacity="0.65" filter="url(#p21p1bloom)"/>
    <ellipse cx="30" cy="-30" rx="14" ry="6" fill="#a87850" opacity="0.65" filter="url(#p21p1bloom)"/>
    <ellipse cx="-32" cy="-22" rx="22" ry="10" fill="#a8d8f8" opacity="0.35" filter="url(#p21p1strongBloom)"/>
    <ellipse cx="32" cy="-22" rx="22" ry="10" fill="#f5b860" opacity="0.25" filter="url(#p21p1strongBloom)"/>

    <!-- Brow set — harder than usual, transition expression. -->
    <path d="M-28,-72 Q-18,-78 -8,-72" stroke="#1a0808" stroke-width="2.5" fill="none"/>
    <path d="M8,-72 Q18,-78 28,-72" stroke="#1a0808" stroke-width="2.5" fill="none"/>

    <!-- EYES — fixed downward at module. -->
    <ellipse cx="-22" cy="-58" rx="9" ry="6" fill="#dce4f0"/>
    <ellipse cx="22" cy="-58" rx="9" ry="6" fill="#dce4f0"/>
    <ellipse cx="-22" cy="-56" rx="3.5" ry="3.5" fill="#5a3a18"/>
    <ellipse cx="22" cy="-56" rx="3.5" ry="3.5" fill="#5a3a18"/>
    <ellipse cx="-22" cy="-56" rx="2" ry="2" fill="#080404"/>
    <ellipse cx="22" cy="-56" rx="2" ry="2" fill="#080404"/>
    <!-- Last cool catch-light fading. -->
    <circle cx="-19" cy="-58" r="0.85" fill="#a8d8f8" opacity="0.85" filter="url(#p21p1bloom)"/>
    <circle cx="25" cy="-58" r="0.85" fill="#a8d8f8" opacity="0.85" filter="url(#p21p1bloom)"/>
    <!-- Slight white above iris (exposure of fear). -->
    <path d="M-30,-62 Q-22,-65 -14,-62" fill="#dce4f0"/>
    <path d="M14,-62 Q22,-65 30,-62" fill="#dce4f0"/>

    <!-- Nose. -->
    <path d="M-3,-50 L0,-30 L-4,-22" stroke="#1a0808" stroke-width="1.4" fill="none" opacity="0.85"/>

    <!-- LIPS slightly parted. -->
    <path d="M-12,-10 Q0,-6 12,-10 L12,-4 Q0,-1 -12,-4 Z" fill="#3a1010" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Jaw soft tension. -->
    <ellipse cx="-32" cy="-22" rx="3" ry="2" fill="#1a0808" opacity="0.45"/>
    <ellipse cx="32" cy="-22" rx="3" ry="2" fill="#1a0808" opacity="0.45"/>
  </g>

  <!-- HAND holding module visible at lower right. -->
  <g id="p21p1-hand">
    <path d="M460,470 L480,455 L500,460 L495,492 L470,490 Z" fill="url(#p21p1silverFading)" stroke="#080404" stroke-width="0.7"/>
    <path d="M495,492 L500,500 L520,500 L515,494 Z" fill="url(#p21p1silverFading)" stroke="#080404" stroke-width="0.5"/>
  </g>

  <!-- DIALOGUE — SABLE whispered. -->
  <g id="p21p1-bal-sable">
    <rect x="14" y="14" width="240" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="68" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a4a30">(whispered)</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a" font-style="italic">What happened to them?</text>
    <path d="M120,60 L134,60 L128,72 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="120" y1="60" x2="134" y2="60" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p21p1-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">1</text>
    <text x="738" y="540" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">FILE DEAD</text>
  </g>
</svg>
