<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 340" width="366" height="340">
  <title>Issue 2 — Page 1 — Panel 3: Worm's-eye church bell ripples — sound as pressure</title>
  <desc>35mm worm's-eye UP from gutter floor. Gutter walls rise either side. Beyond lip: grey overcast sky + distant Victorian church spire silhouette. RIPPLE LINES radiating from spire (sound-as-pressure visual SFX — concentric distortion lines for bell at fairy scale). Squad jerks awake in lower frame: Thresh hand to weapon, Jink sits bolt upright curls wild, Luma flinches, Wren opens eyes. SFX: "BONNNNNG" + JINK: "What the--" + SABLE off: "Church bells. 0630."</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p1p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7e88"/>
      <stop offset="100%" stop-color="#5a5e68"/>
    </linearGradient>
    <linearGradient id="p1p3wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="p1p3floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="p1p3rippleFade">
      <stop offset="0%" stop-color="#dce4f0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dce4f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p1p3strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Sky background — grey overcast. -->
  <rect width="366" height="340" fill="url(#p1p3sky)"/>

  <!-- DISTANT CHURCH SPIRE silhouette in upper portion of sky (script: impossibly distant + tall). -->
  <g id="p1p3-church-spire">
    <!-- Spire pyramid. -->
    <path d="M180,80 L188,15 L196,80 Z" fill="#1a1820"/>
    <!-- Spire body/tower. -->
    <rect x="182" y="80" width="12" height="50" fill="#1a1820"/>
    <!-- Cross at top. -->
    <line x1="188" y1="15" x2="188" y2="5" stroke="#1a1820" stroke-width="1"/>
    <line x1="184" y1="9" x2="192" y2="9" stroke="#1a1820" stroke-width="0.8"/>
    <!-- Tower window slits. -->
    <rect x="184" y="100" width="2" height="10" fill="#0a0810"/>
    <rect x="190" y="100" width="2" height="10" fill="#0a0810"/>
  </g>

  <!-- RIPPLE LINES radiating from spire — sound-as-pressure visual SFX (script-specific). -->
  <g id="p1p3-bell-ripples" filter="url(#p1p3bloom)">
    <!-- Concentric distortion arcs expanding from spire. -->
    <ellipse cx="188" cy="60" rx="30" ry="25" fill="none" stroke="#dce4f0" stroke-width="1.4" opacity="0.85"/>
    <ellipse cx="188" cy="60" rx="55" ry="42" fill="none" stroke="#dce4f0" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="188" cy="60" rx="85" ry="58" fill="none" stroke="#dce4f0" stroke-width="1" opacity="0.55"/>
    <ellipse cx="188" cy="60" rx="120" ry="78" fill="none" stroke="#dce4f0" stroke-width="0.85" opacity="0.45"/>
    <ellipse cx="188" cy="60" rx="160" ry="100" fill="none" stroke="#dce4f0" stroke-width="0.7" opacity="0.35"/>
    <ellipse cx="188" cy="60" rx="200" ry="125" fill="none" stroke="#dce4f0" stroke-width="0.55" opacity="0.25"/>
    <!-- Inner pulse glow. -->
    <ellipse cx="188" cy="60" rx="20" ry="18" fill="url(#p1p3rippleFade)" opacity="0.85"/>
  </g>

  <!-- GUTTER WALLS rising either side (worm's-eye UP — walls vertical/converging at top). -->
  <g id="p1p3-gutter-walls">
    <!-- LEFT wall. -->
    <path d="M0,180 L0,340 L60,340 L40,180 Z" fill="url(#p1p3wall)"/>
    <!-- Riveted seams + rivets. -->
    <g stroke="#0a0c10" stroke-width="0.6" opacity="0.85">
      <line x1="20" y1="180" x2="30" y2="340"/>
    </g>
    <g fill="#0a0c10" opacity="0.85">
      <circle cx="22" cy="220" r="1.4"/>
      <circle cx="24" cy="260" r="1.4"/>
      <circle cx="26" cy="300" r="1.4"/>
    </g>
    <!-- Rim highlight (top edge). -->
    <line x1="0" y1="180" x2="40" y2="180" stroke="#080a14" stroke-width="1"/>

    <!-- RIGHT wall. -->
    <path d="M366,180 L366,340 L306,340 L326,180 Z" fill="url(#p1p3wall)"/>
    <g stroke="#0a0c10" stroke-width="0.6" opacity="0.85">
      <line x1="346" y1="180" x2="336" y2="340"/>
    </g>
    <g fill="#0a0c10" opacity="0.85">
      <circle cx="344" cy="220" r="1.4"/>
      <circle cx="342" cy="260" r="1.4"/>
      <circle cx="340" cy="300" r="1.4"/>
    </g>
    <line x1="326" y1="180" x2="366" y2="180" stroke="#080a14" stroke-width="1"/>
  </g>

  <!-- GUTTER FLOOR — narrow strip at bottom, where squad lies. -->
  <g id="p1p3-gutter-floor">
    <path d="M40,180 L326,180 L306,340 L60,340 Z" fill="url(#p1p3floor)"/>
    <!-- Lead patina + grit. -->
    <g fill="#1a1c20" opacity="0.55">
      <circle cx="100" cy="220" r="1"/>
      <circle cx="200" cy="240" r="1"/>
      <circle cx="280" cy="220" r="1"/>
      <circle cx="160" cy="280" r="1"/>
      <circle cx="240" cy="290" r="1"/>
    </g>
  </g>

  <!-- SQUAD reacting on floor (lower portion of frame). 4 figures from low-angle perspective. -->

  <!-- THRESH (LEFT) — JERKING UP, hand to weapon. -->
  <g id="p1p3-thresh" transform="translate(95, 280)">
    <!-- Body upright (just sat up). -->
    <ellipse cx="0" cy="0" rx="13" ry="18" fill="#dc2030"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-22" rx="8" ry="9" fill="#d8a880"/>
    <!-- Buzz cap. -->
    <path d="M-6,-28 Q0,-31 6,-28 L6,-22 L-6,-22 Z" fill="#a83a18"/>
    <!-- Wide alert eyes. -->
    <ellipse cx="-2" cy="-22" rx="1.5" ry="1.5" fill="#dce4f0"/>
    <ellipse cx="2" cy="-22" rx="1.5" ry="1.5" fill="#dce4f0"/>
    <circle cx="-2" cy="-22" r="0.7" fill="#080404"/>
    <circle cx="2" cy="-22" r="0.7" fill="#080404"/>
    <!-- Brow up alarm. -->
    <path d="M-5,-28 L-2,-29" stroke="#5a1808" stroke-width="0.7"/>
    <path d="M2,-29 L5,-28" stroke="#5a1808" stroke-width="0.7"/>
    <!-- Hand reaching to weapon. -->
    <path d="M13,5 L22,12" stroke="#a8182a" stroke-width="3" stroke-linecap="round"/>
    <!-- Tiny weapon. -->
    <rect x="20" y="10" width="8" height="3" rx="0.5" fill="#1a0810"/>
    <!-- Crimson glow faint. -->
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="#f54848" opacity="0.35" filter="url(#p1p3bloom)"/>
  </g>

  <!-- JINK (CENTER-LEFT) — SITTING BOLT UPRIGHT, curls wild. -->
  <g id="p1p3-jink" transform="translate(165, 280)">
    <!-- Body upright suddenly. -->
    <ellipse cx="0" cy="0" rx="11" ry="18" fill="#2ed078"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-22" rx="7" ry="8" fill="#e8c8a0"/>
    <!-- WILD CURLS (script-specific). -->
    <g fill="#f5d860">
      <circle cx="-5" cy="-29" r="2.5"/>
      <circle cx="-1" cy="-32" r="2.5"/>
      <circle cx="3" cy="-31" r="2.5"/>
      <circle cx="6" cy="-28" r="2"/>
      <circle cx="-7" cy="-26" r="1.8"/>
      <circle cx="8" cy="-25" r="1.8"/>
      <!-- Wild outliers. -->
      <circle cx="-9" cy="-31" r="1.4"/>
      <circle cx="-3" cy="-35" r="1.4"/>
      <circle cx="5" cy="-34" r="1.4"/>
    </g>
    <!-- Mouth open (about to speak). -->
    <ellipse cx="0" cy="-19" rx="2" ry="1.5" fill="#1a0808"/>
    <!-- Eyes wide. -->
    <ellipse cx="-2" cy="-22" rx="1.4" ry="1.4" fill="#dce4f0"/>
    <ellipse cx="2" cy="-22" rx="1.4" ry="1.4" fill="#dce4f0"/>
    <circle cx="-2" cy="-22" r="0.6" fill="#080404"/>
    <circle cx="2" cy="-22" r="0.6" fill="#080404"/>
    <!-- Emerald glow faint. -->
    <ellipse cx="0" cy="0" rx="13" ry="20" fill="#7af0b0" opacity="0.4" filter="url(#p1p3bloom)"/>
  </g>

  <!-- LUMA (CENTER-RIGHT) — FLINCHING, hand to ear. -->
  <g id="p1p3-luma" transform="translate(225, 285)">
    <!-- Body curled flinch. -->
    <ellipse cx="0" cy="0" rx="11" ry="14" fill="#5a3ad8"/>
    <!-- Head tilted slightly. -->
    <ellipse cx="-2" cy="-18" rx="7" ry="8" fill="#a87850" transform="rotate(-10 -2 -18)"/>
    <!-- Dark hair + braid. -->
    <path d="M-6,-22 Q0,-25 6,-22 L6,-18 L-6,-18 Z" fill="#1a1018" transform="rotate(-10 -2 -18)"/>
    <path d="M5,-18 Q7,-12 6,-5" stroke="#1a1018" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Sapphire filament along braid. -->
    <path d="M5,-18 Q7,-12 6,-5" stroke="#a890f0" stroke-width="0.4" fill="none" filter="url(#p1p3bloom)" opacity="0.85"/>
    <!-- Holo lens (one cracked per production note). -->
    <ellipse cx="-4" cy="-19" rx="1.5" ry="1" fill="#a890f0" opacity="0.85"/>
    <ellipse cx="0" cy="-19" rx="1.5" ry="1" fill="#a890f0" opacity="0.55"/>
    <line x1="-1" y1="-19" x2="1" y2="-19" stroke="#5a3ad8" stroke-width="0.4"/>
    <!-- Crack on right lens. -->
    <line x1="-1" y1="-20" x2="1" y2="-18" stroke="#080408" stroke-width="0.4"/>
    <!-- Wince eyes (closed). -->
    <path d="M-5,-19 Q-3,-18 -1,-19" stroke="#080404" stroke-width="0.4" fill="none"/>
    <!-- Hand to ear. -->
    <path d="M-11,-14 L-15,-18" stroke="#5a3ad8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sapphire glow faint. -->
    <ellipse cx="0" cy="0" rx="13" ry="16" fill="#a890f0" opacity="0.4" filter="url(#p1p3bloom)"/>
  </g>

  <!-- WREN (RIGHT) — eyes opening, NOT moving. -->
  <g id="p1p3-wren" transform="translate(285, 290)">
    <!-- Body still mostly prone. -->
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="#c87a35"/>
    <!-- Head. -->
    <ellipse cx="-8" cy="-2" rx="6" ry="7" fill="#d8b088"/>
    <!-- Bun (hair UP). -->
    <ellipse cx="-8" cy="-8" rx="4" ry="3" fill="#0a0a14"/>
    <!-- Eyes opening. -->
    <ellipse cx="-10" cy="-3" rx="1.3" ry="0.7" fill="#0a0a14"/>
    <ellipse cx="-6" cy="-3" rx="1.3" ry="0.7" fill="#0a0a14"/>
    <!-- Copper glow faint. -->
    <ellipse cx="0" cy="0" rx="18" ry="9" fill="#f5a868" opacity="0.4" filter="url(#p1p3bloom)"/>
  </g>

  <!-- SFX BONNNNNG — large atmospheric, integrated with ripple visual, top-center. -->
  <g id="p1p3-sfx-bell">
    <text x="183" y="160" text-anchor="middle" font-family="Impact, Haettenschweiler, sans-serif" font-size="38" font-weight="900" stroke="#1a1820" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill" fill="#dce4f0" opacity="0.9">BONNNNNG</text>
  </g>

  <!-- JINK dialogue. -->
  <g id="p1p3-dlg-jink">
    <rect x="14" y="14" width="160" height="44" rx="8" fill="#ffffff" stroke="#2ed078" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="33" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#2ed078" letter-spacing="0.3">JINK</text>
    <text x="24" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">What the--</text>
    <path d="M115,58 L133,58 L165,260 Z" fill="#ffffff" stroke="#2ed078" stroke-width="2" stroke-linejoin="round"/>
    <line x1="115" y1="58" x2="133" y2="58" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- SABLE off-panel (dashed). -->
  <g id="p1p3-dlg-sable-off">
    <rect x="186" y="14" width="166" height="44" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-dasharray="6,3" filter="url(#balloonShadow)"/>
    <text x="196" y="33" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE (OFF)</text>
    <text x="196" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Church bells. 0630.</text>
    <path d="M340,58 L356,58 L362,80 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3,2"/>
  </g>

  <!-- Meta tag. -->
  <g id="p1p3-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.85">3</text>
    <text x="362" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.7">CHURCH BELL RIPPLES</text>
  </g>
</svg>
