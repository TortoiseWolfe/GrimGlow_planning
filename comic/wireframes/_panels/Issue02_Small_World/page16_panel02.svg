<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 16 — Panel 2: Thresh on watch, chosen the cold side</title>
  <desc>MCU 65mm eye level. Thresh ruby seated against rough brick wall inside dark cavity, knees drawn weapon across knees watching gap entrance blue-white perimeter glows brickwork. Posture watchful ready positioned between entrance and others. Alert taut — competent surface but eyes carry deeper fear, chronic vigilance world that terrifies her. Blue-white perimeter casts cool geometric patterns across ruby suit + brick. Warm amber from power cell behind barely reaches — sits mostly in cool light at edge of warmth chosen cold side. NO DIALOGUE.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p2dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p16p2brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p16p2joist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p16p2rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82838"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <radialGradient id="p16p2blueWash">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p16p2amberWarmFar">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p16p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p16p2deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark. -->
  <rect width="366" height="320" fill="url(#p16p2dark)"/>

  <!-- AMBER WARMTH from FAR LEFT (power cell well behind, barely reaching). -->
  <ellipse cx="-40" cy="180" rx="200" ry="160" fill="url(#p16p2amberWarmFar)" filter="url(#p16p2deepBloom)" opacity="0.55"/>

  <!-- BRICK WALL background (with blue perimeter). -->
  <rect x="120" y="0" width="246" height="280" fill="url(#p16p2brick)"/>
  <g stroke="#080404" stroke-width="0.7" opacity="0.85">
    <line x1="120" y1="40" x2="366" y2="40"/>
    <line x1="120" y1="80" x2="366" y2="80"/>
    <line x1="120" y1="120" x2="366" y2="120"/>
    <line x1="120" y1="160" x2="366" y2="160"/>
    <line x1="120" y1="200" x2="366" y2="200"/>
    <line x1="120" y1="240" x2="366" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="40"/>
    <line x1="200" y1="40" x2="200" y2="80"/>
    <line x1="240" y1="80" x2="240" y2="120"/>
    <line x1="280" y1="120" x2="280" y2="160"/>
    <line x1="320" y1="160" x2="320" y2="200"/>
    <line x1="180" y1="200" x2="180" y2="240"/>
    <line x1="220" y1="240" x2="220" y2="280"/>
  </g>

  <!-- ENTRANCE GAP visible right side with strong perimeter. -->
  <path d="M280,80 L330,75 L335,200 L280,210 Z" fill="#5a606a" opacity="0.85"/>
  <ellipse cx="307" cy="140" rx="80" ry="100" fill="url(#p16p2blueWash)" filter="url(#p16p2deepBloom)" opacity="0.95"/>
  <!-- Perimeter lines. -->
  <g stroke="#a8d8f8" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#p16p2bloom)">
    <path d="M280,80 L330,75"/>
    <path d="M280,210 L335,200"/>
    <path d="M280,80 L280,210"/>
    <path d="M330,75 L335,200"/>
    <path d="M280,140 L335,140"/>
    <!-- Branching. -->
    <path d="M280,90 L260,90"/>
    <path d="M280,140 L255,140"/>
    <path d="M280,180 L260,180"/>
  </g>
  <g fill="#dce4f0" opacity="0.95" filter="url(#p16p2bloom)">
    <circle cx="280" cy="82" r="1"/>
    <circle cx="332" cy="77" r="1"/>
    <circle cx="280" cy="208" r="1"/>
    <circle cx="332" cy="198" r="1"/>
  </g>

  <!-- Timber joist FLOOR foreground. -->
  <rect x="0" y="280" width="366" height="40" fill="url(#p16p2joist)" stroke="#080404" stroke-width="0.85"/>
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.85">
    <line x1="0" y1="295" x2="366" y2="295"/>
    <line x1="0" y1="310" x2="366" y2="310"/>
  </g>

  <!-- THRESH — seated against brick wall, knees up, weapon across. -->
  <g id="p16p2-thresh" transform="translate(170, 240)">
    <!-- Body seated leaning against wall (slight back lean). -->
    <path d="M-15,40 L-18,5 L-15,-25 L-8,-40 L8,-40 L15,-25 L18,5 L15,40 Z" fill="url(#p16p2rubyDirty)" stroke="#080404" stroke-width="0.85"/>
    <!-- DENTED LEFT pauldron. -->
    <path d="M-15,-22 L-25,-12 L-25,5 L-15,12" fill="url(#p16p2rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-22,-5 Q-18,3 -17,-1 Z" fill="#3a0810"/>
    <!-- Right pauldron. -->
    <path d="M15,-22 L25,-12 L25,5 L15,12" fill="url(#p16p2rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <!-- Crimson collar dim. -->
    <ellipse cx="0" cy="-40" rx="9" ry="2.5" fill="#f54848" opacity="0.45" filter="url(#p16p2bloom)"/>

    <!-- KNEES DRAWN UP. -->
    <path d="M-15,40 L-18,55 L-22,75 L-12,75 L-8,55 L-3,40 Z" fill="url(#p16p2rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M3,40 L8,55 L12,75 L22,75 L18,55 L15,40 Z" fill="url(#p16p2rubyDirty)" stroke="#080404" stroke-width="0.5"/>

    <!-- WEAPON ACROSS KNEES. -->
    <rect x="-30" y="50" width="60" height="6" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="-22" cy="53" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <ellipse cx="22" cy="53" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <circle cx="0" cy="53" r="1.4" fill="#c84038" opacity="0.65" filter="url(#p16p2bloom)"/>

    <!-- HEAD turned RIGHT (watching entrance). -->
    <ellipse cx="3" cy="-52" rx="11" ry="12" fill="#d8a880"/>
    <path d="M-7,-60 Q3,-66 13,-60 L13,-52 L-7,-52 Z" fill="#a83a18"/>
    <!-- Eyes alert. -->
    <ellipse cx="0" cy="-54" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-54" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="2" cy="-54" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="8" cy="-54" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Cool blue catch (perimeter reflection). -->
    <circle cx="2" cy="-55" r="0.7" fill="#a8d8f8" opacity="0.95" filter="url(#p16p2bloom)"/>
    <circle cx="8" cy="-55" r="0.7" fill="#a8d8f8" opacity="0.95" filter="url(#p16p2bloom)"/>
    <!-- Tense brow. -->
    <path d="M-3,-58 Q3,-62 8,-59" stroke="#5a1808" stroke-width="1" fill="none"/>
    <line x1="-1" y1="-46" x2="6" y2="-46" stroke="#3a1810" stroke-width="0.7"/>

    <!-- Heavy BLUE WASH on suit/face (chosen the cold side). -->
    <ellipse cx="0" cy="-20" rx="22" ry="40" fill="#a8d8f8" opacity="0.35" filter="url(#p16p2strongBloom)"/>
  </g>

  <!-- NO DIALOGUE — silence is character beat. -->

  <!-- Meta. -->
  <g id="p16p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">COLD WATCH</text>
  </g>
</svg>
