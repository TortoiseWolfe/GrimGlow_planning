<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 400" width="245" height="400">
  <title>Issue 2 — Page 11 — Panel 4: Wren turns back, purpose found, copper forearms primed</title>
  <desc>MCU 65mm slight low angle. Wren turns back toward viewer wreckage looms behind dark massive inert again. Battered copper suit muddied rain-soaked, hair half-escaped messy bun, oil-stained forearms. Determination over exhaustion — jaw set eyes sharp flicker purpose. Copper forearm holographic diagnostic tools fully primed brighter than before. Dark hull plating wall behind. WREN core responded my suit frequency not dead changes assessment / SABLE how much / WREN ask me twenty minutes.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p4hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p11p4copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <radialGradient id="p11p4copperPrimed">
      <stop offset="0%" stop-color="#f0a868" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a2818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p11p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG hull plating wall behind. -->
  <rect width="245" height="400" fill="url(#p11p4hull)"/>
  <!-- Faint etched channels (inert). -->
  <g stroke="#080404" stroke-width="0.5" fill="none" opacity="0.85">
    <path d="M0,80 L40,80 L60,100 L120,100"/>
    <path d="M150,60 L200,60 L220,80 L245,80"/>
    <path d="M0,160 L80,160 L100,180 L160,180"/>
    <path d="M180,140 L220,140 L245,160"/>
    <path d="M0,250 L60,250 L80,270 L140,270"/>
    <path d="M170,230 L220,230 L245,250"/>
  </g>
  <!-- Impact fractures. -->
  <g stroke="#080404" stroke-width="0.85" fill="none">
    <path d="M30,40 L50,80 L70,120"/>
    <path d="M180,40 L160,80 L150,120 L160,160"/>
    <path d="M50,300 L80,330 L120,360"/>
  </g>

  <!-- WREN — center frame, MCU turning toward viewer. -->
  <g id="p11p4-wren" transform="translate(122, 230)">
    <!-- Body upper torso. -->
    <path d="M-50,170 L-60,80 L-50,30 L-30,0 L-15,-25 L15,-25 L30,0 L50,30 L60,80 L50,170 Z" fill="url(#p11p4copperDirty)" stroke="#080404" stroke-width="0.85"/>

    <!-- Pauldrons. -->
    <path d="M-30,0 L-50,15 L-50,40 L-30,45 Z" fill="url(#p11p4copperDirty)" stroke="#080404" stroke-width="0.7"/>
    <path d="M30,0 L50,15 L50,40 L30,45 Z" fill="url(#p11p4copperDirty)" stroke="#080404" stroke-width="0.7"/>

    <!-- Copper collar bright. -->
    <ellipse cx="0" cy="-25" rx="20" ry="4" fill="#f0a868" opacity="0.95" filter="url(#p11p4bloom)"/>
    <ellipse cx="0" cy="-25" rx="26" ry="6" fill="#f0a868" opacity="0.55" filter="url(#p11p4strongBloom)"/>

    <!-- Mud streaks. -->
    <g fill="#3a2010" opacity="0.85">
      <ellipse cx="-15" cy="60" rx="6" ry="3" transform="rotate(-15 -15 60)"/>
      <ellipse cx="20" cy="80" rx="5" ry="2.5" transform="rotate(20 20 80)"/>
      <ellipse cx="-25" cy="120" rx="6" ry="3"/>
      <ellipse cx="30" cy="140" rx="5" ry="2.5"/>
    </g>

    <!-- ARMS — both forearms in frame, glowing brighter (primed). -->
    <!-- Left arm down. -->
    <path d="M-50,40 L-58,90 L-48,140 L-42,140 L-44,90 L-40,50 Z" fill="url(#p11p4copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <!-- OIL STAINS on forearm. -->
    <g fill="#1a0808" opacity="0.85">
      <ellipse cx="-52" cy="100" rx="3" ry="1.5"/>
      <ellipse cx="-48" cy="115" rx="2.5" ry="1.5"/>
      <ellipse cx="-50" cy="125" rx="3" ry="1.5"/>
    </g>
    <!-- HOLO DIAGNOSTIC GLOW (primed). -->
    <ellipse cx="-50" cy="115" rx="14" ry="22" fill="url(#p11p4copperPrimed)" filter="url(#p11p4strongBloom)" opacity="0.95"/>
    <!-- Geometric data lines. -->
    <g stroke="#f0a868" stroke-width="0.6" fill="none" opacity="0.95" filter="url(#p11p4bloom)">
      <path d="M-58,100 L-44,100"/>
      <path d="M-58,108 L-46,108"/>
      <path d="M-58,116 L-44,116"/>
      <path d="M-58,124 L-46,124"/>
      <circle cx="-50" cy="100" r="1.5"/>
      <circle cx="-50" cy="116" r="1.5"/>
    </g>

    <!-- Right arm down. -->
    <path d="M50,40 L58,90 L48,140 L42,140 L44,90 L40,50 Z" fill="url(#p11p4copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <g fill="#1a0808" opacity="0.85">
      <ellipse cx="52" cy="100" rx="3" ry="1.5"/>
      <ellipse cx="48" cy="115" rx="2.5" ry="1.5"/>
      <ellipse cx="50" cy="125" rx="3" ry="1.5"/>
    </g>
    <ellipse cx="50" cy="115" rx="14" ry="22" fill="url(#p11p4copperPrimed)" filter="url(#p11p4strongBloom)" opacity="0.95"/>
    <g stroke="#f0a868" stroke-width="0.6" fill="none" opacity="0.95" filter="url(#p11p4bloom)">
      <path d="M44,100 L58,100"/>
      <path d="M46,108 L58,108"/>
      <path d="M44,116 L58,116"/>
      <path d="M46,124 L58,124"/>
      <circle cx="50" cy="100" r="1.5"/>
      <circle cx="50" cy="116" r="1.5"/>
    </g>

    <!-- HEAD — facing viewer (slight low angle so chin lifted). -->
    <ellipse cx="0" cy="-50" rx="28" ry="32" fill="#e0c098"/>

    <!-- Hair UP IN BUN (half-escaped, wet wisps). -->
    <ellipse cx="-3" cy="-78" rx="20" ry="14" fill="#1a0808"/>
    <!-- Bun knot detail. -->
    <ellipse cx="-3" cy="-78" rx="14" ry="10" fill="none" stroke="#3a1808" stroke-width="0.5"/>
    <line x1="-12" y1="-82" x2="0" y2="-72" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="-3" y1="-86" x2="9" y2="-74" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Wet wisps escaping. -->
    <path d="M-22,-65 Q-26,-55 -22,-45" stroke="#1a0808" stroke-width="0.85" fill="none"/>
    <path d="M22,-65 Q26,-55 22,-45" stroke="#1a0808" stroke-width="0.85" fill="none"/>
    <path d="M-15,-90 Q-22,-82 -18,-72" stroke="#1a0808" stroke-width="0.6" fill="none"/>

    <!-- Hairline. -->
    <path d="M-18,-75 Q0,-82 18,-75" stroke="#1a0808" stroke-width="2" fill="none"/>

    <!-- BROW — set determined. -->
    <path d="M-20,-58 Q-10,-65 0,-60" stroke="#3a1808" stroke-width="2.5" fill="none"/>
    <path d="M0,-60 Q10,-65 20,-58" stroke="#3a1808" stroke-width="2.5" fill="none"/>

    <!-- EYES — sharp focused. -->
    <ellipse cx="-10" cy="-48" rx="6" ry="4" fill="#dce4f0"/>
    <ellipse cx="10" cy="-48" rx="6" ry="4" fill="#dce4f0"/>
    <ellipse cx="-9" cy="-48" rx="2.5" ry="2.5" fill="#5a3a18"/>
    <ellipse cx="11" cy="-48" rx="2.5" ry="2.5" fill="#5a3a18"/>
    <ellipse cx="-9" cy="-48" rx="1.4" ry="1.4" fill="#080404"/>
    <ellipse cx="11" cy="-48" rx="1.4" ry="1.4" fill="#080404"/>
    <circle cx="-7" cy="-50" r="0.9" fill="#dce4f0"/>
    <circle cx="13" cy="-50" r="0.9" fill="#dce4f0"/>

    <!-- Cheekbones. -->
    <ellipse cx="-18" cy="-30" rx="8" ry="4" fill="#a87850" opacity="0.45" filter="url(#p11p4bloom)"/>
    <ellipse cx="18" cy="-30" rx="8" ry="4" fill="#a87850" opacity="0.45" filter="url(#p11p4bloom)"/>

    <!-- Nose. -->
    <path d="M-3,-40 L0,-25 L-3,-18" stroke="#5a3a18" stroke-width="0.7" fill="none" opacity="0.85"/>

    <!-- LIPS — set firm. -->
    <line x1="-10" y1="-12" x2="10" y2="-12" stroke="#3a1810" stroke-width="2"/>

    <!-- Jaw set. -->
    <ellipse cx="-22" cy="-15" rx="3" ry="2" fill="#5a3a18" opacity="0.55"/>
    <ellipse cx="22" cy="-15" rx="3" ry="2" fill="#5a3a18" opacity="0.55"/>

    <!-- Faint copper warmth on face. -->
    <ellipse cx="0" cy="-50" rx="34" ry="30" fill="#f0a868" opacity="0.15" filter="url(#p11p4strongBloom)"/>
  </g>

  <!-- DIALOGUE STACK — top: WREN, middle: SABLE, bottom: WREN reply. -->
  <g id="p11p4-bal-wren1">
    <rect x="14" y="14" width="220" height="78" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Core responded to my</text>
    <text x="24" y="67" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">suit frequency. Not dead.</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Changes the assessment.</text>
  </g>

  <g id="p11p4-bal-sable">
    <rect x="14" y="305" width="220" height="40" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="323" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="341" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">How much does it change?</text>
  </g>

  <g id="p11p4-bal-wren2">
    <rect x="14" y="349" width="220" height="40" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="367" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="24" y="385" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Ask me in twenty minutes.</text>
  </g>

  <!-- Meta. -->
  <g id="p11p4-meta">
    <text x="237" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">4</text>
    <text x="241" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">PURPOSE FOUND</text>
  </g>
</svg>
