<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 400" width="366" height="400">
  <title>Issue 2 — Page 13 — Panel 4: Thresh receives verdict, locked down, white knuckles</title>
  <desc>MCU 65mm eye level. Thresh face receiving verdict — broad pale skin defined cheekbones firm jaw military buzz cut copper-red hair. Expression locked down: jaw clenched eyes fixed forward breathing controlled utterly still. Hands grip compact weapon across knees white knuckles only tell. Soldier learned extraction not coming. Red holographic light from off-panel schematic washes face mixing grey daylight. Red on ruby suit intensifies — looks lit by fire dented left pauldron catching glow. NO DIALOGUE silence is character beat.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e48"/>
      <stop offset="100%" stop-color="#1a0810"/>
    </linearGradient>
    <radialGradient id="p13p4redWash">
      <stop offset="0%" stop-color="#f54848" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a82030" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a0810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p13p4rubyFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f54848"/>
      <stop offset="50%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <filter id="p13p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p13p4strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p13p4deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="400" fill="url(#p13p4bg)"/>

  <!-- RED WASH (heavy — looks lit by fire). -->
  <ellipse cx="183" cy="200" rx="280" ry="240" fill="url(#p13p4redWash)" filter="url(#p13p4deepBloom)" opacity="0.85"/>

  <!-- THRESH MCU center. -->
  <g id="p13p4-thresh" transform="translate(183, 200)">
    <!-- Body upper torso. -->
    <path d="M-65,180 L-70,80 L-55,30 L-30,5 L-15,-15 L15,-15 L30,5 L55,30 L70,80 L65,180 Z" fill="url(#p13p4rubyFire)" stroke="#080404" stroke-width="0.85"/>

    <!-- DENTED LEFT pauldron — catching the glow. -->
    <path d="M-30,5 L-58,18 L-58,42 L-30,48" fill="url(#p13p4rubyFire)" stroke="#080404" stroke-width="0.7"/>
    <!-- Dent (concave). -->
    <path d="M-50,22 Q-44,32 -38,28 Q-46,18 -52,22 Z" fill="#3a0810" stroke="#080404" stroke-width="0.5"/>
    <line x1="-50" y1="26" x2="-40" y2="26" stroke="#080404" stroke-width="0.4"/>
    <!-- Right pauldron. -->
    <path d="M30,5 L58,18 L58,42 L30,48" fill="url(#p13p4rubyFire)" stroke="#080404" stroke-width="0.7"/>

    <!-- Crimson collar — pulsing strong with red wash. -->
    <ellipse cx="0" cy="-15" rx="20" ry="4" fill="#f54848" opacity="0.95" filter="url(#p13p4bloom)"/>
    <ellipse cx="0" cy="-15" rx="28" ry="6" fill="#f54848" opacity="0.55" filter="url(#p13p4strongBloom)"/>

    <!-- Mud streaks. -->
    <g fill="#3a1010" opacity="0.85">
      <ellipse cx="-15" cy="60" rx="6" ry="3" transform="rotate(-15 -15 60)"/>
      <ellipse cx="20" cy="80" rx="5" ry="2.5"/>
      <ellipse cx="-25" cy="120" rx="6" ry="3"/>
      <ellipse cx="30" cy="140" rx="5" ry="2.5"/>
    </g>

    <!-- HEAD. -->
    <ellipse cx="0" cy="-50" rx="32" ry="36" fill="#d8a880"/>
    <!-- Skin shading. -->
    <ellipse cx="-22" cy="-30" rx="9" ry="5" fill="#a87850" opacity="0.55" filter="url(#p13p4bloom)"/>
    <ellipse cx="22" cy="-30" rx="9" ry="5" fill="#a87850" opacity="0.55" filter="url(#p13p4bloom)"/>

    <!-- Heavy red wash on face/skin (looks fire-lit). -->
    <ellipse cx="0" cy="-40" rx="34" ry="28" fill="#f54848" opacity="0.45" filter="url(#p13p4strongBloom)"/>

    <!-- BUZZ CUT. -->
    <path d="M-30,-78 Q-15,-92 0,-94 Q15,-92 30,-78 L30,-60 L-30,-60 Z" fill="#a83a18"/>
    <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#5a1808" stroke-width="0.85" opacity="0.85"/>
    <g fill="#5a1808" opacity="0.85">
      <circle cx="-22" cy="-82" r="0.85"/>
      <circle cx="-12" cy="-88" r="0.85"/>
      <circle cx="0" cy="-92" r="0.85"/>
      <circle cx="12" cy="-88" r="0.85"/>
      <circle cx="22" cy="-82" r="0.85"/>
      <circle cx="-25" cy="-72" r="0.85"/>
      <circle cx="25" cy="-72" r="0.85"/>
    </g>

    <!-- Brow LOCKED hard. -->
    <path d="M-22,-58 Q-12,-65 0,-60" stroke="#5a1808" stroke-width="3" fill="none"/>
    <path d="M0,-60 Q12,-65 22,-58" stroke="#5a1808" stroke-width="3" fill="none"/>

    <!-- EYES — fixed forward, controlled, NOT wide (locked down). -->
    <ellipse cx="-13" cy="-46" rx="6" ry="4" fill="#dce4f0"/>
    <ellipse cx="13" cy="-46" rx="6" ry="4" fill="#dce4f0"/>
    <ellipse cx="-12" cy="-46" rx="2.5" ry="2.5" fill="#3a2010"/>
    <ellipse cx="14" cy="-46" rx="2.5" ry="2.5" fill="#3a2010"/>
    <ellipse cx="-12" cy="-46" rx="1.4" ry="1.4" fill="#080404"/>
    <ellipse cx="14" cy="-46" rx="1.4" ry="1.4" fill="#080404"/>
    <!-- Catch-light reflecting RED schematic. -->
    <circle cx="-11" cy="-48" r="0.85" fill="#f54848" opacity="0.95" filter="url(#p13p4bloom)"/>
    <circle cx="15" cy="-48" r="0.85" fill="#f54848" opacity="0.95" filter="url(#p13p4bloom)"/>

    <!-- Nose. -->
    <path d="M-3,-38 L0,-20 L-4,-13" stroke="#3a1808" stroke-width="0.9" fill="none" opacity="0.85"/>

    <!-- LIPS — pressed hard line. -->
    <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#3a1810" stroke-width="2.5"/>

    <!-- JAW MUSCLES (clenched). -->
    <ellipse cx="-25" cy="-15" rx="4" ry="2.5" fill="#5a3a18" opacity="0.65" filter="url(#p13p4bloom)"/>
    <ellipse cx="25" cy="-15" rx="4" ry="2.5" fill="#5a3a18" opacity="0.65" filter="url(#p13p4bloom)"/>

    <!-- WEAPON ACROSS KNEES — at bottom of frame. -->
    <rect x="-90" y="170" width="180" height="14" rx="1" fill="#1a0810" stroke="#080404" stroke-width="0.85"/>
    <rect x="80" y="172" width="22" height="10" fill="#3a1010" stroke="#080404" stroke-width="0.5"/>
    <circle cx="-65" cy="177" r="2" fill="#c84038" opacity="0.65" filter="url(#p13p4bloom)"/>

    <!-- HANDS WHITE-KNUCKLED. -->
    <ellipse cx="-50" cy="178" rx="14" ry="9" fill="#d8a880" stroke="#080408" stroke-width="0.6"/>
    <ellipse cx="50" cy="178" rx="14" ry="9" fill="#d8a880" stroke="#080408" stroke-width="0.6"/>
    <!-- Knuckle definition. -->
    <g stroke="#3a1810" stroke-width="0.85">
      <line x1="-60" y1="172" x2="-55" y2="168"/>
      <line x1="-55" y1="172" x2="-50" y2="168"/>
      <line x1="-50" y1="172" x2="-45" y2="168"/>
      <line x1="-45" y1="172" x2="-40" y2="168"/>
      <line x1="40" y1="172" x2="45" y2="168"/>
      <line x1="45" y1="172" x2="50" y2="168"/>
      <line x1="50" y1="172" x2="55" y2="168"/>
      <line x1="55" y1="172" x2="60" y2="168"/>
    </g>
    <!-- Pale skin highlights (white-knuckle). -->
    <g fill="#fae0c0" opacity="0.95" filter="url(#p13p4bloom)">
      <ellipse cx="-55" cy="170" rx="3" ry="1"/>
      <ellipse cx="-50" cy="170" rx="3" ry="1"/>
      <ellipse cx="-45" cy="170" rx="3" ry="1"/>
      <ellipse cx="45" cy="170" rx="3" ry="1"/>
      <ellipse cx="50" cy="170" rx="3" ry="1"/>
      <ellipse cx="55" cy="170" rx="3" ry="1"/>
    </g>
  </g>

  <!-- NO DIALOGUE — script: silence is character beat. -->

  <!-- Meta. -->
  <g id="p13p4-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">4</text>
    <text x="362" y="392" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">SILENCE</text>
  </g>
</svg>
