<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 420" width="487" height="420">
  <title>Issue 2 — Page 15 — Panel 5: Cavity transformed, dual lighting, soldiers nest into a foxhole</title>
  <desc>MW 35mm slight low angle floor level looking up across cavity interior. Space transformed into base camp. Two timber studs frame composition columns. Equipment arranged: damaged alien components triage on joist surface, medical kit open, engineering tools deployed near brick. Massive iron gas pipe vertical with brackets as shelves. 5 squad work confined space each claimed zone. Lath-and-plaster wall ladder behind. Blue-white perimeter glows entrance background. Warm amber power cell center firelight illumination. Department-colour suit accents glow throughout. Deep shadows. Dual lighting intimate claustrophobic warm cool same close quarters. SABLE this is home until we are not here anymore treat it accordingly.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p5dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p15p5timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p15p5plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89870"/>
      <stop offset="100%" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="p15p5brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p15p5gasPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="50%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="p15p5amber">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f5b860" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p15p5perim">
      <stop offset="0%" stop-color="#a8d8f8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a4868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p15p5silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p15p5copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p15p5rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p15p5sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p15p5emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <filter id="p15p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p15p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p15p5deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark. -->
  <rect width="487" height="420" fill="url(#p15p5dark)"/>

  <!-- LATH-AND-PLASTER WALL background (left). -->
  <rect x="0" y="0" width="80" height="420" fill="url(#p15p5plaster)"/>
  <g stroke="#1a0808" stroke-width="1" opacity="0.85">
    <line x1="0" y1="20" x2="80" y2="20"/>
    <line x1="0" y1="40" x2="80" y2="40"/>
    <line x1="0" y1="60" x2="80" y2="60"/>
    <line x1="0" y1="80" x2="80" y2="80"/>
    <line x1="0" y1="100" x2="80" y2="100"/>
    <line x1="0" y1="120" x2="80" y2="120"/>
    <line x1="0" y1="140" x2="80" y2="140"/>
    <line x1="0" y1="160" x2="80" y2="160"/>
    <line x1="0" y1="180" x2="80" y2="180"/>
    <line x1="0" y1="200" x2="80" y2="200"/>
    <line x1="0" y1="220" x2="80" y2="220"/>
    <line x1="0" y1="240" x2="80" y2="240"/>
    <line x1="0" y1="260" x2="80" y2="260"/>
    <line x1="0" y1="280" x2="80" y2="280"/>
  </g>

  <!-- BRICK WALL background (far right entrance area). -->
  <rect x="427" y="0" width="60" height="420" fill="url(#p15p5brick)"/>
  <g stroke="#080404" stroke-width="0.7" opacity="0.85">
    <line x1="427" y1="40" x2="487" y2="40"/>
    <line x1="427" y1="80" x2="487" y2="80"/>
    <line x1="427" y1="120" x2="487" y2="120"/>
    <line x1="427" y1="160" x2="487" y2="160"/>
    <line x1="427" y1="200" x2="487" y2="200"/>
    <line x1="427" y1="240" x2="487" y2="240"/>
  </g>

  <!-- TIMBER STUDS framing columns. -->
  <rect x="80" y="0" width="40" height="420" fill="url(#p15p5timber)" stroke="#080404" stroke-width="0.85"/>
  <rect x="387" y="0" width="40" height="420" fill="url(#p15p5timber)" stroke="#080404" stroke-width="0.85"/>

  <!-- ENTRANCE GAP w/ BLUE-WHITE PERIMETER LINES (right). -->
  <g id="p15p5-perimeter">
    <path d="M427,80 L455,75 L457,200 L427,210 Z" fill="#a8b0bc" opacity="0.85"/>
    <ellipse cx="430" cy="140" rx="60" ry="80" fill="url(#p15p5perim)" filter="url(#p15p5deepBloom)" opacity="0.85"/>
    <g stroke="#a8d8f8" stroke-width="0.7" fill="none" opacity="0.95" filter="url(#p15p5bloom)">
      <path d="M427,80 L455,75"/>
      <path d="M427,210 L457,200"/>
      <path d="M427,80 L427,210"/>
      <path d="M455,75 L455,200"/>
      <path d="M427,140 L455,140"/>
    </g>
  </g>

  <!-- GAS PIPE vertical (left of center). -->
  <rect x="200" y="0" width="30" height="380" fill="url(#p15p5gasPipe)" stroke="#080404" stroke-width="0.85"/>
  <g fill="#080404" stroke="#1a0808" stroke-width="0.7">
    <rect x="194" y="120" width="42" height="10" rx="2"/>
    <rect x="194" y="240" width="42" height="10" rx="2"/>
  </g>

  <!-- TIMBER JOIST FLOOR. -->
  <rect x="120" y="380" width="267" height="40" fill="url(#p15p5timber)" stroke="#080404" stroke-width="0.85"/>

  <!-- POWER CELL — center, warm amber bloom. -->
  <g id="p15p5-cell" transform="translate(280, 360)">
    <ellipse cx="0" cy="0" rx="160" ry="120" fill="url(#p15p5amber)" filter="url(#p15p5deepBloom)" opacity="0.95"/>
    <path d="M-12,0 L-8,-9 L0,-12 L8,-9 L12,0 L8,9 L0,12 L-8,9 Z" fill="#3a3a44" stroke="#080404" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#ffe8a0" opacity="0.95" filter="url(#p15p5bloom)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" filter="url(#p15p5bloom)"/>
  </g>

  <!-- EQUIPMENT laid out. -->
  <!-- Damaged components triage. -->
  <g fill="#1a1a20" stroke="#080404" stroke-width="0.5">
    <rect x="140" y="370" width="40" height="14" rx="1"/>
    <rect x="190" y="372" width="36" height="12" rx="1"/>
    <rect x="240" y="372" width="44" height="14" rx="1"/>
  </g>
  <!-- Glints on metal. -->
  <g fill="#5a606a" opacity="0.85" filter="url(#p15p5bloom)">
    <ellipse cx="160" cy="372" rx="14" ry="1"/>
    <ellipse cx="208" cy="374" rx="14" ry="1"/>
    <ellipse cx="262" cy="374" rx="18" ry="1"/>
  </g>
  <!-- Medical kit open. -->
  <g fill="#3a3a44" stroke="#080404" stroke-width="0.5">
    <rect x="320" y="370" width="32" height="14" rx="1"/>
  </g>
  <ellipse cx="336" cy="375" rx="6" ry="2" fill="#a878f8" opacity="0.65" filter="url(#p15p5bloom)"/>
  <!-- Engineering tools. -->
  <g fill="#5a3018" stroke="#080404" stroke-width="0.5">
    <rect x="360" y="370" width="20" height="14" rx="1"/>
  </g>

  <!-- 5 SQUAD MEMBERS in claimed zones. -->

  <!-- SABLE — center commanding presence. -->
  <g id="p15p5-sable" transform="translate(260, 280)">
    <path d="M-12,80 L-15,30 L-12,-5 L-6,-20 L6,-20 L12,-5 L15,30 L12,80 Z" fill="url(#p15p5silverDirty)" stroke="#080404" stroke-width="0.7"/>
    <path d="M12,-3 L20,7 L22,22 L20,38" fill="url(#p15p5silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p15p5bloom)"><path d="M14,4 L18,14 L16,24"/></g>
    <ellipse cx="0" cy="-20" rx="9" ry="2.5" fill="#dce4f0" opacity="0.55" filter="url(#p15p5bloom)"/>
    <ellipse cx="0" cy="-32" rx="11" ry="12" fill="#3a2818"/>
    <path d="M-9,-39 Q0,-44 9,-39 L9,-32 L-9,-32 Z" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-34" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-34" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-34" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-34" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-26" x2="3" y2="-26" stroke="#3a1810" stroke-width="0.7"/>
    <!-- Amber warm catch. -->
    <ellipse cx="0" cy="-32" rx="14" ry="10" fill="#ffe8a0" opacity="0.45" filter="url(#p15p5strongBloom)"/>
  </g>

  <!-- WREN at brick wall (right of perimeter). -->
  <g id="p15p5-wren" transform="translate(360, 290)">
    <path d="M-10,70 L-13,20 L-10,-5 L-5,-18 L5,-18 L10,-5 L13,20 L10,70 Z" fill="url(#p15p5copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-18" rx="8" ry="2.5" fill="#f0a868" opacity="0.85" filter="url(#p15p5bloom)"/>
    <g fill="#1a0808" opacity="0.85"><ellipse cx="-10" cy="6" rx="2.5" ry="1.4"/><ellipse cx="10" cy="8" rx="2.5" ry="1.4"/></g>
    <ellipse cx="0" cy="-30" rx="9" ry="10" fill="#e0c098"/>
    <ellipse cx="-1" cy="-39" rx="6" ry="4" fill="#1a0808"/>
    <ellipse cx="-3" cy="-32" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-32" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-32" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-32" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-24" x2="3" y2="-24" stroke="#3a1810" stroke-width="0.6"/>
    <!-- Cool blue catch (near perimeter). -->
    <ellipse cx="0" cy="-30" rx="14" ry="10" fill="#a8d8f8" opacity="0.35" filter="url(#p15p5strongBloom)"/>
  </g>

  <!-- LUMA at center w/ medical kit. -->
  <g id="p15p5-luma" transform="translate(330, 290)">
    <path d="M-10,70 L-13,20 L-10,-5 L-5,-18 L5,-18 L10,-5 L13,20 L10,70 Z" fill="url(#p15p5sapphireDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-18" rx="8" ry="2.5" fill="#a878f8" opacity="0.65" filter="url(#p15p5bloom)"/>
    <ellipse cx="0" cy="-30" rx="9" ry="10" fill="#a87850"/>
    <path d="M-7,-25 Q-13,-15 -12,-3 Q-11,9 -13,19" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <line x1="-9" y1="-21" x2="-12" y2="17" stroke="#a878f8" stroke-width="0.4" opacity="0.85" filter="url(#p15p5bloom)"/>
    <ellipse cx="3" cy="-30" rx="3.5" ry="2.5" fill="#a878f8" opacity="0.65" stroke="#a878f8" stroke-width="0.4"/>
    <ellipse cx="0" cy="-31" rx="1.2" ry="0.9" fill="#dce4f0"/>
    <ellipse cx="0" cy="-31" rx="0.6" ry="0.6" fill="#1a0808"/>
    <line x1="-2" y1="-23" x2="3" y2="-23" stroke="#3a1810" stroke-width="0.5"/>
    <ellipse cx="0" cy="-30" rx="14" ry="10" fill="#ffe8a0" opacity="0.35" filter="url(#p15p5strongBloom)"/>
  </g>

  <!-- THRESH near gas pipe (left perimeter). -->
  <g id="p15p5-thresh" transform="translate(170, 290)">
    <path d="M-13,70 L-15,20 L-13,-5 L-7,-20 L7,-20 L13,-5 L15,20 L13,70 Z" fill="url(#p15p5rubyDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M-13,-3 L-22,7 L-22,22 L-13,28" fill="url(#p15p5rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-19,12 Q-15,18 -14,14 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-20" rx="9" ry="2.5" fill="#f54848" opacity="0.65" filter="url(#p15p5bloom)"/>
    <rect x="-10" y="-2" width="22" height="5" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="0" cy="-32" rx="11" ry="12" fill="#d8a880"/>
    <path d="M-9,-39 Q0,-44 9,-39 L9,-32 L-9,-32 Z" fill="#a83a18"/>
    <ellipse cx="-3" cy="-34" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-34" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-34" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-34" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-26" x2="3" y2="-26" stroke="#3a1810" stroke-width="0.7"/>
    <ellipse cx="0" cy="-32" rx="14" ry="10" fill="#ffe8a0" opacity="0.35" filter="url(#p15p5strongBloom)"/>
  </g>

  <!-- JINK at left, ladder area. -->
  <g id="p15p5-jink" transform="translate(140, 295)">
    <ellipse cx="-8" cy="-10" rx="9" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(45 -8 -10)" filter="url(#p15p5bloom)"/>
    <ellipse cx="8" cy="-10" rx="9" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(-45 8 -10)" filter="url(#p15p5bloom)"/>
    <path d="M-10,65 L-13,18 L-10,-5 L-5,-18 L5,-18 L10,-5 L13,18 L10,65 Z" fill="url(#p15p5emeraldDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-18" rx="8" ry="2.5" fill="#7af0b0" opacity="0.55" filter="url(#p15p5bloom)"/>
    <ellipse cx="0" cy="-30" rx="9" ry="10" fill="#d8b890"/>
    <path d="M-9,-37 Q0,-43 9,-37 L9,-30 L-9,-30 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-4" cy="-39" r="1.2"/><circle cx="0" cy="-41" r="1.2"/><circle cx="4" cy="-39" r="1.2"/></g>
    <ellipse cx="-3" cy="-32" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-32" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-32" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-32" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-24" x2="3" y2="-24" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- DIALOGUE — SABLE. -->
  <g id="p15p5-bal-sable">
    <rect x="14" y="14" width="380" height="46" rx="8" fill="#ffffff" stroke="#5a606a" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#5a606a" letter-spacing="0.3">SABLE</text>
    <text x="24" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">This is home until we are not here. Treat it accordingly.</text>
    <path d="M260,58 L274,58 L268,72 Z" fill="#ffffff" stroke="#5a606a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="260" y1="58" x2="274" y2="58" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p15p5-meta">
    <text x="479" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">5</text>
    <text x="483" y="412" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">FOXHOLE HOME</text>
  </g>
</svg>
