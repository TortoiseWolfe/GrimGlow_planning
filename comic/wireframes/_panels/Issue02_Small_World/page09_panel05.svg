<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 420" width="366" height="420">
  <title>Issue 2 — Page 9 — Panel 5: Reverse from sewer below, squad silhouettes against grey sky</title>
  <desc>Low angle 28mm wide from inside sewer brick channel looking up through grate slots. Squad members visible above as dark silhouettes single file. Suit accents glow as coloured pinpricks moving across slots like stars across barred window. Below frame edge: dark water rushing brick sewer channel fast lethal at fairy scale. Caption box parchment narrative.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p5sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p9p5brickWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="p9p5ironSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p9p5sewerWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="p9p5pin">
      <stop offset="0%" stop-color="#dce4f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a606a" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p9p5strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BRICK SEWER WALL FRAMING (we are inside). -->
  <rect x="0" y="0" width="60" height="420" fill="url(#p9p5brickWall)"/>
  <rect x="306" y="0" width="60" height="420" fill="url(#p9p5brickWall)"/>
  <!-- Brick texture lines. -->
  <g stroke="#1a0808" stroke-width="0.6" opacity="0.85">
    <line x1="0" y1="40" x2="60" y2="40"/>
    <line x1="0" y1="80" x2="60" y2="80"/>
    <line x1="0" y1="120" x2="60" y2="120"/>
    <line x1="0" y1="160" x2="60" y2="160"/>
    <line x1="0" y1="200" x2="60" y2="200"/>
    <line x1="0" y1="240" x2="60" y2="240"/>
    <line x1="0" y1="280" x2="60" y2="280"/>
    <line x1="0" y1="320" x2="60" y2="320"/>
    <line x1="306" y1="40" x2="366" y2="40"/>
    <line x1="306" y1="80" x2="366" y2="80"/>
    <line x1="306" y1="120" x2="366" y2="120"/>
    <line x1="306" y1="160" x2="366" y2="160"/>
    <line x1="306" y1="200" x2="366" y2="200"/>
    <line x1="306" y1="240" x2="366" y2="240"/>
    <line x1="306" y1="280" x2="366" y2="280"/>
    <line x1="306" y1="320" x2="366" y2="320"/>
    <line x1="20" y1="20" x2="20" y2="40"/>
    <line x1="40" y1="60" x2="40" y2="80"/>
    <line x1="20" y1="100" x2="20" y2="120"/>
    <line x1="40" y1="140" x2="40" y2="160"/>
    <line x1="20" y1="180" x2="20" y2="200"/>
    <line x1="40" y1="220" x2="40" y2="240"/>
    <line x1="20" y1="260" x2="20" y2="280"/>
    <line x1="326" y1="20" x2="326" y2="40"/>
    <line x1="346" y1="60" x2="346" y2="80"/>
    <line x1="326" y1="100" x2="326" y2="120"/>
    <line x1="346" y1="140" x2="346" y2="160"/>
    <line x1="326" y1="180" x2="326" y2="200"/>
    <line x1="346" y1="220" x2="346" y2="240"/>
    <line x1="326" y1="260" x2="326" y2="280"/>
  </g>

  <!-- SKY visible through slots above (perspective converging upward). -->
  <!-- Slots between bars rendered as stripes of grey sky. -->
  <g id="p9p5-slots">
    <!-- Each slot: column of sky between iron bars. -->
    <rect x="78" y="0" width="34" height="280" fill="url(#p9p5sky)"/>
    <rect x="148" y="0" width="34" height="280" fill="url(#p9p5sky)"/>
    <rect x="218" y="0" width="34" height="280" fill="url(#p9p5sky)"/>
    <rect x="288" y="0" width="20" height="280" fill="url(#p9p5sky)"/>
  </g>

  <!-- IRON BARS as black silhouettes (vertical pillars). -->
  <g id="p9p5-bars">
    <rect x="60" y="0" width="20" height="280" fill="url(#p9p5ironSilhouette)"/>
    <rect x="112" y="0" width="36" height="280" fill="url(#p9p5ironSilhouette)"/>
    <rect x="180" y="0" width="40" height="280" fill="url(#p9p5ironSilhouette)"/>
    <rect x="252" y="0" width="36" height="280" fill="url(#p9p5ironSilhouette)"/>
    <rect x="306" y="0" width="6" height="280" fill="url(#p9p5ironSilhouette)"/>
  </g>

  <!-- Rain falling visible through slots. -->
  <g stroke="#a8b8c8" stroke-width="0.5" opacity="0.45" filter="url(#p9p5bloom)">
    <line x1="90" y1="20" x2="88" y2="60"/>
    <line x1="100" y1="80" x2="98" y2="120"/>
    <line x1="160" y1="40" x2="158" y2="80"/>
    <line x1="170" y1="120" x2="168" y2="160"/>
    <line x1="230" y1="20" x2="228" y2="60"/>
    <line x1="240" y1="100" x2="238" y2="140"/>
    <line x1="295" y1="60" x2="293" y2="100"/>
  </g>

  <!-- SQUAD SILHOUETTES crossing bars above (small dark figures with coloured pinprick accents). -->
  <!-- SABLE silhouette on bar 2 (silver pinprick). -->
  <g id="p9p5-sable-silhouette">
    <ellipse cx="130" cy="80" rx="9" ry="14" fill="#080404"/>
    <ellipse cx="130" cy="65" rx="6" ry="6" fill="#080404"/>
    <!-- Silver pinprick accent. -->
    <circle cx="130" cy="78" r="2.5" fill="#dce4f0" filter="url(#p9p5bloom)" opacity="0.95"/>
    <ellipse cx="130" cy="78" rx="8" ry="3" fill="url(#p9p5pin)" filter="url(#p9p5strongBloom)" opacity="0.85"/>
  </g>
  <!-- WREN silhouette on bar 3 (copper pinprick). -->
  <g id="p9p5-wren-silhouette">
    <ellipse cx="200" cy="100" rx="9" ry="14" fill="#080404"/>
    <ellipse cx="200" cy="85" rx="6" ry="6" fill="#080404"/>
    <circle cx="200" cy="98" r="2.5" fill="#f0a868" filter="url(#p9p5bloom)" opacity="0.95"/>
    <ellipse cx="200" cy="98" rx="8" ry="3" fill="#f0a868" opacity="0.65" filter="url(#p9p5strongBloom)"/>
  </g>
  <!-- THRESH silhouette on bar 4 (crimson pinprick). -->
  <g id="p9p5-thresh-silhouette">
    <ellipse cx="270" cy="120" rx="10" ry="14" fill="#080404"/>
    <ellipse cx="270" cy="105" rx="6" ry="6" fill="#080404"/>
    <circle cx="270" cy="118" r="2.5" fill="#f54848" filter="url(#p9p5bloom)" opacity="0.95"/>
    <ellipse cx="270" cy="118" rx="8" ry="3" fill="#f54848" opacity="0.65" filter="url(#p9p5strongBloom)"/>
  </g>
  <!-- LUMA silhouette on bar 1 (sapphire pinprick) — last/back. -->
  <g id="p9p5-luma-silhouette">
    <ellipse cx="70" cy="90" rx="6" ry="10" fill="#080404"/>
    <ellipse cx="70" cy="80" rx="4" ry="4" fill="#080404"/>
    <circle cx="70" cy="88" r="2" fill="#a878f8" filter="url(#p9p5bloom)" opacity="0.95"/>
    <ellipse cx="70" cy="88" rx="6" ry="3" fill="#a878f8" opacity="0.65" filter="url(#p9p5strongBloom)"/>
  </g>

  <!-- JINK — emerald point above the bars (circling). -->
  <g id="p9p5-jink-emerald">
    <circle cx="160" cy="30" r="3" fill="#7af0b0" filter="url(#p9p5bloom)" opacity="0.95"/>
    <ellipse cx="160" cy="30" rx="14" ry="6" fill="#7af0b0" opacity="0.55" filter="url(#p9p5strongBloom)"/>
    <!-- Trail. -->
    <path d="M160,30 Q170,25 180,28" stroke="#7af0b0" stroke-width="0.7" fill="none" opacity="0.65" filter="url(#p9p5bloom)"/>
  </g>

  <!-- DARK SEWER WATER at frame bottom. -->
  <g id="p9p5-water">
    <rect x="0" y="280" width="366" height="140" fill="url(#p9p5sewerWater)"/>
    <!-- Water surface ripples. -->
    <g stroke="#5a4030" stroke-width="0.7" opacity="0.85" fill="none">
      <path d="M0,290 Q40,288 80,292 Q120,295 160,290 Q200,288 240,293 Q280,295 320,290 L366,290"/>
      <path d="M0,310 Q60,305 120,310 Q180,315 240,308 Q300,305 366,310"/>
      <path d="M0,335 Q80,330 160,335 Q240,340 320,332 L366,335"/>
      <path d="M0,360 Q100,355 200,360 Q300,365 366,360"/>
    </g>
    <!-- Direction arrows (rushing toward Thames). -->
    <g fill="#3a2818" opacity="0.65">
      <polygon points="40,300 50,302 40,304"/>
      <polygon points="120,318 130,320 120,322"/>
      <polygon points="220,335 230,337 220,339"/>
      <polygon points="280,355 290,357 280,359"/>
    </g>
    <!-- Faint water sheen highlights. -->
    <g fill="#a86028" opacity="0.45" filter="url(#p9p5bloom)">
      <ellipse cx="80" cy="320" rx="18" ry="2"/>
      <ellipse cx="220" cy="345" rx="20" ry="2"/>
      <ellipse cx="320" cy="370" rx="16" ry="2"/>
    </g>
  </g>

  <!-- CAPTION BOX — narrative parchment. -->
  <g id="p9p5-caption">
    <rect x="14" y="14" width="338" height="98" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5" filter="url(#balloonShadow)"/>
    <text x="24" y="36" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
    <text x="24" y="56" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">Five figures crossing a barred sky.</text>
    <text x="24" y="73" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">Below, the Clerkenwell sewer rushes</text>
    <text x="24" y="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">toward the Fleet Ditch at four knots.</text>
    <text x="24" y="107" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#5a4a30">They'll never know the alternative.</text>
  </g>

  <!-- Meta. -->
  <g id="p9p5-meta">
    <text x="358" y="408" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">5</text>
    <text x="362" y="395" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">REVERSE ANGLE</text>
  </g>
</svg>
