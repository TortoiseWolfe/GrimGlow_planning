<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 22 — Panel 2: Hobday MCU, earnest insistence, hands cupped describing</title>
  <desc>MCU 65mm eye level. Hobday late 40s leans forward across pub table hands cupped front miming small contained precise. Describing lights. Eyes earnest — not drunk telling tales practical man works alone dark saw something real needs believer. Firelight catches lines weathered face. Behind pub continues other conversations lives. Frustrated knows what saw can't prove. HOBDAY small lights blue mostly green copper red moving together patrol formation / HOBDAY came down gutter knew where going.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p22p2pubBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <radialGradient id="p22p2firelight">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p2cuppedAura">
      <stop offset="0%" stop-color="#f5b860" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5a2818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p22p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p22p2deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG warm pub. -->
  <rect width="366" height="320" fill="url(#p22p2pubBg)"/>

  <!-- FIRELIGHT WASH (left side from off-frame fire). -->
  <ellipse cx="0" cy="160" rx="280" ry="240" fill="url(#p22p2firelight)" filter="url(#p22p2deepBloom)" opacity="0.85"/>

  <!-- Background pub blur (figures behind, indistinct). -->
  <g opacity="0.45" filter="url(#p22p2bloom)">
    <ellipse cx="280" cy="100" rx="20" ry="30" fill="#3a2818"/>
    <ellipse cx="320" cy="80" rx="18" ry="28" fill="#3a2818"/>
    <ellipse cx="340" cy="120" rx="16" ry="26" fill="#5a3018"/>
  </g>

  <!-- Tobacco smoke haze. -->
  <ellipse cx="200" cy="40" rx="180" ry="30" fill="#a89870" filter="url(#p22p2deepBloom)" opacity="0.45"/>

  <!-- Pub table edge bottom. -->
  <ellipse cx="183" cy="320" rx="200" ry="14" fill="#3a1810" stroke="#080404" stroke-width="0.85"/>
  <ellipse cx="183" cy="312" rx="200" ry="8" fill="#5a3018" stroke="#080404" stroke-width="0.4"/>

  <!-- HOBDAY MCU center frame, leaning forward. -->
  <g id="p22p2-hobday" transform="translate(183, 200)">
    <!-- Body upper torso (leaning forward, slight downward angle). -->
    <path d="M-50,120 L-58,40 L-50,5 L-30,-15 L-15,-22 L15,-22 L30,-15 L50,5 L58,40 L50,120 Z" fill="#3a2818" stroke="#080404" stroke-width="0.85"/>

    <!-- ARMS REACHING FORWARD with hands cupped. -->
    <path d="M-30,-10 L-60,15 L-65,30 L-50,40 L-25,5 Z" fill="#3a2818" stroke="#080404" stroke-width="0.5"/>
    <path d="M30,-10 L60,15 L65,30 L50,40 L25,5 Z" fill="#3a2818" stroke="#080404" stroke-width="0.5"/>
    <!-- Hands CUPPED in front, miming something small. -->
    <ellipse cx="-50" cy="38" rx="8" ry="5" fill="#a87850" stroke="#3a1808" stroke-width="0.5"/>
    <ellipse cx="50" cy="38" rx="8" ry="5" fill="#a87850" stroke="#3a1808" stroke-width="0.5"/>
    <!-- Cupping curve (palms inward). -->
    <path d="M-44,30 Q-30,28 -16,30 Q-2,32 14,30 Q28,28 44,30" stroke="#3a1808" stroke-width="0.5" fill="none"/>
    <!-- Faint amber glow between cupped hands (the lights he's describing — visualizing). -->
    <ellipse cx="0" cy="35" rx="40" ry="8" fill="url(#p22p2cuppedAura)" filter="url(#p22p2strongBloom)" opacity="0.65"/>

    <!-- HEAD weathered face, late 40s. -->
    <ellipse cx="0" cy="-50" rx="32" ry="34" fill="#a87850"/>

    <!-- Flat cap pushed back. -->
    <path d="M-30,-78 Q0,-90 30,-78 L34,-72 L-34,-72 Z" fill="#3a2818"/>
    <ellipse cx="-2" cy="-76" rx="14" ry="3" fill="#1a0808"/>

    <!-- Weathered face — deep lines. -->
    <g stroke="#5a3a18" stroke-width="0.85" fill="none" opacity="0.85">
      <path d="M-22,-32 Q-20,-28 -18,-26"/>
      <path d="M22,-32 Q20,-28 18,-26"/>
      <path d="M-15,-12 Q-12,-10 -10,-12"/>
      <path d="M10,-12 Q12,-10 15,-12"/>
    </g>

    <!-- Brows earnest set. -->
    <path d="M-22,-58 Q-12,-62 0,-58" stroke="#1a0808" stroke-width="2" fill="none"/>
    <path d="M0,-58 Q12,-62 22,-58" stroke="#1a0808" stroke-width="2" fill="none"/>

    <!-- EYES — earnest, wide, looking forward. -->
    <ellipse cx="-12" cy="-46" rx="6" ry="4" fill="#dce4f0"/>
    <ellipse cx="12" cy="-46" rx="6" ry="4" fill="#dce4f0"/>
    <ellipse cx="-11" cy="-46" rx="2.5" ry="2.5" fill="#3a2010"/>
    <ellipse cx="13" cy="-46" rx="2.5" ry="2.5" fill="#3a2010"/>
    <ellipse cx="-11" cy="-46" rx="1.4" ry="1.4" fill="#080404"/>
    <ellipse cx="13" cy="-46" rx="1.4" ry="1.4" fill="#080404"/>
    <!-- Catch-light warm. -->
    <circle cx="-9" cy="-48" r="0.85" fill="#ffe8a0" opacity="0.95" filter="url(#p22p2bloom)"/>
    <circle cx="15" cy="-48" r="0.85" fill="#ffe8a0" opacity="0.95" filter="url(#p22p2bloom)"/>

    <!-- Cheekbones lit warm by firelight. -->
    <ellipse cx="-22" cy="-22" rx="8" ry="4" fill="#5a3a18" opacity="0.65" filter="url(#p22p2bloom)"/>
    <ellipse cx="22" cy="-22" rx="8" ry="4" fill="#5a3a18" opacity="0.65" filter="url(#p22p2bloom)"/>
    <ellipse cx="0" cy="-30" rx="32" ry="22" fill="#f5b860" opacity="0.45" filter="url(#p22p2strongBloom)"/>

    <!-- Nose. -->
    <path d="M-3,-38 L0,-22 L-4,-15" stroke="#3a1808" stroke-width="0.85" fill="none" opacity="0.85"/>

    <!-- Mouth open speaking. -->
    <path d="M-7,-5 Q0,-2 7,-5 L7,-1 Q0,3 -7,-1 Z" fill="#3a1010" stroke="#1a0808" stroke-width="0.5"/>

    <!-- Beard stubble. -->
    <g fill="#1a0808" opacity="0.65">
      <circle cx="-15" cy="-7" r="0.5"/>
      <circle cx="-10" cy="-3" r="0.5"/>
      <circle cx="-5" cy="-1" r="0.5"/>
      <circle cx="5" cy="-1" r="0.5"/>
      <circle cx="10" cy="-3" r="0.5"/>
      <circle cx="15" cy="-7" r="0.5"/>
      <circle cx="-12" cy="-15" r="0.4"/>
      <circle cx="12" cy="-15" r="0.4"/>
    </g>
  </g>

  <!-- DIALOGUE -->
  <g id="p22p2-bal-hobday1">
    <rect x="14" y="14" width="240" height="78" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#6a4220" letter-spacing="0.3">HOBDAY</text>
    <text x="24" y="50" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Small lights. Blue, mostly.</text>
    <text x="24" y="67" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">But coloured too — green,</text>
    <text x="24" y="84" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">copper, red. In formation.</text>
  </g>

  <g id="p22p2-bal-hobday2">
    <rect x="14" y="246" width="240" height="46" rx="8" fill="#ffffff" stroke="#6a4220" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="266" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#6a4220" letter-spacing="0.3">HOBDAY</text>
    <text x="24" y="284" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Came down the gutter like</text>
    <text x="24" y="298" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">they knew where they were going.</text>
  </g>

  <!-- Meta. -->
  <g id="p22p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">EARNEST</text>
  </g>
</svg>
