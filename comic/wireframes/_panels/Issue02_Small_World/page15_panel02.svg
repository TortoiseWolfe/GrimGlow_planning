<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 2 — Page 15 — Panel 2: Thresh clears cavity, weapon up, room-clearing competence</title>
  <desc>MS 50mm eye level dark wall cavity fairy scale. Thresh moves along timber joist military precision weapon raised clearing space — in her element. Sweeps past massive iron gas pipe bracket bridge support structure checks behind. Cobwebs stretch between timber beams trip wires. Ruby suit holographic accents glow faint crimson armored plate edges only illumination — moves trailing red geometric light. Gas pipe dark silhouette. THRESH clear.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p2dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p15p2timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p15p2gasPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080404"/>
      <stop offset="50%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p15p2rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <radialGradient id="p15p2crimsonGlow">
      <stop offset="0%" stop-color="#f54848" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5a1018" stop-opacity="0"/>
    </radialGradient>
    <filter id="p15p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p15p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p15p2deepBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG dark. -->
  <rect width="366" height="320" fill="url(#p15p2dark)"/>

  <!-- Timber joist floor. -->
  <rect x="0" y="260" width="366" height="60" fill="url(#p15p2timber)" stroke="#080404" stroke-width="0.85"/>
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.85">
    <line x1="0" y1="270" x2="366" y2="270"/>
    <line x1="0" y1="285" x2="366" y2="285"/>
    <line x1="0" y1="300" x2="366" y2="300"/>
  </g>
  <!-- Mouse droppings, plaster. -->
  <g fill="#3a2818" opacity="0.85">
    <ellipse cx="60" cy="270" rx="2" ry="1"/>
    <ellipse cx="280" cy="275" rx="2" ry="1"/>
  </g>

  <!-- TIMBER BEAMS top (ceiling/joist bottom). -->
  <rect x="0" y="0" width="366" height="40" fill="url(#p15p2timber)" stroke="#080404" stroke-width="0.85"/>

  <!-- GAS PIPE — vertical column dark silhouette right side. -->
  <rect x="270" y="40" width="36" height="220" fill="url(#p15p2gasPipe)" stroke="#080404" stroke-width="0.85"/>
  <!-- Iron bracket. -->
  <g fill="#080404" stroke="#1a0808" stroke-width="0.7">
    <rect x="262" y="120" width="52" height="12" rx="2"/>
    <rect x="266" y="125" width="44" height="3"/>
  </g>
  <g fill="#080404" stroke="#1a0808" stroke-width="0.7">
    <rect x="262" y="200" width="52" height="12" rx="2"/>
    <rect x="266" y="205" width="44" height="3"/>
  </g>
  <!-- Bracket bolts. -->
  <g fill="#3a3a44" opacity="0.85">
    <circle cx="270" cy="126" r="1.4"/>
    <circle cx="306" cy="126" r="1.4"/>
    <circle cx="270" cy="206" r="1.4"/>
    <circle cx="306" cy="206" r="1.4"/>
  </g>
  <!-- Pipe surface gradient/highlight. -->
  <line x1="285" y1="40" x2="285" y2="260" stroke="#5a606a" stroke-width="0.85" opacity="0.85"/>

  <!-- COBWEBS between timber beams (foreground/background). -->
  <g stroke="#a89870" stroke-width="0.4" fill="none" opacity="0.55">
    <path d="M0,40 Q60,80 120,40"/>
    <path d="M30,30 L60,80 M90,30 L60,80"/>
    <path d="M180,40 Q220,90 270,40"/>
    <path d="M200,30 L220,90 M250,30 L220,90"/>
  </g>

  <!-- CRIMSON HALO around Thresh (only illumination). -->
  <ellipse cx="160" cy="200" rx="160" ry="120" fill="url(#p15p2crimsonGlow)" filter="url(#p15p2deepBloom)" opacity="0.85"/>

  <!-- THRESH — moving along joist, weapon raised. -->
  <g id="p15p2-thresh" transform="translate(160, 230)">
    <!-- Body in motion (slight forward lean). -->
    <path d="M-13,30 L-15,5 L-13,-15 L-7,-25 L7,-25 L13,-15 L15,5 L13,30 Z" fill="url(#p15p2rubyDirty)" stroke="#080404" stroke-width="0.7"/>
    <!-- DENTED LEFT pauldron — catching faint crimson glow. -->
    <path d="M-13,-13 L-22,-3 L-22,12 L-13,18" fill="url(#p15p2rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-19,2 Q-15,8 -14,4 Z" fill="#3a0810"/>
    <ellipse cx="-18" cy="6" rx="4" ry="2" fill="#f54848" opacity="0.65" filter="url(#p15p2bloom)"/>
    <!-- Right pauldron. -->
    <path d="M13,-13 L22,-3 L22,12 L13,18" fill="url(#p15p2rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <!-- Crimson collar — trailing geometric light. -->
    <ellipse cx="0" cy="-25" rx="14" ry="3" fill="#f54848" opacity="0.85" filter="url(#p15p2bloom)"/>
    <ellipse cx="0" cy="-25" rx="22" ry="6" fill="#f54848" opacity="0.45" filter="url(#p15p2strongBloom)"/>
    <!-- Geometric crimson lines on suit edges. -->
    <g stroke="#f54848" stroke-width="0.5" opacity="0.85" filter="url(#p15p2bloom)">
      <line x1="-13" y1="-15" x2="-22" y2="-3"/>
      <line x1="13" y1="-15" x2="22" y2="-3"/>
      <line x1="-13" y1="18" x2="-22" y2="12"/>
      <line x1="13" y1="18" x2="22" y2="12"/>
      <path d="M-12,0 L-8,5"/>
      <path d="M12,0 L8,5"/>
    </g>

    <!-- WEAPON RAISED forward. -->
    <rect x="0" y="-12" width="36" height="6" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="6" cy="-9" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <ellipse cx="32" cy="-9" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <!-- Crimson power node on weapon. -->
    <circle cx="20" cy="-9" r="1.4" fill="#f54848" opacity="0.95" filter="url(#p15p2bloom)"/>

    <!-- Head turned forward (looking past weapon). -->
    <ellipse cx="0" cy="-37" rx="11" ry="12" fill="#d8a880"/>
    <path d="M-9,-44 Q0,-49 9,-44 L9,-37 L-9,-37 Z" fill="#a83a18"/>
    <!-- Eyes — focused, NOT wide (in element). -->
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <!-- Crimson catch-light reflecting off weapon node. -->
    <circle cx="-2" cy="-40" r="0.7" fill="#f54848" opacity="0.95" filter="url(#p15p2bloom)"/>
    <circle cx="4" cy="-40" r="0.7" fill="#f54848" opacity="0.95" filter="url(#p15p2bloom)"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- DIALOGUE — THRESH single word. -->
  <g id="p15p2-bal-thresh">
    <rect x="14" y="14" width="100" height="40" rx="8" fill="#ffffff" stroke="#dc2030" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="32" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="800" fill="#dc2030" letter-spacing="0.3">THRESH</text>
    <text x="24" y="48" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Clear.</text>
    <path d="M70,54 L84,54 L78,66 Z" fill="#ffffff" stroke="#dc2030" stroke-width="2" stroke-linejoin="round"/>
    <line x1="70" y1="54" x2="84" y2="54" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p15p2-meta">
    <text x="358" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="362" y="312" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">CLEAR</text>
  </g>
</svg>
