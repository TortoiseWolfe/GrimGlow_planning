<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 2 — Page 11 — Panel 2: Wren approaches wreckage hull, hand extended assessing</title>
  <desc>MW 35mm eye level. Wreckage resolves into detail — dark grey-black hull plating impact fractures, surface etched faint geometric channels once holographic now dead no light. Shattered transparent panel fragments scattered flagstones reflecting grey sky like dark mirrors. At fairy scale wreckage towers like ruined building. Wren stands before hull one hand extended not touching, focused assessment not grief. Others hang back: Sable watches Wren, Luma watches wreckage, Thresh+Jink scan courtyard. WREN quiet to herself okay let's see what you've got left.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#5a606a"/>
    </linearGradient>
    <linearGradient id="p11p2brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="p11p2flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#3a3e48"/>
    </linearGradient>
    <linearGradient id="p11p2hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="50%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="p11p2copperDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86528"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p11p2silverDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88909a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p11p2rubyDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81820"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="p11p2sapphireDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#28157a"/>
    </linearGradient>
    <linearGradient id="p11p2emeraldDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa078"/>
      <stop offset="100%" stop-color="#0a3818"/>
    </linearGradient>
    <radialGradient id="p11p2copperPrime">
      <stop offset="0%" stop-color="#f0a868" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a2818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p11p2strongBloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG sky strip. -->
  <rect width="742" height="40" fill="url(#p11p2sky)"/>

  <!-- Brick wall background. -->
  <rect x="0" y="40" width="742" height="220" fill="url(#p11p2brick)"/>
  <g stroke="#080404" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="220" x2="742" y2="220"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
  </g>

  <!-- Light drizzle. -->
  <g stroke="#a8b8c8" stroke-width="0.4" opacity="0.45">
    <line x1="60" y1="20" x2="58" y2="40"/>
    <line x1="180" y1="10" x2="178" y2="30"/>
    <line x1="300" y1="25" x2="298" y2="40"/>
    <line x1="660" y1="20" x2="658" y2="40"/>
  </g>

  <!-- WRECKAGE — dominates frame center-right. Towers like ruined building. -->
  <g id="p11p2-wreckage">
    <!-- Main hull silhouette — irregular shape filling right two-thirds. -->
    <path d="M280,260 L290,160 L310,80 L370,50 L450,48 L530,60 L590,90 L640,140 L660,200 L662,260 Z" fill="url(#p11p2hull)" stroke="#080404" stroke-width="1.4"/>

    <!-- Panel seams (sharp angles). -->
    <g stroke="#080404" stroke-width="0.6" fill="none">
      <line x1="310" y1="80" x2="370" y2="120"/>
      <line x1="370" y1="50" x2="370" y2="160"/>
      <line x1="450" y1="48" x2="450" y2="180"/>
      <line x1="530" y1="60" x2="530" y2="200"/>
      <line x1="370" y1="120" x2="450" y2="120"/>
      <line x1="450" y1="160" x2="590" y2="160"/>
      <line x1="450" y1="180" x2="640" y2="180"/>
      <line x1="370" y1="160" x2="530" y2="160"/>
      <line x1="290" y1="160" x2="370" y2="160"/>
    </g>

    <!-- ETCHED HOLOGRAPHIC CHANNELS (dead, geometric, no glow). -->
    <g stroke="#1a1a20" stroke-width="0.7" fill="none" opacity="0.85">
      <path d="M310,90 L370,90 L370,110 L390,110"/>
      <path d="M380,70 L420,70 L440,90"/>
      <path d="M460,55 L500,55 L520,75"/>
      <path d="M380,140 L420,140 L420,160"/>
      <path d="M470,140 L520,140"/>
      <path d="M540,80 L580,80 L600,100 L620,100"/>
      <path d="M540,180 L580,180 L600,200"/>
      <!-- Hexagonal nodes. -->
      <path d="M375,90 L380,87 L385,90 L385,93 L380,96 L375,93 Z"/>
      <path d="M425,140 L430,137 L435,140 L435,143 L430,146 L425,143 Z"/>
      <path d="M515,140 L520,137 L525,140 L525,143 L520,146 L515,143 Z"/>
      <path d="M605,100 L610,97 L615,100 L615,103 L610,106 L605,103 Z"/>
    </g>

    <!-- Impact fractures on hull. -->
    <g stroke="#080404" stroke-width="1" fill="none" opacity="0.85">
      <path d="M380,80 L420,110 L440,130 L460,140"/>
      <path d="M510,90 L530,120 L540,140"/>
      <path d="M460,50 L450,100 L470,130"/>
      <path d="M580,90 L600,130 L620,160"/>
    </g>

    <!-- HULL BREACH (large rip). -->
    <path d="M460,170 L500,200 L530,210 L520,225 L470,210 L450,195 Z" fill="#080404" stroke="#080404" stroke-width="0.7"/>
    <path d="M460,170 L450,195" stroke="#1a1a20" stroke-width="0.5" fill="none"/>
    <path d="M500,200 L520,225" stroke="#1a1a20" stroke-width="0.5" fill="none"/>

    <!-- Wet matte texture (absorbing light). -->
    <g fill="#080404" opacity="0.55">
      <ellipse cx="380" cy="100" rx="15" ry="3"/>
      <ellipse cx="500" cy="120" rx="18" ry="3"/>
      <ellipse cx="600" cy="160" rx="15" ry="3"/>
    </g>
  </g>

  <!-- DEBRIS at base of wreckage. -->
  <g id="p11p2-debris">
    <!-- Newspaper drift. -->
    <g fill="#a89868" opacity="0.85">
      <polygon points="280,260 320,250 330,266 290,268" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="430,256 480,250 490,266 440,268" stroke="#5a4a30" stroke-width="0.3"/>
      <polygon points="610,258 650,254 658,265 614,268" stroke="#5a4a30" stroke-width="0.3"/>
    </g>
    <!-- Newspaper text. -->
    <g stroke="#5a4a30" stroke-width="0.3" opacity="0.65">
      <line x1="290" y1="258" x2="320" y2="256"/>
      <line x1="295" y1="262" x2="318" y2="260"/>
      <line x1="445" y1="258" x2="478" y2="256"/>
      <line x1="450" y1="262" x2="476" y2="260"/>
      <line x1="615" y1="260" x2="650" y2="258"/>
    </g>
    <!-- Dead leaves. -->
    <g fill="#5a3018" opacity="0.85">
      <ellipse cx="350" cy="262" rx="5" ry="2" transform="rotate(20 350 262)"/>
      <ellipse cx="510" cy="262" rx="5" ry="2" transform="rotate(-15 510 262)"/>
      <ellipse cx="565" cy="263" rx="4" ry="2" transform="rotate(30 565 263)"/>
    </g>
    <!-- Canvas scrap. -->
    <path d="M380,255 L420,253 L420,265 L378,265 Z" fill="#3a2818" opacity="0.85" stroke="#1a0808" stroke-width="0.3"/>
    <!-- SHATTERED TRANSPARENT PANELS. -->
    <g fill="#a8b0bc" opacity="0.65">
      <polygon points="200,272 220,275 232,278 218,282" stroke="#080404" stroke-width="0.3"/>
      <polygon points="240,273 260,275 270,280 252,283" stroke="#080404" stroke-width="0.3"/>
      <polygon points="120,278 140,275 156,278 144,284" stroke="#080404" stroke-width="0.3"/>
    </g>
    <!-- Shard reflections (mirrors of grey sky). -->
    <g fill="#dce4f0" opacity="0.85" filter="url(#p11p2bloom)">
      <ellipse cx="218" cy="278" rx="8" ry="1"/>
      <ellipse cx="252" cy="280" rx="8" ry="1"/>
      <ellipse cx="140" cy="280" rx="8" ry="1"/>
    </g>
  </g>

  <!-- COURTYARD FLAGSTONE GROUND foreground. -->
  <rect x="0" y="260" width="742" height="80" fill="url(#p11p2flag)" stroke="#1a1a20" stroke-width="0.85"/>
  <line x1="60" y1="260" x2="60" y2="340" stroke="#1a1a20" stroke-width="1.2"/>
  <line x1="160" y1="260" x2="160" y2="340" stroke="#1a1a20" stroke-width="1.2"/>
  <line x1="260" y1="260" x2="260" y2="340" stroke="#1a1a20" stroke-width="1.2"/>

  <!-- 5 SQUAD MEMBERS. WREN at hull (front-right edge of wreckage). -->
  <g id="p11p2-wren" transform="translate(225, 290)">
    <path d="M-10,32 L-13,5 L-10,-15 L-5,-25 L5,-25 L10,-15 L13,5 L10,32 Z" fill="url(#p11p2copperDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="7" ry="2" fill="#f0a868" opacity="0.85" filter="url(#p11p2bloom)"/>
    <!-- Forearms PRIMED — diagnostic tools powering up. -->
    <ellipse cx="-15" cy="6" rx="10" ry="4" fill="url(#p11p2copperPrime)" filter="url(#p11p2bloom)"/>
    <ellipse cx="15" cy="6" rx="10" ry="4" fill="url(#p11p2copperPrime)" filter="url(#p11p2bloom)"/>
    <g fill="#1a0808" opacity="0.85"><ellipse cx="-12" cy="6" rx="2.5" ry="1.4"/><ellipse cx="12" cy="6" rx="2.5" ry="1.4"/></g>
    <g fill="#3a2010" opacity="0.85"><ellipse cx="-5" cy="0" rx="3" ry="1.4"/><ellipse cx="6" cy="14" rx="3" ry="1.4"/></g>
    <!-- ARM EXTENDED TOWARD HULL (right). -->
    <path d="M10,-8 L40,-12 L43,-6 L11,-2 Z" fill="url(#p11p2copperDirty)" stroke="#080404" stroke-width="0.5"/>
    <ellipse cx="44" cy="-9" rx="4" ry="2.5" fill="#e0c098" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Fingertips. -->
    <line x1="46" y1="-11" x2="48" y2="-11" stroke="#3a1808" stroke-width="0.3"/>
    <line x1="46" y1="-9" x2="48" y2="-9" stroke="#3a1808" stroke-width="0.3"/>
    <line x1="46" y1="-7" x2="48" y2="-7" stroke="#3a1808" stroke-width="0.3"/>
    <ellipse cx="3" cy="-37" rx="9" ry="10" fill="#e0c098"/>
    <ellipse cx="-1" cy="-46" rx="6" ry="4" fill="#1a0808"/>
    <line x1="-3" y1="-48" x2="2" y2="-45" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="2" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="8" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- SABLE watching Wren. -->
  <g id="p11p2-sable" transform="translate(140, 295)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p11p2silverDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M9,-12 L14,-3 L16,10 L14,20" fill="url(#p11p2silverDirty)" stroke="#080404" stroke-width="0.5"/>
    <g stroke="#a8d8f8" stroke-width="0.5" opacity="0.85" filter="url(#p11p2bloom)"><path d="M11,-5 L14,5"/></g>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#dce4f0" opacity="0.45" filter="url(#p11p2bloom)"/>
    <ellipse cx="3" cy="-37" rx="9" ry="10" fill="#3a2818"/>
    <path d="M-7,-44 Q3,-49 12,-44 L12,-37 L-7,-37 Z" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="6" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="0" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="6" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-1" y1="-31" x2="6" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- LUMA studying wreckage. -->
  <g id="p11p2-luma" transform="translate(95, 298)">
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p11p2sapphireDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#a878f8" opacity="0.65" filter="url(#p11p2bloom)"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#a87850"/>
    <path d="M-7,-32 Q-13,-22 -12,-10 Q-11,2 -13,12" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <line x1="-9" y1="-28" x2="-12" y2="10" stroke="#a878f8" stroke-width="0.4" opacity="0.85" filter="url(#p11p2bloom)"/>
    <ellipse cx="3" cy="-37" rx="3.5" ry="2.5" fill="#a878f8" opacity="0.65" stroke="#a878f8" stroke-width="0.4"/>
    <line x1="3" y1="-37" x2="6" y2="-35" stroke="#dce4f0" stroke-width="0.3" opacity="0.85"/>
    <ellipse cx="0" cy="-38" rx="1.2" ry="0.9" fill="#dce4f0"/>
    <ellipse cx="0" cy="-38" rx="0.6" ry="0.6" fill="#1a0808"/>
    <line x1="-2" y1="-30" x2="3" y2="-30" stroke="#3a1810" stroke-width="0.5"/>
  </g>

  <!-- THRESH covers perimeter — far left. -->
  <g id="p11p2-thresh" transform="translate(45, 300)">
    <path d="M-11,28 L-13,5 L-11,-15 L-5,-25 L5,-25 L11,-15 L13,5 L11,28 Z" fill="url(#p11p2rubyDirty)" stroke="#080404" stroke-width="0.6"/>
    <path d="M-11,-13 L-18,-3 L-18,12 L-11,18" fill="url(#p11p2rubyDirty)" stroke="#080404" stroke-width="0.5"/>
    <path d="M-15,2 Q-13,8 -12,4 Z" fill="#3a0810"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#f54848" opacity="0.65" filter="url(#p11p2bloom)"/>
    <!-- Weapon held lateral covering. -->
    <rect x="-8" y="-2" width="22" height="5" rx="0.5" fill="#1a0810" stroke="#080404" stroke-width="0.4"/>
    <ellipse cx="-4" cy="0" rx="3" ry="2" fill="#d8a880" stroke="#080408" stroke-width="0.3"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8a880"/>
    <path d="M-9,-44 Q0,-49 9,-44 L9,-37 L-9,-37 Z" fill="#a83a18"/>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.7"/>
  </g>

  <!-- JINK covers other side, looking around. -->
  <g id="p11p2-jink" transform="translate(700, 295)">
    <ellipse cx="-8" cy="-10" rx="10" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(45 -8 -10)" filter="url(#p11p2bloom)"/>
    <ellipse cx="8" cy="-10" rx="10" ry="3" fill="#3aa078" opacity="0.45" transform="rotate(-45 8 -10)" filter="url(#p11p2bloom)"/>
    <path d="M-9,30 L-12,3 L-9,-15 L-4,-25 L4,-25 L9,-15 L12,3 L9,30 Z" fill="url(#p11p2emeraldDirty)" stroke="#080404" stroke-width="0.6"/>
    <ellipse cx="0" cy="-25" rx="6" ry="2" fill="#7af0b0" opacity="0.55" filter="url(#p11p2bloom)"/>
    <ellipse cx="0" cy="-37" rx="9" ry="10" fill="#d8b890"/>
    <path d="M-9,-44 Q0,-50 9,-44 L9,-37 L-9,-37 Z" fill="#f0d878"/>
    <g fill="#a89048"><circle cx="-4" cy="-46" r="1.2"/><circle cx="0" cy="-48" r="1.2"/><circle cx="4" cy="-46" r="1.2"/></g>
    <ellipse cx="-3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="3" cy="-39" rx="1.4" ry="1" fill="#dce4f0"/>
    <ellipse cx="-3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <ellipse cx="3" cy="-39" rx="0.7" ry="0.7" fill="#1a0808"/>
    <line x1="-3" y1="-31" x2="3" y2="-31" stroke="#3a1810" stroke-width="0.6"/>
  </g>

  <!-- WREN dialogue. -->
  <g id="p11p2-bal-wren">
    <rect x="14" y="14" width="280" height="60" rx="8" fill="#ffffff" stroke="#c87a35" stroke-width="2" filter="url(#balloonShadow)"/>
    <text x="24" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" fill="#c87a35" letter-spacing="0.3">WREN</text>
    <text x="68" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a4a30">(quiet, to herself)</text>
    <text x="24" y="54" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Okay. Okay. Let's see what</text>
    <text x="24" y="71" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">you've got left.</text>
    <path d="M180,76 L196,76 L210,90 Z" fill="#ffffff" stroke="#c87a35" stroke-width="2" stroke-linejoin="round"/>
    <line x1="180" y1="76" x2="196" y2="76" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Meta. -->
  <g id="p11p2-meta">
    <text x="734" y="22" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.65">2</text>
    <text x="738" y="332" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#fff" opacity="0.55">APPROACH</text>
  </g>
</svg>
