<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 11 Panel 4 — Jink looks toward the gap, rehearsing the conversation that comes next</title>
  <desc>Close-up Jink looking toward wall gap where Theodore just departed. Lean androgynous light brown skin wild bright golden blonde curly hair flecked with soot. Preoccupied vulnerable — composing conversation that has not happened yet, hardest words ever had to say. Daylight from gap bright, casting Jink's face in partial shadow, soot-streaked emerald suit's holographic seams glowing faintly. Weight of what must be said visible on features not built for gravity. The scout rehearsing the conversation.</desc>
  <defs>
    <linearGradient id="bgY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="dayGapY4" cx="0.85" cy="0.32" r="0.45">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlowY4" cx="0.42" cy="0.62" r="0.32">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#1a4a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="brickGapY4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1a14"/>
      <stop offset="0.5" stop-color="#a8b0bc" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="emeraldFigY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4d860"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkY4" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.7" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeRehearseY4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="haloY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY4)"/>
  <rect width="366" height="280" fill="url(#dayGapY4)"/>
  <rect width="366" height="280" fill="url(#emeraldGlowY4)"/>

  <g>
    <rect x="0" y="240" width="366" height="40" fill="url(#floorY4)"/>
    <line x1="0" y1="248" x2="366" y2="246" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g>
    <rect x="240" y="40" width="126" height="240" fill="url(#brickGapY4)"/>
    <rect x="240" y="40" width="126" height="240" fill="#a8b0bc" opacity="0.42"/>
  </g>
  <g opacity="0.85" filter="url(#haloY4)">
    <rect x="240" y="40" width="126" height="240" fill="#fff8d8" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="100" cy="120" rx="44" ry="64" fill="#3a261a"/>
    <ellipse cx="100" cy="100" rx="32" ry="40" fill="url(#faceJinkY4)"/>

    <path d="M 56 56 Q 80 32 110 38 Q 142 30 158 56 Q 166 80 158 110 L 144 116 Q 134 64 120 60 Q 104 50 92 78 Q 76 60 68 92 L 60 92 Z" fill="url(#hairBlondeY4)"/>
    <path d="M 64 50 Q 76 38 88 42" stroke="#fff8d8" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M 142 36 Q 154 36 162 50" stroke="#fff8d8" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M 70 70 Q 84 74 96 70" stroke="#a87838" stroke-width="1.4" fill="none" opacity="0.55"/>
    <path d="M 128 64 Q 140 70 152 64" stroke="#a87838" stroke-width="1.4" fill="none" opacity="0.55"/>
    <ellipse cx="74" cy="42" rx="4" ry="2.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="142" cy="38" rx="4" ry="2.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="100" cy="58" rx="3" ry="1.6" fill="#a87838" opacity="0.85"/>

    <ellipse cx="86" cy="106" rx="4" ry="5" fill="#0a0604"/>
    <ellipse cx="114" cy="106" rx="4" ry="5" fill="#0a0604"/>
    <circle cx="86" cy="106" r="2.4" fill="#080404"/>
    <circle cx="114" cy="106" r="2.4" fill="#080404"/>
    <circle cx="89" cy="105" r="1.4" fill="url(#eyeRehearseY4)"/>
    <circle cx="117" cy="105" r="1.4" fill="url(#eyeRehearseY4)"/>

    <path d="M 70 92 Q 88 86 100 92" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M 100 92 Q 114 86 132 92" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <ellipse cx="76" cy="124" rx="6" ry="2" fill="#a87838" opacity="0.55"/>
    <ellipse cx="124" cy="124" rx="6" ry="2" fill="#a87838" opacity="0.55"/>
    <ellipse cx="100" cy="120" rx="2" ry="1" fill="#a87838" opacity="0.55"/>

    <path d="M 90 142 Q 100 142 110 142" stroke="#0a0604" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M 90 144 L 110 144" stroke="#3a2410" stroke-width="0.55" opacity="0.55"/>

    <path d="M 56 168 Q 100 156 144 168 L 158 240 L 42 240 L 50 200 Z" fill="url(#emeraldFigY4)"/>
    <path d="M 64 184 L 136 184 L 150 234 L 50 234 Z" fill="#0a1408" opacity="0.85"/>

    <path d="M 56 168 L 38 196 L 30 240" stroke="url(#emeraldFigY4)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 144 168 L 162 196 L 170 240" stroke="url(#emeraldFigY4)" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowY4)">
    <path d="M 56 168 Q 100 158 144 168" stroke="#3a8858" stroke-width="2.4" fill="none" opacity="0.55"/>
    <ellipse cx="100" cy="200" rx="50" ry="3" fill="#3a8858" opacity="0.42"/>
    <ellipse cx="38" cy="220" rx="9" ry="3" fill="#3a8858" opacity="0.42"/>
    <ellipse cx="160" cy="220" rx="9" ry="3" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.55" filter="url(#bloomY4)">
    <ellipse cx="100" cy="200" rx="80" ry="30" fill="#3a8858" opacity="0.32"/>
  </g>

  <g opacity="0.85">
    <line x1="120" y1="106" x2="240" y2="120" stroke="#a87838" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.55"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="100" cy="246" rx="80" ry="3" fill="#040202"/>
  </g>

  <g opacity="0.55">
    <text x="303" y="156" text-anchor="middle" font-family="Times New Roman, serif" font-size="6" fill="#3a2410" opacity="0.7" font-style="italic">— gone —</text>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.9" stroke="#3a8858" stroke-width="0.7"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#3a8858" font-weight="700" opacity="0.7">JINK ALONE</text>
    <text x="100" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.7">— rehearsing the words —</text>
  </g>
</svg>
