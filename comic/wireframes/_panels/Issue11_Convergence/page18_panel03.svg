<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 18 Panel 3 — Jink deploys wing-pack, "Wings nominal. Mostly."</title>
  <desc>Medium shot. Jink half-deploys holographic wing-pack — one pair of translucent dragonfly wings extending in structured emerald-green light, geometric lattice scaffold visible through soot and wear. Wings cast prismatic emerald light across wooden beam. Jink hovers briefly — feet leaving beam for a second — then touches down. Brief flash of old confidence, grin trying to surface. Wild bright golden blonde curly hair, soot-streaked emerald suit, wings of light.</desc>
  <defs>
    <linearGradient id="bgC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.4" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="emeraldGlowC3" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#1a4830" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitJinkC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.4" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="hairBlondeC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="skinJinkC3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d8b8"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="wingC3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#fff088" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3a8858" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomC3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowC3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowC3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7.4"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgC3)"/>
  <rect width="366" height="280" fill="url(#emeraldGlowC3)"/>

