    <path d="M 174 124 Q 183 124 192 124" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <path d="M 153 220 Q 145 230 140 240" stroke="url(#suitJinkC3)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 215 220 Q 222 230 228 240" stroke="url(#suitJinkC3)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="138" cy="244" rx="9" ry="3" fill="#0a2018" opacity="0.62"/>
    <ellipse cx="230" cy="244" rx="9" ry="3" fill="#0a2018" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#bloomC3)">
    <ellipse cx="183" cy="170" rx="40" ry="22" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="252" rx="60" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="160" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="74" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a8858" font-weight="700">JINK:</text>
    <text x="74" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic" font-weight="700">"Wings nominal. Mostly."</text>
  </g>
