<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 19 Panel 2 — Sable activates her comm unit, "Comms live."</title>
  <desc>Medium shot. Sable touches comm unit on her forearm — small blue-white holographic readout activating, displaying synchronized countdown in standby mode. Go-signal transmitter pulses gently. Dark brown skin, sharp features, silver-white hair. Finger hovers near transmit control. Focused anticipation — commander one step from the order. Blue-white comm light. Grey pre-dawn warming to amber.</desc>
  <defs>
    <linearGradient id="bgD2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="commGlowD2" cx="0.5" cy="0.6" r="0.45">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawnD2" cx="0.95" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitSableD2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="hairSilverD2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset="0.5" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="skinSableD2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3818"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="forearmD2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4858"/>
      <stop offset="0.5" stop-color="#5a6878"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <filter id="bloomD2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowD2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowD2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgD2)"/>
  <rect width="366" height="280" fill="url(#dawnD2)"/>
  <rect width="366" height="280" fill="url(#commGlowD2)"/>

  <g>
    <ellipse cx="183" cy="260" rx="80" ry="11" fill="#040202" opacity="0.55"/>

    <ellipse cx="183" cy="180" rx="44" ry="56" fill="url(#suitSableD2)"/>
    <path d="M 142 144 L 224 144 L 226 226 L 140 226 Z" fill="url(#suitSableD2)"/>

    <path d="M 148 152 L 158 148 L 154 162 L 144 164 Z" fill="#1a1810" opacity="0.85"/>
    <path d="M 200 168 L 210 166 L 208 174 L 196 176 Z" fill="#1a1810" opacity="0.85"/>
    <path d="M 168 192 L 178 190 L 174 200 L 164 200 Z" fill="#1a1810" opacity="0.85"/>
    <path d="M 148 144 Q 183 148 224 144" stroke="#1a1810" stroke-width="0.85" fill="none" opacity="0.62"/>

    <ellipse cx="183" cy="106" rx="22" ry="26" fill="url(#skinSableD2)"/>
    <path d="M 161 92 Q 183 72 205 92 Q 209 100 207 106 L 159 106 Q 159 100 161 92 Z" fill="url(#hairSilverD2)"/>
    <g opacity="0.55" stroke="#7a7a7a" stroke-width="0.4">
      <line x1="167" y1="82" x2="167" y2="96"/>
      <line x1="177" y1="78" x2="177" y2="96"/>
      <line x1="187" y1="78" x2="187" y2="96"/>
      <line x1="197" y1="82" x2="197" y2="96"/>
    </g>

    <ellipse cx="174" cy="108" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="174.6" cy="107.4" r="0.85" fill="#fff8d8"/>
    <ellipse cx="192" cy="108" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="192.6" cy="107.4" r="0.85" fill="#fff8d8"/>

    <path d="M 168 104 Q 174 102 180 104" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 186 104 Q 192 102 198 104" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 178 122 Q 184 122 190 122" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <path d="M 142 226 Q 124 240 110 252" stroke="url(#suitSableD2)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="106" cy="256" rx="9" ry="6" fill="#5a3818"/>

    <path d="M 224 144 Q 264 156 296 184 Q 308 196 304 210" stroke="url(#forearmD2)" stroke-width="22" fill="none" stroke-linecap="round"/>

    <ellipse cx="296" cy="200" rx="4" ry="6" fill="#5a3818"/>
    <ellipse cx="288" cy="208" rx="4" ry="6" fill="#5a3818"/>
    <ellipse cx="280" cy="216" rx="4" ry="6" fill="#5a3818"/>
    <ellipse cx="270" cy="222" rx="4" ry="6" fill="#5a3818"/>

    <rect x="252" y="180" width="56" height="22" rx="3" fill="#1a1828"/>
    <rect x="252" y="180" width="56" height="6" fill="#3a4858" opacity="0.85"/>
    <rect x="256" y="190" width="48" height="9" fill="#040206"/>

    <g font-family="monospace" font-size="4" fill="#a8c0e0">
      <text x="260" y="196" font-weight="700">10:00</text>
      <text x="280" y="196">[STBY]</text>
    </g>
    <circle cx="304" cy="184" r="1.4" fill="#a8c0e0"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowD2)">
    <rect x="252" y="180" width="56" height="22" fill="#a8c0e0" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowD2)">
    <ellipse cx="280" cy="190" rx="60" ry="22" fill="#5a78a8" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomD2)">
    <ellipse cx="183" cy="180" rx="50" ry="22" fill="#7a8898" opacity="0.32"/>
    <ellipse cx="183" cy="106" rx="40" ry="11" fill="#a8c0e0" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="266" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="36" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#5a6478" font-weight="700">SABLE:</text>
    <text x="100" y="21" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#2a2a2a" font-style="italic">"Comms live. Countdown on standby."</text>
    <text x="100" y="31" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#2a2a2a" font-style="italic">"All operators confirm ready status."</text>
  </g>
</svg>
