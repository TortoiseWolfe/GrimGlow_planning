<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 11 Page 22 Panel 1 — Machen's Victorian study, "Elsewhere. A study at University College, London."</title>
  <desc>Wide establishing shot. Interior of Victorian academic study in warm amber lamplight. Books line walls floor to ceiling. Heavy wooden desk covered with papers, newspaper clippings, letters. Small fire burns in cast-iron grate. Standing board with newspaper clippings about telegraph demons, mysterious lights, brownies, strange sightings. At center of desk: thin printed pamphlet, title page facing upward. Warm amber lamplight and firelight — warmest human-scale lighting of the issue.</desc>
