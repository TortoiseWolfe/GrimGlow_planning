    <text x="162" y="76" font-family="monospace" font-size="3.4" fill="#fff088" font-weight="700">9:58</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowD3)">
    <rect x="158" y="60" width="18" height="22" fill="#3a8858" opacity="0.62"/>
  </g>

  <g>
    <rect x="220" y="50" width="14" height="40" rx="2" fill="#a83838"/>
    <rect x="220" y="60" width="14" height="22" rx="1" fill="#1a0810"/>
    <rect x="220" y="60" width="14" height="3" fill="#3a1820"/>
    <text x="222" y="76" font-family="monospace" font-size="3.4" fill="#d83838" font-weight="700">9:58</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowD3)">
    <rect x="218" y="60" width="18" height="22" fill="#d83838" opacity="0.55"/>
  </g>

  <g>
    <rect x="280" y="50" width="14" height="40" rx="2" fill="#7848b8"/>
    <rect x="280" y="60" width="14" height="22" rx="1" fill="#1a1028"/>
    <rect x="280" y="60" width="14" height="3" fill="#3a2868"/>
    <text x="282" y="76" font-family="monospace" font-size="3.4" fill="#a878d8" font-weight="700">9:58</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowD3)">
    <rect x="278" y="60" width="18" height="22" fill="#a878d8" opacity="0.55"/>
  </g>

  <g>
    <path d="M 30 90 L 60 100 L 60 138 L 30 130 Z" fill="url(#forearmGenericD3)" opacity="0.62"/>
    <path d="M 90 90 L 120 100 L 120 138 L 90 130 Z" fill="url(#forearmGenericD3)" opacity="0.62"/>
    <path d="M 150 90 L 180 100 L 180 138 L 150 130 Z" fill="url(#forearmGenericD3)" opacity="0.62"/>
    <path d="M 210 90 L 240 100 L 240 138 L 210 130 Z" fill="url(#forearmGenericD3)" opacity="0.62"/>
    <path d="M 270 90 L 300 100 L 300 138 L 270 130 Z" fill="url(#forearmGenericD3)" opacity="0.62"/>
  </g>

  <g>
    <line x1="40" y1="80" x2="294" y2="80" stroke="#fff8d8" stroke-width="0.4" opacity="0.55" stroke-dasharray="3,3"/>
    <line x1="40" y1="74" x2="294" y2="74" stroke="#fff8d8" stroke-width="0.4" opacity="0.42" stroke-dasharray="2,2"/>
  </g>

  <g>
