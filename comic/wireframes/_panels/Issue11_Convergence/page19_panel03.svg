<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 19 Panel 3 — Six operators synchronized comm check</title>
  <desc>Medium shot. Five tiny figures activate communication units simultaneously — five small holographic readouts blooming on five forearms in silver, copper-gold, emerald, crimson, and sapphire-violet. Through wall gap, boy's hand holds brass-cased hybrid device with matching synchronized display in blue-white. Six readouts, one countdown, the operation made real.</desc>
  <defs>
    <linearGradient id="bgD3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnD3" cx="0.85" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamD3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="brassDeviceD3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="forearmGenericD3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#5a4838"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <filter id="bloomD3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowD3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowD3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgD3)"/>
  <rect width="366" height="280" fill="url(#dawnD3)"/>

  <g>
    <rect x="0" y="220" width="366" height="60" fill="url(#beamD3)"/>
    <line x1="0" y1="226" x2="366" y2="226" stroke="#1a0a04" stroke-width="0.85"/>
  </g>

  <g>
    <rect x="40" y="50" width="14" height="40" rx="2" fill="#7a8898"/>
    <rect x="40" y="60" width="14" height="22" rx="1" fill="#1a1828"/>
    <rect x="40" y="60" width="14" height="3" fill="#3a4858"/>
    <text x="42" y="76" font-family="monospace" font-size="3.4" fill="#a8c0e0" font-weight="700">9:58</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowD3)">
    <rect x="38" y="60" width="18" height="22" fill="#a8c0e0" opacity="0.55"/>
  </g>

  <g>
    <rect x="100" y="50" width="14" height="40" rx="2" fill="#d88838"/>
