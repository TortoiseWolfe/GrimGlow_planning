    <rect x="180" y="160" width="100" height="11" fill="#5a3018"/>
    <rect x="180" y="234" width="100" height="6" fill="#5a3018"/>
    <line x1="184" y1="170" x2="278" y2="170" stroke="#5a3018" stroke-width="0.7"/>
    <line x1="184" y1="232" x2="278" y2="232" stroke="#5a3018" stroke-width="0.7"/>

    <rect x="190" y="180" width="80" height="40" rx="2" fill="#0a0a14"/>
    <rect x="190" y="180" width="80" height="6" fill="#3a4858"/>
    <text x="194" y="200" font-family="monospace" font-size="6" fill="#a8c0e0" font-weight="700">9:58:14</text>
    <text x="194" y="212" font-family="monospace" font-size="4" fill="#5a78a8">[ALL SYNC]</text>

    <circle cx="200" cy="172" r="2" fill="#a85020"/>
    <circle cx="218" cy="172" r="2" fill="#a85020"/>
    <circle cx="236" cy="172" r="2" fill="#a85020"/>
    <circle cx="254" cy="172" r="2" fill="#a85020"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowD3)">
    <rect x="190" y="180" width="80" height="40" fill="#a8c0e0" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowD3)">
    <rect x="180" y="160" width="100" height="80" fill="#d88838" opacity="0.32"/>
  </g>

  <g>
    <path d="M 100 144 L 360 160 L 360 240 L 360 280 L 100 280 Z" fill="#3a2818" opacity="0.62"/>
    <line x1="100" y1="144" x2="360" y2="160" stroke="#080604" stroke-width="0.85"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="252" rx="100" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,8)">
    <rect x="-4" y="0" width="200" height="36" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="96" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a85820" font-weight="700">WREN: "All units synced. Signal clear."</text>
    <text x="96" y="17" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#3a8858" font-weight="700">JINK: "Ready." THRESH: "Ready."</text>
    <text x="96" y="25" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#7848b8" font-weight="700">LUMA: "Ready."</text>
    <text x="96" y="33" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#3a2410" font-weight="700">THEODORE (outside): "Ready."</text>
  </g>
