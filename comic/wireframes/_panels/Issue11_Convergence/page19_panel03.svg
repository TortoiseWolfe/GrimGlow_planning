    <rect x="100" y="60" width="14" height="3" fill="#3a2410"/>
    <text x="102" y="76" font-family="monospace" font-size="3.4" fill="#fff8d8" font-weight="700">9:58</text>
  </g>
  <g opacity="0.85" filter="url(#strongGlowD3)">
    <rect x="98" y="60" width="18" height="22" fill="#d88838" opacity="0.62"/>
