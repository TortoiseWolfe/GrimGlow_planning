<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 220" width="246" height="220">
  <title>Issue 11 Page 12 Panel 5 — Theodore turns to Jink, "What do you mean, walk away?"</title>
  <desc>Close-up Theodore's face turning toward viewer — toward Jink. Sandy-brown hair hazel eyes sharpening from contemplation to concern, freckles. Recognizes gravity in tiny figure's voice. Not how Jink speaks. Something important happening. Warm amber gaslight on face, cold moonlight in hair. Brass gear ring on left index finger catches light at bottom of frame. The boy recognizing what is coming.</desc>
  <defs>
    <linearGradient id="bgZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonAboveZ5" cx="0.5" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a78a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightBelowZ5" cx="0.5" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leadFlashZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.5" stop-color="#3a4868"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <linearGradient id="hairSandyZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="0.7" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="faceTheoZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.85" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <radialGradient id="eyeConcernZ5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassRingZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="handTheoZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <linearGradient id="leatherZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <filter id="bloomZ5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowZ5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="246" height="220" fill="url(#bgZ5)"/>
  <rect width="246" height="220" fill="url(#moonAboveZ5)"/>
  <rect width="246" height="220" fill="url(#gaslightBelowZ5)"/>

  <g opacity="0.55">
