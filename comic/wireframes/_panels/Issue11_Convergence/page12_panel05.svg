    <ellipse cx="123" cy="80" rx="44" ry="52" fill="url(#faceTheoZ5)"/>

    <path d="M 80 36 Q 123 14 166 36 Q 174 60 168 84 L 162 92 Q 142 50 124 44 Q 106 50 84 92 Z" fill="url(#hairSandyZ5)"/>
    <path d="M 86 40 Q 100 28 116 32" stroke="#7a3818" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 130 32 Q 146 28 160 40" stroke="#7a3818" stroke-width="1.4" fill="none" opacity="0.7"/>

    <ellipse cx="100" cy="86" rx="6" ry="8" fill="#0a0604"/>
    <ellipse cx="146" cy="86" rx="6" ry="8" fill="#0a0604"/>
    <circle cx="100" cy="86" r="3.4" fill="#080404"/>
    <circle cx="146" cy="86" r="3.4" fill="#080404"/>
    <circle cx="103" cy="84" r="1.6" fill="url(#eyeConcernZ5)"/>
    <circle cx="149" cy="84" r="1.6" fill="url(#eyeConcernZ5)"/>
    <circle cx="100" cy="86" r="1.4" fill="#a87838"/>
    <circle cx="146" cy="86" r="1.4" fill="#a87838"/>

    <path d="M 78 70 Q 100 64 122 70" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 124 70 Q 146 64 168 70" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>

    <ellipse cx="106" cy="106" rx="6" ry="3" fill="#a85820" opacity="0.55"/>
    <ellipse cx="140" cy="106" rx="6" ry="3" fill="#a85820" opacity="0.55"/>
    <ellipse cx="123" cy="104" rx="3" ry="1.4" fill="#a85820" opacity="0.55"/>

    <path d="M 110 132 Q 124 130 138 132" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 110 134 L 138 134" stroke="#3a2410" stroke-width="0.7" opacity="0.55"/>

    <path d="M 110 156 Q 123 154 136 156" stroke="#3a261a" stroke-width="1.4" fill="none"/>
  </g>

  <g>
    <path d="M 0 200 L 50 188 Q 80 184 120 192" stroke="url(#handTheoZ5)" stroke-width="22" fill="none" stroke-linecap="round"/>

    <ellipse cx="100" cy="190" rx="9" ry="3" fill="url(#brassRingZ5)"/>
    <ellipse cx="100" cy="190" rx="5" ry="1.4" fill="#3a1a08"/>
    <line x1="95" y1="190" x2="105" y2="190" stroke="#5a2e10" stroke-width="0.7"/>
    <line x1="100" y1="186" x2="100" y2="194" stroke="#5a2e10" stroke-width="0.7"/>

    <path d="M 60 190 Q 80 192 100 188" stroke="#5a3622" stroke-width="0.7" fill="none" opacity="0.55"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowZ5)">
    <ellipse cx="100" cy="190" rx="14" ry="5" fill="#f4b860" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowZ5)">
    <ellipse cx="100" cy="190" rx="32" ry="11" fill="#a85820" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <path d="M 130 184 Q 146 180 160 188" stroke="url(#leatherZ5)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.85" filter="url(#bloomZ5)">
    <ellipse cx="123" cy="60" rx="50" ry="11" fill="#a8c0e0" opacity="0.42"/>
    <ellipse cx="123" cy="160" rx="60" ry="22" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="190" rx="50" ry="2.4" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#3a2410" font-weight="700">THEODORE: "What do you</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic" font-weight="700">mean, walk away?"</text>
  </g>
