    <circle cx="120" cy="20" r="0.85" fill="#a8c0e0"/>
    <circle cx="200" cy="14" r="0.7" fill="#a8c0e0"/>
  </g>

  <g>
    <rect x="0" y="180" width="246" height="40" fill="url(#leadFlashZ5)" opacity="0.92"/>
    <line x1="0" y1="184" x2="246" y2="184" stroke="#1a1828" stroke-width="0.55"/>
