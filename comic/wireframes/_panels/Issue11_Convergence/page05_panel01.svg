<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 5 Panel 1 — Six target locations identified by type, "the routes are mapped"</title>
  <desc>Medium eye level Wren pulls up final holographic overlay — six target locations marked with approach routes assessment data copper-gold geometric light. Each location unique marker showing type and difficulty. Projection clean organized detailed — work of engineer who spent the night solving while others slept. Degraded copper suit and messy hair contrast with precision of planning. Copper-gold holographic light, clean geometric lines, organized tactical data. The planner's work complete.</desc>
