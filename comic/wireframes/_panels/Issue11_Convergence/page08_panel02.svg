<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 8 Panel 2 — Wren rigs the synchronization, six countdowns linked</title>
  <desc>Medium Wren adding synchronized timing indicators to tactical projection — six countdown timers appearing beside each target marker, all linked by thin holographic threads. Triggers test, all six counters start simultaneously in copper-gold geometric numerals. Oil-stained hands work with precision, building synchronization system from salvaged comms equipment. Satisfaction of elegant engineering visible despite gravity. Brilliant improvisation.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperFillY2" x1="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="hairBlkY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceWrenY2" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="amberCoreY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgY2)"/>
  <rect width="366" height="240" fill="url(#copperFillY2)"/>

  <g>
    <rect x="0" y="200" width="366" height="40" fill="url(#floorY2)"/>
    <line x1="0" y1="208" x2="366" y2="206" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g opacity="0.92">
    <rect x="160" y="40" width="180" height="140" fill="none" stroke="#a85820" stroke-width="0.5" opacity="0.7"/>

    <g opacity="0.85">
      <rect x="170" y="56" width="46" height="22" fill="none" stroke="#a85820" stroke-width="0.55"/>
      <circle cx="180" cy="67" r="3" fill="url(#amberCoreY2)" stroke="#5a2e10" stroke-width="0.4"/>
      <text x="180" y="69" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#080404" font-weight="900">S</text>
      <text x="206" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" font-weight="700">90</text>
      <text x="206" y="74" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">EXCH-A</text>

      <rect x="226" y="56" width="46" height="22" fill="none" stroke="#a85820" stroke-width="0.55"/>
      <circle cx="236" cy="67" r="3" fill="url(#amberCoreY2)" stroke="#5a2e10" stroke-width="0.4"/>
      <text x="236" y="69" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#080404" font-weight="900">W</text>
      <text x="262" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" font-weight="700">90</text>
      <text x="262" y="74" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">EXCH-B</text>

      <rect x="282" y="56" width="46" height="22" fill="none" stroke="#a85820" stroke-width="0.55"/>
      <circle cx="292" cy="67" r="3" fill="url(#amberCoreY2)" stroke="#5a2e10" stroke-width="0.4"/>
      <text x="292" y="69" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#080404" font-weight="900">J</text>
      <text x="318" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" font-weight="700">90</text>
      <text x="318" y="74" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">COMMR</text>

      <rect x="170" y="100" width="46" height="22" fill="none" stroke="#a85820" stroke-width="0.55"/>
      <circle cx="180" cy="111" r="3" fill="url(#amberCoreY2)" stroke="#5a2e10" stroke-width="0.4"/>
      <text x="180" y="113" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#080404" font-weight="900">T</text>
      <text x="206" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" font-weight="700">90</text>
      <text x="206" y="118" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">RELAY</text>

      <rect x="226" y="100" width="46" height="22" fill="none" stroke="#a85820" stroke-width="0.55"/>
      <circle cx="236" cy="111" r="3" fill="url(#amberCoreY2)" stroke="#5a2e10" stroke-width="0.4"/>
      <text x="236" y="113" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#080404" font-weight="900">L</text>
      <text x="262" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" font-weight="700">90</text>
      <text x="262" y="118" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">DISPATCH</text>

      <rect x="282" y="100" width="46" height="22" fill="none" stroke="#a85820" stroke-width="0.55"/>
      <rect x="285" y="103" width="9" height="9" fill="url(#amberCoreY2)" stroke="#5a2e10" stroke-width="0.4"/>
      <text x="289" y="111" text-anchor="middle" font-family="Times New Roman, serif" font-size="6" fill="#080404" font-weight="900" font-style="italic">H</text>
      <text x="318" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" font-weight="700">90</text>
      <text x="318" y="118" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">JUNCTION</text>
    </g>

    <g opacity="0.85" stroke="#fff8d8" stroke-width="0.4" fill="none" stroke-dasharray="2 1.4">
      <path d="M 216 67 L 226 67"/>
      <path d="M 272 67 L 282 67"/>
      <path d="M 216 111 L 226 111"/>
      <path d="M 272 111 L 282 111"/>
      <path d="M 193 78 L 193 100"/>
      <path d="M 249 78 L 249 100"/>
      <path d="M 305 78 L 305 100"/>
      <path d="M 193 132 L 305 132"/>
      <path d="M 250 132 L 250 144"/>
      <path d="M 250 144 L 250 156"/>
    </g>

    <rect x="220" y="148" width="60" height="22" rx="2" fill="url(#amberCoreY2)" stroke="#5a2e10" stroke-width="0.7"/>
    <text x="250" y="160" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#080404" font-weight="900">SYNC PULSE</text>
    <text x="250" y="166" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#3a1a08" opacity="0.85">— ONE SIGNAL —</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowY2)">
    <rect x="220" y="148" width="60" height="22" fill="#fff8d8" opacity="0.55"/>
    <text x="206" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" opacity="0.55" font-weight="700">90</text>
    <text x="262" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" opacity="0.55" font-weight="700">90</text>
    <text x="318" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" opacity="0.55" font-weight="700">90</text>
    <text x="206" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" opacity="0.55" font-weight="700">90</text>
    <text x="262" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" opacity="0.55" font-weight="700">90</text>
    <text x="318" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="6" fill="#fff8d8" opacity="0.55" font-weight="700">90</text>
  </g>
  <g opacity="0.55" filter="url(#megaGlowY2)">
    <rect x="160" y="40" width="180" height="140" fill="#a85820" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="80" cy="100" rx="22" ry="26" fill="#3a261a"/>
    <ellipse cx="80" cy="86" rx="14" ry="16" fill="url(#faceWrenY2)"/>

    <path d="M 62 64 Q 80 50 98 64 Q 102 80 98 92 L 92 100 Q 86 74 80 68 Q 74 74 68 100 Z" fill="url(#hairBlkY2)"/>
    <ellipse cx="96" cy="58" rx="6" ry="4" fill="url(#hairBlkY2)"/>

    <ellipse cx="74" cy="88" rx="2.4" ry="3" fill="#0a0604"/>
    <ellipse cx="86" cy="88" rx="2.4" ry="3" fill="#0a0604"/>

    <path d="M 66 80 Q 76 76 84 80" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 82 80 Q 92 76 98 80" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 72 104 Q 80 104 88 104" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 56 120 Q 80 112 104 120 L 116 200 L 44 200 L 50 168 Z" fill="url(#copperFigY2)"/>
    <path d="M 64 132 L 96 132 L 104 196 L 56 196 Z" fill="#5a2e10" opacity="0.7"/>

    <path d="M 104 120 L 124 110 L 144 100 L 162 92" stroke="url(#copperFigY2)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="164" cy="90" rx="5" ry="4" fill="#9a5828"/>

    <path d="M 56 120 L 38 110 L 22 100" stroke="url(#copperFigY2)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="20" cy="98" rx="5" ry="4" fill="#9a5828"/>
  </g>

  <g opacity="0.85">
    <line x1="166" y1="86" x2="180" y2="78" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4"/>
  </g>

  <g opacity="0.85" filter="url(#bloomY2)">
    <ellipse cx="80" cy="160" rx="60" ry="20" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="80" cy="206" rx="44" ry="2.4" fill="#040202"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#a85820" font-weight="700">WREN: "Synchronized signal</text>
    <text x="100" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">from salvaged comms. One pulse</text>
    <text x="100" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">starts all timers. The countdown is shared."</text>
  </g>
</svg>
