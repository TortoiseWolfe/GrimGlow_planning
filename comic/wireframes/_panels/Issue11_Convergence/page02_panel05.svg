<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 250" width="742" height="250">
  <title>Issue 11 Page 2 Panel 5 — Wren delivers the core revelation, "They're steering the entire industrial revolution"</title>
  <desc>Medium wide eye level Wren stands before expanded holographic projection both hands raised manipulating network map of city's telegraph infrastructure copper-gold light. Zooms into dense cluster amber-black markers concentrated at central telegraph exchange. Network lines pulse with flowing amber-black energy — alien influence moving through system like poison in veins. Projection fills air behind and above. Copper suit catches both light sources — copper-gold from her own tech, amber-black reflected from threat. Professional alarm — engineer delivering the worst diagnosis. Amber-black pulse dominates visualization, overpowering copper-gold network lines. The scope of the threat articulated.</desc>
  <defs>
    <linearGradient id="bgX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperX5" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberDomX5" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperFigX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="hairBlkX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceWrenX5" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="amberCoreX5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <filter id="bloomX5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowX5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowX5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ultraGlowX5" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="742" height="250" fill="url(#bgX5)"/>
  <rect width="742" height="250" fill="url(#copperX5)"/>
  <rect width="742" height="250" fill="url(#amberDomX5)"/>

  <g>
