    <circle cx="380" cy="120" r="11" fill="#a87838" opacity="0.65"/>
    <circle cx="520" cy="120" r="11" fill="#a87838" opacity="0.65"/>
    <circle cx="450" cy="50" r="9" fill="#a87838" opacity="0.55"/>
    <circle cx="450" cy="150" r="9" fill="#a87838" opacity="0.55"/>
  </g>

  <g opacity="0.85" stroke="#a87838" stroke-width="0.85" fill="none">
    <path d="M 380 80 L 412 92 L 450 100 L 488 92 L 520 80" stroke-dasharray="3 1.4"/>
    <path d="M 380 120 L 412 108 L 450 100 L 488 108 L 520 120" stroke-dasharray="3 1.4"/>
    <path d="M 450 50 L 450 100 L 450 150" stroke-dasharray="3 1.4"/>
  </g>

  <g opacity="0.7">
    <text x="450" y="34" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#a85820" opacity="0.85">CENTRAL EXCHANGE</text>
    <text x="280" y="56" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.65">RELAY</text>
    <text x="620" y="56" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.65">RELAY</text>
    <text x="200" y="96" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.65">SUB</text>
    <text x="700" y="96" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.65">SUB</text>
  </g>

