<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 11 Page 8 Panel 4 — Through the wall gap, the city's telegraph network revealed</title>
  <desc>Wide establishing through crack in brickwork — Victorian city in morning light beyond. Rooftops chimneys church spires in grey-white morning atmosphere. Threading through cityscape, visible everywhere: telegraph lines. Hundreds strung between poles and buildings, web of dark threads connecting infrastructure of industrial civilization. Lines delicate almost invisible individually but together form nervous system spanning city. City unaware of what runs through its veins. The infrastructure of subversion, hiding in plain sight.</desc>
