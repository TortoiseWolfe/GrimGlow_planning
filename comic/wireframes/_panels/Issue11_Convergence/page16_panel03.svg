<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 11 Page 16 Panel 3 — Sable closing the data module for the last time</title>
  <desc>Medium shot. Sable on main beam near wall gap, data module in hand. Dark brown skin, sharp angular features, very short military-cropped silver-white hair, almost buzz-cut. Thumb moves across device's surface in deliberate shutting-down gesture. Holographic display collapses — blue-white geometric fairy script dimming, folding inward, vanishing. Light transitions: cool blue-white fading, warm amber gaslight from wall gap remaining. Quiet acceptance — relief of putting down a broken compass because the stars are finally visible. Soot-darkened silver suit catches transitioning light.</desc>
  <defs>
    <linearGradient id="bgA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="gaslightA3" cx="0.85" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="holoFadingA3" cx="0.32" cy="0.55" r="0.22">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitSableA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#4a5868"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="hairSilverA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset="0.5" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="skinSableA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3818"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="moduleA3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <linearGradient id="wallGapA3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#3a2410"/>
    </linearGradient>
    <filter id="bloomA3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowA3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowA3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="dimGlowA3" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="742" height="260" fill="url(#bgA3)"/>
  <rect width="742" height="260" fill="url(#gaslightA3)"/>
  <rect width="742" height="260" fill="url(#holoFadingA3)"/>

  <g>
    <rect x="540" y="60" width="160" height="180" fill="url(#wallGapA3)" opacity="0.62"/>
    <rect x="540" y="60" width="3" height="180" fill="#1a0a04"/>
    <rect x="697" y="60" width="3" height="180" fill="#1a0a04"/>
    <g opacity="0.55" stroke="#1a0a04" stroke-width="0.55">
      <line x1="540" y1="100" x2="700" y2="98"/>
      <line x1="540" y1="140" x2="700" y2="142"/>
      <line x1="540" y1="180" x2="700" y2="178"/>
