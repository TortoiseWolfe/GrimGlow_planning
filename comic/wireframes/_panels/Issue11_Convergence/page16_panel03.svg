    <line x1="0" y1="206" x2="742" y2="206" stroke="#1a0a04" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#1a0a04" stroke-width="0.4">
      <line x1="80" y1="206" x2="80" y2="260"/>
      <line x1="200" y1="206" x2="200" y2="260"/>
      <line x1="380" y1="206" x2="380" y2="260"/>
      <line x1="520" y1="206" x2="520" y2="260"/>
      <line x1="660" y1="206" x2="660" y2="260"/>
    </g>
  </g>

  <g>
    <ellipse cx="320" cy="240" rx="80" ry="14" fill="#040202" opacity="0.62"/>

    <ellipse cx="320" cy="170" rx="44" ry="56" fill="url(#suitSableA3)"/>
    <path d="M 280 130 L 360 130 L 364 200 L 276 200 Z" fill="url(#suitSableA3)"/>
    <ellipse cx="280" cy="186" rx="11" ry="14" fill="url(#suitSableA3)"/>
    <ellipse cx="360" cy="186" rx="11" ry="14" fill="url(#suitSableA3)"/>

    <path d="M 285 138 L 290 142 L 285 146 Z M 350 148 L 358 150 L 354 156 Z M 305 165 L 312 168 L 308 172 Z" fill="#1a1810" opacity="0.85"/>
    <path d="M 295 170 Q 320 174 345 170" stroke="#1a1810" stroke-width="0.85" fill="none" opacity="0.62"/>

    <ellipse cx="320" cy="100" rx="22" ry="26" fill="url(#skinSableA3)"/>
    <path d="M 296 88 Q 320 70 344 88 Q 348 96 346 100 L 296 100 Q 294 96 296 88 Z" fill="url(#hairSilverA3)"/>
    <g opacity="0.55" stroke="#7a7a7a" stroke-width="0.4">
      <line x1="302" y1="86" x2="302" y2="92"/>
      <line x1="312" y1="82" x2="312" y2="92"/>
      <line x1="322" y1="80" x2="322" y2="92"/>
      <line x1="332" y1="82" x2="332" y2="92"/>
      <line x1="342" y1="86" x2="342" y2="92"/>
    </g>

    <circle cx="312" cy="102" r="1.4" fill="#0a0604"/>
    <circle cx="328" cy="102" r="1.4" fill="#0a0604"/>
    <path d="M 308 98 Q 312 96 316 98" stroke="#0a0604" stroke-width="0.7" fill="none"/>
    <path d="M 324 98 Q 328 96 332 98" stroke="#0a0604" stroke-width="0.7" fill="none"/>
    <path d="M 314 114 Q 320 116 326 114" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <path d="M 280 200 Q 270 210 260 218" stroke="url(#suitSableA3)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 360 200 Q 350 210 340 218" stroke="url(#suitSableA3)" stroke-width="14" fill="none" stroke-linecap="round"/>

    <ellipse cx="252" cy="222" rx="9" ry="6" fill="#5a3818"/>
    <ellipse cx="332" cy="222" rx="9" ry="6" fill="#5a3818"/>
  </g>

  <g>
    <rect x="320" y="218" width="34" height="14" rx="2" fill="url(#moduleA3)"/>
    <rect x="320" y="218" width="34" height="3" fill="#5a78a8" opacity="0.42"/>
    <rect x="322" y="222" width="30" height="9" fill="#080a14" opacity="0.85"/>

    <path d="M 322 224 L 326 226 L 322 228" stroke="#5a78a8" stroke-width="0.55" fill="none" opacity="0.32"/>
    <path d="M 330 224 L 334 226 L 330 228" stroke="#5a78a8" stroke-width="0.55" fill="none" opacity="0.32"/>
    <path d="M 338 224 L 342 226 L 338 228" stroke="#5a78a8" stroke-width="0.55" fill="none" opacity="0.32"/>
  </g>
  <g opacity="0.42" filter="url(#dimGlowA3)">
    <ellipse cx="337" cy="224" rx="22" ry="6" fill="#a8c0e0" opacity="0.42"/>
  </g>
  <g opacity="0.32" filter="url(#strongGlowA3)">
    <ellipse cx="337" cy="224" rx="40" ry="14" fill="#5a78a8" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomA3)">
    <ellipse cx="320" cy="100" rx="50" ry="11" fill="#a8c0e0" opacity="0.22"/>
    <ellipse cx="320" cy="170" rx="44" ry="22" fill="#f4b860" opacity="0.32"/>
  </g>

  <g opacity="0.62" filter="url(#bloomA3)">
    <ellipse cx="620" cy="170" rx="60" ry="40" fill="#f4b860" opacity="0.42"/>
  </g>
</svg>
