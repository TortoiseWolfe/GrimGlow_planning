<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 7 Panel 5 — Squad reunited around the tactical display, assignments delivered</title>
  <desc>Medium wide eye level five tiny figures positioned around holographic tactical display — military unit reunited by purpose. Soot-darkened silver at center commanding. Oil-stained copper beside projection controls. Soot-streaked emerald standing ready. Dented crimson armor with weapon in hand. Dusty sapphire-violet with active scanner. All suits heavily degraded — patched scuffed stained — but holographic elements glow through grime, responding to tactical data. Copper-gold projection casts unified light across five damaged figures. Grey-white daylight from wall gap behind. Five faces with different emotions and same commitment. Look like fairy tales getting ready for war. The squad reunited.</desc>
