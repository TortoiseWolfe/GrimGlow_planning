<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 11 Page 18 Panel 1 — Squad in line, geared and ready</title>
  <desc>Medium wide shot. Five tiny figures stand in a line on rough wooden beam, fully geared. All suits heavily degraded — soot-darkened, patched with copper wire and brass scraps, dented, scuffed — but holographic elements glow through grime in five jewel-tone colors: silver, copper-gold, emerald, crimson, sapphire-violet. Five faces, five colors, one direction. Pre-dawn grey-blue from wall gap behind them. Last gaslight from below fading. Fairy tales getting ready for war.</desc>
  <defs>
    <linearGradient id="bgC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.4" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnC1" cx="0.5" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#5a78a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightFadingC1" cx="0.5" cy="1" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitSilverC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="suitCopperC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.4" stop-color="#a85820"/>
      <stop offset="1" stop-color="#3a1810"/>
    </linearGradient>
    <linearGradient id="suitEmeraldC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="suitCrimsonC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.5" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="suitSapphireC1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <filter id="bloomC1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowC1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowC1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="742" height="220" fill="url(#bgC1)"/>
  <rect width="742" height="220" fill="url(#dawnC1)"/>
  <rect width="742" height="220" fill="url(#gaslightFadingC1)"/>

  <g opacity="0.32">
    <rect x="0" y="0" width="742" height="220" fill="#1a0a04"/>
    <rect x="80" y="0" width="40" height="220" fill="#3a2418" opacity="0.55"/>
    <rect x="240" y="0" width="40" height="220" fill="#3a2418" opacity="0.55"/>
    <rect x="460" y="0" width="40" height="220" fill="#3a2418" opacity="0.55"/>
    <rect x="620" y="0" width="40" height="220" fill="#3a2418" opacity="0.55"/>
  </g>

  <g>
    <rect x="180" y="40" width="380" height="120" fill="url(#bgC1)" opacity="0.85"/>
    <rect x="180" y="40" width="380" height="120" fill="url(#dawnC1)" opacity="0.85"/>
    <rect x="180" y="40" width="3" height="120" fill="#1a0a04"/>
    <rect x="557" y="40" width="3" height="120" fill="#1a0a04"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowC1)">
    <rect x="180" y="40" width="380" height="120" fill="#a8c0e0" opacity="0.32"/>
  </g>

  <g>
    <rect x="0" y="160" width="742" height="60" fill="url(#beamC1)"/>
    <line x1="0" y1="166" x2="742" y2="166" stroke="#1a0a04" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#1a0a04" stroke-width="0.4">
      <line x1="80" y1="166" x2="80" y2="220"/>
      <line x1="220" y1="166" x2="220" y2="220"/>
      <line x1="380" y1="166" x2="380" y2="220"/>
      <line x1="540" y1="166" x2="540" y2="220"/>
      <line x1="660" y1="166" x2="660" y2="220"/>
    </g>
    <ellipse cx="160" cy="200" rx="40" ry="3" fill="#040202" opacity="0.55"/>
    <ellipse cx="290" cy="200" rx="40" ry="3" fill="#040202" opacity="0.55"/>
    <ellipse cx="420" cy="200" rx="40" ry="3" fill="#040202" opacity="0.55"/>
    <ellipse cx="540" cy="200" rx="40" ry="3" fill="#040202" opacity="0.55"/>
    <ellipse cx="660" cy="200" rx="40" ry="3" fill="#040202" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="160" cy="135" rx="14" ry="22" fill="url(#suitSilverC1)"/>
    <circle cx="160" cy="115" r="9" fill="#5a3818"/>
    <ellipse cx="156" cy="113" rx="6" ry="2" fill="#a8a8a8" opacity="0.62"/>
    <path d="M 145 138 L 152 142 L 148 148 Z" fill="#1a1810" opacity="0.85"/>
    <path d="M 168 144 L 174 148 L 170 154 Z" fill="#1a1810" opacity="0.85"/>
    <line x1="146" y1="124" x2="174" y2="126" stroke="#fff8d8" stroke-width="0.62" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC1)">
    <ellipse cx="160" cy="135" rx="14" ry="22" fill="#a8c0e0" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="290" cy="135" rx="14" ry="22" fill="url(#suitCopperC1)"/>
    <circle cx="290" cy="115" r="9" fill="#3a2410"/>
    <ellipse cx="290" cy="112" rx="6" ry="3" fill="#1a0a08"/>
    <path d="M 275 138 L 280 142 L 277 148 Z" fill="#1a0a08" opacity="0.85"/>
    <path d="M 300 152 L 306 156 L 302 162 Z" fill="#1a0a08" opacity="0.85"/>
    <line x1="276" y1="126" x2="304" y2="128" stroke="#fff8d8" stroke-width="0.62" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC1)">
    <ellipse cx="290" cy="135" rx="14" ry="22" fill="#d88838" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="420" cy="135" rx="14" ry="22" fill="url(#suitEmeraldC1)"/>
    <circle cx="420" cy="115" r="9" fill="#a87838"/>
    <path d="M 411 110 Q 420 96 432 110 Q 432 116 430 118 L 412 118 Q 410 116 411 110 Z" fill="#fff088"/>
    <path d="M 405 138 L 412 142 L 408 148 Z" fill="#1a0a08" opacity="0.85"/>
    <line x1="406" y1="126" x2="434" y2="128" stroke="#fff8d8" stroke-width="0.62" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC1)">
    <ellipse cx="420" cy="135" rx="14" ry="22" fill="#3a8858" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="540" cy="135" rx="16" ry="22" fill="url(#suitCrimsonC1)"/>
    <circle cx="540" cy="115" r="9" fill="#a87858"/>
    <ellipse cx="540" cy="112" rx="6" ry="2" fill="#a85020" opacity="0.62"/>
    <path d="M 526 130 L 533 138 L 528 142 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 550 144 L 556 148 L 552 154 Z" fill="#1a0810" opacity="0.85"/>
    <line x1="525" y1="126" x2="555" y2="128" stroke="#d83838" stroke-width="0.85" opacity="0.7"/>
    <rect x="528" y="128" width="22" height="14" rx="1" fill="none" stroke="#d83838" stroke-width="0.55" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC1)">
    <ellipse cx="540" cy="135" rx="16" ry="22" fill="#d83838" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="660" cy="135" rx="14" ry="22" fill="url(#suitSapphireC1)"/>
    <circle cx="660" cy="115" r="9" fill="#a87858"/>
    <ellipse cx="654" cy="113" rx="3" ry="2" fill="#a878d8" opacity="0.85"/>
    <ellipse cx="666" cy="113" rx="3" ry="2" fill="#a878d8" opacity="0.85"/>
    <path d="M 645 142 L 652 146 L 648 152 Z" fill="#1a1028" opacity="0.85"/>
    <line x1="646" y1="126" x2="674" y2="128" stroke="#a878d8" stroke-width="0.62" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC1)">
    <ellipse cx="660" cy="135" rx="14" ry="22" fill="#a878d8" opacity="0.42"/>
  </g>

  <g opacity="0.62" filter="url(#megaGlowC1)">
    <ellipse cx="160" cy="135" rx="32" ry="32" fill="#a8c0e0" opacity="0.32"/>
    <ellipse cx="290" cy="135" rx="32" ry="32" fill="#d88838" opacity="0.32"/>
    <ellipse cx="420" cy="135" rx="32" ry="32" fill="#3a8858" opacity="0.42"/>
    <ellipse cx="540" cy="135" rx="32" ry="32" fill="#d83838" opacity="0.32"/>
    <ellipse cx="660" cy="135" rx="32" ry="32" fill="#a878d8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="370" cy="200" rx="280" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
