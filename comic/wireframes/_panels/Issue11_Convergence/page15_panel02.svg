<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 15 Panel 2 — Luma reads STAY, "You knew, didn't you. You knew what the mission was."</title>
  <desc>Medium close-up Luma's face in blue-violet scanner light looking upward at carving above. South Asian features warm brown skin large dark eyes behind holographic lenses — one cracked refracting blue-violet light into prismatic fragments, one intact scrolling data she is not reading. Dark long braided hair in one thick braid hangs behind her. Quiet comprehension — not shock of first discovery but deeper understanding. Scientist moving from data to meaning. Blue-violet scanner light from below casts structured geometric patterns upward. Understanding arriving where analysis ends.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="violetUpY2" cx="0.5" cy="0.95" r="0.62">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#3a1a5a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneWallY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3838"/>
      <stop offset="0.5" stop-color="#1a1818"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="violetFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#3a1a5a"/>
      <stop offset="1" stop-color="#1a0a2a"/>
    </linearGradient>
    <linearGradient id="hairBlkY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceLumaY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#a878d8"/>
    </linearGradient>
    <radialGradient id="lensIntactY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a878d8"/>
      <stop offset="1" stop-color="#3a1a5a"/>
    </radialGradient>
    <radialGradient id="lensCrackedY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a878d8"/>
      <stop offset="1" stop-color="#1a0a2a"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="prismY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgY2)"/>
  <rect width="366" height="240" fill="url(#violetUpY2)"/>

  <g>
    <rect x="0" y="0" width="366" height="200" fill="url(#stoneWallY2)" opacity="0.92"/>
    <g opacity="0.55" stroke="#0a0808" stroke-width="0.55" fill="none">
      <line x1="0" y1="40" x2="366" y2="40"/>
      <line x1="0" y1="80" x2="366" y2="80"/>
      <line x1="0" y1="120" x2="366" y2="120"/>
      <line x1="0" y1="160" x2="366" y2="160"/>
      <line x1="120" y1="0" x2="120" y2="200"/>
      <line x1="240" y1="0" x2="240" y2="200"/>
    </g>
  </g>

  <g opacity="0.42">
    <text x="183" y="40" text-anchor="middle" font-family="Courier New, monospace" font-size="38" fill="#a878d8" font-weight="900" letter-spacing="11" stroke="#3a1a5a" stroke-width="1.4">STAY</text>
  </g>

  <g>
    <ellipse cx="183" cy="120" rx="80" ry="100" fill="#3a261a"/>
    <ellipse cx="183" cy="100" rx="60" ry="68" fill="url(#faceLumaY2)"/>

    <path d="M 120 50 Q 183 30 246 50 Q 256 80 252 110 L 240 122 Q 220 60 196 50 Q 170 60 156 122 L 130 110 Q 116 80 120 50 Z" fill="url(#hairBlkY2)"/>
    <path d="M 246 50 Q 260 90 254 130 Q 250 170 244 200" stroke="url(#hairBlkY2)" stroke-width="14" fill="none" stroke-linecap="round"/>

    <rect x="138" y="106" width="34" height="22" rx="3" fill="none" stroke="#7848b8" stroke-width="1.4"/>
    <line x1="172" y1="117" x2="194" y2="117" stroke="#7848b8" stroke-width="1.2"/>
    <rect x="194" y="106" width="34" height="22" rx="3" fill="none" stroke="#7848b8" stroke-width="1.4"/>

    <ellipse cx="155" cy="117" rx="11" ry="6" fill="url(#lensCrackedY2)" opacity="0.85"/>
    <line x1="146" y1="111" x2="164" y2="123" stroke="#7848b8" stroke-width="0.7"/>
    <line x1="146" y1="123" x2="164" y2="111" stroke="#7848b8" stroke-width="0.7"/>
    <line x1="155" y1="108" x2="155" y2="126" stroke="#7848b8" stroke-width="0.55"/>

    <ellipse cx="211" cy="117" rx="11" ry="6" fill="url(#lensIntactY2)" opacity="0.85"/>
    <line x1="200" y1="113" x2="222" y2="113" stroke="#a878d0" stroke-width="0.55"/>
    <line x1="200" y1="118" x2="222" y2="118" stroke="#a878d0" stroke-width="0.55"/>
    <line x1="200" y1="122" x2="222" y2="122" stroke="#a878d0" stroke-width="0.55"/>
    <text x="211" y="120" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#1a0a2a" font-weight="900">DATA</text>

    <path d="M 130 90 Q 156 80 178 90" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 188 90 Q 211 80 236 90" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>

    <ellipse cx="166" cy="146" rx="9" ry="3" fill="#a878d8" opacity="0.55"/>
    <ellipse cx="200" cy="146" rx="9" ry="3" fill="#a878d8" opacity="0.55"/>

    <path d="M 156 178 Q 183 174 210 178" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 158 182 L 208 182" stroke="#3a1a14" stroke-width="0.85" opacity="0.55"/>

    <path d="M 30 220 Q 183 200 336 220 L 366 240 L 0 240 Z" fill="url(#violetFigY2)"/>
    <path d="M 50 232 L 316 232 L 340 240 L 26 240 Z" fill="#1a0e2e" opacity="0.85"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowY2)">
    <ellipse cx="155" cy="117" rx="22" ry="9" fill="#a878d8" opacity="0.55"/>
    <ellipse cx="211" cy="117" rx="22" ry="9" fill="#a878d8" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#prismY2)">
    <line x1="140" y1="110" x2="170" y2="124" stroke="#a878d8" stroke-width="2" opacity="0.55"/>
    <line x1="140" y1="124" x2="170" y2="110" stroke="#a878d8" stroke-width="2" opacity="0.55"/>
    <circle cx="148" cy="115" r="2" fill="#a8c0e0" opacity="0.55"/>
    <circle cx="162" cy="119" r="2" fill="#a878d8" opacity="0.55"/>
    <circle cx="155" cy="121" r="1.4" fill="#fff8d8" opacity="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#bloomY2)">
    <ellipse cx="183" cy="220" rx="120" ry="22" fill="#7848b8" opacity="0.32"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowY2)">
    <ellipse cx="183" cy="240" rx="180" ry="32" fill="#7848b8" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <line x1="160" y1="100" x2="155" y2="60" stroke="#a878d8" stroke-width="0.55" stroke-dasharray="2 1.4" opacity="0.55"/>
    <line x1="206" y1="100" x2="210" y2="60" stroke="#a878d8" stroke-width="0.55" stroke-dasharray="2 1.4" opacity="0.55"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#7848b8" font-weight="700">LUMA (quiet, to the empty room):</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">"You knew, didn't you. You knew the mission."</text>
  </g>
</svg>
