    <circle cx="142" cy="128" r="4.4" fill="url(#eyeJinkE2)"/>
    <circle cx="138" cy="130" r="2" fill="#a87838"/>

    <ellipse cx="228" cy="130" rx="14" ry="18" fill="#0a0604"/>
    <circle cx="228" cy="130" r="9" fill="#3a2010"/>
    <circle cx="232" cy="128" r="4.4" fill="url(#eyeJinkE2)"/>
    <circle cx="228" cy="130" r="2" fill="#a87838"/>

    <path d="M 100 108 Q 138 100 162 108" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 204 108 Q 228 100 266 108" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="154" cy="152" rx="11" ry="3" fill="#a85820" opacity="0.55"/>
    <ellipse cx="212" cy="152" rx="11" ry="3" fill="#a85820" opacity="0.55"/>
    <ellipse cx="183" cy="150" rx="3" ry="1.4" fill="#a85820" opacity="0.55"/>

    <path d="M 130 200 Q 160 224 183 224 Q 206 224 236 200 Q 230 220 200 232 Q 183 234 166 232 Q 136 220 130 200 Z" fill="#1a0604"/>
    <path d="M 138 204 L 226 204" stroke="#fff8d8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 142 208 Q 183 218 224 208" stroke="#3a1a08" stroke-width="0.85" fill="none" opacity="0.62"/>
    <path d="M 130 200 Q 138 198 144 202" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M 222 202 Q 228 198 236 200" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="0" y="240" width="366" height="40" fill="url(#emeraldCollarE2)"/>
    <line x1="0" y1="244" x2="366" y2="244" stroke="#fff088" stroke-width="0.85" opacity="0.85"/>
    <line x1="0" y1="252" x2="366" y2="252" stroke="#fff088" stroke-width="0.55" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#bloomE2)">
    <rect x="0" y="240" width="366" height="14" fill="#3a8858" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowE2)">
    <rect x="0" y="232" width="366" height="48" fill="#3a8858" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomE2)">
    <ellipse cx="183" cy="60" rx="120" ry="14" fill="#fff088" opacity="0.42"/>
    <ellipse cx="183" cy="180" rx="120" ry="22" fill="#f4b860" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="252" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
