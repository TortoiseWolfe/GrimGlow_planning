<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 1 Panel 3 — Sable listens, telegraph lines visible behind her</title>
  <desc>Medium slight low angle Sable listening on main beam. Arms at sides, weight centered — command posture, receptive. Hearing worst-case scenario, absorbing without reaction. Behind, wall gap shows grey morning city — chimneys, rooftops, threading through them telegraph lines as dark threads connecting city's infrastructure. The very system Wren is describing. Controlled attention. Tightness around eyes only sign scope is registering. Grey daylight backlights silver-white hair. Faint copper-gold reflected from projections on front of face.</desc>
  <defs>
    <linearGradient id="bgZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="dayBackZ3" cx="0.78" cy="0.32" r="0.45">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperFrontZ3" cx="0.18" cy="0.42" r="0.32">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a2e10" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="brickWallZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a14"/>
      <stop offset="1" stop-color="#1a0a08"/>
    </linearGradient>
    <linearGradient id="cityFarZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#5a6478"/>
      <stop offset="1" stop-color="#3a4858"/>
    </linearGradient>
    <linearGradient id="cityRoofZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4858"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="silverFigZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6068"/>
      <stop offset="0.5" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="hairSilZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="faceSableZ3" x1="0" y1="0" x2="0.85" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeAttnZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#88a8d0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#88a8d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomZ3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="dayBlurZ3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgZ3)"/>
  <rect width="366" height="240" fill="url(#dayBackZ3)"/>
  <rect width="366" height="240" fill="url(#copperFrontZ3)"/>

  <g>
