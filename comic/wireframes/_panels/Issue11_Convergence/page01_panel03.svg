    <line x1="240" y1="74" x2="280" y2="86" stroke="#080404" stroke-width="1"/>
    <line x1="280" y1="86" x2="320" y2="76" stroke="#080404" stroke-width="1"/>
    <line x1="320" y1="76" x2="366" y2="86" stroke="#080404" stroke-width="1"/>

    <line x1="200" y1="64" x2="240" y2="80" stroke="#080404" stroke-width="0.6" opacity="0.7"/>
    <line x1="240" y1="80" x2="280" y2="92" stroke="#080404" stroke-width="0.6" opacity="0.7"/>
    <line x1="280" y1="92" x2="320" y2="82" stroke="#080404" stroke-width="0.6" opacity="0.7"/>
    <line x1="320" y1="82" x2="366" y2="92" stroke="#080404" stroke-width="0.6" opacity="0.7"/>

    <line x1="240" y1="74" x2="240" y2="92" stroke="#080404" stroke-width="0.5"/>
    <line x1="280" y1="86" x2="280" y2="120" stroke="#080404" stroke-width="0.5"/>
    <line x1="320" y1="76" x2="320" y2="92" stroke="#080404" stroke-width="0.5"/>
  </g>

  <g>
    <ellipse cx="100" cy="120" rx="34" ry="40" fill="#3a261a"/>
    <ellipse cx="100" cy="100" rx="22" ry="26" fill="url(#faceSableZ3)"/>

    <path d="M 76 70 Q 100 56 126 70 Q 132 82 130 96 L 124 102 Q 116 78 100 72 Q 84 78 76 102 Z" fill="url(#hairSilZ3)"/>
    <path d="M 78 76 L 84 70 L 90 76 L 96 70 L 102 76 L 108 70 L 114 76 L 120 70 L 124 76" stroke="url(#hairSilZ3)" stroke-width="2" fill="none" opacity="0.85"/>

    <ellipse cx="90" cy="102" rx="3.4" ry="4" fill="#0a0604"/>
    <ellipse cx="110" cy="102" rx="3.4" ry="4" fill="#0a0604"/>
    <circle cx="90" cy="102" r="2" fill="#080404"/>
    <circle cx="110" cy="102" r="2" fill="#080404"/>
    <circle cx="91" cy="101" r="1" fill="url(#eyeAttnZ3)"/>
    <circle cx="111" cy="101" r="1" fill="url(#eyeAttnZ3)"/>

    <path d="M 78 90 Q 92 86 102 90" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 100 90 Q 116 86 126 90" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <path d="M 92 116 Q 100 122 108 116" stroke="#0a0604" stroke-width="1" fill="none"/>
    <path d="M 90 130 Q 100 126 110 130" stroke="#0a0604" stroke-width="1.2" fill="none"/>

    <path d="M 70 140 Q 100 130 130 140 L 142 200 L 60 200 L 64 168 Z" fill="url(#silverFigZ3)"/>
    <path d="M 76 154 L 124 154 L 134 196 L 66 196 Z" fill="#1a1c20" opacity="0.85"/>
    <path d="M 116 142 L 124 144 L 124 152 L 116 150 Z" fill="#a89888" opacity="0.85"/>
    <line x1="100" y1="142" x2="100" y2="196" stroke="#080404" stroke-width="0.5" opacity="0.55"/>

    <path d="M 70 150 L 60 168 L 56 200" stroke="url(#silverFigZ3)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 130 150 L 140 168 L 144 200" stroke="url(#silverFigZ3)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowZ3)">
