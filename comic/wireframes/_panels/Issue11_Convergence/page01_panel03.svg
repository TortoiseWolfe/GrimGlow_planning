    <rect x="220" y="100" width="50" height="80" fill="url(#cityRoofZ3)"/>
    <polygon points="220,100 245,80 270,100" fill="url(#cityRoofZ3)"/>
    <rect x="280" y="120" width="44" height="60" fill="url(#cityRoofZ3)"/>
    <rect x="320" y="92" width="40" height="88" fill="url(#cityRoofZ3)"/>
    <polygon points="320,92 340,76 360,92" fill="url(#cityRoofZ3)"/>

    <rect x="232" y="92" width="6" height="20" fill="#3a1a14"/>
    <rect x="252" y="86" width="6" height="20" fill="#3a1a14"/>
    <rect x="296" y="112" width="6" height="14" fill="#3a1a14"/>
    <rect x="334" y="84" width="6" height="14" fill="#3a1a14"/>
  </g>
