    <ellipse cx="298" cy="100" rx="14" ry="6" fill="#5a4838" opacity="0.5"/>
    <ellipse cx="338" cy="74" rx="16" ry="6" fill="#5a4838" opacity="0.5"/>
  </g>

  <g opacity="0.92">
