  <g opacity="0.55">
    <text x="270" y="216" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#3a4868" opacity="0.7" font-style="italic">— TELEGRAPH NETWORK —</text>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="180" height="22" rx="3" fill="#f5ecd8" opacity="0.9" stroke="#5a6478" stroke-width="0.7"/>
    <text x="82" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#5a6478" font-weight="700" opacity="0.7">SABLE LISTENS</text>
    <text x="82" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.7">— silent —</text>
  </g>
</svg>
