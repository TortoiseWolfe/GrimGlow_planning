    <text x="200" y="155" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#7848b8" opacity="0.75">— PRECISION 110s —</text>
  </g>

  <g>
    <ellipse cx="100" cy="100" rx="32" ry="44" fill="#3a261a"/>
    <ellipse cx="100" cy="80" rx="22" ry="26" fill="url(#faceLumaY4)"/>

    <path d="M 76 50 Q 100 36 124 50 Q 132 70 126 86 L 122 96 Q 116 60 106 56 Q 96 60 84 96 Z" fill="url(#hairBlkY4)"/>
    <path d="M 124 48 Q 134 70 132 100 Q 130 130 126 160" stroke="url(#hairBlkY4)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <ellipse cx="88" cy="86" rx="3.4" ry="4" fill="#0a0604"/>
    <ellipse cx="112" cy="86" rx="3.4" ry="4" fill="#0a0604"/>
    <circle cx="88" cy="86" r="2" fill="#080404"/>
    <circle cx="112" cy="86" r="2" fill="#080404"/>
    <circle cx="89" cy="85" r="1" fill="#a878d8"/>
