  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#7848b8" font-weight="700">LUMA: "Dispatch office.</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">I'll need Wren's schematics."</text>
