    <line x1="106" y1="80" x2="120" y2="80" stroke="#7848b8" stroke-width="0.5"/>
    <line x1="106" y1="84" x2="120" y2="84" stroke="#7848b8" stroke-width="0.6" opacity="0.7"/>
    <line x1="108" y1="88" x2="120" y2="88" stroke="#7848b8" stroke-width="0.5"/>

