    <path d="M 76 132 Q 100 124 124 132 L 132 200 L 68 200 L 72 168 Z" fill="url(#violetFigY4)"/>
    <path d="M 82 144 L 118 144 L 126 196 L 74 196 Z" fill="#1a0e2e" opacity="0.85"/>

    <ellipse cx="86" cy="156" rx="3" ry="1.4" fill="#1a0a2a" opacity="0.85"/>
    <ellipse cx="98" cy="166" rx="2" ry="1" fill="#1a0a2a" opacity="0.7"/>

    <path d="M 124 132 L 144 122 L 158 118" stroke="url(#violetFigY4)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="160" cy="116" rx="4" ry="3" fill="#7a4830"/>

    <rect x="148" y="108" width="22" height="14" rx="3" fill="url(#scannerY4)" stroke="#1a0a2a" stroke-width="0.5"/>
    <ellipse cx="159" cy="115" rx="6" ry="3" fill="url(#lensCorY4)"/>
    <line x1="148" y1="113" x2="170" y2="113" stroke="#a878d0" stroke-width="0.5"/>
    <line x1="148" y1="117" x2="170" y2="117" stroke="#a878d0" stroke-width="0.4" opacity="0.7"/>

    <path d="M 76 132 L 60 168 L 56 200" stroke="url(#violetFigY4)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowY4)">
    <rect x="78" y="78" width="20" height="14" fill="#a878d8" opacity="0.45"/>
    <rect x="104" y="78" width="20" height="14" fill="#a878d8" opacity="0.55"/>
    <ellipse cx="159" cy="115" rx="14" ry="6" fill="#a878d8" opacity="0.55"/>
  </g>
  <g opacity="0.85" filter="url(#bloomY4)">
    <rect x="74" y="132" width="60" height="68" fill="#7848b8" opacity="0.32"/>
  </g>

  <g opacity="0.55">
    <line x1="170" y1="113" x2="180" y2="100" stroke="#a878d0" stroke-width="0.4" stroke-dasharray="2 1" opacity="0.7"/>
    <text x="195" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a878d8" opacity="0.85">SCH.LOAD</text>
  </g>

  <g opacity="0.65">
