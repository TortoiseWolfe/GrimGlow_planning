<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 11 Page 7 Panel 4 — Luma reads dispatch office, "I'll need Wren's device schematics"</title>
  <desc>Close-up Luma studying assignment, scanner already pulling supplementary data. South Asian features warm brown skin dark long braided hair single thick braid NOT loose, holographic lenses scrolling blue-violet data. Sapphire-violet suit dusty and ink-stained. Calm focus — precision of surgeon combined with insight of researcher. Copper-gold projection light and blue-violet scanner glow. The scientist preparing for a combat operation.</desc>
  <defs>
    <linearGradient id="bgY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperFillY4" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlowY4" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="violetFigY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#3a1a5a"/>
      <stop offset="1" stop-color="#1a0a2a"/>
    </linearGradient>
    <linearGradient id="hairBlkY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceLumaY4" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="0.7" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a878d8"/>
    </linearGradient>
    <linearGradient id="scannerY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a5a"/>
      <stop offset="0.5" stop-color="#1a0a2a"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="lensCorY4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a878d8"/>
      <stop offset="1" stop-color="#3a1a5a"/>
    </radialGradient>
    <filter id="bloomY4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
