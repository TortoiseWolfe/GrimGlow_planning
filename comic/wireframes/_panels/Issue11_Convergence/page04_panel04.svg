      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dayCoolX4" cx="0.85" cy="0.42" r="0.4">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.4"/>
