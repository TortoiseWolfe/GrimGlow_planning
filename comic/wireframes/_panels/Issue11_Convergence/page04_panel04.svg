<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 250" width="742" height="250">
  <title>Issue 11 Page 4 Panel 4 — Squad turns to each other, "We'll need Theodore"</title>
  <desc>Medium wide eye level five tiny figures on main beam now oriented toward each other rather than projection. Shift from briefing to decision visible in postures — no longer audience receiving information but unit facing choice. Five heavily degraded suits silver copper emerald crimson sapphire-violet all catching copper-gold holographic light and growing grey daylight. For first time since fracture in Issue 9 looking in same direction. Copper-gold projection fading to secondary, grey daylight from wall gap growing as morning progresses. Warm and cool light beginning to balance. The moment before the decision.</desc>
