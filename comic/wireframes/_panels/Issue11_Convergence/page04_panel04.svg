    <line x1="220" y1="170" x2="320" y2="170" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.55"/>
    <line x1="320" y1="170" x2="420" y2="170" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.55"/>
