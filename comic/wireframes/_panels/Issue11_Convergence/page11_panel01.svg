<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 11 Panel 1 — Tactical projection collapses, "We move at first light"</title>
  <desc>Medium wide holographic tactical projection collapses inward — copper-gold light folding into geometric lines and vanishing, leaving camp in grey daylight and dim holographic perimeter glow. Five tiny figures stand in space between rough timber beams, wall gap showing morning city beyond. Absence of projection makes camp smaller quieter more real. Planning over. What remains is the doing. Five degraded metallic suits in honest light of London morning. The moment between planning and action.</desc>
