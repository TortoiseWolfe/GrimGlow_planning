<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 9 Panel 1 — Theodore arrives at the wall gap, dual-scale composition</title>
  <desc>Wide dual-scale composition. Enormous face fills upper portion of frame — Victorian boy 12-13 lanky pre-teen NOT young child peering through gap in brickwork, sandy-brown hair wide hazel eyes freckles serious. Oil-stained hand rests at crack's edge, brass gear ring on left index finger catching daylight. Below and inside wall cavity, exactly five tiny figures in degraded metallic suits arranged around hovering copper-gold holographic tactical projection. Scale contrast stark — boy's face is sky, fairies' war room space he could cup in one hand. Daylight outside warming Theodore. Inside copper-gold projections and dim holographic perimeter glow. The giant who is also the youngest ally.</desc>
