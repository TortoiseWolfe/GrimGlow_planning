    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a2410" font-weight="700">THEODORE: "I came as soon as I could.</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">Mr. Cribbage is occupied. I've two hours."</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#5a6478" font-weight="700">SABLE: "That's enough. Come closer."</text>
