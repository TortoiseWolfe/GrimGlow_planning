      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="brickWallX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a14"/>
      <stop offset="1" stop-color="#1a0a08"/>
    </linearGradient>
    <linearGradient id="cityFarX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="crimsonArmorX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="hairBuzzX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="faceThreshX5" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.85" stop-color="#a87838"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <radialGradient id="eyeFearX5" cx="0.5" cy="0.5" r="0.5">
