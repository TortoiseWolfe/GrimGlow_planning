      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rifleX5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="bloomX5" x="-20%" y="-20%" width="140%" height="140%">
