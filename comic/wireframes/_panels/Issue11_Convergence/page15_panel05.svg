      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="gaslightThroughX5" cx="0.85" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonStutterX5" cx="0.32" cy="0.62" r="0.32">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.32"/>
