  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.85" stroke="#8a2520" stroke-width="0.7"/>
    <text x="92" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#8a2520" font-weight="700" opacity="0.85">THRESH AT POST</text>
    <text x="92" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.85">— hands steady, eyes afraid —</text>
  </g>
