    <ellipse cx="170" cy="142" rx="6" ry="2" fill="#a85820" opacity="0.55"/>

    <path d="M 148 162 Q 160 158 174 162" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 148 164 L 174 164" stroke="#3a2410" stroke-width="0.55" opacity="0.55"/>

    <path d="M 116 184 Q 160 174 204 184 L 220 220 L 100 220 L 108 200 Z" fill="url(#crimsonArmorX5)"/>
