<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 260" width="494" height="260">
  <title>Issue 11 Page 15 Panel 5 — Thresh at perimeter post, weapon check, fear in eyes purpose in hands</title>
  <desc>Medium broad-shouldered woman in dented scratched crimson armored suit sits at perimeter post on wooden beam inside wall cavity. Compact rifle lies across her knees, hands run through weapons check — methodical precise muscle memory. Pale skin copper-red buzz cut defined cheekbones. Hands steady. Eyes not on weapon — look through gap in brickwork at gaslit city beyond, and they are afraid. Visual split: purpose in hands, fear in eyes. Two truths one person. Warm amber gaslight from city through wall gap casts across face. Crimson holographic edge-lighting stutters along weapon's surface where hands touch. The soldier who fights afraid.</desc>
