    <circle cx="178" cy="124" r="3" fill="#080404"/>
    <circle cx="146" cy="122" r="1.6" fill="url(#eyeFearX5)"/>
    <circle cx="182" cy="122" r="1.6" fill="url(#eyeFearX5)"/>
    <circle cx="142" cy="124" r="1" fill="#a87838"/>
    <circle cx="178" cy="124" r="1" fill="#a87838"/>

