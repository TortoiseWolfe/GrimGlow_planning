<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 9 Panel 3 — Theodore from below, "I know the streets"</title>
  <desc>Medium close-up from fairy-scale looking up through brickwork gap at Theodore's enormous face. Sandy-brown hair hazel eyes bright and focused freckles determined — the boy who is ready. Daylight behind creates slight silhouette. Copper-gold projection light from below catches underside of jaw and brass gear ring on left index finger. Rough brickwork frames face like window into another scale of existence. The useful giant who has become essential.</desc>
  <defs>
    <linearGradient id="bgZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="dayBackZ3" cx="0.5" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a6478" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperUpZ3" cx="0.5" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="brickFrameZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a14"/>
      <stop offset="1" stop-color="#1a0a08"/>
    </linearGradient>
    <linearGradient id="hairSandyZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="faceTheoZ3" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <radialGradient id="eyeReadyZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handTheoZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <linearGradient id="brassRingZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <filter id="bloomZ3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="haloZ3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgZ3)"/>
  <rect width="366" height="280" fill="url(#dayBackZ3)"/>
  <rect width="366" height="280" fill="url(#copperUpZ3)"/>

  <g>
    <rect x="0" y="240" width="366" height="40" fill="url(#floorZ3)"/>
    <line x1="0" y1="248" x2="366" y2="246" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g>
    <rect x="0" y="0" width="366" height="50" fill="url(#brickFrameZ3)"/>
    <rect x="0" y="200" width="366" height="80" fill="url(#brickFrameZ3)"/>
    <rect x="0" y="0" width="60" height="280" fill="url(#brickFrameZ3)"/>
    <rect x="306" y="0" width="60" height="280" fill="url(#brickFrameZ3)"/>

    <path d="M 60 50 Q 80 56 100 48 Q 120 56 140 50 Q 160 56 180 48 Q 200 56 220 50 Q 240 56 260 48 Q 280 56 306 50 L 306 200 Q 286 196 260 204 Q 240 196 220 204 Q 200 196 180 204 Q 160 196 140 204 Q 120 196 100 204 Q 80 196 60 200 Z" fill="none" stroke="#080404" stroke-width="1"/>

    <g opacity="0.85" stroke="#080404" stroke-width="0.55" fill="none">
      <path d="M 60 56 Q 80 56 100 48 Q 120 56 140 50 Q 160 56 180 48 Q 200 56 220 50 Q 240 56 260 48 Q 280 56 306 50"/>
      <path d="M 60 200 Q 80 196 100 204 Q 120 196 140 204 Q 160 196 180 204 Q 200 196 220 204 Q 240 196 260 204 Q 280 196 306 200"/>
    </g>

    <g opacity="0.55" stroke="#1a0a08" stroke-width="0.4" fill="none">
      <line x1="0" y1="20" x2="60" y2="20"/>
      <line x1="306" y1="20" x2="366" y2="20"/>
      <line x1="0" y1="100" x2="60" y2="100"/>
      <line x1="306" y1="100" x2="366" y2="100"/>
      <line x1="0" y1="180" x2="60" y2="180"/>
      <line x1="306" y1="180" x2="366" y2="180"/>
      <line x1="0" y1="240" x2="366" y2="240"/>
    </g>
  </g>

  <g opacity="0.95" filter="url(#haloZ3)">
    <rect x="60" y="50" width="246" height="160" fill="#a8b0bc" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="183" cy="130" rx="120" ry="80" fill="url(#faceTheoZ3)"/>

    <path d="M 82 76 Q 134 50 183 56 Q 232 50 284 76 Q 286 96 280 110 L 268 116 Q 240 80 200 76 Q 160 72 130 80 Q 100 88 86 116 Z" fill="url(#hairSandyZ3)"/>
    <path d="M 130 60 Q 144 50 158 60" stroke="#7a3818" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 210 60 Q 224 50 238 60" stroke="#7a3818" stroke-width="1.4" fill="none" opacity="0.7"/>
    <ellipse cx="155" cy="56" rx="9" ry="3" fill="#7a3818" opacity="0.85"/>
    <ellipse cx="220" cy="56" rx="9" ry="3" fill="#7a3818" opacity="0.85"/>

    <ellipse cx="148" cy="120" rx="11" ry="13" fill="#0a0604"/>
    <ellipse cx="218" cy="120" rx="11" ry="13" fill="#0a0604"/>
    <circle cx="148" cy="120" r="6" fill="#080404"/>
    <circle cx="218" cy="120" r="6" fill="#080404"/>
    <circle cx="151" cy="118" r="3" fill="url(#eyeReadyZ3)"/>
    <circle cx="221" cy="118" r="3" fill="url(#eyeReadyZ3)"/>
    <circle cx="148" cy="120" r="1.4" fill="#a87838"/>
    <circle cx="218" cy="120" r="1.4" fill="#a87838"/>

    <path d="M 116 100 Q 148 92 168 100" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 198 100 Q 218 92 250 100" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>

    <ellipse cx="160" cy="140" rx="6" ry="2" fill="#a87838" opacity="0.55"/>
    <ellipse cx="206" cy="140" rx="6" ry="2" fill="#a87838" opacity="0.55"/>
    <ellipse cx="183" cy="138" rx="2" ry="1" fill="#a87838" opacity="0.7"/>

    <path d="M 168 168 Q 183 172 198 168" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="183" cy="160" rx="3" ry="6" fill="#a87838" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="183" cy="194" rx="44" ry="6" fill="url(#handTheoZ3)" opacity="0.7"/>

    <ellipse cx="216" cy="196" rx="14" ry="6" fill="url(#brassRingZ3)" opacity="0.85"/>
    <ellipse cx="216" cy="196" rx="9" ry="3.4" fill="#3a1a08"/>
    <line x1="208" y1="196" x2="224" y2="196" stroke="#5a2e10" stroke-width="0.85"/>
    <line x1="216" y1="190" x2="216" y2="202" stroke="#5a2e10" stroke-width="0.85"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowZ3)">
    <ellipse cx="216" cy="196" rx="22" ry="7" fill="#f4b860" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#bloomZ3)">
    <ellipse cx="183" cy="200" rx="100" ry="14" fill="#a85820" opacity="0.42"/>
  </g>

  <g opacity="0.55">
    <ellipse cx="183" cy="220" rx="40" ry="2" fill="#040202"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#3a2410" font-weight="700">THEODORE: "I can reach the</text>
    <text x="100" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">underground junction. I know</text>
    <text x="100" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">the streets. Tell me what to do."</text>
  </g>
</svg>
