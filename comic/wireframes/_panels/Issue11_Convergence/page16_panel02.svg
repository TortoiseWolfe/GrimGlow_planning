<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 11 Page 16 Panel 2 — Thresh's eyes, fear and purpose</title>
  <desc>Close-up Thresh's eyes — counterpoint to the hands. Pale skin, defined cheekbones at edges of frame, copper-red buzz cut above. Eyes look through gap in brickwork at gaslit city beyond. Afraid — not panicked but permanently, quietly afraid. And purpose. Since fighting the Titan and surviving, fear has a companion. Neither eliminates the other. Both are true. Warm amber gaslight from wall gap reflects in eyes, catching the fear and making it glow. The bravest she has ever been because the fear is still there.</desc>
  <defs>
    <linearGradient id="bgA2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1024"/>
      <stop offset="0.5" stop-color="#0a060e"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="gaslightA2" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairBuzzA2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="faceThreshA2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.4" stop-color="#a87858"/>
      <stop offset="0.85" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <radialGradient id="eyePurposeA2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeFearA2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a87858" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a87858" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomA2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowA2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowA2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgA2)"/>
  <rect width="366" height="260" fill="url(#gaslightA2)"/>

  <g>
    <path d="M 0 0 L 366 0 L 366 60 Q 300 64 240 58 Q 180 50 130 60 Q 80 70 0 64 Z" fill="url(#hairBuzzA2)"/>
    <g opacity="0.7" stroke="#3a1808" stroke-width="0.55">
      <line x1="60" y1="20" x2="60" y2="38"/>
      <line x1="120" y1="14" x2="120" y2="34"/>
      <line x1="180" y1="20" x2="180" y2="38"/>
      <line x1="240" y1="14" x2="240" y2="34"/>
      <line x1="300" y1="20" x2="300" y2="38"/>
    </g>
  </g>

  <g>
    <ellipse cx="183" cy="160" rx="240" ry="120" fill="url(#faceThreshA2)" opacity="0.92"/>
    <path d="M -10 80 Q 100 76 200 84 Q 300 80 376 88" stroke="#5a3018" stroke-width="0.85" fill="none" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="100" cy="140" rx="44" ry="22" fill="#3a2018"/>
    <ellipse cx="100" cy="140" rx="38" ry="18" fill="#0a0604"/>
    <circle cx="100" cy="140" r="22" fill="#080404"/>
    <circle cx="100" cy="140" r="14" fill="#5a3018"/>
    <circle cx="100" cy="140" r="9" fill="url(#eyeFearA2)"/>
    <circle cx="100" cy="140" r="5" fill="#080404"/>
    <circle cx="103" cy="137" r="3" fill="url(#eyePurposeA2)"/>

    <path d="M 56 116 Q 100 108 144 116" stroke="#0a0604" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 56 168 Q 100 174 144 168" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.62"/>
    <path d="M 60 110 Q 100 100 142 110" stroke="#5a2010" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.55"/>

    <ellipse cx="266" cy="140" rx="44" ry="22" fill="#3a2018"/>
    <ellipse cx="266" cy="140" rx="38" ry="18" fill="#0a0604"/>
    <circle cx="266" cy="140" r="22" fill="#080404"/>
    <circle cx="266" cy="140" r="14" fill="#5a3018"/>
    <circle cx="266" cy="140" r="9" fill="url(#eyeFearA2)"/>
    <circle cx="266" cy="140" r="5" fill="#080404"/>
    <circle cx="269" cy="137" r="3" fill="url(#eyePurposeA2)"/>

    <path d="M 222 116 Q 266 108 310 116" stroke="#0a0604" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 222 168 Q 266 174 310 168" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.62"/>
    <path d="M 226 110 Q 266 100 308 110" stroke="#5a2010" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#bloomA2)">
    <circle cx="103" cy="137" r="5" fill="#fff8d8" opacity="0.62"/>
    <circle cx="269" cy="137" r="5" fill="#fff8d8" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#strongGlowA2)">
    <ellipse cx="100" cy="140" rx="40" ry="22" fill="#f4b860" opacity="0.42"/>
    <ellipse cx="266" cy="140" rx="40" ry="22" fill="#f4b860" opacity="0.42"/>
  </g>

  <g opacity="0.55">
    <ellipse cx="60" cy="200" rx="22" ry="14" fill="#5a3018" opacity="0.42"/>
    <ellipse cx="306" cy="200" rx="22" ry="14" fill="#5a3018" opacity="0.42"/>
    <ellipse cx="183" cy="220" rx="50" ry="11" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomA2)">
    <ellipse cx="183" cy="40" rx="120" ry="14" fill="#a85020" opacity="0.32"/>
    <ellipse cx="183" cy="200" rx="120" ry="22" fill="#f4b860" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="240" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
