<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 11 Page 2 Panel 2 — Jink crouched on higher timber, the grin gone</title>
  <desc>Close-up Jink crouched higher timber beam looking down. Late teens early twenties young adult NOT child, lean androgynous build, light brown skin, wild bright golden blonde curly hair flecked with soot. Emerald metallic suit soot-streaked across chest, copper wire-stitched tear along forearm, scuff along right hip. Usual grin absent — expression serious, gravity settling on features accustomed to lightness. Amber-black marker light reflects in eyes. Copper-gold uplight from holographic projection below casts structured shadows. Faint emerald glow at suit's seams bleeds through grime. Weight arriving on someone who has avoided it.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperUpY2" cx="0.5" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberMarkerY2" cx="0.5" cy="0.7" r="0.32">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="emeraldFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4d860"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkY2" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeMarkerY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgY2)"/>
  <rect width="246" height="240" fill="url(#copperUpY2)"/>
  <rect width="246" height="240" fill="url(#amberMarkerY2)"/>

  <g>
    <rect x="0" y="200" width="246" height="40" fill="url(#beamY2)"/>
    <line x1="0" y1="206" x2="246" y2="204" stroke="#080404" stroke-width="0.7" opacity="0.7"/>
    <line x1="0" y1="222" x2="246" y2="220" stroke="#1a0a04" stroke-width="0.4" opacity="0.55"/>
  </g>

  <g>
    <rect x="0" y="160" width="246" height="20" fill="url(#beamY2)"/>
    <line x1="0" y1="160" x2="246" y2="160" stroke="#080404" stroke-width="1"/>
    <line x1="0" y1="180" x2="246" y2="180" stroke="#080404" stroke-width="1"/>
    <g opacity="0.55">
      <line x1="40" y1="160" x2="42" y2="180" stroke="#1a1008" stroke-width="0.5"/>
      <line x1="100" y1="160" x2="98" y2="180" stroke="#1a1008" stroke-width="0.5"/>
      <line x1="180" y1="160" x2="182" y2="180" stroke="#1a1008" stroke-width="0.5"/>
    </g>
  </g>

  <g>
    <ellipse cx="123" cy="100" rx="34" ry="48" fill="#3a261a"/>
    <ellipse cx="123" cy="80" rx="22" ry="26" fill="url(#faceJinkY2)"/>

    <path d="M 90 50 Q 110 30 132 36 Q 154 28 168 50 Q 174 70 168 90 L 158 96 Q 150 60 138 56 Q 126 44 116 64 Q 102 50 96 76 L 88 80 Z" fill="url(#hairBlondeY2)"/>
    <path d="M 96 40 Q 100 28 110 30" stroke="#fff8d8" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 154 32 Q 162 28 170 36" stroke="#fff8d8" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 110 60 Q 100 64 92 60" stroke="#a87838" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 138 56 Q 148 60 156 56" stroke="#a87838" stroke-width="1.2" fill="none" opacity="0.7"/>
    <ellipse cx="106" cy="38" rx="4" ry="2" fill="#a87838" opacity="0.85"/>
    <ellipse cx="146" cy="36" rx="4" ry="2" fill="#a87838" opacity="0.85"/>

    <ellipse cx="113" cy="88" rx="3.4" ry="4" fill="#0a0604"/>
    <ellipse cx="133" cy="88" rx="3.4" ry="4" fill="#0a0604"/>
    <circle cx="113" cy="88" r="2" fill="#080404"/>
    <circle cx="133" cy="88" r="2" fill="#080404"/>
    <circle cx="114" cy="89" r="1.2" fill="url(#eyeMarkerY2)"/>
    <circle cx="134" cy="89" r="1.2" fill="url(#eyeMarkerY2)"/>

    <path d="M 100 78 Q 113 72 124 78" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 122 78 Q 133 72 146 78" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <path d="M 116 116 Q 123 116 130 116" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 100 132 Q 123 124 146 132 L 154 184 L 92 184 L 100 152 Z" fill="url(#emeraldFigY2)"/>
    <path d="M 106 144 L 140 144 L 148 178 L 98 178 Z" fill="#0a1408" opacity="0.85"/>

    <path d="M 100 144 L 84 156 L 78 184" stroke="url(#emeraldFigY2)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 146 144 L 162 156 L 168 184" stroke="url(#emeraldFigY2)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.85">
    <path d="M 102 156 Q 108 162 116 158" stroke="#a85820" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 100 162 Q 106 168 114 164" stroke="#a85820" stroke-width="1" fill="none" opacity="0.7"/>
    <ellipse cx="138" cy="170" rx="6" ry="2" fill="#1a0a04" opacity="0.85"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowY2)">
    <path d="M 102 144 L 86 156 L 80 184" stroke="#3a8858" stroke-width="2.4" fill="none" opacity="0.55"/>
    <path d="M 144 144 L 160 156 L 166 184" stroke="#3a8858" stroke-width="2.4" fill="none" opacity="0.55"/>
    <path d="M 110 160 Q 123 156 136 160" stroke="#3a8858" stroke-width="1.4" fill="none" opacity="0.55"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="160" rx="32" ry="2.4" fill="#040202"/>
  </g>

  <g opacity="0.55">
    <circle cx="80" cy="200" r="0.85" fill="#a87838"/>
    <circle cx="156" cy="200" r="0.85" fill="#a87838"/>
    <circle cx="123" cy="220" r="0.85" fill="#a87838"/>
    <circle cx="200" cy="206" r="0.7" fill="#a87838"/>
    <circle cx="40" cy="220" r="0.7" fill="#a87838"/>
  </g>
  <g opacity="0.55" filter="url(#bloomY2)">
    <circle cx="80" cy="200" r="2" fill="#a87838" opacity="0.55"/>
    <circle cx="156" cy="200" r="2" fill="#a87838" opacity="0.55"/>
  </g>

  <g opacity="0.55" filter="url(#megaGlowY2)">
    <ellipse cx="123" cy="220" rx="80" ry="14" fill="#a85820" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.9" stroke="#3a8858" stroke-width="0.7"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#3a8858" font-weight="700" opacity="0.7">JINK WATCHES</text>
    <text x="100" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.7">— the grin is gone —</text>
  </g>
</svg>
