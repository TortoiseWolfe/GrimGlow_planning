    <line x1="600" y1="146" x2="742" y2="154" stroke="#080404" stroke-width="0.55" opacity="0.85"/>
    <line x1="120" y1="134" x2="120" y2="180" stroke="#080404" stroke-width="0.5" opacity="0.7"/>
    <line x1="280" y1="128" x2="280" y2="184" stroke="#080404" stroke-width="0.5" opacity="0.7"/>
    <line x1="440" y1="124" x2="440" y2="180" stroke="#080404" stroke-width="0.5" opacity="0.7"/>
    <line x1="600" y1="128" x2="600" y2="184" stroke="#080404" stroke-width="0.5" opacity="0.7"/>
  </g>

  <g>
    <rect x="0" y="220" width="742" height="40" fill="url(#leadFlashY2)" opacity="0.92"/>
    <line x1="0" y1="224" x2="742" y2="224" stroke="#1a1828" stroke-width="0.7"/>
