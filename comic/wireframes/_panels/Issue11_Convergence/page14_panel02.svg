<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 14 Panel 2 — Wide pulling back, silence after the argument, "you are the bravest person I have ever met"</title>
  <desc>Wide pulling back. Rooftop in wider context — two figures at roof's edge, one human-sized boy with legs dangling, one tiny emerald-suited figure beside his hand. Argument settled into silence. Neither won. City spreads below in amber gaslight, sky above in cold moonlight and stars. Telegraph lines thread between buildings. Two figures lean toward each other despite argument — separated by scale connected by stubbornness and care. Cold moonlight and warm gaslight in perfect balance. Silence after the argument, the quiet before the storm.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonAboveY2" cx="0.18" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a78a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightCityY2" cx="0.5" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leadFlashY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.5" stop-color="#3a4868"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <linearGradient id="cityFarY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="theoBodyY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="hairSandyY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="emeraldFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a8c0e0"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="fogBlurY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

