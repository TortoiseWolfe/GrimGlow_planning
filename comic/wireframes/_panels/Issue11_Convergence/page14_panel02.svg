    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a8858" font-style="italic">"And I have met Sable."</text>
    <text x="152" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#3a2410" font-weight="700">THEODORE: "And you are the bravest..."</text>
