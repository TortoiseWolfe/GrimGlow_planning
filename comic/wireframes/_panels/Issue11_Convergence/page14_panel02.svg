  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a8858" font-weight="700">JINK (quiet, almost inaudible):</text>
    <text x="152" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">"You are the most stubborn person I have ever met."</text>
  </g>

  <g transform="translate(220,40)">
