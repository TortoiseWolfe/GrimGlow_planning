<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 4 Panel 2 — Wren collapses fourteen markers to six critical nodes</title>
  <desc>Close-up oil-stained hands manipulating holographic network projection. Hands collapse fourteen amber-black markers down to six, circling critical nodes in bright copper-gold. Six locations pulse with urgency against background network — brighter targeted possible. Projection simplifies from overwhelming to operational. Copper-gold light dominates, six critical nodes glowing with focused intensity. The plan taking shape.</desc>
  <defs>
