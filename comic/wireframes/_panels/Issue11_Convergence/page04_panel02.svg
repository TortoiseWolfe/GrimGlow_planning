    </linearGradient>
    <linearGradient id="cuffCopperY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="amberCoreY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
