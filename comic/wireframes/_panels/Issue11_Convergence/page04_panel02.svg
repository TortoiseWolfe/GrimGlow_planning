    <text x="183" y="44" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#fff8d8" font-weight="700">EXCH-B</text>
    <text x="290" y="64" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#fff8d8" font-weight="700">RELAY</text>
    <text x="80" y="200" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#fff8d8" font-weight="700">GOV</text>
    <text x="183" y="220" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#fff8d8" font-weight="700">JUNCT</text>
    <text x="290" y="200" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#fff8d8" font-weight="700">COMMR</text>
