    <path d="M 542 200 Q 558 206 568 214" stroke="url(#shirtG2)" stroke-width="14" fill="none" stroke-linecap="round"/>

    <ellipse cx="430" cy="220" rx="9" ry="4" fill="#a87858"/>
    <ellipse cx="426" cy="222" rx="3" ry="1" fill="#1a0a04" opacity="0.85"/>
    <ellipse cx="572" cy="216" rx="9" ry="4" fill="#a87858"/>
    <ellipse cx="568" cy="218" rx="3" ry="1" fill="#1a0a04" opacity="0.85"/>

    <rect x="408" y="208" width="40" height="22" rx="1" fill="#fff8d8"/>
    <line x1="412" y1="214" x2="444" y2="214" stroke="#1a0a04" stroke-width="0.4"/>
    <line x1="412" y1="220" x2="444" y2="220" stroke="#1a0a04" stroke-width="0.4"/>
    <line x1="412" y1="226" x2="444" y2="226" stroke="#1a0a04" stroke-width="0.4"/>
