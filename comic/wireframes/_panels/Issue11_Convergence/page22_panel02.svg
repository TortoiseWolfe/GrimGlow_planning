    <circle cx="500" cy="166" r="1" fill="#5a3818"/>
    <circle cx="500" cy="178" r="1" fill="#5a3818"/>
    <circle cx="500" cy="190" r="1" fill="#5a3818"/>

    <path d="M 458 158 L 470 154 L 478 158 L 470 162 Z" fill="url(#shirtG2)"/>
    <path d="M 542 158 L 530 154 L 522 158 L 530 162 Z" fill="url(#shirtG2)"/>

    <path d="M 470 130 L 530 130 L 522 156 L 478 156 Z" fill="url(#shirtG2)"/>
    <path d="M 488 130 L 488 156 M 512 130 L 512 156" stroke="#a87858" stroke-width="0.4" opacity="0.55"/>

    <path d="M 488 124 L 482 130 L 488 134 L 494 130 Z" fill="#3a1810"/>
    <path d="M 512 124 L 506 130 L 512 134 L 518 130 Z" fill="#3a1810"/>
    <line x1="488" y1="130" x2="494" y2="130" stroke="#fff8d8" stroke-width="0.55"/>

    <ellipse cx="500" cy="98" rx="22" ry="26" fill="url(#skinMachenG2)"/>
    <path d="M 478 86 Q 500 64 522 86 Q 522 96 520 102 L 482 102 Q 478 96 478 86 Z" fill="url(#hairMachenG2)"/>
    <path d="M 500 86 L 500 102" stroke="#080404" stroke-width="0.55" opacity="0.85"/>
    <g opacity="0.7" stroke="#1a1008" stroke-width="0.4">
      <line x1="486" y1="80" x2="486" y2="92"/>
      <line x1="496" y1="76" x2="496" y2="92"/>
      <line x1="506" y1="76" x2="506" y2="92"/>
      <line x1="516" y1="80" x2="516" y2="92"/>
    </g>

    <circle cx="490" cy="100" r="3.4" fill="none" stroke="#3a1810" stroke-width="0.85"/>
    <circle cx="510" cy="100" r="3.4" fill="none" stroke="#3a1810" stroke-width="0.85"/>
    <line x1="494" y1="100" x2="506" y2="100" stroke="#3a1810" stroke-width="0.55"/>

    <ellipse cx="490" cy="100" rx="3" ry="2" fill="#a8c0e0" opacity="0.42"/>
    <ellipse cx="510" cy="100" rx="3" ry="2" fill="#a8c0e0" opacity="0.42"/>
    <circle cx="490" cy="100" r="1" fill="#0a0604"/>
    <circle cx="510" cy="100" r="1" fill="#0a0604"/>

    <path d="M 484 96 Q 490 94 496 96" stroke="#0a0604" stroke-width="0.55" fill="none"/>
    <path d="M 504 96 Q 510 94 516 96" stroke="#0a0604" stroke-width="0.55" fill="none"/>
