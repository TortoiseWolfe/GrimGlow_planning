      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <filter id="bloomG2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowG2" x="-25%" y="-25%" width="150%" height="150%">
