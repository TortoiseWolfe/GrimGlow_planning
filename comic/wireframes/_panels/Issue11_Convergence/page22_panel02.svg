    <rect x="156" y="96" width="56" height="44" fill="url(#paperClipG2)" opacity="0.92"/>
    <text x="184" y="116" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#1a0a04" font-weight="700">DEMON</text>

    <rect x="220" y="92" width="56" height="44" fill="url(#paperClipG2)" opacity="0.92" transform="rotate(-3 248 114)"/>
    <text x="248" y="112" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#1a0a04" font-weight="700" transform="rotate(-3 248 112)">WITNESS</text>

    <rect x="284" y="96" width="56" height="44" fill="url(#paperClipG2)" opacity="0.92"/>
    <text x="312" y="116" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#1a0a04" font-weight="700">PATTERN</text>
