      <stop offset="0.5" stop-color="#e8d8b8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="waistcoatG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4830"/>
      <stop offset="0.5" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="shirtG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#e8d8b8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="hairMachenG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
