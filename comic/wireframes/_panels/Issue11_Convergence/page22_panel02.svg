<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 22 Panel 2 — James Machen at his desk reading from the pamphlet</title>
  <desc>Medium shot. Man in his early thirties at heavy Victorian desk, holding thin printed pamphlet, examining title page. James Machen — lean, serious, wire-rimmed spectacles, dark hair neatly parted, academic dress with waistcoat, cravat, rolled shirtsleeves revealing ink-stained fingers. Scholarly satisfaction tempered by unease — folklorist who has collected something that disturbs him with its coherence. Behind him, standing board with pinned newspaper clippings. Pamphlet freshly printed. Warm amber lamplight on his face, the pamphlet, the desk.</desc>
  <defs>
