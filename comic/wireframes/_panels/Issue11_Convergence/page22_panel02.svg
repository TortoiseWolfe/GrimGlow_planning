    <text x="120" y="55" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#1a0a04" font-weight="700">DEMON</text>
    <line x1="100" y1="62" x2="140" y2="62" stroke="#3a2410" stroke-width="0.4"/>
