  </g>
  <g opacity="0.95" filter="url(#strongGlowG2)">
    <ellipse cx="647" cy="40" rx="32" ry="22" fill="#fff8d8" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowG2)">
    <ellipse cx="647" cy="60" rx="120" ry="80" fill="#f4b860" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomG2)">
    <ellipse cx="500" cy="100" rx="40" ry="22" fill="#f4b860" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="500" cy="226" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="380" height="48" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="184" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#5a3018" font-weight="700">MACHEN (reading from the pamphlet):</text>
    <text x="184" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#2a2a2a" font-style="italic">"In the matter of these recent accounts, there is a pattern</text>
    <text x="184" y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#2a2a2a" font-style="italic">which defies the ordinary mechanisms of folk narrative.</text>
    <text x="184" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#2a2a2a" font-style="italic">These are not stories inherited from grandmothers. They</text>
    <text x="184" y="44" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#2a2a2a" font-style="italic">are stories being told now, by credible witnesses."</text>
  </g>
</svg>
