    <path d="M 100 96 Q 138 88 168 96" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 198 96 Q 228 88 266 96" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="156" cy="138" rx="11" ry="3" fill="#a87838" opacity="0.42"/>
    <ellipse cx="210" cy="138" rx="11" ry="3" fill="#a87838" opacity="0.42"/>
