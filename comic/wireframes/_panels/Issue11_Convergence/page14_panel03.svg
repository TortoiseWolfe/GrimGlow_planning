<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 11 Page 14 Panel 3 — Jink's face in moonlight, held tears, acceptance without peace</title>
  <desc>Close-up Jink's face in cold moonlight. Lean androgynous light brown skin wild bright golden blonde curly hair touched with silver moonlight. Eyes bright with held tears — not falling never falling but there. Quiet fear and love — acceptance of what cannot be changed terror of what it may cost. Scout who has avoided weight for ten issues, holding the one weight they cannot put down. Cold blue-white moonlight on face. Unshed tears catching light. Faint emerald glow from suit collar at bottom of frame. The face after the argument — right and overruled and terrified.</desc>
  <defs>
    <linearGradient id="bgZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonAboveZ3" cx="0.5" cy="0.05" r="0.62">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldCollarZ3" cx="0.5" cy="0.95" r="0.32">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#1a4a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairBlondeZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a8c0e0"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.5" stop-color="#7a8898"/>
      <stop offset="1" stop-color="#5a4838"/>
    </linearGradient>
    <radialGradient id="eyeQuietZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tearHeldZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldFigZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="bloomZ3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowZ3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="tearBloomZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgZ3)"/>
  <rect width="366" height="260" fill="url(#moonAboveZ3)"/>
  <rect width="366" height="260" fill="url(#emeraldCollarZ3)"/>

  <g>
