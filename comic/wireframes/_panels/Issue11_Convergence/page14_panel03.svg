  </g>
  <g opacity="0.55" filter="url(#megaGlowZ3)">
    <ellipse cx="183" cy="240" rx="160" ry="22" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomZ3)">
    <ellipse cx="183" cy="60" rx="100" ry="22" fill="#a8c0e0" opacity="0.55"/>
    <ellipse cx="183" cy="160" rx="80" ry="14" fill="#a8c0e0" opacity="0.32"/>
  </g>

  <g opacity="0.85">
    <line x1="138" y1="148" x2="142" y2="180" stroke="#a8c0e0" stroke-width="0.85" opacity="0.55"/>
    <line x1="228" y1="148" x2="222" y2="180" stroke="#a8c0e0" stroke-width="0.85" opacity="0.55"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="14" rx="3" fill="#f5ecd8" opacity="0.85" stroke="#5a4838" stroke-width="0.55"/>
    <text x="100" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#5a4838" font-style="italic" opacity="0.85">— right and overruled and terrified —</text>
  </g>
</svg>
