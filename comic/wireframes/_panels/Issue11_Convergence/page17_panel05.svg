<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 11 Page 17 Panel 5 — Luma calibrating her holographic lenses</title>
  <desc>Close-up Luma adjusting holographic lenses. South Asian features, warm brown skin, large dark eyes behind lenses — one repaired with strip of copper foil, one intact and scrolling blue-violet calibration data. Blinks as calibration completes. Sapphire-violet suit dusty and ink-stained, luminous filament in dark braid pulsing faintly. Improvised lens repair — future technology patched with Victorian copper. Focused concentration with flash of satisfaction.</desc>
  <defs>
    <linearGradient id="bgB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.4" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="violetLensB5" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairLumaB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="faceLumaB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="lensIntactB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a878d8"/>
      <stop offset="0.5" stop-color="#5a38a8"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="lensRepairedB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a38a8"/>
      <stop offset="0.5" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="copperFoilB5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="suitLumaB5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <filter id="bloomB5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowB5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowB5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.8"/>
    </filter>
  </defs>

  <rect width="246" height="260" fill="url(#bgB5)"/>
  <rect width="246" height="260" fill="url(#violetLensB5)"/>

  <g>
    <ellipse cx="123" cy="120" rx="100" ry="120" fill="url(#faceLumaB5)"/>

    <path d="M 26 44 Q 70 16 123 22 Q 176 16 220 44 Q 232 80 224 116 L 214 122 Q 188 64 158 50 Q 130 44 88 50 Q 58 64 32 122 L 22 116 Q 14 80 26 44 Z" fill="url(#hairLumaB5)"/>

    <path d="M 18 130 Q 14 200 8 254 L 28 254 Q 32 200 28 130 Z" fill="url(#hairLumaB5)"/>
    <g opacity="0.55" stroke="#a878d8" stroke-width="1.2">
      <line x1="20" y1="160" x2="22" y2="160"/>
      <line x1="22" y1="180" x2="24" y2="180"/>
      <line x1="20" y1="200" x2="22" y2="200"/>
      <line x1="22" y1="220" x2="24" y2="220"/>
      <line x1="20" y1="240" x2="22" y2="240"/>
    </g>

    <ellipse cx="76" cy="116" rx="32" ry="22" fill="url(#lensRepairedB5)" opacity="0.92"/>
    <ellipse cx="76" cy="116" rx="28" ry="18" fill="#1a1028"/>
    <ellipse cx="76" cy="116" rx="22" ry="14" fill="url(#lensRepairedB5)" opacity="0.85"/>

    <rect x="48" y="106" width="56" height="6" fill="url(#copperFoilB5)" opacity="0.85"/>
    <line x1="48" y1="106" x2="104" y2="106" stroke="#5a3018" stroke-width="0.7"/>
    <line x1="48" y1="112" x2="104" y2="112" stroke="#5a3018" stroke-width="0.7"/>
    <g opacity="0.62">
      <line x1="56" y1="106" x2="58" y2="112" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="68" y1="106" x2="70" y2="112" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="80" y1="106" x2="82" y2="112" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="92" y1="106" x2="94" y2="112" stroke="#5a3018" stroke-width="0.55"/>
    </g>

    <ellipse cx="76" cy="120" rx="11" ry="9" fill="#0a0604"/>
    <ellipse cx="76" cy="120" rx="6" ry="5" fill="#3a1808"/>
    <circle cx="76" cy="120" r="3" fill="#080404"/>

    <ellipse cx="170" cy="116" rx="32" ry="22" fill="url(#lensIntactB5)" opacity="0.85"/>
    <ellipse cx="170" cy="116" rx="28" ry="18" fill="#1a1028"/>
    <ellipse cx="170" cy="116" rx="22" ry="14" fill="url(#lensIntactB5)" opacity="0.7"/>

    <ellipse cx="170" cy="120" rx="11" ry="9" fill="#0a0604"/>
    <ellipse cx="170" cy="120" rx="6" ry="5" fill="#5a38a8"/>
    <circle cx="170" cy="120" r="3" fill="#080404"/>
    <circle cx="172" cy="118" r="1.4" fill="#a878d8"/>

    <g opacity="0.85" font-family="monospace" font-size="3.4" fill="#a878d8">
      <text x="148" y="108">▮▯▮ 0x4F</text>
      <text x="148" y="113">∇⊥∢ ⊕Δ◊</text>
      <text x="148" y="118">142.7Hz</text>
      <text x="148" y="124">SCAN+</text>
    </g>

    <path d="M 60 152 Q 123 162 186 152" stroke="#0a0604" stroke-width="0.85" fill="none" opacity="0.55"/>
    <ellipse cx="123" cy="160" rx="11" ry="6" fill="#5a3018" opacity="0.62"/>
    <ellipse cx="123" cy="160" rx="9" ry="3" fill="#0a0604" opacity="0.55"/>

    <path d="M 90 196 Q 123 200 156 196" stroke="#1a0a08" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <rect x="60" y="220" width="126" height="40" fill="url(#suitLumaB5)"/>
    <rect x="60" y="220" width="126" height="6" fill="#a878d8" opacity="0.62"/>
    <path d="M 80 232 L 95 232 M 110 240 L 130 240 M 150 232 L 170 232" stroke="#a85820" stroke-width="0.7" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowB5)">
    <ellipse cx="170" cy="116" rx="32" ry="22" fill="#a878d8" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowB5)">
    <ellipse cx="170" cy="116" rx="50" ry="32" fill="#7848b8" opacity="0.42"/>
  </g>

  <g opacity="0.62" filter="url(#bloomB5)">
    <ellipse cx="76" cy="116" rx="32" ry="14" fill="#5a38a8" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomB5)">
    <ellipse cx="123" cy="40" rx="100" ry="11" fill="#3a4868" opacity="0.32"/>
    <ellipse cx="123" cy="220" rx="80" ry="14" fill="#7848b8" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="244" rx="80" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(8,8)">
    <rect x="-4" y="0" width="220" height="34" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="106" y="9" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#7848b8" font-weight="700">LUMA:</text>
    <text x="106" y="17" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#2a2a2a" font-style="italic">"Lenses calibrated. Schematics loaded."</text>
    <text x="106" y="24" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#2a2a2a" font-style="italic">"Scanner range extended to —</text>
    <text x="106" y="31" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5.4" fill="#2a2a2a" font-style="italic">well. To what I can manage."</text>
  </g>
</svg>
