<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 15 Panel 1 — Luma at the church basement, "STAY" carved above her</title>
  <desc>Wide establishing sealed stone basement beneath decommissioned Victorian church. Stone walls thick dust centuries of darkness. Tiny figure approximately four inches tall stands on stone ledge before carved word in alien geometric script — large ancient precise. On dusty shelf below carving: remains of fairy technology — wing-pack corroded to bare geometric struts, dead data core, blackened suit fragments. Tiny figure in dusty sapphire-violet metallic suit casts structured blue-violet light from scanner across carving, only illumination in vast dark space. Small against stone wall, carved word enormous above. Dust motes float in scanner light. Stone arches recede into darkness. Returning to the place where someone chose to stay.</desc>
