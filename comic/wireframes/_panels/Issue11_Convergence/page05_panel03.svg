<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 5 Panel 3 — Jink watches Sable, conditional trust</title>
  <desc>Close-up Jink watching Sable. Lean androgynous light brown skin wild bright golden blonde curly hair soot-flecked. Emerald suit damaged and patched. Watchful and willing — anger from betrayal banked but not gone, willingness to follow the call present alongside it. Conditional trust visible in steady eyes. Copper-gold reflected light, faint emerald glow from suit seams. Trust offered with conditions.</desc>
  <defs>
    <linearGradient id="bgZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperReflZ3" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlowZ3" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#1a4a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="emeraldFigZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4d860"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkZ3" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeWatchZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomZ3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgZ3)"/>
  <rect width="366" height="280" fill="url(#copperReflZ3)"/>
  <rect width="366" height="280" fill="url(#emeraldGlowZ3)"/>

  <g>
    <rect x="0" y="240" width="366" height="40" fill="url(#floorZ3)"/>
    <line x1="0" y1="248" x2="366" y2="246" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="180" cy="120" rx="40" ry="56" fill="#3a261a"/>
    <ellipse cx="180" cy="100" rx="28" ry="32" fill="url(#faceJinkZ3)"/>

    <path d="M 138 60 Q 162 36 188 42 Q 216 32 232 60 Q 240 84 232 110 L 218 118 Q 210 70 196 64 Q 182 50 170 78 Q 152 60 144 92 L 132 96 Z" fill="url(#hairBlondeZ3)"/>
    <path d="M 144 50 Q 152 38 162 42" stroke="#fff8d8" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M 220 40 Q 230 38 238 50" stroke="#fff8d8" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M 158 78 Q 142 86 132 78" stroke="#a87838" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M 198 70 Q 212 78 222 70" stroke="#a87838" stroke-width="1.4" fill="none" opacity="0.7"/>
    <ellipse cx="152" cy="46" rx="4" ry="2.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="208" cy="42" rx="4" ry="2.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="174" cy="64" rx="3" ry="1.6" fill="#a87838" opacity="0.85"/>

    <ellipse cx="166" cy="106" rx="4" ry="5" fill="#0a0604"/>
    <ellipse cx="194" cy="106" rx="4" ry="5" fill="#0a0604"/>
    <circle cx="166" cy="106" r="2.4" fill="#080404"/>
    <circle cx="194" cy="106" r="2.4" fill="#080404"/>
    <circle cx="167" cy="105" r="1.4" fill="url(#eyeWatchZ3)"/>
    <circle cx="195" cy="105" r="1.4" fill="url(#eyeWatchZ3)"/>

    <path d="M 150 92 Q 168 86 180 92" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M 178 92 Q 196 86 212 92" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <path d="M 168 134 Q 180 134 192 134" stroke="#0a0604" stroke-width="1.4" fill="none"/>

    <path d="M 142 156 Q 180 144 218 156 L 232 220 L 128 220 L 134 188 Z" fill="url(#emeraldFigZ3)"/>
    <path d="M 152 168 L 208 168 L 220 216 L 140 216 Z" fill="#0a1408" opacity="0.85"/>

    <path d="M 142 168 L 122 188 L 116 220" stroke="url(#emeraldFigZ3)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 218 168 L 238 188 L 244 220" stroke="url(#emeraldFigZ3)" stroke-width="13" fill="none" stroke-linecap="round"/>

    <path d="M 148 178 Q 156 184 164 180" stroke="#a85820" stroke-width="0.85" fill="none" opacity="0.85"/>
    <path d="M 200 184 Q 208 188 216 184" stroke="#a85820" stroke-width="0.85" fill="none" opacity="0.85"/>
    <ellipse cx="186" cy="200" rx="9" ry="2.4" fill="#1a0a04" opacity="0.85"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowZ3)">
    <path d="M 142 168 Q 180 158 218 168" stroke="#3a8858" stroke-width="2" fill="none" opacity="0.55"/>
    <ellipse cx="180" cy="200" rx="60" ry="4" fill="#3a8858" opacity="0.32"/>
    <ellipse cx="124" cy="200" rx="9" ry="3" fill="#3a8858" opacity="0.42"/>
    <ellipse cx="236" cy="200" rx="9" ry="3" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="180" cy="226" rx="64" ry="2.6" fill="#040202"/>
  </g>

  <g opacity="0.55" filter="url(#bloomZ3)">
    <ellipse cx="180" cy="200" rx="80" ry="22" fill="#3a8858" opacity="0.22"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="180" height="22" rx="3" fill="#f5ecd8" opacity="0.9" stroke="#3a8858" stroke-width="0.7"/>
    <text x="82" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#3a8858" font-weight="700" opacity="0.7">JINK WATCHES</text>
    <text x="82" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.7">— willing, with conditions —</text>
  </g>
</svg>
