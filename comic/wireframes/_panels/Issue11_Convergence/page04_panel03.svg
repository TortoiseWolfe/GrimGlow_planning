    <path d="M 196 162 L 198 178 L 194 192" stroke="#dc4540" stroke-width="0.5" fill="none" opacity="0.7"/>
    <path d="M 132 192 L 188 192" stroke="#dc4540" stroke-width="0.4" opacity="0.55"/>
