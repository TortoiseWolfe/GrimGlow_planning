      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <radialGradient id="eyeRawZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handTheoZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <filter id="bloomZ3" x="-20%" y="-20%" width="140%" height="140%">
