<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 11 Page 12 Panel 3 — Jink studies Theodore, the grin gone, gathering courage</title>
  <desc>Medium close-up Jink sits on lead flashing of Victorian rooftop beside enormous resting hand, looking not at city but at the boy. Lean androgynous light brown skin wild bright golden blonde curly hair catching moonlight. Emerald metallic suit torn and patched with copper wire, soot-streaked, holographic wing-pack seams glowing faint emerald. Grin is gone. Raw serious frightened. For first time Jink looks their age — young scared caring about someone too much to stay quiet. Moonlight from above and gaslight from below create balanced dual-lighting on face. Faint emerald wing-pack glow. The scout gathering courage.</desc>
