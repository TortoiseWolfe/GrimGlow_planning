      <stop offset="0.5" stop-color="#3a4868"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <linearGradient id="slateBackZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4858"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="emeraldFigZ3" x1="0" y1="0" x2="0" y2="1">
