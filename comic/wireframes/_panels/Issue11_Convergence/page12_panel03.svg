    <path d="M 116 90 Q 134 84 152 90" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>

    <ellipse cx="92" cy="124" rx="6" ry="2" fill="#a87838" opacity="0.55"/>
    <ellipse cx="148" cy="124" rx="6" ry="2" fill="#a87838" opacity="0.55"/>
    <ellipse cx="120" cy="120" rx="2" ry="1" fill="#a87838" opacity="0.7"/>

