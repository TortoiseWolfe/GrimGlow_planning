    <ellipse cx="106" cy="106" rx="5" ry="6" fill="#0a0604"/>
    <ellipse cx="134" cy="106" rx="5" ry="6" fill="#0a0604"/>
    <circle cx="106" cy="106" r="3" fill="#080404"/>
    <circle cx="134" cy="106" r="3" fill="#080404"/>
    <circle cx="108" cy="105" r="1.6" fill="url(#eyeRawZ3)"/>
    <circle cx="136" cy="105" r="1.6" fill="url(#eyeRawZ3)"/>

