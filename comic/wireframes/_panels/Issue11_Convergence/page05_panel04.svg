<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 5 Panel 4 — Wren waits, calm expectation</title>
  <desc>Close-up Wren looking toward Sable. East Asian features wiry build dark messy hair bun. Arms folded, expression calm and expectant — pragmatist who has calculated odds and accepted them. Presented the data, decision not hers, but already made it. Degraded copper suit catches copper-gold light from her own projections still active behind. The engineer waiting for the word.</desc>
  <defs>
    <linearGradient id="bgY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperBackY4" x1="0.85" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperFigY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="hairBlkY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceWrenY4" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeCalmY4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgY4)"/>
  <rect width="366" height="280" fill="url(#copperBackY4)"/>

  <g>
    <rect x="0" y="240" width="366" height="40" fill="url(#floorY4)"/>
    <line x1="0" y1="248" x2="366" y2="246" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g opacity="0.55">
    <ellipse cx="280" cy="120" rx="80" ry="50" fill="none" stroke="#a85820" stroke-width="0.5"/>
    <ellipse cx="280" cy="120" rx="60" ry="38" fill="none" stroke="#a85820" stroke-width="0.4"/>
    <line x1="200" y1="120" x2="360" y2="120" stroke="#a85820" stroke-width="0.4"/>
