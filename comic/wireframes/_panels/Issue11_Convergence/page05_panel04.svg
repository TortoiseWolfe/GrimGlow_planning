    <circle cx="340" cy="90" r="3" fill="#a87838"/>
    <circle cx="280" cy="80" r="3.4" fill="#a87838"/>
    <circle cx="220" cy="150" r="3" fill="#a87838"/>
    <circle cx="340" cy="150" r="3" fill="#a87838"/>
    <circle cx="280" cy="160" r="3.4" fill="#a87838"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowY4)">
    <circle cx="220" cy="90" r="7" fill="#a87838" opacity="0.55"/>
    <circle cx="340" cy="90" r="7" fill="#a87838" opacity="0.55"/>
    <circle cx="280" cy="80" r="9" fill="#a87838" opacity="0.62"/>
    <circle cx="220" cy="150" r="7" fill="#a87838" opacity="0.55"/>
    <circle cx="340" cy="150" r="7" fill="#a87838" opacity="0.55"/>
