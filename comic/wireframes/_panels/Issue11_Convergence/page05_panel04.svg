  </g>

  <g>
    <ellipse cx="120" cy="140" rx="44" ry="56" fill="#3a261a"/>
    <ellipse cx="120" cy="116" rx="32" ry="38" fill="url(#faceWrenY4)"/>

    <path d="M 86 76 Q 120 60 154 76 Q 162 100 158 118 L 152 124 Q 138 86 120 80 Q 102 86 88 124 Z" fill="url(#hairBlkY4)"/>
    <ellipse cx="152" cy="68" rx="11" ry="6" fill="url(#hairBlkY4)"/>
    <path d="M 96 64 Q 110 58 122 60" stroke="#3a1a14" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M 138 58 Q 148 56 158 64" stroke="#3a1a14" stroke-width="0.7" fill="none" opacity="0.7"/>

    <ellipse cx="106" cy="120" rx="4" ry="5" fill="#0a0604"/>
    <ellipse cx="134" cy="120" rx="4" ry="5" fill="#0a0604"/>
    <circle cx="106" cy="120" r="2.4" fill="#080404"/>
    <circle cx="134" cy="120" r="2.4" fill="#080404"/>
    <circle cx="107" cy="119" r="1.4" fill="url(#eyeCalmY4)"/>
    <circle cx="135" cy="119" r="1.4" fill="url(#eyeCalmY4)"/>

    <path d="M 90 108 Q 108 104 120 108" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M 118 108 Q 134 104 152 108" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <path d="M 110 144 Q 120 144 130 144" stroke="#0a0604" stroke-width="1.4" fill="none"/>

    <path d="M 78 168 Q 120 158 162 168 L 188 240 L 56 240 L 60 200 Z" fill="url(#copperFigY4)"/>
    <path d="M 90 184 L 150 184 L 160 232 L 80 232 Z" fill="#5a2e10" opacity="0.7"/>
    <path d="M 96 200 L 144 204 L 140 220 L 100 216 Z" fill="#1a0a04" opacity="0.85"/>

    <path d="M 78 168 L 88 184 L 116 192 L 144 192 L 172 184 L 162 168 L 188 168" stroke="url(#copperFigY4)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="116" cy="192" rx="22" ry="6" fill="url(#copperFigY4)"/>
    <ellipse cx="144" cy="192" rx="22" ry="6" fill="url(#copperFigY4)"/>

    <path d="M 102 188 Q 116 196 130 188" stroke="#3a1a08" stroke-width="0.6" fill="none" opacity="0.55"/>
    <path d="M 130 188 Q 144 196 158 188" stroke="#3a1a08" stroke-width="0.6" fill="none" opacity="0.55"/>

    <ellipse cx="92" cy="180" rx="6" ry="2" fill="#1a0a04" opacity="0.7"/>
    <ellipse cx="148" cy="180" rx="6" ry="2" fill="#1a0a04" opacity="0.7"/>

    <path d="M 92 174 L 100 168 L 110 172" stroke="#a85820" stroke-width="0.7" fill="none" opacity="0.7"/>
  </g>

  <g opacity="0.55">
    <ellipse cx="120" cy="206" rx="44" ry="22" fill="#a85820" opacity="0.18"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="120" cy="248" rx="80" ry="3" fill="#040202"/>
  </g>

  <g opacity="0.85">
    <line x1="160" y1="130" x2="200" y2="130" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.55"/>
    <line x1="160" y1="120" x2="200" y2="118" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.55"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="180" height="22" rx="3" fill="#f5ecd8" opacity="0.9" stroke="#a85820" stroke-width="0.7"/>
    <text x="82" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#a85820" font-weight="700" opacity="0.7">WREN WAITS</text>
    <text x="82" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.7">— odds calculated, accepted —</text>
  </g>
</svg>
