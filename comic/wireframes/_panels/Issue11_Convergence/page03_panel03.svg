    <path d="M 196 168 L 220 156 L 224 174 L 200 184 Z" fill="url(#tinPatchZ3)" opacity="0.92"/>
    <path d="M 196 168 L 220 156" stroke="#3a4868" stroke-width="0.6"/>
    <path d="M 224 174 L 200 184" stroke="#3a4868" stroke-width="0.6"/>
    <circle cx="202" cy="168" r="0.7" fill="#1a1828"/>
    <circle cx="216" cy="162" r="0.7" fill="#1a1828"/>
    <circle cx="220" cy="172" r="0.7" fill="#1a1828"/>
    <circle cx="206" cy="178" r="0.7" fill="#1a1828"/>
  </g>
  <g opacity="0.85" filter="url(#bloomZ3)">
    <rect x="122" y="168" width="76" height="72" fill="#88a8d0" opacity="0.32"/>
