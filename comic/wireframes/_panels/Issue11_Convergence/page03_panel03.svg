  <g opacity="0.55">
    <line x1="0" y1="50" x2="100" y2="56" stroke="#1a0a08" stroke-width="0.5"/>
    <line x1="0" y1="170" x2="80" y2="172" stroke="#1a0a08" stroke-width="0.5"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="240" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#5a6478" stroke-width="1.4"/>
    <text x="112" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a6478" font-weight="700">SABLE: "Can they be neutralized?"</text>
  </g>
