<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 3 Panel 3 — Sable, "Can they be neutralized?"</title>
  <desc>Medium close-up Sable. Dark brown skin sharp angular features very short military-cropped silver-white hair almost buzz-cut length NOT long. Silver suit soot-darkened, tin-patched shoulder visible. Command posture, mask on — but dark eyes calculate something beyond immediate question. Speaks with voice that stops discussions. Copper-gold reflected light from holographic projections illuminates front of face. Grey daylight from wall gap behind backlights silver-white hair. The commander asking the question that determines everything.</desc>
