<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 11 Page 7 Panel 2 — Jink reads the rooftop approach</title>
  <desc>Close-up Jink studying assigned route on holographic projection. Lean androgynous light brown skin wild bright golden blonde curly hair flecked with soot. Eyes trace flight path across copper-gold city map — rooftop-to-rooftop high-altitude approach. Focused, reading route with respect for what waits at other end. Old grin absent. Copper-gold projection light and faint emerald suit glow. A scout reading a combat assignment.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperFillY2" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlowY2" cx="0.5" cy="0.62" r="0.4">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#1a4a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="emeraldFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4d860"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkY2" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeFocusY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgY2)"/>
  <rect width="246" height="240" fill="url(#copperFillY2)"/>
  <rect width="246" height="240" fill="url(#emeraldGlowY2)"/>

  <g>
    <rect x="0" y="200" width="246" height="40" fill="url(#floorY2)"/>
    <line x1="0" y1="208" x2="246" y2="206" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g opacity="0.85">
    <rect x="160" y="40" width="74" height="120" fill="none" stroke="#a85820" stroke-width="0.4" opacity="0.7"/>
    <g opacity="0.55" stroke="#a85820" stroke-width="0.3" fill="none">
      <line x1="160" y1="60" x2="234" y2="60"/>
      <line x1="160" y1="80" x2="234" y2="80"/>
      <line x1="160" y1="100" x2="234" y2="100"/>
      <line x1="160" y1="120" x2="234" y2="120"/>
      <line x1="180" y1="40" x2="180" y2="160"/>
      <line x1="200" y1="40" x2="200" y2="160"/>
      <line x1="220" y1="40" x2="220" y2="160"/>
    </g>

    <path d="M 168 130 L 184 110 L 200 90 L 216 70 L 232 60" stroke="#3a8858" stroke-width="0.85" fill="none" stroke-dasharray="2 1.4"/>
    <circle cx="168" cy="130" r="3" fill="#3a8858"/>
    <circle cx="184" cy="110" r="2.4" fill="#3a8858"/>
    <circle cx="200" cy="90" r="2.4" fill="#3a8858"/>
    <circle cx="216" cy="70" r="2.4" fill="#3a8858"/>
    <circle cx="232" cy="60" r="3.4" fill="#dc4540" stroke="#5a1810" stroke-width="0.4"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowY2)">
    <circle cx="232" cy="60" r="9" fill="#dc4540" opacity="0.62"/>
  </g>
  <g opacity="0.55">
    <text x="200" y="50" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#3a8858" opacity="0.85">ROOFTOP RUN</text>
    <text x="200" y="155" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#3a8858" opacity="0.75">— EXPOSURE 110s —</text>
  </g>

  <g>
    <ellipse cx="100" cy="100" rx="32" ry="44" fill="#3a261a"/>
    <ellipse cx="100" cy="80" rx="22" ry="26" fill="url(#faceJinkY2)"/>

    <path d="M 70 50 Q 88 32 110 38 Q 130 32 144 50 Q 152 70 144 90 L 134 96 Q 124 60 114 56 Q 102 48 92 70 Q 80 56 76 78 L 68 78 Z" fill="url(#hairBlondeY2)"/>
    <path d="M 76 42 Q 84 32 96 36" stroke="#fff8d8" stroke-width="0.85" fill="none" opacity="0.7"/>
    <path d="M 132 32 Q 140 30 146 40" stroke="#fff8d8" stroke-width="0.85" fill="none" opacity="0.7"/>
    <ellipse cx="84" cy="40" rx="3" ry="1.6" fill="#a87838" opacity="0.85"/>
    <ellipse cx="132" cy="38" rx="3" ry="1.6" fill="#a87838" opacity="0.85"/>
    <ellipse cx="100" cy="58" rx="2" ry="1" fill="#a87838" opacity="0.85"/>

    <ellipse cx="90" cy="84" rx="2.6" ry="3.4" fill="#0a0604"/>
    <ellipse cx="110" cy="84" rx="2.6" ry="3.4" fill="#0a0604"/>
    <circle cx="90" cy="84" r="1.6" fill="#080404"/>
    <circle cx="110" cy="84" r="1.6" fill="#080404"/>
    <circle cx="91" cy="83" r="0.85" fill="url(#eyeFocusY2)"/>
    <circle cx="111" cy="83" r="0.85" fill="url(#eyeFocusY2)"/>

    <path d="M 78 76 Q 90 72 100 76" stroke="#0a0604" stroke-width="1" fill="none"/>
    <path d="M 100 76 Q 110 72 122 76" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 92 110 Q 100 110 108 110" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 78 130 Q 100 122 122 130 L 132 200 L 68 200 L 74 168 Z" fill="url(#emeraldFigY2)"/>
    <path d="M 84 142 L 116 142 L 124 196 L 76 196 Z" fill="#0a1408" opacity="0.85"/>

    <path d="M 122 130 L 142 116 L 156 110" stroke="url(#emeraldFigY2)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="158" cy="108" rx="4" ry="3" fill="#a87838"/>

    <path d="M 78 130 L 60 168 L 56 200" stroke="url(#emeraldFigY2)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.85">
    <line x1="160" y1="108" x2="180" y2="108" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.7"/>
  </g>

  <g opacity="0.85" filter="url(#bloomY2)">
    <rect x="74" y="130" width="58" height="70" fill="#3a8858" opacity="0.32"/>
  </g>
  <g opacity="0.55" filter="url(#strongGlowY2)">
    <ellipse cx="100" cy="170" rx="40" ry="22" fill="#3a8858" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="100" cy="206" rx="40" ry="2.4" fill="#040202"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#3a8858" font-weight="700">JINK: "High approach.</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">A long exposure run."</text>
  </g>
</svg>
