<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 13 Panel 5 — Detail of Jink's hand against Theodore's fingernail, defiant contact</title>
  <desc>Close-up detail. Enormous hand rests on lead flashing — oil-stained fingers, brass gear ring on index finger, hand of Victorian boy. Beside hand stands tiny figure approximately four inches tall in soot-streaked emerald suit — one small hand pressed against boy's fingernail in gesture not of tenderness but of defiance. Jink holding on to argument through physical contact. Scale: tiny palm against enormous fingernail, four-inch figure gripping finger they could not move. Cold moonlight on both surfaces. Faint emerald glow from suit reflecting on boy's skin. The point of contact between two wills.</desc>
  <defs>
    <linearGradient id="bgY5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonContactY5" cx="0.5" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a78a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldReflectY5" cx="0.32" cy="0.55" r="0.32">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#1a4a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leadFlashY5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#5a6478"/>
      <stop offset="1" stop-color="#3a4868"/>
    </linearGradient>
    <linearGradient id="handTheoY5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a878"/>
      <stop offset="0.5" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="brassRingY5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="emeraldFigY5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeY5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a8c0e0"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkY5" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="fingernailY5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#d8b888"/>
      <stop offset="1" stop-color="#7a4830"/>
    </radialGradient>
    <filter id="bloomY5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="contactGlowY5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgY5)"/>
  <rect width="366" height="240" fill="url(#moonContactY5)"/>
  <rect width="366" height="240" fill="url(#emeraldReflectY5)"/>

  <g>
    <rect x="0" y="180" width="366" height="60" fill="url(#leadFlashY5)" opacity="0.92"/>
    <line x1="0" y1="186" x2="366" y2="186" stroke="#3a4868" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#3a4868" stroke-width="0.55">
      <line x1="60" y1="186" x2="60" y2="240"/>
      <line x1="160" y1="186" x2="160" y2="240"/>
      <line x1="260" y1="186" x2="260" y2="240"/>
    </g>
  </g>

  <g>
    <path d="M 140 100 Q 220 90 366 96 L 366 200 L 140 200 Q 130 160 140 100 Z" fill="url(#handTheoY5)"/>

    <path d="M 220 124 Q 280 120 360 124" stroke="#5a3622" stroke-width="0.85" fill="none" opacity="0.55"/>
    <path d="M 200 152 Q 260 156 360 156" stroke="#5a3622" stroke-width="0.7" fill="none" opacity="0.55"/>
    <path d="M 220 180 Q 280 184 360 180" stroke="#5a3622" stroke-width="0.7" fill="none" opacity="0.55"/>

    <ellipse cx="240" cy="138" rx="14" ry="3" fill="#1a0604" opacity="0.55"/>
    <ellipse cx="280" cy="170" rx="11" ry="3" fill="#1a0604" opacity="0.42"/>
    <ellipse cx="200" cy="120" rx="9" ry="2.4" fill="#1a0604" opacity="0.55"/>

    <ellipse cx="180" cy="142" rx="22" ry="11" fill="url(#brassRingY5)"/>
    <ellipse cx="180" cy="142" rx="14" ry="6" fill="#3a1a08"/>
    <line x1="170" y1="142" x2="190" y2="142" stroke="#5a2e10" stroke-width="1.4"/>
    <line x1="180" y1="134" x2="180" y2="150" stroke="#5a2e10" stroke-width="1.4"/>
    <path d="M 172 134 L 188 150 M 172 150 L 188 134" stroke="#5a2e10" stroke-width="1"/>
    <path d="M 174 138 L 186 138" stroke="#5a2e10" stroke-width="0.85" opacity="0.85"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowY5)">
    <ellipse cx="180" cy="142" rx="40" ry="14" fill="#f4b860" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowY5)">
    <ellipse cx="180" cy="142" rx="80" ry="32" fill="#a85820" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="160" cy="100" rx="22" ry="14" fill="url(#fingernailY5)"/>
    <ellipse cx="160" cy="100" rx="18" ry="11" fill="url(#fingernailY5)" opacity="0.92"/>
    <path d="M 142 96 Q 160 86 178 96" stroke="#5a3018" stroke-width="0.85" fill="none" opacity="0.55"/>
    <path d="M 148 100 L 172 100" stroke="#a87838" stroke-width="0.55" opacity="0.42"/>
    <path d="M 144 104 L 176 104" stroke="#a87838" stroke-width="0.55" opacity="0.42"/>
  </g>
  <g opacity="0.85" filter="url(#bloomY5)">
    <ellipse cx="160" cy="98" rx="9" ry="3" fill="#fff8d8" opacity="0.62"/>
  </g>

  <g>
    <ellipse cx="100" cy="160" rx="22" ry="6" fill="#080404" opacity="0.55"/>

    <ellipse cx="100" cy="140" rx="20" ry="26" fill="#3a261a"/>
    <ellipse cx="100" cy="124" rx="14" ry="16" fill="url(#faceJinkY5)"/>

    <path d="M 80 100 Q 100 80 124 90 Q 140 90 144 110 Q 142 124 136 130 L 130 124 Q 124 100 116 96 Q 104 90 96 110 Q 84 90 76 110 L 70 108 Z" fill="url(#hairBlondeY5)"/>

    <ellipse cx="92" cy="124" rx="2.4" ry="3" fill="#0a0604"/>
    <ellipse cx="108" cy="124" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="94" cy="123" r="1" fill="#a8c0e0"/>
    <circle cx="110" cy="123" r="1" fill="#a8c0e0"/>

    <path d="M 78 116 Q 92 110 102 116" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 100 116 Q 110 110 122 116" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <path d="M 90 134 Q 100 132 110 134" stroke="#0a0604" stroke-width="1.4" fill="none"/>

    <path d="M 80 150 Q 100 146 122 150 L 134 200 L 64 200 L 70 174 Z" fill="url(#emeraldFigY5)"/>
    <path d="M 86 162 L 116 162 L 124 196 L 76 196 Z" fill="#0a1408" opacity="0.85"/>

    <path d="M 80 150 L 60 174 L 50 200" stroke="url(#emeraldFigY5)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <path d="M 122 150 L 138 138 L 152 124" stroke="url(#emeraldFigY5)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="154" cy="120" rx="6" ry="4" fill="url(#faceJinkY5)"/>
  </g>

  <g opacity="0.95" filter="url(#contactGlowY5)">
    <ellipse cx="156" cy="116" rx="11" ry="6" fill="#3a8858" opacity="0.85"/>
    <ellipse cx="156" cy="116" rx="6" ry="3" fill="#fff8d8" opacity="0.85"/>
  </g>
  <g opacity="0.95">
    <circle cx="156" cy="116" r="2" fill="#fff8d8"/>
  </g>

  <g opacity="0.85" filter="url(#bloomY5)">
    <ellipse cx="100" cy="190" rx="40" ry="14" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="160" cy="98" rx="22" ry="9" fill="none" stroke="#3a8858" stroke-width="0.55" opacity="0.42"/>
  </g>

  <g opacity="0.55">
    <text x="280" y="40" text-anchor="middle" font-family="Times New Roman, serif" font-size="6" fill="#a87838" font-style="italic" opacity="0.7">— defiance —</text>
    <text x="40" y="60" text-anchor="middle" font-family="Times New Roman, serif" font-size="6" fill="#3a8858" font-style="italic" opacity="0.7">— hold on —</text>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#3a8858" font-weight="700">JINK: "You don't understand what they are.</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">You saw what happened at the telegraph —"</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#3a2410" font-weight="700">THEODORE: "I saw. I am still coming."</text>
  </g>
</svg>
