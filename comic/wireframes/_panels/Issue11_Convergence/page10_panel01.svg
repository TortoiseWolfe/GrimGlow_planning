<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 10 Panel 1 — Squad and Theodore in operational planning, "Take the east. Use the chimneys."</title>
  <desc>Medium wide five tiny figures and one enormous face at wall gap deep in operational planning. Holographic tactical projection cycles through target locations in copper-gold light. Silver figure stands hands behind back commanding. Copper controls projections. Emerald points at rooftop approach vector debating. Crimson studies layout in silence. Sapphire-violet cross-references on scanner. Through wall gap boy's face follows discussion with serious attention. Rhythm professional familiar — trained operatives working a problem each contributing expertise. A war council between walls.</desc>
