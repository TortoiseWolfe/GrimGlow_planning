<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 12 Panel 1 — Victorian rooftop at night, Jink and Theodore, "Night before"</title>
  <desc>Wide establishing slightly low angle. Victorian rooftop at night — lead flashing slate tiles under cold blue-white moonlight. City spread below in vast field amber gaslight chimney smoke, thousands of warm light points marking streets. Telegraph lines thread between buildings as dark threads against glowing cityscape. Two figures sit at roof's edge on lead flashing. Victorian boy slight legs dangling silhouetted against city glow. Beside him at height of resting hand tiny figure approximately four inches tall — lean androgynous wild bright golden blonde curly hair catching moonlight, emerald metallic suit with seams glowing faintly. Scale difference stark. They sit together. Most balanced dual-lighting in the volume.</desc>
