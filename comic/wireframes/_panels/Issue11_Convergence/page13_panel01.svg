      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonAngleX1" cx="0.18" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.55"/>
