      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightCityX1" cx="0.5" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.62"/>
