<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 13 Panel 1 — High angle, Jink delivers the argument standing on the ledge</title>
  <desc>Medium slight high angle Victorian rooftop edge. Boy sits with legs dangling. Tiny figure approximately four inches tall stands on lead flashing — lean androgynous bright golden blonde curly hair soot-streaked emerald suit small fists at sides body leaning toward boy with urgency. City spreads below in amber gaslight. Telegraph lines thread between buildings as dark threads — tomorrow's battlefield. Cold moonlight from camera's angle, warm gaslight from below. Tiny figure's emerald suit glow a bright point on dark rooftop. Scale from above makes both small against city. Urgency on a rooftop.</desc>
