    <line x1="450" y1="124" x2="450" y2="156" stroke="#a85820" stroke-width="0.4" stroke-dasharray="1.4 1" opacity="0.42"/>
  </g>

  <g opacity="0.55">
    <circle cx="120" cy="20" r="0.85" fill="#a8c0e0"/>
    <circle cx="280" cy="32" r="0.7" fill="#a8c0e0"/>
    <circle cx="500" cy="28" r="0.7" fill="#a8c0e0"/>
    <circle cx="640" cy="14" r="0.85" fill="#a8c0e0"/>
