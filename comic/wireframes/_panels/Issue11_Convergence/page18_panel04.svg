<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 18 Panel 4 — Theodore approaching through pre-dawn street</title>
  <desc>Medium shot through gap in brickwork. Pre-dawn street beyond — grey light, cobblestones, dark shapes of buildings. Through grey, Victorian boy approaches quickly, keeping to shadows with learned military awareness. Slight, sandy-brown hair, worn waistcoat, patched trousers, faint bulge in waistcoat pocket from hybrid comm device. Face set with resolve — boy who refused to walk away, arriving as promised. Grey pre-dawn light, first hints of amber dawn at eastern sky edge.</desc>
