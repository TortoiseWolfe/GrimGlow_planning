      <stop offset="0.5" stop-color="#3a4868"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <radialGradient id="dawnAmberC4" cx="0.95" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.42"/>
