    <linearGradient id="skinTheoC4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b8a0"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <filter id="bloomC4" x="-20%" y="-20%" width="140%" height="140%">
