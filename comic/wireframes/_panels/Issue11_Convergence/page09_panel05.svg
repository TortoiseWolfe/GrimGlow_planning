<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 220" width="246" height="220">
  <title>Issue 11 Page 9 Panel 5 — Jink touches Theodore's fingertip, solidarity across scale</title>
  <desc>Close-up detail. Enormous oil-stained hand rests at gap in brickwork — boy's hand with brass gear ring on index finger, fingers larger than tiny figure standing beside them on wooden beam. Tiny figure in soot-streaked emerald metallic suit — lean androgynous wild bright golden blonde curly hair — touches boy's fingertip with one small hand. Scale makes gesture extraordinary: four-inch figure and boy's finger, contact point of friendship built across impossible divide. Jink's expression something soft and fierce — caring visible on features usually reserved for grins. Daylight on enormous hand, faint emerald glow from tiny figure's suit seams. Solidarity across scale.</desc>
