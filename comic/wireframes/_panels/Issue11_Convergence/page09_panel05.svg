      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="dayWarmZ5" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlowZ5" cx="0.32" cy="0.62" r="0.32">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#1a4a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="beamZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="brickEdgeZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a14"/>
      <stop offset="1" stop-color="#1a0a08"/>
    </linearGradient>
    <linearGradient id="handTheoZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <linearGradient id="brassRingZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="emeraldFigZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4d860"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="faceJinkZ5" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeSoftZ5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomZ5" x="-20%" y="-20%" width="140%" height="140%">
