    <ellipse cx="100" cy="166" rx="40" ry="2" fill="#040202" opacity="0.65"/>
  </g>

  <g>
    <ellipse cx="80" cy="120" rx="9" ry="11" fill="#3a261a"/>
    <ellipse cx="80" cy="112" rx="6" ry="7" fill="url(#faceJinkZ5)"/>

