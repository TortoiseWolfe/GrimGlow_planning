    <ellipse cx="76" cy="100" rx="2.4" ry="1.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="84" cy="98" rx="2.4" ry="1.4" fill="#a87838" opacity="0.85"/>

    <ellipse cx="76" cy="114" rx="1" ry="1.4" fill="#0a0604"/>
    <ellipse cx="84" cy="114" rx="1" ry="1.4" fill="#0a0604"/>
    <circle cx="77" cy="113" r="0.55" fill="url(#eyeSoftZ5)"/>
    <circle cx="85" cy="113" r="0.55" fill="url(#eyeSoftZ5)"/>

