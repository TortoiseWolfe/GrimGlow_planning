    <path d="M 76 122 Q 80 124 84 122" stroke="#0a0604" stroke-width="0.7" fill="none"/>

    <path d="M 70 132 Q 80 124 90 132 L 96 160 L 64 160 L 68 144 Z" fill="url(#emeraldFigZ5)"/>
    <path d="M 74 138 L 86 138 L 90 156 L 70 156 Z" fill="#0a1408" opacity="0.85"/>

