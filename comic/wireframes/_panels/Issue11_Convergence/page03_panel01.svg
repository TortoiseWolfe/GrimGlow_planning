<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 3 Panel 1 — Overhead, "Fourteen devices I can confirm"</title>
  <desc>Wide overhead high angle five tiny figures on rough timber beams beneath massive holographic network map. Copper-gold telegraph lines amber-black device markers fill air casting complex geometric shadows downward. Figures arrayed in positions — copper standing, silver rigid, emerald crouched high, crimson at perimeter, sapphire-violet seated with scanner. All suits heavily degraded but holographic elements glow through grime. Projection rotates revealing three-dimensional distribution of threat. Five damaged soldiers against city-wide operation. The scope of the war they didn't know they were fighting.</desc>
