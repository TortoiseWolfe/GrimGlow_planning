<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 260" width="494" height="260">
  <title>Issue 11 Page 17 Panel 4 — Sable reviewing the tactical projection, "From here, we carry the plan."</title>
  <desc>Medium shot. Sable before a small holographic tactical projection — six target markers, timing indicators, and operator assignments in copper-gold light. She studies it one final time, comm unit attached to her forearm. Dark brown skin, sharp features, silver-white hair in grey pre-dawn light. Then she dismisses the projection — copper-gold light folding inward and vanishing. Calm of completion — everything done, nothing left but execution. Grey pre-dawn light replacing copper-gold glow.</desc>
  <defs>
    <linearGradient id="bgB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="copperGoldFadingB4" cx="0.62" cy="0.4" r="0.32">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitSableB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8898"/>
      <stop offset="0.5" stop-color="#3a4868"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="hairSilverB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset="0.5" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="skinSableB4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3818"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="commForeB4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.5" stop-color="#5a78a8"/>
      <stop offset="1" stop-color="#3a4868"/>
    </linearGradient>
    <filter id="bloomB4" x="-20%" y="-20%" width="140%" height="140%">
