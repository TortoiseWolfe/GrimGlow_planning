    </filter>
    <filter id="strongGlowB4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowB4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="494" height="260" fill="url(#bgB4)"/>
  <rect width="494" height="260" fill="url(#copperGoldFadingB4)"/>

