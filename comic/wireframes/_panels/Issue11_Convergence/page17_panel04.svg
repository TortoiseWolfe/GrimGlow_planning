      <line x1="400" y1="140" x2="370" y2="135"/>
      <line x1="370" y1="135" x2="345" y2="125"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowB4)">
    <circle cx="380" cy="120" r="40" fill="#d88838" opacity="0.32" stroke="none"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowB4)">
    <circle cx="380" cy="120" r="60" fill="#a85820" opacity="0.32" stroke="none"/>
  </g>

  <g opacity="0.85" filter="url(#bloomB4)">
    <ellipse cx="160" cy="160" rx="48" ry="22" fill="#7a8898" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="247" cy="240" rx="180" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="240" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="110" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#5a6478" font-weight="700">SABLE:</text>
    <text x="110" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic">"Projections down. From here, we carry the plan."</text>
  </g>
</svg>
