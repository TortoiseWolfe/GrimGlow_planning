    <rect x="270" y="148" width="22" height="14" rx="2" fill="url(#commForeB4)"/>
    <circle cx="281" cy="155" r="2" fill="#a8c0e0"/>

    <path d="M 124 200 Q 110 214 100 222" stroke="url(#suitSableB4)" stroke-width="14" fill="none" stroke-linecap="round"/>
