    <circle cx="440" cy="14" r="0.7" fill="#a8c0e0"/>
  </g>

  <g>
    <rect x="0" y="220" width="494" height="40" fill="url(#leadFlashZ3)" opacity="0.92"/>
    <line x1="0" y1="224" x2="494" y2="224" stroke="#1a1828" stroke-width="0.7"/>
    <g opacity="0.55" stroke="#1a1828" stroke-width="0.4">
