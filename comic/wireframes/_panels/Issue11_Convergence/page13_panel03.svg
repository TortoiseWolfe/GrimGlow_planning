    <line x1="178" y1="216" x2="194" y2="216" stroke="#5a2e10" stroke-width="1"/>
    <line x1="186" y1="210" x2="186" y2="222" stroke="#5a2e10" stroke-width="1"/>
    <path d="M 180 210 L 192 222 M 180 222 L 192 210" stroke="#5a2e10" stroke-width="0.7"/>

    <path d="M 60 218 Q 100 214 140 218" stroke="#5a3622" stroke-width="0.85" fill="none" opacity="0.55"/>
    <ellipse cx="100" cy="216" rx="11" ry="3" fill="#1a0604" opacity="0.55"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowZ3)">
    <ellipse cx="186" cy="216" rx="32" ry="11" fill="#f4b860" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowZ3)">
    <ellipse cx="186" cy="216" rx="80" ry="22" fill="#a85820" opacity="0.45"/>
  </g>

  <g opacity="0.85" filter="url(#bloomZ3)">
    <ellipse cx="247" cy="80" rx="80" ry="22" fill="#a8c0e0" opacity="0.42"/>
    <ellipse cx="247" cy="160" rx="80" ry="22" fill="#a85820" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="247" cy="226" rx="80" ry="2.4" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(180,12)">
    <rect x="-8" y="0" width="220" height="34" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.6"/>
    <text x="100" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#3a2410" font-weight="700">THEODORE:</text>
    <text x="100" y="28" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a0a04" font-style="italic" font-weight="900" letter-spacing="3">"No."</text>
  </g>
</svg>
