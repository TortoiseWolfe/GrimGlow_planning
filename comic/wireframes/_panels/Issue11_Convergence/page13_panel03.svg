    <path d="M 168 56 Q 196 30 224 38" stroke="#7a3818" stroke-width="2.4" fill="none" opacity="0.7"/>
    <path d="M 270 38 Q 302 32 326 56" stroke="#7a3818" stroke-width="2.4" fill="none" opacity="0.7"/>

    <ellipse cx="200" cy="106" rx="14" ry="18" fill="#0a0604"/>
    <ellipse cx="294" cy="106" rx="14" ry="18" fill="#0a0604"/>
    <circle cx="200" cy="106" r="9" fill="#080404"/>
    <circle cx="294" cy="106" r="9" fill="#080404"/>
    <circle cx="204" cy="103" r="4.4" fill="url(#eyeRefuseZ3)"/>
    <circle cx="298" cy="103" r="4.4" fill="url(#eyeRefuseZ3)"/>
    <circle cx="200" cy="106" r="2" fill="#a87838"/>
    <circle cx="294" cy="106" r="2" fill="#a87838"/>

    <path d="M 156 80 Q 200 70 240 80" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 254 80 Q 294 70 338 80" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="216" cy="130" rx="14" ry="4" fill="#a85820" opacity="0.55"/>
    <ellipse cx="278" cy="130" rx="14" ry="4" fill="#a85820" opacity="0.55"/>
    <ellipse cx="247" cy="128" rx="6" ry="2" fill="#a85820" opacity="0.55"/>

    <path d="M 220 174 Q 247 168 274 174" stroke="#0a0604" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 222 178 L 272 178" stroke="#3a2410" stroke-width="2" opacity="0.85"/>

    <path d="M 224 180 L 270 180" stroke="#0a0604" stroke-width="0.85" opacity="0.55"/>
  </g>

  <g>
