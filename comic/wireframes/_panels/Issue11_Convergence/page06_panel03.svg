    <ellipse cx="10" cy="142" rx="9" ry="3" fill="#9a5828" opacity="0.55"/>
    <path d="M 168 138 L 180 134 L 192 130" stroke="#9a5828" stroke-width="0.85" fill="none" opacity="0.55"/>
    <path d="M 22 138 L 14 134" stroke="#9a5828" stroke-width="0.85" fill="none" opacity="0.55"/>
  </g>

  <g opacity="0.85">
    <line x1="186" y1="138" x2="220" y2="120" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.7"/>
    <line x1="186" y1="148" x2="216" y2="156" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.7"/>
  </g>

  <g opacity="0.65">
