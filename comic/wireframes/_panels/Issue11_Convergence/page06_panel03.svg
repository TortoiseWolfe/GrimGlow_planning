    <line x1="120" y1="180" x2="120" y2="194" stroke="#fff8d8" stroke-width="1.4"/>
    <line x1="160" y1="180" x2="160" y2="194" stroke="#a85820" stroke-width="0.7"/>
    <line x1="200" y1="180" x2="200" y2="194" stroke="#a85820" stroke-width="0.7"/>
    <line x1="240" y1="180" x2="240" y2="194" stroke="#fff8d8" stroke-width="1.4"/>
    <line x1="280" y1="180" x2="280" y2="194" stroke="#a85820" stroke-width="0.7"/>
    <line x1="320" y1="180" x2="320" y2="194" stroke="#a85820" stroke-width="0.7"/>
    <line x1="360" y1="180" x2="360" y2="194" stroke="#fff8d8" stroke-width="1.4"/>

    <text x="120" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">T-0</text>
    <text x="240" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#fff8d8" opacity="0.85">EXEC</text>
    <text x="360" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820" opacity="0.85">T+9s</text>

    <text x="240" y="206" text-anchor="middle" font-family="Courier New, monospace" font-size="3.2" fill="#a85820" font-weight="700" opacity="0.85">— SYNC WINDOW —</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowZ3)">
    <line x1="240" y1="180" x2="240" y2="194" stroke="#fff8d8" stroke-width="3" opacity="0.55"/>
