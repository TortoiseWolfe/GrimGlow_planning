  </g>

  <g opacity="0.55" filter="url(#bloomZ3)">
    <ellipse cx="80" cy="206" rx="60" ry="22" fill="#a85820" opacity="0.32"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#a85820" font-weight="700">WREN: "Already done.</text>
    <text x="100" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">Approach routes, timing windows,</text>
    <text x="100" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">extraction points. Mapped since last night."</text>
  </g>
</svg>
