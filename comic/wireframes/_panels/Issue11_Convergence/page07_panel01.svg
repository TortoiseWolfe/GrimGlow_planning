  </g>

  <g>
    <circle cx="290" cy="60" r="6" fill="url(#copperMarkX1)" stroke="#5a2e10" stroke-width="0.7"/>
    <text x="290" y="62" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#080404" font-weight="900">W</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowX1)">
    <circle cx="290" cy="60" r="13" fill="#a85820" opacity="0.7"/>
