  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#a85820" stroke-width="1.4"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#a85820" font-weight="700">WREN: "Six targets. Five fairy-scale,</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">one human-scale. The underground junction —</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">Theodore can reach that one. We can't."</text>
