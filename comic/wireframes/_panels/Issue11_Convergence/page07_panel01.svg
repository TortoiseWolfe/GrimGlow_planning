  <g opacity="0.7">
    <text x="460" y="138" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#fff8d8" font-style="italic" font-weight="700">— THEODORE — HUMAN-SCALE —</text>
    <text x="460" y="148" text-anchor="middle" font-family="Times New Roman, serif" font-size="2.8" fill="#a87838" opacity="0.85" font-style="italic">JUNCTION (UG) — Clerkenwell</text>
  </g>

  <g opacity="0.85" stroke="#fff8d8" stroke-width="0.4" fill="none" stroke-dasharray="2 1.4">
