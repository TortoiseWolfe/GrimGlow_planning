    <line x1="0" y1="208" x2="742" y2="206" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g>
    <rect x="0" y="160" width="742" height="14" fill="url(#beamX1)" opacity="0.85"/>
    <line x1="0" y1="160" x2="742" y2="160" stroke="#080404" stroke-width="1"/>
    <line x1="0" y1="174" x2="742" y2="174" stroke="#080404" stroke-width="1"/>
  </g>

