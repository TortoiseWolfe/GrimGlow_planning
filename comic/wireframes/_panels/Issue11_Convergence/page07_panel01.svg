  <g opacity="0.7">
    <text x="600" y="46" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#3a8858" font-weight="700">JINK — ROOFTOP</text>
    <text x="600" y="78" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#3a8858" opacity="0.85">COMMR — Cornhill</text>
