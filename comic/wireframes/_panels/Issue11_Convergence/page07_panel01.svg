<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 7 Panel 1 — Operational plan with assigned operators including Theodore's amber human-scale marker</title>
  <desc>Wide holographic tactical projection — copper-gold city map with six target locations color-coded operator assignments silver copper emerald crimson sapphire-violet plus one warm amber indicating human operator. Approach routes trace clean geometric lines. Timing windows synchronized countdown markers. Extraction points glow at route endpoints. Clean professional military — structured geometric light rendering coordinated operation. One target underground junction has different scale marker — human-scale access. Rough timber beams contrast precision. The battle plan complete.</desc>
  <defs>
    <linearGradient id="bgX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperFillX1" x1="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="beamX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="amberCoreX1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <radialGradient id="silverMarkX1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </radialGradient>
    <radialGradient id="copperMarkX1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </radialGradient>
    <radialGradient id="emeraldMarkX1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#3a8858"/>
      <stop offset="1" stop-color="#1a4a2a"/>
    </radialGradient>
    <radialGradient id="crimsonMarkX1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.5" stop-color="#dc4540"/>
      <stop offset="1" stop-color="#5a1810"/>
    </radialGradient>
    <radialGradient id="violetMarkX1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a878d8"/>
      <stop offset="1" stop-color="#3a1a5a"/>
    </radialGradient>
    <filter id="bloomX1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowX1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowX1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgX1)"/>
  <rect width="742" height="240" fill="url(#copperFillX1)"/>

  <g>
