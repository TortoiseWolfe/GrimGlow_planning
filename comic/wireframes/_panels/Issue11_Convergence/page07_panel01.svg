    <path d="M 290 60 Q 360 80 460 110"/>
    <path d="M 460 80 Q 460 95 460 100"/>
    <path d="M 600 60 Q 540 90 470 110"/>
    <path d="M 290 100 Q 380 105 460 110"/>
  </g>

  <g opacity="0.85">
    <rect x="60" y="156" width="622" height="0" fill="none" stroke="#a85820"/>
    <text x="60" y="156" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.85">T-0 SYNC</text>
    <text x="370" y="156" text-anchor="middle" font-family="Courier New, monospace" font-size="3.2" fill="#fff8d8" font-weight="700">ALL TARGETS — 03:14:00 — 03:14:09</text>
    <text x="682" y="156" text-anchor="end" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.85">90s WINDOW</text>
  </g>

  <g opacity="0.55">
    <text x="80" y="36" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.7">CITY OF LONDON — TELEGRAPH GRID</text>
    <text x="660" y="36" text-anchor="end" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.7">— OPERATIONAL —</text>
  </g>

  <g opacity="0.55" filter="url(#bloomX1)">
    <ellipse cx="370" cy="80" rx="280" ry="60" fill="#a85820" opacity="0.18"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="80" cy="180" rx="6" ry="2" fill="#1a1008"/>
    <ellipse cx="200" cy="180" rx="6" ry="2" fill="#1a1008"/>
    <ellipse cx="370" cy="180" rx="6" ry="2" fill="#1a1008"/>
    <ellipse cx="540" cy="180" rx="6" ry="2" fill="#1a1008"/>
    <ellipse cx="680" cy="180" rx="6" ry="2" fill="#1a1008"/>
