    <text x="290" y="78" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a85820" opacity="0.85">EXCH-B — Lothbury</text>
  </g>

  <g>
    <circle cx="460" cy="80" r="6" fill="url(#crimsonMarkX1)" stroke="#5a1810" stroke-width="0.7"/>
    <text x="460" y="82" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#080404" font-weight="900">T</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowX1)">
    <circle cx="460" cy="80" r="13" fill="#dc4540" opacity="0.7"/>
  </g>
  <g opacity="0.7">
    <text x="460" y="66" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#dc4540" font-weight="700">THRESH — ALLEY</text>
    <text x="460" y="98" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#dc4540" opacity="0.85">RELAY — Holborn</text>
  </g>

  <g>
    <circle cx="600" cy="60" r="6" fill="url(#emeraldMarkX1)" stroke="#1a4a2a" stroke-width="0.7"/>
    <text x="600" y="62" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#080404" font-weight="900">J</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowX1)">
