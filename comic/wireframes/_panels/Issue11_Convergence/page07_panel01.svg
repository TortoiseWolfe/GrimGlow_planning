      <path d="M 60 100 L 100 96 L 140 100 L 180 110 L 220 116 L 260 108 L 300 96 L 340 90 L 380 96 L 420 104 L 460 100 L 500 90 L 540 96 L 580 110 L 620 116 L 660 100 L 682 92"/>

      <path d="M 90 30 L 100 60 L 110 90 L 130 130"/>
      <path d="M 220 30 L 240 60 L 250 100 L 270 140"/>
      <path d="M 360 30 L 380 60 L 380 100 L 400 140"/>
      <path d="M 470 30 L 480 60 L 480 100 L 460 140"/>
      <path d="M 600 30 L 610 60 L 600 100 L 580 140"/>
