<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 9 Panel 2 — Theodore's POV looking down into the camp</title>
  <desc>Medium high angle boy's perspective looking down through gap in brickwork into hidden fairy-scale camp. Below five tiny figures in degraded metallic suits arranged around copper-gold holographic tactical projection. Projection glows in dim space between rough timber beams, showing city map with six target markers. Camp visible — improvised equipment depleted power cell scattered tools cobwebs. War room in space between walls. Copper-gold projection light illuminates underside of brickwork gap. The view from above — enormous looking down on the small.</desc>
