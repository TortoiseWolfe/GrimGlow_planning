    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#3a2410" font-weight="700">THEODORE: "Six telegraph offices?"</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a85820" font-weight="700">WREN: "Six critical nodes."</text>
