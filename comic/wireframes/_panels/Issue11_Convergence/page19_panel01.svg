<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 19 Panel 1 — Theodore at the gap, the squad inside, "First light."</title>
  <desc>Medium wide shot, dual-scale composition. Enormous face at gap in brickwork — Victorian boy, sandy-brown hair, hazel eyes, nod of readiness. Below and inside wall cavity, exactly five tiny figures in heavily degraded metallic suits stand geared — silver, copper, emerald, crimson, sapphire-violet — holographic elements glowing through grime. The boy's face is the sky to them. They are the fairy tales in his wall. Grey pre-dawn light from outside warming to amber at edges. Five holographic glows inside camp.</desc>
  <defs>
    <linearGradient id="bgD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.4" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnAmberD1" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickFrameD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="hairTheoD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="skinTheoD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d8b8"/>
      <stop offset="0.4" stop-color="#d8a878"/>
      <stop offset="0.8" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="beamD1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <filter id="bloomD1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowD1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowD1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="742" height="240" fill="url(#bgD1)"/>
  <rect width="742" height="240" fill="url(#dawnAmberD1)"/>

  <g>
    <ellipse cx="371" cy="80" rx="280" ry="100" fill="url(#skinTheoD1)"/>
    <path d="M 100 40 Q 200 -10 371 -10 Q 542 -10 642 40 Q 660 80 656 110 Q 600 60 540 50 Q 460 40 371 50 Q 282 40 202 50 Q 142 60 86 110 Q 82 80 100 40 Z" fill="url(#hairTheoD1)"/>

    <ellipse cx="240" cy="100" rx="32" ry="22" fill="#0a0604"/>
    <ellipse cx="240" cy="100" rx="22" ry="14" fill="#5a3818"/>
    <ellipse cx="244" cy="98" rx="11" ry="8" fill="url(#dawnAmberD1)" opacity="0.7"/>
    <circle cx="244" cy="98" r="5" fill="#080404"/>
    <circle cx="246" cy="96" r="2" fill="#fff8d8"/>

    <ellipse cx="500" cy="100" rx="32" ry="22" fill="#0a0604"/>
    <ellipse cx="500" cy="100" rx="22" ry="14" fill="#5a3818"/>
    <ellipse cx="504" cy="98" rx="11" ry="8" fill="url(#dawnAmberD1)" opacity="0.7"/>
    <circle cx="504" cy="98" r="5" fill="#080404"/>
    <circle cx="506" cy="96" r="2" fill="#fff8d8"/>

    <path d="M 200 70 Q 240 56 280 70" stroke="#0a0604" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 460 70 Q 500 56 540 70" stroke="#0a0604" stroke-width="3.4" fill="none" stroke-linecap="round"/>

    <ellipse cx="320" cy="138" rx="22" ry="6" fill="#a85820" opacity="0.42"/>
    <ellipse cx="420" cy="138" rx="22" ry="6" fill="#a85820" opacity="0.42"/>
    <ellipse cx="370" cy="135" rx="11" ry="3" fill="#a85820" opacity="0.42"/>

    <path d="M 320 160 Q 370 158 420 160" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="0" y="180" width="742" height="60" fill="url(#brickFrameD1)" opacity="0.92"/>
    <line x1="0" y1="180" x2="742" y2="180" stroke="#080604" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#080604" stroke-width="0.55">
      <line x1="0" y1="200" x2="742" y2="200"/>
      <line x1="0" y1="220" x2="742" y2="220"/>
      <line x1="80" y1="180" x2="80" y2="200"/>
      <line x1="180" y1="200" x2="180" y2="220"/>
      <line x1="280" y1="180" x2="280" y2="200"/>
      <line x1="380" y1="200" x2="380" y2="220"/>
      <line x1="480" y1="180" x2="480" y2="200"/>
      <line x1="580" y1="200" x2="580" y2="220"/>
      <line x1="680" y1="180" x2="680" y2="200"/>
    </g>

    <rect x="120" y="184" width="500" height="50" fill="url(#bgD1)" opacity="0.95"/>
    <rect x="120" y="184" width="500" height="50" fill="url(#dawnAmberD1)" opacity="0.42"/>
    <line x1="120" y1="184" x2="120" y2="234" stroke="#080604" stroke-width="0.85"/>
    <line x1="620" y1="184" x2="620" y2="234" stroke="#080604" stroke-width="0.85"/>

    <rect x="120" y="220" width="500" height="14" fill="url(#beamD1)" opacity="0.85"/>

    <g>
      <ellipse cx="180" cy="210" rx="3" ry="6" fill="#7a8898"/>
      <ellipse cx="240" cy="210" rx="3" ry="6" fill="#d88838"/>
      <ellipse cx="320" cy="210" rx="3" ry="6" fill="#3a8858"/>
      <ellipse cx="420" cy="210" rx="3" ry="6" fill="#a83838"/>
      <ellipse cx="500" cy="210" rx="3" ry="6" fill="#7848b8"/>
      <ellipse cx="580" cy="210" rx="3" ry="6" fill="#7a8898"/>
    </g>
    <g opacity="0.85" filter="url(#strongGlowD1)">
      <circle cx="180" cy="210" r="6" fill="#a8c0e0" opacity="0.55"/>
      <circle cx="240" cy="210" r="6" fill="#d88838" opacity="0.62"/>
      <circle cx="320" cy="210" r="6" fill="#3a8858" opacity="0.62"/>
      <circle cx="420" cy="210" r="6" fill="#d83838" opacity="0.62"/>
      <circle cx="500" cy="210" r="6" fill="#a878d8" opacity="0.55"/>
      <circle cx="580" cy="210" r="6" fill="#a8c0e0" opacity="0.55"/>
    </g>
    <g opacity="0.62" filter="url(#megaGlowD1)">
      <circle cx="180" cy="210" r="14" fill="#a8c0e0" opacity="0.32"/>
      <circle cx="240" cy="210" r="14" fill="#d88838" opacity="0.32"/>
      <circle cx="320" cy="210" r="14" fill="#3a8858" opacity="0.42"/>
      <circle cx="420" cy="210" r="14" fill="#d83838" opacity="0.32"/>
      <circle cx="500" cy="210" r="14" fill="#a878d8" opacity="0.32"/>
      <circle cx="580" cy="210" r="14" fill="#a8c0e0" opacity="0.32"/>
    </g>
  </g>

  <g opacity="0.85" filter="url(#bloomD1)">
    <ellipse cx="371" cy="80" rx="200" ry="22" fill="#f4b860" opacity="0.32"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="240" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="110" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a2410" font-weight="700">THEODORE: "First light."</text>
    <text x="110" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#5a6478" font-style="italic" font-weight="700">SABLE: "First light. Are you ready?"</text>
  </g>
</svg>
