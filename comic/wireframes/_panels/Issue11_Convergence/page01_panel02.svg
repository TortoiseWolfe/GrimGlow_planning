<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 1 Panel 2 — Wren over the Titan device, "temporal nudge engine"</title>
  <desc>Medium close-up Wren standing over captured Titan device on beam under scanner array. Holographic diagnostic readout hovers at left wrist — copper-gold data scrolling. Device small at fairy scale but dense dark, surface shimmering distinctive amber-black iridescence. Scanner light plays across mapping interior structure rotating holographic cross-section above. Focused grim. Engineer who diagnosed problem and does not like answer. Two light sources conflict — fairy tech and Titan tech, each making the other look wrong.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperHoloY2" cx="0.18" cy="0.32" r="0.45">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberQueasyY2" cx="0.5" cy="0.78" r="0.42">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="copperFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="hairBlkY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceWrenY2" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="deviceTitanY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0608"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="iridDarkY2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#5a2818"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="amberCoreY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgY2)"/>
  <rect width="366" height="240" fill="url(#copperHoloY2)"/>
  <rect width="366" height="240" fill="url(#amberQueasyY2)"/>

  <g>
    <rect x="0" y="180" width="366" height="60" fill="url(#beamY2)"/>
    <line x1="0" y1="186" x2="366" y2="184" stroke="#1a1008" stroke-width="0.6" opacity="0.7"/>
    <line x1="0" y1="220" x2="366" y2="218" stroke="#1a0a04" stroke-width="0.4" opacity="0.55"/>
  </g>

  <g>
    <rect x="160" y="172" width="100" height="20" rx="3" fill="url(#deviceTitanY2)" stroke="#1a0a04" stroke-width="1"/>
    <ellipse cx="210" cy="170" rx="44" ry="6" fill="url(#deviceTitanY2)"/>

    <g opacity="0.85">
      <path d="M 170 180 L 178 180 L 178 184 L 170 184 Z" fill="#3a1a08" stroke="#080404" stroke-width="0.4"/>
      <path d="M 198 178 L 222 178 L 222 184 L 198 184 Z" fill="#3a1a08" stroke="#080404" stroke-width="0.4"/>
      <path d="M 240 180 L 250 180 L 250 184 L 240 184 Z" fill="#3a1a08" stroke="#080404" stroke-width="0.4"/>
    </g>

    <ellipse cx="210" cy="180" rx="20" ry="3" fill="url(#amberCoreY2)" opacity="0.85"/>
    <ellipse cx="210" cy="180" rx="14" ry="2" fill="#fff8d8" opacity="0.7"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowY2)">
    <ellipse cx="210" cy="180" rx="38" ry="9" fill="#a87838" opacity="0.75"/>
  </g>
  <g opacity="0.85" filter="url(#megaGlowY2)">
    <ellipse cx="210" cy="180" rx="60" ry="20" fill="#a87838" opacity="0.5"/>
  </g>
  <g opacity="0.95" filter="url(#bloomY2)">
    <ellipse cx="210" cy="178" rx="6" ry="1.6" fill="#fff8d8" opacity="0.92"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="210" cy="100" rx="60" ry="46" fill="none" stroke="#a85820" stroke-width="0.5"/>
    <ellipse cx="210" cy="100" rx="44" ry="34" fill="none" stroke="#a85820" stroke-width="0.5"/>
    <ellipse cx="210" cy="100" rx="28" ry="22" fill="none" stroke="#a85820" stroke-width="0.5"/>

    <g opacity="0.75" stroke="#a85820" stroke-width="0.4" fill="none">
      <path d="M 156 100 L 264 100"/>
      <path d="M 210 56 L 210 144"/>
      <path d="M 168 70 L 252 130"/>
      <path d="M 168 130 L 252 70"/>
      <path d="M 200 80 L 220 80 L 226 100 L 220 120 L 200 120 L 194 100 Z"/>
    </g>

    <g opacity="0.92">
      <circle cx="170" cy="100" r="3" fill="none" stroke="#a87838" stroke-width="0.6"/>
      <circle cx="250" cy="100" r="3" fill="none" stroke="#a87838" stroke-width="0.6"/>
      <circle cx="210" cy="64" r="3" fill="none" stroke="#a87838" stroke-width="0.6"/>
      <circle cx="210" cy="136" r="3" fill="none" stroke="#a87838" stroke-width="0.6"/>

      <circle cx="210" cy="100" r="6" fill="none" stroke="#a87838" stroke-width="0.85"/>
      <circle cx="210" cy="100" r="3" fill="#a87838"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowY2)">
    <circle cx="210" cy="100" r="9" fill="#a87838" opacity="0.5"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowY2)">
    <ellipse cx="210" cy="100" rx="80" ry="50" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.55">
    <text x="160" y="58" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#a85820" opacity="0.85">TEMPORAL NUDGE</text>
    <text x="270" y="58" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#a85820" opacity="0.85">FREQ 2.4kHz</text>
    <text x="160" y="148" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.75">FIELD EMITTER</text>
    <text x="270" y="148" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.75">RESONANCE LOCK</text>
  </g>

  <g>
    <ellipse cx="68" cy="76" rx="20" ry="24" fill="#3a261a"/>
    <ellipse cx="68" cy="62" rx="14" ry="16" fill="url(#faceWrenY2)"/>

    <path d="M 50 40 Q 68 26 86 40 Q 90 56 86 68 L 80 76 Q 74 50 68 44 Q 62 50 56 76 Z" fill="url(#hairBlkY2)"/>
    <ellipse cx="84" cy="34" rx="6" ry="4" fill="url(#hairBlkY2)"/>

    <ellipse cx="62" cy="64" rx="2.4" ry="3" fill="#0a0604"/>
    <ellipse cx="74" cy="64" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="62" cy="64" r="1.4" fill="#080404"/>
    <circle cx="74" cy="64" r="1.4" fill="#080404"/>
    <circle cx="63" cy="63" r="0.7" fill="#a85820"/>
    <circle cx="75" cy="63" r="0.7" fill="#a85820"/>

    <path d="M 54 56 Q 64 52 72 56" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 70 56 Q 80 52 86 56" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 60 78 Q 68 80 76 78" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 50 96 Q 68 88 86 96 L 100 180 L 36 180 L 44 130 Z" fill="url(#copperFigY2)"/>
    <path d="M 56 108 L 80 108 L 88 174 L 48 174 Z" fill="#5a2e10" opacity="0.7"/>
    <path d="M 60 122 L 76 128 L 72 144 L 56 138 Z" fill="#1a0a04" opacity="0.85"/>

    <path d="M 100 120 L 130 116 L 154 124 L 174 134" stroke="url(#copperFigY2)" stroke-width="9" fill="none" stroke-linecap="round"/>

    <path d="M 36 130 L 24 132 L 18 144" stroke="url(#copperFigY2)" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.85">
    <rect x="40" y="148" width="22" height="12" rx="2" fill="none" stroke="#a85820" stroke-width="0.6"/>
    <line x1="42" y1="152" x2="60" y2="152" stroke="#a85820" stroke-width="0.4" opacity="0.7"/>
    <line x1="42" y1="156" x2="60" y2="156" stroke="#a85820" stroke-width="0.4" opacity="0.65"/>
    <text x="51" y="155" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.85">DIAG</text>
  </g>
  <g opacity="0.85" filter="url(#bloomY2)">
    <rect x="40" y="148" width="22" height="12" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.65" filter="url(#bloomY2)">
    <circle cx="118" cy="118" r="3" fill="#a85820"/>
    <circle cx="158" cy="124" r="2" fill="#a85820"/>
  </g>

  <g opacity="0.85">
    <path d="M 60 148 L 50 144" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.55"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="68" cy="184" rx="32" ry="2.4" fill="#040202"/>
    <ellipse cx="210" cy="186" rx="60" ry="2.4" fill="#040202"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#a85820" font-weight="700">WREN: "This is a temporal nudge engine.</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">It doesn't change events. It alters the</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">information flowing through networks."</text>
  </g>
</svg>
