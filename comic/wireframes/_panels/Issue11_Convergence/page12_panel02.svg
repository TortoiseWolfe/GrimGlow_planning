<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 11 Page 12 Panel 2 — Theodore in profile, gazing at the gaslit city</title>
  <desc>Medium eye level Theodore in profile gazing out at gaslit city below. Victorian boy 12-13 lanky pre-teen NOT young child, sandy-brown hair falling across forehead, freckles, hazel eye visible in profile. Warm amber gaslight from city below catches underside of jaw and line of nose. Hands rest in lap, brass gear ring catching light, faint shape of hybrid comm device in trouser pocket. Moonlight from above touches hair with cold blue-white. Quiet absorbing magnitude of tomorrow. A boy on the edge of something he cannot name. Thoughtful stillness.</desc>
