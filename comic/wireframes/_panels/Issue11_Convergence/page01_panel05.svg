    <path d="M 122 76 Q 138 72 150 76" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <rect x="100" y="78" width="20" height="14" rx="2" fill="none" stroke="#a878d0" stroke-width="0.7"/>
    <line x1="120" y1="86" x2="126" y2="86" stroke="#a878d0" stroke-width="0.6"/>
    <rect x="126" y="78" width="20" height="14" rx="2" fill="none" stroke="#a878d0" stroke-width="0.7"/>

    <line x1="104" y1="80" x2="116" y2="92" stroke="#7848b8" stroke-width="0.5"/>
    <line x1="106" y1="84" x2="118" y2="84" stroke="#7848b8" stroke-width="0.6" opacity="0.7"/>

    <path d="M 116 116 Q 124 116 130 116" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 96 132 Q 123 124 150 132 L 158 200 L 88 200 L 92 168 Z" fill="url(#violetFigZ5)"/>
    <path d="M 102 144 L 144 144 L 152 196 L 94 196 Z" fill="#1a0e2e" opacity="0.85"/>

    <path d="M 96 144 L 80 168 L 74 200" stroke="url(#violetFigZ5)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 150 144 L 166 168 L 172 200" stroke="url(#violetFigZ5)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowZ5)">
    <rect x="100" y="78" width="20" height="14" fill="#a878d8" opacity="0.45"/>
    <rect x="126" y="78" width="20" height="14" fill="#a878d8" opacity="0.45"/>
  </g>
  <g opacity="0.85" filter="url(#bloomZ5)">
    <rect x="126" y="78" width="20" height="14" fill="#a878d8" opacity="0.32"/>
  </g>

  <g>
    <rect x="116" y="160" width="40" height="22" rx="3" fill="url(#scannerBoxZ5)" stroke="#1a0a2a" stroke-width="0.7"/>
    <line x1="116" y1="166" x2="156" y2="166" stroke="#a878d0" stroke-width="0.5"/>
    <ellipse cx="136" cy="172" rx="9" ry="3" fill="url(#lensCorEZ5)" opacity="0.85"/>

    <g opacity="0.85" stroke="#a878d0" stroke-width="0.4" fill="none">
      <path d="M 122 174 L 128 178 L 134 174 L 140 178 L 146 174 L 152 178"/>
    </g>

    <path d="M 156 168 L 168 162" stroke="url(#violetFigZ5)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="172" cy="160" rx="6" ry="4" fill="#7a4830"/>
    <path d="M 168 156 Q 174 152 180 156 Q 184 164 178 168" stroke="#7a4830" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowZ5)">
    <ellipse cx="136" cy="172" rx="14" ry="4" fill="#a878d8" opacity="0.55"/>
  </g>

  <g opacity="0.85">
    <line x1="123" y1="38" x2="123" y2="20" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.55"/>
    <ellipse cx="123" cy="14" rx="11" ry="3" fill="none" stroke="#a85820" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g opacity="0.55" filter="url(#megaGlowZ5)">
    <ellipse cx="123" cy="20" rx="60" ry="20" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="186" rx="40" ry="2.4" fill="#040202"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#7848b8" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#7848b8" font-weight="700">LUMA (quiet, to herself):</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic" font-weight="700">"The nervous system..."</text>
  </g>
</svg>
