<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 220" width="246" height="220">
  <title>Issue 11 Page 1 Panel 5 — Luma's recognition, "The nervous system..."</title>
  <desc>Close-up slight high angle Luma seated lower timber, scanner in lap, looking up at Wren's presentation with recognition dawning. Cracked holographic lens catches copper-gold light. Expression shifts as implications connect to her own research — prior operatives, convergence point, "STAY". Hand tightens on scanner. Sees where this leads. Dawning comprehension. Scientist connecting data points. Not fear — understanding. The understanding is worse. Copper-gold reflected from projections above. Faint blue-violet from cracked holographic lens.</desc>
  <defs>
    <linearGradient id="bgZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperUpZ5" cx="0.5" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a2e10" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetLensZ5" cx="0.42" cy="0.42" r="0.18">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="violetFigZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#3a1a5a"/>
      <stop offset="1" stop-color="#1a0a2a"/>
    </linearGradient>
    <linearGradient id="hairBlkZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceLumaZ5" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#a878d8"/>
    </linearGradient>
    <linearGradient id="scannerBoxZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a5a"/>
      <stop offset="0.5" stop-color="#1a0a2a"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="lensCorEZ5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a878d8"/>
      <stop offset="1" stop-color="#3a1a5a"/>
    </radialGradient>
    <filter id="bloomZ5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowZ5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowZ5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="246" height="220" fill="url(#bgZ5)"/>
  <rect width="246" height="220" fill="url(#copperUpZ5)"/>
  <rect width="246" height="220" fill="url(#violetLensZ5)"/>

  <g>
    <rect x="0" y="180" width="246" height="40" fill="url(#beamZ5)"/>
    <line x1="0" y1="186" x2="246" y2="184" stroke="#1a1008" stroke-width="0.6" opacity="0.7"/>
    <rect x="0" y="160" width="246" height="14" fill="url(#beamZ5)" opacity="0.85"/>
    <line x1="0" y1="174" x2="246" y2="174" stroke="#080404" stroke-width="1"/>
  </g>

  <g>
    <ellipse cx="123" cy="100" rx="32" ry="40" fill="#3a261a"/>
    <ellipse cx="123" cy="80" rx="22" ry="26" fill="url(#faceLumaZ5)"/>

    <path d="M 96 50 Q 123 36 150 50 Q 158 70 152 86 L 146 96 Q 140 60 130 54 Q 120 60 100 96 Z" fill="url(#hairBlkZ5)"/>
    <path d="M 150 48 Q 160 70 158 100 Q 156 130 152 160" stroke="url(#hairBlkZ5)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <ellipse cx="110" cy="86" rx="3.4" ry="4" fill="#0a0604"/>
    <ellipse cx="136" cy="86" rx="3.4" ry="4" fill="#0a0604"/>
