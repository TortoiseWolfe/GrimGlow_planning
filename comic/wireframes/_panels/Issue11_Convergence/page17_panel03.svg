<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 11 Page 17 Panel 3 — Thresh arming, sliding rifle into magnetic mount</title>
  <desc>Medium shot. Thresh at weapon rack on wooden beam, lifting compact rifle, checking charge, sliding it into magnetic mount on her back with fluid practiced movement. Broad-shouldered, muscular, pale skin, copper-red buzz cut. Crimson armored suit dented at left pauldron, scratched across chest plate, gouged along right vambrace — but holographic crimson edge-lighting pulses as weapon locks home. Same ritual from Issue 1. Grim determination layered over quiet fear.</desc>
  <defs>
    <linearGradient id="bgB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.4" stop-color="#1a1024"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="gaslightB3" cx="0.85" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitThreshB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.4" stop-color="#7a2530"/>
      <stop offset="0.8" stop-color="#3a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="hairBuzzB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="skinThreshB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8c0"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3a28"/>
    </linearGradient>
    <linearGradient id="weaponB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.5" stop-color="#1a0810"/>
      <stop offset="1" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="crimsonEdgeB3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bloomB3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowB3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowB3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgB3)"/>
  <rect width="366" height="260" fill="url(#gaslightB3)"/>

  <g>
    <rect x="0" y="200" width="366" height="60" fill="url(#beamB3)"/>
    <line x1="0" y1="206" x2="366" y2="206" stroke="#1a0a04" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#1a0a04" stroke-width="0.4">
      <line x1="60" y1="206" x2="60" y2="260"/>
      <line x1="180" y1="206" x2="180" y2="260"/>
      <line x1="300" y1="206" x2="300" y2="260"/>
    </g>
  </g>

  <g>
    <rect x="240" y="170" width="100" height="6" rx="2" fill="#5a3a22"/>
    <rect x="246" y="160" width="22" height="14" rx="1" fill="url(#weaponB3)"/>
    <rect x="276" y="160" width="22" height="14" rx="1" fill="url(#weaponB3)"/>
    <rect x="306" y="160" width="22" height="14" rx="1" fill="url(#weaponB3)"/>
  </g>

  <g>
    <ellipse cx="160" cy="240" rx="60" ry="11" fill="#040202" opacity="0.62"/>

    <ellipse cx="160" cy="160" rx="40" ry="50" fill="url(#suitThreshB3)"/>
    <path d="M 122 130 L 198 130 L 200 200 L 120 200 Z" fill="url(#suitThreshB3)"/>

    <path d="M 120 134 L 134 130 L 132 144 L 120 148 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 144 158 L 156 156 L 152 162 L 142 164 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 196 166 L 200 166 L 200 174 L 196 174 Z" fill="#1a0810" opacity="0.7"/>

    <path d="M 122 132 L 130 142" stroke="url(#crimsonEdgeB3)" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M 200 130 L 200 200" stroke="url(#crimsonEdgeB3)" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M 156 156 L 165 168" stroke="url(#crimsonEdgeB3)" stroke-width="1.4" fill="none" opacity="0.7"/>

    <ellipse cx="160" cy="100" rx="22" ry="26" fill="url(#skinThreshB3)"/>
    <path d="M 138 88 Q 160 66 184 88 Q 188 96 186 100 L 134 100 Q 134 96 138 88 Z" fill="url(#hairBuzzB3)"/>
    <g opacity="0.55" stroke="#3a1808" stroke-width="0.4">
      <line x1="142" y1="78" x2="142" y2="92"/>
      <line x1="152" y1="74" x2="152" y2="92"/>
      <line x1="162" y1="72" x2="162" y2="92"/>
      <line x1="172" y1="74" x2="172" y2="92"/>
      <line x1="182" y1="78" x2="182" y2="92"/>
    </g>

    <ellipse cx="151" cy="102" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="151" cy="102" r="1.4" fill="#5a3018"/>
    <circle cx="151.6" cy="101.4" r="0.62" fill="#fff8d8"/>
    <ellipse cx="169" cy="102" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="169" cy="102" r="1.4" fill="#5a3018"/>
    <circle cx="169.6" cy="101.4" r="0.62" fill="#fff8d8"/>

    <path d="M 145 98 Q 151 96 157 98" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 163 98 Q 169 96 175 98" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 154 116 Q 160 118 166 116" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <path d="M 196 138 L 240 130 L 244 140 L 198 148 Z" fill="url(#weaponB3)"/>
    <line x1="200" y1="140" x2="240" y2="134" stroke="url(#crimsonEdgeB3)" stroke-width="1.4" opacity="0.85"/>
    <line x1="200" y1="146" x2="240" y2="140" stroke="url(#crimsonEdgeB3)" stroke-width="1.2" opacity="0.7"/>
    <circle cx="220" cy="138" r="2.4" fill="#d83838"/>

    <path d="M 200 200 Q 220 208 240 218" stroke="url(#suitThreshB3)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <ellipse cx="120" cy="222" rx="9" ry="6" fill="#5a3018"/>
    <ellipse cx="244" cy="220" rx="9" ry="6" fill="#5a3018"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowB3)">
    <ellipse cx="220" cy="140" rx="32" ry="11" fill="#d83838" opacity="0.62"/>
    <line x1="200" y1="140" x2="240" y2="134" stroke="#d83838" stroke-width="3" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowB3)">
    <ellipse cx="220" cy="140" rx="60" ry="22" fill="#8a2520" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomB3)">
    <ellipse cx="160" cy="160" rx="50" ry="22" fill="#a83838" opacity="0.32"/>
    <path d="M 122 130 L 198 130" stroke="#d83838" stroke-width="2" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="160" cy="240" rx="60" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
