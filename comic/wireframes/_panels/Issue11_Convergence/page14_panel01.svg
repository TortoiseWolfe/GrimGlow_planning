<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 14 Panel 1 — KEY: "You cannot choose who stays. I learned that from watching you."</title>
  <desc>Medium wide eye level — defining image. Victorian boy turned fully to face tiny figure on ledge, lowering himself face closer to rooftop surface. Tiny figure approximately four inches tall lean androgynous bright golden blonde curly hair soot-streaked emerald metallic suit torn and patched copper wire — stands on lead flashing looking up one hand on boy's finger. Neither yielded. City stretches behind — vast field amber gaslight dark telegraph lines, war map of tomorrow. Boy's expression stubborn kindness. Tiny figure's forced composure cracking — eyes bright jaw set, care overwhelming attempt at command. Cold blue-white moonlight from above and warm amber gaslight from below share frame equally. Faint emerald glow from wing-pack seams. The emotional centerpiece — equally stubborn equally scared equally loved.</desc>
