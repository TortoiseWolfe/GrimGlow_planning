    <text x="152" y="12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#3a2410" font-weight="700">THEODORE: "You cannot choose</text>
    <text x="152" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.4" fill="#1a0a04" font-style="italic" font-weight="700">who stays. I learned that</text>
    <text x="152" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.4" fill="#1a0a04" font-style="italic" font-weight="700">from watching you."</text>
