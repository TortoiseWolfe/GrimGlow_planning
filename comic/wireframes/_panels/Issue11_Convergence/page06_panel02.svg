<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 6 Panel 2 — The squad receives the order, "This is a military operation. Not a heist."</title>
  <desc>Medium wide eye level four tiny figures receiving the order. One in copper nods once already moving — pragmatic acceptance. One in emerald straightens from crouch energy redirecting to purpose. One in crimson armor tightens hand on weapon — readiness not fear. One in sapphire-violet closes eyes briefly something resolving within. Four heavily degraded suits catching growing grey-white daylight alongside copper-gold projection light. Each face carries own version of acceptance. The right decision acknowledged by people who know what it will cost. Acceptance without illusion.</desc>
