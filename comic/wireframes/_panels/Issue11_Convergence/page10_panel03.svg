      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="dayGapZ3" cx="0.78" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a6478" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="commGlowZ3" cx="0.5" cy="0.55" r="0.38">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#3a4868" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorZ3" x1="0" y1="0" x2="0" y2="1">
