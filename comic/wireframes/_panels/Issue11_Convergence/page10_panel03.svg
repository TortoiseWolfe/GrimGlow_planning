    <ellipse cx="126" cy="108" rx="2.4" ry="3" fill="#0a0604"/>

    <path d="M 106 100 Q 116 96 124 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 122 100 Q 132 96 138 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 112 124 Q 120 124 128 124" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 96 140 Q 120 132 144 140 L 156 200 L 84 200 L 90 168 Z" fill="url(#copperFigZ3)"/>
    <path d="M 104 152 L 136 152 L 144 196 L 96 196 Z" fill="#5a2e10" opacity="0.7"/>

    <path d="M 144 140 L 162 116 L 170 96" stroke="url(#copperFigZ3)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="172" cy="92" rx="5" ry="4" fill="#9a5828"/>

    <path d="M 96 140 L 76 132 L 60 124" stroke="url(#copperFigZ3)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <g>
