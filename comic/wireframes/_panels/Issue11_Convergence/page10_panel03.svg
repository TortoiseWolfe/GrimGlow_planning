  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.8" fill="#a85820" font-weight="700">WREN: "Modified for your scale.</text>
    <text x="100" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic">Green go, red stop, counter shows window."</text>
    <text x="100" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a2410" font-weight="700">THEODORE: "I've rehearsed it."</text>
  </g>
</svg>
