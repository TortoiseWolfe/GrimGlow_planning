<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 10 Panel 3 — Wren passes Theodore the hybrid comm device, two scales of ingenuity meeting</title>
  <desc>Medium shot at wall gap. On beam, tiny figure in degraded copper suit lifts modified communications device — larger than standard fairy issue, encased in brass housing — toward enormous hand reaching down from above. Hand is oil-stained with brass gear ring on index finger. Scale of handoff: four-inch woman passing technology to a boy, device is a book to her and a thimble to him. Device is hybrid — fairy technology in human-crafted shell, blue-white glow inside brass casing. Daylight from wall gap. Two scales of ingenuity meeting.</desc>
  <defs>
