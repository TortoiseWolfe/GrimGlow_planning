      <rect x="176" y="96" width="6" height="6" fill="#5a3018" stroke="#1a0a04" stroke-width="0.4"/>
      <rect x="186" y="96" width="6" height="6" fill="#5a3018" stroke="#1a0a04" stroke-width="0.4"/>
    </g>
    <line x1="164" y1="84" x2="196" y2="84" stroke="#88a8d0" stroke-width="0.4"/>
