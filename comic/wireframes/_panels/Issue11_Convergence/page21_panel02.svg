      <stop offset="0.4" stop-color="#040206"/>
      <stop offset="0.7" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#3a1810"/>
    </linearGradient>
    <linearGradient id="brickFrameF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="0.5" stop-color="#0a0604"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="cityFarF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="cityNearF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="streetGlowF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#a85820" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomF2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowF2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowF2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

