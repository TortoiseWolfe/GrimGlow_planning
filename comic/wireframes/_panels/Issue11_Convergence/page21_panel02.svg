<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 11 Page 21 Panel 2 — The city at night, sleeping, vulnerable</title>
  <desc>Medium wide shot, tall format, through crack in brickwork. Victorian city at night — amber gaslight ribbons along cobblestone streets, dark shapes of buildings, chimneys, church spires silhouetted against starlit sky. Telegraph lines thread between buildings — dark threads barely visible against dark sky, nervous system of industrial age, sleeping, vulnerable. The city is unaware. It sleeps while its future hangs in the balance.</desc>
