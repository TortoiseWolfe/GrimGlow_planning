<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 11 Panel 3 — Squad disperses to preparation, war room becomes staging area</title>
  <desc>Medium squad disperses from briefing formation — copper figure returning to repair station, crimson moving to perimeter, sapphire-violet gathering scanner equipment. Each tiny figure heading to their area of camp falling into pre-mission preparation routine. Wall cavity camp shifts from war room to staging area. Grey daylight and dim holographic perimeter glow. Soldiers preparing.</desc>
