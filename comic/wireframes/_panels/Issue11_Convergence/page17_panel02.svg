<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 11 Page 17 Panel 2 — Wren at her repair station, "Adequate will have to do."</title>
  <desc>Medium shot. Wren at her repair station on a wooden beam. Holographic diagnostics in copper-gold light run across small communication units. Beside her, improvised repair materials — copper wire, brass scraps, leather strips, a bent pin. East Asian features, messy dark hair, degraded copper suit catching copper-gold diagnostic light and blue-white comm activation flashes. Pure technical concentration.</desc>
  <defs>
    <linearGradient id="bgB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.4" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="copperGoldB2" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="suitWrenB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.4" stop-color="#a85820"/>
      <stop offset="0.8" stop-color="#5a2810"/>
      <stop offset="1" stop-color="#1a0804"/>
    </linearGradient>
    <linearGradient id="hairWrenB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a0a08"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="skinWrenB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b888"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="commUnitB2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#080a14"/>
    </linearGradient>
    <filter id="bloomB2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowB2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowB2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgB2)"/>
  <rect width="366" height="260" fill="url(#copperGoldB2)"/>

  <g>
    <rect x="0" y="200" width="366" height="60" fill="url(#beamB2)"/>
    <line x1="0" y1="206" x2="366" y2="206" stroke="#1a0a04" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#1a0a04" stroke-width="0.4">
      <line x1="60" y1="206" x2="60" y2="260"/>
      <line x1="180" y1="206" x2="180" y2="260"/>
      <line x1="300" y1="206" x2="300" y2="260"/>
    </g>
  </g>

  <g>
    <ellipse cx="183" cy="240" rx="50" ry="11" fill="#040202" opacity="0.62"/>

    <ellipse cx="183" cy="160" rx="32" ry="44" fill="url(#suitWrenB2)"/>
    <path d="M 160 130 L 206 130 L 210 196 L 156 196 Z" fill="url(#suitWrenB2)"/>

    <path d="M 165 142 L 172 144 L 168 148 Z M 196 152 L 204 154 L 200 158 Z M 178 168 L 186 170 L 182 174 Z" fill="#1a0804" opacity="0.85"/>
    <path d="M 162 170 Q 183 174 204 170" stroke="#1a0804" stroke-width="0.85" fill="none" opacity="0.62"/>

    <ellipse cx="183" cy="100" rx="18" ry="22" fill="url(#skinWrenB2)"/>
    <path d="M 165 84 Q 183 64 204 80 Q 210 92 208 100 L 198 96 Q 192 92 184 92 Q 178 88 168 96 Z" fill="url(#hairWrenB2)"/>
    <path d="M 196 80 Q 204 76 210 84 L 212 90 L 200 90 Z" fill="url(#hairWrenB2)"/>

    <circle cx="176" cy="100" r="1.4" fill="#0a0604"/>
    <circle cx="190" cy="100" r="1.4" fill="#0a0604"/>
    <path d="M 173 96 Q 178 94 182 96" stroke="#0a0604" stroke-width="0.7" fill="none"/>
    <path d="M 187 96 Q 192 94 196 96" stroke="#0a0604" stroke-width="0.7" fill="none"/>
    <path d="M 178 110 Q 183 112 188 110" stroke="#1a0a08" stroke-width="0.85" fill="none"/>

    <path d="M 156 196 Q 140 210 124 218" stroke="url(#suitWrenB2)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 210 196 Q 226 210 242 218" stroke="url(#suitWrenB2)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <ellipse cx="116" cy="222" rx="9" ry="6" fill="#5a3818"/>
    <ellipse cx="234" cy="222" rx="9" ry="6" fill="#5a3818"/>
  </g>

  <g>
    <rect x="80" y="218" width="22" height="14" rx="2" fill="url(#commUnitB2)"/>
    <rect x="80" y="218" width="22" height="3" fill="#5a78a8" opacity="0.62"/>
    <circle cx="91" cy="225" r="2" fill="#a8c0e0"/>

    <rect x="240" y="220" width="20" height="11" rx="2" fill="url(#commUnitB2)"/>
    <rect x="240" y="220" width="20" height="3" fill="#5a78a8" opacity="0.62"/>
    <circle cx="250" cy="225" r="1.6" fill="#a8c0e0"/>

    <rect x="160" y="220" width="22" height="9" rx="2" fill="url(#commUnitB2)"/>
    <circle cx="171" cy="225" r="1.4" fill="#a8c0e0"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowB2)">
    <circle cx="91" cy="225" r="5" fill="#a8c0e0" opacity="0.62"/>
    <circle cx="250" cy="225" r="5" fill="#a8c0e0" opacity="0.62"/>
    <circle cx="171" cy="225" r="4" fill="#a8c0e0" opacity="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#bloomB2)">
    <line x1="40" y1="220" x2="320" y2="220" stroke="#d88838" stroke-width="0.7" opacity="0.42"/>
    <line x1="40" y1="226" x2="320" y2="226" stroke="#d88838" stroke-width="0.55" opacity="0.32"/>
  </g>

  <g>
    <line x1="40" y1="216" x2="60" y2="220" stroke="#d88838" stroke-width="1" opacity="0.7"/>
    <circle cx="40" cy="216" r="1.4" fill="#d88838" opacity="0.7"/>
    <rect x="48" y="232" width="14" height="3" fill="#d88838" opacity="0.62"/>
    <rect x="304" y="226" width="11" height="3" fill="#5a3818" opacity="0.7"/>
    <line x1="318" y1="220" x2="324" y2="232" stroke="#5a3818" stroke-width="0.85" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#megaGlowB2)">
    <rect x="40" y="210" width="280" height="22" fill="#d88838" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomB2)">
    <ellipse cx="183" cy="160" rx="50" ry="22" fill="#d88838" opacity="0.32"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="36" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#a85820" font-weight="700">WREN:</text>
    <text x="100" y="21" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic">"Comms check. All units synchronized."</text>
    <text x="100" y="31" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic" font-weight="700">"Adequate will have to do."</text>
  </g>
</svg>
