    <circle cx="380" cy="50" r="3.4" fill="url(#emeraldMarkX4)" stroke="#1a4a2a" stroke-width="0.4"/>
    <text x="380" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#080404" font-weight="900">J</text>

    <circle cx="220" cy="180" r="3.4" fill="url(#crimsonMarkX4)" stroke="#5a1810" stroke-width="0.4"/>
    <text x="220" y="182" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#080404" font-weight="900">T</text>
    <circle cx="280" cy="180" r="3.4" fill="url(#violetMarkX4)" stroke="#3a1a5a" stroke-width="0.4"/>
    <text x="280" y="182" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#080404" font-weight="900">L</text>
    <rect x="376" y="176" width="8" height="8" fill="url(#campMarkX4)" stroke="#5a2818" stroke-width="0.4"/>
    <text x="380" y="183" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#080404" font-weight="900" font-style="italic">H</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowX4)">
    <circle cx="220" cy="50" r="9" fill="#9098a0" opacity="0.62"/>
    <circle cx="280" cy="50" r="9" fill="#a85820" opacity="0.62"/>
    <circle cx="380" cy="50" r="9" fill="#3a8858" opacity="0.62"/>
    <circle cx="220" cy="180" r="9" fill="#dc4540" opacity="0.62"/>
    <circle cx="280" cy="180" r="9" fill="#a878d8" opacity="0.62"/>
    <rect x="372" y="172" width="16" height="16" fill="#a87838" opacity="0.62"/>
  </g>

  <g opacity="0.92" stroke-dasharray="3 1.5" fill="none">
    <path d="M 220 50 Q 240 70 260 88 Q 290 100 316 110" stroke="#9098a0" stroke-width="1.4"/>
    <path d="M 280 50 Q 290 70 300 88 Q 314 100 320 106" stroke="#a85820" stroke-width="1.4"/>
    <path d="M 380 50 Q 360 70 350 88 Q 340 100 332 110" stroke="#3a8858" stroke-width="1.4"/>
    <path d="M 220 180 Q 240 160 260 142 Q 290 130 316 120" stroke="#dc4540" stroke-width="1.4"/>
    <path d="M 280 180 Q 290 160 300 142 Q 314 128 322 120" stroke="#a878d8" stroke-width="1.4"/>
    <path d="M 376 180 Q 360 160 350 142 Q 340 128 334 120" stroke="#a87838" stroke-width="1.4"/>
  </g>
  <g opacity="0.55" filter="url(#bloomX4)">
    <path d="M 220 50 Q 240 70 260 88 Q 290 100 316 110" stroke="#9098a0" stroke-width="3" fill="none" opacity="0.55"/>
    <path d="M 280 50 Q 290 70 300 88 Q 314 100 320 106" stroke="#a85820" stroke-width="3" fill="none" opacity="0.55"/>
    <path d="M 380 50 Q 360 70 350 88 Q 340 100 332 110" stroke="#3a8858" stroke-width="3" fill="none" opacity="0.55"/>
    <path d="M 220 180 Q 240 160 260 142 Q 290 130 316 120" stroke="#dc4540" stroke-width="3" fill="none" opacity="0.55"/>
    <path d="M 280 180 Q 290 160 300 142 Q 314 128 322 120" stroke="#a878d8" stroke-width="3" fill="none" opacity="0.55"/>
  </g>

  <g opacity="0.85">
    <text x="200" y="46" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#9098a0" opacity="0.85">SABLE</text>
    <text x="260" y="46" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a85820" opacity="0.85">WREN</text>
    <text x="400" y="46" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#3a8858" opacity="0.85">JINK</text>
    <text x="200" y="194" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#dc4540" opacity="0.85">THRESH</text>
    <text x="260" y="194" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a878d8" opacity="0.85">LUMA</text>
    <text x="400" y="194" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a87838" opacity="0.85" font-style="italic">THEODORE</text>
  </g>

  <g>
    <rect x="430" y="160" width="40" height="20" rx="2" fill="#1a1008" stroke="#3a1a08" stroke-width="0.55"/>
    <text x="450" y="172" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#a89888" font-style="italic" opacity="0.85">CHURCH</text>
  </g>
  <g opacity="0.55" filter="url(#bloomX4)">
    <rect x="426" y="156" width="48" height="28" fill="#7848b8" opacity="0.32"/>
  </g>

