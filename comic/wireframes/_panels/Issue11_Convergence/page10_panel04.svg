      <line x1="180" y1="60" x2="474" y2="60"/>
      <line x1="180" y1="100" x2="474" y2="100"/>
      <line x1="180" y1="140" x2="474" y2="140"/>
      <line x1="180" y1="180" x2="474" y2="180"/>
      <line x1="240" y1="20" x2="240" y2="200"/>
      <line x1="320" y1="20" x2="320" y2="200"/>
      <line x1="400" y1="20" x2="400" y2="200"/>
    </g>

    <text x="327" y="24" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#fff8d8" font-weight="700">— EXTRACTION ROUTES —</text>
  </g>

  <g>
    <rect x="316" y="106" width="14" height="14" fill="url(#campMarkX4)" stroke="#5a2818" stroke-width="0.85"/>
    <text x="323" y="117" text-anchor="middle" font-family="Times New Roman, serif" font-size="9" fill="#080404" font-weight="900" font-style="italic">C</text>
  </g>
