    <ellipse cx="80" cy="120" rx="22" ry="26" fill="#3a261a"/>
    <ellipse cx="80" cy="106" rx="14" ry="16" fill="url(#faceSableX4)"/>

    <path d="M 62 84 Q 80 70 98 84 Q 102 100 98 112 L 92 120 Q 86 94 80 88 Q 74 94 68 120 Z" fill="url(#hairSilX4)"/>

    <ellipse cx="74" cy="108" rx="2.4" ry="3" fill="#0a0604"/>
    <ellipse cx="86" cy="108" rx="2.4" ry="3" fill="#0a0604"/>

    <path d="M 66 100 Q 76 96 84 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 82 100 Q 92 96 98 100" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 56 140 Q 80 132 104 140 L 116 220 L 44 220 L 50 184 Z" fill="url(#silverFigX4)"/>
    <path d="M 64 156 L 96 156 L 104 216 L 56 216 Z" fill="#1a1c20" opacity="0.85"/>

    <path d="M 100 140 L 116 144 L 120 152 L 116 156" fill="url(#tinPatchX4)" opacity="0.85"/>

    <path d="M 104 140 L 130 124 L 156 110 L 180 100" stroke="url(#silverFigX4)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="180" cy="100" rx="6" ry="4" fill="#7a4830"/>
  </g>

  <g opacity="0.85">
    <line x1="184" y1="98" x2="216" y2="80" stroke="#a85820" stroke-width="0.55" stroke-dasharray="2 1.4" opacity="0.7"/>
  </g>
  <g opacity="0.55" filter="url(#bloomX4)">
