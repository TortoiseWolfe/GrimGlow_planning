<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 13 Panel 4 — Jink stands facing Theodore's lowered face, "I am not asking. I am telling you —"</title>
  <desc>Medium tiny figure in soot-streaked emerald metallic suit stands on lead flashing four inches tall facing enormous boy whose face has lowered to look at them. Scale is the scene: Jink's entire body is size of Theodore's hand. And yet argument between them is between equals — neither backing down, disparity between physical sizes highlighting parity of wills. Steps toward Theodore's enormous hand on ledge, frustration and fear colliding. Moonlight and gaslight share both figures equally. Emotional equality across impossible scale.</desc>
  <defs>
    <linearGradient id="bgX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonAboveX4" cx="0.5" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a78a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightBelowX4" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leadFlashX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.5" stop-color="#3a4868"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <linearGradient id="hairSandyX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="faceTheoX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.85" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <linearGradient id="emeraldFigX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hairBlondeX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a8c0e0"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkX4" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeFrustX4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handTheoX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <filter id="bloomX4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowX4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowX4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgX4)"/>
  <rect width="366" height="240" fill="url(#moonAboveX4)"/>
  <rect width="366" height="240" fill="url(#gaslightBelowX4)"/>

  <g>
    <rect x="0" y="180" width="366" height="60" fill="url(#leadFlashX4)" opacity="0.92"/>
    <line x1="0" y1="186" x2="366" y2="186" stroke="#1a1828" stroke-width="0.7"/>
    <g opacity="0.55" stroke="#1a1828" stroke-width="0.4">
      <line x1="80" y1="186" x2="80" y2="240"/>
      <line x1="180" y1="186" x2="180" y2="240"/>
      <line x1="280" y1="186" x2="280" y2="240"/>
    </g>
  </g>

  <g>
    <path d="M 200 24 Q 240 50 290 56 Q 330 60 366 60 L 366 240 L 280 240 L 240 200 Q 220 150 224 100 Q 220 60 200 24 Z" fill="url(#hairSandyX4)" opacity="0.92"/>

    <ellipse cx="290" cy="100" rx="64" ry="84" fill="#3a261a"/>
    <ellipse cx="290" cy="80" rx="48" ry="58" fill="url(#faceTheoX4)"/>

    <path d="M 244 32 Q 290 14 336 32 Q 348 60 342 84 L 332 92 Q 312 50 290 42 Q 270 50 250 92 Z" fill="url(#hairSandyX4)"/>

    <ellipse cx="262" cy="84" rx="9" ry="11" fill="#0a0604"/>
    <circle cx="262" cy="84" r="5" fill="#080404"/>
    <circle cx="265" cy="82" r="2.4" fill="url(#eyeFrustX4)"/>
    <circle cx="262" cy="84" r="1" fill="#a87838"/>

    <ellipse cx="316" cy="84" rx="9" ry="11" fill="#0a0604"/>
    <circle cx="316" cy="84" r="5" fill="#080404"/>

    <path d="M 232 64 Q 262 56 290 64" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 290 64 Q 316 56 348 64" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <ellipse cx="276" cy="106" rx="6" ry="2" fill="#a85820" opacity="0.55"/>
    <ellipse cx="304" cy="106" rx="6" ry="2" fill="#a85820" opacity="0.55"/>

    <path d="M 274 142 Q 290 138 308 142" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path d="M 220 180 L 0 200 L 0 240 L 220 240 Z" fill="url(#handTheoX4)"/>
  </g>
  <g opacity="0.85" filter="url(#bloomX4)">
    <ellipse cx="290" cy="60" rx="60" ry="14" fill="#a8c0e0" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="100" cy="172" rx="9" ry="3" fill="#080404" opacity="0.55"/>

    <ellipse cx="100" cy="156" rx="11" ry="13" fill="#3a261a"/>
    <ellipse cx="100" cy="146" rx="9" ry="10" fill="url(#faceJinkX4)"/>

    <path d="M 88 132 Q 100 122 112 132 Q 116 142 112 152 L 108 150 Q 104 138 100 142 Q 96 138 92 152 Z" fill="url(#hairBlondeX4)"/>
    <ellipse cx="92" cy="130" rx="3" ry="1.6" fill="#a87838" opacity="0.85"/>
    <ellipse cx="108" cy="128" rx="3" ry="1.6" fill="#a87838" opacity="0.85"/>

    <ellipse cx="94" cy="148" rx="1.4" ry="1.6" fill="#0a0604"/>
    <ellipse cx="106" cy="148" rx="1.4" ry="1.6" fill="#0a0604"/>
    <circle cx="95" cy="147" r="0.7" fill="url(#eyeFrustX4)"/>
    <circle cx="107" cy="147" r="0.7" fill="url(#eyeFrustX4)"/>

    <path d="M 86 142 Q 100 138 114 142" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 92 158 Q 100 156 108 158" stroke="#0a0604" stroke-width="1.2" fill="none"/>

    <path d="M 86 168 Q 100 164 114 168 L 118 192 L 82 192 Z" fill="url(#emeraldFigX4)"/>
    <path d="M 88 174 L 112 174 L 116 190 L 84 190 Z" fill="#0a1408" opacity="0.85"/>

    <path d="M 86 168 L 76 174 L 70 184" stroke="url(#emeraldFigX4)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 114 168 L 124 178 L 134 188" stroke="url(#emeraldFigX4)" stroke-width="3.4" fill="none" stroke-linecap="round"/>

    <ellipse cx="138" cy="190" rx="3" ry="1.6" fill="url(#faceJinkX4)"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowX4)">
    <ellipse cx="100" cy="180" rx="22" ry="9" fill="#3a8858" opacity="0.62"/>
    <path d="M 86 168 Q 100 164 114 168" stroke="#3a8858" stroke-width="2" fill="none" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowX4)">
    <ellipse cx="100" cy="180" rx="40" ry="14" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <line x1="120" y1="156" x2="220" y2="180" stroke="#a87838" stroke-width="0.7" stroke-dasharray="2 1.4" opacity="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#bloomX4)">
    <ellipse cx="100" cy="120" rx="32" ry="9" fill="#a8c0e0" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="100" cy="194" rx="22" ry="2.4" fill="#040202"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a8858" font-weight="700">JINK: "Theodore, I am not asking.</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic" font-weight="700">I am telling you —"</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a2410" font-weight="700">THEODORE: "And I am telling you. No."</text>
  </g>
</svg>
