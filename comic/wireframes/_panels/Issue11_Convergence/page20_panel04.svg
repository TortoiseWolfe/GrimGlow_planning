<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 20 Panel 4 — Jink launches, the first fairy light in the sky</title>
  <desc>Wide shot. Tiny figure launches from gap in brickwork wall, holographic dragonfly wings fully deployed in structured emerald-green light — two pairs of translucent wings with geometric lattice scaffolding, prismatic trails streaming behind. Figure banks east into pre-dawn sky above vast Victorian city — rooftops, chimneys, telegraph lines below. Behind, four remaining figures silhouetted in wall gap. Emerald trail bright and prismatic — looks exactly like a fairy with wings of light. Dawn sky in grey-blue and amber.</desc>
  <defs>
    <linearGradient id="bgF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.4" stop-color="#a87858"/>
      <stop offset="0.7" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="dawnRiseF4" cx="0.85" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cityFarF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4858"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="cityNearF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="brickF4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="trailF4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a8858" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#fff088" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="jinkBodyF4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff088"/>
      <stop offset="0.5" stop-color="#3a8858"/>
      <stop offset="1" stop-color="#1a4830"/>
    </radialGradient>
    <filter id="bloomF4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowF4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowF4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7.4"/>
    </filter>
    <filter id="ultraGlowF4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="742" height="280" fill="url(#bgF4)"/>
  <rect width="742" height="280" fill="url(#dawnRiseF4)"/>

  <g opacity="0.55">
    <circle cx="60" cy="22" r="0.85" fill="#fff8d8"/>
    <circle cx="180" cy="14" r="0.7" fill="#fff8d8"/>
    <circle cx="280" cy="20" r="0.55" fill="#fff8d8"/>
  </g>

  <g>
    <path d="M 0 160 L 80 150 L 160 160 L 240 140 L 320 160 L 400 130 L 480 160 L 560 140 L 640 160 L 742 150 L 742 220 L 0 220 Z" fill="url(#cityFarF4)" opacity="0.85"/>
    <line x1="0" y1="160" x2="742" y2="160" stroke="#080604" stroke-width="0.55" opacity="0.55"/>

    <path d="M 0 200 L 100 190 L 200 200 L 300 180 L 400 200 L 500 175 L 600 200 L 700 185 L 742 195 L 742 240 L 0 240 Z" fill="url(#cityNearF4)" opacity="0.92"/>

    <g opacity="0.62">
      <rect x="100" y="170" width="14" height="30" fill="#0a0a14"/>
      <rect x="240" y="150" width="11" height="50" fill="#0a0a14"/>
      <rect x="400" y="140" width="22" height="60" fill="#0a0a14"/>
      <rect x="560" y="150" width="14" height="50" fill="#0a0a14"/>
    </g>

    <g opacity="0.42">
      <rect x="120" y="180" width="3" height="6" fill="#f4b860"/>
      <rect x="250" y="170" width="3" height="6" fill="#f4b860"/>
      <rect x="410" y="170" width="3" height="6" fill="#f4b860"/>
      <rect x="570" y="170" width="3" height="6" fill="#f4b860"/>
    </g>

    <g opacity="0.62" stroke="#080604" stroke-width="0.55">
      <line x1="0" y1="180" x2="120" y2="160"/>
      <line x1="120" y1="160" x2="280" y2="140"/>
      <line x1="280" y1="140" x2="450" y2="120"/>
      <line x1="450" y1="120" x2="600" y2="140"/>
      <line x1="600" y1="140" x2="742" y2="120"/>
      <line x1="0" y1="200" x2="200" y2="180"/>
      <line x1="200" y1="180" x2="400" y2="190"/>
      <line x1="400" y1="190" x2="600" y2="180"/>
      <line x1="600" y1="180" x2="742" y2="200"/>
    </g>
  </g>
  <g opacity="0.85" filter="url(#bloomF4)">
    <ellipse cx="600" cy="120" rx="280" ry="44" fill="#f4b860" opacity="0.42"/>
  </g>

  <g>
    <rect x="0" y="160" width="180" height="120" fill="url(#brickF4)" opacity="0.85"/>
    <rect x="40" y="180" width="100" height="80" fill="url(#bgF4)" opacity="0.85"/>
    <rect x="40" y="180" width="3" height="80" fill="#1a0a04"/>
    <rect x="137" y="180" width="3" height="80" fill="#1a0a04"/>
    <rect x="40" y="180" width="100" height="3" fill="#1a0a04"/>
  </g>

  <g>
    <ellipse cx="60" cy="220" rx="6" ry="14" fill="#3a4858"/>
    <circle cx="60" cy="200" r="3.4" fill="#3a4858"/>

    <ellipse cx="80" cy="220" rx="6" ry="14" fill="#3a2410"/>
    <circle cx="80" cy="200" r="3.4" fill="#3a2410"/>

    <ellipse cx="100" cy="220" rx="6" ry="14" fill="#3a1820"/>
    <circle cx="100" cy="200" r="3.4" fill="#3a1820"/>

    <ellipse cx="120" cy="220" rx="6" ry="14" fill="#3a2868"/>
    <circle cx="120" cy="200" r="3.4" fill="#3a2868"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowF4)">
    <circle cx="60" cy="210" r="9" fill="#a8c0e0" opacity="0.42"/>
    <circle cx="80" cy="210" r="9" fill="#d88838" opacity="0.42"/>
    <circle cx="100" cy="210" r="9" fill="#d83838" opacity="0.42"/>
    <circle cx="120" cy="210" r="9" fill="#a878d8" opacity="0.42"/>
  </g>

  <g>
    <path d="M 140 200 Q 280 160 420 110 Q 540 80 620 60" stroke="url(#trailF4)" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 140 200 Q 280 160 420 110 Q 540 80 620 60" stroke="url(#trailF4)" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.95"/>
    <path d="M 140 200 Q 280 160 420 110 Q 540 80 620 60" stroke="#fff088" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowF4)">
    <path d="M 140 200 Q 280 160 420 110 Q 540 80 620 60" stroke="#3a8858" stroke-width="40" fill="none" stroke-linecap="round" opacity="0.42"/>
  </g>
  <g opacity="0.42" filter="url(#ultraGlowF4)">
    <path d="M 140 200 Q 280 160 420 110 Q 540 80 620 60" stroke="#3a8858" stroke-width="60" fill="none" stroke-linecap="round" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="620" cy="60" rx="14" ry="6" fill="url(#jinkBodyF4)"/>
    <path d="M 614 56 Q 600 48 590 52 Q 600 60 614 60 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 626 56 Q 640 48 650 52 Q 640 60 626 60 Z" fill="#3a8858" opacity="0.85"/>
    <path d="M 614 60 Q 604 64 596 68 Q 606 70 614 64 Z" fill="#3a8858" opacity="0.7"/>
    <path d="M 626 60 Q 636 64 644 68 Q 634 70 626 64 Z" fill="#3a8858" opacity="0.7"/>
    <g opacity="0.7" stroke="#fff088" stroke-width="0.4" fill="none">
      <line x1="614" y1="56" x2="600" y2="52"/>
      <line x1="626" y1="56" x2="640" y2="52"/>
      <line x1="614" y1="60" x2="600" y2="68"/>
      <line x1="626" y1="60" x2="640" y2="68"/>
    </g>
  </g>
  <g opacity="0.95" filter="url(#strongGlowF4)">
    <circle cx="620" cy="60" r="14" fill="#fff088" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#megaGlowF4)">
    <circle cx="620" cy="60" r="32" fill="#3a8858" opacity="0.55"/>
  </g>
  <g opacity="0.62" filter="url(#ultraGlowF4)">
    <circle cx="620" cy="60" r="60" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="370" cy="248" rx="280" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(180,12)">
    <rect x="-6" y="0" width="380" height="36" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="184" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#3a8858" font-weight="700">JINK (over comms): "Scout One, airborne. Moving to target."</text>
    <text x="184" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#5a6478" font-weight="700">SABLE: "Acknowledged. Fly safe, Jink."</text>
    <text x="184" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#3a8858" font-style="italic" font-weight="700">JINK (quiet): "Always, Captain."</text>
  </g>
</svg>
