    <path d="M 110 116 Q 123 112 136 116" stroke="#0a0604" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <path d="M 80 124 Q 123 116 166 124 L 184 200 L 62 200 L 70 168 Z" fill="url(#crimsonArmorZ3)"/>
    <path d="M 90 138 L 156 138 L 170 196 L 76 196 Z" fill="#1a0606" opacity="0.85"/>
    <path d="M 100 152 L 146 156 L 142 174 L 104 170 Z" fill="#5a1810" opacity="0.85"/>
    <path d="M 124 142 L 138 196" stroke="#0a0606" stroke-width="2.4" opacity="0.85"/>
    <path d="M 108 162 L 138 168" stroke="#1a0606" stroke-width="0.6" opacity="0.55"/>

    <path d="M 70 138 L 56 168 L 50 200" stroke="url(#crimsonDentZ3)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 176 138 L 192 168 L 196 200" stroke="url(#crimsonArmorZ3)" stroke-width="13" fill="none" stroke-linecap="round"/>

    <path d="M 60 192 L 84 196" stroke="url(#crimsonDentZ3)" stroke-width="6" stroke-linecap="round"/>

    <ellipse cx="178" cy="160" rx="3.4" ry="6" fill="url(#crimsonDentZ3)"/>
    <line x1="178" y1="156" x2="180" y2="170" stroke="#1a0606" stroke-width="0.7"/>
  </g>

  <g opacity="0.85">
    <path d="M 70 138 L 60 132 L 64 124 L 80 122" stroke="none" fill="none"/>
    <polygon points="68,128 78,124 84,134 76,140 70,144" fill="url(#crimsonDentZ3)" opacity="0.65"/>
    <line x1="70" y1="130" x2="80" y2="130" stroke="#1a0606" stroke-width="0.6"/>

    <line x1="166" y1="138" x2="184" y2="160" stroke="#dc4540" stroke-width="0.7" opacity="0.85"/>
    <ellipse cx="178" cy="158" rx="2.4" ry="0.85" fill="#dc4540" opacity="0.85"/>
  </g>

  <g opacity="0.85">
    <path d="M 80 124 L 76 132 L 76 140 L 78 148" stroke="#dc4540" stroke-width="0.6" fill="none" opacity="0.85"/>
    <path d="M 166 124 L 170 132 L 170 140 L 168 148" stroke="#dc4540" stroke-width="0.6" fill="none" opacity="0.85"/>
    <path d="M 88 142 L 84 156 L 88 168" stroke="#dc4540" stroke-width="0.5" fill="none" opacity="0.7"/>
    <path d="M 158 142 L 162 156 L 158 168" stroke="#dc4540" stroke-width="0.5" fill="none" opacity="0.7"/>
    <path d="M 100 174 L 146 174" stroke="#dc4540" stroke-width="0.4" opacity="0.55"/>
    <path d="M 96 184 L 150 184" stroke="#dc4540" stroke-width="0.4" opacity="0.55"/>
  </g>
  <g opacity="0.95" filter="url(#stutterZ3)">
    <path d="M 80 124 L 76 132 L 76 140" stroke="#dc4540" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M 166 124 L 170 132 L 170 140" stroke="#dc4540" stroke-width="2" fill="none" opacity="0.4"/>
    <ellipse cx="123" cy="178" rx="44" ry="3" fill="#dc4540" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="206" rx="58" ry="2.6" fill="#040202"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.9" stroke="#8a2520" stroke-width="0.7"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#8a2520" font-weight="700" opacity="0.7">THRESH STILL</text>
    <text x="100" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.7">— fear with a target —</text>
  </g>
</svg>
