<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 11 Page 2 Panel 3 — Thresh, fear and purpose coexisting</title>
  <desc>Close-up Thresh standing arms crossed jaw set. Broad-shouldered powerfully muscular athletic not slim, clearly female but imposing, pale skin defined cheekbones firm jaw copper-red buzz cut. Ruby-crimson metallic suit armored plating dented at left pauldron, scratched across chest plate, fresh gouge along right vambrace. Arms crossed, right hand gripping left forearm — self-anchoring gesture. Grim focus — fear visible in jaw tension and shoulder set, but purpose arriving alongside. Copper-gold holographic light from projection to left catches dented metallic surfaces. Crimson holographic edge-lighting stutters unevenly along seams. Fear and purpose coexisting.</desc>
  <defs>
    <linearGradient id="bgZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperLeftZ3" cx="0.18" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonStutterZ3" cx="0.5" cy="0.58" r="0.42">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="crimsonArmorZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="crimsonDentZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2018"/>
      <stop offset="0.5" stop-color="#3a1006"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="hairBuzzZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="faceThreshZ3" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#a87838"/>
      <stop offset="1" stop-color="#dc4540"/>
    </linearGradient>
    <radialGradient id="eyeFearZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#dc4540" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomZ3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="stutterZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgZ3)"/>
  <rect width="246" height="240" fill="url(#copperLeftZ3)"/>
  <rect width="246" height="240" fill="url(#crimsonStutterZ3)"/>

  <g>
    <rect x="0" y="200" width="246" height="40" fill="url(#floorZ3)"/>
    <line x1="0" y1="208" x2="246" y2="206" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g>
