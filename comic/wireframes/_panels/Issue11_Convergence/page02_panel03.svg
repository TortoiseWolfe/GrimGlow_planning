    <ellipse cx="123" cy="80" rx="26" ry="28" fill="url(#faceThreshZ3)"/>

    <path d="M 96 56 Q 123 44 150 56 Q 156 76 150 86 L 144 96 Q 134 60 124 56 Q 114 60 102 96 Z" fill="url(#hairBuzzZ3)"/>
