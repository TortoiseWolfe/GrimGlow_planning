<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 11 Page 10 Panel 2 — Sable holds the comm device, "We adapt. We do not abort."</title>
  <desc>Medium close-up Sable holding small salvaged communications device — compact unit glowing faintly blue-white, rigged from damaged fairy technology. Dark brown skin sharp features silver-white hair in daylight. Turns device in hand, testing feel, delivering communications protocol with precise authority. Soot-darkened silver suit catches daylight. Comm device's blue-white glow only fairy-tech light in frame dominated by natural morning light. The commander establishing the rules of engagement.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="dayDomY2" cx="0.62" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a6478" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="commGlowY2" cx="0.32" cy="0.62" r="0.32">
      <stop offset="0" stop-color="#88a8d0" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a4868" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="silverFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6068"/>
      <stop offset="0.5" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="hairSilY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="faceSableY2" x1="0" y1="0" x2="0.85" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#a8b0bc"/>
    </linearGradient>
    <linearGradient id="tinPatchY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b0bc"/>
      <stop offset="0.5" stop-color="#5a6478"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <linearGradient id="commHousingY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.5" stop-color="#3a4868"/>
      <stop offset="1" stop-color="#1a2438"/>
    </linearGradient>
    <radialGradient id="commScreenY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a8c0e0"/>
      <stop offset="1" stop-color="#3a4868"/>
    </radialGradient>
    <radialGradient id="eyeAuthY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#88a8d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#88a8d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgY2)"/>
  <rect width="366" height="240" fill="url(#dayDomY2)"/>
  <rect width="366" height="240" fill="url(#commGlowY2)"/>

  <g>
    <rect x="0" y="200" width="366" height="40" fill="url(#floorY2)"/>
    <line x1="0" y1="208" x2="366" y2="206" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

