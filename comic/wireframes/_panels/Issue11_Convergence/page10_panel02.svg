    <circle cx="214" cy="84" r="2.4" fill="#080404"/>
    <circle cx="188" cy="83" r="1.4" fill="url(#eyeAuthY2)"/>
    <circle cx="216" cy="83" r="1.4" fill="url(#eyeAuthY2)"/>

    <path d="M 170 70 Q 188 66 200 70" stroke="#0a0604" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M 198 70 Q 216 66 232 70" stroke="#0a0604" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <path d="M 192 110 Q 200 110 208 110" stroke="#0a0604" stroke-width="1.4" fill="none"/>

    <path d="M 162 128 Q 200 118 238 128 L 260 200 L 140 200 L 148 168 Z" fill="url(#silverFigY2)"/>
    <path d="M 172 144 L 228 144 L 240 196 L 162 196 Z" fill="#1a1c20" opacity="0.85"/>

    <path d="M 236 128 L 260 116 L 264 134 L 240 144 Z" fill="url(#tinPatchY2)" opacity="0.92"/>
    <path d="M 236 128 L 260 116" stroke="#3a4868" stroke-width="0.7"/>
    <circle cx="242" cy="126" r="0.7" fill="#1a1828"/>
    <circle cx="256" cy="120" r="0.7" fill="#1a1828"/>
    <circle cx="260" cy="132" r="0.7" fill="#1a1828"/>
    <circle cx="246" cy="138" r="0.7" fill="#1a1828"/>

    <path d="M 162 128 L 140 144 L 132 168" stroke="url(#silverFigY2)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 132 168 L 110 178 L 96 184" stroke="url(#silverFigY2)" stroke-width="11" fill="none" stroke-linecap="round"/>

    <path d="M 238 128 L 256 144 L 264 168" stroke="url(#silverFigY2)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M 264 168 L 256 178 L 246 184" stroke="url(#silverFigY2)" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="80" y="170" width="40" height="32" rx="3" fill="url(#commHousingY2)" stroke="#1a2438" stroke-width="0.85"/>
    <rect x="84" y="174" width="32" height="14" rx="2" fill="#0a0a14"/>
    <ellipse cx="100" cy="181" rx="11" ry="4" fill="url(#commScreenY2)"/>

    <g opacity="0.85">
      <rect x="86" y="192" width="6" height="6" fill="#3a4868" stroke="#1a2438" stroke-width="0.4"/>
      <rect x="96" y="192" width="6" height="6" fill="#3a4868" stroke="#1a2438" stroke-width="0.4"/>
      <rect x="106" y="192" width="6" height="6" fill="#3a4868" stroke="#1a2438" stroke-width="0.4"/>
    </g>

    <g opacity="0.85">
      <line x1="84" y1="180" x2="116" y2="180" stroke="#88a8d0" stroke-width="0.4"/>
      <line x1="84" y1="184" x2="116" y2="184" stroke="#88a8d0" stroke-width="0.4"/>
    </g>
    <text x="100" y="184" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#1a2438" font-weight="900">90</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowY2)">
    <ellipse cx="100" cy="181" rx="22" ry="9" fill="#a8c0e0" opacity="0.65"/>
  </g>
  <g opacity="0.85" filter="url(#bloomY2)">
    <rect x="80" y="170" width="40" height="32" fill="#88a8d0" opacity="0.32"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowY2)">
    <rect x="60" y="158" width="80" height="60" fill="#88a8d0" opacity="0.32"/>
  </g>

  <g opacity="0.85">
    <line x1="120" y1="174" x2="132" y2="168" stroke="#a8c0e0" stroke-width="0.55" stroke-dasharray="2 1.4"/>
  </g>

  <g opacity="0.85" filter="url(#bloomY2)">
    <rect x="140" y="128" width="100" height="72" fill="#88a8d0" opacity="0.18"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="200" cy="206" rx="80" ry="3" fill="#040202"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="42" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#5a6478" stroke-width="1.4"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#5a6478" font-weight="700">SABLE: "Comms check at position.</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">My signal starts the countdown.</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#5a6478" font-weight="700">If anyone is compromised, call it.</text>
    <text x="152" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic" font-weight="700">We adapt. We do not abort."</text>
  </g>
</svg>
