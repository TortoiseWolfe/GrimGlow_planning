<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 11 Page 17 Panel 1 — Pre-dawn camp gearing up, "Before dawn."</title>
  <desc>Wide establishing shot of wall cavity camp in pre-dawn activity. Five tiny figures in degraded metallic suits in motion — gearing up, checking equipment. Weapons on rough timber beams. Holographic diagnostics in copper-gold and blue-white. Wall gap shows sky lightening to grey-blue, streets below still gaslit. Triple-source illumination: pre-dawn grey-blue from outside, warm amber gaslight from below, cool holographic light from equipment. The hour before the mission.</desc>
  <defs>
    <linearGradient id="bgB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.3" stop-color="#1a2030"/>
      <stop offset="0.7" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnB1" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#7a8898" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a4868" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightStreetB1" cx="0.5" cy="1" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallStoneB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="beamWoodB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="wallGapB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.5" stop-color="#a8c0e0"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <filter id="bloomB1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowB1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="megaGlowB1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.4"/>
    </filter>
  </defs>

  <rect width="742" height="220" fill="url(#bgB1)"/>
  <rect width="742" height="220" fill="url(#dawnB1)"/>
  <rect width="742" height="220" fill="url(#gaslightStreetB1)"/>

  <g>
    <rect x="0" y="0" width="742" height="220" fill="url(#wallStoneB1)" opacity="0.35"/>
    <g opacity="0.55" stroke="#1a0a04" stroke-width="0.55">
      <line x1="0" y1="40" x2="742" y2="40"/>
      <line x1="0" y1="80" x2="742" y2="80"/>
      <line x1="0" y1="120" x2="742" y2="120"/>
    </g>
  </g>

  <g>
    <rect x="280" y="20" width="180" height="100" fill="url(#wallGapB1)" opacity="0.85"/>
    <rect x="280" y="20" width="3" height="100" fill="#1a0a04"/>
    <rect x="457" y="20" width="3" height="100" fill="#1a0a04"/>
    <g opacity="0.62">
      <rect x="290" y="100" width="160" height="20" fill="#5a3a22" opacity="0.7"/>
