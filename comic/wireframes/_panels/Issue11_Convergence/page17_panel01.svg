    <line x1="0" y1="166" x2="742" y2="166" stroke="#1a0a04" stroke-width="0.85"/>
    <g opacity="0.55" stroke="#1a0a04" stroke-width="0.4">
      <line x1="80" y1="166" x2="80" y2="220"/>
      <line x1="200" y1="166" x2="200" y2="220"/>
      <line x1="380" y1="166" x2="380" y2="220"/>
      <line x1="560" y1="166" x2="560" y2="220"/>
    </g>
    <ellipse cx="120" cy="180" rx="22" ry="3" fill="#0a0604" opacity="0.62"/>
    <ellipse cx="500" cy="184" rx="14" ry="2" fill="#0a0604" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="120" cy="160" rx="9" ry="14" fill="#7a8898"/>
    <circle cx="120" cy="148" r="5" fill="#5a3818"/>
    <line x1="115" y1="160" x2="105" y2="172" stroke="#3a4868" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="100" y="160" width="20" height="3" rx="1" fill="#1a1810"/>
  </g>
  <g opacity="0.85" filter="url(#bloomB1)">
    <ellipse cx="120" cy="160" rx="11" ry="5" fill="#a8c0e0" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="220" cy="158" rx="9" ry="14" fill="#a85820"/>
    <circle cx="220" cy="146" r="5" fill="#3a2410"/>
    <rect x="208" y="156" width="22" height="14" rx="2" fill="#1a1810" opacity="0.85"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowB1)">
    <ellipse cx="220" cy="160" rx="14" ry="6" fill="#d88838" opacity="0.55"/>
    <line x1="208" y1="158" x2="232" y2="160" stroke="#fff8d8" stroke-width="0.85" opacity="0.62"/>
    <line x1="208" y1="162" x2="232" y2="164" stroke="#fff8d8" stroke-width="0.7" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="370" cy="158" rx="9" ry="14" fill="#3a8858"/>
    <circle cx="370" cy="146" r="5" fill="#3a2410"/>
    <rect x="362" y="158" width="16" height="9" rx="2" fill="#1a1810"/>
  </g>
  <g opacity="0.85" filter="url(#bloomB1)">
    <ellipse cx="370" cy="160" rx="11" ry="5" fill="#3a8858" opacity="0.62"/>
  </g>

  <g>
    <ellipse cx="500" cy="158" rx="11" ry="14" fill="#8a2520"/>
    <circle cx="500" cy="146" r="5" fill="#5a3018"/>
    <rect x="490" y="158" width="22" height="3" fill="#1a0810"/>
    <rect x="490" y="164" width="22" height="3" fill="#1a0810"/>
  </g>
  <g opacity="0.85" filter="url(#bloomB1)">
    <ellipse cx="500" cy="158" rx="13" ry="6" fill="#d83838" opacity="0.42"/>
  </g>

  <g>
    <ellipse cx="620" cy="158" rx="9" ry="14" fill="#7848b8"/>
    <circle cx="620" cy="146" r="5" fill="#a87838"/>
    <ellipse cx="615" cy="146" rx="3" ry="2" fill="#a8c0e0" opacity="0.7"/>
    <ellipse cx="624" cy="146" rx="3" ry="2" fill="#a8c0e0" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#bloomB1)">
    <ellipse cx="620" cy="158" rx="11" ry="5" fill="#a878d8" opacity="0.55"/>
  </g>

  <g opacity="0.85" filter="url(#bloomB1)">
    <ellipse cx="370" cy="120" rx="240" ry="11" fill="#7a8898" opacity="0.32"/>
    <ellipse cx="370" cy="180" rx="280" ry="14" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="370" cy="200" rx="280" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="120" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="54" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#5a4a30" font-weight="700">CAPTION</text>
    <text x="54" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#3a2410" font-style="italic" font-weight="700">"Before dawn."</text>
