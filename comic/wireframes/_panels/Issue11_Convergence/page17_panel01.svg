      <line x1="420" y1="92" x2="420" y2="120" stroke="#1a0a04" stroke-width="0.55"/>
    </g>
    <g opacity="0.55">
      <circle cx="310" cy="106" r="2" fill="#fff8d8"/>
      <circle cx="370" cy="108" r="2.4" fill="#fff8d8"/>
      <circle cx="430" cy="106" r="2" fill="#fff8d8"/>
