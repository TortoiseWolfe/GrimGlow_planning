<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 3 Panel 2 — Wren traces the timeline, "predates our arrival"</title>
  <desc>Medium eye level Wren pulling up timeline hologram beside network map — horizontal copper-gold line markers along its length. Traces with one oil-stained finger stopping at marker that precedes bright point labeled with geometric fairy script. East Asian features messy dark hair bun, degraded copper suit. Matter-of-fact — data delivered without emotional padding. Timeline floats in copper-gold light, markers showing installation dates extending back before squad's arrival. Copper-gold holographic light dominates. Temporal context.</desc>
