    <text x="46" y="100" text-anchor="middle" font-family="Courier New, monospace" font-size="3.6" fill="#a85820" font-weight="700">EARLIEST</text>
    <text x="46" y="106" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a85820" opacity="0.85">— 3+ MONTHS —</text>

    <text x="86" y="106" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a85820" opacity="0.7">10wk</text>
    <text x="126" y="106" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a85820" opacity="0.7">8wk</text>
    <text x="166" y="106" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#a85820" opacity="0.7">6wk</text>

