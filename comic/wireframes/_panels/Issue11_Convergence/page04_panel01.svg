    <path d="M 184 144 Q 190 144 196 144" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 178 154 Q 190 144 202 154 L 210 178 L 178 178 L 174 178 Z" fill="url(#emeraldFigX1)"/>
    <path d="M 184 156 L 196 156 L 198 174 L 182 174 Z" fill="#0a1408" opacity="0.85"/>

    <path d="M 178 158 L 168 162 L 158 158" stroke="url(#emeraldFigX1)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 202 158 L 212 162 L 222 158" stroke="url(#emeraldFigX1)" stroke-width="6" fill="none" stroke-linecap="round"/>

