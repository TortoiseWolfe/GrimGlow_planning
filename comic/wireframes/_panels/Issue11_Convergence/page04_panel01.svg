    <path d="M 200 102 Q 206 100 212 108" stroke="#fff8d8" stroke-width="0.85" fill="none" opacity="0.7"/>
    <ellipse cx="180" cy="106" rx="2.4" ry="1.2" fill="#a87838" opacity="0.85"/>
    <ellipse cx="200" cy="106" rx="2.4" ry="1.2" fill="#a87838" opacity="0.85"/>

