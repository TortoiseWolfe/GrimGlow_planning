<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 4 Panel 1 — Jink lands, "That's not a mission, Wren. That's a wish."</title>
  <desc>Medium eye level Jink drops from higher timber to main beam landing in crouch, emerald suit catching projection light. Lean androgynous wild bright golden blonde curly hair light brown skin — usual grin absent replaced by focused intent. Looks between holographic projection and Sable. Emerald suit soot-streaked patched, holographic seams glowing faintly through grime. Landing graceful despite seriousness. Copper-gold projection light, faint emerald suit glow. Urgency channeled.</desc>
