    <circle cx="194" cy="136" r="1" fill="#080404"/>
    <circle cx="187" cy="135" r="0.5" fill="url(#eyeFocusX1)"/>
    <circle cx="195" cy="135" r="0.5" fill="url(#eyeFocusX1)"/>

