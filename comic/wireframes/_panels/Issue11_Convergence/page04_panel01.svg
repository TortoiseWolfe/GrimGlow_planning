    <ellipse cx="190" cy="200" rx="22" ry="2" fill="#040202"/>
    <ellipse cx="350" cy="206" rx="14" ry="2" fill="#040202"/>
    <ellipse cx="430" cy="206" rx="14" ry="2" fill="#040202"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="42" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a8858" font-weight="700">JINK: "Fourteen simultaneous targets.</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">Five of us. That's not a mission, Wren.</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic" font-weight="700">That's a wish."</text>
    <text x="152" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#a85820" font-weight="700">WREN: "The critical nodes — that's fewer."</text>
  </g>
</svg>
