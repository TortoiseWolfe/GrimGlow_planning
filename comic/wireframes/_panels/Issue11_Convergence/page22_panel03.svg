<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 11 Page 22 Panel 3 — The pamphlet's title page, "THE STORIES THEY TELL"</title>
  <desc>Close-up overhead angle. Thin printed pamphlet on heavy wooden desk in warm amber lamplight. Title page in Victorian style — elegant serif typeface on cream-colored paper. THE STORIES THEY TELL. Subtitle: Being an Account of Recent Extraordinary Occurrences in the Streets and Buildings of London. Below: Collected and Annotated by James Machen, M.A., Fellow of the Folk-Lore Society. Freshly printed, ink dark, paper clean. Ink pen and spectacle case rest beside it. Warm amber lamplight makes cream paper glow gold. The volume's title inside the volume — mythology made permanent.</desc>
  <defs>
    <linearGradient id="bgG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#5a3018"/>
      <stop offset="1" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="lampGlowG3" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#f4b860" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskGrainG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4818"/>
      <stop offset="0.5" stop-color="#9a6028"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="paperPamphletG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4e8c8"/>
      <stop offset="0.7" stop-color="#d8c8a8"/>
      <stop offset="1" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="penG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#3a2010"/>
      <stop offset="0.85" stop-color="#a87838"/>
      <stop offset="1" stop-color="#fff8d8"/>
    </linearGradient>
    <linearGradient id="caseG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <filter id="bloomG3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowG3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowG3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="494" height="280" fill="url(#bgG3)"/>
  <rect width="494" height="280" fill="url(#deskGrainG3)" opacity="0.62"/>
  <rect width="494" height="280" fill="url(#lampGlowG3)"/>

  <g opacity="0.55" stroke="#5a3018" stroke-width="0.55">
    <path d="M 0 60 Q 100 56 200 62 Q 300 66 494 60"/>
    <path d="M 0 100 Q 100 96 200 102 Q 300 104 494 100"/>
    <path d="M 0 200 Q 100 196 200 202 Q 300 204 494 200"/>
    <path d="M 0 240 Q 100 236 200 242 Q 300 244 494 240"/>
  </g>

  <g>
    <rect x="120" y="40" width="260" height="220" fill="url(#paperPamphletG3)" stroke="#5a3018" stroke-width="0.85"/>
    <rect x="125" y="45" width="250" height="210" fill="none" stroke="#5a3018" stroke-width="0.55"/>

    <text x="250" y="100" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="22" fill="#1a0a04" font-weight="700" letter-spacing="1.5">THE</text>
    <text x="250" y="130" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="22" fill="#1a0a04" font-weight="700" letter-spacing="1.5">STORIES</text>
    <text x="250" y="160" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="22" fill="#1a0a04" font-weight="700" letter-spacing="1.5">THEY TELL</text>

    <line x1="160" y1="172" x2="340" y2="172" stroke="#3a2010" stroke-width="0.85"/>

    <text x="250" y="190" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="6" fill="#3a2010" font-style="italic">Being an Account of</text>
    <text x="250" y="200" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="6" fill="#3a2010" font-style="italic">Recent Extraordinary Occurrences</text>
    <text x="250" y="210" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="6" fill="#3a2010" font-style="italic">in the Streets and Buildings of London</text>

    <line x1="200" y1="222" x2="300" y2="222" stroke="#3a2010" stroke-width="0.55"/>

    <text x="250" y="234" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="5.4" fill="#1a0a04">Collected and Annotated by</text>
    <text x="250" y="244" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="6" fill="#1a0a04" font-weight="700">JAMES MACHEN, M.A.</text>
    <text x="250" y="252" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="5.4" fill="#3a2010" font-style="italic">Fellow of the Folk-Lore Society</text>

    <g opacity="0.7" stroke="#3a2010" stroke-width="0.4" fill="none">
      <path d="M 140 64 Q 150 56 160 64"/>
      <path d="M 340 64 Q 350 56 360 64"/>
      <path d="M 140 252 Q 150 244 160 252"/>
      <path d="M 340 252 Q 350 244 360 252"/>
    </g>
  </g>

  <g>
    <rect x="40" y="170" width="60" height="6" rx="3" fill="url(#penG3)" transform="rotate(-15 70 173)"/>
    <ellipse cx="100" cy="180" rx="3" ry="2" fill="#080404" transform="rotate(-15 100 180)"/>
  </g>

  <g>
    <rect x="380" y="200" width="80" height="22" rx="3" fill="url(#caseG3)"/>
    <line x1="380" y1="210" x2="460" y2="210" stroke="#a87838" stroke-width="0.55"/>
    <circle cx="386" cy="210" r="1" fill="#a87838"/>
    <circle cx="454" cy="210" r="1" fill="#a87838"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowG3)">
    <rect x="120" y="40" width="260" height="220" fill="#fff8d8" opacity="0.32"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowG3)">
    <rect x="120" y="40" width="260" height="220" fill="#f4b860" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomG3)">
    <ellipse cx="250" cy="150" rx="180" ry="80" fill="#fff8d8" opacity="0.22"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="250" cy="270" rx="180" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
