<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 8 Panel 3 — Squad watches the test countdown, "Ninety seconds." "It's enough."</title>
  <desc>Medium wide five tiny figures watch holographic countdown timer run test cycle — copper-gold geometric numerals ticking down from ninety, casting shifting light across squad and wooden beams. Number makes mission real. Five faces in five degraded metallic suits watch countdown, each reflecting numerals — light of deadline playing across silver copper emerald crimson sapphire-violet. Five versions of same thought visible. Countdown continues 85 84 83. The weight of time.</desc>
