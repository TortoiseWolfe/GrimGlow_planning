<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 220" width="494" height="220">
  <title>Issue 11 Page 1 Panel 4 — Wren's hands manipulate the holographic cross-section, "Not changed. Nudged."</title>
  <desc>Close-up Wren's hands — oil-stained, copper-dusted, one knuckle wrapped strip salvaged wire — move through holographic cross-section device. Pulls cross-section apart revealing internal mechanism: core resonates frequency matching telegraph signals, surrounded by temporal field emitter that subtly shifts information content. Technical demonstration — precise, efficient, devastating in implications. Copper-gold from holographic cross-section illuminates hands from below. Internal mechanism glows amber-black in holographic representation. The mechanism of subversion made visible.</desc>
