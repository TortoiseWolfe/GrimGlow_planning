  </g>
  <g opacity="0.85" filter="url(#strongGlowC2)">
    <line x1="48" y1="110" x2="110" y2="110" stroke="#a8c0e0" stroke-width="3" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowC2)">
    <line x1="48" y1="110" x2="110" y2="110" stroke="#a8c0e0" stroke-width="14" opacity="0.42"/>
