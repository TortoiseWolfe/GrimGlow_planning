    <circle cx="240" cy="100" r="5" fill="#d88838" opacity="0.62"/>
    <circle cx="260" cy="140" r="5" fill="#d88838" opacity="0.62"/>
  </g>

  <g>
    <rect x="312" y="40" width="124" height="140" rx="6" fill="url(#emeraldDetailC2)"/>
    <path d="M 340 70 L 412 130" stroke="#0a2018" stroke-width="6" opacity="0.85"/>
    <g opacity="0.85" stroke="url(#copperWireC2)" stroke-width="1" fill="none">
      <path d="M 340 70 L 348 76"/>
      <path d="M 350 80 L 358 86"/>
      <path d="M 360 90 L 368 96"/>
      <path d="M 370 100 L 378 106"/>
      <path d="M 380 110 L 388 116"/>
      <path d="M 390 120 L 398 126"/>
      <path d="M 400 130 L 408 136"/>
    </g>
    <line x1="340" y1="74" x2="412" y2="134" stroke="#fff088" stroke-width="0.85" opacity="0.85"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC2)">
    <line x1="340" y1="70" x2="412" y2="130" stroke="#3a8858" stroke-width="6" opacity="0.62"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowC2)">
    <line x1="340" y1="70" x2="412" y2="130" stroke="#3a8858" stroke-width="20" opacity="0.42"/>
  </g>

  <g>
    <rect x="460" y="40" width="124" height="140" rx="6" fill="url(#crimsonDetailC2)"/>
    <path d="M 480 90 L 564 100 L 562 114 L 478 104 Z" fill="#1a0810" opacity="0.85"/>
    <line x1="480" y1="92" x2="564" y2="102" stroke="#d83838" stroke-width="2" opacity="0.95"/>
    <line x1="480" y1="98" x2="564" y2="108" stroke="#d83838" stroke-width="1.4" opacity="0.85"/>
    <line x1="480" y1="104" x2="564" y2="114" stroke="#d83838" stroke-width="1" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC2)">
    <path d="M 480 95 L 564 105" stroke="#d83838" stroke-width="6" opacity="0.62"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowC2)">
    <path d="M 480 100 L 564 110" stroke="#8a2520" stroke-width="22" opacity="0.42"/>
  </g>

  <g>
    <rect x="608" y="40" width="124" height="140" rx="6" fill="url(#sapphireDetailC2)"/>
    <ellipse cx="670" cy="110" rx="44" ry="32" fill="#1a1028"/>
    <ellipse cx="670" cy="110" rx="38" ry="26" fill="url(#sapphireDetailC2)" opacity="0.85"/>
    <rect x="624" y="100" width="92" height="9" fill="url(#copperFoilC2)" opacity="0.92"/>
    <line x1="624" y1="100" x2="716" y2="100" stroke="#5a3018" stroke-width="0.7"/>
    <line x1="624" y1="109" x2="716" y2="109" stroke="#5a3018" stroke-width="0.7"/>
    <g opacity="0.62">
      <line x1="640" y1="100" x2="642" y2="109" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="660" y1="100" x2="662" y2="109" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="680" y1="100" x2="682" y2="109" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="700" y1="100" x2="702" y2="109" stroke="#5a3018" stroke-width="0.55"/>
    </g>
    <g opacity="0.85" font-family="monospace" font-size="3.4" fill="#a878d8">
      <text x="630" y="80">∇⊥◊⊥</text>
      <text x="690" y="80">⊥∢⊕</text>
      <text x="630" y="130">142Hz</text>
      <text x="690" y="130">SCAN</text>
    </g>
  </g>
  <g opacity="0.85" filter="url(#strongGlowC2)">
    <ellipse cx="670" cy="110" rx="44" ry="32" fill="#a878d8" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowC2)">
    <ellipse cx="670" cy="110" rx="60" ry="44" fill="#7848b8" opacity="0.42"/>
  </g>
</svg>
