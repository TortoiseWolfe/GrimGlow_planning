<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 11 Page 18 Panel 2 — Five suit details, the degradation arc crystallized</title>
  <desc>Close-up montage strip — five tight detail crops arranged horizontally. Left to right: Sable's tin-patched shoulder with silver light bleeding through repair seam. Wren's brass-wire-patched forearm with copper-gold holographic nodes pulsing beneath oil stains. Jink's copper-wire-stitched tear with emerald light glowing through suture. Thresh's gouged crimson vambrace with crimson edge-lighting flickering along damage line. Luma's copper-foil lens repair with blue-violet data still scrolling. Five examples of the same truth: future technology held together with Victorian materials, light enduring through damage.</desc>
  <defs>
    <linearGradient id="bgC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="silverDetailC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b8c8"/>
      <stop offset="0.5" stop-color="#5a6878"/>
      <stop offset="1" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="copperDetailC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#3a1810"/>
    </linearGradient>
    <linearGradient id="emeraldDetailC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4830"/>
      <stop offset="1" stop-color="#0a2018"/>
    </linearGradient>
    <linearGradient id="crimsonDetailC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.5" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="sapphireDetailC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#3a2868"/>
      <stop offset="1" stop-color="#1a1028"/>
    </linearGradient>
    <linearGradient id="tinPatchC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="copperWireC2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="copperFoilC2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <filter id="bloomC2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowC2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="megaGlowC2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="742" height="220" fill="url(#bgC2)"/>

  <line x1="148" y1="20" x2="148" y2="200" stroke="#1a1810" stroke-width="0.7" opacity="0.55"/>
  <line x1="296" y1="20" x2="296" y2="200" stroke="#1a1810" stroke-width="0.7" opacity="0.55"/>
  <line x1="444" y1="20" x2="444" y2="200" stroke="#1a1810" stroke-width="0.7" opacity="0.55"/>
  <line x1="592" y1="20" x2="592" y2="200" stroke="#1a1810" stroke-width="0.7" opacity="0.55"/>

  <g>
    <rect x="20" y="40" width="120" height="140" rx="6" fill="url(#silverDetailC2)"/>
    <path d="M 50 90 L 110 88 L 108 130 L 48 132 Z" fill="url(#tinPatchC2)" opacity="0.92"/>
    <g opacity="0.85" stroke="#1a1a1a" stroke-width="0.62" fill="none">
      <line x1="50" y1="90" x2="56" y2="98"/>
      <line x1="62" y1="88" x2="68" y2="96"/>
      <line x1="74" y1="88" x2="80" y2="96"/>
      <line x1="86" y1="89" x2="92" y2="97"/>
      <line x1="98" y1="89" x2="104" y2="97"/>
      <line x1="50" y1="124" x2="56" y2="132"/>
