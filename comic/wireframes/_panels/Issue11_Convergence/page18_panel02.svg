    <ellipse cx="220" cy="100" rx="22" ry="14" fill="#1a0a08" opacity="0.55"/>
    <ellipse cx="244" cy="140" rx="22" ry="11" fill="#1a0a08" opacity="0.55"/>
    <ellipse cx="200" cy="60" rx="14" ry="6" fill="#1a0a08" opacity="0.42"/>
    <g opacity="0.85" stroke="url(#copperWireC2)" stroke-width="0.85" fill="none">
      <path d="M 174 80 Q 200 78 230 84"/>
      <path d="M 174 110 Q 220 108 280 114"/>
      <path d="M 174 140 Q 220 138 280 144"/>
