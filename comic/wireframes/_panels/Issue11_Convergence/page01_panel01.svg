<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 1 Panel 1 — Wren briefs the squad, "It's worse than I thought"</title>
  <desc>Wide establishing slightly elevated wall cavity camp grey morning light. Main beam equipment arranged for briefing. Squad gathered loose semicircle — all five members. Wren center holographic projections filling air — copper-gold schematics, data streams, analyzed Titan device on beam pulsing amber-black. Wall gap admitting thin grey daylight. Camp shows weeks of occupation. Wren upright commanding her space, Sable rigid attentive, Jink crouched higher timber, Thresh perimeter arms crossed, Luma seated scanner. The urgency of diagnosis.</desc>
