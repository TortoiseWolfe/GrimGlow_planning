<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 2 Panel 1 — Wren's network map fills the air, "the nervous system of the industrial age"</title>
  <desc>Wide low angle massive holographic projection fills upper frame — copper-gold schematic city telegraph network. Lines radiate from central exchange nodes to substations terminal offices forming dense interconnected web. At key nodes amber-black markers pulse — Titan device locations forming deliberate pattern at densest information-flow junctions. Below tiny figures on wooden beams silhouetted against copper-gold light, looking up at scope of threat. Network fills air like poisoned constellation. The scope of subversion made visible.</desc>
  <defs>
    <linearGradient id="bgX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="copperFillX1" x1="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberPulseTitanX1" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="beamX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="figSilX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6068"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="figCopperX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="figEmeraldX1" x1="0" y1="0" x2="0" y2="1">
