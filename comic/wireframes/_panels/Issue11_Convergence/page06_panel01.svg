<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 11 Page 6 Panel 1 — Sable's decision, "We're not leaving this era to the Titans"</title>
  <desc>Medium slight low angle Sable turns from holographic projection to face squad. Dark brown skin sharp angular features very short military-cropped silver-white hair catching grey-white daylight from wall gap behind — backlit, morning light creating thin bright edge along hair and shoulders. Copper-gold holographic projections frame from front, tactical data still floating in air behind. Squares shoulders in full command posture. Soot-darkened silver suit with tin-patched shoulder catches both light sources. Resolved — deliberation over, clarity remaining. Captain who held them together through everything. Damaged and dirty and standing on wooden beam inside Victorian wall, giving the order. Past and future framing the present decision. The moment of commitment.</desc>
