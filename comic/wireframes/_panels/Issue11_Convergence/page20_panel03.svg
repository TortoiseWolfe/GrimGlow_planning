<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 11 Page 20 Panel 3 — Thresh sees herself in the words</title>
  <desc>Close-up Thresh's face. Broad-shouldered frame at edges, pale skin, copper-red buzz cut, defined cheekbones. Looks downward at her own damaged crimson armor — visible at bottom of frame, dented, scratched, holographic edge-lighting stuttering. Something cracks open behind the fear — not a smile but recognition. She sees herself as the fairy tale Sable just named. Dawn amber light catches damage on her armor, making it glow. The soldier recognizing her own story.</desc>
  <defs>
    <linearGradient id="bgE3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87858"/>
      <stop offset="0.5" stop-color="#5a2530"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <radialGradient id="dawnFaceE3" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairBuzzE3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.4" stop-color="#a85020"/>
      <stop offset="1" stop-color="#5a2810"/>
    </linearGradient>
    <linearGradient id="faceThreshE3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d8b8"/>
      <stop offset="0.5" stop-color="#d8a878"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <radialGradient id="eyeRecogE3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a87858" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a87858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armorCrimsonE3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83838"/>
      <stop offset="0.5" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="crimsonStutterE3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5a2520" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#d83838" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="bloomE3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowE3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowE3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="366" height="280" fill="url(#bgE3)"/>
  <rect width="366" height="280" fill="url(#dawnFaceE3)"/>

  <g>
    <ellipse cx="183" cy="120" rx="120" ry="120" fill="url(#faceThreshE3)"/>

    <path d="M 70 60 Q 100 24 183 22 Q 266 24 296 60 Q 300 90 290 96 L 280 90 Q 260 50 220 44 Q 183 38 146 44 Q 106 50 86 90 L 76 96 Q 66 90 70 60 Z" fill="url(#hairBuzzE3)"/>
    <g opacity="0.7" stroke="#5a2810" stroke-width="0.55">
      <line x1="100" y1="40" x2="100" y2="56"/>
      <line x1="120" y1="34" x2="120" y2="56"/>
      <line x1="140" y1="32" x2="140" y2="56"/>
      <line x1="160" y1="30" x2="160" y2="56"/>
      <line x1="183" y1="28" x2="183" y2="56"/>
      <line x1="206" y1="30" x2="206" y2="56"/>
      <line x1="226" y1="32" x2="226" y2="56"/>
      <line x1="246" y1="34" x2="246" y2="56"/>
      <line x1="266" y1="40" x2="266" y2="56"/>
    </g>

    <ellipse cx="138" cy="120" rx="14" ry="18" fill="#0a0604"/>
    <circle cx="138" cy="120" r="9" fill="#3a2010"/>
    <circle cx="142" cy="118" r="4" fill="url(#eyeRecogE3)"/>
    <circle cx="138" cy="124" r="3" fill="#080404"/>

    <ellipse cx="228" cy="120" rx="14" ry="18" fill="#0a0604"/>
    <circle cx="228" cy="120" r="9" fill="#3a2010"/>
    <circle cx="232" cy="118" r="4" fill="url(#eyeRecogE3)"/>
    <circle cx="228" cy="124" r="3" fill="#080404"/>

    <path d="M 100 100 Q 138 92 162 100" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 204 100 Q 228 92 266 100" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="154" cy="148" rx="11" ry="3" fill="#a85820" opacity="0.62"/>
    <ellipse cx="212" cy="148" rx="11" ry="3" fill="#a85820" opacity="0.62"/>

    <path d="M 156 184 Q 183 188 210 184" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 156 188 L 210 188" stroke="#3a2410" stroke-width="0.85" opacity="0.55"/>
  </g>

  <g>
    <path d="M 0 220 Q 80 200 183 200 Q 286 200 366 220 L 366 280 L 0 280 Z" fill="url(#armorCrimsonE3)"/>

    <path d="M 60 230 L 100 222 L 95 240 L 56 250 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 200 224 L 264 220 L 260 240 L 196 244 Z" fill="#1a0810" opacity="0.85"/>
    <path d="M 130 240 L 156 232 L 150 250 L 124 252 Z" fill="#1a0810" opacity="0.85"/>

    <line x1="80" y1="234" x2="180" y2="232" stroke="url(#crimsonStutterE3)" stroke-width="2"/>
    <line x1="200" y1="234" x2="320" y2="232" stroke="url(#crimsonStutterE3)" stroke-width="2"/>
    <line x1="40" y1="248" x2="180" y2="246" stroke="url(#crimsonStutterE3)" stroke-width="1.4" opacity="0.7"/>
    <line x1="200" y1="248" x2="340" y2="246" stroke="url(#crimsonStutterE3)" stroke-width="1.4" opacity="0.7"/>

    <path d="M 60 224 Q 70 220 80 222" stroke="#fff8d8" stroke-width="0.85" fill="none" opacity="0.62"/>
    <path d="M 264 222 Q 280 218 300 220" stroke="#fff8d8" stroke-width="0.85" fill="none" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowE3)">
    <line x1="0" y1="234" x2="366" y2="232" stroke="#d83838" stroke-width="6" opacity="0.42"/>
  </g>
  <g opacity="0.62" filter="url(#megaGlowE3)">
    <line x1="0" y1="234" x2="366" y2="232" stroke="#d83838" stroke-width="22" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomE3)">
    <ellipse cx="183" cy="80" rx="140" ry="14" fill="#f4b860" opacity="0.42"/>
    <ellipse cx="183" cy="220" rx="180" ry="22" fill="#a85820" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="240" rx="180" ry="3" fill="#040202" opacity="0.42"/>
  </g>
</svg>
