<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 11 Page 16 Panel 1 — Thresh's hands on the weapon, "Check charge. Check coupling."</title>
  <desc>Close-up Thresh's hands performing weapon check. Pale fingers moving along compact rifle's housing with practiced precision. Each coupling tested, each charge node verified by touch. Hands steady — not trembling. Training is bone-deep. Whatever the mind fears, the hands remember. Crimson edge-lighting from weapon. Warm gaslight from wall gap. The steadiness IS the expression.</desc>
  <defs>
    <linearGradient id="bgA1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1024"/>
      <stop offset="0.5" stop-color="#0a060e"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="gaslightA1" cx="0.95" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="weaponA1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="0.4" stop-color="#5a2530"/>
      <stop offset="0.7" stop-color="#3a1820"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
    <linearGradient id="crimsonA1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#d83838" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a2520" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="handA1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b8a0"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3a28"/>
    </linearGradient>
    <linearGradient id="suitThreshA1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2520"/>
      <stop offset="0.5" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#1a0a08"/>
    </linearGradient>
    <filter id="bloomA1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowA1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowA1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.8"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgA1)"/>
  <rect width="366" height="260" fill="url(#gaslightA1)"/>

  <g opacity="0.35">
    <rect x="40" y="40" width="60" height="3" fill="#3a2810" opacity="0.55"/>
    <rect x="40" y="80" width="60" height="3" fill="#3a2810" opacity="0.55"/>
    <rect x="40" y="120" width="60" height="3" fill="#3a2810" opacity="0.55"/>
  </g>

  <g>
    <rect x="40" y="140" width="286" height="86" rx="4" fill="url(#weaponA1)"/>
    <rect x="40" y="140" width="286" height="6" fill="#5a3038" opacity="0.7"/>
    <rect x="40" y="220" width="286" height="6" fill="#1a0810" opacity="0.7"/>

    <rect x="80" y="148" width="40" height="14" rx="2" fill="#2a1018"/>
    <rect x="160" y="148" width="60" height="14" rx="2" fill="#2a1018"/>
    <rect x="240" y="148" width="50" height="14" rx="2" fill="#2a1018"/>

    <circle cx="100" cy="180" r="6" fill="#1a0810"/>
    <circle cx="100" cy="180" r="3.4" fill="#d83838"/>
    <circle cx="190" cy="180" r="6" fill="#1a0810"/>
    <circle cx="190" cy="180" r="3.4" fill="#d83838"/>
    <circle cx="265" cy="180" r="6" fill="#1a0810"/>
    <circle cx="265" cy="180" r="3.4" fill="#d83838"/>

    <rect x="40" y="200" width="286" height="3" fill="url(#crimsonA1)" opacity="0.85"/>
    <rect x="40" y="142" width="286" height="2" fill="url(#crimsonA1)" opacity="0.62"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowA1)">
    <rect x="40" y="200" width="286" height="6" fill="#d83838" opacity="0.55"/>
  </g>
  <g opacity="0.65" filter="url(#megaGlowA1)">
    <rect x="40" y="195" width="286" height="14" fill="#8a2520" opacity="0.42"/>
  </g>

  <g>
    <path d="M 0 60 Q 40 56 80 64 Q 110 68 130 78 Q 144 86 152 96 L 132 134 Q 124 122 110 116 Q 100 110 84 110 Q 64 110 40 100 Q 16 92 0 96 Z" fill="url(#handA1)"/>

    <ellipse cx="64" cy="86" rx="14" ry="10" fill="#a87858" opacity="0.85"/>
    <path d="M 76 90 Q 90 96 102 102" stroke="#5a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 96 96 Q 110 102 122 110" stroke="#5a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 116 102 Q 128 110 138 116" stroke="#5a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 130 110 Q 140 118 148 122" stroke="#5a3a28" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <path d="M 0 28 Q 40 22 70 32 L 76 50 Q 50 42 0 48 Z" fill="url(#suitThreshA1)"/>
    <path d="M 20 32 Q 40 30 60 36" stroke="#1a0a08" stroke-width="0.85" opacity="0.55"/>

    <ellipse cx="60" cy="74" rx="6" ry="3" fill="#0a0604" opacity="0.62"/>
    <ellipse cx="100" cy="92" rx="4" ry="2" fill="#0a0604" opacity="0.55"/>
  </g>

  <g opacity="0.75" filter="url(#bloomA1)">
    <path d="M 130 78 Q 144 86 152 96" stroke="#d83838" stroke-width="2" fill="none" opacity="0.62"/>
    <path d="M 100 100 L 140 116" stroke="#d83838" stroke-width="1.4" fill="none" opacity="0.55"/>
  </g>

  <g opacity="0.62" filter="url(#bloomA1)">
    <ellipse cx="320" cy="180" rx="40" ry="30" fill="#f4b860" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="183" cy="240" rx="120" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="290" height="36" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="138" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#8a2520" font-weight="700">THRESH (whispered to herself):</text>
    <text x="138" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic">"Check charge. Check coupling. Check sight line."</text>
    <text x="138" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic">"Check charge."</text>
  </g>
</svg>
