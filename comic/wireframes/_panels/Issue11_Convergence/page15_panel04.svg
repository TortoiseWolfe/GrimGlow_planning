<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 11 Page 15 Panel 4 — Luma's hand on the stone, communion across centuries</title>
  <desc>Close-up detail. Small hand — ink-stained belonging to tiny figure in sapphire-violet suit — pressed flat against ancient stone beneath carved alien geometric script. Stone cold grey centuries old. Gesture is communion — reaching across time to touch surface someone else touched when they made their choice. Blue-violet scanner light illuminates hand and stone. A touch that answers an unasked question.</desc>
  <defs>
    <linearGradient id="bgY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="violetSourceY4" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#a878d8" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#3a1a5a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneAncientY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5854"/>
      <stop offset="0.5" stop-color="#3a3838"/>
      <stop offset="1" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="handLumaY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a878d8"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.85" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <linearGradient id="cuffVioletY4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#3a1a5a"/>
      <stop offset="1" stop-color="#1a0a2a"/>
    </linearGradient>
    <filter id="bloomY4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="246" height="260" fill="url(#bgY4)"/>
  <rect width="246" height="260" fill="url(#violetSourceY4)"/>

  <g>
    <rect x="0" y="0" width="246" height="260" fill="url(#stoneAncientY4)" opacity="0.92"/>
    <g opacity="0.55" stroke="#0a0808" stroke-width="0.55" fill="none">
      <line x1="0" y1="40" x2="246" y2="40"/>
      <line x1="0" y1="80" x2="246" y2="80"/>
      <line x1="0" y1="120" x2="246" y2="120"/>
      <line x1="0" y1="160" x2="246" y2="160"/>
      <line x1="0" y1="200" x2="246" y2="200"/>
      <line x1="0" y1="240" x2="246" y2="240"/>
      <line x1="60" y1="0" x2="60" y2="260"/>
      <line x1="180" y1="0" x2="180" y2="260"/>
    </g>
  </g>

  <g opacity="0.62">
    <ellipse cx="80" cy="40" rx="40" ry="11" fill="#1a1818"/>
    <ellipse cx="180" cy="100" rx="50" ry="14" fill="#1a1818"/>
    <ellipse cx="60" cy="200" rx="40" ry="14" fill="#1a1818"/>
  </g>

  <g opacity="0.92">
    <text x="123" y="32" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#7848b8" font-weight="900" letter-spacing="6" stroke="#3a1a5a" stroke-width="0.85" opacity="0.85">STAY</text>
  </g>
  <g opacity="0.55" filter="url(#bloomY4)">
    <text x="123" y="32" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#a878d8" font-weight="900" letter-spacing="6" opacity="0.62">STAY</text>
  </g>

  <g opacity="0.55">
    <ellipse cx="123" cy="80" rx="80" ry="3" fill="#0a0808" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="123" cy="160" rx="30" ry="22" fill="url(#handLumaY4)"/>

    <ellipse cx="106" cy="148" rx="6" ry="9" fill="url(#handLumaY4)"/>
    <ellipse cx="118" cy="142" rx="6" ry="11" fill="url(#handLumaY4)"/>
    <ellipse cx="130" cy="142" rx="6" ry="11" fill="url(#handLumaY4)"/>
    <ellipse cx="142" cy="146" rx="6" ry="9" fill="url(#handLumaY4)"/>

    <ellipse cx="106" cy="138" rx="3.4" ry="2" fill="url(#handLumaY4)"/>
    <ellipse cx="118" cy="130" rx="3.4" ry="2" fill="url(#handLumaY4)"/>
    <ellipse cx="130" cy="130" rx="3.4" ry="2" fill="url(#handLumaY4)"/>
    <ellipse cx="142" cy="136" rx="3.4" ry="2" fill="url(#handLumaY4)"/>

    <ellipse cx="106" cy="134" rx="2" ry="1.2" fill="#3a1a14" opacity="0.55"/>
    <ellipse cx="118" cy="126" rx="2" ry="1.2" fill="#3a1a14" opacity="0.55"/>
    <ellipse cx="130" cy="126" rx="2" ry="1.2" fill="#3a1a14" opacity="0.55"/>
    <ellipse cx="142" cy="132" rx="2" ry="1.2" fill="#3a1a14" opacity="0.55"/>

    <path d="M 100 156 Q 120 160 144 156" stroke="#3a261a" stroke-width="0.85" fill="none" opacity="0.55"/>
    <path d="M 110 168 Q 124 172 140 168" stroke="#3a261a" stroke-width="0.85" fill="none" opacity="0.55"/>

    <ellipse cx="118" cy="148" rx="2" ry="1" fill="#1a0a14" opacity="0.55"/>
    <ellipse cx="132" cy="148" rx="2" ry="1" fill="#1a0a14" opacity="0.55"/>
    <ellipse cx="123" cy="158" rx="3" ry="1.4" fill="#1a0a14" opacity="0.42"/>

    <path d="M 90 178 Q 123 184 156 178 L 246 200 L 246 260 L 0 260 L 0 200 L 90 178 Z" fill="url(#cuffVioletY4)"/>
    <path d="M 90 178 Q 123 184 156 178" stroke="#1a0a2a" stroke-width="0.85" fill="none"/>
    <path d="M 110 196 L 138 196" stroke="#a878d8" stroke-width="0.55" opacity="0.55"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowY4)">
    <ellipse cx="123" cy="160" rx="44" ry="22" fill="#a878d8" opacity="0.55"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowY4)">
    <ellipse cx="123" cy="170" rx="80" ry="32" fill="#7848b8" opacity="0.42"/>
  </g>

  <g opacity="0.85">
    <line x1="100" y1="120" x2="106" y2="130" stroke="#a878d8" stroke-width="0.55" stroke-dasharray="1.4 1" opacity="0.42"/>
    <line x1="146" y1="120" x2="142" y2="130" stroke="#a878d8" stroke-width="0.55" stroke-dasharray="1.4 1" opacity="0.42"/>
  </g>

  <g opacity="0.42">
    <circle cx="80" cy="60" r="0.55" fill="#a878d8"/>
    <circle cx="160" cy="80" r="0.55" fill="#a878d8"/>
    <circle cx="60" cy="120" r="0.55" fill="#a878d8"/>
    <circle cx="200" cy="140" r="0.55" fill="#a878d8"/>
  </g>
  <g opacity="0.42" filter="url(#bloomY4)">
    <circle cx="80" cy="60" r="2" fill="#a878d8" opacity="0.55"/>
    <circle cx="160" cy="80" r="2" fill="#a878d8" opacity="0.55"/>
  </g>

  <g opacity="0.55">
    <text x="40" y="240" text-anchor="middle" font-family="Times New Roman, serif" font-size="4" fill="#5a4838" font-style="italic" opacity="0.62">— communion —</text>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="180" height="14" rx="3" fill="#f5ecd8" opacity="0.85" stroke="#5a4838" stroke-width="0.55"/>
    <text x="84" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#5a4838" font-style="italic" opacity="0.85">— silent contact —</text>
  </g>
</svg>
