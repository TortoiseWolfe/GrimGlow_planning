    <circle cx="160" cy="160" r="6" fill="#3a4858"/>
    <line x1="156" y1="174" x2="156" y2="195" stroke="#a8c0e0" stroke-width="0.7" opacity="0.62"/>

    <ellipse cx="240" cy="178" rx="9" ry="22" fill="#3a2410"/>
