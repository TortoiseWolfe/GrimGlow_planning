  <g>
    <path d="M 100 80 L 240 90 L 280 70 L 340 80 L 380 60 L 440 90 L 500 50 L 580 90 L 642 80 L 642 200 L 100 200 Z" fill="url(#cityFarD4)" opacity="0.85"/>
    <line x1="100" y1="80" x2="642" y2="80" stroke="#080604" stroke-width="0.7" opacity="0.55"/>

    <path d="M 100 130 L 200 140 L 280 120 L 380 130 L 480 110 L 580 140 L 642 130 L 642 220 L 100 220 Z" fill="url(#cityNearD4)" opacity="0.92"/>

    <g opacity="0.55">
      <rect x="200" y="100" width="20" height="40" fill="#0a0a14"/>
      <rect x="280" y="80" width="14" height="60" fill="#0a0a14"/>
      <rect x="380" y="70" width="22" height="70" fill="#0a0a14"/>
