<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 19 Panel 4 — Squad at the wall gap, dawn over the city</title>
  <desc>Wide shot. Five tiny figures at gap in brickwork wall, silhouetted against first light of dawn. City beyond shifting from grey-blue to amber — gaslight fading as daylight arrives, telegraph lines visible as dark threads connecting buildings across cityscape. Behind figures, camp in shadow. Ahead, enormous city they are about to save. Five silhouettes in five degraded metallic suits, each posture different but all facing same direction. Dawn light through the gap.</desc>
  <defs>
    <linearGradient id="bgD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a78a8"/>
      <stop offset="0.5" stop-color="#a87858"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="dawnRiseD4" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickWallD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="cityFarD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4858"/>
      <stop offset="0.5" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="cityNearD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="beamD4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <filter id="bloomD4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowD4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowD4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="742" height="280" fill="url(#bgD4)"/>
  <rect width="742" height="280" fill="url(#dawnRiseD4)"/>

  <g>
    <rect x="0" y="0" width="100" height="280" fill="url(#brickWallD4)"/>
    <rect x="642" y="0" width="100" height="280" fill="url(#brickWallD4)"/>
    <rect x="0" y="0" width="742" height="40" fill="url(#brickWallD4)"/>

    <g opacity="0.55" stroke="#080604" stroke-width="0.55">
      <line x1="0" y1="60" x2="100" y2="60"/>
      <line x1="0" y1="100" x2="100" y2="100"/>
      <line x1="0" y1="140" x2="100" y2="140"/>
      <line x1="0" y1="180" x2="100" y2="180"/>
      <line x1="50" y1="40" x2="50" y2="280"/>
      <line x1="642" y1="60" x2="742" y2="60"/>
