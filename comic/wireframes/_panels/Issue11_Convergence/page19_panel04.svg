      <rect x="390" y="115" width="3" height="6" fill="#f4b860"/>
      <rect x="510" y="80" width="3" height="6" fill="#f4b860"/>
    </g>

    <g opacity="0.62" stroke="#080604" stroke-width="0.55">
      <line x1="100" y1="140" x2="200" y2="120"/>
      <line x1="200" y1="120" x2="320" y2="100"/>
      <line x1="320" y1="100" x2="450" y2="120"/>
      <line x1="450" y1="120" x2="580" y2="100"/>
      <line x1="580" y1="100" x2="642" y2="130"/>
      <line x1="100" y1="180" x2="220" y2="160"/>
      <line x1="220" y1="160" x2="380" y2="170"/>
      <line x1="380" y1="170" x2="500" y2="150"/>
      <line x1="500" y1="150" x2="642" y2="170"/>
    </g>

    <g opacity="0.85" stroke="#a85820" stroke-width="0.4">
      <path d="M 120 100 Q 180 90 240 100 Q 300 80 360 100 Q 420 90 480 100 Q 540 80 600 100"/>
    </g>
  </g>
  <g opacity="0.62" filter="url(#bloomD4)">
    <rect x="100" y="40" width="542" height="160" fill="#f4b860" opacity="0.22"/>
  </g>

  <g>
    <rect x="0" y="200" width="742" height="40" fill="url(#beamD4)"/>
    <line x1="0" y1="206" x2="742" y2="206" stroke="#1a0a04" stroke-width="0.85"/>
  </g>

  <g>
