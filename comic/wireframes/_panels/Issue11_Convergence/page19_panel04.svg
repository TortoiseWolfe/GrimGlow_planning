    <ellipse cx="320" cy="178" rx="9" ry="22" fill="#1a4830"/>
    <circle cx="320" cy="158" r="6" fill="#a87838"/>
    <line x1="316" y1="172" x2="316" y2="195" stroke="#3a8858" stroke-width="0.7" opacity="0.62"/>

    <ellipse cx="400" cy="180" rx="11" ry="22" fill="#3a1820"/>
    <circle cx="400" cy="158" r="6" fill="#3a1820"/>
    <line x1="394" y1="172" x2="394" y2="195" stroke="#d83838" stroke-width="0.7" opacity="0.62"/>

    <ellipse cx="480" cy="178" rx="9" ry="22" fill="#3a2868"/>
    <circle cx="480" cy="158" r="6" fill="#3a2868"/>
    <line x1="476" y1="172" x2="476" y2="195" stroke="#a878d8" stroke-width="0.7" opacity="0.62"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowD4)">
    <ellipse cx="160" cy="180" rx="14" ry="22" fill="#a8c0e0" opacity="0.32"/>
    <ellipse cx="240" cy="178" rx="14" ry="22" fill="#d88838" opacity="0.32"/>
    <ellipse cx="320" cy="178" rx="14" ry="22" fill="#3a8858" opacity="0.32"/>
    <ellipse cx="400" cy="180" rx="14" ry="22" fill="#d83838" opacity="0.32"/>
    <ellipse cx="480" cy="178" rx="14" ry="22" fill="#a878d8" opacity="0.32"/>
  </g>

  <g opacity="0.85" filter="url(#bloomD4)">
    <ellipse cx="370" cy="80" rx="280" ry="22" fill="#f4b860" opacity="0.42"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="370" cy="220" rx="280" ry="3" fill="#040202" opacity="0.42"/>
  </g>

  <g transform="translate(110,12)">
    <rect x="-6" y="0" width="500" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="244" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#5a6478" font-weight="700">SABLE: "We move in ten minutes. Jink first — highest and farthest."</text>
    <text x="244" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#2a2a2a" font-style="italic">"Then Thresh, Luma, Wren. I go last. Theodore — already in position."</text>
  </g>
</svg>
