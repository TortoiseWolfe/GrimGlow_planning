<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 11 Page 13 Panel 2 — Jink ECU, "You are twelve years old. This is not your war."</title>
  <desc>Extreme close-up Jink's face filling frame. Lean androgynous light brown skin wild bright golden blonde curly hair catching cold moonlight. Eyes bright with tears forming but not falling — not usual reckless spark but something rawer deeper frightened. Grin that defined this face for ten issues so absent its absence reshapes everything. This is who Jink is underneath performance: young afraid caring enough to demand someone they love walk away. Emerald metallic suit's collar at bottom of frame, faint emerald glow from beneath. Moonlight catches brightness of unshed tears. Warm gaslight reflected from below. Controlled anguish.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonAboveY2" cx="0.5" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#5a78a8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightBelowY2" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldCollarY2" cx="0.5" cy="0.85" r="0.32">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#1a4a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairBlondeY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a8c0e0"/>
      <stop offset="0.7" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="faceJinkY2" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#a8c0e0"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.85" stop-color="#a87838"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <radialGradient id="eyeAnguishY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a8c0e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tearY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#1a4a2a"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="tearBloomY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="246" height="260" fill="url(#bgY2)"/>
  <rect width="246" height="260" fill="url(#moonAboveY2)"/>
  <rect width="246" height="260" fill="url(#gaslightBelowY2)"/>
  <rect width="246" height="260" fill="url(#emeraldCollarY2)"/>

  <g>
    <ellipse cx="123" cy="120" rx="100" ry="130" fill="#3a261a"/>
    <ellipse cx="123" cy="100" rx="76" ry="90" fill="url(#faceJinkY2)"/>

    <path d="M 30 30 Q 80 -10 130 -4 Q 180 -10 220 30 Q 234 70 224 110 L 200 120 Q 184 50 158 40 Q 130 30 110 60 Q 80 30 60 80 L 40 70 Z" fill="url(#hairBlondeY2)"/>
    <path d="M 50 18 Q 70 0 96 6" stroke="#fff8d8" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 152 0 Q 178 0 198 24" stroke="#fff8d8" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 60 76 Q 84 84 110 76" stroke="#a87838" stroke-width="2.4" fill="none" opacity="0.55"/>
    <path d="M 138 70 Q 162 80 190 68" stroke="#a87838" stroke-width="2.4" fill="none" opacity="0.55"/>
    <ellipse cx="56" cy="22" rx="11" ry="6" fill="#a87838" opacity="0.85"/>
    <ellipse cx="190" cy="20" rx="11" ry="6" fill="#a87838" opacity="0.85"/>
    <ellipse cx="123" cy="58" rx="6" ry="2" fill="#a87838" opacity="0.85"/>
    <ellipse cx="86" cy="80" rx="3" ry="1.6" fill="#a87838" opacity="0.7"/>
    <ellipse cx="160" cy="76" rx="3" ry="1.6" fill="#a87838" opacity="0.7"/>

    <ellipse cx="86" cy="116" rx="11" ry="13" fill="#0a0604"/>
    <ellipse cx="160" cy="116" rx="11" ry="13" fill="#0a0604"/>
    <circle cx="86" cy="116" r="6" fill="#080404"/>
    <circle cx="160" cy="116" r="6" fill="#080404"/>
    <circle cx="89" cy="113" r="3" fill="url(#eyeAnguishY2)"/>
    <circle cx="163" cy="113" r="3" fill="url(#eyeAnguishY2)"/>
    <circle cx="89" cy="113" r="1" fill="#fff8d8"/>
    <circle cx="163" cy="113" r="1" fill="#fff8d8"/>

    <ellipse cx="92" cy="124" rx="3.4" ry="1.6" fill="url(#tearY2)" opacity="0.85"/>
    <ellipse cx="166" cy="124" rx="3.4" ry="1.6" fill="url(#tearY2)" opacity="0.85"/>

    <path d="M 60 96 Q 86 86 108 96" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 138 96 Q 160 86 186 96" stroke="#0a0604" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <ellipse cx="100" cy="138" rx="9" ry="3" fill="#a87838" opacity="0.55"/>
    <ellipse cx="146" cy="138" rx="9" ry="3" fill="#a87838" opacity="0.55"/>
    <ellipse cx="123" cy="134" rx="3" ry="1.4" fill="#a87838" opacity="0.55"/>

    <path d="M 100 178 Q 123 178 146 178" stroke="#0a0604" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 100 180 L 146 180" stroke="#3a2410" stroke-width="0.85" opacity="0.55"/>

    <path d="M 30 220 Q 123 200 216 220 L 246 260 L 0 260 Z" fill="url(#emeraldFigY2)"/>
    <path d="M 50 234 L 196 234 L 220 256 L 26 256 Z" fill="#0a1408" opacity="0.85"/>
  </g>

  <g opacity="0.95" filter="url(#tearBloomY2)">
    <ellipse cx="92" cy="124" rx="3" ry="1.4" fill="#fff8d8" opacity="0.85"/>
    <ellipse cx="166" cy="124" rx="3" ry="1.4" fill="#fff8d8" opacity="0.85"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowY2)">
    <path d="M 30 220 Q 123 210 216 220" stroke="#3a8858" stroke-width="3" fill="none" opacity="0.62"/>
    <ellipse cx="123" cy="240" rx="80" ry="6" fill="#3a8858" opacity="0.55"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowY2)">
    <ellipse cx="123" cy="240" rx="120" ry="22" fill="#3a8858" opacity="0.42"/>
  </g>

  <g opacity="0.85" filter="url(#bloomY2)">
    <ellipse cx="123" cy="60" rx="80" ry="14" fill="#a8c0e0" opacity="0.42"/>
    <ellipse cx="123" cy="160" rx="80" ry="14" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.85">
    <line x1="84" y1="144" x2="92" y2="180" stroke="#a8c0e0" stroke-width="0.7" opacity="0.55"/>
    <line x1="162" y1="144" x2="156" y2="180" stroke="#a8c0e0" stroke-width="0.7" opacity="0.55"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a8858" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a8858" font-weight="700">JINK: "You are twelve</text>
    <text x="100" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic" font-weight="700">years old. This is not</text>
    <text x="100" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic" font-weight="700">your war."</text>
  </g>
</svg>
