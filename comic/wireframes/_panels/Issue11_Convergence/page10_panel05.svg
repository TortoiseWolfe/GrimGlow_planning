<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 11 Page 10 Panel 5 — Sable in profile, recognizing the church basement marker</title>
  <desc>Close-up profile Sable's face. Dark brown skin sharp angular features silver-white hair, soot-darkened silver suit's collar visible at bottom. Looks at holographic projection, eyes lingering on specific marker — church basement location. Flicker of recognition behind command mask — fallback position is place where prior operatives carved STAY into wall. Copper-gold holographic light illuminates profile. The commander recognizing the echo.</desc>
  <defs>
    <linearGradient id="bgZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperProfileZ5" cx="0.85" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="silverFigZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6068"/>
      <stop offset="0.5" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="hairSilZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="faceSableZ5" x1="0" y1="0" x2="0.95" y2="0.5">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.7" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeEchoZ5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="campMarkZ5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <filter id="bloomZ5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="megaGlowZ5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="246" height="260" fill="url(#bgZ5)"/>
  <rect width="246" height="260" fill="url(#copperProfileZ5)"/>

  <g>
    <rect x="0" y="220" width="246" height="40" fill="url(#floorZ5)"/>
    <line x1="0" y1="228" x2="246" y2="226" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g opacity="0.92">
    <rect x="160" y="40" width="74" height="120" fill="none" stroke="#a85820" stroke-width="0.55"/>
    <g opacity="0.55" stroke="#a85820" stroke-width="0.4" fill="none">
      <line x1="160" y1="80" x2="234" y2="80"/>
      <line x1="160" y1="120" x2="234" y2="120"/>
      <line x1="200" y1="40" x2="200" y2="160"/>
    </g>

    <circle cx="180" cy="64" r="3" fill="url(#campMarkZ5)" stroke="#5a2818" stroke-width="0.4"/>
    <circle cx="220" cy="68" r="3" fill="url(#campMarkZ5)" stroke="#5a2818" stroke-width="0.4"/>
    <circle cx="180" cy="100" r="3" fill="url(#campMarkZ5)" stroke="#5a2818" stroke-width="0.4"/>

    <rect x="216" y="116" width="11" height="11" fill="url(#campMarkZ5)" stroke="#5a2818" stroke-width="0.85"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowZ5)">
    <circle cx="180" cy="64" r="6" fill="#a87838" opacity="0.5"/>
    <circle cx="220" cy="68" r="6" fill="#a87838" opacity="0.5"/>
    <circle cx="180" cy="100" r="6" fill="#a87838" opacity="0.5"/>
    <rect x="210" y="110" width="22" height="22" fill="#fff8d8" opacity="0.7"/>
  </g>
  <g opacity="0.85" filter="url(#megaGlowZ5)">
    <rect x="200" y="100" width="40" height="40" fill="#a87838" opacity="0.55"/>
  </g>

  <g opacity="0.85">
    <text x="222" y="146" text-anchor="middle" font-family="Times New Roman, serif" font-size="3.4" fill="#fff8d8" font-style="italic" font-weight="700">CHURCH</text>
    <text x="222" y="152" text-anchor="middle" font-family="Times New Roman, serif" font-size="3" fill="#a87838" font-style="italic">basement</text>
  </g>

  <g>
    <ellipse cx="100" cy="130" rx="50" ry="80" fill="#3a261a"/>
    <ellipse cx="100" cy="110" rx="40" ry="56" fill="url(#faceSableZ5)"/>

    <path d="M 64 60 Q 100 44 136 60 Q 144 84 138 102 L 130 110 Q 116 70 100 64 Q 84 70 70 110 Z" fill="url(#hairSilZ5)"/>
    <path d="M 70 64 L 76 58 L 82 64 L 88 58 L 94 64 L 100 58 L 106 64 L 112 58 L 118 64 L 124 58 L 130 64" stroke="url(#hairSilZ5)" stroke-width="2.4" fill="none" opacity="0.85"/>

    <ellipse cx="120" cy="114" rx="5" ry="7" fill="#0a0604"/>
    <circle cx="120" cy="114" r="3" fill="#080404"/>
    <circle cx="123" cy="113" r="1.6" fill="url(#eyeEchoZ5)"/>

    <path d="M 96 100 Q 116 96 130 100" stroke="#0a0604" stroke-width="2" fill="none" stroke-linecap="round"/>

    <path d="M 134 144 Q 138 144 142 144" stroke="#0a0604" stroke-width="1.6" fill="none"/>

    <path d="M 140 160 L 144 160" stroke="#0a0604" stroke-width="2" stroke-linecap="round"/>

    <path d="M 56 180 Q 100 168 144 180 L 160 240 L 40 240 L 48 220 Z" fill="url(#silverFigZ5)"/>
    <path d="M 66 196 L 134 196 L 152 232 L 56 232 Z" fill="#1a1c20" opacity="0.85"/>
  </g>

  <g opacity="0.85">
    <line x1="138" y1="116" x2="180" y2="120" stroke="#a85820" stroke-width="0.55" stroke-dasharray="2 1.4" opacity="0.7"/>
  </g>

  <g opacity="0.85" filter="url(#bloomZ5)">
    <rect x="40" y="180" width="120" height="60" fill="#a85820" opacity="0.32"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="100" cy="246" rx="80" ry="3" fill="#040202"/>
  </g>

  <g opacity="0.55">
    <text x="155" y="52" text-anchor="middle" font-family="Times New Roman, serif" font-size="3" fill="#a87838" opacity="0.85" font-style="italic">— "STAY" —</text>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="160" height="22" rx="3" fill="#f5ecd8" opacity="0.9" stroke="#5a6478" stroke-width="0.7"/>
    <text x="74" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#5a6478" font-weight="700" opacity="0.7">SABLE — PROFILE</text>
    <text x="74" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.2" fill="#2a2a2a" font-style="italic" opacity="0.7">— recognizing the echo —</text>
  </g>
</svg>
