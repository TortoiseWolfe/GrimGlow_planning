<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 11 Page 7 Panel 3 — Thresh reads the ground approach</title>
  <desc>Close-up Thresh studying assigned route. Broad-shouldered muscular pale skin copper-red buzz cut dented crimson armor. Fingers trace approach on holographic projection — narrow streets, tight ground-level route. Hand rests on weapon, steady. Coexistence of fear and purpose — will do this, is afraid, both truths visible simultaneously in set of jaw and steadiness of eyes. Copper-gold projection light and stuttering crimson holographic edge-lighting. Bravery defined as acting afraid.</desc>
  <defs>
    <linearGradient id="bgZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperFillZ3" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonStutterZ3" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="crimsonArmorZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="hairBuzzZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="faceThreshZ3" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#a87838"/>
      <stop offset="1" stop-color="#dc4540"/>
    </linearGradient>
    <linearGradient id="rifleZ3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="eyeReadyZ3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#dc4540" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomZ3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.4"/>
    </filter>
    <filter id="stutterZ3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgZ3)"/>
  <rect width="246" height="240" fill="url(#copperFillZ3)"/>
  <rect width="246" height="240" fill="url(#crimsonStutterZ3)"/>

  <g>
    <rect x="0" y="200" width="246" height="40" fill="url(#floorZ3)"/>
    <line x1="0" y1="208" x2="246" y2="206" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g opacity="0.85">
    <rect x="160" y="40" width="74" height="100" fill="none" stroke="#a85820" stroke-width="0.4" opacity="0.7"/>

    <g opacity="0.85" stroke="#a85820" stroke-width="0.5" fill="none">
      <path d="M 168 80 L 178 80 L 178 96 L 188 96 L 188 80 L 200 80 L 200 110 L 220 110 L 220 90 L 232 90"/>
      <path d="M 168 60 L 232 60"/>
      <path d="M 168 130 L 232 130"/>
    </g>

    <path d="M 168 130 L 178 110 L 200 100 L 220 90 L 232 80" stroke="#dc4540" stroke-width="0.85" fill="none" stroke-dasharray="2 1.4"/>
    <circle cx="168" cy="130" r="3" fill="#dc4540"/>
    <circle cx="232" cy="80" r="3.4" fill="#dc4540" stroke="#5a1810" stroke-width="0.4"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowZ3)">
    <circle cx="232" cy="80" r="9" fill="#dc4540" opacity="0.62"/>
  </g>
  <g opacity="0.55">
    <text x="200" y="50" text-anchor="middle" font-family="Courier New, monospace" font-size="2.6" fill="#dc4540" opacity="0.85">CLOSE QUARTERS</text>
    <text x="200" y="155" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#dc4540" opacity="0.75">— ALLEY APPROACH 50s —</text>
  </g>

  <g>
    <ellipse cx="100" cy="100" rx="36" ry="46" fill="#3a261a"/>
    <ellipse cx="100" cy="80" rx="26" ry="28" fill="url(#faceThreshZ3)"/>

    <path d="M 76 56 Q 100 42 124 56 Q 130 76 124 86 L 118 96 Q 110 56 100 52 Q 90 56 80 96 Z" fill="url(#hairBuzzZ3)"/>
    <ellipse cx="124" cy="50" rx="9" ry="5" fill="url(#hairBuzzZ3)"/>

    <ellipse cx="88" cy="84" rx="3.4" ry="4" fill="#0a0604"/>
    <ellipse cx="112" cy="84" rx="3.4" ry="4" fill="#0a0604"/>
    <circle cx="88" cy="84" r="2" fill="#080404"/>
    <circle cx="112" cy="84" r="2" fill="#080404"/>
    <circle cx="89" cy="83" r="1.2" fill="url(#eyeReadyZ3)"/>
    <circle cx="113" cy="83" r="1.2" fill="url(#eyeReadyZ3)"/>

    <path d="M 76 72 Q 90 68 100 72" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 100 72 Q 112 68 124 72" stroke="#0a0604" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <path d="M 92 114 Q 100 110 110 114" stroke="#0a0604" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <path d="M 70 130 Q 100 120 130 130 L 144 200 L 56 200 L 64 168 Z" fill="url(#crimsonArmorZ3)"/>
    <path d="M 78 142 L 122 142 L 134 196 L 66 196 Z" fill="#1a0606" opacity="0.85"/>
    <path d="M 86 156 L 116 158 L 112 174 L 90 172 Z" fill="#5a1810" opacity="0.85"/>

    <path d="M 130 130 L 146 124 L 158 124" stroke="url(#crimsonArmorZ3)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="160" cy="124" rx="5" ry="3" fill="#7a4830"/>

    <path d="M 70 130 L 56 156 L 50 200" stroke="url(#crimsonArmorZ3)" stroke-width="13" fill="none" stroke-linecap="round"/>

    <rect x="160" y="120" width="40" height="6" fill="url(#rifleZ3)"/>
    <rect x="160" y="124" width="40" height="2" fill="#040404"/>
    <rect x="196" y="118" width="4" height="9" fill="#040404"/>
    <ellipse cx="180" cy="123" rx="6" ry="1" fill="#1a1a1a"/>
  </g>

  <g opacity="0.85">
    <path d="M 72 140 L 68 152 L 70 166" stroke="#dc4540" stroke-width="0.6" fill="none"/>
    <path d="M 128 140 L 132 152 L 130 166" stroke="#dc4540" stroke-width="0.6" fill="none"/>
    <path d="M 90 168 L 110 168" stroke="#dc4540" stroke-width="0.4" opacity="0.55"/>
  </g>
  <g opacity="0.95" filter="url(#stutterZ3)">
    <path d="M 72 140 L 68 152" stroke="#dc4540" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 128 140 L 132 152" stroke="#dc4540" stroke-width="2" fill="none" opacity="0.5"/>
    <ellipse cx="100" cy="172" rx="32" ry="3" fill="#dc4540" opacity="0.32"/>
  </g>

  <g opacity="0.85">
    <line x1="158" y1="124" x2="172" y2="120" stroke="#a85820" stroke-width="0.5" stroke-dasharray="2 1.4" opacity="0.7"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="100" cy="206" rx="44" ry="2.4" fill="#040202"/>
  </g>

  <g transform="translate(14,12)">
    <rect x="-6" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#8a2520" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#8a2520" font-weight="700">THRESH: "Ground approach.</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">Close quarters."</text>
  </g>
</svg>
