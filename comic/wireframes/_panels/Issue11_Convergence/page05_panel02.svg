<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 5 Panel 2 — Sable steps forward, "We could still leave"</title>
  <desc>Medium close-up Sable stepping forward toward holographic tactical projection. Dark brown skin sharp angular features silver-white hair catching copper-gold light. Looks at six amber-black target markers, expression moment before commitment — not hesitation but deliberation. Faint reflection visible in holographic surface, ghost of herself in tactical data. Copper-gold approach routes and amber-black device markers cast complex light across face — war mapped on her skin. Soot-darkened silver suit and tin-patched shoulder catch both light sources. The commander facing the choice that defines everything.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperFillY2" x1="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberMarksY2" cx="0.5" cy="0.32" r="0.42">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="silverFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6068"/>
      <stop offset="0.5" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="hairSilY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="faceSableY2" x1="0" y1="0" x2="0.85" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="eyeDeliberateY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tinPatchY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b0bc"/>
      <stop offset="0.5" stop-color="#5a6478"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="amberCoreY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
