<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 11 Page 11 Panel 2 — Theodore pulls back from the gap, "First light. I'll be ready."</title>
  <desc>Medium fairy-scale Theodore's enormous face recedes from wall gap — sandy-brown hair hazel eyes solemn freckles, expression of boy carrying responsibility beyond his years. Oil-stained hand lifts hybrid communications device — brass casing with blue-white glow inside — and pockets it carefully. Brickwork frames retreating face. Daylight brightens behind him. The boy who has grown into his role.</desc>
