    </linearGradient>
    <linearGradient id="hairSandyY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#7a3818"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <linearGradient id="faceTheoY2" x1="0" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#f4b860"/>
