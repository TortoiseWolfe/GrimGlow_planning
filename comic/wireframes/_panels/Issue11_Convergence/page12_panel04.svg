<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 220" width="494" height="220">
  <title>Issue 11 Page 12 Panel 4 — Jink turns toward Theodore, "If things go wrong tomorrow — you walk away."</title>
  <desc>Medium two-shot tiny figure in emerald metallic suit kneeling on lead flashing of rooftop, turned to face Victorian boy sitting at roof's edge. Tiny figure — lean androgynous bright golden blonde curly hair soot-streaked suit — forced calm over fear, composure borrowed from someone else, fitting badly. Boy turns slightly, sandy-brown hair catching moonlight. Scale: tiny figure at height of boy's resting hand, smaller than thumb. Moonlight from above gaslight from below faint emerald glow from wing-pack seams. The conversation beginning.</desc>
