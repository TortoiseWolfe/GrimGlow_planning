<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 220" width="494" height="220">
  <title>Issue 11 Page 9 Panel 4 — Wren briefs Theodore on the junction schematic</title>
  <desc>Medium eye level Wren pulls up detailed holographic schematic of underground cable junction in copper-gold geometric light — sub-surface chamber, conduit access, cable trunk layout, marked device location. Briefs operation with precision, gesturing at schematic. East Asian features messy dark hair oil-stained copper suit — speaking with respect of colleague not condescension. Schematic detailed but clear — stripped of jargon, designed for human apprentice's understanding. Copper-gold holographic light. The engineer teaching the boy.</desc>
  <defs>
    <linearGradient id="bgX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="copperFillX4" x1="0.55" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#5a2e10" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperFigX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="hairBlkX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceWrenX4" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a87838"/>
    </linearGradient>
    <radialGradient id="amberCoreX4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </radialGradient>
    <filter id="bloomX4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowX4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="megaGlowX4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>

  <rect width="494" height="220" fill="url(#bgX4)"/>
  <rect width="494" height="220" fill="url(#copperFillX4)"/>

  <g>
    <rect x="0" y="180" width="494" height="40" fill="url(#floorX4)"/>
    <line x1="0" y1="188" x2="494" y2="186" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g opacity="0.92">
    <rect x="180" y="20" width="294" height="160" fill="none" stroke="#a85820" stroke-width="0.55"/>

    <path d="M 220 50 L 220 60 L 200 60 L 200 80" stroke="#a85820" stroke-width="0.85" fill="none"/>
    <text x="195" y="46" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" font-weight="700">HATCH</text>
    <rect x="195" y="48" width="14" height="6" fill="none" stroke="#a85820" stroke-width="0.55"/>

    <rect x="200" y="80" width="240" height="80" fill="none" stroke="#a85820" stroke-width="0.85"/>
    <line x1="200" y1="100" x2="440" y2="100" stroke="#a85820" stroke-width="0.4" opacity="0.55"/>
    <line x1="200" y1="120" x2="440" y2="120" stroke="#a85820" stroke-width="0.55"/>
    <line x1="200" y1="140" x2="440" y2="140" stroke="#a85820" stroke-width="0.4" opacity="0.55"/>

    <text x="220" y="76" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" font-weight="700">ACCESS</text>
    <text x="320" y="76" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#fff8d8" font-weight="700">CABLE TRUNK CHAMBER</text>
    <text x="430" y="76" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" font-weight="700">EXIT</text>

    <line x1="220" y1="96" x2="240" y2="100" stroke="#a85820" stroke-width="2"/>
    <line x1="240" y1="100" x2="280" y2="120" stroke="#a85820" stroke-width="2"/>
    <line x1="280" y1="120" x2="320" y2="120" stroke="#a85820" stroke-width="2"/>
    <line x1="320" y1="120" x2="360" y2="120" stroke="#a85820" stroke-width="2"/>
    <line x1="360" y1="120" x2="400" y2="100" stroke="#a85820" stroke-width="2"/>
    <line x1="400" y1="100" x2="420" y2="96" stroke="#a85820" stroke-width="2"/>

    <line x1="220" y1="140" x2="240" y2="140" stroke="#a85820" stroke-width="0.85" opacity="0.85"/>
    <line x1="280" y1="140" x2="360" y2="140" stroke="#a85820" stroke-width="0.85" opacity="0.85"/>
    <line x1="400" y1="140" x2="420" y2="140" stroke="#a85820" stroke-width="0.85" opacity="0.85"/>

    <ellipse cx="320" cy="120" rx="14" ry="6" fill="url(#amberCoreX4)" stroke="#5a2818" stroke-width="0.7"/>
    <text x="320" y="123" text-anchor="middle" font-family="Courier New, monospace" font-size="4" fill="#080404" font-weight="900">DEVICE</text>

    <g opacity="0.85">
      <ellipse cx="296" cy="120" rx="3" ry="2" fill="#a87838" stroke="#5a2818" stroke-width="0.4"/>
      <text x="296" y="115" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820">Cu1</text>

      <ellipse cx="304" cy="120" rx="3" ry="2" fill="#a87838" stroke="#5a2818" stroke-width="0.4"/>
      <text x="304" y="115" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820">Cu2</text>

      <rect x="334" y="118" width="6" height="4" fill="#3a1a08" stroke="#5a2818" stroke-width="0.4"/>
      <text x="337" y="115" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820">In1</text>

      <rect x="342" y="118" width="6" height="4" fill="#3a1a08" stroke="#5a2818" stroke-width="0.4"/>
      <text x="345" y="115" text-anchor="middle" font-family="Courier New, monospace" font-size="2.4" fill="#a85820">In2</text>
    </g>

    <text x="320" y="172" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#fff8d8" font-weight="700">— DISCONNECT 4 COUPLINGS —</text>
    <text x="320" y="180" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a85820" opacity="0.85">copper first, then insulated, counter-clockwise</text>
  </g>
  <g opacity="0.95" filter="url(#strongGlowX4)">
    <ellipse cx="320" cy="120" rx="22" ry="9" fill="#a87838" opacity="0.65"/>
  </g>
  <g opacity="0.55" filter="url(#megaGlowX4)">
    <rect x="180" y="20" width="294" height="160" fill="#a85820" opacity="0.32"/>
  </g>

  <g>
    <ellipse cx="80" cy="100" rx="22" ry="26" fill="#3a261a"/>
    <ellipse cx="80" cy="86" rx="14" ry="16" fill="url(#faceWrenX4)"/>

    <path d="M 62 64 Q 80 50 98 64 Q 102 80 98 92 L 92 100 Q 86 74 80 68 Q 74 74 68 100 Z" fill="url(#hairBlkX4)"/>
    <ellipse cx="96" cy="58" rx="6" ry="4" fill="url(#hairBlkX4)"/>

    <ellipse cx="74" cy="88" rx="2.4" ry="3" fill="#0a0604"/>
    <ellipse cx="86" cy="88" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="75" cy="87" r="0.7" fill="#a87838"/>
    <circle cx="87" cy="87" r="0.7" fill="#a87838"/>

    <path d="M 66 80 Q 76 76 84 80" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M 82 80 Q 92 76 98 80" stroke="#0a0604" stroke-width="0.85" fill="none"/>

    <path d="M 72 104 Q 80 104 88 104" stroke="#0a0604" stroke-width="1" fill="none"/>

    <path d="M 56 120 Q 80 112 104 120 L 116 180 L 44 180 L 50 152 Z" fill="url(#copperFigX4)"/>
    <path d="M 64 132 L 96 132 L 104 176 L 56 176 Z" fill="#5a2e10" opacity="0.7"/>

    <path d="M 104 120 L 130 110 L 156 100 L 178 92" stroke="url(#copperFigX4)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="180" cy="90" rx="5" ry="4" fill="#9a5828"/>

    <path d="M 56 120 L 38 110 L 22 100" stroke="url(#copperFigX4)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="20" cy="98" rx="5" ry="4" fill="#9a5828"/>
  </g>

  <g opacity="0.85">
    <line x1="182" y1="84" x2="220" y2="60" stroke="#a85820" stroke-width="0.55" stroke-dasharray="2 1.4" opacity="0.7"/>
    <line x1="182" y1="92" x2="220" y2="100" stroke="#a85820" stroke-width="0.55" stroke-dasharray="2 1.4" opacity="0.7"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="80" cy="186" rx="40" ry="2.4" fill="#040202"/>
  </g>

  <g opacity="0.85" filter="url(#bloomX4)">
    <ellipse cx="80" cy="160" rx="56" ry="20" fill="#a85820" opacity="0.32"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="42" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#a85820" stroke-width="1.2"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a85820" font-weight="700">WREN: "Four couplings — two copper,</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">two insulated. The sequence matters.</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">I'll talk you through it on comms."</text>
    <text x="152" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#a85820" opacity="0.85">— copper first, counter-clockwise —</text>
  </g>
</svg>
