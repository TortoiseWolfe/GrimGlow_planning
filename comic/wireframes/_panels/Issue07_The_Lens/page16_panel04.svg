<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 360" width="742" height="360">
  <title>Issue 7 — Page 16 — Panel 4: Wide transitional — Jink and Wren on stone ledge, river vast, far bank ordinary, quiet before the turn</title>
  <desc>28mm wide from pier looking outward across river. Jink Wren small bottom of frame stone ledge. River fills frame — black water fog hanging surface far bank line dark industrial silhouette. Cranes warehouse rooflines chimneys moored barges. Gas lamps far bank dim amber smears in fog. River vast. Far bank distant. Visual breath before sighting. Far bank just far bank. Fog just fog. For now.</desc>

  <defs>
    <linearGradient id="i7p16p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#1a1c2a"/>
    </linearGradient>
    <linearGradient id="i7p16p4water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p16p4stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <radialGradient id="i7p16p4beam" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p16p4fog" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a3a4a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1a28" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p16p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p16p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p16p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p16p4megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="742" height="200" fill="url(#i7p16p4sky)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="80" cy="20" r="0.55"/>
    <circle cx="200" cy="40" r="0.4"/>
    <circle cx="320" cy="20" r="0.55"/>
    <circle cx="440" cy="40" r="0.55"/>
    <circle cx="560" cy="20" r="0.4"/>
    <circle cx="680" cy="40" r="0.55"/>
    <circle cx="120" cy="80" r="0.4"/>
    <circle cx="320" cy="100" r="0.4"/>
  </g>

  <!-- BEAM SWEEP across river -->
  <ellipse cx="600" cy="100" rx="320" ry="120" fill="url(#i7p16p4beam)" filter="url(#i7p16p4megaglow)"/>
  <path d="M0,140 L600,80 L600,140 L0,200 Z" fill="#ffd898" opacity="0.4" filter="url(#i7p16p4megaglow)"/>

  <!-- ===== FAR BANK silhouette ===== -->
  <ellipse cx="371" cy="200" rx="540" ry="40" fill="url(#i7p16p4fog)" filter="url(#i7p16p4strongglow)"/>
  <g fill="#1a1410" opacity="0.85">
    <rect x="0" y="160" width="80" height="40"/>
    <rect x="100" y="155" width="60" height="45"/>
    <rect x="180" y="160" width="80" height="40"/>
    <rect x="280" y="150" width="100" height="50"/>
    <rect x="400" y="160" width="80" height="40"/>
    <rect x="500" y="155" width="80" height="45"/>
    <rect x="600" y="160" width="60" height="40"/>
    <rect x="680" y="155" width="62" height="45"/>
  </g>
  <!-- Cranes far -->
  <g stroke="#0a0408" stroke-width="0.85" fill="none" opacity="0.85">
    <line x1="120" y1="160" x2="120" y2="100"/>
    <line x1="120" y1="100" x2="160" y2="120"/>
    <line x1="320" y1="150" x2="320" y2="80"/>
    <line x1="320" y1="80" x2="380" y2="100"/>
    <line x1="540" y1="155" x2="540" y2="100"/>
    <line x1="540" y1="100" x2="580" y2="120"/>
  </g>
  <!-- Distant amber gas lamps -->
  <g opacity="0.7" filter="url(#i7p16p4bloom)">
    <circle cx="60" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="160" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="240" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="380" cy="170" r="0.85" fill="#d89858"/>
    <circle cx="500" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="620" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="700" cy="180" r="0.85" fill="#d89858"/>
  </g>

  <!-- Moored barges far -->
  <g fill="#0a0408" opacity="0.85">
    <ellipse cx="100" cy="220" rx="40" ry="3"/>
    <rect x="80" y="210" width="40" height="10"/>
    <ellipse cx="500" cy="225" rx="40" ry="3"/>
    <rect x="480" y="215" width="40" height="10"/>
  </g>

  <!-- River — black, fog hanging at surface -->
  <rect x="0" y="200" width="742" height="120" fill="url(#i7p16p4water)"/>
  <!-- Beam reflection broken -->
  <g opacity="0.55" filter="url(#i7p16p4bloom)">
    <ellipse cx="600" cy="240" rx="100" ry="3" fill="#ffd898"/>
    <ellipse cx="600" cy="260" rx="80" ry="2" fill="#ffd898"/>
    <ellipse cx="600" cy="280" rx="60" ry="2" fill="#ffd898"/>
  </g>
  <!-- Distant lamp reflections -->
  <g opacity="0.55" filter="url(#i7p16p4bloom)">
    <ellipse cx="60" cy="240" rx="6" ry="1" fill="#d89858"/>
    <ellipse cx="240" cy="260" rx="6" ry="1" fill="#d89858"/>
    <ellipse cx="380" cy="280" rx="6" ry="1" fill="#d89858"/>
  </g>
  <!-- Fog wisps on water -->
  <g stroke="#5a5a6a" stroke-width="0.55" opacity="0.4" fill="none">
    <path d="M0,250 Q200,248 400,250 Q580,252 742,250"/>
    <path d="M0,290 Q200,288 400,290 Q580,292 742,290"/>
  </g>

  <!-- ===== STONE LEDGE bottom ===== -->
  <rect x="0" y="320" width="742" height="40" fill="url(#i7p16p4stone)"/>
  <line x1="0" y1="320" x2="742" y2="320" stroke="#1a1418" stroke-width="0.85"/>
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.7" fill="none">
    <line x1="80" y1="320" x2="80" y2="360"/>
    <line x1="240" y1="320" x2="240" y2="360"/>
    <line x1="380" y1="320" x2="380" y2="360"/>
    <line x1="520" y1="320" x2="520" y2="360"/>
    <line x1="660" y1="320" x2="660" y2="360"/>
  </g>

  <!-- ===== JINK + WREN tiny at bottom of frame ===== -->
  <g transform="translate(280 320)">
    <ellipse cx="0" cy="0" rx="6" ry="1" fill="#000" opacity="0.55"/>
    <path d="M-2,-1 L-2.4,-9 L0,-12 L2.4,-9 L3,-1 Z" fill="#2ed078"/>
    <ellipse cx="0" cy="-15" rx="2" ry="2" fill="#d8a878"/>
    <path d="M-1.5,-17 Q0,-19 0,-19 Q1.5,-19 1.5,-17 L1.5,-15 Q0.7,-16 0,-16 Q-0.7,-16 -1.5,-15 Z" fill="#f0d878"/>
  </g>
  <g transform="translate(310 320)">
    <ellipse cx="0" cy="0" rx="6" ry="1" fill="#000" opacity="0.55"/>
    <path d="M-2,-1 L-2.4,-9 L0,-12 L2.4,-9 L3,-1 Z" fill="#a85820"/>
    <!-- Lens disc on back -->
    <circle cx="-1" cy="-7" r="2" fill="none" stroke="#fff8c8" stroke-width="0.4" filter="url(#i7p16p4bloom)"/>
    <ellipse cx="0" cy="-15" rx="2" ry="2" fill="#a87838"/>
    <ellipse cx="0" cy="-18" rx="1.4" ry="0.7" fill="#1a0a04"/>
  </g>

  <!-- JINK -->
  <g>
    <rect x="14" y="14" width="466" height="50" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="240,64 252,64 244,76" fill="white" stroke="#2ed078" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Sable, we're at the waterline. Swap is clean.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Wren has the lens. Ready for extraction.</text>

  <!-- SABLE -->
  <g>
    <rect x="500" y="14" width="226" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="508" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="508" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Copy. Regroup. Good work.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q200,182 400,178 Q580,176 742,180"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
