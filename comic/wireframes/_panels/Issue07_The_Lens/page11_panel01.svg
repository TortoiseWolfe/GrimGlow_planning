<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 540" width="742" height="540">
  <title>Issue 7 — Page 11 — Panel 1: SPLASH — The Fresnel Lens Cathedral, the visual centerpiece of the issue</title>
  <desc>24mm wide low fairy scale half-page splash. Lamp room interior beings four inches tall. Massive Fresnel lens assembly fills room — concentric rings precision-ground glass mounted brass framework each ring taller than tiny figures. Glass refracts amber lamplight thousand geometric patterns dance every surface. Center oil lamp burns column amber fire. Below brass gears iron drive chains weight-driven escapement clicks visible precision. Three tiny figures at doorway — pewter-grey silver, oil-stained copper with glass disc, soot-streaked emerald — specks cool holographic light against warm amber cathedral.</desc>

  <defs>
    <radialGradient id="i7p11p1lampCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p11p1roomAmber" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p11p1iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p11p1brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c898"/>
      <stop offset="50%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="i7p11p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <filter id="i7p11p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p11p1glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i7p11p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p11p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="540" fill="url(#i7p11p1bg)"/>

  <!-- Room atmosphere wash -->
  <ellipse cx="371" cy="280" rx="540" ry="320" fill="url(#i7p11p1roomAmber)" filter="url(#i7p11p1megaglow)"/>

  <!-- ===== IRON ROOM walls/ceiling (frames the Fresnel) ===== -->
  <!-- Ceiling iron (top edge) -->
  <rect x="0" y="0" width="742" height="40" fill="url(#i7p11p1iron)"/>
  <line x1="0" y1="40" x2="742" y2="40" stroke="#0a0408" stroke-width="0.85"/>
  <!-- Iron rivets in ceiling -->
  <g fill="#5a5860">
    <circle cx="80" cy="20" r="2"/>
    <circle cx="220" cy="20" r="2"/>
    <circle cx="371" cy="20" r="2"/>
    <circle cx="520" cy="20" r="2"/>
    <circle cx="660" cy="20" r="2"/>
  </g>

  <!-- Iron walls (sides) -->
  <rect x="0" y="40" width="40" height="440" fill="url(#i7p11p1iron)"/>
  <rect x="702" y="40" width="40" height="440" fill="url(#i7p11p1iron)"/>
  <line x1="40" y1="40" x2="40" y2="480" stroke="#0a0408" stroke-width="0.85"/>
  <line x1="702" y1="40" x2="702" y2="480" stroke="#0a0408" stroke-width="0.85"/>

  <!-- Iron floor (bottom) -->
  <rect x="0" y="480" width="742" height="60" fill="url(#i7p11p1iron)"/>
  <line x1="0" y1="480" x2="742" y2="480" stroke="#0a0408" stroke-width="0.85"/>
  <!-- Floor diamond pattern -->
  <g stroke="#5a5860" stroke-width="0.55" opacity="0.85" fill="none">
    <path d="M40,500 L80,490 L120,500 L160,490 L200,500 L240,490 L280,500 L320,490 L371,500 L420,490 L460,500 L500,490 L540,500 L580,490 L620,500 L660,490 L702,500"/>
    <path d="M40,520 L80,510 L120,520 L160,510 L200,520 L240,510 L280,520 L320,510 L371,520 L420,510 L460,520 L500,510 L540,520 L580,510 L620,520 L660,510 L702,520"/>
  </g>

  <!-- ===== FRESNEL LENS ASSEMBLY — center, towering ===== -->
  <g transform="translate(371 280)">
    <!-- BRASS FRAMEWORK base (clockwork/gearbox below lens) -->
    <rect x="-200" y="160" width="400" height="40" fill="url(#i7p11p1brass)" stroke="#5a3018" stroke-width="0.85"/>
    <!-- Clockwork gears (visible large at fairy scale) -->
    <g stroke="#5a3018" stroke-width="0.55" fill="url(#i7p11p1brass)">
      <circle cx="-150" cy="180" r="22"/>
      <circle cx="-100" cy="180" r="14"/>
      <circle cx="-50" cy="180" r="20"/>
      <circle cx="50" cy="180" r="18"/>
      <circle cx="100" cy="180" r="14"/>
      <circle cx="150" cy="180" r="22"/>
    </g>
    <!-- Gear teeth (suggestion) -->
    <g stroke="#5a3018" stroke-width="0.55" fill="none">
      <line x1="-172" y1="180" x2="-176" y2="180"/>
      <line x1="-128" y1="180" x2="-124" y2="180"/>
      <line x1="-150" y1="158" x2="-150" y2="154"/>
      <line x1="-150" y1="202" x2="-150" y2="206"/>
      <line x1="172" y1="180" x2="176" y2="180"/>
      <line x1="150" y1="158" x2="150" y2="154"/>
    </g>
    <!-- Iron drive chain -->
    <line x1="-150" y1="180" x2="-100" y2="180" stroke="#1a1818" stroke-width="2"/>
    <line x1="-100" y1="180" x2="-50" y2="180" stroke="#1a1818" stroke-width="2"/>
    <line x1="50" y1="180" x2="100" y2="180" stroke="#1a1818" stroke-width="2"/>
    <line x1="100" y1="180" x2="150" y2="180" stroke="#1a1818" stroke-width="2"/>
    <!-- Chain links visible -->
    <g fill="#1a1818">
      <ellipse cx="-128" cy="180" rx="2" ry="3"/>
      <ellipse cx="-118" cy="180" rx="2" ry="3"/>
      <ellipse cx="-78" cy="180" rx="2" ry="3"/>
      <ellipse cx="-68" cy="180" rx="2" ry="3"/>
      <ellipse cx="68" cy="180" rx="2" ry="3"/>
      <ellipse cx="78" cy="180" rx="2" ry="3"/>
      <ellipse cx="118" cy="180" rx="2" ry="3"/>
      <ellipse cx="128" cy="180" rx="2" ry="3"/>
    </g>
    <!-- Weight-driven escapement -->
    <g transform="translate(0 200)">
      <circle cx="0" cy="0" r="14" fill="url(#i7p11p1brass)" stroke="#5a3018" stroke-width="0.85"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#5a3018" stroke-width="0.7"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#5a3018" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="3" fill="#5a3018"/>
    </g>

    <!-- Brass framework verticals supporting lens -->
    <line x1="-180" y1="-200" x2="-180" y2="160" stroke="url(#i7p11p1brass)" stroke-width="6"/>
    <line x1="180" y1="-200" x2="180" y2="160" stroke="url(#i7p11p1brass)" stroke-width="6"/>
    <line x1="0" y1="-260" x2="0" y2="-200" stroke="url(#i7p11p1brass)" stroke-width="3"/>
    <!-- Crossbeams -->
    <line x1="-180" y1="-200" x2="180" y2="-200" stroke="url(#i7p11p1brass)" stroke-width="3"/>
    <line x1="-180" y1="160" x2="180" y2="160" stroke="url(#i7p11p1brass)" stroke-width="3"/>

    <!-- ===== CONCENTRIC GLASS RINGS — Fresnel lens — towering ===== -->
    <g filter="url(#i7p11p1bloom)">
      <!-- Outermost ring (largest) -->
      <ellipse cx="0" cy="0" rx="180" ry="160" fill="none" stroke="#fff8c8" stroke-width="2" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="180" ry="160" fill="#ffd898" opacity="0.18"/>
      <!-- Ring 2 -->
      <ellipse cx="0" cy="0" rx="155" ry="138" fill="none" stroke="#fff8c8" stroke-width="1.4" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="155" ry="138" fill="#ffd898" opacity="0.18"/>
      <!-- Ring 3 (TARGET RING — slightly highlighted) -->
      <ellipse cx="0" cy="0" rx="130" ry="116" fill="none" stroke="#fff8c8" stroke-width="2" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="130" ry="116" fill="#ffe0a8" opacity="0.25"/>
      <!-- Ring 4 -->
      <ellipse cx="0" cy="0" rx="105" ry="94" fill="none" stroke="#fff8c8" stroke-width="1.4" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="105" ry="94" fill="#ffd898" opacity="0.18"/>
      <!-- Ring 5 -->
      <ellipse cx="0" cy="0" rx="80" ry="72" fill="none" stroke="#fff8c8" stroke-width="1.4" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="80" ry="72" fill="#ffd898" opacity="0.18"/>
      <!-- Ring 6 -->
      <ellipse cx="0" cy="0" rx="55" ry="50" fill="none" stroke="#fff8c8" stroke-width="1" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="55" ry="50" fill="#ffd898" opacity="0.18"/>
      <!-- Inner ring -->
      <ellipse cx="0" cy="0" rx="30" ry="28" fill="none" stroke="#fff8c8" stroke-width="0.85" opacity="0.95"/>
    </g>

    <!-- BRASS PIN MOUNTS visible at junctions (4 visible on outer rings) -->
    <g fill="url(#i7p11p1brass)" stroke="#5a3018" stroke-width="0.55">
      <ellipse cx="-180" cy="0" rx="6" ry="4"/>
      <ellipse cx="180" cy="0" rx="6" ry="4"/>
      <ellipse cx="0" cy="-160" rx="4" ry="6"/>
      <ellipse cx="0" cy="160" rx="4" ry="6"/>
      <ellipse cx="-130" cy="0" rx="4" ry="3"/>
      <ellipse cx="130" cy="0" rx="4" ry="3"/>
    </g>

    <!-- ===== OIL LAMP at center — column of amber fire ===== -->
    <ellipse cx="0" cy="0" rx="50" ry="80" fill="url(#i7p11p1lampCore)" filter="url(#i7p11p1strongglow)"/>
    <ellipse cx="0" cy="0" rx="22" ry="36" fill="#fff" filter="url(#i7p11p1bloom)"/>
    <!-- Flame shape -->
    <ellipse cx="0" cy="-9" rx="14" ry="22" fill="#fff8c8" filter="url(#i7p11p1bloom)"/>
    <ellipse cx="0" cy="-9" rx="9" ry="14" fill="#fff" filter="url(#i7p11p1bloom)"/>
    <!-- Lamp brass housing visible -->
    <rect x="-14" y="20" width="28" height="22" fill="url(#i7p11p1brass)" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Lamp wick -->
    <line x1="0" y1="0" x2="0" y2="20" stroke="#1a0c04" stroke-width="0.85"/>

    <!-- REFRACTED PATTERNS dancing on every surface -->
    <g opacity="0.7" filter="url(#i7p11p1bloom)">
      <!-- On left wall -->
      <ellipse cx="-260" cy="-100" rx="22" ry="6" fill="#fff8c8" opacity="0.55"/>
      <ellipse cx="-260" cy="0" rx="32" ry="9" fill="#fff8c8" opacity="0.55"/>
      <ellipse cx="-260" cy="100" rx="22" ry="6" fill="#fff8c8" opacity="0.55"/>
      <!-- On right wall -->
      <ellipse cx="260" cy="-100" rx="22" ry="6" fill="#fff8c8" opacity="0.55"/>
      <ellipse cx="260" cy="0" rx="32" ry="9" fill="#fff8c8" opacity="0.55"/>
      <ellipse cx="260" cy="100" rx="22" ry="6" fill="#fff8c8" opacity="0.55"/>
      <!-- On ceiling (above lens) -->
      <ellipse cx="-100" cy="-240" rx="22" ry="6" fill="#fff8c8" opacity="0.55"/>
      <ellipse cx="0" cy="-240" rx="32" ry="9" fill="#fff8c8" opacity="0.7"/>
      <ellipse cx="100" cy="-240" rx="22" ry="6" fill="#fff8c8" opacity="0.55"/>
      <!-- On floor (visible below lens, dancing pattern) -->
      <ellipse cx="-100" cy="220" rx="22" ry="3" fill="#ffd898" opacity="0.55"/>
      <ellipse cx="100" cy="220" rx="22" ry="3" fill="#ffd898" opacity="0.55"/>
    </g>

    <!-- Geometric refraction at ring boundaries (rainbow edges) -->
    <g opacity="0.85" filter="url(#i7p11p1bloom)">
      <ellipse cx="0" cy="0" rx="180" ry="160" fill="none" stroke="#a8c0e8" stroke-width="0.4" opacity="0.55"/>
      <ellipse cx="0" cy="0" rx="180" ry="160" fill="none" stroke="#ff8a78" stroke-width="0.4" opacity="0.4" transform="scale(1.005)"/>
    </g>
  </g>

  <!-- ===== TINY SQUAD at the doorway (LEFT side, gallery door) ===== -->
  <!-- Gallery door (left wall) -->
  <rect x="40" y="380" width="60" height="100" fill="url(#i7p11p1iron)" stroke="#0a0408" stroke-width="0.85"/>
  <!-- Door slightly open with crack of warm light -->
  <line x1="100" y1="380" x2="100" y2="480" stroke="#fff8c8" stroke-width="2" filter="url(#i7p11p1bloom)"/>

  <!-- SABLE (silver-blue) -->
  <g transform="translate(115 480)">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#a8c0e8" opacity="0.4" filter="url(#i7p11p1strongglow)"/>
    <path d="M-2,-2 L-3,-12 L0,-16 L3,-12 L2,-2 Z" fill="#506890"/>
    <ellipse cx="0" cy="-22" rx="3" ry="3.4" fill="#5a3a28"/>
    <path d="M-2,-25 Q-2,-26 0,-27 Q2,-26 2,-25 L2,-23 Q1,-24 0,-24 Q-1,-24 -2,-23 Z" fill="#d8e4f8"/>
    <ellipse cx="-1" cy="-22" rx="0.55" ry="0.4" fill="#fff8e8"/>
    <ellipse cx="1" cy="-22" rx="0.55" ry="0.4" fill="#fff8e8"/>
    <circle cx="-0.4" cy="-22" r="0.2" fill="#1a1c30"/>
    <circle cx="1.4" cy="-22" r="0.2" fill="#1a1c30"/>
  </g>

  <!-- WREN (copper-gold) — with lens disc -->
  <g transform="translate(140 480)">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#d89858" opacity="0.4" filter="url(#i7p11p1strongglow)"/>
    <path d="M-2,-2 L-3,-12 L0,-16 L3,-12 L2,-2 Z" fill="#a85820"/>
    <!-- Lens disc on back -->
    <circle cx="-1" cy="-9" r="3" fill="none" stroke="#fff8c8" stroke-width="0.55" filter="url(#i7p11p1bloom)"/>
    <ellipse cx="0" cy="-22" rx="3" ry="3.4" fill="#a87838"/>
    <ellipse cx="0" cy="-25" rx="2" ry="1.4" fill="#1a0a04"/>
    <ellipse cx="-1" cy="-22" rx="0.55" ry="0.4" fill="#fff"/>
    <ellipse cx="1" cy="-22" rx="0.55" ry="0.4" fill="#fff"/>
    <!-- Mouth open in awe -->
    <ellipse cx="0" cy="-19" rx="0.85" ry="0.7" fill="#1a0c04"/>
  </g>

  <!-- JINK (emerald) -->
  <g transform="translate(165 480)">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#5af0a0" opacity="0.4" filter="url(#i7p11p1strongglow)"/>
    <path d="M-2,-2 L-3,-12 L0,-16 L3,-12 L2,-2 Z" fill="#2ed078"/>
    <ellipse cx="0" cy="-22" rx="3" ry="3.4" fill="#d8a878"/>
    <path d="M-2,-25 Q-1,-28 0,-28 Q1,-28 2,-25 L2,-23 Q1,-24 0,-24 Q-1,-24 -2,-23 Z" fill="#f0d878"/>
    <circle cx="-1.5" cy="-26" r="0.85" fill="#f0d878"/>
    <circle cx="1.5" cy="-26" r="0.85" fill="#f0d878"/>
    <ellipse cx="-1" cy="-22" rx="0.55" ry="0.4" fill="#fff"/>
    <ellipse cx="1" cy="-22" rx="0.55" ry="0.4" fill="#fff"/>
    <circle cx="-1" cy="-22" r="0.2" fill="#1a4a28"/>
    <circle cx="1" cy="-22" r="0.2" fill="#1a4a28"/>
  </g>

  <!-- WREN -->
  <g>
    <rect x="14" y="14" width="160" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="80,48 92,48 84,58" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="80.5" y1="48" x2="91.5" y2="48" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1410">...oh.</text>

  <!-- JINK -->
  <g>
    <rect x="200" y="14" width="280" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95"/>
    <polygon points="280,54 292,54 284,64" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="280.5" y1="54" x2="291.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="208" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#2ed078" font-weight="700">JINK</text>
  <text x="208" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">You said that about the clockmaker too.</text>

  <!-- WREN -->
  <g>
    <rect x="500" y="14" width="226" height="50" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="580,64 592,64 584,76" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="580.5" y1="64" x2="591.5" y2="64" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="508" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN</text>
  <text x="508" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">This is different. Optics, mechanics,</text>
  <text x="508" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">and physics in one system.</text>

  <!-- SABLE -->
  <g>
    <rect x="14" y="490" width="280" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,490 112,490 104,480" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="100.5" y1="490" x2="111.5" y2="490" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="522" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Save the admiration. Clock's running.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
    <path d="M0,400 Q200,402 400,398 Q580,396 742,400"/>
  </g>
</svg>
