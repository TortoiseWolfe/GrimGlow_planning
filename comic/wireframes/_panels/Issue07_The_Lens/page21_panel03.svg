<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 7 — Page 21 — Panel 3: Sable alone, darkest corner, data module activated, corrupted file fragments — command isolation complete</title>
  <desc>50mm medium shot eye level. Sable alone in farthest corner. Standing — rigid posture, holding upright through force of will. Hand at forearm — data module gesture. Activates display. Tiny holographic display silver-white showing corrupted file fragments. Reads. Face does nothing. Command mask absolute. Reading something that makes the Titan sighting worse. She knows more than she has said.</desc>

  <defs>
    <linearGradient id="i7p21p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="i7p21p3timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i7p21p3silverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8ecf0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a8c8d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a4858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p21p3distantGlow" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a4858" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a2030" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p21p3suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#2a2a30"/>
    </linearGradient>
    <linearGradient id="i7p21p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <filter id="i7p21p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p21p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p21p3strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i7p21p3megaglow"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="i7p21p3dataPulse"><feGaussianBlur stdDeviation="0.85"/></filter>
  </defs>

  <rect width="742" height="280" fill="url(#i7p21p3bg)"/>

  <!-- Distant camp glow (left side, far away) -->
  <ellipse cx="0" cy="140" rx="280" ry="180" fill="url(#i7p21p3distantGlow)" filter="url(#i7p21p3megaglow)"/>

  <!-- Wall timbers (corner) -->
  <rect x="640" y="0" width="40" height="280" fill="url(#i7p21p3timber)"/>
  <rect x="0" y="240" width="742" height="40" fill="url(#i7p21p3timber)"/>
  <line x1="640" y1="0" x2="640" y2="240" stroke="#040408" stroke-width="0.85"/>
  <line x1="680" y1="0" x2="680" y2="240" stroke="#040408" stroke-width="0.85"/>
  <!-- Beam joint -->
  <rect x="630" y="230" width="60" height="14" fill="url(#i7p21p3timber)"/>

  <!-- Rusted nail -->
  <circle cx="650" cy="100" r="1.4" fill="#5a3818" opacity="0.85"/>
  <circle cx="660" cy="180" r="1.4" fill="#5a3818" opacity="0.85"/>

  <!-- ===== SABLE alone in corner ===== -->
  <g transform="translate(500 160)">
    <!-- Body — STANDING rigid -->
    <path d="M-22,80 L-26,40 L-30,9 L-26,-22 L-22,-50 L-9,-66 L9,-66 L22,-50 L26,-22 L30,9 L26,40 L22,80 Z" fill="url(#i7p21p3suit)"/>

    <!-- Soot bloom on suit -->
    <ellipse cx="-14" cy="20" rx="9" ry="14" fill="#0a0810" opacity="0.7"/>
    <ellipse cx="14" cy="-3" rx="6" ry="9" fill="#0a0810" opacity="0.55"/>

    <!-- Tension wear crease at collar -->
    <line x1="-9" y1="-58" x2="9" y2="-58" stroke="#1a1a20" stroke-width="0.85" opacity="0.85"/>

    <!-- Suit accent silver hologram -->
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#fff" stroke-width="0.4" opacity="0.7" filter="url(#i7p21p3bloom)"/>

    <!-- Legs (rigid, planted) -->
    <path d="M-9,80 L-11,140 L-3,140 L-3,80 Z" fill="url(#i7p21p3suit)"/>
    <path d="M3,80 L3,140 L11,140 L9,80 Z" fill="url(#i7p21p3suit)"/>

    <!-- Right arm at side -->
    <path d="M22,-22 L26,11 L18,30 L11,11 Z" fill="url(#i7p21p3suit)"/>
    <ellipse cx="22" cy="36" rx="4" ry="6" fill="url(#i7p21p3skin)"/>

    <!-- ===== LEFT ARM — pressed to forearm activating data module ===== -->
    <path d="M-22,-22 L-30,3 L-22,18 L-9,11 L-9,-11 Z" fill="url(#i7p21p3suit)"/>
    <!-- Forearm reaching across body -->
    <path d="M-22,18 L-9,30 L9,30 L11,18 Z" fill="url(#i7p21p3suit)"/>

    <!-- Hand pressed to opposite forearm -->
    <ellipse cx="-3" cy="22" rx="6" ry="3" fill="url(#i7p21p3skin)"/>
    <line x1="-7" y1="22" x2="-7" y2="25" stroke="#1a0808" stroke-width="0.4"/>
    <line x1="-3" y1="22" x2="-3" y2="25" stroke="#1a0808" stroke-width="0.4"/>
    <line x1="1" y1="22" x2="1" y2="25" stroke="#1a0808" stroke-width="0.4"/>

    <!-- ===== HOLOGRAPHIC DATA MODULE display ===== -->
    <g filter="url(#i7p21p3strongglow)" opacity="0.95">
      <ellipse cx="0" cy="-9" rx="50" ry="40" fill="url(#i7p21p3silverGlow)"/>
    </g>
    <!-- Display frame — silver-white geometric -->
    <g stroke="#e8ecf0" stroke-width="0.55" fill="none" filter="url(#i7p21p3bloom)" opacity="0.95">
      <rect x="-30" y="-32" width="60" height="40"/>
      <line x1="-30" y1="-22" x2="30" y2="-22"/>
      <line x1="-30" y1="-3" x2="30" y2="-3"/>
      <line x1="-15" y1="-32" x2="-15" y2="8"/>
      <line x1="15" y1="-32" x2="15" y2="8"/>
    </g>
    <!-- CORRUPTED data fragments — pulsing, glitching -->
    <g fill="#e8ecf0" filter="url(#i7p21p3dataPulse)" opacity="0.95">
      <text x="-26" y="-26" font-family="monospace" font-size="3.5">[ERR]</text>
      <text x="-9" y="-26" font-family="monospace" font-size="3.5">CORRUPT</text>
      <text x="18" y="-26" font-family="monospace" font-size="3.5">██</text>
      <text x="-26" y="-12" font-family="monospace" font-size="3.5">FILE://CLAS</text>
      <text x="0" y="-12" font-family="monospace" font-size="3.5">█████</text>
      <text x="20" y="-12" font-family="monospace" font-size="3.5">7</text>
      <text x="-26" y="3" font-family="monospace" font-size="3.5">TITAN_</text>
      <text x="-7" y="3" font-family="monospace" font-size="3.5">SIGHT::</text>
      <text x="14" y="3" font-family="monospace" font-size="3.5">[X]</text>
    </g>
    <!-- Glitch lines -->
    <g stroke="#fff" stroke-width="0.4" opacity="0.7" filter="url(#i7p21p3bloom)">
      <line x1="-30" y1="-15" x2="30" y2="-15" stroke-dasharray="2,1.5"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke-dasharray="1,2"/>
    </g>
    <!-- Unstable pulse -->
    <ellipse cx="0" cy="-9" rx="40" ry="3" fill="#e8ecf0" filter="url(#i7p21p3glow)" opacity="0.55"/>

    <!-- Neck -->
    <path d="M-7,-66 L7,-66 L4,-72 L-4,-72 Z" fill="url(#i7p21p3skin)"/>

    <!-- Head — face carved in silver-white glow -->
    <ellipse cx="0" cy="-86" rx="14" ry="16" fill="url(#i7p21p3skin)"/>

    <!-- Silver-white cropped hair -->
    <path d="M-14,-100 Q0,-104 14,-100 L14,-86 Q0,-90 -14,-86 Z" fill="#e8ecf0" opacity="0.95"/>
    <line x1="-9" y1="-100" x2="9" y2="-100" stroke="#fff" stroke-width="0.4" filter="url(#i7p21p3bloom)" opacity="0.7"/>

    <!-- Face lit by data display from below — uplit silver -->
    <ellipse cx="0" cy="-78" rx="11" ry="5" fill="#a8c8d8" opacity="0.55" filter="url(#i7p21p3bloom)"/>

    <!-- Brows — flat hard line -->
    <line x1="-9" y1="-94" x2="-3" y2="-94" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="3" y1="-94" x2="9" y2="-94" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Eyes — reading data -->
    <ellipse cx="-3" cy="-89" rx="2" ry="1" fill="#fff"/>
    <circle cx="-3" cy="-89" r="0.7" fill="#0a0a14"/>
    <ellipse cx="3" cy="-89" rx="2" ry="1" fill="#fff"/>
    <circle cx="3" cy="-89" r="0.7" fill="#0a0a14"/>

    <!-- Mouth — flat hard command line -->
    <line x1="-5" y1="-78" x2="5" y2="-78" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M-1,-86 L0,-80 L1,-78 Z" fill="#3a2010" opacity="0.55"/>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,220 Q120,222 240,218 Q360,216 494,220 Q620,218 742,220"/>
  </g>
</svg>
