<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 410" width="742" height="410">
  <title>Issue 7 — Page 9 — Panel 4: Thresh moving along pier toward overwatch — afraid, moving anyway</title>
  <desc>28mm wide low fairy scale. Thresh moves along edge of stone pier stretching over black water using low stone wall as cover weapon ready. Pier vast causeway at this scale rough stone surface salt deposits river weed. Lighthouse far end iron-and-brick amber lamp beam sweeping overhead. Black water both sides reflecting distant amber dock lanterns. Crimson glow small red point against dark stone. Distant focused afraid moving all at once.</desc>

  <defs>
    <linearGradient id="i7p9p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p9p4water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p9p4stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5860"/>
      <stop offset="50%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p9p4stoneWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <radialGradient id="i7p9p4lighthouseHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffe0a8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#d8a060" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p9p4beamSweep" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p9p4suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82030"/>
      <stop offset="100%" stop-color="#3a0c14"/>
    </linearGradient>
    <filter id="i7p9p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p9p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p9p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p9p4megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="410" fill="url(#i7p9p4bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="80" cy="20" r="0.55"/>
    <circle cx="220" cy="40" r="0.4"/>
    <circle cx="380" cy="20" r="0.55"/>
    <circle cx="540" cy="35" r="0.4"/>
    <circle cx="680" cy="20" r="0.55"/>
  </g>

  <!-- Beam sweeping past upper background -->
  <ellipse cx="600" cy="60" rx="320" ry="80" fill="url(#i7p9p4beamSweep)" filter="url(#i7p9p4megaglow)"/>

  <!-- ===== LIGHTHOUSE far right at end of pier ===== -->
  <g transform="translate(640 200)">
    <ellipse cx="0" cy="-30" rx="80" ry="60" fill="url(#i7p9p4lighthouseHalo)" filter="url(#i7p9p4megaglow)"/>
    <path d="M-12,40 L-9,-10 L-16,-20 L16,-20 L9,-10 L12,40 Z" fill="#3a2418"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#1a0c08" stroke-width="0.4" opacity="0.7"/>
    <line x1="-12" y1="20" x2="12" y2="20" stroke="#1a0c08" stroke-width="0.4" opacity="0.7"/>
    <rect x="-18" y="-34" width="36" height="14" fill="#1a1818" stroke="#0a0408" stroke-width="0.55"/>
    <ellipse cx="0" cy="-27" rx="14" ry="4" fill="#fff8c8" filter="url(#i7p9p4bloom)" opacity="0.95"/>
    <polygon points="-16,-34 0,-44 16,-34" fill="#1a1818"/>
    <line x1="0" y1="-44" x2="0" y2="-50" stroke="#0a0408" stroke-width="1"/>
    <!-- Beam arc visible -->
    <path d="M-18,-27 L-300,-50 L-300,-10 L-18,-22 Z" fill="#ffd898" opacity="0.4" filter="url(#i7p9p4megaglow)"/>
  </g>

  <!-- ===== STONE PIER stretching from foreground (lower left) to lighthouse (right) ===== -->
  <!-- Pier top surface -->
  <path d="M0,300 L742,240 L742,260 L0,320 Z" fill="url(#i7p9p4stone)"/>
  <line x1="0" y1="300" x2="742" y2="240" stroke="#0a0608" stroke-width="0.85"/>
  <line x1="0" y1="320" x2="742" y2="260" stroke="#0a0608" stroke-width="0.85"/>

  <!-- Low stone wall along pier edge (near side, where Thresh uses cover) -->
  <path d="M0,320 L742,260 L742,290 L0,360 Z" fill="url(#i7p9p4stoneWall)"/>
  <line x1="0" y1="360" x2="742" y2="290" stroke="#0a0608" stroke-width="0.55"/>

  <!-- Pier surface texture (salt deposits, river weed at fairy scale) -->
  <g fill="#a89878" opacity="0.7">
    <ellipse cx="120" cy="280" rx="22" ry="3"/>
    <ellipse cx="280" cy="265" rx="14" ry="2.4"/>
    <ellipse cx="500" cy="252" rx="11" ry="2"/>
  </g>
  <!-- River weed wisps -->
  <g stroke="#3a4838" stroke-width="0.7" opacity="0.7" fill="none">
    <path d="M180,290 Q200,288 220,290"/>
    <path d="M380,270 Q400,268 420,270"/>
    <path d="M580,250 Q600,248 620,250"/>
  </g>
  <!-- Stone pier seams -->
  <g stroke="#0a0608" stroke-width="0.4" opacity="0.55" fill="none">
    <line x1="100" y1="295" x2="100" y2="320"/>
    <line x1="240" y1="280" x2="240" y2="305"/>
    <line x1="380" y1="265" x2="380" y2="290"/>
    <line x1="520" y1="250" x2="520" y2="275"/>
  </g>

  <!-- Black water on both sides -->
  <rect x="0" y="360" width="742" height="50" fill="url(#i7p9p4water)"/>
  <rect x="0" y="0" width="742" height="240" fill="none"/>
  <!-- Water both sides of pier -->
  <path d="M0,260 L742,200 L742,240 L0,300 Z" fill="url(#i7p9p4water)" opacity="0.85"/>
  <!-- Water reflections -->
  <g opacity="0.55" filter="url(#i7p9p4bloom)">
    <ellipse cx="200" cy="380" rx="22" ry="2" fill="#d89858"/>
    <ellipse cx="500" cy="395" rx="22" ry="2" fill="#d89858"/>
    <ellipse cx="100" cy="220" rx="14" ry="1" fill="#d89858"/>
    <ellipse cx="400" cy="200" rx="14" ry="1" fill="#d89858"/>
  </g>
  <!-- Water reflection of lighthouse beam -->
  <g opacity="0.55" filter="url(#i7p9p4bloom)">
    <ellipse cx="600" cy="380" rx="80" ry="3" fill="#ffd898"/>
  </g>

  <!-- Distant dock lanterns far rear -->
  <g fill="#d89858" opacity="0.85" filter="url(#i7p9p4bloom)">
    <circle cx="60" cy="160" r="2"/>
    <circle cx="180" cy="155" r="2"/>
    <circle cx="320" cy="150" r="2"/>
  </g>

  <!-- ===== THRESH — small crimson figure moving along pier (mid-distance) ===== -->
  <g transform="translate(280 290)">
    <!-- Crimson glow halo -->
    <ellipse cx="0" cy="-12" rx="32" ry="22" fill="#ff5060" opacity="0.4" filter="url(#i7p9p4megaglow)"/>

    <ellipse cx="0" cy="2" rx="9" ry="2" fill="#000" opacity="0.85"/>

    <!-- Boots, mid-stride -->
    <ellipse cx="-7" cy="0" rx="5" ry="2" fill="#3a0c14"/>
    <ellipse cx="9" cy="2" rx="5" ry="2" fill="#3a0c14"/>

    <!-- Legs mid-stride -->
    <path d="M-9,-2 L-12,-22 L-2,-32 L0,-22 Z" fill="url(#i7p9p4suit)"/>
    <path d="M9,0 L12,-22 L2,-30 L0,-22 Z" fill="url(#i7p9p4suit)"/>
    <ellipse cx="-6" cy="-30" rx="4" ry="2" fill="#7a1a28"/>
    <ellipse cx="6" cy="-30" rx="4" ry="2" fill="#7a1a28"/>

    <!-- Torso forward lean -->
    <path d="M-12,-32 L-14,-60 L-7,-72 L7,-72 L14,-60 L12,-32 Z" fill="url(#i7p9p4suit)"/>
    <line x1="0" y1="-72" x2="0" y2="-32" stroke="#ff8898" stroke-width="0.4" opacity="0.85" filter="url(#i7p9p4bloom)"/>

    <!-- Dented LEFT pauldron -->
    <path d="M-14,-66 L-18,-62 L-18,-54 L-14,-58 Z" fill="#7a1a28"/>
    <line x1="-16" y1="-62" x2="-14" y2="-66" stroke="#3a0c14" stroke-width="0.85"/>
    <!-- FRESH SCRAPE on RIGHT pauldron -->
    <path d="M14,-66 L18,-62 L18,-54 L14,-58 Z" fill="#7a1a28"/>
    <path d="M12,-64 L20,-60" stroke="#a8b0c0" stroke-width="1.4" filter="url(#i7p9p4bloom)"/>
    <path d="M14,-62 L18,-60" stroke="#fff8e8" stroke-width="0.55" opacity="0.95" filter="url(#i7p9p4bloom)"/>

    <!-- Crimson nodes -->
    <circle cx="-12" cy="-58" r="0.85" fill="#ff5060" filter="url(#i7p9p4bloom)" opacity="0.95"/>
    <circle cx="12" cy="-58" r="0.85" fill="#ff5060" filter="url(#i7p9p4bloom)" opacity="0.95"/>

    <!-- Arms — weapon raised, ready -->
    <path d="M-14,-60 L-22,-50 L-12,-32 L-7,-50 Z" fill="url(#i7p9p4suit)"/>
    <path d="M14,-60 L22,-50 L12,-32 L7,-50 Z" fill="url(#i7p9p4suit)"/>
    <!-- Weapon in cover position -->
    <rect x="-14" y="-46" width="28" height="3" fill="#3a2828" stroke="#1a0c0a" stroke-width="0.4"/>
    <line x1="-14" y1="-44" x2="14" y2="-44" stroke="#dc2030" stroke-width="0.4" opacity="0.85" filter="url(#i7p9p4bloom)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-80" rx="6" ry="7" fill="#a87838"/>
    <path d="M-5,-86 Q-5,-90 0,-92 Q5,-90 5,-86 L5,-83 Q3,-86 0,-86 Q-3,-86 -5,-83 Z" fill="#a83828"/>
    <!-- Eyes ahead, focused -->
    <ellipse cx="-2" cy="-79" rx="1" ry="0.7" fill="#fff"/>
    <ellipse cx="2" cy="-79" rx="1" ry="0.7" fill="#fff"/>
    <circle cx="-2" cy="-79" r="0.4" fill="#3a5878"/>
    <circle cx="2" cy="-79" r="0.4" fill="#3a5878"/>
    <!-- Mouth set -->
    <line x1="-1.4" y1="-74" x2="1.4" y2="-74" stroke="#3a1808" stroke-width="0.4"/>
  </g>

  <!-- THRESH controlled comms -->
  <g>
    <rect x="14" y="14" width="280" height="40" rx="2" fill="white" stroke="#dc2030" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#dc2030" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#dc2030" font-weight="700">THRESH  <tspan font-style="italic" font-size="8" font-weight="500">(comms, controlled)</tspan></text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Moving to overwatch. I have the pier.</text>

  <!-- SABLE -->
  <g>
    <rect x="448" y="14" width="280" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="540,54 552,54 544,64" fill="white" stroke="#5a606a" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="456" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="456" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Copy.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
