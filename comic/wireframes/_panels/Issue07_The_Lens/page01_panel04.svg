<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 410" width="494" height="410">
  <title>Issue 7 — Page 1 — Panel 4: Two-phase op — Wren beside lighthouse hologram + mission timeline, Theodore daytime first phase</title>
  <desc>35mm medium wide slight low angle. Wren projects second hologram — mission timeline. Linear sequence: Theodore daytime acquisition, squad staging, nightfall, infiltration, swap, extraction. Glowing nodes connected by light-lines. She points at first phase. Looks toward wall gap where daylight filters. Two projections side by side casting competing geometric shadows.</desc>

  <defs>
    <linearGradient id="i7p1p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <radialGradient id="i7p1p4lighthouseGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p1p4timelineGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d89858" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2418" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p1p4daylightGap" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p1p4suit" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f0c898"/>
      <stop offset="50%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i7p1p4skin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f0c898"/>
      <stop offset="50%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i7p1p4beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <filter id="i7p1p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p1p4glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i7p1p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p1p4megaglow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="494" height="410" fill="url(#i7p1p4bg)"/>

  <!-- Wall gap with daylight on RIGHT edge -->
  <rect x="460" y="80" width="34" height="240" fill="url(#i7p1p4daylightGap)" filter="url(#i7p1p4strongglow)"/>
  <path d="M460,80 L460,320" stroke="#3a2818" stroke-width="0.85"/>

  <!-- Beams structural -->
  <rect x="0" y="0" width="494" height="40" fill="url(#i7p1p4beam)"/>
  <rect x="0" y="380" width="494" height="30" fill="url(#i7p1p4beam)"/>
  <line x1="0" y1="380" x2="494" y2="380" stroke="#5a3818" stroke-width="0.7" opacity="0.85"/>
  <rect x="20" y="0" width="14" height="410" fill="url(#i7p1p4beam)"/>
  <rect x="460" y="0" width="14" height="80" fill="url(#i7p1p4beam)"/>
  <rect x="460" y="320" width="14" height="90" fill="url(#i7p1p4beam)"/>

  <!-- ===== LIGHTHOUSE HOLOGRAM (LEFT) ===== -->
  <g transform="translate(150 200)">
    <ellipse cx="0" cy="0" rx="80" ry="100" fill="url(#i7p1p4lighthouseGlow)" filter="url(#i7p1p4megaglow)"/>
    <g stroke="#d89858" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#i7p1p4bloom)">
      <!-- Lighthouse body -->
      <path d="M-22,80 L-16,-30 L-26,-50 L26,-50 L16,-30 L22,80 Z"/>
      <!-- Lamp room -->
      <rect x="-32" y="-70" width="64" height="20"/>
      <!-- Lens housing -->
      <ellipse cx="0" cy="-60" rx="20" ry="7"/>
      <ellipse cx="0" cy="-60" rx="14" ry="5"/>
      <ellipse cx="0" cy="-60" rx="6" ry="2"/>
      <!-- Beam -->
      <line x1="-32" y1="-60" x2="-70" y2="-60"/>
      <line x1="32" y1="-60" x2="70" y2="-60"/>
      <!-- Spiral stairs -->
      <polyline points="-14,-30 14,-22 -14,-14 14,-6 -14,2 14,10 -14,18 14,26 -14,34 14,42 -14,50 14,58 -14,66 14,74"/>
      <!-- Roof -->
      <polygon points="-30,-70 0,-82 30,-70"/>
      <line x1="0" y1="-82" x2="0" y2="-90"/>
      <circle cx="0" cy="-92" r="1.4"/>
      <!-- Foundation/pier -->
      <rect x="-32" y="80" width="64" height="10"/>
      <line x1="-44" y1="90" x2="44" y2="90"/>
      <!-- Door -->
      <rect x="-3" y="68" width="6" height="12"/>
    </g>
    <!-- Entry markers -->
    <g fill="#ffe0a8" filter="url(#i7p1p4bloom)" opacity="0.95">
      <circle cx="0" cy="-60" r="2"/>
      <circle cx="0" cy="74" r="1.4"/>
    </g>
    <text x="-66" y="86" font-family="monospace" font-size="4" fill="#ffd898" filter="url(#i7p1p4bloom)" opacity="0.85">ENTRY POINT</text>
  </g>

  <!-- ===== MISSION TIMELINE (RIGHT of Wren, between her and wall gap) ===== -->
  <g transform="translate(370 200)">
    <ellipse cx="0" cy="0" rx="50" ry="120" fill="url(#i7p1p4timelineGlow)" filter="url(#i7p1p4strongglow)"/>
    <!-- Vertical timeline spine -->
    <line x1="0" y1="-90" x2="0" y2="100" stroke="#d89858" stroke-width="0.85" filter="url(#i7p1p4bloom)" opacity="0.95"/>

    <!-- Phase 1 — Theodore daytime (TOP, currently active/pulsing brightest) -->
    <g transform="translate(0 -80)">
      <circle cx="0" cy="0" r="6" fill="#ffd898" filter="url(#i7p1p4strongglow)" opacity="0.95"/>
      <circle cx="0" cy="0" r="3" fill="#fff8c8"/>
      <text x="10" y="-2" font-family="monospace" font-size="5" fill="#ffd898" filter="url(#i7p1p4bloom)" opacity="0.95">PHASE 1</text>
      <text x="10" y="6" font-family="monospace" font-size="4" fill="#ffd898" filter="url(#i7p1p4bloom)" opacity="0.85">DAYTIME</text>
    </g>

    <!-- Phase 2 — Stage at waterfront -->
    <g transform="translate(0 -40)">
      <circle cx="0" cy="0" r="4" fill="#d89858" filter="url(#i7p1p4bloom)" opacity="0.85"/>
      <text x="10" y="-2" font-family="monospace" font-size="4" fill="#d89858" opacity="0.85">PHASE 2</text>
      <text x="10" y="5" font-family="monospace" font-size="3.5" fill="#d89858" opacity="0.7">STAGING</text>
    </g>

    <!-- Phase 3 — Nightfall -->
    <g transform="translate(0 0)">
      <circle cx="0" cy="0" r="4" fill="#d89858" filter="url(#i7p1p4bloom)" opacity="0.7"/>
      <text x="10" y="-2" font-family="monospace" font-size="4" fill="#d89858" opacity="0.7">PHASE 3</text>
      <text x="10" y="5" font-family="monospace" font-size="3.5" fill="#d89858" opacity="0.55">NIGHTFALL</text>
    </g>

    <!-- Phase 4 — Infiltration -->
    <g transform="translate(0 40)">
      <circle cx="0" cy="0" r="4" fill="#d89858" filter="url(#i7p1p4bloom)" opacity="0.55"/>
      <text x="10" y="-2" font-family="monospace" font-size="4" fill="#d89858" opacity="0.55">PHASE 4</text>
      <text x="10" y="5" font-family="monospace" font-size="3.5" fill="#d89858" opacity="0.4">INFILTRATE</text>
    </g>

    <!-- Phase 5 — Lens swap -->
    <g transform="translate(0 80)">
      <circle cx="0" cy="0" r="4" fill="#d89858" filter="url(#i7p1p4bloom)" opacity="0.4"/>
      <text x="10" y="-2" font-family="monospace" font-size="4" fill="#d89858" opacity="0.4">PHASE 5</text>
      <text x="10" y="5" font-family="monospace" font-size="3.5" fill="#d89858" opacity="0.3">SWAP</text>
    </g>

    <!-- Phase 6 — Extraction (faintest) -->
    <g transform="translate(0 110)">
      <circle cx="0" cy="0" r="4" fill="#d89858" filter="url(#i7p1p4bloom)" opacity="0.3"/>
      <text x="10" y="-2" font-family="monospace" font-size="4" fill="#d89858" opacity="0.3">EXTRACT</text>
    </g>
  </g>

  <!-- ===== WREN — center between projections, pointing right at Phase 1, looking toward wall gap ===== -->
  <g transform="translate(260 380)">
    <ellipse cx="0" cy="-2" rx="14" ry="3" fill="#000" opacity="0.7"/>
    <!-- Boots -->
    <ellipse cx="-9" cy="-4" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="9" cy="-4" rx="5" ry="2" fill="#1a0c04"/>
    <!-- Trousers (slight stride forward) -->
    <path d="M-12,-4 L-16,-80 L-2,-100 L0,-80 Z" fill="url(#i7p1p4suit)"/>
    <path d="M12,-4 L16,-80 L2,-100 L0,-80 Z" fill="url(#i7p1p4suit)"/>

    <!-- Torso slight forward lean -->
    <path d="M-18,-100 L-22,-180 L-12,-200 L12,-200 L22,-180 L18,-100 Z" fill="url(#i7p1p4suit)"/>
    <line x1="0" y1="-200" x2="0" y2="-100" stroke="#ffd898" stroke-width="0.55" opacity="0.95" filter="url(#i7p1p4bloom)"/>
    <!-- Belt -->
    <rect x="-22" y="-108" width="44" height="6" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>

    <!-- Oil stains on forearms -->
    <ellipse cx="-26" cy="-160" rx="9" ry="6" fill="#0a0604" opacity="0.85"/>
    <ellipse cx="26" cy="-150" rx="6" ry="4" fill="#0a0604" opacity="0.85"/>

    <!-- LEFT arm bent at hip -->
    <path d="M-22,-180 L-30,-160 L-22,-130 L-12,-140 Z" fill="url(#i7p1p4suit)"/>
    <ellipse cx="-26" cy="-130" rx="5" ry="3" fill="url(#i7p1p4skin)"/>

    <!-- RIGHT arm extended pointing at timeline node -->
    <path d="M22,-180 L60,-176 L100,-170 L96,-162 L60,-168 L18,-170 Z" fill="url(#i7p1p4suit)"/>
    <!-- Hand -->
    <ellipse cx="100" cy="-166" rx="9" ry="5" fill="url(#i7p1p4skin)"/>
    <!-- Index finger pointing AT the bright Phase 1 node -->
    <ellipse cx="110" cy="-180" rx="2.4" ry="6" fill="url(#i7p1p4skin)"/>

    <!-- Neck -->
    <path d="M-9,-216 L-12,-200 L12,-200 L9,-216 Z" fill="url(#i7p1p4skin)"/>

    <!-- Head — turned toward wall gap (right), looking past timeline -->
    <ellipse cx="3" cy="-238" rx="20" ry="22" fill="url(#i7p1p4skin)"/>

    <!-- High messy bun -->
    <ellipse cx="3" cy="-262" rx="12" ry="8" fill="#0a0604"/>
    <path d="M-9,-262 Q-13,-266 -11,-260" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M15,-262 Q19,-266 17,-260" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M-15,-252 Q-3,-262 3,-262 Q15,-262 21,-252" stroke="#0a0604" stroke-width="2.4" fill="none"/>

    <!-- Cheekbone -->
    <path d="M-17,-238 Q-15,-220 -7,-210" fill="none" stroke="#3a1808" stroke-width="0.85" opacity="0.85"/>
    <path d="M23,-238 Q21,-220 13,-210" fill="none" stroke="#3a1808" stroke-width="0.85" opacity="0.85"/>

    <!-- Eyes — looking RIGHT toward gap -->
    <ellipse cx="-5" cy="-238" rx="3" ry="1.4" fill="#fff"/>
    <ellipse cx="11" cy="-238" rx="3" ry="1.4" fill="#fff"/>
    <ellipse cx="-3" cy="-238" rx="1.4" ry="1.0" fill="#3a1808"/>
    <ellipse cx="13" cy="-238" rx="1.4" ry="1.0" fill="#3a1808"/>
    <circle cx="-3" cy="-238" r="0.4" fill="#fff"/>
    <circle cx="13" cy="-238" r="0.4" fill="#fff"/>

    <!-- Brow -->
    <path d="M-12,-250 Q-5,-252 2,-250" stroke="#0a0604" stroke-width="1.4" fill="none"/>
    <path d="M22,-250 Q15,-252 8,-250" stroke="#0a0604" stroke-width="1.4" fill="none"/>

    <!-- Nose -->
    <path d="M1,-238 L0,-222 L3,-218 L6,-222 L5,-238 Z" fill="#3a1808" opacity="0.85"/>

    <!-- Mouth -->
    <ellipse cx="3" cy="-208" rx="2.4" ry="0.85" fill="#3a1808"/>
  </g>

  <!-- WREN dialogue 1 -->
  <g>
    <rect x="14" y="14" width="466" height="50" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="240,64 252,64 244,76" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="240.5" y1="64" x2="251.5" y2="64" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Two-phase op. Theodore acquires the replacement during the day.</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Standard purchase. Boy buying glass for his master.</text>

  <!-- WREN dialogue 2 -->
  <g>
    <rect x="14" y="346" width="466" height="50" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="240,346 252,346 244,336" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="240.5" y1="346" x2="251.5" y2="346" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Stage at the waterfront at dusk. Infiltrate after the keeper's first round.</text>
  <text x="22" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Swap. Extract. Done by two o'clock.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q120,162 240,158 Q360,156 494,160"/>
    <path d="M0,320 Q120,322 240,318 Q360,316 494,320"/>
  </g>
</svg>
