<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 7 — Page 18 — Panel 5: Counterpoint inside lantern room — keeper writing in logbook, void barely visible through glass behind</title>
  <desc>35mm medium wide inside lighthouse lantern room. Keeper at wooden desk writing leather logbook. Warm amber oil lamp. Through lantern room glass behind him dark river visible. Far bank — darkness darker than darkness around it, faintest oily iridescence at edges. Keeper does not look. Glass separates warm amber interior from cold dark exterior. Two worlds one frame. Mundane and monstrous sharing a single pane of glass.</desc>

  <defs>
    <linearGradient id="i7p18p5wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="i7p18p5desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="i7p18p5lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8a8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d89858" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p18p5lampCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d8"/>
      <stop offset="100%" stop-color="#d89858"/>
    </radialGradient>
    <linearGradient id="i7p18p5coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p18p5skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p18p5glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#040408" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="i7p18p5farBank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040204"/>
    </linearGradient>
    <radialGradient id="i7p18p5voidCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0610" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040208" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p18p5iridescence" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1838" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#1a1838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1838" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="i7p18p5pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0c8"/>
      <stop offset="100%" stop-color="#d8b878"/>
    </linearGradient>
    <filter id="i7p18p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p18p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p18p5strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p18p5megaglow"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="i7p18p5wrongness"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- Wall background interior -->
  <rect width="742" height="300" fill="url(#i7p18p5wall)"/>

  <!-- ===== LANTERN ROOM GLASS WINDOW (right two-thirds — view to outside) ===== -->
  <g>
    <!-- Window frame opening -->
    <rect x="320" y="20" width="380" height="240" fill="url(#i7p18p5glass)"/>

    <!-- Far bank dark silhouette through glass -->
    <g opacity="0.85">
      <rect x="320" y="160" width="80" height="80" fill="url(#i7p18p5farBank)"/>
      <rect x="420" y="150" width="60" height="90" fill="url(#i7p18p5farBank)"/>
      <!-- Gap where void stands -->
      <rect x="540" y="150" width="60" height="90" fill="url(#i7p18p5farBank)"/>
      <rect x="620" y="160" width="80" height="80" fill="url(#i7p18p5farBank)"/>
    </g>

    <!-- Distant amber dots — gap at void location -->
    <g opacity="0.7" filter="url(#i7p18p5bloom)">
      <circle cx="360" cy="200" r="0.85" fill="#d89858"/>
      <circle cx="450" cy="195" r="0.85" fill="#d89858"/>
      <!-- GAP at void -->
      <circle cx="570" cy="200" r="0.85" fill="#d89858"/>
      <circle cx="660" cy="200" r="0.85" fill="#d89858"/>
    </g>

    <!-- Fog over river -->
    <ellipse cx="500" cy="220" rx="220" ry="22" fill="#3a3a4a" opacity="0.4" filter="url(#i7p18p5strongglow)"/>

    <!-- ===== THE VOID through the glass — barely visible ===== -->
    <g transform="translate(510 180)">
      <!-- Wrongness halo -->
      <ellipse cx="0" cy="14" rx="40" ry="60" fill="url(#i7p18p5voidCore)" filter="url(#i7p18p5wrongness)"/>
      <!-- Body of void (smaller, distant) -->
      <path d="M-12,40 L-18,0 L-22,-32 L-18,-50 L0,-60 L18,-50 L22,-32 L18,0 L12,40 Z" fill="#040208" opacity="0.85"/>
      <!-- Iridescent edges -->
      <g opacity="0.7" filter="url(#i7p18p5wrongness)">
        <path d="M-18,0 L-22,-32 L0,-55 L22,-32 L18,0" fill="url(#i7p18p5iridescence)"/>
      </g>
      <g filter="url(#i7p18p5bloom)" opacity="0.55">
        <ellipse cx="-22" cy="-15" rx="3" ry="20" fill="#3a1838"/>
        <ellipse cx="22" cy="-15" rx="3" ry="20" fill="#3a1838"/>
      </g>
    </g>

    <!-- Window frame mullions -->
    <g stroke="#1a1410" stroke-width="3" fill="none">
      <line x1="320" y1="140" x2="700" y2="140"/>
      <line x1="510" y1="20" x2="510" y2="260"/>
    </g>
    <!-- Window outer frame -->
    <rect x="320" y="20" width="380" height="240" fill="none" stroke="#5a3818" stroke-width="6"/>

    <!-- Glass reflection — faint amber from interior lamp -->
    <ellipse cx="380" cy="100" rx="50" ry="22" fill="#d89858" opacity="0.18" filter="url(#i7p18p5glow)"/>
  </g>

  <!-- ===== INTERIOR — DESK and KEEPER (left two-thirds, with desk extending under window) ===== -->
  <!-- Desk surface -->
  <rect x="0" y="200" width="380" height="100" fill="url(#i7p18p5desk)"/>
  <!-- Desk wood grain -->
  <g stroke="#3a2010" stroke-width="0.55" opacity="0.55">
    <line x1="0" y1="220" x2="380" y2="220"/>
    <line x1="0" y1="240" x2="380" y2="240"/>
    <line x1="0" y1="260" x2="380" y2="260"/>
  </g>
  <!-- Desk front edge highlight -->
  <line x1="0" y1="200" x2="380" y2="200" stroke="#a8784a" stroke-width="0.85" filter="url(#i7p18p5bloom)" opacity="0.85"/>

  <!-- ===== OIL LAMP (warm amber pool of safety) ===== -->
  <g transform="translate(60 175)">
    <!-- Pool of light on desk -->
    <ellipse cx="0" cy="35" rx="100" ry="40" fill="url(#i7p18p5lampGlow)" filter="url(#i7p18p5megaglow)"/>
    <!-- Lamp base -->
    <ellipse cx="0" cy="22" rx="14" ry="3" fill="#5a3818"/>
    <rect x="-9" y="14" width="18" height="9" fill="#7a4828"/>
    <!-- Brass fittings -->
    <rect x="-7" y="6" width="14" height="9" fill="#a87838"/>
    <line x1="-7" y1="10" x2="7" y2="10" stroke="#5a3818" stroke-width="0.4"/>
    <!-- Glass chimney -->
    <path d="M-9,6 L-7,-22 L7,-22 L9,6 Z" fill="#fff8d8" opacity="0.7" filter="url(#i7p18p5bloom)"/>
    <!-- Flame glow -->
    <ellipse cx="0" cy="-9" rx="6" ry="11" fill="url(#i7p18p5lampCore)" filter="url(#i7p18p5glow)"/>
    <ellipse cx="0" cy="-9" rx="3" ry="6" fill="#fff8d8" filter="url(#i7p18p5bloom)"/>
  </g>

  <!-- ===== LOGBOOK on desk ===== -->
  <g transform="translate(180 220)">
    <!-- Book cover (leather, edges visible) -->
    <rect x="-50" y="-9" width="100" height="50" fill="#5a2818" stroke="#1a0808" stroke-width="0.85"/>
    <!-- Open pages -->
    <rect x="-46" y="-6" width="96" height="42" fill="url(#i7p18p5pageGrad)" filter="url(#i7p18p5bloom)"/>
    <!-- Page binding center -->
    <line x1="0" y1="-6" x2="0" y2="36" stroke="#3a2010" stroke-width="0.55"/>
    <!-- Writing on left page -->
    <g stroke="#1a0808" stroke-width="0.4" opacity="0.7">
      <line x1="-42" y1="0" x2="-7" y2="0"/>
      <line x1="-42" y1="6" x2="-9" y2="6"/>
      <line x1="-42" y1="12" x2="-3" y2="12"/>
      <line x1="-42" y1="18" x2="-9" y2="18"/>
      <line x1="-42" y1="24" x2="-7" y2="24"/>
      <line x1="-42" y1="30" x2="-15" y2="30"/>
    </g>
    <!-- Writing on right page (less, currently being written) -->
    <g stroke="#1a0808" stroke-width="0.4" opacity="0.7">
      <line x1="3" y1="0" x2="40" y2="0"/>
      <line x1="3" y1="6" x2="36" y2="6"/>
      <line x1="3" y1="12" x2="42" y2="12"/>
      <line x1="3" y1="18" x2="22" y2="18"/>
    </g>
  </g>

  <!-- ===== KEEPER at desk ===== -->
  <g transform="translate(120 220)">
    <!-- Body — peacoat, hunched at desk -->
    <path d="M-50,80 L-60,-22 L-50,-50 L-30,-66 L-7,-72 L14,-66 L22,-50 L30,-22 L38,80 Z" fill="url(#i7p18p5coat)"/>
    <!-- Coat buttons -->
    <circle cx="-22" cy="-30" r="1.4" fill="#7a5828" filter="url(#i7p18p5bloom)" opacity="0.85"/>
    <circle cx="-22" cy="-14" r="1.4" fill="#7a5828" filter="url(#i7p18p5bloom)" opacity="0.85"/>
    <circle cx="-22" cy="3" r="1.4" fill="#7a5828" filter="url(#i7p18p5bloom)" opacity="0.85"/>
    <!-- Coat seams -->
    <line x1="-22" y1="-50" x2="-22" y2="50" stroke="#0a0606" stroke-width="0.55"/>

    <!-- Shoulder warm light from lamp -->
    <path d="M14,-50 L30,-22 L38,40 L14,40 Z" fill="#a87838" opacity="0.4" filter="url(#i7p18p5bloom)"/>

    <!-- Neck -->
    <path d="M-14,-72 L14,-72 L11,-60 L-11,-60 Z" fill="url(#i7p18p5skin)"/>
    <!-- White collar -->
    <path d="M-16,-66 L-22,-50 L0,-58 L22,-50 L16,-66 Z" fill="#e8e0c8" opacity="0.85"/>

    <!-- Head — weathered face, looking down at logbook -->
    <ellipse cx="0" cy="-86" rx="22" ry="26" fill="url(#i7p18p5skin)"/>
    <!-- Hair — middle-aged, salt-pepper -->
    <path d="M-22,-110 Q-20,-118 -7,-118 Q7,-118 22,-110 L22,-94 Q11,-110 0,-110 Q-11,-110 -22,-94 Z" fill="#3a2818"/>
    <path d="M-18,-104 Q-9,-114 9,-114 Q14,-110 11,-104" fill="#5a4838" opacity="0.7"/>

    <!-- Thick sideburns -->
    <ellipse cx="-22" cy="-78" rx="6" ry="14" fill="#3a2818"/>
    <ellipse cx="22" cy="-78" rx="6" ry="14" fill="#3a2818"/>

    <!-- Brow shadow (face tilted down to logbook) -->
    <ellipse cx="0" cy="-88" rx="22" ry="6" fill="#5a3818" opacity="0.55"/>

    <!-- Eyes — closed/looking down -->
    <line x1="-14" y1="-86" x2="-7" y2="-86" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="7" y1="-86" x2="14" y2="-86" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M-3,-82 L-3,-72 L0,-68 L3,-72 L3,-82 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Moustache -->
    <path d="M-11,-72 Q0,-68 11,-72 L9,-66 Q0,-64 -9,-66 Z" fill="#3a2818"/>

    <!-- Mouth — neutral, working -->
    <line x1="-6" y1="-66" x2="6" y2="-66" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Warm amber rim light on face from lamp -->
    <ellipse cx="-14" cy="-86" rx="6" ry="14" fill="#ffe8a8" opacity="0.55" filter="url(#i7p18p5bloom)"/>
    <ellipse cx="-14" cy="-78" rx="3" ry="6" fill="#ffe8a8" opacity="0.7" filter="url(#i7p18p5bloom)"/>

    <!-- Right hand holding pen, writing -->
    <g transform="translate(30 0)">
      <ellipse cx="0" cy="0" rx="9" ry="11" fill="url(#i7p18p5skin)"/>
      <!-- Pen -->
      <line x1="6" y1="-3" x2="22" y2="-22" stroke="#1a0808" stroke-width="1.4"/>
      <line x1="20" y1="-20" x2="22" y2="-22" stroke="#3a2818" stroke-width="2"/>
      <!-- Pen nib glint -->
      <circle cx="6" cy="-3" r="0.85" fill="#a8b0c0" filter="url(#i7p18p5bloom)" opacity="0.85"/>
    </g>

    <!-- Left hand resting on logbook -->
    <ellipse cx="-30" cy="9" rx="9" ry="6" fill="url(#i7p18p5skin)"/>
  </g>

  <!-- Wall sconce / detail above keeper -->
  <g transform="translate(40 60)" opacity="0.7">
    <rect x="-7" y="0" width="14" height="3" fill="#5a3818"/>
    <rect x="-9" y="3" width="18" height="22" fill="#3a2818"/>
  </g>

  <!-- Lighthouse equipment hint upper area -->
  <g opacity="0.55" stroke="#5a3818" stroke-width="0.55" fill="none">
    <line x1="0" y1="40" x2="280" y2="40"/>
    <line x1="0" y1="80" x2="120" y2="80"/>
  </g>

  <!-- ===== CAPTIONS — NARRATIVE ===== -->
  <!-- CAPTION 1 (top) -->
  <g>
    <rect x="14" y="14" width="280" height="36" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">The keeper wrote about the tides. The wind.</text>
  <text x="22" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">The 10:40 barge. He did not write about the shape on the far bank.</text>

  <!-- CAPTION 2 (lower) -->
  <g>
    <rect x="448" y="260" width="280" height="28" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="456" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">He had not seen it. No one ever did.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
