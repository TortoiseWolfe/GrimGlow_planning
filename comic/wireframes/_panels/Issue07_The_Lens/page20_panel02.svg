<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 280" width="180" height="280">
  <title>Issue 7 — Page 20 — Panel 2: Jink close-up profile, jaw clenched, anger built on fear, the grin's absence makes them a different person</title>
  <desc>85mm tight profile. Jink. Frustration and fear competing same face. Jaw clenched. Wild golden curls still wind-tangled. Emerald collar shows salt-spray residue. Remnants of the grin visible — muscles pulled tight into something else. Something angry. Young beneath the anger. The grin's absence makes them a different person.</desc>

  <defs>
    <linearGradient id="i7p20p2bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1820" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a1812" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="i7p20p2coolGlow" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a3848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p2amber" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p20p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c898"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p20p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a6850"/>
      <stop offset="100%" stop-color="#1a3828"/>
    </linearGradient>
    <filter id="i7p20p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p20p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p20p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="180" height="280" fill="url(#i7p20p2bg)"/>

  <!-- Cool holographic perimeter glow from left -->
  <ellipse cx="0" cy="140" rx="80" ry="160" fill="url(#i7p20p2coolGlow)" filter="url(#i7p20p2megaglow)"/>
  <!-- Warm amber from above -->
  <ellipse cx="90" cy="0" rx="120" ry="60" fill="url(#i7p20p2amber)" filter="url(#i7p20p2megaglow)"/>

  <!-- ===== JINK profile (facing right) ===== -->
  <g transform="translate(70 140)">
    <!-- Neck -->
    <path d="M-3,40 L0,80 L14,80 L11,40 Z" fill="url(#i7p20p2skin)"/>
    <!-- Suit collar — emerald with salt-spray residue -->
    <path d="M-9,80 L18,80 L22,120 L-14,120 Z" fill="url(#i7p20p2suit)"/>
    <!-- Salt-spray residue (pale streak) -->
    <path d="M-7,90 L0,100 L14,90" stroke="#a8c8c0" stroke-width="0.85" opacity="0.55" fill="none"/>
    <!-- Suit accent dim -->
    <line x1="0" y1="80" x2="0" y2="120" stroke="#5af0a0" stroke-width="0.4" opacity="0.4" filter="url(#i7p20p2bloom)"/>

    <!-- Jaw — clenched, profile -->
    <path d="M-22,30 L-30,14 L-30,-14 L-22,-30 L-9,-44 L9,-44 L22,-32 L26,-9 L22,14 L11,30 L0,40 L-9,40 Z" fill="url(#i7p20p2skin)"/>

    <!-- Forehead/brow line -->
    <path d="M-22,-30 L-9,-44 L9,-44 L22,-32" stroke="#7a4818" stroke-width="0.85" fill="none" opacity="0.55"/>

    <!-- Wild golden curls (huge, tangled) -->
    <g fill="#f0d878" opacity="0.95">
      <ellipse cx="-9" cy="-50" rx="22" ry="14"/>
      <ellipse cx="-22" cy="-40" rx="14" ry="11"/>
      <ellipse cx="9" cy="-50" rx="14" ry="9"/>
      <circle cx="-30" cy="-50" r="9"/>
      <circle cx="-22" cy="-58" r="11"/>
      <circle cx="-9" cy="-62" r="9"/>
      <circle cx="9" cy="-62" r="9"/>
      <circle cx="-36" cy="-30" r="6"/>
      <circle cx="-32" cy="-22" r="5"/>
    </g>
    <!-- Curl detail -->
    <g fill="#a89838" opacity="0.7">
      <circle cx="-22" cy="-50" r="3"/>
      <circle cx="-7" cy="-58" r="3"/>
      <circle cx="-32" cy="-40" r="2"/>
    </g>
    <!-- Amber catch on tangled hair -->
    <ellipse cx="-9" cy="-58" rx="14" ry="6" fill="#ffe8a8" opacity="0.55" filter="url(#i7p20p2bloom)"/>

    <!-- Eye (profile, looking forward) — narrowed in anger -->
    <path d="M9,-30 L18,-32 L22,-28 L11,-26 Z" fill="#fff8e8"/>
    <circle cx="14" cy="-28" r="3" fill="#3a1808"/>
    <circle cx="14" cy="-28" r="1.4" fill="#0a0408"/>
    <!-- Brow — hard down line (anger) -->
    <line x1="3" y1="-36" x2="22" y2="-32" stroke="#3a1808" stroke-width="2"/>
    <!-- Lashes -->
    <line x1="11" y1="-32" x2="11" y2="-36" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="18" y1="-34" x2="18" y2="-38" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M22,-22 L26,-9 L24,0 L22,3 Z" fill="#7a4818" opacity="0.7"/>

    <!-- Mouth — clenched, tight, NOT a grin -->
    <line x1="11" y1="11" x2="22" y2="9" stroke="#3a1808" stroke-width="2"/>
    <!-- Tension at jaw muscle (the grin muscles pulled tight) -->
    <ellipse cx="-3" cy="14" rx="3" ry="2" fill="#7a4818" opacity="0.55"/>

    <!-- Cheek shadow — gauntness from the operation -->
    <ellipse cx="0" cy="3" rx="9" ry="11" fill="#5a3018" opacity="0.4"/>

    <!-- Ear with comms -->
    <ellipse cx="-3" cy="-22" rx="3" ry="6" fill="url(#i7p20p2skin)"/>
    <circle cx="-3" cy="-22" r="0.85" fill="#5af0a0" filter="url(#i7p20p2bloom)" opacity="0.85"/>
  </g>

  <!-- ===== DIALOGUE — JINK ===== -->
  <g>
    <rect x="9" y="14" width="160" height="48" rx="2" fill="white" stroke="#2e8b57" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="14" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2e8b57" font-weight="700">JINK</text>
  <text x="14" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">Then what do we DO?</text>
  <text x="14" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">Wait for it to cross the river?</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q45,142 90,138 Q135,136 180,140"/>
  </g>
</svg>
