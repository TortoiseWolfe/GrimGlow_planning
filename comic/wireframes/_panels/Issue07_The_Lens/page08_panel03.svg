<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 400" width="238" height="400">
  <title>Issue 7 — Page 8 — Panel 3: Thresh prone — fresh shoulder scrape, post-adrenaline freeze, can't move</title>
  <desc>85mm close-up eye level fairy scale. Thresh pressed flat against stone quay surface face against ground hands over head. Boot has passed dockworker continues unaware. Grit and stone dust settle. Fresh scrape mark visible across right shoulder plate — crimson paint scored to bare metal. Alive unhurt can't move. Freeze paralysis set in. Body won't respond. Rapid shallow breathing. Eyes wide unfocused. Crimson glow pulses erratically.</desc>

  <defs>
    <linearGradient id="i7p8p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#080608"/>
    </linearGradient>
    <linearGradient id="i7p8p3stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p8p3suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82030"/>
      <stop offset="100%" stop-color="#3a0c14"/>
    </linearGradient>
    <linearGradient id="i7p8p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <radialGradient id="i7p8p3recedingAmber" cx="100%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#a87838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p8p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p8p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p8p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="238" height="400" fill="url(#i7p8p3bg)"/>

  <!-- Receding amber glow upper right -->
  <ellipse cx="280" cy="20" rx="200" ry="120" fill="url(#i7p8p3recedingAmber)" filter="url(#i7p8p3strongglow)"/>

  <!-- ===== STONE QUAY — close-up surface ===== -->
  <rect x="0" y="0" width="238" height="400" fill="url(#i7p8p3stone)"/>
  <!-- Quay seams at scale -->
  <g stroke="#0a0608" stroke-width="0.55" opacity="0.85" fill="none">
    <path d="M0,80 L238,80"/>
    <path d="M0,200 L238,200"/>
    <path d="M0,320 L238,320"/>
  </g>
  <!-- Stone texture cracks -->
  <g stroke="#0a0608" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M40,40 L50,80"/>
    <path d="M180,140 L160,200"/>
    <path d="M80,260 L100,320"/>
    <path d="M200,360 L220,400"/>
  </g>

  <!-- Scattered stone dust grains around figure -->
  <g fill="#a89878" opacity="0.85" filter="url(#i7p8p3bloom)">
    <circle cx="60" cy="180" r="1.4"/>
    <circle cx="80" cy="190" r="1"/>
    <circle cx="100" cy="170" r="1.4"/>
    <circle cx="160" cy="180" r="1"/>
    <circle cx="180" cy="200" r="1.4"/>
    <ellipse cx="120" cy="280" rx="3" ry="1"/>
    <ellipse cx="160" cy="260" rx="2" ry="0.85"/>
    <circle cx="40" cy="220" r="1"/>
  </g>

  <!-- ===== THRESH — pressed FLAT, prone, hands over head ===== -->
  <g transform="translate(119 220)">
    <!-- Cast shadow tight under body -->
    <ellipse cx="0" cy="40" rx="60" ry="6" fill="#000" opacity="0.7"/>

    <!-- Crimson glow erratic pulse halo -->
    <ellipse cx="0" cy="0" rx="80" ry="40" fill="#ff5060" opacity="0.4" filter="url(#i7p8p3strongglow)"/>

    <!-- Body lying flat (top-down view) -->
    <!-- Legs stretched -->
    <path d="M-22,30 L-30,80 L0,90 L0,30 Z" fill="url(#i7p8p3suit)"/>
    <path d="M22,30 L30,80 L0,90 L0,30 Z" fill="url(#i7p8p3suit)"/>
    <ellipse cx="-18" cy="80" rx="9" ry="3" fill="#3a0c14"/>
    <ellipse cx="18" cy="80" rx="9" ry="3" fill="#3a0c14"/>

    <!-- Torso flat on ground -->
    <ellipse cx="0" cy="0" rx="40" ry="32" fill="url(#i7p8p3suit)"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ff8898" stroke-width="0.7" opacity="0.85" filter="url(#i7p8p3bloom)"/>

    <!-- Dented LEFT pauldron (visible above body) -->
    <ellipse cx="-44" cy="-14" rx="14" ry="6" fill="#7a1a28"/>
    <line x1="-50" y1="-14" x2="-44" y2="-18" stroke="#3a0c14" stroke-width="1.4"/>

    <!-- ===== FRESH BOOT-LEATHER SCRAPE on RIGHT shoulder plate ===== -->
    <ellipse cx="44" cy="-14" rx="14" ry="6" fill="#7a1a28"/>
    <!-- THE SCRAPE — paint scored to bare metal -->
    <path d="M30,-18 L58,-10" stroke="#a8b0c0" stroke-width="2.4" filter="url(#i7p8p3bloom)"/>
    <path d="M32,-16 L56,-12" stroke="#fff8e8" stroke-width="0.85" opacity="0.95" filter="url(#i7p8p3bloom)"/>
    <!-- Curling paint flakes -->
    <ellipse cx="36" cy="-20" rx="2" ry="1" fill="#a82030" opacity="0.85"/>
    <ellipse cx="50" cy="-8" rx="1.4" ry="0.85" fill="#a82030" opacity="0.85"/>

    <!-- Crimson nodes pulsing erratically -->
    <circle cx="-22" cy="-9" r="2.4" fill="#ff5060" filter="url(#i7p8p3bloom)" opacity="0.95"/>
    <circle cx="22" cy="-9" r="1.4" fill="#ff5060" filter="url(#i7p8p3bloom)" opacity="0.7"/>
    <circle cx="0" cy="9" r="2" fill="#ff5060" filter="url(#i7p8p3bloom)" opacity="0.85"/>

    <!-- HANDS over HEAD (defensive position) -->
    <path d="M-30,-22 L-50,-30 L-40,-46 L-22,-30 Z" fill="url(#i7p8p3suit)"/>
    <path d="M30,-22 L50,-30 L40,-46 L22,-30 Z" fill="url(#i7p8p3suit)"/>
    <!-- Hands -->
    <ellipse cx="-50" cy="-30" rx="6" ry="3" fill="url(#i7p8p3skin)"/>
    <ellipse cx="50" cy="-30" rx="6" ry="3" fill="url(#i7p8p3skin)"/>
    <!-- WEAPON still in right hand grip -->
    <rect x="56" y="-32" width="14" height="3" fill="#3a2828" stroke="#1a0c0a" stroke-width="0.4"/>
    <ellipse cx="50" cy="-30" rx="3" ry="2" fill="#fff8e8" filter="url(#i7p8p3bloom)" opacity="0.55"/>

    <!-- Head face-down -->
    <ellipse cx="0" cy="-32" rx="14" ry="14" fill="url(#i7p8p3skin)"/>
    <!-- Copper-red buzz cut -->
    <path d="M-12,-44 Q-12,-46 0,-46 Q12,-46 12,-44 L12,-40 Q6,-42 0,-42 Q-6,-42 -12,-40 Z" fill="#a83828"/>
    <!-- Cheek pressed against ground -->
    <ellipse cx="0" cy="-26" rx="9" ry="3" fill="#7a4828" opacity="0.55"/>
    <!-- One eye visible — wide, unfocused -->
    <ellipse cx="-6" cy="-32" rx="2.4" ry="1.4" fill="#fff"/>
    <ellipse cx="-6" cy="-30" rx="1.4" ry="1" fill="#3a1808"/>
    <circle cx="-6" cy="-30" r="0.4" fill="#fff"/>
    <!-- Brow tense -->
    <path d="M-12,-40 Q-6,-42 0,-40" stroke="#3a1808" stroke-width="0.85" fill="none"/>
  </g>

  <!-- THRESH whisper -->
  <g>
    <rect x="14" y="14" width="200" height="40" rx="2" fill="white" stroke="#dc2030" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="80,54 92,54 84,64" fill="white" stroke="#dc2030" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#dc2030" font-weight="700">THRESH  <tspan font-style="italic" font-size="8" font-weight="500">(barely)</tspan></text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">...clear. He's past.</text>

  <!-- LUMA -->
  <g>
    <rect x="14" y="340" width="200" height="50" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="80,340 92,340 84,330" fill="white" stroke="#5a3ad8" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a3ad8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I'm coming to you.</text>
  <text x="22" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Stay where you are.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q60,162 120,158 Q180,156 238,160"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 238,300"/>
  </g>
</svg>
