<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 280" width="180" height="280">
  <title>Issue 7 — Page 20 — Panel 4: Sable close-up — the mask holds, eyes have changed, fracture line visible to reader, command isolation deepening</title>
  <desc>85mm close-up. Sable's face. Two squad members challenging her. Command isolation deepening real time. Absorbs Thresh's words, Jink's anger. Processes. Decides. Answer is no. Ice — but ice has fracture line, visible to reader not squad. Behind calculation: exhaustion. Half face warm amber from above, half cool holographic from perimeter.</desc>

  <defs>
    <linearGradient id="i7p20p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <radialGradient id="i7p20p4amber" cx="100%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p4holo" cx="0%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a3848" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p20p4skinWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="i7p20p4skinCool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4858"/>
      <stop offset="100%" stop-color="#2a1a28"/>
    </linearGradient>
    <linearGradient id="i7p20p4suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c8d0"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </linearGradient>
    <filter id="i7p20p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p20p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p20p4megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="180" height="280" fill="url(#i7p20p4bg)"/>

  <!-- Warm amber from upper right -->
  <ellipse cx="180" cy="0" rx="160" ry="200" fill="url(#i7p20p4amber)" filter="url(#i7p20p4megaglow)"/>
  <!-- Cool holographic from lower left -->
  <ellipse cx="0" cy="280" rx="160" ry="200" fill="url(#i7p20p4holo)" filter="url(#i7p20p4megaglow)"/>

  <!-- ===== SABLE close-up — split-lit face ===== -->
  <g transform="translate(90 140)">
    <!-- Suit collar (silver, soot bloom) -->
    <path d="M-32,80 L-22,60 L22,60 L32,80 L40,140 L-40,140 Z" fill="url(#i7p20p4suit)"/>
    <!-- Tension wear crease -->
    <line x1="-22" y1="80" x2="22" y2="80" stroke="#1a1a20" stroke-width="0.7" opacity="0.85"/>
    <!-- Soot bloom on suit -->
    <ellipse cx="-14" cy="100" rx="11" ry="6" fill="#1a1410" opacity="0.7"/>
    <!-- Suit accent silver hologram -->
    <line x1="0" y1="60" x2="0" y2="120" stroke="#fff" stroke-width="0.4" opacity="0.7" filter="url(#i7p20p4bloom)"/>

    <!-- Neck — split lit -->
    <path d="M-9,60 L9,60 L9,40 L-9,40 Z" fill="url(#i7p20p4skinWarm)"/>
    <path d="M-9,60 L0,60 L0,40 L-9,40 Z" fill="url(#i7p20p4skinCool)"/>

    <!-- Head — angular features, split lit -->
    <!-- Right side warm -->
    <path d="M0,-50 L18,-44 L26,-22 L26,9 L18,30 L0,40 Z" fill="url(#i7p20p4skinWarm)"/>
    <!-- Left side cool -->
    <path d="M0,-50 L-18,-44 L-26,-22 L-26,9 L-18,30 L0,40 Z" fill="url(#i7p20p4skinCool)"/>

    <!-- Silver-white cropped hair, very short military -->
    <path d="M-26,-50 Q-22,-58 -14,-60 L0,-62 L14,-60 Q22,-58 26,-50 L26,-30 Q14,-44 0,-44 Q-14,-44 -26,-30 Z" fill="#e8ecf0" opacity="0.95"/>
    <!-- Hair texture -->
    <g stroke="#fff" stroke-width="0.4" opacity="0.55" filter="url(#i7p20p4bloom)">
      <line x1="-22" y1="-54" x2="-9" y2="-54"/>
      <line x1="-7" y1="-58" x2="9" y2="-58"/>
      <line x1="9" y1="-54" x2="22" y2="-54"/>
    </g>

    <!-- Brow shadow split -->
    <path d="M0,-30 L18,-30 L22,-22 L0,-22 Z" fill="#5a3818" opacity="0.55"/>
    <path d="M0,-30 L-18,-30 L-22,-22 L0,-22 Z" fill="#1a1018" opacity="0.55"/>

    <!-- Brows — flat hard command line -->
    <line x1="-22" y1="-22" x2="-7" y2="-26" stroke="#1a0808" stroke-width="2"/>
    <line x1="7" y1="-26" x2="22" y2="-22" stroke="#1a0808" stroke-width="2"/>

    <!-- Eyes — calculating, fracture visible to reader -->
    <ellipse cx="-9" cy="-14" rx="5" ry="3" fill="#fff8e8"/>
    <circle cx="-9" cy="-14" r="2" fill="#3a2818"/>
    <circle cx="-9" cy="-14" r="1" fill="#0a0408"/>
    <ellipse cx="9" cy="-14" rx="5" ry="3" fill="#fff8e8"/>
    <circle cx="9" cy="-14" r="2" fill="#3a2818"/>
    <circle cx="9" cy="-14" r="1" fill="#0a0408"/>
    <!-- Tiny tell — slight lower lid tension (exhaustion) -->
    <line x1="-14" y1="-9" x2="-3" y2="-9" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>
    <line x1="3" y1="-9" x2="14" y2="-9" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>

    <!-- Catchlight — amber on right eye, cool on left -->
    <circle cx="-7" cy="-16" r="0.85" fill="#a8c8d8" filter="url(#i7p20p4bloom)" opacity="0.85"/>
    <circle cx="11" cy="-16" r="0.85" fill="#ffd898" filter="url(#i7p20p4bloom)" opacity="0.85"/>

    <!-- Nose -->
    <path d="M-3,-9 L0,11 L3,11 L3,-9 Z" fill="#7a4818" opacity="0.55"/>
    <line x1="-2" y1="11" x2="2" y2="11" stroke="#3a1808" stroke-width="0.4"/>

    <!-- Mouth — flat hard command line -->
    <line x1="-9" y1="22" x2="9" y2="22" stroke="#1a0808" stroke-width="1.4"/>
    <!-- Subtle tightness at corners (jaw clench) -->
    <ellipse cx="-9" cy="22" rx="1.4" ry="0.85" fill="#3a1808" opacity="0.55"/>
    <ellipse cx="9" cy="22" rx="1.4" ry="0.85" fill="#3a1808" opacity="0.55"/>

    <!-- Cheekbone shadow -->
    <ellipse cx="-14" cy="3" rx="6" ry="9" fill="#1a1018" opacity="0.55"/>
    <ellipse cx="14" cy="3" rx="6" ry="9" fill="#3a2818" opacity="0.4"/>
  </g>

  <!-- ===== DIALOGUE — SABLE — single word, absolute ===== -->
  <g>
    <rect x="50" y="14" width="120" height="48" rx="2" fill="white" stroke="#5a606a" stroke-width="1.4" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="58" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="58" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1a1410" font-weight="700">No.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q45,142 90,138 Q135,136 180,140"/>
  </g>
</svg>
