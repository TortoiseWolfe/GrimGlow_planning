<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 7 — Page 20 — Panel 5: Sable shuts it down — quiet finality — fracture visible in the spatial partition of the camp's light into pools around each figure</title>
  <desc>35mm medium wide eye level. Sable speaks quietly. Final. Order ends conversation. Camp absorbs it. Jink fists clench, looks away. Thresh stiffens — training holds. Wren watches, filing it away. Luma eyes down. Camp light partitioned by argument into pools around each figure, shadow between them. They are in the same room and they are apart.</desc>

  <defs>
    <linearGradient id="i7p20p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="i7p20p5timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="i7p20p5amber" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p5holo" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a3848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p5jinkPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5af0a0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a3828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p5sablePool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8ecf0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3a3a40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p5threshPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f04838" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p5wrenPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d88838" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p20p5lumaPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p20p5jinkSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p20p5sableSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c8d0"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </linearGradient>
    <linearGradient id="i7p20p5threshSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f04838"/>
      <stop offset="100%" stop-color="#7a1810"/>
    </linearGradient>
    <linearGradient id="i7p20p5wrenSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d88838"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <linearGradient id="i7p20p5lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <filter id="i7p20p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p20p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p20p5strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p20p5megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="320" fill="url(#i7p20p5bg)"/>

  <!-- Top floorboard with amber bands -->
  <rect x="0" y="0" width="742" height="20" fill="url(#i7p20p5timber)"/>
  <line x1="0" y1="0" x2="742" y2="0" stroke="#1a0808" stroke-width="0.85"/>
  <line x1="0" y1="20" x2="742" y2="20" stroke="#1a0808" stroke-width="0.85"/>
  <g opacity="0.85">
    <ellipse cx="200" cy="22" rx="60" ry="2" fill="#ffd898" filter="url(#i7p20p5bloom)"/>
    <ellipse cx="540" cy="22" rx="60" ry="2" fill="#ffd898" filter="url(#i7p20p5bloom)"/>
  </g>
  <ellipse cx="200" cy="60" rx="100" ry="50" fill="url(#i7p20p5amber)" filter="url(#i7p20p5megaglow)" opacity="0.55"/>
  <ellipse cx="540" cy="60" rx="100" ry="50" fill="url(#i7p20p5amber)" filter="url(#i7p20p5megaglow)" opacity="0.55"/>

  <!-- ===== ISOLATED LIGHT POOLS — partitioned by the argument ===== -->
  <ellipse cx="120" cy="220" rx="80" ry="60" fill="url(#i7p20p5wrenPool)" filter="url(#i7p20p5strongglow)"/>
  <ellipse cx="280" cy="220" rx="80" ry="60" fill="url(#i7p20p5jinkPool)" filter="url(#i7p20p5strongglow)"/>
  <ellipse cx="370" cy="200" rx="80" ry="60" fill="url(#i7p20p5threshPool)" filter="url(#i7p20p5strongglow)"/>
  <ellipse cx="500" cy="220" rx="80" ry="60" fill="url(#i7p20p5sablePool)" filter="url(#i7p20p5strongglow)"/>
  <ellipse cx="650" cy="220" rx="80" ry="60" fill="url(#i7p20p5lumaPool)" filter="url(#i7p20p5strongglow)"/>

  <!-- Lower beams -->
  <rect x="0" y="280" width="742" height="40" fill="#0a0606"/>
  <rect x="40" y="270" width="180" height="11" fill="url(#i7p20p5timber)"/>
  <rect x="600" y="270" width="120" height="11" fill="url(#i7p20p5timber)"/>

  <!-- ===== WREN at workstation, watching Sable, filing this away ===== -->
  <g transform="translate(120 240)">
    <!-- Seated -->
    <path d="M-9,30 L-11,9 L-7,-22 L-3,-30 L3,-30 L7,-22 L11,9 L9,30 Z" fill="url(#i7p20p5wrenSuit)"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffa848" stroke-width="0.4" opacity="0.85" filter="url(#i7p20p5bloom)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-36" rx="6" ry="7" fill="#e0b888"/>
    <!-- Messy hair knot -->
    <ellipse cx="0" cy="-46" rx="7" ry="3" fill="#1a1008"/>
    <circle cx="3" cy="-48" r="2" fill="#1a1008"/>
    <!-- Head turned toward Sable (right) -->
    <ellipse cx="2" cy="-36" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-36" r="0.55" fill="#3a1808"/>
    <ellipse cx="-2" cy="-36" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-1" cy="-36" r="0.55" fill="#3a1808"/>
    <!-- Brows — sharp, attentive -->
    <line x1="-5" y1="-40" x2="-1" y2="-40" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="1" y1="-40" x2="5" y2="-40" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Mouth flat -->
    <line x1="-3" y1="-30" x2="3" y2="-30" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Lens beside -->
    <ellipse cx="14" cy="22" rx="6" ry="2" fill="#fff8d8" filter="url(#i7p20p5bloom)" opacity="0.85"/>
    <ellipse cx="14" cy="22" rx="5" ry="1.4" fill="#d89858"/>
  </g>

  <!-- ===== JINK fists clenched, looking away (left) ===== -->
  <g transform="translate(280 240)">
    <!-- Body -->
    <path d="M-9,30 L-11,9 L-14,-14 L-9,-30 L-3,-40 L3,-40 L9,-30 L14,-14 L11,9 L9,30 Z" fill="url(#i7p20p5jinkSuit)"/>
    <line x1="0" y1="-30" x2="0" y2="22" stroke="#a8ffd0" stroke-width="0.4" opacity="0.7" filter="url(#i7p20p5bloom)"/>
    <!-- Soot streak -->
    <path d="M-11,-22 L0,-30" stroke="#1a1410" stroke-width="1.4" opacity="0.85"/>
    <!-- Fists CLENCHED -->
    <ellipse cx="-14" cy="0" rx="3" ry="2.5" fill="#a87838"/>
    <ellipse cx="14" cy="0" rx="3" ry="2.5" fill="#a87838"/>
    <!-- Tight knuckle highlights -->
    <ellipse cx="-14" cy="-1" rx="2" ry="1.4" fill="#fff8d8" opacity="0.55"/>
    <ellipse cx="14" cy="-1" rx="2" ry="1.4" fill="#fff8d8" opacity="0.55"/>
    <!-- Head turned LEFT (away from Sable) -->
    <ellipse cx="-3" cy="-46" rx="6" ry="7" fill="#a87838"/>
    <g fill="#f0d878" opacity="0.85">
      <ellipse cx="-3" cy="-54" rx="9" ry="4"/>
      <circle cx="-9" cy="-50" r="3"/>
      <circle cx="3" cy="-52" r="3"/>
      <circle cx="-7" cy="-58" r="3"/>
    </g>
    <!-- Eyes turned hard left -->
    <ellipse cx="-7" cy="-46" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-7" cy="-46" r="0.55" fill="#3a1808"/>
    <ellipse cx="-1" cy="-46" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-2" cy="-46" r="0.55" fill="#3a1808"/>
    <!-- Mouth — tight, away -->
    <line x1="-6" y1="-40" x2="-1" y2="-40" stroke="#3a1808" stroke-width="0.7"/>
  </g>

  <!-- ===== THRESH stiff military posture — training holds ===== -->
  <g transform="translate(370 230)">
    <!-- Body — back to attention -->
    <path d="M-12,40 L-16,9 L-18,-14 L-14,-32 L-3,-44 L3,-44 L14,-32 L18,-14 L16,9 L12,40 Z" fill="url(#i7p20p5threshSuit)"/>
    <!-- Dented pauldron -->
    <ellipse cx="-14" cy="-25" rx="6" ry="4" fill="#5a1410"/>
    <line x1="-16" y1="-28" x2="-12" y2="-22" stroke="#1a0606" stroke-width="0.85"/>
    <!-- Shoulder scrape -->
    <path d="M-16,-22 L-9,-28" stroke="#3a0a0a" stroke-width="1.4" opacity="0.85"/>
    <!-- Suit accent -->
    <line x1="0" y1="-32" x2="0" y2="30" stroke="#ffa898" stroke-width="0.4" opacity="0.85" filter="url(#i7p20p5bloom)"/>
    <!-- Arms — back at sides (stiff attention) -->
    <path d="M-18,-14 L-22,18 L-14,18 L-9,0 Z" fill="url(#i7p20p5threshSuit)"/>
    <path d="M18,-14 L22,18 L14,18 L9,0 Z" fill="url(#i7p20p5threshSuit)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-50" rx="6" ry="7" fill="#e0b888"/>
    <path d="M-7,-58 Q0,-62 7,-58 L7,-50 Q0,-52 -7,-50 Z" fill="#a83820"/>
    <!-- Eyes — locked forward -->
    <ellipse cx="-2.5" cy="-50" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-2.5" cy="-50" r="0.55" fill="#3a1808"/>
    <ellipse cx="2.5" cy="-50" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="2.5" cy="-50" r="0.55" fill="#3a1808"/>
    <!-- Mouth — flat, set -->
    <line x1="-3" y1="-44" x2="3" y2="-44" stroke="#1a0808" stroke-width="0.7"/>
  </g>

  <!-- ===== SABLE arms at sides, posture straight, absolute authority ===== -->
  <g transform="translate(500 240)">
    <!-- Body -->
    <path d="M-11,30 L-14,9 L-16,-14 L-11,-32 L-3,-44 L3,-44 L11,-32 L16,-14 L14,9 L11,30 Z" fill="url(#i7p20p5sableSuit)"/>
    <line x1="0" y1="-32" x2="0" y2="22" stroke="#fff" stroke-width="0.4" opacity="0.7" filter="url(#i7p20p5bloom)"/>
    <!-- Arms at sides -->
    <path d="M-16,-14 L-18,18 L-11,18 L-9,0 Z" fill="url(#i7p20p5sableSuit)"/>
    <path d="M16,-14 L18,18 L11,18 L9,0 Z" fill="url(#i7p20p5sableSuit)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-50" rx="6" ry="7" fill="#5a3818"/>
    <path d="M-7,-58 Q0,-62 7,-58 L7,-50 Q0,-54 -7,-50 Z" fill="#e8ecf0" opacity="0.85"/>
    <!-- Eyes -->
    <ellipse cx="-2.5" cy="-50" rx="1.4" ry="0.85" fill="#fff"/>
    <circle cx="-2.5" cy="-50" r="0.55" fill="#0a0a14"/>
    <ellipse cx="2.5" cy="-50" rx="1.4" ry="0.85" fill="#fff"/>
    <circle cx="2.5" cy="-50" r="0.55" fill="#0a0a14"/>
    <line x1="-5" y1="-54" x2="-1" y2="-54" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="1" y1="-54" x2="5" y2="-54" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="-3" y1="-44" x2="3" y2="-44" stroke="#1a0808" stroke-width="0.85"/>
  </g>

  <!-- ===== LUMA eyes down, withdrawn ===== -->
  <g transform="translate(650 245)">
    <path d="M-7,30 L-9,9 L-7,-18 L-3,-26 L3,-26 L7,-18 L9,9 L7,30 Z" fill="url(#i7p20p5lumaSuit)"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#c8a8e8" stroke-width="0.4" opacity="0.55" filter="url(#i7p20p5bloom)"/>
    <!-- Hands in lap -->
    <ellipse cx="-3" cy="14" rx="3" ry="2" fill="#a87838"/>
    <ellipse cx="3" cy="14" rx="3" ry="2" fill="#a87838"/>
    <!-- Head bowed -->
    <ellipse cx="0" cy="-32" rx="5" ry="6" fill="#a87838"/>
    <path d="M0,-26 Q3,-22 5,0" stroke="#1a0808" stroke-width="2" fill="none"/>
    <!-- Eyes down -->
    <line x1="-3" y1="-30" x2="-1" y2="-30" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="1" y1="-30" x2="3" y2="-30" stroke="#1a0808" stroke-width="0.55"/>
    <!-- Dim lenses -->
    <ellipse cx="-2" cy="-30" rx="1.4" ry="1" fill="none" stroke="#a878e8" stroke-width="0.4" opacity="0.4"/>
    <ellipse cx="2" cy="-30" rx="1.4" ry="1" fill="none" stroke="#a878e8" stroke-width="0.4" opacity="0.4"/>
  </g>

  <!-- ===== DIALOGUE balloons ===== -->
  <!-- SABLE 1 -->
  <g>
    <rect x="14" y="14" width="500" height="36" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">We are not engaging unknown hostiles with five personnel and degraded equipment.</text>

  <!-- SABLE 2 -->
  <g>
    <rect x="14" y="60" width="500" height="36" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Wren integrates the lens. We continue the repair timetable.</text>

  <!-- SABLE 3 — DISMISSED, terminal -->
  <g>
    <rect x="540" y="60" width="180" height="36" rx="2" fill="white" stroke="#5a606a" stroke-width="1.4" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="548" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="548" y="91" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="700">Dismissed.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
