<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 500" width="742" height="500">
  <title>Issue 7 — Page 15 — Panel 3: Wide cinematic — the lighthouse from across the water, Wren descending, the calm before the sighting</title>
  <desc>24mm wide cinematic from across water. Lighthouse full structure visible — squat iron-and-brick tower stone pier Fresnel lens rotating top amber beam sweeping outward dark river. Keeper silhouette gallery. Jink invisible. River black. Waterfront buildings dark shapes. Barge moves downstream running lights amber specks. Below base lighthouse barely visible against stone pier — small shape descending. Wren reaching base. Operation succeeding. Calm before sighting.</desc>

  <defs>
    <linearGradient id="i7p15p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#1a1c2a"/>
    </linearGradient>
    <linearGradient id="i7p15p3water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p15p3tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3838"/>
      <stop offset="50%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="i7p15p3iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <radialGradient id="i7p15p3lampHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p15p3beam" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p15p3fog" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a3a4a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1a28" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p15p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p15p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p15p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p15p3megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="742" height="280" fill="url(#i7p15p3sky)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="80" cy="20" r="0.55"/>
    <circle cx="180" cy="40" r="0.4"/>
    <circle cx="280" cy="20" r="0.55"/>
    <circle cx="500" cy="35" r="0.4"/>
    <circle cx="620" cy="20" r="0.55"/>
    <circle cx="700" cy="50" r="0.4"/>
    <circle cx="120" cy="80" r="0.4"/>
    <circle cx="320" cy="100" r="0.4"/>
    <circle cx="540" cy="80" r="0.4"/>
  </g>

  <!-- BEAM SWEEP across water -->
  <path d="M540,180 L740,140 L740,220 L540,200 Z" fill="#ffd898" opacity="0.4" filter="url(#i7p15p3megaglow)"/>
  <path d="M0,200 L540,180 L540,210 L0,260 Z" fill="#ffd898" opacity="0.4" filter="url(#i7p15p3megaglow)"/>
  <ellipse cx="540" cy="180" rx="120" ry="80" fill="url(#i7p15p3beam)" filter="url(#i7p15p3megaglow)"/>

  <!-- ===== FAR BANK silhouette (background) ===== -->
  <ellipse cx="371" cy="240" rx="500" ry="40" fill="url(#i7p15p3fog)" filter="url(#i7p15p3strongglow)"/>
  <g fill="#1a1410" opacity="0.85">
    <rect x="0" y="180" width="80" height="40"/>
    <rect x="100" y="170" width="60" height="50"/>
    <rect x="180" y="180" width="80" height="40"/>
    <rect x="280" y="160" width="100" height="60"/>
    <rect x="400" y="170" width="80" height="50"/>
    <rect x="500" y="180" width="60" height="40"/>
  </g>
  <!-- Cranes far -->
  <g stroke="#0a0408" stroke-width="0.55" fill="none" opacity="0.85">
    <line x1="120" y1="170" x2="120" y2="120"/>
    <line x1="120" y1="120" x2="160" y2="135"/>
    <line x1="320" y1="160" x2="320" y2="100"/>
    <line x1="320" y1="100" x2="380" y2="120"/>
  </g>
  <!-- Distant amber gas lamps -->
  <g opacity="0.85" filter="url(#i7p15p3bloom)">
    <circle cx="60" cy="200" r="0.85" fill="#d89858"/>
    <circle cx="160" cy="190" r="0.85" fill="#d89858"/>
    <circle cx="220" cy="200" r="0.85" fill="#d89858"/>
    <circle cx="340" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="440" cy="195" r="0.85" fill="#d89858"/>
    <circle cx="540" cy="200" r="0.85" fill="#d89858"/>
  </g>

  <!-- River -->
  <rect x="0" y="280" width="742" height="220" fill="url(#i7p15p3water)"/>
  <!-- Beam reflection on water -->
  <g opacity="0.55" filter="url(#i7p15p3bloom)">
    <ellipse cx="540" cy="320" rx="80" ry="3" fill="#ffd898"/>
    <ellipse cx="540" cy="340" rx="60" ry="2" fill="#ffd898"/>
    <ellipse cx="540" cy="360" rx="40" ry="2" fill="#ffd898"/>
  </g>
  <!-- Water reflections of distant lamps -->
  <g opacity="0.55" filter="url(#i7p15p3bloom)">
    <ellipse cx="60" cy="320" rx="6" ry="1" fill="#d89858"/>
    <ellipse cx="220" cy="340" rx="6" ry="1" fill="#d89858"/>
    <ellipse cx="440" cy="360" rx="6" ry="1" fill="#d89858"/>
  </g>

  <!-- Barge moving downstream (foreground left) -->
  <g transform="translate(120 380)" opacity="0.85">
    <ellipse cx="0" cy="3" rx="50" ry="6" fill="#0a0408"/>
    <rect x="-44" y="-14" width="88" height="14" fill="#0a0408"/>
    <line x1="0" y1="-26" x2="0" y2="-14" stroke="#0a0408" stroke-width="2"/>
    <!-- Running lights -->
    <circle cx="-30" cy="-18" r="2" fill="#ff5050" filter="url(#i7p15p3bloom)"/>
    <circle cx="30" cy="-18" r="2" fill="#80f0a0" filter="url(#i7p15p3bloom)"/>
    <circle cx="0" cy="-30" r="2" fill="#fff8c8" filter="url(#i7p15p3bloom)"/>
  </g>

  <!-- ===== STONE PIER ===== -->
  <path d="M540,420 L742,400 L742,440 L540,460 Z" fill="#3a3838"/>
  <line x1="540" y1="420" x2="742" y2="400" stroke="#1a1418" stroke-width="0.85"/>

  <!-- ===== LIGHTHOUSE ===== -->
  <g transform="translate(640 420)">
    <!-- Halo around lamp -->
    <ellipse cx="0" cy="-280" rx="100" ry="80" fill="url(#i7p15p3lampHalo)" filter="url(#i7p15p3megaglow)"/>
    <!-- Tower body -->
    <path d="M-40,0 L-30,-220 L-44,-240 L44,-240 L30,-220 L40,0 Z" fill="url(#i7p15p3tower)"/>
    <!-- Brick courses -->
    <g stroke="#1a0c08" stroke-width="0.4" opacity="0.7" fill="none">
      <line x1="-40" y1="-40" x2="40" y2="-40"/>
      <line x1="-40" y1="-80" x2="40" y2="-80"/>
      <line x1="-40" y1="-120" x2="40" y2="-120"/>
      <line x1="-40" y1="-160" x2="40" y2="-160"/>
      <line x1="-40" y1="-200" x2="40" y2="-200"/>
    </g>
    <!-- Iron lamp room -->
    <rect x="-50" y="-260" width="100" height="20" fill="url(#i7p15p3iron)" stroke="#0a0408" stroke-width="0.7"/>
    <ellipse cx="0" cy="-250" rx="36" ry="6" fill="#fff8c8" filter="url(#i7p15p3bloom)"/>
    <!-- Iron gallery -->
    <rect x="-56" y="-240" width="112" height="6" fill="url(#i7p15p3iron)"/>
    <!-- Roof -->
    <polygon points="-46,-260 0,-280 46,-260" fill="url(#i7p15p3iron)"/>

    <!-- KEEPER SILHOUETTE on gallery -->
    <g transform="translate(0 -240)" opacity="0.85">
      <path d="M-9,0 L-9,-22 L-7,-30 L7,-30 L9,-22 L9,0 Z" fill="#0a0c20"/>
      <ellipse cx="0" cy="-36" rx="6" ry="6" fill="#1a0c08"/>
      <path d="M-7,-40 Q-5,-44 0,-46 Q5,-44 7,-40 L7,-36 Q4,-40 0,-40 Q-4,-40 -7,-36 Z" fill="#0a0408"/>
    </g>

    <!-- BEAM CONE radiating LEFT across river -->
    <path d="M-50,-250 L-540,-280 L-540,-220 L-50,-246 Z" fill="#ffd898" opacity="0.4" filter="url(#i7p15p3megaglow)"/>

    <!-- ===== WREN — small copper figure descending exterior stonework ===== -->
    <g transform="translate(-30 -100)">
      <!-- Faint copper-gold glow -->
      <ellipse cx="0" cy="0" rx="6" ry="6" fill="#d89858" opacity="0.55" filter="url(#i7p15p3strongglow)"/>
      <!-- Tiny figure -->
      <path d="M-1,1 L-1.4,-3 L0,-5 L1.4,-3 L1,1 Z" fill="#a85820"/>
      <ellipse cx="0" cy="-7" rx="0.85" ry="0.85" fill="#a87838"/>
    </g>
    <!-- Wren further down -->
    <g transform="translate(-32 -50)">
      <ellipse cx="0" cy="0" rx="5" ry="5" fill="#d89858" opacity="0.4" filter="url(#i7p15p3glow)"/>
      <path d="M-1,1 L-1.4,-3 L0,-5 L1.4,-3 L1,1 Z" fill="#a85820"/>
    </g>

    <!-- Door at base -->
    <rect x="-7" y="-30" width="14" height="22" fill="#0a0408"/>
  </g>

  <!-- WREN comms -->
  <g>
    <rect x="14" y="14" width="320" height="40" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="160,54 172,54 164,64" fill="white" stroke="#c87a35" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I'm out. Descending. Swap is clean.</text>

  <!-- SABLE -->
  <g>
    <rect x="380" y="14" width="346" height="50" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="540,64 552,64 544,76" fill="white" stroke="#5a606a" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="388" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="388" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Copy. Jink, extract when keeper goes</text>
  <text x="388" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">back inside.</text>

  <!-- JINK -->
  <g>
    <rect x="14" y="430" width="280" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="100,470 112,470 104,480" fill="white" stroke="#2ed078" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Standing by.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
    <path d="M0,400 Q200,402 400,398 Q580,396 742,400"/>
  </g>
</svg>
