<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 7 — Page 12 — Panel 3: Jink on the gallery railing — wings stowed, grin alive, joy at the edge</title>
  <desc>50mm slight high angle fairy scale. Jink perched iron gallery railing wings stowed legs dangling over dark river below. Wind moves wild golden blonde curly hair. Scans waterfront — warehouses cranes moored barges far bank line industrial silhouette fog. Loose casual. Grin present. Enjoying this — height wind danger. Lighthouse beam sweeps past behind periodically. Distant amber smears waterfront gas lamps reflected black river.</desc>

  <defs>
    <linearGradient id="i7p12p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p12p3water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p12p3iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <radialGradient id="i7p12p3beamSweep" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p12p3suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p12p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i7p12p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p12p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p12p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p12p3megaglow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="366" height="320" fill="url(#i7p12p3bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="40" cy="20" r="0.55"/>
    <circle cx="120" cy="40" r="0.4"/>
    <circle cx="200" cy="20" r="0.55"/>
    <circle cx="60" cy="80" r="0.4"/>
  </g>

  <!-- BEAM SWEEPING from RIGHT background (behind Jink) -->
  <ellipse cx="366" cy="80" rx="240" ry="120" fill="url(#i7p12p3beamSweep)" filter="url(#i7p12p3megaglow)"/>

  <!-- ===== FAR BANK silhouette (warehouses, cranes, barges) ===== -->
  <g fill="#1a1410" opacity="0.85">
    <rect x="0" y="160" width="60" height="40"/>
    <rect x="80" y="155" width="40" height="45"/>
    <rect x="140" y="150" width="80" height="50"/>
    <rect x="240" y="160" width="40" height="40"/>
    <rect x="300" y="155" width="66" height="45"/>
  </g>
  <!-- Crane silhouette -->
  <g stroke="#0a0408" stroke-width="0.85" fill="none" opacity="0.85">
    <line x1="100" y1="160" x2="100" y2="100"/>
    <line x1="106" y1="160" x2="106" y2="100"/>
    <line x1="100" y1="100" x2="180" y2="120"/>
    <line x1="106" y1="110" x2="178" y2="128"/>
    <line x1="180" y1="120" x2="180" y2="160"/>
  </g>
  <!-- Distant amber dots (gas lamps far bank) -->
  <g opacity="0.85" filter="url(#i7p12p3bloom)">
    <circle cx="60" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="160" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="280" cy="180" r="0.85" fill="#d89858"/>
    <circle cx="340" cy="180" r="0.85" fill="#d89858"/>
  </g>

  <!-- ===== RIVER ===== -->
  <rect x="0" y="200" width="366" height="120" fill="url(#i7p12p3water)"/>
  <!-- River reflection bands (broken amber) -->
  <g opacity="0.55" filter="url(#i7p12p3bloom)">
    <ellipse cx="60" cy="240" rx="9" ry="2" fill="#d89858"/>
    <ellipse cx="160" cy="260" rx="11" ry="2" fill="#d89858"/>
    <ellipse cx="280" cy="280" rx="14" ry="2" fill="#d89858"/>
  </g>
  <!-- Beam reflection on water (broken line) -->
  <g opacity="0.7" filter="url(#i7p12p3bloom)">
    <ellipse cx="280" cy="220" rx="60" ry="3" fill="#ffd898"/>
    <ellipse cx="280" cy="240" rx="40" ry="2" fill="#ffd898"/>
  </g>

  <!-- Moored barges (small dark shapes) -->
  <g fill="#1a1018" opacity="0.85">
    <ellipse cx="60" cy="260" rx="22" ry="3"/>
    <rect x="48" y="252" width="24" height="8"/>
    <ellipse cx="240" cy="280" rx="22" ry="3"/>
    <rect x="228" y="272" width="24" height="8"/>
  </g>

  <!-- ===== IRON GALLERY RAILING (foreground) — large at fairy scale ===== -->
  <rect x="0" y="220" width="366" height="14" fill="url(#i7p12p3iron)"/>
  <line x1="0" y1="220" x2="366" y2="220" stroke="#5a5860" stroke-width="0.85" filter="url(#i7p12p3bloom)" opacity="0.85"/>
  <!-- Vertical posts -->
  <line x1="40" y1="234" x2="40" y2="320" stroke="#0a0408" stroke-width="2"/>
  <line x1="120" y1="234" x2="120" y2="320" stroke="#0a0408" stroke-width="2"/>
  <line x1="200" y1="234" x2="200" y2="320" stroke="#0a0408" stroke-width="2"/>
  <line x1="280" y1="234" x2="280" y2="320" stroke="#0a0408" stroke-width="2"/>
  <line x1="346" y1="234" x2="346" y2="320" stroke="#0a0408" stroke-width="2"/>
  <!-- Lower railing -->
  <rect x="0" y="280" width="366" height="6" fill="url(#i7p12p3iron)"/>

  <!-- ===== JINK perched on railing ===== -->
  <g transform="translate(183 220)">
    <!-- Wing-pack stowed (faint emerald glow at seams) -->
    <line x1="-7" y1="-22" x2="-12" y2="-3" stroke="#5af0a0" stroke-width="0.7" opacity="0.85" filter="url(#i7p12p3bloom)"/>
    <line x1="7" y1="-22" x2="12" y2="-3" stroke="#5af0a0" stroke-width="0.7" opacity="0.85" filter="url(#i7p12p3bloom)"/>

    <!-- Body sitting on rail, legs dangling -->
    <ellipse cx="0" cy="-3" rx="9" ry="3" fill="url(#i7p12p3suit)"/>
    <!-- Legs forward, dangling -->
    <path d="M-7,0 L-9,30 L-5,40 L0,30 Z" fill="url(#i7p12p3suit)"/>
    <path d="M7,0 L9,30 L5,40 L0,30 Z" fill="url(#i7p12p3suit)"/>
    <!-- Salt-spray staining on lower legs (NEW) -->
    <ellipse cx="-7" cy="20" rx="3" ry="1" fill="#3a4838" opacity="0.55"/>
    <ellipse cx="7" cy="20" rx="3" ry="1" fill="#3a4838" opacity="0.55"/>

    <!-- Torso loose/relaxed -->
    <path d="M-9,-3 L-11,-30 L-7,-44 L7,-44 L11,-30 L9,-3 Z" fill="url(#i7p12p3suit)"/>
    <line x1="0" y1="-44" x2="0" y2="-3" stroke="#a8ffd0" stroke-width="0.55" opacity="0.85" filter="url(#i7p12p3bloom)"/>
    <!-- Soot streak across chest -->
    <path d="M-7,-22 L7,-18" stroke="#1a1410" stroke-width="2" opacity="0.85"/>
    <!-- Copper wire patch on forearm (NEW carry-over from Issue 5) -->
    <line x1="-11" y1="-14" x2="-9" y2="-14" stroke="#a87838" stroke-width="0.85" filter="url(#i7p12p3bloom)"/>

    <!-- LEFT hand resting on railing (top) -->
    <path d="M-11,-30 L-22,-12 L-22,0 L-12,-12 Z" fill="url(#i7p12p3suit)"/>
    <ellipse cx="-22" cy="-3" rx="3" ry="1.4" fill="url(#i7p12p3skin)"/>

    <!-- RIGHT hand holding scanner loosely -->
    <path d="M11,-30 L18,-18 L22,-3 L14,-12 Z" fill="url(#i7p12p3suit)"/>
    <ellipse cx="22" cy="-3" rx="3" ry="2" fill="url(#i7p12p3skin)"/>
    <!-- Scanner -->
    <rect x="20" y="-7" width="9" height="4" fill="#3a2068" stroke="#a888ff" stroke-width="0.4"/>
    <ellipse cx="24" cy="-5" rx="2" ry="1" fill="#5af0a0" filter="url(#i7p12p3bloom)" opacity="0.7"/>

    <!-- Head -->
    <ellipse cx="0" cy="-58" rx="9" ry="11" fill="url(#i7p12p3skin)"/>
    <!-- Wild golden curls — moving in wind -->
    <path d="M-9,-70 Q-7,-86 0,-88 Q9,-86 11,-70 L11,-64 Q9,-66 0,-66 Q-9,-66 -9,-64 Z" fill="#f0d878"/>
    <!-- Wind-blown curls trailing -->
    <circle cx="-9" cy="-80" r="3" fill="#f0d878"/>
    <circle cx="9" cy="-78" r="3" fill="#f0d878"/>
    <circle cx="0" cy="-86" r="2.4" fill="#f0d878"/>
    <!-- Trailing strands -->
    <path d="M-11,-72 L-18,-64" stroke="#f0d878" stroke-width="1" fill="none"/>
    <path d="M-9,-78 L-14,-70" stroke="#f0d878" stroke-width="1" fill="none"/>

    <!-- Backlight from beam on hair -->
    <ellipse cx="0" cy="-86" rx="14" ry="3" fill="#ffd898" opacity="0.7" filter="url(#i7p12p3bloom)"/>

    <!-- Cheekbones -->
    <path d="M-9,-58 Q-7,-50 -3,-46" fill="none" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>
    <path d="M9,-58 Q7,-50 3,-46" fill="none" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>

    <!-- BRIGHT EYES alive -->
    <ellipse cx="-3" cy="-58" rx="2" ry="1.4" fill="#fff"/>
    <ellipse cx="3" cy="-58" rx="2" ry="1.4" fill="#fff"/>
    <ellipse cx="-3" cy="-58" rx="1" ry="0.85" fill="#1a4a28"/>
    <ellipse cx="3" cy="-58" rx="1" ry="0.85" fill="#1a4a28"/>
    <circle cx="-3" cy="-58" r="0.4" fill="#fff"/>
    <circle cx="3" cy="-58" r="0.4" fill="#fff"/>

    <!-- Brow lifted (alive, alert) -->
    <path d="M-7,-66 Q-3,-68 0,-66" stroke="#5a3018" stroke-width="0.55" fill="none"/>
    <path d="M7,-66 Q3,-68 0,-66" stroke="#5a3018" stroke-width="0.55" fill="none"/>

    <!-- THE GRIN — wide, alive, present -->
    <path d="M-7,-46 Q0,-40 7,-46" stroke="#3a1808" stroke-width="1.4" fill="none"/>
    <path d="M-5,-44 Q0,-38 5,-44" stroke="#1a0c04" stroke-width="0.85" fill="none"/>
    <!-- Teeth flash -->
    <line x1="-3" y1="-44" x2="3" y2="-44" stroke="#fff" stroke-width="0.55"/>
  </g>

  <!-- JINK comms -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="180,64 192,64 184,76" fill="white" stroke="#2ed078" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">All clear out here. River's quiet.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Couple of barges downstream, nothing on the banks.</text>

  <!-- JINK -->
  <g>
    <rect x="14" y="270" width="338" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Beautiful night for a heist, honestly.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q100,162 200,158 Q280,156 366,160"/>
    <path d="M0,260 Q100,262 200,258 Q280,256 366,260"/>
  </g>
</svg>
