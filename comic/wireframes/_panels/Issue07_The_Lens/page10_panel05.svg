<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 410" width="366" height="410">
  <title>Issue 7 — Page 10 — Panel 5: Jink works the latch — full body leverage, crack of warm light as door seal breaks</title>
  <desc>85mm close-up eye level fairy scale. Jink braces feet against iron door frame pulls iron latch lever both hands — full body leverage Victorian mechanism. Wild golden curls soot-streaked emerald. Wing-pack glow illuminates dark iron in green-tinted geometric light. Lever moves crack warm amber light at door edge as seal breaks lamp room light bleeding through gap. Effort tight professional satisfaction.</desc>

  <defs>
    <linearGradient id="i7p10p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="i7p10p5iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="50%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <radialGradient id="i7p10p5wingHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5af0a0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a6838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p10p5doorCrack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p10p5suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p10p5skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i7p10p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p10p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p10p5strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p10p5megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="366" height="410" fill="url(#i7p10p5bg)"/>

  <!-- ===== IRON DOOR — fills RIGHT 2/3 of frame ===== -->
  <rect x="120" y="0" width="246" height="410" fill="url(#i7p10p5iron)"/>
  <line x1="120" y1="0" x2="120" y2="410" stroke="#0a0408" stroke-width="2"/>

  <!-- Door panels (large at fairy scale) -->
  <rect x="140" y="40" width="206" height="160" fill="#1a1818" stroke="#0a0408" stroke-width="0.85"/>
  <rect x="140" y="220" width="206" height="160" fill="#1a1818" stroke="#0a0408" stroke-width="0.85"/>

  <!-- Iron rivets on door frame (massive at this scale) -->
  <g fill="#5a5860" stroke="#0a0408" stroke-width="0.55">
    <circle cx="130" cy="60" r="4"/>
    <circle cx="130" cy="160" r="4"/>
    <circle cx="130" cy="250" r="4"/>
    <circle cx="130" cy="350" r="4"/>
  </g>

  <!-- Decorative iron banding -->
  <rect x="140" y="200" width="206" height="20" fill="url(#i7p10p5iron)" stroke="#0a0408" stroke-width="0.55"/>
  <line x1="140" y1="210" x2="346" y2="210" stroke="#5a5860" stroke-width="0.55"/>

  <!-- ===== CRACK OF WARM LIGHT — door seal breaking ===== -->
  <line x1="120" y1="0" x2="120" y2="410" stroke="#ffd898" stroke-width="3" filter="url(#i7p10p5strongglow)"/>
  <ellipse cx="120" cy="220" rx="40" ry="180" fill="url(#i7p10p5doorCrack)" filter="url(#i7p10p5megaglow)"/>
  <line x1="118" y1="0" x2="118" y2="410" stroke="#fff8c8" stroke-width="1" filter="url(#i7p10p5bloom)"/>

  <!-- Light spilling through to outside -->
  <g opacity="0.85" filter="url(#i7p10p5bloom)">
    <ellipse cx="100" cy="180" rx="22" ry="40" fill="#ffd898" opacity="0.55" filter="url(#i7p10p5strongglow)"/>
    <ellipse cx="100" cy="240" rx="22" ry="40" fill="#ffd898" opacity="0.55" filter="url(#i7p10p5strongglow)"/>
  </g>

  <!-- ===== IRON LATCH MECHANISM — center of frame, on the door ===== -->
  <g transform="translate(170 220)">
    <!-- Latch base plate -->
    <rect x="-30" y="-20" width="80" height="40" fill="url(#i7p10p5iron)" stroke="#0a0408" stroke-width="0.85"/>
    <!-- Bolts -->
    <circle cx="-22" cy="-12" r="3" fill="#5a5860" stroke="#0a0408" stroke-width="0.55"/>
    <circle cx="42" cy="-12" r="3" fill="#5a5860" stroke="#0a0408" stroke-width="0.55"/>
    <circle cx="-22" cy="12" r="3" fill="#5a5860" stroke="#0a0408" stroke-width="0.55"/>
    <circle cx="42" cy="12" r="3" fill="#5a5860" stroke="#0a0408" stroke-width="0.55"/>

    <!-- LATCH LEVER (heavy iron beam, being pulled DOWN by Jink) -->
    <rect x="-20" y="-4" width="60" height="8" fill="#3a3838" stroke="#0a0408" stroke-width="0.55" transform="rotate(20 0 0)"/>
    <!-- Lever pivot -->
    <circle cx="0" cy="0" r="3" fill="#5a5860" stroke="#0a0408" stroke-width="0.55"/>

    <!-- Wing-pack glow illuminating mechanism -->
    <ellipse cx="20" cy="20" rx="60" ry="40" fill="url(#i7p10p5wingHalo)" filter="url(#i7p10p5megaglow)"/>
  </g>

  <!-- ===== JINK — center, full body leveraging the latch ===== -->
  <g transform="translate(190 250)">
    <!-- Wings deployed (faint, holding hover position) -->
    <g stroke="#5af0a0" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i7p10p5bloom)">
      <path d="M-12,-22 L-30,-30 L-36,-20 L-30,-10 L-12,-14 Z"/>
      <line x1="-30" y1="-30" x2="-30" y2="-10"/>
      <path d="M12,-22 L30,-30 L36,-20 L30,-10 L12,-14 Z"/>
      <line x1="30" y1="-30" x2="30" y2="-10"/>
    </g>

    <!-- Body in pulling stance — leaning back, both arms reaching UP to lever, feet braced on door frame -->
    <!-- FEET BRACED against door frame (forward, against the latch plate edge) -->
    <ellipse cx="-22" cy="40" rx="6" ry="3" fill="#1a3018"/>
    <ellipse cx="-30" cy="50" rx="6" ry="3" fill="#1a3018"/>

    <!-- Legs extended forward (braced) -->
    <path d="M-12,30 L-22,40 L-14,40 L-6,20 Z" fill="url(#i7p10p5suit)"/>
    <path d="M-9,30 L-30,50 L-22,50 L-3,20 Z" fill="url(#i7p10p5suit)"/>

    <!-- Torso leaning BACK -->
    <path d="M-3,20 L-9,-30 L-2,-50 L9,-50 L14,-30 L9,20 Z" fill="url(#i7p10p5suit)"/>
    <line x1="3" y1="-50" x2="3" y2="20" stroke="#a8ffd0" stroke-width="0.55" opacity="0.85" filter="url(#i7p10p5bloom)"/>
    <!-- Soot streak -->
    <path d="M-3,-12 L11,-8" stroke="#1a1410" stroke-width="2.4" opacity="0.85"/>

    <!-- BOTH ARMS REACHING UP toward the lever -->
    <path d="M-9,-30 L-22,-50 L-30,-50 L-30,-44 L-14,-26 Z" fill="url(#i7p10p5suit)"/>
    <ellipse cx="-30" cy="-50" rx="6" ry="3" fill="url(#i7p10p5skin)"/>
    <!-- Fingers wrapped around lever -->
    <ellipse cx="-34" cy="-54" rx="2" ry="3" fill="url(#i7p10p5skin)"/>
    <ellipse cx="-30" cy="-58" rx="2" ry="3" fill="url(#i7p10p5skin)"/>
    <ellipse cx="-26" cy="-58" rx="2" ry="3" fill="url(#i7p10p5skin)"/>

    <path d="M14,-30 L24,-50 L30,-50 L30,-44 L18,-26 Z" fill="url(#i7p10p5suit)"/>
    <ellipse cx="30" cy="-50" rx="6" ry="3" fill="url(#i7p10p5skin)"/>
    <!-- Fingers wrapped around lever -->
    <ellipse cx="34" cy="-54" rx="2" ry="3" fill="url(#i7p10p5skin)"/>
    <ellipse cx="30" cy="-58" rx="2" ry="3" fill="url(#i7p10p5skin)"/>
    <ellipse cx="26" cy="-58" rx="2" ry="3" fill="url(#i7p10p5skin)"/>

    <!-- Head — strained, looking up toward latch -->
    <ellipse cx="3" cy="-66" rx="9" ry="11" fill="url(#i7p10p5skin)"/>
    <!-- Wild curls -->
    <path d="M-5,-78 Q-3,-92 3,-94 Q12,-92 12,-78 L12,-72 Q9,-76 3,-76 Q-3,-76 -5,-72 Z" fill="#f0d878"/>
    <circle cx="-3" cy="-86" r="2.4" fill="#f0d878"/>
    <circle cx="3" cy="-90" r="2" fill="#f0d878"/>
    <circle cx="9" cy="-86" r="2.4" fill="#f0d878"/>
    <!-- Wind-blown trailing -->
    <path d="M-5,-78 L-12,-72" stroke="#f0d878" stroke-width="0.85" fill="none"/>

    <!-- Cheekbones (strained) -->
    <path d="M-7,-66 Q-5,-58 0,-54" fill="none" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>
    <path d="M13,-66 Q11,-58 6,-54" fill="none" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>

    <!-- Eyes — focused on lever, narrowed -->
    <ellipse cx="-1" cy="-66" rx="2" ry="0.85" fill="#fff"/>
    <ellipse cx="6" cy="-66" rx="2" ry="0.85" fill="#fff"/>
    <ellipse cx="0" cy="-66" rx="1" ry="0.7" fill="#1a4a28"/>
    <ellipse cx="7" cy="-66" rx="1" ry="0.7" fill="#1a4a28"/>
    <circle cx="0" cy="-66" r="0.4" fill="#fff"/>
    <circle cx="7" cy="-66" r="0.4" fill="#fff"/>

    <!-- Brow — strained tight -->
    <path d="M-7,-72 Q-1,-76 2,-72" stroke="#5a3018" stroke-width="0.85" fill="none"/>
    <path d="M13,-72 Q7,-76 4,-72" stroke="#5a3018" stroke-width="0.85" fill="none"/>

    <!-- Nose -->
    <path d="M2,-66 L0,-58 L3,-56 L6,-58 L5,-66 Z" fill="#a87838" opacity="0.85"/>

    <!-- Mouth — TIGHT GRIN of effort -->
    <path d="M-2,-50 Q3,-46 8,-50" stroke="#3a1808" stroke-width="0.85" fill="none"/>
    <path d="M-1,-49 Q3,-44 7,-49" stroke="#1a0c04" stroke-width="0.55" fill="none"/>
  </g>

  <!-- JINK strained -->
  <g>
    <rect x="14" y="14" width="200" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95"/>
    <polygon points="80,54 92,54 84,64" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="80.5" y1="54" x2="91.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(strained)</tspan></text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1410" font-weight="700">Got... it.</text>

  <!-- SFX -->
  <g>
    <rect x="14" y="350" width="160" height="40" rx="2" fill="white" stroke="#1a1a1a" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="900" font-style="italic">*KSCRAPE*</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q100,182 200,178 Q280,176 366,180"/>
    <path d="M0,330 Q100,332 200,328 Q280,326 366,330"/>
  </g>
</svg>
