<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 300" width="494" height="300">
  <title>Issue 7 — Page 22 — Panel 2: The journalist at the edge of the group writes it down — the story passes from witness to record</title>
  <desc>50mm medium shot eye level. Group from closer. Harbor men shaking heads, dismissing keeper. One claps him on shoulder, friendly patronizing. At edge of group, slightly apart, younger man — clean coat, bowler hat, small pocket notebook open one hand, pencil other. He is writing. Not laughing. Has been listening to every word. Eyes flick between keeper and notebook. Story passes from witness to record.</desc>

  <defs>
    <linearGradient id="i7p22p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a898"/>
      <stop offset="100%" stop-color="#787068"/>
    </linearGradient>
    <linearGradient id="i7p22p2stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i7p22p2crateShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a4838" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="i7p22p2peacoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p22p2roughCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i7p22p2cleanCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5050"/>
      <stop offset="100%" stop-color="#3a3032"/>
    </linearGradient>
    <linearGradient id="i7p22p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <radialGradient id="i7p22p2notebookGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d8c8a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p22p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p22p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p22p2strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Grey dawn sky -->
  <rect x="0" y="0" width="494" height="180" fill="url(#i7p22p2sky)"/>

  <!-- Stone pier ground -->
  <rect x="0" y="180" width="494" height="120" fill="url(#i7p22p2stone)"/>
  <g stroke="#1a1008" stroke-width="0.4" opacity="0.7">
    <line x1="0" y1="180" x2="494" y2="180"/>
    <line x1="0" y1="240" x2="494" y2="240"/>
    <line x1="120" y1="180" x2="120" y2="240"/>
    <line x1="280" y1="180" x2="280" y2="240"/>
    <line x1="60" y1="240" x2="60" y2="300"/>
    <line x1="200" y1="240" x2="200" y2="300"/>
    <line x1="340" y1="240" x2="340" y2="300"/>
  </g>

  <!-- ===== CRATE STACK (right edge, casting shadow on journalist) ===== -->
  <g transform="translate(420 200)">
    <rect x="-30" y="-22" width="60" height="80" fill="#5a3818"/>
    <rect x="-30" y="-58" width="60" height="36" fill="#3a2818"/>
    <line x1="-30" y1="-22" x2="30" y2="-22" stroke="#1a1008" stroke-width="0.85"/>
    <!-- Crate banding -->
    <line x1="-30" y1="-44" x2="30" y2="-44" stroke="#1a1008" stroke-width="0.55"/>
    <line x1="0" y1="-58" x2="0" y2="-22" stroke="#1a1008" stroke-width="0.55"/>
    <!-- Stenciled markings -->
    <text x="-22" y="-36" font-family="monospace" font-size="6" fill="#1a1008" opacity="0.85">LDN</text>
    <text x="3" y="-36" font-family="monospace" font-size="6" fill="#1a1008" opacity="0.85">42</text>
  </g>

  <!-- Crate shadow over journalist -->
  <ellipse cx="350" cy="240" rx="80" ry="50" fill="url(#i7p22p2crateShadow)" filter="url(#i7p22p2strongglow)" opacity="0.7"/>

  <!-- ===== KEEPER (left, gesturing) — closer view ===== -->
  <g transform="translate(120 220)">
    <!-- Body — peacoat -->
    <path d="M-26,80 L-32,-22 L-22,-50 L-9,-66 L9,-66 L22,-50 L32,-22 L26,80 Z" fill="url(#i7p22p2peacoat)"/>
    <!-- Buttons -->
    <circle cx="-9" cy="-30" r="2" fill="#5a4838" filter="url(#i7p22p2bloom)" opacity="0.85"/>
    <circle cx="-9" cy="-9" r="2" fill="#5a4838" filter="url(#i7p22p2bloom)" opacity="0.85"/>
    <circle cx="-9" cy="14" r="2" fill="#5a4838" filter="url(#i7p22p2bloom)" opacity="0.85"/>
    <line x1="-9" y1="-50" x2="-9" y2="80" stroke="#0a0606" stroke-width="0.55"/>
    <!-- White collar -->
    <path d="M-7,-58 L-3,-66 L7,-66 L11,-58 L7,-50 L-3,-50 Z" fill="#e8e0c8"/>
    <!-- LEFT ARM raised, gesturing -->
    <path d="M-32,-22 L-50,-44 L-44,-22 L-26,-9 Z" fill="url(#i7p22p2peacoat)"/>
    <ellipse cx="-50" cy="-44" rx="5" ry="4" fill="url(#i7p22p2skin)"/>
    <!-- Right arm at side -->
    <path d="M32,-22 L36,18 L26,18 L22,-9 Z" fill="url(#i7p22p2peacoat)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-80" rx="14" ry="16" fill="url(#i7p22p2skin)"/>
    <!-- Cap -->
    <path d="M-14,-94 Q0,-100 14,-94 L18,-90 L-18,-90 Z" fill="#1a1818"/>
    <line x1="-11" y1="-94" x2="11" y2="-94" stroke="#3a3030" stroke-width="0.4"/>
    <!-- Sideburns -->
    <ellipse cx="-14" cy="-72" rx="3" ry="11" fill="#3a2818"/>
    <ellipse cx="14" cy="-72" rx="3" ry="11" fill="#3a2818"/>
    <!-- Eyes — earnest -->
    <ellipse cx="-3" cy="-80" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-3" cy="-80" r="0.85" fill="#3a1808"/>
    <ellipse cx="3" cy="-80" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="3" cy="-80" r="0.85" fill="#3a1808"/>
    <line x1="-7" y1="-86" x2="-1" y2="-87" stroke="#3a2818" stroke-width="0.85"/>
    <line x1="1" y1="-87" x2="7" y2="-86" stroke="#3a2818" stroke-width="0.85"/>
    <!-- Moustache -->
    <path d="M-5,-70 Q0,-68 5,-70 L4,-64 Q0,-62 -4,-64 Z" fill="#3a2818"/>
    <!-- Mouth open, speaking -->
    <ellipse cx="0" cy="-60" rx="3" ry="2" fill="#3a1808"/>
  </g>

  <!-- ===== HARBOR MAN clapping shoulder of keeper ===== -->
  <g transform="translate(220 220)">
    <!-- Body -->
    <path d="M-14,80 L-22,-22 L-14,-50 L-3,-66 L9,-66 L18,-50 L26,-22 L18,80 Z" fill="url(#i7p22p2roughCoat)"/>
    <!-- LEFT ARM extended toward keeper (clapping shoulder) -->
    <path d="M-22,-22 L-50,-3 L-44,9 L-14,0 Z" fill="url(#i7p22p2roughCoat)"/>
    <ellipse cx="-50" cy="-3" rx="5" ry="4" fill="url(#i7p22p2skin)"/>
    <!-- Right arm at side -->
    <path d="M26,-22 L30,9 L22,11 L18,-9 Z" fill="url(#i7p22p2roughCoat)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-80" rx="11" ry="14" fill="url(#i7p22p2skin)"/>
    <!-- Flat cap -->
    <path d="M-14,-94 Q0,-100 14,-94 L14,-90 L-14,-90 Z" fill="#3a2818"/>
    <!-- Half-smile, patronizing -->
    <path d="M-3,-66 Q0,-62 5,-65" stroke="#3a1808" stroke-width="0.85" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="-3" cy="-80" rx="1.4" ry="1" fill="#fff8e8"/>
    <ellipse cx="3" cy="-80" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-80" r="0.55" fill="#3a1808"/>
    <circle cx="3" cy="-80" r="0.55" fill="#3a1808"/>
    <!-- Thick beard -->
    <path d="M-9,-72 Q0,-66 9,-72 Q11,-58 9,-54 Q0,-50 -9,-54 Q-11,-58 -9,-72" fill="#3a2818" opacity="0.85"/>
  </g>

  <!-- ===== JOURNALIST at edge of group, slightly apart, in shadow ===== -->
  <g transform="translate(360 230)">
    <!-- Clean coat, slimmer cut than rough harbor coats -->
    <path d="M-14,70 L-18,-22 L-11,-44 L-3,-58 L7,-58 L14,-44 L20,-22 L16,70 Z" fill="url(#i7p22p2cleanCoat)"/>
    <!-- Coat lapels (cleaner cut) -->
    <path d="M-7,-50 L-9,-22 L0,-9 L0,-50 Z" fill="#3a3032"/>
    <path d="M7,-50 L9,-22 L0,-9 L0,-50 Z" fill="#3a3032"/>
    <!-- White collar/cravat -->
    <path d="M-3,-58 L-5,-50 L0,-46 L5,-50 L3,-58 Z" fill="#e8e0c8"/>

    <!-- LEFT HAND holding NOTEBOOK (open, brightest element in panel) -->
    <g transform="translate(-22 14)">
      <!-- Hand -->
      <ellipse cx="0" cy="14" rx="3" ry="6" fill="url(#i7p22p2skin)"/>
      <!-- NOTEBOOK glow halo -->
      <ellipse cx="14" cy="9" rx="22" ry="14" fill="url(#i7p22p2notebookGlow)" filter="url(#i7p22p2glow)"/>
      <!-- Notebook open page -->
      <rect x="0" y="-3" width="36" height="22" fill="#fff8e8" filter="url(#i7p22p2bloom)"/>
      <line x1="18" y1="-3" x2="18" y2="19" stroke="#a89878" stroke-width="0.55"/>
      <!-- Handwriting on left page -->
      <g stroke="#1a1008" stroke-width="0.4" opacity="0.7">
        <line x1="3" y1="3" x2="14" y2="3"/>
        <line x1="3" y1="7" x2="11" y2="7"/>
        <line x1="3" y1="11" x2="14" y2="11"/>
        <line x1="3" y1="15" x2="9" y2="15"/>
      </g>
      <g stroke="#1a1008" stroke-width="0.4" opacity="0.7">
        <line x1="22" y1="3" x2="32" y2="3"/>
        <line x1="22" y1="7" x2="30" y2="7"/>
        <line x1="22" y1="11" x2="32" y2="11"/>
      </g>
    </g>

    <!-- RIGHT HAND holding pencil, mid-write -->
    <g transform="translate(11 18)">
      <ellipse cx="0" cy="0" rx="3" ry="4" fill="url(#i7p22p2skin)"/>
      <!-- Pencil -->
      <line x1="-3" y1="-3" x2="-22" y2="-22" stroke="#7a4828" stroke-width="2"/>
      <line x1="-22" y1="-22" x2="-26" y2="-26" stroke="#3a2818" stroke-width="2"/>
      <!-- Pencil tip -->
      <circle cx="-26" cy="-26" r="0.85" fill="#0a0606"/>
    </g>

    <!-- Head -->
    <ellipse cx="0" cy="-72" rx="11" ry="14" fill="url(#i7p22p2skin)"/>

    <!-- BOWLER HAT -->
    <ellipse cx="0" cy="-94" rx="14" ry="3" fill="#1a1818"/>
    <path d="M-11,-94 Q0,-104 11,-94 L9,-86 L-9,-86 Z" fill="#1a1818"/>
    <!-- Hat band -->
    <line x1="-9" y1="-86" x2="9" y2="-86" stroke="#3a3030" stroke-width="0.55"/>

    <!-- Eyes — INTENT, looking down at notebook -->
    <ellipse cx="-3" cy="-72" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="-3" cy="-71" rx="1" ry="0.7" fill="#3a1808"/>
    <ellipse cx="3" cy="-72" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="3" cy="-71" rx="1" ry="0.7" fill="#3a1808"/>
    <!-- Brows — focused -->
    <line x1="-7" y1="-78" x2="-1" y2="-78" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="1" y1="-78" x2="7" y2="-78" stroke="#3a1808" stroke-width="0.7"/>

    <!-- Nose -->
    <path d="M-1,-70 L0,-62 L1,-60 Z" fill="#5a3018" opacity="0.55"/>

    <!-- Mouth — slight, intent -->
    <line x1="-3" y1="-58" x2="3" y2="-58" stroke="#3a1808" stroke-width="0.55"/>

    <!-- Slight stubble -->
    <ellipse cx="0" cy="-62" rx="6" ry="3" fill="#3a2818" opacity="0.18"/>
  </g>

  <!-- ===== DIALOGUE balloons ===== -->
  <!-- KEEPER -->
  <g>
    <rect x="14" y="14" width="280" height="36" rx="2" fill="white" stroke="#1a1818" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#1a1818" font-weight="700">KEEPER</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Something was on that gallery, and it wasn't the wind.</text>

  <!-- JOURNALIST (muttered) -->
  <g>
    <rect x="180" y="60" width="300" height="48" rx="2" fill="white" stroke="#5a5050" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,1.5"/>
  </g>
  <text x="188" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a5050" font-weight="700">JOURNALIST  <tspan font-style="italic" font-size="8" font-weight="500">(muttered)</tspan></text>
  <text x="188" y="91" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410" font-style="italic">Green lights... gallery railing...</text>
  <text x="188" y="103" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410" font-style="italic">lighthouse keeper reports...</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260"/>
  </g>
</svg>
