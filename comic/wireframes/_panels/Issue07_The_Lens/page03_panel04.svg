<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 410" width="366" height="410">
  <title>Issue 7 — Page 3 — Panel 4: Theodore passes dockworkers — performing confidence, dockworker hails him, gives directions</title>
  <desc>50mm medium eye level human scale. Theodore walks quayside passing dockworkers loading cargo from barge. Men large rough muscular. One looks at boy with mild curiosity. Theodore performs confidence chin up pace steady but eyes wide tracking. Boots backlit against river — dark massive silhouettes. Theodore exposed in open.</desc>

  <defs>
    <linearGradient id="i7p3p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa098"/>
      <stop offset="100%" stop-color="#7a8078"/>
    </linearGradient>
    <linearGradient id="i7p3p4river" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4858"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="i7p3p4stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5860"/>
      <stop offset="100%" stop-color="#2a2830"/>
    </linearGradient>
    <linearGradient id="i7p3p4dockworker" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i7p3p4linen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4c4a8"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <filter id="i7p3p4bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i7p3p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p3p4strongglow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="366" height="180" fill="url(#i7p3p4sky)"/>
  <!-- River and far bank suggestion -->
  <rect x="0" y="160" width="366" height="40" fill="#3a3838" opacity="0.85"/>
  <rect x="0" y="200" width="366" height="80" fill="url(#i7p3p4river)"/>
  <!-- Far bank chimneys/silhouettes -->
  <g fill="#1a1018" opacity="0.85">
    <rect x="40" y="160" width="20" height="20"/>
    <rect x="100" y="155" width="30" height="25"/>
    <rect x="180" y="158" width="40" height="22"/>
    <rect x="260" y="160" width="24" height="20"/>
  </g>
  <rect x="50" y="140" width="3" height="20" fill="#0a0408"/>
  <rect x="120" y="130" width="3" height="25" fill="#0a0408"/>
  <ellipse cx="121" cy="132" rx="6" ry="2" fill="#5a5560" opacity="0.7" filter="url(#i7p3p4glow)"/>
  <!-- Barge in river -->
  <ellipse cx="200" cy="240" rx="60" ry="6" fill="#1a1018"/>
  <rect x="160" y="220" width="80" height="20" fill="#1a1018"/>
  <line x1="200" y1="200" x2="200" y2="220" stroke="#0a0408" stroke-width="1.4"/>
  <!-- Cargo crates on barge -->
  <rect x="170" y="208" width="14" height="14" fill="#3a2418" stroke="#1a0c04" stroke-width="0.4"/>
  <rect x="186" y="210" width="14" height="12" fill="#3a2418" stroke="#1a0c04" stroke-width="0.4"/>
  <rect x="206" y="208" width="14" height="14" fill="#3a2418" stroke="#1a0c04" stroke-width="0.4"/>
  <rect x="222" y="212" width="14" height="10" fill="#3a2418" stroke="#1a0c04" stroke-width="0.4"/>

  <!-- Stone quay -->
  <rect x="0" y="280" width="366" height="40" fill="url(#i7p3p4stone)"/>
  <line x1="0" y1="280" x2="366" y2="280" stroke="#0a0608" stroke-width="0.7" opacity="0.85"/>
  <g stroke="#1a1418" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,300 L366,300"/>
    <line x1="40" y1="280" x2="40" y2="320"/>
    <line x1="100" y1="280" x2="100" y2="320"/>
    <line x1="160" y1="280" x2="160" y2="320"/>
    <line x1="220" y1="280" x2="220" y2="320"/>
    <line x1="280" y1="280" x2="280" y2="320"/>
    <line x1="340" y1="280" x2="340" y2="320"/>
  </g>

  <!-- Stone landing for boat / cargo at near edge -->
  <rect x="0" y="320" width="366" height="90" fill="url(#i7p3p4stone)" opacity="0.85"/>

  <!-- ===== DOCKWORKERS — large silhouettes against river, LEFT background ===== -->
  <!-- Dockworker 1 — bigger, hailing -->
  <g transform="translate(80 280)">
    <ellipse cx="0" cy="0" rx="22" ry="3" fill="#000" opacity="0.7"/>
    <!-- Wide stance, working -->
    <path d="M-22,-2 L-30,-90 L-12,-130 L0,-90 Z" fill="url(#i7p3p4dockworker)"/>
    <path d="M22,-2 L30,-90 L12,-130 L0,-90 Z" fill="url(#i7p3p4dockworker)"/>
    <!-- Heavy boots -->
    <ellipse cx="-22" cy="-2" rx="14" ry="3" fill="#0a0408"/>
    <ellipse cx="22" cy="-2" rx="14" ry="3" fill="#0a0408"/>
    <!-- Torso (shirt sleeves rolled) -->
    <path d="M-22,-130 L-30,-220 L-12,-240 L12,-240 L30,-220 L22,-130 Z" fill="url(#i7p3p4dockworker)"/>
    <!-- Apron -->
    <path d="M-22,-200 L-22,-130 L22,-130 L22,-200 Z" fill="#5a4838"/>
    <line x1="0" y1="-220" x2="0" y2="-130" stroke="#3a2818" stroke-width="0.55"/>
    <!-- Massive arms -->
    <path d="M-30,-220 L-44,-180 L-50,-140 L-36,-140 L-26,-180 Z" fill="url(#i7p3p4dockworker)"/>
    <path d="M30,-220 L44,-180 L40,-140 L26,-160 Z" fill="url(#i7p3p4dockworker)"/>
    <!-- Hands -->
    <ellipse cx="-44" cy="-140" rx="6" ry="4" fill="#a87838"/>
    <ellipse cx="44" cy="-140" rx="6" ry="4" fill="#a87838"/>
    <!-- Head -->
    <ellipse cx="0" cy="-256" rx="14" ry="16" fill="#a87838"/>
    <!-- Cap -->
    <path d="M-12,-270 Q-9,-280 0,-282 Q9,-280 12,-270 L12,-264 Q6,-268 0,-268 Q-6,-268 -12,-264 Z" fill="#1a0c04"/>
    <!-- Cap brim -->
    <path d="M-14,-264 L14,-264 L9,-260 L-9,-260 Z" fill="#0a0408"/>
    <!-- Beard / weather -->
    <path d="M-9,-250 Q0,-244 9,-250 L9,-244 Q0,-238 -9,-244 Z" fill="#5a3818" opacity="0.85"/>
    <!-- Eyes turned RIGHT toward Theodore -->
    <ellipse cx="-3" cy="-256" rx="2" ry="1" fill="#fff"/>
    <ellipse cx="3" cy="-256" rx="2" ry="1" fill="#fff"/>
    <circle cx="-2" cy="-256" r="0.85" fill="#1a0c04"/>
    <circle cx="4" cy="-256" r="0.85" fill="#1a0c04"/>
    <!-- Mouth open (mid-call) -->
    <ellipse cx="0" cy="-244" rx="2" ry="1.4" fill="#1a0c04"/>
  </g>

  <!-- Dockworker 2 — hauling cargo, far left -->
  <g transform="translate(20 280)">
    <ellipse cx="0" cy="0" rx="14" ry="2" fill="#000" opacity="0.55"/>
    <path d="M-12,-2 L-18,-80 L-6,-110 L0,-80 Z" fill="url(#i7p3p4dockworker)"/>
    <path d="M12,-2 L18,-80 L6,-100 L0,-80 Z" fill="url(#i7p3p4dockworker)"/>
    <ellipse cx="-12" cy="-2" rx="9" ry="3" fill="#0a0408"/>
    <ellipse cx="12" cy="-2" rx="9" ry="3" fill="#0a0408"/>
    <!-- Bent torso (lifting) -->
    <path d="M-18,-110 L-22,-160 L-6,-180 L20,-180 L26,-160 L22,-110 Z" fill="url(#i7p3p4dockworker)"/>
    <!-- Crate held forward -->
    <rect x="-10" y="-200" width="40" height="22" fill="#3a2418" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="-10" y1="-186" x2="30" y2="-186" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Head ducked -->
    <ellipse cx="-2" cy="-170" rx="9" ry="10" fill="#a87838"/>
    <path d="M-9,-178 Q-6,-184 -2,-186 Q4,-184 7,-178 L7,-172 Q4,-176 -2,-176 Q-7,-176 -9,-172 Z" fill="#1a0c04"/>
  </g>

  <!-- ===== THEODORE — center-right, walking RIGHT, performing confidence ===== -->
  <g transform="translate(260 320)">
    <ellipse cx="0" cy="80" rx="14" ry="2" fill="#000" opacity="0.7"/>
    <!-- Boots, mid-stride -->
    <ellipse cx="-7" cy="78" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="9" cy="80" rx="5" ry="2" fill="#1a0c04"/>
    <!-- Trousers mid-stride -->
    <path d="M-9,76 L-12,30 L-4,-10 L0,30 Z" fill="#3a3028"/>
    <path d="M9,76 L12,30 L4,-6 L0,30 Z" fill="#3a3028"/>
    <rect x="-7" y="-8" width="6" height="6" fill="#5a3018" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Waistcoat -->
    <path d="M-12,-10 L-12,-90 L12,-90 L12,-10 Z" fill="url(#i7p3p4linen)"/>
    <path d="M-14,-88 L-12,-10 L-2,-10 L-2,-88 Z" fill="#5a3018"/>
    <path d="M14,-88 L12,-10 L2,-10 L2,-88 Z" fill="#5a3018"/>
    <circle cx="-2" cy="-78" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-66" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-54" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-42" r="0.85" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-90 L0,-88 L7,-90 L7,-86 L0,-83 L-7,-86 Z" fill="#e0d4b8"/>
    <!-- Pocket -->
    <rect x="3" y="-84" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
    <ellipse cx="9" cy="-78" rx="3" ry="2" fill="#5af0a0" opacity="0.4" filter="url(#i7p3p4bloom)"/>
    <!-- Satchel -->
    <path d="M-12,-88 L18,-30" stroke="#a89878" stroke-width="3"/>
    <rect x="14" y="-28" width="22" height="20" fill="#a89878" stroke="#7a6048" stroke-width="0.7"/>
    <line x1="14" y1="-22" x2="36" y2="-22" stroke="#7a6048" stroke-width="0.55"/>
    <!-- Arms (one steady, one at side) -->
    <path d="M-12,-86 L-22,-66 L-22,-46 L-14,-50 Z" fill="#5a3018"/>
    <path d="M14,-86 L24,-66 L20,-46 L10,-50 Z" fill="#5a3018"/>
    <!-- Head — chin up but EYES WIDE -->
    <ellipse cx="0" cy="-104" rx="11" ry="12" fill="#a87838"/>
    <path d="M-10,-114 Q-7,-122 0,-124 Q7,-122 10,-114 L10,-105 Q7,-110 0,-110 Q-7,-110 -10,-105 Z" fill="#9a7038"/>
    <!-- Eyes WIDE TRACKING -->
    <ellipse cx="-3" cy="-104" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="3" cy="-104" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.85" fill="#7a4818"/>
    <circle cx="3" cy="-104" r="0.85" fill="#7a4818"/>
    <circle cx="-3" cy="-104" r="0.3" fill="#fff"/>
    <circle cx="3" cy="-104" r="0.3" fill="#fff"/>
    <!-- Brow level (performing) -->
    <line x1="-7" y1="-110" x2="-1" y2="-110" stroke="#5a3018" stroke-width="0.7"/>
    <line x1="7" y1="-110" x2="1" y2="-110" stroke="#5a3018" stroke-width="0.7"/>
    <!-- Mouth — open mid-reply -->
    <ellipse cx="0" cy="-96" rx="1.4" ry="0.7" fill="#3a1808"/>
  </g>

  <!-- DOCKWORKER dialogue -->
  <g>
    <rect x="14" y="14" width="200" height="34" rx="2" fill="white" stroke="#1a1018" stroke-width="0.85" opacity="0.95"/>
    <polygon points="80,48 92,48 84,58" fill="white" stroke="#1a1018" stroke-width="0.85"/>
    <line x1="80.5" y1="48" x2="91.5" y2="48" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1018" font-weight="700">DOCKWORKER</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Oi. You lost, boy?</text>

  <!-- THEODORE reply -->
  <g>
    <rect x="14" y="64" width="338" height="50" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="200,114 212,114 204,124" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="200.5" y1="114" x2="211.5" y2="114" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Errand for my master, sir.</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Lens-grinder on Tooley Street.</text>

  <!-- DOCKWORKER directions -->
  <g>
    <rect x="14" y="350" width="240" height="40" rx="2" fill="white" stroke="#1a1018" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,350 112,350 104,340" fill="white" stroke="#1a1018" stroke-width="0.85"/>
    <line x1="100.5" y1="350" x2="111.5" y2="350" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1018" font-weight="700">DOCKWORKER</text>
  <text x="22" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Two streets back. Mind the carts.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q100,182 200,178 Q280,176 366,180"/>
    <path d="M0,330 Q100,332 200,328 Q280,326 366,330"/>
  </g>
</svg>
