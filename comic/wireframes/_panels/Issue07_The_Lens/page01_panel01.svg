<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 270" width="742" height="270">
  <title>Issue 7 — Page 1 — Panel 1: Camp briefing — Wren projects copper-gold lighthouse, squad arranged in semicircle</title>
  <desc>28mm wide slight high angle into wall-cavity camp. Wren center beside rotating lighthouse hologram. Sable arms folded apart. Jink perched higher beam one leg dangling. Thresh weapon across knees. Luma lenses active studying schematic. Cool perimeter blue-white plus warm amber from floorboard gaps. Copper-gold schematic dominant.</desc>

  <defs>
    <linearGradient id="i7p1p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <radialGradient id="i7p1p1schematicGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#d8a060" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p1p1perimeter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a5a98" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1428" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p1p1beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3828"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="i7p1p1floorboardWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </linearGradient>
    <filter id="i7p1p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p1p1glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i7p1p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p1p1megaglow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="742" height="270" fill="url(#i7p1p1bg)"/>

  <!-- Floorboard ceiling above with warm amber bands -->
  <rect x="0" y="0" width="742" height="40" fill="#1a1208"/>
  <g opacity="0.85">
    <rect x="80" y="0" width="60" height="6" fill="url(#i7p1p1floorboardWarm)" filter="url(#i7p1p1glow)"/>
    <rect x="240" y="0" width="80" height="8" fill="url(#i7p1p1floorboardWarm)" filter="url(#i7p1p1glow)"/>
    <rect x="420" y="0" width="60" height="6" fill="url(#i7p1p1floorboardWarm)" filter="url(#i7p1p1glow)"/>
    <rect x="580" y="0" width="80" height="7" fill="url(#i7p1p1floorboardWarm)" filter="url(#i7p1p1glow)"/>
  </g>

  <!-- Cobwebs in corners -->
  <g stroke="#7a6c50" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,40 L40,80 M0,60 L40,80 M20,40 L40,80 M0,80 L40,80"/>
    <path d="M742,40 L702,80 M742,60 L702,80 M722,40 L702,80 M742,80 L702,80"/>
  </g>

  <!-- Perimeter glow halos -->
  <ellipse cx="80" cy="170" rx="60" ry="60" fill="url(#i7p1p1perimeter)" filter="url(#i7p1p1strongglow)"/>
  <ellipse cx="660" cy="170" rx="60" ry="60" fill="url(#i7p1p1perimeter)" filter="url(#i7p1p1strongglow)"/>

  <!-- Timber beams -->
  <rect x="40" y="0" width="14" height="270" fill="url(#i7p1p1beam)"/>
  <line x1="54" y1="40" x2="54" y2="240" stroke="#7898c8" stroke-width="0.55" opacity="0.55" filter="url(#i7p1p1bloom)"/>
  <rect x="688" y="0" width="14" height="270" fill="url(#i7p1p1beam)"/>
  <line x1="688" y1="40" x2="688" y2="240" stroke="#7898c8" stroke-width="0.55" opacity="0.55" filter="url(#i7p1p1bloom)"/>
  <!-- Upper horizontal beam -->
  <rect x="0" y="40" width="742" height="10" fill="url(#i7p1p1beam)"/>
  <!-- Floor beam -->
  <rect x="0" y="220" width="742" height="20" fill="url(#i7p1p1beam)"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#a8c0e8" stroke-width="0.55" opacity="0.85" filter="url(#i7p1p1bloom)"/>
  <line x1="0" y1="240" x2="742" y2="240" stroke="#080604" stroke-width="0.7"/>
  <!-- Higher horizontal beam (Jink's perch) -->
  <rect x="100" y="100" width="540" height="10" fill="url(#i7p1p1beam)"/>
  <line x1="120" y1="100" x2="620" y2="100" stroke="#5a78a8" stroke-width="0.4" opacity="0.55"/>

  <!-- ===== HOLOGRAPHIC LIGHTHOUSE SCHEMATIC — center, rotating, copper-gold ===== -->
  <g transform="translate(371 150)">
    <!-- Halo behind -->
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="url(#i7p1p1schematicGlow)" filter="url(#i7p1p1megaglow)"/>
    <!-- Lighthouse cross-section structure -->
    <g stroke="#d89858" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#i7p1p1bloom)">
      <!-- Tower body -->
      <path d="M-16,40 L-12,-30 L-18,-40 L18,-40 L12,-30 L16,40 Z"/>
      <!-- Lamp room at top -->
      <rect x="-22" y="-50" width="44" height="14"/>
      <line x1="-22" y1="-50" x2="22" y2="-50"/>
      <!-- Lens housing inside lamp room -->
      <ellipse cx="0" cy="-43" rx="14" ry="5"/>
      <ellipse cx="0" cy="-43" rx="9" ry="3"/>
      <ellipse cx="0" cy="-43" rx="4" ry="1.4"/>
      <!-- Beam emanating sideways -->
      <line x1="-22" y1="-43" x2="-50" y2="-43"/>
      <line x1="22" y1="-43" x2="50" y2="-43"/>
      <!-- Spiral staircase inside tower (zigzag) -->
      <polyline points="-10,-30 10,-22 -10,-14 10,-6 -10,2 10,10 -10,18 10,26 -10,34"/>
      <!-- Roof cap -->
      <polygon points="-20,-50 0,-58 20,-50"/>
      <line x1="0" y1="-58" x2="0" y2="-62"/>
      <circle cx="0" cy="-64" r="1"/>
      <!-- Foundation/pier -->
      <rect x="-22" y="40" width="44" height="6"/>
      <line x1="-30" y1="46" x2="30" y2="46"/>
      <!-- Entry door at base -->
      <rect x="-3" y="32" width="6" height="8"/>
    </g>
    <!-- Geometric entry markers -->
    <g fill="#ffe0a8" filter="url(#i7p1p1bloom)" opacity="0.95">
      <circle cx="0" cy="-43" r="1.4"/>
      <circle cx="0" cy="36" r="1"/>
    </g>
    <!-- Rotation indicator arcs -->
    <g stroke="#ffd898" stroke-width="0.55" fill="none" opacity="0.7" filter="url(#i7p1p1bloom)">
      <path d="M-30,30 Q0,42 30,30" stroke-dasharray="2,2"/>
      <path d="M-30,-50 Q0,-62 30,-50" stroke-dasharray="2,2"/>
    </g>
    <!-- Data callouts -->
    <text x="50" y="-40" font-family="monospace" font-size="3" fill="#ffd898" filter="url(#i7p1p1bloom)" opacity="0.85">FRESNEL</text>
    <text x="50" y="-34" font-family="monospace" font-size="3" fill="#ffd898" filter="url(#i7p1p1bloom)" opacity="0.85">2nd ORDER</text>
    <text x="-78" y="36" font-family="monospace" font-size="3" fill="#ffd898" filter="url(#i7p1p1bloom)" opacity="0.85">ENTRY</text>
  </g>

  <!-- ===== WREN — center, beside schematic, mid-gesture ===== -->
  <g transform="translate(310 218)">
    <ellipse cx="0" cy="2" rx="6" ry="1" fill="#000" opacity="0.7"/>
    <!-- Legs -->
    <path d="M-3,0 L-4,-12 L-2,-18 L0,-12 Z" fill="#a85820"/>
    <path d="M3,0 L4,-12 L2,-18 L0,-12 Z" fill="#a85820"/>
    <!-- Copper dust knees -->
    <ellipse cx="-3" cy="-12" rx="2" ry="0.7" fill="#3a1808" opacity="0.85"/>
    <ellipse cx="3" cy="-12" rx="2" ry="0.7" fill="#3a1808" opacity="0.85"/>
    <!-- Torso -->
    <path d="M-4,-18 L-5,-30 L-3,-36 L4,-36 L5,-30 L4,-18 Z" fill="#a85820"/>
    <line x1="0" y1="-36" x2="0" y2="-18" stroke="#f0c898" stroke-width="0.4" opacity="0.85" filter="url(#i7p1p1bloom)"/>
    <!-- Oil stains on forearms -->
    <ellipse cx="-7" cy="-22" rx="2" ry="1" fill="#1a0c04" opacity="0.85"/>
    <!-- RIGHT arm RAISED gesturing at schematic -->
    <path d="M5,-34 L18,-24 L22,-12 L14,-16 Z" fill="#a85820"/>
    <ellipse cx="22" cy="-12" rx="2" ry="1.4" fill="#a87838"/>
    <!-- LEFT arm at side -->
    <path d="M-5,-34 L-9,-24 L-7,-12 L-3,-18 Z" fill="#a85820"/>
    <!-- Head — turned to the right toward schematic -->
    <ellipse cx="0" cy="-42" rx="3" ry="3.4" fill="#a87838"/>
    <!-- High messy bun -->
    <ellipse cx="0" cy="-48" rx="2" ry="1.4" fill="#1a0a04"/>
    <line x1="-2" y1="-46" x2="-1" y2="-49" stroke="#1a0a04" stroke-width="0.4"/>
    <line x1="2" y1="-46" x2="1" y2="-49" stroke="#1a0a04" stroke-width="0.4"/>
    <!-- Eyes -->
    <ellipse cx="-1" cy="-42" rx="0.85" ry="0.4" fill="#fff"/>
    <ellipse cx="1" cy="-42" rx="0.85" ry="0.4" fill="#fff"/>
    <circle cx="-0.7" cy="-42" r="0.3" fill="#1a0c04"/>
    <circle cx="1.4" cy="-42" r="0.3" fill="#1a0c04"/>
    <!-- Mouth (mid-word) -->
    <line x1="-1.4" y1="-38" x2="1.4" y2="-38" stroke="#3a1808" stroke-width="0.3"/>
    <!-- Comms earpiece (faint copper glow at ear) -->
    <circle cx="3" cy="-43" r="0.55" fill="#d89858" filter="url(#i7p1p1bloom)" opacity="0.7"/>
  </g>

  <!-- ===== SABLE — left of schematic, arms folded, apart ===== -->
  <g transform="translate(180 218)">
    <ellipse cx="0" cy="2" rx="6" ry="1" fill="#000" opacity="0.7"/>
    <!-- Legs -->
    <path d="M-3,0 L-4,-12 L-2,-18 L0,-12 Z" fill="#7898c8"/>
    <path d="M3,0 L4,-12 L2,-18 L0,-12 Z" fill="#7898c8"/>
    <!-- Torso (pewter-grey) -->
    <path d="M-4,-18 L-5,-30 L-3,-36 L4,-36 L5,-30 L4,-18 Z" fill="#506890"/>
    <line x1="0" y1="-36" x2="0" y2="-18" stroke="#a8c0e8" stroke-width="0.4" opacity="0.85" filter="url(#i7p1p1bloom)"/>
    <!-- Soot bloom right shoulder -->
    <ellipse cx="4" cy="-32" rx="3" ry="1.4" fill="#1a1814" opacity="0.85"/>
    <!-- Tension crease at collar -->
    <line x1="-1" y1="-35" x2="-1" y2="-32" stroke="#0a0a14" stroke-width="0.4" opacity="0.95"/>
    <line x1="1" y1="-35" x2="1" y2="-32" stroke="#0a0a14" stroke-width="0.4" opacity="0.95"/>
    <!-- ARMS FOLDED across chest -->
    <path d="M-5,-34 L-7,-26 L-2,-22 L4,-26 L7,-22 L5,-34 L0,-30 Z" fill="#506890"/>
    <line x1="-3" y1="-26" x2="3" y2="-26" stroke="#3a4868" stroke-width="0.4"/>
    <!-- Head -->
    <ellipse cx="0" cy="-42" rx="3" ry="3.4" fill="#5a3a28"/>
    <!-- Silver-white buzz cut -->
    <path d="M-3,-46 Q-3,-48 0,-49 Q3,-48 3,-46 L3,-44 Q1,-45 0,-45 Q-1,-45 -3,-44 Z" fill="#d8e4f8"/>
    <!-- Eyes (looking right toward schematic, neutral) -->
    <ellipse cx="-1" cy="-42" rx="0.85" ry="0.4" fill="#fff8e8"/>
    <ellipse cx="1" cy="-42" rx="0.85" ry="0.4" fill="#fff8e8"/>
    <circle cx="-0.4" cy="-42" r="0.3" fill="#1a1c30"/>
    <circle cx="1.4" cy="-42" r="0.3" fill="#1a1c30"/>
    <!-- Mouth set -->
    <line x1="-1.4" y1="-38" x2="1.4" y2="-38" stroke="#1a0c08" stroke-width="0.3"/>
    <!-- Comms ear glow -->
    <circle cx="3" cy="-43" r="0.55" fill="#a8c0e8" filter="url(#i7p1p1bloom)" opacity="0.7"/>
  </g>

  <!-- ===== JINK — perched on higher beam, leg dangling ===== -->
  <g transform="translate(560 100)">
    <ellipse cx="0" cy="2" rx="5" ry="1" fill="#000" opacity="0.55"/>
    <!-- Sitting: thigh on beam, lower leg dangling -->
    <ellipse cx="-2" cy="-1" rx="4" ry="2" fill="#2ed078"/>
    <!-- Dangling leg -->
    <path d="M3,0 L5,12 L4,22 L7,22 L6,10 L4,-1 Z" fill="#2ed078"/>
    <!-- Other leg tucked -->
    <ellipse cx="-3" cy="-3" rx="3" ry="1.4" fill="#2ed078"/>
    <!-- Soot streak across chest -->
    <!-- Torso -->
    <path d="M-4,-3 L-5,-14 L-3,-20 L4,-20 L5,-14 L4,-3 Z" fill="#2ed078"/>
    <line x1="-4" y1="-12" x2="4" y2="-10" stroke="#1a1410" stroke-width="0.7" opacity="0.85"/>
    <!-- Hand gripping beam edge -->
    <path d="M-5,-12 L-9,-10 L-9,-6 L-5,-8 Z" fill="#2ed078"/>
    <ellipse cx="-9" cy="-8" rx="1.4" ry="1" fill="#a87838"/>
    <!-- Right arm -->
    <path d="M5,-12 L7,-6 L4,-2 L4,-6 Z" fill="#2ed078"/>
    <!-- Head leaning forward -->
    <ellipse cx="0" cy="-26" rx="3" ry="3.4" fill="#d8a878"/>
    <!-- Wild golden curls -->
    <path d="M-3,-30 Q-3,-34 0,-34 Q3,-34 3,-30 L3,-28 Q1,-29 0,-29 Q-1,-29 -3,-28 Z" fill="#f0d878"/>
    <circle cx="-3" cy="-32" r="0.85" fill="#f0d878"/>
    <circle cx="3" cy="-32" r="0.85" fill="#f0d878"/>
    <circle cx="0" cy="-34" r="0.85" fill="#f0d878"/>
    <!-- Eyes -->
    <ellipse cx="-1" cy="-26" rx="0.85" ry="0.4" fill="#fff"/>
    <ellipse cx="1" cy="-26" rx="0.85" ry="0.4" fill="#fff"/>
    <circle cx="-1" cy="-26" r="0.3" fill="#1a4a28"/>
    <circle cx="1" cy="-26" r="0.3" fill="#1a4a28"/>
    <!-- Slight grin -->
    <path d="M-1.4,-22 Q0,-21 1.4,-22" stroke="#3a1808" stroke-width="0.3" fill="none"/>
    <!-- Comms ear -->
    <circle cx="3" cy="-27" r="0.55" fill="#5af0a0" filter="url(#i7p1p1bloom)" opacity="0.7"/>
  </g>

  <!-- ===== THRESH — sitting, weapon across knees, lower right ===== -->
  <g transform="translate(450 218)">
    <ellipse cx="0" cy="2" rx="7" ry="1" fill="#000" opacity="0.7"/>
    <!-- Sitting: legs forward bent -->
    <path d="M-7,0 L-9,-8 L-2,-14 L0,-8 Z" fill="#dc2030"/>
    <path d="M7,0 L9,-8 L2,-14 L0,-8 Z" fill="#dc2030"/>
    <!-- Torso bent forward -->
    <path d="M-6,-14 L-7,-26 L-4,-32 L4,-32 L7,-26 L6,-14 Z" fill="#dc2030"/>
    <!-- Dented left pauldron -->
    <path d="M-7,-26 L-10,-24 L-10,-20 L-7,-22 Z" fill="#7a1a28"/>
    <line x1="-9" y1="-22" x2="-7" y2="-24" stroke="#3a0c14" stroke-width="0.55"/>
    <!-- Right pauldron -->
    <path d="M7,-26 L10,-24 L10,-20 L7,-22 Z" fill="#7a1a28"/>
    <!-- Arms holding weapon across knees -->
    <path d="M-7,-26 L-10,-18 L-6,-14 L-4,-20 Z" fill="#dc2030"/>
    <path d="M7,-26 L10,-18 L6,-14 L4,-20 Z" fill="#dc2030"/>
    <!-- WEAPON across lap -->
    <rect x="-8" y="-12" width="16" height="2" fill="#3a2828" stroke="#1a0c0a" stroke-width="0.3"/>
    <rect x="-2" y="-13" width="6" height="3" fill="#1a0c0a"/>
    <line x1="-8" y1="-11" x2="8" y2="-11" stroke="#dc2030" stroke-width="0.4" opacity="0.85" filter="url(#i7p1p1bloom)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-38" rx="3" ry="3.4" fill="#a87838"/>
    <!-- Copper-red buzz cut -->
    <path d="M-3,-42 Q-3,-44 0,-45 Q3,-44 3,-42 L3,-40 Q1,-41 0,-41 Q-1,-41 -3,-40 Z" fill="#a83828"/>
    <!-- Eyes alert -->
    <ellipse cx="-1" cy="-38" rx="0.85" ry="0.4" fill="#fff"/>
    <ellipse cx="1" cy="-38" rx="0.85" ry="0.4" fill="#fff"/>
    <circle cx="-1" cy="-38" r="0.3" fill="#3a1808"/>
    <circle cx="1" cy="-38" r="0.3" fill="#3a1808"/>
    <!-- Mouth set -->
    <line x1="-1.4" y1="-34" x2="1.4" y2="-34" stroke="#1a0c08" stroke-width="0.3"/>
    <!-- Comms ear -->
    <circle cx="3" cy="-39" r="0.55" fill="#ff4458" filter="url(#i7p1p1bloom)" opacity="0.7"/>
  </g>

  <!-- ===== LUMA — right side, lenses active studying schematic ===== -->
  <g transform="translate(620 218)">
    <ellipse cx="0" cy="2" rx="5" ry="1" fill="#000" opacity="0.55"/>
    <!-- Legs -->
    <path d="M-3,0 L-4,-12 L-2,-18 L0,-12 Z" fill="#5a3ad8"/>
    <path d="M3,0 L4,-12 L2,-18 L0,-12 Z" fill="#5a3ad8"/>
    <!-- Torso -->
    <path d="M-4,-18 L-5,-30 L-3,-36 L4,-36 L5,-30 L4,-18 Z" fill="#5a3ad8"/>
    <line x1="0" y1="-36" x2="0" y2="-18" stroke="#a888ff" stroke-width="0.4" opacity="0.85" filter="url(#i7p1p1bloom)"/>
    <!-- Dust + ink -->
    <ellipse cx="-3" cy="-26" rx="2" ry="0.7" fill="#a8a098" opacity="0.7"/>
    <!-- Arms (one raised pointing/scrolling) -->
    <path d="M-5,-34 L-9,-26 L-7,-18 L-3,-22 Z" fill="#5a3ad8"/>
    <path d="M5,-34 L9,-30 L7,-18 L3,-22 Z" fill="#5a3ad8"/>
    <ellipse cx="9" cy="-30" rx="1.4" ry="1" fill="#a87858"/>
    <!-- Head -->
    <ellipse cx="0" cy="-42" rx="3" ry="3.4" fill="#7a4838"/>
    <!-- Long braid (visible falling behind) -->
    <path d="M-3,-46 Q-3,-48 0,-49 Q3,-48 3,-46 L3,-44 Q1,-45 0,-45 Q-1,-45 -3,-44 Z" fill="#0a0604"/>
    <path d="M-3,-44 Q-5,-30 -4,-22" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <!-- Holographic LENSES active -->
    <ellipse cx="-1" cy="-42" rx="1" ry="0.7" fill="#a888ff" filter="url(#i7p1p1bloom)" opacity="0.95"/>
    <ellipse cx="1" cy="-42" rx="1" ry="0.7" fill="#a888ff" filter="url(#i7p1p1bloom)" opacity="0.95"/>
    <circle cx="-0.7" cy="-42" r="0.3" fill="#1a0a04"/>
    <circle cx="1.4" cy="-42" r="0.3" fill="#1a0a04"/>
    <!-- Cracked left lens (tiny line) -->
    <line x1="-1.4" y1="-42.5" x2="-0.7" y2="-41.5" stroke="#1a0a04" stroke-width="0.2"/>
    <!-- Mouth -->
    <line x1="-1" y1="-38" x2="1" y2="-38" stroke="#3a1808" stroke-width="0.3"/>
    <!-- Comms ear -->
    <circle cx="3" cy="-43" r="0.55" fill="#a888ff" filter="url(#i7p1p1bloom)" opacity="0.7"/>
  </g>

  <!-- WREN dialogue 1 -->
  <g>
    <rect x="14" y="14" width="320" height="40" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="200,54 212,54 204,64" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="200.5" y1="54" x2="211.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Target: Fresnel lens. River lighthouse.</text>

  <!-- JINK + WREN exchange -->
  <g>
    <rect x="408" y="14" width="160" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95"/>
    <polygon points="500,54 512,54 504,64" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="500.5" y1="54" x2="511.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="416" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2ed078" font-weight="700">JINK</text>
  <text x="416" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">We can't just take it?</text>

  <g>
    <rect x="588" y="14" width="140" height="40" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="640,54 652,54 644,64" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="640.5" y1="54" x2="651.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="596" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="596" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Lights save lives.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q200,92 400,88 Q580,86 742,90"/>
    <path d="M0,240 Q200,242 400,238 Q580,236 742,240"/>
  </g>
</svg>
