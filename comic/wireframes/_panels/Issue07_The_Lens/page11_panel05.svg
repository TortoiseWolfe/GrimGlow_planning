<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 7 — Page 11 — Panel 5: First pin releases — oil-stained hands precise on brass, holographic tool wrapped, thin rainbow edge</title>
  <desc>85mm close-up eye level fairy scale. Oil-stained hands grip brass spring-loaded pin — cylinder size of forearm. Copper-gold holographic tool wraps geometric light around pin mechanism spring compressing. Pin slides free precise control. Above hands glass ring brass framework shifts almost imperceptibly. Amber lamplight refracts through glass casting warm geometric patterns. Holographic tool copper-gold structured light — clean alien precision against Victorian brass. Thin rainbow edge appears where pin removed. Oil stains contrast precision brass.</desc>

  <defs>
    <linearGradient id="i7p11p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="i7p11p5amber" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p11p5brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="50%" stop-color="#f0c898"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p11p5skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <radialGradient id="i7p11p5toolGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p11p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p11p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p11p5strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="366" height="280" fill="url(#i7p11p5bg)"/>

  <!-- Amber atmosphere -->
  <ellipse cx="183" cy="140" rx="280" ry="200" fill="url(#i7p11p5amber)" filter="url(#i7p11p5strongglow)"/>

  <!-- ===== GLASS RING above (with thin rainbow edge where pin was) ===== -->
  <g filter="url(#i7p11p5bloom)">
    <ellipse cx="183" cy="-30" rx="200" ry="80" fill="none" stroke="#fff8c8" stroke-width="2" opacity="0.95"/>
    <ellipse cx="183" cy="-30" rx="200" ry="80" fill="#ffd898" opacity="0.18"/>
    <!-- Thin rainbow edge at boundary -->
    <ellipse cx="183" cy="-30" rx="200" ry="80" fill="none" stroke="#ff8a78" stroke-width="0.4" opacity="0.55"/>
    <ellipse cx="183" cy="-30" rx="201" ry="81" fill="none" stroke="#a8c0e8" stroke-width="0.4" opacity="0.55"/>
  </g>

  <!-- ===== BRASS PIN (massive, center) — half extracted ===== -->
  <g transform="translate(183 100)">
    <!-- Pin cylinder body (released, lifted from socket) -->
    <rect x="-14" y="-30" width="28" height="80" fill="url(#i7p11p5brass)" stroke="#5a3018" stroke-width="0.85"/>
    <!-- Pin cap -->
    <ellipse cx="0" cy="-30" rx="14" ry="6" fill="#f0c898" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Pin highlights -->
    <line x1="-9" y1="-25" x2="-9" y2="45" stroke="#fff8c8" stroke-width="1" filter="url(#i7p11p5bloom)" opacity="0.85"/>
    <line x1="9" y1="-25" x2="9" y2="45" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Threading rings -->
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#5a3018" stroke-width="0.55"/>
    <line x1="-14" y1="20" x2="14" y2="20" stroke="#5a3018" stroke-width="0.55"/>
    <line x1="-14" y1="40" x2="14" y2="40" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Spring (visible compressed below pin) -->
    <g stroke="#5a3018" stroke-width="0.7" fill="none">
      <path d="M-9,50 L-3,55 L-9,60 L-3,65 L-9,70 L-3,75"/>
    </g>
  </g>

  <!-- ===== HOLOGRAPHIC TOOL wrapping around pin ===== -->
  <g transform="translate(183 100)" opacity="0.95" filter="url(#i7p11p5bloom)">
    <!-- Halo glow -->
    <ellipse cx="0" cy="10" rx="60" ry="40" fill="url(#i7p11p5toolGlow)" filter="url(#i7p11p5strongglow)"/>
    <!-- Geometric tool wrapped around pin -->
    <g stroke="#ffd898" stroke-width="0.7" fill="none">
      <ellipse cx="0" cy="10" rx="40" ry="20"/>
      <ellipse cx="0" cy="10" rx="32" ry="14"/>
      <line x1="-40" y1="10" x2="-22" y2="10"/>
      <line x1="22" y1="10" x2="40" y2="10"/>
      <line x1="0" y1="-10" x2="0" y2="30"/>
      <!-- Engagement points -->
      <circle cx="-22" cy="10" r="2"/>
      <circle cx="22" cy="10" r="2"/>
    </g>
    <!-- Bright nodes at engagement -->
    <circle cx="-22" cy="10" r="1.4" fill="#fff" filter="url(#i7p11p5bloom)"/>
    <circle cx="22" cy="10" r="1.4" fill="#fff" filter="url(#i7p11p5bloom)"/>
  </g>

  <!-- ===== HANDS — oil-stained, gripping pin from below ===== -->
  <!-- LEFT hand from lower-left -->
  <g transform="translate(140 220)">
    <!-- Sleeve cuff -->
    <path d="M-30,-30 L-20,-50 L20,-50 L30,-30 L30,0 L-30,0 Z" fill="#a85820"/>
    <!-- Hand reaching up -->
    <path d="M-30,0 L-30,40 L0,50 L30,40 L30,0 Z" fill="url(#i7p11p5skin)"/>
    <!-- Fingers gripping pin (extended up) -->
    <ellipse cx="-9" cy="-30" rx="3" ry="14" fill="url(#i7p11p5skin)"/>
    <ellipse cx="0" cy="-40" rx="3" ry="20" fill="url(#i7p11p5skin)"/>
    <ellipse cx="9" cy="-30" rx="3" ry="14" fill="url(#i7p11p5skin)"/>
    <!-- Thumb -->
    <ellipse cx="-22" cy="-12" rx="3" ry="9" fill="url(#i7p11p5skin)"/>

    <!-- Tendons -->
    <line x1="-22" y1="-10" x2="-9" y2="-30" stroke="#5a3818" stroke-width="0.55" opacity="0.7"/>
    <line x1="-12" y1="-6" x2="0" y2="-40" stroke="#5a3818" stroke-width="0.55" opacity="0.7"/>
    <line x1="0" y1="-2" x2="9" y2="-30" stroke="#5a3818" stroke-width="0.55" opacity="0.7"/>
    <!-- Knuckle highlights -->
    <ellipse cx="-9" cy="-22" rx="2.4" ry="1" fill="#f0c898" filter="url(#i7p11p5bloom)" opacity="0.85"/>
    <ellipse cx="0" cy="-30" rx="2.4" ry="1" fill="#f0c898" filter="url(#i7p11p5bloom)" opacity="0.85"/>
    <ellipse cx="9" cy="-22" rx="2.4" ry="1" fill="#f0c898" filter="url(#i7p11p5bloom)" opacity="0.85"/>

    <!-- HEAVY OIL STAINS on fingers -->
    <ellipse cx="-9" cy="-10" rx="3" ry="9" fill="#1a0c04" opacity="0.85"/>
    <ellipse cx="0" cy="-20" rx="3" ry="14" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="9" cy="-10" rx="3" ry="9" fill="#1a0c04" opacity="0.85"/>
    <ellipse cx="-12" cy="6" rx="6" ry="4" fill="#0a0604" opacity="0.85"/>
    <ellipse cx="14" cy="14" rx="9" ry="3" fill="#0a0604" opacity="0.7"/>
  </g>

  <!-- RIGHT hand from lower-right (steadying pin) -->
  <g transform="translate(220 220)">
    <path d="M-30,-30 L-20,-50 L20,-50 L30,-30 L30,0 L-30,0 Z" fill="#a85820"/>
    <path d="M-30,0 L-30,40 L0,50 L30,40 L30,0 Z" fill="url(#i7p11p5skin)"/>
    <ellipse cx="-9" cy="-30" rx="3" ry="14" fill="url(#i7p11p5skin)"/>
    <ellipse cx="0" cy="-30" rx="3" ry="14" fill="url(#i7p11p5skin)"/>
    <ellipse cx="9" cy="-30" rx="3" ry="14" fill="url(#i7p11p5skin)"/>
    <!-- Highlights -->
    <ellipse cx="-9" cy="-22" rx="2.4" ry="1" fill="#f0c898" filter="url(#i7p11p5bloom)" opacity="0.85"/>
    <ellipse cx="0" cy="-22" rx="2.4" ry="1" fill="#f0c898" filter="url(#i7p11p5bloom)" opacity="0.85"/>
    <ellipse cx="9" cy="-22" rx="2.4" ry="1" fill="#f0c898" filter="url(#i7p11p5bloom)" opacity="0.85"/>

    <!-- Oil stains -->
    <ellipse cx="-9" cy="-10" rx="3" ry="9" fill="#1a0c04" opacity="0.85"/>
    <ellipse cx="9" cy="-10" rx="3" ry="9" fill="#1a0c04" opacity="0.85"/>
    <ellipse cx="0" cy="14" rx="9" ry="3" fill="#0a0604" opacity="0.7"/>
  </g>

  <!-- WREN whisper -->
  <g>
    <rect x="14" y="14" width="338" height="40" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="160,54 172,54 164,64" fill="white" stroke="#c87a35" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN  <tspan font-style="italic" font-size="8" font-weight="500">(comms, whispered)</tspan></text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">First pin. Clean. Moving to second.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q100,142 200,138 Q280,136 366,140"/>
    <path d="M0,220 Q100,222 200,218 Q280,216 366,220"/>
  </g>
</svg>
