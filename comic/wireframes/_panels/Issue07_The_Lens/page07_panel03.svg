<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 470" width="366" height="470">
  <title>Issue 7 — Page 7 — Panel 3: Jink launches — wing-pack deployed brilliant emerald, banking over dark water toward lighthouse</title>
  <desc>50mm slight high angle. Jink launches from stone surface — holographic dragonfly wings fully deployed brilliant emerald-green geometric lattice blazing to life lifting in burst structured prismatic light. Wild golden curls stream back. Banks hard fast over dark water toward lighthouse background. Emerald prismatic wing-trails streak behind against dark waterfront. Sharp focus mission face. Lighthouse beam sweeps amber background. Black water reflects emerald streak.</desc>

  <defs>
    <linearGradient id="i7p7p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p7p3river" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <radialGradient id="i7p7p3wingHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5af0a0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a6838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p7p3lighthouseHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p7p3suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p7p3stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p7p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i7p7p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p7p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p7p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p7p3megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="366" height="470" fill="url(#i7p7p3bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="40" cy="40" r="0.55"/>
    <circle cx="180" cy="60" r="0.4"/>
    <circle cx="280" cy="40" r="0.55"/>
    <circle cx="320" cy="100" r="0.4"/>
  </g>

  <!-- Lighthouse far background top right -->
  <g transform="translate(310 90)">
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="url(#i7p7p3lighthouseHalo)" filter="url(#i7p7p3megaglow)"/>
    <path d="M-7,30 L-5,-10 L-9,-15 L9,-15 L5,-10 L7,30 Z" fill="#3a2418"/>
    <rect x="-12" y="-25" width="24" height="10" fill="#1a1818"/>
    <ellipse cx="0" cy="-20" rx="9" ry="3" fill="#fff8c8" filter="url(#i7p7p3bloom)"/>
    <!-- Beam sweeping -->
    <path d="M-12,-20 L-200,-50 L-200,10 L-12,-15 Z" fill="#ffd898" opacity="0.4" filter="url(#i7p7p3megaglow)"/>
  </g>

  <!-- River — black water -->
  <rect x="0" y="180" width="366" height="220" fill="url(#i7p7p3river)"/>
  <!-- Water reflections -->
  <g stroke="#1a1818" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,220 L366,220"/>
    <path d="M0,260 L366,260"/>
    <path d="M0,300 L366,300"/>
    <path d="M0,340 L366,340"/>
  </g>

  <!-- ===== EMERALD STREAK in water (reflection of wings) ===== -->
  <path d="M40,440 Q120,420 220,400 Q280,380 320,360" stroke="#5af0a0" stroke-width="3" fill="none" opacity="0.55" filter="url(#i7p7p3strongglow)"/>
  <path d="M40,440 Q120,420 220,400 Q280,380 320,360" stroke="#fff8ff" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#i7p7p3bloom)"/>

  <!-- Stone quay lower-left (just launched from) -->
  <rect x="0" y="400" width="120" height="70" fill="url(#i7p7p3stone)"/>
  <line x1="0" y1="400" x2="120" y2="400" stroke="#1a1418" stroke-width="0.55"/>

  <!-- ===== JINK — mid-launch, banking, WING-PACK BLAZING ===== -->
  <g transform="translate(180 280)">
    <!-- HUGE WING-PACK HALO -->
    <ellipse cx="0" cy="0" rx="160" ry="100" fill="url(#i7p7p3wingHalo)" filter="url(#i7p7p3megaglow)"/>

    <!-- DRAGONFLY WINGS DEPLOYED — geometric lattice -->
    <g stroke="#5af0a0" stroke-width="1.4" fill="none" opacity="0.95" filter="url(#i7p7p3bloom)">
      <!-- Upper left wing -->
      <path d="M-12,-8 L-100,-44 L-130,-22 L-100,-4 L-30,-2 Z"/>
      <line x1="-100" y1="-44" x2="-100" y2="-4"/>
      <line x1="-30" y1="-2" x2="-130" y2="-22"/>
      <line x1="-60" y1="-30" x2="-60" y2="-12"/>
      <line x1="-40" y1="-22" x2="-90" y2="-30"/>
      <!-- Lower left wing -->
      <path d="M-12,2 L-100,30 L-130,12 L-100,-4 L-30,2 Z"/>
      <line x1="-100" y1="-4" x2="-100" y2="30"/>
      <line x1="-60" y1="0" x2="-60" y2="22"/>
      <!-- Upper right wing -->
      <path d="M12,-8 L100,-44 L130,-22 L100,-4 L30,-2 Z"/>
      <line x1="100" y1="-44" x2="100" y2="-4"/>
      <line x1="30" y1="-2" x2="130" y2="-22"/>
      <line x1="60" y1="-30" x2="60" y2="-12"/>
      <line x1="40" y1="-22" x2="90" y2="-30"/>
      <!-- Lower right wing -->
      <path d="M12,2 L100,30 L130,12 L100,-4 L30,2 Z"/>
      <line x1="100" y1="-4" x2="100" y2="30"/>
      <line x1="60" y1="0" x2="60" y2="22"/>
    </g>
    <!-- Bright wing membrane fill -->
    <g fill="#5af0a0" opacity="0.4" filter="url(#i7p7p3bloom)">
      <path d="M-12,-8 L-100,-44 L-130,-22 L-100,-4 L-30,-2 Z"/>
      <path d="M12,-8 L100,-44 L130,-22 L100,-4 L30,-2 Z"/>
      <path d="M-12,2 L-100,30 L-130,12 L-100,-4 L-30,2 Z"/>
      <path d="M12,2 L100,30 L130,12 L100,-4 L30,2 Z"/>
    </g>

    <!-- Body — banking pose, leaning right -->
    <path d="M-9,-30 L-12,30 L-3,42 L9,32 L12,-30 Z" fill="url(#i7p7p3suit)"/>
    <line x1="0" y1="-30" x2="0" y2="42" stroke="#a8ffd0" stroke-width="0.7" opacity="0.85" filter="url(#i7p7p3bloom)"/>
    <!-- Soot streak -->
    <path d="M-9,-12 L9,-8" stroke="#1a1410" stroke-width="3" opacity="0.85"/>

    <!-- Arms streamlined back -->
    <path d="M-9,-22 L-22,-12 L-26,2 L-12,-2 Z" fill="url(#i7p7p3suit)"/>
    <path d="M9,-22 L22,-12 L26,2 L12,-2 Z" fill="url(#i7p7p3suit)"/>

    <!-- Legs extended back -->
    <path d="M-3,42 L-9,80 L-3,90 L0,80 Z" fill="url(#i7p7p3suit)"/>
    <path d="M9,32 L9,80 L14,90 L9,80 Z" fill="url(#i7p7p3suit)"/>

    <!-- Head -->
    <ellipse cx="2" cy="-44" rx="9" ry="11" fill="url(#i7p7p3skin)"/>
    <!-- WILD CURLS streaming back from launch wind -->
    <path d="M-7,-54 Q-10,-66 -3,-72 L9,-66 Q12,-58 11,-50 L11,-46 Q9,-50 2,-50 Q-5,-50 -7,-46 Z" fill="#f0d878"/>
    <!-- Trailing curls behind -->
    <circle cx="-12" cy="-66" r="3" fill="#f0d878"/>
    <circle cx="-5" cy="-72" r="2.4" fill="#f0d878"/>
    <circle cx="3" cy="-74" r="2.4" fill="#f0d878"/>
    <path d="M-14,-58 L-26,-50" stroke="#f0d878" stroke-width="1.4" fill="none"/>
    <path d="M-12,-66 L-24,-66" stroke="#f0d878" stroke-width="1.4" fill="none"/>

    <!-- Eyes — sharp focus mission face -->
    <ellipse cx="-1" cy="-44" rx="1.4" ry="0.7" fill="#fff"/>
    <ellipse cx="5" cy="-44" rx="1.4" ry="0.7" fill="#fff"/>
    <ellipse cx="-0.5" cy="-44" rx="0.85" ry="0.55" fill="#1a4a28"/>
    <ellipse cx="5.5" cy="-44" rx="0.85" ry="0.55" fill="#1a4a28"/>
    <circle cx="-0.5" cy="-44" r="0.3" fill="#fff"/>
    <circle cx="5.5" cy="-44" r="0.3" fill="#fff"/>
    <!-- Brow set focus -->
    <path d="M-5,-50 Q-1,-52 2,-50" stroke="#5a3018" stroke-width="0.7" fill="none"/>
    <path d="M9,-50 Q5,-52 2,-50" stroke="#5a3018" stroke-width="0.7" fill="none"/>
    <!-- Mouth set -->
    <line x1="-1" y1="-36" x2="5" y2="-36" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- WING TRAILS streaking behind through frame -->
  <g opacity="0.85" filter="url(#i7p7p3bloom)">
    <path d="M50,400 Q100,360 150,310" stroke="#5af0a0" stroke-width="2.4" fill="none"/>
    <path d="M50,400 Q100,360 150,310" stroke="#fff8ff" stroke-width="0.85" fill="none"/>
    <path d="M70,420 Q120,380 170,330" stroke="#5af0a0" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M30,380 Q80,340 130,290" stroke="#5af0a0" stroke-width="1.4" fill="none" opacity="0.7"/>
  </g>

  <!-- (No dialogue — launch is visual) -->
  <g>
    <rect x="14" y="14" width="180" height="34" rx="2" fill="white" stroke="#1a1a1a" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="700" font-style="italic">*FWHHHM*</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a6838" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q100,182 200,178 Q280,176 366,180"/>
    <path d="M0,380 Q100,382 200,378 Q280,376 366,380"/>
  </g>
</svg>
