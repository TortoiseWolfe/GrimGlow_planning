<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 7 — Page 10 — Panel 1: The lighthouse approach — three tiny figures scale the iron mountain, Jink orbits on emerald wings</title>
  <desc>28mm wide establishing slight low angle dual scale. Lighthouse at night squat iron-and-brick rises from stone pier lamp burning top amber beam sweeping black river. Three tiny figures approach waterline side pier — Sable Wren climbing exterior stonework, Jink circling above on deployed wings. Tower mountain. Iron gallery railing bridge. Lamp room distant summit amber light.</desc>

  <defs>
    <linearGradient id="i7p10p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p10p1tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3838"/>
      <stop offset="50%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="i7p10p1iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <radialGradient id="i7p10p1lampHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p10p1beamCone" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p10p1water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p10p1stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <filter id="i7p10p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p10p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p10p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p10p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="280" fill="url(#i7p10p1bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="80" cy="20" r="0.55"/>
    <circle cx="200" cy="40" r="0.4"/>
    <circle cx="320" cy="20" r="0.4"/>
    <circle cx="440" cy="40" r="0.55"/>
    <circle cx="600" cy="20" r="0.4"/>
    <circle cx="700" cy="50" r="0.55"/>
    <circle cx="160" cy="60" r="0.3"/>
    <circle cx="540" cy="70" r="0.3"/>
  </g>

  <!-- Beam cone sweeping LEFT through panel -->
  <ellipse cx="450" cy="40" rx="320" ry="120" fill="url(#i7p10p1beamCone)" filter="url(#i7p10p1megaglow)"/>

  <!-- Stone pier (foreground bottom) -->
  <path d="M0,250 L742,230 L742,280 L0,280 Z" fill="url(#i7p10p1stone)"/>
  <line x1="0" y1="250" x2="742" y2="230" stroke="#0a0608" stroke-width="0.85"/>

  <!-- Black water -->
  <rect x="0" y="220" width="742" height="40" fill="url(#i7p10p1water)" opacity="0.85"/>

  <!-- ===== LIGHTHOUSE — center, towering ===== -->
  <g transform="translate(450 250)">
    <!-- Halo at top -->
    <ellipse cx="0" cy="-200" rx="120" ry="80" fill="url(#i7p10p1lampHalo)" filter="url(#i7p10p1megaglow)"/>

    <!-- Tower body — squat brick -->
    <path d="M-50,0 L-44,-160 L-60,-180 L60,-180 L44,-160 L50,0 Z" fill="url(#i7p10p1tower)"/>
    <!-- Brick courses (horizontal lines at fairy scale) -->
    <g stroke="#1a0c08" stroke-width="0.4" opacity="0.85" fill="none">
      <line x1="-50" y1="-20" x2="50" y2="-20"/>
      <line x1="-49" y1="-40" x2="49" y2="-40"/>
      <line x1="-49" y1="-60" x2="49" y2="-60"/>
      <line x1="-48" y1="-80" x2="48" y2="-80"/>
      <line x1="-47" y1="-100" x2="47" y2="-100"/>
      <line x1="-46" y1="-120" x2="46" y2="-120"/>
      <line x1="-45" y1="-140" x2="45" y2="-140"/>
      <line x1="-44" y1="-160" x2="44" y2="-160"/>
    </g>
    <!-- Brick verticals -->
    <g stroke="#1a0c08" stroke-width="0.3" opacity="0.55" fill="none">
      <line x1="-30" y1="0" x2="-30" y2="-160"/>
      <line x1="-10" y1="0" x2="-10" y2="-160"/>
      <line x1="10" y1="0" x2="10" y2="-160"/>
      <line x1="30" y1="0" x2="30" y2="-160"/>
    </g>

    <!-- LIGHTNING CONDUCTOR running down exterior -->
    <line x1="-44" y1="-160" x2="-50" y2="0" stroke="#1a0c08" stroke-width="1.4"/>
    <!-- Iron brackets at intervals -->
    <rect x="-52" y="-40" width="9" height="3" fill="url(#i7p10p1iron)"/>
    <rect x="-52" y="-90" width="9" height="3" fill="url(#i7p10p1iron)"/>
    <rect x="-52" y="-140" width="9" height="3" fill="url(#i7p10p1iron)"/>

    <!-- Iron lamp room at top -->
    <rect x="-66" y="-200" width="132" height="20" fill="url(#i7p10p1iron)" stroke="#0a0408" stroke-width="0.85"/>
    <!-- Lamp room window glass (amber from interior) -->
    <rect x="-60" y="-196" width="120" height="14" fill="#ffd898" filter="url(#i7p10p1bloom)" opacity="0.85"/>
    <ellipse cx="0" cy="-189" rx="40" ry="6" fill="#fff8c8" filter="url(#i7p10p1bloom)"/>
    <!-- Window mullions -->
    <line x1="-30" y1="-196" x2="-30" y2="-182" stroke="#1a0c08" stroke-width="0.7"/>
    <line x1="0" y1="-196" x2="0" y2="-182" stroke="#1a0c08" stroke-width="0.7"/>
    <line x1="30" y1="-196" x2="30" y2="-182" stroke="#1a0c08" stroke-width="0.7"/>
    <!-- Iron gallery railing under lamp room -->
    <rect x="-72" y="-180" width="144" height="6" fill="url(#i7p10p1iron)"/>
    <!-- Railing posts -->
    <line x1="-66" y1="-180" x2="-66" y2="-170" stroke="#0a0408" stroke-width="0.85"/>
    <line x1="-44" y1="-180" x2="-44" y2="-170" stroke="#0a0408" stroke-width="0.55"/>
    <line x1="0" y1="-180" x2="0" y2="-170" stroke="#0a0408" stroke-width="0.55"/>
    <line x1="44" y1="-180" x2="44" y2="-170" stroke="#0a0408" stroke-width="0.55"/>
    <line x1="66" y1="-180" x2="66" y2="-170" stroke="#0a0408" stroke-width="0.85"/>
    <!-- Roof cap -->
    <polygon points="-60,-200 0,-220 60,-200" fill="url(#i7p10p1iron)"/>
    <line x1="0" y1="-220" x2="0" y2="-230" stroke="#0a0408" stroke-width="1.4"/>
    <circle cx="0" cy="-232" r="2" fill="#0a0408"/>
    <!-- Decorative ironwork on roof -->
    <line x1="-30" y1="-210" x2="30" y2="-210" stroke="#0a0408" stroke-width="0.7"/>

    <!-- Door at base -->
    <rect x="-7" y="-30" width="14" height="30" fill="#0a0408" stroke="#1a0c08" stroke-width="0.55"/>

    <!-- BEAM CONE radiating from lamp room left -->
    <path d="M-60,-189 L-440,-220 L-440,-160 L-60,-185 Z" fill="#ffd898" opacity="0.4" filter="url(#i7p10p1megaglow)"/>
  </g>

  <!-- Moored service boat alongside pier -->
  <g transform="translate(540 250)">
    <ellipse cx="0" cy="0" rx="40" ry="3" fill="#1a1018"/>
    <ellipse cx="-4" cy="-3" rx="32" ry="6" fill="#1a1018"/>
    <line x1="-22" y1="-9" x2="-22" y2="-3" stroke="#0a0408" stroke-width="0.85"/>
  </g>

  <!-- ===== TINY FIGURES on tower exterior ===== -->
  <!-- SABLE climbing higher (silver-blue glow) -->
  <g transform="translate(420 100)">
    <ellipse cx="0" cy="0" rx="6" ry="6" fill="#a8c0e8" opacity="0.55" filter="url(#i7p10p1strongglow)"/>
    <path d="M-1,1 L-1.4,-3 L0,-5 L1.4,-3 L1,1 Z" fill="#506890"/>
    <ellipse cx="0" cy="-7" rx="0.85" ry="0.85" fill="#5a3a28"/>
  </g>

  <!-- WREN below (copper-gold glow + lens disc on back) -->
  <g transform="translate(420 130)">
    <ellipse cx="0" cy="0" rx="6" ry="6" fill="#d89858" opacity="0.55" filter="url(#i7p10p1strongglow)"/>
    <path d="M-1,1 L-1.4,-3 L0,-5 L1.4,-3 L1,1 Z" fill="#a85820"/>
    <!-- Lens disc on back -->
    <circle cx="0" cy="-2" r="2.4" fill="none" stroke="#fff8c8" stroke-width="0.55" filter="url(#i7p10p1bloom)"/>
    <ellipse cx="0" cy="-7" rx="0.85" ry="0.85" fill="#a87838"/>
  </g>

  <!-- JINK orbiting above on emerald wings (with prismatic trails) -->
  <g transform="translate(540 60)">
    <!-- Wings deployed, tiny -->
    <g stroke="#5af0a0" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#i7p10p1bloom)">
      <path d="M-3,0 L-9,-3 L-12,0 L-9,3 L-3,0"/>
      <path d="M3,0 L9,-3 L12,0 L9,3 L3,0"/>
    </g>
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="#5af0a0" opacity="0.4" filter="url(#i7p10p1strongglow)"/>
    <!-- Body -->
    <path d="M-1,1 L-1.4,-3 L0,-5 L1.4,-3 L1,1 Z" fill="#2ed078"/>
    <ellipse cx="0" cy="-7" rx="0.85" ry="0.85" fill="#d8a878"/>
  </g>

  <!-- Emerald orbital trail behind Jink -->
  <g opacity="0.7" filter="url(#i7p10p1bloom)">
    <path d="M540,60 Q500,40 460,50 Q420,70 460,90 Q500,80 540,60" stroke="#5af0a0" stroke-width="0.85" fill="none"/>
    <path d="M540,60 Q580,40 620,50 Q660,70 620,90 Q580,80 540,60" stroke="#5af0a0" stroke-width="0.55" fill="none" opacity="0.55"/>
  </g>

  <!-- Distant amber dock-lantern glow far rear -->
  <g opacity="0.55" filter="url(#i7p10p1bloom)">
    <circle cx="60" cy="220" r="2" fill="#d89858"/>
    <circle cx="220" cy="225" r="2" fill="#d89858"/>
  </g>

  <!-- JINK -->
  <g>
    <rect x="14" y="14" width="280" height="50" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="100,64 112,64 104,76" fill="white" stroke="#2ed078" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Keeper's in the watch room. Reading.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Pipe lit. Forty minutes since last round.</text>

  <!-- SABLE -->
  <g>
    <rect x="380" y="14" width="180" height="34" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="388" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="388" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Plenty. Wren?</text>

  <!-- WREN -->
  <g>
    <rect x="380" y="64" width="346" height="40" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="388" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN  <tspan font-style="italic" font-size="8" font-weight="500">(comms, strained)</tspan></text>
  <text x="388" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">This lens weighs more than I do. But I'm coming.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q200,92 400,88 Q580,86 742,90"/>
    <path d="M0,240 Q200,242 400,238 Q580,236 742,240"/>
  </g>
</svg>
