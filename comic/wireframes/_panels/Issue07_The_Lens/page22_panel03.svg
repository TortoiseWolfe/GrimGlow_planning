<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 300" width="248" height="300">
  <title>Issue 7 — Page 22 — Panel 3: The journalist's notebook page — handwritten shorthand, the underlined connection, folklore accumulating on paper</title>
  <desc>85mm macro. Journalist's notebook page. Handwritten shorthand, partially legible. Visible: Dancing lights — green — gallery railing. Keeper reports flickering in mechanism. Underlined: Third sighting this month — cf. clockmaker's brownie, Clerkenwell will-o'-wisps. Connecting the stories. Folklore accumulating. Fairy tales building paper trail. Fingers visible at notebook edge — clean, ink-stained at index finger and thumb.</desc>

  <defs>
    <linearGradient id="i7p22p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="i7p22p3paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#e8d8a8"/>
    </linearGradient>
    <linearGradient id="i7p22p3leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i7p22p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c898"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i7p22p3bloom"><feGaussianBlur stdDeviation="0.85"/></filter>
    <filter id="i7p22p3glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Coat fabric background (out of focus) -->
  <rect width="248" height="300" fill="url(#i7p22p3bg)"/>
  <!-- Coat texture -->
  <g stroke="#3a2818" stroke-width="0.4" opacity="0.4" fill="none">
    <path d="M0,40 Q60,42 124,38 Q190,36 248,40"/>
    <path d="M0,80 Q60,82 124,78 Q190,76 248,80"/>
    <path d="M0,260 Q60,262 124,258 Q190,256 248,260"/>
  </g>

  <!-- ===== NOTEBOOK — leather binding edge ===== -->
  <rect x="-20" y="20" width="60" height="260" fill="url(#i7p22p3leather)"/>
  <line x1="40" y1="20" x2="40" y2="280" stroke="#1a0808" stroke-width="0.85"/>
  <!-- Binding spine -->
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.7">
    <line x1="14" y1="20" x2="14" y2="280"/>
    <line x1="22" y1="20" x2="22" y2="280"/>
  </g>

  <!-- ===== OPEN PAGE — the brightest element ===== -->
  <rect x="40" y="20" width="208" height="260" fill="url(#i7p22p3paper)" filter="url(#i7p22p3bloom)"/>
  <!-- Paper texture -->
  <g stroke="#a89878" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M40,80 Q120,82 200,78"/>
    <path d="M40,160 Q120,162 200,158"/>
    <path d="M40,240 Q120,242 200,238"/>
  </g>
  <!-- Page ruling lines (faint) -->
  <g stroke="#a89878" stroke-width="0.4" opacity="0.4">
    <line x1="50" y1="60" x2="240" y2="60"/>
    <line x1="50" y1="80" x2="240" y2="80"/>
    <line x1="50" y1="100" x2="240" y2="100"/>
    <line x1="50" y1="120" x2="240" y2="120"/>
    <line x1="50" y1="140" x2="240" y2="140"/>
    <line x1="50" y1="160" x2="240" y2="160"/>
    <line x1="50" y1="180" x2="240" y2="180"/>
    <line x1="50" y1="200" x2="240" y2="200"/>
    <line x1="50" y1="220" x2="240" y2="220"/>
    <line x1="50" y1="240" x2="240" y2="240"/>
    <line x1="50" y1="260" x2="240" y2="260"/>
  </g>

  <!-- ===== DATE HEADER ===== -->
  <text x="50" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#3a1808" font-style="italic">29 Apr — Wapping Quay</text>
  <line x1="50" y1="46" x2="180" y2="46" stroke="#3a1808" stroke-width="0.55" opacity="0.7"/>

  <!-- ===== HANDWRITING — shorthand entries ===== -->
  <!-- Entry 1 -->
  <text x="50" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1a0808">Dancing lights —</text>
  <text x="50" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1a0808">green — gallery railing</text>

  <!-- Entry 2 -->
  <text x="50" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1a0808">Keeper reports flickering</text>
  <text x="50" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#1a0808">in lamp mechanism</text>

  <!-- Entry 3 — partial sketch attempt -->
  <text x="50" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#1a0808" font-style="italic">"green as nothing</text>
  <text x="50" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#1a0808" font-style="italic">  I've seen" — sober</text>

  <!-- Marginal sketch — gallery shape -->
  <g stroke="#3a1808" stroke-width="0.55" fill="none" opacity="0.85">
    <rect x="180" y="80" width="40" height="22"/>
    <line x1="180" y1="80" x2="220" y2="80"/>
    <line x1="180" y1="80" x2="180" y2="60"/>
    <line x1="220" y1="80" x2="220" y2="60"/>
    <!-- Tiny dots indicating "lights" -->
    <circle cx="190" cy="70" r="1" fill="#3a1808"/>
    <circle cx="200" cy="68" r="1" fill="#3a1808"/>
    <circle cx="210" cy="71" r="1" fill="#3a1808"/>
  </g>

  <!-- Horizontal rule before underlined entry -->
  <line x1="50" y1="195" x2="240" y2="195" stroke="#3a1808" stroke-width="0.55"/>

  <!-- ===== UNDERLINED entry — the connection ===== -->
  <text x="50" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1a0808" font-weight="700">3rd sighting this month</text>
  <line x1="50" y1="220" x2="200" y2="220" stroke="#1a0808" stroke-width="0.85"/>

  <text x="50" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#1a0808" font-style="italic">cf. clockmaker's brownie</text>
  <text x="50" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#1a0808" font-style="italic">— Clerkenwell will-o'-wisps</text>

  <!-- Question mark in margin (the journalist's curiosity) -->
  <text x="222" y="234" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a0808" font-weight="700">?</text>

  <!-- ===== FINGERS at notebook edge ===== -->
  <!-- Thumb at bottom edge -->
  <g transform="translate(140 280)">
    <ellipse cx="0" cy="14" rx="22" ry="9" fill="url(#i7p22p3skin)"/>
    <!-- Thumbnail -->
    <ellipse cx="0" cy="9" rx="6" ry="3" fill="#fff8d8" opacity="0.55"/>
    <!-- INK STAIN on thumb -->
    <ellipse cx="-3" cy="11" rx="3" ry="2" fill="#1a0808" opacity="0.85"/>
    <!-- Tiny smudge -->
    <path d="M-7,18 L-3,16" stroke="#1a0808" stroke-width="0.55" opacity="0.55"/>
  </g>

  <!-- INDEX FINGER along right edge -->
  <g transform="translate(240 140)">
    <ellipse cx="0" cy="0" rx="9" ry="60" fill="url(#i7p22p3skin)"/>
    <!-- Fingernail -->
    <ellipse cx="0" cy="-50" rx="4" ry="6" fill="#fff8d8" opacity="0.55"/>
    <!-- INK STAIN at fingertip -->
    <ellipse cx="-3" cy="-44" rx="3" ry="2" fill="#1a0808" opacity="0.85"/>
    <!-- Knuckle line -->
    <path d="M-7,11 L7,11" stroke="#7a4828" stroke-width="0.4" opacity="0.7"/>
    <path d="M-7,30 L7,30" stroke="#7a4828" stroke-width="0.4" opacity="0.7"/>
  </g>

  <!-- Pencil tip (graphite point) caught at edge -->
  <g transform="translate(218 250)">
    <line x1="-3" y1="-3" x2="9" y2="-22" stroke="#7a4828" stroke-width="2"/>
    <circle cx="-3" cy="-3" r="0.85" fill="#0a0606"/>
    <!-- Faint graphite mark on paper -->
    <line x1="-7" y1="0" x2="-3" y2="-3" stroke="#3a1808" stroke-width="0.55" opacity="0.7"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q60,142 124,138 Q190,136 248,140"/>
  </g>
</svg>
