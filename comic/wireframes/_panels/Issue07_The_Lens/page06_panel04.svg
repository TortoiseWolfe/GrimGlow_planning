<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 410" width="494" height="410">
  <title>Issue 7 — Page 6 — Panel 4: Wren inspects the lens with scanner — focal length correct, glass purity adequate</title>
  <desc>35mm low fairy-scale angle stone quay. Theodore's hands oil-stained brass gear ring hold open canvas satchel revealing precision glass lens partially unwrapped from cloth. Lens catches dock-lantern light tiny rainbow spectrum on grey stone. Wren copper suit crouches near satchel copper-gold holographic scanner projecting analytical light geometric readouts hover over lens. Theodore's face above anxious watching. Dock-lantern amber. Copper-gold scanner light.</desc>

  <defs>
    <linearGradient id="i7p6p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2848"/>
      <stop offset="100%" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="i7p6p4lampHalo" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#d89858" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p6p4scannerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p6p4lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p6p4stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5860"/>
      <stop offset="100%" stop-color="#2a2830"/>
    </linearGradient>
    <linearGradient id="i7p6p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="i7p6p4canvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="i7p6p4suitW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e89858"/>
      <stop offset="100%" stop-color="#5a2810"/>
    </linearGradient>
    <linearGradient id="i7p6p4skinW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c898"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i7p6p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p6p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p6p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p6p4megaglow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="494" height="410" fill="url(#i7p6p4bg)"/>

  <!-- Dock-lantern halo upper -->
  <ellipse cx="247" cy="0" rx="500" ry="180" fill="url(#i7p6p4lampHalo)" filter="url(#i7p6p4strongglow)"/>

  <!-- ===== STONE QUAY (foreground large, low angle) ===== -->
  <path d="M0,200 L494,200 L494,410 L0,410 Z" fill="url(#i7p6p4stone)"/>
  <line x1="0" y1="200" x2="494" y2="200" stroke="#1a1418" stroke-width="0.85"/>
  <g stroke="#1a1418" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,260 L494,260"/>
    <path d="M0,320 L494,320"/>
    <path d="M0,380 L494,380"/>
    <line x1="80" y1="200" x2="80" y2="410"/>
    <line x1="200" y1="200" x2="200" y2="410"/>
    <line x1="320" y1="200" x2="320" y2="410"/>
    <line x1="440" y1="200" x2="440" y2="410"/>
  </g>

  <!-- ===== Theodore's HANDS holding open the satchel (massive at fairy scale) ===== -->
  <g transform="translate(247 280)">
    <!-- Canvas satchel body -->
    <rect x="-180" y="-30" width="360" height="80" fill="url(#i7p6p4canvas)" stroke="#5a4828" stroke-width="1"/>
    <line x1="-180" y1="-10" x2="180" y2="-10" stroke="#5a4828" stroke-width="0.85"/>
    <!-- Flap open (raised behind) -->
    <path d="M-180,-30 L-160,-90 L160,-90 L180,-30 Z" fill="#a89878" stroke="#5a4828" stroke-width="0.85"/>
    <!-- Inside satchel: cloth -->
    <ellipse cx="0" cy="0" rx="120" ry="40" fill="#d4c4a8" opacity="0.85"/>
    <!-- Folded cloth wrapping -->
    <path d="M-100,-20 Q0,-30 100,-20 Q100,20 0,30 Q-100,20 -100,-20 Z" fill="#a89878"/>

    <!-- THE LENS — partially unwrapped, refracting light -->
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="url(#i7p6p4lensGlow)" filter="url(#i7p6p4bloom)"/>
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#fff8c8" stroke-width="1" filter="url(#i7p6p4bloom)"/>
    <ellipse cx="0" cy="0" rx="44" ry="14" fill="none" stroke="#ffd898" stroke-width="0.7" opacity="0.85"/>
    <!-- Convex highlight -->
    <ellipse cx="-22" cy="-6" rx="14" ry="5" fill="#fff" filter="url(#i7p6p4bloom)" opacity="0.85"/>

    <!-- Theodore's THUMBS at left and right edges of satchel -->
    <path d="M-180,-30 L-200,-50 L-200,30 L-180,50 Z" fill="url(#i7p6p4skin)"/>
    <ellipse cx="-198" cy="-50" rx="9" ry="6" fill="url(#i7p6p4skin)"/>
    <path d="M180,-30 L200,-50 L200,30 L180,50 Z" fill="url(#i7p6p4skin)"/>
    <ellipse cx="198" cy="-50" rx="9" ry="6" fill="url(#i7p6p4skin)"/>
    <!-- Brass gear ring on left thumb's index neighbor -->
    <circle cx="-198" cy="-58" r="3" fill="none" stroke="#d89858" stroke-width="0.85" filter="url(#i7p6p4bloom)"/>

    <!-- Tiny rainbow refraction onto stone -->
    <g opacity="0.95" filter="url(#i7p6p4bloom)" transform="translate(80 60)">
      <ellipse cx="0" cy="0" rx="22" ry="4" fill="#ff5050" opacity="0.55"/>
      <ellipse cx="0" cy="3" rx="20" ry="3" fill="#f0a040" opacity="0.55"/>
      <ellipse cx="0" cy="6" rx="18" ry="2.4" fill="#fff080" opacity="0.55"/>
      <ellipse cx="0" cy="9" rx="16" ry="2" fill="#80f0a0" opacity="0.55"/>
      <ellipse cx="0" cy="12" rx="14" ry="2" fill="#80a0f0" opacity="0.55"/>
    </g>
  </g>

  <!-- ===== WREN — crouching near, scanner active ===== -->
  <g transform="translate(120 280)">
    <ellipse cx="0" cy="0" rx="14" ry="2" fill="#000" opacity="0.55"/>
    <!-- Crouched legs -->
    <path d="M-9,0 L-16,-30 L-2,-50 L0,-30 Z" fill="url(#i7p6p4suitW)"/>
    <path d="M9,0 L16,-30 L2,-50 L0,-30 Z" fill="url(#i7p6p4suitW)"/>
    <ellipse cx="-9" cy="0" rx="6" ry="2" fill="#1a0c04"/>
    <ellipse cx="9" cy="0" rx="6" ry="2" fill="#1a0c04"/>
    <!-- Knees with copper dust -->
    <ellipse cx="-2" cy="-46" rx="6" ry="2" fill="#1a0c04" opacity="0.85"/>
    <!-- Torso -->
    <path d="M-14,-50 L-18,-100 L-9,-114 L9,-114 L18,-100 L14,-50 Z" fill="url(#i7p6p4suitW)"/>
    <line x1="0" y1="-114" x2="0" y2="-50" stroke="#f0c898" stroke-width="0.55" opacity="0.85" filter="url(#i7p6p4bloom)"/>
    <ellipse cx="-14" cy="-72" rx="6" ry="2" fill="#0a0604" opacity="0.85"/>
    <!-- Arms (one with scanner up, one supporting) -->
    <path d="M-18,-100 L-26,-72 L-22,-50 L-14,-72 Z" fill="url(#i7p6p4suitW)"/>
    <path d="M18,-100 L40,-80 L60,-50 L34,-66 Z" fill="url(#i7p6p4suitW)"/>
    <!-- WRIST SCANNER glow -->
    <ellipse cx="60" cy="-50" rx="22" ry="14" fill="url(#i7p6p4scannerGlow)" filter="url(#i7p6p4megaglow)"/>
    <ellipse cx="60" cy="-50" rx="9" ry="3" fill="#fff8c8" filter="url(#i7p6p4bloom)"/>
    <!-- Geometric readouts hovering over lens (right toward lens position) -->
    <g opacity="0.85" filter="url(#i7p6p4bloom)">
      <line x1="80" y1="-46" x2="100" y2="-30" stroke="#d89858" stroke-width="0.4"/>
      <line x1="80" y1="-50" x2="100" y2="-50" stroke="#d89858" stroke-width="0.4"/>
      <line x1="80" y1="-54" x2="100" y2="-70" stroke="#d89858" stroke-width="0.4"/>
      <text x="106" y="-30" font-family="monospace" font-size="4" fill="#ffd898">F=700</text>
      <text x="106" y="-50" font-family="monospace" font-size="4" fill="#ffd898">CROWN OK</text>
      <text x="106" y="-70" font-family="monospace" font-size="4" fill="#ffd898">SURFACE</text>
    </g>
    <!-- Head -->
    <ellipse cx="0" cy="-128" rx="9" ry="10" fill="url(#i7p6p4skinW)"/>
    <!-- Bun -->
    <ellipse cx="0" cy="-140" rx="6" ry="3" fill="#1a0a04"/>
    <path d="M-7,-138 Q-5,-144 0,-145 Q5,-144 7,-138 L7,-134 Q4,-138 0,-138 Q-4,-138 -7,-134 Z" fill="#1a0a04"/>
    <!-- Eyes -->
    <ellipse cx="-3" cy="-128" rx="1.4" ry="0.85" fill="#fff"/>
    <ellipse cx="3" cy="-128" rx="1.4" ry="0.85" fill="#fff"/>
    <ellipse cx="-2" cy="-128" rx="0.85" ry="0.7" fill="#3a1808"/>
    <ellipse cx="4" cy="-128" rx="0.85" ry="0.7" fill="#3a1808"/>
    <!-- Brow focused -->
    <path d="M-7,-134 Q-3,-136 0,-134" stroke="#5a3018" stroke-width="0.55" fill="none"/>
    <path d="M7,-134 Q3,-136 0,-134" stroke="#5a3018" stroke-width="0.55" fill="none"/>
    <!-- Mouth -->
    <line x1="-2" y1="-120" x2="2" y2="-120" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Comms ear -->
    <circle cx="9" cy="-128" r="0.85" fill="#d89858" filter="url(#i7p6p4bloom)" opacity="0.85"/>
  </g>

  <!-- ===== THEODORE'S FACE upper frame (anxious, watching) ===== -->
  <g transform="translate(280 50)" opacity="0.85">
    <!-- Underside jaw -->
    <path d="M-100,-10 Q-70,-40 0,-50 Q70,-40 100,-10 L100,30 L-100,30 Z" fill="url(#i7p6p4skin)"/>
    <path d="M-90,-22 Q-60,-44 0,-52 Q60,-44 90,-22" stroke="#3a1808" stroke-width="1" fill="none" opacity="0.85"/>
    <!-- Mouth -->
    <line x1="-22" y1="-30" x2="22" y2="-30" stroke="#3a1808" stroke-width="1"/>
    <ellipse cx="0" cy="-30" rx="3" ry="1" fill="#3a1808"/>
    <!-- Anxious brow visible -->
    <path d="M-50,-90 Q-30,-94 -10,-90" stroke="#5a3018" stroke-width="2" fill="none"/>
    <path d="M50,-90 Q30,-94 10,-90" stroke="#5a3018" stroke-width="2" fill="none"/>
  </g>

  <!-- WREN -->
  <g>
    <rect x="14" y="14" width="466" height="50" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="200,64 212,64 204,76" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="200.5" y1="64" x2="211.5" y2="64" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Focal length correct. Glass purity... adequate.</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Victorian crown — not what I'd choose, but it'll hold.</text>

  <!-- THEODORE -->
  <g>
    <rect x="14" y="350" width="200" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="80,350 92,350 84,340" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="80.5" y1="350" x2="91.5" y2="350" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Is it right?</text>

  <!-- WREN reply -->
  <g>
    <rect x="280" y="350" width="200" height="40" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="350,350 362,350 354,340" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="350.5" y1="350" x2="361.5" y2="350" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="288" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN</text>
  <text x="288" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">It's right.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q100,182 200,178 Q280,176 494,180"/>
    <path d="M0,330 Q100,332 200,328 Q280,326 494,330"/>
  </g>
</svg>
