<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 400" width="494" height="400">
  <title>Issue 7 — Page 8 — Panel 2: THE BOOT — massive hobnailed sole descending, scale as violence</title>
  <desc>24mm extreme close-up low fairy scale. Massive hobnailed leather boot sole fills panel descending. Iron-shod heel caked mud dock grime. Hobnails as rivets leather grain as terrain. Building falling from sky at fairy scale. Below barely visible Thresh throws sideways rolling. Stone dust grit spray cracks of force. Boot's shadow curtain absolute darkness. Lantern light catches hobnails amber glints. Crimson suit glow only light in shadow. Eyes clenched silent shout pure survival reflex.</desc>

  <defs>
    <linearGradient id="i7p8p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p8p2bootSole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i7p8p2bootLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="i7p8p2stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5860"/>
      <stop offset="100%" stop-color="#2a2830"/>
    </linearGradient>
    <radialGradient id="i7p8p2bootShadow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p8p2lanternEdge" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p8p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f04060"/>
      <stop offset="100%" stop-color="#5a1018"/>
    </linearGradient>
    <filter id="i7p8p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p8p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p8p2strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p8p2megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="494" height="400" fill="url(#i7p8p2bg)"/>

  <!-- Stone quay surface (tiny strip at bottom) -->
  <rect x="0" y="370" width="494" height="30" fill="url(#i7p8p2stone)"/>
  <line x1="0" y1="370" x2="494" y2="370" stroke="#1a1418" stroke-width="0.55"/>

  <!-- Lantern edge light from upper right -->
  <ellipse cx="494" cy="0" rx="280" ry="200" fill="url(#i7p8p2lanternEdge)" filter="url(#i7p8p2megaglow)"/>

  <!-- ===== BOOT SHADOW — curtain of darkness ===== -->
  <ellipse cx="247" cy="370" rx="280" ry="60" fill="url(#i7p8p2bootShadow)" filter="url(#i7p8p2megaglow)"/>

  <!-- ===== THE BOOT — fills upper 75% of frame, descending ===== -->
  <g transform="translate(247 0)">
    <!-- Boot upper (canvas/leather above ankle, top of frame) -->
    <path d="M-200,0 L-200,40 L-180,80 L-220,120 L-220,0 Z" fill="url(#i7p8p2bootLeather)" opacity="0.85"/>
    <path d="M200,0 L200,40 L180,80 L220,120 L220,0 Z" fill="url(#i7p8p2bootLeather)" opacity="0.85"/>

    <!-- Main boot body (massive) -->
    <path d="M-220,40 L-200,160 L-180,260 L-160,300 L-100,320 L100,320 L160,300 L180,260 L200,160 L220,40 Z" fill="url(#i7p8p2bootLeather)"/>

    <!-- Leather grain as terrain (massive cracked texture) -->
    <g stroke="#080404" stroke-width="1.4" opacity="0.85" fill="none">
      <path d="M-160,80 Q-100,100 -40,90 Q40,80 100,100 Q140,110 160,90"/>
      <path d="M-180,140 Q-120,160 -40,150 Q40,140 100,160 Q140,170 180,150"/>
      <path d="M-180,200 Q-120,220 -40,210 Q40,200 100,220 Q140,230 180,210"/>
      <path d="M-160,260 Q-100,280 -20,270 Q40,260 100,280 Q140,290 160,270"/>
    </g>
    <!-- Wear scratches -->
    <g stroke="#5a3018" stroke-width="0.85" opacity="0.7" fill="none">
      <line x1="-100" y1="60" x2="-50" y2="100"/>
      <line x1="80" y1="80" x2="140" y2="120"/>
      <line x1="-40" y1="220" x2="20" y2="260"/>
    </g>

    <!-- Caked mud splatters -->
    <g fill="#3a2418" opacity="0.85">
      <ellipse cx="-100" cy="280" rx="14" ry="7"/>
      <ellipse cx="60" cy="290" rx="22" ry="9"/>
      <ellipse cx="140" cy="270" rx="11" ry="5"/>
      <ellipse cx="-160" cy="230" rx="14" ry="6"/>
    </g>

    <!-- Sole edge (where boot meets ground) -->
    <path d="M-180,300 L-160,330 L-100,340 L100,340 L160,330 L180,300 L200,260 L-200,260 Z" fill="url(#i7p8p2bootSole)"/>
    <line x1="-200" y1="300" x2="200" y2="300" stroke="#0a0408" stroke-width="1.4"/>

    <!-- HOBNAIL STUDS — visible as rivets across the sole -->
    <g fill="#a87838" filter="url(#i7p8p2bloom)" opacity="0.95">
      <!-- Front row -->
      <circle cx="-160" cy="320" r="6"/>
      <circle cx="-120" cy="324" r="6"/>
      <circle cx="-80" cy="326" r="6"/>
      <circle cx="-40" cy="328" r="6"/>
      <circle cx="0" cy="328" r="6"/>
      <circle cx="40" cy="328" r="6"/>
      <circle cx="80" cy="326" r="6"/>
      <circle cx="120" cy="324" r="6"/>
      <circle cx="160" cy="320" r="6"/>
      <!-- Back row -->
      <circle cx="-150" cy="290" r="5"/>
      <circle cx="-110" cy="294" r="5"/>
      <circle cx="-70" cy="296" r="5"/>
      <circle cx="-30" cy="298" r="5"/>
      <circle cx="10" cy="298" r="5"/>
      <circle cx="50" cy="296" r="5"/>
      <circle cx="90" cy="294" r="5"/>
      <circle cx="130" cy="290" r="5"/>
    </g>
    <!-- Brighter highlights on hobnails -->
    <g fill="#ffd898" opacity="0.85" filter="url(#i7p8p2bloom)">
      <circle cx="-80" cy="324" r="2"/>
      <circle cx="0" cy="326" r="2"/>
      <circle cx="80" cy="324" r="2"/>
    </g>

    <!-- IRON HEEL (upper-left of sole, larger) -->
    <rect x="-200" y="260" width="50" height="80" fill="#3a3838" stroke="#1a1818" stroke-width="0.85"/>
    <line x1="-180" y1="260" x2="-180" y2="340" stroke="#1a1818" stroke-width="0.4"/>
    <!-- Iron rivets on heel -->
    <circle cx="-190" cy="280" r="2.4" fill="#5a5860" stroke="#1a1818" stroke-width="0.4"/>
    <circle cx="-170" cy="280" r="2.4" fill="#5a5860" stroke="#1a1818" stroke-width="0.4"/>
    <circle cx="-190" cy="320" r="2.4" fill="#5a5860" stroke="#1a1818" stroke-width="0.4"/>
    <circle cx="-170" cy="320" r="2.4" fill="#5a5860" stroke="#1a1818" stroke-width="0.4"/>
    <!-- Iron heel highlight -->
    <line x1="-200" y1="270" x2="-150" y2="270" stroke="#a8b0c0" stroke-width="1.4" filter="url(#i7p8p2bloom)" opacity="0.85"/>
  </g>

  <!-- ===== IMPACT EFFECT — stone dust spray and radiating cracks ===== -->
  <g opacity="0.85">
    <!-- Radiating cracks on quay surface -->
    <line x1="247" y1="370" x2="180" y2="395" stroke="#1a0c08" stroke-width="0.85"/>
    <line x1="247" y1="370" x2="220" y2="395" stroke="#1a0c08" stroke-width="0.7"/>
    <line x1="247" y1="370" x2="270" y2="395" stroke="#1a0c08" stroke-width="0.7"/>
    <line x1="247" y1="370" x2="320" y2="395" stroke="#1a0c08" stroke-width="0.85"/>
    <!-- Stone dust spray -->
    <g fill="#a89878" opacity="0.85" filter="url(#i7p8p2bloom)">
      <ellipse cx="100" cy="380" rx="14" ry="3"/>
      <ellipse cx="160" cy="385" rx="9" ry="2"/>
      <ellipse cx="380" cy="385" rx="11" ry="2.4"/>
      <ellipse cx="430" cy="380" rx="14" ry="3"/>
      <circle cx="60" cy="370" r="2"/>
      <circle cx="80" cy="375" r="1.4"/>
      <circle cx="380" cy="372" r="2"/>
      <circle cx="410" cy="376" r="1.4"/>
    </g>
  </g>

  <!-- ===== THRESH — tiny, lower frame, ROLLING SIDEWAYS ===== -->
  <g transform="translate(70 380)">
    <!-- Body in mid-roll, sideways -->
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="url(#i7p8p2suit)"/>
    <ellipse cx="0" cy="-2" rx="11" ry="4" fill="url(#i7p8p2suit)"/>
    <!-- Crimson glow halo -->
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="#ff5060" opacity="0.7" filter="url(#i7p8p2megaglow)"/>
    <!-- Pauldrons rolling -->
    <ellipse cx="-9" cy="-3" rx="3" ry="2" fill="#7a1a28"/>
    <ellipse cx="9" cy="-3" rx="3" ry="2" fill="#7a1a28"/>
    <!-- Head (curled inward) -->
    <ellipse cx="0" cy="-9" rx="3" ry="3" fill="#a87838"/>
    <!-- Eyes CLENCHED -->
    <line x1="-1.4" y1="-9" x2="-0.4" y2="-9" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="0.4" y1="-9" x2="1.4" y2="-9" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Mouth open silent shout -->
    <ellipse cx="0" cy="-7" rx="0.85" ry="0.7" fill="#1a0c04"/>
    <!-- Motion blur trail -->
    <path d="M0,0 L20,4" stroke="#dc2030" stroke-width="2" opacity="0.55" filter="url(#i7p8p2bloom)"/>
    <path d="M0,-2 L24,2" stroke="#f04060" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- (No dialogue per script — image carries it) -->
  <!-- SFX -->
  <g>
    <rect x="14" y="14" width="200" height="40" rx="2" fill="white" stroke="#1a1a1a" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="900" font-style="italic">*KRACK*</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q120,182 240,178 Q360,176 494,180"/>
    <path d="M0,300 Q120,302 240,298 Q360,296 494,300"/>
  </g>
</svg>
