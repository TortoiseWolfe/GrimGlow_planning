<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 580" width="248" height="580">
  <title>Issue 7 — Page 4 — Panel 3: Prentiss opens the lens case — plano-convex Fresnel candidate, professional interest</title>
  <desc>50mm medium close-up. Prentiss thin man wire spectacles precise hands opens felt-lined wooden case on counter. Inside: precision-ground plano-convex glass lens four inches diameter rests in felt. Refracting tiny rainbow spectrum onto dark wood counter. He studies professionally before looking up at off-panel customer. Warm gas lamp light. Lens glow. Rack of labeled cases behind.</desc>

  <defs>
    <linearGradient id="i7p4p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="i7p4p3lampGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p4p3lensCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p4p3wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="i7p4p3counter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i7p4p3felt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2828"/>
      <stop offset="100%" stop-color="#3a1818"/>
    </linearGradient>
    <linearGradient id="i7p4p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <linearGradient id="i7p4p3apron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <filter id="i7p4p3bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i7p4p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p4p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="248" height="580" fill="url(#i7p4p3bg)"/>

  <!-- Gas lamp halo -->
  <ellipse cx="124" cy="50" rx="200" ry="120" fill="url(#i7p4p3lampGlow)" filter="url(#i7p4p3strongglow)"/>

  <!-- Back wall with rack of labeled cases -->
  <rect x="0" y="0" width="248" height="200" fill="url(#i7p4p3wood)" opacity="0.85"/>
  <g opacity="0.85">
    <!-- Rack rows -->
    <rect x="20" y="60" width="208" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="20" y="100" width="208" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="20" y="140" width="208" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Lens case partitions -->
    <g stroke="#1a0c04" stroke-width="0.55" fill="none">
      <line x1="60" y1="60" x2="60" y2="74"/>
      <line x1="100" y1="60" x2="100" y2="74"/>
      <line x1="140" y1="60" x2="140" y2="74"/>
      <line x1="180" y1="60" x2="180" y2="74"/>
      <line x1="60" y1="100" x2="60" y2="114"/>
      <line x1="100" y1="100" x2="100" y2="114"/>
      <line x1="140" y1="100" x2="140" y2="114"/>
      <line x1="180" y1="100" x2="180" y2="114"/>
      <line x1="60" y1="140" x2="60" y2="154"/>
      <line x1="100" y1="140" x2="100" y2="154"/>
      <line x1="140" y1="140" x2="140" y2="154"/>
      <line x1="180" y1="140" x2="180" y2="154"/>
    </g>
    <!-- Tiny labels -->
    <text x="40" y="71" font-family="monospace" font-size="3" fill="#a87838" text-anchor="middle">2"</text>
    <text x="80" y="71" font-family="monospace" font-size="3" fill="#a87838" text-anchor="middle">3"</text>
    <text x="120" y="71" font-family="monospace" font-size="3" fill="#a87838" text-anchor="middle">4"</text>
    <text x="160" y="71" font-family="monospace" font-size="3" fill="#a87838" text-anchor="middle">5"</text>
    <text x="200" y="71" font-family="monospace" font-size="3" fill="#a87838" text-anchor="middle">6"</text>
  </g>

  <!-- Empty slot (where lens was just pulled from) -->
  <rect x="100" y="60" width="40" height="14" fill="#1a0c04" opacity="0.85"/>

  <!-- ===== PRENTISS — center frame, holding open lens case ===== -->
  <g transform="translate(124 300)">
    <!-- Apron + waistcoat -->
    <path d="M-50,40 L-60,-100 L-30,-130 L30,-130 L60,-100 L50,40 Z" fill="url(#i7p4p3apron)"/>
    <line x1="-18" y1="-130" x2="-18" y2="40" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="18" y1="-130" x2="18" y2="40" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Linen collar -->
    <path d="M-12,-130 L-9,-150 L9,-150 L12,-130 Z" fill="#1a0c08"/>
    <path d="M-7,-150 L0,-148 L7,-150 L7,-144 L0,-141 L-7,-144 Z" fill="#e0d4b8"/>

    <!-- Both arms reaching forward (opening case) -->
    <path d="M-60,-100 L-70,-60 L-44,-30 L-30,-50 L-30,-90 Z" fill="url(#i7p4p3apron)"/>
    <path d="M60,-100 L70,-60 L44,-30 L30,-50 L30,-90 Z" fill="url(#i7p4p3apron)"/>
    <!-- Hands (precise, thin) -->
    <ellipse cx="-44" cy="-30" rx="9" ry="5" fill="url(#i7p4p3skin)"/>
    <ellipse cx="44" cy="-30" rx="9" ry="5" fill="url(#i7p4p3skin)"/>
    <!-- Long thin fingers -->
    <ellipse cx="-50" cy="-22" rx="2" ry="6" fill="url(#i7p4p3skin)"/>
    <ellipse cx="-46" cy="-18" rx="2" ry="6" fill="url(#i7p4p3skin)"/>
    <ellipse cx="-42" cy="-22" rx="2" ry="6" fill="url(#i7p4p3skin)"/>
    <ellipse cx="50" cy="-22" rx="2" ry="6" fill="url(#i7p4p3skin)"/>
    <ellipse cx="46" cy="-18" rx="2" ry="6" fill="url(#i7p4p3skin)"/>
    <ellipse cx="42" cy="-22" rx="2" ry="6" fill="url(#i7p4p3skin)"/>

    <!-- Neck thin -->
    <path d="M-9,-160 L-12,-150 L12,-150 L9,-160 Z" fill="url(#i7p4p3skin)"/>

    <!-- Head — looking DOWN at lens (studying) -->
    <ellipse cx="0" cy="-180" rx="20" ry="22" fill="url(#i7p4p3skin)"/>
    <!-- Hair greying -->
    <path d="M-18,-200 Q-14,-204 0,-204 Q14,-204 18,-200 L18,-194 Q9,-198 0,-198 Q-9,-198 -18,-194 Z" fill="#5a5050"/>
    <!-- WIRE SPECTACLES -->
    <circle cx="-7" cy="-180" r="5" fill="none" stroke="#3a3838" stroke-width="0.85"/>
    <circle cx="7" cy="-180" r="5" fill="none" stroke="#3a3838" stroke-width="0.85"/>
    <line x1="-2" y1="-180" x2="2" y2="-180" stroke="#3a3838" stroke-width="0.85"/>
    <line x1="-12" y1="-180" x2="-16" y2="-178" stroke="#3a3838" stroke-width="0.55"/>
    <line x1="12" y1="-180" x2="16" y2="-178" stroke="#3a3838" stroke-width="0.55"/>
    <!-- Eyes (looking down through spectacles) -->
    <circle cx="-7" cy="-178" r="1.4" fill="#fff8e8"/>
    <circle cx="7" cy="-178" r="1.4" fill="#fff8e8"/>
    <circle cx="-7" cy="-176" r="0.85" fill="#3a2418"/>
    <circle cx="7" cy="-176" r="0.85" fill="#3a2418"/>
    <!-- Brow -->
    <path d="M-15,-188 Q-7,-190 0,-188" stroke="#3a2418" stroke-width="1" fill="none"/>
    <path d="M15,-188 Q7,-190 0,-188" stroke="#3a2418" stroke-width="1" fill="none"/>
    <!-- Nose -->
    <path d="M-2,-180 L-3,-168 L0,-164 L3,-168 L2,-180 Z" fill="#5a3818" opacity="0.85"/>
    <!-- Mouth thin set -->
    <line x1="-5" y1="-160" x2="5" y2="-160" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Thin face lines -->
    <path d="M-18,-180 Q-14,-168 -9,-160" fill="none" stroke="#3a2418" stroke-width="0.55" opacity="0.7"/>
    <path d="M18,-180 Q14,-168 9,-160" fill="none" stroke="#3a2418" stroke-width="0.55" opacity="0.7"/>
  </g>

  <!-- ===== COUNTER and LENS CASE in foreground ===== -->
  <rect x="0" y="380" width="248" height="200" fill="url(#i7p4p3counter)"/>
  <line x1="0" y1="380" x2="248" y2="380" stroke="#a87838" stroke-width="0.85" filter="url(#i7p4p3bloom)" opacity="0.85"/>
  <!-- Wood grain on counter -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,400 Q60,398 120,400 Q180,402 248,400"/>
    <path d="M0,440 Q60,438 120,440 Q180,442 248,440"/>
    <path d="M0,500 Q60,498 120,500 Q180,502 248,500"/>
  </g>

  <!-- LENS CASE OPEN on counter -->
  <g transform="translate(124 460)">
    <!-- Open case lid (raised, behind) -->
    <path d="M-50,-40 L50,-40 L50,-30 L-50,-30 Z" fill="url(#i7p4p3wood)" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Case body open -->
    <rect x="-50" y="-30" width="100" height="50" fill="url(#i7p4p3wood)" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Felt interior -->
    <rect x="-46" y="-26" width="92" height="42" fill="url(#i7p4p3felt)"/>
    <!-- Felt fibers -->
    <g stroke="#7a3838" stroke-width="0.3" opacity="0.55">
      <line x1="-40" y1="-22" x2="-36" y2="-20" fill="none"/>
      <line x1="-30" y1="-18" x2="-26" y2="-16" fill="none"/>
      <line x1="20" y1="-22" x2="24" y2="-20" fill="none"/>
      <line x1="30" y1="10" x2="34" y2="12" fill="none"/>
    </g>
    <!-- THE LENS — plano-convex 4" -->
    <ellipse cx="0" cy="-4" rx="40" ry="14" fill="url(#i7p4p3lensCenter)" filter="url(#i7p4p3bloom)"/>
    <!-- Lens edge -->
    <ellipse cx="0" cy="-4" rx="40" ry="14" fill="none" stroke="#fff8c8" stroke-width="0.85" filter="url(#i7p4p3bloom)"/>
    <ellipse cx="0" cy="-4" rx="36" ry="12" fill="none" stroke="#ffd898" stroke-width="0.55" opacity="0.85"/>
    <ellipse cx="0" cy="-4" rx="20" ry="6" fill="none" stroke="#fff8c8" stroke-width="0.55" opacity="0.7"/>
    <!-- Convex highlight -->
    <ellipse cx="-12" cy="-8" rx="8" ry="3" fill="#fff" filter="url(#i7p4p3bloom)" opacity="0.85"/>
  </g>

  <!-- RAINBOW SPECTRUM refracted onto counter -->
  <g opacity="0.95" filter="url(#i7p4p3bloom)">
    <ellipse cx="80" cy="510" rx="40" ry="6" fill="#ff5050" opacity="0.55"/>
    <ellipse cx="80" cy="514" rx="38" ry="5" fill="#f0a040" opacity="0.55"/>
    <ellipse cx="80" cy="518" rx="36" ry="4" fill="#fff080" opacity="0.55"/>
    <ellipse cx="80" cy="522" rx="34" ry="3" fill="#80f0a0" opacity="0.55"/>
    <ellipse cx="80" cy="526" rx="32" ry="3" fill="#80a0f0" opacity="0.55"/>
    <ellipse cx="80" cy="530" rx="30" ry="2" fill="#a878f0" opacity="0.55"/>
  </g>

  <!-- Tiny rainbow specks scattered (from prisms in shop) -->
  <g opacity="0.85" filter="url(#i7p4p3bloom)">
    <circle cx="220" cy="40" r="0.85" fill="#ff5050"/>
    <circle cx="224" cy="44" r="0.7" fill="#f0a040"/>
    <circle cx="20" cy="160" r="0.85" fill="#80a0f0"/>
    <circle cx="24" cy="164" r="0.7" fill="#a878f0"/>
  </g>

  <!-- PRENTISS dialogue 1 -->
  <g>
    <rect x="14" y="14" width="220" height="40" rx="2" fill="white" stroke="#1a1018" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#1a1018" stroke-width="0.85"/>
    <line x1="100.5" y1="54" x2="111.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1018" font-weight="700">PRENTISS</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Cribbage. A clockmaker.</text>

  <!-- PRENTISS dialogue 2 -->
  <g>
    <rect x="14" y="540" width="220" height="34" rx="2" fill="white" stroke="#1a1018" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,540 112,540 104,530" fill="white" stroke="#1a1018" stroke-width="0.85"/>
    <line x1="100.5" y1="540" x2="111.5" y2="540" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1018" font-weight="700">PRENTISS</text>
  <text x="22" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Crown glass. I have one.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q60,202 120,198 Q180,196 248,200"/>
    <path d="M0,400 Q60,402 120,398 Q180,396 248,400"/>
  </g>
</svg>
