<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <title>Issue 7 — Page 15 — Panel 4: Wren's face descending — quiet satisfaction, lens copper-gold edge-glow</title>
  <desc>85mm close-up inset eye level. Wren's face against dark stone — East Asian wiry build dark hair high messy bun copper suit oil-stained. Behind on carry-harness glass lens element glows faint copper-gold edges. Expression softened — operational tension released replaced by quiet satisfaction. Faintest upturn corner of mouth. Amber lighthouse glow on stone. Wind-swept.</desc>

  <defs>
    <linearGradient id="i7p15p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="i7p15p4amber" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p15p4stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3838"/>
      <stop offset="100%" stop-color="#2a1818"/>
    </linearGradient>
    <linearGradient id="i7p15p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <linearGradient id="i7p15p4suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e89858"/>
      <stop offset="100%" stop-color="#5a2810"/>
    </linearGradient>
    <radialGradient id="i7p15p4lensEdge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p15p4bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i7p15p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p15p4strongglow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="200" height="220" fill="url(#i7p15p4bg)"/>

  <!-- Amber lighthouse glow upper -->
  <ellipse cx="100" cy="0" rx="180" ry="100" fill="url(#i7p15p4amber)" filter="url(#i7p15p4strongglow)"/>

  <!-- DARK STONE behind -->
  <rect x="0" y="0" width="200" height="220" fill="url(#i7p15p4stone)" opacity="0.85"/>
  <!-- Stone block seams -->
  <g stroke="#1a0c08" stroke-width="0.55" opacity="0.7" fill="none">
    <path d="M0,60 L200,60"/>
    <path d="M0,140 L200,140"/>
    <line x1="80" y1="0" x2="80" y2="60"/>
    <line x1="120" y1="60" x2="120" y2="140"/>
    <line x1="60" y1="140" x2="60" y2="220"/>
    <line x1="140" y1="140" x2="140" y2="220"/>
  </g>
  <!-- Stone texture -->
  <g stroke="#1a0c08" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M30,30 L40,40"/>
    <path d="M150,90 L160,100"/>
    <path d="M30,170 L40,180"/>
  </g>

  <!-- Backlit lens disc on harness -->
  <ellipse cx="60" cy="120" rx="32" ry="14" fill="url(#i7p15p4lensEdge)" filter="url(#i7p15p4bloom)"/>
  <ellipse cx="60" cy="120" rx="32" ry="14" fill="none" stroke="#ffd898" stroke-width="0.7" opacity="0.85" filter="url(#i7p15p4bloom)"/>
  <!-- Microscopic etching at rim -->
  <g fill="#ffd898" opacity="0.85" filter="url(#i7p15p4bloom)">
    <circle cx="28" cy="120" r="0.7"/>
    <circle cx="92" cy="120" r="0.7"/>
    <circle cx="60" cy="106" r="0.55"/>
    <circle cx="60" cy="134" r="0.55"/>
  </g>

  <!-- ===== WREN — face center-right ===== -->
  <g transform="translate(120 140)">
    <!-- Body -->
    <path d="M-22,80 L-30,30 L-22,-10 L22,-10 L30,30 L22,80 Z" fill="url(#i7p15p4suit)"/>
    <!-- Linen collar peek -->
    <path d="M-9,-10 L0,-12 L9,-10 L9,-7 L0,-9 L-9,-7 Z" fill="#e0d4b8" opacity="0.85"/>

    <!-- Head -->
    <ellipse cx="0" cy="-40" rx="22" ry="26" fill="url(#i7p15p4skin)"/>
    <!-- High messy bun -->
    <ellipse cx="0" cy="-66" rx="12" ry="6" fill="#1a0a04"/>
    <path d="M-12,-66 Q-16,-72 -14,-62" stroke="#1a0a04" stroke-width="0.85" fill="none"/>
    <path d="M12,-66 Q16,-72 14,-62" stroke="#1a0a04" stroke-width="0.85" fill="none"/>
    <path d="M-22,-58 Q-12,-66 0,-66 Q12,-66 22,-58" stroke="#1a0a04" stroke-width="2.4" fill="none"/>
    <!-- Loose strand wind-swept -->
    <path d="M-18,-48 Q-22,-36 -22,-22" stroke="#3a1808" stroke-width="0.85" fill="none" opacity="0.85"/>

    <!-- Cheekbone -->
    <path d="M-22,-40 Q-18,-22 -12,-12" fill="none" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>
    <path d="M22,-40 Q18,-22 12,-12" fill="none" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>

    <!-- Eyes — softened -->
    <ellipse cx="-9" cy="-40" rx="3" ry="1.4" fill="#fff"/>
    <ellipse cx="9" cy="-40" rx="3" ry="1.4" fill="#fff"/>
    <ellipse cx="-9" cy="-40" rx="1.4" ry="1" fill="#3a1808"/>
    <ellipse cx="9" cy="-40" rx="1.4" ry="1" fill="#3a1808"/>
    <circle cx="-9" cy="-40" r="0.55" fill="#ffd898"/>
    <circle cx="9" cy="-40" r="0.55" fill="#ffd898"/>

    <!-- Brow eased -->
    <path d="M-15,-50 Q-9,-52 -3,-50" stroke="#3a1808" stroke-width="1.4" fill="none"/>
    <path d="M15,-50 Q9,-52 3,-50" stroke="#3a1808" stroke-width="1.4" fill="none"/>

    <!-- Nose -->
    <path d="M-3,-40 L-5,-22 L0,-18 L5,-22 L3,-40 Z" fill="#5a3018" opacity="0.85"/>

    <!-- FAINT UPTURN at corner of mouth — almost a smile -->
    <path d="M-7,-9 Q0,-6 9,-11" stroke="#3a1808" stroke-width="0.85" fill="none"/>
    <path d="M-5,-8 Q0,-6 7,-10" stroke="#1a0c04" stroke-width="0.55" fill="none"/>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,100 Q60,102 120,98 Q160,96 200,100"/>
    <path d="M0,180 Q60,182 120,178 Q160,176 200,180"/>
  </g>
</svg>
