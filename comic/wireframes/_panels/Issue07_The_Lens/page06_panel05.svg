<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 410" width="238" height="410">
  <title>Issue 7 — Page 6 — Panel 5: Sable apart from squad — lighthouse beam sweeps her, professional focus over emotional distance</title>
  <desc>50mm fairy scale eye level. Sable standing apart from lens inspection looking toward off-panel lighthouse. Beam sweeps past — bar of amber light briefly illuminates pewter suit and silver-white hair before passing. Calculating measuring preparing — but a remove. Running operation correctly without being present in it. Hand at earpiece comms.</desc>

  <defs>
    <linearGradient id="i7p6p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2848"/>
      <stop offset="100%" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="i7p6p5beam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p6p5suitBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8c0a0"/>
      <stop offset="50%" stop-color="#a8b0c0"/>
      <stop offset="100%" stop-color="#506068"/>
    </linearGradient>
    <linearGradient id="i7p6p5skinBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="50%" stop-color="#5a3a28"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="i7p6p5stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5860"/>
      <stop offset="100%" stop-color="#2a2830"/>
    </linearGradient>
    <filter id="i7p6p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p6p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p6p5strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p6p5megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="238" height="410" fill="url(#i7p6p5bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.55">
    <circle cx="40" cy="20" r="0.55"/>
    <circle cx="120" cy="30" r="0.55"/>
    <circle cx="200" cy="20" r="0.4"/>
    <circle cx="80" cy="60" r="0.4"/>
    <circle cx="180" cy="80" r="0.55"/>
  </g>

  <!-- ===== LIGHTHOUSE BEAM sweeping THROUGH the panel — diagonal bar of amber light ===== -->
  <path d="M-40,80 L100,40 L260,40 L260,160 L120,200 L-40,200 Z" fill="url(#i7p6p5beam)" opacity="0.7" filter="url(#i7p6p5megaglow)"/>
  <!-- Beam center brightest -->
  <path d="M-40,140 L260,100 L260,140 L-40,180 Z" fill="#ffe0a8" opacity="0.4" filter="url(#i7p6p5strongglow)"/>

  <!-- Stone quay foreground -->
  <rect x="0" y="350" width="238" height="60" fill="url(#i7p6p5stone)"/>
  <line x1="0" y1="350" x2="238" y2="350" stroke="#1a1418" stroke-width="0.55"/>
  <g stroke="#1a1418" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,380 L238,380"/>
    <line x1="80" y1="350" x2="80" y2="410"/>
    <line x1="160" y1="350" x2="160" y2="410"/>
  </g>

  <!-- ===== SABLE — standing apart, beam catches her ===== -->
  <g transform="translate(119 350)">
    <ellipse cx="0" cy="0" rx="14" ry="2" fill="#000" opacity="0.7"/>
    <!-- Boots -->
    <ellipse cx="-7" cy="-2" rx="5" ry="2" fill="#1a1c20"/>
    <ellipse cx="7" cy="-2" rx="5" ry="2" fill="#1a1c20"/>
    <!-- Legs -->
    <path d="M-9,-4 L-12,-50 L-2,-70 L0,-50 Z" fill="url(#i7p6p5suitBeam)"/>
    <path d="M9,-4 L12,-50 L2,-70 L0,-50 Z" fill="url(#i7p6p5suitBeam)"/>
    <line x1="-12" y1="-50" x2="-4" y2="-50" stroke="#fff8c8" stroke-width="0.55" opacity="0.85" filter="url(#i7p6p5bloom)"/>
    <line x1="4" y1="-50" x2="12" y2="-50" stroke="#fff8c8" stroke-width="0.55" opacity="0.85" filter="url(#i7p6p5bloom)"/>

    <!-- Torso (caught in beam, reflecting amber) -->
    <path d="M-14,-70 L-18,-130 L-9,-150 L9,-150 L18,-130 L14,-70 Z" fill="url(#i7p6p5suitBeam)"/>
    <line x1="0" y1="-150" x2="0" y2="-70" stroke="#fff" stroke-width="0.7" opacity="0.95" filter="url(#i7p6p5bloom)"/>
    <!-- SOOT BLOOM still visible (darker against beam light) -->
    <ellipse cx="11" cy="-140" rx="6" ry="3" fill="#1a1814" opacity="0.85"/>
    <!-- Tension crease -->
    <line x1="-3" y1="-148" x2="-2" y2="-142" stroke="#0a0a14" stroke-width="0.4" opacity="0.95"/>
    <line x1="3" y1="-148" x2="2" y2="-142" stroke="#0a0a14" stroke-width="0.4" opacity="0.95"/>

    <!-- LEFT arm with hand at EARPIECE -->
    <path d="M-18,-130 L-26,-110 L-22,-90 L-12,-110 Z" fill="url(#i7p6p5suitBeam)"/>
    <ellipse cx="-22" cy="-90" rx="3" ry="2" fill="url(#i7p6p5skinBeam)"/>
    <!-- Hand RAISED to ear -->
    <path d="M-9,-150 L-18,-160 L-12,-170 L-3,-160 Z" fill="url(#i7p6p5suitBeam)"/>
    <ellipse cx="-12" cy="-168" rx="3" ry="2" fill="url(#i7p6p5skinBeam)"/>

    <!-- RIGHT arm at side -->
    <path d="M18,-130 L24,-110 L22,-90 L14,-110 Z" fill="url(#i7p6p5suitBeam)"/>

    <!-- Head — looking AHEAD toward lighthouse (right of frame) -->
    <ellipse cx="0" cy="-170" rx="9" ry="11" fill="url(#i7p6p5skinBeam)"/>
    <!-- Buzz cut catching beam light brilliantly -->
    <path d="M-7,-180 Q-7,-184 0,-186 Q7,-184 7,-180 L7,-176 Q4,-180 0,-180 Q-4,-180 -7,-176 Z" fill="#fff8c8" filter="url(#i7p6p5bloom)"/>
    <line x1="-6" y1="-180" x2="6" y2="-180" stroke="#fff" stroke-width="0.4" opacity="0.95" filter="url(#i7p6p5bloom)"/>
    <!-- Cheekbone uplit warm -->
    <path d="M-9,-170 Q-7,-162 -2,-160" fill="none" stroke="#3a2018" stroke-width="0.55" opacity="0.85"/>
    <path d="M9,-170 Q7,-162 2,-160" fill="none" stroke="#3a2018" stroke-width="0.55" opacity="0.85"/>
    <!-- Eyes — looking right -->
    <ellipse cx="-2" cy="-170" rx="1.4" ry="0.7" fill="#fff8e8"/>
    <ellipse cx="3" cy="-170" rx="1.4" ry="0.7" fill="#fff8e8"/>
    <ellipse cx="-1" cy="-170" rx="0.85" ry="0.55" fill="#1a1c30"/>
    <ellipse cx="4" cy="-170" rx="0.85" ry="0.55" fill="#1a1c30"/>
    <circle cx="-1" cy="-170" r="0.3" fill="#ffd898"/>
    <circle cx="4" cy="-170" r="0.3" fill="#ffd898"/>
    <!-- Brow level controlled -->
    <path d="M-7,-178 Q-3,-180 0,-178" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M7,-178 Q3,-180 0,-178" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <!-- Mouth set -->
    <line x1="-2" y1="-160" x2="2" y2="-160" stroke="#0a0604" stroke-width="0.55"/>
    <!-- Comms ear (her hand is here) -->
    <circle cx="-12" cy="-168" r="2" fill="#a8c0e8" filter="url(#i7p6p5bloom)" opacity="0.95"/>
  </g>

  <!-- SABLE -->
  <g>
    <rect x="14" y="14" width="200" height="34" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="80,48 92,48 84,58" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="80.5" y1="48" x2="91.5" y2="48" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Luma, comms?</text>

  <!-- LUMA off -->
  <g>
    <rect x="14" y="74" width="200" height="50" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a3ad8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">Marginal. The relay through</text>
  <text x="22" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">Jink will hold midpoint.</text>

  <!-- SABLE -->
  <g>
    <rect x="14" y="350" width="200" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="80,350 92,350 84,340" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="80.5" y1="350" x2="91.5" y2="350" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">We wait for full dark.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q60,182 120,178 Q180,176 238,180"/>
    <path d="M0,330 Q60,332 120,328 Q180,326 238,330"/>
  </g>
</svg>
