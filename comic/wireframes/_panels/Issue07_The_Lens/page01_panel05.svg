<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 410" width="238" height="410">
  <title>Issue 7 — Page 1 — Panel 5: Jink leaning forward, volunteers to escort Theodore — protecting friend masked as casual scout role</title>
  <desc>85mm close-up. Jink leaning forward from beam perch. One hand grips beam edge. Expression shifted from casual to invested. Volunteers to accompany Theodore — a choice not order. Friendship pulling them. Soft grin. Genuine concern under casual confidence. Copper-gold uplight on jaw and curls.</desc>

  <defs>
    <linearGradient id="i7p1p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <radialGradient id="i7p1p5copperUplit" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2418" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p1p5suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="50%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p1p5skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p1p5beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <filter id="i7p1p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p1p5glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i7p1p5strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="238" height="410" fill="url(#i7p1p5bg)"/>

  <!-- Copper uplight from below (off-frame schematic) -->
  <ellipse cx="119" cy="430" rx="240" ry="200" fill="url(#i7p1p5copperUplit)" filter="url(#i7p1p5strongglow)"/>

  <!-- TIMBER BEAM at lower frame edge — Jink's perch -->
  <rect x="0" y="350" width="238" height="20" fill="url(#i7p1p5beam)"/>
  <line x1="0" y1="350" x2="238" y2="350" stroke="#a8c0e8" stroke-width="0.55" opacity="0.55" filter="url(#i7p1p5bloom)"/>
  <line x1="0" y1="370" x2="238" y2="370" stroke="#080604" stroke-width="0.7" opacity="0.85"/>
  <!-- Wood grain -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.85" fill="none">
    <path d="M0,358 Q60,357 120,359 Q190,360 238,358"/>
    <path d="M0,365 Q60,364 120,366 Q190,367 238,365"/>
  </g>

  <!-- ===== JINK — leaning forward on beam, hand gripping edge ===== -->
  <g transform="translate(119 350)">
    <!-- Cast shadow on beam -->
    <ellipse cx="0" cy="0" rx="16" ry="2" fill="#000" opacity="0.7"/>

    <!-- Sitting cross-legged: thigh on beam -->
    <ellipse cx="-22" cy="-3" rx="14" ry="6" fill="url(#i7p1p5suit)"/>
    <!-- Right leg dangling forward (front of beam) -->
    <path d="M14,-2 L20,40 L18,80 L26,80 L24,38 L18,-3 Z" fill="url(#i7p1p5suit)"/>
    <!-- Other leg/foot tucked -->
    <ellipse cx="-26" cy="-9" rx="9" ry="5" fill="url(#i7p1p5suit)"/>
    <!-- Boot -->
    <ellipse cx="22" cy="80" rx="6" ry="3" fill="#1a0c04"/>

    <!-- Salt-damp staining on lower body -->
    <ellipse cx="22" cy="60" rx="5" ry="2" fill="#3a4838" opacity="0.55"/>
    <ellipse cx="-26" cy="-3" rx="9" ry="2" fill="#3a4838" opacity="0.4"/>

    <!-- Torso LEANING FORWARD -->
    <path d="M-22,-22 L-26,-100 L-12,-130 L18,-130 L26,-100 L18,-22 Z" fill="url(#i7p1p5suit)"/>
    <line x1="-2" y1="-130" x2="-2" y2="-22" stroke="#a8ffd0" stroke-width="0.55" opacity="0.85" filter="url(#i7p1p5bloom)"/>

    <!-- SOOT STREAK across chest (Issue 3 carry-over) -->
    <path d="M-24,-90 L20,-78" stroke="#1a1410" stroke-width="6" opacity="0.85"/>
    <path d="M-22,-86 L18,-76" stroke="#0a0604" stroke-width="2" opacity="0.85"/>

    <!-- LEFT HAND gripping beam edge (hand visible at lower torso level) -->
    <path d="M-26,-100 L-44,-80 L-50,-50 L-44,-30 L-32,-50 L-22,-90 Z" fill="url(#i7p1p5suit)"/>
    <ellipse cx="-50" cy="-30" rx="9" ry="5" fill="url(#i7p1p5skin)"/>
    <!-- Fingers gripping edge of beam -->
    <ellipse cx="-54" cy="-22" rx="2" ry="4" fill="url(#i7p1p5skin)"/>
    <ellipse cx="-52" cy="-16" rx="2" ry="4" fill="url(#i7p1p5skin)"/>
    <ellipse cx="-50" cy="-10" rx="2" ry="4" fill="url(#i7p1p5skin)"/>
    <ellipse cx="-46" cy="-6" rx="2" ry="4" fill="url(#i7p1p5skin)"/>

    <!-- RIGHT arm bent on knee -->
    <path d="M26,-100 L44,-80 L40,-50 L20,-60 L18,-90 Z" fill="url(#i7p1p5suit)"/>
    <ellipse cx="44" cy="-50" rx="6" ry="3" fill="url(#i7p1p5skin)"/>

    <!-- Wing-pack stowed (faint emerald slot glow at shoulders) -->
    <line x1="-26" y1="-118" x2="-30" y2="-100" stroke="#5af0a0" stroke-width="0.55" opacity="0.7" filter="url(#i7p1p5bloom)"/>
    <line x1="26" y1="-118" x2="30" y2="-100" stroke="#5af0a0" stroke-width="0.55" opacity="0.7" filter="url(#i7p1p5bloom)"/>

    <!-- Neck -->
    <path d="M-7,-150 L-12,-130 L12,-130 L7,-150 Z" fill="url(#i7p1p5skin)"/>

    <!-- Head — lean forward, leaning toward off-panel briefing -->
    <ellipse cx="0" cy="-180" rx="22" ry="26" fill="url(#i7p1p5skin)"/>

    <!-- WILD GOLDEN BLONDE CURLS — abundant, lit from below -->
    <path d="M-22,-202 Q-15,-220 0,-220 Q15,-220 22,-202 L22,-180 Q15,-200 0,-200 Q-15,-200 -22,-180 Z" fill="#f0d878"/>
    <!-- Loose curls -->
    <circle cx="-18" cy="-214" r="4" fill="#f0d878"/>
    <circle cx="-12" cy="-220" r="3" fill="#f0d878"/>
    <circle cx="-4" cy="-224" r="3" fill="#f0d878"/>
    <circle cx="6" cy="-222" r="3" fill="#f0d878"/>
    <circle cx="14" cy="-218" r="3" fill="#f0d878"/>
    <circle cx="20" cy="-208" r="3" fill="#f0d878"/>
    <!-- Loose strands -->
    <path d="M-22,-200 L-28,-188" stroke="#f0d878" stroke-width="1.4" fill="none"/>
    <path d="M22,-198 L28,-188" stroke="#f0d878" stroke-width="1.4" fill="none"/>
    <!-- Copper uplight on curls (warm gold) -->
    <ellipse cx="0" cy="-208" rx="22" ry="3" fill="#ffd898" opacity="0.85" filter="url(#i7p1p5bloom)"/>

    <!-- Cheekbones uplit -->
    <path d="M-20,-180 Q-18,-164 -10,-156" fill="none" stroke="#5a3818" stroke-width="0.7" opacity="0.85"/>
    <path d="M20,-180 Q18,-164 10,-156" fill="none" stroke="#5a3818" stroke-width="0.7" opacity="0.85"/>
    <!-- Warm uplight under jaw -->
    <ellipse cx="0" cy="-152" rx="14" ry="3" fill="#ffd898" opacity="0.55" filter="url(#i7p1p5bloom)"/>

    <!-- Eyes — alert, warm, looking forward (toward off-frame Sable/Wren) -->
    <ellipse cx="-9" cy="-180" rx="4" ry="2" fill="#fff"/>
    <ellipse cx="9" cy="-180" rx="4" ry="2" fill="#fff"/>
    <ellipse cx="-9" cy="-180" rx="2" ry="1.4" fill="#1a4a28"/>
    <ellipse cx="9" cy="-180" rx="2" ry="1.4" fill="#1a4a28"/>
    <circle cx="-9" cy="-180" r="0.7" fill="#fff"/>
    <circle cx="9" cy="-180" r="0.7" fill="#fff"/>
    <!-- Catchlights — copper warmth from below -->
    <circle cx="-9" cy="-178" r="0.55" fill="#ffd898"/>
    <circle cx="9" cy="-178" r="0.55" fill="#ffd898"/>

    <!-- Brow lifted (alert, invested) -->
    <path d="M-15,-194 Q-9,-198 -2,-194" stroke="#5a3018" stroke-width="1.4" fill="none"/>
    <path d="M15,-194 Q9,-198 2,-194" stroke="#5a3018" stroke-width="1.4" fill="none"/>

    <!-- Nose -->
    <path d="M-2,-180 L-3,-166 L0,-162 L3,-166 L2,-180 Z" fill="#a87838" opacity="0.85"/>

    <!-- SOFT GRIN — corner of mouth lifted slightly, genuine -->
    <path d="M-9,-152 Q0,-148 9,-152" stroke="#3a1808" stroke-width="1.4" fill="none"/>
    <path d="M-7,-150 Q0,-146 7,-150" stroke="#5a3018" stroke-width="0.55" fill="none"/>

    <!-- Comms ear glow -->
    <circle cx="22" cy="-178" r="1.4" fill="#5af0a0" filter="url(#i7p1p5bloom)" opacity="0.95"/>
  </g>

  <!-- JINK dialogue 1 -->
  <g>
    <rect x="14" y="14" width="210" height="50" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,64 112,64 104,76" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="100.5" y1="64" x2="111.5" y2="64" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2ed078" font-weight="700">JINK</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I'll go with Theodore.</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">For the daytime run.</text>

  <!-- SABLE off-panel -->
  <g>
    <rect x="14" y="86" width="210" height="34" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE  <tspan font-style="italic" font-size="8" font-weight="500">(off-panel)</tspan></text>
  <text x="22" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">That wasn't part of—</text>

  <!-- JINK reply -->
  <g>
    <rect x="14" y="338" width="210" height="62" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,338 112,338 104,328" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="100.5" y1="338" x2="111.5" y2="338" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2ed078" font-weight="700">JINK</text>
  <text x="22" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">He shouldn't be alone in</text>
  <text x="22" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">unfamiliar territory.</text>
  <text x="22" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">I'm the scout. Let me scout.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q60,202 120,198 Q180,196 238,200"/>
    <path d="M0,310 Q60,312 120,308 Q180,306 238,310"/>
  </g>
</svg>
