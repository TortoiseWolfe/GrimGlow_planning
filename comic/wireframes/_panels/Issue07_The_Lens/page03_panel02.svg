<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 410" width="366" height="410">
  <title>Issue 7 — Page 3 — Panel 2: Jink in pocket — fairy-scale POV out at giant pedestrians, mapping new terrain</title>
  <desc>35mm low fairy-scale angle. Inside Theodore's waistcoat pocket. Jink peers over fabric edge. Hands grip leather edge. Wing-pack stowed flat. Beyond pocket: giant pedestrians, cart wheels, cobblestones far below. Wider streets larger people rougher. Scout cataloguing. Diffused grey-white from above pocket edge. Faint emerald glow stowed wing-pack seams.</desc>

  <defs>
    <linearGradient id="i7p3p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="i7p3p2pocketLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#9aa098" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p3p2leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="i7p3p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p3p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p3p2outsideGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa098"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="i7p3p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3438"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <filter id="i7p3p2bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i7p3p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p3p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="366" height="410" fill="url(#i7p3p2bg)"/>

  <!-- Pocket light radial from top -->
  <ellipse cx="183" cy="0" rx="320" ry="140" fill="url(#i7p3p2pocketLight)" filter="url(#i7p3p2strongglow)"/>

  <!-- ===== POCKET WALLS (foreground frame) ===== -->
  <!-- Bottom of pocket (we're inside) -->
  <path d="M0,260 L40,250 L320,250 L366,260 L366,410 L0,410 Z" fill="url(#i7p3p2leather)"/>
  <!-- Pocket sides -->
  <path d="M0,0 L0,260 L40,250 L40,40 Z" fill="url(#i7p3p2leather)"/>
  <path d="M366,0 L326,40 L326,250 L366,260 Z" fill="url(#i7p3p2leather)"/>

  <!-- Pocket edge (top, where we look out over) -->
  <path d="M40,40 L40,90 L326,90 L326,40 Z" fill="url(#i7p3p2leather)"/>
  <line x1="40" y1="90" x2="326" y2="90" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <!-- Stitching along the edge -->
  <g stroke="#7a4828" stroke-width="0.4" opacity="0.85" fill="none">
    <line x1="50" y1="86" x2="58" y2="84"/>
    <line x1="60" y1="84" x2="68" y2="86"/>
    <line x1="70" y1="86" x2="78" y2="84"/>
    <line x1="80" y1="84" x2="88" y2="86"/>
    <line x1="90" y1="86" x2="98" y2="84"/>
    <line x1="100" y1="84" x2="108" y2="86"/>
    <line x1="110" y1="86" x2="118" y2="84"/>
    <line x1="280" y1="86" x2="290" y2="84"/>
    <line x1="290" y1="84" x2="300" y2="86"/>
    <line x1="300" y1="86" x2="310" y2="84"/>
  </g>
  <!-- Leather creases / wear lines -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M14,200 Q40,180 38,140"/>
    <path d="M340,180 Q330,150 332,120"/>
  </g>

  <!-- ===== OUTSIDE WORLD — visible above pocket edge, large pedestrians ===== -->
  <rect x="40" y="0" width="286" height="40" fill="url(#i7p3p2outsideGrey)"/>

  <!-- Buildings far back (silhouettes of warehouses) -->
  <g opacity="0.55">
    <rect x="40" y="14" width="40" height="26" fill="#1a1410"/>
    <rect x="80" y="6" width="30" height="34" fill="#1a1410"/>
    <rect x="200" y="10" width="50" height="30" fill="#1a1410"/>
    <rect x="270" y="14" width="40" height="26" fill="#1a1410"/>
  </g>

  <!-- ===== HUGE PEDESTRIANS LEGS — fill the upper outside area ===== -->
  <!-- Pedestrian 1 (far left): legs in dark trousers and big boots -->
  <g transform="translate(70 0)">
    <path d="M-9,40 L-9,-12 L-6,-30 L0,40 Z" fill="#1a0c04"/>
    <path d="M9,40 L9,-14 L6,-30 L0,40 Z" fill="#1a0c04"/>
    <ellipse cx="-9" cy="40" rx="14" ry="3" fill="#1a0c04"/>
    <ellipse cx="9" cy="40" rx="14" ry="3" fill="#1a0c04"/>
  </g>
  <!-- Pedestrian 2 (mid-left): bigger boots, working trousers -->
  <g transform="translate(140 0)">
    <path d="M-12,40 L-14,-10 L-6,-30 L0,40 Z" fill="#3a2818"/>
    <path d="M12,40 L14,-12 L6,-30 L0,40 Z" fill="#3a2818"/>
    <ellipse cx="-12" cy="40" rx="20" ry="4" fill="#1a0c04"/>
    <ellipse cx="12" cy="40" rx="20" ry="4" fill="#1a0c04"/>
    <!-- Hobnail studs visible -->
    <circle cx="-16" cy="42" r="1" fill="#a87838" filter="url(#i7p3p2bloom)" opacity="0.85"/>
    <circle cx="-12" cy="42" r="1" fill="#a87838" filter="url(#i7p3p2bloom)" opacity="0.85"/>
    <circle cx="-8" cy="42" r="1" fill="#a87838" filter="url(#i7p3p2bloom)" opacity="0.85"/>
    <circle cx="8" cy="42" r="1" fill="#a87838" filter="url(#i7p3p2bloom)" opacity="0.85"/>
    <circle cx="12" cy="42" r="1" fill="#a87838" filter="url(#i7p3p2bloom)" opacity="0.85"/>
    <circle cx="16" cy="42" r="1" fill="#a87838" filter="url(#i7p3p2bloom)" opacity="0.85"/>
  </g>
  <!-- Pedestrian 3 (right): lady's skirt/boots -->
  <g transform="translate(220 0)">
    <path d="M-20,40 L-14,-8 L-6,-30 L0,40 Z" fill="#3a2418"/>
    <path d="M20,40 L14,-8 L6,-30 L0,40 Z" fill="#3a2418"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#1a0c04" stroke-width="0.55"/>
  </g>
  <!-- Pedestrian 4 (far right): cart wheel partial -->
  <g transform="translate(300 30)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#1a0c04" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#1a0c04"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#1a0c04" stroke-width="0.7"/>
  </g>

  <!-- Cobblestones beneath pedestrians (hint at street level) -->
  <rect x="40" y="36" width="286" height="4" fill="url(#i7p3p2cobble)"/>

  <!-- ===== JINK — peering over edge, lower frame ===== -->
  <g transform="translate(183 130)">
    <!-- Body suspended from below — only shoulders + head visible above pocket bottom -->
    <!-- Shoulders -->
    <path d="M-22,40 L-30,-30 L-12,-50 L12,-50 L30,-30 L22,40 Z" fill="url(#i7p3p2suit)"/>
    <line x1="0" y1="-50" x2="0" y2="40" stroke="#a8ffd0" stroke-width="0.7" opacity="0.85" filter="url(#i7p3p2bloom)"/>
    <!-- Soot streak -->
    <path d="M-22,-12 L20,-8" stroke="#1a1410" stroke-width="6" opacity="0.85"/>

    <!-- Wing-pack stowed flat -->
    <path d="M-30,-30 L-38,-26 L-36,-2 L-30,4 Z" fill="#1a6838"/>
    <line x1="-34" y1="-22" x2="-34" y2="-2" stroke="#5af0a0" stroke-width="0.55" opacity="0.85" filter="url(#i7p3p2bloom)"/>
    <path d="M30,-30 L38,-26 L36,-2 L30,4 Z" fill="#1a6838"/>
    <line x1="34" y1="-22" x2="34" y2="-2" stroke="#5af0a0" stroke-width="0.55" opacity="0.85" filter="url(#i7p3p2bloom)"/>

    <!-- Both arms reaching UP — hands gripping pocket leather edge -->
    <path d="M-22,-30 L-44,-50 L-44,-80 L-30,-50 Z" fill="url(#i7p3p2suit)"/>
    <path d="M22,-30 L44,-50 L44,-80 L30,-50 Z" fill="url(#i7p3p2suit)"/>
    <!-- Hands gripping the leather edge (which is line at y=-40) -->
    <ellipse cx="-44" cy="-80" rx="6" ry="3" fill="url(#i7p3p2skin)"/>
    <ellipse cx="44" cy="-80" rx="6" ry="3" fill="url(#i7p3p2skin)"/>
    <!-- Fingers gripping over edge -->
    <ellipse cx="-46" cy="-86" rx="2" ry="3" fill="url(#i7p3p2skin)"/>
    <ellipse cx="-42" cy="-86" rx="2" ry="3" fill="url(#i7p3p2skin)"/>
    <ellipse cx="42" cy="-86" rx="2" ry="3" fill="url(#i7p3p2skin)"/>
    <ellipse cx="46" cy="-86" rx="2" ry="3" fill="url(#i7p3p2skin)"/>

    <!-- Head — peering over edge -->
    <ellipse cx="0" cy="-66" rx="14" ry="16" fill="url(#i7p3p2skin)"/>
    <!-- Wild golden curls -->
    <path d="M-12,-78 Q-9,-92 0,-94 Q9,-92 12,-78 L12,-72 Q6,-78 0,-78 Q-6,-78 -12,-72 Z" fill="#f0d878"/>
    <circle cx="-9" cy="-86" r="3" fill="#f0d878"/>
    <circle cx="-3" cy="-92" r="2.4" fill="#f0d878"/>
    <circle cx="4" cy="-92" r="2.4" fill="#f0d878"/>
    <circle cx="9" cy="-86" r="3" fill="#f0d878"/>
    <!-- Daylight on top of head from above -->
    <ellipse cx="0" cy="-92" rx="14" ry="3" fill="#a8a098" opacity="0.55" filter="url(#i7p3p2bloom)"/>

    <!-- Cheekbones lit -->
    <path d="M-12,-66 Q-9,-58 -4,-54" fill="none" stroke="#5a3818" stroke-width="0.55" opacity="0.7"/>
    <path d="M12,-66 Q9,-58 4,-54" fill="none" stroke="#5a3818" stroke-width="0.55" opacity="0.7"/>

    <!-- Eyes — alert, scanning -->
    <ellipse cx="-4" cy="-66" rx="2" ry="1" fill="#fff"/>
    <ellipse cx="4" cy="-66" rx="2" ry="1" fill="#fff"/>
    <ellipse cx="-3" cy="-66" rx="1" ry="0.85" fill="#1a4a28"/>
    <ellipse cx="5" cy="-66" rx="1" ry="0.85" fill="#1a4a28"/>
    <circle cx="-3" cy="-66" r="0.4" fill="#fff"/>
    <circle cx="5" cy="-66" r="0.4" fill="#fff"/>
    <!-- Brow tilted up (alert) -->
    <path d="M-9,-72 Q-4,-74 0,-72" stroke="#5a3018" stroke-width="0.85" fill="none"/>
    <path d="M9,-72 Q4,-74 0,-72" stroke="#5a3018" stroke-width="0.85" fill="none"/>
    <!-- Mouth -->
    <line x1="-2" y1="-58" x2="2" y2="-58" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Comms ear -->
    <circle cx="14" cy="-66" r="1" fill="#5af0a0" filter="url(#i7p3p2bloom)" opacity="0.85"/>
  </g>

  <!-- JINK whisper -->
  <g>
    <rect x="14" y="160" width="220" height="34" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="100,194 112,194 104,204" fill="white" stroke="#2ed078" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(whispered)</tspan></text>
  <text x="22" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Wider streets. Less cover.</text>

  <!-- THEODORE -->
  <g>
    <rect x="14" y="350" width="338" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE  <tspan font-style="italic" font-size="8" font-weight="500">(low, not looking down)</tspan></text>
  <text x="22" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Working docks ahead. Louder, rougher.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q100,162 200,158 Q280,156 366,160"/>
    <path d="M0,330 Q100,332 200,328 Q280,326 366,330"/>
  </g>
</svg>
