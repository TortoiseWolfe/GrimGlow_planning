<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 410" width="366" height="410">
  <title>Issue 7 — Page 5 — Panel 3: Fairy-scale up at Theodore's face — friendship across scale, unguarded</title>
  <desc>50mm low fairy-scale angle from Jink's level on knee. Theodore's face fills upper frame against grey-amber sky enormous from this perspective. Open warm expression — lonely boy who has a friend. Jink cross-legged on knee in foreground textured wool surface — relaxed comfortable no performance. Faint emerald glow suit nodes.</desc>

  <defs>
    <linearGradient id="i7p5p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7868"/>
      <stop offset="100%" stop-color="#9a9078"/>
    </linearGradient>
    <linearGradient id="i7p5p3skinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a87838"/>
      <stop offset="50%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="i7p5p3wool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3028"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i7p5p3suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p5p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i7p5p3bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i7p5p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p5p3strongglow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Sky upper portion -->
  <rect width="366" height="220" fill="url(#i7p5p3sky)"/>

  <!-- ===== THEODORE'S FACE filling upper frame, looking DOWN at Jink ===== -->
  <g transform="translate(183 60)">
    <!-- Linen collar at upper frame -->
    <path d="M-100,30 L-30,10 L30,10 L100,30 L100,40 L-100,40 Z" fill="#e0d4b8"/>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#a89878" stroke-width="0.55"/>

    <!-- Underside of jaw — enormous -->
    <path d="M-100,30 Q-70,-10 0,-30 Q70,-10 100,30 L100,80 L-100,80 Z" fill="url(#i7p5p3skinFace)"/>
    <!-- Jaw line shadow -->
    <path d="M-90,18 Q-60,-14 0,-26 Q60,-14 90,18" fill="none" stroke="#3a1808" stroke-width="1.4" opacity="0.85"/>
    <!-- Chin line -->
    <ellipse cx="0" cy="-26" rx="14" ry="3" fill="#7a4818" opacity="0.85"/>

    <!-- Mouth — warm smile (upside-down view from below) -->
    <path d="M-22,-50 Q0,-46 22,-50" stroke="#3a1808" stroke-width="1.4" fill="none"/>
    <path d="M-20,-48 Q0,-44 20,-48" stroke="#1a0c04" stroke-width="0.85" fill="none"/>

    <!-- Tip of nose visible from below -->
    <path d="M-9,-60 L0,-72 L9,-60 L0,-58 Z" fill="#7a4818"/>

    <!-- EYES looking DOWN — big, open, hazel -->
    <ellipse cx="-30" cy="-90" rx="14" ry="6" fill="#fff8e8"/>
    <ellipse cx="30" cy="-90" rx="14" ry="6" fill="#fff8e8"/>
    <ellipse cx="-30" cy="-86" rx="7" ry="4" fill="#7a4818"/>
    <ellipse cx="30" cy="-86" rx="7" ry="4" fill="#7a4818"/>
    <ellipse cx="-30" cy="-86" rx="3" ry="3" fill="#3a1808"/>
    <ellipse cx="30" cy="-86" rx="3" ry="3" fill="#3a1808"/>
    <!-- Catchlights -->
    <circle cx="-32" cy="-90" r="1.4" fill="#fff"/>
    <circle cx="28" cy="-90" r="1.4" fill="#fff"/>

    <!-- Lash lines below eyes (looking down) -->
    <path d="M-44,-86 Q-30,-78 -16,-86" stroke="#3a1808" stroke-width="1" fill="none"/>
    <path d="M44,-86 Q30,-78 16,-86" stroke="#3a1808" stroke-width="1" fill="none"/>

    <!-- Brow soft, raised slightly (warm) -->
    <path d="M-50,-110 Q-30,-118 -10,-110" stroke="#5a3018" stroke-width="2.4" fill="none"/>
    <path d="M50,-110 Q30,-118 10,-110" stroke="#5a3018" stroke-width="2.4" fill="none"/>

    <!-- Hair — sandy brown framing top -->
    <path d="M-90,-130 Q-60,-160 0,-160 Q60,-160 90,-130 L90,-110 Q60,-130 0,-130 Q-60,-130 -90,-110 Z" fill="#9a7038"/>
    <path d="M-22,-160 L-14,-170 L-30,-168 Z" fill="#a87838"/>
    <path d="M14,-160 L22,-170 L6,-168 Z" fill="#a87838"/>
    <path d="M-2,-160 L4,-172 L-8,-170 Z" fill="#a87838"/>

    <!-- Freckles -->
    <circle cx="-44" cy="-60" r="1.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="-30" cy="-50" r="1.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="30" cy="-50" r="1.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="44" cy="-60" r="1.4" fill="#5a3018" opacity="0.85"/>
  </g>

  <!-- ===== KNEE textured wool surface (lower frame) ===== -->
  <rect x="0" y="280" width="366" height="130" fill="url(#i7p5p3wool)"/>
  <!-- Wool texture cross-hatch -->
  <g stroke="#3a1808" stroke-width="0.55" opacity="0.7" fill="none">
    <line x1="0" y1="290" x2="366" y2="290"/>
    <line x1="0" y1="310" x2="366" y2="310"/>
    <line x1="0" y1="330" x2="366" y2="330"/>
    <line x1="0" y1="350" x2="366" y2="350"/>
    <line x1="0" y1="370" x2="366" y2="370"/>
    <line x1="0" y1="390" x2="366" y2="390"/>
  </g>
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.55" fill="none" stroke-dasharray="3,2">
    <line x1="40" y1="280" x2="40" y2="410"/>
    <line x1="100" y1="280" x2="100" y2="410"/>
    <line x1="160" y1="280" x2="160" y2="410"/>
    <line x1="220" y1="280" x2="220" y2="410"/>
    <line x1="280" y1="280" x2="280" y2="410"/>
    <line x1="340" y1="280" x2="340" y2="410"/>
  </g>
  <!-- Knee curvature shadow -->
  <ellipse cx="183" cy="280" rx="280" ry="14" fill="#7a4818" opacity="0.55"/>

  <!-- ===== JINK — sitting cross-legged on knee, looking up ===== -->
  <g transform="translate(183 320)">
    <!-- Cast shadow -->
    <ellipse cx="0" cy="20" rx="22" ry="4" fill="#000" opacity="0.7"/>

    <!-- Cross-legged: knees splayed -->
    <ellipse cx="-22" cy="14" rx="14" ry="6" fill="url(#i7p5p3suit)"/>
    <ellipse cx="22" cy="14" rx="14" ry="6" fill="url(#i7p5p3suit)"/>
    <!-- Boots tucked beneath -->
    <ellipse cx="-12" cy="20" rx="6" ry="2" fill="#0a0408"/>
    <ellipse cx="12" cy="20" rx="6" ry="2" fill="#0a0408"/>

    <!-- Salt-damp staining lower body -->
    <ellipse cx="-22" cy="18" rx="9" ry="2" fill="#3a4838" opacity="0.55"/>
    <ellipse cx="22" cy="18" rx="9" ry="2" fill="#3a4838" opacity="0.55"/>

    <!-- Torso -->
    <path d="M-22,8 L-26,-50 L-12,-70 L12,-70 L26,-50 L22,8 Z" fill="url(#i7p5p3suit)"/>
    <line x1="0" y1="-70" x2="0" y2="8" stroke="#a8ffd0" stroke-width="0.55" opacity="0.85" filter="url(#i7p5p3bloom)"/>
    <!-- Soot streak -->
    <path d="M-22,-30 L20,-22" stroke="#1a1410" stroke-width="4" opacity="0.85"/>

    <!-- Arms relaxed, on knees / lap -->
    <path d="M-26,-50 L-32,-30 L-22,-14 L-14,-30 Z" fill="url(#i7p5p3suit)"/>
    <path d="M26,-50 L32,-30 L22,-14 L14,-30 Z" fill="url(#i7p5p3suit)"/>
    <ellipse cx="-32" cy="-14" rx="4" ry="2" fill="url(#i7p5p3skin)"/>
    <ellipse cx="32" cy="-14" rx="4" ry="2" fill="url(#i7p5p3skin)"/>

    <!-- Wing-pack stowed (faint) -->
    <line x1="-26" y1="-66" x2="-30" y2="-50" stroke="#5af0a0" stroke-width="0.55" opacity="0.85" filter="url(#i7p5p3bloom)"/>
    <line x1="26" y1="-66" x2="30" y2="-50" stroke="#5af0a0" stroke-width="0.55" opacity="0.85" filter="url(#i7p5p3bloom)"/>

    <!-- Head — looking UP -->
    <ellipse cx="0" cy="-90" rx="14" ry="16" fill="url(#i7p5p3skin)"/>
    <!-- Curls -->
    <path d="M-12,-104 Q-9,-120 0,-122 Q9,-120 12,-104 L12,-96 Q9,-104 0,-104 Q-9,-104 -12,-96 Z" fill="#f0d878"/>
    <circle cx="-9" cy="-114" r="3" fill="#f0d878"/>
    <circle cx="-3" cy="-120" r="3" fill="#f0d878"/>
    <circle cx="6" cy="-120" r="3" fill="#f0d878"/>
    <circle cx="11" cy="-114" r="3" fill="#f0d878"/>

    <!-- Cheekbones -->
    <path d="M-12,-90 Q-9,-82 -4,-78" fill="none" stroke="#5a3818" stroke-width="0.55" opacity="0.85"/>
    <path d="M12,-90 Q9,-82 4,-78" fill="none" stroke="#5a3818" stroke-width="0.55" opacity="0.85"/>

    <!-- Eyes — looking UP, soft -->
    <ellipse cx="-4" cy="-90" rx="2.4" ry="1.4" fill="#fff"/>
    <ellipse cx="4" cy="-90" rx="2.4" ry="1.4" fill="#fff"/>
    <ellipse cx="-4" cy="-92" rx="1.4" ry="1" fill="#1a4a28"/>
    <ellipse cx="4" cy="-92" rx="1.4" ry="1" fill="#1a4a28"/>
    <circle cx="-4" cy="-92" r="0.4" fill="#fff"/>
    <circle cx="4" cy="-92" r="0.4" fill="#fff"/>

    <!-- Brow soft -->
    <path d="M-9,-100 Q-4,-102 0,-100" stroke="#5a3018" stroke-width="0.85" fill="none"/>
    <path d="M9,-100 Q4,-102 0,-100" stroke="#5a3018" stroke-width="0.85" fill="none"/>

    <!-- Nose -->
    <path d="M-2,-90 L-2,-82 L0,-80 L2,-82 L2,-90 Z" fill="#a87838" opacity="0.85"/>

    <!-- Mouth — relaxed -->
    <path d="M-3,-72 Q0,-70 3,-72" stroke="#3a1808" stroke-width="0.55" fill="none"/>
  </g>

  <!-- THEODORE -->
  <g>
    <rect x="14" y="14" width="240" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="100.5" y1="54" x2="111.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Do you miss it? Where you came from?</text>

  <!-- JINK reply -->
  <g>
    <rect x="14" y="350" width="338" height="50" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95"/>
    <polygon points="160,350 172,350 164,340" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="160.5" y1="350" x2="171.5" y2="350" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#2ed078" font-weight="700">JINK</text>
  <text x="22" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Sometimes. Mostly I miss the boredom.</text>
  <text x="22" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Being bored meant everything was safe.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q100,162 200,158 Q280,156 366,160"/>
    <path d="M0,300 Q100,302 200,298 Q280,296 366,300"/>
  </g>
</svg>
