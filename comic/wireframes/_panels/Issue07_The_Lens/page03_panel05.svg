<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 410" width="366" height="410">
  <title>Issue 7 — Page 3 — Panel 5: Inside pocket — Jink looks up at Theodore's jaw, warm pride, friendship beat</title>
  <desc>85mm close-up fairy scale inside pocket. Jink looks up. Hand pressed flat against pocket interior steadying. Above visible through pocket opening: underside of boy's jaw chin enormous from this scale. Pocket fabric frames shot warm leather tones. Genuine warm smile not reckless grin — real pride in a friend. Warm Theodore body heat. Diffused overcast from above. Intimacy of enclosed space — two friends in shared mission.</desc>

  <defs>
    <linearGradient id="i7p3p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="i7p3p5pocketWarm" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p3p5topLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#9aa098" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p3p5leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i7p3p5suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p3p5skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p3p5jawSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <filter id="i7p3p5bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i7p3p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p3p5strongglow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="366" height="410" fill="url(#i7p3p5bg)"/>

  <!-- Diffused warm pocket interior light -->
  <ellipse cx="183" cy="220" rx="320" ry="240" fill="url(#i7p3p5pocketWarm)" filter="url(#i7p3p5strongglow)"/>

  <!-- Diffused light from above (pocket opening) -->
  <ellipse cx="183" cy="0" rx="280" ry="120" fill="url(#i7p3p5topLight)" filter="url(#i7p3p5strongglow)"/>

  <!-- ===== POCKET WALLS — left and right ===== -->
  <path d="M0,0 L0,410 L80,410 L70,80 L40,0 Z" fill="url(#i7p3p5leather)"/>
  <path d="M366,0 L326,0 L296,80 L286,410 L366,410 Z" fill="url(#i7p3p5leather)"/>
  <!-- Pocket bottom -->
  <path d="M70,400 L296,400 L286,410 L80,410 Z" fill="url(#i7p3p5leather)"/>

  <!-- Leather creases / wear lines -->
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.7" fill="none">
    <path d="M40,30 Q60,80 50,160 Q40,240 60,320"/>
    <path d="M326,30 Q310,80 320,160 Q330,240 310,320"/>
    <path d="M14,150 L34,160"/>
    <path d="M340,180 L322,190"/>
  </g>

  <!-- ===== ABOVE — UNDERSIDE OF THEODORE'S JAW visible through pocket opening ===== -->
  <!-- Pocket opening hint at top -->
  <path d="M40,0 L70,80 L296,80 L326,0 Z" fill="#080604"/>

  <!-- Theodore's jaw underside (warm, enormous from below) -->
  <g transform="translate(183 0)">
    <!-- Linen collar at top edge -->
    <path d="M-110,80 L-30,40 L30,40 L110,80 L110,90 L-110,90 Z" fill="#e0d4b8"/>
    <line x1="-30" y1="40" x2="30" y2="40" stroke="#a89878" stroke-width="0.55"/>

    <!-- Underside of jaw (massive at fairy scale) -->
    <path d="M-100,50 Q-70,20 0,8 Q70,20 100,50 L100,80 L-100,80 Z" fill="url(#i7p3p5jawSkin)"/>
    <!-- Jaw line shadow -->
    <path d="M-90,40 Q-60,16 0,8 Q60,16 90,40" fill="none" stroke="#3a1808" stroke-width="1.4" opacity="0.85"/>
    <!-- Chin (small bump) -->
    <ellipse cx="0" cy="6" rx="14" ry="3" fill="#7a4818" opacity="0.85"/>
    <!-- Mouth visible from below (LIPS as line, slight smile / talking) -->
    <path d="M-22,-2 Q0,2 22,-2" stroke="#3a1808" stroke-width="1.4" fill="none"/>
    <!-- Tip of nose visible -->
    <path d="M-9,-12 L0,-22 L9,-12 L0,-9 Z" fill="#7a4818"/>
    <!-- Freckles -->
    <circle cx="-30" cy="20" r="1" fill="#5a3018"/>
    <circle cx="-22" cy="26" r="1" fill="#5a3018"/>
    <circle cx="22" cy="26" r="1" fill="#5a3018"/>
    <circle cx="30" cy="20" r="1" fill="#5a3018"/>
  </g>

  <!-- ===== JINK — center, looking UP, hand pressed flat against pocket wall ===== -->
  <g transform="translate(183 320)">
    <!-- Boots planted (lower frame) -->
    <ellipse cx="-22" cy="50" rx="14" ry="4" fill="#0a0408"/>
    <ellipse cx="22" cy="50" rx="14" ry="4" fill="#0a0408"/>

    <!-- Legs -->
    <path d="M-22,46 L-30,-30 L-12,-50 L0,-30 Z" fill="url(#i7p3p5suit)"/>
    <path d="M22,46 L30,-30 L12,-50 L0,-30 Z" fill="url(#i7p3p5suit)"/>

    <!-- Salt-damp staining lower legs -->
    <ellipse cx="-22" cy="20" rx="9" ry="3" fill="#3a4838" opacity="0.55"/>
    <ellipse cx="22" cy="20" rx="9" ry="3" fill="#3a4838" opacity="0.55"/>

    <!-- Torso -->
    <path d="M-22,-50 L-30,-130 L-12,-150 L12,-150 L30,-130 L22,-50 Z" fill="url(#i7p3p5suit)"/>
    <line x1="0" y1="-150" x2="0" y2="-50" stroke="#a8ffd0" stroke-width="0.7" opacity="0.85" filter="url(#i7p3p5bloom)"/>
    <!-- Soot streak -->
    <path d="M-26,-100 L26,-94" stroke="#1a1410" stroke-width="6" opacity="0.85"/>

    <!-- Wing-pack stowed -->
    <line x1="-30" y1="-128" x2="-34" y2="-100" stroke="#5af0a0" stroke-width="0.7" opacity="0.85" filter="url(#i7p3p5bloom)"/>
    <line x1="30" y1="-128" x2="34" y2="-100" stroke="#5af0a0" stroke-width="0.7" opacity="0.85" filter="url(#i7p3p5bloom)"/>

    <!-- LEFT arm — bent, hand pressed flat against pocket interior wall (off-frame left) -->
    <path d="M-30,-130 L-60,-100 L-80,-80 L-80,-60 L-50,-90 L-30,-110 Z" fill="url(#i7p3p5suit)"/>
    <ellipse cx="-80" cy="-70" rx="9" ry="6" fill="url(#i7p3p5skin)"/>
    <!-- Fingers spread/pressed flat -->
    <ellipse cx="-86" cy="-78" rx="2.4" ry="6" fill="url(#i7p3p5skin)"/>
    <ellipse cx="-90" cy="-72" rx="2.4" ry="6" fill="url(#i7p3p5skin)"/>
    <ellipse cx="-90" cy="-66" rx="2.4" ry="6" fill="url(#i7p3p5skin)"/>
    <ellipse cx="-86" cy="-60" rx="2.4" ry="6" fill="url(#i7p3p5skin)"/>

    <!-- RIGHT arm at side -->
    <path d="M30,-130 L40,-110 L36,-80 L24,-100 Z" fill="url(#i7p3p5suit)"/>
    <ellipse cx="40" cy="-86" rx="6" ry="3" fill="url(#i7p3p5skin)"/>

    <!-- Head — looking UP -->
    <ellipse cx="0" cy="-180" rx="20" ry="22" fill="url(#i7p3p5skin)"/>

    <!-- Wild golden curls (abundant, top + sides) -->
    <path d="M-18,-198 Q-12,-218 0,-220 Q12,-218 18,-198 L18,-188 Q9,-198 0,-198 Q-9,-198 -18,-188 Z" fill="#f0d878"/>
    <circle cx="-15" cy="-208" r="4" fill="#f0d878"/>
    <circle cx="-9" cy="-216" r="3" fill="#f0d878"/>
    <circle cx="0" cy="-220" r="3" fill="#f0d878"/>
    <circle cx="9" cy="-216" r="3" fill="#f0d878"/>
    <circle cx="15" cy="-208" r="4" fill="#f0d878"/>
    <!-- Loose strands -->
    <path d="M-18,-196 L-22,-184" stroke="#f0d878" stroke-width="1.4" fill="none"/>
    <path d="M18,-196 L22,-184" stroke="#f0d878" stroke-width="1.4" fill="none"/>
    <!-- Top of curls catching diffused light -->
    <ellipse cx="0" cy="-216" rx="14" ry="3" fill="#a8a098" opacity="0.55" filter="url(#i7p3p5bloom)"/>

    <!-- Cheekbones uplit -->
    <path d="M-18,-180 Q-15,-168 -9,-160" fill="none" stroke="#5a3018" stroke-width="0.7" opacity="0.85"/>
    <path d="M18,-180 Q15,-168 9,-160" fill="none" stroke="#5a3018" stroke-width="0.7" opacity="0.85"/>

    <!-- Eyes — looking UP, soft warm -->
    <ellipse cx="-9" cy="-184" rx="3.5" ry="2" fill="#fff"/>
    <ellipse cx="9" cy="-184" rx="3.5" ry="2" fill="#fff"/>
    <ellipse cx="-9" cy="-186" rx="2" ry="1.4" fill="#1a4a28"/>
    <ellipse cx="9" cy="-186" rx="2" ry="1.4" fill="#1a4a28"/>
    <circle cx="-9" cy="-186" r="0.7" fill="#fff"/>
    <circle cx="9" cy="-186" r="0.7" fill="#fff"/>

    <!-- Brow soft (warmth) -->
    <path d="M-15,-198 Q-9,-200 -3,-198" stroke="#5a3018" stroke-width="1.4" fill="none"/>
    <path d="M15,-198 Q9,-200 3,-198" stroke="#5a3018" stroke-width="1.4" fill="none"/>

    <!-- Nose -->
    <path d="M-2,-184 L-3,-172 L0,-168 L3,-172 L2,-184 Z" fill="#a87838" opacity="0.85"/>

    <!-- WARM SMILE — corners up, genuine -->
    <path d="M-9,-158 Q0,-152 9,-158" stroke="#3a1808" stroke-width="1.4" fill="none"/>
    <path d="M-7,-156 Q0,-150 7,-156" stroke="#5a3018" stroke-width="0.7" fill="none"/>

    <!-- Comms ear -->
    <circle cx="20" cy="-184" r="1.4" fill="#5af0a0" filter="url(#i7p3p5bloom)" opacity="0.95"/>
  </g>

  <!-- JINK whisper -->
  <g>
    <rect x="14" y="14" width="240" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#2ed078" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(whispered)</tspan></text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Not bad. You're getting the hang of it.</text>

  <!-- THEODORE -->
  <g>
    <rect x="14" y="350" width="280" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE  <tspan font-style="italic" font-size="8" font-weight="500">(low, barely moving lips)</tspan></text>
  <text x="22" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">My heart's going like a hammer.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q100,182 200,178 Q280,176 366,180"/>
    <path d="M0,330 Q100,332 200,328 Q280,326 366,330"/>
  </g>
</svg>
