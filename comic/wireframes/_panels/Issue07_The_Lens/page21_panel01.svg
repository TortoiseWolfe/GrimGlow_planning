<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 320" width="494" height="320">
  <title>Issue 7 — Page 21 — Panel 1: Jink at the wall gap, drawn-up knees, looking through, not flying — the scout who does not fly</title>
  <desc>50mm medium shot eye level. Jink alone at wall-gap exit, not leaving, facing outward. Posture closed: arms wrapped around knees, drawn up, chin on forearms. Wing-pack seams glow faint emerald. Gap shows sliver of dark sky, one star. Not pacing. Not restless. Still. New. Wrong. Anger turning to something harder. Adventure has a shape in the fog and it is not wonderful.</desc>

  <defs>
    <linearGradient id="i7p21p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="i7p21p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="i7p21p1nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="i7p21p1campGlow" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a4858" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p21p1wingFaint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5af0a0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a6838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p21p1suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a6850"/>
      <stop offset="100%" stop-color="#1a3828"/>
    </linearGradient>
    <linearGradient id="i7p21p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <filter id="i7p21p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p21p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p21p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p21p1megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="494" height="320" fill="url(#i7p21p1bg)"/>

  <!-- Distant camp glow from the right -->
  <ellipse cx="494" cy="160" rx="220" ry="160" fill="url(#i7p21p1campGlow)" filter="url(#i7p21p1megaglow)"/>

  <!-- Brick wall surrounding the gap -->
  <rect x="0" y="0" width="494" height="320" fill="url(#i7p21p1brick)"/>
  <!-- Brick mortar lines -->
  <g stroke="#1a1008" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="40" x2="494" y2="40"/>
    <line x1="0" y1="80" x2="494" y2="80"/>
    <line x1="0" y1="120" x2="494" y2="120"/>
    <line x1="0" y1="200" x2="494" y2="200"/>
    <line x1="0" y1="240" x2="494" y2="240"/>
    <line x1="0" y1="280" x2="494" y2="280"/>
    <line x1="40" y1="0" x2="40" y2="40"/>
    <line x1="80" y1="40" x2="80" y2="80"/>
    <line x1="120" y1="0" x2="120" y2="40"/>
    <line x1="40" y1="80" x2="40" y2="120"/>
    <line x1="60" y1="200" x2="60" y2="240"/>
    <line x1="100" y1="240" x2="100" y2="280"/>
    <line x1="140" y1="280" x2="140" y2="320"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="420" y1="40" x2="420" y2="80"/>
    <line x1="380" y1="80" x2="380" y2="120"/>
    <line x1="380" y1="200" x2="380" y2="240"/>
    <line x1="420" y1="240" x2="420" y2="280"/>
  </g>
  <!-- Brick texture -->
  <g fill="#5a3818" opacity="0.18">
    <rect x="20" y="20" width="20" height="11"/>
    <rect x="60" y="60" width="14" height="11"/>
    <rect x="180" y="280" width="22" height="11"/>
    <rect x="420" y="100" width="22" height="11"/>
    <rect x="280" y="20" width="14" height="11"/>
  </g>

  <!-- ===== THE WALL GAP — center, opening to night sky ===== -->
  <g>
    <!-- Gap rectangle -->
    <rect x="200" y="80" width="160" height="180" fill="url(#i7p21p1nightSky)"/>
    <!-- Gap edges (broken brick) -->
    <path d="M200,80 L200,260 L210,255 L205,180 L215,170 L208,90 Z" fill="#1a1208" opacity="0.85"/>
    <path d="M360,80 L360,260 L350,255 L355,180 L345,170 L352,90 Z" fill="#1a1208" opacity="0.85"/>
    <path d="M200,80 L360,80 L355,90 L205,90 Z" fill="#1a1208" opacity="0.85"/>
    <path d="M200,260 L360,260 L355,250 L205,250 Z" fill="#1a1208" opacity="0.85"/>

    <!-- One star in the night sky -->
    <circle cx="290" cy="130" r="0.85" fill="#fff8d8" filter="url(#i7p21p1bloom)"/>
    <circle cx="290" cy="130" r="2" fill="#fff8d8" filter="url(#i7p21p1glow)" opacity="0.55"/>

    <!-- Distant city silhouette through gap (Victorian rooftops) -->
    <g fill="#040408" opacity="0.85">
      <path d="M210,220 L240,200 L260,210 L280,195 L310,205 L340,200 L350,220 L350,240 L210,240 Z"/>
      <!-- Chimney pots -->
      <rect x="230" y="190" width="3" height="11"/>
      <rect x="265" y="200" width="3" height="11"/>
      <rect x="320" y="195" width="3" height="11"/>
    </g>
  </g>

  <!-- ===== JINK at the wall gap edge — drawn up, still ===== -->
  <g transform="translate(200 220)">
    <!-- Body — drawn up, knees up, arms wrapped -->
    <!-- Torso -->
    <path d="M-9,30 L-14,9 L-16,-14 L-11,-30 L-3,-40 L3,-40 L11,-30 L16,-14 L14,9 L9,30 Z" fill="url(#i7p21p1suit)"/>
    <!-- Knees drawn up to chest -->
    <ellipse cx="-3" cy="22" rx="9" ry="14" fill="url(#i7p21p1suit)"/>
    <ellipse cx="9" cy="22" rx="9" ry="14" fill="url(#i7p21p1suit)"/>
    <!-- Arms wrapped around knees -->
    <path d="M-14,-3 L-22,11 L-22,30 L-9,40 L0,30 L-9,11 Z" fill="url(#i7p21p1suit)"/>
    <path d="M14,-3 L22,11 L22,30 L9,40 L0,30 L9,11 Z" fill="url(#i7p21p1suit)"/>
    <!-- Hands clasped at front of knees -->
    <ellipse cx="0" cy="36" rx="6" ry="3" fill="url(#i7p21p1skin)"/>

    <!-- Soot streaks on suit (continuity) -->
    <path d="M-14,-22 L-3,-30" stroke="#1a1410" stroke-width="1.4" opacity="0.85"/>
    <path d="M3,-22 L14,-26" stroke="#1a1410" stroke-width="1.4" opacity="0.7"/>

    <!-- Salt-spray residue at suit edges -->
    <path d="M-14,3 L-9,9" stroke="#a8c8c0" stroke-width="0.55" opacity="0.55"/>

    <!-- Wing-pack between shoulder blades — faint emerald glow at seams -->
    <rect x="-9" y="-22" width="18" height="14" fill="#0a3018"/>
    <ellipse cx="0" cy="-15" rx="22" ry="9" fill="url(#i7p21p1wingFaint)" filter="url(#i7p21p1strongglow)" opacity="0.55"/>
    <line x1="-9" y1="-15" x2="9" y2="-15" stroke="#5af0a0" stroke-width="0.55" filter="url(#i7p21p1bloom)" opacity="0.85"/>
    <line x1="-9" y1="-22" x2="-9" y2="-8" stroke="#5af0a0" stroke-width="0.4" opacity="0.55" filter="url(#i7p21p1bloom)"/>
    <line x1="9" y1="-22" x2="9" y2="-8" stroke="#5af0a0" stroke-width="0.4" opacity="0.55" filter="url(#i7p21p1bloom)"/>

    <!-- Suit accent (dim) -->
    <line x1="0" y1="-30" x2="0" y2="-9" stroke="#5af0a0" stroke-width="0.4" opacity="0.4" filter="url(#i7p21p1bloom)"/>

    <!-- Chin resting on forearms -->
    <!-- Neck/jaw -->
    <ellipse cx="0" cy="-44" rx="6" ry="4" fill="url(#i7p21p1skin)"/>

    <!-- Head — chin on forearms, looking through gap -->
    <ellipse cx="0" cy="-58" rx="11" ry="14" fill="url(#i7p21p1skin)"/>

    <!-- Wild golden curls — barely lit by night sky through gap -->
    <g fill="#a8a058" opacity="0.7">
      <ellipse cx="-3" cy="-72" rx="14" ry="9"/>
      <ellipse cx="-9" cy="-66" rx="9" ry="6"/>
      <circle cx="11" cy="-70" r="6"/>
      <circle cx="-14" cy="-68" r="6"/>
      <circle cx="-7" cy="-78" r="5"/>
      <circle cx="6" cy="-80" r="5"/>
    </g>
    <!-- Faint star highlight on top of hair -->
    <ellipse cx="0" cy="-78" rx="9" ry="3" fill="#fff8d8" opacity="0.18" filter="url(#i7p21p1bloom)"/>

    <!-- Eyes — staring through gap, golden-brown but unfocused -->
    <ellipse cx="-3" cy="-58" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-3" cy="-58" r="0.85" fill="#3a1808"/>
    <ellipse cx="3" cy="-58" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="3" cy="-58" r="0.85" fill="#3a1808"/>
    <!-- Brows — flat, sealed -->
    <line x1="-7" y1="-64" x2="-1" y2="-64" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="1" y1="-64" x2="7" y2="-64" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Mouth — flat, closed (chin on forearms) -->
    <line x1="-3" y1="-46" x2="3" y2="-46" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== CAPTION ===== -->
  <g>
    <rect x="14" y="14" width="280" height="32" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">Jink sat at the wall gap and did not fly.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260"/>
  </g>
</svg>
