<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 340" width="366" height="340">
  <title>Issue 7 — Page 16 — Panel 3: Jink lands beside Wren — wings stowing, mutual nod, professionals at the end of clean work</title>
  <desc>50mm medium eye level. Jink lands stone pier waterline ledge where Wren waiting. Wren original lens secured. Exchange nod — operation clean. Jink wings fold and stow emerald glow dimming. Quiet between heist completion and what comes next. Behind river stretches dark toward far bank fog water. Jink grin softening into warmth respect Wren's work. Wren single nod engineer acknowledging scout. Brief genuine.</desc>

  <defs>
    <linearGradient id="i7p16p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p16p3water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i7p16p3stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <radialGradient id="i7p16p3beamSweep" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p16p3fog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3a4a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1a28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p16p3suitJ" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5af0a0"/>
      <stop offset="100%" stop-color="#1a6838"/>
    </linearGradient>
    <linearGradient id="i7p16p3suitW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e89858"/>
      <stop offset="100%" stop-color="#5a2810"/>
    </linearGradient>
    <linearGradient id="i7p16p3skinJ" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p16p3skinW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <radialGradient id="i7p16p3lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p16p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p16p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p16p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p16p3megaglow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="366" height="340" fill="url(#i7p16p3bg)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.4">
    <circle cx="60" cy="20" r="0.55"/>
    <circle cx="180" cy="40" r="0.4"/>
    <circle cx="300" cy="20" r="0.55"/>
  </g>

  <!-- Beam sweep amber overhead -->
  <ellipse cx="183" cy="40" rx="280" ry="140" fill="url(#i7p16p3beamSweep)" filter="url(#i7p16p3megaglow)"/>

  <!-- Far bank silhouettes through fog -->
  <ellipse cx="183" cy="160" rx="280" ry="40" fill="url(#i7p16p3fog)" filter="url(#i7p16p3strongglow)"/>
  <g fill="#1a1410" opacity="0.85">
    <rect x="0" y="140" width="60" height="30"/>
    <rect x="80" y="135" width="80" height="35"/>
    <rect x="180" y="140" width="80" height="30"/>
    <rect x="280" y="135" width="86" height="35"/>
  </g>
  <!-- Distant amber smears -->
  <g opacity="0.55" filter="url(#i7p16p3bloom)">
    <circle cx="40" cy="155" r="0.85" fill="#d89858"/>
    <circle cx="140" cy="155" r="0.85" fill="#d89858"/>
    <circle cx="240" cy="155" r="0.85" fill="#d89858"/>
    <circle cx="340" cy="155" r="0.85" fill="#d89858"/>
  </g>

  <!-- River -->
  <rect x="0" y="180" width="366" height="80" fill="url(#i7p16p3water)"/>
  <!-- Water reflections -->
  <g stroke="#1a1818" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,200 Q100,198 200,200 Q280,202 366,200"/>
    <path d="M0,230 Q100,228 200,230 Q280,232 366,230"/>
  </g>

  <!-- ===== STONE LEDGE at waterline (foreground) ===== -->
  <rect x="0" y="260" width="366" height="80" fill="url(#i7p16p3stone)"/>
  <line x1="0" y1="260" x2="366" y2="260" stroke="#1a1418" stroke-width="0.85"/>
  <!-- Stone seams -->
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.7" fill="none">
    <path d="M0,300 L366,300"/>
    <line x1="80" y1="260" x2="80" y2="340"/>
    <line x1="180" y1="260" x2="180" y2="340"/>
    <line x1="280" y1="260" x2="280" y2="340"/>
  </g>
  <!-- Stone texture / salt -->
  <g fill="#a89878" opacity="0.55">
    <ellipse cx="60" cy="285" rx="9" ry="2"/>
    <ellipse cx="240" cy="290" rx="11" ry="2"/>
  </g>

  <!-- ===== JINK — left, just landed, wings folding ===== -->
  <g transform="translate(120 290)">
    <ellipse cx="0" cy="0" rx="14" ry="3" fill="#000" opacity="0.7"/>

    <!-- Wing-pack folding (dimming, partial deployment) -->
    <g stroke="#5af0a0" stroke-width="0.85" fill="none" opacity="0.7" filter="url(#i7p16p3bloom)">
      <path d="M-7,-22 L-22,-30 L-30,-22 L-22,-14 Z"/>
      <path d="M7,-22 L22,-30 L30,-22 L22,-14 Z"/>
    </g>
    <g fill="#5af0a0" opacity="0.18" filter="url(#i7p16p3bloom)">
      <path d="M-7,-22 L-22,-30 L-30,-22 L-22,-14 Z"/>
      <path d="M7,-22 L22,-30 L30,-22 L22,-14 Z"/>
    </g>
    <ellipse cx="0" cy="-22" rx="22" ry="14" fill="#5af0a0" opacity="0.4" filter="url(#i7p16p3megaglow)"/>

    <!-- Body landing pose, slight crouch -->
    <ellipse cx="-5" cy="-2" rx="4" ry="2" fill="url(#i7p16p3suitJ)"/>
    <ellipse cx="5" cy="-2" rx="4" ry="2" fill="url(#i7p16p3suitJ)"/>

    <!-- Torso -->
    <path d="M-7,-3 L-9,-30 L-5,-44 L5,-44 L9,-30 L7,-3 Z" fill="url(#i7p16p3suitJ)"/>
    <line x1="0" y1="-44" x2="0" y2="-3" stroke="#a8ffd0" stroke-width="0.55" opacity="0.85" filter="url(#i7p16p3bloom)"/>
    <!-- Soot streak -->
    <path d="M-7,-22 L7,-18" stroke="#1a1410" stroke-width="2" opacity="0.85"/>

    <!-- Arms relaxed -->
    <path d="M-9,-30 L-14,-22 L-12,-12 L-7,-22 Z" fill="url(#i7p16p3suitJ)"/>
    <path d="M9,-30 L14,-22 L12,-12 L7,-22 Z" fill="url(#i7p16p3suitJ)"/>

    <!-- Head — turned RIGHT toward Wren -->
    <ellipse cx="3" cy="-58" rx="9" ry="11" fill="url(#i7p16p3skinJ)"/>
    <!-- Wild golden curls -->
    <path d="M-6,-70 Q-3,-86 3,-88 Q12,-86 12,-70 L12,-64 Q9,-66 3,-66 Q-3,-66 -6,-64 Z" fill="#f0d878"/>
    <circle cx="-3" cy="-80" r="3" fill="#f0d878"/>
    <circle cx="9" cy="-80" r="3" fill="#f0d878"/>

    <!-- Eyes looking right -->
    <ellipse cx="0" cy="-58" rx="1.4" ry="0.85" fill="#fff"/>
    <ellipse cx="6" cy="-58" rx="1.4" ry="0.85" fill="#fff"/>
    <ellipse cx="1" cy="-58" rx="0.85" ry="0.55" fill="#1a4a28"/>
    <ellipse cx="7" cy="-58" rx="0.85" ry="0.55" fill="#1a4a28"/>

    <!-- WARMER GRIN (softening into respect) -->
    <path d="M-3,-46 Q3,-43 9,-46" stroke="#3a1808" stroke-width="0.85" fill="none"/>
    <path d="M-1,-45 Q3,-43 7,-45" stroke="#1a0c04" stroke-width="0.4" fill="none"/>

    <!-- Comms ear -->
    <circle cx="13" cy="-58" r="0.85" fill="#5af0a0" filter="url(#i7p16p3bloom)" opacity="0.7"/>
  </g>

  <!-- ===== WREN — right, on ledge with lens secured ===== -->
  <g transform="translate(240 290)">
    <ellipse cx="0" cy="0" rx="14" ry="3" fill="#000" opacity="0.7"/>

    <ellipse cx="-5" cy="-2" rx="4" ry="2" fill="url(#i7p16p3suitW)"/>
    <ellipse cx="5" cy="-2" rx="4" ry="2" fill="url(#i7p16p3suitW)"/>

    <!-- Torso -->
    <path d="M-7,-3 L-9,-30 L-5,-44 L5,-44 L9,-30 L7,-3 Z" fill="url(#i7p16p3suitW)"/>

    <!-- LENS DISC on back (secured, faint copper-gold edge-glow) -->
    <ellipse cx="-3" cy="-22" rx="14" ry="6" fill="url(#i7p16p3lensGlow)" filter="url(#i7p16p3bloom)"/>
    <ellipse cx="-3" cy="-22" rx="14" ry="6" fill="none" stroke="#fff8c8" stroke-width="0.55" opacity="0.7" filter="url(#i7p16p3bloom)"/>
    <line x1="-9" y1="-44" x2="-14" y2="-22" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="9" y1="-44" x2="14" y2="-22" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Arms relaxed -->
    <path d="M-9,-30 L-14,-22 L-12,-12 L-7,-22 Z" fill="url(#i7p16p3suitW)"/>
    <path d="M9,-30 L14,-22 L12,-12 L7,-22 Z" fill="url(#i7p16p3suitW)"/>

    <!-- Head — turned LEFT toward Jink, slight nod -->
    <ellipse cx="-3" cy="-58" rx="9" ry="11" fill="url(#i7p16p3skinW)"/>
    <!-- Bun -->
    <ellipse cx="-3" cy="-70" rx="6" ry="3" fill="#1a0a04"/>
    <path d="M-9,-68 Q-7,-74 -3,-75 Q3,-74 3,-68 L3,-64 Q0,-68 -3,-68 Q-7,-68 -9,-64 Z" fill="#1a0a04"/>

    <!-- Eyes looking left at Jink -->
    <ellipse cx="-6" cy="-58" rx="1.4" ry="0.85" fill="#fff"/>
    <ellipse cx="0" cy="-58" rx="1.4" ry="0.85" fill="#fff"/>
    <ellipse cx="-7" cy="-58" rx="0.85" ry="0.55" fill="#3a1808"/>
    <ellipse cx="-1" cy="-58" rx="0.85" ry="0.55" fill="#3a1808"/>

    <!-- Slight smile (the engineer acknowledging) -->
    <path d="M-7,-46 Q-3,-43 1,-46" stroke="#3a1808" stroke-width="0.55" fill="none"/>

    <!-- Comms ear -->
    <circle cx="-13" cy="-58" r="0.85" fill="#d89858" filter="url(#i7p16p3bloom)" opacity="0.7"/>
  </g>

  <!-- JINK -->
  <g>
    <rect x="14" y="14" width="180" height="34" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95"/>
    <polygon points="80,48 92,48 84,58" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="80.5" y1="48" x2="91.5" y2="48" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#2ed078" font-weight="700">JINK</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Clean work in there.</text>

  <!-- WREN -->
  <g>
    <rect x="14" y="58" width="200" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,92 112,92 104,102" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="100.5" y1="92" x2="111.5" y2="92" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Clean overwatch out here.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q100,162 200,158 Q280,156 366,160"/>
    <path d="M0,260 Q100,262 200,258 Q280,256 366,260"/>
  </g>
</svg>
