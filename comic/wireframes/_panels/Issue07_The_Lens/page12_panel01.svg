<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 340" width="742" height="340">
  <title>Issue 7 — Page 12 — Panel 1: Wren at mechanism level — looking up through brass cathedral toward the Fresnel lens above</title>
  <desc>24mm wide low fairy scale establishing. Lighthouse mechanism level Wren's perspective looking up through layers rotating brass gears iron structural members chain drives counterweights toward Fresnel lens assembly above. Towering crystalline structure concentric glass rings brass framework. Beam rotation visible slow movement light shadow every surface. Wren small in frame four-inch figure crouched iron cross-member midway up mechanism. Holographic toolkit casting faint copper-gold geometric light around hands. Studying lens above plotting route through moving parts.</desc>

  <defs>
    <linearGradient id="i7p12p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="i7p12p1lampGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p12p1brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c898"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="i7p12p1iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p12p1suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e89858"/>
      <stop offset="100%" stop-color="#5a2810"/>
    </linearGradient>
    <radialGradient id="i7p12p1toolkit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <filter id="i7p12p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p12p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p12p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p12p1megaglow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="742" height="340" fill="url(#i7p12p1bg)"/>

  <!-- Lamp glow from above -->
  <ellipse cx="371" cy="0" rx="500" ry="180" fill="url(#i7p12p1lampGlow)" filter="url(#i7p12p1megaglow)"/>

  <!-- ===== FRESNEL LENS structure visible at top ===== -->
  <g transform="translate(371 60)" filter="url(#i7p12p1bloom)">
    <ellipse cx="0" cy="0" rx="180" ry="40" fill="none" stroke="#fff8c8" stroke-width="2" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="180" ry="40" fill="#ffd898" opacity="0.18"/>
    <ellipse cx="0" cy="-30" rx="160" ry="36" fill="none" stroke="#fff8c8" stroke-width="1.4" opacity="0.95"/>
    <ellipse cx="0" cy="-30" rx="160" ry="36" fill="#ffd898" opacity="0.18"/>
    <ellipse cx="0" cy="-55" rx="130" ry="30" fill="none" stroke="#fff8c8" stroke-width="1" opacity="0.85"/>
    <ellipse cx="0" cy="-55" rx="130" ry="30" fill="#ffd898" opacity="0.18"/>
    <!-- Lamp flame core at top -->
    <ellipse cx="0" cy="-55" rx="22" ry="40" fill="#fff" filter="url(#i7p12p1strongglow)"/>
    <ellipse cx="0" cy="-50" rx="9" ry="20" fill="#fff8c8" filter="url(#i7p12p1bloom)"/>
  </g>

  <!-- ===== BRASS GEARS (rotating, layered) ===== -->
  <g transform="translate(371 200)">
    <!-- Large gear -->
    <circle cx="-180" cy="0" r="60" fill="url(#i7p12p1brass)" stroke="#5a3018" stroke-width="0.85"/>
    <circle cx="-180" cy="0" r="50" fill="none" stroke="#5a3018" stroke-width="0.55"/>
    <circle cx="-180" cy="0" r="14" fill="#5a3018"/>
    <!-- Gear teeth -->
    <g stroke="#5a3018" stroke-width="0.55" fill="url(#i7p12p1brass)">
      <rect x="-186" y="-66" width="12" height="6"/>
      <rect x="-186" y="60" width="12" height="6"/>
      <rect x="-246" y="-3" width="6" height="6"/>
      <rect x="-126" y="-3" width="6" height="6"/>
      <rect x="-218" y="-46" width="9" height="6" transform="rotate(-45 -218 -43)"/>
      <rect x="-218" y="40" width="9" height="6" transform="rotate(45 -218 43)"/>
      <rect x="-148" y="-46" width="9" height="6" transform="rotate(45 -148 -43)"/>
      <rect x="-148" y="40" width="9" height="6" transform="rotate(-45 -148 43)"/>
    </g>

    <!-- Right gear -->
    <circle cx="180" cy="0" r="55" fill="url(#i7p12p1brass)" stroke="#5a3018" stroke-width="0.85"/>
    <circle cx="180" cy="0" r="44" fill="none" stroke="#5a3018" stroke-width="0.55"/>
    <circle cx="180" cy="0" r="11" fill="#5a3018"/>
    <g stroke="#5a3018" stroke-width="0.55" fill="url(#i7p12p1brass)">
      <rect x="174" y="-61" width="12" height="6"/>
      <rect x="174" y="55" width="12" height="6"/>
      <rect x="235" y="-3" width="6" height="6"/>
      <rect x="119" y="-3" width="6" height="6"/>
    </g>

    <!-- Iron drive chain between gears (wraps around) -->
    <line x1="-120" y1="-3" x2="120" y2="-3" stroke="#1a1818" stroke-width="3"/>
    <line x1="-120" y1="3" x2="120" y2="3" stroke="#1a1818" stroke-width="3"/>
    <!-- Chain links -->
    <g fill="#1a1818">
      <ellipse cx="-100" cy="0" rx="3" ry="4"/>
      <ellipse cx="-80" cy="0" rx="3" ry="4"/>
      <ellipse cx="-60" cy="0" rx="3" ry="4"/>
      <ellipse cx="-40" cy="0" rx="3" ry="4"/>
      <ellipse cx="-20" cy="0" rx="3" ry="4"/>
      <ellipse cx="0" cy="0" rx="3" ry="4"/>
      <ellipse cx="20" cy="0" rx="3" ry="4"/>
      <ellipse cx="40" cy="0" rx="3" ry="4"/>
      <ellipse cx="60" cy="0" rx="3" ry="4"/>
      <ellipse cx="80" cy="0" rx="3" ry="4"/>
      <ellipse cx="100" cy="0" rx="3" ry="4"/>
    </g>
  </g>

  <!-- ===== IRON STRUCTURAL MEMBERS (vertical) ===== -->
  <line x1="60" y1="0" x2="60" y2="340" stroke="url(#i7p12p1iron)" stroke-width="14"/>
  <line x1="682" y1="0" x2="682" y2="340" stroke="url(#i7p12p1iron)" stroke-width="14"/>
  <!-- Cross members at intervals -->
  <rect x="0" y="120" width="742" height="9" fill="url(#i7p12p1iron)"/>
  <rect x="0" y="240" width="742" height="9" fill="url(#i7p12p1iron)"/>
  <!-- Iron structural rivets -->
  <g fill="#5a5860">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="682" cy="60" r="2"/>
    <circle cx="60" cy="180" r="2"/>
    <circle cx="682" cy="180" r="2"/>
  </g>

  <!-- COUNTERWEIGHTS (heavy iron blocks hanging on chain at sides) -->
  <g fill="url(#i7p12p1iron)" stroke="#0a0408" stroke-width="0.85">
    <rect x="80" y="160" width="22" height="40"/>
    <rect x="640" y="170" width="22" height="40"/>
  </g>
  <line x1="91" y1="160" x2="91" y2="120" stroke="#1a1818" stroke-width="1.4"/>
  <line x1="651" y1="170" x2="651" y2="120" stroke="#1a1818" stroke-width="1.4"/>

  <!-- BEAM ROTATION shadow bands (diagonal shadows) -->
  <g opacity="0.4">
    <path d="M0,200 L300,150 L300,200 L0,250 Z" fill="#000"/>
    <path d="M442,150 L742,200 L742,250 L442,200 Z" fill="#000"/>
  </g>

  <!-- ===== WREN — small figure crouched on cross-member ===== -->
  <g transform="translate(371 240)">
    <!-- Toolkit halo -->
    <ellipse cx="0" cy="-12" rx="22" ry="14" fill="url(#i7p12p1toolkit)" filter="url(#i7p12p1strongglow)"/>

    <!-- Geometric tools orbiting hands -->
    <g stroke="#ffd898" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#i7p12p1bloom)">
      <polygon points="-12,-12 -8,-16 -4,-12 -8,-8"/>
      <polygon points="12,-12 8,-16 4,-12 8,-8"/>
      <circle cx="-10" cy="-10" r="2"/>
      <circle cx="10" cy="-10" r="2"/>
    </g>

    <!-- Body crouched -->
    <ellipse cx="0" cy="0" rx="9" ry="3" fill="#000" opacity="0.55"/>
    <ellipse cx="-5" cy="-3" rx="4" ry="2" fill="url(#i7p12p1suit)"/>
    <ellipse cx="5" cy="-3" rx="4" ry="2" fill="url(#i7p12p1suit)"/>

    <!-- Knees with NEW MACHINE OIL stains (P12 onward) -->
    <ellipse cx="-5" cy="-5" rx="2" ry="0.85" fill="#0a0604" opacity="0.95"/>
    <ellipse cx="5" cy="-5" rx="2" ry="0.85" fill="#0a0604" opacity="0.95"/>

    <!-- Torso -->
    <path d="M-7,-7 L-9,-22 L-5,-30 L5,-30 L9,-22 L7,-7 Z" fill="url(#i7p12p1suit)"/>
    <!-- Heavy oil on forearms permanent -->
    <ellipse cx="-7" cy="-16" rx="3" ry="1.4" fill="#0a0604" opacity="0.85"/>

    <!-- Arms — one hand on cross-member (right), one hand near tools (left) -->
    <path d="M-9,-22 L-14,-12 L-11,-3 L-7,-12 Z" fill="url(#i7p12p1suit)"/>
    <path d="M9,-22 L14,-22 L13,-12 L7,-14 Z" fill="url(#i7p12p1suit)"/>
    <!-- Hands with NEW MACHINE OIL on palms -->
    <ellipse cx="-12" cy="-3" rx="2" ry="1" fill="#a87838"/>
    <ellipse cx="-12" cy="-3" rx="1.4" ry="0.55" fill="#0a0604" opacity="0.85"/>
    <ellipse cx="14" cy="-22" rx="2" ry="1" fill="#a87838"/>
    <ellipse cx="14" cy="-22" rx="1.4" ry="0.55" fill="#0a0604" opacity="0.7"/>

    <!-- Head looking UP -->
    <ellipse cx="0" cy="-36" rx="3" ry="3.4" fill="#a87838"/>
    <ellipse cx="0" cy="-42" rx="2" ry="1" fill="#1a0a04"/>
    <path d="M-2,-40 Q-2,-44 0,-45 Q2,-44 2,-40 L2,-38 Q1,-39 0,-39 Q-1,-39 -2,-38 Z" fill="#1a0a04"/>
    <ellipse cx="-1" cy="-36" rx="0.55" ry="0.4" fill="#fff"/>
    <ellipse cx="1" cy="-36" rx="0.55" ry="0.4" fill="#fff"/>
    <circle cx="-0.7" cy="-37" r="0.2" fill="#3a1808"/>
    <circle cx="1.4" cy="-37" r="0.2" fill="#3a1808"/>
  </g>

  <!-- WREN comms small lettering -->
  <g>
    <rect x="14" y="14" width="320" height="50" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="160,64 172,64 164,76" fill="white" stroke="#c87a35" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">At mechanism level. Target lens twelve metres up.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">Keeper one level above me.</text>

  <!-- JINK -->
  <g>
    <rect x="408" y="14" width="320" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="416" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK  <tspan font-style="italic" font-size="8" font-weight="500">(comms)</tspan></text>
  <text x="416" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#1a1410">Copy. Keeper hasn't moved in six minutes.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q200,182 400,178 Q580,176 742,180"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
