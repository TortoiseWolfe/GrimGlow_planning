<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 7 — Page 22 — Panel 1: Dawn on the waterfront — keeper tells his story to skeptical harbor men — mundane morning after the impossible night</title>
  <desc>28mm wide establishing shot eye level. Dawn waterfront. Squat lighthouse pier background, lamp extinguished, grey morning light on iron and brick. Harbor wakes — barge men uncoiling ropes, fishmonger, dock workers with tea mugs near brazier. Keeper in peacoat, sideburns, gestures with both hands telling story to three harbor men leaning against crates. Skeptical postures — arms crossed, half-smiles, humoring a colleague. The world is ordinary again.</desc>

  <defs>
    <linearGradient id="i7p22p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a898"/>
      <stop offset="100%" stop-color="#787068"/>
    </linearGradient>
    <linearGradient id="i7p22p1water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a605a"/>
      <stop offset="100%" stop-color="#3a4040"/>
    </linearGradient>
    <linearGradient id="i7p22p1stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i7p22p1lighthouse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a098"/>
      <stop offset="100%" stop-color="#5a5048"/>
    </linearGradient>
    <radialGradient id="i7p22p1brazier" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p22p1peacoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i7p22p1roughCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i7p22p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i7p22p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p22p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p22p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i7p22p1megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <!-- Grey dawn sky -->
  <rect width="742" height="180" fill="url(#i7p22p1sky)"/>

  <!-- Lighthouse in background — squat tower, lamp extinguished -->
  <g transform="translate(580 60)">
    <!-- Tower body -->
    <rect x="-22" y="0" width="44" height="120" fill="url(#i7p22p1lighthouse)"/>
    <line x1="-22" y1="0" x2="-22" y2="120" stroke="#3a3030" stroke-width="0.55"/>
    <line x1="22" y1="0" x2="22" y2="120" stroke="#3a3030" stroke-width="0.55"/>
    <!-- Stone bands -->
    <line x1="-22" y1="40" x2="22" y2="40" stroke="#3a3030" stroke-width="0.55"/>
    <line x1="-22" y1="80" x2="22" y2="80" stroke="#3a3030" stroke-width="0.55"/>
    <!-- Iron walkway/gallery -->
    <rect x="-26" y="-9" width="52" height="9" fill="#3a3030"/>
    <line x1="-26" y1="-9" x2="26" y2="-9" stroke="#1a1818" stroke-width="0.55"/>
    <!-- Lamp room -->
    <rect x="-14" y="-30" width="28" height="22" fill="#5a5048"/>
    <rect x="-9" y="-26" width="18" height="14" fill="#1a1818"/>
    <!-- LAMP EXTINGUISHED — dark glass -->
    <rect x="-7" y="-24" width="14" height="11" fill="#0a0808"/>
    <!-- Roof cap -->
    <polygon points="-16,-32 16,-32 12,-44 -12,-44" fill="#3a3030"/>
    <rect x="-2" y="-50" width="4" height="9" fill="#3a3030"/>
    <circle cx="0" cy="-52" r="2" fill="#3a3030"/>
  </g>

  <!-- Stone pier base for lighthouse -->
  <rect x="540" y="180" width="100" height="40" fill="url(#i7p22p1stone)"/>
  <line x1="540" y1="180" x2="640" y2="180" stroke="#3a2818" stroke-width="0.55"/>

  <!-- Water -->
  <rect x="0" y="180" width="540" height="60" fill="url(#i7p22p1water)"/>
  <rect x="640" y="180" width="102" height="60" fill="url(#i7p22p1water)"/>
  <!-- Water ripples -->
  <g stroke="#3a4040" stroke-width="0.4" fill="none" opacity="0.55">
    <path d="M0,200 Q80,202 160,200 Q240,198 320,200 Q400,202 480,200 Q560,198 742,200"/>
    <path d="M0,220 Q80,222 160,220 Q240,218 320,220 Q400,222 480,220 Q560,218 742,220"/>
  </g>

  <!-- Distant fog -->
  <ellipse cx="370" cy="200" rx="500" ry="14" fill="#a8a898" opacity="0.55" filter="url(#i7p22p1strongglow)"/>

  <!-- Far bank silhouette (just industrial shapes, ordinary) -->
  <g fill="#3a3838" opacity="0.7">
    <rect x="0" y="160" width="80" height="20"/>
    <rect x="100" y="155" width="60" height="25"/>
    <rect x="200" y="160" width="80" height="20"/>
    <rect x="320" y="158" width="80" height="22"/>
    <rect x="420" y="160" width="100" height="20"/>
  </g>

  <!-- Waterfront stone pier (foreground) -->
  <rect x="0" y="240" width="742" height="80" fill="url(#i7p22p1stone)"/>
  <!-- Stone block lines -->
  <g stroke="#1a1008" stroke-width="0.4" opacity="0.7">
    <line x1="0" y1="240" x2="742" y2="240"/>
    <line x1="0" y1="280" x2="742" y2="280"/>
    <line x1="100" y1="240" x2="100" y2="280"/>
    <line x1="220" y1="240" x2="220" y2="280"/>
    <line x1="340" y1="240" x2="340" y2="280"/>
    <line x1="460" y1="240" x2="460" y2="280"/>
    <line x1="580" y1="240" x2="580" y2="280"/>
  </g>

  <!-- ===== BRAZIER — only warm note in the scene ===== -->
  <g transform="translate(80 270)">
    <!-- Brazier base -->
    <ellipse cx="0" cy="9" rx="14" ry="3" fill="#1a1810"/>
    <rect x="-11" y="-3" width="22" height="11" fill="#3a2818"/>
    <!-- Coal embers -->
    <ellipse cx="0" cy="-5" rx="9" ry="3" fill="#a83820"/>
    <ellipse cx="0" cy="-5" rx="6" ry="2" fill="#ffd898" filter="url(#i7p22p1bloom)"/>
    <!-- Warm glow halo -->
    <ellipse cx="0" cy="-9" rx="40" ry="22" fill="url(#i7p22p1brazier)" filter="url(#i7p22p1megaglow)"/>
  </g>

  <!-- ===== KEEPER (left of center, animated, gesturing) ===== -->
  <g transform="translate(290 250)">
    <!-- Body — peacoat -->
    <path d="M-22,40 L-30,-22 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-22 L22,40 Z" fill="url(#i7p22p1peacoat)"/>
    <!-- Buttons -->
    <circle cx="-9" cy="-30" r="1.4" fill="#5a4838" filter="url(#i7p22p1bloom)" opacity="0.85"/>
    <circle cx="-9" cy="-14" r="1.4" fill="#5a4838" filter="url(#i7p22p1bloom)" opacity="0.85"/>
    <circle cx="-9" cy="3" r="1.4" fill="#5a4838" filter="url(#i7p22p1bloom)" opacity="0.85"/>
    <line x1="-9" y1="-50" x2="-9" y2="40" stroke="#0a0606" stroke-width="0.55"/>
    <!-- White collar -->
    <path d="M-7,-58 L-3,-66 L7,-66 L11,-58 L7,-50 L-3,-50 Z" fill="#e8e0c8"/>

    <!-- BOTH ARMS GESTURING — animated -->
    <!-- Left arm raised up -->
    <path d="M-30,-22 L-50,-32 L-44,-12 L-30,0 Z" fill="url(#i7p22p1peacoat)"/>
    <ellipse cx="-50" cy="-32" rx="4" ry="3" fill="url(#i7p22p1skin)"/>
    <!-- Right arm raised, palm out -->
    <path d="M30,-22 L50,-22 L46,-3 L30,0 Z" fill="url(#i7p22p1peacoat)"/>
    <ellipse cx="52" cy="-22" rx="4" ry="3" fill="url(#i7p22p1skin)"/>
    <!-- Fingers spread -->
    <line x1="50" y1="-22" x2="56" y2="-30" stroke="#a87838" stroke-width="0.7"/>
    <line x1="52" y1="-22" x2="58" y2="-22" stroke="#a87838" stroke-width="0.7"/>
    <line x1="52" y1="-22" x2="55" y2="-14" stroke="#a87838" stroke-width="0.7"/>

    <!-- Head -->
    <ellipse cx="0" cy="-78" rx="11" ry="14" fill="url(#i7p22p1skin)"/>

    <!-- Cap -->
    <path d="M-11,-90 Q0,-94 11,-90 L14,-86 L-14,-86 Z" fill="#1a1818"/>
    <line x1="-9" y1="-90" x2="9" y2="-90" stroke="#3a3030" stroke-width="0.4"/>

    <!-- Thick sideburns -->
    <ellipse cx="-11" cy="-72" rx="3" ry="11" fill="#3a2818"/>
    <ellipse cx="11" cy="-72" rx="3" ry="11" fill="#3a2818"/>

    <!-- Eyes — animated, earnest -->
    <ellipse cx="-3" cy="-78" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-78" r="0.55" fill="#3a1808"/>
    <ellipse cx="3" cy="-78" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-78" r="0.55" fill="#3a1808"/>
    <!-- Brows raised -->
    <line x1="-7" y1="-83" x2="-1" y2="-84" stroke="#3a2818" stroke-width="0.85"/>
    <line x1="1" y1="-84" x2="7" y2="-83" stroke="#3a2818" stroke-width="0.85"/>

    <!-- Moustache -->
    <path d="M-5,-72 Q0,-70 5,-72 L4,-68 Q0,-66 -4,-68 Z" fill="#3a2818"/>

    <!-- Mouth — open, speaking -->
    <ellipse cx="0" cy="-66" rx="3" ry="2" fill="#3a1808"/>
  </g>

  <!-- ===== HARBOR MAN 1 (left, leaning against crate, arms crossed) ===== -->
  <g transform="translate(180 260)">
    <!-- Crate behind -->
    <rect x="14" y="-14" width="22" height="40" fill="#5a3818"/>
    <line x1="14" y1="0" x2="36" y2="0" stroke="#1a1008" stroke-width="0.4"/>
    <!-- Body — leaning -->
    <path d="M-14,30 L-22,-22 L-14,-44 L-3,-58 L9,-58 L18,-44 L20,-22 L18,30 Z" fill="url(#i7p22p1roughCoat)"/>
    <!-- Arms crossed -->
    <path d="M-22,-22 L-26,-3 L-9,3 L-3,-11 Z" fill="url(#i7p22p1roughCoat)"/>
    <path d="M20,-22 L26,-3 L9,3 L3,-11 Z" fill="url(#i7p22p1roughCoat)"/>
    <line x1="-14" y1="-3" x2="14" y2="-3" stroke="#1a1008" stroke-width="0.55"/>
    <!-- Tea mug in hand -->
    <ellipse cx="-9" cy="3" rx="3" ry="2" fill="#a87838"/>
    <ellipse cx="-9" cy="0" rx="2" ry="1" fill="#7a4828"/>
    <!-- Steam -->
    <path d="M-11,-3 Q-9,-7 -9,-11" stroke="#e8e0d0" stroke-width="0.55" fill="none" opacity="0.7"/>
    <!-- Head -->
    <ellipse cx="0" cy="-72" rx="9" ry="11" fill="url(#i7p22p1skin)"/>
    <!-- Flat cap -->
    <path d="M-11,-80 Q0,-86 11,-80 L11,-76 L-11,-76 Z" fill="#3a2818"/>
    <!-- Half-smile -->
    <path d="M-3,-60 Q0,-58 3,-60" stroke="#3a1808" stroke-width="0.85" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="-3" cy="-72" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="-3" cy="-72" r="0.4" fill="#3a1808"/>
    <ellipse cx="3" cy="-72" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="3" cy="-72" r="0.4" fill="#3a1808"/>
  </g>

  <!-- ===== HARBOR MAN 2 (further left, shaking head) ===== -->
  <g transform="translate(120 270)">
    <path d="M-11,30 L-14,-14 L-9,-32 L-3,-44 L9,-44 L14,-32 L18,-14 L14,30 Z" fill="url(#i7p22p1roughCoat)"/>
    <path d="M-14,-14 L-18,9 L-9,11 L-7,-3 Z" fill="url(#i7p22p1roughCoat)"/>
    <ellipse cx="0" cy="-58" rx="9" ry="11" fill="url(#i7p22p1skin)"/>
    <path d="M-11,-66 Q0,-72 11,-66 L11,-62 L-11,-62 Z" fill="#3a2818"/>
    <!-- Tilted head (shaking) -->
    <path d="M-3,-46 Q0,-44 3,-46" stroke="#3a1808" stroke-width="0.55" fill="none"/>
    <ellipse cx="-3" cy="-58" rx="1" ry="0.7" fill="#fff8e8"/>
    <ellipse cx="3" cy="-58" rx="1" ry="0.7" fill="#fff8e8"/>
    <!-- Beard hint -->
    <path d="M-7,-50 Q0,-44 7,-50" stroke="#3a2818" stroke-width="0.85" fill="none"/>
  </g>

  <!-- ===== HARBOR MAN 3 (right of keeper, smirking into tea) ===== -->
  <g transform="translate(380 270)">
    <path d="M-11,30 L-14,-14 L-9,-32 L-3,-44 L9,-44 L14,-32 L18,-14 L14,30 Z" fill="url(#i7p22p1roughCoat)"/>
    <!-- Right arm holding tea up -->
    <path d="M14,-22 L22,-3 L18,11 L11,-3 Z" fill="url(#i7p22p1roughCoat)"/>
    <ellipse cx="22" cy="-3" rx="3" ry="3" fill="#a87838"/>
    <!-- Steam -->
    <path d="M22,-9 Q24,-14 22,-22" stroke="#e8e0d0" stroke-width="0.55" fill="none" opacity="0.7"/>
    <ellipse cx="0" cy="-58" rx="9" ry="11" fill="url(#i7p22p1skin)"/>
    <path d="M-11,-66 Q0,-72 11,-66 L11,-62 L-11,-62 Z" fill="#1a1818"/>
    <!-- Smirk -->
    <path d="M-3,-50 Q0,-46 5,-49" stroke="#3a1808" stroke-width="0.85" fill="none"/>
    <ellipse cx="-3" cy="-58" rx="1" ry="0.7" fill="#fff8e8"/>
    <ellipse cx="3" cy="-58" rx="1" ry="0.7" fill="#fff8e8"/>
  </g>

  <!-- ===== FISHMONGER + cart (far left) ===== -->
  <g transform="translate(40 270)" opacity="0.85">
    <!-- Cart -->
    <rect x="-22" y="-3" width="44" height="20" fill="#5a3818"/>
    <ellipse cx="-14" cy="22" rx="4" ry="4" fill="#3a2818"/>
    <ellipse cx="14" cy="22" rx="4" ry="4" fill="#3a2818"/>
    <!-- Fish on cart -->
    <ellipse cx="-7" cy="-3" rx="6" ry="2" fill="#a8a898"/>
    <ellipse cx="7" cy="-3" rx="6" ry="2" fill="#a8a898"/>
    <!-- Body -->
    <path d="M22,18 L18,-22 L26,-32 L40,-32 L48,-22 L44,18 Z" fill="url(#i7p22p1roughCoat)"/>
    <ellipse cx="33" cy="-44" rx="6" ry="9" fill="url(#i7p22p1skin)"/>
    <path d="M22,-50 Q33,-56 44,-50 L44,-46 L22,-46 Z" fill="#1a1818"/>
  </g>

  <!-- Barge man with rope (far right) -->
  <g transform="translate(700 260)" opacity="0.85">
    <path d="M-9,40 L-14,-14 L-7,-32 L-3,-44 L9,-44 L14,-32 L18,-14 L14,40 Z" fill="url(#i7p22p1roughCoat)"/>
    <ellipse cx="0" cy="-58" rx="7" ry="9" fill="url(#i7p22p1skin)"/>
    <path d="M-9,-66 Q0,-70 9,-66 L9,-62 L-9,-62 Z" fill="#3a2818"/>
    <!-- Rope -->
    <path d="M-14,0 Q-22,11 -22,30" stroke="#a87838" stroke-width="2" fill="none"/>
  </g>

  <!-- ===== DIALOGUE balloons ===== -->
  <!-- KEEPER 1 -->
  <g>
    <rect x="14" y="14" width="320" height="36" rx="2" fill="white" stroke="#1a1818" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#1a1818" font-weight="700">KEEPER</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">There were lights. Dancing. On the gallery railing.</text>

  <!-- HARBOR MAN -->
  <g>
    <rect x="408" y="14" width="320" height="36" rx="2" fill="white" stroke="#5a4838" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="416" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4838" font-weight="700">HARBOR MAN</text>
  <text x="416" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Had a nip of something, did you, Arthur?</text>

  <!-- KEEPER 2 -->
  <g>
    <rect x="14" y="60" width="380" height="36" rx="2" fill="white" stroke="#1a1818" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#1a1818" font-weight="700">KEEPER</text>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I was stone sober and I know what I saw.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
