<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 320" width="248" height="320">
  <title>Issue 7 — Page 21 — Panel 2: Thresh looks at her own hands on the rifle — they are steady — she does not know when they stopped shaking</title>
  <desc>50mm medium close-up slight high angle. Thresh sits on lower beam, weapon across knees — familiar posture. Looking at her own hands on weapon stock. Quiet, confused. She surprised herself. Spoke up. Advocated for action. Fear pointed outward instead of inward. Hands steady — steadier than they have been in issues. Eyes on her own hands as if for the first time.</desc>

  <defs>
    <linearGradient id="i7p21p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="i7p21p2timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="i7p21p2amber" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i7p21p2crimson" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f04838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5a1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i7p21p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f04838"/>
      <stop offset="100%" stop-color="#7a1810"/>
    </linearGradient>
    <linearGradient id="i7p21p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i7p21p2weapon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <filter id="i7p21p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i7p21p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i7p21p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="248" height="320" fill="url(#i7p21p2bg)"/>

  <!-- Top floorboard with amber band -->
  <rect x="0" y="0" width="248" height="14" fill="url(#i7p21p2timber)"/>
  <ellipse cx="124" cy="16" rx="80" ry="2" fill="#ffd898" filter="url(#i7p21p2bloom)" opacity="0.85"/>

  <!-- Warm amber pool from above (catching copper-red hair) -->
  <ellipse cx="124" cy="60" rx="140" ry="80" fill="url(#i7p21p2amber)" filter="url(#i7p21p2megaglow)"/>

  <!-- Crimson holographic accent halo on weapon area -->
  <ellipse cx="124" cy="240" rx="100" ry="40" fill="url(#i7p21p2crimson)" filter="url(#i7p21p2megaglow)" opacity="0.55"/>

  <!-- Lower beam Thresh is sitting on -->
  <rect x="0" y="290" width="248" height="20" fill="url(#i7p21p2timber)"/>
  <line x1="0" y1="290" x2="248" y2="290" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>

  <!-- Side timber post -->
  <rect x="0" y="0" width="14" height="320" fill="url(#i7p21p2timber)"/>
  <rect x="234" y="0" width="14" height="320" fill="url(#i7p21p2timber)"/>

  <!-- ===== THRESH seated, slight high angle ===== -->
  <g transform="translate(124 200)">
    <!-- Body — broad-shouldered, seated -->
    <path d="M-22,90 L-30,40 L-32,11 L-26,-22 L-9,-44 L9,-44 L26,-22 L32,11 L30,40 L22,90 Z" fill="url(#i7p21p2suit)"/>
    <!-- Dented left pauldron -->
    <ellipse cx="-26" cy="-9" rx="11" ry="7" fill="#5a1410"/>
    <line x1="-30" y1="-14" x2="-22" y2="0" stroke="#1a0606" stroke-width="0.85"/>
    <ellipse cx="-26" cy="-7" rx="6" ry="3" fill="#a8c8d8" opacity="0.4" filter="url(#i7p21p2bloom)"/>
    <!-- Right pauldron -->
    <ellipse cx="26" cy="-9" rx="11" ry="7" fill="#7a1810"/>

    <!-- Shoulder scrape (continuity) -->
    <path d="M-30,-3 L-18,-14" stroke="#3a0a0a" stroke-width="2" opacity="0.85"/>

    <!-- Suit accent — crimson, dim -->
    <line x1="0" y1="-22" x2="0" y2="60" stroke="#ffa898" stroke-width="0.7" opacity="0.85" filter="url(#i7p21p2bloom)"/>

    <!-- Knees — sitting position, weapon across them -->
    <ellipse cx="-22" cy="60" rx="14" ry="11" fill="url(#i7p21p2suit)"/>
    <ellipse cx="22" cy="60" rx="14" ry="11" fill="url(#i7p21p2suit)"/>

    <!-- ===== WEAPON across knees — focal element ===== -->
    <g transform="translate(0 60)">
      <!-- Rifle stock and barrel -->
      <rect x="-50" y="-3" width="100" height="9" fill="url(#i7p21p2weapon)"/>
      <line x1="-50" y1="-3" x2="50" y2="-3" stroke="#5a5860" stroke-width="0.55" filter="url(#i7p21p2bloom)" opacity="0.85"/>
      <line x1="-50" y1="6" x2="50" y2="6" stroke="#0a0408" stroke-width="0.55"/>
      <!-- Crimson holographic accent on weapon surface (energy core) -->
      <ellipse cx="0" cy="2" rx="22" ry="2" fill="#f04838" filter="url(#i7p21p2bloom)" opacity="0.85"/>
      <ellipse cx="0" cy="2" rx="14" ry="1.4" fill="#ff8868" filter="url(#i7p21p2bloom)"/>
      <!-- Trigger guard -->
      <path d="M-9,6 L-9,11 L-3,14 L3,14 L9,11 L9,6 Z" fill="#1a1818" stroke="#0a0408" stroke-width="0.4"/>
      <!-- Barrel tip -->
      <rect x="50" y="-1.5" width="11" height="6" fill="#1a1818"/>
      <circle cx="58" cy="1" r="2" fill="#040408"/>
      <!-- Stock end -->
      <path d="M-50,-3 L-58,-3 L-58,6 L-50,6 Z" fill="#3a2818"/>
    </g>

    <!-- ===== HANDS on weapon — STEADY (focal point) ===== -->
    <!-- Left hand on stock -->
    <g transform="translate(-26 58)">
      <!-- Hand back -->
      <path d="M-7,0 L-9,9 L0,11 L9,9 L7,0 Z" fill="url(#i7p21p2skin)"/>
      <!-- Tendons (steady, no shake) -->
      <line x1="-5" y1="0" x2="-5" y2="9" stroke="#7a4818" stroke-width="0.4" opacity="0.85"/>
      <line x1="-2" y1="0" x2="-2" y2="9" stroke="#7a4818" stroke-width="0.4" opacity="0.85"/>
      <line x1="2" y1="0" x2="2" y2="9" stroke="#7a4818" stroke-width="0.4" opacity="0.85"/>
      <line x1="5" y1="0" x2="5" y2="9" stroke="#7a4818" stroke-width="0.4" opacity="0.85"/>
      <!-- Finger wrap on stock -->
      <ellipse cx="-7" cy="6" rx="2" ry="3" fill="url(#i7p21p2skin)"/>
      <ellipse cx="-2" cy="7" rx="2" ry="3" fill="url(#i7p21p2skin)"/>
      <ellipse cx="2" cy="7" rx="2" ry="3" fill="url(#i7p21p2skin)"/>
      <ellipse cx="7" cy="6" rx="2" ry="3" fill="url(#i7p21p2skin)"/>
    </g>
    <!-- Right hand on grip -->
    <g transform="translate(11 60)">
      <path d="M-7,0 L-9,9 L0,11 L9,9 L7,0 Z" fill="url(#i7p21p2skin)"/>
      <line x1="-5" y1="0" x2="-5" y2="9" stroke="#7a4818" stroke-width="0.4" opacity="0.85"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#7a4818" stroke-width="0.4" opacity="0.85"/>
      <line x1="5" y1="0" x2="5" y2="9" stroke="#7a4818" stroke-width="0.4" opacity="0.85"/>
      <ellipse cx="-7" cy="6" rx="2" ry="3" fill="url(#i7p21p2skin)"/>
      <ellipse cx="0" cy="7" rx="2" ry="3" fill="url(#i7p21p2skin)"/>
      <ellipse cx="7" cy="6" rx="2" ry="3" fill="url(#i7p21p2skin)"/>
    </g>

    <!-- Neck -->
    <path d="M-7,-44 L7,-44 L4,-50 L-4,-50 Z" fill="url(#i7p21p2skin)"/>

    <!-- Head — looking DOWN at hands -->
    <ellipse cx="0" cy="-62" rx="14" ry="16" fill="url(#i7p21p2skin)"/>

    <!-- Copper-red buzz cut — amber catching the top -->
    <path d="M-14,-74 Q0,-80 14,-74 L14,-58 Q0,-64 -14,-58 Z" fill="#a83820"/>
    <line x1="-11" y1="-72" x2="11" y2="-72" stroke="#5a1810" stroke-width="0.4"/>
    <line x1="-11" y1="-66" x2="11" y2="-66" stroke="#5a1810" stroke-width="0.4"/>
    <!-- Amber catch on top -->
    <ellipse cx="0" cy="-78" rx="14" ry="3" fill="#ffd898" filter="url(#i7p21p2bloom)" opacity="0.85"/>

    <!-- Defined cheekbones -->
    <path d="M-9,-54 Q-14,-58 -7,-62" stroke="#7a4818" stroke-width="0.55" fill="none" opacity="0.55"/>
    <path d="M9,-54 Q14,-58 7,-62" stroke="#7a4818" stroke-width="0.55" fill="none" opacity="0.55"/>

    <!-- Eyes — DOWN (looking at hands) -->
    <ellipse cx="-5" cy="-58" rx="2.5" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="-5" cy="-57" rx="1.4" ry="0.85" fill="#3a1808"/>
    <ellipse cx="5" cy="-58" rx="2.5" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="5" cy="-57" rx="1.4" ry="0.85" fill="#3a1808"/>
    <!-- Lashes (downward gaze) -->
    <line x1="-7" y1="-60" x2="-7" y2="-62" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="-3" y1="-60" x2="-3" y2="-62" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="3" y1="-60" x2="3" y2="-62" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="7" y1="-60" x2="7" y2="-62" stroke="#1a0808" stroke-width="0.55"/>

    <!-- Brows — slight pull (confusion) -->
    <line x1="-9" y1="-66" x2="-3" y2="-66" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="3" y1="-66" x2="9" y2="-66" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M-2,-54 L0,-46 L2,-46 L2,-54 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth — slightly parted, processing -->
    <ellipse cx="0" cy="-49" rx="3" ry="0.85" fill="#3a1808"/>
  </g>

  <!-- ===== CAPTION ===== -->
  <g>
    <rect x="14" y="14" width="220" height="48" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">Thresh looked at her hands on the rifle.</text>
  <text x="22" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">They were steady. She didn't know when</text>
  <text x="22" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">they had stopped shaking.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q60,142 124,138 Q190,136 248,140"/>
    <path d="M0,260 Q60,262 124,258 Q190,256 248,260"/>
  </g>
</svg>
