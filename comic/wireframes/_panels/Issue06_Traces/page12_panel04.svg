<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 270.5" width="742" height="270.5">
  <title>Issue 6 — Page 12 — Panel 4: Theodore ascends from basement — emerging into grey fog above, Titan shadow GONE</title>
  <desc>28mm wide eye level. Theodore climbing stone steps from basement darkness up to grey fog street above. Stairway frame creates vertical transition from black to grey. Far end of street where Titan stood — only fog now. Shape gone. Or moved. Or fully cloaked.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p12p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#605850"/>
      <stop offset="40%" stop-color="#3a3028"/>
      <stop offset="80%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p12p4stoneStep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p12p4stoneSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#403830"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p12p4bldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="i6p12p4fog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a706a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a3028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p12p4fogVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#605850" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2a2420" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p12p4theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p12p4theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p12p4pocketDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a3ad8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p12p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p12p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="270.5" fill="url(#i6p12p4bg)"/>

  <!-- Sky band at very top — grey fog -->
  <rect width="742" height="60" fill="#7a706a"/>
  <ellipse cx="371" cy="50" rx="500" ry="80" fill="url(#i6p12p4fog)" filter="url(#i6p12p4glow)" opacity="0.95"/>

  <!-- LEFT building above (street level) -->
  <rect x="0" y="40" width="200" height="100" fill="url(#i6p12p4bldg)"/>
  <rect x="0" y="40" width="200" height="40" fill="url(#i6p12p4fog)" opacity="0.55"/>
  <g fill="#0a0408">
    <rect x="20" y="80" width="14" height="20"/>
    <rect x="60" y="80" width="14" height="20"/>
    <rect x="100" y="80" width="14" height="20"/>
    <rect x="140" y="80" width="14" height="20"/>
    <rect x="180" y="80" width="14" height="20"/>
  </g>

  <!-- RIGHT building above -->
  <rect x="540" y="40" width="202" height="100" fill="url(#i6p12p4bldg)"/>
  <rect x="540" y="40" width="202" height="40" fill="url(#i6p12p4fog)" opacity="0.55"/>
  <g fill="#0a0408">
    <rect x="560" y="80" width="14" height="20"/>
    <rect x="600" y="80" width="14" height="20"/>
    <rect x="640" y="80" width="14" height="20"/>
    <rect x="680" y="80" width="14" height="20"/>
    <rect x="720" y="80" width="14" height="20"/>
  </g>

  <!-- Pavement at street level -->
  <rect x="0" y="140" width="742" height="14" fill="#3a3028"/>
  <line x1="0" y1="140" x2="742" y2="140" stroke="#1a1410" stroke-width="1.4" opacity="0.85"/>
  <line x1="0" y1="148" x2="742" y2="148" stroke="#5a5048" stroke-width="0.7" opacity="0.55"/>

  <!-- Street perspective receding into fog at center distance — TITAN GONE -->
  <polygon points="200,80 540,80 480,140 260,140" fill="#1a1008"/>
  <ellipse cx="370" cy="120" rx="180" ry="60" fill="url(#i6p12p4fogVoid)" filter="url(#i6p12p4glow)" opacity="0.95"/>
  <!-- Distant building silhouettes barely visible — NO TITAN SHAPE -->
  <rect x="280" y="90" width="40" height="50" fill="#403830" opacity="0.55"/>
  <rect x="320" y="85" width="44" height="55" fill="#3a3028" opacity="0.5"/>
  <rect x="364" y="90" width="40" height="50" fill="#403830" opacity="0.45"/>
  <rect x="404" y="85" width="44" height="55" fill="#3a3028" opacity="0.5"/>
  <rect x="448" y="90" width="40" height="50" fill="#403830" opacity="0.55"/>
  <!-- Heavy fog smear -->
  <ellipse cx="370" cy="115" rx="120" ry="40" fill="#605850" opacity="0.7" filter="url(#i6p12p4glow)"/>

  <!-- ===== STAIRWELL OPENING — central, framing the descent ===== -->
  <!-- Stairwell sides -->
  <rect x="280" y="140" width="20" height="130.5" fill="url(#i6p12p4stoneSide)"/>
  <rect x="442" y="140" width="20" height="130.5" fill="url(#i6p12p4stoneSide)"/>
  <!-- Iron railing right side -->
  <line x1="442" y1="140" x2="442" y2="270.5" stroke="#1a0c04" stroke-width="3"/>
  <ellipse cx="442" cy="180" rx="3" ry="1.6" fill="#5a3018" opacity="0.85"/>
  <ellipse cx="442" cy="240" rx="3" ry="1.6" fill="#5a3018" opacity="0.85"/>

  <!-- Stairwell INTERIOR — receding into darkness -->
  <polygon points="300,140 442,140 422,200 320,200" fill="#1a1008" opacity="0.85"/>
  <polygon points="320,200 422,200 410,260 332,260" fill="#0a0608" opacity="0.95"/>
  <polygon points="332,260 410,260 410,270.5 332,270.5" fill="#020108"/>

  <!-- STONE STEPS visible (perspective from above looking into stairwell) -->
  <path d="M300,140 L442,140 L438,150 L304,150 Z" fill="url(#i6p12p4stoneStep)"/>
  <path d="M304,154 L438,154 L432,168 L310,168 Z" fill="url(#i6p12p4stoneStep)"/>
  <path d="M310,172 L432,172 L424,190 L318,190 Z" fill="url(#i6p12p4stoneStep)" opacity="0.85"/>
  <path d="M318,194 L424,194 L416,216 L326,216 Z" fill="url(#i6p12p4stoneStep)" opacity="0.7"/>
  <path d="M326,220 L416,220 L406,250 L336,250 Z" fill="url(#i6p12p4stoneStep)" opacity="0.55"/>

  <!-- ===== THEODORE — climbing UP the steps, emerging into grey ===== -->
  <g transform="translate(371 160)">
    <!-- Boots — back foot still on lower step -->
    <ellipse cx="-12" cy="22" rx="9" ry="3" fill="#1a0c04"/>
    <ellipse cx="14" cy="0" rx="9" ry="3" fill="#1a0c04"/>
    <!-- Trousers — climbing pose, lead leg up -->
    <path d="M-15,-46 L-2,-46 L-15,22 L-23,22 Z" fill="url(#i6p12p4theoTrousers)"/>
    <path d="M2,-46 L15,-46 L20,0 L8,0 Z" fill="url(#i6p12p4theoTrousers)"/>
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="-15" y="-46" width="30" height="3" fill="#3a1808"/>
    <!-- Shirt + waistcoat -->
    <path d="M-13,-104 L-12,-46 L13,-46 L14,-104 Z" fill="#d4c4a8"/>
    <path d="M-15,-102 L-13,-46 L-2,-46 L-2,-102 Z" fill="url(#i6p12p4theoWaistcoat)"/>
    <path d="M14,-102 L15,-46 L2,-46 L2,-102 Z" fill="url(#i6p12p4theoWaistcoat)"/>
    <!-- Pocket — DIM glow (Luma back inside) -->
    <rect x="3" y="-94" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M3,-94 L14,-94 L14,-90 L3,-90 Z" fill="#5a3018" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="5" y="-90" width="7" height="9" fill="#3a2068" opacity="0.55"/>
    <ellipse cx="8" cy="-86" rx="11" ry="6" fill="url(#i6p12p4pocketDim)" filter="url(#i6p12p4glow)" opacity="0.7"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-86" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-68" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-50" r="0.85" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-104 L0,-102 L7,-104 L7,-100 L0,-96 L-7,-100 Z" fill="#e0d4b8"/>
    <!-- Arms — one near pocket protectively, other for balance up steps -->
    <path d="M-15,-102 L-22,-78 L-22,-46 L-15,-46 Z" fill="url(#i6p12p4theoWaistcoat)"/>
    <ellipse cx="-22" cy="-46" rx="2.4" ry="1.4" fill="#a87838"/>
    <path d="M14,-102 L24,-86 L18,-72 L10,-78 L8,-94 Z" fill="url(#i6p12p4theoWaistcoat)"/>
    <ellipse cx="22" cy="-78" rx="2.4" ry="1.6" fill="#a87838"/>
    <circle cx="-22" cy="-47" r="0.7" fill="#c89058" filter="url(#i6p12p4bloom)" opacity="0.85"/>
    <!-- Head — ascending, posture moving up + slight forward, eyes ahead but shoulders up -->
    <rect x="-3" y="-112" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-122" rx="13" ry="14" fill="#a87838"/>
    <path d="M-12,-130 Q-9,-140 0,-142 Q9,-140 12,-130 L12,-122 Q8,-128 0,-128 Q-8,-128 -12,-122 Z" fill="#9a7038"/>
    <path d="M-7,-138 L-5,-142 L-8,-142 Z" fill="#9a7038"/>
    <path d="M5,-138 L7,-142 L4,-142 Z" fill="#9a7038"/>
    <ellipse cx="-3" cy="-122" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-122" r="0.7" fill="#5a3818"/>
    <ellipse cx="3" cy="-122" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-122" r="0.7" fill="#5a3818"/>
    <!-- Brows tense (residual fear) -->
    <path d="M-7,-128 L-2,-128" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M2,-128 L7,-128" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M-3,-114 L3,-114" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
