<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 2 — Panel 1: Confirmation — red bio-trace overlay floods the map between Luma and Wren</title>
  <desc>50mm two-shot eye level. Luma left, Wren right, anomaly map between them with new spectral overlay — angry pulsing red signatures at every node. The moment evidence becomes danger.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p2p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180a14"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>
    <linearGradient id="i6p2p1lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p2p1wrenSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="i6p2p1beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="i6p2p1mapBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p2p1mapRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3848" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c81830" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a0818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p2p1redNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ff3848" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a0818" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p2p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p2p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p2p1bg)"/>

  <!-- Floorboard above with dim amber -->
  <rect x="0" y="0" width="742" height="28" fill="#3a2818"/>
  <g stroke="#1a0c04" stroke-width="0.85" opacity="0.7">
    <line x1="120" y1="0" x2="120" y2="28"/>
    <line x1="280" y1="0" x2="280" y2="28"/>
    <line x1="460" y1="0" x2="460" y2="28"/>
    <line x1="620" y1="0" x2="620" y2="28"/>
  </g>

  <!-- Background timber columns (camp framing) -->
  <rect x="20" y="28" width="14" height="304" fill="url(#i6p2p1beam)"/>
  <rect x="708" y="28" width="14" height="304" fill="url(#i6p2p1beam)"/>
  <!-- Floor -->
  <rect x="34" y="332" width="674" height="32" fill="#1a0c04"/>

  <!-- ===== HOLOGRAPHIC ANOMALY MAP — center, dual-overlay (blue + red) ===== -->
  <g transform="translate(371 178)">
    <!-- Blue base bloom -->
    <ellipse cx="0" cy="0" rx="220" ry="140" fill="url(#i6p2p1mapBlue)" filter="url(#i6p2p1glow)" opacity="0.7"/>
    <!-- Red threat overlay bloom -->
    <ellipse cx="0" cy="0" rx="200" ry="125" fill="url(#i6p2p1mapRed)" filter="url(#i6p2p1glow)" opacity="0.55"/>

    <!-- City wireframe -->
    <g stroke="#a888ff" stroke-width="0.5" fill="none" opacity="0.6" filter="url(#i6p2p1bloom)">
      <line x1="-160" y1="-90" x2="160" y2="-90"/>
      <line x1="-180" y1="-50" x2="180" y2="-50"/>
      <line x1="-190" y1="-10" x2="190" y2="-10"/>
      <line x1="-190" y1="30" x2="190" y2="30"/>
      <line x1="-180" y1="70" x2="180" y2="70"/>
      <line x1="-160" y1="110" x2="160" y2="110"/>
      <line x1="-160" y1="-90" x2="-160" y2="110"/>
      <line x1="-90" y1="-100" x2="-90" y2="120"/>
      <line x1="-20" y1="-105" x2="-20" y2="125"/>
      <line x1="50" y1="-105" x2="50" y2="125"/>
      <line x1="120" y1="-100" x2="120" y2="120"/>
      <line x1="160" y1="-90" x2="160" y2="110"/>
    </g>
    <g stroke="#a888ff" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#i6p2p1bloom)">
      <rect x="-145" y="-72" width="32" height="20"/>
      <rect x="-78" y="-78" width="32" height="22"/>
      <rect x="-10" y="-78" width="34" height="22"/>
      <rect x="62" y="-78" width="32" height="22"/>
      <rect x="125" y="-72" width="30" height="20"/>
      <rect x="-145" y="-22" width="32" height="22"/>
      <rect x="-78" y="-22" width="32" height="22"/>
      <rect x="-10" y="-22" width="32" height="22"/>
      <rect x="62" y="-22" width="32" height="22"/>
      <rect x="125" y="-22" width="30" height="22"/>
      <rect x="-145" y="20" width="32" height="22"/>
      <rect x="-78" y="20" width="34" height="22"/>
      <rect x="-10" y="20" width="32" height="22"/>
      <rect x="62" y="20" width="34" height="22"/>
      <rect x="125" y="20" width="30" height="22"/>
      <rect x="-145" y="62" width="30" height="22"/>
      <rect x="-78" y="62" width="32" height="22"/>
      <rect x="-10" y="62" width="34" height="22"/>
      <rect x="62" y="62" width="32" height="22"/>
      <rect x="125" y="62" width="30" height="22"/>
    </g>

    <!-- SIX RED THREAT NODES — angry pulsing -->
    <ellipse cx="-110" cy="-58" rx="14" ry="11" fill="url(#i6p2p1redNode)" filter="url(#i6p2p1glow)" opacity="1"/>
    <circle cx="-110" cy="-58" r="3" fill="#fff8e8"/>
    <ellipse cx="-30" cy="-30" rx="13" ry="11" fill="url(#i6p2p1redNode)" filter="url(#i6p2p1glow)" opacity="0.95"/>
    <circle cx="-30" cy="-30" r="2.6" fill="#fff8e8"/>
    <ellipse cx="40" cy="-12" rx="13" ry="11" fill="url(#i6p2p1redNode)" filter="url(#i6p2p1glow)" opacity="0.95"/>
    <circle cx="40" cy="-12" r="2.6" fill="#fff8e8"/>
    <ellipse cx="100" cy="20" rx="13" ry="11" fill="url(#i6p2p1redNode)" filter="url(#i6p2p1glow)" opacity="0.95"/>
    <circle cx="100" cy="20" r="2.6" fill="#fff8e8"/>
    <ellipse cx="-78" cy="50" rx="13" ry="11" fill="url(#i6p2p1redNode)" filter="url(#i6p2p1glow)" opacity="0.95"/>
    <circle cx="-78" cy="50" r="2.6" fill="#fff8e8"/>
    <ellipse cx="138" cy="68" rx="13" ry="11" fill="url(#i6p2p1redNode)" filter="url(#i6p2p1glow)" opacity="0.95"/>
    <circle cx="138" cy="68" r="2.6" fill="#fff8e8"/>

    <!-- Triangle convergence — now red -->
    <g stroke="#ff5868" stroke-width="0.95" fill="none" opacity="0.95" filter="url(#i6p2p1bloom)">
      <line x1="-110" y1="-58" x2="100" y2="20"/>
      <line x1="100" y1="20" x2="-78" y2="50"/>
      <line x1="-78" y1="50" x2="-110" y2="-58"/>
    </g>
    <g stroke="#ff3848" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p2p1bloom)" stroke-dasharray="2 1.5">
      <line x1="-110" y1="-58" x2="-30" y2="-30"/>
      <line x1="-30" y1="-30" x2="40" y2="-12"/>
      <line x1="40" y1="-12" x2="100" y2="20"/>
      <line x1="100" y1="20" x2="138" y2="68"/>
      <line x1="138" y1="68" x2="-78" y2="50"/>
      <line x1="-30" y1="-30" x2="-78" y2="50"/>
    </g>

    <!-- "HOSTILE BIO-TRACE DETECTED" floating ribbon -->
    <g opacity="0.95" filter="url(#i6p2p1bloom)">
      <rect x="-66" y="-110" width="132" height="14" rx="0.7" fill="none" stroke="#ff5868" stroke-width="0.55"/>
      <text x="0" y="-100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" font-weight="700">HOSTILE BIO-TRACE — SPECTRAL MATCH</text>
    </g>

    <!-- Spark particles -->
    <g fill="#ff5868" opacity="0.85" filter="url(#i6p2p1bloom)">
      <circle cx="-180" cy="-80" r="0.7"/>
      <circle cx="180" cy="-80" r="0.7"/>
      <circle cx="-160" cy="100" r="0.85"/>
      <circle cx="160" cy="100" r="0.85"/>
    </g>
  </g>

  <!-- ===== LUMA — left side, facing right, slight nod ===== -->
  <g transform="translate(150 308)">
    <ellipse cx="-4" cy="34" rx="5" ry="2.4" fill="#0a0408"/>
    <ellipse cx="6" cy="34" rx="5" ry="2.4" fill="#0a0408"/>
    <rect x="-8" y="-2" width="6" height="36" fill="url(#i6p2p1lumaSuit)"/>
    <rect x="2" y="-2" width="6" height="36" fill="url(#i6p2p1lumaSuit)"/>
    <ellipse cx="-4" cy="20" rx="5" ry="1.8" fill="#5a4838" opacity="0.5"/>
    <ellipse cx="6" cy="20" rx="5" ry="1.8" fill="#5a4838" opacity="0.5"/>
    <!-- Torso -->
    <path d="M-12,-2 L-12,-44 L12,-44 L12,-2 Z" fill="url(#i6p2p1lumaSuit)"/>
    <line x1="-9" y1="-22" x2="9" y2="-22" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#i6p2p1bloom)"/>
    <ellipse cx="-10" cy="-44" rx="4" ry="2" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="10" cy="-44" rx="4" ry="2" fill="#5a4838" opacity="0.55"/>
    <!-- Shoulders -->
    <path d="M-12,-44 Q-9,-58 0,-62 Q9,-58 12,-44 Z" fill="url(#i6p2p1lumaSuit)"/>
    <!-- ARMS — right arm extended toward map (gesture of confirmation), left at side -->
    <path d="M12,-44 L24,-30 L34,-22 L40,-20 L38,-16 L28,-22 L20,-32 L12,-30 Z" fill="url(#i6p2p1lumaSuit)"/>
    <ellipse cx="40" cy="-20" rx="4" ry="2.4" fill="#7a4838"/>
    <ellipse cx="32" cy="-26" rx="2.4" ry="1.4" fill="#0a0604" opacity="0.55"/>
    <!-- Holo glow at fingertips into map -->
    <ellipse cx="42" cy="-20" rx="6" ry="3" fill="#a888ff" opacity="0.6" filter="url(#i6p2p1bloom)"/>
    <!-- Left arm -->
    <path d="M-12,-44 L-22,-26 L-22,-2 L-14,-2 L-14,-30 L-12,-30 Z" fill="url(#i6p2p1lumaSuit)"/>
    <ellipse cx="-22" cy="0" rx="3.5" ry="2.4" fill="#7a4838"/>
    <ellipse cx="-22" cy="-14" rx="2" ry="1" fill="#0a0604" opacity="0.55"/>
    <!-- Head — slight nod, looking right toward Wren -->
    <ellipse cx="2" cy="-72" rx="9" ry="11" fill="#7a4838"/>
    <!-- Hair (back-pulled, braid down right) -->
    <path d="M-7,-78 Q-5,-82 2,-83 Q9,-82 11,-78 L11,-72 Q6,-76 2,-76 Q-2,-76 -7,-72 Z" fill="#0a0604"/>
    <path d="M11,-66 Q16,-44 14,-22" stroke="#0a0604" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M11,-66 Q16,-44 14,-22" stroke="#a888ff" stroke-width="0.65" fill="none" opacity="0.85" filter="url(#i6p2p1bloom)"/>
    <!-- Lenses with crack -->
    <ellipse cx="-1" cy="-72" rx="3" ry="2" fill="#a888ff" opacity="0.35"/>
    <ellipse cx="5" cy="-72" rx="3" ry="2" fill="#a888ff" opacity="0.35"/>
    <ellipse cx="-1" cy="-72" rx="3" ry="2" fill="none" stroke="#a888ff" stroke-width="0.55" opacity="0.95" filter="url(#i6p2p1bloom)"/>
    <ellipse cx="5" cy="-72" rx="3" ry="2" fill="none" stroke="#a888ff" stroke-width="0.55" opacity="0.95" filter="url(#i6p2p1bloom)"/>
    <line x1="-3" y1="-73" x2="1" y2="-71" stroke="#fff8ff" stroke-width="0.4" opacity="0.85"/>
    <ellipse cx="-1" cy="-72" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-1" cy="-72" r="0.7" fill="#0a0604"/>
    <ellipse cx="5" cy="-72" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="5" cy="-72" r="0.7" fill="#0a0604"/>
    <!-- Brows level — grim confirmation -->
    <path d="M-5,-78 L1,-77" stroke="#0a0604" stroke-width="0.85"/>
    <path d="M3,-77 L9,-78" stroke="#0a0604" stroke-width="0.85"/>
    <!-- Mouth set firm -->
    <path d="M-2,-66 L4,-66" stroke="#3a1808" stroke-width="0.85"/>
    <!-- Earpiece -->
    <circle cx="11.5" cy="-71" r="0.85" fill="#a888ff" filter="url(#i6p2p1bloom)" opacity="0.95"/>

    <!-- Red rim light on right side from new overlay -->
    <path d="M12,-72 Q14,-50 12,-22" stroke="#ff5868" stroke-width="0.65" fill="none" opacity="0.7" filter="url(#i6p2p1bloom)"/>
    <line x1="-10" y1="-44" x2="-12" y2="-2" stroke="#a888ff" stroke-width="0.45" opacity="0.55" filter="url(#i6p2p1bloom)"/>
  </g>

  <!-- ===== WREN — right side, facing left, processing ===== -->
  <g transform="translate(592 308)">
    <ellipse cx="-4" cy="34" rx="5" ry="2.4" fill="#0a0408"/>
    <ellipse cx="6" cy="34" rx="5" ry="2.4" fill="#0a0408"/>
    <rect x="-8" y="-2" width="6" height="36" fill="url(#i6p2p1wrenSuit)"/>
    <rect x="2" y="-2" width="6" height="36" fill="url(#i6p2p1wrenSuit)"/>
    <ellipse cx="-4" cy="22" rx="5" ry="2.4" fill="#5a4838" opacity="0.7"/>
    <ellipse cx="6" cy="22" rx="5" ry="2.4" fill="#5a4838" opacity="0.7"/>
    <path d="M-12,-2 L-12,-44 L12,-44 L12,-2 Z" fill="url(#i6p2p1wrenSuit)"/>
    <line x1="-9" y1="-22" x2="9" y2="-22" stroke="#ffd078" stroke-width="0.85" opacity="0.85" filter="url(#i6p2p1bloom)"/>
    <!-- Shoulders -->
    <path d="M-12,-44 Q-9,-58 0,-62 Q9,-58 12,-44 Z" fill="url(#i6p2p1wrenSuit)"/>
    <!-- ARMS — left arm forward, near chest (jaw tight, processing); right at side -->
    <path d="M-12,-44 L-26,-32 L-22,-22 L-12,-22 Z" fill="url(#i6p2p1wrenSuit)"/>
    <ellipse cx="-26" cy="-22" rx="3" ry="2" fill="#a86838"/>
    <ellipse cx="-20" cy="-26" rx="2.4" ry="1.4" fill="#0a0604" opacity="0.7"/>
    <path d="M12,-44 L22,-30 L18,-2 L12,-2 L14,-26 L12,-30 Z" fill="url(#i6p2p1wrenSuit)"/>
    <ellipse cx="20" cy="0" rx="3.5" ry="2.4" fill="#a86838"/>
    <ellipse cx="20" cy="-16" rx="2" ry="1" fill="#0a0604" opacity="0.7"/>
    <!-- Head — looking left toward Luma -->
    <ellipse cx="-2" cy="-72" rx="9" ry="11" fill="#a86838"/>
    <!-- Hair UP messy bun -->
    <ellipse cx="-2" cy="-86" rx="5" ry="3.5" fill="#0a0604"/>
    <ellipse cx="-2" cy="-90" rx="3.5" ry="2.4" fill="#1a0c04"/>
    <path d="M-9,-78 Q-11,-72 -10,-66" stroke="#0a0604" stroke-width="0.85" fill="none" opacity="0.85"/>
    <path d="M5,-78 Q9,-74 8,-66" stroke="#0a0604" stroke-width="0.85" fill="none" opacity="0.85"/>
    <ellipse cx="-5" cy="-72" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-5" cy="-72" r="0.7" fill="#0a0604"/>
    <ellipse cx="1" cy="-72" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="1" cy="-72" r="0.7" fill="#0a0604"/>
    <!-- Brows down — sharp -->
    <path d="M-9,-78 L-3,-77" stroke="#0a0604" stroke-width="0.95"/>
    <path d="M-1,-77 L5,-78" stroke="#0a0604" stroke-width="0.95"/>
    <!-- Mouth — firm, jaw tight -->
    <path d="M-5,-66 L3,-66" stroke="#3a1808" stroke-width="1"/>
    <!-- Jaw shadow -->
    <ellipse cx="-2" cy="-62" rx="6" ry="1.5" fill="#1a0c04" opacity="0.55"/>
    <!-- Earpiece -->
    <circle cx="-9.5" cy="-71" r="0.85" fill="#e8a850" filter="url(#i6p2p1bloom)" opacity="0.95"/>

    <!-- Blue rim from map left side, red rim center-front -->
    <path d="M-12,-72 Q-14,-50 -12,-22" stroke="#a888ff" stroke-width="0.65" fill="none" opacity="0.7" filter="url(#i6p2p1bloom)"/>
    <path d="M-2,-62 Q0,-44 -2,-22" stroke="#ff5868" stroke-width="0.55" fill="none" opacity="0.55" filter="url(#i6p2p1bloom)"/>
  </g>

  <!-- LUMA dialogue 1 (top-left) -->
  <g>
    <rect x="14" y="14" width="240" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="106,54 118,54 110,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="106.5" y1="54" x2="117.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Yes. Titan bio-trace. At every site.</text>

  <!-- LUMA dialogue 2 (top-right) -->
  <g>
    <rect x="266" y="14" width="462" height="56" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="490,70 502,70 494,80" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="490.5" y1="70" x2="501.5" y2="70" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="274" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="274" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Whatever has been doing this is not human.</text>
  <text x="274" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">And it's been here longer than we have.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
