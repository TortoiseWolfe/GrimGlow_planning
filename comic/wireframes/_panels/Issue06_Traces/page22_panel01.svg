<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 270" width="742" height="270">
  <title>Issue 6 — Page 22 — Panel 1: Garret room — Theodore on bed edge, candle burning, did not undress for sleep</title>
  <desc>28mm medium wide slight high angle. Theodore's garret room. Sloped ceiling, bare plaster walls, exposed timber beam. Narrow iron bed with wool blanket. Wooden box with tallow candle (warm amber unsteady) + clockwork projects. Shelf books. Theodore on edge still dressed, boots on. Hands on knees, gear ring catching candlelight. Stares at floor. Window dark fog-grey.</desc>

  <defs>
    <linearGradient id="i6p22p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <radialGradient id="i6p22p1candleHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d8a060" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p22p1plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a6048"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i6p22p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="i6p22p1ironBed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2828"/>
      <stop offset="100%" stop-color="#1a0c0a"/>
    </linearGradient>
    <linearGradient id="i6p22p1blanket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <radialGradient id="i6p22p1windowFog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a8090" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a3848" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p22p1bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i6p22p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i6p22p1strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i6p22p1megaglow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="742" height="270" fill="url(#i6p22p1bg)"/>

  <!-- SLOPED CEILING — left side angles up -->
  <path d="M0,0 L0,30 L742,80 L742,0 Z" fill="#3a2818"/>
  <path d="M0,30 L742,80" stroke="#1a0c08" stroke-width="0.85" opacity="0.85"/>
  <!-- Exposed timber beam at peak -->
  <rect x="120" y="50" width="500" height="14" fill="url(#i6p22p1floor)" transform="rotate(2 371 60)"/>
  <line x1="120" y1="50" x2="620" y2="68" stroke="#5a3818" stroke-width="0.55" opacity="0.85"/>

  <!-- Plaster walls (back wall) -->
  <rect x="0" y="80" width="742" height="120" fill="url(#i6p22p1plaster)"/>
  <!-- Plaster cracks / texture -->
  <g stroke="#1a0c08" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M40,100 L60,140 L80,180"/>
    <path d="M580,90 L600,140 L590,180"/>
    <path d="M340,120 L360,160"/>
  </g>

  <!-- Bare floorboards -->
  <rect x="0" y="200" width="742" height="70" fill="url(#i6p22p1floor)"/>
  <g stroke="#080404" stroke-width="0.55" opacity="0.85" fill="none">
    <line x1="0" y1="220" x2="742" y2="220"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
    <line x1="0" y1="260" x2="742" y2="260"/>
    <line x1="100" y1="200" x2="100" y2="270"/>
    <line x1="240" y1="200" x2="240" y2="270"/>
    <line x1="380" y1="200" x2="380" y2="270"/>
    <line x1="520" y1="200" x2="520" y2="270"/>
    <line x1="640" y1="200" x2="640" y2="270"/>
  </g>

  <!-- WINDOW (small, four-paned, right side) -->
  <g transform="translate(620 130)">
    <rect x="-30" y="-30" width="60" height="60" fill="#1a0c08" stroke="#3a2418" stroke-width="0.85"/>
    <rect x="-26" y="-26" width="52" height="52" fill="url(#i6p22p1windowFog)" filter="url(#i6p22p1glow)"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#1a0c08" stroke-width="1"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#1a0c08" stroke-width="1"/>
    <!-- Glass panes — fog pressing -->
    <rect x="-26" y="-26" width="26" height="26" fill="#5a5860" opacity="0.55"/>
    <rect x="0" y="-26" width="26" height="26" fill="#5a5860" opacity="0.55"/>
    <rect x="-26" y="0" width="26" height="26" fill="#5a5860" opacity="0.55"/>
    <rect x="0" y="0" width="26" height="26" fill="#5a5860" opacity="0.55"/>
    <!-- Fog wisps inside frame -->
    <ellipse cx="-12" cy="-12" rx="10" ry="3" fill="#7a8090" opacity="0.55"/>
    <ellipse cx="12" cy="6" rx="10" ry="3" fill="#7a8090" opacity="0.4"/>
  </g>

  <!-- SHELF on wall (left side) -->
  <rect x="60" y="120" width="120" height="3" fill="#3a2418"/>
  <!-- Books on shelf -->
  <rect x="68" y="100" width="9" height="20" fill="#7a3818" stroke="#3a1808" stroke-width="0.4"/>
  <rect x="78" y="98" width="9" height="22" fill="#5a3018" stroke="#3a1808" stroke-width="0.4"/>
  <rect x="88" y="102" width="9" height="18" fill="#3a2418" stroke="#1a0c04" stroke-width="0.4"/>
  <rect x="98" y="100" width="9" height="20" fill="#7a4818" stroke="#3a1808" stroke-width="0.4"/>
  <!-- Jar -->
  <ellipse cx="130" cy="118" rx="7" ry="3" fill="#5a4828" opacity="0.85"/>
  <rect x="123" y="110" width="14" height="9" fill="#5a4828"/>
  <ellipse cx="130" cy="110" rx="7" ry="3" fill="#3a2418"/>
  <!-- Folded cloth -->
  <rect x="148" y="112" width="20" height="8" fill="#a87838" opacity="0.85"/>

  <!-- IRON BED frame — narrow, simple -->
  <g transform="translate(371 200)">
    <!-- Frame bars vertical posts -->
    <rect x="-90" y="-90" width="3" height="90" fill="url(#i6p22p1ironBed)"/>
    <rect x="-90" y="-90" width="3" height="60" fill="url(#i6p22p1ironBed)" transform="translate(180 0)"/>
    <rect x="90" y="-90" width="3" height="90" fill="url(#i6p22p1ironBed)"/>
    <!-- Headboard top rail with simple finials -->
    <rect x="-92" y="-90" width="186" height="3" fill="url(#i6p22p1ironBed)"/>
    <circle cx="-89" cy="-92" r="3" fill="url(#i6p22p1ironBed)"/>
    <circle cx="91" cy="-92" r="3" fill="url(#i6p22p1ironBed)"/>
    <!-- Spindles in headboard -->
    <line x1="-70" y1="-87" x2="-70" y2="-50" stroke="#1a0c0a" stroke-width="1"/>
    <line x1="-50" y1="-87" x2="-50" y2="-50" stroke="#1a0c0a" stroke-width="1"/>
    <line x1="-30" y1="-87" x2="-30" y2="-50" stroke="#1a0c0a" stroke-width="1"/>
    <line x1="-10" y1="-87" x2="-10" y2="-50" stroke="#1a0c0a" stroke-width="1"/>
    <line x1="10" y1="-87" x2="10" y2="-50" stroke="#1a0c0a" stroke-width="1"/>
    <line x1="30" y1="-87" x2="30" y2="-50" stroke="#1a0c0a" stroke-width="1"/>
    <line x1="50" y1="-87" x2="50" y2="-50" stroke="#1a0c0a" stroke-width="1"/>
    <line x1="70" y1="-87" x2="70" y2="-50" stroke="#1a0c0a" stroke-width="1"/>

    <!-- Mattress -->
    <rect x="-87" y="-50" width="174" height="20" fill="#d4c4a8" stroke="#7a6048" stroke-width="0.55"/>
    <!-- Wool blanket — rumpled -->
    <path d="M-87,-30 L-90,-12 L-70,-8 L-50,-14 L-20,-10 L0,-16 L40,-10 L70,-14 L87,-12 L87,-30 Z" fill="url(#i6p22p1blanket)"/>
    <!-- Blanket folds -->
    <path d="M-50,-22 Q-30,-18 0,-22" stroke="#7a4818" stroke-width="0.55" fill="none"/>
    <path d="M0,-20 Q30,-16 70,-20" stroke="#7a4818" stroke-width="0.55" fill="none"/>
  </g>

  <!-- WOODEN BOX bedside (right of bed) -->
  <g transform="translate(508 230)">
    <rect x="-22" y="-30" width="44" height="30" fill="#3a2418" stroke="#1a0c08" stroke-width="0.55"/>
    <line x1="-22" y1="-22" x2="22" y2="-22" stroke="#1a0c08" stroke-width="0.55"/>
    <line x1="-22" y1="-14" x2="22" y2="-14" stroke="#1a0c08" stroke-width="0.55"/>

    <!-- Half-assembled MUSIC BOX -->
    <rect x="-18" y="-44" width="14" height="14" fill="#5a3818" stroke="#1a0c08" stroke-width="0.4"/>
    <rect x="-15" y="-42" width="8" height="8" fill="#a87838"/>
    <line x1="-15" y1="-38" x2="-7" y2="-38" stroke="#1a0c08" stroke-width="0.3"/>
    <!-- Brass gear train (gears stacked) -->
    <circle cx="2" cy="-36" r="3" fill="none" stroke="#a87838" stroke-width="0.55"/>
    <circle cx="2" cy="-36" r="1.4" fill="#7a4818"/>
    <line x1="-1" y1="-36" x2="-2" y2="-36" stroke="#a87838" stroke-width="0.4"/>
    <line x1="5" y1="-36" x2="6" y2="-36" stroke="#a87838" stroke-width="0.4"/>
    <circle cx="9" cy="-34" r="2.4" fill="none" stroke="#a87838" stroke-width="0.55"/>
    <circle cx="9" cy="-34" r="1" fill="#7a4818"/>

    <!-- TALLOW CANDLE -->
    <rect x="14" y="-46" width="6" height="14" fill="#a89878"/>
    <ellipse cx="17" cy="-32" rx="3" ry="0.85" fill="#5a4828"/>
    <!-- Wick -->
    <line x1="17" y1="-46" x2="17" y2="-50" stroke="#1a0c04" stroke-width="0.7"/>
    <!-- FLAME -->
    <ellipse cx="17" cy="-52" rx="2" ry="3.5" fill="#fff8c8" filter="url(#i6p22p1bloom)"/>
    <ellipse cx="17" cy="-52" rx="1" ry="2" fill="#ffe0a8"/>
    <!-- Candle halo -->
    <ellipse cx="17" cy="-50" rx="40" ry="32" fill="url(#i6p22p1candleHalo)" filter="url(#i6p22p1megaglow)"/>
  </g>

  <!-- ===== THEODORE — sitting on bed edge, hands on knees ===== -->
  <g transform="translate(371 200)">
    <!-- Boots planted on floor in front of bed -->
    <ellipse cx="-9" cy="46" rx="6" ry="3" fill="#1a0c04"/>
    <ellipse cx="9" cy="46" rx="6" ry="3" fill="#1a0c04"/>

    <!-- Trousers (knee-down extended) -->
    <path d="M-12,-14 L-14,30 L-3,46 L0,12 Z" fill="#3a3028"/>
    <path d="M12,-14 L14,30 L3,46 L0,12 Z" fill="#3a3028"/>
    <!-- Knee patches -->
    <rect x="-8" y="14" width="6" height="6" fill="#5a3018" stroke="#3a1808" stroke-width="0.4"/>
    <rect x="2" y="14" width="6" height="6" fill="#5a3018" stroke="#3a1808" stroke-width="0.4"/>

    <!-- Waistcoat / linen — sitting -->
    <path d="M-12,-50 L-14,-14 L14,-14 L12,-50 Z" fill="#d4c4a8"/>
    <path d="M-16,-48 L-14,-14 L-2,-14 L-2,-48 Z" fill="#5a3018"/>
    <path d="M16,-48 L14,-14 L2,-14 L2,-48 Z" fill="#5a3018"/>
    <circle cx="-2" cy="-40" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-32" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-24" r="0.85" fill="#3a1808"/>

    <!-- Linen collar -->
    <path d="M-7,-50 L0,-48 L7,-50 L7,-46 L0,-43 L-7,-46 Z" fill="#e0d4b8"/>

    <!-- Arms — RESTING ON KNEES -->
    <path d="M-14,-46 L-22,-26 L-14,-2 L-6,-14 Z" fill="#5a3018"/>
    <path d="M14,-46 L22,-26 L14,-2 L6,-14 Z" fill="#5a3018"/>
    <!-- Hands on knees -->
    <ellipse cx="-12" cy="6" rx="5" ry="3" fill="#a87838"/>
    <ellipse cx="12" cy="6" rx="5" ry="3" fill="#a87838"/>
    <!-- Brass gear ring on left index — catching candlelight -->
    <circle cx="-15" cy="6" r="1.4" fill="none" stroke="#d89858" stroke-width="0.55" filter="url(#i6p22p1bloom)"/>

    <!-- Head — looking DOWN at floor -->
    <ellipse cx="0" cy="-64" rx="9" ry="10" fill="#a87838"/>
    <path d="M-8,-72 Q-6,-78 0,-80 Q6,-78 8,-72 L8,-64 Q6,-68 0,-68 Q-6,-68 -8,-64 Z" fill="#9a7038"/>
    <!-- Amber candlelight catching face from right -->
    <ellipse cx="3" cy="-64" rx="3" ry="3" fill="#d8a060" opacity="0.55" filter="url(#i6p22p1bloom)"/>
    <!-- Eyes (looking down) -->
    <ellipse cx="-3" cy="-62" rx="1.4" ry="0.4" fill="#fff8e8"/>
    <ellipse cx="3" cy="-62" rx="1.4" ry="0.4" fill="#fff8e8"/>
    <line x1="-4" y1="-62" x2="-2" y2="-62" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="2" y1="-62" x2="4" y2="-62" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Brow -->
    <path d="M-5,-68 L-2,-69" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M5,-68 L2,-69" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth -->
    <line x1="-2" y1="-56" x2="2" y2="-56" stroke="#3a1808" stroke-width="0.4"/>

    <!-- THEODORE'S SHADOW on wall behind -->
  </g>
  <!-- Shadow on wall (back wall) -->
  <ellipse cx="320" cy="160" rx="50" ry="80" fill="#1a0c08" opacity="0.55" filter="url(#i6p22p1glow)"/>

  <!-- Caption 1 -->
  <g>
    <rect x="14" y="14" width="320" height="34" rx="2" fill="#f5ecd8" stroke="#5a4a30" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">"Theodore did not light a second candle.</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">He did not change for bed."</text>

  <!-- Caption 2 -->
  <g>
    <rect x="408" y="14" width="320" height="34" rx="2" fill="#f5ecd8" stroke="#5a4a30" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="416" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">"He sat on the edge of his mattress</text>
  <text x="416" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">and listened to the fog."</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a0c08" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
