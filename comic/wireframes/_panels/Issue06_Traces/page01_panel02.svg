<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 6 — Page 1 — Panel 2: Luma's hand inside the anomaly node — factory site enlarging</title>
  <desc>50mm MCU eye level. Luma's hand inside a holographic data node spreading fingers, the node enlarges into geometric fairy script + spectral analysis graphic. Scanner hovers near other hand. Cracked lens catches the blue-violet light.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p1p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="i6p1p2lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p1p2nodeBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#a888ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p1p2scannerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p1p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p1p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#i6p1p2bg)"/>

  <!-- Soft camp interior context - dim timber haze top + bottom -->
  <rect x="0" y="0" width="366" height="32" fill="#1a0c08" opacity="0.85"/>
  <rect x="0" y="332" width="366" height="32" fill="#0a0408"/>
  <line x1="0" y1="332" x2="366" y2="332" stroke="#3a2418" stroke-width="0.6" opacity="0.6"/>

  <!-- Background dim camp interior - barely visible timber columns -->
  <rect x="20" y="32" width="6" height="300" fill="#3a2818" opacity="0.55"/>
  <rect x="340" y="32" width="6" height="300" fill="#3a2818" opacity="0.55"/>

  <!-- ===== ENLARGED ANOMALY NODE — center-frame holographic readout ===== -->
  <g transform="translate(228 168)">
    <!-- Node bloom -->
    <ellipse cx="0" cy="0" rx="125" ry="115" fill="url(#i6p1p2nodeBloom)" filter="url(#i6p1p2glow)" opacity="0.85"/>

    <!-- Inner factory-site building wireframe -->
    <g stroke="#fff8ff" stroke-width="0.85" fill="none" opacity="0.9" filter="url(#i6p1p2bloom)">
      <path d="M-65,-20 L-65,40 L65,40 L65,-20 Z"/>
      <path d="M-65,-20 L-40,-50 L40,-50 L65,-20"/>
      <line x1="-25" y1="-20" x2="-25" y2="40" opacity="0.7"/>
      <line x1="25" y1="-20" x2="25" y2="40" opacity="0.7"/>
      <rect x="-50" y="10" width="22" height="22" rx="0.5"/>
      <rect x="28" y="10" width="22" height="22" rx="0.5"/>
      <rect x="-8" y="20" width="16" height="20" rx="0.5"/>
      <line x1="-65" y1="20" x2="65" y2="20" opacity="0.55"/>
      <!-- Smokestack -->
      <rect x="48" y="-72" width="8" height="22"/>
      <ellipse cx="52" cy="-78" rx="6" ry="3" fill="#a888ff" opacity="0.4"/>
    </g>

    <!-- Spectral analysis graphic — bar plot at top-left of node -->
    <g stroke="#fff8ff" stroke-width="0.5" fill="none" opacity="0.85" filter="url(#i6p1p2bloom)">
      <line x1="-90" y1="-70" x2="-90" y2="-30"/>
      <line x1="-90" y1="-30" x2="-50" y2="-30"/>
      <rect x="-87" y="-50" width="3" height="20" fill="#a888ff" opacity="0.7"/>
      <rect x="-82" y="-58" width="3" height="28" fill="#a888ff" opacity="0.8"/>
      <rect x="-77" y="-44" width="3" height="14" fill="#a888ff" opacity="0.6"/>
      <rect x="-72" y="-62" width="3" height="32" fill="#a888ff" opacity="0.85"/>
      <rect x="-67" y="-52" width="3" height="22" fill="#a888ff" opacity="0.7"/>
      <rect x="-62" y="-46" width="3" height="16" fill="#a888ff" opacity="0.6"/>
      <text x="-95" y="-72" font-family="Helvetica, Arial, sans-serif" font-size="4.2" fill="#fff8ff" opacity="0.85">SPECTRAL</text>
    </g>

    <!-- Geometric fairy-script annotations — floating tags right side -->
    <g stroke="#fff8ff" stroke-width="0.4" fill="none" opacity="0.9" filter="url(#i6p1p2bloom)">
      <line x1="65" y1="-30" x2="80" y2="-40"/>
      <path d="M80,-40 L100,-40"/>
      <path d="M84,-44 L84,-36"/>
      <path d="M88,-44 L88,-36"/>
      <path d="M92,-44 L92,-36"/>
      <path d="M96,-44 L96,-36"/>
      <line x1="65" y1="-10" x2="82" y2="-2"/>
      <path d="M82,-2 L102,-2"/>
      <path d="M86,-6 L86,2"/>
      <path d="M90,-6 L90,2"/>
      <path d="M94,-6 L94,2"/>
      <line x1="65" y1="14" x2="80" y2="20"/>
      <path d="M80,20 L100,20"/>
      <path d="M84,16 L84,24"/>
      <path d="M88,16 L88,24"/>
      <path d="M92,16 L92,24"/>
    </g>

    <!-- Bowling Green Lane label -->
    <text x="-50" y="60" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#fff8ff" opacity="0.9" filter="url(#i6p1p2bloom)">BOWLING GREEN LANE</text>
    <text x="-30" y="70" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#a888ff" opacity="0.85" filter="url(#i6p1p2bloom)">ANOMALY 01</text>

    <!-- Crystalline lattice overlay diagram below building -->
    <g stroke="#a888ff" stroke-width="0.4" fill="none" opacity="0.75" filter="url(#i6p1p2bloom)">
      <circle cx="-60" cy="84" r="2"/>
      <circle cx="-44" cy="78" r="2"/>
      <circle cx="-28" cy="84" r="2"/>
      <circle cx="-44" cy="92" r="2"/>
      <circle cx="-12" cy="78" r="2"/>
      <circle cx="-12" cy="92" r="2"/>
      <line x1="-60" y1="84" x2="-44" y2="78"/>
      <line x1="-44" y1="78" x2="-28" y2="84"/>
      <line x1="-44" y1="78" x2="-44" y2="92"/>
      <line x1="-44" y1="92" x2="-60" y2="84"/>
      <line x1="-44" y1="92" x2="-28" y2="84"/>
      <line x1="-28" y1="84" x2="-12" y2="78"/>
      <line x1="-12" y1="78" x2="-12" y2="92"/>
      <line x1="-12" y1="92" x2="-28" y2="84"/>
    </g>

    <!-- Bright core pulse -->
    <circle cx="0" cy="-5" r="6" fill="#fff8ff" opacity="0.85" filter="url(#i6p1p2bloom)"/>
    <circle cx="0" cy="-5" r="2" fill="#fff8ff"/>

    <!-- Orbital data particles -->
    <g fill="#a888ff" opacity="0.85" filter="url(#i6p1p2bloom)">
      <circle cx="-115" cy="-90" r="0.85"/>
      <circle cx="115" cy="-95" r="0.85"/>
      <circle cx="110" cy="80" r="0.85"/>
      <circle cx="-110" cy="90" r="0.7"/>
      <circle cx="-100" cy="-50" r="0.55"/>
      <circle cx="100" cy="50" r="0.55"/>
    </g>
  </g>

  <!-- ===== LUMA — large hand + face from below, fingers spreading into the node ===== -->
  <!-- Hand rising into the node from below-left -->
  <g transform="translate(168 230)">
    <!-- Forearm -->
    <path d="M-22,80 L-12,40 L4,-15 L24,-12 L18,40 L8,80 Z" fill="url(#i6p1p2lumaSuit)"/>
    <!-- Ink stains on forearm -->
    <ellipse cx="-4" cy="20" rx="5" ry="2.4" fill="#0a0604" opacity="0.55"/>
    <ellipse cx="14" cy="60" rx="3" ry="1.6" fill="#0a0604" opacity="0.55"/>
    <ellipse cx="0" cy="50" rx="2" ry="1.2" fill="#0a0604" opacity="0.45"/>
    <!-- Suit holo seam down forearm -->
    <line x1="0" y1="20" x2="14" y2="70" stroke="#a888ff" stroke-width="0.5" opacity="0.85" filter="url(#i6p1p2bloom)"/>
    <!-- Wrist seam -->
    <line x1="-12" y1="40" x2="18" y2="40" stroke="#a888ff" stroke-width="0.6" opacity="0.7" filter="url(#i6p1p2bloom)"/>

    <!-- HAND — palm open upward, fingers spread into node -->
    <path d="M4,-15 L24,-12 L26,-22 L20,-32 L12,-38 L4,-30 L0,-22 Z" fill="#a86838"/>
    <!-- Fingers spreading -->
    <g fill="#a86838">
      <!-- Thumb -->
      <path d="M28,-22 L34,-30 L32,-44 L26,-42 Z"/>
      <!-- Index -->
      <path d="M22,-32 L24,-50 L18,-58 L14,-44 Z"/>
      <!-- Middle -->
      <path d="M16,-36 L14,-58 L8,-62 L8,-46 Z"/>
      <!-- Ring -->
      <path d="M10,-36 L6,-56 L0,-58 L2,-44 Z"/>
      <!-- Pinky -->
      <path d="M4,-32 L-2,-50 L-6,-50 L-4,-38 Z"/>
    </g>
    <!-- Palm holographic interaction glow -->
    <ellipse cx="14" cy="-35" rx="22" ry="14" fill="#a888ff" opacity="0.55" filter="url(#i6p1p2glow)"/>
    <!-- Light streaming from fingertips up into node -->
    <line x1="32" y1="-44" x2="48" y2="-62" stroke="#a888ff" stroke-width="0.5" opacity="0.7" filter="url(#i6p1p2bloom)"/>
    <line x1="18" y1="-58" x2="28" y2="-78" stroke="#a888ff" stroke-width="0.5" opacity="0.7" filter="url(#i6p1p2bloom)"/>
    <line x1="8" y1="-62" x2="14" y2="-82" stroke="#a888ff" stroke-width="0.5" opacity="0.7" filter="url(#i6p1p2bloom)"/>
    <line x1="0" y1="-58" x2="2" y2="-78" stroke="#a888ff" stroke-width="0.5" opacity="0.7" filter="url(#i6p1p2bloom)"/>
    <line x1="-6" y1="-50" x2="-12" y2="-66" stroke="#a888ff" stroke-width="0.5" opacity="0.7" filter="url(#i6p1p2bloom)"/>
    <!-- Ink stain on palm/fingers -->
    <ellipse cx="14" cy="-22" rx="3" ry="1.6" fill="#0a0604" opacity="0.5"/>
  </g>

  <!-- ===== LUMA face from below — looking up at the readout ===== -->
  <g transform="translate(118 268)">
    <!-- Neck -->
    <rect x="-5" y="-22" width="10" height="14" fill="#7a4838"/>
    <!-- Suit collar visible -->
    <path d="M-12,-8 L-12,16 L12,16 L12,-8 Z" fill="url(#i6p1p2lumaSuit)"/>
    <line x1="-8" y1="2" x2="8" y2="2" stroke="#a888ff" stroke-width="0.7" opacity="0.85" filter="url(#i6p1p2bloom)"/>
    <!-- Dust on shoulder -->
    <ellipse cx="-10" cy="-8" rx="4" ry="2" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="10" cy="-8" rx="4" ry="2" fill="#5a4838" opacity="0.55"/>

    <!-- Head — angled up, lit from below by the node -->
    <ellipse cx="0" cy="-40" rx="22" ry="28" fill="#7a4838"/>
    <!-- Underlight from node — brighter blue-violet wash on chin and lower face -->
    <ellipse cx="0" cy="-26" rx="20" ry="12" fill="#a888ff" opacity="0.45" filter="url(#i6p1p2bloom)"/>
    <ellipse cx="0" cy="-30" rx="16" ry="8" fill="#a888ff" opacity="0.35"/>

    <!-- Hair pulled back into braid — visible at sides + back -->
    <path d="M-22,-44 Q-22,-56 -10,-66 Q0,-72 10,-66 Q22,-56 22,-44 L22,-32 Q18,-44 0,-44 Q-18,-44 -22,-32 Z" fill="#0a0604"/>
    <!-- Braid trailing down right side -->
    <path d="M22,-30 Q26,-10 24,16" stroke="#0a0604" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M22,-30 Q26,-10 24,16" stroke="#a888ff" stroke-width="1" fill="none" opacity="0.85" filter="url(#i6p1p2bloom)"/>
    <!-- Braid plait segments -->
    <path d="M22,-26 Q26,-22 22,-18" stroke="#1a0c04" stroke-width="0.55" fill="none" opacity="0.85"/>
    <path d="M22,-18 Q26,-14 22,-10" stroke="#1a0c04" stroke-width="0.55" fill="none" opacity="0.85"/>
    <path d="M24,-10 Q28,-6 24,-2" stroke="#1a0c04" stroke-width="0.55" fill="none" opacity="0.85"/>
    <path d="M24,-2 Q28,2 24,6" stroke="#1a0c04" stroke-width="0.55" fill="none" opacity="0.85"/>

    <!-- Forehead/cheek volumes -->
    <ellipse cx="-8" cy="-44" rx="5" ry="6" fill="#8a5848" opacity="0.5"/>
    <ellipse cx="8" cy="-44" rx="5" ry="6" fill="#8a5848" opacity="0.5"/>

    <!-- Spectral lenses — semi-transparent, blue-violet, scrolling data -->
    <ellipse cx="-7" cy="-44" rx="7" ry="5" fill="#a888ff" opacity="0.3"/>
    <ellipse cx="7" cy="-44" rx="7" ry="5" fill="#a888ff" opacity="0.3"/>
    <ellipse cx="-7" cy="-44" rx="7" ry="5" fill="none" stroke="#a888ff" stroke-width="0.7" opacity="0.95" filter="url(#i6p1p2bloom)"/>
    <ellipse cx="7" cy="-44" rx="7" ry="5" fill="none" stroke="#a888ff" stroke-width="0.7" opacity="0.95" filter="url(#i6p1p2bloom)"/>
    <!-- Bridge between lenses -->
    <path d="M0,-44 L0,-44" stroke="#a888ff" stroke-width="0.6" opacity="0.85"/>
    <line x1="0" y1="-44" x2="0" y2="-44" stroke="#a888ff" stroke-width="0.6" opacity="0.85"/>
    <line x1="-0.5" y1="-44" x2="0.5" y2="-44" stroke="#a888ff" stroke-width="0.6" opacity="0.85"/>
    <!-- Scrolling data lines inside lenses -->
    <line x1="-12" y1="-46" x2="-2" y2="-46" stroke="#fff8ff" stroke-width="0.35" opacity="0.85"/>
    <line x1="-11" y1="-43" x2="-3" y2="-43" stroke="#fff8ff" stroke-width="0.35" opacity="0.7"/>
    <line x1="-12" y1="-41" x2="-2" y2="-41" stroke="#fff8ff" stroke-width="0.35" opacity="0.85"/>
    <line x1="2" y1="-46" x2="12" y2="-46" stroke="#fff8ff" stroke-width="0.35" opacity="0.85"/>
    <line x1="3" y1="-43" x2="11" y2="-43" stroke="#fff8ff" stroke-width="0.35" opacity="0.7"/>
    <line x1="2" y1="-41" x2="12" y2="-41" stroke="#fff8ff" stroke-width="0.35" opacity="0.85"/>
    <!-- Hairline crack on left lens -->
    <line x1="-13" y1="-46" x2="-3" y2="-42" stroke="#fff8ff" stroke-width="0.55" opacity="0.95"/>
    <line x1="-9" y1="-44" x2="-7" y2="-43" stroke="#fff8ff" stroke-width="0.4" opacity="0.7"/>

    <!-- Eyes inside lenses -->
    <ellipse cx="-7" cy="-44" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="-7" cy="-44" r="1.4" fill="#0a0604"/>
    <circle cx="-7" cy="-44" r="0.5" fill="#fff8ff"/>
    <ellipse cx="7" cy="-44" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="7" cy="-44" r="1.4" fill="#0a0604"/>
    <circle cx="7" cy="-44" r="0.5" fill="#fff8ff"/>

    <!-- Brows — focused -->
    <path d="M-13,-52 L-3,-52" stroke="#0a0604" stroke-width="1"/>
    <path d="M3,-52 L13,-52" stroke="#0a0604" stroke-width="1"/>

    <!-- Nose -->
    <path d="M0,-40 L-2,-32 L2,-32 Z" fill="#5a3028" opacity="0.4"/>

    <!-- Mouth — set, presenting evidence -->
    <path d="M-5,-22 L5,-22" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="-3" y1="-21" x2="3" y2="-21" stroke="#3a1808" stroke-width="0.55"/>

    <!-- Ear with comm earpiece glow -->
    <ellipse cx="22" cy="-44" rx="2.4" ry="3" fill="#7a4838"/>
    <circle cx="23" cy="-43" r="1.3" fill="#a888ff" filter="url(#i6p1p2bloom)" opacity="0.95"/>

    <!-- Cheek dust accent (right side from earlier wall-cavity work) -->
    <ellipse cx="-12" cy="-30" rx="3" ry="1.4" fill="#3a3038" opacity="0.35"/>
  </g>

  <!-- ===== Other hand holding scanner — bottom-left ===== -->
  <g transform="translate(60 290)">
    <!-- Scanner device hovering -->
    <rect x="-12" y="-6" width="24" height="14" rx="1.5" fill="#3a2068" stroke="#a888ff" stroke-width="0.7"/>
    <rect x="-9" y="-3" width="18" height="8" fill="#5a3ad8" filter="url(#i6p1p2bloom)"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#fff8ff" stroke-width="0.4" opacity="0.85"/>
    <line x1="-7" y1="3" x2="5" y2="3" stroke="#fff8ff" stroke-width="0.4" opacity="0.7"/>
    <!-- Scanner halo -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#i6p1p2scannerGlow)" filter="url(#i6p1p2glow)"/>
    <!-- Hand holding scanner from below -->
    <path d="M-8,8 L-12,18 L8,18 L12,8 Z" fill="#a86838"/>
    <ellipse cx="-7" cy="14" rx="1.4" ry="0.85" fill="#0a0604" opacity="0.55"/>
    <!-- Forearm trailing off-frame -->
    <path d="M-12,18 L-22,30 L12,30 L8,18 Z" fill="url(#i6p1p2lumaSuit)"/>
    <!-- Stream of data from scanner upward into node -->
    <g stroke="#a888ff" stroke-width="0.5" fill="none" opacity="0.7" filter="url(#i6p1p2bloom)" stroke-dasharray="2 1.5">
      <path d="M0,-6 Q40,-50 110,-90"/>
      <path d="M-4,-6 Q34,-44 100,-90"/>
      <path d="M4,-6 Q46,-46 116,-92"/>
    </g>
    <!-- Scanner data particles streaming up -->
    <g fill="#a888ff" opacity="0.9" filter="url(#i6p1p2bloom)">
      <circle cx="20" cy="-26" r="0.85"/>
      <circle cx="40" cy="-50" r="0.7"/>
      <circle cx="68" cy="-72" r="0.85"/>
      <circle cx="92" cy="-86" r="0.7"/>
    </g>
  </g>

  <!-- LUMA dialogue 1 (top-center, multi-line) -->
  <g>
    <rect x="14" y="14" width="338" height="78" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="160,92 172,92 164,102" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="160.5" y1="92" x2="171.5" y2="92" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Anomaly one. A factory on Bowling Green</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Lane. A metalworker — no formal education</text>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">— suddenly producing alloys requiring</text>
  <text x="22" y="89" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">crystalline lattice knowledge.</text>

  <!-- LUMA dialogue 2 (bottom-right, two lines) -->
  <g>
    <rect x="156" y="298" width="196" height="44" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="180,298 192,298 184,288" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="180.5" y1="298" x2="191.5" y2="298" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="164" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="164" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Decades ahead of anything in this era.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,100 Q120,102 240,98 Q330,96 366,100"/>
    <path d="M0,290 Q120,292 240,288 Q330,286 366,290"/>
  </g>
</svg>
