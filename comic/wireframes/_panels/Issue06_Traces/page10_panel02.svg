<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 248.9" width="742" height="248.9">
  <title>Issue 6 — Page 10 — Panel 2: From basement steps looking up — Theodore's legs descending, Titan shadow still there at frame edge</title>
  <desc>24mm wide widescreen low angle from bottom of stone steps. Theodore's legs descend into frame. Above: rectangle of grey street light. At far edge of street rectangle in fog: the Titan shadow STILL THERE, still too tall, still too still. It has not moved.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p10p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#605850"/>
      <stop offset="50%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p10p2stoneStep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p10p2stoneSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <radialGradient id="i6p10p2skyFog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#807870" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#403830" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p10p2titanVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0410" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1a0c20" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a1828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p10p2titanIridescence" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0c20" stop-opacity="0"/>
      <stop offset="60%" stop-color="#5a3a78" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1828" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p10p2theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="i6p10p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p10p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="248.9" fill="url(#i6p10p2bg)"/>

  <!-- LEFT side wall of stairwell (close, dark) -->
  <rect x="0" y="0" width="80" height="248.9" fill="url(#i6p10p2stoneSide)"/>
  <g stroke="#0a0608" stroke-width="0.55" opacity="0.7" fill="none">
    <line x1="0" y1="40" x2="80" y2="40"/>
    <line x1="0" y1="80" x2="80" y2="80"/>
    <line x1="0" y1="120" x2="80" y2="120"/>
    <line x1="0" y1="160" x2="80" y2="160"/>
    <line x1="0" y1="200" x2="80" y2="200"/>
  </g>
  <!-- Damp stains on wall -->
  <ellipse cx="40" cy="120" rx="22" ry="40" fill="#1a0c08" opacity="0.65"/>
  <ellipse cx="60" cy="200" rx="14" ry="20" fill="#1a0c08" opacity="0.55"/>

  <!-- RIGHT side wall of stairwell -->
  <rect x="662" y="0" width="80" height="248.9" fill="url(#i6p10p2stoneSide)"/>
  <g stroke="#0a0608" stroke-width="0.55" opacity="0.7" fill="none">
    <line x1="662" y1="40" x2="742" y2="40"/>
    <line x1="662" y1="80" x2="742" y2="80"/>
    <line x1="662" y1="120" x2="742" y2="120"/>
    <line x1="662" y1="160" x2="742" y2="160"/>
    <line x1="662" y1="200" x2="742" y2="200"/>
  </g>
  <ellipse cx="700" cy="100" rx="20" ry="40" fill="#1a0c08" opacity="0.6"/>
  <ellipse cx="680" cy="200" rx="14" ry="22" fill="#1a0c08" opacity="0.55"/>

  <!-- Iron railing along right (corroded) -->
  <line x1="662" y1="40" x2="662" y2="200" stroke="#1a0c04" stroke-width="3"/>
  <ellipse cx="662" cy="100" rx="3" ry="2" fill="#5a3018" opacity="0.85"/>
  <ellipse cx="662" cy="160" rx="3" ry="2" fill="#5a3018" opacity="0.85"/>
  <line x1="662" y1="60" x2="650" y2="200" stroke="#1a0c04" stroke-width="2"/>
  <line x1="662" y1="120" x2="654" y2="200" stroke="#1a0c04" stroke-width="1.4"/>

  <!-- ===== STAIRWELL OPENING (street rectangle above) — perspective from below ===== -->
  <polygon points="80,0 662,0 600,80 140,80" fill="#807870"/>
  <ellipse cx="371" cy="40" rx="320" ry="40" fill="url(#i6p10p2skyFog)" filter="url(#i6p10p2glow)" opacity="0.95"/>

  <!-- Distant building silhouettes through stairwell opening -->
  <rect x="160" y="0" width="80" height="60" fill="#3a3028" opacity="0.85"/>
  <rect x="240" y="0" width="60" height="60" fill="#403830" opacity="0.85"/>
  <rect x="300" y="0" width="80" height="60" fill="#3a3028" opacity="0.85"/>
  <rect x="380" y="0" width="60" height="60" fill="#403830" opacity="0.85"/>
  <rect x="440" y="0" width="80" height="60" fill="#3a3028" opacity="0.85"/>
  <rect x="520" y="0" width="80" height="60" fill="#403830" opacity="0.85"/>
  <!-- Fog smear over distant buildings -->
  <ellipse cx="371" cy="40" rx="280" ry="50" fill="#605850" opacity="0.55" filter="url(#i6p10p2glow)"/>

  <!-- ===== TITAN SHADOW — at far end of street rectangle, edge of frame ===== -->
  <!-- Position: right portion of the visible street, partway in -->
  <g transform="translate(550 35)">
    <!-- Outer iridescent margin halo -->
    <ellipse cx="0" cy="0" rx="18" ry="36" fill="url(#i6p10p2titanIridescence)" filter="url(#i6p10p2glow)"/>
    <!-- Fog parting around it slightly -->
    <ellipse cx="0" cy="0" rx="22" ry="44" fill="#605850" opacity="0.4" filter="url(#i6p10p2glow)"/>
    <!-- Core void -->
    <rect x="-8" y="-30" width="16" height="56" fill="url(#i6p10p2titanVoid)"/>
    <!-- Tapered top -->
    <path d="M-8,-30 Q-6,-40 0,-42 Q6,-40 8,-30 Z" fill="url(#i6p10p2titanVoid)"/>
    <!-- Wider base -->
    <path d="M-8,26 Q-10,30 -6,34 L6,34 Q10,30 8,26 Z" fill="url(#i6p10p2titanVoid)"/>
    <!-- Iridescent edge marker -->
    <line x1="-8" y1="-30" x2="-8" y2="26" stroke="#5a3a78" stroke-width="0.55" opacity="0.55" filter="url(#i6p10p2bloom)"/>
    <line x1="8" y1="-30" x2="8" y2="26" stroke="#5a3a78" stroke-width="0.55" opacity="0.55" filter="url(#i6p10p2bloom)"/>
    <!-- Faint vertical iridescent striations -->
    <line x1="-4" y1="-25" x2="-4" y2="20" stroke="#3a1828" stroke-width="0.4" opacity="0.45" filter="url(#i6p10p2bloom)"/>
    <line x1="4" y1="-25" x2="4" y2="20" stroke="#3a1828" stroke-width="0.4" opacity="0.45" filter="url(#i6p10p2bloom)"/>
  </g>

  <!-- Pavement edge above stairwell -->
  <rect x="80" y="60" width="582" height="22" fill="#1a1410"/>
  <line x1="80" y1="60" x2="662" y2="60" stroke="#3a3028" stroke-width="0.85" opacity="0.85"/>
  <line x1="80" y1="80" x2="662" y2="80" stroke="#5a5048" stroke-width="1.4" opacity="0.85"/>

  <!-- ===== STONE STEPS (perspective receding to bottom-of-frame) ===== -->
  <!-- Step 5 (closest to top, narrowest) -->
  <path d="M140,80 L600,80 L596,92 L144,92 Z" fill="url(#i6p10p2stoneStep)"/>
  <line x1="140" y1="80" x2="600" y2="80" stroke="#7a706a" stroke-width="0.55" opacity="0.85"/>
  <!-- Step 4 -->
  <path d="M144,96 L596,96 L590,114 L150,114 Z" fill="url(#i6p10p2stoneStep)"/>
  <line x1="144" y1="96" x2="596" y2="96" stroke="#7a706a" stroke-width="0.55" opacity="0.85"/>
  <!-- Step 3 -->
  <path d="M150,120 L590,120 L582,142 L158,142 Z" fill="url(#i6p10p2stoneStep)"/>
  <line x1="150" y1="120" x2="590" y2="120" stroke="#7a706a" stroke-width="0.55" opacity="0.85"/>
  <!-- Step 2 -->
  <path d="M158,148 L582,148 L572,176 L168,176 Z" fill="url(#i6p10p2stoneStep)"/>
  <line x1="158" y1="148" x2="582" y2="148" stroke="#7a706a" stroke-width="0.55" opacity="0.85"/>
  <!-- Step 1 (bottom, widest, closest) -->
  <path d="M168,182 L572,182 L560,220 L180,220 Z" fill="url(#i6p10p2stoneStep)"/>
  <line x1="168" y1="182" x2="572" y2="182" stroke="#7a706a" stroke-width="0.55" opacity="0.85"/>
  <!-- Step 0 — basement floor -->
  <path d="M180,220 L560,220 L540,248.9 L200,248.9 Z" fill="#0a0608"/>
  <!-- Damp/wear stains -->
  <ellipse cx="280" cy="100" rx="40" ry="3" fill="#1a0c04" opacity="0.7"/>
  <ellipse cx="450" cy="130" rx="50" ry="3" fill="#1a0c04" opacity="0.7"/>
  <ellipse cx="320" cy="170" rx="60" ry="3" fill="#1a0c04" opacity="0.7"/>
  <ellipse cx="430" cy="210" rx="60" ry="3" fill="#1a0c04" opacity="0.55"/>

  <!-- ===== THEODORE'S LEGS descending — visible from knees down on top steps ===== -->
  <g transform="translate(371 110)">
    <!-- Lower leg / boot one foot down on step -->
    <ellipse cx="-12" cy="0" rx="11" ry="3" fill="#1a0c04"/>
    <!-- Other foot mid-step -->
    <ellipse cx="14" cy="-22" rx="11" ry="3" fill="#1a0c04"/>
    <!-- Trousers visible from knee down -->
    <path d="M-15,-50 L-2,-50 L-15,0 L-23,0 Z" fill="url(#i6p10p2theoTrousers)"/>
    <path d="M2,-50 L15,-50 L20,-22 L8,-22 Z" fill="url(#i6p10p2theoTrousers)"/>
    <!-- Patches at knees -->
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-30" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <!-- Trousers cuff edge -->
    <line x1="-22" y1="-3" x2="-3" y2="-3" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="3" y1="-25" x2="22" y2="-25" stroke="#1a0c04" stroke-width="0.55"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q200,92 400,88 Q580,86 742,90"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
