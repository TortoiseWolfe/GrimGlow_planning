<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 16 — Panel 1: Storage room above basement — Theodore + Luma after, scanner data hovering, "It was... informative."</title>
  <desc>28mm medium wide eye level. Disused storage room dim and dusty. Theodore cross-legged on floor beside open iron grate. Luma stands on his knee, dust head to foot, wing-pack stowing. Holographic scanner hovers beside her displaying rotating glyph. Two light temperatures (grey-gold ambient + blue-violet scanner).</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p16p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="i6p16p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="i6p16p1wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i6p16p1leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p16p1linen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4c4a8"/>
      <stop offset="100%" stop-color="#a8987c"/>
    </linearGradient>
    <linearGradient id="i6p16p1trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p16p1lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p16p1window" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8a098" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a4838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p16p1scanner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p16p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p16p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p16p1bg)"/>

  <!-- Storage room back wall -->
  <rect x="0" y="0" width="742" height="280" fill="url(#i6p16p1wall)"/>
  <!-- Lath-and-plaster ladder pattern -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
  </g>

  <!-- GRIMY WINDOW upper-left, grey-gold light -->
  <rect x="540" y="40" width="160" height="120" fill="#3a2818"/>
  <rect x="544" y="44" width="152" height="112" fill="url(#i6p16p1window)" filter="url(#i6p16p1glow)" opacity="0.85"/>
  <line x1="620" y1="44" x2="620" y2="156" stroke="#1a0c04" stroke-width="1.4"/>
  <line x1="544" y1="100" x2="696" y2="100" stroke="#1a0c04" stroke-width="1.4"/>
  <!-- Grime smears -->
  <ellipse cx="580" cy="80" rx="22" ry="11" fill="#1a0c04" opacity="0.55"/>
  <ellipse cx="660" cy="120" rx="14" ry="7" fill="#1a0c04" opacity="0.55"/>
  <!-- Window frame casts grey-gold light pool on floor -->
  <ellipse cx="500" cy="280" rx="220" ry="40" fill="#a89888" opacity="0.45" filter="url(#i6p16p1glow)"/>

  <!-- Floor — wood planks -->
  <rect x="0" y="280" width="742" height="84" fill="url(#i6p16p1floor)"/>
  <line x1="0" y1="290" x2="742" y2="290" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.55" fill="none">
    <line x1="80" y1="290" x2="80" y2="364"/>
    <line x1="200" y1="290" x2="200" y2="364"/>
    <line x1="320" y1="290" x2="320" y2="364"/>
    <line x1="440" y1="290" x2="440" y2="364"/>
    <line x1="560" y1="290" x2="560" y2="364"/>
    <line x1="660" y1="290" x2="660" y2="364"/>
  </g>
  <!-- Dust on floor -->
  <g fill="#a89888" opacity="0.45">
    <ellipse cx="120" cy="330" rx="40" ry="2"/>
    <ellipse cx="280" cy="340" rx="50" ry="2.4"/>
    <ellipse cx="500" cy="335" rx="60" ry="2.4"/>
    <ellipse cx="660" cy="340" rx="40" ry="2"/>
  </g>

  <!-- IRON GRATE in floor — propped open, dark below -->
  <g transform="translate(160 296)">
    <rect x="-60" y="0" width="120" height="60" fill="#0a0408"/>
    <rect x="-60" y="0" width="120" height="60" fill="none" stroke="#1a0c04" stroke-width="2"/>
    <!-- Vertical bars -->
    <g fill="#1a0c04" stroke="#0a0408" stroke-width="0.55">
      <rect x="-44" y="0" width="3" height="60"/>
      <rect x="-22" y="0" width="3" height="60"/>
      <rect x="0" y="0" width="3" height="60"/>
      <rect x="22" y="0" width="3" height="60"/>
      <rect x="44" y="0" width="3" height="60"/>
    </g>
    <!-- Propped open hinge to one side -->
    <line x1="60" y1="0" x2="76" y2="-10" stroke="#1a0c04" stroke-width="1.4"/>
    <line x1="60" y1="-3" x2="76" y2="-13" stroke="#3a2818" stroke-width="0.7" opacity="0.85"/>
  </g>

  <!-- ===== THEODORE — cross-legged on floor beside grate ===== -->
  <g transform="translate(370 280)">
    <!-- Cross-legged trousers -->
    <path d="M-44,0 L-30,-20 L-2,-22 L0,40 L-50,40 Z" fill="url(#i6p16p1trousers)"/>
    <path d="M44,0 L30,-20 L2,-22 L0,40 L50,40 Z" fill="url(#i6p16p1trousers)"/>
    <!-- Boot tips -->
    <ellipse cx="-44" cy="6" rx="9" ry="3" fill="#1a0c04"/>
    <ellipse cx="44" cy="6" rx="9" ry="3" fill="#1a0c04"/>
    <!-- Knee patches -->
    <rect x="-26" y="-22" width="9" height="9" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="17" y="-22" width="9" height="9" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>

    <!-- Shirt + waistcoat -->
    <path d="M-22,-100 L-22,-22 L22,-22 L22,-100 Z" fill="url(#i6p16p1linen)"/>
    <path d="M-26,-98 L-22,-22 L-2,-22 L-2,-98 Z" fill="url(#i6p16p1leather)"/>
    <path d="M22,-98 L26,-22 L2,-22 L2,-98 Z" fill="url(#i6p16p1leather)"/>
    <!-- Pocket on right side, dust visible -->
    <rect x="3" y="-92" width="14" height="18" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <ellipse cx="10" cy="-86" rx="8" ry="2" fill="#a8a098" opacity="0.55"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-86" r="0.95" fill="#3a1808"/>
    <circle cx="-2" cy="-66" r="0.95" fill="#3a1808"/>
    <circle cx="-2" cy="-46" r="0.95" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-9,-100 L0,-98 L9,-100 L9,-94 L0,-90 L-9,-94 Z" fill="#e0d4b8"/>

    <!-- Arms — right hand resting on knee where Luma stands, left arm at side -->
    <path d="M-26,-98 L-40,-78 L-46,-46 L-30,-44 L-22,-66 Z" fill="url(#i6p16p1leather)"/>
    <ellipse cx="-46" cy="-46" rx="3" ry="2" fill="#a87838"/>
    <!-- RIGHT arm reaching down to right knee for stability -->
    <path d="M26,-98 L40,-78 L34,-46 L22,-44 L18,-72 Z" fill="url(#i6p16p1leather)"/>
    <ellipse cx="36" cy="-46" rx="3" ry="2" fill="#a87838"/>
    <!-- Brass gear ring on left index -->
    <circle cx="-46" cy="-46" r="0.95" fill="#c89058" filter="url(#i6p16p1bloom)" opacity="0.85"/>

    <!-- Head — looking DOWN at Luma on right knee -->
    <rect x="-3" y="-108" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-118" rx="14" ry="14" fill="#a87838"/>
    <path d="M-13,-128 Q-10,-138 0,-140 Q10,-138 13,-128 L13,-118 Q9,-124 0,-124 Q-9,-124 -13,-118 Z" fill="#9a7038"/>
    <path d="M-7,-134 L-5,-138 L-8,-138 Z" fill="#9a7038"/>
    <path d="M5,-134 L7,-138 L4,-138 Z" fill="#9a7038"/>
    <!-- Eyes shifted DOWN-RIGHT toward Luma -->
    <ellipse cx="-3" cy="-118" rx="2" ry="1.2" fill="#fff8e8"/>
    <circle cx="-2" cy="-117" r="0.95" fill="#5a3818"/>
    <ellipse cx="3" cy="-118" rx="2" ry="1.2" fill="#fff8e8"/>
    <circle cx="4" cy="-117" r="0.95" fill="#5a3818"/>
    <!-- Brows furrowed (concern) -->
    <path d="M-7,-124 L-2,-124" stroke="#5a3018" stroke-width="0.7"/>
    <path d="M2,-124 L7,-124" stroke="#5a3018" stroke-width="0.7"/>
    <line x1="-2" y1="-123" x2="0" y2="-119" stroke="#5a3018" stroke-width="0.4" opacity="0.7"/>
    <line x1="2" y1="-123" x2="0" y2="-119" stroke="#5a3018" stroke-width="0.4" opacity="0.7"/>
    <!-- Mouth slightly open (wanting to ask) -->
    <ellipse cx="0" cy="-110" rx="1.4" ry="0.85" fill="#3a1808"/>
  </g>

  <!-- ===== LUMA — standing on Theodore's right knee ===== -->
  <g transform="translate(389 256)">
    <!-- Body coated in dust -->
    <ellipse cx="-2" cy="9" rx="2" ry="1.2" fill="#0a0408"/>
    <ellipse cx="3" cy="9" rx="2" ry="1.2" fill="#0a0408"/>
    <rect x="-3" y="2" width="2.4" height="7" fill="url(#i6p16p1lumaSuit)"/>
    <rect x="2" y="2" width="2.4" height="7" fill="url(#i6p16p1lumaSuit)"/>
    <!-- Heavy stone dust -->
    <ellipse cx="-2" cy="6" rx="2" ry="0.55" fill="#a8a098" opacity="0.95"/>
    <ellipse cx="3" cy="6" rx="2" ry="0.55" fill="#a8a098" opacity="0.95"/>
    <!-- Torso -->
    <path d="M-6,2 L-6,-9 L6,-9 L6,2 Z" fill="url(#i6p16p1lumaSuit)"/>
    <line x1="-4" y1="-3" x2="4" y2="-3" stroke="#a888ff" stroke-width="0.4" opacity="0.7" filter="url(#i6p16p1bloom)"/>
    <ellipse cx="-3" cy="-1" rx="2" ry="0.55" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="3" cy="-1" rx="2" ry="0.55" fill="#a8a098" opacity="0.85"/>
    <!-- Cobweb on shoulder -->
    <line x1="-6" y1="-7" x2="-3" y2="-3" stroke="#7a6c50" stroke-width="0.3" opacity="0.55"/>
    <!-- Wing-pack STOWING (only seam-glow visible) -->
    <path d="M-7,-9 L-9,-2 L-7,2 Z" fill="#1a0c04" opacity="0.85"/>
    <path d="M7,-9 L9,-2 L7,2 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="-7" y1="-6" x2="-7" y2="0" stroke="#5a3ad8" stroke-width="0.3" opacity="0.55" filter="url(#i6p16p1bloom)"/>
    <line x1="7" y1="-6" x2="7" y2="0" stroke="#5a3ad8" stroke-width="0.3" opacity="0.55" filter="url(#i6p16p1bloom)"/>
    <!-- Shoulders -->
    <path d="M-6,-9 Q-4,-13 0,-13 Q4,-13 6,-9 Z" fill="url(#i6p16p1lumaSuit)"/>
    <!-- Arms at sides -->
    <path d="M-6,-9 L-9,-4 L-9,2 L-6,0 Z" fill="url(#i6p16p1lumaSuit)"/>
    <path d="M6,-9 L9,-4 L9,2 L6,0 Z" fill="url(#i6p16p1lumaSuit)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-19" rx="4" ry="4.5" fill="#7a4838"/>
    <path d="M-3,-22 Q-2,-25 0,-25 Q2,-25 3,-22 L3,-19 Q1,-21 0,-21 Q-1,-21 -3,-19 Z" fill="#0a0604"/>
    <circle cx="0" cy="-23" r="0.3" fill="#a8a098" opacity="0.7"/>
    <line x1="0" y1="-24" x2="1" y2="-26" stroke="#5a3ad8" stroke-width="0.4" opacity="0.85" filter="url(#i6p16p1bloom)"/>
    <!-- Lenses dust-dimmed -->
    <ellipse cx="-1.5" cy="-19" rx="1.2" ry="0.85" fill="#a888ff" opacity="0.4"/>
    <ellipse cx="1.5" cy="-19" rx="1.2" ry="0.85" fill="#a888ff" opacity="0.4"/>
    <circle cx="-1.5" cy="-19" r="0.3" fill="#0a0604"/>
    <circle cx="1.5" cy="-19" r="0.3" fill="#0a0604"/>
    <!-- Mouth -->
    <path d="M-1.5,-15 L1.5,-15" stroke="#3a1808" stroke-width="0.3"/>
  </g>

  <!-- ===== HOLOGRAPHIC SCANNER hovering beside Luma — glyph rotating ===== -->
  <g transform="translate(420 240)">
    <!-- Scanner device floating -->
    <rect x="-7" y="-3" width="14" height="6" rx="0.55" fill="#3a2068" stroke="#a888ff" stroke-width="0.55"/>
    <rect x="-5" y="-1" width="10" height="2" fill="#5a3ad8" filter="url(#i6p16p1bloom)"/>
    <!-- Glow around scanner -->
    <ellipse cx="0" cy="-22" rx="22" ry="22" fill="url(#i6p16p1scanner)" filter="url(#i6p16p1glow)" opacity="0.85"/>
    <!-- Mini holographic glyph (rotating display) -->
    <g transform="translate(0 -22)" stroke="#a8c0ff" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#i6p16p1bloom)">
      <polygon points="-9,-5 0,-9 9,-5 9,5 0,9 -9,5"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <line x1="-9" y1="0" x2="9" y2="0"/>
    </g>
    <!-- Floating data text -->
    <g opacity="0.85" filter="url(#i6p16p1bloom)">
      <text x="-22" y="-44" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#fff8ff">SAMPLE A</text>
      <text x="14" y="-36" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#fff8ff">~3 CEN</text>
      <text x="-22" y="-2" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#fff8ff">REC</text>
    </g>
  </g>

  <!-- THEODORE dialogue -->
  <g>
    <rect x="14" y="14" width="200" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="100.5" y1="54" x2="111.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Was it very bad down there?</text>

  <!-- (Beat.) -->
  <text x="320" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">(Beat.)</text>

  <!-- LUMA dialogue -->
  <g>
    <rect x="540" y="14" width="180" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="600,54 612,54 604,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="600.5" y1="54" x2="611.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="548" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="548" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">It was... informative.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
