<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 470" width="366" height="470">
  <title>Issue 6 — Page 18 — Panel 2: Close-up hand on data module, lock icon glowing, thumb tremor — "Not yet."</title>
  <desc>85mm close-up. Sable's hand on data module, thumb hovering over surface. Holographic display shows file management interface — lock function icon glowing brighter as thumb approaches. The thumb trembles — barely. The decision to bury a truth in a single shaking thumb.</desc>

  <defs>
    <radialGradient id="i6p18p2darkness" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1228" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="i6p18p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a78b0"/>
      <stop offset="50%" stop-color="#2a3858"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <linearGradient id="i6p18p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8c8f0"/>
      <stop offset="50%" stop-color="#506890"/>
      <stop offset="100%" stop-color="#2a3858"/>
    </linearGradient>
    <radialGradient id="i6p18p2lockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#a8c8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a3060" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p18p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p18p2glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p18p2strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="366" height="470" fill="url(#i6p18p2darkness)"/>

  <!-- Module body — large in frame -->
  <g transform="translate(183 280)">
    <!-- Module case -->
    <polygon points="-130,-30 130,-30 140,30 -140,30" fill="#1a2840" stroke="#a8c8ff" stroke-width="0.85"/>
    <!-- Surface texture / panel lines -->
    <line x1="-120" y1="-22" x2="120" y2="-22" stroke="#5070a0" stroke-width="0.55"/>
    <line x1="-120" y1="22" x2="120" y2="22" stroke="#3a4868" stroke-width="0.4"/>
    <line x1="-60" y1="-30" x2="-60" y2="30" stroke="#3a4868" stroke-width="0.4" opacity="0.7"/>
    <line x1="60" y1="-30" x2="60" y2="30" stroke="#3a4868" stroke-width="0.4" opacity="0.7"/>
    <!-- Red integrity indicator -->
    <circle cx="-110" cy="0" r="3" fill="#ff5050" filter="url(#i6p18p2bloom)"/>
    <text x="-100" y="3" font-family="monospace" font-size="5" fill="#ff7878" filter="url(#i6p18p2bloom)">FILE INT — 38%</text>
  </g>

  <!-- Holographic display floats above module — file management interface -->
  <g transform="translate(183 140)" filter="url(#i6p18p2bloom)">
    <!-- Interface panel frame -->
    <polygon points="-100,-50 100,-50 110,50 -110,50" fill="#1a2840" opacity="0.65" stroke="#a8c8ff" stroke-width="0.55"/>
    <!-- Header row -->
    <line x1="-100" y1="-36" x2="100" y2="-36" stroke="#a8c8ff" stroke-width="0.4"/>
    <text x="0" y="-40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a8c8ff" text-anchor="middle" letter-spacing="1.5">FILE MGMT — TIER 4</text>
    <!-- File name field -->
    <text x="-95" y="-26" font-family="monospace" font-size="6" fill="#fff">CONVERGENCE_INTERVENTION.f4</text>
    <text x="-95" y="-16" font-family="monospace" font-size="5" fill="#7898d0">SIZE: 412KB | INT: 38%</text>
    <!-- Lock function icon — glowing brighter -->
    <g transform="translate(0 8)" opacity="0.95">
      <circle cx="0" cy="0" r="22" fill="url(#i6p18p2lockGlow)" filter="url(#i6p18p2strongglow)"/>
      <!-- Lock shape -->
      <rect x="-8" y="-2" width="16" height="14" fill="none" stroke="#c0d8ff" stroke-width="1.4"/>
      <path d="M-5,-2 Q-5,-9 0,-9 Q5,-9 5,-2" fill="none" stroke="#c0d8ff" stroke-width="1.4"/>
      <circle cx="0" cy="5" r="1.4" fill="#c0d8ff"/>
      <line x1="0" y1="6" x2="0" y2="9" stroke="#c0d8ff" stroke-width="1.0"/>
    </g>
    <!-- Buttons row -->
    <text x="-80" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#5070a0">[CANCEL]</text>
    <text x="80" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a8c8ff" text-anchor="end" font-weight="700">[ENCRYPT — TIER 5]</text>
  </g>

  <!-- Light cone from module upward -->
  <path d="M-130,250 L80,90 L286,90 L496,250 Z" fill="#a8c8ff" opacity="0.12" filter="url(#i6p18p2strongglow)" transform="translate(0 0)"/>

  <!-- ===== HAND — moving down from upper-right toward thumb-on-module ===== -->
  <g transform="translate(220 240)">
    <!-- Wrist / cuff -->
    <path d="M30,-20 L80,-30 L80,20 L30,20 Z" fill="url(#i6p18p2suit)"/>
    <line x1="30" y1="-20" x2="80" y2="-30" stroke="#c0d8ff" stroke-width="0.55" filter="url(#i6p18p2bloom)" opacity="0.85"/>
    <line x1="30" y1="20" x2="80" y2="20" stroke="#1a1c30" stroke-width="0.7"/>
    <!-- Suit cuff seam -->
    <line x1="32" y1="-18" x2="32" y2="18" stroke="#1a1c30" stroke-width="0.85"/>

    <!-- Hand back -->
    <path d="M30,-20 L-30,-15 L-40,8 L-20,22 L30,20 Z" fill="url(#i6p18p2skin)"/>
    <!-- Tendons -->
    <line x1="-20" y1="-12" x2="14" y2="-2" stroke="#1a2438" stroke-width="0.4" opacity="0.7"/>
    <line x1="-26" y1="-6" x2="8" y2="6" stroke="#1a2438" stroke-width="0.4" opacity="0.7"/>
    <line x1="-30" y1="2" x2="0" y2="14" stroke="#1a2438" stroke-width="0.4" opacity="0.7"/>
    <!-- Knuckles -->
    <ellipse cx="-22" cy="-8" rx="3" ry="2" fill="#3a5078" filter="url(#i6p18p2bloom)" opacity="0.85"/>
    <ellipse cx="-12" cy="-2" rx="3" ry="2" fill="#3a5078" filter="url(#i6p18p2bloom)" opacity="0.85"/>
    <ellipse cx="0" cy="6" rx="3" ry="2" fill="#3a5078" filter="url(#i6p18p2bloom)" opacity="0.85"/>

    <!-- Fingers folded back (hand is poised, thumb is what hovers) -->
    <path d="M-40,8 L-50,12 L-55,16 L-50,20 L-40,18 Z" fill="url(#i6p18p2skin)"/>

    <!-- ===== THUMB — extended forward, hovering over lock — TREMOR visible ===== -->
    <path d="M-30,-15 L-44,-14 L-52,-6 L-46,2 L-32,-4 Z" fill="url(#i6p18p2skin)"/>
    <!-- Edge-light -->
    <path d="M-30,-15 L-44,-14 L-52,-6" fill="none" stroke="#7898c8" stroke-width="0.55" filter="url(#i6p18p2bloom)" opacity="0.95"/>
    <!-- Thumbnail (faintly catching light) -->
    <ellipse cx="-46" cy="-8" rx="3" ry="2" fill="#3a5078" filter="url(#i6p18p2bloom)" opacity="0.85"/>

    <!-- TREMOR LINES — duplicated thumb shadow at slight offset -->
    <path d="M-44,-14 L-52,-6 L-46,2" fill="none" stroke="#3a5078" stroke-width="0.55" opacity="0.45"/>
    <path d="M-43,-15 L-51,-7 L-45,1" fill="none" stroke="#3a5078" stroke-width="0.4" opacity="0.3"/>
  </g>

  <!-- Caption — internal Sable -->
  <g>
    <rect x="14" y="380" width="338" height="56" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE  <tspan font-style="italic" font-size="9" font-weight="500">(internal)</tspan></text>
  <text x="22" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1410" font-style="italic">Not yet.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q100,162 200,158 Q280,156 366,160"/>
    <path d="M0,360 Q100,362 200,358 Q280,356 366,360"/>
  </g>
</svg>
