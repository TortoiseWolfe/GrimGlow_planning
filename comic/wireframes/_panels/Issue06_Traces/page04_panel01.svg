<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 4 — Panel 1: Clerkenwell, eight-forty — Theodore walks through fog-grey street</title>
  <desc>28mm establishing wide eye level. Victorian street in morning fog, soot-darkened brick, gas lamps unlit, indistinct pedestrians. Theodore center, hands in pockets, studied casual. The mundane before the strange.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p4p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7068"/>
      <stop offset="50%" stop-color="#605850"/>
      <stop offset="100%" stop-color="#3a3430"/>
    </linearGradient>
    <linearGradient id="i6p4p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0988e"/>
      <stop offset="100%" stop-color="#7a7068"/>
    </linearGradient>
    <linearGradient id="i6p4p1bldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p4p1bldgL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a30"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <linearGradient id="i6p4p1street" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#2a2420"/>
    </linearGradient>
    <radialGradient id="i6p4p1fog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a09890" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#605850" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p4p1theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p4p1theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="i6p4p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p4p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p4p1bg)"/>

  <!-- Sky band (foggy, no sun) -->
  <rect width="742" height="100" fill="url(#i6p4p1sky)"/>
  <!-- Fog haze across upper half -->
  <ellipse cx="200" cy="120" rx="280" ry="100" fill="url(#i6p4p1fog)" filter="url(#i6p4p1glow)" opacity="0.85"/>
  <ellipse cx="540" cy="100" rx="320" ry="100" fill="url(#i6p4p1fog)" filter="url(#i6p4p1glow)" opacity="0.85"/>
  <ellipse cx="370" cy="160" rx="380" ry="80" fill="url(#i6p4p1fog)" filter="url(#i6p4p1glow)" opacity="0.7"/>

  <!-- LEFT side buildings -->
  <rect x="0" y="60" width="180" height="240" fill="url(#i6p4p1bldgL)"/>
  <!-- Top fading into fog -->
  <rect x="0" y="60" width="180" height="80" fill="url(#i6p4p1fog)" opacity="0.4"/>
  <!-- Windows (closed shutters) -->
  <g fill="#1a1410" stroke="#2a1810" stroke-width="0.55">
    <rect x="20" y="160" width="22" height="34"/>
    <rect x="60" y="160" width="22" height="34"/>
    <rect x="100" y="160" width="22" height="34"/>
    <rect x="140" y="160" width="22" height="34"/>
    <rect x="20" y="216" width="22" height="34"/>
    <rect x="60" y="216" width="22" height="34"/>
    <rect x="100" y="216" width="22" height="34"/>
    <rect x="140" y="216" width="22" height="34"/>
  </g>
  <!-- Window frames + crossbars -->
  <g stroke="#5a4030" stroke-width="0.55" opacity="0.85" fill="none">
    <line x1="31" y1="160" x2="31" y2="194"/>
    <line x1="20" y1="177" x2="42" y2="177"/>
    <line x1="71" y1="160" x2="71" y2="194"/>
    <line x1="60" y1="177" x2="82" y2="177"/>
    <line x1="111" y1="160" x2="111" y2="194"/>
    <line x1="100" y1="177" x2="122" y2="177"/>
    <line x1="151" y1="160" x2="151" y2="194"/>
    <line x1="140" y1="177" x2="162" y2="177"/>
  </g>
  <!-- Brick texture -->
  <g stroke="#1a1008" stroke-width="0.4" opacity="0.45">
    <line x1="0" y1="100" x2="180" y2="100"/>
    <line x1="0" y1="120" x2="180" y2="120"/>
    <line x1="0" y1="140" x2="180" y2="140"/>
    <line x1="0" y1="200" x2="180" y2="200"/>
    <line x1="0" y1="260" x2="180" y2="260"/>
    <line x1="0" y1="280" x2="180" y2="280"/>
  </g>
  <!-- Soot streaks -->
  <ellipse cx="60" cy="140" rx="38" ry="14" fill="#1a1008" opacity="0.65"/>
  <ellipse cx="140" cy="180" rx="34" ry="20" fill="#1a1008" opacity="0.55"/>
  <!-- Door -->
  <rect x="40" y="270" width="34" height="30" fill="#1a0c08" stroke="#3a2818" stroke-width="0.55"/>

  <!-- RIGHT side buildings -->
  <rect x="562" y="60" width="180" height="240" fill="url(#i6p4p1bldg)"/>
  <rect x="562" y="60" width="180" height="80" fill="url(#i6p4p1fog)" opacity="0.4"/>
  <g fill="#1a1410" stroke="#2a1810" stroke-width="0.55">
    <rect x="582" y="160" width="22" height="34"/>
    <rect x="622" y="160" width="22" height="34"/>
    <rect x="662" y="160" width="22" height="34"/>
    <rect x="702" y="160" width="22" height="34"/>
    <rect x="582" y="216" width="22" height="34"/>
    <rect x="622" y="216" width="22" height="34"/>
    <rect x="662" y="216" width="22" height="34"/>
    <rect x="702" y="216" width="22" height="34"/>
  </g>
  <g stroke="#5a4030" stroke-width="0.55" opacity="0.85" fill="none">
    <line x1="593" y1="160" x2="593" y2="194"/>
    <line x1="582" y1="177" x2="604" y2="177"/>
    <line x1="633" y1="160" x2="633" y2="194"/>
    <line x1="622" y1="177" x2="644" y2="177"/>
    <line x1="673" y1="160" x2="673" y2="194"/>
    <line x1="662" y1="177" x2="684" y2="177"/>
    <line x1="713" y1="160" x2="713" y2="194"/>
    <line x1="702" y1="177" x2="724" y2="177"/>
  </g>
  <g stroke="#1a1008" stroke-width="0.4" opacity="0.45">
    <line x1="562" y1="100" x2="742" y2="100"/>
    <line x1="562" y1="120" x2="742" y2="120"/>
    <line x1="562" y1="140" x2="742" y2="140"/>
    <line x1="562" y1="200" x2="742" y2="200"/>
    <line x1="562" y1="260" x2="742" y2="260"/>
    <line x1="562" y1="280" x2="742" y2="280"/>
  </g>
  <ellipse cx="620" cy="160" rx="38" ry="16" fill="#1a1008" opacity="0.55"/>
  <ellipse cx="700" cy="220" rx="38" ry="20" fill="#1a1008" opacity="0.6"/>
  <rect x="600" y="270" width="34" height="30" fill="#1a0c08" stroke="#3a2818" stroke-width="0.55"/>

  <!-- VANISHING POINT — distant street recedes -->
  <polygon points="180,300 562,300 460,140 280,140" fill="url(#i6p4p1street)"/>
  <!-- Street perspective -->
  <polygon points="180,140 280,140 232,80 138,80" fill="#605850" opacity="0.6"/>
  <polygon points="460,140 562,140 596,80 502,80" fill="#605850" opacity="0.6"/>
  <!-- Distant fog filling vanishing point -->
  <ellipse cx="370" cy="160" rx="120" ry="60" fill="url(#i6p4p1fog)" filter="url(#i6p4p1glow)" opacity="0.95"/>
  <!-- Distant building silhouettes barely visible in fog -->
  <rect x="290" y="120" width="40" height="40" fill="#605850" opacity="0.45"/>
  <rect x="335" y="110" width="34" height="50" fill="#605850" opacity="0.45"/>
  <rect x="375" y="115" width="44" height="45" fill="#605850" opacity="0.4"/>
  <rect x="425" y="125" width="34" height="35" fill="#605850" opacity="0.4"/>

  <!-- Cobbles -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M180,300 Q280,300 462,300 Q560,300 562,300"/>
    <path d="M180,310 Q280,308 462,308 Q560,310 562,310"/>
    <path d="M180,322 Q280,320 462,320 Q560,322 562,322"/>
    <path d="M180,338 Q280,336 462,336 Q560,338 562,338"/>
  </g>
  <g fill="#3a3028" opacity="0.55">
    <ellipse cx="220" cy="320" rx="6" ry="2"/>
    <ellipse cx="280" cy="316" rx="6" ry="2"/>
    <ellipse cx="340" cy="324" rx="5" ry="1.6"/>
    <ellipse cx="400" cy="318" rx="6" ry="2"/>
    <ellipse cx="460" cy="324" rx="5" ry="1.6"/>
    <ellipse cx="520" cy="320" rx="6" ry="2"/>
  </g>

  <!-- Gas lamps unlit -->
  <g transform="translate(170 230)">
    <rect x="-2" y="0" width="4" height="60" fill="#1a1410"/>
    <path d="M-7,-12 L7,-12 L4,0 L-4,0 Z" fill="#3a3028" stroke="#1a1008" stroke-width="0.55"/>
    <rect x="-5" y="-30" width="10" height="18" fill="#3a3028" stroke="#1a1008" stroke-width="0.55"/>
    <rect x="-3" y="-28" width="6" height="14" fill="#1a1410"/>
  </g>
  <g transform="translate(572 230)">
    <rect x="-2" y="0" width="4" height="60" fill="#1a1410"/>
    <path d="M-7,-12 L7,-12 L4,0 L-4,0 Z" fill="#3a3028" stroke="#1a1008" stroke-width="0.55"/>
    <rect x="-5" y="-30" width="10" height="18" fill="#3a3028" stroke="#1a1008" stroke-width="0.55"/>
    <rect x="-3" y="-28" width="6" height="14" fill="#1a1410"/>
  </g>

  <!-- DISTANT pedestrian: woman with basket (left mid-distance) -->
  <g transform="translate(220 240)" opacity="0.85">
    <ellipse cx="-4" cy="42" rx="6" ry="2" fill="#0a0408"/>
    <ellipse cx="6" cy="42" rx="6" ry="2" fill="#0a0408"/>
    <path d="M-8,4 L8,4 L11,42 L-11,42 Z" fill="#3a2820"/>
    <path d="M-12,-22 L12,-22 L10,4 L-10,4 Z" fill="#5a4030"/>
    <ellipse cx="0" cy="-30" rx="4.5" ry="6" fill="#a87838"/>
    <path d="M-5,-36 Q-3,-40 0,-40 Q3,-40 5,-36 L5,-30 Q3,-34 0,-34 Q-3,-34 -5,-30 Z" fill="#3a2418"/>
    <!-- Basket -->
    <rect x="-12" y="-10" width="10" height="8" fill="#5a3018" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="-11" y1="-12" x2="-3" y2="-12" stroke="#3a1808" stroke-width="0.55"/>
  </g>
  <!-- DISTANT pedestrian: man with handcart (right mid-distance) -->
  <g transform="translate(490 246)" opacity="0.85">
    <ellipse cx="-4" cy="38" rx="6" ry="2" fill="#0a0408"/>
    <ellipse cx="6" cy="38" rx="6" ry="2" fill="#0a0408"/>
    <path d="M-8,2 L8,2 L11,38 L-11,38 Z" fill="#3a2820"/>
    <path d="M-12,-26 L12,-26 L10,2 L-10,2 Z" fill="#5a4030"/>
    <ellipse cx="0" cy="-34" rx="4.5" ry="6" fill="#a87838"/>
    <ellipse cx="0" cy="-44" rx="6" ry="3" fill="#1a1008"/>
    <!-- Handcart -->
    <rect x="14" y="0" width="40" height="14" fill="#3a2818" stroke="#1a0c04" stroke-width="0.55"/>
    <circle cx="22" cy="22" r="6" fill="#3a2818" stroke="#1a0c04" stroke-width="0.55"/>
    <circle cx="46" cy="22" r="6" fill="#3a2818" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="2" y1="6" x2="14" y2="6" stroke="#3a2818" stroke-width="2"/>
  </g>

  <!-- Distant ghost figures in fog -->
  <ellipse cx="380" cy="200" rx="6" ry="14" fill="#605850" opacity="0.55"/>
  <ellipse cx="395" cy="196" rx="5" ry="12" fill="#605850" opacity="0.5"/>

  <!-- ===== THEODORE — center, walking toward camera, hands in pockets ===== -->
  <g transform="translate(371 304)">
    <!-- Boots scuffed -->
    <ellipse cx="-7" cy="22" rx="11" ry="4" fill="#1a0c04"/>
    <ellipse cx="9" cy="22" rx="11" ry="4" fill="#1a0c04"/>
    <line x1="-12" y1="20" x2="-2" y2="20" stroke="#3a2418" stroke-width="0.55" opacity="0.85"/>
    <line x1="4" y1="20" x2="14" y2="20" stroke="#3a2418" stroke-width="0.55" opacity="0.85"/>
    <!-- Patched wool trousers -->
    <path d="M-12,-66 L-2,-66 L-3,22 L-14,22 Z" fill="url(#i6p4p1theoTrousers)"/>
    <path d="M2,-66 L12,-66 L14,22 L3,22 Z" fill="url(#i6p4p1theoTrousers)"/>
    <!-- Patches at knees -->
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <!-- Stitch marks -->
    <line x1="-11" y1="-22" x2="-11" y2="-11" stroke="#1a0c04" stroke-width="0.3" stroke-dasharray="1 1"/>
    <line x1="-3" y1="-22" x2="-3" y2="-11" stroke="#1a0c04" stroke-width="0.3" stroke-dasharray="1 1"/>
    <line x1="3" y1="-20" x2="3" y2="-9" stroke="#1a0c04" stroke-width="0.3" stroke-dasharray="1 1"/>
    <line x1="11" y1="-20" x2="11" y2="-9" stroke="#1a0c04" stroke-width="0.3" stroke-dasharray="1 1"/>
    <!-- Belt -->
    <rect x="-12" y="-66" width="26" height="4" fill="#3a1808"/>
    <!-- Linen shirt + leather waistcoat -->
    <path d="M-13,-130 L-12,-66 L13,-66 L14,-130 Z" fill="#d4c4a8"/>
    <path d="M-15,-128 L-13,-66 L-2,-66 L-2,-128 Z" fill="url(#i6p4p1theoWaistcoat)"/>
    <path d="M14,-128 L15,-66 L2,-66 L2,-128 Z" fill="url(#i6p4p1theoWaistcoat)"/>
    <!-- WAISTCOAT BREAST POCKET (left side from his POV = right from camera = around x=4 to x=14, just below collar) -->
    <rect x="3" y="-118" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Pocket flap -->
    <path d="M3,-118 L14,-118 L14,-114 L3,-114 Z" fill="#5a3018" stroke="#1a0c04" stroke-width="0.4"/>
    <!-- Faintest blue-violet hint inside pocket -->
    <rect x="5" y="-114" width="7" height="9" fill="#5a3ad8" opacity="0.4" filter="url(#i6p4p1bloom)"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-110" r="1" fill="#3a1808"/>
    <circle cx="-2" cy="-90" r="1" fill="#3a1808"/>
    <circle cx="-2" cy="-70" r="1" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-8,-130 L0,-128 L8,-130 L8,-126 L0,-122 L-8,-126 Z" fill="#e0d4b8"/>
    <!-- ARMS - both hands in pockets — slightly hunched shoulders -->
    <path d="M-15,-128 L-22,-100 L-22,-72 L-12,-66 Z" fill="url(#i6p4p1theoWaistcoat)"/>
    <path d="M15,-128 L22,-100 L22,-72 L12,-66 Z" fill="url(#i6p4p1theoWaistcoat)"/>
    <!-- Linen sleeve at cuff -->
    <ellipse cx="-22" cy="-72" rx="3.5" ry="1.4" fill="#d4c4a8"/>
    <ellipse cx="22" cy="-72" rx="3.5" ry="1.4" fill="#d4c4a8"/>
    <!-- Hand fragments tucked into pocket openings (oil-stained) -->
    <ellipse cx="-22" cy="-70" rx="2.4" ry="1.4" fill="#a87838"/>
    <ellipse cx="22" cy="-70" rx="2.4" ry="1.4" fill="#a87838"/>
    <!-- Brass ring on left index finger -->
    <circle cx="-22" cy="-71" r="0.85" fill="#c89058" filter="url(#i6p4p1bloom)" opacity="0.85"/>

    <!-- Head + neck -->
    <rect x="-3" y="-138" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-152" rx="14" ry="16" fill="#a87838"/>
    <!-- Sandy-brown untidy hair -->
    <path d="M-13,-160 Q-10,-170 0,-172 Q10,-170 13,-160 L13,-150 Q9,-156 0,-156 Q-9,-156 -13,-150 Z" fill="#9a7038"/>
    <!-- Tousled tufts -->
    <path d="M-7,-168 L-5,-172 L-8,-172 Z" fill="#9a7038"/>
    <path d="M5,-168 L7,-172 L4,-172 Z" fill="#9a7038"/>
    <path d="M0,-170 L2,-174 L-2,-174 Z" fill="#9a7038"/>
    <!-- Eyes -->
    <ellipse cx="-4" cy="-152" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-4" cy="-152" r="0.7" fill="#5a3818"/>
    <ellipse cx="4" cy="-152" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="4" cy="-152" r="0.7" fill="#5a3818"/>
    <!-- Freckles -->
    <circle cx="-3" cy="-145" r="0.35" fill="#7a3018"/>
    <circle cx="0" cy="-144" r="0.35" fill="#7a3018"/>
    <circle cx="3" cy="-145" r="0.35" fill="#7a3018"/>
    <!-- Mouth - studied casual -->
    <path d="M-3,-141 L3,-141" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- CAPTION (top-left) -->
  <g>
    <rect x="14" y="14" width="296" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-weight="700" font-style="italic">CAPTION</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Clerkenwell. Eight-forty in the morning.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
