<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 370" width="366" height="370">
  <title>Issue 6 — Page 22 — Panel 2: Theodore's hands on knees, still — silence in the fingers</title>
  <desc>85mm close-up. Theodore's hands on patched wool trouser knees. Oil-stained fingers, small burn scar on knuckle, brass gear ring on left index catching candlelight point. Hands completely still — no fidgeting. Warm amber candlelight on skin and brass. Stillness of hands that are never still.</desc>

  <defs>
    <linearGradient id="i6p22p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <radialGradient id="i6p22p2candleHalo" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d8a060" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p22p2trouser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p22p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="50%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <radialGradient id="i6p22p2ringGleam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d89858" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p22p2bloom"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="i6p22p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i6p22p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="366" height="370" fill="url(#i6p22p2bg)"/>

  <!-- Candle halo wash from upper-right (off-frame candle direction) -->
  <ellipse cx="280" cy="40" rx="220" ry="180" fill="url(#i6p22p2candleHalo)" filter="url(#i6p22p2strongglow)"/>

  <!-- ===== PATCHED WOOL TROUSER KNEES (lower frame) ===== -->
  <rect x="0" y="200" width="366" height="170" fill="url(#i6p22p2trouser)"/>
  <!-- Wool texture -->
  <g stroke="#080604" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,210 Q90,208 180,210 Q260,212 366,210"/>
    <path d="M0,230 Q90,228 180,230 Q260,232 366,230"/>
    <path d="M0,250 Q90,248 180,250 Q260,252 366,250"/>
    <path d="M0,270 Q90,268 180,270 Q260,272 366,270"/>
    <path d="M0,290 Q90,288 180,290 Q260,292 366,290"/>
  </g>

  <!-- Knee patches -->
  <rect x="40" y="200" width="100" height="80" fill="#5a3018" stroke="#3a1808" stroke-width="0.85" opacity="0.85"/>
  <g stroke="#3a1808" stroke-width="0.55" opacity="0.7" fill="none">
    <path d="M40,210 L140,210"/>
    <path d="M40,250 L140,250"/>
    <path d="M50,200 L50,280"/>
    <path d="M90,200 L90,280"/>
    <path d="M130,200 L130,280"/>
  </g>
  <rect x="226" y="200" width="100" height="80" fill="#5a3018" stroke="#3a1808" stroke-width="0.85" opacity="0.85"/>
  <g stroke="#3a1808" stroke-width="0.55" opacity="0.7" fill="none">
    <path d="M226,210 L326,210"/>
    <path d="M226,250 L326,250"/>
    <path d="M236,200 L236,280"/>
    <path d="M276,200 L276,280"/>
    <path d="M316,200 L316,280"/>
  </g>

  <!-- ===== HANDS — resting on knees, completely still ===== -->
  <!-- LEFT hand (left side of frame) -->
  <g transform="translate(90 200)">
    <!-- Palm/back of hand -->
    <path d="M-40,0 L-44,-22 L-30,-50 L-10,-58 L20,-50 L30,-22 L26,0 Z" fill="url(#i6p22p2skin)"/>
    <!-- Tendons -->
    <line x1="-30" y1="-30" x2="14" y2="-22" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>
    <line x1="-32" y1="-18" x2="20" y2="-10" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>
    <line x1="-32" y1="-6" x2="22" y2="2" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>

    <!-- Knuckles (4 fingers visible above knee) -->
    <ellipse cx="-22" cy="-44" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <ellipse cx="-8" cy="-50" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <ellipse cx="6" cy="-50" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <ellipse cx="20" cy="-46" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <!-- Highlight on knuckles -->
    <ellipse cx="-22" cy="-46" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>
    <ellipse cx="-8" cy="-52" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>
    <ellipse cx="6" cy="-52" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>
    <ellipse cx="20" cy="-48" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>

    <!-- BURN SCAR on one knuckle (middle) -->
    <ellipse cx="-8" cy="-46" rx="2" ry="1" fill="#5a2818" opacity="0.85"/>
    <line x1="-10" y1="-46" x2="-6" y2="-46" stroke="#3a1808" stroke-width="0.55"/>

    <!-- OIL STAINS on fingers -->
    <ellipse cx="-22" cy="-30" rx="6" ry="2" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="14" cy="-22" rx="8" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="0" cy="-12" rx="8" ry="2" fill="#1a0c04" opacity="0.4"/>

    <!-- BRASS GEAR RING on left index (most extended finger) -->
    <ellipse cx="-22" cy="-44" rx="7" ry="4" fill="none" stroke="#d89858" stroke-width="1.0" filter="url(#i6p22p2bloom)"/>
    <!-- Gear teeth -->
    <g stroke="#d89858" stroke-width="0.55" opacity="0.95">
      <line x1="-29" y1="-44" x2="-31" y2="-44"/>
      <line x1="-15" y1="-44" x2="-13" y2="-44"/>
      <line x1="-22" y1="-49" x2="-22" y2="-51"/>
      <line x1="-22" y1="-39" x2="-22" y2="-37"/>
      <line x1="-27" y1="-48" x2="-29" y2="-50"/>
      <line x1="-17" y1="-48" x2="-15" y2="-50"/>
      <line x1="-27" y1="-40" x2="-29" y2="-38"/>
      <line x1="-17" y1="-40" x2="-15" y2="-38"/>
    </g>
    <!-- Inner hub -->
    <circle cx="-22" cy="-44" r="3" fill="#a87838"/>
    <circle cx="-22" cy="-44" r="1.4" fill="#7a4818"/>
    <!-- Catching candle gleam — single bright point -->
    <ellipse cx="-19" cy="-46" rx="2" ry="1" fill="url(#i6p22p2ringGleam)" filter="url(#i6p22p2bloom)"/>
    <circle cx="-19" cy="-46" r="0.85" fill="#fff" filter="url(#i6p22p2bloom)"/>
  </g>

  <!-- RIGHT hand (right side of frame) -->
  <g transform="translate(276 200)">
    <path d="M-30,0 L-30,-22 L-20,-50 L0,-58 L20,-50 L30,-22 L40,0 Z" fill="url(#i6p22p2skin)"/>
    <line x1="-20" y1="-30" x2="20" y2="-22" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>
    <line x1="-22" y1="-18" x2="20" y2="-10" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>
    <line x1="-22" y1="-6" x2="22" y2="2" stroke="#5a3818" stroke-width="0.55" opacity="0.55"/>

    <!-- Knuckles -->
    <ellipse cx="-12" cy="-46" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <ellipse cx="0" cy="-50" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <ellipse cx="12" cy="-50" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <ellipse cx="22" cy="-44" rx="6" ry="3" fill="url(#i6p22p2skin)"/>
    <ellipse cx="-12" cy="-48" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>
    <ellipse cx="0" cy="-52" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>
    <ellipse cx="12" cy="-52" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>
    <ellipse cx="22" cy="-46" rx="3" ry="1" fill="#f0c898" filter="url(#i6p22p2bloom)" opacity="0.85"/>

    <!-- Oil stain on right hand -->
    <ellipse cx="0" cy="-22" rx="9" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="14" cy="-12" rx="6" ry="1.4" fill="#1a0c04" opacity="0.4"/>

    <!-- Tiny solder mark / dirt -->
    <circle cx="-8" cy="-40" r="0.7" fill="#1a0c04" opacity="0.85"/>
    <circle cx="6" cy="-38" r="0.7" fill="#1a0c04" opacity="0.7"/>
  </g>

  <!-- Caption -->
  <g>
    <rect x="14" y="14" width="338" height="34" rx="2" fill="#f5ecd8" stroke="#5a4a30" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">"Hands that built. Hands that turned</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">the ring. Tonight, still."</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q100,142 200,138 Q280,136 366,140"/>
    <path d="M0,300 Q100,302 200,298 Q280,296 366,300"/>
  </g>
</svg>
