<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 6 — Page 21 — Panel 1: Theodore stops in fog, reads Luma's reaction — folklore becomes fact</title>
  <desc>35mm medium eye level. Theodore stopped between gas lamps. Amber lamp behind, amber barely visible ahead, gap between them grey-dark. Looking down at Luma in pocket. Her scanner sweeping blue-violet through fog. Theodore's face half-lit by distant lamp behind, half in shadow. The dawning understanding. THEODORE: "You know what they are." LUMA: "Yes." THEODORE: "They're real." LUMA: "They've been here a very long time, Theodore."</desc>

  <defs>
    <linearGradient id="i6p21p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3438"/>
      <stop offset="50%" stop-color="#5a5560"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <radialGradient id="i6p21p1lampHaloRear" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d8a060" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p21p1lampHaloFar" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8a060" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p21p1scannerBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p21p1building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1014"/>
      <stop offset="100%" stop-color="#080406"/>
    </linearGradient>
    <linearGradient id="i6p21p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2228"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <filter id="i6p21p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p21p1glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p21p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i6p21p1megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="742" height="320" fill="url(#i6p21p1bg)"/>

  <!-- Buildings receding/leaning inward — older neighborhood -->
  <path d="M0,0 L0,260 L200,260 L180,40 L140,30 L140,80 L100,75 L100,40 L60,30 L60,90 L20,80 L20,40 Z" fill="url(#i6p21p1building)"/>
  <path d="M742,0 L742,260 L542,260 L562,40 L602,30 L602,80 L642,75 L642,40 L682,30 L682,90 L722,80 L722,40 Z" fill="url(#i6p21p1building)"/>

  <!-- AMBER GLOW BEHIND (rear, right edge of frame) -->
  <ellipse cx="700" cy="120" rx="100" ry="80" fill="url(#i6p21p1lampHaloRear)" filter="url(#i6p21p1megaglow)"/>
  <!-- Lamp post barely visible -->
  <line x1="700" y1="120" x2="700" y2="240" stroke="#1a0c08" stroke-width="1.4" opacity="0.55"/>

  <!-- AMBER GLOW FAR AHEAD (faint, left, distant) -->
  <ellipse cx="50" cy="140" rx="60" ry="50" fill="url(#i6p21p1lampHaloFar)" filter="url(#i6p21p1megaglow)" opacity="0.7"/>
  <!-- Distant tiny core -->
  <circle cx="50" cy="140" r="6" fill="#d89858" opacity="0.7" filter="url(#i6p21p1bloom)"/>

  <!-- Heavy grey-dark fog in the middle gap -->
  <g fill="#5a5860" opacity="0.7">
    <ellipse cx="280" cy="140" rx="180" ry="40"/>
    <ellipse cx="500" cy="160" rx="160" ry="36"/>
  </g>
  <g fill="#7a7880" opacity="0.55">
    <ellipse cx="350" cy="170" rx="200" ry="22"/>
    <ellipse cx="560" cy="200" rx="180" ry="20"/>
  </g>

  <!-- Cobblestones (less light here) -->
  <rect x="0" y="240" width="742" height="80" fill="url(#i6p21p1cobble)"/>
  <ellipse cx="700" cy="280" rx="80" ry="4" fill="#a87838" opacity="0.4" filter="url(#i6p21p1glow)"/>
  <ellipse cx="50" cy="280" rx="50" ry="3" fill="#a87838" opacity="0.3" filter="url(#i6p21p1glow)"/>
  <g stroke="#080608" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,260 L742,260"/>
    <path d="M0,275 L742,275"/>
    <path d="M0,290 L742,290"/>
    <path d="M0,305 L742,305"/>
  </g>

  <!-- ===== SCANNER SWEEP — blue-violet through fog around Theodore ===== -->
  <g opacity="0.85">
    <ellipse cx="371" cy="200" rx="200" ry="70" fill="url(#i6p21p1scannerBeam)" filter="url(#i6p21p1strongglow)" opacity="0.4"/>
    <ellipse cx="371" cy="200" rx="120" ry="40" fill="url(#i6p21p1scannerBeam)" filter="url(#i6p21p1bloom)" opacity="0.55"/>
  </g>
  <!-- Scanner beam line trailing left through fog -->
  <path d="M371,200 L300,180 L240,200 L180,170 L120,200" stroke="#a888ff" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#i6p21p1bloom)"/>
  <path d="M371,200 L440,180 L500,210 L560,180 L620,210" stroke="#a888ff" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#i6p21p1bloom)"/>

  <!-- ===== THEODORE — STILL, looking down at pocket ===== -->
  <g transform="translate(371 270)">
    <!-- Cast shadow -->
    <ellipse cx="0" cy="2" rx="14" ry="2" fill="#000" opacity="0.85"/>

    <!-- Boots together (stopped) -->
    <ellipse cx="-7" cy="0" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="7" cy="0" rx="5" ry="2" fill="#1a0c04"/>

    <!-- Trousers — straight, stopped -->
    <path d="M-9,-2 L-12,-50 L-2,-50 Z" fill="#3a3028"/>
    <path d="M9,-2 L12,-50 L2,-50 Z" fill="#3a3028"/>

    <!-- Waistcoat -->
    <path d="M-12,-50 L-12,-90 L12,-90 L12,-50 Z" fill="#d4c4a8"/>
    <path d="M-14,-88 L-12,-50 L-2,-50 L-2,-88 Z" fill="#5a3018"/>
    <path d="M14,-88 L12,-50 L2,-50 L2,-88 Z" fill="#5a3018"/>
    <circle cx="-2" cy="-80" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-72" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-64" r="0.85" fill="#3a1808"/>

    <!-- Linen collar -->
    <path d="M-7,-90 L0,-88 L7,-90 L7,-86 L0,-83 L-7,-86 Z" fill="#e0d4b8"/>

    <!-- Right hand DOWN at side, BRASS GEAR RING visible (still) -->
    <path d="M14,-88 L20,-66 L18,-46 L10,-50 Z" fill="#5a3018"/>
    <ellipse cx="20" cy="-46" rx="3" ry="2" fill="#a87838"/>
    <circle cx="20" cy="-46" r="1.4" fill="none" stroke="#d89858" stroke-width="0.55" filter="url(#i6p21p1bloom)"/>

    <!-- LEFT hand at chest, looking down at pocket -->
    <path d="M-12,-86 L-22,-66 L-18,-50 L-8,-58 Z" fill="#5a3018"/>
    <ellipse cx="-18" cy="-50" rx="3.5" ry="2.4" fill="#a87838"/>

    <!-- POCKET — bright blue-violet -->
    <rect x="3" y="-84" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
    <ellipse cx="9" cy="-78" rx="9" ry="6" fill="url(#i6p21p1scannerBeam)" filter="url(#i6p21p1strongglow)"/>

    <!-- LUMA in pocket — looking up, lenses bright -->
    <g transform="translate(9 -78)">
      <ellipse cx="0" cy="0" rx="2" ry="1.4" fill="#7a4838"/>
      <ellipse cx="-0.7" cy="0" rx="0.55" ry="0.4" fill="#a888ff" filter="url(#i6p21p1bloom)" opacity="0.95"/>
      <ellipse cx="0.7" cy="0" rx="0.55" ry="0.4" fill="#a888ff" filter="url(#i6p21p1bloom)" opacity="0.95"/>
      <line x1="-1.4" y1="-0.4" x2="1.4" y2="-0.4" stroke="#a8a098" stroke-width="0.3" opacity="0.85"/>
    </g>

    <!-- Head — looking down at pocket -->
    <ellipse cx="-3" cy="-104" rx="11" ry="12" fill="#a87838"/>
    <!-- HALF-LIT FACE — right side amber from rear lamp, left half shadow -->
    <path d="M-3,-116 L-14,-104 L-14,-92 L-3,-92 Z" fill="#7a4818" opacity="0.7"/>
    <!-- Sandy-brown hair -->
    <path d="M-13,-114 Q-10,-122 -3,-124 Q4,-122 7,-114 L7,-105 Q4,-110 -3,-110 Q-10,-110 -13,-105 Z" fill="#9a7038"/>
    <!-- Amber backlight on right side of hair -->
    <ellipse cx="3" cy="-118" rx="6" ry="2" fill="#d8a060" opacity="0.85" filter="url(#i6p21p1bloom)"/>

    <!-- Eyes — fixed DOWN on Luma — hazel -->
    <ellipse cx="-6" cy="-100" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="0" cy="-100" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="-6" cy="-99" rx="0.85" ry="0.7" fill="#7a4818"/>
    <ellipse cx="0" cy="-99" rx="0.85" ry="0.7" fill="#7a4818"/>
    <circle cx="-6" cy="-100" r="0.3" fill="#fff"/>
    <circle cx="0" cy="-100" r="0.3" fill="#fff"/>

    <!-- Brow — slightly raised (dawning understanding) -->
    <path d="M-10,-110 Q-7,-112 -3,-110" stroke="#5a3018" stroke-width="0.7" fill="none"/>
    <path d="M3,-110 Q0,-112 -3,-110" stroke="#5a3018" stroke-width="0.7" fill="none"/>

    <!-- Mouth — slightly parted -->
    <ellipse cx="-3" cy="-94" rx="2" ry="1" fill="#3a1808"/>
  </g>

  <!-- THEODORE dialogue 1 -->
  <g>
    <rect x="14" y="14" width="280" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="200,54 212,54 204,64" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="200.5" y1="54" x2="211.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">You know what they are. The Tall Ones.</text>

  <!-- Beat -->
  <text x="320" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">(Beat.)</text>

  <!-- LUMA dialogue 1 -->
  <g>
    <rect x="488" y="14" width="100" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95"/>
    <polygon points="520,54 532,54 524,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="520.5" y1="54" x2="531.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="496" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="496" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Yes.</text>

  <!-- THEODORE dialogue 2 -->
  <g>
    <rect x="600" y="14" width="128" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="640,54 652,54 644,64" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="640.5" y1="54" x2="651.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="608" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="608" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">They're real.</text>

  <!-- LUMA dialogue 2 -->
  <g>
    <rect x="14" y="266" width="320" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95"/>
    <polygon points="160,266 172,266 164,256" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="160.5" y1="266" x2="171.5" y2="266" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">They've been here a very long time, Theodore.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
