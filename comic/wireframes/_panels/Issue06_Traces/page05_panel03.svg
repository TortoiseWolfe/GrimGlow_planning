<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 5 — Panel 3: Wide alley — Theodore peers through factory window at impossible metalwork</title>
  <desc>28mm wide eye level looking down narrow alley toward courtyard. Theodore at ground-level window. Through grimy glass: warm amber forge interior, ordinary metalworker, but a crystalline lattice piece beside him — too precise for the era.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p5p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p5p3brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p5p3brickL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p5p3forge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa48"/>
      <stop offset="100%" stop-color="#a85818"/>
    </linearGradient>
    <linearGradient id="i6p5p3theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p5p3theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p5p3forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85818" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p5p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p5p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p5p3bg)"/>

  <!-- LEFT alley wall (same as P5P1, factory exterior) -->
  <rect x="0" y="0" width="180" height="364" fill="url(#i6p5p3brickL)"/>
  <g stroke="#0a0408" stroke-width="0.45" opacity="0.7">
    <line x1="0" y1="40" x2="180" y2="40"/>
    <line x1="0" y1="80" x2="180" y2="80"/>
    <line x1="0" y1="120" x2="180" y2="120"/>
    <line x1="0" y1="160" x2="180" y2="160"/>
    <line x1="0" y1="200" x2="180" y2="200"/>
    <line x1="0" y1="240" x2="180" y2="240"/>
    <line x1="0" y1="280" x2="180" y2="280"/>
    <line x1="0" y1="320" x2="180" y2="320"/>
  </g>
  <g stroke="#0a0408" stroke-width="2.4" opacity="0.55" fill="none">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="280"/>
  </g>

  <!-- Vanishing alley toward courtyard -->
  <polygon points="180,80 562,80 480,300 240,300" fill="#1a1008"/>
  <!-- COURTYARD floor with cobbles -->
  <polygon points="240,300 480,300 562,364 180,364" fill="#1a1410"/>
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M180,320 L562,320"/>
    <path d="M180,340 L562,340"/>
    <path d="M180,358 L562,358"/>
  </g>

  <!-- COURTYARD back wall (factory) with WINDOW -->
  <rect x="240" y="80" width="240" height="220" fill="#1a1008"/>
  <g stroke="#0a0408" stroke-width="0.45" opacity="0.7">
    <line x1="240" y1="120" x2="480" y2="120"/>
    <line x1="240" y1="160" x2="480" y2="160"/>
    <line x1="240" y1="200" x2="480" y2="200"/>
    <line x1="240" y1="240" x2="480" y2="240"/>
    <line x1="240" y1="280" x2="480" y2="280"/>
  </g>
  <!-- Soot streaks -->
  <ellipse cx="280" cy="180" rx="28" ry="50" fill="#0a0408" opacity="0.7"/>
  <ellipse cx="440" cy="160" rx="22" ry="40" fill="#0a0408" opacity="0.65"/>

  <!-- ===== GROUND-LEVEL FACTORY WINDOW — large, central, warm amber inside ===== -->
  <rect x="290" y="180" width="140" height="100" fill="url(#i6p5p3forge)" filter="url(#i6p5p3glow)" opacity="0.85"/>
  <!-- Window frame -->
  <rect x="290" y="180" width="140" height="100" fill="none" stroke="#3a1808" stroke-width="2.4"/>
  <line x1="360" y1="180" x2="360" y2="280" stroke="#3a1808" stroke-width="1.4"/>
  <line x1="290" y1="226" x2="430" y2="226" stroke="#3a1808" stroke-width="1.4"/>
  <!-- Grime on glass -->
  <ellipse cx="320" cy="200" rx="14" ry="9" fill="#1a1008" opacity="0.45"/>
  <ellipse cx="400" cy="248" rx="22" ry="11" fill="#1a1008" opacity="0.4"/>
  <line x1="296" y1="206" x2="306" y2="220" stroke="#1a1008" stroke-width="0.55" opacity="0.55"/>
  <line x1="412" y1="232" x2="424" y2="246" stroke="#1a1008" stroke-width="0.55" opacity="0.55"/>
  <!-- Forge light spilling through window onto cobbles -->
  <ellipse cx="360" cy="298" rx="100" ry="20" fill="url(#i6p5p3forgeGlow)" filter="url(#i6p5p3glow)" opacity="0.7"/>

  <!-- Through window: METALWORKER at bench, WARM AMBER side lighting -->
  <!-- Forge glow source on right inside -->
  <ellipse cx="410" cy="240" rx="22" ry="14" fill="#ffaa48" filter="url(#i6p5p3glow)" opacity="0.85"/>
  <ellipse cx="410" cy="240" rx="14" ry="9" fill="#fff8e8" filter="url(#i6p5p3bloom)" opacity="0.85"/>
  <!-- Workbench -->
  <rect x="296" y="244" width="128" height="34" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
  <line x1="296" y1="252" x2="424" y2="252" stroke="#1a0c04" stroke-width="0.4"/>
  <!-- Worker silhouette in shirtsleeves + leather apron, hammer raised -->
  <g transform="translate(330 244)">
    <!-- Apron + body -->
    <path d="M-12,-22 L12,-22 L14,0 L-14,0 Z" fill="#3a1808"/>
    <path d="M-10,-32 L10,-32 L12,-20 L-12,-20 Z" fill="#a85818"/>
    <!-- Apron ties -->
    <line x1="-12" y1="-22" x2="-16" y2="-30" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="12" y1="-22" x2="16" y2="-30" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Arms holding hammer -->
    <path d="M-12,-32 L-22,-22 L-14,-12 Z" fill="#a85818"/>
    <path d="M12,-32 L22,-26 L18,-16 Z" fill="#a85818"/>
    <!-- Hammer raised -->
    <rect x="-30" y="-28" width="14" height="3" fill="#1a0c04"/>
    <rect x="-28" y="-32" width="6" height="11" fill="#3a3038"/>
    <!-- Head -->
    <ellipse cx="0" cy="-40" rx="6" ry="7" fill="#a85818"/>
    <!-- Hair -->
    <path d="M-6,-46 Q-4,-50 0,-50 Q4,-50 6,-46 L6,-40 Q3,-44 0,-44 Q-3,-44 -6,-40 Z" fill="#3a1808"/>
    <!-- Eyes (focused on impossible piece) -->
    <ellipse cx="-2" cy="-40" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <ellipse cx="2" cy="-40" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <!-- Mouth -->
    <path d="M-2,-32 L2,-32" stroke="#1a0c04" stroke-width="0.45"/>
  </g>

  <!-- ===== IMPOSSIBLE METALWORK on bench beside worker — crystalline lattice in iron ===== -->
  <g transform="translate(390 254)">
    <!-- Base lattice — far too precise for hand tools, geometric perfection -->
    <g stroke="#fff8e8" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#i6p5p3bloom)">
      <circle cx="-12" cy="-4" r="1.4"/>
      <circle cx="-4" cy="-8" r="1.4"/>
      <circle cx="4" cy="-4" r="1.4"/>
      <circle cx="-8" cy="0" r="1.4"/>
      <circle cx="0" cy="-2" r="1.4"/>
      <circle cx="8" cy="0" r="1.4"/>
      <circle cx="-4" cy="4" r="1.4"/>
      <circle cx="4" cy="4" r="1.4"/>
      <line x1="-12" y1="-4" x2="-4" y2="-8"/>
      <line x1="-4" y1="-8" x2="4" y2="-4"/>
      <line x1="-12" y1="-4" x2="-8" y2="0"/>
      <line x1="-4" y1="-8" x2="0" y2="-2"/>
      <line x1="4" y1="-4" x2="8" y2="0"/>
      <line x1="-8" y1="0" x2="0" y2="-2"/>
      <line x1="0" y1="-2" x2="8" y2="0"/>
      <line x1="-8" y1="0" x2="-4" y2="4"/>
      <line x1="0" y1="-2" x2="-4" y2="4"/>
      <line x1="0" y1="-2" x2="4" y2="4"/>
      <line x1="8" y1="0" x2="4" y2="4"/>
    </g>
    <!-- Faint glow — the impossible thing hums -->
    <ellipse cx="-2" cy="-2" rx="22" ry="14" fill="#fff8e8" opacity="0.45" filter="url(#i6p5p3glow)"/>
  </g>

  <!-- Other workshop objects on bench (anvil, ordinary tools) -->
  <rect x="298" y="252" width="22" height="22" fill="#1a0c04"/>
  <rect x="300" y="248" width="18" height="6" fill="#3a3038"/>

  <!-- ===== THEODORE peering through window (foreground left of window) ===== -->
  <g transform="translate(220 280)">
    <!-- Boots -->
    <ellipse cx="-7" cy="22" rx="9" ry="3" fill="#1a0c04"/>
    <ellipse cx="9" cy="22" rx="9" ry="3" fill="#1a0c04"/>
    <!-- Trousers -->
    <path d="M-10,-34 L-2,-34 L-3,22 L-12,22 Z" fill="url(#i6p5p3theoTrousers)"/>
    <path d="M2,-34 L10,-34 L13,22 L4,22 Z" fill="url(#i6p5p3theoTrousers)"/>
    <!-- Belt -->
    <rect x="-10" y="-34" width="22" height="3" fill="#3a1808"/>
    <!-- Linen + waistcoat (slightly turned, bent forward looking through window) -->
    <path d="M-11,-86 L-10,-34 L11,-34 L12,-86 Z" fill="#d4c4a8"/>
    <path d="M-13,-84 L-11,-34 L-2,-34 L-2,-84 Z" fill="url(#i6p5p3theoWaistcoat)"/>
    <path d="M12,-84 L13,-34 L2,-34 L2,-84 Z" fill="url(#i6p5p3theoWaistcoat)"/>
    <!-- Pocket -->
    <rect x="3" y="-78" width="9" height="12" fill="#3a1808" stroke="#1a0c04" stroke-width="0.45"/>
    <rect x="5" y="-74" width="5" height="8" fill="#5a3ad8" opacity="0.55" filter="url(#i6p5p3bloom)"/>
    <ellipse cx="8" cy="-72" rx="11" ry="5" fill="#a888ff" opacity="0.45" filter="url(#i6p5p3glow)"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-74" r="0.7" fill="#3a1808"/>
    <circle cx="-2" cy="-58" r="0.7" fill="#3a1808"/>
    <circle cx="-2" cy="-44" r="0.7" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-6,-86 L0,-84 L6,-86 L6,-82 L0,-78 L-6,-82 Z" fill="#e0d4b8"/>
    <!-- Arms — body bent slightly forward, hands at chest -->
    <path d="M-13,-84 L-20,-66 L-20,-46 L-12,-44 Z" fill="url(#i6p5p3theoWaistcoat)"/>
    <path d="M13,-84 L20,-66 L18,-46 L4,-46 L4,-66 Z" fill="url(#i6p5p3theoWaistcoat)"/>
    <ellipse cx="-20" cy="-46" rx="2" ry="1.2" fill="#a87838"/>
    <ellipse cx="6" cy="-44" rx="2" ry="1.2" fill="#a87838"/>
    <!-- Head leaning toward window -->
    <rect x="-3" y="-92" width="6" height="6" fill="#a87838"/>
    <ellipse cx="0" cy="-104" rx="11" ry="13" fill="#a87838"/>
    <path d="M-11,-112 Q-8,-122 0,-124 Q8,-122 11,-112 L11,-104 Q7,-110 0,-110 Q-7,-110 -11,-104 Z" fill="#9a7038"/>
    <path d="M-6,-118 L-4,-122 L-7,-122 Z" fill="#9a7038"/>
    <path d="M5,-118 L7,-122 L4,-122 Z" fill="#9a7038"/>
    <!-- Eyes — looking right (into window) -->
    <ellipse cx="-3" cy="-104" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-2" cy="-104" r="0.7" fill="#5a3818"/>
    <ellipse cx="4" cy="-104" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="5" cy="-104" r="0.7" fill="#5a3818"/>
    <path d="M-6,-110 L-2,-110" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M2,-110 L6,-110" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth — concerned -->
    <path d="M-3,-94 L3,-94" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Warm amber rim from window catching face right side -->
    <path d="M11,-104 Q14,-90 12,-78" stroke="#ffaa48" stroke-width="0.7" fill="none" opacity="0.85" filter="url(#i6p5p3bloom)"/>
  </g>

  <!-- THEODORE dialogue 1 (top-left) -->
  <g>
    <rect x="14" y="14" width="396" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,54 172,54 164,64" fill="white" stroke="#6a4220" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="54" x2="171.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700" font-style="italic">THEODORE (low)</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">That's Bill Granger's boy. He's a fitter. Does hinges and brackets.</text>

  <!-- THEODORE dialogue 2 (right-mid) -->
  <g>
    <rect x="500" y="64" width="228" height="42" rx="2" fill="white" stroke="#6a4220" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="568,106 580,106 572,116" fill="white" stroke="#6a4220" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="568.5" y1="106" x2="579.5" y2="106" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="508" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700" font-style="italic">THEODORE (low)</text>
  <text x="508" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">That... that's not a hinge.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
