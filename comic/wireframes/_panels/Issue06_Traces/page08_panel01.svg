<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 248.9" width="742" height="248.9">
  <title>Issue 6 — Page 8 — Panel 1: Sekforde Street narrow alley — claw marks above + targeting reticle</title>
  <desc>24mm wide widescreen establishing eye level. Narrow Victorian street, fog as a lid, dark soot brick both sides, distant amber gas lamp around bend. Theodore mid-frame. Above his eyeline at ~8ft on right wall: four parallel gouges + faint blue-violet targeting reticle.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p8p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#403830"/>
      <stop offset="60%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p8p1brickL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p8p1brickR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="i6p8p1fog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#605850" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2a2420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p8p1lampDist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p8p1reticle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p8p1theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p8p1theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="i6p8p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p8p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="248.9" fill="url(#i6p8p1bg)"/>

  <!-- FOG LID — heavy, dominating upper third -->
  <rect width="742" height="60" fill="#5a5048" opacity="0.85"/>
  <ellipse cx="371" cy="40" rx="500" ry="70" fill="url(#i6p8p1fog)" filter="url(#i6p8p1glow)" opacity="0.95"/>

  <!-- LEFT brick wall — narrow alley, looms close -->
  <rect x="0" y="40" width="220" height="180" fill="url(#i6p8p1brickL)"/>
  <rect x="0" y="40" width="220" height="40" fill="url(#i6p8p1fog)" opacity="0.7"/>
  <!-- Brick mortar grid -->
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.85">
    <line x1="0" y1="80" x2="220" y2="80"/>
    <line x1="0" y1="100" x2="220" y2="100"/>
    <line x1="0" y1="120" x2="220" y2="120"/>
    <line x1="0" y1="140" x2="220" y2="140"/>
    <line x1="0" y1="160" x2="220" y2="160"/>
    <line x1="0" y1="180" x2="220" y2="180"/>
    <line x1="0" y1="200" x2="220" y2="200"/>
    <line x1="40" y1="80" x2="40" y2="100"/>
    <line x1="100" y1="80" x2="100" y2="100"/>
    <line x1="160" y1="80" x2="160" y2="100"/>
    <line x1="20" y1="100" x2="20" y2="120"/>
    <line x1="80" y1="100" x2="80" y2="120"/>
    <line x1="140" y1="100" x2="140" y2="120"/>
    <line x1="200" y1="100" x2="200" y2="120"/>
    <line x1="40" y1="120" x2="40" y2="140"/>
    <line x1="100" y1="120" x2="100" y2="140"/>
    <line x1="160" y1="120" x2="160" y2="140"/>
    <line x1="20" y1="140" x2="20" y2="160"/>
    <line x1="80" y1="140" x2="80" y2="160"/>
    <line x1="140" y1="140" x2="140" y2="160"/>
    <line x1="200" y1="140" x2="200" y2="160"/>
    <line x1="40" y1="160" x2="40" y2="180"/>
    <line x1="100" y1="160" x2="100" y2="180"/>
    <line x1="160" y1="160" x2="160" y2="180"/>
  </g>
  <!-- Soot streaks vertical -->
  <g stroke="#0a0408" stroke-width="3" opacity="0.55" fill="none">
    <line x1="60" y1="40" x2="60" y2="180"/>
    <line x1="120" y1="40" x2="120" y2="160"/>
    <line x1="180" y1="40" x2="180" y2="180"/>
  </g>

  <!-- RIGHT brick wall — receding into distance, with the CLAW MARKS -->
  <rect x="500" y="40" width="242" height="180" fill="url(#i6p8p1brickR)"/>
  <rect x="500" y="40" width="242" height="40" fill="url(#i6p8p1fog)" opacity="0.7"/>
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.85">
    <line x1="500" y1="80" x2="742" y2="80"/>
    <line x1="500" y1="100" x2="742" y2="100"/>
    <line x1="500" y1="120" x2="742" y2="120"/>
    <line x1="500" y1="140" x2="742" y2="140"/>
    <line x1="500" y1="160" x2="742" y2="160"/>
    <line x1="500" y1="180" x2="742" y2="180"/>
    <line x1="500" y1="200" x2="742" y2="200"/>
    <line x1="540" y1="80" x2="540" y2="100"/>
    <line x1="600" y1="80" x2="600" y2="100"/>
    <line x1="660" y1="80" x2="660" y2="100"/>
    <line x1="720" y1="80" x2="720" y2="100"/>
    <line x1="520" y1="100" x2="520" y2="120"/>
    <line x1="580" y1="100" x2="580" y2="120"/>
    <line x1="640" y1="100" x2="640" y2="120"/>
    <line x1="700" y1="100" x2="700" y2="120"/>
    <line x1="540" y1="120" x2="540" y2="140"/>
    <line x1="600" y1="120" x2="600" y2="140"/>
    <line x1="660" y1="120" x2="660" y2="140"/>
    <line x1="720" y1="120" x2="720" y2="140"/>
    <line x1="520" y1="140" x2="520" y2="160"/>
    <line x1="580" y1="140" x2="580" y2="160"/>
    <line x1="640" y1="140" x2="640" y2="160"/>
    <line x1="700" y1="140" x2="700" y2="160"/>
  </g>
  <g stroke="#0a0408" stroke-width="3" opacity="0.55" fill="none">
    <line x1="540" y1="40" x2="540" y2="180"/>
    <line x1="620" y1="40" x2="620" y2="180"/>
    <line x1="700" y1="40" x2="700" y2="160"/>
  </g>

  <!-- ===== CLAW MARKS — four parallel gouges in right wall above head height ===== -->
  <!-- At approximately ~8ft = upper portion of right wall above Theodore's eyeline -->
  <g transform="translate(620 100)">
    <!-- Pale clay revealed beneath each gouge -->
    <path d="M-20,-12 L-2,30" stroke="#7a5a40" stroke-width="3" opacity="0.85"/>
    <path d="M-12,-12 L6,30" stroke="#7a5a40" stroke-width="3" opacity="0.85"/>
    <path d="M-4,-12 L14,30" stroke="#7a5a40" stroke-width="3" opacity="0.85"/>
    <path d="M4,-12 L22,30" stroke="#7a5a40" stroke-width="3" opacity="0.85"/>
    <!-- Inner darker gouge core -->
    <path d="M-19,-10 L-3,28" stroke="#1a0c04" stroke-width="1.2" opacity="0.95"/>
    <path d="M-11,-10 L5,28" stroke="#1a0c04" stroke-width="1.2" opacity="0.95"/>
    <path d="M-3,-10 L13,28" stroke="#1a0c04" stroke-width="1.2" opacity="0.95"/>
    <path d="M5,-10 L21,28" stroke="#1a0c04" stroke-width="1.2" opacity="0.95"/>
    <!-- Tapered tips at top (where claws started) -->
    <path d="M-20,-12 L-22,-16" stroke="#7a5a40" stroke-width="1.4" opacity="0.85"/>
    <path d="M-12,-12 L-14,-16" stroke="#7a5a40" stroke-width="1.4" opacity="0.85"/>
    <path d="M-4,-12 L-6,-16" stroke="#7a5a40" stroke-width="1.4" opacity="0.85"/>
    <path d="M4,-12 L2,-16" stroke="#7a5a40" stroke-width="1.4" opacity="0.85"/>
    <!-- Iridescent residue in grooves -->
    <path d="M-19,-10 L-3,28" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p1bloom)"/>
    <path d="M-11,-10 L5,28" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p1bloom)"/>
    <path d="M-3,-10 L13,28" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p1bloom)"/>
    <path d="M5,-10 L21,28" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p1bloom)"/>

    <!-- TARGETING RETICLE projected on wall -->
    <circle cx="0" cy="8" r="22" fill="none" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#i6p8p1bloom)" stroke-dasharray="2 2"/>
    <ellipse cx="0" cy="8" rx="22" ry="22" fill="url(#i6p8p1reticle)" filter="url(#i6p8p1glow)" opacity="0.55"/>
    <line x1="-26" y1="8" x2="-22" y2="8" stroke="#a888ff" stroke-width="1" filter="url(#i6p8p1bloom)"/>
    <line x1="22" y1="8" x2="26" y2="8" stroke="#a888ff" stroke-width="1" filter="url(#i6p8p1bloom)"/>
    <line x1="0" y1="-18" x2="0" y2="-14" stroke="#a888ff" stroke-width="1" filter="url(#i6p8p1bloom)"/>
    <line x1="0" y1="30" x2="0" y2="34" stroke="#a888ff" stroke-width="1" filter="url(#i6p8p1bloom)"/>
  </g>

  <!-- VANISHING POINT — alley bends to the right ahead, distant amber lamp -->
  <polygon points="220,80 500,80 460,180 260,180" fill="#1a0c04"/>
  <ellipse cx="380" cy="140" rx="60" ry="40" fill="url(#i6p8p1fog)" filter="url(#i6p8p1glow)" opacity="0.95"/>
  <!-- Very distant gas lamp around bend -->
  <ellipse cx="400" cy="140" rx="14" ry="22" fill="url(#i6p8p1lampDist)" filter="url(#i6p8p1glow)" opacity="0.7"/>
  <ellipse cx="400" cy="140" rx="3" ry="5" fill="#ffaa48" opacity="0.85" filter="url(#i6p8p1bloom)"/>

  <!-- COBBLES foreground -->
  <rect x="0" y="220" width="742" height="28.9" fill="#1a1410"/>
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,228 Q200,226 400,228 Q580,230 742,228"/>
    <path d="M0,238 Q200,236 400,238 Q580,240 742,238"/>
  </g>

  <!-- ===== THEODORE — mid-distance, walking, hand trailing along brick ===== -->
  <g transform="translate(370 220)">
    <ellipse cx="-5" cy="0" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="6" cy="0" rx="5" ry="2" fill="#1a0c04"/>
    <path d="M-7,-44 L-2,-44 L-4,0 L-9,0 Z" fill="url(#i6p8p1theoTrousers)"/>
    <path d="M2,-44 L7,-44 L9,0 L4,0 Z" fill="url(#i6p8p1theoTrousers)"/>
    <rect x="-7" y="-44" width="14" height="2.4" fill="#3a1808"/>
    <path d="M-8,-86 L-7,-44 L7,-44 L8,-86 Z" fill="#d4c4a8"/>
    <path d="M-9,-84 L-7,-44 L-2,-44 L-2,-84 Z" fill="url(#i6p8p1theoWaistcoat)"/>
    <path d="M8,-84 L9,-44 L2,-44 L2,-84 Z" fill="url(#i6p8p1theoWaistcoat)"/>
    <!-- Pocket -->
    <rect x="2" y="-78" width="7" height="9" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="3" y="-76" width="5" height="6" fill="#5a3ad8" opacity="0.55" filter="url(#i6p8p1bloom)"/>
    <ellipse cx="6" cy="-72" rx="9" ry="5" fill="#a888ff" opacity="0.45" filter="url(#i6p8p1glow)"/>
    <!-- Linen collar -->
    <path d="M-4,-86 L0,-84 L4,-86 L4,-82 L0,-80 L-4,-82 Z" fill="#e0d4b8"/>
    <!-- LEFT arm trailing along brick wall -->
    <path d="M-9,-84 L-22,-66 L-30,-50 L-26,-46 L-18,-58 L-12,-72 Z" fill="url(#i6p8p1theoWaistcoat)"/>
    <ellipse cx="-30" cy="-50" rx="2.4" ry="1.4" fill="#a87838"/>
    <!-- Right arm near pocket -->
    <path d="M9,-84 L13,-66 L13,-46 L7,-44 L7,-72 Z" fill="url(#i6p8p1theoWaistcoat)"/>
    <ellipse cx="13" cy="-46" rx="2" ry="1.2" fill="#a87838"/>
    <!-- Head -->
    <rect x="-2" y="-92" width="4" height="6" fill="#a87838"/>
    <ellipse cx="0" cy="-100" rx="6" ry="7" fill="#a87838"/>
    <path d="M-6,-105 Q-4,-110 0,-110 Q4,-110 6,-105 L6,-100 Q3,-103 0,-103 Q-3,-103 -6,-100 Z" fill="#9a7038"/>
    <ellipse cx="-2" cy="-100" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <ellipse cx="2" cy="-100" rx="0.85" ry="0.55" fill="#fff8e8"/>
  </g>

  <!-- CAPTION top -->
  <g>
    <rect x="14" y="14" width="270" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-weight="700" font-style="italic">CAPTION</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Sekforde Street. East end. Nine-forty.</text>

  <!-- LUMA dialogue -->
  <g>
    <rect x="14" y="64" width="148" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="60,104 72,104 64,114" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="60.5" y1="104" x2="71.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA (from pocket)</text>
  <text x="22" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Stop. Look up.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q200,92 400,88 Q580,86 742,90"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
