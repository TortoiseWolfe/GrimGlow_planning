<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 248.9" width="742" height="248.9">
  <title>Issue 6 — Page 17 — Panel 1: Wide establishing — Sable alone in dark wall-cavity camp, single blue-white island of light from data module</title>
  <desc>24mm wide widescreen. Wall-cavity camp in near-total darkness. Perimeter emitters off. Power cell on shelf is dark. Single tiny figure on central timber beam holding palm-sized geometric device. Blue-white holographic text just beginning to resolve. Timber beams ghostly in peripheral glow. A single island of harsh light in a sea of black.</desc>

  <defs>
    <radialGradient id="i6p17p1darkness" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a0a14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="i6p17p1moduleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c8ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#5a8af0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p17p1beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <filter id="i6p17p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p17p1glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p17p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="742" height="248.9" fill="url(#i6p17p1darkness)"/>

  <!-- Faintest peripheral glow disc from module -->
  <ellipse cx="371" cy="140" rx="280" ry="140" fill="url(#i6p17p1moduleGlow)" filter="url(#i6p17p1strongglow)" opacity="0.55"/>

  <!-- Timber beams as ghostly shapes peripheral edge-light -->
  <!-- Vertical beams left-side -->
  <rect x="40" y="0" width="14" height="248.9" fill="url(#i6p17p1beam)"/>
  <line x1="54" y1="20" x2="54" y2="220" stroke="#3a4a78" stroke-width="0.4" opacity="0.35"/>
  <rect x="120" y="0" width="10" height="248.9" fill="url(#i6p17p1beam)"/>
  <line x1="130" y1="40" x2="130" y2="200" stroke="#3a4a78" stroke-width="0.3" opacity="0.3"/>
  <!-- Vertical beams right-side -->
  <rect x="612" y="0" width="10" height="248.9" fill="url(#i6p17p1beam)"/>
  <line x1="612" y1="40" x2="612" y2="200" stroke="#3a4a78" stroke-width="0.3" opacity="0.3"/>
  <rect x="688" y="0" width="14" height="248.9" fill="url(#i6p17p1beam)"/>
  <line x1="688" y1="20" x2="688" y2="220" stroke="#3a4a78" stroke-width="0.4" opacity="0.35"/>

  <!-- Horizontal central beam (where Sable sits) — faint -->
  <rect x="0" y="155" width="742" height="14" fill="url(#i6p17p1beam)"/>
  <line x1="60" y1="155" x2="680" y2="155" stroke="#3a4a78" stroke-width="0.55" opacity="0.4"/>
  <line x1="60" y1="169" x2="680" y2="169" stroke="#1a1a2a" stroke-width="0.55" opacity="0.7"/>

  <!-- Horizontal upper beam — barely visible -->
  <rect x="0" y="40" width="742" height="10" fill="#080604"/>
  <line x1="100" y1="40" x2="640" y2="40" stroke="#2a3a58" stroke-width="0.35" opacity="0.25"/>

  <!-- Power cell on shelf — DARK (powered down) — far right -->
  <g transform="translate(640 90)" opacity="0.6">
    <rect x="-12" y="-6" width="24" height="12" fill="#0a0a14" stroke="#1a1a2a" stroke-width="0.4"/>
    <rect x="-9" y="-3" width="18" height="6" fill="#080812"/>
    <!-- No glow — power cell is DARK -->
  </g>

  <!-- Equipment ledge left — vague dark geometry -->
  <g transform="translate(80 100)" opacity="0.5">
    <rect x="-10" y="-2" width="20" height="4" fill="#0a0a14" stroke="#1a1a2a" stroke-width="0.3"/>
    <rect x="-7" y="-6" width="6" height="4" fill="#0a0a14"/>
    <rect x="2" y="-7" width="5" height="5" fill="#0a0a14"/>
  </g>

  <!-- ===== SABLE — tiny figure on central timber beam, legs drawn up ===== -->
  <g transform="translate(371 152)">
    <!-- Cast shadow on beam (faint blue-white edge) -->
    <ellipse cx="0" cy="6" rx="9" ry="1.4" fill="#000" opacity="0.7"/>

    <!-- Folded legs (sitting cross-legged / drawn up) -->
    <path d="M-4,2 L-6,-2 L-3,-4 L0,-2 Z" fill="#080812"/>
    <path d="M4,2 L6,-2 L3,-4 L0,-2 Z" fill="#080812"/>
    <!-- Knee silver edge highlight -->
    <line x1="-5" y1="-3" x2="-3" y2="-3" stroke="#a8c0e8" stroke-width="0.3" opacity="0.85" filter="url(#i6p17p1bloom)"/>
    <line x1="3" y1="-3" x2="5" y2="-3" stroke="#a8c0e8" stroke-width="0.3" opacity="0.85" filter="url(#i6p17p1bloom)"/>

    <!-- Torso -->
    <path d="M-3,-4 L-3,-9 L3,-9 L3,-4 Z" fill="#080812"/>
    <!-- Shoulders -->
    <path d="M-3,-9 Q-2,-11 0,-11 Q2,-11 3,-9 Z" fill="#080812"/>
    <!-- Silver suit edge-light from below (uplit) -->
    <line x1="-3" y1="-7" x2="-3" y2="-4" stroke="#c0d4f0" stroke-width="0.35" opacity="0.95" filter="url(#i6p17p1bloom)"/>
    <line x1="3" y1="-7" x2="3" y2="-4" stroke="#c0d4f0" stroke-width="0.35" opacity="0.95" filter="url(#i6p17p1bloom)"/>

    <!-- Arms cradling module before face -->
    <path d="M-3,-9 L-4,-6 L-2,-5 Z" fill="#080812"/>
    <path d="M3,-9 L4,-6 L2,-5 Z" fill="#080812"/>

    <!-- Head (silhouette barely lit from below) -->
    <ellipse cx="0" cy="-13" rx="2.2" ry="2.4" fill="#1a1a24"/>
    <!-- Silver-white buzz cut catching uplight -->
    <path d="M-2,-15 Q-2,-16 0,-16 Q2,-16 2,-15 L2,-13 Q1,-14 0,-14 Q-1,-14 -2,-13 Z" fill="#080812"/>
    <ellipse cx="0" cy="-12.5" rx="1.6" ry="0.4" fill="#a8c0e8" opacity="0.85" filter="url(#i6p17p1bloom)"/>

    <!-- DATA MODULE held in both hands before face — palm-sized geometric device -->
    <g transform="translate(0 -7)">
      <!-- Module body -->
      <polygon points="-2,-1 2,-1 2.5,1 -2.5,1" fill="#1a2a4a" stroke="#a8c0ff" stroke-width="0.25"/>
      <line x1="-1.5" y1="-0.5" x2="1.5" y2="-0.5" stroke="#5a8af0" stroke-width="0.2" filter="url(#i6p17p1bloom)"/>
      <!-- Center activation glow -->
      <circle cx="0" cy="0" r="0.7" fill="#c0d4ff" filter="url(#i6p17p1bloom)"/>
    </g>

    <!-- HOLOGRAPHIC TEXT just beginning to resolve — sparse, fragmenting -->
    <g opacity="0.85" filter="url(#i6p17p1bloom)">
      <!-- First geometric character forming -->
      <polygon points="-5,-22 -2,-22 -2,-19 -5,-19" stroke="#c0d4ff" stroke-width="0.3" fill="none"/>
      <line x1="-3.5" y1="-22" x2="-3.5" y2="-19" stroke="#c0d4ff" stroke-width="0.3"/>
      <!-- Dissolving fragment -->
      <line x1="0" y1="-26" x2="2" y2="-26" stroke="#a8c0ff" stroke-width="0.25" opacity="0.55"/>
      <line x1="3" y1="-24" x2="3" y2="-22" stroke="#a8c0ff" stroke-width="0.25" opacity="0.4"/>
      <!-- Static specks -->
      <circle cx="-1" cy="-25" r="0.2" fill="#fff"/>
      <circle cx="2" cy="-21" r="0.15" fill="#fff"/>
      <circle cx="-3" cy="-19" r="0.15" fill="#fff"/>
    </g>

    <!-- Strong upward light cone radiating from module -->
    <path d="M-3,-7 L-22,-46 L22,-46 L3,-7 Z" fill="#a8c0ff" opacity="0.18" filter="url(#i6p17p1strongglow)"/>
  </g>

  <!-- Strong central radial halo at module location -->
  <circle cx="371" cy="145" r="12" fill="#c0d4ff" opacity="0.2" filter="url(#i6p17p1glow)"/>
  <circle cx="371" cy="145" r="5" fill="#fff" opacity="0.3" filter="url(#i6p17p1bloom)"/>

  <!-- Distant wall-gap city light far rear (faint grey rectangle) -->
  <rect x="350" y="200" width="40" height="14" fill="#1a1a24" opacity="0.55" filter="url(#i6p17p1glow)"/>

  <!-- Caption: This is Sable alone with information she did not want -->
  <g>
    <rect x="14" y="14" width="220" height="34" rx="2" fill="#f5ecd8" stroke="#5a4a30" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a4a30" font-style="italic">A captain alone with a file</text>
  <text x="22" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a4a30" font-style="italic">she has been avoiding.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1a2a" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
