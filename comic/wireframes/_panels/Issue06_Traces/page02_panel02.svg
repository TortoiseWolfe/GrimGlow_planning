<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240.7 364" width="240.7" height="364">
  <title>Issue 6 — Page 2 — Panel 2: Jink stops fidgeting — "Titans. Here. Now."</title>
  <desc>50mm MCU slight low angle. Jink on higher beam, leaning forward, hand gripping beam edge. Red-shifted map light from below catches soot streak across emerald chest. Restlessness arrested.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p2p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="60%" stop-color="#1a0a0c"/>
      <stop offset="100%" stop-color="#3a0c10"/>
    </linearGradient>
    <linearGradient id="i6p2p2jinkSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4a28"/>
    </linearGradient>
    <linearGradient id="i6p2p2beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="i6p2p2redUp" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ff3848" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#a82030" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3a0810" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p2p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p2p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="240.7" height="364" fill="url(#i6p2p2bg)"/>

  <!-- Red glow from map below -->
  <ellipse cx="120" cy="364" rx="160" ry="220" fill="url(#i6p2p2redUp)" filter="url(#i6p2p2glow)"/>

  <!-- Higher timber beam (Jink's perch) -->
  <rect x="-10" y="180" width="260" height="22" fill="url(#i6p2p2beam)"/>
  <line x1="0" y1="200" x2="240.7" y2="200" stroke="#0a0604" stroke-width="0.5" opacity="0.7"/>
  <!-- Beam grain -->
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.45" fill="none">
    <path d="M0,184 Q60,186 120,184 Q180,182 240,184"/>
    <path d="M0,192 Q60,194 120,192 Q180,190 240,192"/>
  </g>

  <!-- Vertical timber column right-back -->
  <rect x="200" y="20" width="14" height="180" fill="url(#i6p2p2beam)"/>

  <!-- Cobwebs in upper corner -->
  <g stroke="#5a4838" stroke-width="0.4" fill="none" opacity="0.5">
    <path d="M0,0 Q40,20 80,0"/>
    <path d="M0,0 Q20,40 0,80"/>
    <path d="M0,30 L40,10"/>
    <path d="M30,0 L20,40"/>
  </g>

  <!-- Faint blue holo perimeter line above beam -->
  <line x1="20" y1="40" x2="200" y2="40" stroke="#a8c0ff" stroke-width="0.55" opacity="0.45" filter="url(#i6p2p2bloom)" stroke-dasharray="3 2"/>

  <!-- ===== JINK — leaning forward on higher beam, hand gripping edge ===== -->
  <g transform="translate(120 178)">
    <!-- Foot/boot perched on beam -->
    <ellipse cx="-30" cy="2" rx="14" ry="6" fill="#0a0408"/>
    <ellipse cx="22" cy="0" rx="14" ry="6" fill="#0a0408"/>
    <!-- Knee/leg dropped -->
    <path d="M-36,-2 L-26,-90 L-12,-90 L-22,-2 Z" fill="url(#i6p2p2jinkSuit)"/>
    <path d="M14,-2 L26,-90 L40,-90 L32,-2 Z" fill="url(#i6p2p2jinkSuit)"/>
    <!-- Knee scuff (recent, from scouting) -->
    <ellipse cx="-22" cy="-50" rx="7" ry="2.4" fill="#0a0604" opacity="0.65"/>
    <ellipse cx="30" cy="-50" rx="7" ry="2.4" fill="#0a0604" opacity="0.65"/>
    <line x1="-26" y1="-58" x2="-18" y2="-46" stroke="#0a0604" stroke-width="0.55" opacity="0.6"/>

    <!-- TORSO leaning forward — slight forward angle, broad lower-than-shoulders -->
    <path d="M-32,-90 L-22,-150 L22,-150 L36,-90 Z" fill="url(#i6p2p2jinkSuit)"/>
    <!-- Holo seam center -->
    <line x1="-12" y1="-120" x2="14" y2="-120" stroke="#2ed078" stroke-width="0.85" opacity="0.7" filter="url(#i6p2p2bloom)"/>
    <!-- CHEST SOOT STREAK — diagonal slash across chest, catches the red light -->
    <path d="M-18,-110 L24,-140" stroke="#1a0c04" stroke-width="6" opacity="0.85" stroke-linecap="round"/>
    <path d="M-14,-114 L20,-138" stroke="#0a0604" stroke-width="3" opacity="0.85" stroke-linecap="round"/>
    <!-- Red rim catching the soot streak edge -->
    <path d="M-18,-110 L24,-140" stroke="#ff5868" stroke-width="0.85" opacity="0.7" stroke-linecap="round" filter="url(#i6p2p2bloom)"/>
    <!-- Additional dust -->
    <ellipse cx="-12" cy="-126" rx="4" ry="1.6" fill="#5a4838" opacity="0.5"/>
    <ellipse cx="16" cy="-104" rx="6" ry="2.4" fill="#5a4838" opacity="0.55"/>

    <!-- LEFT arm extended down + forward, hand gripping beam edge -->
    <path d="M-32,-150 L-50,-110 L-46,-100 L-30,-90 L-22,-110 L-22,-130 Z" fill="url(#i6p2p2jinkSuit)"/>
    <ellipse cx="-46" cy="-94" rx="5" ry="3" fill="#d8a878"/>
    <!-- Fingers gripping beam -->
    <path d="M-50,-94 L-52,-86 L-50,-82 L-48,-86 Z" fill="#d8a878"/>
    <path d="M-46,-92 L-48,-82 L-46,-78 L-44,-82 Z" fill="#d8a878"/>
    <path d="M-42,-92 L-44,-82 L-42,-78 L-40,-82 Z" fill="#d8a878"/>
    <!-- Knuckle line -->
    <line x1="-52" y1="-88" x2="-40" y2="-86" stroke="#5a3028" stroke-width="0.55" opacity="0.85"/>

    <!-- RIGHT arm holding posture, slight bent -->
    <path d="M36,-150 L48,-110 L40,-100 L28,-110 L24,-130 Z" fill="url(#i6p2p2jinkSuit)"/>
    <ellipse cx="44" cy="-104" rx="4" ry="2.4" fill="#d8a878"/>

    <!-- Wing-pack folded against back (visible at shoulders) -->
    <path d="M-32,-150 L-40,-130 L-36,-118 L-32,-130 Z" fill="#1a0c04" opacity="0.85"/>
    <path d="M22,-150 L30,-130 L26,-118 L22,-130 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="-32" y1="-142" x2="-32" y2="-128" stroke="#2ed078" stroke-width="0.55" opacity="0.7" filter="url(#i6p2p2bloom)"/>
    <line x1="22" y1="-142" x2="22" y2="-128" stroke="#2ed078" stroke-width="0.55" opacity="0.7" filter="url(#i6p2p2bloom)"/>

    <!-- HEAD — leaning forward, looking down at map. Upper face partially in shadow. -->
    <ellipse cx="0" cy="-176" rx="18" ry="22" fill="#d8a878"/>
    <!-- Shadow over upper half of face -->
    <path d="M-18,-186 L-18,-176 Q0,-180 18,-176 L18,-186 Q0,-198 -18,-186 Z" fill="#1a0c04" opacity="0.7"/>

    <!-- Wild golden curly hair — bright, abundant -->
    <path d="M-22,-188 Q-26,-202 -10,-208 Q0,-212 10,-208 Q26,-202 22,-188 L20,-176 Q14,-188 0,-188 Q-14,-188 -20,-176 Z" fill="#ffd078"/>
    <!-- Curl bumps -->
    <circle cx="-18" cy="-200" r="4" fill="#ffd078"/>
    <circle cx="-10" cy="-208" r="4.5" fill="#ffd078"/>
    <circle cx="-2" cy="-212" r="5" fill="#ffd078"/>
    <circle cx="6" cy="-210" r="4.5" fill="#ffd078"/>
    <circle cx="14" cy="-204" r="4" fill="#ffd078"/>
    <circle cx="-22" cy="-194" r="3.5" fill="#ffd078"/>
    <circle cx="20" cy="-192" r="3.5" fill="#ffd078"/>
    <!-- Highlights on curls -->
    <circle cx="-15" cy="-202" r="1.4" fill="#fff8e8" opacity="0.85"/>
    <circle cx="-2" cy="-210" r="1.6" fill="#fff8e8" opacity="0.85"/>
    <circle cx="10" cy="-206" r="1.4" fill="#fff8e8" opacity="0.85"/>

    <!-- Eyes — wide, alert (NOT smiling), looking down past frame -->
    <ellipse cx="-6" cy="-180" rx="3" ry="1.6" fill="#fff8e8"/>
    <circle cx="-6" cy="-180" r="1.4" fill="#0a0604"/>
    <circle cx="-7" cy="-181" r="0.5" fill="#fff8ff"/>
    <ellipse cx="6" cy="-180" rx="3" ry="1.6" fill="#fff8e8"/>
    <circle cx="6" cy="-180" r="1.4" fill="#0a0604"/>
    <circle cx="5" cy="-181" r="0.5" fill="#fff8ff"/>

    <!-- Brows level - serious not playful -->
    <path d="M-10,-186 L-2,-185" stroke="#5a3018" stroke-width="0.85"/>
    <path d="M2,-185 L10,-186" stroke="#5a3018" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M0,-178 L-2,-172 L2,-172 Z" fill="#a87838" opacity="0.5"/>

    <!-- Mouth — flat line, no smile, not speaking yet but about to -->
    <path d="M-3,-168 L3,-168" stroke="#5a3018" stroke-width="0.85"/>

    <!-- Red rim light from below catching jaw + lower face -->
    <path d="M-14,-170 Q0,-164 14,-170" stroke="#ff5868" stroke-width="0.55" fill="none" opacity="0.7" filter="url(#i6p2p2bloom)"/>
    <path d="M-12,-166 Q0,-160 12,-166" stroke="#ff3848" stroke-width="0.4" fill="none" opacity="0.6" filter="url(#i6p2p2bloom)"/>
  </g>

  <!-- JINK dialogue (bottom) -->
  <g>
    <rect x="14" y="304" width="212" height="46" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="100,304 112,304 104,294" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="100.5" y1="304" x2="111.5" y2="304" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2ed078" font-weight="700">JINK</text>
  <text x="22" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1410" font-weight="700">Titans. Here. Now.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 240,90"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 240,300"/>
  </g>
</svg>
