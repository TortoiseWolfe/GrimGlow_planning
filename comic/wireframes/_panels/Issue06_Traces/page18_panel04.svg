<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 310" width="742" height="310">
  <title>Issue 6 — Page 18 — Panel 4: Wide from wall gap looking in — Sable as silhouette in the dark camp, isolation as a form of duty</title>
  <desc>24mm wide widescreen. Camp from wall gap entrance. Grey fog-light leaks from city outside, barely illuminating nearest beams. Deep in camp, Sable a silhouette — sitting back on central beam, legs drawn up, module pressed between palms. Power cell still off, dead shape on shelf. Everything shadow and silhouette.</desc>

  <defs>
    <radialGradient id="i6p18p4darkness" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a0c1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="i6p18p4fogLight" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a3c50" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0c1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p18p4beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <filter id="i6p18p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p18p4glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p18p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="742" height="310" fill="url(#i6p18p4darkness)"/>

  <!-- WALL GAP entrance left edge — fog-light seeping in -->
  <rect x="0" y="60" width="120" height="200" fill="url(#i6p18p4fogLight)" filter="url(#i6p18p4glow)"/>
  <!-- Cracked plaster edges around the gap -->
  <path d="M0,60 L100,80 L120,140 L100,200 L0,260" fill="none" stroke="#3a3c50" stroke-width="0.7" opacity="0.85"/>
  <!-- Suggested cobblestone / city texture beyond -->
  <g opacity="0.3" fill="#5a5c70">
    <ellipse cx="20" cy="180" rx="8" ry="3"/>
    <ellipse cx="50" cy="200" rx="10" ry="3"/>
    <ellipse cx="35" cy="220" rx="9" ry="3"/>
  </g>
  <!-- Distant gas lamp halo through fog -->
  <circle cx="60" cy="120" r="22" fill="#7a6840" opacity="0.35" filter="url(#i6p18p4strongglow)"/>
  <circle cx="60" cy="120" r="8" fill="#a89860" opacity="0.55" filter="url(#i6p18p4bloom)"/>

  <!-- ===== INTERIOR CAMP — beams as deep shadows ===== -->
  <!-- Floor of camp (lower) -->
  <rect x="120" y="240" width="622" height="20" fill="url(#i6p18p4beam)"/>
  <line x1="120" y1="240" x2="742" y2="240" stroke="#3a4868" stroke-width="0.4" opacity="0.4"/>

  <!-- Vertical beams -->
  <rect x="170" y="0" width="14" height="240" fill="url(#i6p18p4beam)"/>
  <line x1="184" y1="60" x2="184" y2="220" stroke="#1a2030" stroke-width="0.4" opacity="0.4"/>
  <rect x="380" y="0" width="14" height="240" fill="url(#i6p18p4beam)"/>
  <rect x="580" y="0" width="14" height="240" fill="url(#i6p18p4beam)"/>
  <rect x="710" y="0" width="14" height="240" fill="url(#i6p18p4beam)"/>

  <!-- Horizontal upper beam -->
  <rect x="120" y="40" width="622" height="14" fill="url(#i6p18p4beam)"/>
  <line x1="184" y1="40" x2="710" y2="40" stroke="#3a4868" stroke-width="0.4" opacity="0.3"/>
  <line x1="184" y1="54" x2="710" y2="54" stroke="#080604" stroke-width="0.55" opacity="0.85"/>

  <!-- ===== EQUIPMENT LEDGES — dim geometry, not lit ===== -->
  <g opacity="0.55">
    <!-- Power cell on shelf — dead -->
    <rect x="240" y="160" width="50" height="20" fill="#0a0a14"/>
    <rect x="244" y="164" width="42" height="12" fill="#080812"/>
    <line x1="252" y1="170" x2="282" y2="170" stroke="#1a2030" stroke-width="0.55"/>
    <text x="265" y="172" font-family="monospace" font-size="3" fill="#1a2030" text-anchor="middle">[OFF]</text>

    <!-- Stacked equipment -->
    <rect x="430" y="170" width="40" height="10" fill="#0a0a14"/>
    <rect x="436" y="160" width="20" height="10" fill="#0a0a14"/>
    <rect x="450" y="155" width="14" height="15" fill="#0a0a14"/>

    <!-- Crate on right -->
    <rect x="620" y="170" width="40" height="20" fill="#0a0a14"/>
    <line x1="620" y1="180" x2="660" y2="180" stroke="#1a2030" stroke-width="0.55"/>
  </g>

  <!-- Central horizontal beam — where Sable sits, deep in camp -->
  <rect x="120" y="208" width="622" height="14" fill="url(#i6p18p4beam)"/>
  <line x1="120" y1="208" x2="742" y2="208" stroke="#3a4868" stroke-width="0.4" opacity="0.3"/>
  <line x1="120" y1="222" x2="742" y2="222" stroke="#080604" stroke-width="0.7" opacity="0.85"/>

  <!-- ===== SABLE — silhouette on central beam, deep in camp ===== -->
  <g transform="translate(450 206)">
    <!-- Cast tiny shadow on beam -->
    <ellipse cx="0" cy="2" rx="9" ry="1" fill="#000" opacity="0.85"/>

    <!-- Folded body as silhouette — drawn in, small -->
    <path d="M-7,2 L-9,-6 L-5,-12 L-2,-6 Z" fill="#080612"/>
    <path d="M7,2 L9,-6 L5,-12 L2,-6 Z" fill="#080612"/>
    <path d="M-5,-6 L-5,-14 L5,-14 L5,-6 Z" fill="#080612"/>
    <!-- Shoulders (small, hunched) -->
    <path d="M-5,-14 Q-3,-18 0,-18 Q3,-18 5,-14 Z" fill="#080612"/>
    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="3" ry="3.4" fill="#080612"/>
    <!-- Faintest reflection on silver hair -->
    <line x1="-2" y1="-25" x2="2" y2="-25" stroke="#3a4868" stroke-width="0.3" opacity="0.55" filter="url(#i6p18p4bloom)"/>

    <!-- Module pressed between palms — DARK (no glow) -->
    <rect x="-2.4" y="-12" width="4.8" height="2" fill="#0a0c20"/>

    <!-- Faintest edge-light on suit from far wall-gap glow (left side) -->
    <line x1="-5" y1="-12" x2="-5" y2="-6" stroke="#3a4868" stroke-width="0.25" opacity="0.45" filter="url(#i6p18p4bloom)"/>
    <line x1="-3" y1="-18" x2="-2" y2="-22" stroke="#3a4868" stroke-width="0.2" opacity="0.4" filter="url(#i6p18p4bloom)"/>
  </g>

  <!-- Faint dust motes in fog-light beam -->
  <g fill="#7a7c8a" opacity="0.45">
    <circle cx="80" cy="100" r="0.4"/>
    <circle cx="60" cy="160" r="0.3"/>
    <circle cx="40" cy="180" r="0.4"/>
    <circle cx="90" cy="220" r="0.3"/>
  </g>

  <!-- Caption -->
  <g>
    <rect x="14" y="14" width="338" height="34" rx="2" fill="#f5ecd8" stroke="#5a4a30" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">"She sat in the dark until she could wear</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic">her face again."</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q200,92 400,88 Q580,86 742,90"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
