<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 421.5" width="366" height="421.5">
  <title>Issue 6 — Page 8 — Panel 3: Luma fully out of pocket scanning claw marks — controlled scientific alarm</title>
  <desc>85mm CU eye level. Luma fully extended from pocket, both hands gripping fabric edge white-knuckled, scanning upward. Detailed analysis projected on wall surface — depth measurements, force calc, residue composition. Jaw tight, breathing fast.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p8p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p8p3leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p8p3lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p8p3brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="i6p8p3scannerBeam" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p8p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p8p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="421.5" fill="url(#i6p8p3bg)"/>

  <!-- Brick wall background (the wall with claw marks above) -->
  <rect x="0" y="0" width="366" height="280" fill="url(#i6p8p3brick)"/>
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.85">
    <line x1="0" y1="40" x2="366" y2="40"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
    <line x1="60" y1="0" x2="60" y2="40"/>
    <line x1="180" y1="0" x2="180" y2="40"/>
    <line x1="300" y1="0" x2="300" y2="40"/>
    <line x1="0" y1="40" x2="0" y2="80"/>
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="240" y1="40" x2="240" y2="80"/>
  </g>

  <!-- Faint trace of claw marks at top edge of frame (ABOVE Luma's gaze) -->
  <g transform="translate(183 0)">
    <path d="M-40,0 L-20,30" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M-20,0 L0,30" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M0,0 L20,30" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M20,0 L40,30" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M-40,0 L-20,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <path d="M-20,0 L0,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <path d="M0,0 L20,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <path d="M20,0 L40,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <!-- Iridescent residue shimmer -->
    <path d="M-40,0 L-20,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p3bloom)"/>
    <path d="M-20,0 L0,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p3bloom)"/>
    <path d="M0,0 L20,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p3bloom)"/>
    <path d="M20,0 L40,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.55" filter="url(#i6p8p3bloom)"/>
  </g>

  <!-- ===== HOLOGRAPHIC ANALYSIS OVERLAY on the wall above Luma ===== -->
  <g transform="translate(183 130)" filter="url(#i6p8p3bloom)">
    <!-- Frame -->
    <rect x="-130" y="-40" width="260" height="120" fill="#1a0c20" opacity="0.55"/>
    <rect x="-130" y="-40" width="260" height="120" fill="none" stroke="#a888ff" stroke-width="2" opacity="0.95"/>
    <rect x="-130" y="-40" width="260" height="14" fill="#5a3ad8" opacity="0.85"/>
    <text x="-124" y="-30" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">CLAW MARK ANALYSIS — DEPTH/FORCE/BIO-TRACE</text>

    <!-- Force vector diagram -->
    <g stroke="#fff8ff" stroke-width="0.7" fill="none" opacity="0.95">
      <line x1="-110" y1="-12" x2="-110" y2="60"/>
      <line x1="-110" y1="60" x2="-50" y2="60"/>
      <line x1="-110" y1="-12" x2="-104" y2="-8"/>
      <line x1="-110" y1="-12" x2="-114" y2="-8"/>
      <text x="-128" y="-16" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">F-VECTOR</text>
      <text x="-128" y="60" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">~3.4 kN</text>
    </g>

    <!-- Depth profile graph -->
    <g stroke="#fff8ff" stroke-width="0.55" fill="none" opacity="0.95">
      <rect x="-40" y="-8" width="80" height="40"/>
      <text x="-40" y="-14" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">DEPTH PROFILE (mm)</text>
      <!-- Profile curves for 4 claws -->
      <path d="M-36,28 L-32,4 L-28,28"/>
      <path d="M-22,28 L-18,2 L-14,28"/>
      <path d="M-8,28 L-4,3 L0,28"/>
      <path d="M6,28 L10,5 L14,28"/>
      <line x1="-40" y1="28" x2="40" y2="28"/>
      <text x="22" y="6" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">38mm</text>
    </g>

    <!-- Bio-trace ID -->
    <g stroke="#ff5868" stroke-width="0.7" fill="none" opacity="0.95">
      <rect x="60" y="-8" width="60" height="40"/>
      <text x="60" y="-14" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#ff5868">BIO-TRACE</text>
      <!-- Spectrum bar with red marker -->
      <line x1="64" y1="20" x2="116" y2="20"/>
      <line x1="100" y1="14" x2="100" y2="26" stroke="#ff5868" stroke-width="2"/>
      <text x="64" y="14" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">MATCH:</text>
      <text x="64" y="36" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#ff5868" font-weight="700">TITAN APPENDAGE</text>
    </g>

    <!-- Connector lines from analysis to claw mark -->
    <line x1="0" y1="-40" x2="0" y2="-90" stroke="#a888ff" stroke-width="0.55" opacity="0.7" stroke-dasharray="2 2"/>
  </g>

  <!-- Faint scanner wash up the wall -->
  <ellipse cx="183" cy="80" rx="120" ry="80" fill="url(#i6p8p3scannerBeam)" filter="url(#i6p8p3glow)" opacity="0.55"/>

  <!-- ===== POCKET EDGE — bottom of frame ===== -->
  <rect x="0" y="280" width="366" height="141.5" fill="url(#i6p8p3leather)"/>
  <line x1="0" y1="280" x2="366" y2="280" stroke="#7a4818" stroke-width="1.4" opacity="0.85"/>
  <line x1="0" y1="284" x2="366" y2="284" stroke="#3a1808" stroke-width="0.55" opacity="0.7" stroke-dasharray="3 2"/>
  <!-- Pocket interior dim -->
  <rect x="40" y="284" width="286" height="138" fill="#0a0408"/>
  <ellipse cx="183" cy="320" rx="80" ry="40" fill="#5a3ad8" opacity="0.45" filter="url(#i6p8p3glow)"/>

  <!-- ===== LUMA — fully out, gripping pocket edge, scanner extended UP ===== -->
  <g transform="translate(183 270)">
    <!-- Body extended from pocket — torso visible above pocket lip -->
    <path d="M-22,28 L-20,-8 L20,-8 L22,28 Z" fill="url(#i6p8p3lumaSuit)"/>
    <line x1="-14" y1="10" x2="14" y2="10" stroke="#a888ff" stroke-width="0.85" opacity="0.85" filter="url(#i6p8p3bloom)"/>
    <!-- Brick dust newly accumulated -->
    <ellipse cx="-15" cy="20" rx="6" ry="2" fill="#5a3018" opacity="0.65"/>
    <ellipse cx="15" cy="20" rx="6" ry="2" fill="#5a3018" opacity="0.65"/>
    <!-- Shoulders -->
    <path d="M-20,-8 Q-14,-22 0,-26 Q14,-22 20,-8 Z" fill="url(#i6p8p3lumaSuit)"/>

    <!-- BOTH HANDS gripping pocket edge (white-knuckled), arms positioned downward to grip -->
    <path d="M-20,-8 L-32,18 L-30,28 L-18,16 Z" fill="url(#i6p8p3lumaSuit)"/>
    <ellipse cx="-30" cy="28" rx="4" ry="2.4" fill="#7a4838"/>
    <!-- White-knuckle highlights -->
    <circle cx="-32" cy="28" r="1" fill="#fff8e8" opacity="0.85"/>
    <circle cx="-28" cy="28" r="1" fill="#fff8e8" opacity="0.85"/>

    <path d="M20,-8 L32,18 L30,28 L18,16 Z" fill="url(#i6p8p3lumaSuit)"/>
    <ellipse cx="30" cy="28" rx="4" ry="2.4" fill="#7a4838"/>
    <circle cx="32" cy="28" r="1" fill="#fff8e8" opacity="0.85"/>
    <circle cx="28" cy="28" r="1" fill="#fff8e8" opacity="0.85"/>

    <!-- SCANNER strapped to wrist or held — projecting upward beam from chest level -->
    <rect x="-9" y="-2" width="18" height="9" rx="0.85" fill="#3a2068" stroke="#a888ff" stroke-width="0.7"/>
    <rect x="-7" y="0" width="14" height="5" fill="#5a3ad8" filter="url(#i6p8p3bloom)"/>
    <ellipse cx="0" cy="2" rx="14" ry="6" fill="#a888ff" opacity="0.85" filter="url(#i6p8p3glow)"/>
    <!-- Scanner beam going up (cone) -->
    <path d="M-3,-2 L-50,-280 L50,-280 L3,-2 Z" fill="#a888ff" opacity="0.18" filter="url(#i6p8p3glow)"/>

    <!-- HEAD looking UP -->
    <ellipse cx="0" cy="-44" rx="14" ry="18" fill="#7a4838"/>
    <!-- Underlight from scanner upward = no underlight here, but cool wash on face -->
    <ellipse cx="0" cy="-50" rx="11" ry="6" fill="#a888ff" opacity="0.45" filter="url(#i6p8p3bloom)"/>
    <!-- Hair -->
    <path d="M-13,-52 Q-10,-60 0,-62 Q10,-60 13,-52 L13,-44 Q6,-50 0,-50 Q-6,-50 -13,-44 Z" fill="#0a0604"/>
    <line x1="-6" y1="-58" x2="-4" y2="-60" stroke="#5a3ad8" stroke-width="1" opacity="0.85" filter="url(#i6p8p3bloom)"/>
    <line x1="4" y1="-60" x2="6" y2="-58" stroke="#5a3ad8" stroke-width="1" opacity="0.85" filter="url(#i6p8p3bloom)"/>
    <!-- Braid trailing back into pocket -->
    <path d="M13,-46 Q18,-26 16,-6" stroke="#0a0604" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M13,-46 Q18,-26 16,-6" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p8p3bloom)"/>

    <!-- LENSES looking up — scrolling rapidly -->
    <ellipse cx="-5" cy="-44" rx="5" ry="3.5" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="5" cy="-44" rx="5" ry="3.5" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="-5" cy="-44" rx="5" ry="3.5" fill="none" stroke="#a888ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p8p3bloom)"/>
    <ellipse cx="5" cy="-44" rx="5" ry="3.5" fill="none" stroke="#a888ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p8p3bloom)"/>
    <line x1="-9" y1="-46" x2="-2" y2="-43" stroke="#fff8ff" stroke-width="0.55" opacity="0.95" filter="url(#i6p8p3bloom)"/>
    <g stroke="#fff8ff" stroke-width="0.4" fill="none" opacity="0.95" filter="url(#i6p8p3bloom)">
      <line x1="-9" y1="-46" x2="-1" y2="-46"/>
      <line x1="-9" y1="-44" x2="-1" y2="-44"/>
      <line x1="-9" y1="-42" x2="-1" y2="-42"/>
      <line x1="1" y1="-46" x2="9" y2="-46"/>
      <line x1="1" y1="-44" x2="9" y2="-44"/>
      <line x1="1" y1="-42" x2="9" y2="-42"/>
    </g>
    <!-- Eyes -->
    <ellipse cx="-5" cy="-44" rx="2.4" ry="2" fill="#fff8e8"/>
    <circle cx="-5" cy="-44" r="1.2" fill="#0a0604"/>
    <circle cx="-5.4" cy="-44.4" r="0.45" fill="#fff8ff"/>
    <ellipse cx="5" cy="-44" rx="2.4" ry="2" fill="#fff8e8"/>
    <circle cx="5" cy="-44" r="1.2" fill="#0a0604"/>
    <circle cx="4.6" cy="-44.4" r="0.45" fill="#fff8ff"/>
    <!-- Brows drawn — controlled alarm -->
    <path d="M-11,-56 L-1,-54" stroke="#0a0604" stroke-width="0.85"/>
    <path d="M1,-54 L11,-56" stroke="#0a0604" stroke-width="0.85"/>
    <line x1="-2" y1="-54" x2="0" y2="-50" stroke="#1a0c04" stroke-width="0.4" opacity="0.7"/>
    <line x1="2" y1="-54" x2="0" y2="-50" stroke="#1a0c04" stroke-width="0.4" opacity="0.7"/>
    <!-- Mouth tight (cataloging professionally) -->
    <path d="M-3,-32 L3,-32" stroke="#3a1808" stroke-width="0.85"/>
    <ellipse cx="0" cy="-28" rx="3" ry="0.7" fill="#1a0c04" opacity="0.45"/>
  </g>

  <!-- LUMA dialogue 1 -->
  <g>
    <rect x="14" y="280" width="338" height="58" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,280 172,280 164,270" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="280" x2="171.5" y2="280" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Titan bio-trace in the grooves.</text>
  <text x="22" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Concentrated. This was recent — within</text>
  <text x="22" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">the week.</text>

  <!-- LUMA dialogue 2 -->
  <g>
    <rect x="14" y="346" width="338" height="58" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,404 172,404 164,414" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="404" x2="171.5" y2="404" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">The claw geometry matches nothing in</text>
  <text x="22" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">our xenobiology database except Titan</text>
  <text x="22" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">appendage structures.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q120,202 240,198 Q330,196 366,200"/>
    <path d="M0,360 Q120,362 240,358 Q330,356 366,360"/>
  </g>
</svg>
