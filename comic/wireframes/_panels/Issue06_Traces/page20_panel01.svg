<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 6 — Page 20 — Panel 1: Wide street establishing — Theodore walking through fog, Luma scanning from pocket</title>
  <desc>24mm wide widescreen. Narrow Victorian street thick with fog. Gas lamps amber halos in grey-white. Buildings press close, upper stories lost. Damp cobblestones reflecting amber. Theodore walks hands in pockets, easy confidence. Luma's face peers from waistcoat pocket, holographic lenses re-engaged scanning fog. Two carrying weight of discovery through fog.</desc>

  <defs>
    <linearGradient id="i6p20p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5860"/>
      <stop offset="50%" stop-color="#787680"/>
      <stop offset="100%" stop-color="#3a3840"/>
    </linearGradient>
    <radialGradient id="i6p20p1lampHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe0a8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#d8a060" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a4828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p20p1lampCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d89858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p20p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3438"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <linearGradient id="i6p20p1building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2228"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <radialGradient id="i6p20p1pocketGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p20p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p20p1glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p20p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i6p20p1megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="742" height="320" fill="url(#i6p20p1bg)"/>

  <!-- Fog layers (depth) -->
  <rect x="0" y="60" width="742" height="20" fill="#7a7880" opacity="0.55"/>
  <rect x="0" y="120" width="742" height="40" fill="#8a8890" opacity="0.4"/>
  <rect x="0" y="180" width="742" height="40" fill="#8a8890" opacity="0.35"/>

  <!-- ===== BUILDINGS — pressing close left and right, upper stories lost ===== -->
  <!-- Left building -->
  <path d="M0,0 L0,260 L160,260 L160,40 L140,30 L140,80 L100,75 L100,40 L60,35 L60,90 L20,85 L20,40 Z" fill="url(#i6p20p1building)"/>
  <!-- Windows (faint amber from inside) -->
  <rect x="30" y="220" width="20" height="22" fill="#3a2818" stroke="#5a3818" stroke-width="0.7"/>
  <ellipse cx="40" cy="231" rx="6" ry="8" fill="#7a4818" opacity="0.55" filter="url(#i6p20p1bloom)"/>
  <line x1="40" y1="220" x2="40" y2="242" stroke="#1a0c08" stroke-width="0.85"/>
  <line x1="30" y1="231" x2="50" y2="231" stroke="#1a0c08" stroke-width="0.85"/>
  <rect x="80" y="220" width="20" height="22" fill="#3a2818" stroke="#5a3818" stroke-width="0.7"/>
  <line x1="90" y1="220" x2="90" y2="242" stroke="#1a0c08" stroke-width="0.85"/>
  <line x1="80" y1="231" x2="100" y2="231" stroke="#1a0c08" stroke-width="0.85"/>
  <rect x="120" y="220" width="20" height="22" fill="#3a2818" stroke="#5a3818" stroke-width="0.7"/>
  <ellipse cx="130" cy="231" rx="6" ry="8" fill="#7a4818" opacity="0.55" filter="url(#i6p20p1bloom)"/>
  <line x1="130" y1="220" x2="130" y2="242" stroke="#1a0c08" stroke-width="0.85"/>
  <line x1="120" y1="231" x2="140" y2="231" stroke="#1a0c08" stroke-width="0.85"/>

  <!-- Right building -->
  <path d="M742,0 L742,260 L580,260 L580,40 L600,30 L600,80 L640,75 L640,40 L680,35 L680,90 L720,85 L720,40 Z" fill="url(#i6p20p1building)"/>
  <rect x="600" y="220" width="20" height="22" fill="#3a2818" stroke="#5a3818" stroke-width="0.7"/>
  <line x1="610" y1="220" x2="610" y2="242" stroke="#1a0c08" stroke-width="0.85"/>
  <line x1="600" y1="231" x2="620" y2="231" stroke="#1a0c08" stroke-width="0.85"/>
  <rect x="650" y="220" width="20" height="22" fill="#3a2818" stroke="#5a3818" stroke-width="0.7"/>
  <ellipse cx="660" cy="231" rx="6" ry="8" fill="#7a4818" opacity="0.55" filter="url(#i6p20p1bloom)"/>
  <line x1="660" y1="220" x2="660" y2="242" stroke="#1a0c08" stroke-width="0.85"/>
  <line x1="650" y1="231" x2="670" y2="231" stroke="#1a0c08" stroke-width="0.85"/>
  <rect x="700" y="220" width="20" height="22" fill="#3a2818" stroke="#5a3818" stroke-width="0.7"/>
  <line x1="710" y1="220" x2="710" y2="242" stroke="#1a0c08" stroke-width="0.85"/>
  <line x1="700" y1="231" x2="720" y2="231" stroke="#1a0c08" stroke-width="0.85"/>

  <!-- Building soft fog wash on edges -->
  <rect x="0" y="0" width="200" height="100" fill="#787680" opacity="0.45"/>
  <rect x="542" y="0" width="200" height="100" fill="#787680" opacity="0.45"/>

  <!-- ===== GAS LAMPS at intervals, amber halos in fog ===== -->
  <!-- Left gas lamp (mid-distance) -->
  <g transform="translate(180 130)">
    <ellipse cx="0" cy="0" rx="36" ry="32" fill="url(#i6p20p1lampHalo)" filter="url(#i6p20p1megaglow)"/>
    <circle cx="0" cy="0" r="14" fill="url(#i6p20p1lampCore)" filter="url(#i6p20p1strongglow)"/>
    <!-- Lamp post (faint vertical) -->
    <line x1="0" y1="0" x2="0" y2="130" stroke="#1a0c08" stroke-width="1.4" opacity="0.85"/>
    <!-- Lamp head -->
    <rect x="-4" y="-7" width="8" height="14" fill="#1a0c08" stroke="#3a2418" stroke-width="0.4"/>
    <ellipse cx="0" cy="-1" rx="3" ry="4" fill="#fff8c8" filter="url(#i6p20p1bloom)"/>
    <!-- Cobble pool reflection beneath -->
    <ellipse cx="0" cy="130" rx="40" ry="6" fill="#a87838" opacity="0.55" filter="url(#i6p20p1glow)"/>
  </g>

  <!-- Right gas lamp (closer) -->
  <g transform="translate(580 110)">
    <ellipse cx="0" cy="0" rx="44" ry="40" fill="url(#i6p20p1lampHalo)" filter="url(#i6p20p1megaglow)"/>
    <circle cx="0" cy="0" r="18" fill="url(#i6p20p1lampCore)" filter="url(#i6p20p1strongglow)"/>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#1a0c08" stroke-width="1.4" opacity="0.85"/>
    <rect x="-5" y="-10" width="10" height="18" fill="#1a0c08" stroke="#3a2418" stroke-width="0.4"/>
    <ellipse cx="0" cy="-1" rx="4" ry="5" fill="#fff8c8" filter="url(#i6p20p1bloom)"/>
    <ellipse cx="0" cy="160" rx="50" ry="8" fill="#a87838" opacity="0.7" filter="url(#i6p20p1glow)"/>
  </g>

  <!-- Distant lamp at far end of street -->
  <g transform="translate(371 150)">
    <ellipse cx="0" cy="0" rx="22" ry="20" fill="url(#i6p20p1lampHalo)" filter="url(#i6p20p1strongglow)" opacity="0.7"/>
    <circle cx="0" cy="0" r="8" fill="#fff8c8" opacity="0.85" filter="url(#i6p20p1bloom)"/>
  </g>

  <!-- ===== COBBLESTONES — damp, reflective ===== -->
  <rect x="0" y="240" width="742" height="80" fill="url(#i6p20p1cobble)"/>
  <!-- Damp wet sheen (reflection of amber) -->
  <ellipse cx="180" cy="270" rx="100" ry="6" fill="#a87838" opacity="0.4" filter="url(#i6p20p1glow)"/>
  <ellipse cx="580" cy="280" rx="120" ry="6" fill="#a87838" opacity="0.55" filter="url(#i6p20p1glow)"/>
  <ellipse cx="371" cy="280" rx="80" ry="3" fill="#a87838" opacity="0.35" filter="url(#i6p20p1glow)"/>
  <!-- Cobble seams -->
  <g stroke="#080608" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,260 Q140,261 280,260 Q420,259 560,260 Q650,261 742,260"/>
    <path d="M0,275 Q140,276 280,275 Q420,274 560,275 Q650,276 742,275"/>
    <path d="M0,290 Q140,291 280,290 Q420,289 560,290 Q650,291 742,290"/>
    <path d="M0,305 Q140,306 280,305 Q420,304 560,305 Q650,306 742,305"/>
  </g>
  <!-- Faint cobble curves -->
  <g stroke="#080608" stroke-width="0.3" opacity="0.4" fill="none">
    <path d="M40,260 L40,275"/>
    <path d="M80,260 L80,275"/>
    <path d="M120,260 L120,275"/>
    <path d="M160,260 L160,275"/>
    <path d="M200,260 L200,275"/>
    <path d="M240,275 L240,290"/>
    <path d="M280,275 L280,290"/>
    <path d="M320,275 L320,290"/>
    <path d="M360,275 L360,290"/>
    <path d="M400,290 L400,305"/>
    <path d="M440,290 L440,305"/>
    <path d="M480,290 L480,305"/>
    <path d="M520,290 L520,305"/>
    <path d="M560,290 L560,305"/>
    <path d="M600,290 L600,305"/>
  </g>

  <!-- ===== THEODORE — walking right of center, hands in pockets ===== -->
  <g transform="translate(371 270)">
    <!-- Cast shadow on cobbles -->
    <ellipse cx="0" cy="2" rx="14" ry="2" fill="#000" opacity="0.7"/>

    <!-- Boots -->
    <ellipse cx="-7" cy="0" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="7" cy="0" rx="5" ry="2" fill="#1a0c04"/>

    <!-- Patched trousers, mid-stride (right leg forward) -->
    <path d="M-9,-2 L-12,-30 L-4,-50 L0,-30 Z" fill="#3a3028"/>
    <path d="M9,-2 L12,-30 L4,-46 L0,-30 Z" fill="#3a3028"/>
    <!-- Knee patch -->
    <rect x="-7" y="-32" width="6" height="6" fill="#5a3018" stroke="#3a1808" stroke-width="0.4" opacity="0.85"/>

    <!-- Waistcoat / linen shirt -->
    <path d="M-12,-50 L-12,-90 L12,-90 L12,-50 Z" fill="#d4c4a8"/>
    <path d="M-14,-88 L-12,-50 L-2,-50 L-2,-88 Z" fill="#5a3018"/>
    <path d="M14,-88 L12,-50 L2,-50 L2,-88 Z" fill="#5a3018"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-80" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-72" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-64" r="0.85" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-90 L0,-88 L7,-90 L7,-86 L0,-83 L-7,-86 Z" fill="#e0d4b8"/>

    <!-- POCKET (Luma's pocket) -->
    <rect x="3" y="-84" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
    <!-- Blue-violet glow from pocket -->
    <ellipse cx="9" cy="-78" rx="6" ry="4" fill="url(#i6p20p1pocketGlow)" filter="url(#i6p20p1strongglow)"/>

    <!-- LUMA peering from pocket — tiny face visible -->
    <g transform="translate(9 -78)">
      <ellipse cx="0" cy="0" rx="1.8" ry="1.4" fill="#7a4838"/>
      <!-- Holographic lenses dimly active -->
      <ellipse cx="-0.7" cy="0" rx="0.55" ry="0.4" fill="#a888ff" filter="url(#i6p20p1bloom)" opacity="0.85"/>
      <ellipse cx="0.7" cy="0" rx="0.55" ry="0.4" fill="#a888ff" filter="url(#i6p20p1bloom)" opacity="0.85"/>
      <!-- Stone dust on her -->
      <line x1="-1.4" y1="-0.4" x2="1.4" y2="-0.4" stroke="#a8a098" stroke-width="0.3" opacity="0.85"/>
    </g>

    <!-- Arms — both in pockets (right hand in side pocket) -->
    <path d="M-12,-86 L-22,-66 L-22,-46 L-14,-50 Z" fill="#5a3018"/>
    <path d="M12,-86 L20,-66 L20,-46 L14,-50 Z" fill="#5a3018"/>

    <!-- Head — looking forward, slightly thoughtful -->
    <ellipse cx="0" cy="-104" rx="11" ry="12" fill="#a87838"/>
    <!-- Sandy-brown hair -->
    <path d="M-10,-114 Q-7,-122 0,-124 Q7,-122 10,-114 L10,-105 Q7,-110 0,-110 Q-7,-110 -10,-105 Z" fill="#9a7038"/>
    <!-- Tousled bits -->
    <path d="M-7,-120 L-5,-124 L-8,-124 Z" fill="#9a7038"/>
    <path d="M5,-120 L7,-124 L4,-124 Z" fill="#9a7038"/>
    <!-- Eyes forward -->
    <ellipse cx="-3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.7" fill="#5a3818"/>
    <circle cx="3" cy="-104" r="0.7" fill="#5a3818"/>
    <!-- Brow slightly furrowed (thoughtful) -->
    <path d="M-7,-110 L0,-110" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M7,-110 L0,-110" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth -->
    <line x1="-2" y1="-96" x2="2" y2="-96" stroke="#3a1808" stroke-width="0.4"/>

    <!-- Amber glow on hair from gas lamp behind -->
    <ellipse cx="0" cy="-118" rx="6" ry="2" fill="#d8a060" opacity="0.55" filter="url(#i6p20p1bloom)"/>
  </g>

  <!-- Drifting fog wisps in midground -->
  <g stroke="#a8a8b0" stroke-width="0.7" opacity="0.55" fill="none">
    <path d="M50,200 Q200,198 350,202"/>
    <path d="M400,180 Q550,178 700,182"/>
    <path d="M100,230 Q250,228 380,232"/>
  </g>
  <!-- Heavier fog patches -->
  <g fill="#a8a8b0" opacity="0.4">
    <ellipse cx="280" cy="190" rx="60" ry="14"/>
    <ellipse cx="500" cy="200" rx="80" ry="16"/>
  </g>

  <!-- THEODORE dialogue -->
  <g>
    <rect x="14" y="14" width="280" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="200,54 212,54 204,64" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="200.5" y1="54" x2="211.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">This fog'll hold till morning.</text>

  <!-- LUMA dialogue (small, from pocket) -->
  <g>
    <rect x="488" y="14" width="240" height="34" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95"/>
    <polygon points="540,48 552,48 544,58" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="540.5" y1="48" x2="551.5" y2="48" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="496" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a3ad8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(from pocket)</tspan></text>
  <text x="496" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Visibility at four metres. Declining.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
