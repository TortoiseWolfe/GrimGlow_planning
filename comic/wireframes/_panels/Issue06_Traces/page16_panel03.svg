<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 6 — Page 16 — Panel 3: Theodore lifts Luma to waistcoat pocket — practiced gentle scale tenderness, "Steady. / Steady."</title>
  <desc>50mm medium eye level. Theodore's oil-stained hands cupping Luma — fingers as tall as she is. She steps from palm into pocket, hand bracing on edge. Practiced trust. Lower lip between his teeth in concentration. She looks up at his enormous face with gratitude.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p16p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="i6p16p3leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p16p3linen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4c4a8"/>
      <stop offset="100%" stop-color="#a8987c"/>
    </linearGradient>
    <linearGradient id="i6p16p3lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p16p3ambient" cx="80%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#a89888" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p16p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p16p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#i6p16p3bg)"/>
  <ellipse cx="366" cy="0" rx="280" ry="280" fill="url(#i6p16p3ambient)" filter="url(#i6p16p3glow)"/>

  <!-- Theodore's chest/waistcoat occupying the right side -->
  <rect x="200" y="40" width="166" height="324" fill="url(#i6p16p3leather)"/>
  <!-- Linen visible at top -->
  <path d="M200,40 L240,30 L300,30 L366,40 L366,80 L200,80 Z" fill="url(#i6p16p3linen)"/>
  <!-- Wear/grain on waistcoat -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M200,140 Q280,144 366,140"/>
    <path d="M200,200 Q280,204 366,200"/>
    <path d="M200,280 Q280,284 366,280"/>
  </g>

  <!-- WAISTCOAT BREAST POCKET — visible on left side of his waistcoat, central in frame -->
  <rect x="220" y="100" width="100" height="120" fill="#3a1808" stroke="#1a0c04" stroke-width="2"/>
  <rect x="220" y="100" width="100" height="14" fill="#5a3018" stroke="#1a0c04" stroke-width="0.85"/>
  <line x1="220" y1="114" x2="320" y2="114" stroke="#7a4818" stroke-width="0.85" opacity="0.85"/>
  <!-- Pocket inner darkness -->
  <rect x="226" y="118" width="88" height="98" fill="#0a0408"/>
  <!-- Subtle glow inside pocket -->
  <ellipse cx="270" cy="170" rx="40" ry="34" fill="#5a3ad8" opacity="0.32" filter="url(#i6p16p3glow)"/>
  <!-- Worn stitching around pocket border -->
  <g stroke="#a8784c" stroke-width="0.4" opacity="0.7" stroke-dasharray="2 2" fill="none">
    <path d="M222,102 L318,102 L318,218 L222,218 Z"/>
  </g>

  <!-- ===== THEODORE'S HANDS — cupped, oil-stained, fingers as tall as Luma is, lifting toward pocket ===== -->
  <!-- Right hand from below-right, holding Luma -->
  <g transform="translate(140 200)">
    <!-- Wrist trailing off-frame bottom-left -->
    <path d="M-100,80 L-80,120 L-40,120 L-20,80 Z" fill="url(#i6p16p3leather)"/>
    <line x1="-100" y1="80" x2="-20" y2="80" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
    <!-- Forearm linen -->
    <path d="M-100,80 L-80,40 L-40,40 L-20,80 Z" fill="url(#i6p16p3linen)"/>

    <!-- Wrist (skin) -->
    <path d="M-80,40 L-40,40 L-30,0 L-90,0 Z" fill="#a87838"/>

    <!-- HAND palm/back — large, cupped -->
    <path d="M-90,0 L-30,0 L-10,-40 L-100,-40 Z" fill="#a87838"/>
    <!-- Knuckle highlights -->
    <ellipse cx="-70" cy="-20" rx="6" ry="2" fill="#5a3028" opacity="0.55"/>
    <ellipse cx="-50" cy="-22" rx="6" ry="2" fill="#5a3028" opacity="0.55"/>
    <ellipse cx="-30" cy="-20" rx="6" ry="2" fill="#5a3028" opacity="0.55"/>

    <!-- Fingers extending UP/UPWARD (cupped to lift Luma) -->
    <!-- Index -->
    <path d="M-30,-40 L-22,-80 L-10,-80 L-10,-40 Z" fill="#a87838"/>
    <line x1="-26" y1="-60" x2="-14" y2="-60" stroke="#5a3028" stroke-width="0.55" opacity="0.85"/>
    <!-- Middle (tallest) -->
    <path d="M-50,-40 L-46,-90 L-30,-90 L-30,-40 Z" fill="#a87838"/>
    <line x1="-46" y1="-66" x2="-30" y2="-66" stroke="#5a3028" stroke-width="0.55" opacity="0.85"/>
    <!-- Ring -->
    <path d="M-70,-40 L-68,-82 L-52,-82 L-50,-40 Z" fill="#a87838"/>
    <line x1="-66" y1="-60" x2="-52" y2="-60" stroke="#5a3028" stroke-width="0.55" opacity="0.85"/>
    <!-- Pinky (shortest) -->
    <path d="M-90,-40 L-92,-72 L-76,-72 L-72,-40 Z" fill="#a87838"/>
    <line x1="-86" y1="-58" x2="-76" y2="-58" stroke="#5a3028" stroke-width="0.55" opacity="0.85"/>
    <!-- Fingernails -->
    <ellipse cx="-16" cy="-78" rx="3" ry="1.4" fill="#7a5028"/>
    <ellipse cx="-38" cy="-88" rx="3" ry="1.4" fill="#7a5028"/>
    <ellipse cx="-60" cy="-80" rx="3" ry="1.4" fill="#7a5028"/>
    <ellipse cx="-84" cy="-70" rx="3" ry="1.4" fill="#7a5028"/>
    <!-- BRASS GEAR RING on left index -->
    <g transform="translate(-16 -60)">
      <circle cx="0" cy="0" r="3" fill="none" stroke="#c89058" stroke-width="1.4" filter="url(#i6p16p3bloom)"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.85" filter="url(#i6p16p3bloom)"/>
    </g>
    <!-- Oil stains on hand -->
    <ellipse cx="-50" cy="-10" rx="11" ry="3" fill="#0a0604" opacity="0.55"/>
    <ellipse cx="-80" cy="20" rx="9" ry="3" fill="#0a0604" opacity="0.55"/>
  </g>

  <!-- ===== LUMA — stepping from palm INTO POCKET, one hand bracing on pocket edge ===== -->
  <g transform="translate(220 130)">
    <!-- Body — stepping forward into pocket -->
    <ellipse cx="-7" cy="22" rx="2.4" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="22" rx="2.4" ry="1.4" fill="#0a0408"/>
    <!-- Trousers — leading leg into pocket, back leg still on palm -->
    <rect x="-9" y="2" width="3" height="20" fill="url(#i6p16p3lumaSuit)"/>
    <path d="M0,2 L4,2 L7,22 L2,22 Z" fill="url(#i6p16p3lumaSuit)"/>
    <ellipse cx="-7" cy="14" rx="2.4" ry="0.85" fill="#a8a098" opacity="0.95"/>
    <ellipse cx="3" cy="14" rx="2.4" ry="0.85" fill="#a8a098" opacity="0.95"/>
    <!-- Torso -->
    <path d="M-9,2 L-9,-14 L9,-14 L9,2 Z" fill="url(#i6p16p3lumaSuit)"/>
    <line x1="-7" y1="-6" x2="7" y2="-6" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p16p3bloom)"/>
    <ellipse cx="-5" cy="-2" rx="3" ry="0.85" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="5" cy="-2" rx="3" ry="0.85" fill="#a8a098" opacity="0.85"/>
    <line x1="-9" y1="-12" x2="-5" y2="-8" stroke="#7a6c50" stroke-width="0.4" opacity="0.55"/>
    <!-- Shoulders -->
    <path d="M-9,-14 Q-7,-18 0,-19 Q7,-18 9,-14 Z" fill="url(#i6p16p3lumaSuit)"/>

    <!-- LEFT arm bracing on pocket edge (extending forward) -->
    <path d="M-9,-14 L-15,-10 L-13,-2 L-7,-6 Z" fill="url(#i6p16p3lumaSuit)"/>
    <ellipse cx="-15" cy="-10" rx="2.4" ry="1.4" fill="#7a4838"/>
    <!-- Hand pressing on pocket lip -->
    <ellipse cx="-19" cy="-10" rx="2" ry="1" fill="#a87838"/>

    <!-- RIGHT arm — at side, scanner held against side -->
    <path d="M9,-14 L13,-8 L13,2 L9,0 Z" fill="url(#i6p16p3lumaSuit)"/>
    <ellipse cx="13" cy="2" rx="1.4" ry="0.85" fill="#7a4838"/>

    <!-- Head — looking UP toward Theodore's face (left direction in this composition) -->
    <ellipse cx="0" cy="-26" rx="6" ry="7" fill="#7a4838"/>
    <!-- Lenses pushed up onto forehead -->
    <ellipse cx="-3" cy="-32" rx="2" ry="1.4" fill="#a888ff" opacity="0.4"/>
    <ellipse cx="3" cy="-32" rx="2" ry="1.4" fill="#a888ff" opacity="0.4"/>
    <ellipse cx="-3" cy="-32" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.7" filter="url(#i6p16p3bloom)"/>
    <ellipse cx="3" cy="-32" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.7" filter="url(#i6p16p3bloom)"/>
    <!-- Hair -->
    <path d="M-5,-30 Q-4,-34 0,-34 Q4,-34 5,-30 L5,-26 Q3,-29 0,-29 Q-3,-29 -5,-26 Z" fill="#0a0604"/>
    <circle cx="0" cy="-32" r="0.4" fill="#a8a098" opacity="0.7"/>
    <line x1="0" y1="-33" x2="1" y2="-35" stroke="#5a3ad8" stroke-width="0.4" opacity="0.85" filter="url(#i6p16p3bloom)"/>
    <!-- Braid -->
    <path d="M5,-26 Q9,-12 7,-2" stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Eyes — LOOKING UP-LEFT (toward Theodore's face) -->
    <ellipse cx="-3" cy="-26" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-4" cy="-26" r="0.7" fill="#5a3818"/>
    <ellipse cx="3" cy="-26" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="2" cy="-26" r="0.7" fill="#5a3818"/>
    <!-- Brows soft -->
    <path d="M-6,-30 L-1,-30" stroke="#0a0604" stroke-width="0.55"/>
    <path d="M1,-30 L6,-30" stroke="#0a0604" stroke-width="0.55"/>
    <!-- Mouth — slight, gentle (gratitude) -->
    <path d="M-2,-19 L2,-19" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== THEODORE'S FACE upper-left of frame, looking DOWN at Luma ===== -->
  <g transform="translate(60 60)">
    <!-- Lower part of face only (upper out of frame) — chin/mouth/nose visible -->
    <path d="M-50,40 Q-40,80 0,90 Q40,80 50,40 L50,-30 L-50,-30 Z" fill="#a87838"/>
    <!-- Hair edge -->
    <path d="M-50,-30 L-50,0 Q-40,-20 -20,-30 L-50,-30 Z" fill="#9a7038"/>
    <path d="M50,-30 L50,0 Q40,-20 20,-30 L50,-30 Z" fill="#9a7038"/>
    <!-- Eye looking DOWN at Luma (just one visible at frame edge) -->
    <ellipse cx="20" cy="20" rx="6" ry="3" fill="#fff8e8"/>
    <circle cx="22" cy="22" r="2.4" fill="#5a3818"/>
    <circle cx="22" cy="22" r="0.85" fill="#fff8ff"/>
    <!-- Brow furrowed slightly (concentration) -->
    <path d="M14,8 L26,10" stroke="#5a3018" stroke-width="1.2"/>
    <!-- Freckles -->
    <circle cx="10" cy="40" r="0.55" fill="#7a3018"/>
    <circle cx="0" cy="46" r="0.55" fill="#7a3018"/>
    <circle cx="-12" cy="42" r="0.55" fill="#7a3018"/>
    <!-- Nose tip -->
    <path d="M0,40 L-3,55 L0,60 L3,55 Z" fill="#7a4828"/>
    <!-- Mouth — LOWER LIP between teeth (concentration) -->
    <path d="M-9,72 L9,72" stroke="#3a1808" stroke-width="1.2"/>
    <path d="M-7,76 L0,80 L7,76" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.85"/>
    <!-- Gentle highlight on cheek -->
    <ellipse cx="-26" cy="50" rx="11" ry="6" fill="#a89888" opacity="0.4"/>
  </g>

  <!-- THEODORE dialogue -->
  <g>
    <rect x="14" y="200" width="120" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="60,240 72,240 64,250" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="60.5" y1="240" x2="71.5" y2="240" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Steady.</text>

  <!-- LUMA dialogue -->
  <g>
    <rect x="14" y="260" width="120" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="60,260 72,260 64,250" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="60.5" y1="260" x2="71.5" y2="260" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="294" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Steady.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q120,92 240,88 Q330,86 366,90"/>
    <path d="M0,300 Q120,302 240,298 Q330,296 366,300"/>
  </g>
</svg>
