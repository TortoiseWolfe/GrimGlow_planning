<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 421.5" width="366" height="421.5">
  <title>Issue 6 — Page 10 — Panel 3: Theodore at basement door — Luma scanner active reading the space beyond</title>
  <desc>50mm medium low angle. Theodore at bottom of stone steps facing heavy old wooden door (blistered paint, iron studs, simple latch). Stairway rising back to grey street light above. Hand on latch. Luma emerged from pocket, scanner active casting blue-violet on door surface.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p10p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="60%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p10p3door" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="i6p10p3stoneSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p10p3lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p10p3theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p10p3theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p10p3greyAbove" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8a098" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#605850" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p10p3scannerWash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p10p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p10p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="421.5" fill="url(#i6p10p3bg)"/>

  <!-- Grey light from above (stairs receding behind Theodore) -->
  <ellipse cx="183" cy="0" rx="180" ry="80" fill="url(#i6p10p3greyAbove)" filter="url(#i6p10p3glow)"/>
  <!-- Stairwell rising back at top -->
  <polygon points="60,0 306,0 240,60 130,60" fill="#605850" opacity="0.85"/>
  <line x1="60" y1="0" x2="306" y2="0" stroke="#403830" stroke-width="0.85"/>

  <!-- Receding stone steps faintly visible behind Theodore -->
  <g opacity="0.55" fill="#3a3028" stroke="#1a1410" stroke-width="0.55">
    <path d="M130,60 L240,60 L230,72 L140,72 Z"/>
    <path d="M140,76 L230,76 L218,90 L150,90 Z"/>
    <path d="M150,94 L218,94 L210,108 L160,108 Z"/>
  </g>

  <!-- LEFT side wall of basement (close, dark) -->
  <rect x="0" y="100" width="40" height="321.5" fill="url(#i6p10p3stoneSide)"/>
  <g stroke="#0a0608" stroke-width="0.55" opacity="0.7" fill="none">
    <line x1="0" y1="160" x2="40" y2="160"/>
    <line x1="0" y1="220" x2="40" y2="220"/>
    <line x1="0" y1="280" x2="40" y2="280"/>
    <line x1="0" y1="340" x2="40" y2="340"/>
  </g>

  <!-- RIGHT side wall -->
  <rect x="326" y="100" width="40" height="321.5" fill="url(#i6p10p3stoneSide)"/>
  <g stroke="#0a0608" stroke-width="0.55" opacity="0.7" fill="none">
    <line x1="326" y1="160" x2="366" y2="160"/>
    <line x1="326" y1="220" x2="366" y2="220"/>
    <line x1="326" y1="280" x2="366" y2="280"/>
    <line x1="326" y1="340" x2="366" y2="340"/>
  </g>

  <!-- ===== HEAVY WOODEN DOOR — center frame ===== -->
  <rect x="80" y="120" width="206" height="280" fill="url(#i6p10p3door)"/>
  <!-- Door frame -->
  <rect x="80" y="120" width="206" height="280" fill="none" stroke="#1a0c04" stroke-width="2.4"/>
  <!-- Vertical planks -->
  <line x1="120" y1="120" x2="120" y2="400" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <line x1="160" y1="120" x2="160" y2="400" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <line x1="200" y1="120" x2="200" y2="400" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <line x1="240" y1="120" x2="240" y2="400" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <!-- Wood grain -->
  <g stroke="#5a3018" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M82,160 Q100,162 118,160"/>
    <path d="M122,200 Q140,202 158,200"/>
    <path d="M162,240 Q180,242 198,240"/>
    <path d="M202,280 Q220,282 238,280"/>
    <path d="M82,320 Q100,322 118,320"/>
    <path d="M242,360 Q260,362 280,360"/>
    <path d="M122,150 Q140,152 158,150"/>
    <path d="M162,180 Q180,182 198,180"/>
  </g>
  <!-- BLISTERED PAINT — peeling -->
  <g fill="#5a3018" opacity="0.55">
    <ellipse cx="100" cy="200" rx="11" ry="6"/>
    <ellipse cx="180" cy="160" rx="14" ry="7"/>
    <ellipse cx="220" cy="240" rx="11" ry="5"/>
    <ellipse cx="140" cy="280" rx="9" ry="4"/>
    <ellipse cx="260" cy="200" rx="11" ry="6"/>
    <ellipse cx="100" cy="340" rx="9" ry="4"/>
  </g>
  <g fill="#1a0c04" opacity="0.7">
    <ellipse cx="98" cy="198" rx="6" ry="3"/>
    <ellipse cx="180" cy="160" rx="8" ry="3.5"/>
    <ellipse cx="222" cy="240" rx="6" ry="2.4"/>
  </g>
  <!-- IRON STUDS (rivets) — geometric grid -->
  <g fill="#1a0c04" stroke="#0a0408" stroke-width="0.55">
    <circle cx="92" cy="140" r="3.5"/>
    <circle cx="132" cy="140" r="3.5"/>
    <circle cx="172" cy="140" r="3.5"/>
    <circle cx="212" cy="140" r="3.5"/>
    <circle cx="252" cy="140" r="3.5"/>
    <circle cx="92" cy="240" r="3.5"/>
    <circle cx="132" cy="240" r="3.5"/>
    <circle cx="172" cy="240" r="3.5"/>
    <circle cx="212" cy="240" r="3.5"/>
    <circle cx="252" cy="240" r="3.5"/>
    <circle cx="92" cy="380" r="3.5"/>
    <circle cx="132" cy="380" r="3.5"/>
    <circle cx="172" cy="380" r="3.5"/>
    <circle cx="212" cy="380" r="3.5"/>
    <circle cx="252" cy="380" r="3.5"/>
  </g>
  <!-- Stud highlights -->
  <g fill="#5a4838" opacity="0.85">
    <circle cx="91" cy="139" r="1"/>
    <circle cx="131" cy="139" r="1"/>
    <circle cx="171" cy="139" r="1"/>
    <circle cx="211" cy="139" r="1"/>
    <circle cx="251" cy="139" r="1"/>
  </g>
  <!-- IRON LATCH (right side, mid-height) -->
  <rect x="266" y="280" width="12" height="40" fill="#1a0c04"/>
  <rect x="262" y="284" width="20" height="6" fill="#3a2818"/>
  <rect x="262" y="312" width="20" height="6" fill="#3a2818"/>
  <!-- Latch handle (thumb lever) -->
  <path d="M266,295 L274,290 L280,300 L272,302 Z" fill="#1a0c04"/>
  <ellipse cx="270" cy="294" rx="2" ry="1.4" fill="#5a3018" opacity="0.7"/>

  <!-- Scanner wash on door surface -->
  <ellipse cx="160" cy="240" rx="180" ry="100" fill="url(#i6p10p3scannerWash)" filter="url(#i6p10p3glow)" opacity="0.65"/>
  <!-- Scanner overlay scrolling on door -->
  <g stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p10p3bloom)" fill="none">
    <line x1="100" y1="180" x2="240" y2="180" stroke-dasharray="3 2"/>
    <line x1="100" y1="200" x2="240" y2="200" stroke-dasharray="3 2"/>
    <line x1="100" y1="220" x2="240" y2="220" stroke-dasharray="3 2"/>
    <line x1="100" y1="260" x2="240" y2="260" stroke-dasharray="3 2"/>
    <line x1="100" y1="280" x2="240" y2="280" stroke-dasharray="3 2"/>
  </g>
  <!-- Bio-trace flecks reading on door -->
  <g fill="#5a3a78" opacity="0.7" filter="url(#i6p10p3bloom)">
    <circle cx="120" cy="200" r="1"/>
    <circle cx="180" cy="220" r="0.85"/>
    <circle cx="220" cy="260" r="1"/>
    <circle cx="160" cy="280" r="0.85"/>
    <circle cx="100" cy="240" r="0.7"/>
  </g>

  <!-- Stone floor at bottom -->
  <rect x="0" y="400" width="366" height="21.5" fill="#0a0408"/>

  <!-- ===== THEODORE — at door, hand on latch, slight crouch from descent ===== -->
  <g transform="translate(266 400)">
    <!-- Boot -->
    <ellipse cx="-7" cy="0" rx="9" ry="3" fill="#1a0c04"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#1a0c04"/>
    <!-- Trousers -->
    <path d="M-10,-50 L-2,-50 L-4,0 L-12,0 Z" fill="url(#i6p10p3theoTrousers)"/>
    <path d="M2,-50 L10,-50 L12,0 L4,0 Z" fill="url(#i6p10p3theoTrousers)"/>
    <rect x="-10" y="-50" width="22" height="3" fill="#3a1808"/>
    <!-- Shirt + waistcoat -->
    <path d="M-11,-110 L-10,-50 L11,-50 L12,-110 Z" fill="#d4c4a8"/>
    <path d="M-13,-108 L-11,-50 L-2,-50 L-2,-108 Z" fill="url(#i6p10p3theoWaistcoat)"/>
    <path d="M12,-108 L13,-50 L2,-50 L2,-108 Z" fill="url(#i6p10p3theoWaistcoat)"/>
    <!-- Pocket — Luma OUT, glow visible -->
    <rect x="3" y="-100" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M3,-100 L14,-100 L14,-96 L3,-96 Z" fill="#5a3018" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="5" y="-96" width="7" height="9" fill="#5a3ad8" opacity="0.65" filter="url(#i6p10p3bloom)"/>
    <ellipse cx="9" cy="-91" rx="11" ry="6" fill="#a888ff" opacity="0.55" filter="url(#i6p10p3glow)"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-92" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-74" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-56" r="0.85" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-110 L0,-108 L7,-110 L7,-106 L0,-102 L-7,-106 Z" fill="#e0d4b8"/>
    <!-- LEFT arm reaching forward to the door latch -->
    <path d="M-13,-108 L-22,-90 L-22,-50 L-13,-50 Z" fill="url(#i6p10p3theoWaistcoat)"/>
    <ellipse cx="-22" cy="-52" rx="2.4" ry="1.4" fill="#a87838"/>
    <!-- RIGHT arm extended forward TOWARD LATCH -->
    <path d="M12,-108 L26,-92 L40,-72 L36,-66 L22,-78 L14,-92 Z" fill="url(#i6p10p3theoWaistcoat)"/>
    <ellipse cx="40" cy="-72" rx="3" ry="2" fill="#a87838"/>
    <!-- Hand reaching latch (off-frame right edge area) -->
    <ellipse cx="46" cy="-70" rx="3" ry="2.4" fill="#a87838"/>
    <!-- Brass ring on left index — catching scanner light -->
    <circle cx="-22" cy="-52" r="0.95" fill="#c89058" filter="url(#i6p10p3bloom)" opacity="0.95"/>
    <!-- Head + neck — eyes forward at door -->
    <rect x="-3" y="-118" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-130" rx="13" ry="14" fill="#a87838"/>
    <path d="M-12,-138 Q-9,-148 0,-150 Q9,-148 12,-138 L12,-130 Q8,-136 0,-136 Q-8,-136 -12,-130 Z" fill="#9a7038"/>
    <path d="M-7,-146 L-5,-150 L-8,-150 Z" fill="#9a7038"/>
    <path d="M5,-146 L7,-150 L4,-150 Z" fill="#9a7038"/>
    <!-- Eyes forward (looking at door) -->
    <ellipse cx="-3" cy="-130" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-129" r="0.7" fill="#5a3818"/>
    <ellipse cx="3" cy="-130" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-129" r="0.7" fill="#5a3818"/>
    <path d="M-7,-136 L-2,-136" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M2,-136 L7,-136" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M-3,-120 L3,-120" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Faint blue-violet rim from pocket on chin -->
    <path d="M-3,-118 L3,-118" stroke="#a888ff" stroke-width="0.55" opacity="0.7" filter="url(#i6p10p3bloom)"/>
  </g>

  <!-- ===== LUMA emerged from pocket, scanner extended toward door ===== -->
  <g transform="translate(275 308)">
    <!-- Suit shoulders/torso visible above pocket -->
    <path d="M-8,12 L-6,-4 L6,-4 L8,12 Z" fill="url(#i6p10p3lumaSuit)"/>
    <line x1="-5" y1="2" x2="5" y2="2" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p10p3bloom)"/>
    <ellipse cx="-6" cy="-4" rx="2" ry="0.85" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="6" cy="-4" rx="2" ry="0.85" fill="#5a4838" opacity="0.55"/>
    <!-- LEFT arm forward toward door, holding scanner -->
    <path d="M-6,-4 L-16,-2 L-22,4 L-12,8 Z" fill="url(#i6p10p3lumaSuit)"/>
    <ellipse cx="-22" cy="4" rx="2" ry="1.2" fill="#7a4838"/>
    <!-- SCANNER projecting beam at door -->
    <rect x="-30" y="0" width="9" height="5" rx="0.55" fill="#3a2068" stroke="#a888ff" stroke-width="0.55"/>
    <rect x="-29" y="2" width="6" height="2" fill="#5a3ad8" filter="url(#i6p10p3bloom)"/>
    <ellipse cx="-25" cy="3" rx="9" ry="3" fill="#a888ff" opacity="0.85" filter="url(#i6p10p3bloom)"/>
    <!-- Beam extending toward door (off-frame left) -->
    <path d="M-30,0 L-100,-14 L-100,-10 L-30,4 Z" fill="#a888ff" opacity="0.4" filter="url(#i6p10p3glow)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-12" rx="6" ry="7" fill="#7a4838"/>
    <ellipse cx="0" cy="-9" rx="4" ry="2" fill="#a888ff" opacity="0.45" filter="url(#i6p10p3bloom)"/>
    <path d="M-5,-16 Q-4,-20 0,-20 Q4,-20 5,-16 L5,-12 Q3,-15 0,-15 Q-3,-15 -5,-12 Z" fill="#0a0604"/>
    <line x1="-3" y1="-18" x2="-2" y2="-19" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p10p3bloom)"/>
    <line x1="2" y1="-19" x2="3" y2="-18" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p10p3bloom)"/>
    <!-- Braid -->
    <path d="M5,-12 Q9,0 7,12" stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Lenses with crack -->
    <ellipse cx="-2" cy="-12" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="2" cy="-12" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="-2" cy="-12" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.95"/>
    <ellipse cx="2" cy="-12" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.95"/>
    <line x1="-3" y1="-13" x2="-1" y2="-11" stroke="#fff8ff" stroke-width="0.4" opacity="0.95"/>
    <ellipse cx="-2" cy="-12" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-12" r="0.45" fill="#0a0604"/>
    <ellipse cx="2" cy="-12" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-12" r="0.45" fill="#0a0604"/>
  </g>

  <!-- THEODORE dialogue (low) -->
  <g>
    <rect x="14" y="14" width="120" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="60,54 72,54 64,64" fill="white" stroke="#6a4220" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="60.5" y1="54" x2="71.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700" font-style="italic">THEODORE (low)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">It's not locked.</text>

  <!-- LUMA dialogue -->
  <g>
    <rect x="14" y="64" width="338" height="56" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,120 172,120 164,130" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="120" x2="171.5" y2="120" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA</text>
  <text x="22" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">It wouldn't be. What came here didn't</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">use doors the way we do.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q120,202 240,198 Q330,196 366,200"/>
    <path d="M0,360 Q120,362 240,358 Q330,356 366,360"/>
  </g>
</svg>
