<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 6 — Page 5 — Panel 5: Theodore steps back from window — unease, hand near pocket — "One site down. Five to go."</title>
  <desc>50mm medium shot eye level. Theodore stepping back into shadow, hand protectively near pocket. Warm forge light on cobbles at his feet. Unease — wrongness of familiar things.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p5p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p5p5brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p5p5theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p5p5theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p5p5forgeFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a85818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p5p5pocketHint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p5p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p5p5glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#i6p5p5bg)"/>

  <!-- Background brick alley wall -->
  <rect x="0" y="0" width="366" height="280" fill="url(#i6p5p5brick)"/>
  <g stroke="#0a0408" stroke-width="0.45" opacity="0.7">
    <line x1="0" y1="40" x2="366" y2="40"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
  </g>
  <g stroke="#0a0408" stroke-width="2.4" opacity="0.55" fill="none">
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="220" y1="0" x2="220" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
  </g>
  <ellipse cx="180" cy="160" rx="80" ry="50" fill="#0a0408" opacity="0.55"/>

  <!-- Cobbles foreground -->
  <rect x="0" y="280" width="366" height="84" fill="#1a1410"/>
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,300 Q120,298 240,300 Q330,302 366,300"/>
    <path d="M0,316 Q120,314 240,316 Q330,318 366,316"/>
    <path d="M0,332 Q120,330 240,332 Q330,334 366,332"/>
    <path d="M0,348 Q120,346 240,348 Q330,350 366,348"/>
  </g>
  <!-- WARM AMBER FORGE light spilling on cobbles at Theodore's feet (off-frame source from window) -->
  <ellipse cx="280" cy="320" rx="120" ry="40" fill="url(#i6p5p5forgeFloor)" filter="url(#i6p5p5glow)"/>
  <!-- Warm rectangle hinting at window cast -->
  <path d="M280,300 L320,290 L360,310 L320,330 Z" fill="#ffaa48" opacity="0.55" filter="url(#i6p5p5bloom)"/>

  <!-- ===== THEODORE — stepping back into shadow, hand near pocket ===== -->
  <g transform="translate(160 320)">
    <!-- Boots — back leg planted, front leg pulling back -->
    <ellipse cx="-14" cy="22" rx="11" ry="3" fill="#1a0c04"/>
    <ellipse cx="14" cy="20" rx="11" ry="3" fill="#1a0c04"/>
    <!-- Trousers — slight backward step -->
    <path d="M-14,-58 L-4,-58 L-12,22 L-22,22 Z" fill="url(#i6p5p5theoTrousers)"/>
    <path d="M0,-58 L10,-58 L18,22 L8,22 Z" fill="url(#i6p5p5theoTrousers)"/>
    <!-- Patches at knees -->
    <rect x="-14" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="2" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <!-- Belt -->
    <rect x="-14" y="-58" width="24" height="3.5" fill="#3a1808"/>
    <!-- Linen + waistcoat -->
    <path d="M-15,-118 L-14,-58 L11,-58 L12,-118 Z" fill="#d4c4a8"/>
    <path d="M-17,-116 L-15,-58 L-2,-58 L-2,-116 Z" fill="url(#i6p5p5theoWaistcoat)"/>
    <path d="M12,-116 L13,-58 L0,-58 L0,-116 Z" fill="url(#i6p5p5theoWaistcoat)"/>
    <!-- Pocket -->
    <rect x="1" y="-108" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M1,-108 L12,-108 L12,-104 L1,-104 Z" fill="#5a3018" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="3" y="-104" width="7" height="9" fill="#5a3ad8" opacity="0.55" filter="url(#i6p5p5bloom)"/>
    <ellipse cx="7" cy="-99" rx="11" ry="6" fill="url(#i6p5p5pocketHint)" filter="url(#i6p5p5glow)" opacity="0.55"/>
    <!-- Buttons -->
    <circle cx="-3" cy="-100" r="0.95" fill="#3a1808"/>
    <circle cx="-3" cy="-82" r="0.95" fill="#3a1808"/>
    <circle cx="-3" cy="-64" r="0.95" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-118 L-2,-116 L7,-118 L7,-114 L-2,-110 L-7,-114 Z" fill="#e0d4b8"/>
    <!-- Arms — left arm swung back slightly, RIGHT hand protectively near pocket -->
    <path d="M-17,-116 L-26,-90 L-28,-66 L-18,-58 Z" fill="url(#i6p5p5theoWaistcoat)"/>
    <ellipse cx="-26" cy="-66" rx="2.4" ry="1.4" fill="#a87838"/>
    <!-- Right arm raised toward pocket -->
    <path d="M13,-116 L18,-94 L8,-86 L-2,-94 L0,-110 Z" fill="url(#i6p5p5theoWaistcoat)"/>
    <ellipse cx="0" cy="-90" rx="3.5" ry="2.4" fill="#a87838"/>
    <ellipse cx="-2" cy="-92" rx="1.4" ry="0.85" fill="#0a0604" opacity="0.55"/>
    <!-- Brass ring on left index -->
    <circle cx="-26" cy="-67" r="0.7" fill="#c89058" filter="url(#i6p5p5bloom)" opacity="0.85"/>

    <!-- Head + neck -->
    <rect x="-3" y="-126" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-138" rx="14" ry="16" fill="#a87838"/>
    <path d="M-13,-148 Q-10,-160 0,-162 Q10,-160 13,-148 L13,-138 Q9,-146 0,-146 Q-9,-146 -13,-138 Z" fill="#9a7038"/>
    <path d="M-7,-156 L-5,-160 L-8,-160 Z" fill="#9a7038"/>
    <path d="M5,-156 L7,-160 L4,-160 Z" fill="#9a7038"/>
    <path d="M0,-160 L2,-164 L-2,-164 Z" fill="#9a7038"/>
    <!-- Eyes — looking sideways back at the window (right) -->
    <ellipse cx="-4" cy="-138" rx="1.8" ry="1.2" fill="#fff8e8"/>
    <circle cx="-3" cy="-138" r="0.85" fill="#5a3818"/>
    <circle cx="-2.6" cy="-138.4" r="0.35" fill="#fff8ff"/>
    <ellipse cx="4" cy="-138" rx="1.8" ry="1.2" fill="#fff8e8"/>
    <circle cx="5" cy="-138" r="0.85" fill="#5a3818"/>
    <circle cx="5.4" cy="-138.4" r="0.35" fill="#fff8ff"/>
    <!-- Brows drawn — unease -->
    <path d="M-9,-144 L-2,-144" stroke="#5a3018" stroke-width="0.85"/>
    <path d="M2,-144 L9,-144" stroke="#5a3018" stroke-width="0.85"/>
    <line x1="-2" y1="-143" x2="0" y2="-140" stroke="#3a1808" stroke-width="0.45" opacity="0.7"/>
    <line x1="2" y1="-143" x2="0" y2="-140" stroke="#3a1808" stroke-width="0.45" opacity="0.7"/>
    <!-- Freckles -->
    <circle cx="-3" cy="-131" r="0.3" fill="#7a3018"/>
    <circle cx="0" cy="-130" r="0.3" fill="#7a3018"/>
    <circle cx="3" cy="-131" r="0.3" fill="#7a3018"/>
    <!-- Mouth — slight downturn -->
    <path d="M-3,-126 L3,-126" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="-3" y1="-126" x2="-4" y2="-125" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Warm amber rim catching face right side (from window behind right edge) -->
    <path d="M13,-138 Q16,-120 14,-86" stroke="#ffaa48" stroke-width="0.7" fill="none" opacity="0.7" filter="url(#i6p5p5bloom)"/>
  </g>

  <!-- THEODORE dialogue 1 -->
  <g>
    <rect x="14" y="14" width="290" height="60" rx="2" fill="white" stroke="#6a4220" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="120,74 132,74 124,84" fill="white" stroke="#6a4220" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="120.5" y1="74" x2="131.5" y2="74" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700" font-style="italic">THEODORE (low)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">I've known Will Granger since I was</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">small. He's a good fitter. But he's</text>
  <text x="22" y="71" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">not... he's not a scholar.</text>

  <!-- LUMA dialogue (from pocket) -->
  <g>
    <rect x="60" y="84" width="284" height="60" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="180,144 192,144 184,154" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="180.5" y1="144" x2="191.5" y2="144" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="68" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA (from pocket)</text>
  <text x="68" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">No. He isn't. But someone made</text>
  <text x="68" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">him one. Temporarily.</text>

  <!-- LUMA dialogue 2 - "One site down. Five to go." -->
  <g>
    <rect x="60" y="160" width="220" height="42" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,202 172,202 164,212" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="202" x2="171.5" y2="202" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="68" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA</text>
  <text x="68" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">One site down. Five to go.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q120,92 240,88 Q330,86 366,90"/>
    <path d="M0,300 Q120,302 240,298 Q330,296 366,300"/>
  </g>
</svg>
