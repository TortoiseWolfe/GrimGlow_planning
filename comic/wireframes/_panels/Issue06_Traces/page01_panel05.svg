<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 6 — Page 1 — Panel 5: Wren close-up — recognition — "Titan bio-trace."</title>
  <desc>85mm CU eye level. Wren's face tight framing, eyes narrowed seeing the system, oil-stained finger raised. Blue-violet map light reflecting in eyes; faint copper-gold glow from suit at frame edge.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p1p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="i6p1p5wrenSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="i6p1p5mapBacklight" cx="0%" cy="40%" r="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#5a3ad8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p1p5suitGlow" cx="100%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p1p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p1p5glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="238" height="364" fill="url(#i6p1p5bg)"/>

  <!-- Map backlight from left edge -->
  <ellipse cx="-20" cy="180" rx="100" ry="200" fill="url(#i6p1p5mapBacklight)" filter="url(#i6p1p5glow)"/>

  <!-- Tiny visible map fragment at left -->
  <g stroke="#a888ff" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#i6p1p5bloom)">
    <line x1="0" y1="100" x2="34" y2="100"/>
    <line x1="0" y1="160" x2="34" y2="160"/>
    <line x1="0" y1="220" x2="34" y2="220"/>
    <line x1="22" y1="80" x2="22" y2="240"/>
  </g>
  <circle cx="14" cy="170" r="6" fill="#a888ff" opacity="0.7" filter="url(#i6p1p5glow)"/>
  <circle cx="14" cy="170" r="1.6" fill="#fff8ff"/>

  <!-- Suit glow at bottom-right edge -->
  <ellipse cx="240" cy="340" rx="80" ry="80" fill="url(#i6p1p5suitGlow)" filter="url(#i6p1p5glow)"/>

  <!-- ===== WREN — CU face + raised hand ===== -->
  <!-- RAISED HAND/INDEX FINGER bottom-right, pointing toward map -->
  <g transform="translate(178 290)">
    <!-- Forearm trailing off bottom-right -->
    <path d="M-50,80 L-30,30 L-10,-10 L25,-15 L40,30 L40,80 Z" fill="url(#i6p1p5wrenSuit)"/>
    <!-- Oil stains on forearm -->
    <ellipse cx="-20" cy="22" rx="6" ry="3" fill="#0a0604" opacity="0.7"/>
    <ellipse cx="0" cy="-2" rx="4" ry="2.4" fill="#0a0604" opacity="0.65"/>
    <ellipse cx="20" cy="22" rx="5" ry="2.4" fill="#0a0604" opacity="0.6"/>
    <!-- Holo seam -->
    <line x1="-30" y1="30" x2="40" y2="30" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#i6p1p5bloom)"/>
    <!-- Wrist -->
    <path d="M-10,-10 L-2,-22 L20,-25 L25,-15 Z" fill="#a86838"/>
    <!-- Hand with index finger raised -->
    <path d="M-2,-22 L-4,-46 L0,-58 L8,-58 L10,-46 L20,-25 L0,-22 Z" fill="#a86838"/>
    <!-- Index finger pointing up-and-forward -->
    <path d="M0,-58 L-4,-78 L-12,-92 L-6,-104 L0,-100 L4,-86 L8,-72 L8,-58 Z" fill="#a86838"/>
    <!-- Knuckles -->
    <line x1="-2" y1="-50" x2="6" y2="-50" stroke="#5a3028" stroke-width="0.55" opacity="0.85"/>
    <line x1="-3" y1="-44" x2="7" y2="-44" stroke="#5a3028" stroke-width="0.4" opacity="0.7"/>
    <!-- Oil stain on hand -->
    <ellipse cx="2" cy="-50" rx="3" ry="1.6" fill="#0a0604" opacity="0.55"/>
    <ellipse cx="-4" cy="-78" rx="1.6" ry="1" fill="#0a0604" opacity="0.5"/>
    <!-- Subtle blue-violet light reflecting off pointed finger -->
    <line x1="-6" y1="-104" x2="-2" y2="-100" stroke="#a888ff" stroke-width="0.4" opacity="0.6" filter="url(#i6p1p5bloom)"/>
  </g>

  <!-- TORSO/SHOULDER fragment at bottom-left -->
  <g transform="translate(60 320)">
    <path d="M-60,80 L-60,-30 L40,-50 L60,80 Z" fill="url(#i6p1p5wrenSuit)"/>
    <line x1="-40" y1="0" x2="40" y2="-15" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#i6p1p5bloom)"/>
    <ellipse cx="-30" cy="-20" rx="14" ry="6" fill="#5a4838" opacity="0.55"/>
  </g>

  <!-- ===== WREN HEAD — large, eye level CU ===== -->
  <g transform="translate(118 168)">
    <!-- Neck -->
    <rect x="-12" y="60" width="24" height="22" fill="#a86838"/>
    <!-- Suit collar at bottom -->
    <path d="M-26,82 L-26,120 L26,120 L26,82 Z" fill="url(#i6p1p5wrenSuit)"/>
    <line x1="-20" y1="100" x2="20" y2="100" stroke="#ffd078" stroke-width="0.85" opacity="0.85" filter="url(#i6p1p5bloom)"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="56" ry="68" fill="#a86838"/>
    <!-- Cheek volumes -->
    <ellipse cx="-32" cy="20" rx="14" ry="20" fill="#8a4838" opacity="0.5"/>
    <ellipse cx="32" cy="20" rx="14" ry="20" fill="#8a4838" opacity="0.5"/>

    <!-- HAIR — high messy bun on top, with strands fallen loose -->
    <path d="M-50,-30 Q-44,-58 -20,-66 Q0,-72 20,-66 Q44,-58 50,-30 L48,-12 Q26,-32 0,-32 Q-26,-32 -48,-12 Z" fill="#0a0604"/>
    <!-- Bun on top -->
    <ellipse cx="0" cy="-72" rx="20" ry="14" fill="#0a0604"/>
    <ellipse cx="-4" cy="-78" rx="14" ry="9" fill="#1a0c04"/>
    <ellipse cx="6" cy="-76" rx="11" ry="7" fill="#1a0c04"/>
    <!-- Stray strand bun band -->
    <path d="M-12,-66 Q-8,-72 -2,-70" stroke="#1a0c04" stroke-width="0.55" fill="none" opacity="0.85"/>
    <!-- Strands fallen loose -->
    <path d="M-44,-22 Q-50,-12 -46,4" stroke="#0a0604" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M-46,4 Q-48,16 -44,24" stroke="#0a0604" stroke-width="1.1" fill="none" opacity="0.7"/>
    <path d="M44,-20 Q50,-10 48,4" stroke="#0a0604" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M48,4 Q50,18 44,28" stroke="#0a0604" stroke-width="1.1" fill="none" opacity="0.7"/>
    <!-- A few wisps near forehead -->
    <path d="M-22,-32 Q-20,-26 -16,-22" stroke="#0a0604" stroke-width="0.6" fill="none" opacity="0.75"/>
    <path d="M22,-32 Q20,-26 16,-22" stroke="#0a0604" stroke-width="0.6" fill="none" opacity="0.75"/>
    <path d="M-6,-32 Q-4,-24 -2,-18" stroke="#0a0604" stroke-width="0.55" fill="none" opacity="0.7"/>

    <!-- EYES — narrow, sharp recognition, BLUE-VIOLET map light reflected in eyes -->
    <ellipse cx="-20" cy="0" rx="11" ry="5" fill="#fff8e8"/>
    <ellipse cx="-20" cy="0" rx="9" ry="3.5" fill="#fff8ff" opacity="0.85"/>
    <circle cx="-20" cy="0" r="3.5" fill="#1a0c04"/>
    <circle cx="-21" cy="-1" r="1.4" fill="#a888ff" filter="url(#i6p1p5bloom)" opacity="0.95"/>
    <circle cx="-19" cy="0" r="0.7" fill="#fff8ff"/>
    <ellipse cx="20" cy="0" rx="11" ry="5" fill="#fff8e8"/>
    <ellipse cx="20" cy="0" rx="9" ry="3.5" fill="#fff8ff" opacity="0.85"/>
    <circle cx="20" cy="0" r="3.5" fill="#1a0c04"/>
    <circle cx="19" cy="-1" r="1.4" fill="#a888ff" filter="url(#i6p1p5bloom)" opacity="0.95"/>
    <circle cx="21" cy="0" r="0.7" fill="#fff8ff"/>

    <!-- Eyelid lines for narrowed look -->
    <path d="M-30,-3 L-12,-2" stroke="#1a0c04" stroke-width="1.4"/>
    <path d="M-29,4 L-11,4" stroke="#3a2018" stroke-width="0.85"/>
    <path d="M12,-2 L30,-3" stroke="#1a0c04" stroke-width="1.4"/>
    <path d="M11,4 L29,4" stroke="#3a2018" stroke-width="0.85"/>

    <!-- Brows — drawn down sharp -->
    <path d="M-32,-14 L-12,-10" stroke="#0a0604" stroke-width="2.2"/>
    <path d="M12,-10 L32,-14" stroke="#0a0604" stroke-width="2.2"/>
    <path d="M-26,-15 L-22,-14" stroke="#1a0c04" stroke-width="0.7"/>
    <path d="M22,-14 L26,-15" stroke="#1a0c04" stroke-width="0.7"/>

    <!-- Subtle frown crease between brows -->
    <line x1="-3" y1="-14" x2="-1" y2="-6" stroke="#1a0c04" stroke-width="0.7" opacity="0.85"/>
    <line x1="3" y1="-14" x2="1" y2="-6" stroke="#1a0c04" stroke-width="0.7" opacity="0.85"/>

    <!-- Nose -->
    <path d="M-2,4 L-6,30 L0,34 L6,30 L2,4 Z" fill="#7a4838" opacity="0.6"/>
    <line x1="-6" y1="30" x2="6" y2="30" stroke="#3a1808" stroke-width="0.45" opacity="0.7"/>

    <!-- Mouth — slightly parted, talking -->
    <path d="M-12,46 L12,46" stroke="#3a1808" stroke-width="1.4"/>
    <path d="M-10,50 L10,50" stroke="#3a1808" stroke-width="0.7" opacity="0.85"/>
    <path d="M-8,46 L-8,42" stroke="#3a1808" stroke-width="0.45" opacity="0.6"/>

    <!-- Cheekbone shadow -->
    <ellipse cx="-26" cy="14" rx="6" ry="2.4" fill="#5a3028" opacity="0.45"/>
    <ellipse cx="26" cy="14" rx="6" ry="2.4" fill="#5a3028" opacity="0.45"/>

    <!-- Ear with comm earpiece -->
    <ellipse cx="56" cy="0" rx="5" ry="8" fill="#a86838"/>
    <ellipse cx="56" cy="0" rx="3" ry="4.5" fill="#7a4838"/>
    <circle cx="58" cy="2" r="2" fill="#e8a850" filter="url(#i6p1p5bloom)" opacity="0.95"/>

    <!-- Faint blue-violet rim light on left side of face from map -->
    <path d="M-56,0 Q-58,-30 -50,-50" stroke="#a888ff" stroke-width="0.7" fill="none" opacity="0.6" filter="url(#i6p1p5bloom)"/>
    <path d="M-54,30 Q-56,50 -42,68" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.5" filter="url(#i6p1p5bloom)"/>
  </g>

  <!-- WREN dialogue (top, tight column) -->
  <g>
    <rect x="10" y="14" width="218" height="60" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="100,74 112,74 104,84" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="100.5" y1="74" x2="111.5" y2="74" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="18" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="18" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">That residue. Biological but</text>
  <text x="18" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">non-terrestrial. You're describing</text>
  <text x="18" y="71" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Titan bio-trace.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 238,300"/>
  </g>
</svg>
