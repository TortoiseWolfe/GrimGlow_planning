<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 6 — Page 20 — Panel 4: Theodore tells the Tall Ones story — sparse gaslight thickens, Luma's scanner reactivates</title>
  <desc>28mm medium wide eye level. Theodore deeper into fog, older neighborhood, narrower buildings leaning inward, gas lamps sparser. Earnest expression, telling. Luma's scanner re-engaged, blue-violet glow brightening from pocket. Two light sources: amber warmth and blue-violet alert. Stories confirm her worst analysis.</desc>

  <defs>
    <linearGradient id="i6p20p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3438"/>
      <stop offset="50%" stop-color="#5a5560"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <radialGradient id="i6p20p4lampHaloDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8a060" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p20p4scannerBright" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p20p4building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1014"/>
      <stop offset="100%" stop-color="#080406"/>
    </linearGradient>
    <linearGradient id="i6p20p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2228"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <filter id="i6p20p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p20p4glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p20p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i6p20p4megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="742" height="320" fill="url(#i6p20p4bg)"/>

  <!-- Older buildings LEANING INWARD — narrower street -->
  <path d="M0,0 L0,260 L240,260 L220,40 L180,30 L180,80 L140,75 L140,40 L100,30 L100,90 L60,80 L60,40 L20,30 L20,40 Z" fill="url(#i6p20p4building)"/>
  <path d="M742,0 L742,260 L502,260 L522,40 L562,30 L562,80 L602,75 L602,40 L642,30 L642,90 L682,80 L682,40 L722,30 L722,40 Z" fill="url(#i6p20p4building)"/>
  <!-- Lean lines -->
  <path d="M240,260 L220,40" stroke="#3a2828" stroke-width="0.85" opacity="0.85"/>
  <path d="M502,260 L522,40" stroke="#3a2828" stroke-width="0.85" opacity="0.85"/>

  <!-- Faint window glow (very few, dim) -->
  <rect x="40" y="220" width="14" height="18" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
  <rect x="180" y="220" width="14" height="18" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
  <ellipse cx="187" cy="229" rx="4" ry="6" fill="#5a3018" opacity="0.55" filter="url(#i6p20p4bloom)"/>
  <rect x="560" y="220" width="14" height="18" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
  <ellipse cx="567" cy="229" rx="4" ry="6" fill="#5a3018" opacity="0.55" filter="url(#i6p20p4bloom)"/>
  <rect x="700" y="220" width="14" height="18" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>

  <!-- ===== SPARSE GAS LAMPS — far less light ===== -->
  <g transform="translate(160 130)">
    <ellipse cx="0" cy="0" rx="32" ry="28" fill="url(#i6p20p4lampHaloDim)" filter="url(#i6p20p4megaglow)"/>
    <line x1="0" y1="0" x2="0" y2="130" stroke="#1a0c08" stroke-width="1.4" opacity="0.7"/>
    <rect x="-3" y="-7" width="6" height="14" fill="#1a0c08"/>
    <ellipse cx="0" cy="-1" rx="2" ry="3" fill="#fff8c8" filter="url(#i6p20p4bloom)" opacity="0.85"/>
  </g>
  <g transform="translate(620 110)">
    <ellipse cx="0" cy="0" rx="32" ry="28" fill="url(#i6p20p4lampHaloDim)" filter="url(#i6p20p4megaglow)"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#1a0c08" stroke-width="1.4" opacity="0.7"/>
    <rect x="-3" y="-7" width="6" height="14" fill="#1a0c08"/>
    <ellipse cx="0" cy="-1" rx="2" ry="3" fill="#fff8c8" filter="url(#i6p20p4bloom)" opacity="0.85"/>
  </g>

  <!-- Cobblestones (less reflective — dimmer street) -->
  <rect x="0" y="240" width="742" height="80" fill="url(#i6p20p4cobble)"/>
  <ellipse cx="160" cy="280" rx="80" ry="4" fill="#a87838" opacity="0.3" filter="url(#i6p20p4glow)"/>
  <ellipse cx="620" cy="280" rx="80" ry="4" fill="#a87838" opacity="0.35" filter="url(#i6p20p4glow)"/>
  <g stroke="#080608" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,260 Q140,261 280,260 Q420,259 560,260 Q650,261 742,260"/>
    <path d="M0,275 Q140,276 280,275 Q420,274 560,275 Q650,276 742,275"/>
    <path d="M0,290 Q140,291 280,290 Q420,289 560,290 Q650,291 742,290"/>
    <path d="M0,305 Q140,306 280,305 Q420,304 560,305 Q650,306 742,305"/>
  </g>

  <!-- Heavy fog -->
  <g fill="#5a5860" opacity="0.55">
    <ellipse cx="100" cy="180" rx="120" ry="22"/>
    <ellipse cx="350" cy="170" rx="160" ry="22"/>
    <ellipse cx="600" cy="190" rx="120" ry="22"/>
  </g>
  <g fill="#7a7880" opacity="0.4">
    <ellipse cx="200" cy="200" rx="140" ry="18"/>
    <ellipse cx="500" cy="195" rx="160" ry="18"/>
  </g>

  <!-- ===== HINT OF "TALL ONE" SHADOWS — barely there, just suggested ===== -->
  <g opacity="0.35">
    <!-- Tall thin shape in fog far rear -->
    <path d="M380,140 L378,260 L386,260 L382,140 Z" fill="#1a1418"/>
    <ellipse cx="382" cy="138" rx="6" ry="14" fill="#1a1418"/>
  </g>

  <!-- ===== THEODORE — center, walking, telling ===== -->
  <g transform="translate(371 270)">
    <!-- Cast shadow -->
    <ellipse cx="0" cy="2" rx="14" ry="2" fill="#000" opacity="0.7"/>

    <!-- Boots -->
    <ellipse cx="-7" cy="0" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="7" cy="0" rx="5" ry="2" fill="#1a0c04"/>

    <!-- Trousers mid-stride -->
    <path d="M-9,-2 L-12,-30 L-4,-50 L0,-30 Z" fill="#3a3028"/>
    <path d="M9,-2 L12,-30 L4,-46 L0,-30 Z" fill="#3a3028"/>

    <!-- Waistcoat -->
    <path d="M-12,-50 L-12,-90 L12,-90 L12,-50 Z" fill="#d4c4a8"/>
    <path d="M-14,-88 L-12,-50 L-2,-50 L-2,-88 Z" fill="#5a3018"/>
    <path d="M14,-88 L12,-50 L2,-50 L2,-88 Z" fill="#5a3018"/>
    <circle cx="-2" cy="-80" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-72" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-64" r="0.85" fill="#3a1808"/>

    <!-- Linen collar -->
    <path d="M-7,-90 L0,-88 L7,-90 L7,-86 L0,-83 L-7,-86 Z" fill="#e0d4b8"/>

    <!-- POCKET — bright blue-violet now -->
    <rect x="3" y="-84" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
    <ellipse cx="9" cy="-78" rx="9" ry="6" fill="url(#i6p20p4scannerBright)" filter="url(#i6p20p4strongglow)"/>
    <!-- Scanner BEAM piercing fog around him -->
    <path d="M9,-78 L40,-100 L50,-90 L60,-110 L70,-90 L80,-110" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p20p4bloom)"/>
    <path d="M9,-78 L-30,-90 L-50,-100 L-70,-90 L-90,-110" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p20p4bloom)"/>

    <!-- Arms -->
    <path d="M-12,-86 L-22,-66 L-22,-46 L-14,-50 Z" fill="#5a3018"/>
    <path d="M12,-86 L20,-66 L20,-46 L14,-50 Z" fill="#5a3018"/>

    <!-- Head — earnest, mouth moving -->
    <ellipse cx="0" cy="-104" rx="11" ry="12" fill="#a87838"/>
    <path d="M-10,-114 Q-7,-122 0,-124 Q7,-122 10,-114 L10,-105 Q7,-110 0,-110 Q-7,-110 -10,-105 Z" fill="#9a7038"/>
    <!-- Eyes -->
    <ellipse cx="-3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="3" cy="-104" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-104" r="0.7" fill="#5a3818"/>
    <circle cx="3" cy="-104" r="0.7" fill="#5a3818"/>
    <!-- Brow -->
    <path d="M-7,-110 L0,-110" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M7,-110 L0,-110" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth — open, mid-word -->
    <ellipse cx="0" cy="-96" rx="2" ry="1.4" fill="#3a1808"/>
  </g>

  <!-- THEODORE dialogue 1 (long, story rhythm) -->
  <g>
    <rect x="14" y="14" width="380" height="60" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="200,74 212,74 204,86" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="200.5" y1="74" x2="211.5" y2="74" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">She called them the Tall Ones. Figures in the fog.</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Too tall, she said. Too still. Shadows that followed</text>
  <text x="22" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">you home and stood outside your window.</text>

  <!-- THEODORE dialogue 2 -->
  <g>
    <rect x="488" y="14" width="240" height="60" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="540,74 552,74 544,86" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="540.5" y1="74" x2="551.5" y2="74" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="496" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="496" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Always part of this neighborhood.</text>
  <text x="496" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Part of the knowing.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
