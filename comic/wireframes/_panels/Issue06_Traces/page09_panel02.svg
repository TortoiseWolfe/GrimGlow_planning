<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 291 551" width="291" height="551">
  <title>Issue 6 — Page 9 — Panel 2: Luma frozen in pocket — lenses flaring alert, scanner aimed up street</title>
  <desc>85mm CU high angle into pocket. Luma scanner extended but no longer at ground — aimed up street. Lenses flaring with cascading data and alert symbols. Eyes wide. Mouth slightly open. Gripping pocket edge. Controlled terror. Brighter blue-violet alert mode glow on warm dark leather interior.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p9p2leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="i6p9p2leatherInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p9p2lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p9p2alertGlow" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#5a3ad8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p9p2alertCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p9p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p9p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Outer waistcoat fabric (high angle showing pocket interior) -->
  <rect width="291" height="551" fill="url(#i6p9p2leather)"/>
  <!-- Leather grain top edge of pocket -->
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55" fill="none">
    <path d="M0,40 Q80,46 160,42 Q240,38 291,42"/>
    <path d="M0,90 Q80,96 160,92 Q240,88 291,92"/>
  </g>

  <!-- POCKET INTERIOR — large, dominant -->
  <rect x="20" y="60" width="251" height="471" fill="url(#i6p9p2leatherInside)"/>
  <!-- Pocket lip (top edge) -->
  <line x1="20" y1="60" x2="271" y2="60" stroke="#7a4818" stroke-width="2" opacity="0.85"/>
  <line x1="20" y1="64" x2="271" y2="64" stroke="#3a1808" stroke-width="0.55" opacity="0.7" stroke-dasharray="3 2"/>
  <!-- Inner side seams of pocket -->
  <line x1="20" y1="60" x2="20" y2="531" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <line x1="271" y1="60" x2="271" y2="531" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>

  <!-- Brighter ALERT MODE wash filling pocket -->
  <ellipse cx="145" cy="220" rx="160" ry="220" fill="url(#i6p9p2alertGlow)" filter="url(#i6p9p2glow)"/>
  <ellipse cx="145" cy="200" rx="100" ry="120" fill="#a888ff" opacity="0.4" filter="url(#i6p9p2glow)"/>

  <!-- ===== LUMA — frozen, scanner aimed up street, alert flare ===== -->
  <g transform="translate(145 320)">
    <!-- Trousers/legs visible inside pocket -->
    <ellipse cx="-9" cy="120" rx="6" ry="3" fill="#0a0408"/>
    <ellipse cx="9" cy="120" rx="6" ry="3" fill="#0a0408"/>
    <path d="M-13,40 L-2,40 L-9,120 L-19,120 Z" fill="url(#i6p9p2lumaSuit)"/>
    <path d="M2,40 L13,40 L19,120 L9,120 Z" fill="url(#i6p9p2lumaSuit)"/>
    <ellipse cx="-9" cy="80" rx="5" ry="2" fill="#5a4838" opacity="0.5"/>
    <ellipse cx="9" cy="80" rx="5" ry="2" fill="#5a4838" opacity="0.5"/>
    <!-- Torso -->
    <path d="M-22,40 L-22,-30 L22,-30 L22,40 Z" fill="url(#i6p9p2lumaSuit)"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#a888ff" stroke-width="1.4" opacity="0.95" filter="url(#i6p9p2bloom)"/>
    <ellipse cx="-18" cy="-20" rx="5" ry="2.4" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="18" cy="-20" rx="5" ry="2.4" fill="#5a4838" opacity="0.55"/>
    <!-- Brick dust newly accumulated -->
    <ellipse cx="-12" cy="20" rx="6" ry="2.4" fill="#5a3018" opacity="0.7"/>
    <ellipse cx="12" cy="20" rx="6" ry="2.4" fill="#5a3018" opacity="0.7"/>

    <!-- Shoulders -->
    <path d="M-22,-30 Q-15,-46 0,-50 Q15,-46 22,-30 Z" fill="url(#i6p9p2lumaSuit)"/>

    <!-- LEFT arm holding scanner UP (aimed past pocket lip toward street) -->
    <path d="M-22,-30 L-44,-50 L-50,-30 L-30,-14 Z" fill="url(#i6p9p2lumaSuit)"/>
    <ellipse cx="-50" cy="-30" rx="4" ry="2.4" fill="#7a4838"/>
    <!-- SCANNER held up at angle, in alert/flare mode -->
    <rect x="-58" y="-38" width="14" height="9" rx="0.85" fill="#3a2068" stroke="#a888ff" stroke-width="1"/>
    <rect x="-56" y="-36" width="10" height="5" fill="#5a3ad8" filter="url(#i6p9p2bloom)"/>
    <!-- Alert symbol pulse on scanner -->
    <circle cx="-51" cy="-33" r="3" fill="#fff8ff" filter="url(#i6p9p2bloom)" opacity="0.95"/>
    <ellipse cx="-51" cy="-33" rx="14" ry="9" fill="#a888ff" opacity="0.85" filter="url(#i6p9p2glow)"/>

    <!-- RIGHT hand gripping pocket edge tight -->
    <path d="M22,-30 L40,-50 L46,-40 L30,-22 Z" fill="url(#i6p9p2lumaSuit)"/>
    <ellipse cx="44" cy="-44" rx="4" ry="2.4" fill="#7a4838"/>
    <!-- White-knuckle highlights on grip -->
    <circle cx="42" cy="-44" r="1" fill="#fff8e8" opacity="0.85"/>
    <circle cx="46" cy="-44" r="1" fill="#fff8e8" opacity="0.85"/>

    <!-- HEAD — looking UP toward pocket lip / street direction -->
    <ellipse cx="0" cy="-78" rx="14" ry="18" fill="#7a4838"/>
    <!-- Strong alert wash on face from below + above -->
    <ellipse cx="0" cy="-72" rx="11" ry="6" fill="#a888ff" opacity="0.55" filter="url(#i6p9p2bloom)"/>
    <!-- Hair pulled back -->
    <path d="M-13,-86 Q-10,-94 0,-96 Q10,-94 13,-86 L13,-78 Q6,-84 0,-84 Q-6,-84 -13,-78 Z" fill="#0a0604"/>
    <!-- Sapphire filament -->
    <line x1="-6" y1="-92" x2="-4" y2="-94" stroke="#5a3ad8" stroke-width="1.4" opacity="0.95" filter="url(#i6p9p2bloom)"/>
    <line x1="4" y1="-94" x2="6" y2="-92" stroke="#5a3ad8" stroke-width="1.4" opacity="0.95" filter="url(#i6p9p2bloom)"/>
    <!-- Braid trailing back -->
    <path d="M13,-80 Q18,-50 16,-20" stroke="#0a0604" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M13,-80 Q18,-50 16,-20" stroke="#a888ff" stroke-width="0.7" fill="none" opacity="0.95" filter="url(#i6p9p2bloom)"/>

    <!-- LENSES FLARING with alert -->
    <ellipse cx="-5" cy="-78" rx="6" ry="4" fill="#a888ff" opacity="0.55"/>
    <ellipse cx="5" cy="-78" rx="6" ry="4" fill="#a888ff" opacity="0.55"/>
    <ellipse cx="-5" cy="-78" rx="6" ry="4" fill="none" stroke="#fff8ff" stroke-width="1.2" opacity="0.95" filter="url(#i6p9p2bloom)"/>
    <ellipse cx="5" cy="-78" rx="6" ry="4" fill="none" stroke="#fff8ff" stroke-width="1.2" opacity="0.95" filter="url(#i6p9p2bloom)"/>
    <line x1="0" y1="-78" x2="0" y2="-78" stroke="#a888ff" stroke-width="1" opacity="0.95"/>
    <!-- Crack -->
    <line x1="-10" y1="-80" x2="-2" y2="-77" stroke="#fff8ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p9p2bloom)"/>
    <!-- Cascading alert data -->
    <g stroke="#fff8ff" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#i6p9p2bloom)">
      <line x1="-10" y1="-80" x2="-2" y2="-80"/>
      <line x1="-10" y1="-78" x2="-2" y2="-78"/>
      <line x1="-10" y1="-76" x2="-2" y2="-76"/>
      <line x1="2" y1="-80" x2="10" y2="-80"/>
      <line x1="2" y1="-78" x2="10" y2="-78"/>
      <line x1="2" y1="-76" x2="10" y2="-76"/>
    </g>
    <!-- Bright alert icons on lenses -->
    <text x="-7" y="-76" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#ff5868" font-weight="700">⚠</text>
    <text x="3" y="-76" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#ff5868" font-weight="700">⚠</text>
    <!-- Eyes WIDE -->
    <ellipse cx="-5" cy="-78" rx="3" ry="2.4" fill="#fff8e8"/>
    <circle cx="-5" cy="-78" r="1.4" fill="#0a0604"/>
    <circle cx="-5.4" cy="-78.4" r="0.55" fill="#fff8ff"/>
    <ellipse cx="5" cy="-78" rx="3" ry="2.4" fill="#fff8e8"/>
    <circle cx="5" cy="-78" r="1.4" fill="#0a0604"/>
    <circle cx="4.6" cy="-78.4" r="0.55" fill="#fff8ff"/>
    <!-- Brows up — alarm/terror -->
    <path d="M-12,-92 L-2,-90" stroke="#0a0604" stroke-width="1.2"/>
    <path d="M2,-90 L12,-92" stroke="#0a0604" stroke-width="1.2"/>
    <!-- Mouth slightly open -->
    <ellipse cx="0" cy="-66" rx="2" ry="1" fill="#3a1808"/>
  </g>

  <!-- ALERT DATA cascade above her — scrolling pattern -->
  <g transform="translate(145 100)" filter="url(#i6p9p2bloom)" opacity="0.95">
    <text x="-44" y="0" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#ff5868" font-weight="700">SIGNAL DETECTED</text>
    <text x="-44" y="14" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">DISTANCE: 60-65m</text>
    <text x="-44" y="24" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">VECTOR: 348° N-NE</text>
    <text x="-44" y="34" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">CLASSIFICATION:</text>
    <text x="-44" y="44" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#ff5868" font-weight="700">⚠ TITAN ⚠</text>
    <!-- Alert pulse rings -->
    <circle cx="0" cy="20" r="22" fill="none" stroke="#ff5868" stroke-width="0.55" opacity="0.55" stroke-dasharray="3 2"/>
    <circle cx="0" cy="20" r="32" fill="none" stroke="#ff5868" stroke-width="0.4" opacity="0.45" stroke-dasharray="3 2"/>
    <circle cx="0" cy="20" r="42" fill="none" stroke="#ff5868" stroke-width="0.4" opacity="0.35" stroke-dasharray="3 2"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q80,202 160,198 Q240,196 291,200"/>
    <path d="M0,480 Q80,482 160,478 Q240,476 291,480"/>
  </g>
</svg>
