<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 440" width="366" height="440">
  <title>Issue 6 — Page 21 — Panel 3: Walk home becomes urgent — Theodore's building emerges from fog, scanner sweeps</title>
  <desc>50mm slight low angle. Theodore walking fast through thick fog. Shoulders hunched, stride lengthened, urgent but dignified. Building materializes ahead — dark brick, lamp by door amber pool, shuttered workshop windows. Blue-violet scanner sweeping continuously. Warm amber door lamp as destination/safety. He is not looking into fog. LUMA: "We're close. Twenty metres." THEODORE: "I know. I know."</desc>

  <defs>
    <linearGradient id="i6p21p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3438"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <radialGradient id="i6p21p3doorAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#d8a060" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a4828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p21p3scanner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a888ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p21p3building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a18"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p21p3cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2228"/>
      <stop offset="100%" stop-color="#1a1418"/>
    </linearGradient>
    <filter id="i6p21p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p21p3glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p21p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i6p21p3megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="366" height="440" fill="url(#i6p21p3bg)"/>

  <!-- Heavy fog atmosphere -->
  <rect x="0" y="40" width="366" height="200" fill="#5a5860" opacity="0.55"/>
  <rect x="0" y="160" width="366" height="80" fill="#7a7880" opacity="0.55"/>

  <!-- ===== BUILDING materializing ahead — Theodore's home ===== -->
  <!-- Dark brick wall -->
  <rect x="40" y="60" width="286" height="280" fill="url(#i6p21p3building)"/>
  <!-- Brick texture -->
  <g stroke="#1a0c08" stroke-width="0.4" opacity="0.7" fill="none">
    <path d="M40,90 L326,90"/>
    <path d="M40,120 L326,120"/>
    <path d="M40,150 L326,150"/>
    <path d="M40,180 L326,180"/>
    <path d="M40,210 L326,210"/>
    <path d="M40,240 L326,240"/>
    <path d="M40,270 L326,270"/>
    <path d="M40,300 L326,300"/>
    <line x1="80" y1="90" x2="80" y2="120"/>
    <line x1="160" y1="90" x2="160" y2="120"/>
    <line x1="240" y1="90" x2="240" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="150"/>
    <line x1="200" y1="120" x2="200" y2="150"/>
    <line x1="280" y1="120" x2="280" y2="150"/>
    <line x1="80" y1="150" x2="80" y2="180"/>
    <line x1="160" y1="150" x2="160" y2="180"/>
    <line x1="240" y1="150" x2="240" y2="180"/>
    <line x1="120" y1="180" x2="120" y2="210"/>
    <line x1="200" y1="180" x2="200" y2="210"/>
    <line x1="280" y1="180" x2="280" y2="210"/>
    <line x1="80" y1="210" x2="80" y2="240"/>
    <line x1="160" y1="210" x2="160" y2="240"/>
    <line x1="240" y1="210" x2="240" y2="240"/>
    <line x1="120" y1="240" x2="120" y2="270"/>
    <line x1="200" y1="240" x2="200" y2="270"/>
    <line x1="280" y1="240" x2="280" y2="270"/>
  </g>

  <!-- Shuttered workshop windows (left) -->
  <rect x="60" y="180" width="40" height="50" fill="#1a0c08" stroke="#3a2418" stroke-width="0.85"/>
  <g stroke="#0a0408" stroke-width="0.85" opacity="0.85">
    <line x1="60" y1="190" x2="100" y2="190"/>
    <line x1="60" y1="200" x2="100" y2="200"/>
    <line x1="60" y1="210" x2="100" y2="210"/>
    <line x1="60" y1="220" x2="100" y2="220"/>
    <line x1="80" y1="180" x2="80" y2="230"/>
  </g>
  <!-- Shuttered workshop window (right of door) -->
  <rect x="240" y="180" width="40" height="50" fill="#1a0c08" stroke="#3a2418" stroke-width="0.85"/>
  <g stroke="#0a0408" stroke-width="0.85" opacity="0.85">
    <line x1="240" y1="190" x2="280" y2="190"/>
    <line x1="240" y1="200" x2="280" y2="200"/>
    <line x1="240" y1="210" x2="280" y2="210"/>
    <line x1="240" y1="220" x2="280" y2="220"/>
    <line x1="260" y1="180" x2="260" y2="230"/>
  </g>

  <!-- DOOR -->
  <rect x="160" y="180" width="50" height="120" fill="#3a1808" stroke="#1a0c04" stroke-width="0.85"/>
  <line x1="185" y1="180" x2="185" y2="300" stroke="#1a0c04" stroke-width="0.55"/>
  <rect x="170" y="200" width="30" height="60" fill="#1a0c04" stroke="#3a2418" stroke-width="0.4"/>
  <rect x="173" y="203" width="24" height="54" fill="#3a2418"/>
  <!-- Door knob -->
  <circle cx="200" cy="240" r="2" fill="#a87838" filter="url(#i6p21p3bloom)"/>

  <!-- LAMP BY DOOR — amber halo at threshold -->
  <g transform="translate(220 180)">
    <ellipse cx="0" cy="0" rx="50" ry="44" fill="url(#i6p21p3doorAmber)" filter="url(#i6p21p3megaglow)"/>
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="#ffe0a8" filter="url(#i6p21p3strongglow)"/>
    <!-- Lamp bracket -->
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#1a0c08" stroke-width="1.4"/>
    <rect x="-3" y="-8" width="6" height="14" fill="#1a0c08"/>
    <ellipse cx="0" cy="-2" rx="2.4" ry="3.5" fill="#fff8c8" filter="url(#i6p21p3bloom)"/>
  </g>
  <!-- AMBER POOL on threshold -->
  <ellipse cx="220" cy="320" rx="80" ry="14" fill="#a87838" opacity="0.7" filter="url(#i6p21p3strongglow)"/>

  <!-- Sign above workshop (faint) -->
  <rect x="80" y="140" width="200" height="22" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
  <text x="180" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#a87838" text-anchor="middle" font-weight="700" opacity="0.7">HARTLEY &amp; SON · TINKERS</text>

  <!-- Heavier fog patches -->
  <g fill="#5a5860" opacity="0.55">
    <ellipse cx="80" cy="70" rx="80" ry="14"/>
    <ellipse cx="280" cy="60" rx="100" ry="14"/>
  </g>

  <!-- Cobblestones -->
  <rect x="0" y="320" width="366" height="120" fill="url(#i6p21p3cobble)"/>
  <ellipse cx="220" cy="350" rx="60" ry="6" fill="#a87838" opacity="0.55" filter="url(#i6p21p3glow)"/>
  <g stroke="#080608" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,340 L366,340"/>
    <path d="M0,360 L366,360"/>
    <path d="M0,380 L366,380"/>
    <path d="M0,400 L366,400"/>
    <path d="M0,420 L366,420"/>
  </g>

  <!-- ===== THEODORE — walking fast, hunched, mid-stride ===== -->
  <g transform="translate(120 410)">
    <ellipse cx="0" cy="2" rx="14" ry="2" fill="#000" opacity="0.85"/>

    <!-- Mid-stride boots -->
    <ellipse cx="-9" cy="-2" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="9" cy="0" rx="5" ry="2" fill="#1a0c04"/>

    <!-- Trousers — mid-stride, lengthened -->
    <path d="M-11,-2 L-14,-30 L-6,-50 L-2,-30 Z" fill="#3a3028"/>
    <path d="M11,0 L14,-32 L4,-50 L-2,-30 Z" fill="#3a3028"/>

    <!-- Waistcoat — body slightly hunched forward -->
    <path d="M-12,-50 L-14,-90 L12,-90 L10,-50 Z" fill="#d4c4a8"/>
    <path d="M-16,-88 L-14,-50 L-2,-50 L-2,-88 Z" fill="#5a3018"/>
    <path d="M14,-88 L10,-50 L2,-50 L2,-88 Z" fill="#5a3018"/>
    <circle cx="-2" cy="-78" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-68" r="0.85" fill="#3a1808"/>

    <!-- Linen collar -->
    <path d="M-9,-90 L0,-88 L9,-90 L9,-86 L0,-83 L-9,-86 Z" fill="#e0d4b8"/>

    <!-- POCKET — bright scanner -->
    <rect x="3" y="-84" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.4"/>
    <ellipse cx="9" cy="-78" rx="9" ry="6" fill="url(#i6p21p3scanner)" filter="url(#i6p21p3strongglow)"/>
    <!-- Scanner SWEEP beam -->
    <path d="M9,-78 L40,-90 L60,-80 L80,-100 L100,-90" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p21p3bloom)"/>

    <!-- Arms swinging -->
    <path d="M-14,-86 L-26,-66 L-22,-46 L-12,-50 Z" fill="#5a3018"/>
    <path d="M14,-86 L24,-66 L20,-46 L10,-50 Z" fill="#5a3018"/>

    <!-- Head — eyes ahead, NOT looking into fog -->
    <ellipse cx="0" cy="-104" rx="11" ry="12" fill="#a87838"/>
    <path d="M-10,-114 Q-7,-122 0,-124 Q7,-122 10,-114 L10,-105 Q7,-110 0,-110 Q-7,-110 -10,-105 Z" fill="#9a7038"/>
    <!-- Amber from door lamp catching face/edge -->
    <ellipse cx="6" cy="-104" rx="6" ry="3" fill="#d8a060" opacity="0.55" filter="url(#i6p21p3bloom)"/>

    <!-- Eyes — fixed AHEAD on door -->
    <ellipse cx="-3" cy="-103" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="3" cy="-103" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="-2" cy="-102" rx="0.85" ry="0.7" fill="#7a4818"/>
    <ellipse cx="4" cy="-102" rx="0.85" ry="0.7" fill="#7a4818"/>
    <circle cx="-2" cy="-103" r="0.3" fill="#fff"/>
    <circle cx="4" cy="-103" r="0.3" fill="#fff"/>

    <!-- Brow set, focus -->
    <path d="M-7,-110 L0,-110" stroke="#5a3018" stroke-width="0.7"/>
    <path d="M7,-110 L0,-110" stroke="#5a3018" stroke-width="0.7"/>
    <!-- Mouth set -->
    <line x1="-2" y1="-94" x2="3" y2="-94" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- LUMA dialogue (quiet) -->
  <g>
    <rect x="14" y="14" width="240" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#5a3ad8" stroke-width="0.85" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a3ad8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(quiet)</tspan></text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">We're close. Twenty metres.</text>

  <!-- THEODORE response -->
  <g>
    <rect x="14" y="380" width="240" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,380 112,380 104,370" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="100.5" y1="380" x2="111.5" y2="380" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">I know. I know.</text>

  <!-- Brushwork overlay -->
  <g stroke="#5a3018" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q100,182 200,178 Q280,176 366,180"/>
    <path d="M0,360 Q100,362 200,358 Q280,356 366,360"/>
  </g>
</svg>
