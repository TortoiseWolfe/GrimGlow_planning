<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 6 — Page 7 — Panel 1: Theodore stops, looks down at dead bird on cobbles</title>
  <desc>35mm medium high angle. Theodore crouches slightly looking down at sparrow on wet grey cobblestones. Sparrow on its back, wings slightly spread, no marks. Puzzlement shifting to disquiet.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p7p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#605850"/>
      <stop offset="100%" stop-color="#3a3430"/>
    </linearGradient>
    <linearGradient id="i6p7p1cobbles" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#2a2420"/>
    </linearGradient>
    <linearGradient id="i6p7p1theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p7p1theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p7p1pocketHint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p7p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p7p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#i6p7p1bg)"/>

  <!-- Cobblestone surface filling most of frame (high angle) -->
  <rect width="494" height="364" fill="url(#i6p7p1cobbles)"/>
  <!-- Cobble grout lines -->
  <g stroke="#1a1410" stroke-width="0.55" opacity="0.65" fill="none">
    <path d="M0,80 Q100,82 200,80 Q300,78 494,80"/>
    <path d="M0,120 Q100,122 200,120 Q300,118 494,120"/>
    <path d="M0,160 Q100,162 200,160 Q300,158 494,160"/>
    <path d="M0,200 Q100,202 200,200 Q300,198 494,200"/>
    <path d="M0,240 Q100,242 200,240 Q300,238 494,240"/>
    <path d="M0,280 Q100,282 200,280 Q300,278 494,280"/>
    <path d="M0,320 Q100,322 200,320 Q300,318 494,320"/>
    <line x1="40" y1="80" x2="40" y2="120"/>
    <line x1="120" y1="80" x2="120" y2="120"/>
    <line x1="200" y1="80" x2="200" y2="120"/>
    <line x1="280" y1="80" x2="280" y2="120"/>
    <line x1="360" y1="80" x2="360" y2="120"/>
    <line x1="440" y1="80" x2="440" y2="120"/>
    <line x1="80" y1="120" x2="80" y2="160"/>
    <line x1="160" y1="120" x2="160" y2="160"/>
    <line x1="240" y1="120" x2="240" y2="160"/>
    <line x1="320" y1="120" x2="320" y2="160"/>
    <line x1="400" y1="120" x2="400" y2="160"/>
    <line x1="40" y1="160" x2="40" y2="200"/>
    <line x1="120" y1="160" x2="120" y2="200"/>
    <line x1="200" y1="160" x2="200" y2="200"/>
    <line x1="280" y1="160" x2="280" y2="200"/>
    <line x1="360" y1="160" x2="360" y2="200"/>
    <line x1="440" y1="160" x2="440" y2="200"/>
    <line x1="80" y1="200" x2="80" y2="240"/>
    <line x1="160" y1="200" x2="160" y2="240"/>
    <line x1="240" y1="200" x2="240" y2="240"/>
    <line x1="320" y1="200" x2="320" y2="240"/>
    <line x1="400" y1="200" x2="400" y2="240"/>
  </g>
  <!-- Wet shine highlights -->
  <g fill="#7a706a" opacity="0.4">
    <ellipse cx="80" cy="100" rx="12" ry="3"/>
    <ellipse cx="180" cy="140" rx="14" ry="3"/>
    <ellipse cx="360" cy="180" rx="16" ry="3"/>
  </g>
  <!-- Wet streaks/puddle -->
  <g stroke="#7a706a" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M40,260 Q120,258 200,262 Q260,266 320,262"/>
  </g>

  <!-- Pavement edge top of frame (where Theodore stands) -->
  <rect x="0" y="0" width="494" height="60" fill="#403830"/>
  <line x1="0" y1="60" x2="494" y2="60" stroke="#1a1410" stroke-width="1.4" opacity="0.85"/>
  <!-- Kerbstone edge -->
  <line x1="0" y1="64" x2="494" y2="64" stroke="#5a5048" stroke-width="0.7" opacity="0.55"/>

  <!-- ===== DEAD SPARROW — center-right of frame ===== -->
  <g transform="translate(330 240)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="22" ry="11" fill="#3a2818" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- On its back -->
    <ellipse cx="-3" cy="3" rx="9" ry="2.4" fill="#5a4030" opacity="0.85"/>
    <!-- Wings spread -->
    <path d="M-16,-3 L-36,-14 L-30,-1 Z" fill="#3a2818" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M16,-3 L36,-14 L30,-1 Z" fill="#3a2818" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Wing feather lines -->
    <line x1="-18" y1="-5" x2="-30" y2="-12" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>
    <line x1="-20" y1="-6" x2="-33" y2="-13" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>
    <line x1="-22" y1="-7" x2="-35" y2="-14" stroke="#1a0c04" stroke-width="0.45" opacity="0.7"/>
    <line x1="18" y1="-5" x2="30" y2="-12" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>
    <line x1="20" y1="-6" x2="33" y2="-13" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>
    <line x1="22" y1="-7" x2="35" y2="-14" stroke="#1a0c04" stroke-width="0.45" opacity="0.7"/>
    <!-- Head + tiny beak -->
    <ellipse cx="-22" cy="0" rx="6" ry="5" fill="#3a2818"/>
    <path d="M-26,2 L-32,4 L-26,5 Z" fill="#3a1808"/>
    <!-- Closed clouded eye -->
    <ellipse cx="-22" cy="-1" rx="2" ry="1.4" fill="#5a4838" opacity="0.85"/>
    <line x1="-24" y1="-1" x2="-20" y2="-1" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Tiny legs sticking up -->
    <line x1="-5" y1="-3" x2="-7" y2="-12" stroke="#a87038" stroke-width="0.85"/>
    <line x1="5" y1="-3" x2="7" y2="-12" stroke="#a87038" stroke-width="0.85"/>
    <!-- Tiny claws -->
    <path d="M-7,-12 L-9,-14 L-6,-13 L-7,-12 Z" fill="#5a3018"/>
    <path d="M7,-12 L9,-14 L6,-13 L7,-12 Z" fill="#5a3018"/>
    <!-- Stillness ground shadow -->
    <ellipse cx="0" cy="11" rx="22" ry="2.4" fill="#1a0c04" opacity="0.55"/>
    <!-- Faint hint of iridescent residue starting to be visible at body edge -->
    <ellipse cx="-30" cy="-12" rx="6" ry="2" fill="#3a1828" opacity="0.4" filter="url(#i6p7p1bloom)"/>
    <ellipse cx="30" cy="-12" rx="6" ry="2" fill="#3a1828" opacity="0.4" filter="url(#i6p7p1bloom)"/>
    <ellipse cx="0" cy="14" rx="26" ry="2.4" fill="#3a1828" opacity="0.35" filter="url(#i6p7p1bloom)"/>
  </g>

  <!-- ===== THEODORE — top-left, crouching slightly, looking DOWN ===== -->
  <!-- High angle: body foreshortened, mostly head + shoulders + boots visible -->
  <g transform="translate(110 80)">
    <!-- Head from above -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#a87838"/>
    <!-- Hair top-down view -->
    <ellipse cx="0" cy="-2" rx="22" ry="13" fill="#9a7038"/>
    <!-- Hair tufts -->
    <path d="M-14,-9 L-12,-13 L-9,-9 Z" fill="#9a7038"/>
    <path d="M-2,-12 L0,-15 L2,-12 Z" fill="#9a7038"/>
    <path d="M9,-10 L11,-13 L13,-9 Z" fill="#9a7038"/>
    <path d="M-22,0 L-26,-2 L-22,3 Z" fill="#9a7038"/>
    <path d="M22,0 L26,-2 L22,3 Z" fill="#9a7038"/>
    <!-- Forehead darker shadow (looking down) -->
    <ellipse cx="0" cy="3" rx="14" ry="6" fill="#7a4828" opacity="0.55"/>

    <!-- Shoulders + collar (foreshortened) -->
    <path d="M-30,11 L30,11 L40,40 L-40,40 Z" fill="url(#i6p7p1theoWaistcoat)"/>
    <!-- Linen collar -->
    <path d="M-9,11 L0,14 L9,11 L9,16 L0,18 L-9,16 Z" fill="#e0d4b8"/>
    <!-- Pocket from above on right -->
    <rect x="13" y="14" width="13" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="15" y="17" width="9" height="9" fill="#5a3ad8" opacity="0.55" filter="url(#i6p7p1bloom)"/>
    <ellipse cx="20" cy="22" rx="11" ry="6" fill="url(#i6p7p1pocketHint)" filter="url(#i6p7p1glow)"/>
    <!-- Buttons down center -->
    <circle cx="-2" cy="22" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="32" r="0.85" fill="#3a1808"/>

    <!-- Arms reaching down (crouched, hands toward bird) -->
    <path d="M-30,11 L-44,40 L-44,80 L-30,75 Z" fill="url(#i6p7p1theoWaistcoat)"/>
    <path d="M30,11 L44,40 L44,80 L30,75 Z" fill="url(#i6p7p1theoWaistcoat)"/>
    <!-- Linen sleeves at cuffs -->
    <ellipse cx="-44" cy="80" rx="6" ry="2.4" fill="#d4c4a8"/>
    <ellipse cx="44" cy="80" rx="6" ry="2.4" fill="#d4c4a8"/>
    <!-- Hands -->
    <ellipse cx="-44" cy="86" rx="5" ry="3" fill="#a87838"/>
    <ellipse cx="44" cy="86" rx="5" ry="3" fill="#a87838"/>
    <!-- Brass ring on left index -->
    <circle cx="-44" cy="86" r="0.95" fill="#c89058" filter="url(#i6p7p1bloom)" opacity="0.85"/>
  </g>

  <!-- THEODORE'S BOOTS visible at bottom-left (kerbside) -->
  <g transform="translate(110 60)" opacity="0.85">
    <ellipse cx="-22" cy="0" rx="14" ry="4" fill="#1a0c04"/>
    <ellipse cx="22" cy="0" rx="14" ry="4" fill="#1a0c04"/>
  </g>

  <!-- THEODORE dialogue 1 (top-left) -->
  <g>
    <rect x="14" y="14" width="332" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="160,54 172,54 164,64" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="160.5" y1="54" x2="171.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">There's a bird here. Dead. Just... lying on the stones.</text>

  <!-- THEODORE dialogue 2 (mid-right) -->
  <g>
    <rect x="280" y="74" width="200" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="340,114 352,114 344,124" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="340.5" y1="114" x2="351.5" y2="114" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="288" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="288" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">No marks on it. Nothing's had it.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q150,142 300,138 Q400,136 494,140"/>
    <path d="M0,300 Q150,302 300,298 Q400,296 494,300"/>
  </g>
</svg>
