<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 440" width="366" height="440">
  <title>Issue 6 — Page 20 — Panel 3: Close-up into pocket — Luma looking up, lenses dim, listening to Theodore</title>
  <desc>85mm close-up slight high angle. Luma in waistcoat pocket looking up. Lenses dim, attention upward to Theodore. Stone dust still coating sapphire-violet suit. Wool fabric enormous weave at her scale. Open, attentive — distress softened, warmth reasserting. THEODORE (from above): "When I was small — smaller, I mean — my gran would tell us stories. / Not fairy stories. Different ones."</desc>

  <defs>
    <linearGradient id="i6p20p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <radialGradient id="i6p20p3pocketLight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5a4838" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a1208" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p20p3wool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="i6p20p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p20p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#5a3a28"/>
    </linearGradient>
    <radialGradient id="i6p20p3lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p20p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p20p3glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p20p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="366" height="440" fill="url(#i6p20p3bg)"/>

  <!-- Pocket interior — soft light radial -->
  <ellipse cx="183" cy="280" rx="280" ry="220" fill="url(#i6p20p3pocketLight)" filter="url(#i6p20p3strongglow)"/>

  <!-- ===== POCKET FABRIC — coarse wool, enormous weave ===== -->
  <!-- Pocket walls (left, right, bottom) -->
  <path d="M0,40 L40,80 L40,440 L0,440 Z" fill="url(#i6p20p3wool)"/>
  <path d="M366,40 L326,80 L326,440 L366,440 Z" fill="url(#i6p20p3wool)"/>
  <path d="M0,40 L0,140 L366,140 L366,40 L326,80 L40,80 Z" fill="url(#i6p20p3wool)"/>
  <!-- Pocket bottom -->
  <path d="M40,400 L326,400 L326,440 L40,440 Z" fill="url(#i6p20p3wool)"/>

  <!-- Coarse weave — visible texture (cross-hatch, magnified scale) -->
  <g stroke="#1a0c04" stroke-width="0.7" opacity="0.85" fill="none">
    <!-- Vertical threads -->
    <path d="M50,80 L50,400" stroke-dasharray="4,2"/>
    <path d="M70,80 L70,400" stroke-dasharray="4,2"/>
    <path d="M90,80 L90,400" stroke-dasharray="4,2"/>
    <path d="M110,80 L110,400" stroke-dasharray="4,2"/>
    <path d="M130,80 L130,400" stroke-dasharray="4,2"/>
    <path d="M150,80 L150,400" stroke-dasharray="4,2"/>
    <path d="M216,80 L216,400" stroke-dasharray="4,2"/>
    <path d="M236,80 L236,400" stroke-dasharray="4,2"/>
    <path d="M256,80 L256,400" stroke-dasharray="4,2"/>
    <path d="M276,80 L276,400" stroke-dasharray="4,2"/>
    <path d="M296,80 L296,400" stroke-dasharray="4,2"/>
    <path d="M316,80 L316,400" stroke-dasharray="4,2"/>
    <!-- Horizontal threads -->
    <path d="M40,100 L326,100" stroke-dasharray="4,2"/>
    <path d="M40,120 L326,120" stroke-dasharray="4,2"/>
    <path d="M40,160 L326,160" stroke-dasharray="6,2"/>
    <path d="M40,180 L326,180" stroke-dasharray="6,2"/>
    <path d="M40,360 L326,360" stroke-dasharray="6,2"/>
    <path d="M40,380 L326,380" stroke-dasharray="6,2"/>
  </g>
  <!-- Loose fibers / fluff -->
  <g stroke="#7a5028" stroke-width="0.4" opacity="0.55">
    <path d="M30,90 L50,84" fill="none"/>
    <path d="M340,100 L320,94" fill="none"/>
    <path d="M50,150 L42,142" fill="none"/>
    <path d="M310,170 L320,162" fill="none"/>
    <path d="M60,360 L52,354" fill="none"/>
    <path d="M315,360 L325,354" fill="none"/>
  </g>

  <!-- Lint specks -->
  <g fill="#7a5028" opacity="0.55">
    <circle cx="80" cy="180" r="0.85"/>
    <circle cx="120" cy="220" r="0.7"/>
    <circle cx="290" cy="200" r="0.85"/>
    <circle cx="240" cy="240" r="0.7"/>
    <circle cx="180" cy="280" r="0.85"/>
  </g>

  <!-- Fog ambient leaking down from above (grey) -->
  <rect x="40" y="80" width="286" height="40" fill="#7a7880" opacity="0.4"/>

  <!-- ===== LUMA — center-bottom, looking UP at Theodore ===== -->
  <g transform="translate(183 290)">
    <!-- Luma's holographic lens dim glow -->
    <ellipse cx="0" cy="-50" rx="80" ry="60" fill="url(#i6p20p3lensGlow)" filter="url(#i6p20p3strongglow)" opacity="0.55"/>

    <!-- Body -->
    <!-- Legs -->
    <ellipse cx="-22" cy="80" rx="14" ry="6" fill="#0a0408"/>
    <ellipse cx="22" cy="80" rx="14" ry="6" fill="#0a0408"/>
    <rect x="-28" y="40" width="14" height="46" fill="url(#i6p20p3suit)"/>
    <rect x="14" y="40" width="14" height="46" fill="url(#i6p20p3suit)"/>
    <!-- HEAVY STONE DUST coating -->
    <ellipse cx="-22" cy="60" rx="14" ry="3" fill="#a8a098" opacity="0.95"/>
    <ellipse cx="22" cy="60" rx="14" ry="3" fill="#a8a098" opacity="0.95"/>
    <ellipse cx="-22" cy="74" rx="13" ry="3" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="22" cy="74" rx="13" ry="3" fill="#a8a098" opacity="0.85"/>

    <!-- Torso -->
    <path d="M-36,40 L-36,-30 L36,-30 L36,40 Z" fill="url(#i6p20p3suit)"/>
    <line x1="-22" y1="-10" x2="22" y2="-10" stroke="#a888ff" stroke-width="1.0" opacity="0.7" filter="url(#i6p20p3bloom)"/>
    <!-- Heavy dust on torso -->
    <ellipse cx="-18" cy="-2" rx="10" ry="4" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="18" cy="-2" rx="10" ry="4" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="0" cy="14" rx="22" ry="4" fill="#a8a098" opacity="0.7"/>
    <!-- Shoulders -->
    <path d="M-36,-30 Q-26,-44 0,-44 Q26,-44 36,-30 Z" fill="url(#i6p20p3suit)"/>

    <!-- Arms -->
    <path d="M-36,-30 L-50,-14 L-50,14 L-36,4 Z" fill="url(#i6p20p3suit)"/>
    <path d="M36,-30 L50,-14 L50,14 L36,4 Z" fill="url(#i6p20p3suit)"/>
    <ellipse cx="-50" cy="-2" rx="7" ry="5" fill="url(#i6p20p3skin)"/>
    <ellipse cx="50" cy="-2" rx="7" ry="5" fill="url(#i6p20p3skin)"/>

    <!-- Wing-pack stowed (faint slot glow) -->
    <line x1="-30" y1="-44" x2="-30" y2="-32" stroke="#5a3ad8" stroke-width="0.55" opacity="0.55" filter="url(#i6p20p3bloom)"/>
    <line x1="30" y1="-44" x2="30" y2="-32" stroke="#5a3ad8" stroke-width="0.55" opacity="0.55" filter="url(#i6p20p3bloom)"/>

    <!-- Head — looking UP -->
    <ellipse cx="0" cy="-60" rx="22" ry="24" fill="url(#i6p20p3skin)"/>
    <!-- Long dark hair in ONE THICK BRAID -->
    <path d="M-18,-78 Q-16,-86 0,-88 Q16,-86 18,-78 L18,-72 Q9,-74 0,-74 Q-9,-74 -18,-72 Z" fill="#0a0604"/>
    <!-- Braid falling down back of head -->
    <path d="M-12,-82 Q-22,-78 -26,-66 Q-30,-54 -28,-30 Q-26,-10 -22,16 L-18,16" stroke="#0a0604" stroke-width="3" fill="none"/>
    <ellipse cx="-22" cy="-48" rx="2.4" ry="1.4" fill="#0a0604"/>
    <ellipse cx="-26" cy="-30" rx="2.4" ry="1.4" fill="#0a0604"/>
    <ellipse cx="-26" cy="-12" rx="2.4" ry="1.4" fill="#0a0604"/>
    <ellipse cx="-24" cy="6" rx="2.4" ry="1.4" fill="#0a0604"/>
    <!-- Braid luminous filament -->
    <line x1="-12" y1="-76" x2="-22" y2="-50" stroke="#a888ff" stroke-width="0.55" opacity="0.7" filter="url(#i6p20p3bloom)"/>
    <line x1="-22" y1="-50" x2="-26" y2="-30" stroke="#a888ff" stroke-width="0.55" opacity="0.7" filter="url(#i6p20p3bloom)"/>
    <line x1="-26" y1="-30" x2="-24" y2="6" stroke="#a888ff" stroke-width="0.55" opacity="0.55" filter="url(#i6p20p3bloom)"/>

    <!-- Holographic lenses — DIM (attention is up not on scan) -->
    <ellipse cx="-9" cy="-58" rx="6" ry="4" fill="#a888ff" filter="url(#i6p20p3bloom)" opacity="0.4"/>
    <ellipse cx="9" cy="-58" rx="6" ry="4" fill="#a888ff" filter="url(#i6p20p3bloom)" opacity="0.4"/>
    <circle cx="-9" cy="-58" r="2" fill="#1a0a04"/>
    <circle cx="9" cy="-58" r="2" fill="#1a0a04"/>
    <!-- Pupils looking UP -->
    <circle cx="-9" cy="-60" r="1.4" fill="#fff"/>
    <circle cx="9" cy="-60" r="1.4" fill="#fff"/>

    <!-- Brow soft, attentive -->
    <path d="M-15,-72 Q-9,-74 -3,-72" stroke="#3a1a04" stroke-width="0.85" fill="none"/>
    <path d="M15,-72 Q9,-74 3,-72" stroke="#3a1a04" stroke-width="0.85" fill="none"/>

    <!-- Nose -->
    <path d="M-2,-58 L-2.4,-48 L0,-46 L2.4,-48 L2,-58 Z" fill="#5a3a28" opacity="0.85"/>

    <!-- Mouth — slight smile, listening -->
    <path d="M-4,-38 Q0,-36 4,-38" stroke="#3a1808" stroke-width="0.55" fill="none"/>

    <!-- Stone dust on shoulders -->
    <ellipse cx="-18" cy="-44" rx="4" ry="1.4" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="18" cy="-44" rx="4" ry="1.4" fill="#a8a098" opacity="0.85"/>
  </g>

  <!-- THEODORE dialogue (from above, larger text) -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,64 112,64 104,76" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="100.5" y1="64" x2="111.5" y2="64" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE  <tspan font-style="italic" font-size="9" font-weight="500">(from above)</tspan></text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">When I was small — smaller, I mean —</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">my gran would tell us stories.</text>

  <!-- THEODORE second balloon -->
  <g>
    <rect x="14" y="380" width="338" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,420 112,420 104,430" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="100.5" y1="420" x2="111.5" y2="420" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Not fairy stories. Different ones.</text>

  <!-- Brushwork overlay -->
  <g stroke="#5a3018" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q100,182 200,178 Q280,176 366,180"/>
    <path d="M0,360 Q100,362 200,358 Q280,356 366,360"/>
  </g>
</svg>
