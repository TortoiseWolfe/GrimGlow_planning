<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 421.5" width="366" height="421.5">
  <title>Issue 6 — Page 6 — Panel 2: Theodore at the pub doorway — silhouetted against warm amber threshold</title>
  <desc>50mm medium eye level. Theodore leans against pub doorframe like a boy waiting. Through doorway: wooden floors, bar, morning drinkers in firelight. Warm amber rectangle in grey street.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p6p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#605850"/>
      <stop offset="100%" stop-color="#2a2420"/>
    </linearGradient>
    <linearGradient id="i6p6p2pubFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p6p2pubInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaa48"/>
      <stop offset="100%" stop-color="#a85818"/>
    </linearGradient>
    <linearGradient id="i6p6p2theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p6p2theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p6p2pubGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85818" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p6p2bldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <filter id="i6p6p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p6p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="421.5" fill="url(#i6p6p2bg)"/>

  <!-- LEFT exterior brick wall (street side) -->
  <rect x="0" y="0" width="80" height="421.5" fill="url(#i6p6p2bldg)"/>
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="40" x2="80" y2="40"/>
    <line x1="0" y1="80" x2="80" y2="80"/>
    <line x1="0" y1="120" x2="80" y2="120"/>
    <line x1="0" y1="180" x2="80" y2="180"/>
    <line x1="0" y1="240" x2="80" y2="240"/>
    <line x1="0" y1="300" x2="80" y2="300"/>
  </g>
  <ellipse cx="40" cy="180" rx="32" ry="40" fill="#0a0408" opacity="0.55"/>

  <!-- RIGHT exterior wall -->
  <rect x="320" y="0" width="46" height="421.5" fill="url(#i6p6p2bldg)"/>

  <!-- Cobble street foreground -->
  <rect x="0" y="380" width="366" height="42" fill="#3a3028"/>
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,395 Q120,393 240,395 Q330,397 366,395"/>
    <path d="M0,405 Q120,403 240,405 Q330,407 366,405"/>
    <path d="M0,415 Q120,413 240,415 Q330,417 366,415"/>
  </g>

  <!-- ===== PUB DOORWAY — large warm rectangle center-frame ===== -->
  <!-- Door frame -->
  <rect x="80" y="40" width="240" height="350" fill="url(#i6p6p2pubFrame)"/>
  <!-- Outer glow halo around doorway -->
  <ellipse cx="200" cy="220" rx="160" ry="200" fill="url(#i6p6p2pubGlow)" filter="url(#i6p6p2glow)" opacity="0.55"/>

  <!-- Door interior — warm amber light -->
  <rect x="100" y="60" width="200" height="320" fill="url(#i6p6p2pubInterior)" filter="url(#i6p6p2glow)"/>
  <!-- Frame moldings -->
  <rect x="80" y="40" width="240" height="350" fill="none" stroke="#1a0c04" stroke-width="2.4"/>
  <rect x="98" y="58" width="204" height="324" fill="none" stroke="#3a1808" stroke-width="0.85"/>
  <!-- Door header arch -->
  <path d="M80,60 Q200,40 320,60" stroke="#3a1808" stroke-width="2.4" fill="none"/>

  <!-- Pub interior elements visible through doorway -->
  <!-- Wooden floor -->
  <rect x="100" y="320" width="200" height="60" fill="#3a1808"/>
  <line x1="100" y1="350" x2="300" y2="350" stroke="#1a0c04" stroke-width="0.55" opacity="0.7"/>
  <line x1="100" y1="370" x2="300" y2="370" stroke="#1a0c04" stroke-width="0.55" opacity="0.7"/>
  <!-- Floorboard seams -->
  <line x1="140" y1="320" x2="140" y2="380" stroke="#1a0c04" stroke-width="0.4" opacity="0.6"/>
  <line x1="180" y1="320" x2="180" y2="380" stroke="#1a0c04" stroke-width="0.4" opacity="0.6"/>
  <line x1="220" y1="320" x2="220" y2="380" stroke="#1a0c04" stroke-width="0.4" opacity="0.6"/>
  <line x1="260" y1="320" x2="260" y2="380" stroke="#1a0c04" stroke-width="0.4" opacity="0.6"/>

  <!-- BAR COUNTER (back of pub) -->
  <rect x="100" y="240" width="200" height="60" fill="#3a1808" stroke="#1a0c04" stroke-width="0.85"/>
  <line x1="100" y1="260" x2="300" y2="260" stroke="#1a0c04" stroke-width="0.7"/>
  <!-- Brass tap -->
  <rect x="180" y="232" width="6" height="14" fill="#c89058"/>
  <rect x="178" y="240" width="10" height="3" fill="#a87038"/>
  <!-- Bottles row behind bar -->
  <g fill="#5a3018">
    <rect x="118" y="206" width="6" height="34"/>
    <rect x="130" y="200" width="6" height="40"/>
    <rect x="142" y="208" width="6" height="32"/>
    <rect x="222" y="204" width="6" height="36"/>
    <rect x="234" y="202" width="6" height="38"/>
    <rect x="246" y="208" width="6" height="32"/>
    <rect x="258" y="200" width="6" height="40"/>
    <rect x="270" y="206" width="6" height="34"/>
  </g>
  <!-- Bottle highlights -->
  <g fill="#ffd078" opacity="0.6">
    <rect x="120" y="210" width="2" height="12"/>
    <rect x="132" y="206" width="2" height="14"/>
    <rect x="144" y="212" width="2" height="10"/>
    <rect x="224" y="208" width="2" height="12"/>
    <rect x="236" y="206" width="2" height="14"/>
  </g>

  <!-- CEILING beams + gas lamp -->
  <rect x="100" y="60" width="200" height="14" fill="#3a1808"/>
  <rect x="180" y="74" width="40" height="20" fill="#3a1808"/>
  <ellipse cx="200" cy="100" rx="12" ry="6" fill="#ffaa48" filter="url(#i6p6p2bloom)" opacity="0.95"/>
  <ellipse cx="200" cy="100" rx="40" ry="18" fill="#ffaa48" opacity="0.4" filter="url(#i6p6p2glow)"/>

  <!-- FIREPLACE on far wall — warm orange glow -->
  <rect x="220" y="200" width="50" height="32" fill="#1a0c04"/>
  <ellipse cx="245" cy="216" rx="22" ry="11" fill="#ffaa48" filter="url(#i6p6p2bloom)" opacity="0.85"/>
  <ellipse cx="245" cy="216" rx="14" ry="6" fill="#fff8e8" filter="url(#i6p6p2bloom)" opacity="0.85"/>

  <!-- MORNING DRINKERS hunched at bar -->
  <g transform="translate(160 270)" opacity="0.85">
    <ellipse cx="0" cy="14" rx="8" ry="5" fill="#3a1808"/>
    <path d="M-8,-12 L8,-12 L10,14 L-10,14 Z" fill="#5a3018"/>
    <ellipse cx="0" cy="-18" rx="5" ry="6" fill="#a85818"/>
    <ellipse cx="0" cy="-26" rx="4" ry="3" fill="#3a2818"/>
  </g>
  <g transform="translate(220 274)" opacity="0.85">
    <ellipse cx="0" cy="14" rx="8" ry="5" fill="#3a1808"/>
    <path d="M-8,-10 L8,-10 L10,14 L-10,14 Z" fill="#5a3018"/>
    <ellipse cx="0" cy="-16" rx="5" ry="6" fill="#a85818"/>
    <ellipse cx="0" cy="-22" rx="4" ry="3" fill="#1a0c04"/>
  </g>

  <!-- ===== THEODORE — leaning against doorframe LEFT side, silhouetted ===== -->
  <g transform="translate(116 380)">
    <!-- Boots -->
    <ellipse cx="-7" cy="0" rx="9" ry="3" fill="#1a0c04"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#1a0c04"/>
    <!-- Trousers — ankle crossed slightly -->
    <path d="M-10,-58 L-2,-58 L-4,0 L-12,0 Z" fill="url(#i6p6p2theoTrousers)"/>
    <path d="M2,-58 L10,-58 L13,0 L4,0 Z" fill="url(#i6p6p2theoTrousers)"/>
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="-10" y="-58" width="22" height="3" fill="#3a1808"/>
    <!-- Shirt + waistcoat -->
    <path d="M-11,-118 L-10,-58 L11,-58 L12,-118 Z" fill="#d4c4a8"/>
    <path d="M-13,-116 L-11,-58 L-2,-58 L-2,-116 Z" fill="url(#i6p6p2theoWaistcoat)"/>
    <path d="M12,-116 L13,-58 L2,-58 L2,-116 Z" fill="url(#i6p6p2theoWaistcoat)"/>
    <!-- Pocket -->
    <rect x="3" y="-108" width="9" height="13" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="4" y="-104" width="7" height="9" fill="#5a3ad8" opacity="0.55" filter="url(#i6p6p2bloom)"/>
    <ellipse cx="7" cy="-100" rx="9" ry="6" fill="#a888ff" opacity="0.55" filter="url(#i6p6p2glow)"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-100" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-82" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-64" r="0.85" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-6,-118 L0,-116 L6,-118 L6,-114 L0,-110 L-6,-114 Z" fill="#e0d4b8"/>
    <!-- LEFT arm leaning against frame (shoulder up) -->
    <path d="M-13,-116 L-22,-100 L-22,-58 L-12,-58 L-12,-94 Z" fill="url(#i6p6p2theoWaistcoat)"/>
    <!-- Right arm in pocket -->
    <path d="M13,-116 L18,-94 L14,-58 L4,-58 L4,-90 Z" fill="url(#i6p6p2theoWaistcoat)"/>
    <ellipse cx="-22" cy="-58" rx="2.4" ry="1.4" fill="#a87838"/>
    <ellipse cx="14" cy="-58" rx="2.4" ry="1.4" fill="#a87838"/>
    <!-- Brass ring on left index -->
    <circle cx="-22" cy="-59" r="0.7" fill="#c89058" filter="url(#i6p6p2bloom)" opacity="0.85"/>
    <!-- Head — silhouetted, looking subtly down at pocket -->
    <rect x="-3" y="-126" width="6" height="8" fill="#3a2418"/>
    <ellipse cx="0" cy="-138" rx="13" ry="15" fill="#3a2418"/>
    <!-- Backlit hair edge -->
    <path d="M-12,-148 Q-9,-158 0,-160 Q9,-158 12,-148 L12,-138 Q8,-144 0,-144 Q-8,-144 -12,-138 Z" fill="#1a0c08"/>
    <!-- Hair tufts barely visible -->
    <path d="M-7,-156 L-5,-160 L-8,-160 Z" fill="#1a0c08"/>
    <path d="M5,-156 L7,-160 L4,-160 Z" fill="#1a0c08"/>
    <!-- Eyes glanced down (silhouetted but eye highlights catch warm rim) -->
    <ellipse cx="-3" cy="-138" rx="0.85" ry="0.55" fill="#ffaa48"/>
    <ellipse cx="3" cy="-138" rx="0.85" ry="0.55" fill="#ffaa48"/>
    <!-- Warm amber rim catching outline -->
    <path d="M12,-148 Q14,-130 12,-100" stroke="#ffaa48" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#i6p6p2bloom)"/>
    <path d="M-12,-148 Q-14,-130 -12,-100" stroke="#ffaa48" stroke-width="0.55" fill="none" opacity="0.55" filter="url(#i6p6p2bloom)"/>
  </g>

  <!-- THEODORE dialogue (low, barely moving lips) -->
  <g>
    <rect x="14" y="14" width="338" height="58" rx="2" fill="white" stroke="#6a4220" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,72 172,72 164,82" fill="white" stroke="#6a4220" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="72" x2="171.5" y2="72" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700" font-style="italic">THEODORE (low)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">This is the pub. The one where</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">they saw shadows moving wrong.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q120,92 240,88 Q330,86 366,90"/>
    <path d="M0,360 Q120,362 240,358 Q330,356 366,360"/>
  </g>
</svg>
