<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 6 — Page 1 — Panel 3: Sable listens — arms crossed, anomaly map backlight, "Continue."</title>
  <desc>50mm medium shot eye level slight angle. Sable arms crossed, weight back foot, blue-violet map light from right backlighting her, soot bloom at right shoulder catches warm amber from floorboard gap above.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p1p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="i6p1p3sableSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="i6p1p3sableSuitRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="i6p1p3beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="i6p1p3mapBacklight" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p1p3floorLeak" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p1p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p1p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#i6p1p3bg)"/>

  <!-- Floorboard ABOVE -->
  <rect x="0" y="0" width="366" height="32" fill="#3a2818"/>
  <g stroke="#1a0c04" stroke-width="1" opacity="0.7">
    <line x1="80" y1="0" x2="80" y2="32"/>
    <line x1="200" y1="0" x2="200" y2="32"/>
    <line x1="280" y1="0" x2="280" y2="32"/>
  </g>
  <ellipse cx="80" cy="40" rx="34" ry="100" fill="url(#i6p1p3floorLeak)" filter="url(#i6p1p3glow)" opacity="0.55"/>
  <ellipse cx="200" cy="40" rx="34" ry="100" fill="url(#i6p1p3floorLeak)" filter="url(#i6p1p3glow)" opacity="0.5"/>

  <!-- Background timber column -->
  <rect x="48" y="32" width="10" height="300" fill="url(#i6p1p3beam)"/>
  <rect x="320" y="32" width="10" height="300" fill="url(#i6p1p3beam)"/>

  <!-- Map backlight from right edge — partial map visible at right -->
  <ellipse cx="380" cy="180" rx="120" ry="160" fill="url(#i6p1p3mapBacklight)" filter="url(#i6p1p3glow)"/>

  <!-- Partial holographic map elements visible at right edge — geometric wireframe slice -->
  <g stroke="#a888ff" stroke-width="0.5" fill="none" opacity="0.55" filter="url(#i6p1p3bloom)">
    <line x1="320" y1="100" x2="366" y2="100"/>
    <line x1="320" y1="140" x2="366" y2="140"/>
    <line x1="320" y1="180" x2="366" y2="180"/>
    <line x1="320" y1="220" x2="366" y2="220"/>
    <line x1="340" y1="80" x2="340" y2="240"/>
    <line x1="356" y1="80" x2="356" y2="240"/>
    <rect x="324" y="108" width="12" height="14"/>
    <rect x="344" y="148" width="14" height="12"/>
    <rect x="324" y="184" width="12" height="14"/>
    <rect x="344" y="200" width="14" height="14"/>
  </g>
  <!-- Pulsing node at right edge -->
  <circle cx="350" cy="160" r="8" fill="#a888ff" opacity="0.85" filter="url(#i6p1p3glow)"/>
  <circle cx="350" cy="160" r="2.5" fill="#fff8ff"/>

  <!-- Floor of camp -->
  <rect x="0" y="320" width="366" height="44" fill="#1a0c04"/>
  <line x1="58" y1="320" x2="320" y2="320" stroke="#0a0604" stroke-width="0.5" opacity="0.7"/>

  <!-- ===== SABLE — center-left, arms crossed, weight on back foot ===== -->
  <g transform="translate(168 322)">
    <!-- Boots -->
    <ellipse cx="-22" cy="0" rx="14" ry="6" fill="#0a0408"/>
    <ellipse cx="14" cy="-2" rx="14" ry="6" fill="#0a0408"/>
    <!-- Trousers -->
    <path d="M-28,-92 L-14,-95 L-12,-2 L-30,-2 Z" fill="url(#i6p1p3sableSuit)"/>
    <path d="M14,-95 L24,-92 L22,-4 L4,-2 Z" fill="url(#i6p1p3sableSuit)"/>
    <!-- Knee dust -->
    <ellipse cx="-22" cy="-50" rx="8" ry="2.4" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="16" cy="-52" rx="8" ry="2.4" fill="#5a4838" opacity="0.55"/>
    <!-- Rim light from right (map backlight) on right leg -->
    <path d="M14,-95 L20,-92 L18,-4 L8,-2 Z" fill="url(#i6p1p3sableSuitRim)" opacity="0.65"/>

    <!-- TORSO arms crossed — slight contrapposto -->
    <path d="M-30,-180 L-26,-95 L-14,-95 L-8,-180 Z" fill="url(#i6p1p3sableSuit)"/>
    <path d="M-8,-180 L8,-180 L14,-95 L24,-95 L20,-180 Z" fill="url(#i6p1p3sableSuit)"/>
    <!-- Combined torso fill -->
    <path d="M-30,-180 L-30,-95 L24,-95 L24,-180 Z" fill="url(#i6p1p3sableSuit)"/>
    <!-- Holo seam center -->
    <line x1="-12" y1="-130" x2="12" y2="-130" stroke="#a8c0ff" stroke-width="0.85" opacity="0.85" filter="url(#i6p1p3bloom)"/>
    <line x1="-10" y1="-128" x2="10" y2="-128" stroke="#fff8ff" stroke-width="0.4" opacity="0.7"/>

    <!-- Right shoulder soot bloom -->
    <ellipse cx="22" cy="-180" rx="10" ry="7" fill="#3a3038" opacity="0.85"/>
    <ellipse cx="20" cy="-176" rx="6" ry="3" fill="#1a1610" opacity="0.7"/>

    <!-- Tension-wear crease at collar -->
    <line x1="-8" y1="-178" x2="8" y2="-178" stroke="#3a3038" stroke-width="1.2" opacity="0.85"/>
    <line x1="-6" y1="-176" x2="6" y2="-176" stroke="#3a3038" stroke-width="0.55" opacity="0.65"/>

    <!-- ARMS CROSSED tight against chest -->
    <path d="M-30,-178 L-46,-148 L-30,-130 L-12,-138 L-12,-160 L-30,-178 Z" fill="url(#i6p1p3sableSuit)"/>
    <path d="M24,-178 L40,-148 L24,-130 L8,-138 L8,-160 L24,-178 Z" fill="url(#i6p1p3sableSuit)"/>
    <!-- Forearm dust -->
    <ellipse cx="-30" cy="-150" rx="6" ry="2.4" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="28" cy="-150" rx="6" ry="2.4" fill="#5a4838" opacity="0.55"/>
    <!-- Hands tucked into opposite forearms -->
    <ellipse cx="-12" cy="-140" rx="5" ry="3" fill="#3a2418"/>
    <ellipse cx="8" cy="-140" rx="5" ry="3" fill="#3a2418"/>
    <!-- Knuckle accents -->
    <line x1="-15" y1="-141" x2="-9" y2="-141" stroke="#1a0c04" stroke-width="0.45" opacity="0.85"/>
    <line x1="5" y1="-141" x2="11" y2="-141" stroke="#1a0c04" stroke-width="0.45" opacity="0.85"/>
    <!-- Rim light from right on right arm -->
    <path d="M24,-178 L36,-150 L26,-132 L20,-138 L20,-170 Z" fill="url(#i6p1p3sableSuitRim)" opacity="0.55"/>

    <!-- Neck -->
    <rect x="-6" y="-194" width="12" height="14" fill="#3a2418"/>

    <!-- HEAD — slight downward tilt, controlled, jaw set -->
    <ellipse cx="0" cy="-216" rx="22" ry="26" fill="#3a2418"/>
    <!-- Rim light right side -->
    <path d="M22,-216 Q18,-242 0,-242 Q-2,-220 22,-216 Z" fill="url(#i6p1p3sableSuitRim)" opacity="0.55"/>

    <!-- Buzz-cut silver hair — very short, military -->
    <path d="M-22,-228 Q-18,-242 0,-244 Q18,-242 22,-228 L20,-220 Q12,-232 0,-232 Q-12,-232 -20,-220 Z" fill="#e0d8d0"/>
    <!-- Fine stippling on buzz cut -->
    <g fill="#a8a098" opacity="0.85">
      <circle cx="-12" cy="-235" r="0.5"/>
      <circle cx="-6" cy="-238" r="0.5"/>
      <circle cx="0" cy="-240" r="0.5"/>
      <circle cx="6" cy="-238" r="0.5"/>
      <circle cx="12" cy="-235" r="0.5"/>
      <circle cx="-15" cy="-228" r="0.4"/>
      <circle cx="15" cy="-228" r="0.4"/>
    </g>
    <!-- Forehead -->
    <ellipse cx="0" cy="-228" rx="14" ry="6" fill="#5a3028" opacity="0.4"/>

    <!-- Eyes — fixed forward, narrow, controlled -->
    <ellipse cx="-7" cy="-216" rx="3" ry="1.6" fill="#fff8e8"/>
    <circle cx="-7" cy="-216" r="1.4" fill="#0a0604"/>
    <circle cx="-7" cy="-216" r="0.5" fill="#fff8ff"/>
    <ellipse cx="7" cy="-216" rx="3" ry="1.6" fill="#fff8e8"/>
    <circle cx="7" cy="-216" r="1.4" fill="#0a0604"/>
    <circle cx="7" cy="-216" r="0.5" fill="#fff8ff"/>

    <!-- Brows — drawn level, controlled -->
    <path d="M-12,-222 L-2,-222" stroke="#0a0604" stroke-width="1.2"/>
    <path d="M2,-222 L12,-222" stroke="#0a0604" stroke-width="1.2"/>
    <!-- Subtle brow crease -->
    <path d="M-3,-222 L0,-219" stroke="#1a0c04" stroke-width="0.45" opacity="0.7"/>

    <!-- Sharp angular cheek shadows -->
    <path d="M-16,-208 L-12,-200" stroke="#1a0c04" stroke-width="0.55" opacity="0.6" fill="none"/>
    <path d="M16,-208 L12,-200" stroke="#1a0c04" stroke-width="0.55" opacity="0.6" fill="none"/>

    <!-- Nose -->
    <path d="M0,-214 L-3,-204 L3,-204 Z" fill="#5a3028" opacity="0.5"/>

    <!-- Mouth — set, jaw firm, slight downturn -->
    <path d="M-6,-198 L6,-198" stroke="#1a0c04" stroke-width="1.1"/>
    <path d="M-6,-198 L-7,-200" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M6,-198 L7,-200" stroke="#1a0c04" stroke-width="0.55"/>

    <!-- Jaw set tight - shadow under chin -->
    <ellipse cx="0" cy="-192" rx="10" ry="2" fill="#1a0c04" opacity="0.55"/>

    <!-- Ear with comm earpiece glow -->
    <ellipse cx="22" cy="-216" rx="2.2" ry="3" fill="#3a2418"/>
    <circle cx="23" cy="-215" r="1.3" fill="#dad5d0" filter="url(#i6p1p3bloom)" opacity="0.95"/>
  </g>

  <!-- SABLE dialogue — single short word, "Continue." Top-right -->
  <g>
    <rect x="220" y="14" width="132" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="252,54 264,54 256,64" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="252.5" y1="54" x2="263.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="228" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="228" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Continue.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q120,82 240,78 Q330,76 366,80"/>
    <path d="M0,290 Q120,292 240,288 Q330,286 366,290"/>
  </g>
</svg>
