<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 16 — Panel 4: Theodore at storage doorway threshold, looks back at black grate — captions on learning when not to ask</title>
  <desc>28mm wide slight high angle. Theodore at doorway threshold, looking BACK over shoulder at iron grate (black square in dusty floor). Luma barely visible in pocket. Expression beyond his years. The grate is a dark square hole leading down. Faint blue-violet glow from pocket.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p16p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="i6p16p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="i6p16p4wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i6p16p4doorway" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p16p4leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p16p4linen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4c4a8"/>
      <stop offset="100%" stop-color="#a8987c"/>
    </linearGradient>
    <linearGradient id="i6p16p4trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p16p4window" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a89888" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p16p4pocketDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a3ad8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p16p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p16p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p16p4bg)"/>

  <!-- Storage room back wall -->
  <rect x="0" y="0" width="742" height="280" fill="url(#i6p16p4wall)"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.45">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
  </g>

  <!-- Window light source upper-right -->
  <ellipse cx="640" cy="80" rx="200" ry="160" fill="url(#i6p16p4window)" filter="url(#i6p16p4glow)"/>

  <!-- DOORWAY threshold on left edge of frame (Theodore standing at it) -->
  <rect x="0" y="0" width="100" height="280" fill="#3a2818"/>
  <rect x="80" y="0" width="20" height="280" fill="url(#i6p16p4doorway)"/>
  <line x1="80" y1="0" x2="80" y2="280" stroke="#0a0408" stroke-width="2"/>
  <!-- Door frame -->
  <rect x="80" y="0" width="6" height="280" fill="#1a0c04"/>
  <!-- Stairs leading up beyond doorway (suggested) -->
  <g opacity="0.7">
    <rect x="14" y="240" width="60" height="6" fill="#5a4030"/>
    <rect x="14" y="220" width="60" height="6" fill="#5a4030"/>
    <rect x="14" y="200" width="60" height="6" fill="#5a4030"/>
    <line x1="14" y1="252" x2="74" y2="252" stroke="#1a0c04" stroke-width="0.55" opacity="0.7"/>
  </g>

  <!-- Floor — wood planks -->
  <rect x="0" y="280" width="742" height="84" fill="url(#i6p16p4floor)"/>
  <line x1="0" y1="290" x2="742" y2="290" stroke="#1a0c04" stroke-width="0.85" opacity="0.85"/>
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.55" fill="none">
    <line x1="180" y1="290" x2="180" y2="364"/>
    <line x1="320" y1="290" x2="320" y2="364"/>
    <line x1="460" y1="290" x2="460" y2="364"/>
    <line x1="600" y1="290" x2="600" y2="364"/>
  </g>
  <!-- Dust on floor -->
  <g fill="#a89888" opacity="0.45">
    <ellipse cx="200" cy="330" rx="40" ry="2"/>
    <ellipse cx="380" cy="335" rx="50" ry="2.4"/>
    <ellipse cx="560" cy="330" rx="60" ry="2.4"/>
  </g>

  <!-- IRON GRATE in floor — open, BLACK SQUARE void -->
  <g transform="translate(540 320)">
    <rect x="-60" y="-30" width="120" height="60" fill="#020108"/>
    <rect x="-60" y="-30" width="120" height="60" fill="none" stroke="#1a0c04" stroke-width="2"/>
    <!-- Vertical bars -->
    <g fill="#1a0c04" stroke="#0a0408" stroke-width="0.55">
      <rect x="-44" y="-30" width="3" height="60"/>
      <rect x="-22" y="-30" width="3" height="60"/>
      <rect x="0" y="-30" width="3" height="60"/>
      <rect x="22" y="-30" width="3" height="60"/>
      <rect x="44" y="-30" width="3" height="60"/>
    </g>
    <!-- Propped open hinge -->
    <line x1="60" y1="-30" x2="76" y2="-44" stroke="#1a0c04" stroke-width="1.4"/>
  </g>

  <!-- ===== THEODORE — at doorway threshold, looking BACK over shoulder at grate ===== -->
  <g transform="translate(160 320)">
    <!-- Boots planted -->
    <ellipse cx="-9" cy="0" rx="10" ry="3" fill="#1a0c04"/>
    <ellipse cx="11" cy="0" rx="10" ry="3" fill="#1a0c04"/>
    <!-- Trousers -->
    <path d="M-12,-58 L-2,-58 L-4,0 L-13,0 Z" fill="url(#i6p16p4trousers)"/>
    <path d="M2,-58 L12,-58 L13,0 L4,0 Z" fill="url(#i6p16p4trousers)"/>
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="-12" y="-58" width="24" height="3" fill="#3a1808"/>

    <!-- Body torso facing forward (toward door, off-frame left) but head turned BACK over right shoulder -->
    <path d="M-13,-118 L-12,-58 L13,-58 L14,-118 Z" fill="url(#i6p16p4linen)"/>
    <path d="M-15,-116 L-13,-58 L-2,-58 L-2,-116 Z" fill="url(#i6p16p4leather)"/>
    <path d="M14,-116 L15,-58 L2,-58 L2,-116 Z" fill="url(#i6p16p4leather)"/>
    <!-- Pocket — LUMA INSIDE, faintest blue-violet glow -->
    <rect x="3" y="-108" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="5" y="-104" width="7" height="9" fill="#3a2068" opacity="0.55"/>
    <ellipse cx="9" cy="-99" rx="11" ry="5" fill="url(#i6p16p4pocketDim)" filter="url(#i6p16p4glow)"/>
    <!-- Top of Luma's braided head visible above pocket lip -->
    <ellipse cx="9" cy="-104" rx="2" ry="0.85" fill="#0a0604"/>
    <!-- Tiny dust-covered hand on edge -->
    <ellipse cx="11" cy="-103" rx="1" ry="0.4" fill="#a8a098" opacity="0.85"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-100" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-82" r="0.85" fill="#3a1808"/>
    <circle cx="-2" cy="-64" r="0.85" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-118 L0,-116 L7,-118 L7,-114 L0,-110 L-7,-114 Z" fill="#e0d4b8"/>

    <!-- Arms — at sides, body language carrying weight -->
    <path d="M-15,-116 L-22,-90 L-22,-58 L-13,-58 Z" fill="url(#i6p16p4leather)"/>
    <path d="M14,-116 L21,-90 L21,-58 L13,-58 Z" fill="url(#i6p16p4leather)"/>
    <ellipse cx="-22" cy="-58" rx="2.4" ry="1.4" fill="#a87838"/>
    <ellipse cx="21" cy="-58" rx="2.4" ry="1.4" fill="#a87838"/>
    <circle cx="-22" cy="-59" r="0.7" fill="#c89058" filter="url(#i6p16p4bloom)" opacity="0.85"/>

    <!-- Head — TURNED LEFT-BACK over shoulder (3/4 back view, looking right toward grate) -->
    <rect x="-3" y="-126" width="6" height="8" fill="#a87838"/>
    <ellipse cx="3" cy="-138" rx="14" ry="15" fill="#a87838"/>
    <!-- Hair -->
    <path d="M-9,-148 Q-7,-160 3,-162 Q15,-160 17,-148 L17,-138 Q12,-144 3,-144 Q-6,-144 -9,-138 Z" fill="#9a7038"/>
    <path d="M-3,-156 L0,-160 L-5,-160 Z" fill="#9a7038"/>
    <path d="M7,-156 L10,-160 L4,-160 Z" fill="#9a7038"/>
    <!-- Ear visible (3/4 back angle) -->
    <ellipse cx="-9" cy="-138" rx="2" ry="3" fill="#a87838"/>
    <ellipse cx="-9" cy="-138" rx="1.2" ry="2" fill="#7a4828"/>
    <!-- Eyes shifted RIGHT (back toward grate behind him) -->
    <ellipse cx="2" cy="-138" rx="1.6" ry="1.2" fill="#fff8e8"/>
    <circle cx="3" cy="-138" r="0.85" fill="#5a3818"/>
    <ellipse cx="9" cy="-138" rx="1.6" ry="1.2" fill="#fff8e8"/>
    <circle cx="10" cy="-138" r="0.85" fill="#5a3818"/>
    <!-- Brows level — beyond his years -->
    <path d="M-1,-144 L4,-144" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M6,-144 L11,-144" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth set, slight downturn -->
    <path d="M0,-128 L6,-128" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="6" y1="-128" x2="7" y2="-127" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Slight nose profile (from 3/4 angle) -->
    <path d="M14,-136 L17,-132" stroke="#7a4828" stroke-width="0.7" fill="none"/>
  </g>

  <!-- CAPTION 1 -->
  <g>
    <rect x="14" y="14" width="540" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-weight="700" font-style="italic">CAPTION</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Theodore did not ask what the markings said. He understood Luma would tell him when she could.</text>

  <!-- CAPTION 2 — closing line of Section 3 -->
  <g>
    <rect x="14" y="64" width="280" height="40" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-weight="700" font-style="italic">CAPTION</text>
  <text x="22" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">He was learning when not to ask.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
