<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 11 — Panel 1: Basement interior — Theodore holds Luma like a lantern, scanner cone reveals claw marks on far wall</title>
  <desc>28mm wide establishing slightly elevated. Stone walls, brick arches, earth floor, iron support columns receding into darkness. Theodore holds Luma in palm at arm's length — she is the only light source. Scanner cone reveals far-wall claw marks at impossible height. Lair, not destination.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p11p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p11p1stoneWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p11p1stoneFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p11p1column" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p11p1lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p11p1theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p11p1theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p11p1scannerCone" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#5a3ad8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p11p1lumaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p11p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p11p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p11p1bg)"/>

  <!-- DARKNESS DOMINATES — establish near-total black -->
  <rect width="742" height="364" fill="#020108"/>

  <!-- LEFT stone wall (near, partially lit by scanner) -->
  <rect x="0" y="0" width="120" height="364" fill="url(#i6p11p1stoneFar)"/>
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.55" fill="none">
    <line x1="0" y1="40" x2="120" y2="40"/>
    <line x1="0" y1="80" x2="120" y2="80"/>
    <line x1="0" y1="120" x2="120" y2="120"/>
    <line x1="0" y1="160" x2="120" y2="160"/>
    <line x1="0" y1="200" x2="120" y2="200"/>
    <line x1="0" y1="240" x2="120" y2="240"/>
    <line x1="0" y1="280" x2="120" y2="280"/>
    <line x1="0" y1="320" x2="120" y2="320"/>
  </g>
  <!-- Damp stains on near walls -->
  <ellipse cx="40" cy="200" rx="26" ry="40" fill="#0a0408" opacity="0.85"/>

  <!-- CEILING brick arches (architecture above, mostly lost in dark) -->
  <path d="M0,0 L0,80 Q120,40 240,60 Q360,80 480,60 Q600,40 742,80 L742,0 Z" fill="#1a1008" opacity="0.85"/>
  <!-- Arch keystones -->
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.7" fill="none">
    <path d="M120,40 Q240,80 360,60"/>
    <path d="M360,60 Q480,80 600,40"/>
    <path d="M0,80 Q120,40 240,60"/>
    <path d="M600,40 Q720,80 742,80"/>
  </g>

  <!-- IRON SUPPORT COLUMN — left mid-distance -->
  <rect x="180" y="60" width="14" height="280" fill="url(#i6p11p1column)"/>
  <!-- Iron column rivets -->
  <g fill="#0a0408" stroke="#3a2818" stroke-width="0.55">
    <circle cx="187" cy="80" r="2"/>
    <circle cx="187" cy="160" r="2"/>
    <circle cx="187" cy="240" r="2"/>
    <circle cx="187" cy="320" r="2"/>
  </g>
  <!-- Highlights catching scanner light -->
  <line x1="180" y1="60" x2="180" y2="340" stroke="#5a4838" stroke-width="0.55" opacity="0.7"/>

  <!-- IRON SUPPORT COLUMN — right mid-distance (the timber-pillar setup for P4) -->
  <rect x="540" y="60" width="14" height="280" fill="url(#i6p11p1column)"/>
  <g fill="#0a0408" stroke="#3a2818" stroke-width="0.55">
    <circle cx="547" cy="80" r="2"/>
    <circle cx="547" cy="160" r="2"/>
    <circle cx="547" cy="240" r="2"/>
    <circle cx="547" cy="320" r="2"/>
  </g>

  <!-- FAR WALL (mostly dark, but where scanner cone reaches reveal CLAW MARKS) -->
  <rect x="280" y="100" width="380" height="200" fill="url(#i6p11p1stoneFar)" opacity="0.55"/>

  <!-- SCANNER CONE — primary light source — emanates from Luma's position toward far wall -->
  <path d="M180,210 L500,160 L500,260 Z" fill="url(#i6p11p1scannerCone)" filter="url(#i6p11p1glow)" opacity="0.85"/>
  <path d="M180,210 L460,180 L460,240 Z" fill="#a888ff" opacity="0.4" filter="url(#i6p11p1glow)"/>

  <!-- Where scanner illuminates the far wall — show stone, claw marks -->
  <ellipse cx="460" cy="200" rx="80" ry="50" fill="#3a2820" opacity="0.85"/>
  <g stroke="#0a0408" stroke-width="0.55" opacity="0.85">
    <line x1="380" y1="170" x2="540" y2="170"/>
    <line x1="380" y1="200" x2="540" y2="200"/>
    <line x1="380" y1="230" x2="540" y2="230"/>
    <line x1="400" y1="155" x2="400" y2="185"/>
    <line x1="440" y1="155" x2="440" y2="185"/>
    <line x1="480" y1="155" x2="480" y2="185"/>
    <line x1="420" y1="185" x2="420" y2="215"/>
    <line x1="460" y1="185" x2="460" y2="215"/>
    <line x1="500" y1="185" x2="500" y2="215"/>
    <line x1="400" y1="215" x2="400" y2="245"/>
    <line x1="440" y1="215" x2="440" y2="245"/>
    <line x1="480" y1="215" x2="480" y2="245"/>
  </g>

  <!-- ===== CLAW MARKS on far wall — same pattern as outside ===== -->
  <g transform="translate(460 195)">
    <path d="M-30,-15 L-15,30" stroke="#7a5a40" stroke-width="3.4" opacity="0.95"/>
    <path d="M-15,-15 L0,30" stroke="#7a5a40" stroke-width="3.4" opacity="0.95"/>
    <path d="M0,-15 L15,30" stroke="#7a5a40" stroke-width="3.4" opacity="0.95"/>
    <path d="M15,-15 L30,30" stroke="#7a5a40" stroke-width="3.4" opacity="0.95"/>
    <path d="M-30,-15 L-15,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <path d="M-15,-15 L0,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <path d="M0,-15 L15,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <path d="M15,-15 L30,30" stroke="#1a0c04" stroke-width="1.4" opacity="0.95"/>
    <!-- Iridescent residue — even more concentrated than outside -->
    <path d="M-30,-15 L-15,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.85" filter="url(#i6p11p1bloom)"/>
    <path d="M-15,-15 L0,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.85" filter="url(#i6p11p1bloom)"/>
    <path d="M0,-15 L15,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.85" filter="url(#i6p11p1bloom)"/>
    <path d="M15,-15 L30,30" stroke="#5a3a78" stroke-width="0.85" opacity="0.85" filter="url(#i6p11p1bloom)"/>
    <!-- Extra residue flecks -->
    <g fill="#3a1828" opacity="0.85" filter="url(#i6p11p1bloom)">
      <circle cx="-22" cy="0" r="0.85"/>
      <circle cx="-7" cy="0" r="0.85"/>
      <circle cx="8" cy="0" r="0.85"/>
      <circle cx="22" cy="0" r="0.85"/>
      <circle cx="-18" cy="20" r="0.85"/>
      <circle cx="-3" cy="20" r="0.85"/>
      <circle cx="12" cy="20" r="0.85"/>
      <circle cx="26" cy="20" r="0.85"/>
    </g>
  </g>

  <!-- COBWEBS in upper corners catching scanner light -->
  <g stroke="#5a4838" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,0 Q40,30 80,0"/>
    <path d="M0,0 Q30,60 0,120"/>
    <path d="M40,0 L60,80"/>
    <path d="M742,0 Q702,30 662,0"/>
    <path d="M742,0 Q712,60 742,120"/>
    <path d="M702,0 L682,80"/>
  </g>

  <!-- EARTH FLOOR -->
  <rect x="0" y="320" width="742" height="44" fill="#1a0c08"/>
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M40,340 Q200,338 400,340 Q580,342 700,340"/>
    <path d="M0,355 Q200,353 400,355 Q580,357 742,355"/>
  </g>
  <!-- Grit/debris on floor -->
  <g fill="#3a2820" opacity="0.55">
    <ellipse cx="220" cy="345" rx="9" ry="2"/>
    <ellipse cx="380" cy="350" rx="11" ry="2"/>
    <ellipse cx="500" cy="345" rx="6" ry="1.6"/>
    <ellipse cx="640" cy="350" rx="9" ry="2"/>
  </g>

  <!-- ===== THEODORE — left-foreground, holding Luma in palm at arm's length ===== -->
  <g transform="translate(140 320)">
    <!-- Boots -->
    <ellipse cx="-9" cy="0" rx="10" ry="3" fill="#1a0c04"/>
    <ellipse cx="11" cy="0" rx="10" ry="3" fill="#1a0c04"/>
    <!-- Trousers -->
    <path d="M-12,-46 L-2,-46 L-4,0 L-13,0 Z" fill="url(#i6p11p1theoTrousers)"/>
    <path d="M2,-46 L12,-46 L13,0 L4,0 Z" fill="url(#i6p11p1theoTrousers)"/>
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="-10" y="-46" width="22" height="3" fill="#3a1808"/>
    <!-- Shirt + waistcoat -->
    <path d="M-11,-104 L-10,-46 L11,-46 L12,-104 Z" fill="#d4c4a8"/>
    <path d="M-13,-102 L-11,-46 L-2,-46 L-2,-102 Z" fill="url(#i6p11p1theoWaistcoat)"/>
    <path d="M12,-102 L13,-46 L2,-46 L2,-102 Z" fill="url(#i6p11p1theoWaistcoat)"/>
    <!-- Pocket EMPTY (Luma is OUT in his hand) -->
    <rect x="3" y="-94" width="9" height="13" fill="#3a1808" stroke="#1a0c04" stroke-width="0.45"/>
    <!-- Linen collar -->
    <path d="M-6,-104 L0,-102 L6,-104 L6,-100 L0,-98 L-6,-100 Z" fill="#e0d4b8"/>
    <!-- LEFT arm extended UP holding palm with Luma standing on it -->
    <path d="M-13,-102 L-30,-86 L-32,-66 L-26,-62 L-15,-78 Z" fill="url(#i6p11p1theoWaistcoat)"/>
    <!-- Linen sleeve at cuff -->
    <ellipse cx="-32" cy="-66" rx="3" ry="1.4" fill="#d4c4a8"/>
    <!-- Wrist + hand extended forward -->
    <path d="M-32,-66 L-44,-58 L-58,-50 L-72,-46 L-72,-40 L-44,-50 Z" fill="#a87838"/>
    <!-- Open palm flat for Luma to stand on -->
    <path d="M-72,-46 L-90,-40 L-94,-30 L-90,-26 L-72,-32 Z" fill="#a87838"/>
    <!-- Palm creases -->
    <path d="M-86,-38 Q-78,-36 -72,-38" stroke="#5a3028" stroke-width="0.45" fill="none" opacity="0.7"/>
    <path d="M-88,-34 Q-78,-32 -72,-34" stroke="#5a3028" stroke-width="0.4" fill="none" opacity="0.55"/>
    <!-- Brass gear ring on left index — cool blue-violet rim from Luma's light -->
    <g transform="translate(-90 -34)">
      <circle cx="0" cy="0" r="1.6" fill="none" stroke="#c89058" stroke-width="0.85" filter="url(#i6p11p1bloom)"/>
      <circle cx="0" cy="0" r="1.6" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.85" filter="url(#i6p11p1bloom)"/>
    </g>

    <!-- RIGHT arm at side -->
    <path d="M12,-102 L20,-78 L20,-46 L13,-46 Z" fill="url(#i6p11p1theoWaistcoat)"/>
    <ellipse cx="20" cy="-46" rx="2.4" ry="1.4" fill="#a87838"/>

    <!-- Head — looking forward into beam -->
    <rect x="-3" y="-112" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-122" rx="13" ry="14" fill="#a87838"/>
    <path d="M-12,-130 Q-9,-140 0,-142 Q9,-140 12,-130 L12,-122 Q8,-128 0,-128 Q-8,-128 -12,-122 Z" fill="#9a7038"/>
    <!-- Underlight from palm Luma cools Theodore's chin -->
    <ellipse cx="0" cy="-118" rx="11" ry="3" fill="#a888ff" opacity="0.45" filter="url(#i6p11p1bloom)"/>
    <!-- Eyes scanning ahead -->
    <ellipse cx="-3" cy="-122" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-122" r="0.7" fill="#5a3818"/>
    <ellipse cx="3" cy="-122" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-122" r="0.7" fill="#5a3818"/>
    <!-- Brows -->
    <path d="M-7,-128 L-2,-128" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M2,-128 L7,-128" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth -->
    <path d="M-3,-114 L3,-114" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== LUMA standing on Theodore's palm — LANTERN IMAGE — bright blue-violet aura ===== -->
  <g transform="translate(48 280)">
    <!-- Bright aura around Luma -->
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="url(#i6p11p1lumaGlow)" filter="url(#i6p11p1glow)"/>

    <!-- Tiny figure -->
    <ellipse cx="-2" cy="9" rx="2" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="9" rx="2" ry="1.4" fill="#0a0408"/>
    <rect x="-3" y="2" width="2" height="7" fill="url(#i6p11p1lumaSuit)"/>
    <rect x="2" y="2" width="2" height="7" fill="url(#i6p11p1lumaSuit)"/>
    <ellipse cx="-2" cy="6" rx="1.4" ry="0.55" fill="#5a3018" opacity="0.85"/>
    <ellipse cx="3" cy="6" rx="1.4" ry="0.55" fill="#5a3018" opacity="0.85"/>
    <!-- Torso -->
    <path d="M-4,2 L-4,-7 L4,-7 L4,2 Z" fill="url(#i6p11p1lumaSuit)"/>
    <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#a888ff" stroke-width="0.4" opacity="0.85" filter="url(#i6p11p1bloom)"/>
    <!-- Shoulders -->
    <path d="M-4,-7 Q-3,-10 0,-11 Q3,-10 4,-7 Z" fill="url(#i6p11p1lumaSuit)"/>
    <!-- Arms extended forward holding scanner -->
    <path d="M-4,-7 L-8,-3 L-8,-1 L-4,-3 Z" fill="url(#i6p11p1lumaSuit)"/>
    <path d="M4,-7 L8,-3 L8,-1 L4,-3 Z" fill="url(#i6p11p1lumaSuit)"/>
    <!-- Scanner held in both hands forward -->
    <rect x="-7" y="-3" width="14" height="3" rx="0.4" fill="#3a2068" stroke="#a888ff" stroke-width="0.4"/>
    <rect x="-5" y="-2" width="10" height="1.4" fill="#5a3ad8" filter="url(#i6p11p1bloom)"/>
    <ellipse cx="0" cy="-1" rx="9" ry="2" fill="#a888ff" opacity="0.85" filter="url(#i6p11p1glow)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-13" rx="3" ry="3.5" fill="#7a4838"/>
    <!-- Hair -->
    <path d="M-3,-15 Q-2,-17 0,-17 Q2,-17 3,-15 L3,-13 Q1,-14 0,-14 Q-1,-14 -3,-13 Z" fill="#0a0604"/>
    <!-- Lenses (catching scanner light) -->
    <ellipse cx="-1" cy="-13" rx="0.85" ry="0.7" fill="#a888ff" opacity="0.55" filter="url(#i6p11p1bloom)"/>
    <ellipse cx="1.4" cy="-13" rx="0.85" ry="0.7" fill="#a888ff" opacity="0.55" filter="url(#i6p11p1bloom)"/>
    <!-- Tiny eye glints -->
    <circle cx="-1" cy="-13" r="0.3" fill="#fff8ff"/>
    <circle cx="1.4" cy="-13" r="0.3" fill="#fff8ff"/>
    <!-- Braid -->
    <path d="M3,-12 Q5,-7 4,-2" stroke="#0a0604" stroke-width="0.85" stroke-linecap="round" fill="none"/>
  </g>

  <!-- LUMA dialogue -->
  <g>
    <rect x="14" y="14" width="338" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="160,54 172,54 164,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="160.5" y1="54" x2="171.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Hold me higher. I need line-of-sight to the back wall.</text>

  <!-- THEODORE dialogue (whispering — italic, dashed) -->
  <g>
    <rect x="500" y="64" width="228" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="568,104 580,104 572,114" fill="white" stroke="#6a4220" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="568.5" y1="104" x2="579.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="508" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700" font-style="italic">THEODORE (whisper)</text>
  <text x="508" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">More claw marks. Same as outside.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
