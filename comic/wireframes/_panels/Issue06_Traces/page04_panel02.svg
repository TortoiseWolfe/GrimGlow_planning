<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 6 — Page 4 — Panel 2: REVEAL — Luma in Theodore's waistcoat breast pocket, blue-violet glow inside leather</title>
  <desc>50mm MCU slight high angle. Worn leather pocket, missing-button flap, Luma's tiny face peering over fabric edge with active spectral lenses. Blue-violet scanner glow lights leather interior. The defining scale image of the issue.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p4p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p4p2leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i6p4p2leatherDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="i6p4p2lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p4p2pocketGlow" cx="50%" cy="40%" r="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p4p2linen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0d4b8"/>
      <stop offset="100%" stop-color="#a8987c"/>
    </linearGradient>
    <filter id="i6p4p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p4p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#i6p4p2bg)"/>

  <!-- Linen shirt visible at top of frame -->
  <rect x="0" y="0" width="366" height="40" fill="url(#i6p4p2linen)"/>
  <g stroke="#7a6c4e" stroke-width="0.5" opacity="0.7" fill="none">
    <line x1="0" y1="14" x2="366" y2="14"/>
    <line x1="0" y1="22" x2="366" y2="28"/>
    <line x1="0" y1="32" x2="366" y2="36"/>
  </g>
  <!-- Linen weave texture -->
  <g stroke="#a8987c" stroke-width="0.25" opacity="0.55" fill="none">
    <line x1="40" y1="0" x2="40" y2="40"/>
    <line x1="80" y1="0" x2="80" y2="40"/>
    <line x1="120" y1="0" x2="120" y2="40"/>
    <line x1="160" y1="0" x2="160" y2="40"/>
    <line x1="200" y1="0" x2="200" y2="40"/>
    <line x1="240" y1="0" x2="240" y2="40"/>
    <line x1="280" y1="0" x2="280" y2="40"/>
    <line x1="320" y1="0" x2="320" y2="40"/>
  </g>

  <!-- WAISTCOAT body (worn leather) -->
  <rect x="0" y="40" width="366" height="324" fill="url(#i6p4p2leather)"/>
  <!-- Leather grain stripes -->
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55" fill="none">
    <path d="M0,80 Q120,86 240,82 Q330,78 366,82"/>
    <path d="M0,140 Q120,146 240,142 Q330,138 366,142"/>
    <path d="M0,200 Q120,206 240,202 Q330,198 366,202"/>
    <path d="M0,260 Q120,266 240,262 Q330,258 366,262"/>
    <path d="M0,320 Q120,326 240,322 Q330,318 366,322"/>
  </g>
  <!-- Wear scuffs/creases -->
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.7" fill="none">
    <path d="M40,80 Q60,160 80,260"/>
    <path d="M280,100 Q300,180 320,280"/>
    <path d="M150,300 Q160,330 170,360"/>
  </g>
  <!-- Lighter highlights catching the leather grain -->
  <g stroke="#a8784c" stroke-width="0.35" opacity="0.6" fill="none">
    <path d="M0,90 Q100,94 200,92"/>
    <path d="M180,170 Q280,174 366,172"/>
    <path d="M0,230 Q120,234 240,232"/>
  </g>
  <!-- Stitching down center seam (where waistcoat closes) -->
  <line x1="20" y1="40" x2="20" y2="364" stroke="#5a3018" stroke-width="0.85" opacity="0.85" stroke-dasharray="3 2"/>
  <!-- Buttons down center seam -->
  <circle cx="20" cy="100" r="3.5" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
  <circle cx="20" cy="100" r="2" fill="#5a3018"/>
  <line x1="18.5" y1="98.5" x2="21.5" y2="101.5" stroke="#1a0c04" stroke-width="0.4"/>
  <line x1="21.5" y1="98.5" x2="18.5" y2="101.5" stroke="#1a0c04" stroke-width="0.4"/>
  <circle cx="20" cy="180" r="3.5" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
  <circle cx="20" cy="180" r="2" fill="#5a3018"/>
  <circle cx="20" cy="260" r="3.5" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
  <circle cx="20" cy="260" r="2" fill="#5a3018"/>
  <circle cx="20" cy="340" r="3.5" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
  <circle cx="20" cy="340" r="2" fill="#5a3018"/>

  <!-- ===== POCKET — left side of waistcoat (right of frame from camera) ===== -->
  <!-- Pocket body -->
  <rect x="98" y="98" width="220" height="180" fill="url(#i6p4p2leatherDark)" stroke="#1a0c04" stroke-width="1.4"/>
  <!-- Pocket interior darkness -->
  <rect x="106" y="138" width="204" height="132" fill="#0a0408"/>
  <!-- Stitching around pocket border -->
  <g stroke="#a8784c" stroke-width="0.55" opacity="0.85" stroke-dasharray="3 2.5" fill="none">
    <path d="M98,98 L318,98 L318,278 L98,278 Z"/>
  </g>
  <!-- Wear ring around pocket opening -->
  <g stroke="#1a0c04" stroke-width="0.7" opacity="0.7" fill="none">
    <path d="M98,138 L318,138"/>
  </g>

  <!-- Pocket FLAP (folded back, button missing) -->
  <path d="M98,76 L318,76 L322,98 L94,98 Z" fill="url(#i6p4p2leather)" stroke="#1a0c04" stroke-width="1"/>
  <!-- Flap stitching -->
  <g stroke="#a8784c" stroke-width="0.45" opacity="0.85" stroke-dasharray="2 2" fill="none">
    <path d="M104,80 L312,80 L316,96"/>
  </g>
  <!-- BUTTON MISSING — empty buttonhole -->
  <ellipse cx="208" cy="88" rx="4" ry="2.4" fill="#0a0408"/>
  <ellipse cx="208" cy="88" rx="3" ry="1.4" fill="#1a0c04"/>
  <!-- Loose threads where button was -->
  <path d="M204,88 Q207,90 211,89" stroke="#5a4030" stroke-width="0.4" fill="none" opacity="0.85"/>
  <path d="M205,87 Q208,86 212,87" stroke="#5a4030" stroke-width="0.35" fill="none" opacity="0.7"/>

  <!-- BLUE-VIOLET GLOW emanating from inside pocket -->
  <ellipse cx="208" cy="190" rx="120" ry="80" fill="url(#i6p4p2pocketGlow)" filter="url(#i6p4p2glow)"/>
  <!-- Inner pocket glow concentrated at Luma's position -->
  <ellipse cx="208" cy="160" rx="60" ry="34" fill="#a888ff" opacity="0.45" filter="url(#i6p4p2glow)"/>

  <!-- ===== LUMA — peering over pocket edge ===== -->
  <g transform="translate(208 152)">
    <!-- Top of suit shoulders visible just above pocket edge -->
    <path d="M-22,8 L-18,-10 L18,-10 L22,8 Z" fill="url(#i6p4p2lumaSuit)"/>
    <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#a888ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p4p2bloom)"/>
    <!-- Dust on shoulders -->
    <ellipse cx="-18" cy="-9" rx="4" ry="1.6" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="18" cy="-9" rx="4" ry="1.6" fill="#5a4838" opacity="0.55"/>

    <!-- Head / face peering up -->
    <ellipse cx="0" cy="-30" rx="14" ry="18" fill="#7a4838"/>
    <!-- Underlight from scanner — strong blue-violet wash -->
    <ellipse cx="0" cy="-22" rx="11" ry="6" fill="#a888ff" opacity="0.4" filter="url(#i6p4p2bloom)"/>

    <!-- Hair pulled back into braid -->
    <path d="M-13,-38 Q-10,-46 0,-48 Q10,-46 13,-38 L13,-30 Q6,-36 0,-36 Q-6,-36 -13,-30 Z" fill="#0a0604"/>
    <!-- Sapphire filament glints in braid -->
    <line x1="-6" y1="-44" x2="-4" y2="-46" stroke="#5a3ad8" stroke-width="1" opacity="0.85" filter="url(#i6p4p2bloom)"/>
    <line x1="4" y1="-46" x2="6" y2="-44" stroke="#5a3ad8" stroke-width="1" opacity="0.85" filter="url(#i6p4p2bloom)"/>
    <!-- Braid trailing back into pocket darkness (only top visible) -->
    <path d="M13,-32 Q16,-22 14,-12" stroke="#0a0604" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M13,-32 Q16,-22 14,-12" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p4p2bloom)"/>

    <!-- Lenses -->
    <ellipse cx="-5" cy="-30" rx="4" ry="3" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="5" cy="-30" rx="4" ry="3" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="-5" cy="-30" rx="4" ry="3" fill="none" stroke="#a888ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p4p2bloom)"/>
    <ellipse cx="5" cy="-30" rx="4" ry="3" fill="none" stroke="#a888ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p4p2bloom)"/>
    <line x1="-1" y1="-30" x2="1" y2="-30" stroke="#a888ff" stroke-width="0.55" opacity="0.95"/>

    <!-- Hairline crack on left lens -->
    <line x1="-8" y1="-32" x2="-3" y2="-29" stroke="#fff8ff" stroke-width="0.55" opacity="0.95" filter="url(#i6p4p2bloom)"/>

    <!-- Scrolling data inside lenses -->
    <g stroke="#fff8ff" stroke-width="0.4" fill="none" opacity="0.95" filter="url(#i6p4p2bloom)">
      <line x1="-8" y1="-31" x2="-2" y2="-31"/>
      <line x1="-8" y1="-29" x2="-2" y2="-29"/>
      <line x1="2" y1="-31" x2="8" y2="-31"/>
      <line x1="2" y1="-29" x2="8" y2="-29"/>
    </g>

    <!-- Eyes -->
    <ellipse cx="-5" cy="-30" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-5" cy="-30" r="0.85" fill="#0a0604"/>
    <circle cx="-5.4" cy="-30.4" r="0.4" fill="#fff8ff"/>
    <ellipse cx="5" cy="-30" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="5" cy="-30" r="0.85" fill="#0a0604"/>
    <circle cx="4.6" cy="-30.4" r="0.4" fill="#fff8ff"/>

    <!-- Brows -->
    <path d="M-9,-38 L-2,-37" stroke="#0a0604" stroke-width="0.7"/>
    <path d="M2,-37 L9,-38" stroke="#0a0604" stroke-width="0.7"/>

    <!-- Nose hint -->
    <path d="M0,-26 L-2,-22 L2,-22 Z" fill="#5a3028" opacity="0.45"/>

    <!-- Mouth — slight set, focused -->
    <path d="M-3,-18 L3,-18" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- Pocket lip shadow (just inside the opening, behind Luma) -->
  <ellipse cx="208" cy="146" rx="100" ry="4" fill="#0a0408" opacity="0.85"/>

  <!-- Hint of scanner inside pocket — geometric blue-violet pattern at her hand level -->
  <g transform="translate(208 178)" opacity="0.85" filter="url(#i6p4p2bloom)">
    <rect x="-9" y="-3" width="18" height="6" rx="0.7" fill="#3a2068" stroke="#a888ff" stroke-width="0.4"/>
    <rect x="-7" y="-1" width="14" height="2" fill="#5a3ad8"/>
    <ellipse cx="0" cy="0" rx="14" ry="4" fill="#a888ff" opacity="0.55"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#fff8ff" stroke-width="0.3"/>
  </g>

  <!-- LUMA dialogue (whispered — small) -->
  <g>
    <rect x="14" y="14" width="338" height="48" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="180,62 192,62 184,72" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="180.5" y1="62" x2="191.5" y2="62" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA (whispered)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Turn left at the next junction.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">The factory is sixty meters north.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q120,82 240,78 Q330,76 366,80"/>
    <path d="M0,300 Q120,302 240,298 Q330,296 366,300"/>
  </g>
</svg>
