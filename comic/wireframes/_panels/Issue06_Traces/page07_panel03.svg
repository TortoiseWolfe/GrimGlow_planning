<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 7 — Panel 3: Luma scans the bird — cellular cross-section, alarm</title>
  <desc>50mm CU eye level from crouching position. Luma climbed partly out of pocket, scanner extended toward bird. Holographic cross-section shows cell-wall destabilization. Luma's expression: curiosity → alarm. Lenses scrolling fast.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p7p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#403830"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p7p3leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p7p3lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p7p3cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#403830"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p7p3scannerBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p7p3iridescence" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a3a78" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c20" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p7p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p7p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p7p3bg)"/>

  <!-- Cobblestone surface -->
  <rect width="742" height="364" fill="url(#i6p7p3cobble)"/>
  <g stroke="#1a1410" stroke-width="0.7" opacity="0.65" fill="none">
    <path d="M0,80 Q200,82 400,80 Q580,78 742,80"/>
    <path d="M0,160 Q200,162 400,160 Q580,158 742,160"/>
    <path d="M0,240 Q200,242 400,240 Q580,238 742,240"/>
    <path d="M0,320 Q200,322 400,320 Q580,318 742,320"/>
  </g>

  <!-- Iridescent residue bloom -->
  <ellipse cx="540" cy="240" rx="180" ry="90" fill="url(#i6p7p3iridescence)" filter="url(#i6p7p3glow)"/>

  <!-- ===== DEAD SPARROW center-right with HOLOGRAPHIC CROSS-SECTION over it ===== -->
  <g transform="translate(540 240)">
    <!-- Bird body -->
    <ellipse cx="0" cy="0" rx="36" ry="18" fill="#3a2818" stroke="#1a0c04" stroke-width="0.85"/>
    <ellipse cx="-4" cy="4" rx="14" ry="4" fill="#5a4030" opacity="0.85"/>
    <!-- Wings -->
    <path d="M-26,-4 L-58,-22 L-50,-2 Z" fill="#3a2818" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M26,-4 L58,-22 L50,-2 Z" fill="#3a2818" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Head -->
    <ellipse cx="-36" cy="0" rx="9" ry="7" fill="#3a2818"/>
    <path d="M-44,2 L-50,4 L-44,6 Z" fill="#3a1808"/>
    <ellipse cx="-36" cy="-1" rx="3" ry="2" fill="#5a4838" opacity="0.85"/>
    <line x1="-39" y1="-1" x2="-33" y2="-1" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Legs/claws -->
    <line x1="-8" y1="-6" x2="-10" y2="-18" stroke="#a87038" stroke-width="0.85"/>
    <line x1="8" y1="-6" x2="10" y2="-18" stroke="#a87038" stroke-width="0.85"/>
    <!-- Iridescent halo at edges -->
    <ellipse cx="0" cy="0" rx="44" ry="22" fill="none" stroke="#5a3a78" stroke-width="0.55" opacity="0.55" filter="url(#i6p7p3bloom)"/>
  </g>

  <!-- HOLOGRAPHIC CROSS-SECTION OVERLAY above bird — cellular structure -->
  <g transform="translate(540 130)" filter="url(#i6p7p3bloom)" opacity="0.95">
    <!-- Frame -->
    <rect x="-100" y="-50" width="200" height="100" fill="#1a0c20" opacity="0.55"/>
    <rect x="-100" y="-50" width="200" height="100" fill="none" stroke="#a888ff" stroke-width="2.4"/>
    <!-- Header -->
    <rect x="-100" y="-50" width="200" height="11" fill="#5a3ad8" opacity="0.85"/>
    <text x="-94" y="-42" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">CROSS-SECTION — CELLULAR ANALYSIS</text>

    <!-- Cells: hexagonal pattern, mostly DESTABILIZED (broken walls in red) -->
    <g stroke="#fff8ff" stroke-width="0.55" fill="none">
      <!-- Hex grid, cells ruptured -->
      <polygon points="-80,-22 -68,-28 -56,-22 -56,-10 -68,-4 -80,-10"/>
      <polygon points="-56,-22 -44,-28 -32,-22 -32,-10 -44,-4 -56,-10"/>
      <polygon points="-32,-22 -20,-28 -8,-22 -8,-10 -20,-4 -32,-10"/>
      <polygon points="-8,-22 4,-28 16,-22 16,-10 4,-4 -8,-10"/>
      <polygon points="16,-22 28,-28 40,-22 40,-10 28,-4 16,-10"/>
      <polygon points="40,-22 52,-28 64,-22 64,-10 52,-4 40,-10"/>
      <!-- Lower row offset -->
      <polygon points="-92,-2 -80,-8 -68,-2 -68,10 -80,16 -92,10"/>
      <polygon points="-68,-2 -56,-8 -44,-2 -44,10 -56,16 -68,10"/>
      <polygon points="-44,-2 -32,-8 -20,-2 -20,10 -32,16 -44,10"/>
      <polygon points="-20,-2 -8,-8 4,-2 4,10 -8,16 -20,10"/>
      <polygon points="4,-2 16,-8 28,-2 28,10 16,16 4,10"/>
      <polygon points="28,-2 40,-8 52,-2 52,10 40,16 28,10"/>
      <polygon points="52,-2 64,-8 76,-2 76,10 64,16 52,10"/>
    </g>
    <!-- Disrupted cell walls — red breaks -->
    <g stroke="#ff5868" stroke-width="0.85" fill="none" opacity="0.95">
      <line x1="-68" y1="-28" x2="-68" y2="-4"/>
      <line x1="-44" y1="-28" x2="-44" y2="-4"/>
      <line x1="-20" y1="-28" x2="-20" y2="-4"/>
      <line x1="-56" y1="-2" x2="-56" y2="-22"/>
      <line x1="-8" y1="-2" x2="-8" y2="-22"/>
      <line x1="28" y1="-2" x2="28" y2="-22"/>
      <line x1="-80" y1="16" x2="-80" y2="-8"/>
      <line x1="-32" y1="16" x2="-32" y2="-8"/>
      <line x1="16" y1="16" x2="16" y2="-8"/>
      <line x1="64" y1="16" x2="64" y2="-8"/>
    </g>
    <!-- Faint red bloom for rupture -->
    <g fill="#ff5868" opacity="0.45">
      <circle cx="-68" cy="-16" r="2"/>
      <circle cx="-44" cy="-16" r="2"/>
      <circle cx="-20" cy="-16" r="2"/>
      <circle cx="4" cy="-16" r="2"/>
      <circle cx="28" cy="-16" r="2"/>
      <circle cx="-56" cy="6" r="2"/>
      <circle cx="-32" cy="6" r="2"/>
      <circle cx="-8" cy="6" r="2"/>
      <circle cx="16" cy="6" r="2"/>
      <circle cx="40" cy="6" r="2"/>
    </g>
    <!-- Annotation -->
    <text x="-94" y="32" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">RUPTURE: ALL CELLS</text>
    <text x="-94" y="40" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">FIELD: SUB-MOLECULAR</text>
    <text x="-94" y="48" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#ff5868" font-weight="700">SOURCE: UNKNOWN ⚠</text>

    <!-- Connector lines from overlay down to bird -->
    <line x1="-50" y1="50" x2="-30" y2="100" stroke="#a888ff" stroke-width="0.55" opacity="0.7" stroke-dasharray="3 2"/>
    <line x1="0" y1="50" x2="0" y2="100" stroke="#a888ff" stroke-width="0.55" opacity="0.7" stroke-dasharray="3 2"/>
    <line x1="50" y1="50" x2="30" y2="100" stroke="#a888ff" stroke-width="0.55" opacity="0.7" stroke-dasharray="3 2"/>
  </g>

  <!-- ===== POCKET EDGE bottom-left with LUMA leaning out ===== -->
  <!-- Worn leather waistcoat surface dominating left -->
  <rect x="0" y="220" width="320" height="144" fill="url(#i6p7p3leather)"/>
  <line x1="0" y1="220" x2="320" y2="220" stroke="#7a4818" stroke-width="0.55" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.5" fill="none">
    <path d="M0,260 Q120,262 240,260 Q300,258 320,260"/>
    <path d="M0,300 Q120,302 240,300 Q300,298 320,300"/>
  </g>
  <!-- Pocket opening top-left -->
  <rect x="40" y="180" width="180" height="100" fill="#1a0c04"/>
  <line x1="40" y1="180" x2="220" y2="180" stroke="#7a4818" stroke-width="1.4" opacity="0.85"/>
  <ellipse cx="130" cy="220" rx="60" ry="20" fill="#5a3ad8" opacity="0.45" filter="url(#i6p7p3glow)"/>

  <!-- ===== LUMA leaning OUT of pocket, scanner extended forward ===== -->
  <g transform="translate(150 200)">
    <!-- Body climbing partially out -->
    <path d="M-22,40 L-22,12 L18,12 L22,40 Z" fill="url(#i6p7p3lumaSuit)"/>
    <line x1="-14" y1="22" x2="14" y2="22" stroke="#a888ff" stroke-width="0.7" opacity="0.85" filter="url(#i6p7p3bloom)"/>
    <!-- Suit shoulders/torso emerged -->
    <path d="M-16,12 L-14,-10 L14,-10 L16,12 Z" fill="url(#i6p7p3lumaSuit)"/>
    <ellipse cx="-13" cy="-8" rx="3" ry="1.4" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="13" cy="-8" rx="3" ry="1.4" fill="#5a4838" opacity="0.55"/>

    <!-- LEFT arm extended forward holding scanner -->
    <path d="M-14,-10 L0,-12 L20,-2 L14,2 L-2,-2 L-14,0 Z" fill="url(#i6p7p3lumaSuit)"/>
    <ellipse cx="22" cy="-2" rx="3.5" ry="2.4" fill="#7a4838"/>
    <ellipse cx="14" cy="-6" rx="2" ry="1" fill="#0a0604" opacity="0.55"/>

    <!-- SCANNER held forward -->
    <rect x="22" y="-6" width="14" height="9" rx="0.85" fill="#3a2068" stroke="#a888ff" stroke-width="0.7"/>
    <rect x="24" y="-4" width="10" height="5" fill="#5a3ad8" filter="url(#i6p7p3bloom)"/>
    <ellipse cx="29" cy="-2" rx="14" ry="6" fill="url(#i6p7p3scannerBeam)" filter="url(#i6p7p3glow)"/>
    <!-- Scanner beam shooting toward bird -->
    <path d="M40,-2 Q200,8 380,40 L380,44 Q200,12 40,2 Z" fill="#a888ff" opacity="0.4" filter="url(#i6p7p3glow)"/>

    <!-- HEAD looking up + slightly right toward bird -->
    <ellipse cx="0" cy="-30" rx="14" ry="18" fill="#7a4838"/>
    <!-- Underlight (data flooding face) -->
    <ellipse cx="0" cy="-22" rx="11" ry="6" fill="#a888ff" opacity="0.45" filter="url(#i6p7p3bloom)"/>
    <!-- Hair -->
    <path d="M-13,-38 Q-10,-46 0,-48 Q10,-46 13,-38 L13,-30 Q6,-36 0,-36 Q-6,-36 -13,-30 Z" fill="#0a0604"/>
    <!-- Sapphire filament -->
    <line x1="-6" y1="-44" x2="-4" y2="-46" stroke="#5a3ad8" stroke-width="1" opacity="0.85" filter="url(#i6p7p3bloom)"/>
    <line x1="4" y1="-46" x2="6" y2="-44" stroke="#5a3ad8" stroke-width="1" opacity="0.85" filter="url(#i6p7p3bloom)"/>
    <!-- Braid trailing -->
    <path d="M13,-32 Q18,-12 16,8" stroke="#0a0604" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M13,-32 Q18,-12 16,8" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p7p3bloom)"/>

    <!-- LENSES — large, scrolling FAST data (curiosity → alarm beat) -->
    <ellipse cx="-5" cy="-30" rx="5" ry="3.5" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="5" cy="-30" rx="5" ry="3.5" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="-5" cy="-30" rx="5" ry="3.5" fill="none" stroke="#a888ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p7p3bloom)"/>
    <ellipse cx="5" cy="-30" rx="5" ry="3.5" fill="none" stroke="#a888ff" stroke-width="0.85" opacity="0.95" filter="url(#i6p7p3bloom)"/>
    <line x1="0" y1="-30" x2="0" y2="-30" stroke="#a888ff" stroke-width="0.55" opacity="0.95"/>
    <!-- Crack -->
    <line x1="-9" y1="-32" x2="-2" y2="-29" stroke="#fff8ff" stroke-width="0.55" opacity="0.95" filter="url(#i6p7p3bloom)"/>
    <!-- Scrolling data fast -->
    <g stroke="#fff8ff" stroke-width="0.4" fill="none" opacity="0.95" filter="url(#i6p7p3bloom)">
      <line x1="-9" y1="-32" x2="-1" y2="-32"/>
      <line x1="-9" y1="-30" x2="-1" y2="-30"/>
      <line x1="-9" y1="-28" x2="-1" y2="-28"/>
      <line x1="1" y1="-32" x2="9" y2="-32"/>
      <line x1="1" y1="-30" x2="9" y2="-30"/>
      <line x1="1" y1="-28" x2="9" y2="-28"/>
    </g>
    <!-- Eyes WIDE (alarm) -->
    <ellipse cx="-5" cy="-30" rx="3" ry="2.4" fill="#fff8e8"/>
    <circle cx="-5" cy="-30" r="1.4" fill="#0a0604"/>
    <circle cx="-5.4" cy="-30.4" r="0.55" fill="#fff8ff"/>
    <ellipse cx="5" cy="-30" rx="3" ry="2.4" fill="#fff8e8"/>
    <circle cx="5" cy="-30" r="1.4" fill="#0a0604"/>
    <circle cx="4.6" cy="-30.4" r="0.55" fill="#fff8ff"/>
    <!-- Brows raised — surprise, alarm -->
    <path d="M-11,-42 L-1,-40" stroke="#0a0604" stroke-width="0.85"/>
    <path d="M1,-40 L11,-42" stroke="#0a0604" stroke-width="0.85"/>
    <!-- Mouth slightly OPEN — alarm -->
    <ellipse cx="0" cy="-19" rx="1.6" ry="1" fill="#3a1808"/>
  </g>

  <!-- LUMA dialogue 1 (multi-line top) -->
  <g>
    <rect x="14" y="14" width="500" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="200,54 212,54 204,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="200.5" y1="54" x2="211.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Cellular disruption. Every cell wall in its body has been destabilized simultaneously.</text>

  <!-- LUMA dialogue 2 -->
  <g>
    <rect x="180" y="64" width="552" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="368,104 380,104 372,114" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="368.5" y1="104" x2="379.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="188" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="188" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">This bird flew through something. A field. An energy field that operates at the molecular level.</text>

  <!-- LUMA dialogue 3 (quieter, italic) -->
  <g>
    <rect x="14" y="114" width="332" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="148,154 160,154 152,164" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="148.5" y1="154" x2="159.5" y2="154" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA (quieter)</text>
  <text x="22" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">We don't have this technology. And neither do they.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,170 Q200,172 400,168 Q580,166 742,170"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
