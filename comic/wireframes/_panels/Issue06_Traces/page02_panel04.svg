<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240.7 364" width="240.7" height="364">
  <title>Issue 6 — Page 2 — Panel 4: Sable's hands — micro-gesture, fingers pressing the hidden file</title>
  <desc>85mm CU slight high angle on hands. One hand grips opposite forearm, fingers pressed tight against silver-suit sleeve where the dead data module is hidden. The tell, then forced open. No dialogue.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p2p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="i6p2p4sableSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="i6p2p4sableSuitRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="i6p2p4mapMix" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ff5868" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#a888ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p2p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p2p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="240.7" height="364" fill="url(#i6p2p4bg)"/>

  <!-- Mixed map light from below -->
  <ellipse cx="120" cy="364" rx="200" ry="240" fill="url(#i6p2p4mapMix)" filter="url(#i6p2p4glow)"/>

  <!-- Faint visible buzz cut hair edge top of frame -->
  <g transform="translate(120 0)">
    <path d="M-50,-2 Q-30,18 0,22 Q30,18 50,-2 Z" fill="#3a2418"/>
    <path d="M-40,4 Q-20,18 0,20 Q20,18 40,4 Z" fill="#e0d8d0"/>
    <g fill="#a8a098" opacity="0.85">
      <circle cx="-20" cy="14" r="0.55"/>
      <circle cx="-12" cy="16" r="0.55"/>
      <circle cx="-4" cy="18" r="0.55"/>
      <circle cx="4" cy="18" r="0.55"/>
      <circle cx="12" cy="16" r="0.55"/>
      <circle cx="20" cy="14" r="0.55"/>
    </g>
  </g>

  <!-- SHOULDER edge top with SOOT BLOOM visible -->
  <g transform="translate(120 30)">
    <!-- Right shoulder visible at top of frame -->
    <path d="M-110,0 L-110,42 L110,42 L110,0 Z" fill="url(#i6p2p4sableSuit)"/>
    <!-- Soot bloom right shoulder -->
    <ellipse cx="80" cy="14" rx="40" ry="14" fill="#3a3038" opacity="0.85"/>
    <ellipse cx="84" cy="16" rx="24" ry="9" fill="#1a1610" opacity="0.7"/>
    <!-- Forearm dust on left shoulder edge -->
    <ellipse cx="-80" cy="20" rx="22" ry="6" fill="#5a4838" opacity="0.55"/>
    <!-- Tension crease at collar (from private file sessions) -->
    <line x1="-30" y1="6" x2="30" y2="6" stroke="#3a3038" stroke-width="2.4" opacity="0.85"/>
    <line x1="-22" y1="10" x2="22" y2="10" stroke="#3a3038" stroke-width="1.2" opacity="0.65"/>
  </g>

  <!-- ===== HANDS — central composition, one gripping the other forearm ===== -->
  <!-- LEFT FOREARM extending down from upper-right -->
  <g transform="translate(120 200)">
    <!-- Forearm slab — silver suit sleeve, where the data module hides -->
    <path d="M-30,-100 L80,-90 L72,80 L-50,70 Z" fill="url(#i6p2p4sableSuit)"/>
    <!-- Holo seam down forearm -->
    <line x1="-10" y1="-80" x2="50" y2="60" stroke="#a8c0ff" stroke-width="0.85" opacity="0.85" filter="url(#i6p2p4bloom)"/>
    <!-- Forearm dust -->
    <ellipse cx="20" cy="-50" rx="15" ry="5" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="40" cy="20" rx="12" ry="4" fill="#5a4838" opacity="0.55"/>
    <!-- Water mark stain -->
    <path d="M0,0 Q14,8 28,0 Q14,-8 0,0 Z" fill="#2a3038" opacity="0.45"/>
    <!-- Subtle bulge where the dead data module is hidden beneath -->
    <ellipse cx="20" cy="-12" rx="14" ry="9" fill="#5a5860" opacity="0.55"/>
    <ellipse cx="20" cy="-12" rx="11" ry="7" fill="#3a3a44" opacity="0.4"/>
    <!-- Faint outline of module shape under fabric -->
    <rect x="14" y="-18" width="14" height="12" rx="0.55" fill="none" stroke="#3a3a44" stroke-width="0.55" opacity="0.6"/>
    <!-- Map light reflections on silver -->
    <path d="M-30,-100 L40,-90" stroke="#a888ff" stroke-width="0.7" opacity="0.7" filter="url(#i6p2p4bloom)"/>
    <path d="M-50,70 L40,75" stroke="#ff5868" stroke-width="0.55" opacity="0.6" filter="url(#i6p2p4bloom)"/>

    <!-- ===== RIGHT HAND gripping the forearm — fingers pressed against the module ===== -->
    <!-- Palm/back of hand laid across the forearm -->
    <path d="M-44,-30 L60,-12 L56,40 L-50,28 Z" fill="#3a2418"/>
    <!-- Knuckle edge highlights -->
    <ellipse cx="-30" cy="-20" rx="8" ry="3" fill="#5a3028" opacity="0.7"/>
    <ellipse cx="-10" cy="-16" rx="8" ry="3" fill="#5a3028" opacity="0.7"/>
    <ellipse cx="10" cy="-12" rx="8" ry="3" fill="#5a3028" opacity="0.7"/>
    <ellipse cx="30" cy="-8" rx="8" ry="3" fill="#5a3028" opacity="0.7"/>

    <!-- FINGERS — pressed tight against suit sleeve where module is. Slight knuckle whitening. -->
    <!-- Thumb -->
    <path d="M60,-12 L80,-22 L84,-2 L74,16 L60,12 Z" fill="#3a2418"/>
    <ellipse cx="76" cy="-10" rx="3" ry="2" fill="#5a3028" opacity="0.65"/>
    <!-- Index -->
    <path d="M-50,8 L-86,4 L-92,28 L-72,40 L-50,28 Z" fill="#3a2418"/>
    <ellipse cx="-78" cy="14" rx="4" ry="2.4" fill="#5a3028" opacity="0.7"/>
    <!-- Middle -->
    <path d="M-46,28 L-86,38 L-90,60 L-68,68 L-50,52 Z" fill="#3a2418"/>
    <ellipse cx="-78" cy="48" rx="4" ry="2.4" fill="#5a3028" opacity="0.7"/>
    <!-- Ring -->
    <path d="M-42,52 L-84,68 L-86,90 L-64,94 L-46,76 Z" fill="#3a2418"/>
    <!-- Little finger -->
    <path d="M-38,76 L-78,98 L-78,118 L-58,114 L-42,96 Z" fill="#3a2418"/>

    <!-- WHITE-KNUCKLE highlights on fingers - the press is tight -->
    <ellipse cx="-78" cy="14" rx="2.4" ry="1.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="-78" cy="48" rx="2.4" ry="1.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="-76" cy="80" rx="2.4" ry="1.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="-72" cy="106" rx="2.4" ry="1.4" fill="#a87838" opacity="0.85"/>
    <ellipse cx="76" cy="-10" rx="2" ry="1.2" fill="#a87838" opacity="0.85"/>
    <!-- Highlight tips -->
    <circle cx="-78" cy="14" r="1" fill="#fff8e8" opacity="0.7"/>
    <circle cx="-78" cy="48" r="1" fill="#fff8e8" opacity="0.7"/>
    <circle cx="-76" cy="80" r="1" fill="#fff8e8" opacity="0.7"/>

    <!-- Knuckle creases -->
    <line x1="-86" y1="14" x2="-72" y2="14" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>
    <line x1="-86" y1="48" x2="-72" y2="48" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>
    <line x1="-84" y1="80" x2="-70" y2="80" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>

    <!-- Forced-open hint — slight gap appearing between index and middle (the second beat) -->
    <line x1="-86" y1="36" x2="-50" y2="32" stroke="#1a0c04" stroke-width="0.7" opacity="0.85"/>

    <!-- WRIST sleeve of right arm trailing off-frame top -->
    <path d="M60,-12 L80,-30 L100,-100 L60,-100 Z" fill="url(#i6p2p4sableSuit)"/>
    <line x1="76" y1="-20" x2="84" y2="-90" stroke="#a8c0ff" stroke-width="0.7" opacity="0.85" filter="url(#i6p2p4bloom)"/>
    <ellipse cx="80" cy="-60" rx="6" ry="2.4" fill="#5a4838" opacity="0.55"/>

    <!-- Map light reflections on hand surface -->
    <path d="M-30,-20 Q0,-16 30,-12" stroke="#a888ff" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#i6p2p4bloom)"/>
    <path d="M-30,40 Q0,44 30,48" stroke="#ff5868" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#i6p2p4bloom)"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 240,90"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 240,300"/>
  </g>
</svg>
