<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 6 — Page 4 — Panel 4: Theodore turns at Mrs. Finch's laundry — neighborhood narrows</title>
  <desc>28mm wide elevated angle. Corner laundry with steamed windows + hand-painted sign. Theodore mid-turn. Beyond the corner, street narrows, factory chimney rises in fog. Less casual posture.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p4p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#605850"/>
      <stop offset="100%" stop-color="#2a2420"/>
    </linearGradient>
    <linearGradient id="i6p4p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#807870"/>
      <stop offset="100%" stop-color="#605850"/>
    </linearGradient>
    <linearGradient id="i6p4p4laundry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i6p4p4laundryWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i6p4p4narrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p4p4chimney" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#3a2820"/>
    </linearGradient>
    <radialGradient id="i6p4p4steam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a09890" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p4p4fog" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#807870" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a3430" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p4p4theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p4p4theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="i6p4p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p4p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#i6p4p4bg)"/>

  <!-- Sky band -->
  <rect width="494" height="80" fill="url(#i6p4p4sky)"/>
  <ellipse cx="247" cy="100" rx="320" ry="80" fill="url(#i6p4p4fog)" filter="url(#i6p4p4glow)" opacity="0.7"/>

  <!-- LEFT: Mrs. Finch's laundry (corner shop, warm steamed windows) -->
  <rect x="0" y="80" width="200" height="220" fill="url(#i6p4p4laundry)"/>
  <rect x="0" y="80" width="200" height="40" fill="url(#i6p4p4fog)" opacity="0.45"/>
  <!-- Brick texture -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
    <line x1="0" y1="200" x2="200" y2="200"/>
    <line x1="0" y1="220" x2="200" y2="220"/>
    <line x1="0" y1="240" x2="200" y2="240"/>
  </g>
  <!-- HAND-PAINTED SIGN above shop -->
  <rect x="20" y="130" width="160" height="34" fill="#3a2818" stroke="#1a0c04" stroke-width="1"/>
  <rect x="22" y="132" width="156" height="30" fill="#5a4030"/>
  <text x="100" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#e8c878" font-style="italic" font-weight="700">FINCH</text>
  <text x="100" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c8a868">LAUNDRY · WASHED &amp; PRESSED</text>
  <!-- Sign bracket -->
  <line x1="20" y1="130" x2="14" y2="120" stroke="#1a0c04" stroke-width="1"/>
  <line x1="180" y1="130" x2="186" y2="120" stroke="#1a0c04" stroke-width="1"/>

  <!-- STEAMED WINDOWS - warm amber glow inside -->
  <rect x="20" y="180" width="62" height="80" fill="url(#i6p4p4laundryWindow)"/>
  <rect x="20" y="180" width="62" height="80" fill="url(#i6p4p4steam)" filter="url(#i6p4p4glow)" opacity="0.8"/>
  <g stroke="#3a2818" stroke-width="1" fill="none">
    <line x1="51" y1="180" x2="51" y2="260"/>
    <line x1="20" y1="220" x2="82" y2="220"/>
  </g>
  <!-- Steam wisps on glass -->
  <path d="M30,200 Q40,210 30,220" stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.85"/>
  <path d="M50,210 Q60,220 50,230" stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.7"/>
  <path d="M65,200 Q75,210 65,220" stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.85"/>

  <rect x="100" y="180" width="62" height="80" fill="url(#i6p4p4laundryWindow)"/>
  <rect x="100" y="180" width="62" height="80" fill="url(#i6p4p4steam)" filter="url(#i6p4p4glow)" opacity="0.8"/>
  <g stroke="#3a2818" stroke-width="1" fill="none">
    <line x1="131" y1="180" x2="131" y2="260"/>
    <line x1="100" y1="220" x2="162" y2="220"/>
  </g>
  <path d="M110,200 Q120,210 110,220" stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.85"/>
  <path d="M130,210 Q140,220 130,230" stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.7"/>
  <!-- Door -->
  <rect x="170" y="200" width="22" height="60" fill="#1a0c04" stroke="#3a2818" stroke-width="0.55"/>

  <!-- CORNER POST + SIGN where street splits -->
  <rect x="200" y="80" width="14" height="220" fill="#1a1008"/>

  <!-- NARROWING SIDE STREET (left, beyond corner) — darker, taller buildings -->
  <polygon points="214,80 280,80 280,300 214,300" fill="url(#i6p4p4narrow)"/>
  <!-- FACTORY CHIMNEY rising in fog beyond -->
  <rect x="240" y="20" width="22" height="80" fill="url(#i6p4p4chimney)"/>
  <ellipse cx="251" cy="20" rx="14" ry="6" fill="#3a3028"/>
  <ellipse cx="251" cy="14" rx="11" ry="4" fill="#1a1008"/>
  <!-- Smoke trailing up -->
  <ellipse cx="251" cy="0" rx="22" ry="20" fill="url(#i6p4p4fog)" filter="url(#i6p4p4glow)" opacity="0.7"/>
  <!-- Distant building behind chimney -->
  <rect x="220" y="80" width="60" height="100" fill="#1a1008" opacity="0.85"/>
  <rect x="220" y="80" width="60" height="40" fill="url(#i6p4p4fog)" opacity="0.55"/>
  <g fill="#0a0408">
    <rect x="225" y="120" width="10" height="14"/>
    <rect x="245" y="120" width="10" height="14"/>
    <rect x="265" y="120" width="10" height="14"/>
    <rect x="225" y="148" width="10" height="14"/>
    <rect x="245" y="148" width="10" height="14"/>
    <rect x="265" y="148" width="10" height="14"/>
  </g>

  <!-- RIGHT side: continuing main street with regular buildings (less interesting) -->
  <rect x="280" y="80" width="214" height="220" fill="#3a2820"/>
  <rect x="280" y="80" width="214" height="40" fill="url(#i6p4p4fog)" opacity="0.5"/>
  <g stroke="#1a1008" stroke-width="0.4" opacity="0.45">
    <line x1="280" y1="120" x2="494" y2="120"/>
    <line x1="280" y1="160" x2="494" y2="160"/>
    <line x1="280" y1="200" x2="494" y2="200"/>
    <line x1="280" y1="240" x2="494" y2="240"/>
  </g>
  <g fill="#1a1008" stroke="#2a1810" stroke-width="0.55">
    <rect x="300" y="160" width="22" height="34"/>
    <rect x="340" y="160" width="22" height="34"/>
    <rect x="380" y="160" width="22" height="34"/>
    <rect x="420" y="160" width="22" height="34"/>
    <rect x="460" y="160" width="22" height="34"/>
    <rect x="300" y="216" width="22" height="34"/>
    <rect x="340" y="216" width="22" height="34"/>
    <rect x="380" y="216" width="22" height="34"/>
    <rect x="420" y="216" width="22" height="34"/>
    <rect x="460" y="216" width="22" height="34"/>
  </g>

  <!-- COBBLES — main pavement -->
  <rect x="0" y="300" width="494" height="64" fill="#3a3028"/>
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.6" fill="none">
    <path d="M0,310 Q120,308 240,310 Q360,312 494,310"/>
    <path d="M0,322 Q120,320 240,322 Q360,324 494,322"/>
    <path d="M0,338 Q120,336 240,338 Q360,340 494,338"/>
    <path d="M0,354 Q120,352 240,354 Q360,356 494,354"/>
  </g>
  <g fill="#5a5048" opacity="0.7">
    <ellipse cx="60" cy="320" rx="6" ry="2"/>
    <ellipse cx="120" cy="324" rx="6" ry="2"/>
    <ellipse cx="180" cy="320" rx="5" ry="1.6"/>
    <ellipse cx="280" cy="328" rx="6" ry="2"/>
    <ellipse cx="340" cy="324" rx="5" ry="1.6"/>
    <ellipse cx="420" cy="328" rx="6" ry="2"/>
  </g>

  <!-- Gas lamp at corner (unlit) -->
  <g transform="translate(207 240)">
    <rect x="-2" y="0" width="4" height="60" fill="#1a1410"/>
    <path d="M-7,-12 L7,-12 L4,0 L-4,0 Z" fill="#3a3028" stroke="#1a1008" stroke-width="0.55"/>
    <rect x="-5" y="-30" width="10" height="18" fill="#3a3028" stroke="#1a1008" stroke-width="0.55"/>
    <rect x="-3" y="-28" width="6" height="14" fill="#1a1410"/>
  </g>

  <!-- ===== THEODORE — mid-turn at corner, three-quarter back angle ===== -->
  <g transform="translate(220 304)">
    <!-- Boots -->
    <ellipse cx="-9" cy="22" rx="10" ry="3" fill="#1a0c04"/>
    <ellipse cx="11" cy="20" rx="10" ry="3" fill="#1a0c04"/>
    <!-- Trousers — slightly turning, right leg forward -->
    <path d="M-12,-58 L-2,-58 L-3,22 L-13,22 Z" fill="url(#i6p4p4theoTrousers)"/>
    <path d="M2,-58 L13,-58 L16,22 L4,22 Z" fill="url(#i6p4p4theoTrousers)"/>
    <!-- Knee patches -->
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="4" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <!-- Belt -->
    <rect x="-12" y="-58" width="26" height="3.5" fill="#3a1808"/>
    <!-- Linen shirt + waistcoat (turned slightly so left side away from camera, pocket on right side facing toward us) -->
    <path d="M-13,-118 L-12,-58 L13,-58 L14,-118 Z" fill="#d4c4a8"/>
    <path d="M-15,-116 L-13,-58 L-2,-58 L-2,-116 Z" fill="url(#i6p4p4theoWaistcoat)"/>
    <path d="M14,-116 L15,-58 L2,-58 L2,-116 Z" fill="url(#i6p4p4theoWaistcoat)"/>
    <!-- Pocket on viewer-right side -->
    <rect x="3" y="-108" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M3,-108 L14,-108 L14,-104 L3,-104 Z" fill="#5a3018" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="5" y="-104" width="7" height="9" fill="#5a3ad8" opacity="0.4" filter="url(#i6p4p4bloom)"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-100" r="0.95" fill="#3a1808"/>
    <circle cx="-2" cy="-82" r="0.95" fill="#3a1808"/>
    <circle cx="-2" cy="-64" r="0.95" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-118 L0,-116 L7,-118 L7,-114 L0,-110 L-7,-114 Z" fill="#e0d4b8"/>
    <!-- Arms - left arm tucked, right arm slightly forward to balance turn -->
    <path d="M-15,-116 L-22,-92 L-22,-66 L-12,-58 Z" fill="url(#i6p4p4theoWaistcoat)"/>
    <path d="M15,-116 L24,-90 L26,-58 L14,-58 L18,-86 Z" fill="url(#i6p4p4theoWaistcoat)"/>
    <ellipse cx="-22" cy="-66" rx="2.4" ry="1.4" fill="#a87838"/>
    <ellipse cx="26" cy="-56" rx="2.4" ry="1.6" fill="#a87838"/>
    <!-- Brass ring on left index finger -->
    <circle cx="-22" cy="-67" r="0.7" fill="#c89058" filter="url(#i6p4p4bloom)" opacity="0.85"/>
    <!-- Head + neck -->
    <rect x="-3" y="-126" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-138" rx="12" ry="14" fill="#a87838"/>
    <!-- Hair -->
    <path d="M-12,-146 Q-9,-156 0,-158 Q9,-156 12,-146 L12,-138 Q8,-144 0,-144 Q-8,-144 -12,-138 Z" fill="#9a7038"/>
    <path d="M-7,-154 L-5,-158 L-8,-158 Z" fill="#9a7038"/>
    <path d="M5,-154 L7,-158 L4,-158 Z" fill="#9a7038"/>
    <!-- Looking forward into narrow side street (left of frame from camera) -->
    <ellipse cx="-4" cy="-138" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-5" cy="-138" r="0.7" fill="#5a3818"/>
    <ellipse cx="3" cy="-138" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="2" cy="-138" r="0.7" fill="#5a3818"/>
    <!-- Brow drawn slightly (more watchful) -->
    <path d="M-7,-144 L-2,-144" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M2,-144 L7,-144" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth tighter -->
    <path d="M-3,-128 L3,-128" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Subtle blue-violet hint under chin -->
    <path d="M-2,-126 L2,-126" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p4p4bloom)"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q150,92 300,88 Q400,86 494,90"/>
    <path d="M0,300 Q150,302 300,298 Q400,296 494,300"/>
  </g>
</svg>
