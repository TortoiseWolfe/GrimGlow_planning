<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 310.6" width="742" height="310.6">
  <title>Issue 6 — Page 14 — Panel 1: Looking up the wall — billboard-sized fairy glyph dwarfs Luma at floor</title>
  <desc>24mm low angle from Luma's POV looking up wall. Glyph at human-height = enormous from her four-inch perspective. Simplified geometric symbols carved into stone, glowing blue-white. Luma tiny silhouette at base of wall, scanner raised, neck craned.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p14p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p14p1stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p14p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p14p1lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p14p1scannerCone" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5a3ad8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p14p1glyphAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a8ae8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a4a78" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p14p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p14p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="310.6" fill="url(#i6p14p1bg)"/>

  <!-- Stone wall filling almost entire frame (low angle) -->
  <rect width="742" height="280" fill="url(#i6p14p1stone)"/>
  <!-- Stone block grid (massive at this fairy scale + low angle) -->
  <g stroke="#0a0408" stroke-width="0.85" opacity="0.85">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="220" x2="742" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="40"/>
    <line x1="280" y1="0" x2="280" y2="40"/>
    <line x1="440" y1="0" x2="440" y2="40"/>
    <line x1="620" y1="0" x2="620" y2="40"/>
    <line x1="60" y1="40" x2="60" y2="100"/>
    <line x1="200" y1="40" x2="200" y2="100"/>
    <line x1="340" y1="40" x2="340" y2="100"/>
    <line x1="500" y1="40" x2="500" y2="100"/>
    <line x1="660" y1="40" x2="660" y2="100"/>
    <line x1="120" y1="100" x2="120" y2="160"/>
    <line x1="280" y1="100" x2="280" y2="160"/>
    <line x1="440" y1="100" x2="440" y2="160"/>
    <line x1="620" y1="100" x2="620" y2="160"/>
    <line x1="60" y1="160" x2="60" y2="220"/>
    <line x1="200" y1="160" x2="200" y2="220"/>
    <line x1="340" y1="160" x2="340" y2="220"/>
    <line x1="500" y1="160" x2="500" y2="220"/>
    <line x1="660" y1="160" x2="660" y2="220"/>
  </g>
  <!-- Damp/centuries dust streaks -->
  <ellipse cx="100" cy="40" rx="50" ry="30" fill="#0a0408" opacity="0.55"/>
  <ellipse cx="640" cy="180" rx="60" ry="40" fill="#0a0408" opacity="0.55"/>

  <!-- Scanner cone from below illuminating glyph -->
  <path d="M120,280 L300,30 L500,30 L370,280 Z" fill="url(#i6p14p1scannerCone)" filter="url(#i6p14p1glow)" opacity="0.75"/>

  <!-- ===== FAIRY GLYPH — BILLBOARD SIZED, dominates frame ===== -->
  <g transform="translate(371 130)">
    <!-- Bloom aura -->
    <ellipse cx="0" cy="0" rx="240" ry="120" fill="url(#i6p14p1glyphAura)" filter="url(#i6p14p1glow)" opacity="0.85"/>

    <!-- The glyph — simplified hex-cross with three stacked elements (bigger than P11/P12 versions) -->
    <g stroke="#a8c0ff" stroke-width="3" fill="none" opacity="0.95" filter="url(#i6p14p1bloom)">
      <!-- Main hex outline (LARGE) -->
      <polygon points="-90,-50 0,-90 90,-50 90,50 0,90 -90,50"/>
      <!-- Cross bisecting hex -->
      <line x1="0" y1="-90" x2="0" y2="90"/>
      <line x1="-90" y1="0" x2="90" y2="0"/>
      <!-- X cross inside -->
      <line x1="-50" y1="-30" x2="50" y2="30"/>
      <line x1="50" y1="-30" x2="-50" y2="30"/>
      <!-- Corner dots -->
      <circle cx="0" cy="-90" r="4" fill="#fff8ff"/>
      <circle cx="90" cy="0" r="4" fill="#fff8ff"/>
      <circle cx="0" cy="90" r="4" fill="#fff8ff"/>
      <circle cx="-90" cy="0" r="4" fill="#fff8ff"/>
    </g>

    <!-- Carving depth shadow (giving it three-dimensional feel of carving) -->
    <g stroke="#1a0c04" stroke-width="2" fill="none" opacity="0.85">
      <polygon points="-89,-49 1,-89 91,-49 91,51 1,91 -89,51"/>
      <line x1="1" y1="-89" x2="1" y2="91"/>
      <line x1="-89" y1="1" x2="91" y2="1"/>
    </g>

    <!-- Side glyph elements (suggesting larger inscription extends out of frame) -->
    <g stroke="#a8c0ff" stroke-width="2" fill="none" opacity="0.85" filter="url(#i6p14p1bloom)">
      <!-- Left adjacent simplified glyph -->
      <polygon points="-180,-30 -150,-50 -120,-30 -120,30 -150,50 -180,30"/>
      <line x1="-150" y1="-50" x2="-150" y2="50"/>
      <!-- Right adjacent simplified glyph -->
      <polygon points="120,-30 150,-50 180,-30 180,30 150,50 120,30"/>
      <line x1="150" y1="-50" x2="150" y2="50"/>
    </g>
    <g stroke="#1a0c04" stroke-width="1.4" fill="none" opacity="0.85">
      <polygon points="-179,-29 -149,-49 -119,-29 -119,31 -149,51 -179,31"/>
      <polygon points="121,-29 151,-49 181,-29 181,31 151,51 121,31"/>
    </g>

    <!-- Tool-mark texture in stone around carved edges -->
    <g stroke="#3a2818" stroke-width="0.55" opacity="0.55" fill="none">
      <line x1="-100" y1="-60" x2="-94" y2="-66"/>
      <line x1="100" y1="-60" x2="106" y2="-66"/>
      <line x1="-100" y1="60" x2="-94" y2="66"/>
      <line x1="100" y1="60" x2="106" y2="66"/>
    </g>
  </g>

  <!-- Floor at very bottom, fairy-scale flagstones -->
  <rect x="0" y="280" width="742" height="30.6" fill="url(#i6p14p1floor)"/>
  <line x1="0" y1="285" x2="742" y2="285" stroke="#5a5048" stroke-width="0.55" opacity="0.7"/>
  <!-- Dust drift on floor -->
  <g fill="#a8a098" opacity="0.55">
    <ellipse cx="200" cy="296" rx="60" ry="2.4"/>
    <ellipse cx="500" cy="296" rx="50" ry="2"/>
  </g>

  <!-- ===== LUMA — TINY at base of wall, neck craned, scanner raised UPWARD ===== -->
  <g transform="translate(371 280)">
    <!-- Tiny figure (silhouetted) -->
    <ellipse cx="-1.5" cy="0" rx="1.4" ry="0.7" fill="#0a0408"/>
    <ellipse cx="1.5" cy="0" rx="1.4" ry="0.7" fill="#0a0408"/>
    <rect x="-2" y="-7" width="2" height="7" fill="url(#i6p14p1lumaSuit)"/>
    <rect x="0" y="-7" width="2" height="7" fill="url(#i6p14p1lumaSuit)"/>
    <!-- Torso -->
    <path d="M-3,-7 L-3,-14 L3,-14 L3,-7 Z" fill="url(#i6p14p1lumaSuit)"/>
    <!-- Stone dust on knees -->
    <ellipse cx="-1.5" cy="-3" rx="1.4" ry="0.4" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="1.5" cy="-3" rx="1.4" ry="0.4" fill="#a8a098" opacity="0.85"/>
    <!-- Arms raised UP (scanner aimed at glyph) -->
    <path d="M-3,-14 L-2,-22 L-1,-22 L-2,-14 Z" fill="url(#i6p14p1lumaSuit)"/>
    <path d="M3,-14 L2,-22 L1,-22 L2,-14 Z" fill="url(#i6p14p1lumaSuit)"/>
    <!-- Scanner held above head -->
    <rect x="-3" y="-25" width="6" height="2.4" rx="0.4" fill="#3a2068" stroke="#a888ff" stroke-width="0.4"/>
    <rect x="-2" y="-24" width="4" height="0.85" fill="#5a3ad8" filter="url(#i6p14p1bloom)"/>
    <ellipse cx="0" cy="-25" rx="6" ry="1.6" fill="#a888ff" opacity="0.85" filter="url(#i6p14p1glow)"/>
    <!-- Head — neck craned upward -->
    <ellipse cx="0" cy="-17" rx="2" ry="2.4" fill="#7a4838"/>
    <!-- Hair -->
    <path d="M-2,-19 Q-1,-21 0,-21 Q1,-21 2,-19 L2,-17 Q1,-18 0,-18 Q-1,-18 -2,-17 Z" fill="#0a0604"/>
  </g>

  <!-- LUMA dialogue 1 — "That's... that's our script." -->
  <g>
    <rect x="14" y="14" width="218" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="100.5" y1="54" x2="111.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">That's... that's our script.</text>

  <!-- LUMA dialogue 2 — "It's our writing. On the wall. At THEIR height." -->
  <g>
    <rect x="450" y="64" width="278" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="540,104 552,104 544,114" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="540.5" y1="104" x2="551.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="458" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="458" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">It's our writing. On the wall. At THEIR height.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q200,182 400,178 Q580,176 742,180"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
