<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 6 — Page 5 — Panel 1: Theodore takes position in alley beside Granger's metalworks</title>
  <desc>35mm medium wide eye level. Soot-blackened brick alley, high barred window, distant gas lamp at far end. Theodore leaning casually against opposite wall, hand near pocket — performing casual.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p5p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p5p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p5p1brickL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="i6p5p1theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p5p1theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p5p1lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p5p1pocketHint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p5p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p5p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#i6p5p1bg)"/>

  <!-- Far-end alley vanishing to distant amber lamp -->
  <polygon points="120,80 250,80 200,260 160,260" fill="#1a1008"/>
  <ellipse cx="180" cy="180" rx="50" ry="120" fill="url(#i6p5p1lampGlow)" filter="url(#i6p5p1glow)" opacity="0.45"/>
  <!-- Distant gas lamp tiny silhouette -->
  <g transform="translate(180 200)">
    <rect x="-1" y="0" width="2" height="20" fill="#1a1008"/>
    <rect x="-3" y="-6" width="6" height="6" fill="#3a2018"/>
    <rect x="-2" y="-5" width="4" height="4" fill="#ffaa48" opacity="0.85" filter="url(#i6p5p1bloom)"/>
  </g>

  <!-- LEFT alley wall (factory wall — Granger's) -->
  <rect x="0" y="0" width="120" height="364" fill="url(#i6p5p1brickL)"/>
  <!-- Brick texture -->
  <g stroke="#0a0408" stroke-width="0.45" opacity="0.7">
    <line x1="0" y1="40" x2="120" y2="40"/>
    <line x1="0" y1="60" x2="120" y2="60"/>
    <line x1="0" y1="80" x2="120" y2="80"/>
    <line x1="0" y1="100" x2="120" y2="100"/>
    <line x1="0" y1="120" x2="120" y2="120"/>
    <line x1="0" y1="160" x2="120" y2="160"/>
    <line x1="0" y1="200" x2="120" y2="200"/>
    <line x1="0" y1="240" x2="120" y2="240"/>
    <line x1="0" y1="280" x2="120" y2="280"/>
    <line x1="0" y1="320" x2="120" y2="320"/>
    <!-- Vertical mortar with offset rows -->
    <line x1="40" y1="40" x2="40" y2="60"/>
    <line x1="80" y1="40" x2="80" y2="60"/>
    <line x1="20" y1="60" x2="20" y2="80"/>
    <line x1="60" y1="60" x2="60" y2="80"/>
    <line x1="100" y1="60" x2="100" y2="80"/>
    <line x1="40" y1="80" x2="40" y2="100"/>
    <line x1="80" y1="80" x2="80" y2="100"/>
    <line x1="20" y1="100" x2="20" y2="120"/>
    <line x1="60" y1="100" x2="60" y2="120"/>
    <line x1="100" y1="100" x2="100" y2="120"/>
  </g>
  <!-- Soot streaks running down -->
  <ellipse cx="60" cy="100" rx="40" ry="20" fill="#0a0408" opacity="0.7"/>
  <ellipse cx="20" cy="200" rx="32" ry="40" fill="#0a0408" opacity="0.65"/>
  <ellipse cx="80" cy="280" rx="40" ry="60" fill="#0a0408" opacity="0.7"/>
  <!-- Vertical soot streaks -->
  <g stroke="#0a0408" stroke-width="2" opacity="0.55" fill="none">
    <line x1="30" y1="20" x2="30" y2="280"/>
    <line x1="60" y1="20" x2="60" y2="220"/>
    <line x1="90" y1="20" x2="90" y2="180"/>
  </g>
  <!-- HIGH BARRED WINDOW -->
  <rect x="20" y="40" width="50" height="40" fill="#0a0408" stroke="#1a1008" stroke-width="0.85"/>
  <g stroke="#1a1008" stroke-width="1.4" opacity="0.85">
    <line x1="30" y1="42" x2="30" y2="78"/>
    <line x1="40" y1="42" x2="40" y2="78"/>
    <line x1="50" y1="42" x2="50" y2="78"/>
    <line x1="60" y1="42" x2="60" y2="78"/>
    <line x1="22" y1="60" x2="68" y2="60"/>
  </g>

  <!-- RIGHT alley wall (where Theodore leans) -->
  <rect x="246" y="0" width="120" height="364" fill="url(#i6p5p1brick)"/>
  <g stroke="#0a0408" stroke-width="0.45" opacity="0.7">
    <line x1="246" y1="40" x2="366" y2="40"/>
    <line x1="246" y1="60" x2="366" y2="60"/>
    <line x1="246" y1="80" x2="366" y2="80"/>
    <line x1="246" y1="100" x2="366" y2="100"/>
    <line x1="246" y1="120" x2="366" y2="120"/>
    <line x1="246" y1="160" x2="366" y2="160"/>
    <line x1="246" y1="200" x2="366" y2="200"/>
    <line x1="246" y1="240" x2="366" y2="240"/>
    <line x1="246" y1="280" x2="366" y2="280"/>
    <line x1="246" y1="320" x2="366" y2="320"/>
    <line x1="286" y1="40" x2="286" y2="60"/>
    <line x1="326" y1="40" x2="326" y2="60"/>
    <line x1="266" y1="60" x2="266" y2="80"/>
    <line x1="306" y1="60" x2="306" y2="80"/>
    <line x1="346" y1="60" x2="346" y2="80"/>
  </g>
  <ellipse cx="306" cy="200" rx="30" ry="50" fill="#0a0408" opacity="0.65"/>
  <ellipse cx="346" cy="120" rx="20" ry="40" fill="#0a0408" opacity="0.55"/>

  <!-- Cobbles between walls -->
  <rect x="120" y="280" width="126" height="84" fill="#1a1410"/>
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M120,300 Q180,298 246,300"/>
    <path d="M120,316 Q180,314 246,316"/>
    <path d="M120,332 Q180,330 246,332"/>
    <path d="M120,348 Q180,346 246,348"/>
  </g>
  <g fill="#3a2818" opacity="0.55">
    <ellipse cx="140" cy="320" rx="6" ry="2"/>
    <ellipse cx="180" cy="316" rx="6" ry="2"/>
    <ellipse cx="220" cy="320" rx="5" ry="1.6"/>
  </g>
  <!-- Litter -->
  <ellipse cx="180" cy="340" rx="14" ry="3" fill="#3a2010" opacity="0.55"/>

  <!-- ===== THEODORE leaning against right wall, casual ===== -->
  <g transform="translate(286 320)">
    <!-- Boots -->
    <ellipse cx="-9" cy="22" rx="10" ry="3" fill="#1a0c04"/>
    <ellipse cx="9" cy="20" rx="10" ry="3" fill="#1a0c04"/>
    <!-- Trousers — slight slouch, weight on back foot -->
    <path d="M-12,-58 L-2,-58 L-7,22 L-15,22 Z" fill="url(#i6p5p1theoTrousers)"/>
    <path d="M2,-58 L12,-58 L13,22 L4,22 Z" fill="url(#i6p5p1theoTrousers)"/>
    <!-- Patches at knees -->
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <!-- Belt -->
    <rect x="-12" y="-58" width="26" height="3.5" fill="#3a1808"/>
    <!-- Linen + waistcoat -->
    <path d="M-13,-118 L-12,-58 L13,-58 L14,-118 Z" fill="#d4c4a8"/>
    <path d="M-15,-116 L-13,-58 L-2,-58 L-2,-116 Z" fill="url(#i6p5p1theoWaistcoat)"/>
    <path d="M14,-116 L15,-58 L2,-58 L2,-116 Z" fill="url(#i6p5p1theoWaistcoat)"/>
    <!-- Pocket -->
    <rect x="3" y="-108" width="11" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <path d="M3,-108 L14,-108 L14,-104 L3,-104 Z" fill="#5a3018" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="5" y="-104" width="7" height="9" fill="#5a3ad8" opacity="0.45" filter="url(#i6p5p1bloom)"/>
    <ellipse cx="9" cy="-99" rx="8" ry="6" fill="url(#i6p5p1pocketHint)" filter="url(#i6p5p1glow)" opacity="0.55"/>
    <!-- Buttons -->
    <circle cx="-2" cy="-100" r="0.95" fill="#3a1808"/>
    <circle cx="-2" cy="-82" r="0.95" fill="#3a1808"/>
    <circle cx="-2" cy="-64" r="0.95" fill="#3a1808"/>
    <!-- Linen collar -->
    <path d="M-7,-118 L0,-116 L7,-118 L7,-114 L0,-110 L-7,-114 Z" fill="#e0d4b8"/>
    <!-- ARMS — left at side, RIGHT hand resting near pocket (giving stable platform) -->
    <path d="M-15,-116 L-22,-90 L-22,-66 L-12,-58 Z" fill="url(#i6p5p1theoWaistcoat)"/>
    <ellipse cx="-22" cy="-66" rx="2.4" ry="1.4" fill="#a87838"/>
    <!-- Right arm bent up to chest -->
    <path d="M15,-116 L18,-94 L8,-92 L4,-86 L4,-100 Z" fill="url(#i6p5p1theoWaistcoat)"/>
    <ellipse cx="4" cy="-90" rx="3" ry="1.6" fill="#a87838"/>
    <ellipse cx="2" cy="-92" rx="1.4" ry="0.85" fill="#0a0604" opacity="0.55"/>
    <!-- Brass ring on left index -->
    <circle cx="-22" cy="-67" r="0.7" fill="#c89058" filter="url(#i6p5p1bloom)" opacity="0.85"/>

    <!-- Head + neck (looking right toward factory wall) -->
    <rect x="-3" y="-126" width="6" height="8" fill="#a87838"/>
    <ellipse cx="0" cy="-138" rx="12" ry="14" fill="#a87838"/>
    <path d="M-12,-146 Q-9,-156 0,-158 Q9,-156 12,-146 L12,-138 Q8,-144 0,-144 Q-8,-144 -12,-138 Z" fill="#9a7038"/>
    <path d="M-7,-154 L-5,-158 L-8,-158 Z" fill="#9a7038"/>
    <path d="M5,-154 L7,-158 L4,-158 Z" fill="#9a7038"/>
    <!-- Eyes glanced right (toward the wall) -->
    <ellipse cx="-3" cy="-138" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-2" cy="-138" r="0.7" fill="#5a3818"/>
    <ellipse cx="4" cy="-138" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="5" cy="-138" r="0.7" fill="#5a3818"/>
    <!-- Brows level -->
    <path d="M-7,-144 L-2,-144" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M2,-144 L7,-144" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Mouth — slight smirk performing casual -->
    <path d="M-3,-128 L4,-128" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="4" y1="-128" x2="5" y2="-129" stroke="#3a1808" stroke-width="0.45"/>
  </g>

  <!-- THEODORE dialogue (low) -->
  <g>
    <rect x="14" y="14" width="320" height="58" rx="2" fill="white" stroke="#6a4220" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="120,72 132,72 124,82" fill="white" stroke="#6a4220" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="120.5" y1="72" x2="131.5" y2="72" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700" font-style="italic">THEODORE (low)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">This is Granger's metalworks.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">They do iron fittings, mostly.</text>
  <text x="22" y="71" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Nothing clever.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q120,92 240,88 Q330,86 366,90"/>
    <path d="M0,300 Q120,302 240,298 Q330,296 366,300"/>
  </g>
</svg>
