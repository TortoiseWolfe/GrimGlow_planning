<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 470.9" width="742" height="470.9">
  <title>Issue 6 — Page 14 — Panel 2: Luma airborne on wing-pack — face-to-face with billboard glyph + translation HUD</title>
  <desc>35mm medium eye level. Luma deployed wing-pack, hovering before glyph at its own height. Translucent sapphire-violet dragonfly wings + geometric lattice + prismatic trails. Each carved line as thick as her forearm. Tool marks visible (chisel, not fairy tech). Translation HUD shows readable fragments — communication primer, greeting structure.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p14p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p14p2stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="i6p14p2lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p14p2wingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p14p2glyphAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2a4a78" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p14p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p14p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="470.9" fill="url(#i6p14p2bg)"/>

  <!-- Stone wall surface filling background — close-range view of carved glyph at fairy scale -->
  <rect width="742" height="470.9" fill="url(#i6p14p2stone)"/>
  <!-- Mortar grid (massive, this close at fairy scale) -->
  <g stroke="#0a0408" stroke-width="0.85" opacity="0.85">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="280" x2="742" y2="280"/>
    <line x1="0" y1="380" x2="742" y2="380"/>
    <line x1="160" y1="0" x2="160" y2="80"/>
    <line x1="380" y1="0" x2="380" y2="80"/>
    <line x1="600" y1="0" x2="600" y2="80"/>
    <line x1="80" y1="80" x2="80" y2="180"/>
    <line x1="280" y1="80" x2="280" y2="180"/>
    <line x1="500" y1="80" x2="500" y2="180"/>
    <line x1="700" y1="80" x2="700" y2="180"/>
    <line x1="160" y1="180" x2="160" y2="280"/>
    <line x1="380" y1="180" x2="380" y2="280"/>
    <line x1="600" y1="180" x2="600" y2="280"/>
    <line x1="80" y1="280" x2="80" y2="380"/>
    <line x1="280" y1="280" x2="280" y2="380"/>
    <line x1="500" y1="280" x2="500" y2="380"/>
    <line x1="700" y1="280" x2="700" y2="380"/>
  </g>

  <!-- Glyph aura -->
  <ellipse cx="280" cy="235" rx="200" ry="180" fill="url(#i6p14p2glyphAura)" filter="url(#i6p14p2glow)" opacity="0.7"/>

  <!-- ===== LARGE FAIRY GLYPH carved at fairy scale (each line forearm-thick from Luma's POV) ===== -->
  <g transform="translate(280 235)">
    <!-- Outer hex outline — VERY THICK strokes -->
    <g stroke="#a8c0ff" stroke-width="11" fill="none" opacity="0.95" filter="url(#i6p14p2bloom)">
      <polygon points="-150,-90 0,-160 150,-90 150,90 0,160 -150,90"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="-90" y1="-50" x2="90" y2="50"/>
      <line x1="90" y1="-50" x2="-90" y2="50"/>
    </g>
    <!-- Inner core lighter -->
    <g stroke="#fff8ff" stroke-width="4" fill="none" opacity="0.85" filter="url(#i6p14p2bloom)">
      <polygon points="-150,-90 0,-160 150,-90 150,90 0,160 -150,90"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
      <line x1="-150" y1="0" x2="150" y2="0"/>
    </g>
    <!-- Carving depth shadow (deep groove) -->
    <g stroke="#1a0c04" stroke-width="3" fill="none" opacity="0.85">
      <polygon points="-148,-88 2,-158 152,-88 152,92 2,162 -148,92"/>
      <line x1="2" y1="-158" x2="2" y2="162"/>
      <line x1="-148" y1="2" x2="152" y2="2"/>
    </g>
    <!-- Corner dots -->
    <circle cx="0" cy="-160" r="9" fill="#fff8ff" filter="url(#i6p14p2bloom)"/>
    <circle cx="150" cy="0" r="9" fill="#fff8ff" filter="url(#i6p14p2bloom)"/>
    <circle cx="0" cy="160" r="9" fill="#fff8ff" filter="url(#i6p14p2bloom)"/>
    <circle cx="-150" cy="0" r="9" fill="#fff8ff" filter="url(#i6p14p2bloom)"/>

    <!-- TOOL MARKS — visible chisel marks around carved edges (PROOF: hand-tooled with human stone-cutting) -->
    <g stroke="#5a4030" stroke-width="0.7" opacity="0.85" fill="none">
      <line x1="-160" y1="-94" x2="-156" y2="-100"/>
      <line x1="-156" y1="-86" x2="-152" y2="-92"/>
      <line x1="-150" y1="-100" x2="-146" y2="-94"/>
      <line x1="160" y1="-94" x2="164" y2="-100"/>
      <line x1="-94" y1="-160" x2="-92" y2="-156"/>
      <line x1="-86" y1="-160" x2="-84" y2="-156"/>
      <line x1="94" y1="160" x2="92" y2="156"/>
      <line x1="-160" y1="94" x2="-156" y2="100"/>
    </g>
  </g>

  <!-- ===== TRANSLATION OVERLAY — HUD beside glyph ===== -->
  <g transform="translate(560 200)" filter="url(#i6p14p2bloom)" opacity="0.95">
    <rect x="-100" y="-90" width="200" height="180" fill="#1a0c20" opacity="0.85"/>
    <rect x="-100" y="-90" width="200" height="180" fill="none" stroke="#a888ff" stroke-width="2" opacity="0.95"/>
    <rect x="-100" y="-90" width="200" height="14" fill="#5a3ad8" opacity="0.85"/>
    <text x="-94" y="-80" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">PARTIAL TRANSLATION — COMM PRIMER</text>

    <!-- Greeting line -->
    <text x="-94" y="-62" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">/ GREETING /</text>
    <g stroke="#fff8ff" stroke-width="0.55" fill="none" opacity="0.95">
      <polygon points="-86,-50 -76,-58 -66,-50 -66,-38 -76,-30 -86,-38"/>
      <line x1="-76" y1="-58" x2="-76" y2="-30"/>
      <line x1="-86" y1="-44" x2="-66" y2="-44"/>
    </g>
    <text x="-56" y="-44" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">WE ARE</text>

    <!-- Self-id line -->
    <text x="-94" y="-22" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">/ SELF /</text>
    <g stroke="#fff8ff" stroke-width="0.55" fill="none" opacity="0.95">
      <polygon points="-86,-12 -76,-20 -66,-12 -66,0 -76,8 -86,0"/>
      <circle cx="-76" cy="-6" r="2"/>
      <circle cx="-76" cy="2" r="2"/>
    </g>
    <text x="-56" y="-6" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">FRIEND</text>

    <!-- Listen/teach line -->
    <text x="-94" y="20" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">/ INTENT /</text>
    <g stroke="#fff8ff" stroke-width="0.55" fill="none" opacity="0.95">
      <polygon points="-86,30 -76,22 -66,30 -66,42 -76,50 -86,42"/>
      <line x1="-86" y1="36" x2="-66" y2="36"/>
      <line x1="-76" y1="22" x2="-76" y2="50"/>
      <line x1="-82" y1="30" x2="-70" y2="42"/>
    </g>
    <text x="-56" y="38" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">TEACH</text>

    <!-- Bottom annotation -->
    <text x="-94" y="64" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">GRAMMAR: NESTED-RECURSION STRIPPED</text>
    <text x="-94" y="76" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">SYNTAX: LINEARIZED FOR HUMAN PARSE</text>
  </g>

  <!-- Stone dust drifting through scene -->
  <g fill="#fff8ff" opacity="0.7">
    <circle cx="180" cy="100" r="0.55"/>
    <circle cx="220" cy="80" r="0.4"/>
    <circle cx="380" cy="60" r="0.7"/>
    <circle cx="450" cy="100" r="0.55"/>
    <circle cx="120" cy="150" r="0.4"/>
    <circle cx="350" cy="180" r="0.55"/>
    <circle cx="500" cy="220" r="0.4"/>
    <circle cx="250" cy="350" r="0.55"/>
    <circle cx="420" cy="380" r="0.4"/>
  </g>

  <!-- ===== LUMA — airborne on deployed wing-pack, hovering before glyph ===== -->
  <g transform="translate(280 235)">
    <!-- TRANSLUCENT WINGS — fully deployed, behind body -->
    <g opacity="0.55" filter="url(#i6p14p2glow)">
      <ellipse cx="-22" cy="-18" rx="32" ry="14" fill="#a888ff" transform="rotate(-15 -22 -18)"/>
      <ellipse cx="22" cy="-18" rx="32" ry="14" fill="#a888ff" transform="rotate(15 22 -18)"/>
      <ellipse cx="-22" cy="14" rx="28" ry="12" fill="#a888ff" transform="rotate(15 -22 14)"/>
      <ellipse cx="22" cy="14" rx="28" ry="12" fill="#a888ff" transform="rotate(-15 22 14)"/>
    </g>
    <!-- Wing geometric lattice (visible structure) -->
    <g stroke="#fff8ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p14p2bloom)">
      <line x1="-50" y1="-30" x2="-2" y2="-10"/>
      <line x1="-44" y1="-20" x2="-2" y2="-10"/>
      <line x1="-38" y1="-12" x2="-2" y2="-10"/>
      <line x1="50" y1="-30" x2="2" y2="-10"/>
      <line x1="44" y1="-20" x2="2" y2="-10"/>
      <line x1="38" y1="-12" x2="2" y2="-10"/>
      <line x1="-46" y1="22" x2="-2" y2="10"/>
      <line x1="-40" y1="14" x2="-2" y2="10"/>
      <line x1="46" y1="22" x2="2" y2="10"/>
      <line x1="40" y1="14" x2="2" y2="10"/>
    </g>
    <!-- Prismatic trails -->
    <g opacity="0.55" filter="url(#i6p14p2bloom)">
      <line x1="-50" y1="-30" x2="-60" y2="-36" stroke="#a888ff" stroke-width="0.55"/>
      <line x1="50" y1="-30" x2="60" y2="-36" stroke="#a888ff" stroke-width="0.55"/>
      <line x1="-46" y1="22" x2="-56" y2="28" stroke="#a888ff" stroke-width="0.55"/>
      <line x1="46" y1="22" x2="56" y2="28" stroke="#a888ff" stroke-width="0.55"/>
    </g>

    <!-- Wing-pack glow surrounding Luma -->
    <ellipse cx="0" cy="0" rx="40" ry="34" fill="url(#i6p14p2wingGlow)" filter="url(#i6p14p2glow)" opacity="0.55"/>

    <!-- Body (hovering in flight pose) -->
    <ellipse cx="-3" cy="14" rx="2.4" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="14" rx="2.4" ry="1.4" fill="#0a0408"/>
    <rect x="-4" y="2" width="3" height="12" fill="url(#i6p14p2lumaSuit)"/>
    <rect x="3" y="2" width="3" height="12" fill="url(#i6p14p2lumaSuit)"/>
    <ellipse cx="-3" cy="9" rx="2" ry="0.7" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="3" cy="9" rx="2" ry="0.7" fill="#a8a098" opacity="0.85"/>
    <!-- Torso -->
    <path d="M-7,2 L-7,-12 L7,-12 L7,2 Z" fill="url(#i6p14p2lumaSuit)"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p14p2bloom)"/>
    <!-- Heavy stone dust on chest + cobweb on shoulder -->
    <ellipse cx="-5" cy="-2" rx="3" ry="0.7" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="5" cy="-2" rx="3" ry="0.7" fill="#a8a098" opacity="0.85"/>
    <line x1="-7" y1="-10" x2="-3" y2="-6" stroke="#7a6c50" stroke-width="0.4" opacity="0.55"/>
    <!-- Shoulders -->
    <path d="M-7,-12 Q-5,-16 0,-17 Q5,-16 7,-12 Z" fill="url(#i6p14p2lumaSuit)"/>
    <!-- LEFT arm — extended forward, palm against the stone wall -->
    <path d="M-7,-12 L-12,-8 L-14,-2 L-9,-2 L-7,-7 Z" fill="url(#i6p14p2lumaSuit)"/>
    <ellipse cx="-15" cy="-1" rx="2" ry="1.2" fill="#7a4838"/>
    <!-- Hand pressed against stone (touching it) -->
    <ellipse cx="-17" cy="-1" rx="1.4" ry="0.85" fill="#a87838"/>

    <!-- RIGHT arm — holding scanner up at glyph level -->
    <path d="M7,-12 L12,-16 L18,-22 L14,-25 L9,-20 Z" fill="url(#i6p14p2lumaSuit)"/>
    <!-- Scanner -->
    <rect x="14" y="-30" width="11" height="6" rx="0.55" fill="#3a2068" stroke="#a888ff" stroke-width="0.55"/>
    <rect x="16" y="-28" width="7" height="2.4" fill="#5a3ad8" filter="url(#i6p14p2bloom)"/>
    <ellipse cx="20" cy="-27" rx="11" ry="3" fill="#a888ff" opacity="0.85" filter="url(#i6p14p2glow)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="6" ry="7" fill="#7a4838"/>
    <ellipse cx="0" cy="-19" rx="4" ry="2" fill="#a888ff" opacity="0.45" filter="url(#i6p14p2bloom)"/>
    <!-- Hair pulled back, mortar powder -->
    <path d="M-5,-26 Q-4,-30 0,-30 Q4,-30 5,-26 L5,-22 Q3,-25 0,-25 Q-3,-25 -5,-22 Z" fill="#0a0604"/>
    <circle cx="0" cy="-28" r="0.4" fill="#a8a098" opacity="0.55"/>
    <circle cx="3" cy="-29" r="0.4" fill="#a8a098" opacity="0.55"/>
    <line x1="0" y1="-29" x2="1" y2="-31" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p14p2bloom)"/>
    <line x1="3" y1="-31" x2="4" y2="-29" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p14p2bloom)"/>
    <!-- Braid -->
    <path d="M5,-22 Q9,-12 7,-2" stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Lenses dust-dimmed -->
    <ellipse cx="-2" cy="-22" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="2" cy="-22" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="-2" cy="-22" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.55" opacity="0.7" filter="url(#i6p14p2bloom)"/>
    <ellipse cx="2" cy="-22" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.55" opacity="0.7" filter="url(#i6p14p2bloom)"/>
    <line x1="-3" y1="-23" x2="-1" y2="-21" stroke="#fff8ff" stroke-width="0.4" opacity="0.85"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.45" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.45" fill="#0a0604"/>
    <!-- Mouth slightly parted (silent reading) -->
    <ellipse cx="0" cy="-13" rx="0.85" ry="0.55" fill="#3a1808"/>
  </g>

  <!-- LUMA dialogue 1 — "It's simplified..." -->
  <g>
    <rect x="14" y="14" width="500" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="200,54 212,54 204,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="200.5" y1="54" x2="211.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">It's simplified. The nested recursion is stripped out. The grammar is linearized.</text>

  <!-- LUMA dialogue 2 — "Someone rewrote our language so humans could read it." -->
  <g>
    <rect x="14" y="64" width="380" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="180,104 192,104 184,114" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="180.5" y1="104" x2="191.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Someone rewrote our language so humans could read it.</text>

  <!-- SABLE dialogue (via comms — tighter crackle) -->
  <g>
    <rect x="14" y="406" width="160" height="42" rx="2" fill="white" stroke="#5a606a" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="2 2"/>
    <polygon points="80,448 92,448 84,458" fill="white" stroke="#5a606a" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="80.5" y1="448" x2="91.5" y2="448" stroke="white" stroke-width="1.5"/>
    <text x="158" y="424" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5a606a" font-weight="700">~)</text>
  </g>
  <text x="22" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700" font-style="italic">SABLE (via comms)</text>
  <text x="22" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Repeat that.</text>

  <!-- LUMA dialogue 4 — "One of us was HERE..." -->
  <g>
    <rect x="194" y="406" width="500" height="42" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.95" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="380,406 392,406 384,396" fill="white" stroke="#5a3ad8" stroke-width="0.95"/>
    <line x1="380.5" y1="406" x2="391.5" y2="406" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="202" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="202" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">One of us was HERE, Sable. One of us was teaching them.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
    <path d="M0,440 Q200,442 400,438 Q580,436 742,440"/>
  </g>
</svg>
