<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 310" width="742" height="310">
  <title>Issue 6 — Page 18 — Panel 1: Sable paces the beam, holographic text trails — "They sent US. And told us it was a survey."</title>
  <desc>35mm medium wide eye level. Sable has stood. Three steps one way, three steps back. Module in one hand projects corrupted text trailing as afterimage. Other hand clenched fist. Camp dark — perimeter off, timber beams as shadows. Restless light moves with her, casting shifting shadows. Military discipline even in distress.</desc>

  <defs>
    <radialGradient id="i6p18p1darkness" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a0a16" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="i6p18p1beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="i6p18p1suit" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7898c8"/>
      <stop offset="50%" stop-color="#3a4868"/>
      <stop offset="100%" stop-color="#1a1c30"/>
    </linearGradient>
    <linearGradient id="i6p18p1skin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5078a8"/>
      <stop offset="50%" stop-color="#2a3850"/>
      <stop offset="100%" stop-color="#0a0c20"/>
    </linearGradient>
    <radialGradient id="i6p18p1moduleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#a8c8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a3060" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p18p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p18p1glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p18p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="742" height="310" fill="url(#i6p18p1darkness)"/>

  <!-- Timber beam structure (the camp framework) -->
  <!-- Floor / horizontal beam where she paces -->
  <rect x="0" y="200" width="742" height="20" fill="url(#i6p18p1beam)"/>
  <line x1="0" y1="200" x2="742" y2="200" stroke="#3a4868" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#080604" stroke-width="0.7" opacity="0.85"/>
  <!-- Wood grain on horizontal -->
  <g stroke="#0a0810" stroke-width="0.4" opacity="0.85" fill="none">
    <path d="M40,206 Q140,205 240,207"/>
    <path d="M260,210 Q360,209 460,211"/>
    <path d="M480,205 Q580,206 680,205"/>
  </g>

  <!-- Vertical timbers (faint) -->
  <rect x="40" y="0" width="14" height="200" fill="url(#i6p18p1beam)"/>
  <line x1="54" y1="20" x2="54" y2="180" stroke="#2a3858" stroke-width="0.4" opacity="0.4"/>
  <rect x="688" y="0" width="14" height="200" fill="url(#i6p18p1beam)"/>
  <line x1="688" y1="20" x2="688" y2="180" stroke="#2a3858" stroke-width="0.4" opacity="0.4"/>

  <!-- Distant wall gap glow (faint grey rectangle far rear) -->
  <rect x="600" y="100" width="36" height="40" fill="#2a2c40" opacity="0.55" filter="url(#i6p18p1glow)"/>

  <!-- ===== TRAIL OF AFTERIMAGE TEXT FRAGMENTS — left to right pacing path ===== -->
  <!-- Earlier afterimages (left, faint) -->
  <g opacity="0.35" filter="url(#i6p18p1strongglow)">
    <ellipse cx="220" cy="170" rx="22" ry="10" fill="#5070a0"/>
  </g>
  <g opacity="0.4" filter="url(#i6p18p1bloom)">
    <line x1="208" y1="168" x2="218" y2="168" stroke="#a8c8ff" stroke-width="0.4"/>
    <polygon points="222,164 230,164 230,172 222,172" stroke="#a8c8ff" stroke-width="0.3" fill="none"/>
    <line x1="234" y1="168" x2="234" y2="174" stroke="#a8c8ff" stroke-width="0.3"/>
  </g>

  <g opacity="0.5" filter="url(#i6p18p1strongglow)">
    <ellipse cx="290" cy="170" rx="20" ry="9" fill="#5070b0"/>
  </g>
  <g opacity="0.55" filter="url(#i6p18p1bloom)">
    <polygon points="280,165 286,165 286,173 280,173" stroke="#a8c8ff" stroke-width="0.4" fill="none"/>
    <line x1="288" y1="169" x2="294" y2="169" stroke="#a8c8ff" stroke-width="0.4"/>
    <polygon points="298,165 304,165 304,173 298,173" stroke="#a8c8ff" stroke-width="0.4" fill="none"/>
    <line x1="301" y1="165" x2="301" y2="173" stroke="#a8c8ff" stroke-width="0.3"/>
  </g>

  <g opacity="0.7" filter="url(#i6p18p1strongglow)">
    <ellipse cx="350" cy="170" rx="22" ry="10" fill="#5078c8"/>
  </g>
  <g opacity="0.7" filter="url(#i6p18p1bloom)">
    <polygon points="338,165 344,165 344,173 338,173" stroke="#a8c8ff" stroke-width="0.55" fill="none"/>
    <line x1="341" y1="165" x2="341" y2="173" stroke="#a8c8ff" stroke-width="0.4"/>
    <line x1="346" y1="169" x2="354" y2="169" stroke="#a8c8ff" stroke-width="0.4"/>
    <polygon points="358,165 364,165 364,173 358,173" stroke="#a8c8ff" stroke-width="0.55" fill="none"/>
    <text x="335" y="160" font-family="monospace" font-size="4" fill="#a8c8ff" opacity="0.85">CONV...</text>
  </g>

  <!-- ===== SABLE — pacing center-right, module in one hand, fist clenched other ===== -->
  <g transform="translate(420 198)">
    <!-- Cast shadow -->
    <ellipse cx="0" cy="6" rx="14" ry="2" fill="#000" opacity="0.85"/>

    <!-- Legs — mid-stride -->
    <path d="M-6,4 L-9,-12 L-3,-20 L0,-12 Z" fill="url(#i6p18p1suit)"/>
    <path d="M6,4 L9,-8 L3,-18 L0,-12 Z" fill="url(#i6p18p1suit)"/>
    <!-- Knee lights -->
    <line x1="-7" y1="-12" x2="-3" y2="-12" stroke="#a8c0e8" stroke-width="0.3" opacity="0.85" filter="url(#i6p18p1bloom)"/>
    <line x1="3" y1="-10" x2="7" y2="-10" stroke="#a8c0e8" stroke-width="0.3" opacity="0.85" filter="url(#i6p18p1bloom)"/>

    <!-- Torso — slight forward lean (pacing) -->
    <path d="M-6,-20 L-7,-32 L-3,-38 L4,-38 L7,-32 L6,-20 Z" fill="url(#i6p18p1suit)"/>
    <!-- Center seam catching light -->
    <line x1="0" y1="-38" x2="0" y2="-20" stroke="#c0d8ff" stroke-width="0.4" opacity="0.85" filter="url(#i6p18p1bloom)"/>
    <!-- Soot bloom right shoulder -->
    <ellipse cx="5" cy="-32" rx="4" ry="2" fill="#1a1814" opacity="0.85"/>

    <!-- Tension-wear collar crease -->
    <line x1="-3" y1="-36" x2="-2" y2="-32" stroke="#0a0a14" stroke-width="0.4" opacity="0.95"/>
    <line x1="2" y1="-36" x2="3" y2="-32" stroke="#0a0a14" stroke-width="0.4" opacity="0.95"/>

    <!-- LEFT arm — clenched fist at side -->
    <path d="M-7,-32 L-12,-22 L-10,-12 L-6,-14 Z" fill="url(#i6p18p1suit)"/>
    <!-- Fist -->
    <ellipse cx="-12" cy="-12" rx="3" ry="2.4" fill="url(#i6p18p1skin)"/>
    <line x1="-14" y1="-13" x2="-10" y2="-13" stroke="#1a2840" stroke-width="0.4"/>
    <line x1="-14" y1="-12" x2="-10" y2="-12" stroke="#1a2840" stroke-width="0.4"/>
    <line x1="-14" y1="-11" x2="-10" y2="-11" stroke="#1a2840" stroke-width="0.4"/>

    <!-- RIGHT arm — extended forward holding module -->
    <path d="M7,-32 L18,-26 L22,-18 L14,-22 Z" fill="url(#i6p18p1suit)"/>
    <!-- Hand -->
    <ellipse cx="22" cy="-18" rx="3" ry="2.4" fill="url(#i6p18p1skin)"/>

    <!-- DATA MODULE in right hand, projecting -->
    <g transform="translate(28 -18)">
      <polygon points="-3,-1.4 3,-1.4 4,1.4 -4,1.4" fill="#1a2840" stroke="#a8c8ff" stroke-width="0.4"/>
      <ellipse cx="0" cy="0" rx="1.4" ry="0.7" fill="url(#i6p18p1moduleGlow)" filter="url(#i6p18p1bloom)"/>
      <!-- Red integrity indicator (still pulsing) -->
      <circle cx="-3" cy="0" r="0.4" fill="#ff5050" filter="url(#i6p18p1bloom)"/>
    </g>

    <!-- Live holographic text projecting from module — current position -->
    <g transform="translate(40 -50)" opacity="0.95" filter="url(#i6p18p1bloom)">
      <g stroke="#c0d8ff" stroke-width="0.4" fill="none">
        <polygon points="-12,-6 -8,-6 -8,6 -12,6"/>
        <line x1="-12" y1="0" x2="-8" y2="0"/>
        <polygon points="-4,-6 0,-6 0,6 -4,6"/>
        <line x1="-2" y1="-6" x2="-2" y2="6"/>
        <polygon points="4,-6 8,-7 8,6 4,7"/>
        <polygon points="12,-6 16,-6 16,6 12,6"/>
        <line x1="12" y1="0" x2="16" y2="0"/>
      </g>
      <text x="-14" y="14" font-family="monospace" font-size="4" fill="#a8c8ff">PRIOR INSERTION</text>
    </g>
    <!-- Bright glow halo at module -->
    <ellipse cx="28" cy="-18" rx="20" ry="14" fill="#a8c8ff" opacity="0.18" filter="url(#i6p18p1strongglow)"/>

    <!-- Head — eyes forward, jaw locked -->
    <ellipse cx="0" cy="-46" rx="4.5" ry="5" fill="url(#i6p18p1skin)"/>
    <!-- Buzz cut -->
    <path d="M-3.5,-50 Q-3.5,-54 0,-55 Q3.5,-54 3.5,-50 L3.5,-48 Q1.5,-49 0,-49 Q-1.5,-49 -3.5,-48 Z" fill="#1a1c30"/>
    <line x1="-3" y1="-50" x2="3" y2="-50" stroke="#a8c0e8" stroke-width="0.25" opacity="0.7" filter="url(#i6p18p1bloom)"/>
    <!-- Eyes — forward, narrowed -->
    <ellipse cx="-2" cy="-46" rx="1.2" ry="0.55" fill="#fff" opacity="0.85"/>
    <ellipse cx="2" cy="-46" rx="1.2" ry="0.55" fill="#fff" opacity="0.85"/>
    <circle cx="-2" cy="-46" r="0.55" fill="#1a2840"/>
    <circle cx="2" cy="-46" r="0.55" fill="#1a2840"/>
    <!-- Brow tight -->
    <path d="M-4,-50 L0,-49" stroke="#0a0a14" stroke-width="0.55"/>
    <path d="M4,-50 L0,-49" stroke="#0a0a14" stroke-width="0.55"/>
    <!-- Mouth — locked grimace -->
    <line x1="-2" y1="-42" x2="2" y2="-42" stroke="#0a0a14" stroke-width="0.55"/>
  </g>

  <!-- Shifting shadows on beam (cast by the moving module light) -->
  <g opacity="0.45">
    <ellipse cx="380" cy="208" rx="60" ry="3" fill="#a8c8ff" filter="url(#i6p18p1strongglow)"/>
  </g>

  <!-- SABLE dialogue 1 -->
  <g>
    <rect x="14" y="14" width="240" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="100.5" y1="54" x2="111.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Convergence intervention. Prior insertion timeline.</text>

  <!-- SABLE dialogue 2 -->
  <g>
    <rect x="14" y="64" width="280" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="120,104 132,104 124,114" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="120.5" y1="104" x2="131.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">They sent teams before. None reported back.</text>

  <!-- SABLE dialogue 3 -->
  <g>
    <rect x="488" y="14" width="240" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="600,54 612,54 604,64" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="600.5" y1="54" x2="611.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="496" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="496" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">And they sent US.</text>

  <!-- SABLE dialogue 4 -->
  <g>
    <rect x="488" y="64" width="240" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="540,104 552,104 544,114" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="540.5" y1="104" x2="551.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="496" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="496" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">And told us it was a survey.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,260 Q200,262 400,258 Q580,256 742,260"/>
  </g>
</svg>
