<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 421.5" width="742" height="421.5">
  <title>Issue 6 — Page 13 — Panel 4: Luma's scanner sweeps right — first carved lines of glyph fluoresce blue-white, NOT amber-black</title>
  <desc>28mm wide eye level pulling back. Luma turning, scanner sweeping rightward + upward to adjacent wall. Beam catches first carved geometric lines fluorescing FAINT BLUE-WHITE — answering color. On opposite wall: amber-black claw marks still visible. Two signatures, two civilizations.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p13p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p13p4stoneL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p13p4stoneR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p13p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p13p4lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p13p4scannerCone" cx="20%" cy="80%" r="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p13p4amberBlack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a87018" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p13p4glyphAnswer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a8ae8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a4a78" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p13p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p13p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="421.5" fill="url(#i6p13p4bg)"/>

  <!-- LEFT WALL (claw marks behind, AMBER-BLACK) -->
  <rect x="0" y="0" width="220" height="380" fill="url(#i6p13p4stoneL)"/>
  <g stroke="#0a0408" stroke-width="0.7" opacity="0.85">
    <line x1="0" y1="60" x2="220" y2="60"/>
    <line x1="0" y1="140" x2="220" y2="140"/>
    <line x1="0" y1="220" x2="220" y2="220"/>
    <line x1="0" y1="300" x2="220" y2="300"/>
  </g>
  <!-- Claw marks on left wall (faded — not the focus, but visible) -->
  <g transform="translate(110 200)">
    <path d="M-50,-60 L-26,60" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M-25,-60 L-1,60" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M0,-60 L24,60" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M25,-60 L49,60" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M50,-60 L74,60" stroke="#7a5a40" stroke-width="6" opacity="0.85"/>
    <path d="M-50,-60 L-26,60" stroke="#a87018" stroke-width="0.85" opacity="0.7" filter="url(#i6p13p4bloom)"/>
    <path d="M-25,-60 L-1,60" stroke="#a87018" stroke-width="0.85" opacity="0.7" filter="url(#i6p13p4bloom)"/>
    <path d="M0,-60 L24,60" stroke="#a87018" stroke-width="0.85" opacity="0.7" filter="url(#i6p13p4bloom)"/>
    <path d="M25,-60 L49,60" stroke="#a87018" stroke-width="0.85" opacity="0.7" filter="url(#i6p13p4bloom)"/>
    <path d="M50,-60 L74,60" stroke="#a87018" stroke-width="0.85" opacity="0.7" filter="url(#i6p13p4bloom)"/>
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="url(#i6p13p4amberBlack)" filter="url(#i6p13p4glow)" opacity="0.35"/>
  </g>

  <!-- RIGHT WALL (where glyph is — focus of scanner sweep now) -->
  <rect x="500" y="0" width="242" height="380" fill="url(#i6p13p4stoneR)"/>
  <g stroke="#0a0408" stroke-width="0.7" opacity="0.85">
    <line x1="500" y1="40" x2="742" y2="40"/>
    <line x1="500" y1="100" x2="742" y2="100"/>
    <line x1="500" y1="160" x2="742" y2="160"/>
    <line x1="500" y1="220" x2="742" y2="220"/>
    <line x1="500" y1="280" x2="742" y2="280"/>
    <line x1="540" y1="0" x2="540" y2="40"/>
    <line x1="620" y1="0" x2="620" y2="40"/>
    <line x1="700" y1="0" x2="700" y2="40"/>
    <line x1="580" y1="40" x2="580" y2="100"/>
    <line x1="660" y1="40" x2="660" y2="100"/>
    <line x1="540" y1="100" x2="540" y2="160"/>
    <line x1="620" y1="100" x2="620" y2="160"/>
    <line x1="700" y1="100" x2="700" y2="160"/>
  </g>
  <!-- Damp stain on right wall -->
  <ellipse cx="600" cy="240" rx="50" ry="40" fill="#0a0408" opacity="0.55"/>

  <!-- ===== FIRST CARVED LINES OF GLYPH on right wall — partial reveal, FAINT BLUE-WHITE fluorescence ===== -->
  <g transform="translate(620 130)">
    <!-- Bloom answering color halo -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="url(#i6p13p4glyphAnswer)" filter="url(#i6p13p4glow)" opacity="0.55"/>
    <!-- Partial glyph — only top edges visible, scanner just catching them -->
    <g stroke="#a8c0ff" stroke-width="2.4" fill="none" opacity="0.95" filter="url(#i6p13p4bloom)">
      <!-- Top arc of hex outline -->
      <path d="M-22,-12 L0,-22 L22,-12"/>
      <!-- Top of cross -->
      <line x1="0" y1="-22" x2="0" y2="-2"/>
      <!-- Partial side hint -->
      <path d="M22,-12 L24,-2"/>
      <path d="M-22,-12 L-24,-2"/>
      <!-- Top corner dot -->
      <circle cx="0" cy="-22" r="1.4" fill="#fff8ff"/>
    </g>
    <!-- Carving depth shadow -->
    <g stroke="#1a0c04" stroke-width="0.85" fill="none" opacity="0.85">
      <path d="M-21,-11 L1,-21 L23,-11"/>
      <line x1="1" y1="-21" x2="1" y2="-1"/>
    </g>
    <!-- Implication of more glyph below current scanner reach (ghosted) -->
    <g stroke="#a8c0ff" stroke-width="0.55" fill="none" opacity="0.32" stroke-dasharray="2 2">
      <line x1="-22" y1="-12" x2="-22" y2="12"/>
      <line x1="22" y1="-12" x2="22" y2="12"/>
      <line x1="0" y1="-2" x2="0" y2="22"/>
      <line x1="-22" y1="12" x2="0" y2="22"/>
      <line x1="22" y1="12" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
    </g>
  </g>

  <!-- Floor — flagstones at fairy scale -->
  <rect x="0" y="380" width="742" height="41.5" fill="url(#i6p13p4floor)"/>
  <g stroke="#0a0408" stroke-width="0.85" opacity="0.85" fill="none">
    <line x1="0" y1="395" x2="742" y2="395"/>
    <line x1="0" y1="410" x2="742" y2="410"/>
    <line x1="120" y1="380" x2="120" y2="421.5"/>
    <line x1="280" y1="380" x2="280" y2="421.5"/>
    <line x1="440" y1="380" x2="440" y2="421.5"/>
    <line x1="620" y1="380" x2="620" y2="421.5"/>
  </g>
  <!-- Dust drift on floor -->
  <g fill="#a8a098" opacity="0.45">
    <ellipse cx="100" cy="412" rx="50" ry="3"/>
    <ellipse cx="300" cy="408" rx="60" ry="2.4"/>
    <ellipse cx="500" cy="412" rx="50" ry="2.4"/>
    <ellipse cx="660" cy="408" rx="50" ry="2.4"/>
  </g>

  <!-- ===== SCANNER BEAM cone sweeping RIGHT and UPWARD toward glyph wall ===== -->
  <path d="M270,360 L640,90 L660,150 L280,375 Z" fill="url(#i6p13p4scannerCone)" filter="url(#i6p13p4glow)" opacity="0.85"/>
  <path d="M275,360 L630,110 L650,140 L285,372 Z" fill="#a888ff" opacity="0.45" filter="url(#i6p13p4glow)"/>

  <!-- Dust motes in beam -->
  <g fill="#fff8ff" opacity="0.85">
    <circle cx="350" cy="280" r="0.55"/>
    <circle cx="400" cy="260" r="0.4"/>
    <circle cx="430" cy="240" r="0.7"/>
    <circle cx="470" cy="220" r="0.55"/>
    <circle cx="500" cy="200" r="0.4"/>
    <circle cx="540" cy="180" r="0.55"/>
    <circle cx="580" cy="160" r="0.4"/>
    <circle cx="610" cy="140" r="0.7"/>
    <circle cx="380" cy="320" r="0.4"/>
    <circle cx="420" cy="300" r="0.55"/>
    <circle cx="460" cy="280" r="0.4"/>
    <circle cx="500" cy="260" r="0.55"/>
    <circle cx="540" cy="240" r="0.4"/>
    <circle cx="580" cy="220" r="0.7"/>
    <circle cx="380" cy="200" r="0.55"/>
    <circle cx="450" cy="180" r="0.4"/>
    <circle cx="520" cy="150" r="0.55"/>
  </g>

  <!-- ===== LUMA — body angled back, scanner arm raised, frozen mid-sweep ===== -->
  <g transform="translate(270 360)">
    <!-- Boots -->
    <ellipse cx="-5" cy="14" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="5" cy="14" rx="3" ry="1.4" fill="#0a0408"/>
    <!-- Trousers — body angled back, weight on back foot -->
    <path d="M-7,-10 L-2,-10 L-5,14 L-9,14 Z" fill="url(#i6p13p4lumaSuit)"/>
    <path d="M2,-10 L7,-10 L9,14 L5,14 Z" fill="url(#i6p13p4lumaSuit)"/>
    <!-- Heavy stone dust at knees -->
    <ellipse cx="-5" cy="0" rx="2.4" ry="1" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="5" cy="0" rx="2.4" ry="1" fill="#a8a098" opacity="0.85"/>
    <!-- Torso angled back slightly -->
    <path d="M-9,-10 L-9,-30 L9,-30 L9,-10 Z" fill="url(#i6p13p4lumaSuit)"/>
    <line x1="-7" y1="-20" x2="7" y2="-20" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p4bloom)"/>
    <!-- Stone dust on chest -->
    <ellipse cx="-5" cy="-15" rx="3" ry="0.85" fill="#a8a098" opacity="0.55"/>
    <ellipse cx="5" cy="-15" rx="3" ry="0.85" fill="#a8a098" opacity="0.55"/>
    <!-- Cobweb on shoulder -->
    <line x1="-9" y1="-28" x2="-5" y2="-22" stroke="#7a6c50" stroke-width="0.4" opacity="0.55"/>
    <!-- Shoulders -->
    <path d="M-9,-30 Q-7,-36 0,-37 Q7,-36 9,-30 Z" fill="url(#i6p13p4lumaSuit)"/>
    <!-- LEFT arm raised UP and FORWARD with scanner (sweeping toward glyph wall) -->
    <path d="M-9,-30 L-12,-40 L0,-50 L4,-44 L-2,-38 L-9,-26 Z" fill="url(#i6p13p4lumaSuit)"/>
    <!-- Hand holding scanner -->
    <ellipse cx="0" cy="-50" rx="3" ry="2" fill="#7a4838"/>
    <!-- SCANNER -->
    <rect x="-2" y="-58" width="14" height="6" rx="0.7" fill="#3a2068" stroke="#a888ff" stroke-width="0.55"/>
    <rect x="0" y="-56" width="10" height="2.4" fill="#5a3ad8" filter="url(#i6p13p4bloom)"/>
    <ellipse cx="5" cy="-56" rx="14" ry="3" fill="#a888ff" opacity="0.85" filter="url(#i6p13p4glow)"/>
    <!-- RIGHT arm at side -->
    <path d="M9,-30 L12,-22 L11,-10 L9,-10 Z" fill="url(#i6p13p4lumaSuit)"/>
    <!-- Head — looking UP-RIGHT toward glyph -->
    <ellipse cx="2" cy="-46" rx="6" ry="7" fill="#7a4838"/>
    <ellipse cx="2" cy="-43" rx="4" ry="2" fill="#a888ff" opacity="0.45" filter="url(#i6p13p4bloom)"/>
    <!-- Hair pulled back with dust -->
    <path d="M-3,-50 Q-2,-54 2,-54 Q6,-54 7,-50 L7,-46 Q4,-49 2,-49 Q0,-49 -3,-46 Z" fill="#0a0604"/>
    <circle cx="0" cy="-52" r="0.4" fill="#a8a098" opacity="0.55"/>
    <circle cx="4" cy="-53" r="0.4" fill="#a8a098" opacity="0.55"/>
    <line x1="0" y1="-53" x2="1" y2="-55" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p4bloom)"/>
    <line x1="3" y1="-55" x2="4" y2="-53" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p4bloom)"/>
    <!-- Braid -->
    <path d="M7,-48 Q11,-38 9,-26" stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Lenses -->
    <ellipse cx="0" cy="-46" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="4" cy="-46" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="0" cy="-46" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p4bloom)"/>
    <ellipse cx="4" cy="-46" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p4bloom)"/>
    <!-- Crack on left lens -->
    <line x1="-1" y1="-47" x2="1" y2="-45" stroke="#fff8ff" stroke-width="0.4" opacity="0.85"/>
  </g>

  <!-- LUMA dialogue 1 — "...Wait." -->
  <g>
    <rect x="14" y="14" width="100" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="50,54 62,54 54,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="50.5" y1="54" x2="61.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">...Wait.</text>

  <!-- LUMA dialogue 2 — "There's something else." -->
  <g>
    <rect x="500" y="64" width="228" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="566,104 578,104 570,114" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="566.5" y1="104" x2="577.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="508" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="508" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">There's something else.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,360 Q200,362 400,358 Q580,356 742,360"/>
  </g>
</svg>
