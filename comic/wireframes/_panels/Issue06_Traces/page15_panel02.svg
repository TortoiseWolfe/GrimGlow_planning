<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 6 — Page 15 — Panel 2: Holographic comparison HUD — basement glyph (older) vs Issue 4 brick-wall glyph (newer), same methodology, centuries-long protocol</title>
  <desc>50mm MCU on scanner display. Side-by-side morphological comparison. LEFT: this basement glyph (stone, ancient). RIGHT: I4 alley glyph (brick, newer). Linking lines + data showing same simplification approach. Caption: a tradition.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p15p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p15p2lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p15p2hudBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p15p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p15p2glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#i6p15p2bg)"/>

  <!-- Big HUD bloom backing -->
  <ellipse cx="183" cy="182" rx="200" ry="160" fill="url(#i6p15p2hudBloom)" filter="url(#i6p15p2glow)" opacity="0.7"/>

  <!-- Dust motes drifting -->
  <g fill="#fff8ff" opacity="0.85">
    <circle cx="40" cy="60" r="0.55"/>
    <circle cx="80" cy="40" r="0.4"/>
    <circle cx="320" cy="80" r="0.55"/>
    <circle cx="280" cy="50" r="0.4"/>
    <circle cx="60" cy="320" r="0.55"/>
    <circle cx="300" cy="310" r="0.4"/>
  </g>

  <!-- ===== HOLOGRAPHIC COMPARISON HUD ===== -->
  <g transform="translate(183 182)">
    <!-- Outer frame -->
    <rect x="-160" y="-130" width="320" height="240" fill="#1a0c20" opacity="0.85"/>
    <rect x="-160" y="-130" width="320" height="240" fill="none" stroke="#a888ff" stroke-width="2.4" opacity="0.95"/>
    <!-- Header -->
    <rect x="-160" y="-130" width="320" height="18" fill="#5a3ad8" opacity="0.85"/>
    <text x="0" y="-118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#fff8ff" font-weight="700">MORPHOLOGICAL COMPARISON — HUMAN-ADAPTED PROTOCOL</text>

    <!-- Divider -->
    <line x1="0" y1="-112" x2="0" y2="80" stroke="#a888ff" stroke-width="1" opacity="0.7"/>

    <!-- LEFT panel: BASEMENT GLYPH (older, stone) -->
    <text x="-150" y="-95" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">SAMPLE A — BASEMENT (STONE)</text>
    <text x="-150" y="-86" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">AGE: ~3 CENTURIES</text>
    <!-- Glyph rendering -->
    <g transform="translate(-80 -30)" stroke="#a8c0ff" stroke-width="1.7" fill="none" opacity="0.95" filter="url(#i6p15p2bloom)">
      <polygon points="-30,-18 0,-30 30,-18 30,18 0,30 -30,18"/>
      <line x1="0" y1="-30" x2="0" y2="30"/>
      <line x1="-30" y1="0" x2="30" y2="0"/>
      <line x1="-18" y1="-11" x2="18" y2="11"/>
      <line x1="18" y1="-11" x2="-18" y2="11"/>
      <circle cx="0" cy="-30" r="1.4" fill="#fff8ff"/>
      <circle cx="30" cy="0" r="1.4" fill="#fff8ff"/>
      <circle cx="0" cy="30" r="1.4" fill="#fff8ff"/>
      <circle cx="-30" cy="0" r="1.4" fill="#fff8ff"/>
    </g>
    <!-- Annotations on left glyph -->
    <text x="-150" y="22" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">SUBSTRATE: ROUGH STONE</text>
    <text x="-150" y="32" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">METHOD: HAND CHISEL</text>
    <text x="-150" y="42" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">GRAMMAR: LINEARIZED</text>
    <text x="-150" y="52" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">RECURSION: STRIPPED</text>

    <!-- RIGHT panel: I4 ALLEY GLYPH (newer, brick) -->
    <text x="10" y="-95" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">SAMPLE B — I-4 ALLEY (BRICK)</text>
    <text x="10" y="-86" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">AGE: ~40 YEARS</text>
    <!-- Issue 4 glyph rendering — slightly more refined geometry but same family -->
    <g transform="translate(80 -30)" stroke="#a8c0ff" stroke-width="1.7" fill="none" opacity="0.95" filter="url(#i6p15p2bloom)">
      <polygon points="-30,-18 0,-30 30,-18 30,18 0,30 -30,18"/>
      <line x1="0" y1="-30" x2="0" y2="30"/>
      <line x1="-30" y1="0" x2="30" y2="0"/>
      <line x1="-22" y1="-13" x2="22" y2="13"/>
      <line x1="22" y1="-13" x2="-22" y2="13"/>
      <!-- More refined inner detail -->
      <circle cx="0" cy="0" r="6"/>
      <circle cx="0" cy="-30" r="1.4" fill="#fff8ff"/>
      <circle cx="30" cy="0" r="1.4" fill="#fff8ff"/>
      <circle cx="0" cy="30" r="1.4" fill="#fff8ff"/>
      <circle cx="-30" cy="0" r="1.4" fill="#fff8ff"/>
    </g>
    <!-- Annotations on right glyph -->
    <text x="10" y="22" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">SUBSTRATE: STOCK BRICK</text>
    <text x="10" y="32" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">METHOD: METAL SCRIBE</text>
    <text x="10" y="42" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">GRAMMAR: LINEARIZED</text>
    <text x="10" y="52" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">RECURSION: STRIPPED</text>

    <!-- LINKING LINES between matching elements -->
    <g stroke="#fff8ff" stroke-width="0.55" opacity="0.7" fill="none" stroke-dasharray="2 2" filter="url(#i6p15p2bloom)">
      <line x1="-50" y1="-30" x2="50" y2="-30"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-50" y1="30" x2="50" y2="30"/>
    </g>
    <!-- Match indicators -->
    <g fill="#fff8ff" opacity="0.95" filter="url(#i6p15p2bloom)">
      <circle cx="0" cy="-30" r="1.2"/>
      <circle cx="0" cy="0" r="1.2"/>
      <circle cx="0" cy="30" r="1.2"/>
    </g>

    <!-- Bottom CONFIRMED MATCH banner -->
    <rect x="-140" y="64" width="280" height="36" fill="none" stroke="#fff8ff" stroke-width="1" opacity="0.95"/>
    <text x="0" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">MORPHOLOGICAL CONTINUITY: 96.4%</text>
    <text x="0" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">SAME PROTOCOL — DIFFERENT HAND</text>
  </g>

  <!-- Hands at edges (Luma's dust-covered gloves holding scanner — visible at frame edges) -->
  <g transform="translate(20 320)">
    <!-- Left hand fragment -->
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="url(#i6p15p2lumaSuit)"/>
    <ellipse cx="0" cy="-3" rx="3" ry="1.4" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="6" cy="0" rx="3" ry="1.4" fill="#7a4838"/>
    <line x1="-6" y1="-3" x2="6" y2="-3" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p15p2bloom)"/>
  </g>
  <g transform="translate(346 320)">
    <!-- Right hand fragment -->
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="url(#i6p15p2lumaSuit)"/>
    <ellipse cx="0" cy="-3" rx="3" ry="1.4" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="-6" cy="0" rx="3" ry="1.4" fill="#7a4838"/>
    <line x1="-6" y1="-3" x2="6" y2="-3" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p15p2bloom)"/>
  </g>

  <!-- CAPTION 1 -->
  <g>
    <rect x="14" y="14" width="338" height="56" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-weight="700" font-style="italic">CAPTION (Luma)</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">The same methodology as the alley glyph.</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">But older. Much older.</text>

  <!-- CAPTION 2 -->
  <g>
    <rect x="14" y="294" width="338" height="56" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-weight="700" font-style="italic">CAPTION (Luma)</text>
  <text x="22" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">Someone established a protocol.</text>
  <text x="22" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic">And someone else continued it.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q120,92 240,88 Q330,86 366,90"/>
    <path d="M0,290 Q120,292 240,288 Q330,286 366,290"/>
  </g>
</svg>
