<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 6 — Page 4 — Panel 5: Luma's POV through spectral lenses — factory wireframed, residue trail glowing</title>
  <desc>Macro POV through holographic lenses. Street with factory wireframed pulsing blue-violet, fairy script annotations, faint luminous trace footprints leading toward the factory wall. The city as data.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p4p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#605850"/>
      <stop offset="50%" stop-color="#403830"/>
      <stop offset="100%" stop-color="#2a2420"/>
    </linearGradient>
    <radialGradient id="i6p4p5lensVignette" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#5a3ad8" stop-opacity="0"/>
      <stop offset="80%" stop-color="#5a3ad8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="i6p4p5dataMist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p4p5factory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="i6p4p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p4p5glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="238" height="364" fill="url(#i6p4p5bg)"/>

  <!-- Underlying street + buildings (muted, behind data overlay) -->
  <!-- Side buildings -->
  <rect x="0" y="60" width="60" height="240" fill="#3a2820"/>
  <rect x="178" y="60" width="60" height="240" fill="#3a2820"/>
  <!-- Center distance -->
  <polygon points="60,300 178,300 134,80 104,80" fill="#2a2420"/>
  <!-- Cobbles -->
  <rect x="0" y="300" width="238" height="64" fill="#3a3028"/>
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,316 Q60,314 120,316 Q180,318 238,316"/>
    <path d="M0,332 Q60,330 120,332 Q180,334 238,332"/>
    <path d="M0,348 Q60,346 120,348 Q180,350 238,348"/>
  </g>

  <!-- ===== HOLOGRAPHIC OVERLAY — wireframe FACTORY ===== -->
  <g transform="translate(120 200)">
    <!-- Factory wireframe pulsing blue-violet -->
    <g stroke="#a888ff" stroke-width="1.2" fill="none" opacity="0.95" filter="url(#i6p4p5bloom)">
      <!-- Building outline -->
      <rect x="-66" y="-100" width="132" height="160"/>
      <!-- Roof slope -->
      <path d="M-66,-100 L-50,-130 L50,-130 L66,-100"/>
      <!-- Smokestack -->
      <rect x="14" y="-160" width="14" height="30"/>
      <!-- Windows (factory grid) -->
      <rect x="-50" y="-80" width="20" height="22"/>
      <rect x="-22" y="-80" width="20" height="22"/>
      <rect x="6" y="-80" width="20" height="22"/>
      <rect x="34" y="-80" width="20" height="22"/>
      <rect x="-50" y="-46" width="20" height="22"/>
      <rect x="-22" y="-46" width="20" height="22"/>
      <rect x="6" y="-46" width="20" height="22"/>
      <rect x="34" y="-46" width="20" height="22"/>
      <rect x="-50" y="-12" width="20" height="22"/>
      <rect x="-22" y="-12" width="20" height="22"/>
      <rect x="6" y="-12" width="20" height="22"/>
      <rect x="34" y="-12" width="20" height="22"/>
      <!-- Door -->
      <rect x="-12" y="22" width="24" height="38"/>
    </g>
    <!-- Pulsing inner highlight -->
    <rect x="-66" y="-130" width="132" height="190" fill="#a888ff" opacity="0.18" filter="url(#i6p4p5glow)"/>

    <!-- TARGET WALL marker — bright concentrated highlight on left wall -->
    <rect x="-66" y="-30" width="6" height="40" fill="#fff8ff" filter="url(#i6p4p5glow)" opacity="0.85"/>
    <rect x="-72" y="-30" width="3" height="40" fill="#fff8ff"/>
    <!-- Crosshair on target -->
    <line x1="-72" y1="-10" x2="-50" y2="-10" stroke="#fff8ff" stroke-width="0.7" filter="url(#i6p4p5bloom)"/>
    <line x1="-66" y1="-22" x2="-66" y2="2" stroke="#fff8ff" stroke-width="0.7" filter="url(#i6p4p5bloom)"/>
    <circle cx="-66" cy="-10" r="3" fill="none" stroke="#fff8ff" stroke-width="0.7" filter="url(#i6p4p5bloom)"/>

    <!-- Annotations: fairy geometric script -->
    <g stroke="#fff8ff" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#i6p4p5bloom)">
      <line x1="-66" y1="-100" x2="-90" y2="-130"/>
      <path d="M-90,-130 L-115,-130"/>
      <path d="M-110,-134 L-110,-126"/>
      <path d="M-104,-134 L-104,-126"/>
      <path d="M-98,-134 L-98,-126"/>
      <text x="-114" y="-136" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">FACTORY</text>
      <text x="-110" y="-118" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">ANOMALY 01</text>
      <line x1="66" y1="-30" x2="86" y2="-50"/>
      <path d="M86,-50 L106,-50"/>
      <path d="M90,-54 L90,-46"/>
      <path d="M96,-54 L96,-46"/>
      <text x="86" y="-58" font-family="Helvetica, Arial, sans-serif" font-size="4.5" fill="#fff8ff">ALLOY READ</text>
      <text x="86" y="-38" font-family="Helvetica, Arial, sans-serif" font-size="4" fill="#fff8ff">+38.2 S/mm</text>
    </g>

    <!-- SPECTRAL TRACE lines on the cobbles — luminous footprints -->
    <g fill="#a888ff" opacity="0.85" filter="url(#i6p4p5glow)">
      <ellipse cx="-90" cy="120" rx="6" ry="3"/>
      <ellipse cx="-78" cy="124" rx="5" ry="2.4"/>
      <ellipse cx="-66" cy="118" rx="6" ry="3"/>
      <ellipse cx="-54" cy="122" rx="5" ry="2.4"/>
      <ellipse cx="-44" cy="116" rx="6" ry="3"/>
      <ellipse cx="-34" cy="118" rx="5" ry="2.4"/>
      <ellipse cx="-22" cy="112" rx="5" ry="2.4"/>
      <ellipse cx="-12" cy="114" rx="5" ry="2.4"/>
      <ellipse cx="0" cy="108" rx="5" ry="2.4"/>
      <ellipse cx="12" cy="106" rx="4" ry="2"/>
      <ellipse cx="22" cy="100" rx="4" ry="2"/>
      <ellipse cx="34" cy="92" rx="4" ry="2"/>
      <ellipse cx="44" cy="80" rx="4" ry="1.6"/>
      <ellipse cx="54" cy="60" rx="3" ry="1.4"/>
      <ellipse cx="62" cy="38" rx="3" ry="1.4"/>
      <ellipse cx="68" cy="20" rx="3" ry="1.4"/>
      <!-- Last trace points to target wall -->
      <ellipse cx="62" cy="0" rx="3" ry="1.4"/>
      <ellipse cx="-66" cy="0" rx="4" ry="2"/>
    </g>
    <!-- Connecting trace path -->
    <path d="M-90,120 Q-50,118 -10,110 Q30,90 60,40 L-60,0" stroke="#a888ff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i6p4p5bloom)" stroke-dasharray="2 1.5"/>

    <!-- Status bars (HUD frame) -->
    <g stroke="#fff8ff" stroke-width="0.4" fill="none" opacity="0.95" filter="url(#i6p4p5bloom)">
      <rect x="-114" y="100" width="36" height="14"/>
      <rect x="-112" y="103" width="20" height="3" fill="#a888ff" opacity="0.85"/>
      <rect x="-112" y="108" width="14" height="3" fill="#a888ff" opacity="0.7"/>
      <text x="-114" y="98" font-family="Helvetica, Arial, sans-serif" font-size="4" fill="#fff8ff">SCAN</text>
      <rect x="78" y="100" width="36" height="14"/>
      <rect x="80" y="103" width="32" height="3" fill="#ff5868" opacity="0.85"/>
      <rect x="80" y="108" width="28" height="3" fill="#ff5868" opacity="0.7"/>
      <text x="78" y="98" font-family="Helvetica, Arial, sans-serif" font-size="4" fill="#ff5868">BIO</text>
    </g>
  </g>

  <!-- ATMOSPHERIC DATA MIST -->
  <ellipse cx="120" cy="200" rx="120" ry="180" fill="url(#i6p4p5dataMist)" filter="url(#i6p4p5glow)" opacity="0.45"/>

  <!-- LENS VIGNETTE — circular frame at edges -->
  <rect width="238" height="364" fill="url(#i6p4p5lensVignette)" opacity="0.85"/>
  <!-- Lens edge ring (at extreme corners) -->
  <ellipse cx="119" cy="182" rx="148" ry="190" fill="none" stroke="#a888ff" stroke-width="2.4" opacity="0.65" filter="url(#i6p4p5bloom)"/>
  <ellipse cx="119" cy="182" rx="142" ry="184" fill="none" stroke="#fff8ff" stroke-width="0.55" opacity="0.85"/>
  <!-- Crack pattern on left edge (from the cracked left lens — Luma's left) -->
  <line x1="-2" y1="80" x2="40" y2="120" stroke="#fff8ff" stroke-width="1" opacity="0.85" filter="url(#i6p4p5bloom)"/>
  <line x1="40" y1="120" x2="58" y2="116" stroke="#fff8ff" stroke-width="0.7" opacity="0.7"/>
  <line x1="40" y1="120" x2="50" y2="138" stroke="#fff8ff" stroke-width="0.55" opacity="0.7"/>

  <!-- LUMA dialogue (whispered — small italic) -->
  <g>
    <rect x="10" y="14" width="218" height="58" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="100,72 112,72 104,82" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="100.5" y1="72" x2="111.5" y2="72" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="18" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA</text>
  <text x="18" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">I'm picking up traces already.</text>
  <text x="18" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">The residue trail leads to the</text>
  <text x="18" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">factory wall.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,300 Q60,302 120,298 Q180,296 238,300"/>
  </g>
</svg>
