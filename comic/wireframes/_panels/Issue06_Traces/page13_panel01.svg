<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 248.9" width="742" height="248.9">
  <title>Issue 6 — Page 13 — Panel 1: Vast basement at fairy scale — Luma's footprints in centuries of dust, scanner sweeps far wall claw marks</title>
  <desc>24mm wide widescreen low angle floor level. Flagstones in fairy-scale (each a plateau). Centuries of grey-white dust drift, disturbed only by tiny four-inch footprints trail FG. Luma MG holding scanner two-handed sweeping. BG far wall: five claw marks gouged in stone, amber-black bio-trace fluorescing in grooves. Dust motes hanging like stars in beam.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p13p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p13p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i6p13p1stoneFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2820"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i6p13p1lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <radialGradient id="i6p13p1scannerCone" cx="20%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5a3ad8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a1058" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p13p1amberBlack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a87018" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5a3010" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p13p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p13p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="248.9" fill="url(#i6p13p1bg)"/>

  <!-- Far stone wall (background, mostly dark) -->
  <rect x="0" y="0" width="742" height="180" fill="url(#i6p13p1stoneFar)"/>
  <!-- Stone block grid (rough-cut, fairy-scale = each block is huge) -->
  <g stroke="#0a0408" stroke-width="0.85" opacity="0.85">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="40"/>
    <line x1="240" y1="0" x2="240" y2="40"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="520" y1="0" x2="520" y2="40"/>
    <line x1="640" y1="0" x2="640" y2="40"/>
    <line x1="60" y1="40" x2="60" y2="80"/>
    <line x1="200" y1="40" x2="200" y2="80"/>
    <line x1="340" y1="40" x2="340" y2="80"/>
    <line x1="480" y1="40" x2="480" y2="80"/>
    <line x1="620" y1="40" x2="620" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="120"/>
    <line x1="240" y1="80" x2="240" y2="120"/>
    <line x1="380" y1="80" x2="380" y2="120"/>
    <line x1="520" y1="80" x2="520" y2="120"/>
    <line x1="640" y1="80" x2="640" y2="120"/>
    <line x1="60" y1="120" x2="60" y2="160"/>
    <line x1="200" y1="120" x2="200" y2="160"/>
    <line x1="340" y1="120" x2="340" y2="160"/>
    <line x1="480" y1="120" x2="480" y2="160"/>
    <line x1="620" y1="120" x2="620" y2="160"/>
  </g>
  <!-- Damp/centuries of dust streaks -->
  <ellipse cx="180" cy="80" rx="60" ry="22" fill="#1a0c04" opacity="0.55"/>
  <ellipse cx="540" cy="120" rx="80" ry="34" fill="#1a0c04" opacity="0.55"/>

  <!-- ===== CLAW MARKS on far wall — five parallel deep gouges with amber-black bio-trace ===== -->
  <g transform="translate(540 110)">
    <!-- Pale exposed clay beneath -->
    <path d="M-50,-44 L-30,40" stroke="#7a5a40" stroke-width="9" opacity="0.95"/>
    <path d="M-25,-44 L-5,40" stroke="#7a5a40" stroke-width="9" opacity="0.95"/>
    <path d="M0,-44 L20,40" stroke="#7a5a40" stroke-width="9" opacity="0.95"/>
    <path d="M25,-44 L45,40" stroke="#7a5a40" stroke-width="9" opacity="0.95"/>
    <path d="M50,-44 L70,40" stroke="#7a5a40" stroke-width="9" opacity="0.95"/>
    <!-- Inner gouge -->
    <path d="M-49,-42 L-32,38" stroke="#1a0c04" stroke-width="2.4" opacity="0.95"/>
    <path d="M-24,-42 L-7,38" stroke="#1a0c04" stroke-width="2.4" opacity="0.95"/>
    <path d="M1,-42 L18,38" stroke="#1a0c04" stroke-width="2.4" opacity="0.95"/>
    <path d="M26,-42 L43,38" stroke="#1a0c04" stroke-width="2.4" opacity="0.95"/>
    <path d="M51,-42 L68,38" stroke="#1a0c04" stroke-width="2.4" opacity="0.95"/>
    <!-- AMBER-BLACK bio-trace fluorescence in grooves (sickly, wrong) -->
    <ellipse cx="10" cy="0" rx="80" ry="36" fill="url(#i6p13p1amberBlack)" filter="url(#i6p13p1glow)" opacity="0.55"/>
    <path d="M-49,-42 L-32,38" stroke="#a87018" stroke-width="1.4" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <path d="M-24,-42 L-7,38" stroke="#a87018" stroke-width="1.4" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <path d="M1,-42 L18,38" stroke="#a87018" stroke-width="1.4" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <path d="M26,-42 L43,38" stroke="#a87018" stroke-width="1.4" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <path d="M51,-42 L68,38" stroke="#a87018" stroke-width="1.4" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <!-- Dark amber-black flecks pulsing -->
    <g fill="#5a3010" opacity="0.85" filter="url(#i6p13p1bloom)">
      <circle cx="-40" cy="-20" r="1.4"/>
      <circle cx="-15" cy="-20" r="1.4"/>
      <circle cx="10" cy="-20" r="1.4"/>
      <circle cx="35" cy="-20" r="1.4"/>
      <circle cx="60" cy="-20" r="1.4"/>
      <circle cx="-32" cy="20" r="1.6"/>
      <circle cx="-5" cy="20" r="1.6"/>
      <circle cx="22" cy="20" r="1.6"/>
      <circle cx="48" cy="20" r="1.6"/>
    </g>
  </g>

  <!-- Floor — flagstones at fairy scale -->
  <rect x="0" y="180" width="742" height="68.9" fill="url(#i6p13p1floor)"/>
  <!-- Flagstone seams (very large) -->
  <g stroke="#0a0408" stroke-width="0.85" opacity="0.85" fill="none">
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="222" x2="742" y2="222"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
    <line x1="120" y1="180" x2="120" y2="248.9"/>
    <line x1="280" y1="180" x2="280" y2="248.9"/>
    <line x1="440" y1="180" x2="440" y2="248.9"/>
    <line x1="620" y1="180" x2="620" y2="248.9"/>
  </g>
  <!-- Centuries of dust drift (grey-white) -->
  <g fill="#a8a098" opacity="0.55">
    <ellipse cx="60" cy="240" rx="44" ry="3"/>
    <ellipse cx="200" cy="234" rx="50" ry="2.4"/>
    <ellipse cx="350" cy="240" rx="60" ry="2.4"/>
    <ellipse cx="500" cy="234" rx="50" ry="2.4"/>
    <ellipse cx="660" cy="240" rx="40" ry="2"/>
  </g>

  <!-- TINY FOOTPRINTS in dust trailing from foreground to Luma -->
  <g fill="#1a0c04" opacity="0.85">
    <ellipse cx="40" cy="245" rx="2" ry="0.85"/>
    <ellipse cx="55" cy="240" rx="2" ry="0.85"/>
    <ellipse cx="72" cy="244" rx="2" ry="0.85"/>
    <ellipse cx="89" cy="239" rx="2" ry="0.85"/>
    <ellipse cx="108" cy="243" rx="2" ry="0.85"/>
    <ellipse cx="129" cy="238" rx="2" ry="0.85"/>
    <ellipse cx="152" cy="242" rx="2" ry="0.85"/>
    <ellipse cx="178" cy="237" rx="2" ry="0.85"/>
    <ellipse cx="206" cy="241" rx="2" ry="0.85"/>
    <ellipse cx="234" cy="236" rx="2" ry="0.85"/>
  </g>

  <!-- SCANNER BEAM cone from Luma to far wall -->
  <path d="M260,225 L580,90 L600,160 L260,235 Z" fill="url(#i6p13p1scannerCone)" filter="url(#i6p13p1glow)" opacity="0.85"/>
  <!-- Inner brighter beam -->
  <path d="M265,225 L560,110 L575,150 L265,232 Z" fill="#a888ff" opacity="0.4" filter="url(#i6p13p1glow)"/>

  <!-- DUST MOTES suspended in beam (thousands like stars) -->
  <g fill="#fff8ff" opacity="0.85">
    <circle cx="320" cy="180" r="0.55"/>
    <circle cx="360" cy="160" r="0.4"/>
    <circle cx="380" cy="195" r="0.7"/>
    <circle cx="420" cy="155" r="0.55"/>
    <circle cx="440" cy="180" r="0.4"/>
    <circle cx="460" cy="200" r="0.55"/>
    <circle cx="480" cy="140" r="0.7"/>
    <circle cx="500" cy="170" r="0.4"/>
    <circle cx="520" cy="190" r="0.55"/>
    <circle cx="540" cy="155" r="0.4"/>
    <circle cx="350" cy="220" r="0.55"/>
    <circle cx="400" cy="225" r="0.4"/>
    <circle cx="450" cy="210" r="0.7"/>
    <circle cx="490" cy="220" r="0.55"/>
    <circle cx="540" cy="225" r="0.4"/>
    <circle cx="340" cy="140" r="0.4"/>
    <circle cx="380" cy="125" r="0.55"/>
    <circle cx="430" cy="120" r="0.4"/>
    <circle cx="470" cy="115" r="0.7"/>
    <circle cx="510" cy="125" r="0.55"/>
    <circle cx="290" cy="200" r="0.55"/>
    <circle cx="305" cy="175" r="0.4"/>
    <circle cx="555" cy="175" r="0.55"/>
    <circle cx="565" cy="200" r="0.4"/>
  </g>

  <!-- ===== LUMA — mid-distance, scanner held two-handed sweeping across far wall ===== -->
  <g transform="translate(260 225)">
    <!-- Tiny boots -->
    <ellipse cx="-3" cy="6" rx="2" ry="1" fill="#0a0408"/>
    <ellipse cx="3" cy="6" rx="2" ry="1" fill="#0a0408"/>
    <!-- Trousers -->
    <rect x="-4" y="-4" width="3" height="10" fill="url(#i6p13p1lumaSuit)"/>
    <rect x="2" y="-4" width="3" height="10" fill="url(#i6p13p1lumaSuit)"/>
    <!-- Heavy stone dust at knees (grey-white) -->
    <ellipse cx="-3" cy="2" rx="2.4" ry="0.85" fill="#a8a098" opacity="0.85"/>
    <ellipse cx="3" cy="2" rx="2.4" ry="0.85" fill="#a8a098" opacity="0.85"/>
    <!-- Torso -->
    <path d="M-7,-4 L-7,-18 L7,-18 L7,-4 Z" fill="url(#i6p13p1lumaSuit)"/>
    <line x1="-5" y1="-12" x2="5" y2="-12" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <!-- Stone dust on chest -->
    <ellipse cx="-4" cy="-8" rx="3" ry="0.85" fill="#a8a098" opacity="0.55"/>
    <ellipse cx="4" cy="-8" rx="3" ry="0.85" fill="#a8a098" opacity="0.55"/>
    <!-- Cobweb on shoulder -->
    <line x1="-7" y1="-16" x2="-3" y2="-13" stroke="#7a6c50" stroke-width="0.4" opacity="0.55"/>
    <!-- Shoulders -->
    <path d="M-7,-18 Q-5,-22 0,-23 Q5,-22 7,-18 Z" fill="url(#i6p13p1lumaSuit)"/>
    <!-- BOTH hands forward holding scanner two-handed -->
    <path d="M-7,-18 L-12,-12 L-9,-9 L-3,-13 Z" fill="url(#i6p13p1lumaSuit)"/>
    <path d="M7,-18 L12,-12 L9,-9 L3,-13 Z" fill="url(#i6p13p1lumaSuit)"/>
    <!-- Scanner -->
    <rect x="-9" y="-12" width="18" height="6" rx="0.7" fill="#3a2068" stroke="#a888ff" stroke-width="0.55"/>
    <rect x="-7" y="-10" width="14" height="2.4" fill="#5a3ad8" filter="url(#i6p13p1bloom)"/>
    <ellipse cx="0" cy="-9" rx="14" ry="3" fill="#a888ff" opacity="0.85" filter="url(#i6p13p1glow)"/>
    <!-- Head — looking at far wall (turned right slightly) -->
    <ellipse cx="2" cy="-28" rx="6" ry="7" fill="#7a4838"/>
    <!-- Underlight from scanner -->
    <ellipse cx="2" cy="-25" rx="4" ry="2" fill="#a888ff" opacity="0.45" filter="url(#i6p13p1bloom)"/>
    <!-- Hair pulled back, dust in it -->
    <path d="M-3,-32 Q-2,-36 2,-36 Q6,-36 7,-32 L7,-28 Q4,-31 2,-31 Q0,-31 -3,-28 Z" fill="#0a0604"/>
    <circle cx="0" cy="-34" r="0.4" fill="#a8a098" opacity="0.55"/>
    <circle cx="4" cy="-35" r="0.4" fill="#a8a098" opacity="0.55"/>
    <!-- Sapphire filament -->
    <line x1="0" y1="-35" x2="1" y2="-37" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <line x1="3" y1="-37" x2="4" y2="-35" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p13p1bloom)"/>
    <!-- Braid -->
    <path d="M7,-30 Q11,-22 9,-12" stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Lenses dimmed by dust -->
    <ellipse cx="0" cy="-28" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="4" cy="-28" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
    <ellipse cx="0" cy="-28" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.7" filter="url(#i6p13p1bloom)"/>
    <ellipse cx="4" cy="-28" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.7" filter="url(#i6p13p1bloom)"/>
    <!-- Crack -->
    <line x1="-1" y1="-29" x2="1" y2="-27" stroke="#fff8ff" stroke-width="0.4" opacity="0.85"/>
  </g>

  <!-- LUMA dialogue 1 (via comms — radio crackle marker) -->
  <g>
    <rect x="14" y="14" width="436" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="200,54 212,54 204,64" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="200.5" y1="54" x2="211.5" y2="54" stroke="white" stroke-width="1.5"/>
    <!-- Radio crackle indicator -->
    <text x="446" y="34" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5a3ad8" font-weight="700">~)))</text>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA (via comms)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Sable. I've reached the lowest level. Marks in the stone.</text>

  <!-- LUMA dialogue 2 -->
  <g>
    <rect x="500" y="64" width="228" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="566,104 578,104 570,114" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="566.5" y1="104" x2="577.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="508" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA</text>
  <text x="508" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">They match the profile from the alley.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,180 Q200,182 400,178 Q580,176 742,180"/>
    <path d="M0,230 Q200,232 400,228 Q580,226 742,230"/>
  </g>
</svg>
