<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 421.5" width="366" height="421.5">
  <title>Issue 6 — Page 6 — Panel 3: Luma's POV from pocket — pub interior, gaslight bends around shadow stain</title>
  <desc>85mm CU low angle — POV from chest height. Pub interior up-and-across. On far wall beside fireplace, gaslight bends around a human-sized patch — Titan cloaking residue, the light remembering what was there. Subtle wrongness.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p6p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p6p3floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="i6p6p3lampHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p6p3fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a85818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p6p3shadowStain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0c20" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#3a1828" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p6p3iridescence" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a3a78" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3a1828" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0c20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p6p3scannerBeam" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p6p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p6p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="366" height="421.5" fill="url(#i6p6p3bg)"/>

  <!-- LOW-ANGLE pub interior — wood ceiling beams visible at top -->
  <rect x="0" y="0" width="366" height="60" fill="#3a1808"/>
  <rect x="0" y="0" width="366" height="14" fill="#1a0c04"/>
  <!-- Ceiling beams crossing -->
  <rect x="60" y="0" width="14" height="60" fill="#1a0c04"/>
  <rect x="186" y="0" width="14" height="60" fill="#1a0c04"/>
  <rect x="296" y="0" width="14" height="60" fill="#1a0c04"/>

  <!-- Walls (back + side) -->
  <rect x="0" y="60" width="366" height="280" fill="#5a3018"/>
  <!-- Brick texture -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="100" x2="366" y2="100"/>
    <line x1="0" y1="140" x2="366" y2="140"/>
    <line x1="0" y1="180" x2="366" y2="180"/>
    <line x1="0" y1="220" x2="366" y2="220"/>
    <line x1="0" y1="260" x2="366" y2="260"/>
    <line x1="0" y1="300" x2="366" y2="300"/>
  </g>
  <!-- Wood floor -->
  <rect x="0" y="340" width="366" height="60" fill="url(#i6p6p3floor)"/>
  <line x1="0" y1="356" x2="366" y2="356" stroke="#1a0c04" stroke-width="0.55" opacity="0.7"/>
  <line x1="0" y1="376" x2="366" y2="376" stroke="#1a0c04" stroke-width="0.55" opacity="0.7"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.6" fill="none">
    <line x1="60" y1="340" x2="60" y2="400"/>
    <line x1="120" y1="340" x2="120" y2="400"/>
    <line x1="200" y1="340" x2="200" y2="400"/>
    <line x1="280" y1="340" x2="280" y2="400"/>
  </g>

  <!-- GAS LAMPS on walls (warm amber halos) -->
  <g transform="translate(60 100)">
    <rect x="-2.4" y="-7" width="4.8" height="14" fill="#1a0c04"/>
    <rect x="-7" y="-7" width="14" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="-5" y="-5" width="10" height="10" fill="#ffaa48" filter="url(#i6p6p3bloom)" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#i6p6p3lampHalo)" filter="url(#i6p6p3glow)" opacity="0.85"/>
  </g>
  <g transform="translate(310 100)">
    <rect x="-2.4" y="-7" width="4.8" height="14" fill="#1a0c04"/>
    <rect x="-7" y="-7" width="14" height="14" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="-5" y="-5" width="10" height="10" fill="#ffaa48" filter="url(#i6p6p3bloom)" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#i6p6p3lampHalo)" filter="url(#i6p6p3glow)" opacity="0.85"/>
  </g>

  <!-- FIREPLACE on right side, far wall -->
  <rect x="240" y="180" width="80" height="120" fill="#1a0c04"/>
  <rect x="248" y="186" width="64" height="100" fill="#0a0408" stroke="#3a1808" stroke-width="0.85"/>
  <!-- Fire glow inside -->
  <ellipse cx="280" cy="240" rx="26" ry="40" fill="url(#i6p6p3fireGlow)" filter="url(#i6p6p3glow)"/>
  <ellipse cx="280" cy="250" rx="14" ry="22" fill="#ffaa48" filter="url(#i6p6p3bloom)" opacity="0.95"/>
  <ellipse cx="280" cy="260" rx="9" ry="14" fill="#fff8e8" filter="url(#i6p6p3bloom)" opacity="0.85"/>
  <!-- Mantel -->
  <rect x="232" y="174" width="96" height="6" fill="#3a1808"/>
  <!-- Mantel objects -->
  <rect x="248" y="166" width="6" height="8" fill="#5a3018"/>
  <rect x="304" y="164" width="6" height="10" fill="#5a3018"/>

  <!-- Far wall LEFT of fireplace — the LIGHT-DISTORTION ZONE — Titan cloaking residue -->
  <!-- Subtle bend in gaslight where it should be cast: a wedge ~human-sized that's wrong -->
  <g transform="translate(160 240)">
    <!-- The shadow stain — looks like it should be wall but absorbs the warm light wrong -->
    <ellipse cx="0" cy="0" rx="40" ry="65" fill="url(#i6p6p3shadowStain)" filter="url(#i6p6p3glow)"/>
    <!-- Faint dark iridescence at edges (oil-on-water, bruise-purple) -->
    <ellipse cx="0" cy="0" rx="42" ry="68" fill="none" stroke="#5a3a78" stroke-width="0.85" opacity="0.45" filter="url(#i6p6p3bloom)"/>
    <ellipse cx="0" cy="0" rx="38" ry="64" fill="none" stroke="#3a1828" stroke-width="0.55" opacity="0.45" filter="url(#i6p6p3bloom)"/>
    <ellipse cx="0" cy="0" rx="44" ry="70" fill="url(#i6p6p3iridescence)" opacity="0.45" filter="url(#i6p6p3bloom)"/>
    <!-- Light bending lines — gas lamp light should hit this but bends around -->
    <path d="M-50,-60 Q-20,-40 -42,0 Q-30,40 -50,60" stroke="#ffaa48" stroke-width="0.55" fill="none" opacity="0.55" filter="url(#i6p6p3bloom)"/>
    <path d="M50,-60 Q30,-40 42,0 Q40,40 50,60" stroke="#ffaa48" stroke-width="0.55" fill="none" opacity="0.55" filter="url(#i6p6p3bloom)"/>
    <!-- Inner darker void -->
    <ellipse cx="0" cy="0" rx="22" ry="40" fill="#1a0c20" opacity="0.65"/>
  </g>

  <!-- HOLOGRAPHIC SCANNER OVERLAY highlighting the distortion zone -->
  <g transform="translate(160 240)" filter="url(#i6p6p3bloom)" opacity="0.95">
    <rect x="-46" y="-72" width="92" height="144" fill="none" stroke="#a888ff" stroke-width="0.85" stroke-dasharray="3 2"/>
    <line x1="-50" y1="-72" x2="-46" y2="-72" stroke="#a888ff" stroke-width="0.85"/>
    <line x1="46" y1="-72" x2="50" y2="-72" stroke="#a888ff" stroke-width="0.85"/>
    <line x1="-50" y1="72" x2="-46" y2="72" stroke="#a888ff" stroke-width="0.85"/>
    <line x1="46" y1="72" x2="50" y2="72" stroke="#a888ff" stroke-width="0.85"/>
    <!-- Crosshair -->
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#a888ff" stroke-width="0.4" stroke-dasharray="2 2"/>
    <line x1="0" y1="-72" x2="0" y2="72" stroke="#a888ff" stroke-width="0.4" stroke-dasharray="2 2"/>
    <!-- Annotation tag -->
    <line x1="46" y1="-50" x2="84" y2="-90"/>
    <text x="86" y="-92" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#fff8ff" font-weight="700">DISTORTION</text>
    <text x="86" y="-82" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#fff8ff">CLOAK RESIDUE</text>
    <text x="86" y="-74" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#ff5868">∞ MATCH: TITAN</text>
  </g>

  <!-- A few morning drinkers at distant tables -->
  <g transform="translate(110 320)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="11" ry="6" fill="#3a1808"/>
    <ellipse cx="0" cy="-8" rx="5" ry="6" fill="#a85818"/>
  </g>
  <g transform="translate(64 322)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#3a1808"/>
    <ellipse cx="0" cy="-8" rx="4.5" ry="5" fill="#a85818"/>
  </g>

  <!-- ===== Pocket-edge silhouette at BOTTOM frame — Luma's hands holding scanner visible ===== -->
  <rect x="0" y="380" width="366" height="42" fill="#1a0c04"/>
  <!-- Pocket lip -->
  <line x1="0" y1="380" x2="366" y2="380" stroke="#5a3018" stroke-width="2" opacity="0.85"/>
  <line x1="0" y1="384" x2="366" y2="384" stroke="#3a1808" stroke-width="0.85" opacity="0.7" stroke-dasharray="3 2"/>
  <!-- Tiny scanner held up at bottom -->
  <g transform="translate(160 396)" filter="url(#i6p6p3bloom)">
    <rect x="-9" y="-3" width="18" height="6" rx="0.85" fill="#3a2068" stroke="#a888ff" stroke-width="0.55"/>
    <rect x="-7" y="-1" width="14" height="2" fill="#5a3ad8"/>
    <ellipse cx="0" cy="-2" rx="11" ry="3" fill="#a888ff" opacity="0.85"/>
    <!-- Scanner beam going up into scene -->
    <path d="M0,-6 L160,-156 L162,-156 L4,-6 Z" fill="url(#i6p6p3scannerBeam)" opacity="0.55"/>
  </g>
  <!-- Tiny hands holding scanner -->
  <g transform="translate(160 400)">
    <ellipse cx="-12" cy="0" rx="3" ry="2" fill="#7a4838"/>
    <ellipse cx="12" cy="0" rx="3" ry="2" fill="#7a4838"/>
  </g>

  <!-- LUMA dialogue 1 -->
  <g>
    <rect x="14" y="14" width="330" height="74" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,88 172,88 164,98" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="88" x2="171.5" y2="88" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">There. The far wall, beside the fireplace.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">See how the gaslight bends? Something stood</text>
  <text x="22" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">there. Something large enough to distort the</text>
  <text x="22" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">ambient light field.</text>

  <!-- LUMA dialogue 2 -->
  <g>
    <rect x="14" y="100" width="330" height="60" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.7" opacity="0.92" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="160,160 172,160 164,170" fill="white" stroke="#5a3ad8" stroke-width="0.7" stroke-dasharray="2 1.5"/>
    <line x1="160.5" y1="160" x2="171.5" y2="160" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA</text>
  <text x="22" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Titan cloaking leaves a residue.</text>
  <text x="22" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">The light still remembers what was</text>
  <text x="22" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">there.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,200 Q120,202 240,198 Q330,196 366,200"/>
    <path d="M0,360 Q120,362 240,358 Q330,356 366,360"/>
  </g>
</svg>
