<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 6 — Page 11 — Panel 4: THE GLYPH DISCOVERY — fairy script + English response carved into beam — proof of prior contact</title>
  <desc>35mm medium wide eye level dramatic reveal. Thick timber support beam floor-to-ceiling. At ~5ft (human reach height): fairy glyph carved deliberately, geometric, simplified, decades old. BELOW it: cruder English letters scratched as RESPONSE — partially worn. Conversation in wood. Luma staggered, hand reaching toward glyph not touching. Theodore confused looking between marks.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p11p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p11p4timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="i6p11p4timberLit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i6p11p4lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p11p4theoWaistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p11p4theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3028"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i6p11p4scannerBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i6p11p4glyphGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a888ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p11p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p11p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#i6p11p4bg)"/>

  <!-- DARKNESS dominant -->
  <rect width="742" height="364" fill="#020108"/>

  <!-- Faint distant brick wall behind -->
  <rect x="0" y="0" width="742" height="364" fill="#0a0608" opacity="0.85"/>
  <g stroke="#0a0408" stroke-width="0.4" opacity="0.45" fill="none">
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
  </g>

  <!-- ===== TIMBER SUPPORT BEAM — center, floor-to-ceiling, dominant ===== -->
  <rect x="280" y="0" width="180" height="364" fill="url(#i6p11p4timber)"/>
  <!-- Lit zone where scanner is hitting -->
  <rect x="280" y="120" width="180" height="160" fill="url(#i6p11p4timberLit)"/>
  <!-- Wood grain (running vertical) -->
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.7" fill="none">
    <line x1="290" y1="0" x2="290" y2="364"/>
    <line x1="304" y1="0" x2="304" y2="364"/>
    <line x1="320" y1="0" x2="320" y2="364"/>
    <line x1="336" y1="0" x2="336" y2="364"/>
    <line x1="352" y1="0" x2="352" y2="364"/>
    <line x1="368" y1="0" x2="368" y2="364"/>
    <line x1="384" y1="0" x2="384" y2="364"/>
    <line x1="400" y1="0" x2="400" y2="364"/>
    <line x1="416" y1="0" x2="416" y2="364"/>
    <line x1="432" y1="0" x2="432" y2="364"/>
    <line x1="448" y1="0" x2="448" y2="364"/>
  </g>
  <!-- Knots in timber -->
  <ellipse cx="304" cy="60" rx="6" ry="3" fill="#1a0c04" opacity="0.85"/>
  <ellipse cx="436" cy="320" rx="9" ry="4" fill="#1a0c04" opacity="0.85"/>
  <ellipse cx="380" cy="220" rx="6" ry="2.4" fill="#1a0c04" opacity="0.7"/>
  <!-- Subtle horizontal grain bands -->
  <g stroke="#5a3018" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M280,80 Q380,82 460,80"/>
    <path d="M280,160 Q380,162 460,160"/>
    <path d="M280,260 Q380,262 460,260"/>
    <path d="M280,340 Q380,342 460,340"/>
  </g>

  <!-- Scanner beam wash on beam -->
  <ellipse cx="370" cy="200" rx="120" ry="80" fill="url(#i6p11p4scannerBeam)" filter="url(#i6p11p4glow)" opacity="0.7"/>

  <!-- ===== FAIRY GLYPH at human height (~5ft) — SIMPLIFIED hex-cross — center beam upper ===== -->
  <g transform="translate(370 180)">
    <!-- Aura -->
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="url(#i6p11p4glyphGlow)" filter="url(#i6p11p4glow)" opacity="0.85"/>

    <!-- The glyph itself — geometric, simplified version of I4 glyph (hex-cross language family) -->
    <g stroke="#fff8ff" stroke-width="1.4" fill="none" opacity="0.95" filter="url(#i6p11p4bloom)">
      <!-- Hex outline -->
      <polygon points="-22,-12 0,-22 22,-12 22,12 0,22 -22,12"/>
      <!-- Cross inside hex -->
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <!-- Inner shapes -->
      <line x1="-12" y1="-7" x2="12" y2="7"/>
      <line x1="12" y1="-7" x2="-12" y2="7"/>
      <!-- Small dots at corners -->
      <circle cx="0" cy="-22" r="1.4" fill="#fff8ff"/>
      <circle cx="22" cy="0" r="1.4" fill="#fff8ff"/>
      <circle cx="0" cy="22" r="1.4" fill="#fff8ff"/>
      <circle cx="-22" cy="0" r="1.4" fill="#fff8ff"/>
    </g>
    <!-- Carving depth shadow -->
    <g stroke="#1a0c04" stroke-width="0.85" fill="none" opacity="0.85">
      <polygon points="-21,-11 1,-21 23,-11 23,13 1,23 -21,13"/>
      <line x1="1" y1="-21" x2="1" y2="23"/>
      <line x1="-21" y1="1" x2="23" y2="1"/>
    </g>
    <!-- Weather/aging — chips and worn edges -->
    <ellipse cx="-22" cy="-12" rx="1.4" ry="1" fill="#0a0408"/>
    <ellipse cx="22" cy="12" rx="1.4" ry="1" fill="#0a0408"/>
    <line x1="-2" y1="-22" x2="-4" y2="-26" stroke="#1a0c04" stroke-width="0.55" opacity="0.85"/>
    <!-- Dust accumulated in carving (aged) -->
    <circle cx="0" cy="0" r="0.85" fill="#7a5028" opacity="0.55"/>
  </g>

  <!-- ===== HUMAN ENGLISH RESPONSE — below, scratched cruder, partially worn ===== -->
  <g transform="translate(370 240)">
    <!-- Faint underline showing scratch level -->
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#5a3018" stroke-width="0.4" opacity="0.55"/>
    <!-- "I SAW" text — crude carved letters, weathered -->
    <g fill="none" stroke="#0a0408" stroke-width="1.2" stroke-linecap="round">
      <!-- I -->
      <line x1="-46" y1="-7" x2="-46" y2="9"/>
      <line x1="-50" y1="-7" x2="-42" y2="-7"/>
      <line x1="-50" y1="9" x2="-42" y2="9"/>
      <!-- S -->
      <path d="M-32,-7 Q-38,-7 -38,-3 Q-38,1 -32,1 Q-26,1 -26,5 Q-26,9 -32,9"/>
      <!-- A -->
      <line x1="-22" y1="9" x2="-16" y2="-7"/>
      <line x1="-16" y1="-7" x2="-10" y2="9"/>
      <line x1="-19" y1="3" x2="-13" y2="3"/>
      <!-- W (worn, partially illegible — broken strokes) -->
      <line x1="-6" y1="-7" x2="-2" y2="9"/>
      <line x1="-2" y1="9" x2="2" y2="-3"/>
      <line x1="2" y1="-3" x2="6" y2="9"/>
      <!-- gap (worn) -->
      <!-- I -->
      <line x1="14" y1="-7" x2="14" y2="9"/>
      <line x1="10" y1="-7" x2="18" y2="-7"/>
      <line x1="10" y1="9" x2="18" y2="9"/>
      <!-- T (worn at top) -->
      <line x1="22" y1="-5" x2="32" y2="-5" opacity="0.55"/>
      <line x1="27" y1="-5" x2="27" y2="9"/>
    </g>
    <!-- Highlight catching scanner light on the cruder marks -->
    <g fill="none" stroke="#a888ff" stroke-width="0.4" stroke-linecap="round" opacity="0.55" filter="url(#i6p11p4bloom)">
      <line x1="-46" y1="-7" x2="-46" y2="9"/>
      <line x1="-22" y1="9" x2="-16" y2="-7"/>
      <line x1="-16" y1="-7" x2="-10" y2="9"/>
      <line x1="14" y1="-7" x2="14" y2="9"/>
    </g>
    <!-- Faint date below "1843" or similar partially visible -->
    <g fill="none" stroke="#1a0c04" stroke-width="0.55" stroke-linecap="round" opacity="0.55">
      <!-- 1 -->
      <line x1="-30" y1="20" x2="-30" y2="30"/>
      <!-- 8 partial -->
      <circle cx="-22" cy="22" r="2" fill="none"/>
      <circle cx="-22" cy="28" r="2" fill="none"/>
      <!-- 4 -->
      <line x1="-14" y1="20" x2="-14" y2="26"/>
      <line x1="-14" y1="26" x2="-8" y2="26"/>
      <line x1="-8" y1="20" x2="-8" y2="30"/>
      <!-- 0 (partially scratched out) -->
      <ellipse cx="-2" cy="25" rx="2" ry="3" fill="none"/>
    </g>
  </g>

  <!-- COBWEB across timber faintly catching scanner light -->
  <g stroke="#5a4838" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M280,40 Q340,60 280,100"/>
    <path d="M460,80 Q400,100 460,140"/>
  </g>

  <!-- Earth floor at very bottom -->
  <rect x="0" y="340" width="742" height="24" fill="#0a0408"/>

  <!-- ===== THEODORE — left foreground, holding Luma in palm, leaning forward ===== -->
  <g transform="translate(140 340)">
    <ellipse cx="-7" cy="0" rx="9" ry="3" fill="#1a0c04"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#1a0c04"/>
    <path d="M-10,-44 L-2,-44 L-4,0 L-12,0 Z" fill="url(#i6p11p4theoTrousers)"/>
    <path d="M2,-44 L10,-44 L12,0 L4,0 Z" fill="url(#i6p11p4theoTrousers)"/>
    <rect x="-12" y="-22" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="3" y="-20" width="9" height="11" fill="#5a3018" stroke="#3a1808" stroke-width="0.45" opacity="0.85"/>
    <rect x="-10" y="-44" width="22" height="3" fill="#3a1808"/>
    <!-- Shirt + waistcoat -->
    <path d="M-11,-100 L-10,-44 L11,-44 L12,-100 Z" fill="#d4c4a8"/>
    <path d="M-13,-98 L-11,-44 L-2,-44 L-2,-98 Z" fill="url(#i6p11p4theoWaistcoat)"/>
    <path d="M12,-98 L13,-44 L2,-44 L2,-98 Z" fill="url(#i6p11p4theoWaistcoat)"/>
    <path d="M-6,-100 L0,-98 L6,-100 L6,-96 L0,-94 L-6,-96 Z" fill="#d4c4a8"/>

    <!-- LEFT arm extended forward holding palm with Luma -->
    <path d="M-13,-98 L-32,-86 L-50,-78 L-66,-72 L-66,-66 L-32,-78 Z" fill="url(#i6p11p4theoWaistcoat)"/>
    <!-- Linen sleeve cuff -->
    <ellipse cx="-66" cy="-70" rx="3" ry="1.4" fill="#d4c4a8"/>
    <!-- Hand extended forward -->
    <path d="M-66,-72 L-90,-66 L-100,-58 L-94,-54 L-66,-62 Z" fill="#a87838"/>
    <!-- Open palm -->
    <path d="M-100,-58 L-118,-50 L-120,-42 L-110,-40 L-94,-50 Z" fill="#a87838"/>
    <!-- Brass gear ring -->
    <g transform="translate(-115 -45)">
      <circle cx="0" cy="0" r="1.6" fill="none" stroke="#c89058" stroke-width="0.85" filter="url(#i6p11p4bloom)"/>
      <circle cx="0" cy="0" r="1.6" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.85" filter="url(#i6p11p4bloom)"/>
    </g>

    <!-- Right arm at side, slightly forward (gesture indicating "look") -->
    <path d="M12,-98 L24,-78 L26,-58 L20,-58 L18,-72 Z" fill="url(#i6p11p4theoWaistcoat)"/>
    <ellipse cx="26" cy="-58" rx="2.4" ry="1.4" fill="#a87838"/>

    <!-- Head — tilted slightly toward beam, looking at marks -->
    <rect x="-3" y="-108" width="6" height="8" fill="#a87838"/>
    <ellipse cx="2" cy="-118" rx="13" ry="14" fill="#a87838"/>
    <!-- Underlight from palm -->
    <ellipse cx="2" cy="-114" rx="11" ry="3" fill="#a888ff" opacity="0.45" filter="url(#i6p11p4bloom)"/>
    <path d="M-10,-126 Q-7,-136 2,-138 Q11,-136 14,-126 L14,-118 Q10,-124 2,-124 Q-6,-124 -10,-118 Z" fill="#9a7038"/>
    <path d="M-5,-134 L-3,-138 L-6,-138 Z" fill="#9a7038"/>
    <path d="M7,-134 L9,-138 L6,-138 Z" fill="#9a7038"/>
    <!-- Eyes shifting RIGHT toward beam -->
    <ellipse cx="0" cy="-118" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="1" cy="-118" r="0.7" fill="#5a3818"/>
    <ellipse cx="6" cy="-118" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="7" cy="-118" r="0.7" fill="#5a3818"/>
    <path d="M-4,-124 L1,-124" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M5,-124 L10,-124" stroke="#5a3018" stroke-width="0.55"/>
    <path d="M0,-110 L4,-110" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== LUMA on Theodore's palm, hand reaching toward glyph (not touching) ===== -->
  <g transform="translate(28 290)">
    <ellipse cx="-2" cy="14" rx="2.4" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="14" rx="2.4" ry="1.4" fill="#0a0408"/>
    <rect x="-3" y="6" width="2" height="8" fill="url(#i6p11p4lumaSuit)"/>
    <rect x="2" y="6" width="2" height="8" fill="url(#i6p11p4lumaSuit)"/>
    <!-- Torso -->
    <path d="M-5,6 L-5,-6 L5,-6 L5,6 Z" fill="url(#i6p11p4lumaSuit)"/>
    <!-- Shoulders -->
    <path d="M-5,-6 Q-3,-10 0,-11 Q3,-10 5,-6 Z" fill="url(#i6p11p4lumaSuit)"/>
    <!-- LEFT arm extended FORWARD + UP toward glyph (not touching) — fingers spread -->
    <path d="M-5,-6 L-12,-9 L-22,-12 L-22,-10 L-12,-7 L-5,-3 Z" fill="url(#i6p11p4lumaSuit)"/>
    <!-- Hand with fingers spread (reaching) -->
    <path d="M-22,-12 L-26,-13 L-26,-9 L-22,-10 Z" fill="#7a4838"/>
    <!-- Spread fingertips -->
    <line x1="-26" y1="-13" x2="-30" y2="-15" stroke="#7a4838" stroke-width="0.85"/>
    <line x1="-26" y1="-12" x2="-30" y2="-13" stroke="#7a4838" stroke-width="0.85"/>
    <line x1="-26" y1="-11" x2="-30" y2="-11" stroke="#7a4838" stroke-width="0.85"/>
    <line x1="-26" y1="-10" x2="-30" y2="-9" stroke="#7a4838" stroke-width="0.85"/>

    <!-- RIGHT arm at side -->
    <path d="M5,-6 L9,-2 L9,2 L5,-2 Z" fill="url(#i6p11p4lumaSuit)"/>
    <ellipse cx="9" cy="2" rx="1.4" ry="0.85" fill="#7a4838"/>

    <!-- Head -->
    <ellipse cx="0" cy="-14" rx="3.5" ry="4" fill="#7a4838"/>
    <!-- Hair -->
    <path d="M-4,-16 Q-2,-18 0,-18 Q2,-18 4,-16 L4,-13 Q1,-15 0,-15 Q-1,-15 -4,-13 Z" fill="#0a0604"/>
    <!-- Lenses -->
    <ellipse cx="-1" cy="-14" rx="1" ry="0.85" fill="#a888ff" opacity="0.55" filter="url(#i6p11p4bloom)"/>
    <ellipse cx="1.4" cy="-14" rx="1" ry="0.85" fill="#a888ff" opacity="0.55" filter="url(#i6p11p4bloom)"/>
    <circle cx="-1" cy="-14" r="0.4" fill="#fff8ff"/>
    <circle cx="1.4" cy="-14" r="0.4" fill="#fff8ff"/>
    <!-- Mouth slightly open — staggered -->
    <ellipse cx="0" cy="-11" rx="0.85" ry="0.55" fill="#3a1808"/>

    <!-- Palm she stands on (continues from Theodore's outstretched hand) -->
    <path d="M-12,18 L20,18 L20,28 L-12,28 Z" fill="#a87838"/>
    <path d="M-22,18 L-12,18 L-12,28 L-22,28 Z" fill="#a87838"/>

    <!-- Bright aura around her -->
    <ellipse cx="0" cy="-2" rx="14" ry="18" fill="#a888ff" opacity="0.45" filter="url(#i6p11p4glow)"/>
  </g>

  <!-- LUMA dialogue 1 — "A glyph. Our language. But simplified..." -->
  <g>
    <rect x="14" y="14" width="404" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="200,54 212,54 204,64" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="200.5" y1="54" x2="211.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">A glyph. Our language. But simplified — adapted for a non-speaker.</text>

  <!-- LUMA dialogue 2 — voice breaking -->
  <g>
    <rect x="468" y="64" width="262" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
    <polygon points="540,104 552,104 544,114" fill="white" stroke="#5a3ad8" stroke-width="0.85" stroke-dasharray="2 1.5"/>
    <line x1="540.5" y1="104" x2="551.5" y2="104" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="476" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700" font-style="italic">LUMA (voice breaking)</text>
  <text x="476" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Someone taught a human to read this.</text>

  <!-- THEODORE dialogue -->
  <g>
    <rect x="14" y="294" width="402" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="200,294 212,294 204,284" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="200.5" y1="294" x2="211.5" y2="294" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">And someone wrote back. Look — below it. That's English.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
  </g>
</svg>
