<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 460" width="366" height="460">
  <title>Issue 6 — Page 19 — Panel 4: Sable's face — command mask redirecting, but the reader can see the seams</title>
  <desc>85mm close-up. Sable's face redirecting conversation with operational focus. Mask at full strength. But faintest tension at corner of jaw. Eyes steady because she is making them steady. Cool blue-white camp glow. Silver-white hair catches light. Everything is normal. Everything is controlled. The face of someone holding a mask so well only the reader can see the seams.</desc>

  <defs>
    <linearGradient id="i6p19p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <radialGradient id="i6p19p4perimeter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a5a98" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a1428" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i6p19p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="50%" stop-color="#5a3a28"/>
      <stop offset="100%" stop-color="#3a2418"/>
    </linearGradient>
    <linearGradient id="i6p19p4suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8e4f8"/>
      <stop offset="50%" stop-color="#7898c8"/>
      <stop offset="100%" stop-color="#3a4868"/>
    </linearGradient>
    <filter id="i6p19p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p19p4glow"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="i6p19p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="366" height="460" fill="url(#i6p19p4bg)"/>
  <ellipse cx="183" cy="230" rx="220" ry="140" fill="url(#i6p19p4perimeter)" filter="url(#i6p19p4strongglow)"/>

  <!-- Background timber beam suggestions -->
  <rect x="0" y="0" width="20" height="460" fill="#1a1410"/>
  <rect x="346" y="0" width="20" height="460" fill="#1a1410"/>
  <line x1="20" y1="40" x2="20" y2="420" stroke="#7898c8" stroke-width="0.55" opacity="0.55" filter="url(#i6p19p4bloom)"/>
  <line x1="346" y1="40" x2="346" y2="420" stroke="#7898c8" stroke-width="0.55" opacity="0.55" filter="url(#i6p19p4bloom)"/>

  <!-- ===== SABLE — close-up, framed center ===== -->
  <g transform="translate(183 280)">
    <!-- Shoulders / suit -->
    <path d="M-130,200 L-110,80 L-70,40 L70,40 L110,80 L130,200 Z" fill="url(#i6p19p4suit)"/>
    <line x1="0" y1="40" x2="0" y2="200" stroke="#fff" stroke-width="0.85" opacity="0.95" filter="url(#i6p19p4bloom)"/>
    <!-- Soot bloom right shoulder -->
    <ellipse cx="80" cy="60" rx="32" ry="12" fill="#1a1814" opacity="0.85"/>
    <ellipse cx="-50" cy="100" rx="20" ry="6" fill="#3a3828" opacity="0.55"/>

    <!-- Tension-wear collar crease (more visible) -->
    <line x1="-22" y1="48" x2="-16" y2="60" stroke="#0a0a14" stroke-width="0.85" opacity="0.95"/>
    <line x1="-14" y1="48" x2="-8" y2="60" stroke="#0a0a14" stroke-width="0.7" opacity="0.85"/>
    <line x1="8" y1="48" x2="14" y2="60" stroke="#0a0a14" stroke-width="0.7" opacity="0.85"/>
    <line x1="16" y1="48" x2="22" y2="60" stroke="#0a0a14" stroke-width="0.85" opacity="0.95"/>

    <!-- Neck -->
    <path d="M-14,0 L-16,40 L16,40 L14,0 Z" fill="url(#i6p19p4skin)"/>
    <path d="M-16,30 L16,30" stroke="#3a2418" stroke-width="0.55" opacity="0.85"/>

    <!-- Head -->
    <ellipse cx="0" cy="-42" rx="48" ry="56" fill="url(#i6p19p4skin)"/>

    <!-- Cheekbone definition -->
    <path d="M-44,-30 Q-38,-2 -22,18" fill="none" stroke="#1a0c08" stroke-width="0.85" opacity="0.85"/>
    <path d="M44,-30 Q38,-2 22,18" fill="none" stroke="#1a0c08" stroke-width="0.85" opacity="0.85"/>

    <!-- Buzz cut catching cool light -->
    <path d="M-40,-78 Q-40,-94 0,-100 Q40,-94 40,-78 L38,-66 Q22,-72 0,-72 Q-22,-72 -38,-66 Z" fill="#d8e4f8" filter="url(#i6p19p4bloom)"/>
    <!-- Hair detail -->
    <line x1="-36" y1="-78" x2="-30" y2="-78" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>
    <line x1="-30" y1="-78" x2="-22" y2="-79" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>
    <line x1="-20" y1="-79" x2="-10" y2="-80" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>
    <line x1="-10" y1="-80" x2="0" y2="-80" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>
    <line x1="0" y1="-80" x2="10" y2="-80" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>
    <line x1="10" y1="-80" x2="20" y2="-79" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>
    <line x1="22" y1="-79" x2="30" y2="-78" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>
    <line x1="30" y1="-78" x2="36" y2="-78" stroke="#a8c0e8" stroke-width="0.55" opacity="0.95"/>

    <!-- Eyes — STEADY (made to be steady) -->
    <ellipse cx="-18" cy="-40" rx="9" ry="3.5" fill="#fff8e8"/>
    <ellipse cx="18" cy="-40" rx="9" ry="3.5" fill="#fff8e8"/>
    <circle cx="-17" cy="-40" r="3" fill="#1a1c30"/>
    <circle cx="19" cy="-40" r="3" fill="#1a1c30"/>
    <circle cx="-16" cy="-41" r="0.85" fill="#fff"/>
    <circle cx="20" cy="-41" r="0.85" fill="#fff"/>
    <!-- Lower lid tension -->
    <path d="M-26,-36 Q-18,-34 -10,-36" stroke="#3a2418" stroke-width="0.55" opacity="0.85" fill="none"/>
    <path d="M26,-36 Q18,-34 10,-36" stroke="#3a2418" stroke-width="0.55" opacity="0.85" fill="none"/>

    <!-- Brow — level, controlled -->
    <path d="M-30,-58 Q-20,-60 -8,-58" stroke="#0a0604" stroke-width="2.4" fill="none"/>
    <path d="M30,-58 Q20,-60 8,-58" stroke="#0a0604" stroke-width="2.4" fill="none"/>

    <!-- Nose -->
    <path d="M-4,-36 L-6,-12 L0,-6 L6,-12 L4,-36 Z" fill="#3a2418" opacity="0.85"/>
    <ellipse cx="-2" cy="-8" rx="1.4" ry="0.85" fill="#1a0c08"/>
    <ellipse cx="2" cy="-8" rx="1.4" ry="0.85" fill="#1a0c08"/>

    <!-- Mouth — neutral, slight tightening -->
    <path d="M-12,8 Q0,10 12,8" stroke="#0a0604" stroke-width="1.4" fill="none"/>

    <!-- TENSION at corner of JAW — micro-detail (the seam) -->
    <ellipse cx="-30" cy="14" rx="3" ry="2" fill="#3a2418" opacity="0.85"/>
    <ellipse cx="30" cy="14" rx="3" ry="2" fill="#3a2418" opacity="0.85"/>
    <line x1="-32" y1="10" x2="-28" y2="18" stroke="#1a0c08" stroke-width="0.55" opacity="0.85"/>

    <!-- Earring catching light (small) -->
    <ellipse cx="-46" cy="-22" rx="1" ry="0.85" fill="#d8e4f8" filter="url(#i6p19p4bloom)"/>
  </g>

  <!-- SABLE dialogue 1 -->
  <g>
    <rect x="14" y="14" width="280" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="160,54 172,54 164,64" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="160.5" y1="54" x2="171.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Status on the power cell integration?</text>

  <!-- WREN off-panel -->
  <g>
    <rect x="64" y="64" width="240" height="40" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="72" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN  <tspan font-style="italic" font-size="8" font-weight="500">(off-panel)</tspan></text>
  <text x="72" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">I'll have a report by morning.</text>

  <!-- SABLE close-out -->
  <g>
    <rect x="220" y="394" width="130" height="40" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95"/>
    <polygon points="260,434 272,434 264,444" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="260.5" y1="434" x2="271.5" y2="434" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="228" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="228" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Good.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1c30" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,160 Q100,162 200,158 Q280,156 366,160"/>
    <path d="M0,380 Q100,382 200,378 Q280,376 366,380"/>
  </g>
</svg>
