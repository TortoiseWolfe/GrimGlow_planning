<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 270.5" width="494" height="270.5">
  <title>Issue 6 — Page 12 — Panel 3: Two-shot — Theodore + Luma exchange — partnership beat</title>
  <desc>50mm two-shot eye level. Theodore holds Luma at chest height in cupped hand, close to pocket. They look at each other. Scale stark — his face fills upper frame, her body on his palm below. Equals exchanging the moment. Blue-violet scanner glow only light source.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="i6p12p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="i6p12p3lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#2a1058"/>
    </linearGradient>
    <linearGradient id="i6p12p3leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="i6p12p3linen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a6c50"/>
      <stop offset="100%" stop-color="#5a4838"/>
    </linearGradient>
    <radialGradient id="i6p12p3scanGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a888ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="i6p12p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i6p12p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="494" height="270.5" fill="url(#i6p12p3bg)"/>

  <!-- The blue-violet scanner glow between them — only light source -->
  <ellipse cx="247" cy="135" rx="200" ry="140" fill="url(#i6p12p3scanGlow)" filter="url(#i6p12p3glow)"/>

  <!-- ===== THEODORE — upper frame, his face large ===== -->
  <g transform="translate(247 110)">
    <!-- Linen collar bottom -->
    <path d="M-90,80 L-30,70 L30,70 L90,80 L90,160 L-90,160 Z" fill="url(#i6p12p3linen)"/>
    <!-- Waistcoat edges -->
    <path d="M-90,80 L-50,72 L-50,160 L-90,160 Z" fill="url(#i6p12p3leather)"/>
    <path d="M50,72 L90,80 L90,160 L50,160 Z" fill="url(#i6p12p3leather)"/>
    <!-- Pocket on right -->
    <rect x="50" y="92" width="22" height="34" fill="#3a1808" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="52" y="96" width="18" height="26" fill="#5a3ad8" opacity="0.4"/>

    <!-- Neck -->
    <rect x="-15" y="50" width="30" height="22" fill="#a87838"/>

    <!-- Head — eyes DOWN at Luma in his hand below -->
    <ellipse cx="0" cy="-2" rx="80" ry="80" fill="#a87838"/>
    <!-- Underlight from Luma's scanner below -->
    <ellipse cx="0" cy="50" rx="44" ry="14" fill="#a888ff" opacity="0.55" filter="url(#i6p12p3bloom)"/>
    <ellipse cx="0" cy="40" rx="32" ry="9" fill="#a888ff" opacity="0.4"/>
    <!-- Hair sandy-brown -->
    <path d="M-66,-30 Q-66,-66 -34,-78 Q0,-86 34,-78 Q66,-66 66,-30 L62,-12 Q34,-44 0,-44 Q-34,-44 -62,-12 Z" fill="#9a7038"/>
    <!-- Tousled tufts -->
    <path d="M-22,-78 L-18,-86 L-14,-76 Z" fill="#9a7038"/>
    <path d="M-2,-86 L2,-94 L6,-84 Z" fill="#9a7038"/>
    <path d="M18,-78 L24,-86 L28,-76 Z" fill="#9a7038"/>
    <!-- Eyes looking DOWN -->
    <ellipse cx="-22" cy="2" rx="9" ry="4" fill="#fff8e8"/>
    <circle cx="-22" cy="4" r="3" fill="#5a3818"/>
    <circle cx="-21" cy="3" r="0.85" fill="#fff8ff"/>
    <ellipse cx="22" cy="2" rx="9" ry="4" fill="#fff8e8"/>
    <circle cx="22" cy="4" r="3" fill="#5a3818"/>
    <circle cx="23" cy="3" r="0.85" fill="#fff8ff"/>
    <!-- Eyelids -->
    <path d="M-32,-2 L-12,-1" stroke="#1a0c04" stroke-width="1.2"/>
    <path d="M-32,8 L-12,8" stroke="#3a1808" stroke-width="0.7"/>
    <path d="M12,-1 L32,-2" stroke="#1a0c04" stroke-width="1.2"/>
    <path d="M12,8 L32,8" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Brows drawn down — concerned/protective -->
    <path d="M-34,-12 L-14,-14" stroke="#5a3018" stroke-width="2"/>
    <path d="M14,-14 L34,-12" stroke="#5a3018" stroke-width="2"/>
    <!-- Worry crease -->
    <line x1="-3" y1="-12" x2="-1" y2="-2" stroke="#5a3018" stroke-width="0.55" opacity="0.7"/>
    <line x1="3" y1="-12" x2="1" y2="-2" stroke="#5a3018" stroke-width="0.55" opacity="0.7"/>
    <!-- Freckles -->
    <circle cx="-15" cy="20" r="0.7" fill="#7a3018"/>
    <circle cx="-7" cy="22" r="0.7" fill="#7a3018"/>
    <circle cx="0" cy="24" r="0.7" fill="#7a3018"/>
    <circle cx="7" cy="22" r="0.7" fill="#7a3018"/>
    <circle cx="15" cy="20" r="0.7" fill="#7a3018"/>
    <!-- Nose -->
    <path d="M0,4 L-4,22 L0,26 L4,22 Z" fill="#7a4828" opacity="0.65"/>
    <line x1="-4" y1="22" x2="4" y2="22" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>
    <!-- Mouth slightly open (about to speak) -->
    <ellipse cx="0" cy="40" rx="6" ry="2" fill="#3a1808"/>
    <path d="M-9,38 L9,38" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- ===== THEODORE'S CUPPED HAND at chest height + LUMA on it ===== -->
  <g transform="translate(247 240)">
    <!-- Cupped palm -->
    <path d="M-80,-20 L-90,10 L-80,30 L80,30 L90,10 L80,-20 Z" fill="#a87838"/>
    <!-- Fingers curling up at sides (cupping shape) -->
    <path d="M-80,-20 L-100,-30 L-110,-10 L-90,10 Z" fill="#a87838"/>
    <path d="M80,-20 L100,-30 L110,-10 L90,10 Z" fill="#a87838"/>
    <!-- Palm creases -->
    <path d="M-60,-10 Q0,-2 60,-10" stroke="#5a3028" stroke-width="0.55" fill="none" opacity="0.7"/>
    <path d="M-50,8 Q0,14 50,8" stroke="#5a3028" stroke-width="0.55" fill="none" opacity="0.7"/>
    <line x1="-70" y1="-10" x2="-50" y2="20" stroke="#5a3028" stroke-width="0.55" opacity="0.55"/>
    <line x1="70" y1="-10" x2="50" y2="20" stroke="#5a3028" stroke-width="0.55" opacity="0.55"/>
    <!-- Oil stains -->
    <ellipse cx="-30" cy="14" rx="9" ry="3" fill="#0a0604" opacity="0.55"/>
    <ellipse cx="40" cy="10" rx="11" ry="3" fill="#0a0604" opacity="0.55"/>
    <!-- Brass gear ring on left index (curling up at left) -->
    <g transform="translate(-100 -15)">
      <circle cx="0" cy="0" r="3" fill="none" stroke="#c89058" stroke-width="1.4" filter="url(#i6p12p3bloom)"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#a888ff" stroke-width="0.4" opacity="0.85" filter="url(#i6p12p3bloom)"/>
    </g>

    <!-- ===== LUMA standing on palm — looking UP at Theodore ===== -->
    <g transform="translate(0 -12)">
      <!-- Body -->
      <ellipse cx="-3" cy="14" rx="3" ry="1.6" fill="#0a0408"/>
      <ellipse cx="4" cy="14" rx="3" ry="1.6" fill="#0a0408"/>
      <rect x="-5" y="2" width="3" height="12" fill="url(#i6p12p3lumaSuit)"/>
      <rect x="3" y="2" width="3" height="12" fill="url(#i6p12p3lumaSuit)"/>
      <ellipse cx="-3" cy="9" rx="2" ry="0.7" fill="#5a3018" opacity="0.85"/>
      <ellipse cx="4" cy="9" rx="2" ry="0.7" fill="#5a3018" opacity="0.85"/>
      <!-- Torso -->
      <path d="M-7,2 L-7,-12 L7,-12 L7,2 Z" fill="url(#i6p12p3lumaSuit)"/>
      <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#a888ff" stroke-width="0.55" opacity="0.85" filter="url(#i6p12p3bloom)"/>
      <!-- Heavy brick + cobweb dust on suit (issue progression) -->
      <ellipse cx="-5" cy="0" rx="3" ry="0.85" fill="#5a3018" opacity="0.85"/>
      <ellipse cx="5" cy="0" rx="3" ry="0.85" fill="#5a3018" opacity="0.85"/>
      <line x1="-7" y1="-8" x2="-3" y2="-4" stroke="#7a6c50" stroke-width="0.4" opacity="0.55"/>
      <!-- Shoulders -->
      <path d="M-7,-12 Q-5,-16 0,-17 Q5,-16 7,-12 Z" fill="url(#i6p12p3lumaSuit)"/>
      <!-- Arms at sides (slight openness — meeting his eyes) -->
      <path d="M-7,-12 L-12,-8 L-12,4 L-7,2 Z" fill="url(#i6p12p3lumaSuit)"/>
      <path d="M7,-12 L12,-8 L12,4 L7,2 Z" fill="url(#i6p12p3lumaSuit)"/>
      <!-- Hands -->
      <ellipse cx="-12" cy="4" rx="1.4" ry="1" fill="#7a4838"/>
      <ellipse cx="12" cy="4" rx="1.4" ry="1" fill="#7a4838"/>

      <!-- Head — looking UP at Theodore -->
      <ellipse cx="0" cy="-22" rx="6" ry="7" fill="#7a4838"/>
      <!-- Underlight on chin -->
      <ellipse cx="0" cy="-19" rx="4" ry="2" fill="#a888ff" opacity="0.45" filter="url(#i6p12p3bloom)"/>
      <!-- Hair pulled back -->
      <path d="M-5,-26 Q-4,-30 0,-30 Q4,-30 5,-26 L5,-22 Q3,-25 0,-25 Q-3,-25 -5,-22 Z" fill="#0a0604"/>
      <!-- Sapphire filament glints -->
      <line x1="-2" y1="-28" x2="-1" y2="-30" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p12p3bloom)"/>
      <line x1="1" y1="-30" x2="2" y2="-28" stroke="#5a3ad8" stroke-width="0.55" opacity="0.85" filter="url(#i6p12p3bloom)"/>
      <!-- Braid trailing back -->
      <path d="M5,-22 Q9,-12 7,-2" stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M5,-22 Q9,-12 7,-2" stroke="#a888ff" stroke-width="0.4" fill="none" opacity="0.85" filter="url(#i6p12p3bloom)"/>
      <!-- Lenses (DIM — not flaring, not scrolling — composing herself) -->
      <ellipse cx="-2" cy="-22" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
      <ellipse cx="2" cy="-22" rx="2" ry="1.4" fill="#a888ff" opacity="0.32"/>
      <ellipse cx="-2" cy="-22" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.45" opacity="0.85" filter="url(#i6p12p3bloom)"/>
      <ellipse cx="2" cy="-22" rx="2" ry="1.4" fill="none" stroke="#a888ff" stroke-width="0.45" opacity="0.85" filter="url(#i6p12p3bloom)"/>
      <!-- Crack on left lens -->
      <line x1="-3" y1="-23" x2="-1" y2="-21" stroke="#fff8ff" stroke-width="0.4" opacity="0.85"/>
      <!-- Eyes meeting his -->
      <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
      <circle cx="-2" cy="-22" r="0.45" fill="#0a0604"/>
      <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
      <circle cx="2" cy="-22" r="0.45" fill="#0a0604"/>
      <!-- Mouth — slight resolve, jaw set -->
      <path d="M-2,-13 L2,-13" stroke="#3a1808" stroke-width="0.55"/>
    </g>
  </g>

  <!-- THEODORE dialogue -->
  <g>
    <rect x="14" y="14" width="220" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="100,54 112,54 104,64" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="100.5" y1="54" x2="111.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">There were others like you. Before.</text>

  <!-- LUMA dialogue (single short word) -->
  <g>
    <rect x="266" y="64" width="62" height="36" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="290,100 302,100 294,110" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="290.5" y1="100" x2="301.5" y2="100" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="274" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="274" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Yes.</text>

  <!-- THEODORE dialogue 2 -->
  <g>
    <rect x="14" y="118" width="220" height="40" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="100,158 112,158 104,168" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="100.5" y1="158" x2="111.5" y2="158" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">What happened to them?</text>

  <!-- LUMA dialogue 3 -->
  <g>
    <rect x="266" y="178" width="218" height="40" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="350,178 362,178 354,168" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="350.5" y1="178" x2="361.5" y2="178" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="274" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="274" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">I don't know yet. But I intend to find out.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q150,82 300,78 Q400,76 494,80"/>
    <path d="M0,250 Q150,252 300,248 Q400,246 494,250"/>
  </g>
</svg>
