<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 11 — Panel 4: CU Jink LAUGHING — head back, curls bouncing, holo brighter</title>
  <desc>CU 85mm fairy scale. Lean androgynous face laughing — head back, mouth open, wild golden curly hair bouncing. Light brown skin, bright eyes, emerald suit at collar with holo accents glowing BRIGHTER than before, responding to laughter. Real, unguarded, young laugh — someone tense for days finally letting go. Behind: coiled mainspring catches emerald glow + resembles fairy tale tower. Warm amber from behind, emerald glow brightening with delight. Youngest person being young.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p11p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p11p4candleHalo" cx="100%" cy="40%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p4emeraldBright" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p11p4jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p11p4jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p11p4emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <filter id="p11p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p11p4strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="364" fill="url(#p11p4bg)"/>
  <rect width="366" height="364" fill="url(#p11p4candleHalo)" opacity="0.85"/>

  <!-- BRIGHTENED emerald halo (laughing intensity). -->
  <ellipse cx="183" cy="200" rx="120" ry="140" fill="url(#p11p4emeraldBright)" opacity="0.85" filter="url(#p11p4strongBloom)"/>

  <!-- COILED MAINSPRING behind, catching emerald glow — fairy tale tower. -->
  <g>
    <ellipse cx="60" cy="180" rx="20" ry="6" fill="#5a3018"/>
    <g fill="none" stroke="#a85820" stroke-width="2.4">
      <ellipse cx="60" cy="180" rx="22" ry="60"/>
      <ellipse cx="60" cy="180" rx="18" ry="50"/>
      <ellipse cx="60" cy="180" rx="14" ry="40"/>
      <ellipse cx="60" cy="180" rx="10" ry="28"/>
    </g>
    <!-- Emerald rim catch making it tower-like. -->
    <g stroke="#2ed078" stroke-width="0.85" opacity="0.65" fill="none">
      <ellipse cx="60" cy="180" rx="22" ry="60"/>
    </g>
    <!-- Top "spire" of the spring. -->
    <line x1="60" y1="120" x2="60" y2="100" stroke="#a85820" stroke-width="1"/>
  </g>

  <!-- Same spring/mirror on right. -->
  <g opacity="0.75">
    <ellipse cx="306" cy="180" rx="20" ry="6" fill="#5a3018"/>
    <g fill="none" stroke="#a85820" stroke-width="2.4">
      <ellipse cx="306" cy="180" rx="22" ry="60"/>
      <ellipse cx="306" cy="180" rx="18" ry="50"/>
      <ellipse cx="306" cy="180" rx="14" ry="40"/>
    </g>
    <g stroke="#2ed078" stroke-width="0.85" opacity="0.65" fill="none">
      <ellipse cx="306" cy="180" rx="22" ry="60"/>
    </g>
  </g>

  <!-- ******** JINK LAUGHING ******** -->
  <g>
    <!-- Body — slight back-arch (laughter pose). -->
    <path d="M152,232 Q140,260 144,290 L222,290 Q226,260 214,232 Z" fill="url(#p11p4emeraldSuit)"/>

    <!-- Head — TILTED BACK (laughing). -->
    <ellipse cx="183" cy="180" rx="60" ry="74" fill="url(#p11p4jinkSkin)"/>

    <!-- WILD CURLY HAIR — bouncing (slightly chaotic, motion). -->
    <g fill="url(#p11p4jinkHair)">
      <ellipse cx="124" cy="120" rx="14" ry="20"/>
      <ellipse cx="146" cy="100" rx="16" ry="22"/>
      <ellipse cx="174" cy="86" rx="18" ry="24"/>
      <ellipse cx="200" cy="86" rx="18" ry="24"/>
      <ellipse cx="226" cy="100" rx="16" ry="22"/>
      <ellipse cx="248" cy="120" rx="14" ry="20"/>
      <!-- Bouncing curls offset upward (motion blur effect). -->
      <ellipse cx="158" cy="80" rx="14" ry="18"/>
      <ellipse cx="190" cy="74" rx="14" ry="18"/>
      <ellipse cx="216" cy="80" rx="14" ry="18"/>
      <!-- Side curls. -->
      <ellipse cx="120" cy="148" rx="12" ry="18"/>
      <ellipse cx="252" cy="148" rx="12" ry="18"/>
    </g>
    <!-- Warm rim. -->
    <g stroke="#fff0a8" stroke-width="1.4" opacity="0.85" fill="none">
      <ellipse cx="174" cy="78" rx="18" ry="22"/>
      <ellipse cx="200" cy="78" rx="18" ry="22"/>
    </g>

    <!-- Eyes — squinting/closed in laughter. -->
    <path d="M138,180 Q150,178 162,180" fill="none" stroke="#3a2810" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M204,180 Q216,178 228,180" fill="none" stroke="#3a2810" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Tiny eye crinkles. -->
    <path d="M126,176 L132,180" stroke="#3a2810" stroke-width="0.6"/>
    <path d="M234,176 L240,180" stroke="#3a2810" stroke-width="0.6"/>

    <!-- Brows raised happy. -->
    <path d="M126,158 Q150,150 174,158" fill="none" stroke="#3a2810" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M192,158 Q216,150 240,158" fill="none" stroke="#3a2810" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M183,196 L170,224 Q183,228 196,224 Z" fill="#7a4828" opacity="0.55"/>

    <!-- WIDE OPEN MOUTH — laughing. -->
    <ellipse cx="183" cy="246" rx="22" ry="10" fill="#1a0c04"/>
    <ellipse cx="183" cy="246" rx="22" ry="10" fill="none" stroke="#5a3018" stroke-width="1"/>
    <!-- Inside dark. -->
    <ellipse cx="183" cy="246" rx="18" ry="6" fill="#0a0402"/>
    <!-- Upper teeth. -->
    <line x1="167" y1="240" x2="167" y2="246" stroke="#dcd0b4" stroke-width="0.8"/>
    <line x1="173" y1="240" x2="173" y2="246" stroke="#dcd0b4" stroke-width="0.8"/>
    <line x1="180" y1="240" x2="180" y2="246" stroke="#dcd0b4" stroke-width="0.8"/>
    <line x1="186" y1="240" x2="186" y2="246" stroke="#dcd0b4" stroke-width="0.8"/>
    <line x1="193" y1="240" x2="193" y2="246" stroke="#dcd0b4" stroke-width="0.8"/>
    <line x1="199" y1="240" x2="199" y2="246" stroke="#dcd0b4" stroke-width="0.8"/>
    <!-- Bottom teeth. -->
    <line x1="170" y1="252" x2="170" y2="256" stroke="#dcd0b4" stroke-width="0.7"/>
    <line x1="180" y1="252" x2="180" y2="256" stroke="#dcd0b4" stroke-width="0.7"/>
    <line x1="190" y1="252" x2="190" y2="256" stroke="#dcd0b4" stroke-width="0.7"/>

    <!-- Cheek glow strong. -->
    <ellipse cx="116" cy="220" rx="20" ry="14" fill="#ffd078" opacity="0.45"/>
    <ellipse cx="250" cy="220" rx="20" ry="14" fill="#ffd078" opacity="0.45"/>

    <!-- Holo collar accents BRIGHTER (responding to laugh). -->
    <circle cx="183" cy="270" r="3" fill="#a8ffd0" filter="url(#p11p4bloom)"/>
    <circle cx="183" cy="270" r="5" fill="#a8ffd0" opacity="0.55" filter="url(#p11p4strongBloom)"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- JINK balloon — top, laughing line. -->
  <rect x="14" y="14" width="240" height="78" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M148,92 L160,92 L180,236 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="148" y1="92" x2="160" y2="92" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="24" y="50"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-style="italic" font-weight="500"
        fill="#5a4030">(laughing)</text>
  <text x="24" y="70"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">A — a light that leads people into</text>
  <text x="24" y="86"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">bogs? That's what they think we are?</text>

</svg>
