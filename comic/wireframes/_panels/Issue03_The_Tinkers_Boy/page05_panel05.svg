<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238.2 364" width="238.2" height="364">
  <title>Issue 3 — Page 5 — Panel 5: MED Theodore walks away with shard pocketed</title>
  <desc>MED 50mm eye level. Theodore walks away down alley, parcel under one arm, other hand in trouser pocket curled around something. Shoulders set differently — quicker step, new alertness, posture of a boy carrying a secret. Through wool of trouser pocket, faintest cool blue-white glow bleeds through fabric. Alley empty behind him, grey and damp. He glances back once. Weight of the hidden thing.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p5p5alleyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1a1408"/>
    </linearGradient>
    <linearGradient id="p5p5brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2818"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="p5p5soot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1208" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p5p5cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#2a2418"/>
    </linearGradient>
    <radialGradient id="p5p5skyHint" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8a89e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5a5a56" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p5p5theoSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8c0"/>
      <stop offset="100%" stop-color="#9a7050"/>
    </linearGradient>
    <linearGradient id="p5p5theoShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <linearGradient id="p5p5theoVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p5p5theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a24"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p5p5theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#5a4020"/>
    </radialGradient>
    <radialGradient id="p5p5pocketGlow">
      <stop offset="0%" stop-color="#a0d8ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#5090e0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p5p5brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#5a4838"/>
    </linearGradient>
    <filter id="p5p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p5p5fabricBlur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- BG: dim alley + grey light from above. -->
  <rect width="238.2" height="364" fill="url(#p5p5alleyBg)"/>
  <rect width="238.2" height="364" fill="url(#p5p5skyHint)"/>

  <!-- Brick walls. -->
  <rect x="0" y="0" width="34" height="364" fill="url(#p5p5brick)"/>
  <rect x="0" y="0" width="34" height="364" fill="url(#p5p5soot)"/>
  <g stroke="#1a0e08" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="40" x2="34" y2="40"/>
    <line x1="0" y1="76" x2="34" y2="76"/>
    <line x1="0" y1="112" x2="34" y2="112"/>
    <line x1="0" y1="148" x2="34" y2="148"/>
    <line x1="0" y1="184" x2="34" y2="184"/>
    <line x1="0" y1="220" x2="34" y2="220"/>
    <line x1="0" y1="256" x2="34" y2="256"/>
    <line x1="0" y1="292" x2="34" y2="292"/>
  </g>

  <rect x="204.2" y="0" width="34" height="364" fill="url(#p5p5brick)"/>
  <rect x="204.2" y="0" width="34" height="364" fill="url(#p5p5soot)"/>
  <g stroke="#1a0e08" stroke-width="0.5" opacity="0.65">
    <line x1="204.2" y1="40" x2="238.2" y2="40"/>
    <line x1="204.2" y1="76" x2="238.2" y2="76"/>
    <line x1="204.2" y1="112" x2="238.2" y2="112"/>
    <line x1="204.2" y1="148" x2="238.2" y2="148"/>
    <line x1="204.2" y1="184" x2="238.2" y2="184"/>
    <line x1="204.2" y1="220" x2="238.2" y2="220"/>
    <line x1="204.2" y1="256" x2="238.2" y2="256"/>
    <line x1="204.2" y1="292" x2="238.2" y2="292"/>
  </g>

  <!-- Damp cobblestones. -->
  <rect x="34" y="280" width="170.2" height="84" fill="url(#p5p5cobble)"/>
  <g stroke="#1a1208" stroke-width="0.6" opacity="0.7">
    <line x1="34" y1="298" x2="204.2" y2="298"/>
    <line x1="34" y1="316" x2="204.2" y2="316"/>
    <line x1="34" y1="334" x2="204.2" y2="334"/>
    <line x1="34" y1="352" x2="204.2" y2="352"/>
  </g>
  <g stroke="#3a3428" stroke-width="0.4" opacity="0.55">
    <line x1="60" y1="282" x2="64" y2="298"/>
    <line x1="100" y1="282" x2="104" y2="298"/>
    <line x1="140" y1="282" x2="144" y2="298"/>
    <line x1="180" y1="282" x2="184" y2="298"/>
    <line x1="76" y1="300" x2="80" y2="316"/>
    <line x1="116" y1="300" x2="120" y2="316"/>
    <line x1="156" y1="300" x2="160" y2="316"/>
  </g>
  <!-- Damp puddle. -->
  <ellipse cx="80" cy="350" rx="14" ry="2" fill="#a8a8a4" opacity="0.4"/>

  <!-- Faint scorch mark visible behind him on the cobbles (the spot where he found the shard, now empty). -->
  <g opacity="0.6">
    <ellipse cx="180" cy="332" rx="22" ry="8" fill="#0a0402"/>
    <g stroke="#0a0402" stroke-width="0.7" opacity="0.85">
      <line x1="180" y1="332" x2="170" y2="320"/>
      <line x1="180" y1="332" x2="190" y2="320"/>
      <line x1="180" y1="332" x2="166" y2="332"/>
      <line x1="180" y1="332" x2="194" y2="332"/>
      <line x1="180" y1="332" x2="170" y2="344"/>
      <line x1="180" y1="332" x2="190" y2="344"/>
    </g>
  </g>

  <!-- THEODORE — walking away from viewer (from camera) but slightly turned so we see his profile/half-back.
       Position: center, forward-walking pose with one hand in pocket.
       Per script: "He glances back once" — so head turned slightly back toward viewer. -->
  <g>
    <!-- Cast shadow under boots. -->
    <ellipse cx="120" cy="346" rx="22" ry="2.5" fill="#000" opacity="0.5"/>

    <!-- Trousers — one leg forward (mid-step), other back. -->
    <path d="M104,256 Q98,294 104,338 L122,338 Q128,300 124,256 Z" fill="url(#p5p5theoTrousers)"/>
    <path d="M124,256 Q124,294 130,338 L148,338 Q152,300 146,256 Z" fill="url(#p5p5theoTrousers)"/>
    <!-- Knee patch. -->
    <rect x="106" y="282" width="8" height="6" fill="#3a2010" opacity="0.85"/>
    <!-- Boots. -->
    <ellipse cx="112" cy="342" rx="9" ry="3" fill="#1a0c04"/>
    <ellipse cx="138" cy="342" rx="9" ry="3" fill="#1a0c04"/>

    <!-- TROUSER POCKET on right hip with cool glow bleeding through fabric.
         Script: "the faintest cool blue-white glow bleeds through the fabric". -->
    <g>
      <!-- Pocket area on right hip (image-right of trouser). -->
      <ellipse cx="142" cy="282" rx="12" ry="9" fill="url(#p5p5pocketGlow)" filter="url(#p5p5fabricBlur)"/>
      <!-- Pocket flap line. -->
      <path d="M132,272 Q138,270 152,274" fill="none" stroke="#1a0c04" stroke-width="0.6"/>
      <!-- Subtle blue-white halo bleeding through fabric. -->
      <ellipse cx="142" cy="282" rx="6" ry="4" fill="#a0d8ff" opacity="0.32" filter="url(#p5p5bloom)"/>
    </g>

    <!-- Linen shirt + brown waistcoat torso. -->
    <path d="M86,176 Q80,228 88,256 L160,256 Q168,228 162,176 Q156,168 124,168 Q92,168 86,176 Z" fill="url(#p5p5theoShirt)"/>
    <path d="M90,184 L88,256 L160,256 L160,184 L150,190 L142,196 L124,202 L108,196 L98,190 Z" fill="url(#p5p5theoVest)"/>
    <line x1="124" y1="202" x2="124" y2="256" stroke="#1a0c04" stroke-width="0.4" opacity="0.7"/>
    <circle cx="124" cy="214" r="1" fill="url(#p5p5brass)"/>
    <circle cx="124" cy="226" r="1" fill="url(#p5p5brass)"/>
    <circle cx="124" cy="238" r="1" fill="url(#p5p5brass)"/>
    <path d="M114,168 L124,188 L134,168 Z" fill="url(#p5p5theoShirt)"/>
    <circle cx="124" cy="184" r="1.6" fill="url(#p5p5brass)"/>
    <rect x="88" y="252" width="72" height="4" fill="#3a2010"/>

    <!-- LEFT ARM holding parcel under arm. -->
    <path d="M86,178 Q76,216 78,256 L88,256 Q90,218 92,184 Z" fill="url(#p5p5theoShirt)"/>
    <ellipse cx="80" cy="262" rx="5" ry="3" fill="url(#p5p5theoSkin)"/>
    <!-- Parcel. -->
    <rect x="64" y="226" width="22" height="32" rx="2" fill="#a89878"/>
    <line x1="75" y1="226" x2="75" y2="258" stroke="#5a4838" stroke-width="0.5"/>
    <line x1="64" y1="240" x2="86" y2="240" stroke="#5a4838" stroke-width="0.5"/>
    <circle cx="75" cy="240" r="1.4" fill="#3a2010"/>

    <!-- RIGHT ARM — hand IN trouser pocket (curled around shard). -->
    <path d="M162,178 Q172,216 170,256 L160,256 Q158,218 156,184 Z" fill="url(#p5p5theoShirt)"/>
    <!-- Forearm bent forward into pocket. -->
    <path d="M160,256 Q160,266 156,278 L142,282 Q150,266 152,256 Z" fill="url(#p5p5theoSkin)"/>
    <!-- Hand disappearing into pocket. -->
    <path d="M142,278 Q146,288 144,294" stroke="#1a0c04" stroke-width="0.5" fill="none"/>

    <!-- HEAD — turned PARTIALLY BACK (glancing back over shoulder, alert). -->
    <path d="M116,156 L116,170 L132,170 L132,156 Z" fill="url(#p5p5theoSkin)"/>
    <ellipse cx="124" cy="138" rx="16" ry="18" fill="url(#p5p5theoSkin)"/>
    <!-- Tousled spikes. -->
    <path d="M110,124 Q108,104 124,98 Q134,96 138,100 Q140,114 138,124 L135,128 Q132,114 126,110 L120,110 Q116,114 114,128 Z" fill="url(#p5p5theoHair)"/>
    <path d="M114,102 L112,90 L118,102 Z" fill="url(#p5p5theoHair)"/>
    <path d="M122,98 L122,86 L128,98 Z" fill="url(#p5p5theoHair)"/>
    <path d="M130,100 L134,88 L134,102 Z" fill="url(#p5p5theoHair)"/>
    <!-- Bangs. -->
    <path d="M114,120 L116,130 L120,120 Z" fill="url(#p5p5theoHair)"/>
    <path d="M124,122 L124,132 L128,122 Z" fill="url(#p5p5theoHair)"/>
    <path d="M132,120 L132,130 L138,120 Z" fill="url(#p5p5theoHair)"/>
    <!-- Sides. -->
    <path d="M110,124 Q108,144 116,158 L120,158 Q116,150 116,124 Z" fill="url(#p5p5theoHair)"/>
    <path d="M138,124 Q140,144 132,158 L128,158 Q132,150 132,124 Z" fill="url(#p5p5theoHair)"/>

    <!-- Eyes — looking BACK toward viewer (alert glance). -->
    <ellipse cx="119" cy="138" rx="1.4" ry="0.8" fill="#3a2810"/>
    <ellipse cx="129" cy="138" rx="1.4" ry="0.8" fill="#3a2810"/>
    <!-- Pupils slid LEFT (looking back). -->
    <ellipse cx="117" cy="138" rx="0.6" ry="0.7" fill="#0a0604"/>
    <ellipse cx="127" cy="138" rx="0.6" ry="0.7" fill="#0a0604"/>
    <!-- Brows alert. -->
    <path d="M115,134 Q119,132 123,134" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <path d="M125,134 Q129,132 133,134" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <!-- Nose. -->
    <path d="M124,144 L122,154 Q124,156 126,154 Z" fill="#a8765a" opacity="0.55"/>
    <!-- Mouth — closed, set differently (carrying secret). -->
    <line x1="120" y1="160" x2="128" y2="160" stroke="#7a3018" stroke-width="0.9"/>
    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.85">
      <circle cx="116" cy="148" r="0.5"/>
      <circle cx="120" cy="150" r="0.45"/>
      <circle cx="128" cy="148" r="0.5"/>
      <circle cx="132" cy="150" r="0.45"/>
    </g>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#1a1208" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M120,200 Q160,205 220,202"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- No dialogue per script. -->
</svg>
