<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 13 — Panel 4: Naming moment, Jink "...Yeah. I guess I do."</title>
  <desc>MED 35mm low angle from workbench level. Jink in foreground at left of frame seen from behind/profile — wild golden curls, line of emerald suit visible, head tilted in consideration. Beyond and above to right, Theodore's face looms enormous lit golden by candlelight — hazel eyes open and hopeful, sandy hair, freckles, watching for reaction. Word "fairy" hangs unspoken between. Jink's emerald accents glow at collar and spine. Theodore's face warm amber. Cool and warm light at closest — emerald glow framed by golden skin. Scale vast but emotional distance closing.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p13p4nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p13p4candleHalo" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p13p4emeraldHalo" cx="20%" cy="50%" r="20%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p13p4bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p13p4theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p13p4theoSkinWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="p13p4theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p13p4jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p13p4jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p13p4emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <filter id="p13p4bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p13p4deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="742" height="364" fill="url(#p13p4nightBg)"/>
  <!-- Candle halo from upper-right (Theodore's side). -->
  <ellipse cx="500" cy="180" rx="380" ry="280" fill="url(#p13p4candleHalo)" opacity="0.85"/>
  <!-- Emerald halo around Jink (lower-left). -->
  <ellipse cx="160" cy="200" rx="100" ry="120" fill="url(#p13p4emeraldHalo)" opacity="0.85" filter="url(#p13p4deepBloom)"/>

  <!-- Bench. -->
  <rect x="0" y="280" width="742" height="84" fill="url(#p13p4bench)"/>
  <line x1="0" y1="280" x2="742" y2="280" stroke="#7a4828" stroke-width="2"/>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.45">
    <path d="M120,280 Q126,360 116,364"/>
    <path d="M280,280 Q286,360 276,364"/>
    <path d="M460,280 Q466,360 456,364"/>
    <path d="M620,280 Q626,360 616,364"/>
  </g>

  <!-- ******** JINK foreground LEFT, seen from behind/profile ******** -->
  <g>
    <ellipse cx="160" cy="278" rx="22" ry="3.5" fill="#000" opacity="0.55"/>

    <!-- Legs. -->
    <path d="M154,184 L150,272 L162,272 L162,184 Z" fill="url(#p13p4emeraldSuit)"/>
    <path d="M168,184 L168,200 L172,272 L184,272 L178,200 L176,184 Z" fill="url(#p13p4emeraldSuit)"/>
    <ellipse cx="156" cy="278" rx="9" ry="3" fill="#0a4018"/>
    <ellipse cx="178" cy="278" rx="9" ry="3" fill="#0a4018"/>

    <!-- Torso seen from behind/3-quarter rear. -->
    <path d="M138,116 Q132,160 144,184 L188,184 Q200,160 192,116 Q188,108 165,108 Q142,108 138,116 Z" fill="url(#p13p4emeraldSuit)"/>
    <!-- Spine seam. -->
    <line x1="165" y1="108" x2="165" y2="184" stroke="#0a4018" stroke-width="0.85"/>
    <!-- Holo accents at SPINE (visible from behind). -->
    <circle cx="165" cy="124" r="1.8" fill="#a8ffd0" filter="url(#p13p4bloom)"/>
    <circle cx="165" cy="146" r="1.8" fill="#a8ffd0" filter="url(#p13p4bloom)"/>
    <circle cx="165" cy="170" r="1.8" fill="#a8ffd0" filter="url(#p13p4bloom)"/>
    <!-- Soot streak. -->
    <path d="M138,140 Q165,138 192,142 Q194,160 192,170 L138,170 Z" fill="#1a0c04" opacity="0.7"/>
    <!-- Wing-pack stowed. -->
    <rect x="146" y="116" width="38" height="16" fill="#1a4828"/>
    <line x1="146" y1="120" x2="184" y2="120" stroke="#2ed078" stroke-width="0.85" filter="url(#p13p4bloom)"/>
    <rect x="164" y="116" width="4" height="16" fill="#0a4018"/>
    <!-- Collar holo accent (visible from rear angle). -->
    <path d="M148,108 Q165,104 184,108" fill="none" stroke="#2ed078" stroke-width="1.4" filter="url(#p13p4bloom)" opacity="0.85"/>

    <!-- Arms. -->
    <path d="M138,116 Q126,148 124,184 L138,184 Q140,150 142,120 Z" fill="url(#p13p4emeraldSuit)"/>
    <path d="M192,116 Q204,148 206,184 L192,184 Q190,150 188,120 Z" fill="url(#p13p4emeraldSuit)"/>

    <!-- Head — TILTED in consideration, slight rear/profile (looking up + right). -->
    <g transform="rotate(-12 165 90)">
      <ellipse cx="165" cy="90" rx="14" ry="16" fill="url(#p13p4jinkSkin)"/>
      <!-- Wild golden curls (back of head visible). -->
      <g fill="url(#p13p4jinkHair)">
        <ellipse cx="150" cy="74" rx="6" ry="8"/>
        <ellipse cx="160" cy="68" rx="6" ry="7"/>
        <ellipse cx="172" cy="68" rx="6" ry="7"/>
        <ellipse cx="184" cy="74" rx="6" ry="8"/>
        <ellipse cx="154" cy="84" rx="5" ry="6"/>
        <ellipse cx="166" cy="80" rx="5" ry="6"/>
        <ellipse cx="178" cy="84" rx="5" ry="6"/>
        <ellipse cx="148" cy="92" rx="5" ry="7"/>
        <ellipse cx="184" cy="92" rx="5" ry="7"/>
        <ellipse cx="172" cy="100" rx="5" ry="6"/>
      </g>
      <!-- Edge of profile — partial right cheek + half-grin visible (softened, considering). -->
      <ellipse cx="180" cy="92" rx="4" ry="6" fill="url(#p13p4jinkSkin)"/>
      <!-- Half-grin (edge visible, softened). -->
      <path d="M179,98 Q183,100 184,98" fill="none" stroke="#5a3018" stroke-width="0.7" stroke-linecap="round"/>
      <!-- Edge of nostril. -->
      <ellipse cx="183" cy="92" rx="0.8" ry="0.4" fill="#5a3018" opacity="0.5"/>
      <!-- Edge of right eye lashes (visible from profile, looking up). -->
      <path d="M178,86 Q182,84 184,86" fill="none" stroke="#3a2810" stroke-width="0.85" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ******** THEODORE face above and to right — looms ******** -->
  <g>
    <!-- Face. -->
    <ellipse cx="500" cy="120" rx="170" ry="160" fill="url(#p13p4theoSkin)"/>
    <ellipse cx="500" cy="120" rx="170" ry="160" fill="url(#p13p4theoSkinWarm)" opacity="0.7"/>
    <!-- Lower jaw / chin visible above bench surface. -->
    <path d="M340,260 Q500,300 660,260 L660,280 Q500,310 340,280 Z" fill="#5a3018" opacity="0.55"/>

    <!-- Hair tousled top frame. -->
    <g fill="url(#p13p4theoHair)">
      <path d="M348,40 Q336,-10 420,-26 Q500,-38 580,-26 Q664,-10 652,40 L644,50 Q628,-12 600,-22 L400,-22 Q372,-12 356,50 Z"/>
      <path d="M360,-18 L348,-58 L378,-12 Z"/>
      <path d="M398,-30 L388,-78 L424,-22 Z"/>
      <path d="M444,-38 L450,-94 L478,-30 Z"/>
      <path d="M496,-44 L504,-104 L520,-36 Z"/>
      <path d="M548,-38 L578,-86 L562,-22 Z"/>
      <path d="M600,-30 L632,-72 L618,-12 Z"/>
      <!-- Bangs. -->
      <path d="M356,50 L360,90 L382,42 Z"/>
      <path d="M400,68 L404,108 L426,60 Z"/>
      <path d="M446,80 L450,120 L470,72 Z"/>
      <path d="M488,86 L492,126 L512,76 Z"/>
      <path d="M530,86 L534,126 L554,76 Z"/>
      <path d="M572,80 L576,120 L596,72 Z"/>
      <path d="M614,68 L618,108 L640,60 Z"/>
    </g>

    <!-- EYES — open, hopeful, watching for reaction. -->
    <!-- Left eye. -->
    <ellipse cx="430" cy="116" rx="20" ry="14" fill="#fff8e8"/>
    <ellipse cx="430" cy="116" rx="20" ry="14" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <circle cx="430" cy="116" r="9" fill="url(#p13p4theoHair)"/>
    <circle cx="430" cy="116" r="4.5" fill="#0a0604"/>
    <ellipse cx="436" cy="113" rx="2.5" ry="1.5" fill="#fff8e8" filter="url(#p13p4bloom)"/>
    <ellipse cx="434" cy="113" rx="1.4" ry="0.7" fill="#ffffff"/>
    <!-- Right eye. -->
    <ellipse cx="566" cy="116" rx="20" ry="14" fill="#fff8e8"/>
    <ellipse cx="566" cy="116" rx="20" ry="14" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <circle cx="566" cy="116" r="9" fill="url(#p13p4theoHair)"/>
    <circle cx="566" cy="116" r="4.5" fill="#0a0604"/>
    <ellipse cx="572" cy="113" rx="2.5" ry="1.5" fill="#fff8e8" filter="url(#p13p4bloom)"/>
    <ellipse cx="570" cy="113" rx="1.4" ry="0.7" fill="#ffffff"/>

    <!-- Brows — soft, expectant. -->
    <path d="M408,92 Q430,84 452,92" fill="none" stroke="#3a2810" stroke-width="3" stroke-linecap="round"/>
    <path d="M544,92 Q566,84 588,92" fill="none" stroke="#3a2810" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M500,140 L478,200 Q500,210 522,200 Z" fill="#a8765a" opacity="0.55"/>
    <ellipse cx="486" cy="194" rx="4" ry="2" fill="#3a2010"/>
    <ellipse cx="514" cy="194" rx="4" ry="2" fill="#3a2010"/>

    <!-- Mouth — slightly open, hopeful waiting. -->
    <path d="M460,232 Q500,238 540,232 L538,244 Q500,250 462,244 Z" fill="#3a1408"/>
    <path d="M464,234 L538,234 L536,242 L466,242 Z" fill="#fff8e8" opacity="0.78"/>

    <!-- Cheekbones with slight cool emerald reflection (closest contact). -->
    <ellipse cx="394" cy="180" rx="22" ry="14" fill="#ffd078" opacity="0.42"/>
    <ellipse cx="606" cy="180" rx="22" ry="14" fill="#ffd078" opacity="0.42"/>
    <!-- Subtle emerald reflection from Jink on Theodore's cheek/chin (light meeting). -->
    <ellipse cx="430" cy="220" rx="20" ry="10" fill="#2ed078" opacity="0.18" filter="url(#p13p4bloom)"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.95">
      <circle cx="412" cy="170" r="1.4"/>
      <circle cx="426" cy="178" r="1.2"/>
      <circle cx="442" cy="170" r="1.4"/>
      <circle cx="556" cy="170" r="1.4"/>
      <circle cx="570" cy="178" r="1.2"/>
      <circle cx="588" cy="170" r="1.4"/>
    </g>
  </g>

  <!-- DIALOGUE: Jink "...Yeah. I guess I do." — quiet, after a beat. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="240" height="56" rx="12" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M70,296 L82,296 L72,278 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="71.5" y1="295.5" x2="80.5" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-style="italic">...Yeah. I guess I do.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
    <path d="M0,260 Q200,265 400,262"/>
    <path d="M400,260 Q600,265 742,262"/>
  </g>
</svg>
