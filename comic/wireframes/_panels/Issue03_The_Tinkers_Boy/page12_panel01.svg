<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 12 — Panel 1: Wide EST workshop at night, Theodore silhouetted in doorway, shard glow on far bench</title>
  <desc>Wide 28mm EST human scale. Cramped Victorian tinker's workshop at night — workbenches with clockwork, hanging tools, shelves of gears, half-assembled automaton on high shelf. Room dark unlit. Theodore silhouetted in doorway against dim gaslit street, hand on latch. Attention locked on far workbench where faint geometric light pulses — small shard casting structured pale shadows. Beside shard barely visible at distance, tiny shape stands ~4 inches tall. Shape moved. Boy doesn't breathe. Near-darkness — only light: shard's cool geometric pulse + warm amber gaslight through doorway. Theodore is warm silhouette. Shard is cool focal. Tiny shape catches structured light. Moment before comprehension.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p12p1nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="p12p1plasterDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="p12p1doorAmber" cx="20%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p12p1shardPulse" cx="80%" cy="62%" r="20%">
      <stop offset="0%" stop-color="#a0d8ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5090e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p12p1streetGlow" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p12p1emeraldFigure" cx="80%" cy="68%" r="3%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p12p1bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <radialGradient id="p12p1shardCore">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a0d8ff"/>
      <stop offset="80%" stop-color="#5090e0"/>
      <stop offset="100%" stop-color="#1a2858"/>
    </radialGradient>
    <filter id="p12p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p12p1strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p12p1deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG: very dark night workshop. -->
  <rect width="742" height="364" fill="url(#p12p1nightBg)"/>
  <rect x="0" y="0" width="742" height="240" fill="url(#p12p1plasterDim)" opacity="0.85"/>

  <!-- Door amber halo (image-LEFT — door is on left). -->
  <ellipse cx="120" cy="180" rx="160" ry="160" fill="url(#p12p1doorAmber)" opacity="0.85"/>

  <!-- Shard cool pulse (image-RIGHT, far bench). -->
  <ellipse cx="588" cy="226" rx="150" ry="60" fill="url(#p12p1shardPulse)" opacity="0.85" filter="url(#p12p1strongBloom)"/>
  <ellipse cx="588" cy="226" rx="60" ry="20" fill="#a0d8ff" opacity="0.55" filter="url(#p12p1strongBloom)"/>

  <!-- DOORWAY (image-LEFT) — open doorway with gaslit street outside. -->
  <g>
    <!-- Door frame timber. -->
    <rect x="20" y="40" width="180" height="280" fill="#1a0c04"/>
    <!-- Door swung partially open inward. -->
    <path d="M40,60 L60,80 L60,300 L40,310 Z" fill="#3a1808"/>
    <!-- Door panels. -->
    <rect x="44" y="100" width="12" height="60" fill="none" stroke="#0a0402" stroke-width="0.6"/>
    <rect x="44" y="180" width="12" height="60" fill="none" stroke="#0a0402" stroke-width="0.6"/>
    <!-- Door knob. -->
    <circle cx="56" cy="200" r="2.5" fill="#a89878"/>
    <!-- OPEN DOORWAY space — bright street outside. -->
    <rect x="60" y="60" width="140" height="240" fill="url(#p12p1streetGlow)"/>
    <!-- Street suggestion. -->
    <rect x="60" y="240" width="140" height="60" fill="#3a3024" opacity="0.55"/>
    <!-- Distant gas lamp + buildings. -->
    <line x1="80" y1="100" x2="80" y2="220" stroke="#1a0c04" stroke-width="1.4"/>
    <ellipse cx="80" cy="98" rx="2" ry="3" fill="#ffd078" filter="url(#p12p1bloom)"/>
    <ellipse cx="80" cy="98" rx="22" ry="32" fill="#ffd078" opacity="0.45" filter="url(#p12p1strongBloom)"/>
    <!-- Distant building. -->
    <rect x="120" y="120" width="60" height="100" fill="#1a0c04"/>
    <rect x="135" y="140" width="10" height="20" fill="#5a3818" opacity="0.45"/>
  </g>

  <!-- Shelves silhouettes (BG). -->
  <g opacity="0.45">
    <line x1="220" y1="86" x2="500" y2="86" stroke="#3a2010" stroke-width="0.7"/>
    <circle cx="240" cy="78" r="6" fill="#1a0c04"/>
    <rect x="270" y="70" width="12" height="16" fill="#1a0c04"/>
    <circle cx="300" cy="78" r="5" fill="#1a0c04"/>
    <rect x="324" y="70" width="12" height="16" fill="#1a0c04"/>
    <circle cx="354" cy="78" r="6" fill="#1a0c04"/>
    <rect x="378" y="70" width="12" height="16" fill="#1a0c04"/>
    <circle cx="408" cy="78" r="5" fill="#1a0c04"/>
    <rect x="430" y="70" width="12" height="16" fill="#1a0c04"/>
    <circle cx="460" cy="78" r="6" fill="#1a0c04"/>
    <rect x="484" y="70" width="12" height="16" fill="#1a0c04"/>
  </g>

  <!-- Half-assembled automaton on high shelf (per script). -->
  <g opacity="0.5">
    <rect x="540" y="56" width="20" height="32" fill="#1a0c04"/>
    <circle cx="550" cy="50" r="6" fill="#1a0c04"/>
    <line x1="544" y1="68" x2="538" y2="84" stroke="#3a2010" stroke-width="1.4"/>
    <line x1="556" y1="68" x2="562" y2="84" stroke="#3a2010" stroke-width="1.4"/>
  </g>

  <!-- Wall pegs hanging tools. -->
  <g opacity="0.4">
    <line x1="280" y1="110" x2="280" y2="148" stroke="#3a2010" stroke-width="1.4"/>
    <line x1="300" y1="110" x2="300" y2="156" stroke="#3a2010" stroke-width="1.6"/>
    <line x1="320" y1="110" x2="320" y2="148" stroke="#3a2010" stroke-width="1.4"/>
    <ellipse cx="300" cy="158" rx="5" ry="2" fill="#1a0c04"/>
  </g>

  <!-- Cribbage's main bench (silhouette mid-frame). -->
  <g opacity="0.55">
    <rect x="220" y="240" width="240" height="34" fill="url(#p12p1bench)"/>
    <rect x="232" y="274" width="6" height="86" fill="#040208"/>
    <rect x="442" y="274" width="6" height="86" fill="#040208"/>
  </g>

  <!-- Theodore's BACK-CORNER bench (image-right) where shard + figure are. -->
  <g>
    <rect x="500" y="240" width="240" height="34" fill="url(#p12p1bench)"/>
    <rect x="514" y="274" width="6" height="86" fill="#040208"/>
    <rect x="734" y="274" width="6" height="86" fill="#040208"/>
    <!-- Cool glow on bench surface. -->
    <ellipse cx="588" cy="246" rx="80" ry="14" fill="#a0d8ff" opacity="0.32" filter="url(#p12p1bloom)"/>
  </g>

  <!-- THE SHARD on far bench, glowing. -->
  <g>
    <ellipse cx="586" cy="240" rx="22" ry="8" fill="#a0d8ff" opacity="0.55" filter="url(#p12p1strongBloom)"/>
    <path d="M580,242 L586,236 L594,242 L590,248 L584,248 Z" fill="#1a1a28"/>
    <path d="M582,242 L586,238 L592,242 L590,246 L584,246 Z" fill="url(#p12p1shardCore)" opacity="0.95"/>
    <circle cx="586" cy="242" r="1" fill="#ffffff" filter="url(#p12p1bloom)"/>
  </g>

  <!-- TINY FIGURE (Jink) beside shard — barely visible at this distance, catches structured light. -->
  <g>
    <!-- Cool emerald glow halo. -->
    <ellipse cx="608" cy="240" rx="14" ry="10" fill="url(#p12p1emeraldFigure)" opacity="0.85" filter="url(#p12p1bloom)"/>
    <!-- Tiny silhouette (~4 pixels at this scale). -->
    <rect x="606" y="234" width="4" height="8" fill="#2ed078"/>
    <circle cx="608" cy="232" r="2" fill="#f5d878"/>
    <!-- Wing-pack hint. -->
    <line x1="606" y1="236" x2="610" y2="236" stroke="#a8ffd0" stroke-width="0.5" filter="url(#p12p1bloom)"/>
  </g>

  <!-- Pale structured shadows from shard glow on bench/wood. -->
  <g stroke="#a0d8ff" stroke-width="0.4" opacity="0.32" fill="none">
    <line x1="500" y1="244" x2="540" y2="246"/>
    <line x1="640" y1="246" x2="700" y2="244"/>
    <path d="M540,260 Q580,262 620,260"/>
  </g>

  <!-- Floor planks at bottom. -->
  <rect x="0" y="320" width="742" height="44" fill="#040208"/>
  <line x1="0" y1="328" x2="742" y2="328" stroke="#1a0c04" stroke-width="0.7" opacity="0.65"/>
  <!-- Door light spill on floor. -->
  <ellipse cx="120" cy="340" rx="100" ry="20" fill="#ffd078" opacity="0.18"/>

  <!-- ******** THEODORE silhouette in doorway ******** -->
  <g>
    <!-- Body silhouette (against bright door). -->
    <path d="M104,180 Q98,228 106,300 L160,300 Q170,228 162,180 Q156,170 134,170 Q112,170 104,180 Z" fill="#1a0c04"/>
    <!-- Trousers (visible past coat). -->
    <path d="M114,300 Q110,330 116,360 L132,360 Q138,330 134,300 Z" fill="#1a0c04"/>
    <path d="M138,300 Q134,330 140,360 L156,360 Q162,330 158,300 Z" fill="#1a0c04"/>

    <!-- HEAD silhouette + warm rim from door light behind. -->
    <ellipse cx="133" cy="148" rx="20" ry="22" fill="#1a0c04"/>
    <!-- Tousled spike silhouettes. -->
    <path d="M114,140 Q110,118 134,108 Q150,110 156,138 L150,140 Q146,124 142,120 L124,120 Q118,124 116,140 Z" fill="#1a0c04"/>
    <path d="M118,118 L116,98 L122,116 Z" fill="#1a0c04"/>
    <path d="M128,108 L128,90 L134,108 Z" fill="#1a0c04"/>
    <path d="M140,110 L146,90 L146,114 Z" fill="#1a0c04"/>
    <!-- Warm rim from doorway light. -->
    <g stroke="#ffd078" stroke-width="0.85" opacity="0.55">
      <path d="M114,140 Q110,118 134,108"/>
      <path d="M118,98 L120,90"/>
      <path d="M128,90 L130,82"/>
    </g>

    <!-- Hand on door latch (silhouette). -->
    <ellipse cx="60" cy="200" rx="6" ry="3" fill="#1a0c04"/>
    <!-- Arm extending to latch. -->
    <path d="M104,184 Q88,196 60,200 L60,210 Q88,206 108,196 Z" fill="#1a0c04"/>

    <!-- Slight warm glow around silhouette edges. -->
    <ellipse cx="133" cy="200" rx="60" ry="120" fill="#ffd078" opacity="0.18" filter="url(#p12p1bloom)"/>
  </g>

  <!-- CAPTION — top, parchment. -->
  <rect x="270" y="14" width="320" height="40" rx="2"
        fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5"
        filter="url(#balloonShadow)"/>
  <text x="280" y="32"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="12" font-weight="700" font-style="italic"
        fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
  <text x="280" y="46"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-style="italic"
        fill="#5a4a30">He came back for the shard. He found something else.</text>

</svg>
