<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 9 — Panel 3: MW side profile both figures across the workbench</title>
  <desc>MW 35mm eye level side profile. Full Victorian workbench at night. Theodore left edge crouched at bench level, chin near surface, wide hazel eyes warm with attention. Right of center on bench surface, tiny 4-inch figure in emerald suit sits on brass gear, legs dangling, facing boy with genuine interest. Between them: landscape of clockwork — gears as boulders, springs as structures, scattered tools, small angular shard pulsing cool blue-white. Candle at far right towers over everything. They are in conversation — halting, strange, tentative. Workshop silent + dark beyond candlelight. Full dual-lighting: warm amber from candle-tower right, cool emerald from suit, cool blue-white from shard between them. Impossible becoming ordinary.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p9p3nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p9p3candleHalo" cx="90%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p3coolBridge" cx="55%" cy="60%" r="20%">
      <stop offset="0%" stop-color="#a0d8ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p3emeraldGlow" cx="68%" cy="60%" r="18%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p9p3bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="50%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p9p3brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="40%" stop-color="#f0d878"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <linearGradient id="p9p3wax" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p9p3flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5028"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="80%" stop-color="#fff0a8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="p9p3theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p9p3theoSkinWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="p9p3theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p9p3theoVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p9p3jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p9p3jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p9p3emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <radialGradient id="p9p3shardCore">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a0d8ff"/>
      <stop offset="80%" stop-color="#5090e0"/>
      <stop offset="100%" stop-color="#1a2858"/>
    </radialGradient>
    <linearGradient id="p9p3brassYel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </linearGradient>
    <filter id="p9p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p9p3strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p9p3deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="742" height="364" fill="url(#p9p3nightBg)"/>

  <!-- Candle warm halo from far-right. -->
  <ellipse cx="660" cy="180" rx="320" ry="260" fill="url(#p9p3candleHalo)" opacity="0.85"/>

  <!-- Bench surface. -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p9p3bench)"/>
  <line x1="0" y1="226" x2="742" y2="226" stroke="#7a4828" stroke-width="1"/>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.5">
    <path d="M120,226 Q140,290 122,360"/>
    <path d="M280,226 Q300,290 282,360"/>
    <path d="M440,226 Q460,290 442,360"/>
    <path d="M600,226 Q620,290 602,360"/>
  </g>

  <!-- Cool bridge of light. -->
  <ellipse cx="408" cy="240" rx="80" ry="30" fill="url(#p9p3coolBridge)" opacity="0.85" filter="url(#p9p3bloom)"/>
  <!-- Emerald around Jink. -->
  <ellipse cx="510" cy="220" rx="60" ry="80" fill="url(#p9p3emeraldGlow)" opacity="0.85" filter="url(#p9p3bloom)"/>

  <!-- BRASS GEAR Jink sits on (right of center). -->
  <g>
    <circle cx="510" cy="280" r="50" fill="url(#p9p3brass)"/>
    <circle cx="510" cy="280" r="50" fill="none" stroke="#5a3018" stroke-width="0.85"/>
    <circle cx="510" cy="280" r="16" fill="#5a3018"/>
    <ellipse cx="528" cy="258" rx="14" ry="8" fill="#fff0a8" opacity="0.55"/>
    <!-- Gear teeth around upper rim. -->
    <g stroke="#5a3018" stroke-width="0.85">
      <line x1="510" y1="230" x2="510" y2="222"/>
      <line x1="496" y1="232" x2="494" y2="222"/>
      <line x1="524" y1="232" x2="526" y2="222"/>
    </g>
  </g>

  <!-- Smaller gears + tools on bench between Theodore and gear. -->
  <g>
    <circle cx="320" cy="276" r="22" fill="url(#p9p3brass)"/>
    <circle cx="320" cy="276" r="22" fill="none" stroke="#5a3018" stroke-width="0.7"/>
    <circle cx="320" cy="276" r="6" fill="#5a3018"/>
    <!-- Coiled spring. -->
    <g fill="none" stroke="#a85820" stroke-width="1.4">
      <ellipse cx="240" cy="266" rx="14" ry="6"/>
      <ellipse cx="240" cy="266" rx="10" ry="4"/>
    </g>
    <!-- Steel file. -->
    <rect x="180" y="262" width="60" height="6" fill="#5a606a"/>
    <!-- Thimble. -->
    <path d="M380,236 Q380,260 396,266 L420,266 Q436,260 436,236 L434,234 L382,234 Z" fill="#a89878"/>
  </g>

  <!-- SHARD between Theodore and Jink. -->
  <g>
    <ellipse cx="408" cy="270" rx="22" ry="8" fill="#a0d8ff" opacity="0.55" filter="url(#p9p3deepBloom)"/>
    <ellipse cx="408" cy="270" rx="10" ry="4" fill="#a0d8ff" opacity="0.55" filter="url(#p9p3strongBloom)"/>
    <path d="M402,272 L408,266 L416,272 L412,278 L406,278 Z" fill="#1a1a28"/>
    <path d="M404,272 L408,268 L414,272 L412,276 L406,276 Z" fill="url(#p9p3shardCore)" opacity="0.95"/>
    <circle cx="408" cy="272" r="1" fill="#ffffff" filter="url(#p9p3bloom)"/>
  </g>

  <!-- THE CANDLE far right. -->
  <g>
    <rect x="650" y="100" width="34" height="120" fill="url(#p9p3wax)"/>
    <line x1="667" y1="100" x2="667" y2="220" stroke="#3a2818" stroke-width="0.6"/>
    <line x1="667" y1="80" x2="667" y2="100" stroke="#1a0c04" stroke-width="1.4"/>
    <path d="M650,80 Q658,40 667,16 Q676,40 684,80 Z" fill="url(#p9p3flame)" filter="url(#p9p3strongBloom)"/>
    <ellipse cx="667" cy="36" rx="34" ry="60" fill="#ffd078" opacity="0.45" filter="url(#p9p3deepBloom)"/>
    <ellipse cx="667" cy="222" rx="34" ry="6" fill="#a85820"/>
  </g>

  <!-- THEODORE — left side, profile, crouched at bench level, chin near surface. -->
  <g>
    <!-- Body bulk below frame. -->
    <path d="M0,180 Q-10,300 0,364 L120,364 L140,260 Q140,220 120,210 Q60,200 0,200 Z" fill="url(#p9p3theoVest)" opacity="0.85"/>
    <!-- Hand on bench surface (chin resting). -->
    <path d="M40,232 Q60,232 100,232 L140,232 Q160,234 168,242 Q160,254 140,254 L80,254 Q60,252 40,244 Z" fill="url(#p9p3theoSkin)"/>
    <ellipse cx="100" cy="246" rx="20" ry="4" fill="#1a0e06" opacity="0.32"/>
    <ellipse cx="50" cy="242" rx="6" ry="3" fill="url(#p9p3brassYel)"/>
    <ellipse cx="50" cy="242" rx="2.5" ry="1.5" fill="#3a2010"/>

    <!-- Head — profile facing right, chin on hand. -->
    <ellipse cx="80" cy="140" rx="76" ry="86" fill="url(#p9p3theoSkin)"/>
    <ellipse cx="80" cy="140" rx="76" ry="86" fill="url(#p9p3theoSkinWarm)" opacity="0.55"/>

    <!-- Spikes haloed. -->
    <path d="M14,90 Q10,30 60,8 Q90,-2 130,-4 Q160,4 158,90 L150,98 Q140,40 124,32 L36,32 Q22,40 22,98 Z" fill="url(#p9p3theoHair)"/>
    <path d="M28,18 L24,-20 L36,16 Z" fill="url(#p9p3theoHair)"/>
    <path d="M52,-2 L48,-32 L66,2 Z" fill="url(#p9p3theoHair)"/>
    <path d="M82,-12 L84,-46 L100,-8 Z" fill="url(#p9p3theoHair)"/>
    <path d="M114,-12 L130,-40 L126,-2 Z" fill="url(#p9p3theoHair)"/>
    <path d="M142,2 L156,-22 L150,16 Z" fill="url(#p9p3theoHair)"/>
    <g stroke="#ffd078" stroke-width="1.4" opacity="0.7">
      <line x1="32" y1="-10" x2="32" y2="14"/>
      <line x1="58" y1="-22" x2="58" y2="2"/>
      <line x1="90" y1="-32" x2="90" y2="-6"/>
      <line x1="120" y1="-26" x2="120" y2="-2"/>
      <line x1="146" y1="-14" x2="146" y2="10"/>
    </g>
    <!-- Bangs. -->
    <path d="M16,98 L18,134 L36,90 Z" fill="url(#p9p3theoHair)"/>
    <path d="M44,108 L46,140 L60,100 Z" fill="url(#p9p3theoHair)"/>
    <path d="M70,114 L72,148 L86,108 Z" fill="url(#p9p3theoHair)"/>
    <path d="M96,114 L98,148 L112,108 Z" fill="url(#p9p3theoHair)"/>
    <path d="M122,108 L124,140 L138,100 Z" fill="url(#p9p3theoHair)"/>

    <!-- Eye in profile (only one prominent). -->
    <ellipse cx="100" cy="138" rx="9" ry="6" fill="#fff8e8"/>
    <ellipse cx="100" cy="138" rx="9" ry="6" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <circle cx="100" cy="138" r="4" fill="url(#p9p3theoHair)"/>
    <circle cx="100" cy="138" r="2" fill="#0a0604"/>
    <ellipse cx="103" cy="136" rx="1.5" ry="0.8" fill="#a0d8ff" filter="url(#p9p3bloom)"/>
    <circle cx="100" cy="137" r="0.7" fill="#ffffff"/>
    <!-- Brow. -->
    <path d="M86,124 Q100,118 116,124" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Nose profile. -->
    <path d="M120,150 L138,176 L130,184 L122,180 Z" fill="url(#p9p3theoSkin)"/>
    <!-- Smile. -->
    <path d="M104,210 Q120,224 134,210" fill="none" stroke="#5a3018" stroke-width="2" stroke-linecap="round"/>
    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.95">
      <circle cx="68" cy="180" r="0.8"/>
      <circle cx="80" cy="186" r="0.7"/>
      <circle cx="96" cy="180" r="0.85"/>
    </g>
  </g>

  <!-- ******** JINK on gear (right side). ******** -->
  <g>
    <ellipse cx="510" cy="232" rx="14" ry="3" fill="#000" opacity="0.45"/>

    <!-- Legs dangling off gear. -->
    <path d="M504,234 Q500,260 500,278 L508,278 Q510,260 512,236 Z" fill="url(#p9p3emeraldSuit)"/>
    <path d="M518,236 L518,260 L518,278 L526,278 Q526,260 524,234 Z" fill="url(#p9p3emeraldSuit)"/>
    <ellipse cx="504" cy="282" rx="5" ry="2" fill="#0a4018"/>
    <ellipse cx="522" cy="282" rx="5" ry="2" fill="#0a4018"/>

    <!-- Torso (sitting forward-leaning). -->
    <path d="M498,180 Q494,220 502,234 L526,234 Q534,220 530,180 Q526,176 514,176 Q500,176 498,180 Z" fill="url(#p9p3emeraldSuit)"/>
    <!-- Soot. -->
    <path d="M498,206 Q514,204 530,208 Q532,214 532,222 L498,222 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="514" y1="176" x2="514" y2="234" stroke="#0a4018" stroke-width="0.4"/>
    <circle cx="514" cy="190" r="1.3" fill="#a8ffd0" filter="url(#p9p3bloom)"/>

    <!-- Arms. -->
    <path d="M498,180 Q488,206 488,232 L500,232 Q500,210 502,184 Z" fill="url(#p9p3emeraldSuit)"/>
    <path d="M530,180 Q540,206 540,232 L528,232 Q528,210 526,184 Z" fill="url(#p9p3emeraldSuit)"/>
    <ellipse cx="490" cy="234" rx="3" ry="2" fill="url(#p9p3jinkSkin)"/>
    <ellipse cx="538" cy="234" rx="3" ry="2" fill="url(#p9p3jinkSkin)"/>

    <!-- Wing-pack. -->
    <rect x="502" y="178" width="24" height="12" fill="#1a4828"/>
    <line x1="502" y1="181" x2="526" y2="181" stroke="#2ed078" stroke-width="0.7" filter="url(#p9p3bloom)"/>

    <!-- Head — facing left toward Theodore. -->
    <ellipse cx="514" cy="158" rx="11" ry="13" fill="url(#p9p3jinkSkin)"/>
    <g fill="url(#p9p3jinkHair)">
      <ellipse cx="500" cy="142" rx="5" ry="6"/>
      <ellipse cx="510" cy="138" rx="5" ry="6"/>
      <ellipse cx="520" cy="138" rx="5" ry="6"/>
      <ellipse cx="528" cy="142" rx="5" ry="6"/>
      <ellipse cx="504" cy="148" rx="4" ry="5"/>
      <ellipse cx="514" cy="146" rx="4" ry="5"/>
      <ellipse cx="524" cy="148" rx="4" ry="5"/>
    </g>
    <!-- Eye in profile (left-facing). -->
    <ellipse cx="508" cy="158" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="508" cy="158" rx="2" ry="1.4" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="508" cy="158" r="1" fill="#2a4830"/>
    <circle cx="508" cy="158" r="0.5" fill="#0a0604"/>
    <!-- Nose profile. -->
    <path d="M506,162 L502,168 L506,170 Z" fill="url(#p9p3jinkSkin)"/>
    <!-- Conversational grin. -->
    <path d="M504,176 Q510,178 516,176" fill="none" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
    <path d="M0,310 Q200,315 400,312"/>
    <path d="M400,310 Q600,315 742,312"/>
  </g>

  <!-- JINK + THEODORE balloons across top. Three-line exchange. -->
  <!-- JINK first balloon (top-left, tail down to her position). -->
  <rect x="14" y="14" width="240" height="62" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M222,76 L234,76 L500,156 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="222" y1="76" x2="234" y2="76" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="24" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Not very good at it? I've been watching</text>
  <text x="24" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">you work. You're the best thing in this building.</text>

  <!-- THEODORE balloon (middle, tail down to his head — beat, flushing). -->
  <rect x="266" y="14" width="220" height="62" rx="8"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M276,76 L288,76 L100,140 Z"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="276" y1="76" x2="288" y2="76" stroke="#ffffff" stroke-width="3"/>
  <text x="276" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#6a4220" letter-spacing="0.3">THEODORE</text>
  <text x="276" y="50"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-style="italic" font-weight="500"
        fill="#5a4030">(beat, flushing)</text>
  <text x="276" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">You've been watching?</text>

  <!-- JINK 2nd balloon (top-right). -->
  <rect x="498" y="14" width="220" height="62" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M508,76 L520,76 L508,156 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="508" y1="76" x2="520" y2="76" stroke="#ffffff" stroke-width="3"/>
  <text x="508" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="508" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Couple days now. You're</text>
  <text x="508" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">interesting. The old man isn't.</text>

</svg>
