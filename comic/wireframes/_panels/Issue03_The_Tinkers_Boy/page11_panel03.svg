<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 11 — Panel 3: MW conversation banner — Hobday legend mention, "what's a will-o'-the-wisp?"</title>
  <desc>MW 35mm side profile both. Theodore left rests chin on crossed arms at bench edge, leaning in, warm + engaged. Jink right on thimble rim, leaning forward, genuine interest. Clockwork landscape between — gears, springs, scattered tools. Candle far right towers. Body language LOOSENED — halting strangeness replaced by rhythm of real exchange. Continuity: Hobday's pub story already spreading from Issue 2 P22. Three lights creating intimate warmth. The first real conversation of two lives.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p11p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p11p3candleHalo" cx="90%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p3coolBridge" cx="50%" cy="60%" r="14%">
      <stop offset="0%" stop-color="#a0d8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p3emerald" cx="68%" cy="60%" r="18%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p11p3bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="50%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p11p3brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <linearGradient id="p11p3wax" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p11p3flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5028"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="p11p3theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p11p3theoSkinWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="p11p3theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p11p3theoVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p11p3jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p11p3jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p11p3emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p11p3thimble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a6858"/>
      <stop offset="50%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <radialGradient id="p11p3shardCore">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a0d8ff"/>
      <stop offset="100%" stop-color="#1a2858"/>
    </radialGradient>
    <linearGradient id="p11p3brassYel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </linearGradient>
    <filter id="p11p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p11p3strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p11p3deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="742" height="364" fill="url(#p11p3bg)"/>
  <ellipse cx="660" cy="180" rx="320" ry="260" fill="url(#p11p3candleHalo)" opacity="0.85"/>

  <!-- Bench surface. -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p11p3bench)"/>
  <line x1="0" y1="226" x2="742" y2="226" stroke="#7a4828" stroke-width="1"/>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.5">
    <path d="M120,226 Q140,290 122,360"/>
    <path d="M280,226 Q300,290 282,360"/>
    <path d="M460,226 Q480,290 442,360"/>
    <path d="M600,226 Q620,290 602,360"/>
  </g>

  <!-- Cool bridge of light. -->
  <ellipse cx="370" cy="240" rx="50" ry="20" fill="url(#p11p3coolBridge)" opacity="0.85" filter="url(#p11p3bloom)"/>
  <!-- Emerald around Jink. -->
  <ellipse cx="510" cy="200" rx="60" ry="80" fill="url(#p11p3emerald)" opacity="0.85" filter="url(#p11p3bloom)"/>

  <!-- Tools landscape between figures. -->
  <g>
    <circle cx="280" cy="276" r="22" fill="url(#p11p3brass)"/>
    <circle cx="280" cy="276" r="6" fill="#5a3018"/>
    <ellipse cx="296" cy="262" rx="6" ry="3" fill="#fff0a8" opacity="0.55"/>
    <g fill="none" stroke="#a85820" stroke-width="1.4">
      <ellipse cx="200" cy="262" rx="14" ry="6"/>
      <ellipse cx="200" cy="262" rx="10" ry="4"/>
    </g>
    <rect x="160" y="260" width="50" height="6" fill="#5a606a"/>
  </g>

  <!-- THIMBLE — Jink's seat. -->
  <g>
    <path d="M462,200 Q462,256 502,262 L520,262 Q560,256 560,200 L558,196 L464,196 Z" fill="url(#p11p3thimble)"/>
    <ellipse cx="510" cy="200" rx="48" ry="8" fill="#1a0c04" opacity="0.85"/>
    <g fill="#5a4838" opacity="0.6">
      <circle cx="476" cy="218" r="1.4"/>
      <circle cx="494" cy="214" r="1.4"/>
      <circle cx="514" cy="214" r="1.4"/>
      <circle cx="534" cy="214" r="1.4"/>
      <circle cx="552" cy="218" r="1.4"/>
      <circle cx="486" cy="232" r="1.4"/>
      <circle cx="510" cy="228" r="1.4"/>
      <circle cx="534" cy="232" r="1.4"/>
    </g>
    <ellipse cx="552" cy="220" rx="10" ry="22" fill="#fff0a8" opacity="0.55"/>
  </g>

  <!-- SHARD between figures. -->
  <g>
    <ellipse cx="370" cy="262" rx="22" ry="8" fill="#a0d8ff" opacity="0.55" filter="url(#p11p3deepBloom)"/>
    <path d="M364,264 L370,258 L378,264 L374,270 L368,270 Z" fill="#1a1a28"/>
    <path d="M366,264 L370,260 L376,264 L374,268 L368,268 Z" fill="url(#p11p3shardCore)" opacity="0.95"/>
    <circle cx="370" cy="264" r="1" fill="#ffffff" filter="url(#p11p3bloom)"/>
  </g>

  <!-- THE CANDLE far right. -->
  <g>
    <rect x="650" y="100" width="34" height="120" fill="url(#p11p3wax)"/>
    <line x1="667" y1="80" x2="667" y2="100" stroke="#1a0c04" stroke-width="1.4"/>
    <path d="M650,80 Q658,40 667,16 Q676,40 684,80 Z" fill="url(#p11p3flame)" filter="url(#p11p3strongBloom)"/>
    <ellipse cx="667" cy="36" rx="34" ry="60" fill="#ffd078" opacity="0.45" filter="url(#p11p3deepBloom)"/>
    <ellipse cx="667" cy="222" rx="34" ry="6" fill="#a85820"/>
  </g>

  <!-- THEODORE — left, profile, chin on crossed arms at bench. -->
  <g>
    <path d="M0,180 Q-10,300 0,364 L120,364 L140,260 Q140,220 120,210 Q60,200 0,200 Z" fill="url(#p11p3theoVest)" opacity="0.85"/>
    <!-- CROSSED ARMS on bench — chin rests. -->
    <path d="M40,232 Q60,232 100,232 L180,232 Q200,234 200,242 L200,256 Q160,258 100,256 L40,254 Z" fill="url(#p11p3theoSkin)"/>
    <ellipse cx="100" cy="246" rx="50" ry="6" fill="#1a0e06" opacity="0.32"/>
    <ellipse cx="50" cy="242" rx="6" ry="3" fill="url(#p11p3brassYel)"/>
    <ellipse cx="50" cy="242" rx="2.5" ry="1.5" fill="#3a2010"/>
    <!-- Head — profile, chin on arms, leaning IN toward bench center. -->
    <ellipse cx="80" cy="156" rx="78" ry="76" fill="url(#p11p3theoSkin)"/>
    <ellipse cx="80" cy="156" rx="78" ry="76" fill="url(#p11p3theoSkinWarm)" opacity="0.55"/>
    <!-- Spikes. -->
    <path d="M14,108 Q10,52 60,28 Q90,18 130,16 Q160,24 158,108 L150,116 Q140,58 124,50 L36,50 Q22,58 22,116 Z" fill="url(#p11p3theoHair)"/>
    <path d="M28,38 L24,2 L36,36 Z" fill="url(#p11p3theoHair)"/>
    <path d="M52,18 L48,-12 L66,22 Z" fill="url(#p11p3theoHair)"/>
    <path d="M82,8 L84,-26 L100,12 Z" fill="url(#p11p3theoHair)"/>
    <path d="M114,8 L130,-20 L126,18 Z" fill="url(#p11p3theoHair)"/>
    <path d="M142,22 L156,-2 L150,36 Z" fill="url(#p11p3theoHair)"/>
    <g stroke="#ffd078" stroke-width="1.4" opacity="0.7">
      <line x1="32" y1="10" x2="32" y2="34"/>
      <line x1="58" y1="-2" x2="58" y2="22"/>
      <line x1="90" y1="-12" x2="90" y2="14"/>
      <line x1="120" y1="-6" x2="120" y2="18"/>
      <line x1="146" y1="6" x2="146" y2="30"/>
    </g>
    <!-- Bangs. -->
    <path d="M14,116 L18,148 L36,108 Z" fill="url(#p11p3theoHair)"/>
    <path d="M44,124 L48,156 L62,116 Z" fill="url(#p11p3theoHair)"/>
    <path d="M70,128 L74,160 L88,120 Z" fill="url(#p11p3theoHair)"/>
    <path d="M96,128 L100,160 L114,120 Z" fill="url(#p11p3theoHair)"/>
    <path d="M122,124 L126,156 L138,116 Z" fill="url(#p11p3theoHair)"/>

    <!-- Eye (profile). -->
    <ellipse cx="100" cy="156" rx="9" ry="6" fill="#fff8e8"/>
    <ellipse cx="100" cy="156" rx="9" ry="6" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <circle cx="100" cy="156" r="4" fill="url(#p11p3theoHair)"/>
    <circle cx="100" cy="156" r="2" fill="#0a0604"/>
    <ellipse cx="103" cy="154" rx="1.5" ry="0.8" fill="#a8ffd0" filter="url(#p11p3bloom)"/>
    <circle cx="100" cy="155" r="0.7" fill="#ffffff"/>
    <!-- Brow. -->
    <path d="M86,140 Q100,134 116,140" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Nose profile. -->
    <path d="M120,168 L138,194 L130,200 L122,196 Z" fill="url(#p11p3theoSkin)"/>
    <!-- Smile. -->
    <path d="M104,224 Q120,232 134,224" fill="none" stroke="#5a3018" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ******** JINK on thimble rim, leaning forward ******** -->
  <g>
    <ellipse cx="510" cy="216" rx="14" ry="3" fill="#000" opacity="0.45"/>

    <!-- Legs hanging into thimble. -->
    <path d="M504,218 L500,242 L508,242 L512,220 Z" fill="url(#p11p3emeraldSuit)"/>
    <path d="M518,220 L516,242 L524,242 L526,218 Z" fill="url(#p11p3emeraldSuit)"/>
    <ellipse cx="504" cy="244" rx="4" ry="2" fill="#0a4018"/>
    <ellipse cx="520" cy="244" rx="4" ry="2" fill="#0a4018"/>

    <!-- Torso leaning forward (toward Theodore at left). -->
    <path d="M498,158 Q490,200 502,218 L526,218 Q536,200 530,158 Q526,154 514,154 Q500,154 498,158 Z" fill="url(#p11p3emeraldSuit)"/>
    <!-- Soot. -->
    <path d="M498,180 Q514,178 530,182 Q532,190 532,200 L498,200 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="514" y1="154" x2="514" y2="218" stroke="#0a4018" stroke-width="0.4"/>
    <circle cx="514" cy="170" r="1.3" fill="#a8ffd0" filter="url(#p11p3bloom)"/>

    <!-- Arms — leaning forward, hands resting on thigh/thimble rim. -->
    <path d="M498,158 Q486,182 488,210 L498,212 Q500,188 502,162 Z" fill="url(#p11p3emeraldSuit)"/>
    <path d="M530,158 Q540,182 540,210 L530,212 Q528,188 526,162 Z" fill="url(#p11p3emeraldSuit)"/>
    <ellipse cx="490" cy="214" rx="3" ry="2" fill="url(#p11p3jinkSkin)"/>
    <ellipse cx="538" cy="214" rx="3" ry="2" fill="url(#p11p3jinkSkin)"/>

    <!-- Wing-pack. -->
    <rect x="500" y="156" width="28" height="12" fill="#1a4828"/>
    <line x1="500" y1="160" x2="528" y2="160" stroke="#2ed078" stroke-width="0.7" filter="url(#p11p3bloom)"/>

    <!-- Head — facing left toward Theodore (leaned forward). -->
    <ellipse cx="514" cy="138" rx="11" ry="13" fill="url(#p11p3jinkSkin)"/>
    <g fill="url(#p11p3jinkHair)">
      <ellipse cx="500" cy="124" rx="5" ry="6"/>
      <ellipse cx="510" cy="120" rx="5" ry="6"/>
      <ellipse cx="520" cy="120" rx="5" ry="6"/>
      <ellipse cx="528" cy="124" rx="5" ry="6"/>
      <ellipse cx="504" cy="130" rx="4" ry="5"/>
      <ellipse cx="514" cy="128" rx="4" ry="5"/>
      <ellipse cx="524" cy="130" rx="4" ry="5"/>
    </g>
    <!-- Eye. -->
    <ellipse cx="508" cy="138" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="508" cy="138" r="1" fill="#2a4830"/>
    <circle cx="508" cy="138" r="0.5" fill="#0a0604"/>
    <!-- Brow. -->
    <path d="M504,134 Q508,132 512,134" fill="none" stroke="#3a2810" stroke-width="0.6"/>
    <!-- Nose profile. -->
    <path d="M506,142 L502,148 L506,150 Z" fill="url(#p11p3jinkSkin)"/>
    <!-- Amused grin (last balloon line is JINK amused). -->
    <path d="M504,156 Q510,160 516,156" fill="none" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
    <path d="M0,310 Q200,315 400,312"/>
    <path d="M400,310 Q600,315 742,312"/>
  </g>

  <!-- THEODORE first balloon (top-left). -->
  <rect x="14" y="14" width="288" height="62" rx="8"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M82,76 L94,76 L100,140 Z"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="82" y1="76" x2="94" y2="76" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#6a4220" letter-spacing="0.3">THEODORE</text>
  <text x="24" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">The falling star — everyone saw it.</text>
  <text x="24" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Jack down the pub says he saw lights in a rain gutter.</text>

  <!-- JINK 1st balloon. -->
  <rect x="316" y="14" width="200" height="46" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M414,60 L426,60 L500,138 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="414" y1="60" x2="426" y2="60" stroke="#ffffff" stroke-width="3"/>
  <text x="326" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="326" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Yeah, that was us. We weren't subtle.</text>

  <!-- THEODORE 2nd. -->
  <rect x="14" y="86" width="288" height="46" rx="8"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <text x="24" y="104"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#6a4220" letter-spacing="0.3">THEODORE</text>
  <text x="24" y="124"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">People are telling stories. About fairies.</text>

  <!-- JINK amused — 2nd. -->
  <rect x="530" y="14" width="200" height="62" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M540,76 L552,76 L516,138 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="540" y1="76" x2="552" y2="76" stroke="#ffffff" stroke-width="3"/>
  <text x="540" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="540" y="50"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-style="italic" font-weight="500"
        fill="#5a4030">(amused)</text>
  <text x="540" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">What's a will-o'-the-wisp?</text>

</svg>
