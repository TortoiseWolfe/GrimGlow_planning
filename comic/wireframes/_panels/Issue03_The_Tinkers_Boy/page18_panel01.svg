<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 1112" width="742" height="1112">
  <title>Issue 3 — Page 18 — Panel 1: FULL SPLASH Jink in flight</title>
  <desc>Wide 24mm low angle from below workbench looking up into Victorian tinker's workshop transformed by light. Jink hovers center-room, four translucent holographic dragonfly wings fully deployed radiating structured emerald-white light with geometric lattice scaffolding visible. Wing-light fills workshop like green-white sun — brass tools as angular prismatic shadows, clockwork gears as prisms, wooden shelves striped with geometric patterns, ceiling alive with reflected emerald geometry. Theodore below+right kneeling at workbench, face entirely lit from above by wing-light, hazel eyes full of geometric reflections, palms open at sides — RECEIVING. Candle persists but its amber is a whisper. The image that creates mythology.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p18p1floodedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3828"/>
      <stop offset="50%" stop-color="#0a4018"/>
      <stop offset="100%" stop-color="#1a4828"/>
    </linearGradient>
    <radialGradient id="p18p1wingSun" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#a8ffd0" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#2ed078" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#0a4018" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#020a08" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="p18p1candleRemnant" cx="80%" cy="80%" r="14%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="p18p1benchSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a7858"/>
      <stop offset="100%" stop-color="#1a3828"/>
    </linearGradient>
    <radialGradient id="p18p1brassEmerald" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#a8ffd0"/>
      <stop offset="80%" stop-color="#5a8838"/>
      <stop offset="100%" stop-color="#1a3828"/>
    </radialGradient>
    <linearGradient id="p18p1theoSkinCool" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a8ffd0"/>
      <stop offset="40%" stop-color="#88c8a8"/>
      <stop offset="100%" stop-color="#5a7858"/>
    </linearGradient>
    <radialGradient id="p18p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8ffd0"/>
      <stop offset="50%" stop-color="#5a7858"/>
      <stop offset="100%" stop-color="#1a3828"/>
    </radialGradient>
    <linearGradient id="p18p1jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p18p1jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p18p1emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p18p1wingMembrane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a8868" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="p18p1prismaticEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8ffd0"/>
      <stop offset="33%" stop-color="#a8d8ff"/>
      <stop offset="66%" stop-color="#ffeca8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="p18p1bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p18p1strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p18p1deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="p18p1massiveBloom"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- BG flooded with emerald light. -->
  <rect width="742" height="1112" fill="url(#p18p1floodedBg)"/>
  <!-- Massive radiance from Jink's wings (the sun). -->
  <ellipse cx="371" cy="440" rx="640" ry="540" fill="url(#p18p1wingSun)" opacity="0.95" filter="url(#p18p1massiveBloom)"/>
  <!-- Tiny warm candle remnant lower-right. -->
  <ellipse cx="600" cy="900" rx="80" ry="40" fill="url(#p18p1candleRemnant)" opacity="0.85"/>

  <!-- ******** WORKSHOP — ceiling, walls with prismatic geometry ******** -->
  <!-- Ceiling beams (low angle perspective, converging). -->
  <g stroke="#1a3828" stroke-width="3" opacity="0.85">
    <line x1="0" y1="40" x2="80" y2="120"/>
    <line x1="180" y1="0" x2="220" y2="100"/>
    <line x1="380" y1="0" x2="380" y2="80"/>
    <line x1="540" y1="0" x2="500" y2="80"/>
    <line x1="742" y1="40" x2="660" y2="120"/>
  </g>
  <!-- Geometric reflected emerald patterns ON CEILING. -->
  <g stroke="#a8ffd0" stroke-width="0.85" opacity="0.85" filter="url(#p18p1bloom)">
    <line x1="40" y1="60" x2="100" y2="120"/>
    <line x1="100" y1="60" x2="40" y2="120"/>
    <line x1="220" y1="40" x2="260" y2="100"/>
    <line x1="260" y1="40" x2="220" y2="100"/>
    <line x1="320" y1="20" x2="380" y2="80"/>
    <line x1="380" y1="20" x2="320" y2="80"/>
    <line x1="480" y1="40" x2="540" y2="100"/>
    <line x1="540" y1="40" x2="480" y2="100"/>
    <line x1="640" y1="60" x2="700" y2="120"/>
    <line x1="700" y1="60" x2="640" y2="120"/>
  </g>

  <!-- Wooden shelves left + right with geometric striping. -->
  <g>
    <rect x="0" y="180" width="120" height="14" fill="#1a3828"/>
    <rect x="622" y="180" width="120" height="14" fill="#1a3828"/>
    <rect x="0" y="280" width="120" height="14" fill="#1a3828"/>
    <rect x="622" y="280" width="120" height="14" fill="#1a3828"/>
    <!-- Striped emerald light. -->
    <g stroke="#a8ffd0" stroke-width="2" opacity="0.85" filter="url(#p18p1bloom)">
      <line x1="20" y1="180" x2="40" y2="194"/>
      <line x1="60" y1="180" x2="80" y2="194"/>
      <line x1="100" y1="180" x2="120" y2="194"/>
      <line x1="640" y1="180" x2="660" y2="194"/>
      <line x1="680" y1="180" x2="700" y2="194"/>
      <line x1="720" y1="180" x2="742" y2="194"/>
    </g>
    <!-- Bottles/jars on shelves casting prismatic shadows. -->
    <ellipse cx="60" cy="172" rx="14" ry="22" fill="url(#p18p1brassEmerald)" opacity="0.85"/>
    <ellipse cx="660" cy="172" rx="14" ry="22" fill="url(#p18p1brassEmerald)" opacity="0.85"/>
  </g>

  <!-- Brass tools on far walls (cool emerald reflections). -->
  <g>
    <ellipse cx="120" cy="500" rx="28" ry="6" fill="url(#p18p1brassEmerald)"/>
    <ellipse cx="622" cy="500" rx="28" ry="6" fill="url(#p18p1brassEmerald)"/>
    <ellipse cx="40" cy="600" rx="22" ry="5" fill="url(#p18p1brassEmerald)"/>
    <ellipse cx="700" cy="600" rx="22" ry="5" fill="url(#p18p1brassEmerald)"/>
  </g>

  <!-- ******** BENCH at lower portion of frame ******** -->
  <rect x="0" y="780" width="742" height="100" fill="url(#p18p1benchSurface)"/>
  <line x1="0" y1="780" x2="742" y2="780" stroke="#020a08" stroke-width="2.5"/>
  <!-- Bench legs (low angle perspective). -->
  <rect x="60" y="880" width="20" height="232" fill="#020a08"/>
  <rect x="660" y="880" width="20" height="232" fill="#020a08"/>
  <!-- Geometric light projections on bench surface. -->
  <g stroke="#ffffff" stroke-width="0.85" opacity="0.85" filter="url(#p18p1bloom)">
    <line x1="40" y1="800" x2="100" y2="840"/>
    <line x1="100" y1="800" x2="40" y2="840"/>
    <line x1="200" y1="810" x2="260" y2="850"/>
    <line x1="260" y1="810" x2="200" y2="850"/>
    <line x1="500" y1="810" x2="560" y2="850"/>
    <line x1="560" y1="810" x2="500" y2="850"/>
    <line x1="640" y1="800" x2="700" y2="840"/>
    <line x1="700" y1="800" x2="640" y2="840"/>
  </g>

  <!-- Tools on bench (uplit). -->
  <g>
    <ellipse cx="180" cy="772" rx="40" ry="32" fill="url(#p18p1brassEmerald)"/>
    <circle cx="180" cy="772" r="10" fill="#1a3828"/>
    <ellipse cx="540" cy="772" rx="36" ry="28" fill="url(#p18p1brassEmerald)"/>
    <!-- Loupe. -->
    <circle cx="280" cy="772" r="22" fill="#020a08"/>
    <circle cx="280" cy="772" r="18" fill="#a8ffd0" opacity="0.55"/>
  </g>
  <!-- Candle on bench center-right (amber whisper). -->
  <g>
    <rect x="600" y="740" width="6" height="40" fill="#5a4828"/>
    <ellipse cx="603" cy="734" rx="4" ry="9" fill="#ffd078" opacity="0.85" filter="url(#p18p1strongBloom)"/>
    <ellipse cx="603" cy="700" rx="14" ry="22" fill="#ffd078" opacity="0.32" filter="url(#p18p1deepBloom)"/>
  </g>

  <!-- ******** THEODORE kneeling lower-right at bench, face up ******** -->
  <g>
    <!-- Body (kneeling, low). -->
    <path d="M380,860 Q372,950 392,1112 L580,1112 Q604,950 590,860 Z" fill="#3a5048" opacity="0.85"/>
    <!-- Vest. -->
    <path d="M400,820 L388,900 L580,900 L572,820 Z" fill="#7a6a48" opacity="0.85"/>
    <!-- Shirt. -->
    <path d="M450,800 L460,900 L520,900 L510,800 Z" fill="#a8c8a8" opacity="0.85"/>
    <!-- Buttons. -->
    <circle cx="486" cy="820" r="2" fill="#020a08"/>
    <circle cx="486" cy="840" r="2" fill="#020a08"/>
    <circle cx="486" cy="860" r="2" fill="#020a08"/>

    <!-- Arms — palms OPEN at sides (receiving). -->
    <path d="M392,820 Q360,860 350,920 L340,1010 L376,1014 L388,920 L408,820 Z" fill="url(#p18p1theoSkinCool)"/>
    <path d="M572,820 Q604,860 614,920 L624,1010 L588,1014 L576,920 L556,820 Z" fill="url(#p18p1theoSkinCool)"/>
    <!-- Open palms. -->
    <ellipse cx="350" cy="1018" rx="22" ry="14" fill="url(#p18p1theoSkinCool)"/>
    <ellipse cx="616" cy="1018" rx="22" ry="14" fill="url(#p18p1theoSkinCool)"/>
    <!-- Open fingers. -->
    <g stroke="#88c8a8" stroke-width="6" stroke-linecap="round">
      <line x1="338" y1="1014" x2="324" y2="1042"/>
      <line x1="346" y1="1018" x2="338" y2="1052"/>
      <line x1="354" y1="1018" x2="350" y2="1054"/>
      <line x1="362" y1="1016" x2="362" y2="1054"/>
      <line x1="608" y1="1014" x2="600" y2="1052"/>
      <line x1="616" y1="1018" x2="614" y2="1054"/>
      <line x1="624" y1="1018" x2="628" y2="1054"/>
      <line x1="632" y1="1016" x2="640" y2="1042"/>
    </g>
    <!-- Brass gear ring. -->
    <ellipse cx="346" cy="1014" rx="6" ry="3.5" fill="#a8ffd0"/>
    <ellipse cx="346" cy="1014" rx="6" ry="3.5" fill="none" stroke="#1a3828" stroke-width="0.4"/>

    <!-- HEAD upturned, face full visible from low angle. -->
    <ellipse cx="486" cy="760" rx="100" ry="120" fill="url(#p18p1theoSkinCool)"/>
    <!-- Hair. -->
    <g fill="url(#p18p1theoHair)">
      <path d="M392,710 Q386,656 460,640 Q486,634 514,640 Q594,656 588,710 L580,720 Q566,668 540,660 L432,660 Q412,668 398,720 Z"/>
      <path d="M398,668 L388,628 L420,672 Z"/>
      <path d="M428,648 L420,608 L448,654 Z"/>
      <path d="M464,632 L472,592 L488,646 Z"/>
      <path d="M504,632 L520,592 L516,654 Z"/>
      <path d="M540,648 L568,608 L556,672 Z"/>
      <path d="M398,720 L402,750 L420,712 Z"/>
      <path d="M438,738 L442,768 L460,720 Z"/>
      <path d="M474,748 L478,778 L496,728 Z"/>
      <path d="M510,748 L514,778 L532,728 Z"/>
      <path d="M548,738 L552,768 L570,720 Z"/>
    </g>
    <g stroke="#a8ffd0" stroke-width="2" opacity="0.85" filter="url(#p18p1bloom)">
      <line x1="406" y1="630" x2="406" y2="652"/>
      <line x1="438" y1="608" x2="438" y2="638"/>
      <line x1="476" y1="592" x2="476" y2="630"/>
      <line x1="512" y1="592" x2="512" y2="630"/>
      <line x1="548" y1="608" x2="548" y2="638"/>
    </g>

    <!-- Eyes wide, upturned, full of geometric reflections. -->
    <ellipse cx="438" cy="760" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="438" cy="760" rx="22" ry="14" fill="none" stroke="#1a3828" stroke-width="0.85"/>
    <ellipse cx="438" cy="760" rx="11" ry="11" fill="#5a7858"/>
    <ellipse cx="438" cy="760" rx="6" ry="6" fill="#0a0604"/>
    <!-- GEOMETRIC reflections in pupil. -->
    <g stroke="#a8ffd0" stroke-width="0.7" fill="none" opacity="0.85">
      <path d="M433,758 L438,754 L443,758 L438,762 Z"/>
    </g>
    <ellipse cx="442" cy="755" rx="2.5" ry="1.7" fill="#ffffff" filter="url(#p18p1bloom)"/>
    <path d="M414,748 Q438,742 462,748" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>

    <ellipse cx="534" cy="760" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="534" cy="760" rx="22" ry="14" fill="none" stroke="#1a3828" stroke-width="0.85"/>
    <ellipse cx="534" cy="760" rx="11" ry="11" fill="#5a7858"/>
    <ellipse cx="534" cy="760" rx="6" ry="6" fill="#0a0604"/>
    <g stroke="#a8ffd0" stroke-width="0.7" fill="none" opacity="0.85">
      <path d="M529,758 L534,754 L539,758 L534,762 Z"/>
    </g>
    <ellipse cx="538" cy="755" rx="2.5" ry="1.7" fill="#ffffff" filter="url(#p18p1bloom)"/>
    <path d="M510,748 Q534,742 558,748" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>

    <!-- Brows raised. -->
    <path d="M414,732 Q438,724 462,732" fill="none" stroke="#3a2810" stroke-width="3" stroke-linecap="round"/>
    <path d="M510,732 Q534,724 558,732" fill="none" stroke="#3a2810" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M486,776 L470,816 Q486,824 502,816 Z" fill="#5a7858"/>
    <ellipse cx="486" cy="816" rx="14" ry="4" fill="#a8ffd0" opacity="0.85" filter="url(#p18p1bloom)"/>

    <!-- Mouth open. -->
    <ellipse cx="486" cy="848" rx="18" ry="8" fill="#3a1408"/>
    <path d="M472,844 L500,844 L500,852 L472,852 Z" fill="#fff8e8" opacity="0.55"/>
  </g>

  <!-- ******** JINK at center-room IN FLIGHT ******** -->
  <g transform="translate(371 360)">
    <!-- Wings — 4 large translucent dragonfly wings radiating outward. -->
    <!-- Upper-left wing. -->
    <path d="M-20,-30 L-200,-180 L-340,-200 L-380,-140 L-280,-80 L-160,-30 L-60,-20 Z" fill="url(#p18p1wingMembrane)" opacity="0.85"/>
    <g stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.85" filter="url(#p18p1bloom)">
      <line x1="-340" y1="-200" x2="-60" y2="-20"/>
      <line x1="-280" y1="-150" x2="-100" y2="-30"/>
      <line x1="-200" y1="-180" x2="-200" y2="-30"/>
      <line x1="-380" y1="-140" x2="-160" y2="-30"/>
    </g>
    <path d="M-20,-30 L-200,-180 L-340,-200" fill="none" stroke="url(#p18p1prismaticEdge)" stroke-width="3" filter="url(#p18p1strongBloom)"/>

    <!-- Lower-left wing. -->
    <path d="M-20,30 L-200,180 L-340,200 L-380,140 L-280,80 L-160,30 L-60,20 Z" fill="url(#p18p1wingMembrane)" opacity="0.65"/>
    <g stroke="#ffffff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#p18p1bloom)">
      <line x1="-340" y1="200" x2="-60" y2="20"/>
      <line x1="-280" y1="150" x2="-100" y2="30"/>
    </g>
    <path d="M-20,30 L-200,180 L-340,200" fill="none" stroke="url(#p18p1prismaticEdge)" stroke-width="2.5" filter="url(#p18p1strongBloom)"/>

    <!-- Upper-right wing. -->
    <path d="M20,-30 L200,-180 L340,-200 L380,-140 L280,-80 L160,-30 L60,-20 Z" fill="url(#p18p1wingMembrane)" opacity="0.85"/>
    <g stroke="#ffffff" stroke-width="0.7" fill="none" opacity="0.85" filter="url(#p18p1bloom)">
      <line x1="340" y1="-200" x2="60" y2="-20"/>
      <line x1="280" y1="-150" x2="100" y2="-30"/>
      <line x1="200" y1="-180" x2="200" y2="-30"/>
      <line x1="380" y1="-140" x2="160" y2="-30"/>
    </g>
    <path d="M20,-30 L200,-180 L340,-200" fill="none" stroke="url(#p18p1prismaticEdge)" stroke-width="3" filter="url(#p18p1strongBloom)"/>

    <!-- Lower-right wing. -->
    <path d="M20,30 L200,180 L340,200 L380,140 L280,80 L160,30 L60,20 Z" fill="url(#p18p1wingMembrane)" opacity="0.65"/>
    <g stroke="#ffffff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#p18p1bloom)">
      <line x1="340" y1="200" x2="60" y2="20"/>
      <line x1="280" y1="150" x2="100" y2="30"/>
    </g>
    <path d="M20,30 L200,180 L340,200" fill="none" stroke="url(#p18p1prismaticEdge)" stroke-width="2.5" filter="url(#p18p1strongBloom)"/>

    <!-- Wing trail wisps. -->
    <g fill="none" stroke="#a8ffd0" stroke-width="1.4" opacity="0.65" filter="url(#p18p1bloom)">
      <path d="M-380,-140 Q-440,-130 -480,-110"/>
      <path d="M-340,200 Q-400,220 -440,240"/>
      <path d="M380,-140 Q440,-130 480,-110"/>
      <path d="M340,200 Q400,220 440,240"/>
    </g>

    <!-- ******** TINY JINK FIGURE center, flight pose ******** -->
    <!-- Legs trailing. -->
    <path d="M-6,40 L-8,86 L-2,88 L-2,40 Z" fill="url(#p18p1emeraldSuit)"/>
    <path d="M2,40 L4,86 L8,86 L8,40 Z" fill="url(#p18p1emeraldSuit)"/>
    <ellipse cx="-5" cy="88" rx="4" ry="2" fill="#0a4018"/>
    <ellipse cx="6" cy="88" rx="4" ry="2" fill="#0a4018"/>

    <!-- Torso. -->
    <path d="M-14,-12 Q-18,18 -8,40 L10,40 Q22,18 18,-12 Q14,-20 0,-20 Q-12,-20 -14,-12 Z" fill="url(#p18p1emeraldSuit)"/>
    <line x1="0" y1="-20" x2="0" y2="40" stroke="#0a4018" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="1.4" fill="#a8ffd0" filter="url(#p18p1bloom)"/>
    <circle cx="0" cy="20" r="1.4" fill="#a8ffd0" filter="url(#p18p1bloom)"/>
    <!-- Soot. -->
    <path d="M-14,8 Q0,6 18,10 Q18,28 18,34 L-14,34 Z" fill="#1a0c04" opacity="0.55"/>

    <!-- Wing-pack module bright. -->
    <rect x="-10" y="-20" width="20" height="8" fill="#1a4828"/>
    <line x1="-10" y1="-16" x2="10" y2="-16" stroke="#ffffff" stroke-width="2" filter="url(#p18p1strongBloom)"/>

    <!-- Arms outstretched (joy). -->
    <path d="M-14,-10 Q-30,-30 -40,-30 L-44,-22 Q-32,-12 -16,-2 Z" fill="url(#p18p1emeraldSuit)"/>
    <ellipse cx="-44" cy="-26" rx="3" ry="2.5" fill="url(#p18p1jinkSkin)"/>
    <path d="M14,-10 Q30,-30 40,-30 L44,-22 Q32,-12 16,-2 Z" fill="url(#p18p1emeraldSuit)"/>
    <ellipse cx="44" cy="-26" rx="3" ry="2.5" fill="url(#p18p1jinkSkin)"/>

    <!-- Head — looking down toward Theodore (right + down). -->
    <ellipse cx="0" cy="-32" rx="11" ry="13" fill="url(#p18p1jinkSkin)"/>
    <g fill="url(#p18p1jinkHair)">
      <ellipse cx="-12" cy="-46" rx="6" ry="8"/>
      <ellipse cx="-2" cy="-52" rx="6" ry="8"/>
      <ellipse cx="8" cy="-52" rx="6" ry="8"/>
      <ellipse cx="16" cy="-46" rx="6" ry="8"/>
      <ellipse cx="-16" cy="-36" rx="5" ry="7"/>
      <ellipse cx="20" cy="-36" rx="5" ry="7"/>
      <!-- Streaming curls. -->
      <ellipse cx="-22" cy="-22" rx="5" ry="8"/>
      <ellipse cx="22" cy="-22" rx="5" ry="8"/>
    </g>
    <g stroke="#ffeca8" stroke-width="1.4" fill="none" opacity="0.85" filter="url(#p18p1bloom)">
      <path d="M-10,-50 Q-2,-44 6,-50"/>
      <path d="M2,-50 Q10,-44 18,-50"/>
    </g>

    <!-- Eyes (looking down/right at Theodore). -->
    <ellipse cx="-3" cy="-32" rx="2" ry="1.4" fill="#fff8e8"/>
