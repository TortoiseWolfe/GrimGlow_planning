<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 224" width="150" height="224">
  <title>Issue 3 — Page 18 — Panel 2: ECU Theodore's eye reflection</title>
  <desc>ECU 100mm macro single human eye filling frame. Hazel iris dilated, wide pupil. In wet curved corneal surface reflected in miniature: tiny figure in flight with geometric wings extended, trailing emerald light — a fairy reflected in a boy's eye. Wing geometry visible in corneal reflection. Single tear track catches the light beneath lower lid (overflow not sadness). Iris glows from within — warm hazel lit by cool emerald reflected light. Lashes catch prismatic highlights.</desc>

  <defs>
    <radialGradient id="p18p2eyeBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#2a4830"/>
      <stop offset="100%" stop-color="#0a1a08"/>
    </radialGradient>
    <radialGradient id="p18p2hazelIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8ffd0"/>
      <stop offset="20%" stop-color="#88c8a8"/>
      <stop offset="50%" stop-color="#a8825a"/>
      <stop offset="80%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </radialGradient>
    <radialGradient id="p18p2skin" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#88c8a8"/>
      <stop offset="100%" stop-color="#3a5048"/>
    </radialGradient>
    <linearGradient id="p18p2tear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a8ffd0" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="p18p2wingMembrane">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="p18p2bloom"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="p18p2deepBloom"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- BG (skin around eye in cool emerald-cast). -->
  <rect width="150" height="224" fill="url(#p18p2skin)"/>

  <!-- Skin texture: pores, slight variations. -->
  <g fill="#5a7858" opacity="0.45">
    <circle cx="20" cy="40" r="1.4"/>
    <circle cx="130" cy="60" r="1.2"/>
    <circle cx="40" cy="180" r="1.4"/>
    <circle cx="120" cy="200" r="1.2"/>
    <circle cx="80" cy="20" r="1"/>
    <circle cx="60" cy="200" r="1"/>
  </g>

  <!-- Upper lid + brow shadow. -->
  <path d="M0,0 Q75,40 150,0 L150,76 Q75,68 0,76 Z" fill="#1a3828" opacity="0.85"/>
  <!-- Brow line dark. -->
  <path d="M10,40 Q75,30 140,40" fill="none" stroke="#020a08" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyelashes upper (long, prismatic catching highlights). -->
  <g stroke="#020a08" stroke-width="1.4" stroke-linecap="round">
    <line x1="20" y1="76" x2="18" y2="68"/>
    <line x1="32" y1="74" x2="30" y2="64"/>
    <line x1="46" y1="72" x2="46" y2="60"/>
    <line x1="62" y1="70" x2="62" y2="58"/>
    <line x1="78" y1="70" x2="78" y2="58"/>
    <line x1="94" y1="70" x2="94" y2="58"/>
    <line x1="108" y1="72" x2="110" y2="60"/>
    <line x1="122" y1="74" x2="124" y2="64"/>
    <line x1="134" y1="76" x2="138" y2="68"/>
  </g>
  <!-- Prismatic highlights on lashes. -->
  <g stroke="#a8ffd0" stroke-width="0.55" opacity="0.85" filter="url(#p18p2bloom)">
    <line x1="46" y1="64" x2="46" y2="60"/>
    <line x1="62" y1="62" x2="62" y2="58"/>
    <line x1="78" y1="62" x2="78" y2="58"/>
    <line x1="94" y1="62" x2="94" y2="58"/>
    <line x1="108" y1="64" x2="110" y2="60"/>
  </g>

  <!-- Lower lid. -->
  <path d="M0,150 Q75,158 150,150 L150,224 L0,224 Z" fill="#3a5048" opacity="0.75"/>
  <path d="M10,150 Q75,162 140,150" fill="none" stroke="#020a08" stroke-width="1.4"/>
  <!-- Lower lashes. -->
  <g stroke="#020a08" stroke-width="1" stroke-linecap="round">
    <line x1="30" y1="156" x2="30" y2="166"/>
    <line x1="50" y1="158" x2="50" y2="168"/>
    <line x1="70" y1="160" x2="70" y2="170"/>
    <line x1="80" y1="160" x2="80" y2="170"/>
    <line x1="100" y1="158" x2="100" y2="168"/>
    <line x1="120" y1="156" x2="120" y2="166"/>
  </g>

  <!-- ******** EYEBALL — sclera + iris ******** -->
  <!-- Sclera. -->
  <ellipse cx="75" cy="113" rx="68" ry="38" fill="#fff8e8"/>
  <!-- Cool emerald wash on sclera (from wing-light). -->
  <ellipse cx="75" cy="113" rx="68" ry="38" fill="#a8ffd0" opacity="0.32"/>
  <!-- Inner corner detail. -->
  <path d="M0,113 Q14,104 24,113 Q14,124 0,113" fill="#a85820" opacity="0.65"/>
  <path d="M150,113 Q140,104 132,113 Q140,124 150,113" fill="#a85820" opacity="0.55"/>

  <!-- IRIS — hazel, dilated, GLOWING from within. -->
  <circle cx="75" cy="113" r="34" fill="url(#p18p2hazelIris)"/>
  <!-- Iris detail rays. -->
  <g stroke="#5a3018" stroke-width="0.4" opacity="0.85">
    <line x1="75" y1="113" x2="75" y2="80"/>
    <line x1="75" y1="113" x2="105" y2="100"/>
    <line x1="75" y1="113" x2="105" y2="125"/>
    <line x1="75" y1="113" x2="75" y2="146"/>
    <line x1="75" y1="113" x2="45" y2="125"/>
    <line x1="75" y1="113" x2="45" y2="100"/>
  </g>
  <!-- Cool emerald inner ring (light glowing within). -->
  <circle cx="75" cy="113" r="22" fill="none" stroke="#a8ffd0" stroke-width="1.4" opacity="0.85" filter="url(#p18p2bloom)"/>

  <!-- PUPIL — wide and dark. -->
  <circle cx="75" cy="113" r="20" fill="#020a08"/>

  <!-- ******** REFLECTION OF JINK IN FLIGHT inside the cornea ******** -->
  <g transform="translate(75 105)">
    <!-- Reflection halo. -->
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="url(#p18p2wingMembrane)" opacity="0.85" filter="url(#p18p2deepBloom)"/>
    <!-- Wings (geometric reflection). -->
    <path d="M-6,-2 L-12,-7 L-14,-3 L-8,1 Z" fill="#a8ffd0" opacity="0.85" filter="url(#p18p2bloom)"/>
    <path d="M-6,2 L-12,5 L-14,2 L-8,-1 Z" fill="#a8ffd0" opacity="0.7" filter="url(#p18p2bloom)"/>
    <path d="M6,-2 L12,-7 L14,-3 L8,1 Z" fill="#a8ffd0" opacity="0.85" filter="url(#p18p2bloom)"/>
    <path d="M6,2 L12,5 L14,2 L8,-1 Z" fill="#a8ffd0" opacity="0.7" filter="url(#p18p2bloom)"/>
    <!-- Wing geometric lattice. -->
    <g stroke="#ffffff" stroke-width="0.3" opacity="0.85">
      <line x1="-12" y1="-7" x2="-8" y2="1"/>
      <line x1="-14" y1="-3" x2="-6" y2="-2"/>
      <line x1="12" y1="-7" x2="8" y2="1"/>
      <line x1="14" y1="-3" x2="6" y2="-2"/>
    </g>
    <!-- Tiny body silhouette. -->
    <ellipse cx="0" cy="0" rx="2" ry="3" fill="#0a4018"/>
    <circle cx="0" cy="-2" r="1" fill="#a87858"/>
    <!-- Bright trail. -->
    <ellipse cx="0" cy="0" rx="1" ry="1.5" fill="#ffffff" filter="url(#p18p2bloom)"/>
  </g>

  <!-- Catchlight (separate, bright). -->
  <ellipse cx="68" cy="98" rx="3" ry="2" fill="#ffffff"/>
  <circle cx="66" cy="100" r="0.85" fill="#a8d8ff"/>

  <!-- Iris secondary catchlight on bottom. -->
  <ellipse cx="80" cy="125" rx="2" ry="1" fill="#a8ffd0" opacity="0.85" filter="url(#p18p2bloom)"/>

  <!-- ******** TEAR TRACK on cheek beneath eye ******** -->
  <g>
    <path d="M50,158 Q44,180 42,210" fill="none" stroke="url(#p18p2tear)" stroke-width="2.5" filter="url(#p18p2bloom)"/>
    <ellipse cx="42" cy="210" rx="3" ry="4" fill="url(#p18p2tear)" filter="url(#p18p2bloom)"/>
    <ellipse cx="42" cy="210" rx="1.4" ry="1.7" fill="#ffffff"/>
  </g>

  <!-- Brushwork. -->
  <g stroke="#020a08" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,30 Q75,32 150,30"/>
    <path d="M0,196 Q75,198 150,196"/>
  </g>
</svg>
