<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 6 — Panel 4: MED high-angle Theodore lying on cot, shard glow through pillow</title>
  <desc>MED 50mm high angle. Dark Victorian garret room. Theodore lies on narrow cot, blanket pulled up, one hand resting on pillow. Through pillow + cloth wrapping beneath it, faint cool blue-white geometric glow pulses — only light in near-darkness. Face barely visible, private smile, not fear but anticipation. Spare furniture, extinguished candle trailing wisp of smoke. Faint alien light pulses like slow heartbeat beneath pillow. Secret kept in the dark.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p6p4nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="p6p4plasterDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p6p4floorDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="p6p4cot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p6p4blanket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p6p4pillow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <radialGradient id="p6p4pillowGlow">
      <stop offset="0%" stop-color="#a0d8ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5090e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p6p4skinDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <radialGradient id="p6p4hair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#5a4020"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </radialGradient>
    <linearGradient id="p6p4smokeDim" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5a4838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a4838" stop-opacity="0"/>
    </linearGradient>
    <filter id="p6p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p6p4softBloom"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- BG: very dark night room. -->
  <rect width="366" height="364" fill="url(#p6p4nightBg)"/>

  <!-- Wall + floor (very dim). -->
  <rect x="0" y="0" width="366" height="200" fill="url(#p6p4plasterDim)"/>
  <rect x="0" y="200" width="366" height="164" fill="url(#p6p4floorDim)"/>

  <!-- Sloped attic ceiling (image-left). -->
  <path d="M0,0 L0,80 L80,40 L80,0 Z" fill="#040208"/>

  <!-- Cool light halo from pillow saturating part of frame (subtle since fabric dampens it). -->
  <ellipse cx="120" cy="240" rx="120" ry="60" fill="url(#p6p4pillowGlow)" opacity="0.55"/>

  <!-- Shelf with book + brass scraps (very dim, barely visible). -->
  <line x1="180" y1="100" x2="320" y2="100" stroke="#1a0c04" stroke-width="0.6" opacity="0.5"/>
  <rect x="200" y="76" width="14" height="24" fill="#1a0c04" opacity="0.85"/>
  <circle cx="232" cy="96" r="3" fill="#3a2010" opacity="0.7"/>

  <!-- COT with TheodoreOnIt — center-frame, viewed from above (high angle). -->
  <g>
    <!-- Cot frame. -->
    <rect x="40" y="200" width="280" height="120" fill="url(#p6p4cot)"/>
    <rect x="40" y="200" width="280" height="6" fill="#5a3018"/>
    <!-- Cot legs. -->
    <rect x="46" y="320" width="6" height="42" fill="#040208"/>
    <rect x="308" y="320" width="6" height="42" fill="#040208"/>

    <!-- Blanket covering body (most of cot). -->
    <path d="M40,206 L320,206 L320,290 Q280,300 200,295 Q140,300 100,294 Q60,298 40,290 Z" fill="url(#p6p4blanket)"/>
    <!-- Blanket folds. -->
    <g stroke="#3a1808" stroke-width="0.5" opacity="0.6">
      <path d="M70,230 Q100,232 130,228 Q160,234 200,230"/>
      <path d="M120,254 Q160,256 200,252 Q240,258 280,254"/>
      <path d="M50,278 Q100,280 150,276 Q220,282 310,278"/>
    </g>
    <!-- Body bulge under blanket (Theodore's chest/torso). -->
    <ellipse cx="200" cy="248" rx="60" ry="8" fill="#3a2010" opacity="0.55"/>

    <!-- PILLOW at one end of cot (image-LEFT). -->
    <g>
      <ellipse cx="100" cy="220" rx="62" ry="22" fill="url(#p6p4pillow)"/>
      <ellipse cx="100" cy="220" rx="62" ry="22" fill="#a0d8ff" opacity="0.18" filter="url(#p6p4bloom)"/>
      <!-- Pillow cloth folds. -->
      <g stroke="#1a0c04" stroke-width="0.4" opacity="0.6">
        <path d="M50,222 Q100,228 150,220"/>
        <path d="M60,232 Q100,234 140,228"/>
      </g>
    </g>

    <!-- COOL GLOW from beneath pillow — bleeding through fabric. -->
    <g>
      <!-- Subtle pulse (the "slow heartbeat"). -->
      <ellipse cx="84" cy="222" rx="22" ry="8" fill="url(#p6p4pillowGlow)" opacity="0.85" filter="url(#p6p4softBloom)"/>
      <ellipse cx="84" cy="222" rx="14" ry="5" fill="#a0d8ff" opacity="0.45" filter="url(#p6p4bloom)"/>
      <ellipse cx="84" cy="222" rx="6" ry="2" fill="#a0d8ff" opacity="0.7" filter="url(#p6p4bloom)"/>
    </g>

    <!-- THEODORE's HEAD on pillow (right side of pillow), face turned slightly toward camera. -->
    <g>
      <!-- Face barely visible (deep shadow). -->
      <ellipse cx="146" cy="220" rx="20" ry="14" fill="url(#p6p4skinDim)"/>
      <!-- Hair on pillow. -->
      <path d="M126,212 Q124,200 138,196 Q152,194 166,200 Q170,212 168,222 L162,222 Q156,210 148,210 Q138,210 130,222 Z" fill="url(#p6p4hair)"/>
      <!-- Ear suggestion. -->
      <ellipse cx="162" cy="220" rx="3" ry="4" fill="url(#p6p4skinDim)"/>
      <!-- Faint cool light catching jaw + cheekbone (from pillow glow). -->
      <ellipse cx="138" cy="226" rx="14" ry="4" fill="#a0c8ff" opacity="0.32" filter="url(#p6p4bloom)"/>
      <!-- Eyes — closed (sleeping/almost). -->
      <line x1="134" y1="220" x2="142" y2="220" stroke="#040208" stroke-width="0.7"/>
      <line x1="148" y1="220" x2="156" y2="220" stroke="#040208" stroke-width="0.7"/>
      <!-- Nose. -->
      <path d="M146,224 L144,232" stroke="#3a1808" stroke-width="0.4"/>
      <!-- PRIVATE SMILE (corners up — anticipation, not fear). -->
      <path d="M138,234 Q146,237 154,233" fill="none" stroke="#5a2010" stroke-width="0.85" stroke-linecap="round"/>
    </g>

    <!-- HAND ON PILLOW (over the shard beneath). -->
    <g>
      <!-- Arm coming out from under blanket. -->
      <path d="M114,254 Q108,242 96,230 L84,228 Q90,244 102,260 Z" fill="url(#p6p4skinDim)"/>
      <!-- Hand resting on pillow over hidden shard. -->
      <ellipse cx="84" cy="222" rx="14" ry="8" fill="url(#p6p4skinDim)"/>
      <!-- Knuckles. -->
      <path d="M74,220 Q80,216 86,220" fill="none" stroke="#3a1808" stroke-width="0.5" opacity="0.85"/>
      <path d="M80,226 Q86,222 92,226" fill="none" stroke="#3a1808" stroke-width="0.5" opacity="0.85"/>
      <!-- Fingers loosely curled. -->
      <ellipse cx="68" cy="222" rx="5" ry="3" fill="url(#p6p4skinDim)"/>
      <ellipse cx="76" cy="218" rx="5" ry="3" fill="url(#p6p4skinDim)"/>
      <ellipse cx="84" cy="216" rx="5" ry="3" fill="url(#p6p4skinDim)"/>
      <!-- Cool glow on fingers (the light pulses on his skin from beneath). -->
      <ellipse cx="84" cy="222" rx="14" ry="8" fill="#a0c8ff" opacity="0.35" filter="url(#p6p4bloom)"/>
    </g>
  </g>

  <!-- TABLE (visible to image-right, with EXTINGUISHED CANDLE + smoke wisp). -->
  <g opacity="0.78">
    <rect x="328" y="222" width="38" height="20" fill="#1a0c04"/>
    <rect x="332" y="242" width="3" height="42" fill="#040208"/>
    <rect x="358" y="242" width="3" height="42" fill="#040208"/>
    <!-- Candle (extinguished). -->
    <rect x="346" y="208" width="3" height="14" fill="#5a4838"/>
    <!-- Wisp of smoke rising. -->
    <path d="M347,206 Q348,188 346,170 Q348,154 346,140" stroke="url(#p6p4smokeDim)" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M347,200 Q346,184 348,168" stroke="url(#p6p4smokeDim)" stroke-width="0.8" fill="none" opacity="0.55"/>
    <!-- Holder. -->
    <ellipse cx="347" cy="222" rx="6" ry="2" fill="#3a1808"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#040208" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q120,45 240,42"/>
    <path d="M0,300 Q120,305 240,302"/>
  </g>

  <!-- No dialogue per script. -->
</svg>
