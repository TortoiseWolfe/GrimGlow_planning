<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 3 — Page 22 — Panel 5: CLOSING IMAGE — story spreads + emerald ghost on roofline</title>
  <desc>Wide 35mm high angle from above roofline. Three boys form triangle on grey Victorian street: Theodore walking away background oblivious, Billy midground grabbing third boy's sleeve leaning in animated, third boy listening head cocked. Grey desaturated street — terraced houses, overcast sky, cobblestones. AT VERY EDGE of frame, high on roofline, FAINTEST suggestion of emerald light at chimney base — barely there, unconfirmed, possibly imagined. Trick of the light. Maybe.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p22p5greySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="p22p5rooftops" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p22p5street" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5048"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <radialGradient id="p22p5emeraldGhost" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p22p5deepBloom"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky (top portion). -->
  <rect width="238" height="80" fill="url(#p22p5greySky)"/>
  <!-- Fog. -->
  <g fill="none" stroke="#a89888" stroke-width="0.55" opacity="0.45">
    <path d="M0,30 Q119,28 238,32"/>
    <path d="M0,60 Q119,58 238,62"/>
  </g>

  <!-- Rooftops in distance. -->
  <g fill="url(#p22p5rooftops)">
    <path d="M0,80 L40,60 L80,80 L120,55 L160,80 L200,60 L238,80 L238,100 L0,100 Z"/>
  </g>
  <!-- Chimneys. -->
  <rect x="60" y="50" width="6" height="22" fill="#3a2818"/>
  <rect x="160" y="48" width="8" height="22" fill="#3a2818"/>
  <rect x="200" y="50" width="6" height="20" fill="#3a2818"/>

  <!-- ******** EMERALD GHOST at chimney base (top-right corner) ******** -->
  <g>
    <ellipse cx="200" cy="60" rx="12" ry="14" fill="url(#p22p5emeraldGhost)" opacity="0.55" filter="url(#p22p5deepBloom)"/>
    <!-- Smaller bright pinpoint inside. -->
    <circle cx="201" cy="58" r="0.85" fill="#a8ffd0" opacity="0.85" filter="url(#p22p5bloom)"/>
  </g>

  <!-- Street (mid-distance). -->
  <rect x="0" y="100" width="238" height="180" fill="url(#p22p5street)"/>
  <!-- Cobblestone perspective lines. -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.55">
    <path d="M0,140 L238,140"/>
    <path d="M0,180 L238,180"/>
    <path d="M0,220 L238,220"/>
    <path d="M0,260 L238,260"/>
    <!-- Vertical perspective. -->
    <path d="M40,100 Q56,180 60,260"/>
    <path d="M120,100 Q120,180 120,260"/>
    <path d="M200,100 Q190,180 184,260"/>
  </g>

  <!-- Buildings/walls bordering street (sides). -->
  <rect x="0" y="60" width="40" height="220" fill="url(#p22p5rooftops)" opacity="0.85"/>
  <rect x="200" y="60" width="38" height="220" fill="url(#p22p5rooftops)" opacity="0.85"/>
  <!-- Brick lines on side walls. -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="100" x2="40" y2="100"/>
    <line x1="0" y1="140" x2="40" y2="140"/>
    <line x1="0" y1="180" x2="40" y2="180"/>
    <line x1="0" y1="220" x2="40" y2="220"/>
    <line x1="200" y1="100" x2="238" y2="100"/>
    <line x1="200" y1="140" x2="238" y2="140"/>
    <line x1="200" y1="180" x2="238" y2="180"/>
    <line x1="200" y1="220" x2="238" y2="220"/>
  </g>

  <!-- ******** THREE BOYS forming triangle on street (top-down view) ******** -->
  <!-- Theodore walking AWAY in BG (small, top of street). -->
  <g transform="translate(80 130)">
    <ellipse cx="0" cy="6" rx="6" ry="2" fill="#1a1410" opacity="0.55"/>
    <!-- Body (back view, walking away). -->
    <path d="M-4,-12 L-5,4 L4,4 L4,-12 Z" fill="#5a4030"/>
    <!-- Head (back of). -->
    <ellipse cx="0" cy="-16" rx="4" ry="5" fill="#a89070"/>
    <!-- Hair tousled (sandy). -->
    <ellipse cx="-2" cy="-20" rx="3" ry="3" fill="#88806a"/>
    <ellipse cx="2" cy="-20" rx="3" ry="3" fill="#88806a"/>
    <!-- Walking legs. -->
    <line x1="-2" y1="4" x2="-3" y2="14" stroke="#3a2c20" stroke-width="2"/>
    <line x1="2" y1="4" x2="4" y2="14" stroke="#3a2c20" stroke-width="2"/>
  </g>

  <!-- BILLY mid-street, grabbing 3rd boy's sleeve, leaning in. -->
  <g transform="translate(80 200)">
    <ellipse cx="0" cy="14" rx="9" ry="2.5" fill="#1a1410" opacity="0.55"/>
    <!-- Body (broader, leaning forward). -->
    <path d="M-7,-14 L-9,12 L9,12 L7,-14 Z" fill="#7a6058"/>
    <!-- Head (3/4 view leaning toward 3rd boy on right). -->
    <ellipse cx="2" cy="-22" rx="6" ry="7" fill="#c8a098"/>
    <!-- Hair. -->
    <ellipse cx="0" cy="-26" rx="5" ry="4" fill="#a87858"/>
    <!-- Arm reaching forward grabbing sleeve. -->
    <path d="M7,-14 L24,-8 L26,-2 L18,2 L9,0 Z" fill="#7a6058"/>
    <!-- Hand on 3rd boy. -->
    <ellipse cx="26" cy="-4" rx="3" ry="2" fill="#c8a098"/>
    <!-- Other arm at side. -->
    <path d="M-7,-14 L-12,8 L-7,12 L-3,-12 Z" fill="#7a6058"/>
    <!-- Walking/standing legs. -->
    <line x1="-3" y1="12" x2="-4" y2="22" stroke="#3a2c20" stroke-width="2.5"/>
    <line x1="3" y1="12" x2="5" y2="22" stroke="#3a2c20" stroke-width="2.5"/>
    <!-- Animation/talking lines. -->
    <g stroke="#3a2010" stroke-width="0.55" opacity="0.65">
      <line x1="14" y1="-30" x2="20" y2="-30"/>
      <line x1="14" y1="-28" x2="22" y2="-28"/>
    </g>
  </g>

  <!-- THIRD BOY mid-street right of Billy, listening. -->
  <g transform="translate(126 200)">
    <ellipse cx="0" cy="14" rx="8" ry="2.5" fill="#1a1410" opacity="0.55"/>
    <!-- Body (head cocked toward Billy on left). -->
    <path d="M-6,-14 L-8,12 L8,12 L6,-14 Z" fill="#5a4030"/>
    <!-- Head (head cocked LEFT toward Billy). -->
    <g transform="rotate(-18 -2 -22)">
      <ellipse cx="-2" cy="-22" rx="5" ry="6" fill="#a89888"/>
      <!-- Hair. -->
      <ellipse cx="-4" cy="-26" rx="4" ry="3" fill="#7a5848"/>
    </g>
    <!-- Arms. -->
    <path d="M-6,-14 L-10,8 L-6,12 L-2,-12 Z" fill="#5a4030"/>
    <path d="M6,-14 L10,8 L6,12 L2,-12 Z" fill="#5a4030"/>
    <!-- Legs. -->
    <line x1="-2" y1="12" x2="-3" y2="22" stroke="#3a2c20" stroke-width="2.5"/>
    <line x1="2" y1="12" x2="4" y2="22" stroke="#3a2c20" stroke-width="2.5"/>
  </g>

  <!-- Connecting "story passing" indicator (subtle). -->
  <g stroke="#5a4838" stroke-width="0.4" stroke-dasharray="2,2" opacity="0.55">
    <path d="M100,196 Q113,194 122,196"/>
  </g>

  <!-- Distant figures further down street (more indicators of city life). -->
  <g opacity="0.55">
    <ellipse cx="50" cy="148" rx="2" ry="6" fill="#3a2818"/>
    <ellipse cx="190" cy="146" rx="2" ry="6" fill="#3a2818"/>
  </g>

  <!-- DIALOGUE — Billy small text (telling 3rd boy). -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="280" width="208" height="50" rx="10" fill="#fff8e8" stroke="#999999" stroke-width="1.4"/>
    <path d="M68,330 L80,330 L70,348 Z" fill="#fff8e8" stroke="#999999" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="69.5" y1="330.5" x2="78" y2="330.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5a5a5a">BILLY</text>
  <text x="22" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#222">Theo says he saw a fairy</text>
  <text x="22" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#222">in his workshop...</text>

  <!-- CAPTION at very bottom. -->
  <g>
    <rect x="14" y="338" width="208" height="22" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">The story had already begun.</text>

  <!-- Brushwork. -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q119,42 238,40"/>
  </g>
</svg>
