<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 3 — Page 22 — Panel 4: Billy reaction, folklore barrier cracking</title>
  <desc>MED two-shot eye level. Two boys stopped on grey Victorian street. Broader boy's expression cycles from disbelief toward laugh that dies halfway — mouth still curved but eyes uncertain, hesitating. Slighter boy faces him with absolute conviction, hazel eyes wide and earnest. Street around = desaturated grey terraced houses, overcast sky, cobblestones. NO dramatic lighting, no warmth, no fairy glow. Magic exists ONLY in conviction on one face and uncertainty on the other.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p22p4greySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="p22p4greyStreet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a6058"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="p22p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5048"/>
      <stop offset="100%" stop-color="#5a3830"/>
    </linearGradient>
    <linearGradient id="p22p4theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p22p4theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p22p4billySkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8a098"/>
      <stop offset="100%" stop-color="#dcb8a8"/>
    </linearGradient>
    <radialGradient id="p22p4billyHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <linearGradient id="p22p4shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p22p4vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p22p4trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2c20"/>
    </linearGradient>
    <linearGradient id="p22p4billyClothes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a6058"/>
      <stop offset="100%" stop-color="#4a3830"/>
    </linearGradient>
    <filter id="p22p4bloom"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>

  <!-- BG sky. -->
  <rect width="494" height="180" fill="url(#p22p4greySky)"/>
  <!-- Fog. -->
  <g fill="none" stroke="#a89888" stroke-width="0.55" opacity="0.45">
    <path d="M0,40 Q247,38 494,42"/>
    <path d="M0,80 Q247,82 494,76"/>
    <path d="M0,120 Q247,118 494,124"/>
  </g>

  <!-- Street. -->
  <rect x="0" y="180" width="494" height="184" fill="url(#p22p4greyStreet)"/>
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.55">
    <path d="M0,200 Q160,202 320,198"/>
    <path d="M320,202 Q400,198 494,202"/>
    <path d="M0,240 Q160,242 320,238"/>
    <path d="M0,280 Q160,278 320,282"/>
    <path d="M320,278 Q400,282 494,278"/>
    <path d="M0,320 Q160,322 320,318"/>
  </g>
  <!-- Cobble dots. -->
  <g fill="#3a3028" opacity="0.55">
    <circle cx="60" cy="220" r="2"/>
    <circle cx="180" cy="225" r="2"/>
    <circle cx="280" cy="220" r="2"/>
    <circle cx="380" cy="225" r="2"/>
    <circle cx="120" cy="260" r="2"/>
    <circle cx="240" cy="265" r="2"/>
    <circle cx="320" cy="260" r="2"/>
    <circle cx="420" cy="265" r="2"/>
    <circle cx="80" cy="300" r="2"/>
    <circle cx="200" cy="305" r="2"/>
    <circle cx="300" cy="300" r="2"/>
    <circle cx="400" cy="305" r="2"/>
  </g>

  <!-- BG terraced houses. -->
  <g>
    <rect x="0" y="60" width="494" height="120" fill="url(#p22p4brick)"/>
    <g stroke="#3a2818" stroke-width="0.55" opacity="0.65">
      <line x1="0" y1="80" x2="494" y2="80"/>
      <line x1="0" y1="100" x2="494" y2="100"/>
      <line x1="0" y1="120" x2="494" y2="120"/>
      <line x1="0" y1="140" x2="494" y2="140"/>
      <line x1="0" y1="160" x2="494" y2="160"/>
    </g>
    <!-- Windows. -->
    <rect x="20" y="100" width="40" height="50" fill="#5a4838"/>
    <rect x="120" y="100" width="40" height="50" fill="#5a4838"/>
    <rect x="220" y="100" width="40" height="50" fill="#5a4838"/>
    <rect x="320" y="100" width="40" height="50" fill="#5a4838"/>
    <rect x="420" y="100" width="40" height="50" fill="#5a4838"/>
    <line x1="40" y1="100" x2="40" y2="150" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="140" y1="100" x2="140" y2="150" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="240" y1="100" x2="240" y2="150" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="340" y1="100" x2="340" y2="150" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="440" y1="100" x2="440" y2="150" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Doors. -->
    <rect x="80" y="130" width="22" height="50" fill="#3a2010"/>
    <rect x="180" y="130" width="22" height="50" fill="#3a2010"/>
    <rect x="280" y="130" width="22" height="50" fill="#3a2010"/>
    <rect x="380" y="130" width="22" height="50" fill="#3a2010"/>
  </g>

  <!-- ******** THEODORE LEFT (stopped, conviction) ******** -->
  <g transform="translate(160 240)">
    <ellipse cx="0" cy="60" rx="14" ry="3" fill="#1a1410" opacity="0.45"/>

    <!-- Trousers (stopped, both feet planted). -->
    <path d="M-8,0 L-10,52 L-2,58 L-2,0 Z" fill="url(#p22p4trousers)"/>
    <path d="M2,0 L4,52 L12,58 L8,0 Z" fill="url(#p22p4trousers)"/>
    <ellipse cx="-6" cy="58" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="8" cy="58" rx="5" ry="2" fill="#1a0c04"/>

    <!-- Vest + shirt. -->
    <path d="M-12,-50 L-16,0 L16,0 L12,-50 Z" fill="url(#p22p4vest)"/>
    <path d="M-4,-58 L-2,-50 L4,-50 L4,-58 Z" fill="url(#p22p4shirt)"/>

    <!-- Arms (one extended, gesturing toward Billy). -->
    <path d="M-12,-44 Q-22,-30 -28,-10 L-22,0 Q-12,-22 -8,-44 Z" fill="url(#p22p4shirt)"/>
    <ellipse cx="-26" cy="-4" rx="4" ry="3" fill="url(#p22p4theoSkin)"/>
    <path d="M12,-44 Q22,-22 22,0 L14,2 Q12,-22 10,-44 Z" fill="url(#p22p4shirt)"/>
    <ellipse cx="22" cy="2" rx="4" ry="3" fill="url(#p22p4theoSkin)"/>
    <!-- Brass gear ring. -->
    <ellipse cx="-26" cy="-4" rx="3" ry="1.7" fill="#a89070"/>
    <ellipse cx="-26" cy="-4" rx="3" ry="1.7" fill="none" stroke="#5a3018" stroke-width="0.4"/>

    <!-- Head — facing Billy (right), absolute conviction. -->
    <ellipse cx="0" cy="-72" rx="13" ry="14" fill="url(#p22p4theoSkin)"/>
    <!-- Hair. -->
    <g fill="url(#p22p4theoHair)">
      <path d="M-12,-84 Q-14,-96 0,-100 Q14,-96 12,-84 L8,-82 Q4,-92 -4,-92 Q-12,-92 -16,-82 Z"/>
      <path d="M-8,-96 L-10,-106 L-4,-96 Z"/>
      <path d="M-2,-100 L-2,-110 L4,-96 Z"/>
      <path d="M6,-100 L10,-110 L8,-96 Z"/>
    </g>
    <!-- EYES wide earnest. -->
    <ellipse cx="-3" cy="-74" rx="2.5" ry="1.7" fill="#fff8e8"/>
    <circle cx="-2" cy="-74" r="1.4" fill="#3a2810"/>
    <circle cx="-2" cy="-74" r="0.7" fill="#0a0604"/>
    <ellipse cx="-1" cy="-75" rx="0.55" ry="0.4" fill="#ffffff"/>
    <ellipse cx="5" cy="-74" rx="2.5" ry="1.7" fill="#fff8e8"/>
    <circle cx="6" cy="-74" r="1.4" fill="#3a2810"/>
    <circle cx="6" cy="-74" r="0.7" fill="#0a0604"/>
    <ellipse cx="7" cy="-75" rx="0.55" ry="0.4" fill="#ffffff"/>
    <!-- Brows raised. -->
    <path d="M-7,-80 Q-3,-82 1,-80" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <path d="M3,-80 Q7,-82 11,-80" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <!-- Nose. -->
    <path d="M2,-66 L0,-60 Q2,-59 4,-60 Z" fill="#7a5848" opacity="0.55"/>
    <!-- Mouth — open mid-sentence, conviction. -->
    <ellipse cx="2" cy="-56" rx="4" ry="2" fill="#3a1408"/>
    <!-- Freckles. -->
    <circle cx="-5" cy="-66" r="0.55" fill="#7a5848"/>
    <circle cx="6" cy="-66" r="0.55" fill="#7a5848"/>
  </g>

  <!-- ******** BILLY RIGHT (stopped, laugh dying into uncertainty) ******** -->
  <g transform="translate(340 240)">
    <ellipse cx="0" cy="60" rx="16" ry="3" fill="#1a1410" opacity="0.45"/>

    <!-- Trousers. -->
    <path d="M-10,0 L-12,52 L-2,58 L-2,0 Z" fill="url(#p22p4trousers)"/>
    <path d="M2,0 L4,52 L14,58 L10,0 Z" fill="url(#p22p4trousers)"/>
    <ellipse cx="-7" cy="58" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="9" cy="58" rx="5" ry="2" fill="#1a0c04"/>

    <!-- Body. -->
    <path d="M-16,-50 L-20,0 L20,0 L16,-50 Z" fill="url(#p22p4billyClothes)"/>
    <path d="M-4,-58 L-2,-50 L4,-50 L4,-58 Z" fill="url(#p22p4shirt)"/>

    <!-- Arms (one scratching head — uncertainty gesture). -->
    <path d="M-16,-44 Q-26,-22 -26,0 L-18,2 Q-14,-22 -12,-44 Z" fill="url(#p22p4billyClothes)"/>
    <path d="M16,-44 Q24,-60 28,-78 L36,-72 Q24,-50 22,-44 Z" fill="url(#p22p4billyClothes)"/>
    <!-- Hand at head (scratching/uncertainty). -->
    <ellipse cx="36" cy="-74" rx="4" ry="3" fill="url(#p22p4billySkin)"/>
    <ellipse cx="-26" cy="2" rx="4" ry="3" fill="url(#p22p4billySkin)"/>
    <!-- Mortar dust on hands. -->
    <ellipse cx="-26" cy="0" rx="3" ry="1.4" fill="#c8c0b0" opacity="0.85"/>
    <ellipse cx="36" cy="-72" rx="3" ry="1.4" fill="#c8c0b0" opacity="0.85"/>

    <!-- Head broader. -->
    <ellipse cx="0" cy="-72" rx="14" ry="15" fill="url(#p22p4billySkin)"/>
    <!-- Hair. -->
    <g fill="url(#p22p4billyHair)">
      <path d="M-13,-84 Q-15,-94 0,-98 Q15,-94 13,-84 L10,-82 Q4,-90 -4,-90 Q-12,-90 -16,-82 Z"/>
      <path d="M-8,-92 L-10,-102 L-4,-92 Z"/>
      <path d="M2,-96 L4,-102 L6,-92 Z"/>
    </g>
    <!-- Ruddy cheeks. -->
    <ellipse cx="-9" cy="-68" rx="4" ry="3" fill="#a85040" opacity="0.55"/>
    <ellipse cx="9" cy="-68" rx="4" ry="3" fill="#a85040" opacity="0.55"/>

    <!-- EYES (uncertain — laughing fading). -->
    <ellipse cx="-4" cy="-74" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-4" cy="-74" r="1" fill="#3a2810"/>
    <circle cx="-4" cy="-74" r="0.55" fill="#0a0604"/>
    <ellipse cx="4" cy="-74" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="4" cy="-74" r="1" fill="#3a2810"/>
    <circle cx="4" cy="-74" r="0.55" fill="#0a0604"/>

    <!-- Brows half-raised (hesitation). -->
    <path d="M-8,-80 Q-4,-82 0,-80" fill="none" stroke="#3a1c08" stroke-width="1" stroke-linecap="round"/>
    <path d="M0,-80 Q4,-82 8,-80" fill="none" stroke="#3a1c08" stroke-width="1" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M0,-68 L-2,-62 Q0,-61 2,-62 Z" fill="#7a5848" opacity="0.55"/>

    <!-- MOUTH — half-curved (laugh fading). -->
    <path d="M-4,-56 Q0,-52 4,-58" fill="none" stroke="#3a2010" stroke-width="0.85" stroke-linecap="round"/>
    <ellipse cx="0" cy="-55" rx="2" ry="0.85" fill="#3a1408" opacity="0.55"/>
  </g>

  <!-- DIALOGUE — 4 beats. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="100" height="40" rx="10" fill="#fff8e8" stroke="#999999" stroke-width="1.4"/>
    <path d="M48,54 L60,54 L50,72 Z" fill="#fff8e8" stroke="#999999" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="49.5" y1="54.5" x2="58" y2="54.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5a5a5a">BILLY</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">A fairy.</text>

  <g filter="url(#balloonShadow)">
    <rect x="296" y="14" width="184" height="40" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M328,54 L340,54 L330,72 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="329.5" y1="54.5" x2="338" y2="54.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="304" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="304" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">I know how it sounds.</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="200" height="44" rx="10" fill="#fff8e8" stroke="#999999" stroke-width="1.4"/>
    <path d="M58,296 L70,296 L60,278 Z" fill="#fff8e8" stroke="#999999" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="295.5" x2="68" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5a5a5a">BILLY</text>
  <text x="22" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">You've gone barmy, Theo.</text>

  <g filter="url(#balloonShadow)">
    <rect x="296" y="296" width="184" height="44" rx="10" fill="#fff8e8" stroke="#999999" stroke-width="1.4"/>
    <path d="M328,296 L340,296 L330,278 Z" fill="#fff8e8" stroke="#999999" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="329.5" y1="295.5" x2="338" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="304" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5a5a5a">BILLY</text>
  <text x="304" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-style="italic">...What kind of wings?</text>

  <!-- Brushwork. -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q160,45 320,42"/>
    <path d="M320,40 Q420,45 494,42"/>
  </g>
</svg>
