    <line x1="396" y1="118" x2="396" y2="164" stroke="#3a2010" stroke-width="2"/>
    <line x1="416" y1="118" x2="416" y2="158" stroke="#3a2010" stroke-width="1.6"/>
    <ellipse cx="396" cy="166" rx="5" ry="3" fill="#3a2010"/>
    <rect x="412" y="158" width="8" height="14" fill="#3a2010"/>
  </g>

  <!-- Floor. -->
  <rect x="0" y="240" width="493.8" height="124" fill="url(#p2p5floor)"/>
  <g stroke="#0a0604" stroke-width="0.6" opacity="0.85">
    <line x1="0" y1="266" x2="493.8" y2="262"/>
    <line x1="0" y1="296" x2="493.8" y2="294"/>
    <line x1="0" y1="328" x2="493.8" y2="328"/>
    <line x1="0" y1="358" x2="493.8" y2="358"/>
    <line x1="120" y1="240" x2="116" y2="364"/>
    <line x1="280" y1="240" x2="284" y2="364"/>
    <line x1="400" y1="240" x2="408" y2="364"/>
  </g>

  <!-- THEODORE'S BACK-CORNER bench (right of frame, dimmer). -->
  <g opacity="0.92">
    <rect x="346" y="216" width="148" height="20" fill="#3a2010"/>
    <rect x="346" y="216" width="148" height="3" fill="#5a3818"/>
    <rect x="358" y="236" width="5" height="48" fill="#1a0c04"/>
    <rect x="486" y="236" width="5" height="48" fill="#1a0c04"/>
    <!-- His abandoned cloth + parts grid still on bench. -->
    <rect x="380" y="204" width="78" height="14" fill="#dcd0b4" opacity="0.8"/>
    <g>
      <circle cx="388" cy="208" r="2" fill="url(#p2p5brass)" opacity="0.85"/>
      <circle cx="398" cy="208" r="2.4" fill="url(#p2p5brass)" opacity="0.85"/>
      <circle cx="410" cy="208" r="1.8" fill="url(#p2p5brass)" opacity="0.85"/>
      <circle cx="422" cy="208" r="2.6" fill="url(#p2p5brass)" opacity="0.85"/>
      <circle cx="434" cy="208" r="2" fill="url(#p2p5brass)" opacity="0.85"/>
      <circle cx="446" cy="208" r="2.4" fill="url(#p2p5brass)" opacity="0.85"/>
    </g>
  </g>

  <!-- MAIN WORKBENCH — Cribbage's, fully lit (left of frame). The repaired Whitfield is on the bench. -->
  <g>
    <rect x="0" y="240" width="320" height="36" fill="url(#p2p5bench)"/>
    <rect x="0" y="240" width="320" height="6" fill="#7a4828"/>
    <line x1="0" y1="246" x2="320" y2="246" stroke="#1a0c04" stroke-width="0.6"/>
    <rect x="20" y="276" width="6" height="88" fill="#1a0c04"/>
    <rect x="304" y="276" width="6" height="88" fill="#1a0c04"/>
    <rect x="26" y="276" width="278" height="32" fill="#3a2010"/>
    <line x1="26" y1="290" x2="304" y2="290" stroke="#1a0c04" stroke-width="0.5"/>
    <!-- Lamp arm. -->
    <line x1="56" y1="240" x2="64" y2="160" stroke="#3a2010" stroke-width="2.4"/>
    <line x1="64" y1="160" x2="100" y2="138" stroke="#3a2010" stroke-width="2.4"/>
    <circle cx="106" cy="134" r="13" fill="#3a2010"/>
    <circle cx="106" cy="134" r="10" fill="url(#p2p5brass)"/>
    <circle cx="106" cy="134" r="5" fill="#fff0a8" filter="url(#p2p5bloom)"/>
    <!-- Whitfield mechanism, repaired, on felt pad. -->
    <ellipse cx="170" cy="252" rx="50" ry="12" fill="#3a4218"/>
    <rect x="138" y="240" width="64" height="16" rx="2" fill="#1a0c04"/>
    <rect x="140" y="238" width="60" height="4" fill="url(#p2p5brass)"/>
    <circle cx="158" cy="248" r="7" fill="url(#p2p5brass)"/>
    <circle cx="158" cy="248" r="2" fill="#5a3018"/>
    <circle cx="178" cy="248" r="5" fill="url(#p2p5brass)"/>
    <circle cx="194" cy="248" r="4" fill="url(#p2p5brass)"/>
    <!-- Tools roll still on the bench (left). -->
    <rect x="220" y="220" width="60" height="14" rx="2" fill="#5a3018"/>
    <rect x="226" y="208" width="4" height="14" fill="#3a2010"/>
    <rect x="240" y="208" width="4" height="14" fill="#3a2010"/>
    <rect x="254" y="208" width="4" height="14" fill="#3a2010"/>
    <rect x="268" y="208" width="4" height="14" fill="#3a2010"/>
  </g>

  <!-- CRIBBAGE — BACK TO CAMERA, turned away from the Whitfield, moving on. -->
  <g>
    <!-- Trousers below bench apron (he's standing left of bench center). -->
    <path d="M124,308 Q120,330 124,360 L150,360 Q154,330 150,308 Z" fill="#2a2418"/>
    <path d="M154,308 Q152,330 156,360 L182,360 Q186,330 182,308 Z" fill="#2a2418"/>
    <ellipse cx="138" cy="362" rx="14" ry="3" fill="#0a0402"/>
    <ellipse cx="170" cy="362" rx="14" ry="3" fill="#0a0402"/>

    <!-- TORSO BACK — we see his back and shoulders. -->
    <path d="M104,150 Q98,238 110,256 L196,256 Q204,238 200,150 Q190,140 152,140 Q116,140 104,150 Z" fill="url(#p2p5cribVest)"/>
    <!-- Center seam down back. -->
    <line x1="152" y1="148" x2="152" y2="256" stroke="#1a1408" stroke-width="0.8" opacity="0.85"/>
    <!-- Shoulder yoke. -->
    <path d="M104,156 Q120,148 152,148 Q184,148 200,156" fill="none" stroke="#1a1408" stroke-width="0.8" opacity="0.85"/>
    <!-- Sleeves. -->
    <path d="M100,152 Q86,196 90,228 L106,228 Q106,196 110,152 Z" fill="url(#p2p5cribVest)"/>
    <rect x="86" y="200" width="22" height="4" fill="#1a1408"/>
    <path d="M90,228 Q88,250 100,266 L116,262 Q114,242 108,228 Z" fill="url(#p2p5cribShirt)"/>
    <path d="M204,152 Q218,196 214,228 L198,228 Q198,196 196,152 Z" fill="url(#p2p5cribVest)"/>
    <rect x="196" y="200" width="22" height="4" fill="#1a1408"/>
    <path d="M214,228 Q216,250 204,266 L188,262 Q190,242 196,228 Z" fill="url(#p2p5cribShirt)"/>
