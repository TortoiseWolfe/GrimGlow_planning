    <ellipse cx="106" cy="270" rx="9" ry="4" fill="url(#p2p5cribSkin)"/>
    <ellipse cx="196" cy="270" rx="9" ry="4" fill="url(#p2p5cribSkin)"/>

    <!-- Head (back of head — thinning hair + mutton chops at edge of jaw). -->
    <ellipse cx="152" cy="124" rx="20" ry="22" fill="url(#p2p5cribSkin)"/>
