<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493.8 364" width="493.8" height="364">
  <title>Issue 3 — Page 2 — Panel 5: MED Cribbage back-turned dismissal, Theodore walks back to dim corner</title>
  <desc>MED 50mm eye level. Cribbage has turned away from the repaired clock mechanism, already moving on, back to the camera, dismissing the boy without a glance. Theodore walks back toward his dim corner workbench carrying a broom, expression flat — resignation without surprise, a quiet swallowing of a familiar moment. The distance between man and boy across the workshop is the composition. Main bench fully lit warm amber; boy walks back into dimmer corner. Brass instruments gleam. The space between recognition and silence.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p2p5wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p2p5plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p2p5plasterDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="p2p5floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="p2p5bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="50%" stop-color="#4a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p2p5lampLeft" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#a85820" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p5dimRight" cx="80%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p2p5brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </linearGradient>
    <linearGradient id="p2p5cribSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d0a8"/>
      <stop offset="100%" stop-color="#9a7050"/>
    </linearGradient>
    <linearGradient id="p2p5cribVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a7068"/>
      <stop offset="100%" stop-color="#3a3428"/>
    </linearGradient>
    <linearGradient id="p2p5cribShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8d4"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <radialGradient id="p2p5cribHair">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p2p5theoSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8c0"/>
      <stop offset="100%" stop-color="#9a7050"/>
    </linearGradient>
    <linearGradient id="p2p5theoShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <linearGradient id="p2p5theoVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a4220"/>
      <stop offset="100%" stop-color="#3e2810"/>
    </linearGradient>
    <linearGradient id="p2p5theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a24"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p2p5theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#8a6438"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <filter id="p2p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

