    <line x1="366" y1="194" x2="366" y2="272" stroke="#1a0c04" stroke-width="0.5" opacity="0.7"/>
    <circle cx="366" cy="206" r="1.4" fill="url(#p2p5brass)"/>
    <circle cx="366" cy="220" r="1.4" fill="url(#p2p5brass)"/>
    <circle cx="366" cy="234" r="1.4" fill="url(#p2p5brass)"/>
