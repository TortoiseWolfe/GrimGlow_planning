    <path d="M390,172 Q400,206 398,240 L386,242 Q386,210 382,176 Z" fill="url(#p2p5theoShirt)"/>
    <rect x="384" y="232" width="18" height="5" fill="#a89878"/>
    <path d="M398,238 Q400,260 394,272 L386,272 Q384,256 386,240 Z" fill="url(#p2p5theoSkin)"/>
    <ellipse cx="390" cy="276" rx="6" ry="5" fill="url(#p2p5theoSkin)"/>

    <!-- Broom handle — diagonal to floor. -->
    <line x1="340" y1="276" x2="316" y2="358" stroke="#3a2010" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="390" y1="276" x2="316" y2="358" stroke="#3a2010" stroke-width="0" opacity="0"/>
