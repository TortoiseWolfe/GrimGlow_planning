    <circle cx="124" cy="76" r="7" fill="#3a2010"/>
    <circle cx="124" cy="76" r="4.5" fill="#5a3818" opacity="0.85"/>
    <rect x="148" y="66" width="14" height="20" fill="#3a2010"/>
    <circle cx="186" cy="78" r="8" fill="#3a2010"/>
    <circle cx="186" cy="78" r="5" fill="#5a3818" opacity="0.85"/>
    <rect x="212" y="68" width="14" height="18" fill="#3a2010"/>
    <circle cx="246" cy="76" r="9" fill="#3a2010"/>
    <circle cx="246" cy="76" r="5.5" fill="#5a3818" opacity="0.85"/>
    <circle cx="246" cy="76" r="3" fill="url(#p2p5brass)" opacity="0.85"/>
