    <path d="M172,124 Q176,140 170,148 L162,148 L162,134 Z" fill="url(#p2p5cribHair)"/>
    <!-- Ear silhouette (tiny, side). -->
    <ellipse cx="132" cy="124" rx="4" ry="6" fill="url(#p2p5cribSkin)"/>
    <ellipse cx="172" cy="124" rx="4" ry="6" fill="url(#p2p5cribSkin)"/>
    <!-- Collar at neck (back). -->
