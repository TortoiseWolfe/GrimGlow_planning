    <path d="M260,290 Q320,295 380,292"/>
    <path d="M0,80 Q60,85 120,82"/>
    <path d="M280,40 Q340,45 400,42"/>
  </g>

  <!-- CRIBBAGE balloon — top-left, his back-turned dismissal. Tail points to back of his head. Long line. -->
  <rect x="14" y="14" width="288" height="74" rx="8"
        fill="#ffffff" stroke="#5a4a30" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M122,88 L138,88 L150,108 Z"
        fill="#ffffff" stroke="#5a4a30" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="122" y1="88" x2="138" y2="88" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="36"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#5a4a30" letter-spacing="0.3">CRIBBAGE</text>
  <text x="24" y="55"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Right. You can run the Perrault mainspring</text>
  <text x="24" y="70"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">when you've finished sweeping. And mind</text>
  <text x="24" y="84"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">you don't over-wind it this time.</text>

  <!-- CAPTION balloon — bottom-right, parchment style, italic. -->
  <rect x="294" y="306" width="190" height="46" rx="2"
        fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5"
        filter="url(#balloonShadow)"/>
  <text x="304" y="324"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="12" font-weight="700" font-style="italic"
        fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
  <text x="304" y="342"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-style="italic"
        fill="#5a4a30">He does not say thank you.</text>

</svg>
