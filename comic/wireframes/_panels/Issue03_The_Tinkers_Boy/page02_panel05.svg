  <g>
    <!-- Trousers. -->
    <path d="M348,272 Q344,306 348,344 L364,344 Q368,306 364,272 Z" fill="url(#p2p5theoTrousers)"/>
    <path d="M366,272 Q364,306 368,344 L384,344 Q388,306 384,272 Z" fill="url(#p2p5theoTrousers)"/>
