    <path d="M349,118 Q346,140 354,154 L360,154 Q356,142 354,118 Z" fill="url(#p2p5theoHair)"/>
    <path d="M386,118 Q388,140 380,154 L374,154 Q378,142 380,118 Z" fill="url(#p2p5theoHair)"/>
    <!-- Eyes — downcast (looking at floor as he walks). -->
