<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 19 — Panel 1: Eye-level equality, "This is what I am."</title>
  <desc>MW 35mm eye level THE EQUALITY SHOT. Theodore standing at workbench, RIGHT half of frame. Jink hovering at his exact eye level under own wing-power, LEFT half. Face to face in open air. Scale difference vast (Jink's whole body = size of Theodore's face) but eye-level erases its significance. Jink: hovering steady, wings beating, serious truthful expression. Theodore: standing straight, hazel eyes steady, "I see you" expression. Emerald wing-light fills space between. Theodore's face left-side cool emerald, right-side warm candle rim.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p19p1coolBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a4018"/>
      <stop offset="50%" stop-color="#1a4828"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p19p1emeraldRadiance" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p1candleHalo" cx="100%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19p1theoSkinDual" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88c8a8"/>
      <stop offset="50%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p19p1coolWash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8ffd0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p19p1warmRim" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p19p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p19p1shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcc8a8"/>
      <stop offset="100%" stop-color="#7a6840"/>
    </linearGradient>
    <linearGradient id="p19p1vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p19p1jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p19p1jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p19p1emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p19p1wingMembrane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="p19p1bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p19p1strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p19p1deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="742" height="364" fill="url(#p19p1coolBg)"/>
  <ellipse cx="180" cy="180" rx="240" ry="220" fill="url(#p19p1emeraldRadiance)" opacity="0.85" filter="url(#p19p1deepBloom)"/>
  <ellipse cx="700" cy="220" rx="180" ry="160" fill="url(#p19p1candleHalo)" opacity="0.85"/>

  <!-- Bench surface (lower band). -->
  <rect x="0" y="320" width="742" height="44" fill="#3a2010"/>
  <line x1="0" y1="320" x2="742" y2="320" stroke="#1a0c04" stroke-width="2"/>

  <!-- ******** THEODORE STANDING right half ******** -->
  <g>
    <!-- Body lower (vest, shirt visible at bench level). -->
    <path d="M460,300 L450,364 L640,364 L630,300 Z" fill="url(#p19p1vest)"/>
    <!-- Shirt center. -->
    <path d="M508,290 L510,364 L580,364 L578,290 Z" fill="url(#p19p1shirt)"/>
    <!-- Buttons. -->
    <circle cx="544" cy="320" r="2" fill="#1a0c04"/>
    <circle cx="544" cy="340" r="2" fill="#1a0c04"/>
    <circle cx="544" cy="358" r="2" fill="#1a0c04"/>

    <!-- Sleeves rolled. -->
    <path d="M450,300 L420,250 Q412,240 420,232 L460,232 L468,300 Z" fill="url(#p19p1shirt)"/>
    <path d="M640,300 L670,250 Q678,240 670,232 L630,232 L622,300 Z" fill="url(#p19p1shirt)"/>

    <!-- Forearm visible (left, bent toward Jink). -->
    <path d="M420,250 Q400,220 396,196 L380,180 Q374,200 386,228 L420,260 Z" fill="url(#p19p1theoSkinDual)"/>
    <!-- Cool wash on left arm (Jink-facing). -->
    <ellipse cx="396" cy="218" rx="14" ry="22" fill="url(#p19p1coolWash)" opacity="0.85"/>
    <!-- Brass gear ring (left index, hand at lower-left). -->
    <ellipse cx="380" cy="184" rx="6" ry="3.5" fill="#fff0a8"/>
    <ellipse cx="380" cy="184" rx="6" ry="3.5" fill="none" stroke="#5a3018" stroke-width="0.4"/>

    <!-- Right hand at side. -->
    <path d="M670,260 Q686,232 700,222 L716,220 L712,236 Q702,260 686,272 L670,290 Z" fill="url(#p19p1theoSkinDual)"/>
    <!-- Warm wash on right side. -->
    <ellipse cx="704" cy="240" rx="14" ry="22" fill="url(#p19p1warmRim)" opacity="0.85"/>

    <!-- HEAD (face level with Jink, eyes steady). -->
    <ellipse cx="544" cy="120" rx="80" ry="92" fill="url(#p19p1theoSkinDual)"/>
    <!-- Cool emerald on left side. -->
    <path d="M464,120 Q464,40 544,40 L544,212 Q464,212 464,120 Z" fill="url(#p19p1coolWash)" opacity="0.65"/>
    <!-- Warm rim on right. -->
    <path d="M544,40 Q624,40 624,120 Q624,212 544,212 Z" fill="url(#p19p1warmRim)" opacity="0.55"/>

    <!-- Hair tousled. -->
    <g fill="url(#p19p1theoHair)">
      <path d="M468,72 Q462,18 540,4 Q548,2 558,4 Q620,18 614,72 L606,82 Q594,30 568,22 L518,22 Q500,30 480,82 Z"/>
      <path d="M474,22 L466,-12 L490,16 Z"/>
      <path d="M510,2 L504,-32 L526,12 Z"/>
      <path d="M536,-8 L552,-40 L552,4 Z"/>
      <path d="M566,2 L592,-32 L584,16 Z"/>
      <path d="M600,22 L622,-12 L612,32 Z"/>
      <path d="M474,82 L478,118 L490,72 Z"/>
      <path d="M504,98 L508,134 L520,84 Z"/>
      <path d="M538,108 L542,144 L554,92 Z"/>
      <path d="M564,98 L568,134 L580,84 Z"/>
      <path d="M598,82 L602,118 L614,72 Z"/>
    </g>
    <g stroke="#a8ffd0" stroke-width="2" opacity="0.55" filter="url(#p19p1bloom)">
      <line x1="482" y1="-8" x2="482" y2="14"/>
      <line x1="514" y1="-30" x2="514" y2="-2"/>
      <line x1="544" y1="-40" x2="544" y2="-8"/>
    </g>
    <g stroke="#ffd078" stroke-width="1.4" opacity="0.55">
      <line x1="576" y1="-30" x2="576" y2="-2"/>
      <line x1="608" y1="-8" x2="608" y2="14"/>
    </g>

    <!-- Eyes — STEADY, looking at Jink (slight left). -->
    <ellipse cx="510" cy="120" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="510" cy="120" rx="14" ry="9" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <ellipse cx="508" cy="120" rx="6" ry="6" fill="url(#p19p1theoHair)"/>
    <ellipse cx="508" cy="120" rx="3" ry="3" fill="#0a0604"/>
    <ellipse cx="510" cy="118" rx="1.4" ry="0.85" fill="#a8ffd0" filter="url(#p19p1bloom)"/>
    <ellipse cx="509" cy="118" rx="0.7" ry="0.4" fill="#ffffff"/>

    <ellipse cx="578" cy="120" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="578" cy="120" rx="14" ry="9" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <ellipse cx="576" cy="120" rx="6" ry="6" fill="url(#p19p1theoHair)"/>
    <ellipse cx="576" cy="120" rx="3" ry="3" fill="#0a0604"/>
    <ellipse cx="578" cy="118" rx="1.4" ry="0.85" fill="#a8ffd0" filter="url(#p19p1bloom)"/>
    <ellipse cx="577" cy="118" rx="0.7" ry="0.4" fill="#ffffff"/>

    <!-- Brows soft (settled wonder). -->
    <path d="M494,98 Q510,90 526,98" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M562,98 Q578,90 594,98" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M544,138 L526,180 Q544,188 562,180 Z" fill="#7a4828" opacity="0.55"/>

    <!-- Mouth — soft, settled (no smile yet, "I know"). -->
    <path d="M518,212 Q544,216 570,212" fill="none" stroke="#5a3018" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheek. -->
    <ellipse cx="478" cy="156" rx="14" ry="9" fill="#a8ffd0" opacity="0.32"/>
    <ellipse cx="610" cy="156" rx="14" ry="9" fill="#ffd078" opacity="0.45"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.85">
      <circle cx="496" cy="148" r="1.2"/>
      <circle cx="510" cy="156" r="1"/>
      <circle cx="524" cy="148" r="1.2"/>
      <circle cx="564" cy="148" r="1.2"/>
      <circle cx="578" cy="156" r="1"/>
      <circle cx="592" cy="148" r="1.2"/>
    </g>
  </g>

  <!-- ******** JINK HOVERING left half, at Theodore's eye level ******** -->
  <g transform="translate(180 120)">
    <!-- Wings beating (4 wings, motion blur). -->
    <!-- Upper-left. -->
    <path d="M-30,-12 L-130,-100 L-200,-110 L-220,-70 L-160,-30 L-80,-10 Z" fill="url(#p19p1wingMembrane)" opacity="0.75"/>
    <g stroke="#ffffff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#p19p1bloom)">
      <line x1="-200" y1="-110" x2="-80" y2="-10"/>
      <line x1="-160" y1="-80" x2="-100" y2="-30"/>
    </g>
    <path d="M-30,-12 L-130,-100 L-200,-110" fill="none" stroke="#a8ffd0" stroke-width="1.4" filter="url(#p19p1strongBloom)"/>

    <!-- Lower-left. -->
    <path d="M-30,12 L-130,100 L-200,110 L-220,70 L-160,30 L-80,10 Z" fill="url(#p19p1wingMembrane)" opacity="0.55"/>
    <g stroke="#ffffff" stroke-width="0.4" fill="none" opacity="0.65" filter="url(#p19p1bloom)">
      <line x1="-200" y1="110" x2="-80" y2="10"/>
    </g>

    <!-- Upper-right. -->
    <path d="M30,-12 L130,-100 L200,-110 L220,-70 L160,-30 L80,-10 Z" fill="url(#p19p1wingMembrane)" opacity="0.75"/>
    <g stroke="#ffffff" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#p19p1bloom)">
      <line x1="200" y1="-110" x2="80" y2="-10"/>
      <line x1="160" y1="-80" x2="100" y2="-30"/>
    </g>
    <path d="M30,-12 L130,-100 L200,-110" fill="none" stroke="#a8ffd0" stroke-width="1.4" filter="url(#p19p1strongBloom)"/>

    <!-- Lower-right. -->
    <path d="M30,12 L130,100 L200,110 L220,70 L160,30 L80,10 Z" fill="url(#p19p1wingMembrane)" opacity="0.55"/>
    <g stroke="#ffffff" stroke-width="0.4" fill="none" opacity="0.65" filter="url(#p19p1bloom)">
      <line x1="200" y1="110" x2="80" y2="10"/>
    </g>

    <!-- TINY JINK FIGURE at center. -->
    <!-- Legs (slightly trailing). -->
    <path d="M-6,18 L-8,52 L-2,52 L-2,18 Z" fill="url(#p19p1emeraldSuit)"/>
    <path d="M2,18 L4,52 L8,52 L8,18 Z" fill="url(#p19p1emeraldSuit)"/>

    <!-- Torso. -->
    <path d="M-12,-18 Q-16,12 -8,18 L10,18 Q20,12 16,-18 Q12,-26 0,-26 Q-10,-26 -12,-18 Z" fill="url(#p19p1emeraldSuit)"/>
    <line x1="0" y1="-26" x2="0" y2="18" stroke="#0a4018" stroke-width="0.4"/>
    <circle cx="0" cy="-8" r="1.4" fill="#a8ffd0" filter="url(#p19p1bloom)"/>
    <circle cx="0" cy="8" r="1.4" fill="#a8ffd0" filter="url(#p19p1bloom)"/>
    <!-- Soot. -->
    <path d="M-12,-4 Q0,-6 16,-2 Q16,8 16,14 L-12,14 Z" fill="#1a0c04" opacity="0.55"/>

    <!-- Wing-pack. -->
    <rect x="-10" y="-26" width="20" height="8" fill="#1a4828"/>
    <line x1="-10" y1="-22" x2="10" y2="-22" stroke="#ffffff" stroke-width="2" filter="url(#p19p1strongBloom)"/>

    <!-- Arms steady at sides (hovering control). -->
    <path d="M-12,-16 Q-22,-2 -22,14 L-14,14 Q-12,-2 -10,-16 Z" fill="url(#p19p1emeraldSuit)"/>
    <path d="M16,-16 Q26,-2 26,14 L14,14 Q12,-2 14,-16 Z" fill="url(#p19p1emeraldSuit)"/>

    <!-- Head — face on, looking RIGHT toward Theodore. -->
    <ellipse cx="0" cy="-38" rx="11" ry="13" fill="url(#p19p1jinkSkin)"/>
    <g fill="url(#p19p1jinkHair)">
      <ellipse cx="-12" cy="-52" rx="6" ry="7"/>
      <ellipse cx="-2" cy="-58" rx="6" ry="7"/>
      <ellipse cx="8" cy="-58" rx="6" ry="7"/>
      <ellipse cx="16" cy="-52" rx="6" ry="7"/>
      <ellipse cx="-16" cy="-44" rx="5" ry="6"/>
      <ellipse cx="20" cy="-44" rx="5" ry="6"/>
      <ellipse cx="-12" cy="-30" rx="4" ry="6"/>
      <ellipse cx="16" cy="-30" rx="4" ry="6"/>
    </g>

    <!-- Eyes (looking right at Theodore). -->
    <ellipse cx="-3" cy="-38" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-2" cy="-38" r="1.2" fill="#2a4830"/>
    <circle cx="-2" cy="-38" r="0.6" fill="#0a0604"/>
    <ellipse cx="6" cy="-38" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="7" cy="-38" r="1.2" fill="#2a4830"/>
    <circle cx="7" cy="-38" r="0.6" fill="#0a0604"/>

    <!-- Brows level (serious truthful). -->
    <path d="M-7,-44 Q-3,-46 1,-44" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <path d="M3,-44 Q7,-46 11,-44" fill="none" stroke="#3a2810" stroke-width="0.7"/>

    <!-- Nose. -->
    <path d="M2,-32 L0,-26 Q2,-25 4,-26 Z" fill="#7a4828" opacity="0.55"/>

    <!-- Mouth — serious (not performing). -->
    <path d="M-4,-20 Q2,-18 8,-20" fill="none" stroke="#5a3018" stroke-width="0.85"/>
  </g>

  <!-- DIALOGUE. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="184" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M68,58 L80,58 L70,76 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="69.5" y1="58.5" x2="78" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-style="italic">This is what I am.</text>

  <g filter="url(#balloonShadow)">
    <rect x="608" y="14" width="120" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M642,58 L654,58 L644,76 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="643.5" y1="58.5" x2="652" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="616" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="616" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="600">I know.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
  </g>
</svg>
