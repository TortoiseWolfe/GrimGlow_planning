<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 13 — Panel 3: MCU Theodore reaction "A soldier" / "you're very small for a soldier" / "you look like... like a fairy"</title>
  <desc>MCU 50mm straight on Theodore. Twelve-year-old Victorian boy, sandy-brown hair, hazel eyes now narrowed in examination, brow furrowed, freckles. Has leaned in closer — face enormous in frame, blocking light, deepening shadows behind. Tinker's scrutiny — practical assessment, the look he gives a mechanism. Beneath, flicker of older recognition matching against grandmother's stories. Warm golden candlelight full on face. Three dialogue beats stacked at frame edges — "A soldier." (left top), "You're very small for a soldier." (right mid), "You look like... like a fairy." (left bottom).</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p13p3deepDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#080200"/>
    </linearGradient>
    <radialGradient id="p13p3candleHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#080200" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p13p3theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p13p3theoSkinWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffe0a8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="p13p3theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <filter id="p13p3bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p13p3deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG — deep dark workshop, head eclipses light. -->
  <rect width="742" height="364" fill="url(#p13p3deepDark)"/>
  <!-- Vignette: warm halo edges only, head blocking center. -->
  <ellipse cx="40" cy="200" rx="180" ry="240" fill="url(#p13p3candleHalo)" opacity="0.55"/>
  <ellipse cx="700" cy="200" rx="180" ry="240" fill="url(#p13p3candleHalo)" opacity="0.55"/>

  <!-- Faint workshop fragments at frame edges (almost lost in shadow). -->
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.45">
    <line x1="0" y1="80" x2="40" y2="80"/>
    <line x1="0" y1="280" x2="40" y2="280"/>
    <line x1="700" y1="80" x2="742" y2="80"/>
    <line x1="700" y1="280" x2="742" y2="280"/>
  </g>

  <!-- ENORMOUS HEAD eclipsing center. -->
  <g>
    <!-- Face, leaned forward — fills the frame. -->
    <ellipse cx="371" cy="200" rx="220" ry="200" fill="url(#p13p3theoSkin)"/>
    <ellipse cx="371" cy="200" rx="220" ry="200" fill="url(#p13p3theoSkinWarm)" opacity="0.7"/>

    <!-- Hair tousled spikes — lifting off in arc above. -->
    <g fill="url(#p13p3theoHair)">
      <path d="M180,80 Q160,-10 280,-30 Q371,-44 462,-30 Q582,-10 562,80 L552,90 Q530,-10 500,-22 L242,-22 Q212,-10 190,90 Z"/>
      <path d="M194,-20 L182,-72 L218,-12 Z"/>
      <path d="M242,-32 L228,-90 L274,-22 Z"/>
      <path d="M298,-44 L308,-108 L334,-34 Z"/>
      <path d="M364,-50 L378,-114 L394,-40 Z"/>
      <path d="M428,-44 L460,-100 L446,-30 Z"/>
      <path d="M488,-32 L526,-86 L514,-18 Z"/>
      <path d="M548,-20 L580,-58 L568,12 Z"/>
      <!-- Bangs. -->
      <path d="M188,90 L194,140 L218,80 Z"/>
      <path d="M240,108 L246,158 L268,98 Z"/>
      <path d="M298,118 L304,168 L324,108 Z"/>
      <path d="M348,124 L354,174 L374,114 Z"/>
      <path d="M398,124 L404,174 L424,114 Z"/>
      <path d="M448,118 L454,168 L474,108 Z"/>
      <path d="M500,108 L506,158 L526,98 Z"/>
      <path d="M548,90 L554,140 L578,80 Z"/>
    </g>
    <g stroke="#ffd078" stroke-width="2" opacity="0.7">
      <line x1="200" y1="-50" x2="200" y2="-12"/>
      <line x1="252" y1="-72" x2="252" y2="-22"/>
      <line x1="316" y1="-86" x2="316" y2="-32"/>
      <line x1="380" y1="-94" x2="380" y2="-40"/>
      <line x1="450" y1="-80" x2="450" y2="-30"/>
      <line x1="510" y1="-66" x2="510" y2="-18"/>
      <line x1="558" y1="-44" x2="558" y2="6"/>
    </g>

    <!-- EYES — narrowed in examination, tinker's scrutiny. -->
    <!-- Left eye narrowed. -->
    <path d="M232,180 Q254,168 296,168 Q322,170 322,194 Q294,202 256,200 Q236,196 232,180 Z" fill="#fff8e8"/>
    <path d="M232,180 Q254,168 296,168 Q322,170 322,194 Q294,202 256,200 Q236,196 232,180 Z" fill="none" stroke="#3a2810" stroke-width="1.4"/>
    <!-- Iris partially covered by upper lid (narrowed). -->
    <ellipse cx="278" cy="184" rx="22" ry="18" fill="url(#p13p3theoHair)"/>
    <ellipse cx="278" cy="184" rx="22" ry="18" fill="url(#p13p3theoSkinWarm)" opacity="0.45"/>
    <ellipse cx="278" cy="186" rx="10" ry="10" fill="#0a0604"/>
    <!-- Catchlight. -->
    <ellipse cx="284" cy="180" rx="3" ry="2" fill="#fff8e8" filter="url(#p13p3bloom)"/>
    <ellipse cx="282" cy="180" rx="1.4" ry="0.9" fill="#ffffff"/>
    <!-- Upper lid (narrowed). -->
    <path d="M232,180 Q272,162 322,180" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lower lid. -->
    <path d="M236,194 Q278,206 318,194" fill="none" stroke="#5a3018" stroke-width="1.4"/>
    <!-- Lashes (low angle visible). -->
    <g stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round">
      <line x1="248" y1="172" x2="246" y2="166"/>
      <line x1="266" y1="166" x2="266" y2="158"/>
      <line x1="284" y1="164" x2="284" y2="156"/>
      <line x1="302" y1="166" x2="304" y2="160"/>
    </g>

    <!-- Right eye narrowed. -->
    <path d="M420,180 Q446,168 488,168 Q510,170 510,194 Q482,202 448,200 Q426,196 420,180 Z" fill="#fff8e8"/>
    <path d="M420,180 Q446,168 488,168 Q510,170 510,194 Q482,202 448,200 Q426,196 420,180 Z" fill="none" stroke="#3a2810" stroke-width="1.4"/>
    <ellipse cx="466" cy="184" rx="22" ry="18" fill="url(#p13p3theoHair)"/>
    <ellipse cx="466" cy="184" rx="22" ry="18" fill="url(#p13p3theoSkinWarm)" opacity="0.45"/>
    <ellipse cx="466" cy="186" rx="10" ry="10" fill="#0a0604"/>
    <ellipse cx="472" cy="180" rx="3" ry="2" fill="#fff8e8" filter="url(#p13p3bloom)"/>
    <ellipse cx="470" cy="180" rx="1.4" ry="0.9" fill="#ffffff"/>
    <path d="M420,180 Q464,162 510,180" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M424,194 Q466,206 508,194" fill="none" stroke="#5a3018" stroke-width="1.4"/>
    <g stroke="#1a0c04" stroke-width="1.4" stroke-linecap="round">
      <line x1="436" y1="172" x2="434" y2="166"/>
      <line x1="454" y1="166" x2="454" y2="158"/>
      <line x1="472" y1="164" x2="472" y2="156"/>
      <line x1="490" y1="166" x2="492" y2="160"/>
    </g>

    <!-- BROWS FURROWED slightly, drawn down + together. -->
    <path d="M210,146 Q260,128 318,142" fill="none" stroke="#3a2810" stroke-width="5" stroke-linecap="round"/>
    <path d="M422,142 Q482,128 524,146" fill="none" stroke="#3a2810" stroke-width="5" stroke-linecap="round"/>
    <!-- Vertical furrow between brows (concentration). -->
    <line x1="365" y1="148" x2="362" y2="172" stroke="#5a3018" stroke-width="1.4"/>
    <line x1="378" y1="148" x2="380" y2="172" stroke="#5a3018" stroke-width="1.4"/>

    <!-- NOSE — large prominent (leaned in). -->
    <path d="M371,200 L344,272 Q371,282 396,272 Z" fill="#a8765a" opacity="0.55"/>
    <ellipse cx="371" cy="220" rx="14" ry="8" fill="url(#p13p3theoSkinWarm)" opacity="0.65"/>
    <ellipse cx="354" cy="262" rx="6" ry="3" fill="#3a2010"/>
    <ellipse cx="388" cy="262" rx="6" ry="3" fill="#3a2010"/>

    <!-- MOUTH — slightly parted, processing. -->
    <path d="M324,308 Q371,316 418,308 L412,328 Q371,336 330,328 Z" fill="#3a1408"/>
    <path d="M328,310 L414,310 L412,322 L330,322 Z" fill="#fff8e8" opacity="0.78"/>
    <line x1="350" y1="310" x2="350" y2="322" stroke="#a85820" stroke-width="0.55"/>
    <line x1="371" y1="310" x2="371" y2="322" stroke="#a85820" stroke-width="0.55"/>
    <line x1="394" y1="310" x2="394" y2="322" stroke="#a85820" stroke-width="0.55"/>

    <!-- Cheekbones with shadow (head leaned in = strong cheek shadow). -->
    <ellipse cx="240" cy="240" rx="36" ry="20" fill="#5a3018" opacity="0.45"/>
    <ellipse cx="502" cy="240" rx="36" ry="20" fill="#5a3018" opacity="0.45"/>
    <!-- Jaw shadow underside. -->
    <ellipse cx="371" cy="356" rx="120" ry="22" fill="#1a0c04" opacity="0.45"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.95">
      <circle cx="238" cy="234" r="1.4"/>
      <circle cx="256" cy="244" r="1.2"/>
      <circle cx="280" cy="234" r="1.4"/>
      <circle cx="462" cy="234" r="1.4"/>
      <circle cx="486" cy="244" r="1.2"/>
      <circle cx="504" cy="234" r="1.4"/>
    </g>
  </g>

  <!-- DIALOGUE 1 — "A soldier." (top-left). -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="124" height="56" rx="12" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M50,70 L62,70 L52,88 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="51.5" y1="70.5" x2="60.5" y2="70.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="600">A soldier.</text>

  <!-- DIALOGUE 2 — "You're very small for a soldier." (top-right). -->
  <g filter="url(#balloonShadow)">
    <rect x="494" y="14" width="234" height="56" rx="12" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M540,70 L552,70 L538,88 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="541.5" y1="70.5" x2="550.5" y2="70.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="502" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="502" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-style="italic">You're very small for a soldier.</text>

  <!-- DIALOGUE 3 — "You look like... like a fairy." (bottom-left, the naming). -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="240" height="56" rx="12" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M60,296 L72,296 L62,278 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="61.5" y1="295.5" x2="70.5" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="600">You look like... like a fairy.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
  </g>
</svg>
