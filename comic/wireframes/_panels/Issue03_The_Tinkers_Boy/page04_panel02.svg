<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240.7 364" width="240.7" height="364">
  <title>Issue 3 — Page 4 — Panel 2: MCU Cribbage at door, leaving</title>
  <desc>MCU 50mm. Mr. Cribbage at the shop door, pulling on a heavy dark overcoat, speaks over his shoulder without turning fully. Thinning hair, mutton-chop sideburns, spectacles, keys in one hand. Expression already elsewhere — not cruel, just absent. Grey daylight spills through open door, mixing with warm amber gaslight from workshop interior behind him. Threshold between cold street and warm shop. Casual departure.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p4p2interior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p4p2streetLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8a86"/>
      <stop offset="100%" stop-color="#5a5a56"/>
    </linearGradient>
    <linearGradient id="p4p2doorframe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1408"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="p4p2door" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p4p2interiorGlow" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p4p2streetGlow" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5a5a56" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p4p2cribSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d0a8"/>
      <stop offset="100%" stop-color="#9a7050"/>
    </linearGradient>
    <linearGradient id="p4p2overcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3024"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="p4p2shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <radialGradient id="p4p2cribHair">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p4p2brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </linearGradient>
    <filter id="p4p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- INTERIOR — warm-amber workshop wall (left half + behind Cribbage). -->
  <rect width="240.7" height="364" fill="url(#p4p2interior)"/>
  <rect width="240.7" height="364" fill="url(#p4p2interiorGlow)" opacity="0.85"/>

  <!-- A bit of workshop interior visible behind Cribbage (warm tones). -->
  <g opacity="0.85">
    <line x1="0" y1="86" x2="148" y2="86" stroke="#4a2818" stroke-width="1" opacity="0.7"/>
    <circle cx="34" cy="78" r="6" fill="#3a2010"/>
    <circle cx="34" cy="78" r="3" fill="#5a3818"/>
    <rect x="56" y="70" width="12" height="16" fill="#3a2010"/>
    <circle cx="92" cy="78" r="7" fill="#3a2010"/>
    <circle cx="92" cy="78" r="4" fill="#5a3818"/>
    <rect x="116" y="70" width="12" height="16" fill="#3a2010"/>
    <!-- Wall sconce visible at left. -->
    <rect x="14" y="118" width="2" height="18" fill="#3a2010"/>
    <circle cx="15" cy="138" r="4" fill="url(#p4p2brass)"/>
    <circle cx="15" cy="138" r="2" fill="#fff0a8" filter="url(#p4p2bloom)"/>
  </g>

  <!-- DOOR FRAME on right side of panel (open doorway). -->
  <rect x="148" y="0" width="92.7" height="364" fill="url(#p4p2doorframe)"/>
  <!-- Door frame moulding lines. -->
  <g stroke="#0a0402" stroke-width="0.7" opacity="0.85">
    <line x1="156" y1="0" x2="156" y2="364"/>
    <line x1="164" y1="0" x2="164" y2="364"/>
  </g>

  <!-- OPEN DOORWAY revealing grey street outside. -->
  <rect x="166" y="0" width="74.7" height="364" fill="url(#p4p2streetLight)"/>
  <rect x="166" y="0" width="74.7" height="364" fill="url(#p4p2streetGlow)"/>

  <!-- Cobblestones visible at bottom of doorway. -->
  <rect x="166" y="320" width="74.7" height="44" fill="#5a5048"/>
  <g stroke="#1a1208" stroke-width="0.4" opacity="0.7">
    <line x1="166" y1="338" x2="240.7" y2="336"/>
    <line x1="166" y1="354" x2="240.7" y2="352"/>
    <line x1="180" y1="320" x2="184" y2="364"/>
    <line x1="200" y1="320" x2="206" y2="364"/>
    <line x1="220" y1="320" x2="228" y2="364"/>
  </g>
  <!-- Building across street suggestion (dark, distant). -->
  <rect x="166" y="0" width="74.7" height="100" fill="#5a4838" opacity="0.55"/>
  <rect x="166" y="0" width="74.7" height="100" fill="#3a2818" opacity="0.4"/>
  <line x1="166" y1="50" x2="240.7" y2="48" stroke="#3a2010" stroke-width="0.5" opacity="0.55"/>
  <line x1="166" y1="80" x2="240.7" y2="78" stroke="#3a2010" stroke-width="0.5" opacity="0.55"/>

  <!-- DOOR (partially open, hinged on inside-left, swung outward — we see it from inside).
       Hand of door is at angle: visible edge silhouette. -->
  <g>
    <!-- Door open at ~45 degrees, casting shadow. Visible as dark wedge on right. -->
    <path d="M156,0 L172,16 L172,348 L156,364 Z" fill="url(#p4p2door)"/>
    <!-- Door panels (recessed). -->
    <rect x="158" y="40" width="12" height="80" fill="none" stroke="#0a0402" stroke-width="0.8"/>
    <rect x="158" y="130" width="12" height="80" fill="none" stroke="#0a0402" stroke-width="0.8"/>
    <rect x="158" y="220" width="12" height="80" fill="none" stroke="#0a0402" stroke-width="0.8"/>
    <!-- Door knob at edge. -->
    <circle cx="170" cy="170" r="2.5" fill="url(#p4p2brass)"/>
  </g>

  <!-- CRIBBAGE — at the threshold, just inside door, pulling on overcoat, keys in hand.
       He faces the door (image-right) but speaks back over his LEFT shoulder toward Theodore (image-left). -->
  <g>
    <!-- Trousers below coat hem. -->
    <path d="M68,294 Q66,330 72,360 L86,360 Q88,330 86,294 Z" fill="#2a2418"/>
    <path d="M88,294 Q86,330 92,360 L106,360 Q108,330 106,294 Z" fill="#2a2418"/>
    <ellipse cx="78" cy="362" rx="10" ry="2" fill="#0a0402"/>
    <ellipse cx="98" cy="362" rx="10" ry="2" fill="#0a0402"/>

    <!-- HEAVY OVERCOAT — long, dark, double-breasted, just being pulled on.
         One arm in the sleeve, other arm just entering. -->
    <path d="M48,140 Q40,260 56,300 L120,300 Q132,260 124,140 Q108,128 86,128 Q62,128 48,140 Z" fill="url(#p4p2overcoat)"/>
    <!-- Overcoat collar — high, dark wool. -->
    <path d="M68,128 Q72,138 86,140 Q100,138 104,128 L104,118 L68,118 Z" fill="url(#p4p2overcoat)"/>
    <path d="M68,128 Q72,138 86,140 Q100,138 104,128 L104,118 L68,118 Z" fill="#000" opacity="0.45"/>
    <!-- Coat lapels (double-breasted with two rows of buttons). -->
    <path d="M64,142 L70,200 L78,250 L86,300" fill="none" stroke="#0a0604" stroke-width="0.7" opacity="0.85"/>
    <path d="M108,142 L102,200 L94,250 L86,300" fill="none" stroke="#0a0604" stroke-width="0.7" opacity="0.85"/>
    <circle cx="74" cy="166" r="1.6" fill="#1a1208"/>
    <circle cx="100" cy="166" r="1.6" fill="#1a1208"/>
    <circle cx="74" cy="186" r="1.6" fill="#1a1208"/>
    <circle cx="100" cy="186" r="1.6" fill="#1a1208"/>
    <circle cx="76" cy="206" r="1.6" fill="#1a1208"/>
    <circle cx="98" cy="206" r="1.6" fill="#1a1208"/>
    <circle cx="78" cy="226" r="1.6" fill="#1a1208"/>
    <circle cx="96" cy="226" r="1.6" fill="#1a1208"/>

    <!-- LEFT ARM — already in coat sleeve, hanging down with KEYS in hand. -->
    <path d="M48,144 Q36,184 32,232 L48,236 Q56,196 60,148 Z" fill="url(#p4p2overcoat)"/>
    <path d="M32,236 Q28,272 32,294 L52,294 Q54,260 50,236 Z" fill="url(#p4p2overcoat)"/>
    <!-- Hand holding keys. -->
    <ellipse cx="40" cy="298" rx="9" ry="6" fill="url(#p4p2cribSkin)"/>
    <path d="M32,298 Q40,300 48,298" fill="none" stroke="#7a4828" stroke-width="0.7"/>
    <!-- KEYS on iron ring. -->
    <circle cx="44" cy="316" r="4" fill="none" stroke="url(#p4p2brass)" stroke-width="1.4"/>
    <line x1="44" y1="320" x2="40" y2="332" stroke="url(#p4p2brass)" stroke-width="1.4"/>
    <line x1="40" y1="332" x2="42" y2="334" stroke="url(#p4p2brass)" stroke-width="1.4"/>
    <line x1="44" y1="320" x2="48" y2="332" stroke="url(#p4p2brass)" stroke-width="1.4"/>
    <line x1="48" y1="332" x2="46" y2="334" stroke="url(#p4p2brass)" stroke-width="1.4"/>
    <line x1="44" y1="320" x2="44" y2="334" stroke="url(#p4p2brass)" stroke-width="1.4"/>

    <!-- RIGHT ARM — in motion, just having pulled coat sleeve UP (mid-action).
         The arm is bent at elbow, hand near the back of his neck adjusting collar. -->
    <path d="M124,148 Q140,180 144,220 L130,224 Q124,200 120,150 Z" fill="url(#p4p2overcoat)"/>
    <path d="M144,220 Q150,230 144,240 Q138,232 132,224 Z" fill="url(#p4p2overcoat)"/>
    <!-- Forearm visible as it bends back. -->
    <path d="M130,224 Q116,224 110,212 L108,200 Q120,200 130,210 Z" fill="url(#p4p2overcoat)"/>
    <!-- Hand reaching up to back of collar. -->
    <ellipse cx="106" cy="200" rx="6" ry="4" fill="url(#p4p2cribSkin)"/>

    <!-- HEAD — turned over LEFT shoulder to speak. We see profile facing image-LEFT. -->
    <ellipse cx="86" cy="92" rx="20" ry="22" fill="url(#p4p2cribSkin)"/>
    <!-- Hair (thinning). -->
    <path d="M68,82 Q70,60 86,56 Q102,60 104,82 L100,86 Q98,68 92,64 L80,64 Q74,68 72,86 Z" fill="url(#p4p2cribHair)"/>
    <!-- Mutton-chop sideburns. -->
    <path d="M68,90 Q66,108 74,116 L82,116 L82,98 Z" fill="url(#p4p2cribHair)"/>
    <path d="M104,90 Q106,108 98,116 L92,116 L92,98 Z" fill="url(#p4p2cribHair)"/>
    <!-- Spectacles. -->
    <ellipse cx="78" cy="94" rx="5" ry="3.5" fill="none" stroke="#1a1408" stroke-width="0.8"/>
    <ellipse cx="94" cy="94" rx="5" ry="3.5" fill="none" stroke="#1a1408" stroke-width="0.8"/>
    <line x1="83" y1="94" x2="89" y2="94" stroke="#1a1408" stroke-width="0.7"/>
    <ellipse cx="78" cy="94" rx="4" ry="2.5" fill="#a89878" opacity="0.3"/>
    <ellipse cx="94" cy="94" rx="4" ry="2.5" fill="#a89878" opacity="0.3"/>
    <!-- Brow + eye. -->
    <path d="M74,90 Q78,88 82,90" fill="none" stroke="#1a1408" stroke-width="0.7"/>
    <path d="M88,90 Q92,88 96,90" fill="none" stroke="#1a1408" stroke-width="0.7"/>
    <!-- Eye looking sideways toward viewer-left. -->
    <ellipse cx="76" cy="95" rx="1.6" ry="0.9" fill="#3a2810"/>
    <ellipse cx="92" cy="95" rx="1.6" ry="0.9" fill="#3a2810"/>
    <!-- Pupils slid left. -->
    <ellipse cx="74" cy="95" rx="0.5" ry="0.7" fill="#0a0604"/>
    <ellipse cx="90" cy="95" rx="0.5" ry="0.7" fill="#0a0604"/>
    <!-- Nose. -->
    <path d="M86,98 L82,108 Q86,110 90,108 Z" fill="#a8765a" opacity="0.55"/>
    <!-- Mouth — talking, slight open. -->
    <path d="M80,116 Q86,118 92,116" fill="none" stroke="#5a3018" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Chin. -->
    <path d="M86,116 L86,122" fill="none" stroke="#5a3018" stroke-width="0.5"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#1a1208" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M120,200 Q160,205 220,202"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- CRIBBAGE balloon — top, tail to his mouth. -->
  <rect x="10" y="10" width="220" height="62" rx="8"
        fill="#ffffff" stroke="#5a4a30" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M70,72 L82,72 L88,98 Z"
        fill="#ffffff" stroke="#5a4a30" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="70" y1="72" x2="82" y2="72" stroke="#ffffff" stroke-width="3"/>
  <text x="20" y="32"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#5a4a30" letter-spacing="0.3">CRIBBAGE</text>
  <text x="20" y="50"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Lock up when you've finished the</text>
  <text x="20" y="66"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">mainspring. Don't touch the Whitfield.</text>

</svg>
