<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 19 — Panel 3: Profile both faces, "Thank you" / "Don't tell anyone" / "Who would believe me?"</title>
  <desc>MED 50mm profile both faces same height. Theodore profile RIGHT, Jink profile LEFT (hovering). Wing-light between fading as wings slow. Geometric shadows playing across Theodore's skin. Theodore: first FULL smile of issue, slightly sad at edges. Jink: mirrored smile but smaller, more complex (joy + cost). Theodore's profile catches warm candle rim from behind. Jink's profile catches emerald from own slowing wings. Two smiles at radically different scales, mirror compositions.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p19p3coolBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4828"/>
      <stop offset="100%" stop-color="#0a2818"/>
    </linearGradient>
    <radialGradient id="p19p3emeraldFade" cx="35%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p3warmRim" cx="100%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19p3theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88c8a8"/>
      <stop offset="50%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <radialGradient id="p19p3theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p19p3jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p19p3jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p19p3emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p19p3wingMembrane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="p19p3bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p19p3deepBloom"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="364" fill="url(#p19p3coolBg)"/>
  <ellipse cx="128" cy="180" rx="160" ry="180" fill="url(#p19p3emeraldFade)" opacity="0.85" filter="url(#p19p3deepBloom)"/>
  <ellipse cx="366" cy="180" rx="80" ry="100" fill="url(#p19p3warmRim)" opacity="0.85"/>

  <!-- Geometric shadows playing on Theodore (from wings). -->
  <g stroke="#a8ffd0" stroke-width="0.55" opacity="0.45" filter="url(#p19p3bloom)">
    <line x1="220" y1="80" x2="280" y2="120"/>
    <line x1="280" y1="80" x2="220" y2="120"/>
    <line x1="200" y1="280" x2="260" y2="320"/>
  </g>

  <!-- ******** THEODORE PROFILE RIGHT ******** -->
  <g>
    <!-- Hair top. -->
    <g fill="url(#p19p3theoHair)">
      <path d="M210,80 Q200,20 280,8 Q320,0 350,12 Q360,24 360,80 L350,90 Q340,18 320,8 L260,8 Q230,18 220,90 Z"/>
      <path d="M218,8 L208,-32 L240,4 Z"/>
      <path d="M254,-12 L250,-50 L274,-2 Z"/>
      <path d="M294,-22 L320,-46 L308,2 Z"/>
      <path d="M338,-12 L362,-32 L348,8 Z"/>
    </g>

    <!-- Profile silhouette face. -->
    <path d="M218,90 Q210,140 220,180 Q224,200 232,210 L260,224 Q280,228 296,222 Q302,200 308,180 Q318,140 308,90 Z" fill="url(#p19p3theoSkin)"/>

    <!-- Profile features (right-facing inward toward Jink — left side of face visible). -->
    <!-- Eye in profile. -->
    <ellipse cx="240" cy="140" rx="11" ry="8" fill="#fff8e8"/>
    <ellipse cx="240" cy="140" rx="11" ry="8" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <ellipse cx="234" cy="140" rx="5" ry="5" fill="url(#p19p3theoHair)"/>
    <ellipse cx="234" cy="140" rx="2.5" ry="2.5" fill="#0a0604"/>
    <ellipse cx="232" cy="138" rx="1.4" ry="0.85" fill="#a8ffd0" filter="url(#p19p3bloom)"/>

    <!-- Brow. -->
    <path d="M222,118 Q236,112 252,118" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose profile (pointing left). -->
    <path d="M230,154 L210,176 Q208,190 220,194 L236,192 L236,176 Z" fill="url(#p19p3theoSkin)"/>
    <path d="M230,154 L210,176 Q208,190 220,194" fill="none" stroke="#5a3018" stroke-width="0.7"/>
    <ellipse cx="220" cy="190" rx="2" ry="1.4" fill="#3a2010"/>

    <!-- MOUTH — FULL SMILE (slightly sad at edges). -->
    <path d="M232,210 Q248,224 268,218 Q278,212 278,210" fill="none" stroke="#5a3018" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="252" cy="216" rx="14" ry="4" fill="#3a1408" opacity="0.65"/>
    <path d="M240,212 L266,212" stroke="#fff8e8" stroke-width="1.4" opacity="0.65"/>
    <!-- Slight downturn at corners (sad edges). -->
    <path d="M232,212 L228,216" stroke="#5a3018" stroke-width="1"/>
    <path d="M278,212 L282,216" stroke="#5a3018" stroke-width="1"/>

    <!-- Cheek. -->
    <ellipse cx="266" cy="170" rx="14" ry="9" fill="#ffd078" opacity="0.55"/>
    <!-- Cool wash on left/Jink side. -->
    <ellipse cx="230" cy="170" rx="14" ry="9" fill="#a8ffd0" opacity="0.45" filter="url(#p19p3bloom)"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.85">
      <circle cx="252" cy="166" r="1.2"/>
      <circle cx="262" cy="174" r="1"/>
      <circle cx="272" cy="166" r="1.2"/>
    </g>

    <!-- Ear silhouette. -->
    <ellipse cx="296" cy="148" rx="6" ry="11" fill="url(#p19p3theoSkin)"/>
  </g>

  <!-- ******** JINK PROFILE LEFT (hovering, wings behind) ******** -->
  <g>
    <!-- Wings (slowing, fainter). -->
    <path d="M100,140 L20,80 L0,120 L40,150 L80,160 Z" fill="url(#p19p3wingMembrane)" opacity="0.65"/>
    <g stroke="#ffffff" stroke-width="0.4" fill="none" opacity="0.65" filter="url(#p19p3bloom)">
      <line x1="0" y1="120" x2="80" y2="160"/>
      <line x1="20" y1="80" x2="80" y2="160"/>
    </g>
    <path d="M100,180 L20,240 L0,200 L40,170 L80,160 Z" fill="url(#p19p3wingMembrane)" opacity="0.45"/>

    <!-- Profile head. -->
    <ellipse cx="118" cy="160" rx="13" ry="14" fill="url(#p19p3jinkSkin)"/>
    <!-- Hair (golden curls profile). -->
    <g fill="url(#p19p3jinkHair)">
      <ellipse cx="106" cy="146" rx="6" ry="9"/>
      <ellipse cx="116" cy="138" rx="6" ry="8"/>
      <ellipse cx="128" cy="142" rx="6" ry="9"/>
      <ellipse cx="100" cy="158" rx="5" ry="7"/>
      <ellipse cx="98" cy="172" rx="5" ry="7"/>
    </g>

    <!-- Profile eye. -->
    <ellipse cx="124" cy="158" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="125" cy="158" r="1.2" fill="#2a4830"/>
    <circle cx="125" cy="158" r="0.6" fill="#0a0604"/>
    <ellipse cx="125.5" cy="157" rx="0.55" ry="0.4" fill="#ffffff"/>

    <!-- Brow. -->
    <path d="M120,154 Q124,151 128,154" fill="none" stroke="#3a2810" stroke-width="0.7"/>

    <!-- Profile nose (right-pointing). -->
    <path d="M130,162 L138,166 L136,170 L130,168 Z" fill="url(#p19p3jinkSkin)"/>
    <line x1="135" y1="168" x2="132" y2="168" stroke="#5a3018" stroke-width="0.4"/>

    <!-- MOUTH — smaller smile, more complex. -->
    <path d="M124,176 Q132,180 138,176" fill="none" stroke="#5a3018" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="131" cy="178" rx="3" ry="1" fill="#3a1408" opacity="0.55"/>
    <!-- Slight cost-edge. -->
    <path d="M124,178 L122,182" stroke="#5a3018" stroke-width="0.55"/>

    <!-- Body suggestion below. -->
    <path d="M104,174 Q100,210 110,240 L132,240 Q142,210 132,174 Z" fill="url(#p19p3emeraldSuit)"/>
    <line x1="118" y1="174" x2="118" y2="240" stroke="#0a4018" stroke-width="0.4"/>
    <circle cx="118" cy="200" r="1.4" fill="#a8ffd0" filter="url(#p19p3bloom)"/>
  </g>

  <!-- DIALOGUE — 3 beats. -->
  <g filter="url(#balloonShadow)">
    <rect x="194" y="14" width="158" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M222,58 L234,58 L224,76 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="223.5" y1="58.5" x2="232" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="202" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="202" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Thank you.</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="74" width="172" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M150,118 L162,118 L152,136 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="151.5" y1="118.5" x2="160" y2="118.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Don't tell anyone.</text>

  <g filter="url(#balloonShadow)">
    <rect x="180" y="296" width="172" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M218,296 L230,296 L220,278 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="219.5" y1="295.5" x2="228" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="188" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="188" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Who would believe me?</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q120,45 246,42"/>
    <path d="M246,40 Q310,45 366,42"/>
  </g>
</svg>
