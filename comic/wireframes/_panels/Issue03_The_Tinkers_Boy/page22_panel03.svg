<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 22 — Panel 3: Theodore CU telling, "wings made of light"</title>
  <desc>MCU 65mm Victorian boy's face leaning in, voice low, eyes huge with earnest urgency. Sandy-brown hair, freckles, hazel eyes wide with need to be believed. Hands gesture in air measuring four inches — brass gear ring catching grey light on left index. Breathless, words tumbling, telling most important thing he has ever told. Grey flat daylight. Face is only warmth in frame — not from lighting but from animation of pure conviction.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p22p3greyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
    </linearGradient>
    <linearGradient id="p22p3theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p22p3theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <radialGradient id="p22p3ring" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#a89070"/>
      <stop offset="80%" stop-color="#7a5040"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </radialGradient>
    <linearGradient id="p22p3shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p22p3vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <filter id="p22p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <!-- BG flat grey. -->
  <rect width="366" height="364" fill="url(#p22p3greyBg)"/>
  <!-- Faint fog. -->
  <g fill="none" stroke="#a89888" stroke-width="0.55" opacity="0.35">
    <path d="M0,80 Q183,78 366,82"/>
    <path d="M0,160 Q183,164 366,158"/>
    <path d="M0,240 Q183,238 366,242"/>
  </g>

  <!-- Brick wall behind (faint). -->
  <g stroke="#5a3830" stroke-width="0.4" opacity="0.45">
    <line x1="0" y1="40" x2="366" y2="40"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
  </g>

  <!-- ******** HEAD CU leaning in ******** -->
  <g>
    <ellipse cx="183" cy="180" rx="100" ry="110" fill="url(#p22p3theoSkin)"/>

    <!-- Hair tousled. -->
    <g fill="url(#p22p3theoHair)">
      <path d="M86,100 Q80,40 156,28 Q210,20 260,28 Q288,40 280,100 L272,108 Q260,38 232,28 L130,28 Q102,38 94,108 Z"/>
      <path d="M94,28 L86,-12 L114,16 Z"/>
      <path d="M126,8 L116,-32 L142,-2 Z"/>
      <path d="M160,-2 L168,-44 L186,4 Z"/>
      <path d="M198,-2 L226,-32 L218,16 Z"/>
      <path d="M236,8 L268,-12 L260,32 Z"/>
    </g>

    <!-- EYES — huge, wide, earnest. -->
    <ellipse cx="138" cy="170" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="138" cy="170" rx="22" ry="14" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <ellipse cx="138" cy="170" rx="11" ry="11" fill="url(#p22p3theoHair)"/>
    <ellipse cx="138" cy="170" rx="6" ry="6" fill="#0a0604"/>
    <ellipse cx="142" cy="166" rx="2" ry="1.4" fill="#ffffff" filter="url(#p22p3bloom)"/>
    <!-- Lashes. -->
    <path d="M116,158 Q138,152 160,158" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>

    <ellipse cx="228" cy="170" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="228" cy="170" rx="22" ry="14" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <ellipse cx="228" cy="170" rx="11" ry="11" fill="url(#p22p3theoHair)"/>
    <ellipse cx="228" cy="170" rx="6" ry="6" fill="#0a0604"/>
    <ellipse cx="232" cy="166" rx="2" ry="1.4" fill="#ffffff" filter="url(#p22p3bloom)"/>
    <path d="M206,158 Q228,152 250,158" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>

    <!-- Brows raised (earnest urgency). -->
    <path d="M114,138 Q138,128 162,138" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M204,138 Q228,128 252,138" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M183,194 L168,238 Q183,246 198,238 Z" fill="#7a5848" opacity="0.55"/>
    <ellipse cx="174" cy="234" rx="2.5" ry="1.4" fill="#3a2010"/>
    <ellipse cx="192" cy="234" rx="2.5" ry="1.4" fill="#3a2010"/>

    <!-- MOUTH OPEN talking. -->
    <ellipse cx="183" cy="270" rx="20" ry="10" fill="#3a1408"/>
    <path d="M167,266 L199,266 L199,274 L167,274 Z" fill="#fff8e8" opacity="0.85"/>
    <line x1="175" y1="266" x2="175" y2="274" stroke="#a85820" stroke-width="0.4"/>
    <line x1="183" y1="266" x2="183" y2="274" stroke="#a85820" stroke-width="0.4"/>
    <line x1="191" y1="266" x2="191" y2="274" stroke="#a85820" stroke-width="0.4"/>

    <!-- Cheek warmth (only color). -->
    <ellipse cx="100" cy="200" rx="14" ry="9" fill="#a87858" opacity="0.55"/>
    <ellipse cx="266" cy="200" rx="14" ry="9" fill="#a87858" opacity="0.55"/>

    <!-- Freckles. -->
    <g fill="#7a5848" opacity="0.95">
      <circle cx="120" cy="208" r="1.2"/>
      <circle cx="138" cy="218" r="1"/>
      <circle cx="156" cy="208" r="1.2"/>
      <circle cx="210" cy="208" r="1.2"/>
      <circle cx="228" cy="218" r="1"/>
      <circle cx="246" cy="208" r="1.2"/>
    </g>
  </g>

  <!-- ******** HANDS gesturing — measuring 4 inches in air ******** -->
  <g transform="translate(50 280)">
    <!-- Forearm. -->
    <path d="M0,30 Q-10,0 0,-20 L20,-20 L40,0 L40,30 Z" fill="url(#p22p3shirt)"/>
    <!-- Hand (with brass gear ring). -->
    <ellipse cx="40" cy="-12" rx="14" ry="10" fill="url(#p22p3theoSkin)"/>
    <!-- Index pointing right (measuring). -->
    <line x1="50" y1="-14" x2="80" y2="-12" stroke="url(#p22p3theoSkin)" stroke-width="6" stroke-linecap="round"/>
    <!-- Other fingers curled. -->
    <line x1="48" y1="-6" x2="56" y2="-2" stroke="url(#p22p3theoSkin)" stroke-width="5" stroke-linecap="round"/>
    <!-- BRASS GEAR RING on left index. -->
    <ellipse cx="62" cy="-13" rx="6" ry="3.5" fill="url(#p22p3ring)"/>
    <ellipse cx="62" cy="-13" rx="6" ry="3.5" fill="none" stroke="#1a0c04" stroke-width="0.4"/>
    <ellipse cx="62" cy="-13" rx="2.5" ry="1.5" fill="#3a1c08"/>
    <!-- Tiny gear teeth. -->
    <g fill="#7a5040">
      <rect x="55" y="-14" width="2" height="2"/>
      <rect x="68" y="-14" width="2" height="2"/>
    </g>
  </g>
  <g transform="translate(280 280)">
    <!-- Forearm. -->
    <path d="M40,30 Q50,0 40,-20 L20,-20 L0,0 L0,30 Z" fill="url(#p22p3shirt)"/>
    <!-- Hand (right). -->
    <ellipse cx="0" cy="-12" rx="14" ry="10" fill="url(#p22p3theoSkin)"/>
    <!-- Index pointing left (measuring). -->
    <line x1="-10" y1="-14" x2="-40" y2="-12" stroke="url(#p22p3theoSkin)" stroke-width="6" stroke-linecap="round"/>
    <!-- Curled. -->
    <line x1="-8" y1="-6" x2="-16" y2="-2" stroke="url(#p22p3theoSkin)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Air gap between fingers (~4 inches). -->
  <g stroke="#5a5a5a" stroke-width="0.85" stroke-dasharray="2,2" opacity="0.65">
    <line x1="130" y1="266" x2="240" y2="266"/>
  </g>
  <text x="183" y="262" text-anchor="middle" font-size="9" fill="#5a5a5a" font-style="italic" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">~ 4 in ~</text>

  <!-- Vest visible at frame bottom. -->
  <path d="M0,310 L18,364 L348,364 L366,310 Z" fill="url(#p22p3vest)"/>

  <!-- DIALOGUE — 3 beats. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="338" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M58,58 L70,58 L60,76 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="58.5" x2="68" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">I saw a fairy. Last night. In the workshop.</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="74" width="338" height="60" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M58,134 L70,134 L60,152 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="134.5" x2="68" y2="134.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">It was this big — and it GLOWED.</text>
  <text x="22" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Green light, like nothing I've seen.</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="338" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M58,296 L70,296 L60,278 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="295.5" x2="68" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-weight="600">Wings made of light.</text>

  <!-- Brushwork. -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q120,45 246,42"/>
    <path d="M246,40 Q310,45 366,42"/>
  </g>
</svg>
