<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 16 — Panel 1: Macro palm with Jink standing in it</title>
  <desc>Macro 85mm extreme close-up. Open palm on wooden workbench surface — enormous at fairy scale, palm a plaza, fingers spread like avenues. Oil stains darken creases. Burn scar ridges knuckle. Brass gear ring on left index. Standing center palm — tiny ~four-inch figure, lean androgynous, golden curly hair, emerald soot-streaked suit, weight on one leg, looking down at palm surface amused. Tiny shadow across palm lines. Linen shirt cuff at wrist. Fingers at frame edges show faintest tremor. Warm amber candlelight; emerald accents only cool light.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p16p1benchSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p16p1candleHalo" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p16p1palmSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="50%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <radialGradient id="p16p1palmWarm" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p16p1shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcc8a8"/>
      <stop offset="100%" stop-color="#7a6840"/>
    </linearGradient>
    <radialGradient id="p16p1ring" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#3a1c08"/>
    </radialGradient>
    <linearGradient id="p16p1jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p16p1jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p16p1emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <filter id="p16p1bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p16p1deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG: bench surface receding behind. -->
  <rect width="742" height="364" fill="url(#p16p1benchSurface)"/>
  <ellipse cx="371" cy="60" rx="600" ry="280" fill="url(#p16p1candleHalo)" opacity="0.7"/>

  <!-- Wood grain BG. -->
  <g stroke="#3a2010" stroke-width="0.55" opacity="0.45">
    <path d="M0,30 Q371,36 742,30"/>
    <path d="M0,80 Q371,72 742,80"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.45">
    <line x1="100" y1="0" x2="106" y2="80"/>
    <line x1="640" y1="0" x2="634" y2="80"/>
  </g>

  <!-- Linen shirt cuff at far right (wrist visible). -->
  <g>
    <path d="M662,80 L640,200 L660,260 L742,260 L742,80 Z" fill="url(#p16p1shirt)"/>
    <ellipse cx="700" cy="140" rx="40" ry="3" fill="#a89060"/>
    <line x1="660" y1="200" x2="742" y2="200" stroke="#3a2010" stroke-width="0.85"/>
  </g>

  <!-- ******** ENORMOUS PALM, fingers spreading from right to left ******** -->
  <g>
    <!-- Bottom-of-palm shadow on bench. -->
    <ellipse cx="380" cy="328" rx="320" ry="20" fill="#000" opacity="0.65"/>

    <!-- Wrist + heel of palm at far right. -->
    <path d="M540,80 Q480,100 480,180 L460,260 Q480,300 540,310 L660,290 L640,200 L662,80 Z" fill="url(#p16p1palmSkin)"/>
    <!-- Palm warm wash. -->
    <ellipse cx="520" cy="200" rx="100" ry="80" fill="url(#p16p1palmWarm)" opacity="0.85"/>

    <!-- PALM main mass — extending leftward as plaza. -->
    <path d="M40,200 L80,160 Q160,140 260,140 Q380,140 480,160 L540,200 L530,260 Q420,290 280,290 Q160,290 80,270 Z" fill="url(#p16p1palmSkin)"/>
    <ellipse cx="280" cy="220" rx="220" ry="50" fill="url(#p16p1palmWarm)" opacity="0.65"/>

    <!-- PALM CREASES (lines as roads). -->
    <g fill="none" stroke="#7a4828" stroke-width="1.4" opacity="0.85">
      <!-- Heart line. -->
      <path d="M80,200 Q200,180 380,196 Q480,210 540,210"/>
      <!-- Head line. -->
      <path d="M80,228 Q220,222 400,234 Q480,242 530,238"/>
      <!-- Life line. -->
      <path d="M540,160 Q500,200 460,260 Q440,300 460,320"/>
    </g>
    <!-- Secondary creases (deeper, oil-stained). -->
    <g fill="none" stroke="#3a2010" stroke-width="0.55" opacity="0.85">
      <path d="M120,180 Q200,170 320,180"/>
      <path d="M200,250 Q280,260 360,254"/>
      <path d="M380,200 L400,250"/>
      <path d="M460,180 L470,260"/>
    </g>

    <!-- OIL STAINS in creases. -->
    <g fill="#1a0c04" opacity="0.65">
      <ellipse cx="120" cy="200" rx="14" ry="3"/>
      <ellipse cx="200" cy="226" rx="20" ry="4"/>
      <ellipse cx="320" cy="234" rx="16" ry="3"/>
      <ellipse cx="420" cy="208" rx="14" ry="3"/>
      <ellipse cx="480" cy="240" rx="14" ry="3"/>
      <ellipse cx="500" cy="200" rx="10" ry="2"/>
    </g>

    <!-- FINGERS spread to LEFT (avenues). -->
    <!-- Pinky (top). -->
    <path d="M40,180 L20,140 L40,128 L80,148 L80,162 Z" fill="url(#p16p1palmSkin)"/>
    <ellipse cx="40" cy="138" rx="10" ry="3" fill="url(#p16p1palmWarm)" opacity="0.55"/>
    <!-- Ring finger. -->
    <path d="M0,160 L20,120 L40,108 L80,140 L60,170 Z" fill="url(#p16p1palmSkin)"/>
    <!-- Middle finger. -->
    <path d="M40,148 L40,80 L80,60 L120,108 L100,148 Z" fill="url(#p16p1palmSkin)"/>
    <!-- Index. -->
    <path d="M120,148 L100,60 L140,40 L160,90 L150,150 Z" fill="url(#p16p1palmSkin)"/>
    <!-- Thumb (bottom). -->
    <path d="M460,260 L500,310 L540,330 L580,310 L530,260 Z" fill="url(#p16p1palmSkin)"/>
    <ellipse cx="510" cy="290" rx="22" ry="6" fill="url(#p16p1palmWarm)" opacity="0.55"/>

    <!-- BURN SCAR on knuckle (center palm area where index meets palm). -->
    <path d="M140,156 L168,154" stroke="#7a4828" stroke-width="2" stroke-linecap="round"/>
    <path d="M144,162 L164,160" stroke="#5a3018" stroke-width="1"/>
    <path d="M138,150 L146,148 L148,156 Z" fill="#7a4828" opacity="0.85"/>

    <!-- BRASS GEAR RING on left index finger (where it joins palm). -->
    <ellipse cx="130" cy="130" rx="14" ry="8" fill="url(#p16p1ring)" transform="rotate(-25 130 130)"/>
    <ellipse cx="130" cy="130" rx="14" ry="8" fill="none" stroke="#1a0c04" stroke-width="0.4" transform="rotate(-25 130 130)"/>
    <ellipse cx="130" cy="130" rx="6" ry="3.5" fill="#3a1c08" transform="rotate(-25 130 130)"/>
    <!-- Gear teeth on ring. -->
    <g fill="#a85820">
      <rect x="116" y="128" width="2.5" height="2" transform="rotate(-25 130 130)"/>
      <rect x="143" y="128" width="2.5" height="2" transform="rotate(-25 130 130)"/>
      <rect x="129" y="120" width="2" height="2.5" transform="rotate(-25 130 130)"/>
    </g>
    <!-- Warm catch on ring. -->
    <ellipse cx="125" cy="126" rx="4" ry="2" fill="#fff0a8" opacity="0.85"/>

    <!-- Knuckle highlights. -->
    <g fill="#fff8e8" opacity="0.55">
      <ellipse cx="120" cy="118" rx="6" ry="3"/>
      <ellipse cx="60" cy="100" rx="6" ry="3"/>
      <ellipse cx="40" cy="148" rx="5" ry="2.5"/>
      <ellipse cx="540" cy="280" rx="10" ry="3"/>
    </g>

    <!-- Slight tremor blur on outer fingertips (faintest tremor). -->
    <g fill="url(#p16p1palmSkin)" opacity="0.45" filter="url(#p16p1bloom)">
      <ellipse cx="36" cy="128" rx="10" ry="6"/>
      <ellipse cx="138" cy="40" rx="6" ry="8"/>
    </g>
  </g>

  <!-- ******** JINK CENTER OF PALM, weight on one leg, looking down ******** -->
  <g>
    <!-- Tiny shadow across palm lines (long, low). -->
    <ellipse cx="290" cy="244" rx="22" ry="3.5" fill="#000" opacity="0.65"/>
    <path d="M260,242 Q300,250 340,246 L340,250 L260,250 Z" fill="#000" opacity="0.45"/>

    <!-- Legs (contrapposto: weight on right leg). -->
    <path d="M275,200 L274,242 L280,242 L282,200 Z" fill="url(#p16p1emeraldSuit)"/>
    <path d="M286,200 Q284,222 290,242 L296,242 L294,222 L292,200 Z" fill="url(#p16p1emeraldSuit)"/>
    <ellipse cx="278" cy="244" rx="5" ry="2" fill="#0a4018"/>
    <ellipse cx="293" cy="244" rx="5" ry="2" fill="#0a4018"/>

    <!-- Torso (slight contrapposto, hipshot — head tilted to look DOWN at palm). -->
    <path d="M266,160 Q260,184 268,200 L300,200 Q310,184 304,160 Q300,156 285,156 Q270,156 266,160 Z" fill="url(#p16p1emeraldSuit)"/>
    <!-- Soot streak. -->
    <path d="M266,170 Q285,168 304,172 Q304,184 304,192 L266,192 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="285" y1="156" x2="285" y2="200" stroke="#0a4018" stroke-width="0.4"/>
    <!-- Holo seams. -->
    <circle cx="285" cy="172" r="1.4" fill="#a8ffd0" filter="url(#p16p1bloom)"/>
    <circle cx="285" cy="190" r="1.4" fill="#a8ffd0" filter="url(#p16p1bloom)"/>

    <!-- Wing-pack stowed. -->
    <rect x="270" y="156" width="30" height="10" fill="#1a4828"/>
    <line x1="270" y1="158" x2="300" y2="158" stroke="#2ed078" stroke-width="0.85" filter="url(#p16p1bloom)"/>

    <!-- Arms — RIGHT hand on hip (casual), LEFT hand gesturing slightly. -->
    <path d="M266,162 Q260,180 254,202 L264,202 Q266,182 268,164 Z" fill="url(#p16p1emeraldSuit)"/>
    <ellipse cx="258" cy="206" rx="3" ry="2.5" fill="url(#p16p1jinkSkin)"/>
    <path d="M304,162 Q314,178 312,200 L302,200 Q302,182 302,164 Z" fill="url(#p16p1emeraldSuit)"/>
    <!-- Hand-on-hip. -->
    <ellipse cx="307" cy="200" rx="3.5" ry="2" fill="url(#p16p1jinkSkin)"/>

    <!-- Head — TILTED DOWN, looking at palm (chin to chest). -->
    <g transform="rotate(-20 285 144)">
      <ellipse cx="285" cy="144" rx="13" ry="14" fill="url(#p16p1jinkSkin)"/>
      <!-- Hair (top of head visible from above). -->
      <g fill="url(#p16p1jinkHair)">
        <ellipse cx="272" cy="130" rx="6" ry="8"/>
        <ellipse cx="284" cy="124" rx="6" ry="7"/>
        <ellipse cx="294" cy="126" rx="6" ry="8"/>
        <ellipse cx="276" cy="138" rx="5" ry="6"/>
        <ellipse cx="288" cy="134" rx="5" ry="6"/>
        <ellipse cx="298" cy="138" rx="5" ry="6"/>
        <ellipse cx="270" cy="146" rx="4" ry="5"/>
        <ellipse cx="298" cy="148" rx="4" ry="5"/>
      </g>
      <!-- Eyes (looking down — mostly closed/lashes visible from this angle). -->
      <path d="M276,148 Q282,150 286,148" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M288,148 Q294,150 298,148" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Nose (foreshortened from above-tilt). -->
      <path d="M285,153 L283,158 Q285,159 287,158 Z" fill="#7a4828" opacity="0.55"/>
      <!-- Amused grin. -->
      <path d="M278,160 Q285,164 292,160" fill="none" stroke="#5a3018" stroke-width="1" stroke-linecap="round"/>
    </g>
  </g>

  <!-- DIALOGUE — 4 beats. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="222" height="40" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M58,54 L70,54 L60,72 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="54.5" x2="68" y2="54.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE (O.P.)</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-style="italic">I can barely feel you.</text>

  <g filter="url(#balloonShadow)">
    <rect x="262" y="14" width="280" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M308,58 L320,58 L310,76 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="309.5" y1="58.5" x2="318" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="270" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="270" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">We're light. Built for speed, not presence.</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="316" height="40" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M58,296 L70,296 L60,278 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="295.5" x2="68" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE (O.P.)</text>
  <text x="22" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">You've got... quite a lot of presence, actually.</text>

  <g filter="url(#balloonShadow)">
    <rect x="586" y="296" width="142" height="40" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M626,296 L638,296 L628,278 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="627.5" y1="295.5" x2="636" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="594" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="594" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-style="italic">I've been told.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
  </g>
</svg>
