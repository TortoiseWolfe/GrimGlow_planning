<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 8 — Panel 2: MED Jink walks across bench surface, easy confidence</title>
  <desc>MED 50mm eye level fairy-scale on workbench surface. Jink walks across scored wooden plateau, stepping over watch screw that reaches their shin, hopping onto brass gear and sliding down its slope. Light brown skin, golden curly hair, emerald metallic suit streaked with soot, holographic accents. Easy confidence + swagger through clockwork landscape. Behind: vast wooden bench stretches, brass components as terrain. Warm amber from towering candle at bench edge, emerald suit-glow as cool counterpoint. JINK speaks.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p8p2nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p8p2candleSide" cx="100%" cy="40%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p8p2emeraldGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p8p2bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="50%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p8p2brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="40%" stop-color="#f0d878"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <linearGradient id="p8p2jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p8p2jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p8p2emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p8p2sootStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </linearGradient>
    <filter id="p8p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="364" fill="url(#p8p2nightBg)"/>

  <!-- Candle warm halo from far right. -->
  <rect width="366" height="364" fill="url(#p8p2candleSide)"/>

  <!-- Bench surface (we're at fairy-scale, looking at landscape). -->
  <rect x="0" y="220" width="366" height="144" fill="url(#p8p2bench)"/>
  <!-- Wood grain. -->
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.5">
    <path d="M40,220 Q50,290 42,360"/>
    <path d="M150,220 Q160,290 152,360"/>
    <path d="M260,220 Q270,290 262,360"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.5" opacity="0.55">
    <line x1="0" y1="240" x2="366" y2="240"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
    <line x1="0" y1="320" x2="366" y2="320"/>
  </g>
  <!-- Bench cliff edge (background). -->
  <rect x="0" y="200" width="366" height="20" fill="#3a2010"/>
  <line x1="0" y1="220" x2="366" y2="220" stroke="#5a3818" stroke-width="1.4"/>

  <!-- Cool emerald glow around Jink. -->
  <ellipse cx="160" cy="240" rx="80" ry="100" fill="url(#p8p2emeraldGlow)" opacity="0.85" filter="url(#p8p2bloom)"/>

  <!-- BRASS GEAR (Jink hopping onto it / coming off the slope). At image-right. -->
  <g>
    <circle cx="280" cy="278" r="40" fill="url(#p8p2brass)"/>
    <circle cx="280" cy="278" r="40" fill="none" stroke="#5a3018" stroke-width="0.85"/>
    <circle cx="280" cy="278" r="13" fill="#5a3018"/>
    <!-- Teeth. -->
    <g stroke="#5a3018" stroke-width="0.7">
      <line x1="280" y1="238" x2="280" y2="232"/>
      <line x1="280" y1="318" x2="280" y2="324"/>
      <line x1="240" y1="278" x2="234" y2="278"/>
      <line x1="320" y1="278" x2="326" y2="278"/>
    </g>
    <ellipse cx="296" cy="252" rx="14" ry="8" fill="#fff0a8" opacity="0.55"/>
    <!-- Shadow. -->
    <ellipse cx="248" cy="320" rx="32" ry="6" fill="#000" opacity="0.5"/>
  </g>

  <!-- WATCH SCREW that Jink steps over (reaches shin). -->
  <g>
    <ellipse cx="100" cy="296" rx="12" ry="4" fill="#5a3018"/>
    <ellipse cx="100" cy="294" rx="11" ry="3" fill="#7a4828"/>
    <!-- Screw head slot. -->
    <line x1="92" y1="294" x2="108" y2="294" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Shadow. -->
    <ellipse cx="92" cy="304" rx="14" ry="2" fill="#000" opacity="0.45"/>
  </g>

  <!-- Brass filings. -->
  <g fill="#dcaf60" opacity="0.6">
    <circle cx="60" cy="320" r="0.7"/>
    <circle cx="64" cy="322" r="0.6"/>
    <circle cx="68" cy="320" r="0.65"/>
    <circle cx="200" cy="328" r="0.6"/>
    <circle cx="206" cy="326" r="0.7"/>
    <circle cx="212" cy="328" r="0.55"/>
  </g>

  <!-- Coiled spring (background). -->
  <g fill="none" stroke="#a85820" stroke-width="1" opacity="0.75">
    <ellipse cx="50" cy="250" rx="14" ry="6"/>
    <ellipse cx="50" cy="250" rx="10" ry="4"/>
    <ellipse cx="50" cy="250" rx="6" ry="3"/>
  </g>

  <!-- ******** JINK — walking across bench, mid-step over screw ******** -->
  <!-- Position: center-left, mid-step. One leg lifted (over screw), one leg planted. -->
  <g>
    <!-- Cast shadow under planted leg. -->
    <ellipse cx="146" cy="306" rx="10" ry="2" fill="#000" opacity="0.55"/>

    <!-- LEGS (mid-stride). -->
    <!-- Right leg planted (image-right). -->
    <path d="M148,232 L142,300 L160,300 L160,232 Z" fill="url(#p8p2emeraldSuit)"/>
    <!-- Left leg LIFTED (stepping over screw). -->
    <path d="M168,232 L184,256 L196,290 L210,288 Q200,260 184,236 Z" fill="url(#p8p2emeraldSuit)"/>
    <!-- Boots. -->
    <ellipse cx="150" cy="304" rx="9" ry="3" fill="#0a4018"/>
    <ellipse cx="206" cy="290" rx="7" ry="3" fill="#0a4018"/>
    <line x1="142" y1="300" x2="160" y2="300" stroke="#2ed078" stroke-width="0.7" filter="url(#p8p2bloom)"/>
    <line x1="200" y1="288" x2="214" y2="290" stroke="#2ed078" stroke-width="0.7" filter="url(#p8p2bloom)"/>

    <!-- Torso. -->
    <path d="M140,162 Q134,210 142,232 L186,232 Q194,210 188,162 Q184,154 164,154 Q142,154 140,162 Z" fill="url(#p8p2emeraldSuit)"/>
    <!-- Soot. -->
    <path d="M140,196 Q164,192 188,198 Q190,206 192,216 L140,218 Z" fill="url(#p8p2sootStreak)" opacity="0.85"/>
    <line x1="164" y1="154" x2="164" y2="232" stroke="#0a4018" stroke-width="0.4" opacity="0.85"/>
    <!-- Holo accent. -->
    <circle cx="164" cy="180" r="1.4" fill="#a8ffd0" filter="url(#p8p2bloom)"/>
    <circle cx="146" cy="170" r="1.1" fill="#a8ffd0" filter="url(#p8p2bloom)"/>
    <circle cx="184" cy="170" r="1.1" fill="#a8ffd0" filter="url(#p8p2bloom)"/>

    <!-- Arms — moving naturally with stride. Right swung back, left swung forward. -->
    <path d="M140,162 Q128,196 124,222 L138,222 Q142,200 146,164 Z" fill="url(#p8p2emeraldSuit)"/>
    <path d="M188,162 Q204,196 210,224 L194,228 Q190,202 184,164 Z" fill="url(#p8p2emeraldSuit)"/>
    <line x1="122" y1="220" x2="138" y2="222" stroke="#2ed078" stroke-width="0.6" filter="url(#p8p2bloom)"/>
    <line x1="194" y1="226" x2="212" y2="224" stroke="#2ed078" stroke-width="0.6" filter="url(#p8p2bloom)"/>
    <ellipse cx="128" cy="226" rx="4" ry="3" fill="url(#p8p2jinkSkin)"/>
    <ellipse cx="208" cy="228" rx="4" ry="3" fill="url(#p8p2jinkSkin)"/>

    <!-- Wing-pack. -->
    <rect x="148" y="160" width="32" height="14" fill="#1a4828"/>
    <line x1="148" y1="164" x2="180" y2="164" stroke="#2ed078" stroke-width="0.7" filter="url(#p8p2bloom)"/>
    <line x1="148" y1="170" x2="180" y2="170" stroke="#2ed078" stroke-width="0.5" filter="url(#p8p2bloom)"/>
    <rect x="162" y="160" width="4" height="14" fill="#0a4018"/>

    <!-- HEAD — turned slightly toward camera, looking at viewer. -->
    <ellipse cx="164" cy="134" rx="14" ry="16" fill="url(#p8p2jinkSkin)"/>
    <!-- Curly hair. -->
    <g fill="url(#p8p2jinkHair)">
      <ellipse cx="148" cy="116" rx="6" ry="8"/>
      <ellipse cx="158" cy="110" rx="6" ry="7"/>
      <ellipse cx="170" cy="110" rx="6" ry="7"/>
      <ellipse cx="180" cy="116" rx="6" ry="8"/>
      <ellipse cx="152" cy="124" rx="5" ry="6"/>
      <ellipse cx="166" cy="120" rx="5" ry="6"/>
      <ellipse cx="178" cy="124" rx="5" ry="6"/>
      <ellipse cx="148" cy="130" rx="4" ry="6"/>
      <ellipse cx="180" cy="130" rx="4" ry="6"/>
    </g>
    <g stroke="#fff0a8" stroke-width="1" opacity="0.85">
      <ellipse cx="180" cy="112" rx="5" ry="6" fill="none"/>
      <ellipse cx="178" cy="124" rx="3" ry="4" fill="none"/>
    </g>

    <!-- Eyes — focused on viewer. -->
    <ellipse cx="158" cy="134" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="158" cy="134" rx="2" ry="1.4" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="158" cy="134" r="1" fill="#2a4830"/>
    <circle cx="158" cy="134" r="0.5" fill="#0a0604"/>
    <circle cx="157.5" cy="133.5" r="0.4" fill="#ffffff"/>

    <ellipse cx="170" cy="134" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="170" cy="134" rx="2" ry="1.4" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="170" cy="134" r="1" fill="#2a4830"/>
    <circle cx="170" cy="134" r="0.5" fill="#0a0604"/>
    <circle cx="169.5" cy="133.5" r="0.4" fill="#ffffff"/>

    <!-- Brows raised. -->
    <path d="M154,130 Q158,128 162,130" fill="none" stroke="#3a2810" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M166,130 Q170,128 174,130" fill="none" stroke="#3a2810" stroke-width="0.7" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M164,138 L162,144 Q164,145 166,144 Z" fill="#7a4828" opacity="0.55"/>

    <!-- Grin (slightly less wide, more conversational). -->
    <path d="M156,150 Q164,154 172,150" fill="none" stroke="#5a3018" stroke-width="1" stroke-linecap="round"/>
    <line x1="160" y1="151" x2="160" y2="153" stroke="#dcd0b4" stroke-width="0.4"/>
    <line x1="164" y1="152" x2="164" y2="154" stroke="#dcd0b4" stroke-width="0.4"/>
    <line x1="168" y1="151" x2="168" y2="153" stroke="#dcd0b4" stroke-width="0.4"/>

    <!-- Cheek warm. -->
    <ellipse cx="178" cy="140" rx="4" ry="3" fill="#ffd078" opacity="0.32"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- JINK balloon — top, tail to mouth. -->
  <rect x="14" y="14" width="240" height="74" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M132,88 L144,88 L160,118 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="132" y1="88" x2="144" y2="88" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="24" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">You're the one with the workshop,</text>
  <text x="24" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">yeah? The boy who watches things?</text>

</svg>
