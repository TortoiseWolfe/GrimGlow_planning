<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 10 — Panel 1: Pull-back wide of full workshop, gaslit Clerkenwell street outside window</title>
  <desc>Wide 28mm eye level pulled back. Full Victorian clockmaker's workshop at night. Theodore crouches at small workbench in dim back corner, face at bench level, speaking to tiny point of emerald light among cluttered clockwork. Single candle on bench. Dark workshop stretches around — master's bench abandoned, tools as silhouettes on wall pegs, shelves of clock shapes in shadow. Through shop window: dark Clerkenwell street, gas lamps in fog, glow of city. From a distance: a boy talking to his workbench. Candle + tiny emerald glow are only interior lights — two small warmths in a vast dark room.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p10p1nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p10p1candleGlow" cx="60%" cy="50%" r="20%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p1emeraldPoint" cx="60%" cy="55%" r="6%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p10p1streetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#1a1408"/>
    </linearGradient>
    <radialGradient id="p10p1gasLamp">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p10p1plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="p10p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="p10p1bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="p10p1theoSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="p10p1theoVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p10p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <filter id="p10p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p10p1strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG: very dark workshop. -->
  <rect width="742" height="364" fill="url(#p10p1nightBg)"/>
  <rect x="0" y="0" width="742" height="240" fill="url(#p10p1plaster)" opacity="0.85"/>

  <!-- WINDOW (image-LEFT) showing dark Clerkenwell street outside. -->
  <g>
    <rect x="20" y="60" width="160" height="200" fill="url(#p10p1streetSky)"/>
    <!-- Window frame. -->
    <rect x="14" y="54" width="172" height="6" fill="#3a2010"/>
    <rect x="14" y="260" width="172" height="6" fill="#3a2010"/>
    <rect x="14" y="54" width="6" height="212" fill="#3a2010"/>
    <rect x="180" y="54" width="6" height="212" fill="#3a2010"/>
    <!-- Mullion. -->
    <line x1="100" y1="60" x2="100" y2="260" stroke="#3a2010" stroke-width="2"/>
    <line x1="20" y1="160" x2="180" y2="160" stroke="#3a2010" stroke-width="2"/>

    <!-- Distant gaslit street through window. -->
    <!-- Buildings (silhouettes). -->
    <rect x="20" y="170" width="80" height="90" fill="#1a0c04"/>
    <rect x="100" y="180" width="80" height="80" fill="#1a0c04"/>
    <!-- Distant windows lit faintly amber. -->
    <rect x="36" y="200" width="14" height="22" fill="#5a3818" opacity="0.55"/>
    <rect x="60" y="210" width="14" height="22" fill="#5a3818" opacity="0.55"/>
    <rect x="120" y="206" width="14" height="22" fill="#5a3818" opacity="0.55"/>

    <!-- Gas lamp post visible through window. -->
    <line x1="46" y1="80" x2="46" y2="200" stroke="#0a0402" stroke-width="2"/>
    <rect x="40" y="74" width="12" height="12" fill="#1a0c04"/>
    <ellipse cx="46" cy="80" rx="3" ry="4" fill="#ffd078" filter="url(#p10p1bloom)"/>
    <ellipse cx="46" cy="80" rx="32" ry="40" fill="url(#p10p1gasLamp)" opacity="0.7"/>

    <!-- Second distant gas lamp. -->
    <line x1="148" y1="120" x2="148" y2="220" stroke="#0a0402" stroke-width="1.4"/>
    <ellipse cx="148" cy="118" rx="2.5" ry="3" fill="#ffd078" filter="url(#p10p1bloom)"/>
    <ellipse cx="148" cy="118" rx="20" ry="26" fill="url(#p10p1gasLamp)" opacity="0.55"/>

    <!-- FOG suggested with horizontal wisps. -->
    <g stroke="#5a4838" stroke-width="0.5" opacity="0.45" fill="none">
      <path d="M20,150 Q60,148 100,150 Q140,152 180,150"/>
      <path d="M20,180 Q60,178 100,180 Q140,182 180,180"/>
      <path d="M20,210 Q60,208 100,210 Q140,212 180,210"/>
    </g>

    <!-- HOROLOGY reverse lettering on glass. -->
    <text x="100" y="78" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="11" font-weight="900"
          fill="#a85820" opacity="0.55"
          letter-spacing="2"
          transform="scale(-1 1) translate(-200 0)">HOROLOGY</text>
  </g>

  <!-- Window cast LIGHT on floor (dim from streetlamps). -->
  <ellipse cx="100" cy="290" rx="100" ry="20" fill="#5a4838" opacity="0.18"/>

  <!-- Cribbage's main bench (silhouette, abandoned, image-LEFT center). -->
  <g opacity="0.55">
    <rect x="200" y="220" width="200" height="34" fill="url(#p10p1bench)"/>
    <rect x="220" y="254" width="6" height="80" fill="#0a0402"/>
    <rect x="380" y="254" width="6" height="80" fill="#0a0402"/>
  </g>

  <!-- Wall pegs / hanging tools (BG silhouettes). -->
  <g opacity="0.45">
    <line x1="280" y1="86" x2="280" y2="120" stroke="#3a2010" stroke-width="2"/>
    <line x1="300" y1="86" x2="300" y2="124" stroke="#3a2010" stroke-width="2.4"/>
    <line x1="320" y1="86" x2="320" y2="120" stroke="#3a2010" stroke-width="2"/>
    <ellipse cx="300" cy="124" rx="5" ry="2" fill="#3a2010"/>
  </g>

  <!-- Shelves with clock silhouettes (BG dim). -->
  <g opacity="0.45">
    <line x1="200" y1="86" x2="500" y2="86" stroke="#3a2010" stroke-width="0.7"/>
    <circle cx="240" cy="78" r="6" fill="#1a0c04"/>
    <circle cx="270" cy="78" r="5" fill="#1a0c04"/>
    <rect x="290" y="70" width="12" height="16" fill="#1a0c04"/>
    <circle cx="320" cy="78" r="6" fill="#1a0c04"/>
    <rect x="340" y="70" width="12" height="16" fill="#1a0c04"/>
    <circle cx="370" cy="78" r="5" fill="#1a0c04"/>
    <rect x="396" y="70" width="12" height="16" fill="#1a0c04"/>
    <circle cx="430" cy="78" r="6" fill="#1a0c04"/>
    <circle cx="460" cy="78" r="5" fill="#1a0c04"/>
  </g>

  <!-- Theodore's BACK-CORNER bench (image-RIGHT, where he is now). -->
  <g>
    <ellipse cx="620" cy="240" rx="120" ry="40" fill="url(#p10p1candleGlow)" opacity="0.85"/>
    <rect x="500" y="232" width="240" height="30" fill="url(#p10p1bench)"/>
    <rect x="500" y="232" width="240" height="5" fill="#5a3818"/>
    <line x1="500" y1="237" x2="740" y2="237" stroke="#1a0c04" stroke-width="0.5"/>
    <rect x="514" y="262" width="6" height="100" fill="#0a0402"/>
    <rect x="722" y="262" width="6" height="100" fill="#0a0402"/>

    <!-- CANDLE on bench. -->
    <g>
      <rect x="660" y="208" width="3" height="22" fill="#dcd0b4"/>
      <ellipse cx="661.5" cy="206" rx="2" ry="3" fill="#fff0a8" filter="url(#p10p1bloom)"/>
      <ellipse cx="661.5" cy="206" rx="6" ry="4" fill="url(#p10p1candleGlow)"/>
      <ellipse cx="661.5" cy="230" rx="6" ry="2" fill="#a85820"/>
    </g>

    <!-- TINY EMERALD POINT — Jink as a small glow on the bench. -->
    <g>
      <ellipse cx="600" cy="234" rx="14" ry="6" fill="url(#p10p1emeraldPoint)" opacity="0.85" filter="url(#p10p1strongBloom)"/>
      <circle cx="600" cy="232" r="2.5" fill="#a8ffd0" filter="url(#p10p1bloom)"/>
      <!-- Tiny silhouette of Jink. -->
      <rect x="598" y="226" width="4" height="8" fill="#2ed078"/>
      <circle cx="600" cy="222" r="2" fill="#f5d878"/>
    </g>

    <!-- Scattered clockwork visible under candle glow. -->
    <circle cx="540" cy="244" r="4" fill="#a85820" opacity="0.7"/>
    <circle cx="556" cy="246" r="3" fill="#a85820" opacity="0.7"/>
    <rect x="572" y="240" width="14" height="6" fill="#5a3018"/>
  </g>

  <!-- THEODORE — crouched at bench, image-right corner. Body curled toward bench. -->
  <g>
    <!-- Cast shadow on floor. -->
    <ellipse cx="450" cy="358" rx="80" ry="6" fill="#000" opacity="0.55"/>

    <!-- Body crouched (low, bent forward, face at bench level). -->
    <!-- Trousers (folded). -->
    <path d="M408,300 Q400,344 416,360 L460,360 Q472,344 460,300 Z" fill="#4a3a24"/>
    <path d="M462,300 Q450,344 466,360 L500,360 Q508,344 496,300 Z" fill="#4a3a24"/>
    <!-- Boots. -->
    <ellipse cx="436" cy="362" rx="20" ry="3" fill="#0a0402"/>
    <ellipse cx="488" cy="362" rx="20" ry="3" fill="#0a0402"/>

    <!-- Torso curled forward (low, bent). -->
    <path d="M396,250 Q386,310 404,330 L508,330 Q526,310 516,250 Q500,238 460,236 Q418,238 396,250 Z" fill="url(#p10p1theoVest)"/>
    <!-- Linen shirt visible at sleeves + neck. -->
    <path d="M396,250 Q386,290 396,316 L412,316 Q414,290 414,254 Z" fill="#dcd0b4"/>
    <path d="M516,250 Q526,290 516,316 L500,316 Q498,290 498,254 Z" fill="#dcd0b4"/>
    <!-- Vest center seam. -->
    <line x1="456" y1="240" x2="456" y2="330" stroke="#1a0c04" stroke-width="0.5" opacity="0.85"/>

    <!-- Arms forward toward bench (visible at bench-edge level). -->
    <path d="M412,316 Q420,330 440,338 L470,338 L490,338 Q500,330 500,316 Z" fill="url(#p10p1theoSkin)"/>

    <!-- HEAD — at bench level (low). -->
    <ellipse cx="456" cy="220" rx="24" ry="22" fill="url(#p10p1theoSkin)"/>

    <!-- Tousled spikes. -->
    <path d="M436,200 Q432,176 456,168 Q480,170 478,200" fill="url(#p10p1theoHair)"/>
    <path d="M442,176 L440,162 L446,176 Z" fill="url(#p10p1theoHair)"/>
    <path d="M454,170 L454,156 L460,170 Z" fill="url(#p10p1theoHair)"/>
    <path d="M468,170 L472,156 L472,172 Z" fill="url(#p10p1theoHair)"/>
    <!-- Sides + bangs. -->
    <path d="M436,200 Q432,224 442,236 L450,236 Q444,228 444,200 Z" fill="url(#p10p1theoHair)"/>
    <path d="M478,200 Q482,224 472,236 L464,236 Q470,228 470,200 Z" fill="url(#p10p1theoHair)"/>
    <path d="M442,196 L444,210 L450,196 Z" fill="url(#p10p1theoHair)"/>
    <path d="M454,200 L456,212 L460,200 Z" fill="url(#p10p1theoHair)"/>
    <path d="M466,196 L468,210 L472,196 Z" fill="url(#p10p1theoHair)"/>

    <!-- Eye in profile (warm-lit by candle right). -->
    <ellipse cx="466" cy="218" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="466" cy="218" r="1" fill="#3a2810"/>
    <circle cx="466" cy="218" r="0.5" fill="#0a0604"/>

    <!-- Smile profile. -->
    <path d="M462,232 Q468,234 474,232" fill="none" stroke="#5a3018" stroke-width="0.85"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
    <path d="M0,310 Q200,315 400,312"/>
    <path d="M400,310 Q600,315 742,312"/>
  </g>

  <!-- THEODORE balloon — top, tail to his head. -->
  <rect x="240" y="14" width="240" height="50" rx="8"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M390,64 L402,64 L460,196 Z"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="390" y1="64" x2="402" y2="64" stroke="#ffffff" stroke-width="3"/>
  <text x="250" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#6a4220" letter-spacing="0.3">THEODORE</text>
  <text x="250" y="54"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">How many of you are there? From the star?</text>

  <!-- JINK small balloon — to right of THEODORE balloon, smaller (script: small text from bench). -->
  <rect x="498" y="14" width="200" height="50" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M580,64 L590,64 L600,228 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="580" y1="64" x2="590" y2="64" stroke="#ffffff" stroke-width="3"/>
  <text x="508" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="508" y="50"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-weight="500"
        fill="#1a1a1a">Five. Well. Five who made it.</text>

</svg>
