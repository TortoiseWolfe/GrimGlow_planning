<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 14 — Panel 5: Jink real laugh "I like you"</title>
  <desc>MED 50mm slight low angle from bench level. Tiny ~four-inch figure sits on bench edge, leaning forward elbows on knees, head tilted back in genuine laughter. Lean androgynous late teens to early twenties NOT a child, light brown skin, wild golden blonde curly hair, emerald metallic suit soot-streaked. Laughter real — eyes crinkled, mouth open, surprised delight. Emerald holographic accents at joints and collar pulse slightly brighter with the laugh. Behind, blurred workbench tools at landscape scale. Warm amber candlelight, emerald accents subtly responsive to emotion.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p14p5nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p14p5candleHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p14p5emeraldPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8ffd0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p14p5bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p14p5jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p14p5jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p14p5emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <radialGradient id="p14p5brassBlur" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a85820" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1c08" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="p14p5bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p14p5strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p14p5deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="p14p5blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="364" fill="url(#p14p5nightBg)"/>
  <ellipse cx="183" cy="160" rx="280" ry="240" fill="url(#p14p5candleHalo)" opacity="0.85"/>

  <!-- Pulsing emerald aura around Jink. -->
  <ellipse cx="183" cy="180" rx="160" ry="180" fill="url(#p14p5emeraldPulse)" opacity="0.65" filter="url(#p14p5deepBloom)"/>

  <!-- BLURRED workbench tools at landscape scale BG. -->
  <g filter="url(#p14p5blur)">
    <ellipse cx="60" cy="120" rx="40" ry="36" fill="url(#p14p5brassBlur)"/>
    <ellipse cx="306" cy="100" rx="36" ry="32" fill="url(#p14p5brassBlur)"/>
    <ellipse cx="316" cy="220" rx="30" ry="80" fill="#5a606a" opacity="0.55"/>
  </g>

  <!-- Bench surface. -->
  <rect x="0" y="280" width="366" height="84" fill="url(#p14p5bench)"/>
  <line x1="0" y1="280" x2="366" y2="280" stroke="#7a4828" stroke-width="2"/>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.45">
    <path d="M60,280 Q66,360 56,364"/>
    <path d="M180,280 Q186,360 176,364"/>
    <path d="M300,280 Q306,360 296,364"/>
  </g>

  <!-- ******** JINK leaning forward, head BACK, laughing ******** -->
  <g>
    <!-- Bench-edge shadow. -->
    <ellipse cx="183" cy="278" rx="42" ry="4" fill="#000" opacity="0.55"/>

    <!-- LEGS bent — sitting on bench rim, knees up, feet on bench. -->
    <path d="M150,224 L132,272 Q132,278 142,278 L162,278 Q166,254 168,228 Z" fill="url(#p14p5emeraldSuit)"/>
    <path d="M198,224 L218,272 Q220,278 228,278 L208,278 Q200,254 200,228 Z" fill="url(#p14p5emeraldSuit)"/>
    <ellipse cx="142" cy="278" rx="9" ry="3" fill="#0a4018"/>
    <ellipse cx="222" cy="278" rx="9" ry="3" fill="#0a4018"/>

    <!-- TORSO leaning forward + back arched (laughing). -->
    <path d="M132,118 Q116,180 142,224 L222,224 Q252,180 234,118 Q228,108 183,108 Q138,108 132,118 Z" fill="url(#p14p5emeraldSuit)"/>
    <!-- Soot. -->
    <path d="M132,150 Q183,148 234,154 Q236,180 232,200 L132,200 Z" fill="#1a0c04" opacity="0.85"/>
    <!-- Center seam + brighter emerald glow (pulsing with laugh). -->
    <line x1="183" y1="108" x2="183" y2="222" stroke="#0a4018" stroke-width="0.85"/>
    <circle cx="183" cy="130" r="2.5" fill="#a8ffd0" filter="url(#p14p5strongBloom)"/>
    <circle cx="183" cy="170" r="2.5" fill="#a8ffd0" filter="url(#p14p5strongBloom)"/>
    <circle cx="183" cy="210" r="2.5" fill="#a8ffd0" filter="url(#p14p5strongBloom)"/>
    <!-- Joint accents. -->
    <circle cx="148" cy="128" r="1.7" fill="#a8ffd0" filter="url(#p14p5bloom)"/>
    <circle cx="218" cy="128" r="1.7" fill="#a8ffd0" filter="url(#p14p5bloom)"/>

    <!-- Wing-pack. -->
    <rect x="142" y="116" width="80" height="14" fill="#1a4828"/>
    <line x1="142" y1="120" x2="222" y2="120" stroke="#2ed078" stroke-width="2" filter="url(#p14p5strongBloom)" opacity="0.85"/>
    <rect x="178" y="116" width="10" height="14" fill="#0a4018"/>

    <!-- ARMS — elbows on knees, hands hanging forward. -->
    <path d="M132,124 L116,176 L98,224 L116,228 L132,200 L148,160 Z" fill="url(#p14p5emeraldSuit)"/>
    <path d="M234,124 L250,176 L268,224 L250,228 L234,200 L218,160 Z" fill="url(#p14p5emeraldSuit)"/>
    <!-- Hands hang forward. -->
    <ellipse cx="100" cy="232" rx="6" ry="4" fill="url(#p14p5jinkSkin)"/>
    <ellipse cx="266" cy="232" rx="6" ry="4" fill="url(#p14p5jinkSkin)"/>

    <!-- HEAD tilted BACK (laughing toward sky). -->
    <g transform="rotate(-18 183 80)">
      <ellipse cx="183" cy="80" rx="20" ry="22" fill="url(#p14p5jinkSkin)"/>
      <!-- Wild golden curls — flying with motion. -->
      <g fill="url(#p14p5jinkHair)">
        <ellipse cx="160" cy="58" rx="9" ry="11"/>
        <ellipse cx="178" cy="48" rx="9" ry="11"/>
        <ellipse cx="194" cy="48" rx="9" ry="11"/>
        <ellipse cx="210" cy="58" rx="9" ry="11"/>
        <ellipse cx="156" cy="74" rx="7" ry="9"/>
        <ellipse cx="174" cy="64" rx="7" ry="8"/>
        <ellipse cx="194" cy="64" rx="7" ry="8"/>
        <ellipse cx="214" cy="74" rx="7" ry="9"/>
        <ellipse cx="146" cy="88" rx="7" ry="10"/>
        <ellipse cx="222" cy="88" rx="7" ry="10"/>
      </g>
      <!-- Curl ringlet shines. -->
      <g stroke="#ffeca8" stroke-width="1.4" fill="none" opacity="0.85" filter="url(#p14p5bloom)">
        <path d="M160,52 Q170,62 178,52"/>
        <path d="M196,52 Q208,62 218,52"/>
      </g>

      <!-- Eyes CRINKLED (closed/squeezed shut from laugh). -->
      <path d="M168,80 Q176,76 184,80" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M168,80 Q176,82 184,80" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>
      <path d="M186,80 Q194,76 202,80" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M186,80 Q194,82 202,80" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>
      <!-- Crinkle lines. -->
      <line x1="164" y1="76" x2="160" y2="72" stroke="#3a1c08" stroke-width="0.85"/>
      <line x1="206" y1="76" x2="210" y2="72" stroke="#3a1c08" stroke-width="0.85"/>
      <!-- Brows raised in laugh. -->
      <path d="M164,68 Q176,62 184,68" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M186,68 Q194,62 206,68" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Nose. -->
      <path d="M183,86 L180,96 Q183,98 186,96 Z" fill="#7a4828" opacity="0.55"/>
      <ellipse cx="180" cy="94" rx="1" ry="0.6" fill="#3a2010"/>
      <ellipse cx="186" cy="94" rx="1" ry="0.6" fill="#3a2010"/>

      <!-- MOUTH OPEN wide laughing. -->
      <ellipse cx="183" cy="106" rx="9" ry="6" fill="#3a1408"/>
      <path d="M176,103 L190,103 L190,108 L176,108 Z" fill="#fff8e8" opacity="0.85"/>
      <line x1="180" y1="103" x2="180" y2="108" stroke="#a85820" stroke-width="0.4"/>
      <line x1="183" y1="103" x2="183" y2="108" stroke="#a85820" stroke-width="0.4"/>
      <line x1="186" y1="103" x2="186" y2="108" stroke="#a85820" stroke-width="0.4"/>
    </g>

    <!-- Subtle motion lines from the laugh. -->
    <g stroke="#a8ffd0" stroke-width="0.85" opacity="0.55" filter="url(#p14p5bloom)">
      <line x1="120" y1="60" x2="130" y2="50"/>
      <line x1="240" y1="60" x2="232" y2="50"/>
      <line x1="100" y1="100" x2="110" y2="100"/>
      <line x1="266" y1="100" x2="256" y2="100"/>
    </g>
  </g>

  <!-- DIALOGUE — 3 Jink balloons. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="338" height="56" rx="12" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M48,70 L60,70 L48,88 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="49.5" y1="70.5" x2="58" y2="70.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-style="italic">That's your first question?</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="218" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M64,296 L76,296 L66,278 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="65.5" y1="295.5" x2="74" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">How the SUIT works.</text>

  <g filter="url(#balloonShadow)">
    <rect x="244" y="296" width="108" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M280,296 L292,296 L282,278 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="281.5" y1="295.5" x2="290" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="252" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="252" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-weight="700">I like you.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q120,45 246,42"/>
    <path d="M246,40 Q310,45 366,42"/>
  </g>
</svg>
