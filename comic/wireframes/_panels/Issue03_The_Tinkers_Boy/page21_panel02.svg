<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 3 — Page 21 — Panel 2: Jink sitting alone at wall gap</title>
  <desc>MED 50mm. Tiny figure sits on timber beam near gap in brick wall, legs drawn up, arms around knees, staring out. Through gap: Victorian city visible — rooftops, chimneys, distant church spire, amber gaslight diffused through fog. Lean androgynous, golden curly hair dimmed in low light, emerald suit soot-streaked, holographic accents glowing faintly at joints/collar. Faint geometric pulse visible through suit material at hip — shard pocketed. Quiet, still, weighted — not regret but recognition something irrevocable done. NOT in motion. Cool emerald glow from suit, warm amber gaslight from distant city through wall gap.</desc>

  <defs>
    <linearGradient id="p21p2coolBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#020a18"/>
    </linearGradient>
    <radialGradient id="p21p2cityWarm" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p2emeraldHalo" cx="40%" cy="60%" r="20%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p21p2timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p21p2brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p21p2cityFog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p21p2jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a890"/>
      <stop offset="100%" stop-color="#5a4830"/>
    </linearGradient>
    <radialGradient id="p21p2jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a89070"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p21p2emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <radialGradient id="p21p2shardPulse">
      <stop offset="0%" stop-color="#a8d8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <filter id="p21p2bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p21p2deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="494" height="364" fill="url(#p21p2coolBg)"/>

  <!-- Brick wall surrounds GAP (right side opens to city). -->
  <rect width="494" height="364" fill="url(#p21p2brick)"/>
  <!-- Brick texture lines. -->
  <g stroke="#1a0c04" stroke-width="0.85" opacity="0.65">
    <line x1="0" y1="40" x2="280" y2="40"/>
    <line x1="0" y1="80" x2="280" y2="80"/>
    <line x1="0" y1="120" x2="280" y2="120"/>
    <line x1="0" y1="160" x2="280" y2="160"/>
    <line x1="0" y1="200" x2="280" y2="200"/>
    <line x1="0" y1="240" x2="280" y2="240"/>
    <line x1="0" y1="280" x2="280" y2="280"/>
    <line x1="0" y1="320" x2="280" y2="320"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="120"/>
    <line x1="160" y1="40" x2="160" y2="80"/>
    <line x1="220" y1="80" x2="220" y2="120"/>
    <line x1="60" y1="160" x2="60" y2="200"/>
    <line x1="120" y1="200" x2="120" y2="240"/>
    <line x1="180" y1="160" x2="180" y2="200"/>
    <line x1="240" y1="200" x2="240" y2="240"/>
    <line x1="40" y1="280" x2="40" y2="320"/>
    <line x1="160" y1="280" x2="160" y2="320"/>
  </g>

  <!-- ******** GAP IN BRICKWORK — opens onto city ******** -->
  <g>
    <!-- Gap itself. -->
    <rect x="280" y="40" width="214" height="280" fill="url(#p21p2cityFog)"/>
    <!-- Splintered/rough brick edges. -->
    <path d="M280,40 L286,46 L286,320 L280,316 Z" fill="#1a0c04"/>
    <!-- City warmth pouring in. -->
    <ellipse cx="394" cy="180" rx="160" ry="140" fill="url(#p21p2cityWarm)" opacity="0.85"/>
    <!-- VICTORIAN CITY through gap: rooftops/chimneys/spire. -->
    <g fill="#3a2818" opacity="0.85">
      <!-- Rooftops zigzag. -->
      <path d="M280,240 L300,220 L320,240 L340,210 L360,240 L380,220 L400,240 L420,210 L440,240 L460,220 L480,240 L494,230 L494,320 L280,320 Z"/>
      <!-- Chimneys. -->
      <rect x="328" y="184" width="8" height="36"/>
      <rect x="380" y="180" width="10" height="40"/>
      <rect x="430" y="186" width="8" height="34"/>
      <!-- Distant church spire. -->
      <polygon points="448,140 458,180 438,180" fill="#3a2818"/>
      <line x1="448" y1="140" x2="448" y2="180" stroke="#1a0c04" stroke-width="0.85"/>
    </g>
    <!-- Gaslight pinpoints scattered (amber glows in fog). -->
    <g fill="#ffd078" opacity="0.85" filter="url(#p21p2bloom)">
      <circle cx="306" cy="280" r="2"/>
      <circle cx="356" cy="290" r="2"/>
      <circle cx="408" cy="276" r="2"/>
      <circle cx="458" cy="284" r="2"/>
    </g>
    <!-- Fog wisps. -->
    <g fill="none" stroke="#a89888" stroke-width="0.85" opacity="0.45">
      <path d="M286,260 Q360,256 494,264"/>
      <path d="M286,300 Q360,296 494,304"/>
    </g>
    <!-- Sky tint above rooftops. -->
    <rect x="280" y="40" width="214" height="100" fill="#3a3838" opacity="0.45"/>
  </g>

  <!-- TIMBER BEAM Jink sits on (foreground). -->
  <rect x="0" y="280" width="280" height="40" fill="url(#p21p2timber)"/>
  <line x1="0" y1="280" x2="280" y2="280" stroke="#1a0c04" stroke-width="2"/>
  <g stroke="#3a2010" stroke-width="0.55" opacity="0.55">
    <line x1="40" y1="280" x2="50" y2="320"/>
    <line x1="100" y1="280" x2="110" y2="320"/>
    <line x1="180" y1="280" x2="190" y2="320"/>
  </g>

  <!-- Emerald halo around Jink (cool glow). -->
  <ellipse cx="140" cy="240" rx="80" ry="70" fill="url(#p21p2emeraldHalo)" opacity="0.85" filter="url(#p21p2deepBloom)"/>

  <!-- ******** JINK SITTING legs drawn up, arms around knees ******** -->
  <g transform="translate(140 256)">
    <!-- Knees up (legs bent close). -->
    <ellipse cx="0" cy="20" rx="20" ry="6" fill="#000" opacity="0.55"/>
    <!-- Body torso curled forward. -->
    <path d="M-14,-30 Q-20,-2 -10,16 L10,16 Q22,-2 16,-30 Q12,-38 0,-38 Q-12,-38 -14,-30 Z" fill="url(#p21p2emeraldSuit)"/>
    <line x1="0" y1="-38" x2="0" y2="16" stroke="#0a4018" stroke-width="0.4"/>
    <!-- Holo seams (dim). -->
    <circle cx="0" cy="-12" r="1.4" fill="#a8ffd0" filter="url(#p21p2bloom)" opacity="0.85"/>
    <circle cx="0" cy="6" r="1.4" fill="#a8ffd0" filter="url(#p21p2bloom)" opacity="0.85"/>
    <!-- SHARD pulse visible through suit at HIP (right side). -->
    <ellipse cx="10" cy="2" rx="6" ry="4" fill="url(#p21p2shardPulse)" opacity="0.85" filter="url(#p21p2bloom)"/>
    <circle cx="10" cy="2" r="1.4" fill="#a8d8ff" filter="url(#p21p2bloom)"/>
    <!-- Soot. -->
    <path d="M-14,-12 Q0,-14 16,-10 Q16,4 16,12 L-14,12 Z" fill="#1a0c04" opacity="0.85"/>

    <!-- Wing-pack stowed. -->
    <rect x="-10" y="-38" width="20" height="8" fill="#1a4828"/>
    <line x1="-10" y1="-34" x2="10" y2="-34" stroke="#2ed078" stroke-width="0.85" filter="url(#p21p2bloom)"/>

    <!-- KNEES drawn up tight. -->
    <ellipse cx="-10" cy="14" rx="9" ry="14" fill="url(#p21p2emeraldSuit)"/>
    <ellipse cx="10" cy="14" rx="9" ry="14" fill="url(#p21p2emeraldSuit)"/>
    <!-- Lower legs folded under. -->
    <path d="M-12,18 L-8,32 L0,32 L-2,18 Z" fill="url(#p21p2emeraldSuit)"/>
    <path d="M2,18 L0,32 L8,32 L12,18 Z" fill="url(#p21p2emeraldSuit)"/>

    <!-- ARMS WRAPPED around knees. -->
    <path d="M-14,-28 Q-26,-4 -22,18 L-14,20 Q-10,-2 -10,-30 Z" fill="url(#p21p2emeraldSuit)"/>
    <path d="M16,-28 Q28,-4 24,18 L16,20 Q12,-2 12,-30 Z" fill="url(#p21p2emeraldSuit)"/>
    <!-- Hands clasped at front. -->
    <ellipse cx="-12" cy="22" rx="5" ry="3" fill="url(#p21p2jinkSkin)"/>
    <ellipse cx="12" cy="22" rx="5" ry="3" fill="url(#p21p2jinkSkin)"/>

    <!-- Head — looking out toward city (right). -->
    <g transform="rotate(15 0 -52)">
      <ellipse cx="0" cy="-52" rx="11" ry="13" fill="url(#p21p2jinkSkin)"/>
      <!-- Matted dim hair. -->
      <g fill="url(#p21p2jinkHair)">
        <ellipse cx="-10" cy="-66" rx="6" ry="7"/>
        <ellipse cx="0" cy="-72" rx="6" ry="7"/>
        <ellipse cx="10" cy="-72" rx="6" ry="7"/>
        <ellipse cx="14" cy="-66" rx="6" ry="7"/>
        <ellipse cx="-12" cy="-58" rx="4" ry="6"/>
        <ellipse cx="16" cy="-58" rx="4" ry="6"/>
      </g>
      <!-- Warm rim on forward edge (city light). -->
      <path d="M8,-58 Q14,-50 12,-42" fill="none" stroke="#ffd078" stroke-width="1" opacity="0.85" filter="url(#p21p2bloom)"/>
      <!-- Eyes (open, looking right at city). -->
      <ellipse cx="-3" cy="-54" rx="2" ry="1.4" fill="#fff8e8"/>
      <circle cx="-2" cy="-54" r="1.2" fill="#2a4830"/>
      <circle cx="-2" cy="-54" r="0.6" fill="#0a0604"/>
      <ellipse cx="6" cy="-54" rx="2" ry="1.4" fill="#fff8e8"/>
      <circle cx="7" cy="-54" r="1.2" fill="#2a4830"/>
      <circle cx="7" cy="-54" r="0.6" fill="#0a0604"/>
      <!-- Brows (level, weighted). -->
      <path d="M-7,-60 Q-3,-62 1,-60" fill="none" stroke="#3a2810" stroke-width="0.55"/>
      <path d="M3,-60 Q7,-62 11,-60" fill="none" stroke="#3a2810" stroke-width="0.55"/>
      <!-- Nose. -->
      <path d="M2,-44 L0,-38 Q2,-37 4,-38 Z" fill="#5a3018" opacity="0.55"/>
      <!-- Mouth — closed, weighted. -->
      <path d="M-3,-32 Q2,-30 7,-32" fill="none" stroke="#3a1c08" stroke-width="0.55"/>
    </g>
  </g>

  <!-- No dialogue. -->

  <!-- Brushwork. -->
  <g stroke="#020a08" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q160,45 320,42"/>
    <path d="M320,40 Q420,45 494,42"/>
  </g>
</svg>
