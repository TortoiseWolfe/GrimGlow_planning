<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 20 — Panel 2: Jink at wall gap "G'night, Theodore"</title>
  <desc>MED 50mm low angle floor level. Tiny ~four-inch figure stands in gap between floorboards and wall — doorway at fairy scale, dark beyond. Half-in half-out, turned back, one hand raised in casual wave (not military salute). Golden curly hair catches last candlelight from workshop behind. Emerald suit soot-streaked, holographic accents glowing seams. Sincere casual grin — friend leaving room. Warm amber from workshop side, darkness beyond gap. Tiny figure silhouetted in threshold.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p20p2nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#080200"/>
    </linearGradient>
    <radialGradient id="p20p2warmHalo" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ff9028" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p20p2floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p20p2wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p20p2gapDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020100"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="p20p2jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p20p2jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p20p2emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <filter id="p20p2bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p20p2deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="364" fill="url(#p20p2nightBg)"/>
  <ellipse cx="366" cy="200" rx="240" ry="200" fill="url(#p20p2warmHalo)" opacity="0.85"/>

  <!-- WALL filling background, GAP center as doorway. -->
  <rect width="366" height="364" fill="url(#p20p2wall)"/>
  <!-- Floorboards (low angle, perspective). -->
  <rect x="0" y="280" width="366" height="84" fill="url(#p20p2floor)"/>
  <line x1="0" y1="280" x2="366" y2="280" stroke="#1a0c04" stroke-width="2"/>
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.65">
    <line x1="80" y1="280" x2="100" y2="364"/>
    <line x1="180" y1="280" x2="200" y2="364"/>
    <line x1="280" y1="280" x2="300" y2="364"/>
  </g>
  <!-- Wood grain. -->
  <g stroke="#5a3018" stroke-width="0.4" opacity="0.55">
    <path d="M0,160 Q183,164 366,160"/>
    <path d="M0,200 Q183,196 366,200"/>
    <path d="M0,240 Q183,244 366,240"/>
  </g>

  <!-- ******** GAP IN WALL — doorway at fairy scale, dark beyond ******** -->
  <g>
    <!-- Gap rectangle. -->
    <rect x="120" y="160" width="120" height="120" fill="url(#p20p2gapDark)"/>
    <!-- Frame edges (rough wood splinters). -->
    <path d="M120,160 L122,158 L240,158 L242,160 Z" fill="#1a0c04"/>
    <path d="M118,160 L120,160 L120,280 L118,280 Z" fill="#0a0402"/>
    <path d="M240,160 L242,160 L242,280 L240,280 Z" fill="#0a0402"/>
    <path d="M120,280 L122,278 L240,278 L242,280 Z" fill="#1a0c04"/>
    <!-- Inner gap shadow gradient. -->
    <ellipse cx="180" cy="220" rx="60" ry="50" fill="#020100" opacity="0.85"/>
  </g>

  <!-- Splintered floorboard edges around gap. -->
  <g stroke="#3a2010" stroke-width="0.85" fill="#1a0c04">
    <path d="M115,278 L120,272 L122,280 Z"/>
    <path d="M240,272 L246,278 L242,280 Z"/>
  </g>

  <!-- Brick visible inside gap (top). -->
  <g fill="#3a2010" opacity="0.55">
    <rect x="124" y="164" width="40" height="6"/>
    <rect x="166" y="164" width="36" height="6"/>
    <rect x="204" y="164" width="34" height="6"/>
  </g>

  <!-- ******** JINK in gap, half-in half-out, hand raised in wave ******** -->
  <g>
    <ellipse cx="180" cy="276" rx="22" ry="3" fill="#000" opacity="0.65"/>

    <!-- Legs (in gap, partially silhouette). -->
    <path d="M168,210 L166,272 L174,272 L176,210 Z" fill="url(#p20p2emeraldSuit)"/>
    <path d="M184,210 L184,240 L194,272 L202,272 L196,240 L192,210 Z" fill="url(#p20p2emeraldSuit)"/>
    <ellipse cx="170" cy="276" rx="6" ry="2" fill="#0a4018"/>
    <ellipse cx="198" cy="276" rx="6" ry="2" fill="#0a4018"/>

    <!-- Torso (turned back-left, half-in gap). -->
    <path d="M152,140 Q146,180 162,210 L202,210 Q220,180 212,140 Q208,130 182,130 Q156,130 152,140 Z" fill="url(#p20p2emeraldSuit)"/>
    <line x1="182" y1="130" x2="182" y2="210" stroke="#0a4018" stroke-width="0.55"/>
    <!-- Holo seams. -->
    <circle cx="182" cy="158" r="2" fill="#a8ffd0" filter="url(#p20p2bloom)"/>
    <circle cx="182" cy="186" r="2" fill="#a8ffd0" filter="url(#p20p2bloom)"/>
    <!-- Soot streak. -->
    <path d="M152,160 Q182,158 212,164 Q214,182 212,196 L152,196 Z" fill="#1a0c04" opacity="0.85"/>

    <!-- Wing-pack stowed. -->
    <rect x="158" y="138" width="48" height="14" fill="#1a4828"/>
    <line x1="158" y1="142" x2="206" y2="142" stroke="#2ed078" stroke-width="1.4" filter="url(#p20p2bloom)"/>

    <!-- Right arm RAISED in wave (wave hand visible above head). -->
    <path d="M212,144 L240,90 L250,80 L256,90 L246,108 L222,154 Z" fill="url(#p20p2emeraldSuit)"/>
    <!-- Hand. -->
    <ellipse cx="252" cy="84" rx="8" ry="6" fill="url(#p20p2jinkSkin)"/>
    <!-- Spread fingers (waving). -->
    <line x1="248" y1="78" x2="244" y2="68" stroke="url(#p20p2jinkSkin)" stroke-width="3" stroke-linecap="round"/>
    <line x1="252" y1="76" x2="252" y2="64" stroke="url(#p20p2jinkSkin)" stroke-width="3" stroke-linecap="round"/>
    <line x1="256" y1="78" x2="260" y2="66" stroke="url(#p20p2jinkSkin)" stroke-width="3" stroke-linecap="round"/>
    <line x1="258" y1="84" x2="266" y2="80" stroke="url(#p20p2jinkSkin)" stroke-width="3" stroke-linecap="round"/>
    <!-- Tiny motion lines (waving). -->
    <g fill="none" stroke="#fff0a8" stroke-width="0.85" opacity="0.65" filter="url(#p20p2bloom)">
      <path d="M270,72 Q278,76 282,80"/>
      <path d="M232,68 Q224,72 220,76"/>
    </g>

    <!-- Left arm at side. -->
    <path d="M152,144 Q140,180 138,210 L152,210 Q156,180 160,148 Z" fill="url(#p20p2emeraldSuit)"/>
    <ellipse cx="142" cy="214" rx="4" ry="3" fill="url(#p20p2jinkSkin)"/>

    <!-- HEAD turned back (3/4), hair catching warm light. -->
    <g transform="rotate(-15 182 110)">
      <ellipse cx="182" cy="110" rx="14" ry="16" fill="url(#p20p2jinkSkin)"/>
      <!-- Wild golden curls (warm-lit from right). -->
      <g fill="url(#p20p2jinkHair)">
        <ellipse cx="166" cy="92" rx="8" ry="10"/>
        <ellipse cx="180" cy="84" rx="8" ry="10"/>
        <ellipse cx="194" cy="84" rx="8" ry="10"/>
        <ellipse cx="206" cy="92" rx="8" ry="10"/>
        <ellipse cx="170" cy="106" rx="6" ry="8"/>
        <ellipse cx="184" cy="100" rx="6" ry="8"/>
        <ellipse cx="200" cy="104" rx="6" ry="8"/>
        <ellipse cx="162" cy="116" rx="5" ry="8"/>
        <ellipse cx="208" cy="116" rx="5" ry="8"/>
      </g>
      <!-- Curl shines (warm). -->
      <g stroke="#ffd078" stroke-width="1.4" fill="none" opacity="0.85" filter="url(#p20p2bloom)">
        <path d="M174,92 Q184,100 192,92"/>
        <path d="M194,92 Q204,100 212,92"/>
      </g>

      <!-- Eyes (looking right toward Theodore). -->
      <ellipse cx="184" cy="112" rx="2" ry="1.4" fill="#fff8e8"/>
      <circle cx="186" cy="112" r="1.2" fill="#2a4830"/>
      <circle cx="186" cy="112" r="0.6" fill="#0a0604"/>
      <ellipse cx="194" cy="114" rx="1.7" ry="1.2" fill="#fff8e8"/>
      <circle cx="195" cy="114" r="1" fill="#2a4830"/>

      <!-- Brow. -->
      <path d="M180,108 Q186,106 192,108" fill="none" stroke="#3a2810" stroke-width="0.55"/>

      <!-- Nose profile. -->
      <path d="M196,116 L200,118 L198,122 L194,120 Z" fill="url(#p20p2jinkSkin)"/>

      <!-- SINCERE CASUAL GRIN. -->
      <path d="M184,128 Q192,132 198,128" fill="none" stroke="#5a3018" stroke-width="1" stroke-linecap="round"/>
      <ellipse cx="190" cy="130" rx="3" ry="1.2" fill="#3a1408"/>
    </g>
  </g>

  <!-- DIALOGUE — small text from the gap. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="156" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M58,58 L70,58 L60,76 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="58.5" x2="68" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-style="italic">G'night, Theodore.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q120,45 246,42"/>
    <path d="M246,40 Q310,45 366,42"/>
  </g>
</svg>
