<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 9 — Panel 1: CU Jink sits on edge of brass gear, legs dangling</title>
  <desc>CU 85mm eye level fairy scale. Lean androgynous figure ~4 inches tall sits on edge of massive brass gear, legs dangling over teeth — each tooth reaches knee height. Light brown skin, golden curly hair, emerald suit with soot on forearm catching candlelight. Looks upward with relaxed, conversational body language — curious, studying, body language of someone making themselves comfortable + staying. Warm amber on brass gear surface. Emerald holo glow at collar + wrists. Settled confidence.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p9p1nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p9p1candleSide" cx="100%" cy="40%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p1emeraldGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p9p1bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p9p1brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="40%" stop-color="#f0d878"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <linearGradient id="p9p1jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p9p1jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p9p1emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p9p1sootStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </linearGradient>
    <filter id="p9p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="364" fill="url(#p9p1nightBg)"/>
  <rect width="366" height="364" fill="url(#p9p1candleSide)" opacity="0.7"/>

  <!-- Bench surface visible at bottom. -->
  <rect x="0" y="320" width="366" height="44" fill="url(#p9p1bench)"/>
  <line x1="0" y1="328" x2="366" y2="328" stroke="#1a0c04" stroke-width="0.85"/>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.5">
    <path d="M80,328 Q90,346 82,360"/>
    <path d="M180,328 Q190,346 182,360"/>
    <path d="M280,328 Q290,346 282,360"/>
  </g>

  <!-- Cool emerald glow around Jink. -->
  <ellipse cx="180" cy="220" rx="80" ry="100" fill="url(#p9p1emeraldGlow)" opacity="0.85" filter="url(#p9p1bloom)"/>

  <!-- BIG BRASS GEAR — Jink sits on its top edge. -->
  <g>
    <!-- Gear body (large, fills lower portion of frame). -->
    <circle cx="180" cy="320" r="100" fill="url(#p9p1brass)"/>
    <circle cx="180" cy="320" r="100" fill="none" stroke="#5a3018" stroke-width="1.4"/>
    <circle cx="180" cy="320" r="32" fill="#5a3018"/>
    <circle cx="180" cy="320" r="32" fill="none" stroke="#1a0c04" stroke-width="0.7"/>
    <!-- Gear teeth around upper rim (visible). -->
    <g stroke="#5a3018" stroke-width="1.4">
      <line x1="180" y1="220" x2="180" y2="208"/>
      <line x1="160" y1="222" x2="158" y2="210"/>
      <line x1="200" y1="222" x2="202" y2="210"/>
      <line x1="142" y1="226" x2="138" y2="216"/>
      <line x1="218" y1="226" x2="222" y2="216"/>
      <line x1="124" y1="234" x2="118" y2="224"/>
      <line x1="236" y1="234" x2="242" y2="224"/>
      <line x1="106" y1="246" x2="98" y2="238"/>
      <line x1="254" y1="246" x2="262" y2="238"/>
    </g>
    <!-- Highlight on gear. -->
    <ellipse cx="220" cy="260" rx="34" ry="20" fill="#fff0a8" opacity="0.55"/>
    <ellipse cx="160" cy="288" rx="14" ry="6" fill="#fff0a8" opacity="0.4"/>
  </g>

  <!-- ******** JINK sitting on gear edge, legs dangling ******** -->
  <g>
    <!-- Cast shadow on gear surface. -->
    <ellipse cx="180" cy="222" rx="22" ry="3" fill="#000" opacity="0.45"/>

    <!-- Sitting torso — Jink's legs hang OFF the gear edge (visible past gear teeth). -->
    <!-- Legs dangling. -->
    <path d="M170,228 Q166,260 164,290 L172,290 Q176,260 178,232 Z" fill="url(#p9p1emeraldSuit)"/>
    <path d="M188,232 Q186,260 188,290 L196,290 Q198,260 198,228 Z" fill="url(#p9p1emeraldSuit)"/>
    <!-- Boots. -->
    <ellipse cx="168" cy="294" rx="6" ry="3" fill="#0a4018"/>
    <ellipse cx="192" cy="294" rx="6" ry="3" fill="#0a4018"/>
    <line x1="164" y1="290" x2="172" y2="290" stroke="#2ed078" stroke-width="0.7" filter="url(#p9p1bloom)"/>
    <line x1="188" y1="290" x2="196" y2="290" stroke="#2ed078" stroke-width="0.7" filter="url(#p9p1bloom)"/>

    <!-- Torso (sitting upright, slightly forward leaning). -->
    <path d="M158,164 Q152,216 162,232 L196,232 Q206,216 200,164 Q196,158 180,158 Q162,158 158,164 Z" fill="url(#p9p1emeraldSuit)"/>
    <!-- Soot streak. -->
    <path d="M158,194 Q180,190 200,196 Q204,206 204,216 L158,216 Z" fill="url(#p9p1sootStreak)" opacity="0.85"/>
    <line x1="180" y1="158" x2="180" y2="232" stroke="#0a4018" stroke-width="0.4" opacity="0.85"/>
    <!-- Holo accents — chest, shoulders. -->
    <circle cx="180" cy="180" r="1.6" fill="#a8ffd0" filter="url(#p9p1bloom)"/>
    <circle cx="166" cy="174" r="1.2" fill="#a8ffd0" filter="url(#p9p1bloom)"/>
    <circle cx="194" cy="174" r="1.2" fill="#a8ffd0" filter="url(#p9p1bloom)"/>

    <!-- Arms — relaxed. RIGHT hand rests on gear surface. -->
    <path d="M158,164 Q146,196 144,226 L156,228 Q160,200 162,168 Z" fill="url(#p9p1emeraldSuit)"/>
    <path d="M200,164 Q210,196 212,226 L200,228 Q198,200 196,168 Z" fill="url(#p9p1emeraldSuit)"/>
    <line x1="142" y1="222" x2="158" y2="228" stroke="#2ed078" stroke-width="0.7" filter="url(#p9p1bloom)"/>
    <line x1="200" y1="228" x2="216" y2="222" stroke="#2ed078" stroke-width="0.7" filter="url(#p9p1bloom)"/>
    <!-- Forearm bare on right side (with SOOT on forearm script-specified). -->
    <path d="M212,224 Q220,232 222,238 L210,238 Q204,232 202,226 Z" fill="url(#p9p1jinkSkin)"/>
    <!-- Soot patch on forearm. -->
    <ellipse cx="214" cy="232" rx="6" ry="2" fill="#1a0c04" opacity="0.55"/>
    <!-- Hand resting on gear. -->
    <ellipse cx="222" cy="240" rx="6" ry="3" fill="url(#p9p1jinkSkin)"/>
    <!-- Spread fingers. -->
    <line x1="222" y1="238" x2="228" y2="234" stroke="url(#p9p1jinkSkin)" stroke-width="2" stroke-linecap="round"/>
    <line x1="222" y1="240" x2="230" y2="240" stroke="url(#p9p1jinkSkin)" stroke-width="2" stroke-linecap="round"/>
    <!-- Left hand resting on knee. -->
    <ellipse cx="146" cy="232" rx="5" ry="3" fill="url(#p9p1jinkSkin)"/>

    <!-- Wing-pack. -->
    <rect x="162" y="162" width="36" height="14" fill="#1a4828"/>
    <line x1="162" y1="166" x2="198" y2="166" stroke="#2ed078" stroke-width="0.85" filter="url(#p9p1bloom)"/>
    <line x1="162" y1="172" x2="198" y2="172" stroke="#2ed078" stroke-width="0.6" filter="url(#p9p1bloom)"/>
    <rect x="178" y="162" width="4" height="14" fill="#0a4018"/>

    <!-- HEAD — looking UP (chin slightly raised, eyes upward). -->
    <ellipse cx="180" cy="138" rx="14" ry="16" fill="url(#p9p1jinkSkin)"/>
    <!-- Curly hair. -->
    <g fill="url(#p9p1jinkHair)">
      <ellipse cx="164" cy="120" rx="6" ry="8"/>
      <ellipse cx="174" cy="114" rx="6" ry="7"/>
      <ellipse cx="186" cy="114" rx="6" ry="7"/>
      <ellipse cx="196" cy="120" rx="6" ry="8"/>
      <ellipse cx="168" cy="128" rx="5" ry="6"/>
      <ellipse cx="180" cy="124" rx="5" ry="6"/>
      <ellipse cx="192" cy="128" rx="5" ry="6"/>
      <ellipse cx="164" cy="134" rx="4" ry="6"/>
      <ellipse cx="196" cy="134" rx="4" ry="6"/>
    </g>
    <!-- Warm rim. -->
    <g stroke="#fff0a8" stroke-width="1" opacity="0.85">
      <ellipse cx="196" cy="116" rx="5" ry="6" fill="none"/>
      <ellipse cx="194" cy="128" rx="3" ry="4" fill="none"/>
    </g>

    <!-- Eyes looking UP (chin slightly raised). -->
    <ellipse cx="174" cy="136" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="174" cy="136" rx="2.4" ry="1.6" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="174" cy="135" r="1.2" fill="#2a4830"/>
    <circle cx="174" cy="134" r="0.6" fill="#0a0604"/>
    <circle cx="173.5" cy="133.5" r="0.4" fill="#ffffff"/>

    <ellipse cx="186" cy="136" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="186" cy="136" rx="2.4" ry="1.6" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="186" cy="135" r="1.2" fill="#2a4830"/>
    <circle cx="186" cy="134" r="0.6" fill="#0a0604"/>
    <circle cx="185.5" cy="133.5" r="0.4" fill="#ffffff"/>

    <!-- Brows relaxed (curious + arched). -->
    <path d="M170,130 Q174,128 178,130" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <path d="M182,130 Q186,128 190,130" fill="none" stroke="#3a2810" stroke-width="0.7"/>

    <!-- Nose. -->
    <path d="M180,142 L178,148 Q180,149 182,148 Z" fill="#7a4828" opacity="0.55"/>

    <!-- Conversational soft grin (less wide than reveal). -->
    <path d="M174,154 Q180,158 186,154" fill="none" stroke="#5a3018" stroke-width="1" stroke-linecap="round"/>

    <!-- Cheek glow warm. -->
    <ellipse cx="194" cy="142" rx="4" ry="3" fill="#ffd078" opacity="0.32"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- JINK balloon — top, tail to mouth. -->
  <rect x="14" y="14" width="240" height="74" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M148,88 L160,88 L180,144 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="148" y1="88" x2="160" y2="88" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="24" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">So what do you do here?</text>
  <text x="24" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">All these gears and springs —</text>
  <text x="24" y="84"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">you make clocks?</text>

</svg>
