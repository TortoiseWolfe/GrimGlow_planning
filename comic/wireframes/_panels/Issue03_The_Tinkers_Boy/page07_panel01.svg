<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 7 — Panel 1: Workshop at night, Theodore at bench, shard pulses brighter</title>
  <desc>MW 35mm eye level. Victorian clockmaker workshop at night. Theodore stands at his small workbench, one hand on bench edge, other holding small angular shard pulsing cool blue-white geometric light. Single candle on bench is only other illumination — warm amber catching brass + copper, deep shadows filling rest of workshop. Boy leans forward peering at cluttered bench surface — tiny tracks in brass filings, gear shifted, spring displaced. Focused attention not fear. Shard pulses brighter, geometric glow competing with candlelight, reflecting off brass filings. Workshop beyond candlelight is shapes in shadow. Rembrandt chiaroscuro. The moment before the moment.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p7p1nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p7p1candleHalo" cx="60%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p1shardGlow">
      <stop offset="0%" stop-color="#a0d8ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5090e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p7p1bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="50%" stop-color="#2a1408"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p7p1brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="40%" stop-color="#f0d878"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <radialGradient id="p7p1shardCore">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a0d8ff"/>
      <stop offset="80%" stop-color="#5090e0"/>
      <stop offset="100%" stop-color="#1a2858"/>
    </radialGradient>
    <linearGradient id="p7p1skin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7080a0"/>
      <stop offset="40%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="p7p1theoShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <linearGradient id="p7p1theoVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p7p1theoTrousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a24"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p7p1theoHair" cx="50%" cy="80%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </radialGradient>
    <radialGradient id="p7p1oilStain">
      <stop offset="0%" stop-color="#1a0e06" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a0e06" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p1bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p7p1strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p7p1deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG: very dark night workshop. -->
  <rect width="742" height="364" fill="url(#p7p1nightBg)"/>

  <!-- Suggestion of dark workshop (shelves of clocks as silhouettes — barely visible). -->
  <g opacity="0.32">
    <line x1="0" y1="86" x2="742" y2="86" stroke="#3a2010" stroke-width="0.7"/>
    <circle cx="60" cy="76" r="6" fill="#1a0c04"/>
    <rect x="100" y="68" width="12" height="16" fill="#1a0c04"/>
    <circle cx="140" cy="76" r="5" fill="#1a0c04"/>
    <rect x="180" y="68" width="12" height="16" fill="#1a0c04"/>
    <circle cx="600" cy="76" r="6" fill="#1a0c04"/>
    <rect x="640" y="68" width="12" height="16" fill="#1a0c04"/>
    <circle cx="680" cy="76" r="5" fill="#1a0c04"/>
  </g>

  <!-- Wall pegs barely visible. -->
  <g opacity="0.28">
    <line x1="80" y1="118" x2="80" y2="156" stroke="#3a2010" stroke-width="1"/>
    <line x1="100" y1="118" x2="100" y2="160" stroke="#3a2010" stroke-width="1"/>
    <ellipse cx="100" cy="162" rx="4" ry="2" fill="#3a2010"/>
  </g>

  <!-- Cribbage's main bench (image-LEFT, dark, abandoned). -->
  <g opacity="0.45">
    <rect x="0" y="220" width="180" height="32" fill="url(#p7p1bench)"/>
    <rect x="20" y="252" width="6" height="80" fill="#0a0402"/>
    <rect x="160" y="252" width="6" height="80" fill="#0a0402"/>
  </g>

  <!-- THEODORE'S BENCH — center-right. The pool of light. -->
  <g>
    <!-- Candle warm halo radiating outward. -->
    <ellipse cx="490" cy="240" rx="320" ry="180" fill="url(#p7p1candleHalo)" opacity="0.85"/>

    <!-- Bench top. -->
    <rect x="280" y="240" width="442" height="34" fill="url(#p7p1bench)"/>
    <rect x="280" y="240" width="442" height="6" fill="#7a4828"/>
    <line x1="280" y1="246" x2="722" y2="246" stroke="#1a0c04" stroke-width="0.5"/>
    <!-- Bench legs. -->
    <rect x="294" y="274" width="6" height="90" fill="#0a0402"/>
    <rect x="710" y="274" width="6" height="90" fill="#0a0402"/>
    <!-- Bench drawer apron. -->
    <rect x="300" y="274" width="408" height="32" fill="#1a0c04"/>
    <line x1="300" y1="288" x2="708" y2="288" stroke="#0a0402" stroke-width="0.5"/>

    <!-- THE CANDLE on bench (warm key light source). -->
    <g>
      <rect x="600" y="208" width="3" height="34" fill="#dcd0b4"/>
      <line x1="601.5" y1="208" x2="601.5" y2="242" stroke="#5a4838" stroke-width="0.3"/>
      <ellipse cx="601.5" cy="204" rx="2" ry="3.5" fill="#fff0a8" filter="url(#p7p1strongBloom)"/>
      <ellipse cx="601.5" cy="206" rx="1.4" ry="2.4" fill="#fff0a8"/>
      <ellipse cx="601.5" cy="208" rx="0.8" ry="1.5" fill="#ffffff"/>
      <!-- Candle holder. -->
      <ellipse cx="601.5" cy="242" rx="10" ry="3" fill="#a85820"/>
      <ellipse cx="601.5" cy="240" rx="10" ry="2.5" fill="#f5d878" opacity="0.85"/>
    </g>

    <!-- Scattered clockwork parts on bench (the "tracks in brass filings"). -->
    <g>
      <!-- Brass filings (small particles). -->
      <g fill="#dcaf60" opacity="0.55">
        <circle cx="380" cy="244" r="0.7"/>
        <circle cx="386" cy="246" r="0.6"/>
        <circle cx="392" cy="244" r="0.65"/>
        <circle cx="398" cy="246" r="0.5"/>
        <circle cx="404" cy="244" r="0.7"/>
        <circle cx="410" cy="246" r="0.5"/>
        <circle cx="416" cy="244" r="0.6"/>
        <circle cx="422" cy="246" r="0.65"/>
        <!-- TINY TRACK pattern in filings (showing displacement — Jink walked through). -->
        <ellipse cx="430" cy="244" rx="3" ry="0.7" fill="#5a3018" opacity="0.85"/>
        <ellipse cx="442" cy="244" rx="3" ry="0.7" fill="#5a3018" opacity="0.85"/>
        <ellipse cx="454" cy="244" rx="3" ry="0.7" fill="#5a3018" opacity="0.85"/>
      </g>
      <!-- Brass gears (scattered). -->
      <circle cx="370" cy="252" r="6" fill="url(#p7p1brass)"/>
      <circle cx="370" cy="252" r="6" fill="none" stroke="#5a3018" stroke-width="0.5"/>
      <circle cx="370" cy="252" r="2" fill="#5a3018"/>
      <ellipse cx="368" cy="250" rx="2" ry="1" fill="#fff0a8" opacity="0.85"/>
      <!-- A "shifted" gear (slightly out of place). -->
      <circle cx="396" cy="256" r="5" fill="url(#p7p1brass)"/>
      <circle cx="396" cy="256" r="5" fill="none" stroke="#5a3018" stroke-width="0.5"/>
      <ellipse cx="394" cy="254" rx="1.5" ry="0.8" fill="#fff0a8" opacity="0.85"/>
      <!-- Coiled spring partially uncoiled. -->
      <circle cx="426" cy="252" r="6" fill="none" stroke="#a85820" stroke-width="1"/>
      <circle cx="426" cy="252" r="4" fill="none" stroke="#a85820" stroke-width="0.7"/>
      <!-- Spring 'displaced' — escaping coil to the right. -->
      <path d="M432,252 Q446,248 460,252" fill="none" stroke="#a85820" stroke-width="1"/>
      <!-- Steel file (long ridged tool). -->
      <rect x="466" y="248" width="56" height="4" fill="#5a606a"/>
      <g stroke="#3a3848" stroke-width="0.4" opacity="0.85">
        <line x1="468" y1="248" x2="468" y2="252"/>
        <line x1="472" y1="248" x2="472" y2="252"/>
        <line x1="476" y1="248" x2="476" y2="252"/>
        <line x1="480" y1="248" x2="480" y2="252"/>
        <line x1="484" y1="248" x2="484" y2="252"/>
        <line x1="488" y1="248" x2="488" y2="252"/>
        <line x1="492" y1="248" x2="492" y2="252"/>
        <line x1="496" y1="248" x2="496" y2="252"/>
        <line x1="500" y1="248" x2="500" y2="252"/>
        <line x1="504" y1="248" x2="504" y2="252"/>
        <line x1="508" y1="248" x2="508" y2="252"/>
        <line x1="512" y1="248" x2="512" y2="252"/>
        <line x1="516" y1="248" x2="516" y2="252"/>
      </g>
      <rect x="520" y="246" width="14" height="8" fill="#3a2010"/>
      <!-- Thimble (steel cup). -->
      <path d="M540,236 Q540,254 552,256 L562,256 Q574,254 574,236 L572,232 L542,232 Z" fill="#a89878"/>
      <path d="M540,236 Q540,254 552,256 L562,256 Q574,254 574,236" fill="none" stroke="#5a4838" stroke-width="0.5"/>
      <!-- Dimples on thimble. -->
      <g fill="#5a4838" opacity="0.6">
        <circle cx="546" cy="240" r="0.7"/>
        <circle cx="552" cy="238" r="0.7"/>
        <circle cx="558" cy="240" r="0.7"/>
        <circle cx="564" cy="238" r="0.7"/>
        <circle cx="570" cy="240" r="0.7"/>
        <circle cx="548" cy="246" r="0.7"/>
        <circle cx="554" cy="244" r="0.7"/>
        <circle cx="560" cy="246" r="0.7"/>
        <circle cx="566" cy="244" r="0.7"/>
      </g>
      <!-- Watch case. -->
      <ellipse cx="354" cy="260" rx="6" ry="4" fill="#3a2010"/>
      <ellipse cx="354" cy="260" rx="4" ry="2.5" fill="url(#p7p1brass)" opacity="0.85"/>
      <!-- Tools roll partial. -->
      <rect x="630" y="244" width="60" height="10" rx="1" fill="#5a3018"/>
      <line x1="640" y1="244" x2="640" y2="254" stroke="#1a0c04" stroke-width="0.4"/>
      <line x1="650" y1="244" x2="650" y2="254" stroke="#1a0c04" stroke-width="0.4"/>
      <line x1="660" y1="244" x2="660" y2="254" stroke="#1a0c04" stroke-width="0.4"/>
    </g>
  </g>

  <!-- THEODORE — standing at his bench, leaning slightly forward to peer at surface.
       Position: image-left of bench, facing right (toward candle + clockwork). -->
  <g>
    <!-- Cast shadow on floor. -->
    <ellipse cx="276" cy="354" rx="40" ry="4" fill="#000" opacity="0.45"/>

    <!-- Trousers. -->
    <path d="M250,260 Q244,300 250,344 L274,344 Q280,300 274,260 Z" fill="url(#p7p1theoTrousers)"/>
    <path d="M278,260 Q276,300 282,344 L302,344 Q308,300 302,260 Z" fill="url(#p7p1theoTrousers)"/>
    <!-- Boots. -->
    <ellipse cx="262" cy="354" rx="11" ry="3" fill="#0a0402"/>
    <ellipse cx="292" cy="354" rx="11" ry="3" fill="#0a0402"/>

    <!-- Linen shirt. -->
    <path d="M222,162 Q214,222 220,260 L308,260 Q316,222 310,162 Q302,154 266,154 Q230,154 222,162 Z" fill="url(#p7p1theoShirt)"/>
    <!-- Cool wash from shard (his right hand). -->
    <path d="M222,162 Q214,222 220,260 L308,260 Q316,222 310,162 Q302,154 266,154 Q230,154 222,162 Z" fill="#a0c8ff" opacity="0.18"/>
    <!-- Warm wash from candle (right side). -->
    <path d="M266,162 Q300,222 310,260 L310,162 Z" fill="#ffd078" opacity="0.18"/>

    <!-- Brown waistcoat. -->
    <path d="M228,170 L226,260 L304,260 L304,170 L294,176 L284,182 L266,188 L248,182 L238,176 Z" fill="url(#p7p1theoVest)"/>
    <line x1="266" y1="188" x2="266" y2="260" stroke="#1a0c04" stroke-width="0.4" opacity="0.7"/>
    <circle cx="266" cy="200" r="1.4" fill="url(#p7p1brass)"/>
    <circle cx="266" cy="212" r="1.4" fill="url(#p7p1brass)"/>
    <circle cx="266" cy="224" r="1.4" fill="url(#p7p1brass)"/>
    <circle cx="266" cy="236" r="1.4" fill="url(#p7p1brass)"/>
    <circle cx="266" cy="248" r="1.4" fill="url(#p7p1brass)"/>
    <path d="M254,154 L266,176 L278,154 Z" fill="url(#p7p1theoShirt)"/>
    <circle cx="266" cy="172" r="1.6" fill="url(#p7p1brass)"/>
    <rect x="226" y="256" width="80" height="4" fill="#3a2010"/>

    <!-- LEFT ARM — gripping bench edge. -->
    <path d="M222,164 Q210,200 206,236 L218,236 Q222,202 226,166 Z" fill="url(#p7p1theoShirt)"/>
    <rect x="204" y="232" width="20" height="5" fill="#a89878"/>
    <line x1="204" y1="234" x2="224" y2="234" stroke="#5a4838" stroke-width="0.4"/>
    <!-- Forearm reaching forward. -->
    <path d="M206,236 Q198,258 220,272 L240,266 Q230,250 222,236 Z" fill="url(#p7p1skin)"/>
    <ellipse cx="212" cy="252" rx="6" ry="3" fill="url(#p7p1oilStain)"/>
    <!-- Hand on bench edge (gripping). -->
    <ellipse cx="246" cy="270" rx="9" ry="6" fill="url(#p7p1skin)"/>
    <path d="M238,268 Q244,272 252,272" fill="none" stroke="#7a4828" stroke-width="0.6"/>

    <!-- RIGHT ARM — extended with shard in hand. -->
    <path d="M310,164 Q322,200 326,236 L314,238 Q310,202 304,166 Z" fill="url(#p7p1theoShirt)"/>
    <rect x="314" y="232" width="20" height="5" fill="#a89878"/>
    <!-- Forearm extending toward candle/bench center (with shard). -->
    <path d="M326,236 Q336,250 350,260 L362,254 Q346,242 332,234 Z" fill="url(#p7p1skin)"/>
    <ellipse cx="340" cy="248" rx="5" ry="3" fill="url(#p7p1oilStain)"/>
    <!-- Hand holding shard. -->
    <ellipse cx="364" cy="262" rx="8" ry="5" fill="url(#p7p1skin)"/>
    <!-- Shard gripped in hand — pulsing brighter. -->
    <g>
      <ellipse cx="368" cy="262" rx="22" ry="12" fill="url(#p7p1shardGlow)" filter="url(#p7p1deepBloom)" opacity="0.85"/>
      <ellipse cx="368" cy="262" rx="12" ry="6" fill="#a0d8ff" opacity="0.55" filter="url(#p7p1strongBloom)"/>
      <!-- Shard surface peeking through fingers. -->
      <path d="M364,260 L370,256 L374,262 L370,266 Z" fill="url(#p7p1shardCore)" opacity="0.95"/>
      <line x1="367" y1="262" x2="372" y2="262" stroke="#ffffff" stroke-width="0.4" opacity="0.95" filter="url(#p7p1bloom)"/>
      <circle cx="370" cy="261" r="1" fill="#ffffff" filter="url(#p7p1bloom)"/>
    </g>
    <!-- Brass gear ring on left index. -->
    <circle cx="244" cy="272" r="1.4" fill="url(#p7p1brass)"/>

    <!-- HEAD — leaning forward, peering at bench. -->
    <path d="M254,138 L254,154 L274,154 L274,138 Z" fill="url(#p7p1skin)"/>
    <ellipse cx="266" cy="116" rx="20" ry="22" fill="url(#p7p1skin)"/>
    <!-- Cool wash from shard. -->
    <ellipse cx="266" cy="124" rx="20" ry="14" fill="#a0c8ff" opacity="0.32"/>
    <!-- Warm wash from candle. -->
    <ellipse cx="276" cy="116" rx="12" ry="14" fill="#ffd078" opacity="0.28"/>
    <!-- Tousled spikes. -->
    <path d="M250,104 Q246,82 266,76 Q278,72 286,76 Q288,92 286,104 L282,108 Q278,90 272,86 L260,86 Q254,90 252,108 Z" fill="url(#p7p1theoHair)"/>
    <path d="M254,82 L252,68 L258,82 Z" fill="url(#p7p1theoHair)"/>
    <path d="M264,76 L264,62 L270,76 Z" fill="url(#p7p1theoHair)"/>
    <path d="M276,76 L280,62 L280,80 Z" fill="url(#p7p1theoHair)"/>
    <!-- Bangs. -->
    <path d="M254,100 L256,112 L260,100 Z" fill="url(#p7p1theoHair)"/>
    <path d="M264,102 L266,114 L270,102 Z" fill="url(#p7p1theoHair)"/>
    <path d="M274,102 L276,112 L280,102 Z" fill="url(#p7p1theoHair)"/>
    <!-- Sides. -->
    <path d="M250,104 Q246,128 254,142 L260,142 Q256,134 256,104 Z" fill="url(#p7p1theoHair)"/>
    <path d="M286,104 Q288,128 280,142 L274,142 Q278,134 278,104 Z" fill="url(#p7p1theoHair)"/>

    <!-- Eyes — focused, looking forward at bench (alert). -->
    <ellipse cx="260" cy="116" rx="1.6" ry="0.9" fill="#3a2810"/>
    <ellipse cx="272" cy="116" rx="1.6" ry="0.9" fill="#3a2810"/>
    <!-- Cool catchlight from shard. -->
    <ellipse cx="260" cy="117" rx="0.5" ry="0.4" fill="#a0d8ff" filter="url(#p7p1bloom)"/>
    <ellipse cx="272" cy="117" rx="0.5" ry="0.4" fill="#a0d8ff" filter="url(#p7p1bloom)"/>
    <!-- Brows lowered (focused). -->
    <path d="M256,112 Q260,110 264,112" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <path d="M268,112 Q272,110 276,112" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <!-- Nose. -->
    <path d="M266,122 L264,132 Q266,133 268,132 Z" fill="#a8765a" opacity="0.55"/>
    <!-- Mouth — slightly tense. -->
    <line x1="262" y1="142" x2="270" y2="142" stroke="#7a3018" stroke-width="0.85"/>
    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.85">
      <circle cx="258" cy="126" r="0.5"/>
      <circle cx="262" cy="128" r="0.45"/>
      <circle cx="270" cy="126" r="0.5"/>
      <circle cx="274" cy="128" r="0.45"/>
    </g>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
    <path d="M0,310 Q200,315 400,312"/>
    <path d="M400,310 Q600,315 742,312"/>
  </g>

  <!-- CAPTION — top-left, parchment. -->
  <rect x="14" y="14" width="262" height="40" rx="2"
        fill="#f5ecd8" stroke="#c8b898" stroke-width="1.5"
        filter="url(#balloonShadow)"/>
  <text x="24" y="32"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="12" font-weight="700" font-style="italic"
        fill="#5a4a30" letter-spacing="0.3">CAPTION</text>
  <text x="24" y="46"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-style="italic"
        fill="#5a4a30">Night. Workshop closed. Cribbage long gone.</text>

  <!-- THEODORE balloon — top-right area, pointing to his head. -->
  <rect x="436" y="14" width="220" height="62" rx="8"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M444,76 L456,76 L300,140 Z"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="444" y1="76" x2="456" y2="76" stroke="#ffffff" stroke-width="3"/>
  <text x="446" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#6a4220" letter-spacing="0.3">THEODORE</text>
  <text x="446" y="50"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-style="italic" font-weight="500"
        fill="#5a4030">(quietly)</text>
  <text x="446" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Someone's been at my tools.</text>

</svg>
