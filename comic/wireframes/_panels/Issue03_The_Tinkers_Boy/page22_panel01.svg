<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 22 — Panel 1: Grey morning street establishing</title>
  <desc>Wide 28mm establishing shot at human scale, eye level. Grey Victorian morning on narrow Clerkenwell street. Terraced houses, corner bakery with fogged windows, lamplighter extinguishing last gas lamp, cart rumbling past, woman shaking rug from upper window. Twelve-year-old boy walks toward work — slight, sandy-brown hair, collarless shirt, worn leather waistcoat, patched trousers, hands in pockets. Looks ordinary. Walk slightly different, head slightly higher, faintest trace of suppressed smile. Grey overcast daylight, muted and diffused. NO warm gaslight, NO cool fairy light. Desaturated grey-brown brick, muted wool, fog. Most colourless panel in issue.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p22p1greySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="p22p1greyStreet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a6058"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </linearGradient>
    <linearGradient id="p22p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5048"/>
      <stop offset="100%" stop-color="#5a3830"/>
    </linearGradient>
    <linearGradient id="p22p1theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a89888"/>
      <stop offset="100%" stop-color="#c8b8a8"/>
    </linearGradient>
    <radialGradient id="p22p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#88806a"/>
      <stop offset="100%" stop-color="#3a3028"/>
    </radialGradient>
    <linearGradient id="p22p1shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#7a6858"/>
    </linearGradient>
    <linearGradient id="p22p1vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p22p1trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2c20"/>
    </linearGradient>
    <radialGradient id="p22p1lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8c098" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87858" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p1bloom"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- BG sky. -->
  <rect width="742" height="220" fill="url(#p22p1greySky)"/>
  <!-- Fog horizontal wisps. -->
  <g fill="none" stroke="#a89888" stroke-width="0.85" opacity="0.45">
    <path d="M0,40 Q371,38 742,42"/>
    <path d="M0,80 Q371,82 742,76"/>
    <path d="M0,120 Q371,118 742,124"/>
    <path d="M0,160 Q371,162 742,158"/>
  </g>

  <!-- Street/cobblestones. -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p22p1greyStreet)"/>
  <!-- Cobblestone texture. -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.65">
    <path d="M0,240 Q60,238 120,242"/>
    <path d="M120,240 Q200,242 280,238"/>
    <path d="M280,242 Q380,240 480,242"/>
    <path d="M480,238 Q600,242 742,240"/>
    <path d="M0,280 Q120,282 240,278"/>
    <path d="M240,278 Q380,282 540,278"/>
    <path d="M540,282 Q660,278 742,282"/>
    <path d="M0,320 Q160,318 320,322"/>
    <path d="M320,322 Q480,318 640,322"/>
    <path d="M640,318 Q700,322 742,320"/>
  </g>
  <!-- Cobble individual stones (dots). -->
  <g fill="#3a3028" opacity="0.55">
    <circle cx="60" cy="260" r="2"/>
    <circle cx="180" cy="270" r="2"/>
    <circle cx="280" cy="260" r="2"/>
    <circle cx="380" cy="270" r="2"/>
    <circle cx="500" cy="260" r="2"/>
    <circle cx="620" cy="270" r="2"/>
    <circle cx="100" cy="300" r="2"/>
    <circle cx="220" cy="305" r="2"/>
    <circle cx="340" cy="300" r="2"/>
    <circle cx="460" cy="305" r="2"/>
    <circle cx="580" cy="300" r="2"/>
    <circle cx="700" cy="305" r="2"/>
  </g>

  <!-- LEFT SIDE: terraced houses + corner bakery. -->
  <g>
    <rect x="0" y="60" width="180" height="160" fill="url(#p22p1brick)"/>
    <!-- Brick mortar lines. -->
    <g stroke="#3a2818" stroke-width="0.55" opacity="0.65">
      <line x1="0" y1="80" x2="180" y2="80"/>
      <line x1="0" y1="100" x2="180" y2="100"/>
      <line x1="0" y1="120" x2="180" y2="120"/>
      <line x1="0" y1="140" x2="180" y2="140"/>
      <line x1="0" y1="160" x2="180" y2="160"/>
      <line x1="0" y1="180" x2="180" y2="180"/>
      <line x1="0" y1="200" x2="180" y2="200"/>
      <line x1="40" y1="60" x2="40" y2="100"/>
      <line x1="100" y1="100" x2="100" y2="140"/>
      <line x1="60" y1="160" x2="60" y2="200"/>
      <line x1="120" y1="180" x2="120" y2="220"/>
    </g>
    <!-- Bakery sign. -->
    <rect x="20" y="100" width="140" height="22" fill="#5a3818"/>
    <text x="90" y="116" text-anchor="middle" font-size="11" fill="#c8a888" font-weight="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="2">BAKERY</text>
    <!-- Fogged windows. -->
    <rect x="20" y="130" width="60" height="50" fill="#7a7060" opacity="0.85"/>
    <rect x="100" y="130" width="60" height="50" fill="#7a7060" opacity="0.85"/>
    <line x1="50" y1="130" x2="50" y2="180" stroke="#3a2818" stroke-width="0.85"/>
    <line x1="130" y1="130" x2="130" y2="180" stroke="#3a2818" stroke-width="0.85"/>
    <!-- Door with steps. -->
    <rect x="40" y="180" width="40" height="40" fill="#3a2010"/>
    <line x1="60" y1="180" x2="60" y2="220" stroke="#1a0c04" stroke-width="0.55"/>
  </g>

  <!-- RIGHT SIDE: terraced houses receding. -->
  <g>
    <rect x="540" y="60" width="202" height="160" fill="url(#p22p1brick)"/>
    <!-- Brick lines. -->
    <g stroke="#3a2818" stroke-width="0.55" opacity="0.65">
      <line x1="540" y1="80" x2="742" y2="80"/>
      <line x1="540" y1="100" x2="742" y2="100"/>
      <line x1="540" y1="120" x2="742" y2="120"/>
      <line x1="540" y1="140" x2="742" y2="140"/>
      <line x1="540" y1="160" x2="742" y2="160"/>
      <line x1="540" y1="180" x2="742" y2="180"/>
      <line x1="540" y1="200" x2="742" y2="200"/>
    </g>
    <!-- Upper window (woman shaking rug). -->
    <rect x="600" y="100" width="40" height="50" fill="#3a3028"/>
    <rect x="604" y="104" width="32" height="42" fill="#5a4838"/>
    <line x1="620" y1="104" x2="620" y2="146" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Woman silhouette. -->
    <ellipse cx="620" cy="116" rx="6" ry="8" fill="#3a2818"/>
    <path d="M608,124 L612,140 L628,140 L632,124 Z" fill="#3a2818"/>
    <!-- Rug being shaken. -->
    <path d="M600,142 Q610,150 620,148 Q630,150 640,142 L640,162 Q620,168 600,162 Z" fill="#7a5050" opacity="0.85"/>
    <!-- Motion lines on rug. -->
    <g stroke="#a89888" stroke-width="0.55" opacity="0.65">
      <path d="M598,150 L600,156"/>
      <path d="M642,150 L640,156"/>
    </g>
    <!-- Other windows. -->
    <rect x="660" y="100" width="36" height="46" fill="#5a4838"/>
    <line x1="678" y1="100" x2="678" y2="146" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="540" y="100" width="40" height="50" fill="#5a4838"/>
    <line x1="560" y1="100" x2="560" y2="150" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Door at street. -->
    <rect x="700" y="180" width="30" height="40" fill="#3a2010"/>
  </g>

  <!-- LAMP POST + LAMPLIGHTER (left-mid). -->
  <g>
    <!-- Lamp post. -->
    <rect x="216" y="80" width="6" height="140" fill="#1a0c04"/>
    <rect x="210" y="76" width="18" height="6" fill="#1a0c04"/>
    <!-- Lamp head. -->
    <rect x="208" y="68" width="22" height="14" fill="#3a2818"/>
    <!-- Just-extinguished glow (faint warm). -->
    <ellipse cx="219" cy="74" rx="14" ry="14" fill="url(#p22p1lampGlow)" opacity="0.45" filter="url(#p22p1bloom)"/>
    <!-- Lamp post base. -->
    <rect x="208" y="216" width="22" height="6" fill="#1a0c04"/>
  </g>

  <!-- Lamplighter (with pole). -->
  <g transform="translate(258 160)">
    <!-- Body. -->
    <path d="M-6,0 L-8,40 L8,40 L6,0 Z" fill="#3a2818"/>
    <!-- Head. -->
    <ellipse cx="0" cy="-8" rx="6" ry="7" fill="#a89070"/>
    <!-- Cap. -->
    <path d="M-6,-12 Q0,-18 6,-12 L6,-6 L-6,-6 Z" fill="#1a0c04"/>
    <!-- Coat tail. -->
    <path d="M-8,40 L-12,60 L12,60 L8,40 Z" fill="#3a2818"/>
    <!-- Arms holding pole. -->
    <path d="M-6,4 L-22,-30 L-26,-30 L-12,8 Z" fill="#3a2818"/>
    <path d="M6,4 L-12,-30 L-16,-30 L0,10 Z" fill="#3a2818"/>
    <!-- Long pole reaching up to lamp. -->
    <line x1="-26" y1="-30" x2="-50" y2="-72" stroke="#5a4838" stroke-width="2"/>
    <!-- Pole hook. -->
    <path d="M-50,-72 L-54,-78 L-50,-82" fill="none" stroke="#1a0c04" stroke-width="1.4"/>
  </g>

  <!-- CART rumbling past mid-distance. -->
  <g transform="translate(440 200)">
    <!-- Cart body. -->
    <rect x="0" y="-30" width="100" height="40" fill="#3a2818"/>
    <line x1="0" y1="-20" x2="100" y2="-20" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="0" y1="-10" x2="100" y2="-10" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Wheels. -->
    <circle cx="20" cy="14" r="14" fill="#1a0c04"/>
    <circle cx="20" cy="14" r="10" fill="none" stroke="#5a4838" stroke-width="0.85"/>
    <line x1="20" y1="0" x2="20" y2="28" stroke="#5a4838" stroke-width="0.85"/>
    <line x1="6" y1="14" x2="34" y2="14" stroke="#5a4838" stroke-width="0.85"/>
    <circle cx="80" cy="14" r="14" fill="#1a0c04"/>
    <circle cx="80" cy="14" r="10" fill="none" stroke="#5a4838" stroke-width="0.85"/>
    <line x1="80" y1="0" x2="80" y2="28" stroke="#5a4838" stroke-width="0.85"/>
    <line x1="66" y1="14" x2="94" y2="14" stroke="#5a4838" stroke-width="0.85"/>
    <!-- Driver hint at front. -->
    <ellipse cx="100" cy="-40" rx="6" ry="10" fill="#3a2818"/>
    <ellipse cx="100" cy="-48" rx="4" ry="4" fill="#a89070"/>
  </g>

  <!-- ******** THEODORE walking center foreground ******** -->
  <g transform="translate(330 280)">
    <!-- Long shadow on cobbles. -->
    <ellipse cx="0" cy="60" rx="16" ry="3" fill="#1a1410" opacity="0.55"/>

    <!-- Trousers (legs walking — left forward). -->
    <path d="M-8,0 L-10,46 L-2,52 L-2,0 Z" fill="url(#p22p1trousers)"/>
    <path d="M2,0 L4,46 L12,52 L8,0 Z" fill="url(#p22p1trousers)"/>
    <ellipse cx="-6" cy="58" rx="5" ry="2" fill="#1a0c04"/>
    <ellipse cx="8" cy="58" rx="5" ry="2" fill="#1a0c04"/>
    <!-- Patched trousers (small patches). -->
    <rect x="-8" y="20" width="6" height="8" fill="#3a2010" opacity="0.65"/>
    <rect x="2" y="32" width="6" height="6" fill="#3a2010" opacity="0.65"/>

    <!-- Vest. -->
    <path d="M-14,-50 L-18,0 L18,0 L14,-50 Z" fill="url(#p22p1vest)"/>
    <!-- Shirt center collar. -->
    <path d="M-6,-60 L-4,-50 L4,-50 L6,-60 Z" fill="url(#p22p1shirt)"/>

    <!-- Arms (hands in pockets). -->
    <path d="M-14,-44 Q-22,-22 -22,0 L-14,2 Q-12,-22 -10,-44 Z" fill="url(#p22p1shirt)"/>
    <path d="M14,-44 Q22,-22 22,0 L14,2 Q12,-22 10,-44 Z" fill="url(#p22p1shirt)"/>
    <!-- Pockets (hands in). -->
    <ellipse cx="-22" cy="-4" rx="4" ry="6" fill="url(#p22p1vest)"/>
    <ellipse cx="22" cy="-4" rx="4" ry="6" fill="url(#p22p1vest)"/>

    <!-- Head — slightly higher than usual. -->
    <ellipse cx="0" cy="-78" rx="14" ry="16" fill="url(#p22p1theoSkin)"/>
    <!-- Hair tousled. -->
    <g fill="url(#p22p1theoHair)">
      <path d="M-12,-92 Q-14,-104 0,-108 Q14,-104 12,-92 L8,-90 Q4,-100 -4,-100 Q-12,-100 -16,-90 Z"/>
      <path d="M-8,-104 L-10,-114 L-4,-104 Z"/>
      <path d="M-2,-108 L-2,-118 L4,-104 Z"/>
      <path d="M6,-108 L10,-118 L8,-104 Z"/>
    </g>
    <!-- Eyes (faint hint). -->
    <ellipse cx="-4" cy="-78" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="-4" cy="-78" r="0.85" fill="#3a2810"/>
    <ellipse cx="4" cy="-78" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="4" cy="-78" r="0.85" fill="#3a2810"/>
    <!-- Nose. -->
    <path d="M0,-72 L-2,-66 Q0,-65 2,-66 Z" fill="#7a5848" opacity="0.55"/>
    <!-- SUPPRESSED SMILE — faintest curve. -->
    <path d="M-3,-60 Q0,-58 3,-60" fill="none" stroke="#3a2010" stroke-width="0.55" stroke-linecap="round"/>
    <!-- Freckles. -->
    <circle cx="-6" cy="-70" r="0.55" fill="#7a5848"/>
    <circle cx="6" cy="-70" r="0.55" fill="#7a5848"/>
  </g>

  <!-- Distant figure (silhouette far down street). -->
  <g opacity="0.65">
    <ellipse cx="180" cy="240" rx="3" ry="8" fill="#3a2818"/>
    <ellipse cx="180" cy="232" rx="2" ry="2" fill="#3a2818"/>
  </g>

  <!-- CAPTION. -->
  <g>
    <rect x="14" y="14" width="402" height="44" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5a4a30" font-style="italic">Morning. The city did not know it had changed.</text>

  <!-- Brushwork. -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
  </g>
</svg>
