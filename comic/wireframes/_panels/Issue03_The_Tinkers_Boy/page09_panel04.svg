<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493.8 364" width="493.8" height="364">
  <title>Issue 3 — Page 9 — Panel 4: MED past-Jink to Theodore's enormous face cataloguing</title>
  <desc>MED 50mm fairy-scale looking past Jink (foreground back-to-camera) to Theodore's enormous face beyond at bench edge. Theodore no longer frightening — warm + listening. Hazel eyes show careful attention, cataloguing what he sees. Hand rests on bench surface near Jink — index finger with brass gear ring closer to Jink than Jink is tall. Warm amber from behind Theodore's head haloes him. Cool emerald glow from Jink's suit foreground. Brass gear ring catches both lights. Intimacy across the impossible scale.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p9p4nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p9p4candleHalo" cx="60%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p4emeraldGlow" cx="30%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p9p4bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p9p4theoSkin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="p9p4theoSkinWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p9p4theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p9p4jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p9p4jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p9p4emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <radialGradient id="p9p4brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="40%" stop-color="#f0d878"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <filter id="p9p4bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p9p4strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="493.8" height="364" fill="url(#p9p4nightBg)"/>
  <ellipse cx="296" cy="60" rx="280" ry="180" fill="url(#p9p4candleHalo)" opacity="0.85"/>
  <ellipse cx="148" cy="280" rx="80" ry="100" fill="url(#p9p4emeraldGlow)" opacity="0.85" filter="url(#p9p4bloom)"/>

  <!-- Bench surface. -->
  <rect x="0" y="240" width="493.8" height="124" fill="url(#p9p4bench)"/>
  <line x1="0" y1="246" x2="493.8" y2="246" stroke="#7a4828" stroke-width="0.85"/>

  <!-- Brass gear (Jink sits on it in BG behind Jink — partial visible). -->
  <g>
    <circle cx="148" cy="318" r="60" fill="url(#p9p4brass)" opacity="0.92"/>
    <circle cx="148" cy="318" r="60" fill="none" stroke="#5a3018" stroke-width="0.85"/>
    <circle cx="148" cy="318" r="20" fill="#5a3018"/>
    <ellipse cx="170" cy="298" rx="20" ry="10" fill="#fff0a8" opacity="0.55"/>
  </g>

  <!-- THEODORE'S ENORMOUS FACE in BG/upper area, beyond bench cliff. -->
  <g>
    <!-- Hand resting on bench edge with index finger extending toward Jink. -->
    <path d="M280,210 Q300,202 340,200 L380,200 Q400,210 410,224 L386,234 Q360,232 322,232 Q300,232 280,224 Z" fill="url(#p9p4theoSkin)"/>
    <!-- INDEX FINGER extending forward (toward Jink). -->
    <path d="M260,224 Q240,228 220,236 L226,250 Q252,244 282,238 L284,228 Z" fill="url(#p9p4theoSkin)"/>
    <!-- Fingertip near Jink. -->
    <ellipse cx="222" cy="246" rx="10" ry="6" fill="url(#p9p4theoSkin)"/>
    <!-- Fingernail. -->
    <path d="M214,242 Q220,238 226,242 Q224,250 220,250 Z" fill="#e8d0b4"/>
    <!-- BRASS GEAR RING on the finger — large at this angle, near Jink's height. -->
    <ellipse cx="252" cy="240" rx="14" ry="8" fill="url(#p9p4brass)"/>
    <ellipse cx="252" cy="240" rx="14" ry="8" fill="none" stroke="#5a3018" stroke-width="0.7"/>
    <ellipse cx="252" cy="240" rx="6" ry="4" fill="#3a2010"/>
    <!-- Cool light catching ring (from Jink's emerald glow). -->
    <ellipse cx="248" cy="237" rx="3" ry="2" fill="#a8ffd0" opacity="0.45" filter="url(#p9p4bloom)"/>
    <!-- Knuckle hint. -->
    <path d="M310,212 Q330,206 348,212" fill="none" stroke="#7a4828" stroke-width="0.7"/>

    <!-- Theodore's giant FACE in upper area. -->
    <ellipse cx="350" cy="100" rx="100" ry="90" fill="url(#p9p4theoSkin)"/>
    <ellipse cx="350" cy="100" rx="100" ry="90" fill="url(#p9p4theoSkinWarm)" opacity="0.55"/>

    <!-- Tousled spikes (pointing UP, off frame top). -->
    <path d="M250,40 Q244,-20 320,-30 Q400,-40 450,40 L444,46 Q420,-10 400,-22 L300,-22 Q280,-10 256,46 Z" fill="url(#p9p4theoHair)"/>
    <path d="M260,-12 L252,-46 L272,-10 Z" fill="url(#p9p4theoHair)"/>
    <path d="M296,-30 L294,-60 L312,-26 Z" fill="url(#p9p4theoHair)"/>
    <path d="M340,-36 L348,-66 L364,-32 Z" fill="url(#p9p4theoHair)"/>
    <path d="M386,-30 L406,-60 L398,-22 Z" fill="url(#p9p4theoHair)"/>
    <g stroke="#ffd078" stroke-width="1.4" opacity="0.7">
      <line x1="262" y1="-32" x2="262" y2="-10"/>
      <line x1="300" y1="-44" x2="300" y2="-22"/>
      <line x1="350" y1="-50" x2="350" y2="-26"/>
      <line x1="400" y1="-44" x2="400" y2="-22"/>
    </g>
    <!-- Bangs. -->
    <path d="M256,46 L260,80 L274,42 Z" fill="url(#p9p4theoHair)"/>
    <path d="M286,54 L290,90 L304,48 Z" fill="url(#p9p4theoHair)"/>
    <path d="M316,58 L320,94 L334,52 Z" fill="url(#p9p4theoHair)"/>
    <path d="M346,58 L350,94 L364,52 Z" fill="url(#p9p4theoHair)"/>
    <path d="M376,54 L380,90 L394,48 Z" fill="url(#p9p4theoHair)"/>
    <path d="M404,46 L408,80 L420,42 Z" fill="url(#p9p4theoHair)"/>

    <!-- Eyes — careful attention. -->
    <ellipse cx="306" cy="100" rx="14" ry="11" fill="#fff8e8"/>
    <ellipse cx="306" cy="100" rx="14" ry="11" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <circle cx="306" cy="100" r="6" fill="url(#p9p4theoHair)"/>
    <circle cx="306" cy="100" r="3" fill="#0a0604"/>
    <ellipse cx="310" cy="98" rx="2" ry="1.2" fill="#a8ffd0" filter="url(#p9p4bloom)"/>
    <ellipse cx="304" cy="102" rx="1.4" ry="0.7" fill="#ffffff"/>

    <ellipse cx="392" cy="100" rx="14" ry="11" fill="#fff8e8"/>
    <ellipse cx="392" cy="100" rx="14" ry="11" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <circle cx="392" cy="100" r="6" fill="url(#p9p4theoHair)"/>
    <circle cx="392" cy="100" r="3" fill="#0a0604"/>
    <ellipse cx="396" cy="98" rx="2" ry="1.2" fill="#a8ffd0" filter="url(#p9p4bloom)"/>
    <ellipse cx="390" cy="102" rx="1.4" ry="0.7" fill="#ffffff"/>

    <!-- Brows soft (warmth). -->
    <path d="M290,82 Q306,76 322,82" fill="none" stroke="#3a2810" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M376,82 Q392,76 408,82" fill="none" stroke="#3a2810" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M350,116 L334,148 Q350,152 366,148 Z" fill="#a8765a" opacity="0.55"/>

    <!-- Soft smile. -->
    <path d="M310,168 Q350,184 390,168" fill="none" stroke="#5a3018" stroke-width="2" stroke-linecap="round"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.95">
      <circle cx="290" cy="124" r="0.85"/>
      <circle cx="306" cy="130" r="0.7"/>
      <circle cx="392" cy="124" r="0.85"/>
      <circle cx="408" cy="130" r="0.7"/>
    </g>

    <!-- Cheek warm. -->
    <ellipse cx="282" cy="146" rx="14" ry="8" fill="#ffd078" opacity="0.32"/>
    <ellipse cx="416" cy="146" rx="14" ry="8" fill="#ffd078" opacity="0.32"/>
  </g>

  <!-- ******** JINK foreground BACK-to-camera, seated on gear ******** -->
  <g>
    <!-- Sitting on gear. -->
    <ellipse cx="148" cy="240" rx="14" ry="3" fill="#000" opacity="0.45"/>

    <!-- Legs dangling. -->
    <path d="M138,244 L132,300 L142,300 L146,250 Z" fill="url(#p9p4emeraldSuit)"/>
    <path d="M154,250 L158,300 L168,300 L162,244 Z" fill="url(#p9p4emeraldSuit)"/>
    <ellipse cx="137" cy="304" rx="6" ry="2" fill="#0a4018"/>
    <ellipse cx="163" cy="304" rx="6" ry="2" fill="#0a4018"/>

    <!-- Torso (back view — slightly forward leaning). -->
    <path d="M124,180 Q120,228 132,244 L168,244 Q180,228 176,180 Q172,176 150,176 Q126,176 124,180 Z" fill="url(#p9p4emeraldSuit)"/>
    <!-- Center back seam. -->
    <line x1="150" y1="176" x2="150" y2="244" stroke="#0a4018" stroke-width="0.4" opacity="0.85"/>

    <!-- Wing-pack from back. -->
    <g>
      <rect x="130" y="180" width="40" height="22" fill="#1a4828"/>
      <rect x="130" y="180" width="40" height="22" fill="none" stroke="#0a4018" stroke-width="0.4"/>
      <line x1="130" y1="186" x2="170" y2="186" stroke="#2ed078" stroke-width="0.85" filter="url(#p9p4bloom)"/>
      <line x1="130" y1="194" x2="170" y2="194" stroke="#2ed078" stroke-width="0.6" filter="url(#p9p4bloom)"/>
      <rect x="148" y="180" width="4" height="22" fill="#0a4018"/>
    </g>

    <!-- Head (back view, head TILTED slightly listening per script). Slightly tilted to one side. -->
    <ellipse cx="150" cy="158" rx="14" ry="16" fill="url(#p9p4jinkSkin)"/>
    <!-- Curls visible from behind. -->
    <g fill="url(#p9p4jinkHair)">
      <ellipse cx="134" cy="138" rx="6" ry="8"/>
      <ellipse cx="144" cy="132" rx="6" ry="7"/>
      <ellipse cx="156" cy="132" rx="6" ry="7"/>
      <ellipse cx="166" cy="138" rx="6" ry="8"/>
      <ellipse cx="138" cy="148" rx="5" ry="6"/>
      <ellipse cx="150" cy="146" rx="5" ry="6"/>
      <ellipse cx="162" cy="148" rx="5" ry="6"/>
      <ellipse cx="134" cy="156" rx="4" ry="6"/>
      <ellipse cx="166" cy="156" rx="4" ry="6"/>
      <ellipse cx="146" cy="158" rx="4" ry="5"/>
      <ellipse cx="158" cy="158" rx="4" ry="5"/>
    </g>
    <!-- Warm rim from candle (from upper-right). -->
    <g stroke="#fff0a8" stroke-width="1" opacity="0.85">
      <ellipse cx="166" cy="134" rx="5" ry="6" fill="none"/>
      <ellipse cx="162" cy="148" rx="3" ry="4" fill="none"/>
    </g>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q120,45 240,42"/>
    <path d="M240,40 Q380,45 493.8,42"/>
    <path d="M0,330 Q120,335 240,332"/>
  </g>

  <!-- THEODORE balloon — top-right, tail down to Theodore's head. Long line, 4-5 wraps. -->
  <rect x="220" y="14" width="266" height="106" rx="8"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M308,120 L320,120 L350,184 Z"
        fill="#ffffff" stroke="#6a4220" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="308" y1="120" x2="320" y2="120" stroke="#ffffff" stroke-width="3"/>
  <text x="230" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#6a4220" letter-spacing="0.3">THEODORE</text>
  <text x="230" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Your suit... it's like the shard.</text>
  <text x="230" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">The same light.</text>
  <text x="230" y="86"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">You fell from the sky, didn't you?</text>
  <text x="230" y="104"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Three nights ago. The falling star.</text>

</svg>
