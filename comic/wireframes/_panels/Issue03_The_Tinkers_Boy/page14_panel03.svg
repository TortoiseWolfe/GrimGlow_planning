<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 14 — Panel 3: Wide profile, Theodore chin-on-arms, Jink legs dangling</title>
  <desc>Wide 28mm eye level from end of workbench. Victorian boy sits on floor beside bench, chin resting on crossed arms on bench surface — face NOW at workbench level, still enormous but closer, more intimate. At bench edge nearest his face, tiny ~four-inch figure sits with legs dangling, leaning back on hands. Tiny figure's entire seated body smaller than boy's chin. Tallow candle burns between them, casting warm golden light. Sandy-brown hair, hazel eyes watching with open fascination. Wild golden curls, emerald suit, small warm grin. Cluttered workshop recedes into shadow around — circle of candlelight is shared world.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p14p3nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p14p3candleHalo" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p14p3bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p14p3floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1408"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <linearGradient id="p14p3theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p14p3theoSkinWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="p14p3theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p14p3vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p14p3shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcc8a8"/>
      <stop offset="100%" stop-color="#7a6840"/>
    </linearGradient>
    <linearGradient id="p14p3jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p14p3jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p14p3emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p14p3wax" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p14p3flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5028"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="p14p3bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p14p3strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p14p3deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="742" height="364" fill="url(#p14p3nightBg)"/>
  <ellipse cx="371" cy="200" rx="320" ry="220" fill="url(#p14p3candleHalo)" opacity="0.85"/>

  <!-- Workshop dim background. -->
  <g stroke="#3a2010" stroke-width="0.55" opacity="0.45">
    <line x1="40" y1="0" x2="40" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="80"/>
    <line x1="660" y1="0" x2="660" y2="80"/>
    <line x1="700" y1="0" x2="700" y2="180"/>
    <path d="M0,80 Q80,82 120,80"/>
    <path d="M620,80 Q680,82 742,80"/>
  </g>

  <!-- BENCH (full width middle band). -->
  <rect x="0" y="200" width="742" height="36" fill="url(#p14p3bench)"/>
  <line x1="0" y1="200" x2="742" y2="200" stroke="#7a4828" stroke-width="2"/>
  <line x1="0" y1="236" x2="742" y2="236" stroke="#3a2010" stroke-width="1"/>
  <!-- Bench legs. -->
  <rect x="40" y="236" width="14" height="128" fill="#1a0c04"/>
  <rect x="688" y="236" width="14" height="128" fill="#1a0c04"/>
  <!-- Floor. -->
  <rect x="0" y="364" width="742" height="0" fill="url(#p14p3floor)"/>
  <rect x="0" y="320" width="742" height="44" fill="url(#p14p3floor)"/>
  <line x1="0" y1="320" x2="742" y2="320" stroke="#1a0c04" stroke-width="0.85" opacity="0.55"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.45">
    <line x1="100" y1="320" x2="120" y2="364"/>
    <line x1="220" y1="320" x2="260" y2="364"/>
    <line x1="500" y1="320" x2="540" y2="364"/>
    <line x1="640" y1="320" x2="680" y2="364"/>
  </g>

  <!-- Tools dimly visible at bench fringes. -->
  <g opacity="0.55">
    <ellipse cx="80" cy="194" rx="14" ry="6" fill="#a85820"/>
    <ellipse cx="660" cy="194" rx="14" ry="6" fill="#a85820"/>
  </g>

  <!-- ******** CANDLE in center of bench ******** -->
  <g>
    <rect x="368" y="160" width="6" height="40" fill="url(#p14p3wax)"/>
    <line x1="371" y1="138" x2="371" y2="160" stroke="#1a0c04" stroke-width="0.85"/>
    <ellipse cx="371" cy="134" rx="5" ry="10" fill="url(#p14p3flame)" filter="url(#p14p3strongBloom)"/>
    <ellipse cx="371" cy="136" rx="2" ry="6" fill="#fff0a8"/>
    <ellipse cx="371" cy="138" rx="1" ry="3" fill="#ffffff"/>
    <ellipse cx="371" cy="118" rx="14" ry="22" fill="#ffd078" opacity="0.45" filter="url(#p14p3deepBloom)"/>
    <!-- Wax pool. -->
    <ellipse cx="371" cy="202" rx="14" ry="3" fill="#a85820"/>
  </g>

  <!-- ******** JINK on bench edge LEFT of candle, legs dangling, leaning back on hands ******** -->
  <g>
    <ellipse cx="290" cy="232" rx="22" ry="3" fill="#000" opacity="0.55"/>

    <!-- Legs dangling over edge (knees bent, lower legs hanging). -->
    <path d="M278,200 L274,232 Q272,250 282,256 L290,256 L292,232 L292,200 Z" fill="url(#p14p3emeraldSuit)"/>
    <path d="M298,200 L298,232 Q300,252 312,258 L318,256 L312,232 L308,200 Z" fill="url(#p14p3emeraldSuit)"/>
    <ellipse cx="285" cy="260" rx="6" ry="2" fill="#0a4018"/>
    <ellipse cx="316" cy="262" rx="6" ry="2" fill="#0a4018"/>

    <!-- Torso leaning back. -->
    <path d="M268,160 Q260,196 274,210 L320,212 Q336,196 326,160 Q322,154 297,154 Q272,154 268,160 Z" fill="url(#p14p3emeraldSuit)"/>
    <!-- Soot. -->
    <path d="M268,178 Q297,176 326,180 Q328,194 326,202 L268,202 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="297" y1="154" x2="297" y2="200" stroke="#0a4018" stroke-width="0.4"/>
    <circle cx="297" cy="172" r="1.4" fill="#a8ffd0" filter="url(#p14p3bloom)"/>
    <circle cx="297" cy="190" r="1.4" fill="#a8ffd0" filter="url(#p14p3bloom)"/>

    <!-- Arms — both planted on bench BEHIND, leaning back. -->
    <path d="M268,168 Q252,192 250,208 L264,210 Q266,196 270,170 Z" fill="url(#p14p3emeraldSuit)"/>
    <path d="M326,168 Q344,192 346,208 L330,210 Q330,196 326,170 Z" fill="url(#p14p3emeraldSuit)"/>
    <ellipse cx="252" cy="208" rx="5" ry="3" fill="url(#p14p3jinkSkin)"/>
    <ellipse cx="346" cy="208" rx="5" ry="3" fill="url(#p14p3jinkSkin)"/>

    <!-- Wing-pack stowed. -->
    <rect x="278" y="156" width="38" height="14" fill="#1a4828"/>
    <line x1="278" y1="160" x2="316" y2="160" stroke="#2ed078" stroke-width="0.85" filter="url(#p14p3bloom)"/>

    <!-- Head — looking RIGHT toward Theodore. -->
    <ellipse cx="297" cy="138" rx="14" ry="16" fill="url(#p14p3jinkSkin)"/>
    <g fill="url(#p14p3jinkHair)">
      <ellipse cx="282" cy="120" rx="6" ry="8"/>
      <ellipse cx="294" cy="114" rx="6" ry="7"/>
      <ellipse cx="306" cy="114" rx="6" ry="7"/>
      <ellipse cx="316" cy="120" rx="6" ry="8"/>
      <ellipse cx="286" cy="130" rx="5" ry="6"/>
      <ellipse cx="298" cy="124" rx="5" ry="6"/>
      <ellipse cx="310" cy="128" rx="5" ry="6"/>
      <ellipse cx="282" cy="138" rx="4" ry="6"/>
      <ellipse cx="316" cy="138" rx="4" ry="6"/>
    </g>
    <!-- Eyes looking right. -->
    <ellipse cx="296" cy="138" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="298" cy="138" r="1" fill="#2a4830"/>
    <circle cx="298" cy="138" r="0.5" fill="#0a0604"/>
    <ellipse cx="306" cy="138" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="308" cy="138" r="1" fill="#2a4830"/>
    <circle cx="308" cy="138" r="0.5" fill="#0a0604"/>
    <!-- Brows relaxed. -->
    <path d="M291,134 Q295,132 300,134" fill="none" stroke="#3a2810" stroke-width="0.55"/>
    <path d="M302,134 Q306,132 311,134" fill="none" stroke="#3a2810" stroke-width="0.55"/>
    <!-- Nose. -->
    <path d="M297,142 L295,148 Q297,149 299,148 Z" fill="#7a4828" opacity="0.55"/>
    <!-- Small warm grin. -->
    <path d="M290,154 Q297,158 304,154" fill="none" stroke="#5a3018" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- ******** THEODORE on FLOOR right side, chin on crossed arms ******** -->
  <g>
    <!-- Body — kneeling/sitting on floor, mostly behind/below bench level. -->
    <!-- Legs folded behind/under. -->
    <path d="M460,300 Q455,340 470,360 L600,360 Q616,340 612,300 Z" fill="url(#p14p3vest)" opacity="0.85"/>

    <!-- Arms crossed on bench surface. -->
    <path d="M420,200 Q500,196 580,200 L620,206 Q640,212 645,224 Q645,232 620,236 L420,236 Z" fill="url(#p14p3theoSkin)"/>
    <ellipse cx="510" cy="220" rx="80" ry="6" fill="#1a0e06" opacity="0.32"/>
    <!-- Brass gear ring left index. -->
    <ellipse cx="436" cy="216" rx="6" ry="3" fill="#f0d878"/>
    <ellipse cx="436" cy="216" rx="6" ry="3" fill="none" stroke="#5a3018" stroke-width="0.4"/>
    <ellipse cx="436" cy="216" rx="2.5" ry="1.5" fill="#3a2010"/>
    <!-- Sleeve cuffs (rolled). -->
    <path d="M414,200 Q410,196 410,178 Q420,170 462,168 L470,176 L470,196 Q440,200 414,200 Z" fill="url(#p14p3shirt)"/>
    <ellipse cx="438" cy="180" rx="22" ry="2.5" fill="#a89060"/>

    <!-- Vest visible at edge of frame below face. -->
    <path d="M420,236 L416,300 L612,300 L608,236 Z" fill="url(#p14p3vest)"/>
    <line x1="500" y1="236" x2="510" y2="300" stroke="#3a2010" stroke-width="0.55"/>
    <circle cx="510" cy="252" r="2" fill="#3a2010"/>
    <circle cx="510" cy="270" r="2" fill="#3a2010"/>
    <circle cx="510" cy="288" r="2" fill="#3a2010"/>

    <!-- HEAD — chin resting on arms. Face at bench level. -->
    <ellipse cx="510" cy="124" rx="100" ry="100" fill="url(#p14p3theoSkin)"/>
    <ellipse cx="510" cy="124" rx="100" ry="100" fill="url(#p14p3theoSkinWarm)" opacity="0.55"/>

    <!-- Hair. -->
    <g fill="url(#p14p3theoHair)">
      <path d="M422,54 Q416,-6 480,-30 Q510,-40 540,-30 Q604,-6 598,54 L590,62 Q576,4 556,-6 L464,-6 Q444,4 430,62 Z"/>
      <path d="M432,-18 L424,-50 L444,-12 Z"/>
      <path d="M460,-32 L456,-66 L478,-22 Z"/>
      <path d="M494,-44 L498,-80 L516,-38 Z"/>
      <path d="M526,-44 L546,-72 L538,-22 Z"/>
      <path d="M558,-32 L580,-50 L572,12 Z"/>
      <path d="M428,62 L432,98 L444,54 Z"/>
      <path d="M460,72 L464,108 L482,64 Z"/>
      <path d="M494,80 L498,116 L514,72 Z"/>
      <path d="M524,80 L528,116 L546,72 Z"/>
      <path d="M556,72 L560,108 L578,64 Z"/>
    </g>
    <g stroke="#ffd078" stroke-width="1.4" opacity="0.7">
      <line x1="436" y1="-22" x2="436" y2="-2"/>
      <line x1="468" y1="-44" x2="468" y2="-12"/>
      <line x1="506" y1="-58" x2="506" y2="-26"/>
      <line x1="536" y1="-50" x2="536" y2="-22"/>
      <line x1="568" y1="-30" x2="568" y2="2"/>
    </g>

    <!-- Eyes — open fascination. -->
    <ellipse cx="466" cy="118" rx="14" ry="10" fill="#fff8e8"/>
    <ellipse cx="466" cy="118" rx="14" ry="10" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <circle cx="466" cy="118" r="6.5" fill="url(#p14p3theoHair)"/>
    <circle cx="466" cy="118" r="3.5" fill="#0a0604"/>
    <ellipse cx="470" cy="115" rx="2" ry="1.4" fill="#a8ffd0" filter="url(#p14p3bloom)"/>
    <ellipse cx="468" cy="115" rx="1" ry="0.6" fill="#ffffff"/>

    <ellipse cx="554" cy="118" rx="14" ry="10" fill="#fff8e8"/>
    <ellipse cx="554" cy="118" rx="14" ry="10" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <circle cx="554" cy="118" r="6.5" fill="url(#p14p3theoHair)"/>
    <circle cx="554" cy="118" r="3.5" fill="#0a0604"/>
    <ellipse cx="558" cy="115" rx="2" ry="1.4" fill="#a8ffd0" filter="url(#p14p3bloom)"/>
    <ellipse cx="556" cy="115" rx="1" ry="0.6" fill="#ffffff"/>

    <!-- Brows. -->
    <path d="M448,98 Q466,92 484,98" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>
    <path d="M536,98 Q554,92 572,98" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M510,140 L494,176 Q510,182 526,176 Z" fill="#a8765a" opacity="0.55"/>

    <!-- Mouth slightly open, fascination. -->
    <!-- Mouth is hidden by chin-on-arm — show only soft line above arm. -->
    <path d="M484,196 Q510,194 536,196" fill="none" stroke="#5a3018" stroke-width="1.4" opacity="0.85"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.95">
      <circle cx="446" cy="158" r="0.85"/>
      <circle cx="460" cy="166" r="0.7"/>
      <circle cx="476" cy="158" r="0.85"/>
      <circle cx="544" cy="158" r="0.85"/>
      <circle cx="560" cy="166" r="0.7"/>
      <circle cx="574" cy="158" r="0.85"/>
    </g>
    <ellipse cx="430" cy="172" rx="14" ry="9" fill="#ffd078" opacity="0.42"/>
    <ellipse cx="590" cy="172" rx="14" ry="9" fill="#ffd078" opacity="0.42"/>
  </g>

  <!-- DIALOGUE — 4 beats. THEODORE TL; JINK; THEODORE; JINK. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="240" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M58,58 L70,58 L60,76 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="58.5" x2="68" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Five of you. Like you. This small.</text>

  <g filter="url(#balloonShadow)">
    <rect x="488" y="14" width="240" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M530,58 L542,58 L532,76 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="531.5" y1="58.5" x2="540" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="496" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="496" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Normal-sized where we're from.</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="184" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M58,296 L70,296 L60,278 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="295.5" x2="68" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">And where's that?</text>

  <g filter="url(#balloonShadow)">
    <rect x="616" y="296" width="112" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M650,296 L662,296 L652,278 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="651.5" y1="295.5" x2="660" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="624" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="624" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-style="italic">...Far.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
  </g>
</svg>
