<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 16 — Panel 4: Theodore CU "Please."</title>
  <desc>CU 85mm Victorian boy's face — twelve to thirteen, lanky pre-teen, sandy-brown hair, hazel eyes steady with solemn anticipation. Freckles across nose. Expression NOT excitement but reverence — understands he is being offered something precious. Solemn nod. In dilated pupils, pinpoint reflections of cool emerald geometric light. Warm amber candlelight full on face, golden tones on skin and hair.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p16p4nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p16p4candleHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p16p4theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p16p4theoSkinWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="p16p4theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <filter id="p16p4bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p16p4deepBloom"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="366" height="364" fill="url(#p16p4nightBg)"/>
  <ellipse cx="183" cy="160" rx="280" ry="240" fill="url(#p16p4candleHalo)" opacity="0.85"/>

  <!-- ******** HEAD CU ******** -->
  <g>
    <ellipse cx="183" cy="200" rx="140" ry="160" fill="url(#p16p4theoSkin)"/>
    <ellipse cx="183" cy="200" rx="140" ry="160" fill="url(#p16p4theoSkinWarm)" opacity="0.65"/>

    <!-- Hair. -->
    <g fill="url(#p16p4theoHair)">
      <path d="M62,100 Q56,30 150,8 Q210,-4 270,8 Q318,30 312,100 L304,110 Q288,28 250,16 L116,16 Q78,28 70,110 Z"/>
      <path d="M70,4 L60,-44 L92,4 Z"/>
      <path d="M104,-22 L90,-72 L132,-12 Z"/>
      <path d="M148,-38 L156,-90 L186,-28 Z"/>
      <path d="M198,-38 L228,-72 L222,-12 Z"/>
      <path d="M236,-22 L274,-44 L260,4 Z"/>
      <path d="M70,110 L74,150 L96,98 Z"/>
      <path d="M110,128 L116,168 L138,116 Z"/>
      <path d="M154,140 L160,180 L182,128 Z"/>
      <path d="M196,140 L202,180 L224,128 Z"/>
      <path d="M240,128 L246,168 L266,116 Z"/>
    </g>
    <g stroke="#ffd078" stroke-width="2" opacity="0.7">
      <line x1="78" y1="-22" x2="78" y2="-2"/>
      <line x1="116" y1="-50" x2="116" y2="-12"/>
      <line x1="166" y1="-66" x2="166" y2="-22"/>
      <line x1="216" y1="-50" x2="216" y2="-12"/>
      <line x1="252" y1="-22" x2="252" y2="-2"/>
    </g>

    <!-- EYES — steady solemn anticipation, dilated. -->
    <ellipse cx="120" cy="200" rx="26" ry="16" fill="#fff8e8"/>
    <ellipse cx="120" cy="200" rx="26" ry="16" fill="none" stroke="#3a2810" stroke-width="1"/>
    <ellipse cx="120" cy="200" rx="13" ry="13" fill="url(#p16p4theoHair)"/>
    <!-- DILATED pupil. -->
    <ellipse cx="120" cy="200" rx="9" ry="9" fill="#0a0604"/>
    <!-- BRIGHT pinpoint emerald reflection. -->
    <ellipse cx="124" cy="196" rx="3" ry="2.5" fill="#a8ffd0" filter="url(#p16p4bloom)"/>
    <ellipse cx="122" cy="196" rx="1.4" ry="0.9" fill="#ffffff"/>

    <ellipse cx="246" cy="200" rx="26" ry="16" fill="#fff8e8"/>
    <ellipse cx="246" cy="200" rx="26" ry="16" fill="none" stroke="#3a2810" stroke-width="1"/>
    <ellipse cx="246" cy="200" rx="13" ry="13" fill="url(#p16p4theoHair)"/>
    <ellipse cx="246" cy="200" rx="9" ry="9" fill="#0a0604"/>
    <ellipse cx="250" cy="196" rx="3" ry="2.5" fill="#a8ffd0" filter="url(#p16p4bloom)"/>
    <ellipse cx="248" cy="196" rx="1.4" ry="0.9" fill="#ffffff"/>

    <!-- Brows soft, level (solemn). -->
    <path d="M94,170 Q120,162 146,170" fill="none" stroke="#3a2810" stroke-width="3" stroke-linecap="round"/>
    <path d="M220,170 Q246,162 272,170" fill="none" stroke="#3a2810" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M183,224 L163,290 Q183,300 203,290 Z" fill="#a8765a" opacity="0.55"/>
    <ellipse cx="172" cy="284" rx="3.5" ry="2" fill="#3a2010"/>
    <ellipse cx="194" cy="284" rx="3.5" ry="2" fill="#3a2010"/>

    <!-- Mouth — slight close, solemn. -->
    <path d="M152,328 Q183,332 214,328" fill="none" stroke="#5a3018" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cheek warmth. -->
    <ellipse cx="74" cy="240" rx="20" ry="14" fill="#ffd078" opacity="0.45"/>
    <ellipse cx="292" cy="240" rx="20" ry="14" fill="#ffd078" opacity="0.45"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.95">
      <circle cx="100" cy="248" r="1.4"/>
      <circle cx="116" cy="258" r="1.2"/>
      <circle cx="138" cy="248" r="1.4"/>
      <circle cx="228" cy="248" r="1.4"/>
      <circle cx="250" cy="258" r="1.2"/>
      <circle cx="266" cy="248" r="1.4"/>
    </g>
  </g>

  <!-- DIALOGUE. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="118" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M50,58 L62,58 L52,76 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="51.5" y1="58.5" x2="60" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-style="italic">Please.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q120,45 246,42"/>
    <path d="M246,40 Q310,45 366,42"/>
  </g>
</svg>
