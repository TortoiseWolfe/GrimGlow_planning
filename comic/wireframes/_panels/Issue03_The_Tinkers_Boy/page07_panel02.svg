<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 7 — Panel 2: THE REVEAL — Jink standing on Theodore's workbench, candlelit, grinning</title>
  <desc>MED 50mm Theodore's POV looking at workbench. Tiny figure ~4 inches tall standing among scattered clockwork — lean, androgynous, light brown skin, wild bright golden blonde curly hair catching candlelight. Emerald metallic suit streaked with soot across chest. Holographic accents glow emerald at collar wrists spine. Wing-pack seams glowing emerald. Stands casually, weight on one leg, hand on brass gear that reaches their hip. Grins directly at viewer — reckless, open, delighted. Scale contrast TOTAL: brass gear is boulder, mainspring is structure, thimble is bucket, candle is towering column of flame. Warm amber from right + cool emerald counterpoint. The impossible standing on a workbench.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p7p2nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p7p2candleHaloMassive" cx="85%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p2emeraldGlow" cx="40%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1a8038" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p7p2bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="50%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p7p2brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="40%" stop-color="#f0d878"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <linearGradient id="p7p2candleWax" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="50%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#5a4838"/>
    </linearGradient>
    <linearGradient id="p7p2flameTower" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff8030"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="80%" stop-color="#fff0a8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- JINK COLORS — light brown skin, golden curly hair, emerald suit. -->
    <linearGradient id="p7p2jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p7p2jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p7p2emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p7p2sootStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p7p2holoEmerald">
      <stop offset="0%" stop-color="#a8ffd0"/>
      <stop offset="100%" stop-color="#2ed078" stop-opacity="0"/>
    </radialGradient>

    <filter id="p7p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p7p2strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p7p2deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG: very dark night workshop. -->
  <rect width="742" height="364" fill="url(#p7p2nightBg)"/>

  <!-- Candle's massive halo dominating right side of frame (because candle is at right edge of bench). -->
  <ellipse cx="660" cy="200" rx="300" ry="180" fill="url(#p7p2candleHaloMassive)" opacity="0.9"/>

  <!-- BENCH SURFACE — fills lower 2/3 of frame, vast wooden plateau. -->
  <rect x="0" y="200" width="742" height="164" fill="url(#p7p2bench)"/>
  <!-- Bench plank lines (perspective). -->
  <g stroke="#1a0c04" stroke-width="0.6" opacity="0.65">
    <path d="M0,224 Q200,222 400,224 Q600,226 742,224"/>
    <path d="M0,260 Q200,258 400,260 Q600,262 742,260"/>
    <path d="M0,300 Q200,298 400,300 Q600,302 742,300"/>
    <path d="M0,340 Q200,338 400,340 Q600,342 742,340"/>
  </g>
  <!-- Wood grain. -->
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.5">
    <path d="M120,200 Q140,260 122,340"/>
    <path d="M340,200 Q360,260 342,340"/>
    <path d="M520,200 Q540,260 522,340"/>
  </g>

  <!-- BACKGROUND DARKNESS above bench (workshop in shadow). -->
  <rect width="742" height="200" fill="url(#p7p2nightBg)"/>

  <!-- THE CANDLE — towering column at far right of bench. -->
  <g>
    <!-- Wax column (large at this scale — Jink's perspective). -->
    <rect x="640" y="100" width="40" height="100" fill="url(#p7p2candleWax)"/>
    <line x1="660" y1="100" x2="660" y2="200" stroke="#3a2818" stroke-width="0.6"/>
    <!-- Wick. -->
    <line x1="660" y1="80" x2="660" y2="100" stroke="#1a0c04" stroke-width="1.4"/>
    <!-- HUGE FLAME at top (towering, like a furnace). -->
    <path d="M644,80 Q650,40 660,16 Q670,40 676,80 Z" fill="url(#p7p2flameTower)" filter="url(#p7p2strongBloom)"/>
    <path d="M650,80 Q654,50 660,30 Q666,50 670,80 Z" fill="#ffe8a0"/>
    <path d="M656,80 Q658,60 660,46 Q662,60 664,80 Z" fill="#ffffff"/>
    <!-- Flame bright halo. -->
    <ellipse cx="660" cy="48" rx="34" ry="60" fill="#ffd078" opacity="0.45" filter="url(#p7p2deepBloom)"/>
    <!-- Candle holder. -->
    <ellipse cx="660" cy="200" rx="34" ry="6" fill="#a85820"/>
    <ellipse cx="660" cy="198" rx="34" ry="5" fill="#f5d878" opacity="0.85"/>
  </g>

  <!-- BRASS GEAR BOULDERS scattered across bench surface. -->
  <g>
    <!-- Big gear (Jink's hand on this one — left of center). -->
    <circle cx="220" cy="248" r="42" fill="url(#p7p2brass)"/>
    <circle cx="220" cy="248" r="42" fill="none" stroke="#5a3018" stroke-width="1"/>
    <circle cx="220" cy="248" r="14" fill="#5a3018"/>
    <circle cx="220" cy="248" r="14" fill="none" stroke="#1a0c04" stroke-width="0.5"/>
    <!-- Gear teeth. -->
    <g stroke="#5a3018" stroke-width="0.7" fill="none">
      <line x1="220" y1="206" x2="220" y2="200"/>
      <line x1="220" y1="290" x2="220" y2="296"/>
      <line x1="178" y1="248" x2="172" y2="248"/>
      <line x1="262" y1="248" x2="268" y2="248"/>
      <line x1="190" y1="218" x2="186" y2="214"/>
      <line x1="250" y1="218" x2="254" y2="214"/>
      <line x1="190" y1="278" x2="186" y2="282"/>
      <line x1="250" y1="278" x2="254" y2="282"/>
    </g>
    <!-- Highlight on gear (catching candlelight). -->
    <ellipse cx="206" cy="232" rx="12" ry="6" fill="#fff0a8" opacity="0.55"/>
    <ellipse cx="232" cy="262" rx="6" ry="3" fill="#fff0a8" opacity="0.4"/>

    <!-- Smaller gear (image-right of big gear). -->
    <circle cx="320" cy="270" r="22" fill="url(#p7p2brass)"/>
    <circle cx="320" cy="270" r="22" fill="none" stroke="#5a3018" stroke-width="0.7"/>
    <circle cx="320" cy="270" r="6" fill="#5a3018"/>
    <ellipse cx="312" cy="262" rx="6" ry="3" fill="#fff0a8" opacity="0.55"/>
  </g>

  <!-- COILED MAINSPRING — architectural structure tall as Jink, BEHIND Jink at bench center. -->
  <g>
    <ellipse cx="155" cy="170" rx="28" ry="10" fill="#5a3018" opacity="0.55"/>
    <g fill="none" stroke="#a85820" stroke-width="2.4">
      <ellipse cx="155" cy="170" rx="22" ry="36"/>
      <ellipse cx="155" cy="170" rx="18" ry="30"/>
      <ellipse cx="155" cy="170" rx="14" ry="24"/>
      <ellipse cx="155" cy="170" rx="10" ry="18"/>
    </g>
    <!-- Highlight on coils. -->
    <ellipse cx="148" cy="148" rx="3" ry="14" fill="#fff0a8" opacity="0.55"/>
  </g>

  <!-- THIMBLE — bucket-sized dome to the right of Jink. -->
  <g>
    <path d="M380,200 Q380,250 420,260 L460,260 Q500,250 500,200 L496,194 L384,194 Z" fill="#a89878"/>
    <path d="M380,200 Q380,250 420,260 L460,260 Q500,250 500,200" fill="none" stroke="#5a4838" stroke-width="0.7"/>
    <!-- Dimples on thimble (regular pattern). -->
    <g fill="#5a4838" opacity="0.6">
      <circle cx="396" cy="208" r="1.4"/>
      <circle cx="412" cy="204" r="1.4"/>
      <circle cx="428" cy="204" r="1.4"/>
      <circle cx="444" cy="204" r="1.4"/>
      <circle cx="460" cy="204" r="1.4"/>
      <circle cx="478" cy="208" r="1.4"/>
      <circle cx="402" cy="222" r="1.4"/>
      <circle cx="418" cy="218" r="1.4"/>
      <circle cx="434" cy="218" r="1.4"/>
      <circle cx="450" cy="218" r="1.4"/>
      <circle cx="466" cy="218" r="1.4"/>
      <circle cx="482" cy="222" r="1.4"/>
      <circle cx="404" cy="236" r="1.4"/>
      <circle cx="420" cy="232" r="1.4"/>
      <circle cx="436" cy="232" r="1.4"/>
      <circle cx="452" cy="232" r="1.4"/>
      <circle cx="468" cy="232" r="1.4"/>
      <circle cx="478" cy="236" r="1.4"/>
    </g>
    <!-- Highlight catching candlelight. -->
    <ellipse cx="476" cy="208" rx="14" ry="10" fill="#fff0a8" opacity="0.55"/>
  </g>

  <!-- STEEL FILE — long ridged bridge across bench (right side). -->
  <g>
    <rect x="540" y="282" width="120" height="14" fill="#5a606a"/>
    <rect x="540" y="282" width="120" height="14" fill="none" stroke="#3a3848" stroke-width="0.5"/>
    <g stroke="#3a3848" stroke-width="0.5" opacity="0.85">
      <line x1="546" y1="282" x2="546" y2="296"/>
      <line x1="552" y1="282" x2="552" y2="296"/>
      <line x1="558" y1="282" x2="558" y2="296"/>
      <line x1="564" y1="282" x2="564" y2="296"/>
      <line x1="570" y1="282" x2="570" y2="296"/>
      <line x1="576" y1="282" x2="576" y2="296"/>
      <line x1="582" y1="282" x2="582" y2="296"/>
      <line x1="588" y1="282" x2="588" y2="296"/>
      <line x1="594" y1="282" x2="594" y2="296"/>
      <line x1="600" y1="282" x2="600" y2="296"/>
      <line x1="606" y1="282" x2="606" y2="296"/>
      <line x1="612" y1="282" x2="612" y2="296"/>
      <line x1="618" y1="282" x2="618" y2="296"/>
      <line x1="624" y1="282" x2="624" y2="296"/>
      <line x1="630" y1="282" x2="630" y2="296"/>
      <line x1="636" y1="282" x2="636" y2="296"/>
      <line x1="642" y1="282" x2="642" y2="296"/>
      <line x1="648" y1="282" x2="648" y2="296"/>
      <line x1="654" y1="282" x2="654" y2="296"/>
    </g>
    <!-- File handle (wood). -->
    <rect x="660" y="280" width="34" height="18" fill="#3a2010"/>
    <ellipse cx="694" cy="289" rx="3" ry="9" fill="#5a3018"/>
  </g>

  <!-- Brass filings on bench surface. -->
  <g fill="#dcaf60" opacity="0.6">
    <circle cx="290" cy="296" r="0.7"/>
    <circle cx="294" cy="298" r="0.6"/>
    <circle cx="298" cy="296" r="0.65"/>
    <circle cx="302" cy="298" r="0.5"/>
    <circle cx="306" cy="296" r="0.7"/>
    <circle cx="370" cy="306" r="0.6"/>
    <circle cx="376" cy="304" r="0.7"/>
    <circle cx="382" cy="306" r="0.55"/>
    <circle cx="388" cy="304" r="0.65"/>
  </g>

  <!-- Tracks in filings showing Jink walked through. -->
  <g stroke="#5a3018" stroke-width="0.4" opacity="0.7" fill="none">
    <path d="M260,304 Q280,302 300,304"/>
    <path d="M310,310 Q330,308 350,310"/>
  </g>

  <!-- ******** JINK ******** -->
  <!-- Position: center-LEFT of frame, on bench surface. Standing tall/casual.
       His hand rests on the brass gear at right of body (the gear at x=220).
       Body extends from gear leftward and upward. -->
  <g>
    <!-- Cool emerald glow halo around Jink (from holo accents). -->
    <ellipse cx="160" cy="240" rx="60" ry="80" fill="url(#p7p2emeraldGlow)" opacity="0.85" filter="url(#p7p2bloom)"/>

    <!-- Cast shadow on bench. -->
    <ellipse cx="160" cy="284" rx="22" ry="3" fill="#000" opacity="0.55"/>

    <!-- Legs (one bent slightly = weight on one leg, casual stance). -->
    <!-- Right leg (image-left, weight-bearing, mostly straight). -->
    <path d="M148,232 L142,278 L156,278 L156,232 Z" fill="url(#p7p2emeraldSuit)"/>
    <!-- Left leg (image-right, slightly bent, casual). -->
    <path d="M168,232 L168,250 L172,278 L184,278 L182,250 L180,232 Z" fill="url(#p7p2emeraldSuit)"/>
    <!-- Boot tops. -->
    <ellipse cx="148" cy="282" rx="9" ry="3" fill="#0a4018"/>
    <ellipse cx="178" cy="282" rx="9" ry="3" fill="#0a4018"/>
    <!-- Holo accent at boot. -->
    <line x1="142" y1="278" x2="156" y2="278" stroke="#2ed078" stroke-width="0.8" filter="url(#p7p2bloom)"/>
    <line x1="168" y1="278" x2="184" y2="278" stroke="#2ed078" stroke-width="0.8" filter="url(#p7p2bloom)"/>

    <!-- Torso (emerald suit). Lean, athletic. -->
    <path d="M138,168 Q132,212 140,232 L188,232 Q196,212 190,168 Q186,160 164,160 Q142,160 138,168 Z" fill="url(#p7p2emeraldSuit)"/>
    <!-- SOOT STREAK across chest. -->
    <path d="M138,200 Q160,196 180,202 Q186,210 188,220 L138,222 Z" fill="url(#p7p2sootStreak)" opacity="0.85"/>
    <!-- Plate seams. -->
    <line x1="164" y1="160" x2="164" y2="232" stroke="#0a4018" stroke-width="0.5" opacity="0.85"/>
    <line x1="138" y1="190" x2="190" y2="190" stroke="#0a4018" stroke-width="0.4" opacity="0.7"/>
    <line x1="138" y1="216" x2="190" y2="216" stroke="#0a4018" stroke-width="0.4" opacity="0.7"/>
    <!-- HOLO ACCENT NODES at chest center, shoulders. -->
    <circle cx="164" cy="180" r="1.6" fill="#a8ffd0" filter="url(#p7p2bloom)"/>
    <circle cx="144" cy="172" r="1.2" fill="#a8ffd0" filter="url(#p7p2bloom)"/>
    <circle cx="184" cy="172" r="1.2" fill="#a8ffd0" filter="url(#p7p2bloom)"/>

    <!-- Arms. RIGHT arm hangs at side (image-right of body, but toward gear). LEFT arm casual at side. -->
    <!-- Left arm (image-left, hangs). -->
    <path d="M138,168 Q126,200 124,222 L134,224 Q138,202 140,170 Z" fill="url(#p7p2emeraldSuit)"/>
    <!-- Wrist + holo accent. -->
    <line x1="122" y1="220" x2="136" y2="222" stroke="#2ed078" stroke-width="0.7" filter="url(#p7p2bloom)"/>
    <!-- Hand. -->
    <ellipse cx="128" cy="226" rx="4" ry="3" fill="url(#p7p2jinkSkin)"/>

    <!-- RIGHT arm — extends OUT to image-right, hand on brass gear. -->
    <path d="M190,168 Q204,200 212,224 L196,228 Q190,202 188,170 Z" fill="url(#p7p2emeraldSuit)"/>
    <line x1="194" y1="226" x2="214" y2="226" stroke="#2ed078" stroke-width="0.7" filter="url(#p7p2bloom)"/>
    <!-- Forearm extending right toward gear. -->
    <path d="M212,224 Q216,222 222,224 L222,232 Q216,232 210,232 Z" fill="url(#p7p2jinkSkin)"/>
    <!-- Hand resting ON the brass gear (the "hip-height boulder"). -->
    <ellipse cx="222" cy="228" rx="6" ry="4" fill="url(#p7p2jinkSkin)"/>
    <!-- Fingers spread casually. -->
    <line x1="222" y1="226" x2="226" y2="222" stroke="url(#p7p2jinkSkin)" stroke-width="2" stroke-linecap="round"/>
    <line x1="222" y1="232" x2="228" y2="234" stroke="url(#p7p2jinkSkin)" stroke-width="2" stroke-linecap="round"/>

    <!-- WING-PACK between shoulders. Stowed but seams glowing emerald. -->
    <g>
      <rect x="146" y="166" width="36" height="14" fill="#1a4828"/>
      <rect x="146" y="166" width="36" height="14" fill="none" stroke="#0a4018" stroke-width="0.5"/>
      <!-- Wing-pack seam glow. -->
      <line x1="146" y1="170" x2="182" y2="170" stroke="#2ed078" stroke-width="0.7" filter="url(#p7p2bloom)"/>
      <line x1="146" y1="176" x2="182" y2="176" stroke="#2ed078" stroke-width="0.5" filter="url(#p7p2bloom)"/>
      <!-- Center bracket. -->
      <rect x="160" y="166" width="4" height="14" fill="#0a4018"/>
    </g>

    <!-- HEAD — lean, androgynous, GOLDEN BLONDE CURLY HAIR (vivid against dark BG). -->
    <ellipse cx="164" cy="142" rx="13" ry="16" fill="url(#p7p2jinkSkin)"/>
    <!-- WILD CURLY HAIR — bright golden blonde, multiple distinct curls (per quality bar). -->
    <g fill="url(#p7p2jinkHair)">
      <!-- Curl clumps (visible separation). -->
      <ellipse cx="148" cy="124" rx="6" ry="8"/>
      <ellipse cx="158" cy="118" rx="6" ry="7"/>
      <ellipse cx="170" cy="118" rx="6" ry="7"/>
      <ellipse cx="180" cy="124" rx="6" ry="8"/>
      <ellipse cx="152" cy="134" rx="5" ry="6"/>
      <ellipse cx="164" cy="130" rx="5" ry="6"/>
      <ellipse cx="176" cy="134" rx="5" ry="6"/>
      <!-- Side curls. -->
      <ellipse cx="146" cy="138" rx="4" ry="6"/>
      <ellipse cx="182" cy="138" rx="4" ry="6"/>
    </g>
    <!-- Hair highlight catching candlelight (warm rim). -->
    <g stroke="#fff0a8" stroke-width="0.8" opacity="0.85">
      <ellipse cx="180" cy="120" rx="5" ry="6" fill="none"/>
      <ellipse cx="178" cy="132" rx="3" ry="4" fill="none"/>
    </g>

    <!-- Eyes — bright, looking AT viewer (camera). -->
    <ellipse cx="158" cy="142" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="158" cy="142" rx="2" ry="1.4" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="158" cy="142" r="1" fill="#2a4830"/>
    <circle cx="158" cy="142" r="0.5" fill="#0a0604"/>
    <!-- Catchlight. -->
    <circle cx="157.5" cy="141.5" r="0.4" fill="#ffffff"/>

    <ellipse cx="170" cy="142" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="170" cy="142" rx="2" ry="1.4" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="170" cy="142" r="1" fill="#2a4830"/>
    <circle cx="170" cy="142" r="0.5" fill="#0a0604"/>
    <circle cx="169.5" cy="141.5" r="0.4" fill="#ffffff"/>

    <!-- Brows — slightly raised (delight). -->
    <path d="M154,138 Q158,136 162,138" fill="none" stroke="#3a2810" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M166,138 Q170,136 174,138" fill="none" stroke="#3a2810" stroke-width="0.7" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M164,146 L162,152 Q164,153 166,152 Z" fill="#7a4828" opacity="0.55"/>

    <!-- THE GRIN — wide, reckless, open. Teeth visible. -->
    <path d="M154,156 Q164,162 174,156 L172,158 Q164,162 156,158 Z" fill="#1a0c04"/>
    <path d="M156,158 Q164,160 172,158" fill="none" stroke="#7a3018" stroke-width="0.6"/>
    <!-- Teeth visible (a couple). -->
    <line x1="160" y1="156" x2="160" y2="159" stroke="#dcd0b4" stroke-width="0.4"/>
    <line x1="164" y1="156" x2="164" y2="159" stroke="#dcd0b4" stroke-width="0.4"/>
    <line x1="168" y1="156" x2="168" y2="159" stroke="#dcd0b4" stroke-width="0.4"/>

    <!-- Cheek warm catching candlelight. -->
    <ellipse cx="180" cy="148" rx="4" ry="3" fill="#ffd078" opacity="0.32"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
    <path d="M0,310 Q200,315 400,312"/>
    <path d="M400,310 Q600,315 742,312"/>
  </g>

  <!-- JINK balloon — top-left, tail down to his mouth. -->
  <rect x="20" y="14" width="180" height="50" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M152,64 L164,64 L168,140 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="152" y1="64" x2="164" y2="64" stroke="#ffffff" stroke-width="3"/>
  <text x="30" y="36"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
