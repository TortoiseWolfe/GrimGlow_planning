<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 12 — Panel 3: MED Theodore POV down at Jink standing among tools, "Hey"</title>
  <desc>MED 35mm high angle Theodore POV looking down at cluttered workbench. Brass gears, pliers, screwdrivers, scattered springs at human scale. Among enormous tools, tiny figure ~4 inches tall — lean androgynous, light brown skin, golden curly hair, emerald metallic suit soot-streaked. Leans casually against small glowing shard, one hand resting on edge, looking straight up at viewer with crooked grin of complete reckless confidence. Wing-pack stowed, seams glow faint emerald. Holo accents pulse green-white at joints + collar. Pliers form steel archway behind, brass gear taller than head beside. Warm candle from above. Tiny figure's emerald + shard's geometric blue-white = two intrusions of cool structured light into warm workshop.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p12p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p12p3candleAbove" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p12p3emerald" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p12p3bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p12p3brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="40%" stop-color="#f0d878"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </radialGradient>
    <linearGradient id="p12p3steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3e44"/>
      <stop offset="50%" stop-color="#a8b0b8"/>
      <stop offset="100%" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="p12p3jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p12p3jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p12p3emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p12p3soot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p12p3shardCore">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a0d8ff"/>
      <stop offset="100%" stop-color="#1a2858"/>
    </radialGradient>
    <filter id="p12p3bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p12p3strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG bench from above. -->
  <rect width="366" height="364" fill="url(#p12p3bench)"/>
  <!-- Wood grain. -->
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.5">
    <path d="M40,0 Q50,180 42,364"/>
    <path d="M120,0 Q130,180 122,364"/>
    <path d="M200,0 Q210,180 202,364"/>
    <path d="M280,0 Q290,180 282,364"/>
  </g>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
  </g>

  <!-- Candle warm wash from above. -->
  <rect width="366" height="364" fill="url(#p12p3candleAbove)" opacity="0.65"/>

  <!-- PLIERS as steel archway BEHIND Jink. -->
  <g>
    <!-- Pliers handles (two arms forming archway). -->
    <path d="M40,160 L60,180 L60,290 L40,310 Z" fill="url(#p12p3steel)"/>
    <path d="M120,160 L100,180 L100,290 L120,310 Z" fill="url(#p12p3steel)"/>
    <!-- Pivot rivet at top. -->
    <circle cx="80" cy="170" r="6" fill="#3a3e44"/>
    <circle cx="80" cy="170" r="3" fill="#a8b0b8"/>
    <!-- Pliers jaws extending down/over. -->
    <path d="M60,180 L70,170 L80,170 L80,164" fill="none" stroke="#3a3e44" stroke-width="2"/>
    <path d="M100,180 L90,170 L80,170" fill="none" stroke="#3a3e44" stroke-width="2"/>
    <!-- Highlight catching candle. -->
    <line x1="50" y1="220" x2="50" y2="280" stroke="#fff0a8" stroke-width="0.85" opacity="0.55"/>
    <line x1="110" y1="220" x2="110" y2="280" stroke="#fff0a8" stroke-width="0.85" opacity="0.55"/>
  </g>

  <!-- BRASS GEAR right of Jink — taller than their head. -->
  <g>
    <circle cx="280" cy="240" r="60" fill="url(#p12p3brass)"/>
    <circle cx="280" cy="240" r="60" fill="none" stroke="#5a3018" stroke-width="0.85"/>
    <circle cx="280" cy="240" r="20" fill="#5a3018"/>
    <ellipse cx="300" cy="220" rx="14" ry="8" fill="#fff0a8" opacity="0.55"/>
    <!-- Gear teeth around upper rim. -->
    <g stroke="#5a3018" stroke-width="0.85">
      <line x1="280" y1="180" x2="280" y2="172"/>
      <line x1="262" y1="184" x2="258" y2="174"/>
      <line x1="298" y1="184" x2="302" y2="174"/>
      <line x1="240" y1="220" x2="234" y2="216"/>
      <line x1="320" y1="220" x2="326" y2="216"/>
    </g>
  </g>

  <!-- Coiled spring left of Jink (small). -->
  <g fill="none" stroke="#a85820" stroke-width="1" opacity="0.85">
    <ellipse cx="160" cy="280" rx="14" ry="6"/>
    <ellipse cx="160" cy="280" rx="10" ry="4"/>
  </g>

  <!-- Brass filings. -->
  <g fill="#dcaf60" opacity="0.6">
    <circle cx="180" cy="180" r="0.8"/>
    <circle cx="186" cy="184" r="0.7"/>
    <circle cx="200" cy="186" r="0.8"/>
    <circle cx="206" cy="184" r="0.7"/>
  </g>

  <!-- THE SHARD with cool glow — Jink leans against it. -->
  <g>
    <ellipse cx="222" cy="252" rx="34" ry="14" fill="#a0d8ff" opacity="0.55" filter="url(#p12p3strongBloom)"/>
    <path d="M214,254 L222,246 L232,254 L228,262 L218,262 Z" fill="#1a1a28"/>
    <path d="M216,254 L222,248 L230,254 L226,260 L218,260 Z" fill="url(#p12p3shardCore)" opacity="0.95"/>
    <line x1="218" y1="254" x2="226" y2="254" stroke="#ffffff" stroke-width="0.5" opacity="0.95" filter="url(#p12p3bloom)"/>
    <circle cx="222" cy="254" r="1.2" fill="#ffffff" filter="url(#p12p3bloom)"/>
  </g>

  <!-- Cool emerald around Jink. -->
  <ellipse cx="183" cy="240" rx="60" ry="80" fill="url(#p12p3emerald)" opacity="0.85" filter="url(#p12p3bloom)"/>

  <!-- ******** JINK leaning casually against shard ******** -->
  <g>
    <!-- Cast shadow. -->
    <ellipse cx="183" cy="298" rx="22" ry="3" fill="#000" opacity="0.55"/>

    <!-- Legs (one weight-bearing, one relaxed). -->
    <path d="M168,232 L162,290 L176,290 L176,232 Z" fill="url(#p12p3emeraldSuit)"/>
    <path d="M188,232 L188,250 L194,290 L208,290 L204,250 L198,232 Z" fill="url(#p12p3emeraldSuit)"/>
    <ellipse cx="169" cy="294" rx="8" ry="3" fill="#0a4018"/>
    <ellipse cx="201" cy="294" rx="8" ry="3" fill="#0a4018"/>

    <!-- Torso. -->
    <path d="M156,168 Q150,212 162,232 L208,232 Q220,212 214,168 Q210,160 184,160 Q158,160 156,168 Z" fill="url(#p12p3emeraldSuit)"/>
    <!-- Soot. -->
    <path d="M156,196 Q184,194 214,198 Q216,206 216,216 L156,216 Z" fill="url(#p12p3soot)" opacity="0.85"/>
    <line x1="184" y1="160" x2="184" y2="232" stroke="#0a4018" stroke-width="0.4" opacity="0.85"/>
    <circle cx="184" cy="180" r="1.6" fill="#a8ffd0" filter="url(#p12p3bloom)"/>
    <circle cx="166" cy="174" r="1.2" fill="#a8ffd0" filter="url(#p12p3bloom)"/>
    <circle cx="202" cy="174" r="1.2" fill="#a8ffd0" filter="url(#p12p3bloom)"/>

    <!-- Left arm hangs at side. -->
    <path d="M156,168 Q146,200 144,228 L156,228 Q160,200 162,170 Z" fill="url(#p12p3emeraldSuit)"/>
    <ellipse cx="148" cy="234" rx="3" ry="2" fill="url(#p12p3jinkSkin)"/>

    <!-- RIGHT ARM RESTING ON SHARD. -->
    <path d="M214,168 Q224,200 226,228 L214,228 Q210,200 208,170 Z" fill="url(#p12p3emeraldSuit)"/>
    <path d="M226,228 Q232,236 240,240 L240,250 Q230,250 224,242 Z" fill="url(#p12p3jinkSkin)"/>
    <!-- Hand on shard edge. -->
    <ellipse cx="240" cy="248" rx="6" ry="3" fill="url(#p12p3jinkSkin)"/>

    <!-- Wing-pack. -->
    <rect x="170" y="166" width="30" height="14" fill="#1a4828"/>
    <line x1="170" y1="170" x2="200" y2="170" stroke="#2ed078" stroke-width="0.85" filter="url(#p12p3bloom)"/>
    <line x1="170" y1="176" x2="200" y2="176" stroke="#2ed078" stroke-width="0.6" filter="url(#p12p3bloom)"/>
    <rect x="183" y="166" width="4" height="14" fill="#0a4018"/>

    <!-- HEAD — chin tilted UP, looking up at viewer (Theodore from above). -->
    <ellipse cx="184" cy="138" rx="14" ry="16" fill="url(#p12p3jinkSkin)"/>
    <g fill="url(#p12p3jinkHair)">
      <ellipse cx="168" cy="120" rx="6" ry="8"/>
      <ellipse cx="180" cy="114" rx="6" ry="7"/>
      <ellipse cx="190" cy="114" rx="6" ry="7"/>
      <ellipse cx="200" cy="120" rx="6" ry="8"/>
      <ellipse cx="172" cy="128" rx="5" ry="6"/>
      <ellipse cx="184" cy="124" rx="5" ry="6"/>
      <ellipse cx="196" cy="128" rx="5" ry="6"/>
      <ellipse cx="166" cy="134" rx="4" ry="6"/>
      <ellipse cx="200" cy="134" rx="4" ry="6"/>
    </g>
    <g stroke="#fff0a8" stroke-width="1" opacity="0.85">
      <ellipse cx="200" cy="116" rx="5" ry="6" fill="none"/>
      <ellipse cx="198" cy="128" rx="3" ry="4" fill="none"/>
    </g>

    <!-- Eyes looking UP at viewer. -->
    <ellipse cx="178" cy="138" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="178" cy="138" rx="2.4" ry="1.6" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="178" cy="137" r="1.2" fill="#2a4830"/>
    <circle cx="178" cy="136" r="0.6" fill="#0a0604"/>
    <circle cx="177.5" cy="135.5" r="0.4" fill="#ffffff"/>
    <ellipse cx="190" cy="138" rx="2.4" ry="1.6" fill="#fff8e8"/>
    <ellipse cx="190" cy="138" rx="2.4" ry="1.6" fill="none" stroke="#3a2810" stroke-width="0.4"/>
    <circle cx="190" cy="137" r="1.2" fill="#2a4830"/>
    <circle cx="190" cy="136" r="0.6" fill="#0a0604"/>
    <circle cx="189.5" cy="135.5" r="0.4" fill="#ffffff"/>

    <!-- Brows. -->
    <path d="M174,132 Q178,130 182,132" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <path d="M186,132 Q190,130 194,132" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <!-- Nose. -->
    <path d="M184,142 L182,148 Q184,149 186,148 Z" fill="#7a4828" opacity="0.55"/>
    <!-- CROOKED GRIN — tilted, charming, reckless. -->
    <path d="M174,156 Q184,162 196,154" fill="none" stroke="#5a3018" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="178" y1="157" x2="178" y2="160" stroke="#dcd0b4" stroke-width="0.4"/>
    <line x1="184" y1="158" x2="184" y2="161" stroke="#dcd0b4" stroke-width="0.4"/>
    <line x1="190" y1="157" x2="190" y2="160" stroke="#dcd0b4" stroke-width="0.4"/>
  </g>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- JINK small balloon — top, single word. -->
  <rect x="14" y="14" width="100" height="46" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M88,60 L100,60 L180,124 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="88" y1="60" x2="100" y2="60" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="24" y="52"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Hey.</text>

</svg>
