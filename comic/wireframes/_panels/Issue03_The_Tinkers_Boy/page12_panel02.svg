<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 3 — Page 12 — Panel 2: CU low-angle Theodore from bench level, match-flare candle just lit, pure astonishment</title>
  <desc>CU 50mm low angle. Theodore's face filling upper frame from 4 inches below. Sandy hair, wide hazel eyes reflecting geometric light, freckles. Mouth open in astonishment. Warm amber candlelight from below casting dramatic upward shadows — nose shadow climbing forehead, jaw lit golden, undersides of eyelashes visible. Dying match ember glows faint orange in one hand at edge of frame. Other hand grips bench edge — brass gear ring on left index catching light. In widened eyes, pinpoints of cool geometric light reflect — structured prismatic alien. Giant's face seen from below. Wonder arrived before fear.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p12p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p12p2candleUnder" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#ffe8a0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p12p2skin" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffd078"/>
      <stop offset="40%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="p12p2skinShadowUp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e06" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#1a0e06" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0e06" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p12p2hair" cx="50%" cy="80%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </radialGradient>
    <linearGradient id="p12p2bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p12p2brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </linearGradient>
    <radialGradient id="p12p2matchEmber">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff5028" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <filter id="p12p2bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p12p2strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- BG very dark. -->
  <rect width="366" height="364" fill="url(#p12p2bg)"/>
  <!-- Candle uplight halo from below. -->
  <ellipse cx="183" cy="364" rx="280" ry="240" fill="url(#p12p2candleUnder)" opacity="0.85"/>

  <!-- Bench surface at bottom. -->
  <rect x="0" y="320" width="366" height="44" fill="url(#p12p2bench)"/>
  <line x1="0" y1="328" x2="366" y2="328" stroke="#1a0c04" stroke-width="0.85"/>

  <!-- Hand gripping bench edge (lower-LEFT). -->
  <g>
    <path d="M0,300 Q40,294 80,294 L130,300 L130,316 L80,318 L0,316 Z" fill="url(#p12p2skin)"/>
    <ellipse cx="60" cy="308" rx="20" ry="3" fill="#1a0e06" opacity="0.32"/>
    <!-- Brass gear ring. -->
    <ellipse cx="40" cy="306" rx="6" ry="3" fill="url(#p12p2brass)"/>
    <ellipse cx="40" cy="306" rx="6" ry="3" fill="none" stroke="#5a3018" stroke-width="0.4"/>
    <ellipse cx="40" cy="306" rx="2.5" ry="1.5" fill="#3a2010"/>
    <!-- Brass catches candle. -->
    <ellipse cx="38" cy="304" rx="3" ry="1.5" fill="#fff0a8" opacity="0.85"/>
  </g>

  <!-- Match ember in OTHER hand (right side, dying ember). -->
  <g>
    <!-- Match stick. -->
    <line x1="280" y1="300" x2="320" y2="290" stroke="#3a2010" stroke-width="2"/>
    <!-- Burnt tip. -->
    <ellipse cx="320" cy="290" rx="2" ry="1.4" fill="#1a0c04"/>
    <!-- Dying ember. -->
    <ellipse cx="320" cy="290" rx="6" ry="4" fill="url(#p12p2matchEmber)" filter="url(#p12p2bloom)"/>
    <ellipse cx="320" cy="290" rx="3" ry="2" fill="#ff8030" filter="url(#p12p2bloom)"/>
    <!-- Tiny smoke wisp rising from ember. -->
    <path d="M320,290 Q322,278 320,266 Q322,254 320,242" stroke="#5a4838" stroke-width="0.6" fill="none" opacity="0.55"/>
  </g>

  <!-- THEODORE'S FACE — CU low-angle, lit from below. -->
  <g>
    <ellipse cx="183" cy="180" rx="100" ry="120" fill="url(#p12p2skin)"/>
    <!-- Top of head shadow (light is BELOW). -->
    <ellipse cx="183" cy="100" rx="100" ry="80" fill="url(#p12p2skinShadowUp)" opacity="0.85"/>

    <!-- Hair (mostly in shadow, lit edges from candle below). -->
    <path d="M88,98 Q82,28 156,4 Q200,-4 240,4 Q282,28 278,98 L272,108 Q258,40 234,28 L132,28 Q108,40 94,108 Z" fill="url(#p12p2hair)"/>
    <path d="M104,16 L100,-22 L116,12 Z" fill="url(#p12p2hair)"/>
    <path d="M132,-2 L128,-32 L150,4 Z" fill="url(#p12p2hair)"/>
    <path d="M168,-12 L172,-46 L192,-6 Z" fill="url(#p12p2hair)"/>
    <path d="M204,-12 L222,-40 L218,-2 Z" fill="url(#p12p2hair)"/>
    <path d="M240,4 L256,-22 L250,16 Z" fill="url(#p12p2hair)"/>

    <!-- WIDE EYES — reflecting cool geometric light. -->
    <ellipse cx="130" cy="178" rx="20" ry="14" fill="#fff8e8"/>
    <ellipse cx="130" cy="178" rx="20" ry="14" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <circle cx="130" cy="178" r="9" fill="url(#p12p2hair)"/>
    <circle cx="130" cy="178" r="5" fill="#0a0604"/>
    <!-- Pinpoint cool catchlights — STRUCTURED geometric. -->
    <ellipse cx="134" cy="176" rx="3" ry="1.6" fill="#a0d8ff" filter="url(#p12p2bloom)"/>
    <path d="M132,180 L136,178 L138,182 L134,184 Z" fill="#ffffff" opacity="0.85" filter="url(#p12p2bloom)"/>
    <ellipse cx="128" cy="180" rx="1.6" ry="0.8" fill="#ffffff"/>

    <ellipse cx="236" cy="178" rx="20" ry="14" fill="#fff8e8"/>
    <ellipse cx="236" cy="178" rx="20" ry="14" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <circle cx="236" cy="178" r="9" fill="url(#p12p2hair)"/>
    <circle cx="236" cy="178" r="5" fill="#0a0604"/>
    <ellipse cx="240" cy="176" rx="3" ry="1.6" fill="#a0d8ff" filter="url(#p12p2bloom)"/>
    <path d="M238,180 L242,178 L244,182 L240,184 Z" fill="#ffffff" opacity="0.85" filter="url(#p12p2bloom)"/>
    <ellipse cx="234" cy="180" rx="1.6" ry="0.8" fill="#ffffff"/>

    <!-- Brows raised — astonishment. -->
    <path d="M108,156 Q130,148 152,156" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>
    <path d="M214,156 Q236,148 258,156" fill="none" stroke="#3a2810" stroke-width="2" stroke-linecap="round"/>

    <!-- NOSE — strong upward shadow climbing forehead (Rembrandt uplight). -->
    <path d="M183,200 L160,256 Q183,264 206,256 Z" fill="#a8765a" opacity="0.55"/>
    <!-- Nose shadow climbing UP. -->
    <path d="M173,200 L168,160 L180,148 L186,148 L198,160 L193,200 Z" fill="url(#p12p2skinShadowUp)" opacity="0.55"/>
    <ellipse cx="170" cy="260" rx="3.5" ry="1.5" fill="#3a1808" opacity="0.85"/>
    <ellipse cx="196" cy="260" rx="3.5" ry="1.5" fill="#3a1808" opacity="0.85"/>

    <!-- MOUTH OPEN in astonishment. -->
    <ellipse cx="183" cy="284" rx="14" ry="6" fill="#1a0c04"/>
    <ellipse cx="183" cy="284" rx="14" ry="6" fill="none" stroke="#5a3018" stroke-width="0.85"/>
    <ellipse cx="183" cy="284" rx="10" ry="3" fill="#0a0402"/>

    <!-- Freckles. -->
    <g fill="#a8765a" opacity="0.95">
      <circle cx="106" cy="218" r="0.85"/>
      <circle cx="120" cy="226" r="0.7"/>
      <circle cx="134" cy="220" r="0.85"/>
      <circle cx="232" cy="220" r="0.85"/>
      <circle cx="246" cy="226" r="0.7"/>
      <circle cx="260" cy="218" r="0.85"/>
    </g>

    <!-- Cheek + jaw lit golden by candle below. -->
    <ellipse cx="100" cy="244" rx="14" ry="9" fill="#ffd078" opacity="0.55"/>
    <ellipse cx="266" cy="244" rx="14" ry="9" fill="#ffd078" opacity="0.55"/>
    <!-- Underside of jaw + chin warm. -->
    <ellipse cx="183" cy="306" rx="60" ry="14" fill="#ffd078" opacity="0.45"/>

    <!-- Eyelash undersides (visible from below). -->
    <line x1="116" y1="170" x2="120" y2="172" stroke="#3a2810" stroke-width="0.5"/>
    <line x1="124" y1="168" x2="126" y2="172" stroke="#3a2810" stroke-width="0.5"/>
    <line x1="134" y1="168" x2="136" y2="172" stroke="#3a2810" stroke-width="0.5"/>
    <line x1="144" y1="170" x2="146" y2="172" stroke="#3a2810" stroke-width="0.5"/>
    <line x1="226" y1="170" x2="228" y2="172" stroke="#3a2810" stroke-width="0.5"/>
    <line x1="236" y1="168" x2="238" y2="172" stroke="#3a2810" stroke-width="0.5"/>
    <line x1="246" y1="168" x2="248" y2="172" stroke="#3a2810" stroke-width="0.5"/>
    <line x1="256" y1="170" x2="258" y2="172" stroke="#3a2810" stroke-width="0.5"/>
  </g>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- No dialogue per script (silent beat). -->
</svg>
