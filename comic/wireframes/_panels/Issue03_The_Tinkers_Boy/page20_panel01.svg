<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 3 — Page 20 — Panel 1: Farewell at bench, "I've got to go"</title>
  <desc>MW 35mm eye level. Tiny ~four-inch figure on cluttered workbench tucks small geometric shard into compartment in emerald metallic suit. Looks back — golden curls, quiet layered grin (gratitude+calculation+affection+worry). Theodore leans on bench nearby, face close but respectful, hazel eyes watching departure understanding. Workbench strewn with brass gears + tools. Guttering candle casts deep amber light, shadows long, hour late. Tiny figure's emerald accents glow faintly at seams. Workshop intimate, warm, about to be empty.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p20p1nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#080200"/>
    </linearGradient>
    <radialGradient id="p20p1deeperAmber" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#ff9028" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p20p1bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p20p1brass" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="80%" stop-color="#a85820"/>
      <stop offset="100%" stop-color="#3a1c08"/>
    </radialGradient>
    <linearGradient id="p20p1theoSkin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="100%" stop-color="#dcb89a"/>
    </linearGradient>
    <linearGradient id="p20p1theoSkinWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff9028" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="p20p1theoHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#a8825a"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </radialGradient>
    <linearGradient id="p20p1shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcc8a8"/>
      <stop offset="100%" stop-color="#7a6840"/>
    </linearGradient>
    <linearGradient id="p20p1vest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p20p1jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p20p1jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <linearGradient id="p20p1emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p20p1wax" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#dcd0b4"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p20p1flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5028"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="p20p1shardDim" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a8d8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2858" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p1bloom"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="p20p1strongBloom"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="p20p1deepBloom"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- BG (deeper, richer amber, late hour). -->
  <rect width="742" height="364" fill="url(#p20p1nightBg)"/>
  <ellipse cx="371" cy="200" rx="320" ry="240" fill="url(#p20p1deeperAmber)" opacity="0.85"/>

  <!-- Workshop dim — long shadows. -->
  <g stroke="#3a2010" stroke-width="0.55" opacity="0.55">
    <line x1="40" y1="0" x2="40" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="80"/>
    <line x1="660" y1="0" x2="660" y2="80"/>
    <line x1="700" y1="0" x2="700" y2="180"/>
  </g>

  <!-- BENCH. -->
  <rect x="0" y="220" width="742" height="144" fill="url(#p20p1bench)"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#7a4828" stroke-width="2"/>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.45">
    <path d="M120,220 Q126,360 116,364"/>
    <path d="M280,220 Q286,360 276,364"/>
    <path d="M460,220 Q466,360 456,364"/>
    <path d="M620,220 Q626,360 616,364"/>
  </g>

  <!-- Tools strewn (warm-lit). -->
  <ellipse cx="100" cy="212" rx="22" ry="6" fill="url(#p20p1brass)"/>
  <circle cx="100" cy="212" r="6" fill="#3a1c08"/>
  <ellipse cx="180" cy="216" rx="14" ry="4" fill="url(#p20p1brass)" opacity="0.85"/>
  <ellipse cx="540" cy="212" rx="20" ry="5" fill="url(#p20p1brass)"/>
  <ellipse cx="640" cy="214" rx="14" ry="4" fill="url(#p20p1brass)" opacity="0.85"/>
  <!-- Long shadows from tools. -->
  <g fill="#000" opacity="0.55">
    <ellipse cx="138" cy="218" rx="38" ry="3"/>
    <ellipse cx="208" cy="220" rx="22" ry="2.5"/>
    <ellipse cx="578" cy="218" rx="36" ry="3"/>
  </g>

  <!-- CANDLE guttering low. -->
  <g>
    <rect x="368" y="180" width="6" height="40" fill="url(#p20p1wax)"/>
    <line x1="371" y1="166" x2="371" y2="180" stroke="#1a0c04" stroke-width="0.85"/>
    <ellipse cx="371" cy="160" rx="4" ry="6" fill="url(#p20p1flame)" filter="url(#p20p1strongBloom)"/>
    <ellipse cx="371" cy="160" rx="2" ry="4" fill="#ffd078"/>
    <ellipse cx="371" cy="160" rx="1" ry="2" fill="#ffffff"/>
    <ellipse cx="371" cy="148" rx="14" ry="22" fill="#ff9028" opacity="0.45" filter="url(#p20p1deepBloom)"/>
    <!-- Wax pool. -->
    <ellipse cx="371" cy="222" rx="14" ry="3" fill="#a85820"/>
  </g>

  <!-- ******** JINK center-left of candle, tucking shard ******** -->
  <g>
    <ellipse cx="280" cy="216" rx="20" ry="3" fill="#000" opacity="0.55"/>

    <!-- Legs. -->
    <path d="M276,164 L274,212 L280,212 L282,164 Z" fill="url(#p20p1emeraldSuit)"/>
    <path d="M286,164 L286,212 L292,212 L290,164 Z" fill="url(#p20p1emeraldSuit)"/>
    <ellipse cx="278" cy="216" rx="5" ry="2" fill="#0a4018"/>
    <ellipse cx="288" cy="216" rx="5" ry="2" fill="#0a4018"/>

    <!-- Torso (turned slightly back, looking over shoulder). -->
    <path d="M268,124 Q260,156 270,164 L298,164 Q308,156 300,124 Q298,118 285,118 Q270,118 268,124 Z" fill="url(#p20p1emeraldSuit)"/>
    <line x1="285" y1="118" x2="285" y2="164" stroke="#0a4018" stroke-width="0.4"/>
    <!-- Holo seams glowing faintly. -->
    <circle cx="285" cy="138" r="1.4" fill="#a8ffd0" filter="url(#p20p1bloom)"/>
    <circle cx="285" cy="156" r="1.4" fill="#a8ffd0" filter="url(#p20p1bloom)"/>
    <!-- Soot. -->
    <path d="M268,138 Q285,136 300,140 Q300,150 300,158 L268,158 Z" fill="#1a0c04" opacity="0.85"/>

    <!-- Wing-pack stowed. -->
    <rect x="272" y="120" width="26" height="10" fill="#1a4828"/>
    <line x1="272" y1="124" x2="298" y2="124" stroke="#2ed078" stroke-width="0.85" filter="url(#p20p1bloom)"/>

    <!-- LEFT ARM holding shard, tucking it into chest compartment. -->
    <path d="M268,128 Q258,140 254,156 L264,156 Q266,144 270,130 Z" fill="url(#p20p1emeraldSuit)"/>
    <ellipse cx="258" cy="158" rx="3.5" ry="2.5" fill="url(#p20p1jinkSkin)"/>
    <!-- Hand holding shard. -->
    <ellipse cx="262" cy="148" rx="6" ry="3" fill="url(#p20p1shardDim)" filter="url(#p20p1bloom)"/>
    <path d="M260,146 L262,144 L264,146 L263,150 L261,150 Z" fill="#1a1a28"/>
    <path d="M260.5,146 L262,145 L263.5,146 L263,149 L261,149 Z" fill="url(#p20p1shardDim)" opacity="0.85"/>
    <circle cx="262" cy="148" r="0.7" fill="#ffffff" filter="url(#p20p1bloom)"/>
    <!-- Compartment open on chest (panel slot). -->
    <rect x="280" y="142" width="16" height="6" fill="#0a2010" stroke="#2ed078" stroke-width="0.4"/>
    <line x1="280" y1="142" x2="296" y2="142" stroke="#a8ffd0" stroke-width="0.55" filter="url(#p20p1bloom)"/>

    <!-- RIGHT ARM relaxed at side. -->
    <path d="M300,128 Q310,148 314,164 L302,164 Q300,150 298,130 Z" fill="url(#p20p1emeraldSuit)"/>
    <ellipse cx="312" cy="166" rx="3.5" ry="2.5" fill="url(#p20p1jinkSkin)"/>

    <!-- HEAD turning back over shoulder, looking at Theodore. -->
    <g transform="rotate(20 285 102)">
      <ellipse cx="285" cy="102" rx="11" ry="13" fill="url(#p20p1jinkSkin)"/>
      <g fill="url(#p20p1jinkHair)">
        <ellipse cx="274" cy="88" rx="6" ry="8"/>
        <ellipse cx="284" cy="82" rx="6" ry="7"/>
        <ellipse cx="294" cy="84" rx="6" ry="8"/>
        <ellipse cx="276" cy="98" rx="5" ry="6"/>
        <ellipse cx="288" cy="92" rx="5" ry="6"/>
        <ellipse cx="298" cy="96" rx="5" ry="6"/>
        <ellipse cx="272" cy="106" rx="4" ry="6"/>
        <ellipse cx="298" cy="108" rx="4" ry="6"/>
      </g>
      <!-- Eyes (looking right toward Theodore). -->
      <ellipse cx="287" cy="100" rx="2" ry="1.4" fill="#fff8e8"/>
      <circle cx="289" cy="100" r="1.2" fill="#2a4830"/>
      <circle cx="289" cy="100" r="0.6" fill="#0a0604"/>
      <ellipse cx="296" cy="102" rx="1.7" ry="1.2" fill="#fff8e8"/>
      <circle cx="296" cy="102" r="1" fill="#2a4830"/>
      <!-- Brow. -->
      <path d="M285,96 Q289,94 293,96" fill="none" stroke="#3a2810" stroke-width="0.55"/>
      <!-- Nose profile (right). -->
      <path d="M298,106 L302,108 L300,112 L296,110 Z" fill="url(#p20p1jinkSkin)"/>
      <!-- QUIET LAYERED GRIN. -->
      <path d="M289,116 Q294,118 298,116" fill="none" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
      <ellipse cx="294" cy="117" rx="2" ry="0.85" fill="#3a1408"/>
    </g>
  </g>

  <!-- ******** THEODORE leaning on bench right side ******** -->
  <g>
    <!-- Body — leaning forward, elbow on bench. -->
    <path d="M540,220 L530,364 L720,364 L710,220 Z" fill="url(#p20p1vest)"/>
    <path d="M580,210 L582,364 L660,364 L656,210 Z" fill="url(#p20p1shirt)"/>
    <circle cx="618" cy="240" r="2" fill="#1a0c04"/>
    <circle cx="618" cy="260" r="2" fill="#1a0c04"/>
    <circle cx="618" cy="280" r="2" fill="#1a0c04"/>

    <!-- Forearm on bench (close to Jink). -->
    <path d="M460,210 Q440,200 420,196 L412,210 Q420,222 446,222 L520,222 Q528,210 524,200 Z" fill="url(#p20p1theoSkin)"/>
    <ellipse cx="470" cy="210" rx="50" ry="3" fill="#1a0e06" opacity="0.32"/>
    <!-- Sleeve. -->
    <path d="M520,200 Q528,178 530,160 L560,160 L552,210 Z" fill="url(#p20p1shirt)"/>
    <ellipse cx="540" cy="170" rx="14" ry="2" fill="#a89060"/>

    <!-- HEAD close, leaning to bench level. -->
    <ellipse cx="600" cy="100" rx="80" ry="92" fill="url(#p20p1theoSkin)"/>
    <ellipse cx="600" cy="100" rx="80" ry="92" fill="url(#p20p1theoSkinWarm)" opacity="0.65"/>

    <!-- Hair tousled. -->
    <g fill="url(#p20p1theoHair)">
      <path d="M524,52 Q518,-2 596,-16 Q604,-18 614,-16 Q676,-2 670,52 L662,62 Q650,10 624,2 L574,2 Q556,10 540,62 Z"/>
      <path d="M530,2 L522,-32 L546,-8 Z"/>
      <path d="M566,-18 L560,-52 L582,-8 Z"/>
      <path d="M592,-28 L608,-58 L608,-16 Z"/>
      <path d="M622,-18 L648,-52 L640,-4 Z"/>
      <path d="M656,2 L678,-32 L668,12 Z"/>
    </g>

    <!-- Eyes — watching. Looking left toward Jink. -->
    <ellipse cx="566" cy="100" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="566" cy="100" rx="14" ry="9" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <ellipse cx="562" cy="100" rx="6" ry="6" fill="url(#p20p1theoHair)"/>
    <ellipse cx="562" cy="100" rx="3" ry="3" fill="#0a0604"/>
    <ellipse cx="563" cy="98" rx="1.4" ry="0.85" fill="#ffd078" filter="url(#p20p1bloom)"/>

    <ellipse cx="634" cy="100" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="634" cy="100" rx="14" ry="9" fill="none" stroke="#3a2810" stroke-width="0.85"/>
    <ellipse cx="630" cy="100" rx="6" ry="6" fill="url(#p20p1theoHair)"/>
    <ellipse cx="630" cy="100" rx="3" ry="3" fill="#0a0604"/>
    <ellipse cx="631" cy="98" rx="1.4" ry="0.85" fill="#ffd078" filter="url(#p20p1bloom)"/>

    <!-- Brows soft. -->
    <path d="M550,80 Q566,72 582,80" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M618,80 Q634,72 650,80" fill="none" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M600,118 L584,160 Q600,168 616,160 Z" fill="#7a4828" opacity="0.55"/>

    <!-- Mouth — soft, open slightly. -->
    <path d="M576,190 Q600,196 624,190" fill="none" stroke="#5a3018" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheek. -->
    <ellipse cx="538" cy="136" rx="14" ry="9" fill="#ff9028" opacity="0.45"/>
    <ellipse cx="662" cy="136" rx="14" ry="9" fill="#ff9028" opacity="0.45"/>
  </g>

  <!-- DIALOGUE — 4 beats. -->
  <g filter="url(#balloonShadow)">
    <rect x="14" y="14" width="252" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M86,58 L98,58 L88,76 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="87.5" y1="58.5" x2="96" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">I've got to go. My captain'll skin me.</text>

  <g filter="url(#balloonShadow)">
    <rect x="558" y="14" width="170" height="44" rx="10" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4"/>
    <path d="M598,58 L610,58 L600,76 Z" fill="#fff8e8" stroke="#6a4220" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="599.5" y1="58.5" x2="608" y2="58.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="566" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6a4220">THEODORE</text>
  <text x="566" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Will you... come back?</text>

  <g filter="url(#balloonShadow)">
    <rect x="14" y="296" width="148" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M58,296 L70,296 L60,278 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="59.5" y1="295.5" x2="68" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="22" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="22" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222">Probably shouldn't.</text>

  <g filter="url(#balloonShadow)">
    <rect x="608" y="296" width="120" height="44" rx="10" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4"/>
    <path d="M642,296 L654,296 L644,278 Z" fill="#fff8e8" stroke="#2ed078" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="643.5" y1="295.5" x2="652" y2="295.5" stroke="#fff8e8" stroke-width="2"/>
  </g>
  <text x="616" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2ed078">JINK</text>
  <text x="616" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#222" font-weight="600">Probably will.</text>

  <!-- Brushwork. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q200,45 400,42"/>
    <path d="M400,40 Q600,45 742,42"/>
  </g>
</svg>
