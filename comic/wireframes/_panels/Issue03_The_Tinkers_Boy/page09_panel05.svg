<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238.2 364" width="238.2" height="364">
  <title>Issue 3 — Page 9 — Panel 5: CU Jink face, mask slips, "Yeah. We fell."</title>
  <desc>CU 85mm eye level. Jink's face in tight frame — young androgynous face, light brown skin, wild golden curly hair catching warm amber light from behind. Grin has FADED to something more complex — surprise, and beneath the bravado, something vulnerable. They look their age. Young. Far from home. Soot streak on suit at bottom of frame is evidence not costume. Holo accents at collar DIMMER — the guard is down. Warm amber from behind catches edges of curls. The mask slips.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="p9p5nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0402"/>
    </linearGradient>
    <radialGradient id="p9p5candleHalo" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p5emeraldGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a4018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p9p5jinkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcb89a"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <radialGradient id="p9p5jinkHair" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#ffeca8"/>
      <stop offset="50%" stop-color="#f5d878"/>
      <stop offset="100%" stop-color="#a85820"/>
    </radialGradient>
    <radialGradient id="p9p5hairWarm" cx="50%" cy="20%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p9p5emeraldSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p9p5sootStreak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c04" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a0c04" stop-opacity="0"/>
    </linearGradient>
    <filter id="p9p5bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- BG. -->
  <rect width="238.2" height="364" fill="url(#p9p5nightBg)"/>
  <!-- Warm halo from CANDLE BEHIND (top of frame — backlight). -->
  <ellipse cx="119" cy="0" rx="180" ry="160" fill="url(#p9p5candleHalo)" opacity="0.85"/>
  <!-- Cool emerald (DIMMER per script — guard is down). -->
  <ellipse cx="119" cy="200" rx="80" ry="100" fill="url(#p9p5emeraldGlow)" opacity="0.65" filter="url(#p9p5bloom)"/>

  <!-- Soot streak on suit at bottom of frame (visible — "evidence not costume"). -->
  <rect x="40" y="320" width="158" height="44" fill="url(#p9p5emeraldSuit)" opacity="0.85"/>
  <path d="M40,330 Q119,328 198,334 Q200,344 200,354 L40,354 Z" fill="url(#p9p5sootStreak)" opacity="0.85"/>
  <!-- Plate seam. -->
  <line x1="119" y1="320" x2="119" y2="364" stroke="#0a4018" stroke-width="0.5" opacity="0.85"/>
  <!-- Holo accent at collar — DIMMER (guard down). -->
  <circle cx="119" cy="324" r="1.4" fill="#a8ffd0" opacity="0.55" filter="url(#p9p5bloom)"/>

  <!-- ******** JINK'S FACE — tight frame ******** -->
  <g>
    <!-- Hair haloed warm from behind. -->
    <ellipse cx="119" cy="50" rx="120" ry="60" fill="url(#p9p5hairWarm)" opacity="0.65"/>

    <!-- Head — larger at this CU. -->
    <ellipse cx="119" cy="180" rx="78" ry="90" fill="url(#p9p5jinkSkin)"/>

    <!-- Curly hair — multiple distinct curls. -->
    <g fill="url(#p9p5jinkHair)">
      <ellipse cx="56" cy="120" rx="20" ry="26"/>
      <ellipse cx="86" cy="100" rx="22" ry="28"/>
      <ellipse cx="119" cy="92" rx="24" ry="30"/>
      <ellipse cx="152" cy="100" rx="22" ry="28"/>
      <ellipse cx="182" cy="120" rx="20" ry="26"/>
      <!-- Mid curls. -->
      <ellipse cx="68" cy="148" rx="16" ry="22"/>
      <ellipse cx="100" cy="138" rx="18" ry="24"/>
      <ellipse cx="138" cy="138" rx="18" ry="24"/>
      <ellipse cx="170" cy="148" rx="16" ry="22"/>
      <!-- Side curls. -->
      <ellipse cx="50" cy="170" rx="14" ry="20"/>
      <ellipse cx="188" cy="170" rx="14" ry="20"/>
    </g>
    <!-- Warm rim on top curls (backlit). -->
    <g stroke="#ffd078" stroke-width="1.4" opacity="0.85" fill="none">
      <ellipse cx="86" cy="92" rx="22" ry="22"/>
      <ellipse cx="119" cy="84" rx="22" ry="20"/>
      <ellipse cx="152" cy="92" rx="22" ry="22"/>
    </g>

    <!-- EYES — open, vulnerable, NOT bright + cocky. -->
    <ellipse cx="92" cy="180" rx="13" ry="9" fill="#fff8e8"/>
    <ellipse cx="92" cy="180" rx="13" ry="9" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <circle cx="92" cy="180" r="6" fill="#2a4830"/>
    <circle cx="92" cy="180" r="3" fill="#0a0604"/>
    <ellipse cx="94" cy="178" rx="2" ry="1.4" fill="#ffd078" filter="url(#p9p5bloom)"/>
    <circle cx="91" cy="181" r="0.9" fill="#ffffff"/>

    <ellipse cx="146" cy="180" rx="13" ry="9" fill="#fff8e8"/>
    <ellipse cx="146" cy="180" rx="13" ry="9" fill="none" stroke="#3a2810" stroke-width="0.7"/>
    <circle cx="146" cy="180" r="6" fill="#2a4830"/>
    <circle cx="146" cy="180" r="3" fill="#0a0604"/>
    <ellipse cx="148" cy="178" rx="2" ry="1.4" fill="#ffd078" filter="url(#p9p5bloom)"/>
    <circle cx="145" cy="181" r="0.9" fill="#ffffff"/>

    <!-- Brows — softened (NOT raised in performance — open + serious). -->
    <path d="M76,168 Q92,162 108,168" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M130,168 Q146,162 162,168" fill="none" stroke="#3a2810" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Nose. -->
    <path d="M119,196 L106,224 Q119,228 132,224 Z" fill="#7a4828" opacity="0.55"/>

    <!-- MOUTH — slight, tight, no grin (mask slipped). -->
    <path d="M100,250 Q119,254 138,250" fill="none" stroke="#5a3018" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Cheek warm catch. -->
    <ellipse cx="60" cy="216" rx="14" ry="9" fill="#ffd078" opacity="0.32"/>
    <ellipse cx="178" cy="216" rx="14" ry="9" fill="#ffd078" opacity="0.32"/>
  </g>

  <!-- Brushwork accents. -->
  <g stroke="#0a0402" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,40 Q60,45 120,42"/>
    <path d="M0,330 Q60,335 120,332"/>
  </g>

  <!-- JINK balloon — top, quiet bravado-gone. Smaller, more contained. -->
  <rect x="14" y="14" width="200" height="62" rx="8"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        filter="url(#balloonShadow)"/>
  <path d="M108,76 L120,76 L119,250 Z"
        fill="#ffffff" stroke="#2ed078" stroke-width="2"
        stroke-linejoin="round"/>
  <line x1="108" y1="76" x2="120" y2="76" stroke="#ffffff" stroke-width="3"/>
  <text x="24" y="34"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="14" font-weight="800"
        fill="#2ed078" letter-spacing="0.3">JINK</text>
  <text x="24" y="50"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="11" font-style="italic" font-weight="500"
        fill="#5a4030">(quiet, the bravado gone)</text>
  <text x="24" y="68"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="13" font-weight="500"
        fill="#1a1a1a">Yeah. We fell.</text>

</svg>
