<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 12 Panel 1 — Gap closes, Jink banks, "Wings dying — going manual"</title>
  <desc>Wide widescreen high angle Titan shoulder-level. Jink blazes past head full burn — emerald trails spiral. Titan's hand sweeps close — missing by inches. Two-second window ending — wing-pack stutters lattice fragmenting. Below Thresh repositions overturned stool. Sable directs. Disruption returns amber-black strengthening.</desc>
  <defs>
    <linearGradient id="bgX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberReturnX1" cx="0.65" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldFadeX1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#3aa868" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1f4a30" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridSweepX1" cx="0.55" cy="0.4" r="0.45">
      <stop offset="0.3" stop-color="#020100" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.32"/>
      <stop offset="0.78" stop-color="#7848b8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="alienHandX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="emeraldFadeColX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <linearGradient id="hairGoldFadeX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b020"/>
      <stop offset="0.5" stop-color="#a87820"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="silverFigX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e44"/>
      <stop offset="0.5" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="crimsonAdvX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="stoolX1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <filter id="bloomX1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowX1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="iridShimX1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="motionFadeX1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softX1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="742" height="260" fill="url(#bgX1)"/>
  <rect width="742" height="260" fill="url(#amberReturnX1)"/>
