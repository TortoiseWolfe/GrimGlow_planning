    <path d="M 360 88 L 444 100" stroke="#3aa868" stroke-width="2" fill="none"/>
  </g>

  <g>
    <ellipse cx="400" cy="80" rx="11" ry="13" fill="#3a261a" transform="rotate(20 400 80)"/>
    <ellipse cx="400" cy="74" rx="8" ry="9" fill="#7a4830"/>
    <path d="M 388 64 Q 400 54 412 64 Q 416 74 412 82 L 408 88 Q 404 76 400 76 Q 396 76 392 86 Z" fill="url(#hairGoldFadeX1)"/>
    <ellipse cx="384" cy="60" rx="14" ry="10" fill="url(#hairGoldFadeX1)" transform="rotate(-30 384 60)"/>
    <ellipse cx="416" cy="58" rx="14" ry="10" fill="url(#hairGoldFadeX1)" transform="rotate(40 416 58)"/>

    <ellipse cx="396" cy="80" rx="1.4" ry="2" fill="#0a0604"/>
    <ellipse cx="404" cy="80" rx="1.4" ry="2" fill="#0a0604"/>
    <path d="M 392 88 L 408 88" stroke="#0a0604" stroke-width="1"/>
  </g>

  <g>
    <ellipse cx="120" cy="240" rx="3.6" ry="4" fill="#3a261a"/>
    <ellipse cx="120" cy="238" rx="2" ry="2" fill="#5a3622"/>
    <path d="M 114 234 Q 120 230 126 234" stroke="#8a3818" stroke-width="0.8" fill="none"/>
    <rect x="116" y="242" width="8" height="14" fill="url(#crimsonAdvX1)"/>
    <rect x="124" y="234" width="22" height="6" fill="#1a1a1a"/>
  </g>

  <g>
    <path d="M 80 220 L 160 220 L 170 254 L 70 254 Z" fill="url(#stoolX1)"/>
    <path d="M 80 220 L 70 254" stroke="#080404" stroke-width="2"/>
    <path d="M 160 220 L 170 254" stroke="#080404" stroke-width="2"/>
    <line x1="100" y1="226" x2="140" y2="226" stroke="#5a3a20" stroke-width="0.5"/>
  </g>
  <g opacity="0.85" filter="url(#bloomX1)">
    <circle cx="116" cy="246" r="2" fill="#dc4540"/>
  </g>

  <g>
    <ellipse cx="280" cy="240" rx="3.6" ry="4" fill="#3a261a"/>
    <ellipse cx="280" cy="238" rx="2" ry="2" fill="#9098a0"/>
    <path d="M 274 234 Q 280 230 286 234" stroke="#9098a0" stroke-width="1.4" fill="none"/>
    <rect x="276" y="242" width="8" height="14" fill="url(#silverFigX1)"/>

    <path d="M 220 220 Q 230 230 240 240 L 270 240 L 270 252 L 220 254 Q 218 240 218 220 Z" fill="url(#stoolX1)" opacity="0.85"/>
    <path d="M 220 220 L 270 220" stroke="#5a3a20" stroke-width="0.6"/>
    <path d="M 220 220 L 230 240" stroke="#5a3a20" stroke-width="0.4"/>
    <path d="M 270 220 L 260 240" stroke="#5a3a20" stroke-width="0.4"/>
