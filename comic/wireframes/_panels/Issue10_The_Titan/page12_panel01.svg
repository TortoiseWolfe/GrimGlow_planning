  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a8858" font-weight="700">JINK: "Wings dying —</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">going manual—"</text>
  </g>

  <g transform="translate(220,12)">
    <rect x="-8" y="0" width="280" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="128" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#5a6478" font-weight="700">SABLE: "Get to cover!</text>
    <text x="128" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">Next gap in ten seconds!"</text>
  </g>
</svg>
