    <path d="M 460 130 Q 380 138 340 130" stroke="url(#copperWireU1)" stroke-width="2.5" fill="none" opacity="0.92"/>
    <path d="M 30 160 Q 100 168 180 160" stroke="url(#copperWireU1)" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M 460 160 Q 380 168 340 160" stroke="url(#copperWireU1)" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M 30 190 Q 100 196 180 196" stroke="url(#copperWireU1)" stroke-width="2.5" fill="none" opacity="0.92"/>
    <path d="M 460 196 Q 380 198 340 196" stroke="url(#copperWireU1)" stroke-width="2.5" fill="none" opacity="0.92"/>
