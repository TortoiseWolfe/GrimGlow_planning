<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 260" width="494" height="260">
  <title>Issue 10 Page 9 Panel 1 — Titan at the junction box, "It's not fighting us. It's ignoring us."</title>
  <desc>Medium wide eye level. Titan crouched at wall-mounted Victorian cable junction — large brass switching panel with dozens of wire terminals, copper cables converging. Titan's elongated multi-jointed hands manipulating Victorian hardware with precise inhuman dexterity. Inserts amber-black device. Treats squad as minor nuisance. Indifference is the threat.</desc>
  <defs>
    <linearGradient id="bgU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberDeviceU1" cx="0.5" cy="0.55" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridShimmerU1" cx="0.6" cy="0.45" r="0.45">
      <stop offset="0.3" stop-color="#020100" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3a1a5a" stop-opacity="0.32"/>
      <stop offset="0.78" stop-color="#7848b8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="junctionBrassU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.4" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="junctionFrameU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperWireU1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2e10"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#7a3e18"/>
    </linearGradient>
    <linearGradient id="titanBodyU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040408"/>
      <stop offset="0.5" stop-color="#020306"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="floorU1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <radialGradient id="deviceU1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4d090"/>
      <stop offset="0.3" stop-color="#a87838"/>
      <stop offset="0.7" stop-color="#3a1810"/>
      <stop offset="1" stop-color="#020100"/>
    </radialGradient>
    <filter id="bloomU1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowU1" x="-25%" y="-25%" width="150%" height="150%">
