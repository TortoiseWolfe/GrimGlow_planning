<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 10 Page 22 Panel 3 — Machen pins to the cork board, "Fairies and demons. Same streets. Same weeks."</title>
  <desc>Medium close-up over shoulder of James Machen pinning newspaper articles to cork pinboard on study wall. Board is evidence map: handwritten notes academic script, hand-drawn map Clerkenwell and Holborn with marked locations, earlier clippings about luminous figures and mysterious lights marked with blue pins, new articles about telegraph demon marked with red pins. Two threads of investigation visible — fairy sightings blue, demon shadow reports red — converging on same geography. Machen in profile focused, scholar assembling puzzle. Folk-Lore Society pamphlet pinned to one corner. Warm amber desk lamp throws shadow across board. Two mythologies mapped, the folklorist who will connect them.</desc>
