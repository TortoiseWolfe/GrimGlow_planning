<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 10 Page 8 Panel 5 — Thresh fires, the bolt absorbs, "no effect"</title>
  <desc>Wide dynamic. Titan moves between desks terrible deliberate grace, form flickers between visible and void. Where visible: angular dark iridescence. Where cloaked: shimmer absence. Carries amber-black device. Thresh foreground fires — crimson geometric bolt streaks across, hits Titan shoulder, dissipates like water on hot stone. No effect.</desc>
