      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberDeviceT5" cx="0.7" cy="0.5" r="0.32">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridShockT5" cx="0.7" cy="0.45" r="0.45">
      <stop offset="0.3" stop-color="#020100" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.32"/>
      <stop offset="0.75" stop-color="#7848b8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
