    </filter>
    <filter id="boltGlowT5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="dissipateT5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softT5" x="-10%" y="-10%" width="120%" height="120%">
