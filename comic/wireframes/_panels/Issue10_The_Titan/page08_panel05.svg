    </filter>
    <filter id="iridStrongT5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="cloakSlipT5" x="-30%" y="-30%" width="160%" height="160%">
