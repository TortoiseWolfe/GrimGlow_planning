  </g>
  <g opacity="0.95" filter="url(#megaGlowT5)">
    <ellipse cx="700" cy="225" rx="14" ry="9" fill="#a87838"/>
  </g>
  <g>
    <ellipse cx="700" cy="225" rx="9" ry="6" fill="url(#deviceT5)"/>
    <ellipse cx="700" cy="225" rx="5" ry="3" fill="#a87838" opacity="0.95"/>
    <circle cx="700" cy="225" r="1.4" fill="#f4d090"/>
  </g>

