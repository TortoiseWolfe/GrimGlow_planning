      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="rifleT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="boltCrimsonT5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc4540"/>
      <stop offset="0.5" stop-color="#f4886a"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="bloomT5" x="-25%" y="-25%" width="150%" height="150%">
