    </linearGradient>
    <linearGradient id="deskT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="titanBodyT5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040408"/>
      <stop offset="0.5" stop-color="#020306"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="deviceT5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#5a2818"/>
      <stop offset="1" stop-color="#1a0608"/>
