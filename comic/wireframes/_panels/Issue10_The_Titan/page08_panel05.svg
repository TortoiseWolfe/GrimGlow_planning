    <path d="M 488 134 L 504 148" stroke="#f4886a" stroke-width="0.5" opacity="0.4"/>
    <path d="M 480 142 L 496 154" stroke="#f4886a" stroke-width="0.5" opacity="0.4"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="120" cy="284" rx="22" ry="2.5" fill="#040202"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="280" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="128" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#8a2520" font-weight="700">THRESH: "Direct hit — no effect."</text>
    <text x="128" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">"The charge just... absorbed."</text>
  </g>

  <g transform="translate(320,12)">
    <rect x="-8" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#5a6478" font-weight="700">SABLE: "Conserve ammunition.</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic">That's not going to work."</text>
