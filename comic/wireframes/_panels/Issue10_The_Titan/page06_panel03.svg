<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 6 Panel 3 — Jink freezes, "It sees us"</title>
  <desc>Close-up tight Jink. Wing-pack half-extended frozen. Golden curls backlit halo. Primal fear — grin/bravado/irreverence entirely gone, ancient recognition of prey seeing predator. Wide eyes, slightly open mouth, blood draining from skin. Darkness encroaching from right.</desc>
  <defs>
    <linearGradient id="bgR3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="amberHaloR3" cx="0.05" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="darkEncroachR3" cx="0.95" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#020100" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#040206" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitJ_R3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c87838"/>
      <stop offset="0.4" stop-color="#7a4830"/>
      <stop offset="0.8" stop-color="#3a261a"/>
      <stop offset="1" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="hairGoldHaloR3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe888"/>
      <stop offset="0.5" stop-color="#d8b020"/>
      <stop offset="1" stop-color="#7a5810"/>
    </linearGradient>
    <linearGradient id="emeraldDimR3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <linearGradient id="wingLatticeR3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa868" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1f4a30" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="eyePrimalR3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a89878" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a89878" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomR3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowR3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="megaHaloR3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softR3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgR3)"/>
  <rect width="366" height="260" fill="url(#amberHaloR3)"/>
  <rect width="366" height="260" fill="url(#darkEncroachR3)"/>

  <g opacity="0.55" filter="url(#strongGlowR3)">
    <path d="M 220 60 Q 280 80 290 130 Q 280 180 220 200 L 200 180 Q 240 160 240 130 Q 240 100 200 80 Z" fill="url(#wingLatticeR3)"/>
    <g stroke="#3aa868" stroke-width="0.5" opacity="0.7">
      <line x1="220" y1="200" x2="200" y2="80"/>
      <line x1="220" y1="200" x2="240" y2="100"/>
      <line x1="220" y1="200" x2="280" y2="80"/>
      <line x1="220" y1="200" x2="290" y2="130"/>
      <line x1="220" y1="200" x2="280" y2="180"/>
      <line x1="220" y1="130" x2="280" y2="120"/>
      <line x1="220" y1="160" x2="280" y2="160"/>
    </g>
  </g>

  <g>
    <ellipse cx="123" cy="240" rx="120" ry="40" fill="#15110a"/>
  </g>

  <g>
    <path d="M 78 80 Q 70 100 76 124 Q 84 152 100 168 Q 122 178 146 178 Q 170 174 184 158 Q 192 134 190 100 Q 184 80 168 64 Q 144 58 122 60 Q 94 70 78 80 Z" fill="url(#faceLitJ_R3)" opacity="0.95"/>
  </g>

  <g opacity="0.95" filter="url(#megaHaloR3)">
    <ellipse cx="100" cy="62" rx="60" ry="34" fill="#ffe888"/>
  </g>
  <g opacity="0.92" filter="url(#strongGlowR3)">
    <ellipse cx="158" cy="58" rx="44" ry="28" fill="#f4d040"/>
  </g>
  <g>
    <path d="M 50 80 Q 60 50 90 38 Q 120 30 150 32 Q 180 34 208 50 Q 228 66 224 90 L 200 96 Q 212 70 180 56 Q 148 50 118 56 Q 92 64 76 86 Z" fill="url(#hairGoldHaloR3)"/>
    <ellipse cx="52" cy="74" rx="14" ry="18" fill="url(#hairGoldHaloR3)" transform="rotate(-25 52 74)"/>
    <ellipse cx="230" cy="80" rx="12" ry="16" fill="url(#hairGoldHaloR3)" transform="rotate(20 230 80)"/>
    <ellipse cx="78" cy="46" rx="10" ry="8" fill="url(#hairGoldHaloR3)" transform="rotate(-30 78 46)"/>
    <ellipse cx="200" cy="42" rx="10" ry="8" fill="url(#hairGoldHaloR3)" transform="rotate(30 200 42)"/>
    <ellipse cx="134" cy="34" rx="14" ry="9" fill="url(#hairGoldHaloR3)"/>
    <ellipse cx="40" cy="86" rx="10" ry="14" fill="url(#hairGoldHaloR3)" transform="rotate(-40 40 86)"/>
  </g>

  <g>
    <ellipse cx="116" cy="124" rx="11" ry="5" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="160" cy="122" rx="12" ry="5.5" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="116" cy="124" rx="9" ry="4" fill="#0a0604"/>
    <ellipse cx="160" cy="122" rx="10" ry="4.5" fill="#0a0604"/>
    <circle cx="116" cy="124" r="3.4" fill="#1a3658"/>
    <circle cx="160" cy="122" r="3.6" fill="#1a3658"/>
    <circle cx="118" cy="123" r="1.6" fill="url(#eyePrimalR3)"/>
    <circle cx="162" cy="121" r="1.8" fill="url(#eyePrimalR3)"/>
  </g>

  <g stroke="#5a3818" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 96 110 Q 116 102 134 110"/>
    <path d="M 144 108 Q 160 100 180 110"/>
  </g>

  <path d="M 138 130 Q 134 152 138 168" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <ellipse cx="138" cy="178" rx="10" ry="4" fill="#3a261a"/>
    <ellipse cx="138" cy="178" rx="6" ry="2.5" fill="#1a0e08"/>
  </g>

  <g>
    <path d="M 30 196 L 218 192 L 222 240 L 22 240 Z" fill="url(#emeraldDimR3)"/>
    <path d="M 60 192 L 110 196 L 140 196 L 196 192 L 196 220 L 60 220 Z" fill="#1f4a30"/>
    <path d="M 80 198 L 96 200 L 92 222 L 76 220 Z" fill="#142e1f" stroke="#3a2818" stroke-width="0.5"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="124" cy="208" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="180" cy="208" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="184" cy="200" rx="3.5" ry="1.4" fill="#0a0604"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowR3)">
    <circle cx="100" cy="208" r="2.5" fill="#3aa868"/>
    <circle cx="266" cy="208" r="2.5" fill="#3aa868"/>
    <circle cx="184" cy="218" r="2" fill="#3aa868"/>
  </g>

  <g opacity="0.55" filter="url(#bloomR3)">
    <ellipse cx="123" cy="220" rx="40" ry="6" fill="#a85820" opacity="0.4"/>
  </g>

  <g transform="translate(20,228)">
    <rect x="-8" y="0" width="180" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="82" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#3a8858" font-weight="700">JINK: "It sees us."</text>
  </g>
</svg>
