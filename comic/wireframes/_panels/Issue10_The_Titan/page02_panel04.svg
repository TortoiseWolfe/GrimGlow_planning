    <line x1="160" y1="234" x2="160" y2="240" stroke="#080404" stroke-width="0.6" stroke-dasharray="1 1"/>
    <line x1="320" y1="236" x2="320" y2="240" stroke="#080404" stroke-width="0.6" stroke-dasharray="1 1"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="160" cy="240" rx="6" ry="2" fill="#040202"/>
    <ellipse cx="240" cy="240" rx="6" ry="2" fill="#040202"/>
    <ellipse cx="320" cy="240" rx="6" ry="2" fill="#040202"/>
    <ellipse cx="400" cy="244" rx="6" ry="2" fill="#040202"/>
    <ellipse cx="480" cy="244" rx="6" ry="2" fill="#040202"/>
  </g>

  <g opacity="0.5">
    <circle cx="100" cy="80" r="1" fill="#5a4838"/>
    <circle cx="280" cy="76" r="0.7" fill="#5a4838"/>
    <circle cx="500" cy="80" r="0.8" fill="#5a4838"/>
    <circle cx="640" cy="84" r="0.7" fill="#5a4838"/>
  </g>

  <g transform="translate(40,16)">
    <rect x="-8" y="0" width="320" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="80" y="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#7848b8" font-weight="700">LUMA: "Cables carrying current. Active circuit."</text>
  </g>

  <g transform="translate(380,16)">
    <rect x="-8" y="0" width="280" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="60" y="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700">WREN: "Good. Equipment's where it should be."</text>
  </g>
</svg>
