<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 10 Page 2 Panel 4 — Single-file infiltration through the cable tunnel</title>
  <desc>Wide elevated looking into cable entry tunnel. Five figures single file through frayed insulation, copper wire bundles thicker than bodies, brick dust, darkness. Wren leads with copper-gold scanner glow. Cables hum — vibration lines suggest current. Passage opens into faint warm amber ahead. Near-darkness. Claustrophobic.</desc>
  <defs>
    <linearGradient id="bgN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080404"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <radialGradient id="scannerLeadN4" cx="0.18" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#040202" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberAheadN4" cx="0.95" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#040202" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tunnelTopN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="cableLargeN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperGleamN4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2e10"/>
      <stop offset="0.5" stop-color="#d88838"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <linearGradient id="silverFN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#4a4e54"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="copperFN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="emeraldFN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <linearGradient id="crimsonFN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2520"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="violetFN4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7848b8"/>
      <stop offset="0.5" stop-color="#4a2a78"/>
      <stop offset="1" stop-color="#1a0e2e"/>
    </linearGradient>
    <filter id="bloomN4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowN4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="megaGoldN4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softN4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
