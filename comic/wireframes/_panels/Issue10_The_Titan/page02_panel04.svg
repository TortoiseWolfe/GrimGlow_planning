  </g>
  <g opacity="0.85" filter="url(#strongGlowN4)">
    <ellipse cx="160" cy="200" rx="40" ry="20" fill="#f4b860"/>
  </g>

  <g>
    <ellipse cx="160" cy="216" rx="3.6" ry="4" fill="#3a261a"/>
    <ellipse cx="160" cy="214" rx="2" ry="2" fill="#7a4830"/>
    <ellipse cx="158" cy="208" rx="5" ry="3" fill="#0a0808"/>
    <rect x="156" y="218" width="8" height="14" fill="url(#copperFN4)"/>
    <rect x="158" y="220" width="4" height="10" fill="#5a2e10"/>
    <rect x="166" y="222" width="14" height="6" fill="#1a1a1a"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowN4)">
    <circle cx="178" cy="225" r="3" fill="#f4b860"/>
  </g>
  <g>
    <circle cx="178" cy="225" r="0.9" fill="#f4d090"/>
  </g>

  <g>
    <ellipse cx="240" cy="216" rx="3.6" ry="4" fill="#3a261a"/>
    <ellipse cx="240" cy="214" rx="2" ry="2" fill="#7a4830"/>
    <path d="M 234 212 Q 240 208 246 212" stroke="#9098a0" stroke-width="1.4" fill="none"/>
    <rect x="236" y="218" width="8" height="14" fill="url(#silverFN4)"/>
  </g>

  <g>
    <ellipse cx="320" cy="218" rx="3.6" ry="4" fill="#3a261a"/>
    <ellipse cx="320" cy="216" rx="2" ry="2" fill="#7a4830"/>
    <g>
      <rect x="316" y="212" width="3" height="2" rx="0.5" fill="#7848b8"/>
      <rect x="321" y="212" width="3" height="2" rx="0.5" fill="#7848b8"/>
