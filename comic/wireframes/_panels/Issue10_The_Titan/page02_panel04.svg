    <ellipse cx="400" cy="218" rx="2" ry="2" fill="#5a3622"/>
    <path d="M 394 214 Q 400 210 406 214" stroke="#8a3818" stroke-width="1" fill="none"/>
    <rect x="396" y="222" width="8" height="14" fill="url(#crimsonFN4)"/>
    <rect x="386" y="226" width="22" height="5" fill="#1a1a1a"/>
