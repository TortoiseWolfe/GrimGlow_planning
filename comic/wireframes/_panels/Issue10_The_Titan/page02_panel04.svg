    <line x1="280" y1="100" x2="280" y2="120" stroke="#f4b860" stroke-width="0.4" opacity="0.6"/>
    <line x1="380" y1="110" x2="380" y2="130" stroke="#f4b860" stroke-width="0.4" opacity="0.6"/>
    <line x1="500" y1="115" x2="500" y2="125" stroke="#f4b860" stroke-width="0.4" opacity="0.6"/>
