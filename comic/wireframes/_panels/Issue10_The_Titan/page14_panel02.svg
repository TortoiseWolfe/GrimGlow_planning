    <path d="M 108 132 L 116 136 L 116 146 L 106 150 L 98 144 L 100 136 Z" fill="none" stroke="#7848b8" stroke-width="0.6" opacity="0.45"/>
    <path d="M 152 132 L 162 138 L 160 148 L 150 150 L 142 144 L 144 136 Z" fill="none" stroke="#7848b8" stroke-width="0.6" opacity="0.45"/>
    <path d="M 124 70 L 134 70" stroke="#7848b8" stroke-width="0.4" opacity="0.4"/>
    <path d="M 124 168 L 138 168" stroke="#7848b8" stroke-width="0.4" opacity="0.4"/>
  </g>

  <g>
    <ellipse cx="116" cy="106" rx="14" ry="12" fill="url(#sensorVoidX2)"/>
    <ellipse cx="160" cy="106" rx="14" ry="12" fill="url(#sensorVoidX2)"/>
    <circle cx="116" cy="106" r="6" fill="#1a0a2a"/>
    <circle cx="160" cy="106" r="6" fill="#1a0a2a"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowX2)">
    <circle cx="116" cy="106" r="4" fill="#7848b8" opacity="0.85"/>
    <circle cx="160" cy="106" r="4" fill="#7848b8" opacity="0.85"/>
  </g>
  <g opacity="0.95" filter="url(#bloomX2)">
    <circle cx="118" cy="105" r="1.2" fill="#a878d0"/>
    <circle cx="162" cy="105" r="1.2" fill="#a878d0"/>
  </g>

  <g opacity="0.85">
    <line x1="116" y1="106" x2="80" y2="220" stroke="#7848b8" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.55"/>
    <line x1="160" y1="106" x2="80" y2="220" stroke="#7848b8" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.55"/>
  </g>

  <g>
