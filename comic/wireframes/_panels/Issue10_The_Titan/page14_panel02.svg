    <path d="M 130 132 L 132 144 Q 136 160 138 172" stroke="#0a0808" stroke-width="1.4" fill="none" opacity="0.65"/>
  </g>

  <g>
    <ellipse cx="178" cy="194" rx="22" ry="14" fill="url(#amberCoreX2)" opacity="0.85"/>
    <ellipse cx="178" cy="194" rx="14" ry="9" fill="#f4b860"/>
    <ellipse cx="178" cy="194" rx="6" ry="4" fill="#fff8d8"/>
    <g opacity="0.7">
      <path d="M 168 180 L 172 184 L 178 178 L 184 184 L 188 180 L 192 188 L 188 196 L 178 200 L 168 196 L 164 188 Z" fill="none" stroke="#5a2818" stroke-width="0.5"/>
    </g>
  </g>
  <g opacity="0.95" filter="url(#strongGlowX2)">
    <ellipse cx="178" cy="194" rx="20" ry="12" fill="#a87838" opacity="0.55"/>
  </g>
  <g opacity="0.6" filter="url(#strongGlowX2)">
    <ellipse cx="200" cy="206" rx="22" ry="6" fill="#a87838" opacity="0.55"/>
    <ellipse cx="218" cy="220" rx="20" ry="5" fill="#a87838" opacity="0.4"/>
    <ellipse cx="234" cy="232" rx="16" ry="4" fill="#5a2818" opacity="0.32"/>
  </g>

  <g opacity="0.55">
    <ellipse cx="170" cy="206" rx="3" ry="2" fill="#5a2818"/>
    <ellipse cx="186" cy="208" rx="2.5" ry="1.6" fill="#5a2818"/>
    <ellipse cx="200" cy="218" rx="3" ry="1.6" fill="#5a2818"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#7848b8" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#7848b8" font-weight="700">LUMA: "It's moving to</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">intercept! It knows!"</text>
  </g>
</svg>
