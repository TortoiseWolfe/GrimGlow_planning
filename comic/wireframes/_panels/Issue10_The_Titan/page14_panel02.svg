<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 10 Page 14 Panel 2 — Titan recognizes the threat, head turns</title>
  <desc>Close-up dramatic angle Titan's head turning — neck rotating with joint too many, dark surface rippling iridescence as form moves with sudden urgency. Smooth dark surface with geometric indentations turns to track something below. For first time Titan moves fast, pulling away from work with purposeful speed. Amber-black device trails sickly light. Predator refocusing.</desc>
  <defs>
    <linearGradient id="bgX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberDeviceX2" cx="0.7" cy="0.7" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridFocusX2" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#7848b8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titanHeadX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="titanIridX2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9858d8"/>
      <stop offset="0.4" stop-color="#7848b8"/>
      <stop offset="0.7" stop-color="#3a1a5a"/>
      <stop offset="1" stop-color="#1a0a2a"/>
    </linearGradient>
    <linearGradient id="amberCoreX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b860"/>
      <stop offset="0.5" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a2818"/>
    </linearGradient>
    <radialGradient id="sensorVoidX2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7848b8" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#1a0a2a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomX2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowX2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="iridShimX2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="motionBlurX2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="246" height="260" fill="url(#bgX2)"/>
  <rect width="246" height="260" fill="url(#iridFocusX2)"/>
  <rect width="246" height="260" fill="url(#amberDeviceX2)"/>

  <g filter="url(#motionBlurX2)" opacity="0.55">
