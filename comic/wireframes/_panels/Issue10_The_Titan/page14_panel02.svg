    <path d="M 60 102 Q 60 78 76 60" stroke="url(#titanIridX2)" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 134 182 Q 96 178 76 156" stroke="#7848b8" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

