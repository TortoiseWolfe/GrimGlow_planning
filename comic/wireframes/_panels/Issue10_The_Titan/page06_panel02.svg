  <g opacity="0.55" filter="url(#bloomR2)">
    <ellipse cx="183" cy="240" rx="100" ry="6" fill="#7a4818" opacity="0.55"/>
  </g>

  <g opacity="0.5">
    <text x="20" y="14" font-family="Courier New, monospace" font-size="3.6" fill="#3a1a5a" opacity="0.7">▓░ JOINT.7 ░▓</text>
  </g>
</svg>
