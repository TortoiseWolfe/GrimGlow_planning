      <stop offset="0" stop-color="#080404"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="deviceUplightR2" cx="0.5" cy="0.92" r="0.5">
      <stop offset="0" stop-color="#7a4818" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#3a1810" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskBrassR2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.4" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="alienHandR2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="iridSurfaceR2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1a5a" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1a0e2e" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="deviceR2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.4" stop-color="#5a2818"/>
      <stop offset="0.8" stop-color="#1a0608"/>
      <stop offset="1" stop-color="#020100"/>
    </radialGradient>
    <filter id="bloomR2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowR2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="iridShimR2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="softR2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

