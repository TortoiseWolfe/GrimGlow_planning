    <path d="M 110 90 L 116 110" stroke="#a878d0" stroke-width="0.4" stroke-dasharray="2 1" opacity="0.55"/>
    <path d="M 174 80 L 178 100" stroke="#a878d0" stroke-width="0.4" stroke-dasharray="2 1" opacity="0.55"/>
    <path d="M 234 84 L 238 110" stroke="#a878d0" stroke-width="0.4" stroke-dasharray="2 1" opacity="0.55"/>
