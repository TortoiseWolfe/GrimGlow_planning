<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 6 Panel 2 — The Titan's hand lifts, alien wrongness in anatomy</title>
  <desc>Close-up extreme high angle looking down at hand on Victorian telegraph desk. Hand wrong: too many joints, elongated fingers, each segment articulating independently. Surface dark absorbs light. Edges shimmer dark iridescence — oil on water. Hand lifts. Fingers splay. Has detected the squad.</desc>
  <defs>
