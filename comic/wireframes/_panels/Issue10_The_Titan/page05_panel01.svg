    <path d="M 60 192 L 110 196 L 140 196 L 196 192 L 196 220 L 60 220 Z" fill="#5a2e10" opacity="0.85"/>
    <rect x="186" y="200" width="14" height="10" rx="1" fill="#1a1c20" stroke="#3a3a3a" stroke-width="0.4"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowQ1)">
    <ellipse cx="193" cy="205" rx="11" ry="3" fill="#f4b860"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowQ1)">
    <ellipse cx="120" cy="140" rx="80" ry="50" fill="#f4b860" opacity="0.4"/>
  </g>

  <g opacity="0.85">
    <line x1="60" y1="100" x2="100" y2="100" stroke="#f4d090" stroke-width="0.4" opacity="0.65"/>
    <line x1="60" y1="120" x2="100" y2="120" stroke="#f4d090" stroke-width="0.4" opacity="0.45"/>
    <line x1="60" y1="140" x2="80" y2="140" stroke="#f4d090" stroke-width="0.4" opacity="0.65"/>
    <line x1="56" y1="160" x2="100" y2="160" stroke="#f4d090" stroke-width="0.4" opacity="0.55"/>
    <line x1="180" y1="100" x2="220" y2="100" stroke="#f4d090" stroke-width="0.4" opacity="0.45"/>
    <line x1="180" y1="120" x2="200" y2="120" stroke="#f4d090" stroke-width="0.4" opacity="0.6"/>
    <line x1="190" y1="140" x2="220" y2="140" stroke="#f4d090" stroke-width="0.4" opacity="0.45"/>
  </g>
  <g font-family="Courier New, monospace" fill="#f4d090" opacity="0.6">
    <text x="42" y="92" font-size="3.6">SCAN ▓░</text>
    <text x="56" y="112" font-size="3.4" opacity="0.45">··· null</text>
    <text x="178" y="92" font-size="3.6">SOURCE?</text>
    <text x="180" y="112" font-size="3.4" opacity="0.5">▓░░▓</text>
    <text x="40" y="172" font-size="3.4" opacity="0.55">DEVICE</text>
    <text x="184" y="172" font-size="3.6">[CORRUPT]</text>
  </g>

  <g opacity="0.55" filter="url(#glitchBlurQ1)">
    <rect x="50" y="98" width="46" height="2" fill="#a85820" opacity="0.55"/>
    <rect x="40" y="158" width="60" height="2" fill="#5a3018" opacity="0.55"/>
    <rect x="180" y="138" width="50" height="2" fill="#a85820" opacity="0.55"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="76" cy="206" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="180" cy="206" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="120" cy="200" rx="3.5" ry="1.4" fill="#0a0604"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowQ1)">
    <circle cx="50" cy="208" r="3" fill="#f4b860"/>
    <circle cx="196" cy="208" r="3" fill="#f4b860"/>
    <circle cx="120" cy="218" r="2.5" fill="#f4b860"/>
  </g>

  <g opacity="0.55" filter="url(#bloomQ1)">
    <ellipse cx="123" cy="220" rx="40" ry="6" fill="#a85820" opacity="0.65"/>
  </g>

  <g transform="translate(20,228)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700">WREN: "Device. Embedded.</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">This is the source."</text>
  </g>
</svg>
