<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 10 Page 5 Panel 1 — Wren's scanner glitches, "the source"</title>
  <desc>Close-up Wren face lit by glitching holographic scanner display. Data fragmenting corrupting in real-time, geometric glyphs breaking and reforming. Through noise partial readings visible. Fierce concentration — engineer working through failure. Copper-gold fragmenting on face.</desc>
  <defs>
    <linearGradient id="bgQ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1812"/>
      <stop offset="0.4" stop-color="#2a201a"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="goldGlitchQ1" cx="0.5" cy="0.6" r="0.65">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitW_Q1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairBlkQ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#2a1e1a"/>
    </linearGradient>
    <linearGradient id="copperSuitQ1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <radialGradient id="eyeFocusQ1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomQ1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowQ1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glitchBlurQ1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="softQ1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="246" height="260" fill="url(#bgQ1)"/>
  <rect width="246" height="260" fill="url(#goldGlitchQ1)"/>

  <g>
    <ellipse cx="123" cy="240" rx="120" ry="40" fill="#15110a"/>
  </g>

  <g>
    <path d="M 78 80 Q 70 100 76 124 Q 84 152 100 168 Q 122 178 146 178 Q 170 174 184 158 Q 192 134 190 100 Q 184 80 168 66 Q 144 60 122 62 Q 94 70 78 80 Z" fill="url(#faceLitW_Q1)" opacity="0.95"/>
    <path d="M 76 92 Q 72 118 82 144 Q 92 162 108 174 Q 96 170 88 160 Q 76 144 72 122 Q 74 100 76 92 Z" fill="#080404" opacity="0.5"/>
  </g>

  <g>
    <path d="M 60 76 Q 76 56 116 52 Q 156 50 178 60 Q 194 76 200 92 L 194 106 Q 186 84 162 74 Q 130 68 100 74 Q 80 82 76 96 Z" fill="url(#hairBlkQ1)"/>
    <ellipse cx="100" cy="48" rx="14" ry="14" fill="url(#hairBlkQ1)" transform="rotate(-15 100 48)"/>
    <ellipse cx="160" cy="46" rx="14" ry="12" fill="url(#hairBlkQ1)" transform="rotate(15 160 46)"/>
  </g>

  <g>
