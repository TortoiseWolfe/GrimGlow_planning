    <ellipse cx="160" cy="114" rx="10" ry="4.5" fill="#0a0604"/>
    <circle cx="116" cy="116" r="3" fill="#080404"/>
    <circle cx="160" cy="114" r="3.4" fill="#080404"/>
    <circle cx="118" cy="115" r="1.4" fill="url(#eyeFocusQ1)"/>
    <circle cx="162" cy="113" r="1.6" fill="url(#eyeFocusQ1)"/>
  </g>

  <g stroke="#0a0604" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 98 106 Q 116 100 134 106"/>
    <path d="M 144 104 Q 160 98 180 106"/>
  </g>

  <path d="M 138 122 Q 134 142 138 158" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 110 168 L 162 168" stroke="#0a0604" stroke-width="1.4"/>
  </g>

