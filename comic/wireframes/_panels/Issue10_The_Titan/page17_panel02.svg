      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="boxFrameY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="brassDarkY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.6" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="deviceDeadY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a08"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
