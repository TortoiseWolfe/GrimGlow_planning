<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 17 Panel 2 — Sable touches Titan device, recognizes inverted fairy-tech architecture</title>
  <desc>Close-up Sable's hand reaching out to touch burned-out alien device in Victorian junction box. Device dark — amber-black extinguished — still faintly smoking, material warm. Where surface visible, faint geometric patterns etched — recognizable as related to fairy technology but inverted, dark mirrors of holographic light geometry. Dark brown fingers touch surface, expression at edge of frame — recognition and dread. Soot-darkened silver suit sleeve shows new gouge along forearm. They're not just the enemy. They're the other side of us.</desc>
