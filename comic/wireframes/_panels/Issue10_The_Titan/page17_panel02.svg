      <stop offset="0" stop-color="#1a1a28"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnLeftY2" cx="0.18" cy="0.3" r="0.42">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#3a4868" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberCharY2" cx="0.55" cy="0.55" r="0.32">
      <stop offset="0" stop-color="#5a2818" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#1a0a04" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallY2" x1="0" y1="0" x2="0" y2="1">
