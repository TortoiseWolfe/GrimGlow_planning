    <ellipse cx="180" cy="100" rx="22" ry="10" fill="#5a4838" opacity="0.4"/>
    <ellipse cx="180" cy="84" rx="14" ry="6" fill="#5a4838" opacity="0.3"/>
  </g>
  <g opacity="0.65">
    <path d="M 170 130 Q 168 120 174 110" stroke="#3a1a08" stroke-width="0.6" fill="none"/>
    <path d="M 190 130 Q 192 120 186 110" stroke="#3a1a08" stroke-width="0.6" fill="none" opacity="0.85"/>
