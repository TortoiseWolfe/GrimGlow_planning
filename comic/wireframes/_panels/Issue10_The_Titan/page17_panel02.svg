    <circle cx="180" cy="160" r="6" fill="none" stroke="#3a1a08" stroke-width="0.6"/>
    <circle cx="180" cy="160" r="3" fill="#080404"/>
    <path d="M 174 160 L 186 160 M 180 154 L 180 166 M 175 155 L 185 165 M 175 165 L 185 155" stroke="#3a1a08" stroke-width="0.5"/>

    <path d="M 162 174 L 168 168 L 174 168 L 180 174" fill="none" stroke="#3a1a08" stroke-width="0.7"/>
    <path d="M 198 174 L 192 168 L 186 168 L 180 174" fill="none" stroke="#3a1a08" stroke-width="0.7" opacity="0.85"/>
    <path d="M 198 144 L 192 150 L 186 150 L 180 144" fill="none" stroke="#3a1a08" stroke-width="0.7" opacity="0.85"/>
  </g>

  <g opacity="0.55" stroke="#3a1a08" stroke-width="0.5" fill="none">
    <polygon points="156,160 162,168 168,160 162,152"/>
    <polygon points="204,160 198,168 192,160 198,152"/>
  </g>

