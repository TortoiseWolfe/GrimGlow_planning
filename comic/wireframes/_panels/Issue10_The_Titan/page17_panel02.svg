  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="240" height="42" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#5a6478" stroke-width="1.2"/>
    <text x="112" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#5a6478" font-weight="700">SABLE: "Wren. This device.</text>
    <text x="112" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">The underlying architecture."</text>
    <text x="112" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a85820" font-weight="700">WREN: "Same geometric base.</text>
    <text x="112" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">Different application. Much different."</text>
  </g>

  <g transform="translate(20,232)">
    <rect x="-8" y="0" width="320" height="32" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#5a6478" stroke-width="1.4"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#5a6478" font-weight="700">SABLE: "They're not just the enemy.</text>
    <text x="152" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#2a2a2a" font-style="italic" font-weight="700">They're the other side of us."</text>
