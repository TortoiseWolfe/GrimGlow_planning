      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="gaslightSconceO1" cx="0.85" cy="0.15" r="0.45">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gaslightSconce2O1" cx="0.15" cy="0.18" r="0.4">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
