<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 260" width="494" height="260">
  <title>Issue 10 Page 3 Panel 1 — Cathedral of Victorian technology, the squad emerges</title>
  <desc>Wide interior low angle baseboard level. Telegraph office cathedral at fairy scale. Heavy wooden desks = cliff faces, brass telegraph machines = industrial monuments, gas lamp sconces = towering. Squad emerges behind baseboard, fans out behind table leg. Floor grain visible as parallel grooves.</desc>
