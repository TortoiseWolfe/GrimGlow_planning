      <stop offset="0.5" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="brassMachineO1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d090"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="cableSerpO1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="silverFO1" x1="0" y1="0" x2="0" y2="1">
