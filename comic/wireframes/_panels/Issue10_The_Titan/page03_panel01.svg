      <ellipse cx="344" cy="216" rx="3" ry="2" fill="#d8b020"/>
    </g>
    <ellipse cx="336" cy="216" rx="2" ry="1.4" fill="#a87820"/>
    <ellipse cx="344" cy="216" rx="2" ry="1.4" fill="#a87820"/>
    <rect x="336" y="224" width="8" height="14" fill="url(#emeraldFO1)"/>
