<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 10 Page 15 Panel 5 — The pulse fires, Titan fully revealed, "THERE."</title>
  <desc>Wide dramatic full telegraph office. Copper-gold geometric light races through every wire — along walls, between machines, through cable bundles, up through ceiling. Junction box device flares violently — amber-black sparks erupting. Titan FULLY revealed — cloaking stripped: angular, inhuman, enormous, dark-surfaced, alive with cascading dark iridescence as cloaking systems fail in waves. Posture shifts purposeful work to alarm. Most light in the issue.</desc>
