    <circle cx="105" cy="139" r="0.7" fill="url(#eyeControlledY1)"/>
    <path d="M 94 148 L 106 148" stroke="#0a0604" stroke-width="1"/>
    <path d="M 82 158 L 118 158 L 124 200 L 76 200 Z" fill="url(#crimsonDamY1)"/>
    <path d="M 82 164 L 118 164 L 118 190 L 82 190 Z" fill="#1a0606"/>
    <path d="M 76 170 L 64 200" stroke="url(#crimsonDamY1)" stroke-width="3"/>
    <path d="M 124 170 L 136 200" stroke="url(#crimsonDamY1)" stroke-width="3"/>
  </g>

  <g>
