    </filter>
    <filter id="strongGlowY1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="muzzleFlashY1" x="-30%" y="-30%" width="160%" height="160%">
