<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 13 Panel 1 — Thresh in active combat, "Target the hands"</title>
  <desc>Medium Thresh active combat. Fires rolls behind cover fires again. Damaged crimson armor. Weapon barks crimson bolts at Titan's hands above. Trained military drills adapted impossible scale. Controlled fear — working with terror. Crimson weapons fire bursts. Titan dark form looms.</desc>
  <defs>
    <linearGradient id="bgY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberAboveY1" cx="0.5" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonBurstY1" cx="0.45" cy="0.65" r="0.4">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="stoolWoodY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="alienHandY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="crimsonDamY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="hairBuzzY1" x1="0" y1="0" x2="0" y2="1">
