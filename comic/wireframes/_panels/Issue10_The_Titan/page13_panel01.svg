    <path d="M 208 118 Q 240 96 280 70 Q 300 56 320 60" stroke="#f4886a" stroke-width="5" fill="none" opacity="0.6"/>
  </g>

  <g opacity="0.85">
    <path d="M 60 180 Q 90 156 120 130" stroke="#dc4540" stroke-width="0.5" stroke-dasharray="2 1" opacity="0.55"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowY1)">
