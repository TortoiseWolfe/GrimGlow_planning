    <linearGradient id="rifleY1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="boltCrimsonY1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc4540"/>
      <stop offset="0.5" stop-color="#f4886a"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="eyeControlledY1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#dc4540" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY1" x="-20%" y="-20%" width="140%" height="140%">
