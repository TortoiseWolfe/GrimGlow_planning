    <ellipse cx="208" cy="118" rx="14" ry="8" fill="#f4886a"/>
  </g>
  <g opacity="0.95" filter="url(#bloomY1)">
    <ellipse cx="208" cy="118" rx="6" ry="3.5" fill="#ffffff"/>
  </g>

  <g>
    <path d="M 208 118 Q 240 96 280 70 Q 300 56 320 60" stroke="url(#boltCrimsonY1)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
