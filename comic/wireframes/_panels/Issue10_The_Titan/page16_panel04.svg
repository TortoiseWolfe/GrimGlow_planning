<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 16 Panel 4 — Wren examines burned-out device, "Tougher than it looks"</title>
  <desc>Medium close-up Wren crouching beside telegraph apparatus on desk surface examining her burned-out device — fairy-tech component at its core dark cracked, wire connections fused, single-use weapon that served its purpose. Touches Victorian telegraph key — brass instrument intact despite everything. Exhausted satisfaction quiet respect — human technology survived what alien technologies did not. Wiry East Asian figure messy dark hair bun degraded copper suit smeared with telegraph grease new burn marks. Grey-blue dawn warming amber. Dead device dark. Engineer's respect for resilient machine.</desc>
