      <stop offset="0" stop-color="#1a1a28"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnY4" cx="0.85" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.5"/>
