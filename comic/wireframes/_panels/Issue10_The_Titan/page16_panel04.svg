  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="42" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#a85820" stroke-width="1.2"/>
    <text x="152" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700">WREN: "Device is burned out.</text>
    <text x="152" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">Single-use. The telegraph circuit</text>
    <text x="152" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">survived, though. Victorian wiring.</text>
    <text x="152" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700">Tougher than it looks."</text>
  </g>
</svg>
