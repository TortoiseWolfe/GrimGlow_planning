    <ellipse cx="194" cy="78" rx="2.4" ry="3" fill="#0a0604"/>
    <ellipse cx="206" cy="78" rx="2.4" ry="3" fill="#0a0604"/>
    <circle cx="195" cy="77" r="1.2" fill="#a8c0e0" opacity="0.7"/>
