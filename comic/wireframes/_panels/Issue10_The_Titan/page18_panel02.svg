    <rect x="226" y="140" width="2" height="60" fill="#a89888" opacity="0.55"/>
    <rect x="252" y="140" width="2" height="60" fill="#a89888" opacity="0.55"/>
    <rect x="226" y="156" width="28" height="2" fill="#a89888" opacity="0.55"/>
    <rect x="226" y="172" width="28" height="2" fill="#a89888" opacity="0.55"/>
    <ellipse cx="240" cy="142" rx="5" ry="3" fill="#a89888" opacity="0.55"/>
  </g>
  <g opacity="0.85">
    <line x1="240" y1="100" x2="240" y2="120" stroke="#a89888" stroke-width="0.5"/>
