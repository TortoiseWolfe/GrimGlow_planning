<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 18 Panel 2 — Worker and constable interior, evidence of the impossible</title>
  <desc>Medium interior at human scale — telegraph office devastated seen as humans would see it. Telegraph worker and constable in tall hat survey destruction — machines crushed from above as if stepped on by something enormous, cables torn from walls in deliberate patterns, rear wall breached outward. Tiny incomprehensible scorch marks in geometric patterns mark baseboards and desk legs — fairy weapons fire at scale no human would understand. Worker gestures at breach, expression fear. Constable's professional composure barely holds.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="windowGreyY2" cx="0.18" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1a1828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="breachLightY2" cx="0.85" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1a1828" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="wallY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="windowFrameY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a08"/>
      <stop offset="0.5" stop-color="#1a0a04"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="coatNavyY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.5" stop-color="#1a2438"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="coatBrownY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="brickShardY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2818"/>
      <stop offset="1" stop-color="#1a0a08"/>
    </linearGradient>
    <linearGradient id="machineY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="dustBlurY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

