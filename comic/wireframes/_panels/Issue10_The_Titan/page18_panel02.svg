    <path d="M 218 64 L 262 64 L 262 92 L 256 100 L 224 100 L 218 92 Z" fill="#0a0a14"/>
    <ellipse cx="240" cy="98" rx="22" ry="4" fill="#0a0a14"/>
    <line x1="220" y1="92" x2="260" y2="92" stroke="#1a2438" stroke-width="1" opacity="0.85"/>
    <ellipse cx="236" cy="108" rx="1.6" ry="2.2" fill="#0a0604"/>
    <ellipse cx="244" cy="108" rx="1.6" ry="2.2" fill="#0a0604"/>
    <path d="M 230 100 Q 240 96 250 100" stroke="#0a0604" stroke-width="0.7" fill="none" opacity="0.7"/>
