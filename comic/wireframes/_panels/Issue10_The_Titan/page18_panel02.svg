    <path d="M 200 60 L 220 60 L 230 70 L 226 90" stroke="#5a3018" stroke-width="1" fill="none" stroke-dasharray="2 1.4" opacity="0.85"/>
  </g>

  <g opacity="0.7">
    <polygon points="38,194 44,190 48,196 42,200" fill="#0a0604" opacity="0.75"/>
    <polygon points="48,194 54,190 58,196 52,200" fill="#0a0604" opacity="0.75"/>
    <polygon points="118,194 124,190 128,196 122,200" fill="#0a0604" opacity="0.7"/>
    <polygon points="200,196 206,192 210,198 204,202" fill="#0a0604" opacity="0.7"/>
    <polygon points="100,200 106,196 110,202 104,206" fill="#0a0604" opacity="0.65"/>
  </g>
  <g opacity="0.55" stroke="#dc4540" stroke-width="0.4" fill="none">
    <path d="M 38 194 L 48 194 L 54 200" opacity="0.42"/>
    <path d="M 118 194 L 128 196" opacity="0.4"/>
    <path d="M 200 196 L 210 198" opacity="0.4"/>
  </g>

  <g opacity="0.65" filter="url(#dustBlurY2)">
    <ellipse cx="80" cy="172" rx="40" ry="10" fill="#a89888" opacity="0.55"/>
    <ellipse cx="200" cy="180" rx="60" ry="14" fill="#a89888" opacity="0.42"/>
  </g>
  <g opacity="0.55">
    <ellipse cx="40" cy="216" rx="11" ry="1.6" fill="#a89888"/>
    <ellipse cx="120" cy="220" rx="14" ry="1.8" fill="#a89888"/>
    <ellipse cx="220" cy="224" rx="13" ry="1.8" fill="#a89888"/>
    <ellipse cx="320" cy="226" rx="20" ry="2.2" fill="#a89888"/>
  </g>
  <g opacity="0.7">
    <polygon points="60,234 68,230 74,238 64,242" fill="#3a1a14"/>
    <polygon points="160,238 168,234 174,242 166,246" fill="#3a1a14"/>
    <polygon points="260,236 268,232 274,240 266,244" fill="#3a1a14"/>
