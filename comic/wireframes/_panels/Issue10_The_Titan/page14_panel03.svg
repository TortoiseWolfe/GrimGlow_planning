<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 260" width="494" height="260">
  <title>Issue 10 Page 14 Panel 3 — Wren reaches desk, Titan's shadow falls across</title>
  <desc>Wide high-angle looking down at Victorian telegraph desk surface — main operator's key and sounder visible in brass and ebonite, cable connections, paperwork. Tiny copper-suited figure pulled herself onto desk, scrambling toward apparatus. Vast shadow falls across desk from right — Titan approaching, dark form at frame's edge as wall of void and dark iridescence. Race against the dark.</desc>
