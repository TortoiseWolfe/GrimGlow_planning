    <linearGradient id="bgX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberWest" cx="0.18" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadowEastX3" x1="1" y1="0" x2="0.4" y2="0">
      <stop offset="0" stop-color="#020100" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#040206" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deskTopX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="deskTopShadX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="brassKeyX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="ebonX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0604"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="copperFigX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
