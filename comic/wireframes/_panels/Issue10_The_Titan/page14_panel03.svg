    <linearGradient id="titanWallX3" x1="1" y1="0" x2="0.6" y2="0">
      <stop offset="0" stop-color="#020100"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iridEdgeX3" x1="1" y1="0" x2="0.7" y2="0">
      <stop offset="0" stop-color="#7848b8" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1a0a2a" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomX3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlowX3" x="-25%" y="-25%" width="150%" height="150%">
