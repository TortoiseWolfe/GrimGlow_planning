    <line x1="44" y1="172" x2="80" y2="172" stroke="#1a0a04" stroke-width="0.4"/>
    <line x1="44" y1="178" x2="84" y2="178" stroke="#1a0a04" stroke-width="0.4"/>
    <line x1="44" y1="184" x2="76" y2="184" stroke="#1a0a04" stroke-width="0.4"/>
