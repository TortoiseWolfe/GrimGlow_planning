  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="220" height="32" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#a85820" stroke-width="1.2"/>
    <text x="102" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700">WREN: "I need fifteen</text>
    <text x="102" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">seconds!"</text>
    <text x="102" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#8a2520" font-weight="700">THRESH: "You'll get them!"</text>
  </g>
</svg>
