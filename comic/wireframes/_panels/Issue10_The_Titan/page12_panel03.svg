    <ellipse cx="218" cy="98" rx="10" ry="7" fill="#020100" opacity="0.85"/>
    <ellipse cx="218" cy="98" rx="4" ry="3" fill="#1a0e2e"/>
  </g>

  <g>
    <ellipse cx="183" cy="130" rx="22" ry="14" fill="url(#indentationX3)" opacity="0.85"/>
    <ellipse cx="183" cy="130" rx="14" ry="9" fill="#020100" opacity="0.85"/>
    <ellipse cx="183" cy="130" rx="6" ry="4" fill="#1a0e2e"/>
    <line x1="170" y1="130" x2="196" y2="130" stroke="#080404" stroke-width="0.5"/>
  </g>

  <g>
    <ellipse cx="120" cy="146" rx="8" ry="5" fill="url(#indentationX3)"/>
    <ellipse cx="120" cy="146" rx="4" ry="2.5" fill="#080404"/>

    <ellipse cx="240" cy="148" rx="10" ry="6" fill="url(#indentationX3)"/>
    <ellipse cx="240" cy="148" rx="5" ry="3" fill="#080404"/>

    <ellipse cx="183" cy="158" rx="6" ry="4" fill="url(#indentationX3)"/>
    <ellipse cx="183" cy="158" rx="3" ry="2" fill="#080404"/>
  </g>

  <g opacity="0.55" filter="url(#iridShimX3)">
    <ellipse cx="148" cy="100" rx="22" ry="16" fill="#7848b8" opacity="0.45"/>
    <ellipse cx="218" cy="98" rx="24" ry="17" fill="#7848b8" opacity="0.45"/>
    <ellipse cx="183" cy="130" rx="32" ry="20" fill="#7848b8" opacity="0.32"/>
    <ellipse cx="120" cy="146" rx="14" ry="9" fill="#7848b8" opacity="0.4"/>
