<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 12 Panel 3 — The Titan's face glimpsed, alien purposeful</title>
  <desc>Close-up slight low angle Titan returning to junction. Cloaking partially re-engaged form flickers. Damaged something. Clearest view yet of face — or where face should be. No eyes no mouth, smooth dark surface with geometric indentations almost-but-not-quite symmetrical. Not monster, designed purposeful alien. Cloaking stabilizes detail lost.</desc>
  <defs>
    <linearGradient id="bgX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberDeviceX3" cx="0.5" cy="0.85" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridFaceX3" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3a1a5a" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#1a0e2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titanHeadX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.4" stop-color="#040206"/>
      <stop offset="0.7" stop-color="#0a0608"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="titanShoulderX3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040408"/>
      <stop offset="0.5" stop-color="#020306"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="indentationX3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a0e2e" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#080404" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomX3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowX3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="iridShimX3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="cloakRippleX3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softX3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgX3)"/>
  <rect width="366" height="240" fill="url(#amberDeviceX3)"/>
  <rect width="366" height="240" fill="url(#iridFaceX3)"/>

  <g>
    <path d="M 0 200 L 80 196 L 100 220 L 0 240 Z" fill="url(#titanShoulderX3)"/>
    <path d="M 286 196 L 366 200 L 366 240 L 266 220 Z" fill="url(#titanShoulderX3)"/>
  </g>
  <g opacity="0.55" filter="url(#iridShimX3)">
