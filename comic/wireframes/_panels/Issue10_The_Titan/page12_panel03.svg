    <ellipse cx="183" cy="158" rx="11" ry="7" fill="#7848b8" opacity="0.35"/>
  </g>

  <g opacity="0.85">
    <line x1="148" y1="84" x2="148" y2="92" stroke="#3a1a5a" stroke-width="0.5"/>
    <line x1="218" y1="82" x2="218" y2="90" stroke="#3a1a5a" stroke-width="0.5"/>
    <path d="M 148 100 Q 168 110 183 110" stroke="#3a1a5a" stroke-width="0.4" fill="none" opacity="0.6"/>
    <path d="M 218 98 Q 200 108 183 110" stroke="#3a1a5a" stroke-width="0.4" fill="none" opacity="0.6"/>
    <path d="M 120 146 Q 152 152 183 158" stroke="#3a1a5a" stroke-width="0.4" fill="none" opacity="0.55"/>
    <path d="M 240 148 Q 214 154 183 158" stroke="#3a1a5a" stroke-width="0.4" fill="none" opacity="0.55"/>
  </g>

  <g opacity="0.45">
    <text x="183" y="216" text-anchor="middle" font-family="Courier New, monospace" font-size="3.6" fill="#3a1a5a" opacity="0.7">▓░ NOT FACE ░▓</text>
    <text x="183" y="226" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#3a1a5a" opacity="0.55">[ designed ]</text>
  </g>

  <g opacity="0.6" filter="url(#bloomX3)">
    <ellipse cx="183" cy="232" rx="80" ry="6" fill="#a87838" opacity="0.4"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="100" height="20" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="2 1"/>
    <text x="42" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#5a4a30" font-style="italic">[silence]</text>
  </g>
</svg>
