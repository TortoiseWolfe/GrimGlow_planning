    <text x="148" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#5a6478" font-weight="700">SABLE: "We pull back. Jink, get high.</text>
    <text x="148" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic">Wren, everything your scanner captured—"</text>
