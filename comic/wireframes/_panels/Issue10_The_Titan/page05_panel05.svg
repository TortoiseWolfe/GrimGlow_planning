      <stop offset="0" stop-color="#080604"/>
      <stop offset="0.4" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <radialGradient id="amberRightQ5" cx="0.95" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d8a868" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#040202" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="darknessLeftQ5" cx="0.05" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#020100" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#040206" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#040202" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitS_Q5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.7" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#c87838"/>
    </linearGradient>
