<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 5 Panel 5 — Sable decides, "We pull back"</title>
  <desc>Close-up Sable's face. Calculation completes — resolve settling, decision made. Split lighting: warm amber gaslight right, cold darkness left. Eyes focused, sharp, bearing weight of command earned back through crisis. The captain deciding.</desc>
  <defs>
