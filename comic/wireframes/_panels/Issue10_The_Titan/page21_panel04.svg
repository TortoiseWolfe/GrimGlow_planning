<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 21 Panel 4 — Theodore at the window, "Fairy tales have a villain now"</title>
  <desc>Wide from outside workshop window looking in — Victorian boy 12-13, lanky pre-teen NOT young child stands at glass looking out at dark city beyond. Workshop behind warm in candlelight — workbench, clockwork tools, newspaper on stool, tiny fairy communication device casting faint geometric blue-white light from bench. Slight, sandy-brown hair, waistcoat pulled tight, hazel eyes looking out — wonder complicated by knowledge dark holds real things. Warm candlelight spills through window glass. Dark city beyond — gaslight halos chimney smoke fog shadows. Reverse of Issue 1's window — looking in, a boy changed.</desc>
