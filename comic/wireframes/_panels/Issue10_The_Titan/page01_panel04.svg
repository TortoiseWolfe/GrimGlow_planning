<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 1 Panel 4 — Thresh checks rifle, anxiety as discipline</title>
  <desc>Medium slight low angle Thresh seated lower beam, weapon across knees, hands run along it by feel — muscle memory. Eyes scan dark corners. Tense vigilance disguised as routine. Fear baseline now — always present, managed through ritual. Crimson edge-lighting pulses unevenly.</desc>
  <defs>
    <linearGradient id="bgM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="0.5" stop-color="#1a1f2c"/>
      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <radialGradient id="amberDimM4" cx="0.95" cy="0.4" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a4838" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#080a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonStutterM4" cx="0.5" cy="0.7" r="0.4">
      <stop offset="0" stop-color="#5a1810" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#080a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitT_M4" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a2828"/>
      <stop offset="0.5" stop-color="#5a3a3a"/>
      <stop offset="1" stop-color="#7a5050"/>
    </linearGradient>
    <linearGradient id="hairBuzzM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3818"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="crimsonArmorM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2520"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="rifleM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="beamLowM4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#0e0805"/>
    </linearGradient>
    <radialGradient id="eyeScanM4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a89878" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a89878" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomM4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowM4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softM4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgM4)"/>
  <rect width="246" height="240" fill="url(#amberDimM4)"/>
  <rect width="246" height="240" fill="url(#crimsonStutterM4)"/>

