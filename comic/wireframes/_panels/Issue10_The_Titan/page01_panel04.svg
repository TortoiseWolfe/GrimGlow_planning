  <g>
    <ellipse cx="116" cy="96" rx="9" ry="3.5" fill="#0a0604"/>
    <ellipse cx="160" cy="94" rx="10" ry="4" fill="#0a0604"/>
    <circle cx="116" cy="96" r="2.6" fill="#080404"/>
    <circle cx="160" cy="94" r="2.8" fill="#080404"/>
    <circle cx="118" cy="95" r="1.2" fill="url(#eyeScanM4)"/>
    <circle cx="162" cy="93" r="1.3" fill="url(#eyeScanM4)"/>
  </g>

  <g stroke="#0a0604" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 98 86 Q 116 80 134 86"/>
    <path d="M 144 84 Q 160 78 180 86"/>
  </g>

  <path d="M 138 102 Q 134 122 138 138" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 110 148 L 156 148" stroke="#0a0604" stroke-width="1.4"/>
  </g>

  <g>
    <path d="M 30 168 L 218 164 L 222 200 L 22 200 Z" fill="url(#crimsonArmorM4)"/>
    <path d="M 60 164 L 110 168 L 140 168 L 196 164 L 196 196 L 60 196 Z" fill="#3a0e08" opacity="0.85"/>
    <path d="M 30 172 L 60 170 L 56 196 L 26 198 Z" fill="#1a0606" opacity="0.95"/>
    <path d="M 218 172 L 192 170 L 196 196 L 222 198 Z" fill="#a83830" opacity="0.95"/>
  </g>

  <g opacity="0.85">
