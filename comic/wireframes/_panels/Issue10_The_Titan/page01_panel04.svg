    <rect x="20" y="188" width="206" height="2" fill="#040404" opacity="0.85"/>
    <rect x="40" y="184" width="180" height="3" fill="#0a0a0a"/>
    <rect x="220" y="178" width="6" height="14" fill="#040404"/>
    <ellipse cx="226" cy="185" rx="2" ry="2.5" fill="#020202"/>
    <rect x="14" y="184" width="8" height="3" fill="#3a3a3a"/>
  </g>

  <g>
    <path d="M 70 178 L 88 174 Q 92 178 90 184 L 78 188 Z" fill="#9a5828" opacity="0.85"/>
    <path d="M 158 178 L 176 174 Q 180 178 178 184 L 166 188 Z" fill="#9a5828" opacity="0.85"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="80" cy="178" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="160" cy="178" rx="6" ry="2" fill="#0a0604"/>
  </g>

  <g opacity="0.8" filter="url(#strongGlowM4)">
    <circle cx="50" cy="178" r="2.5" fill="#dc4540"/>
    <circle cx="196" cy="178" r="2.5" fill="#dc4540"/>
    <circle cx="120" cy="186" r="1.6" fill="#dc4540"/>
  </g>

  <g opacity="0.55" filter="url(#bloomM4)">
    <ellipse cx="123" cy="200" rx="50" ry="6" fill="#5a1810" opacity="0.5"/>
  </g>

  <g opacity="0.4">
    <circle cx="20" cy="40" r="0.4" fill="#3a4858"/>
    <circle cx="220" cy="40" r="0.4" fill="#3a4858"/>
  </g>
</svg>
