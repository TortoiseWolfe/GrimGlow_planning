  <title>Issue 10 Page 19 Panel 2 — Different pub, story mutates with fairy lights</title>
  <desc>Medium eye-level different Victorian pub — similar warm amber gaslight, different patrons. Worker leans forward conspiratorially telling story. Listeners genuinely unsettled. Fairy mythology and monster mythology growing together — same story carrying both. Slightly seedier pub than first, lower ceiling, more smoke. The double mythology spreading.</desc>
