<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 8 Panel 2 — Sable in cover, sidearm drawn, "Thresh hold position"</title>
  <desc>Medium low angle Sable pulling up behind massive desk leg, sidearm drawn. Suit holographic dead — silver just metal now, no light from seams. Operating on training alone. Above her, Titan moves — air displacement, dark iridescence shimmer. Reaching for device.</desc>
  <defs>
    <linearGradient id="bgT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="moonlightT2" cx="0.95" cy="0.05" r="0.4">
      <stop offset="0" stop-color="#5a6478" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#2a3848" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridShimmerT2" cx="0.65" cy="0.3" r="0.35">
      <stop offset="0" stop-color="#3a1a5a" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#1a0e2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberFarT2" cx="0.05" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskLegT2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="silverDeadT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e44"/>
      <stop offset="0.5" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="faceLitS_T2" x1="0" y1="0" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.5" stop-color="#3a261a"/>
      <stop offset="1" stop-color="#5a3622"/>
    </linearGradient>
    <linearGradient id="hairSilT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#5a6068"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="sidearmT2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="eyeFocusT2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a89878" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a89878" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomT2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="iridShimT2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softT2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgT2)"/>
  <rect width="246" height="240" fill="url(#moonlightT2)"/>
  <rect width="246" height="240" fill="url(#amberFarT2)"/>
  <rect width="246" height="240" fill="url(#iridShimmerT2)"/>

  <g>
    <rect x="20" y="20" width="60" height="220" fill="url(#deskLegT2)"/>
    <line x1="40" y1="20" x2="40" y2="240" stroke="#5a3a20" stroke-width="0.4" opacity="0.65"/>
    <line x1="60" y1="20" x2="60" y2="240" stroke="#5a3a20" stroke-width="0.4" opacity="0.55"/>
    <rect x="14" y="22" width="72" height="14" fill="#5a3a20"/>
    <ellipse cx="50" cy="100" rx="4" ry="14" fill="#080404" opacity="0.65"/>
    <ellipse cx="50" cy="170" rx="4" ry="14" fill="#080404" opacity="0.65"/>
  </g>

  <g opacity="0.65" filter="url(#iridShimT2)">
    <path d="M 150 60 Q 200 80 230 130 Q 220 180 180 200" stroke="#7848b8" stroke-width="3" fill="none" opacity="0.4"/>
  </g>
  <g opacity="0.55">
    <path d="M 160 60 L 200 100" stroke="#3a1a5a" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.7"/>
    <path d="M 200 100 L 220 160" stroke="#3a1a5a" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.7"/>
    <ellipse cx="200" cy="100" rx="4" ry="3" fill="#1a0e2e" opacity="0.85"/>
    <ellipse cx="220" cy="160" rx="3" ry="2" fill="#1a0e2e" opacity="0.85"/>
  </g>

  <g>
    <path d="M 90 100 Q 80 120 86 144 Q 94 172 110 188 Q 132 198 156 198 Q 180 194 194 178 Q 202 154 200 120 Q 194 100 178 84 Q 154 78 132 80 Q 104 88 90 100 Z" fill="url(#faceLitS_T2)" opacity="0.95"/>
    <path d="M 90 110 Q 86 134 96 162 Q 106 184 124 198 Q 110 192 100 180 Q 90 162 86 138 Q 88 116 90 110 Z" fill="#080404" opacity="0.55"/>
  </g>

  <g>
    <path d="M 84 90 Q 96 76 132 72 Q 170 70 192 80 Q 204 92 204 108 L 198 116 Q 188 98 168 90 Q 142 84 118 90 Q 96 98 90 108 Z" fill="url(#hairSilT2)" opacity="0.92"/>
    <g stroke="#9098a0" stroke-width="0.4" opacity="0.5">
      <line x1="98" y1="80" x2="104" y2="92"/>
      <line x1="120" y1="76" x2="120" y2="90"/>
      <line x1="146" y1="74" x2="146" y2="88"/>
      <line x1="172" y1="76" x2="170" y2="88"/>
    </g>
  </g>

  <g>
    <ellipse cx="124" cy="134" rx="9" ry="3.5" fill="#0a0604"/>
    <ellipse cx="166" cy="132" rx="10" ry="4" fill="#0a0604"/>
    <circle cx="124" cy="134" r="2.6" fill="#080404"/>
    <circle cx="166" cy="132" r="2.8" fill="#080404"/>
    <circle cx="126" cy="133" r="1.4" fill="url(#eyeFocusT2)"/>
    <circle cx="168" cy="131" r="1.6" fill="url(#eyeFocusT2)"/>
  </g>

  <g stroke="#0a0604" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M 106 124 Q 124 118 142 124"/>
    <path d="M 150 122 Q 166 116 186 124"/>
  </g>

  <path d="M 144 140 Q 140 160 144 174" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 116 184 L 162 184" stroke="#0a0604" stroke-width="1.5"/>
  </g>

  <g>
    <path d="M 38 212 L 232 208 L 234 240 L 36 240 Z" fill="url(#silverDeadT2)"/>
    <path d="M 70 208 L 122 212 L 152 212 L 210 208 L 210 230 L 70 230 Z" fill="#0a0a10" opacity="0.85"/>
  </g>

  <g>
    <rect x="186" y="190" width="44" height="10" fill="url(#sidearmT2)"/>
    <rect x="186" y="190" width="44" height="2" fill="#3a3a3a" opacity="0.55"/>
    <rect x="186" y="198" width="44" height="2" fill="#040404" opacity="0.85"/>
    <rect x="226" y="186" width="6" height="14" fill="#040404"/>
    <ellipse cx="232" cy="193" rx="2" ry="3" fill="#020202"/>
    <rect x="180" y="192" width="8" height="6" fill="#3a3a3a"/>
    <path d="M 186 190 Q 188 192 188 196 L 186 208 L 184 208 Z" fill="url(#silverDeadT2)"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="86" cy="220" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="200" cy="220" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="140" cy="216" rx="3.5" ry="1.4" fill="#0a0604"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#5a6478" font-weight="700">SABLE: "Thresh, hold!</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic">Jink, draw its attention!"</text>
  </g>
</svg>
