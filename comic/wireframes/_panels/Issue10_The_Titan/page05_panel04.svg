    <rect x="148" y="172" width="48" height="6" fill="#3a3a3a" opacity="0.55"/>
    <rect x="148" y="200" width="48" height="4" fill="#040404" opacity="0.85"/>
    <rect x="155" y="180" width="34" height="14" fill="#0a0a0a"/>
    <rect x="160" y="184" width="24" height="6" fill="#1a1c20"/>
    <line x1="172" y1="180" x2="172" y2="194" stroke="#040404" stroke-width="0.4"/>
    <line x1="184" y1="180" x2="184" y2="194" stroke="#040404" stroke-width="0.4"/>
  </g>
  <g opacity="0.92" filter="url(#strongGlowQ4)">
    <ellipse cx="172" cy="187" rx="14" ry="3" fill="#88a8d0"/>
  </g>
  <g>
    <rect x="160" y="186" width="24" height="2" fill="#a8c0e0"/>
  </g>

  <g>
    <rect x="196" y="180" width="160" height="14" fill="url(#rifleBodyQ4)"/>
    <rect x="196" y="180" width="160" height="3" fill="#3a3a3a" opacity="0.55"/>
    <rect x="196" y="190" width="160" height="3" fill="#040404" opacity="0.85"/>
    <rect x="220" y="184" width="120" height="4" fill="#0a0a0a"/>
    <rect x="350" y="178" width="6" height="18" fill="#040404"/>
    <ellipse cx="356" cy="187" rx="2" ry="3" fill="#020202"/>
    <line x1="240" y1="180" x2="240" y2="194" stroke="#040404" stroke-width="0.4"/>
    <line x1="280" y1="180" x2="280" y2="194" stroke="#040404" stroke-width="0.4"/>
    <line x1="320" y1="180" x2="320" y2="194" stroke="#040404" stroke-width="0.4"/>
  </g>
  <g opacity="0.55" filter="url(#bloomQ4)">
