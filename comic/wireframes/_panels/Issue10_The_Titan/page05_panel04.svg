<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 5 Panel 4 — Thresh's hands, "fear in the hands, courage in the aim"</title>
  <desc>Extreme close-up two hands gripping compact rifle. Pale-skinned, strong, tendons visible from white-knuckle grip — tighter than necessary. Armored crimson forearms, dented, holographic edge-lighting pulses crimson geometric like visible heartbeat. Weapon aimed steadily into darkness. Body says retreat. Training says hold.</desc>
  <defs>
    <linearGradient id="bgQ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="crimsonPulseQ4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a1810" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="darknessRightQ4" cx="0.92" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#020100" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#040206" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armorPlateQ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2520"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="armorLitQ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c83538"/>
      <stop offset="0.5" stop-color="#8a2520"/>
      <stop offset="1" stop-color="#3a0e08"/>
    </linearGradient>
    <linearGradient id="paleSkinQ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b09a"/>
      <stop offset="0.5" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3838"/>
    </linearGradient>
    <linearGradient id="rifleBodyQ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="rifleTechQ4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#3a3e44"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <filter id="bloomQ4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowQ4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="heartbeatQ4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softQ4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgQ4)"/>
  <rect width="366" height="240" fill="url(#crimsonPulseQ4)"/>
  <rect width="366" height="240" fill="url(#darknessRightQ4)"/>

  <g>
