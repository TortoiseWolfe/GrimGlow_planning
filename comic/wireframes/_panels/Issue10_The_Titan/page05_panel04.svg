    <path d="M 122 174 L 130 168 L 138 170 L 138 182 L 130 184 Z" fill="url(#paleSkinQ4)" stroke="#5a3838" stroke-width="0.4"/>
    <path d="M 138 170 L 144 168 L 150 170 L 150 184 L 144 184 Z" fill="url(#paleSkinQ4)" stroke="#5a3838" stroke-width="0.4"/>
    <path d="M 132 188 Q 142 192 152 188" stroke="#5a3838" stroke-width="0.6" fill="none"/>

    <path d="M 230 178 L 224 172 L 218 174 L 216 184 L 224 186 Z" fill="url(#paleSkinQ4)" stroke="#5a3838" stroke-width="0.4"/>
    <path d="M 218 174 L 210 168 L 202 170 L 202 182 L 210 184 Z" fill="url(#paleSkinQ4)" stroke="#5a3838" stroke-width="0.4"/>
    <path d="M 202 170 L 196 168 L 190 170 L 190 184 L 196 184 Z" fill="url(#paleSkinQ4)" stroke="#5a3838" stroke-width="0.4"/>
    <path d="M 208 188 Q 198 192 188 188" stroke="#5a3838" stroke-width="0.6" fill="none"/>

