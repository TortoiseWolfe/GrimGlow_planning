    <line x1="130" y1="178" x2="130" y2="184" stroke="#7a4848" stroke-width="0.4"/>
    <line x1="142" y1="178" x2="142" y2="184" stroke="#7a4848" stroke-width="0.4"/>
    <line x1="222" y1="180" x2="222" y2="186" stroke="#7a4848" stroke-width="0.4"/>
    <line x1="210" y1="178" x2="210" y2="184" stroke="#7a4848" stroke-width="0.4"/>
    <line x1="198" y1="178" x2="198" y2="184" stroke="#7a4848" stroke-width="0.4"/>
  </g>

  <g>
