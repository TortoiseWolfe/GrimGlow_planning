  <g opacity="0.45">
    <text x="60" y="220" font-family="Courier New, monospace" font-size="3.4" fill="#3a0e08" opacity="0.5">.::HOLD::.</text>
    <text x="280" y="220" font-family="Courier New, monospace" font-size="3.4" fill="#3a0e08" opacity="0.5">.::HOLD::.</text>
