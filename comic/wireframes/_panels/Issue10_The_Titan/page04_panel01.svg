<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 4 Panel 1 — Relay room, the wrongness escalates</title>
  <desc>Wide interior fairy-scale through doorway into relay room. Telegraph machines line walls, additional wiring in non-standard patterns. Some connections glow dark iridescence. Gas lamps flicker irregularly — power being drawn. Squad enters tactical formation: Thresh first weapon up, then Sable, Wren, Luma; Jink trailing high.</desc>
