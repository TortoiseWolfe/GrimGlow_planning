<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 280" width="494" height="280">
  <title>Issue 10 Page 21 Panel 3 — Theodore looks at fairy emitter, "Please be all right"</title>
  <desc>Medium close-up eye level Theodore's face — sandy-brown hair, hazel eyes, freckles. Looks at workbench: tiny holographic emitter casting faint geometric blue-white light — fairy communication device, still glowing. Expression relief mixed with new understanding — boy who wanted fairies to be magical now knows there are monsters too. Innocence hasn't shattered but cracked, complicated by knowledge that things he loves are in danger. Warm candlelight from right, faint geometric blue-white fairy-tech glow from emitter — fragile against warm amber. Wonder becoming worry.</desc>
