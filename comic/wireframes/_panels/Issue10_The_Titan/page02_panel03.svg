  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="170" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="76" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#a85820" font-weight="700">WREN: "Cable entry point.</text>
    <text x="76" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.4" fill="#2a2a2a" font-style="italic">Insulation's degraded — there's room."</text>
  </g>

  <g transform="translate(190,42)">
    <rect x="-8" y="0" width="100" height="18" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="42" y="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a6478" font-weight="700">SABLE: "Go."</text>
  </g>
