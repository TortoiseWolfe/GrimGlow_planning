<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 2 Panel 3 — Sable and Wren at the cable entry, "Cable entry point. Go."</title>
  <desc>Medium eye level base of massive Victorian brick wall. Sable and Wren crouched at gap where cables enter — frayed insulation, dark interior. Sable hand on brick listening, decisive. Wren points at gap, copper-gold scanner. Mortar lines as wide as roads. Warm amber gaslight from street.</desc>
  <defs>
    <linearGradient id="bgN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="amberStreetN3" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#d8a868" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scannerGoldN3" cx="0.65" cy="0.6" r="0.2">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickWallN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5238"/>
      <stop offset="0.5" stop-color="#5a3828"/>
      <stop offset="1" stop-color="#3a2418"/>
    </linearGradient>
    <linearGradient id="mortarN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="silverFN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#4a4e54"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="copperFN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="cableInsulN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperWireN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="hairBlkN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#2a1e1a"/>
    </linearGradient>
    <linearGradient id="hairSilN3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <filter id="bloomN3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowN3" x="-25%" y="-25%" width="150%" height="150%">
