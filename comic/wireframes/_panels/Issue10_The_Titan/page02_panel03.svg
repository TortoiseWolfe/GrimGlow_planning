    <ellipse cx="123" cy="218" rx="0.9" ry="1.1" fill="#0a0604"/>
    <path d="M 116 224 L 124 224" stroke="#0a0604" stroke-width="0.8"/>
    <path d="M 104 230 L 136 230 L 142 260 L 98 260 Z" fill="url(#silverFN3)"/>
    <path d="M 104 236 L 136 236 L 136 252 L 104 252 Z" fill="#2a2a2a"/>
