    <path d="M 164 230 L 196 230 L 202 260 L 158 260 Z" fill="url(#copperFN3)"/>
    <path d="M 164 236 L 196 236 L 196 252 L 164 252 Z" fill="#5a2e10"/>
    <path d="M 202 232 L 218 222 L 222 226 L 206 240 Z" fill="url(#copperFN3)"/>
