  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="148" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#5a6478" font-weight="700">SABLE: "Weapons free, scanners active.</text>
    <text x="148" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic">Together. Nobody alone."</text>
  </g>
</svg>
