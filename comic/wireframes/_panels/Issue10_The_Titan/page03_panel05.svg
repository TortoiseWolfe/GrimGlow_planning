<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 3 Panel 5 — Sable in command, "New posture. Weapons free."</title>
  <desc>Medium close-up Sable. Hand moves to compact sidearm at hip. Soot-darkened silver weeks of degradation. Crisis mode activates. Hard focus, decisive — tentative captain replaced by officer who keeps people alive. Faint blue-white suit-glow at jaw. Squad shifts to combat alertness behind.</desc>
  <defs>
    <linearGradient id="bgO5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="amberAmbientO5" cx="0.7" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#d8a868" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitS_O5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.8" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairSilSharpO5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b0b8"/>
      <stop offset="0.5" stop-color="#7a8088"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="silverSootO5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="sidearmO5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="eyeFocusS_O5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a8c0e0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a8c0e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomO5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowO5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softO5" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgO5)"/>
  <rect width="366" height="240" fill="url(#amberAmbientO5)"/>

