    <path d="M 60 192 L 110 196 L 140 196 L 196 192 L 196 220 L 60 220 Z" fill="#2a2a2a"/>
    <path d="M 196 196 Q 220 198 230 220 L 220 224 Q 210 210 196 208 Z" fill="url(#silverSootO5)"/>
