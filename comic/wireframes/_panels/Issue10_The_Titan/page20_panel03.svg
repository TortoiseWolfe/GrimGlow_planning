      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <linearGradient id="faceLumaZ3" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a878d8"/>
    </linearGradient>
    <linearGradient id="faceThreshZ3" x1="0" y1="0" x2="0.7" y2="0.5">
