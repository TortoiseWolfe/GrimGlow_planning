<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 20 Panel 3 — Luma treats Thresh, "Yes. That's what made it extraordinary."</title>
  <desc>Close-up two-shot Luma and Thresh. Luma — South Asian features warm brown skin long braided hair single thick braid sapphire-violet suit — leans close, medical scanner casts soft blue-violet light treating cut above Thresh's eye. Thresh — broad-shouldered pale skin copper-red buzz cut damaged crimson armor — sits still, face softened by exhaustion and vulnerability she would not have shown before tonight. Sapphire-violet scanner glow illuminates both faces intimately. Quiet moment between healer and soldier. Tenderness after terror.</desc>
