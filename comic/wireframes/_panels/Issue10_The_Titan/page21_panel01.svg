<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 21 Panel 1 — Theodore reads TELEGRAPH DEMON, the same light, different meaning</title>
  <desc>Wide establishing Theodore's tinker workshop at human scale — familiar space from Issue 3 with workbench, hanging tools, clockwork parts, half-assembled automaton on shelf. Theodore sits on wooden stool, still, newspaper in lap. Twelve-thirteen years old, lanky pre-teen NOT young child, slight build, sandy-brown hair, hazel eyes. Working-class apprentice clothes — collarless shirt, leather waistcoat, patched trousers. Headline TELEGRAPH DEMON visible. Real fear — cold understanding world contains genuine danger. Workshop warm in candlelight — same amber from first encounter with Jink — but warmth doesn't feel safe anymore.</desc>
