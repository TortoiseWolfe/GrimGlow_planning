<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 9 Panel 3 — Coordinated harassment, Jink dives past the head</title>
  <desc>Wide dynamic elevated tilted. Jink wing-pack sputtering functional moment dives past Titan's head close fast trailing broken emerald. Titan's head tracks movement — first reaction. Sable fires from below silver-blue bolt absorbed. Thresh fires flanking — crimson absorbed. Combined harassment forces Titan to pause work.</desc>
