<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 20 Panel 2 — Squad back at camp, Wren reads the device data</title>
  <desc>Medium wall cavity camp interior — familiar space between timber beams, squad in various states of recovery. Wiry copper-suited engineer examines data on fragmentary holographic display. Dark-skinned silver-suited captain at wall gap looking out. Sapphire-violet medic tends to crimson-armored soldier — cleaning wound above eye. Lean emerald scout sits on upper beam, wing-pack components spread out for repair. Depleted camp light, grey daylight through wall gap, faint department-color holographic glow.</desc>
