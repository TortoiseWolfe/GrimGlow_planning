    <path d="M 60 176 L 110 180 L 140 180 L 196 176 L 196 220 L 60 220 Z" fill="#1a0606" opacity="0.85"/>
    <path d="M 30 184 L 60 182 L 56 220 L 26 222 Z" fill="#3a0e08"/>
    <path d="M 218 184 L 192 182 L 196 220 L 222 222 Z" fill="#a83830"/>
  </g>

  <g>
    <rect x="180" y="172" width="80" height="10" fill="url(#rifleU4)" transform="rotate(-10 180 172)"/>
    <rect x="180" y="172" width="80" height="2" fill="#3a3a3a" opacity="0.6" transform="rotate(-10 180 172)"/>
    <rect x="180" y="180" width="80" height="2" fill="#040404" opacity="0.85" transform="rotate(-10 180 172)"/>
    <rect x="254" y="170" width="6" height="14" fill="#040404" transform="rotate(-10 180 172)"/>
  </g>

  <g opacity="0.95" filter="url(#muzzleFlashU4)">
    <ellipse cx="270" cy="156" rx="22" ry="14" fill="#dc4540"/>
    <ellipse cx="270" cy="156" rx="14" ry="9" fill="#f4886a"/>
  </g>
  <g opacity="0.95" filter="url(#bloomU4)">
    <ellipse cx="270" cy="156" rx="6" ry="4" fill="#ffffff"/>
  </g>
  <g opacity="0.85">
    <path d="M 270 156 L 290 142" stroke="#f4886a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 270 156 L 280 134" stroke="#f4886a" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 270 156 L 296 152" stroke="#f4886a" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="76" cy="194" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="180" cy="194" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="120" cy="186" rx="3.5" ry="1.4" fill="#0a0604"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowU4)">
    <circle cx="50" cy="194" r="3" fill="#dc4540"/>
    <circle cx="196" cy="194" r="3" fill="#dc4540"/>
    <circle cx="120" cy="206" r="2.5" fill="#dc4540"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="123" cy="218" rx="60" ry="3" fill="#040202"/>
  </g>
  <g opacity="0.7">
    <line x1="100" y1="218" x2="120" y2="240" stroke="#3a0e08" stroke-width="0.5" opacity="0.6" stroke-dasharray="2 1"/>
    <line x1="160" y1="218" x2="180" y2="240" stroke="#3a0e08" stroke-width="0.5" opacity="0.6" stroke-dasharray="2 1"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#8a2520" font-weight="700">THRESH: "I can't hurt it.</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">I'm going to hurt it anyway."</text>
  </g>
