    <line x1="0" y1="212" x2="366" y2="210" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
    <line x1="0" y1="226" x2="366" y2="224" stroke="#1a1008" stroke-width="0.4" opacity="0.55"/>
  </g>

