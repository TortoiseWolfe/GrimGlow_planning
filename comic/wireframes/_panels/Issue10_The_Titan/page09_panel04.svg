<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 9 Panel 4 — Thresh advances, "I can't hurt it. I'm going to hurt it anyway."</title>
  <desc>Medium close-up low angle Thresh advancing — not retreating not holding, ADVANCING. Weapon fires controlled bursts. Naked fear AND forward momentum. Eyes wide, jaw clenched, breathing hard. Boots move forward. Crimson weapons-fire strobe staccato flashes. Darkness between. Titan looms above as dark void.</desc>
  <defs>
    <linearGradient id="bgU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="titanLoomU4" cx="0.5" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#020100" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#040206" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonStrobeU4" cx="0.5" cy="0.65" r="0.45">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="faceLitT_U4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2828"/>
      <stop offset="0.5" stop-color="#7a3a3a"/>
      <stop offset="1" stop-color="#a85050"/>
    </linearGradient>
    <linearGradient id="hairBuzzU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="crimsonArmorU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="rifleU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="eyeFearU4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#dc4540" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titanVoidU4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040408"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <filter id="bloomU4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowU4" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="muzzleFlashU4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softU4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgU4)"/>
  <rect width="366" height="240" fill="url(#titanLoomU4)"/>
  <rect width="366" height="240" fill="url(#crimsonStrobeU4)"/>

