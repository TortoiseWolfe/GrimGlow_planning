  </g>

  <g>
    <path d="M 60 60 Q 70 44 116 40 Q 162 40 184 50 Q 196 62 196 76 L 192 84 Q 182 64 162 58 Q 130 54 102 60 Q 80 66 76 76 Z" fill="url(#hairBuzzU4)"/>
    <g stroke="#3a1410" stroke-width="0.4" opacity="0.4">
      <line x1="80" y1="48" x2="80" y2="60"/>
      <line x1="98" y1="44" x2="98" y2="58"/>
      <line x1="118" y1="42" x2="118" y2="58"/>
      <line x1="138" y1="42" x2="138" y2="58"/>
      <line x1="158" y1="44" x2="158" y2="58"/>
    </g>
  </g>

  <g>
    <ellipse cx="116" cy="100" rx="11" ry="5" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="160" cy="98" rx="12" ry="5.5" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="116" cy="100" rx="9" ry="4" fill="#0a0604"/>
    <ellipse cx="160" cy="98" rx="10" ry="4.5" fill="#0a0604"/>
    <circle cx="116" cy="100" r="3" fill="#080404"/>
    <circle cx="160" cy="98" r="3.4" fill="#080404"/>
    <circle cx="118" cy="99" r="1.6" fill="url(#eyeFearU4)"/>
    <circle cx="162" cy="97" r="1.8" fill="url(#eyeFearU4)"/>
