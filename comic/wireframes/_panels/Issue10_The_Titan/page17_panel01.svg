<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 17 Panel 1 — Squad regroups, Wren holds up the induction coil</title>
  <desc>Wide telegraph office in grey-blue early dawn. Devastation complete — overturned desks, shattered telegraph machines, scattered paper, breach in rear wall, burned-out device in junction box still faintly smoking. Plaster dust covers everything. Five tiny figures regroup at primary desk — degraded metallic suits showing heavy new battle damage. Copper-suited figure holds up small brass and copper component — the induction coil, original mission objective. Mission complete at terrible cost.</desc>
