<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 1 Panel 2 — Wren brief, "I can strip it in four minutes"</title>
  <desc>Medium close-up Wren with copper-gold holographic schematic reflected in eyes. Engineer-as-operational-planner. East Asian, wiry, dark hair UP messy bun, oil-stained heavily degraded copper suit, scorch on shoulder. Schematic shows interior layout. Focused authoritative — no hesitation.</desc>
  <defs>
    <linearGradient id="bgM2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1812"/>
      <stop offset="0.4" stop-color="#2a201a"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="copperGoldM2" cx="0.5" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitW_M2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairBlkM2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#2a1e1a"/>
    </linearGradient>
    <linearGradient id="copperSuitM2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <radialGradient id="eyeFocusM2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomM2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowM2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softM2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgM2)"/>
  <rect width="246" height="240" fill="url(#copperGoldM2)"/>

