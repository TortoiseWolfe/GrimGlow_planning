    <rect x="80" y="170" width="14" height="10" fill="none" stroke="#f4d090" stroke-width="0.4"/>
    <rect x="110" y="170" width="14" height="10" fill="none" stroke="#f4d090" stroke-width="0.4"/>
    <rect x="140" y="170" width="14" height="10" fill="none" stroke="#f4d090" stroke-width="0.4"/>
    <rect x="115" y="170" width="6" height="10" fill="#f4d090" opacity="0.65"/>
