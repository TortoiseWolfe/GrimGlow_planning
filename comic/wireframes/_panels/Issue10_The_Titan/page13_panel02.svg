<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 13 Panel 2 — Sable joins the line, "Thresh — I am with you"</title>
  <desc>Medium close-up Sable steps from cable bundle barricade, sidearm drawn. Complex expression — pride, concern, recognition, beginning of atonement. Silver-blue holographic recovers at suit seams as moves into fight. Captain returning to the line. Joining not saving — standing beside.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="silverRecoverY2" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2a3848" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberAheadY2" cx="0.95" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cableBundleY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperGleamY2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2e10"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#7a3e18"/>
    </linearGradient>
    <linearGradient id="floorY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="silverFigY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/>
      <stop offset="0.5" stop-color="#4a4e54"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="hairSilY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9098a0"/>
      <stop offset="0.5" stop-color="#7a8088"/>
      <stop offset="1" stop-color="#3a3e44"/>
    </linearGradient>
    <linearGradient id="faceLitS_Y2" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="sidearmY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="eyeRecogY2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#88a8d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#88a8d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softY2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgY2)"/>
  <rect width="366" height="240" fill="url(#amberAheadY2)"/>
  <rect width="366" height="240" fill="url(#silverRecoverY2)"/>

  <g>
    <rect x="0" y="200" width="366" height="40" fill="url(#floorY2)"/>
    <line x1="0" y1="212" x2="366" y2="210" stroke="#1a1008" stroke-width="0.5" opacity="0.55"/>
  </g>

  <g>
    <path d="M 0 100 Q 30 96 60 110 Q 80 120 60 140 L 60 200 L 0 200 Z" fill="url(#cableBundleY2)" opacity="0.92"/>
    <path d="M 0 110 Q 30 106 60 116" stroke="url(#copperGleamY2)" stroke-width="2.4" fill="none"/>
    <path d="M 0 130 Q 30 126 60 134" stroke="url(#copperGleamY2)" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M 0 150 Q 30 146 60 154" stroke="url(#copperGleamY2)" stroke-width="2.5" fill="none"/>
    <path d="M 0 170 Q 30 166 60 174" stroke="url(#copperGleamY2)" stroke-width="2" fill="none" opacity="0.85"/>
  </g>
  <g opacity="0.55" filter="url(#bloomY2)">
    <ellipse cx="20" cy="140" rx="9" ry="2" fill="#f4b860"/>
  </g>

  <g>
    <path d="M 80 80 Q 70 100 76 124 Q 84 152 100 168 Q 122 178 146 178 Q 170 174 184 158 Q 192 134 190 100 Q 184 80 168 66 Q 144 60 122 62 Q 94 70 80 80 Z" fill="url(#faceLitS_Y2)" opacity="0.95"/>
  </g>

  <g>
    <path d="M 70 70 Q 84 56 122 52 Q 162 50 184 60 Q 196 72 196 88 L 188 96 Q 178 78 158 70 Q 132 64 108 70 Q 86 78 80 88 Z" fill="url(#hairSilY2)" opacity="0.95"/>
    <g stroke="#cccccc" stroke-width="0.4" opacity="0.55">
      <line x1="86" y1="60" x2="92" y2="74"/>
      <line x1="106" y1="56" x2="108" y2="70"/>
      <line x1="130" y1="54" x2="130" y2="70"/>
      <line x1="154" y1="56" x2="152" y2="70"/>
      <line x1="176" y1="62" x2="172" y2="76"/>
    </g>
  </g>

  <g>
    <ellipse cx="116" cy="116" rx="9" ry="3.5" fill="#0a0604"/>
    <ellipse cx="160" cy="114" rx="10" ry="4" fill="#0a0604"/>
    <circle cx="116" cy="116" r="2.6" fill="#080404"/>
    <circle cx="160" cy="114" r="2.8" fill="#080404"/>
    <circle cx="118" cy="115" r="1.4" fill="url(#eyeRecogY2)"/>
    <circle cx="162" cy="113" r="1.6" fill="url(#eyeRecogY2)"/>
  </g>

  <g stroke="#0a0604" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M 98 106 Q 116 100 134 106"/>
    <path d="M 144 104 Q 160 98 180 106"/>
  </g>

  <path d="M 138 122 Q 134 142 138 158" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 110 168 L 156 168" stroke="#0a0604" stroke-width="1.6"/>
    <path d="M 116 172 L 150 172" stroke="#0a0604" stroke-width="0.6" opacity="0.6"/>
  </g>

  <g>
    <path d="M 60 196 L 286 192 L 286 240 L 60 240 Z" fill="url(#silverFigY2)"/>
    <path d="M 90 192 L 140 196 L 170 196 L 226 192 L 226 220 L 90 220 Z" fill="#2a2a2a"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowY2)">
    <line x1="62" y1="206" x2="282" y2="204" stroke="#88a8d0" stroke-width="1.2" opacity="0.55"/>
    <line x1="80" y1="220" x2="226" y2="220" stroke="#88a8d0" stroke-width="0.7" opacity="0.45"/>
  </g>

  <g>
    <rect x="220" y="184" width="50" height="10" fill="url(#sidearmY2)" transform="rotate(-15 220 184)"/>
    <rect x="220" y="184" width="50" height="2" fill="#3a3a3a" opacity="0.6" transform="rotate(-15 220 184)"/>
    <rect x="220" y="192" width="50" height="2" fill="#040404" opacity="0.85" transform="rotate(-15 220 184)"/>
    <rect x="266" y="182" width="6" height="14" fill="#040404" transform="rotate(-15 220 184)"/>
  </g>

  <g opacity="0.95" filter="url(#strongGlowY2)">
    <circle cx="60" cy="206" r="3" fill="#88a8d0"/>
    <circle cx="220" cy="206" r="3" fill="#88a8d0"/>
    <circle cx="140" cy="216" r="2.5" fill="#88a8d0"/>
  </g>

  <g opacity="0.85">
    <ellipse cx="76" cy="206" rx="6" ry="2" fill="#0a0604"/>
    <ellipse cx="180" cy="206" rx="6" ry="2" fill="#0a0604"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="220" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#5a6478" stroke-width="1.2"/>
    <text x="100" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#5a6478" font-weight="700">SABLE: "Jink, flank left.</text>
    <text x="100" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">Thresh — I am with you."</text>
  </g>
</svg>
