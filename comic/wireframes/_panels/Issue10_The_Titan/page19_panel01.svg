<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 19 Panel 1 — First pub, telegraph workers tell the story</title>
  <desc>Medium eye-level Victorian pub — warm amber gaslight, wooden tables, tankards. Three telegraph workers sit together, one leaning forward telling a story with animated fear, others listening with mixed skepticism and unease. At next table woman leans in to overhear. Warm pub lighting contrasts with cold fear in storyteller's expression. Familiar warmth where extraordinary stories are being told. Telegraph demon story spreading.</desc>
