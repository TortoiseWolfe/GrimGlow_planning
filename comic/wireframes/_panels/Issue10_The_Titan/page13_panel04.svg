<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 260" width="494" height="260">
  <title>Issue 10 Page 13 Panel 4 — Wren completes the device, "I have the plan."</title>
  <desc>Medium tracking Wren behind massive desk, holding completed improvised device. Telegraph wire wrapped around fairy-tech component, brass connectors, spliced power coupling. Crude purposeful — engineering under fire. Fragmentary copper-gold schematic hovers nearby. Quiet certainty of engineer who trusts physics. Solution in the engineer's hands.</desc>
