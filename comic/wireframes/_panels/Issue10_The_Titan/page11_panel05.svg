      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="emeraldBlazeW5" cx="0.3" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#5acc88" stop-opacity="0.95"/>
