<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 11 Panel 5 — Jink full burn, "TWO SECONDS? I only need ONE!"</title>
  <desc>Dynamic action low angle. Gap hits — fairy tech blazes. Jink wing-pack ignites brilliant emerald, Thresh's armor lights crimson. Jink rockets from cover fully deployed wings, blazing emerald trails, diving at Titan's face. Titan reacts pulling back from junction. Brightest fairy light in issue. Grin reborn as defiance.</desc>
