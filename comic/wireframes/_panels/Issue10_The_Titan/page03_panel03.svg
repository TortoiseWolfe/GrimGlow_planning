<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 3 Panel 3 — "This isn't human work" — the discovery</title>
  <desc>Medium wide eye level along baseboard. Squad stopped, all looking up. Above: underside of desk with brass telegraph machine. But among standard wiring — wire to nowhere, component non-Victorian. Wren frozen, scanner sweeps up. Sable rigid. Thresh raises weapon. The discovery moment.</desc>
