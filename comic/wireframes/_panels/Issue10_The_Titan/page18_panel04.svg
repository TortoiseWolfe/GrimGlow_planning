  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="240" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#1a1828" stroke-width="1.2"/>
    <text x="112" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#1a1828" font-weight="700">JOURNALIST: "A demon, you say?</text>
    <text x="112" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">In the telegraph office?"</text>
  </g>

  <g transform="translate(490,180)">
    <rect x="-8" y="0" width="240" height="42" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="112" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#3a2410" font-weight="700">WORKER: "I'm telling you what</text>
    <text x="112" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">I saw. The wall smashed through</text>
    <text x="112" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">from inside. If it wasn't a demon,</text>
    <text x="112" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#3a2410" font-weight="700">you tell me what it was."</text>
