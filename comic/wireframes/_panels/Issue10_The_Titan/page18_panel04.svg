<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 18 Panel 4 — Journalist sketches "DEMON", squad watches from across the street</title>
  <desc>Wide exterior Victorian street outside telegraph office. Crowd larger now. Journalist with notebook sketches scene — word DEMON visible on his page. Workers gesture animatedly at building. Constable emerges, pale. Telegraph wires overhead crackle faintly. In background, across the street, barely visible gap in brick wall holds faintest suggestion of colored light — tiny easily missed — squad watching their mythology being born. Moment a real event becomes a story.</desc>
