    <text x="280" y="210" text-anchor="middle" font-family="Times New Roman, serif" font-size="9" fill="#1a0a04" font-weight="900" transform="rotate(-8 262 180)" letter-spacing="0.6">DEMON</text>
    <line x1="266" y1="218" x2="296" y2="216" stroke="#5a3018" stroke-width="0.4" transform="rotate(-8 262 180)"/>

