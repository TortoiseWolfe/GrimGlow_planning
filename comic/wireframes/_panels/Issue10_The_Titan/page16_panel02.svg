      <stop offset="0" stop-color="#1a1a28"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnEastX2" cx="0.95" cy="0.3" r="0.42">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#3a4868" stop-opacity="0.28"/>
