  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="240" height="42" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#5a6478" stroke-width="1.2"/>
    <text x="112" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#5a6478" font-weight="700">SABLE: "It's running."</text>
    <text x="112" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700">WREN: "It's not running.</text>
    <text x="112" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">It's repositioning. We've made it</text>
    <text x="112" y="38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">visible. It can't work in the open."</text>
