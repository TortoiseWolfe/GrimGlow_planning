<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 10 Page 16 Panel 2 — Titan crashes through wall, tactical withdrawal</title>
  <desc>Wide dynamic interior shot. Titan moves through breach in rear wall — plaster and brick exploding outward as enormous angular form crashes through. Dark surface shimmers cascading dark iridescence, cloaking failed, fully visible. Withdrawing strategically. Junction box device sparks and dies — amber-black glow fading. Office devastated — overturned desks scattered machines. Five tiny figures watch not pursuing. East windows show first grey-blue dawn light.</desc>
