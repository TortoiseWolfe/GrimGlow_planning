<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 10 Page 19 Panel 3 — Victorian city at night, telegraph wire web</title>
  <desc>Wide aerial Victorian city at night — roofscape of chimneys church spires gaslight halos in fog. Telegraph wires visible as dark threads connecting buildings across cityscape, web of communication infrastructure. Vast unsuspecting city. Warm amber gaslight from streets below, cool moonlight from above, telegraph wires dark against sky. Both fairy tales and monster tales being told, neither knows about the other. Connected city, disconnected stories.</desc>
