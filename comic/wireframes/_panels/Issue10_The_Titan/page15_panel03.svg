    <linearGradient id="bgY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="copperRiseY3" cx="0.42" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a2e10" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brassWestY3" cx="0.85" cy="0.4" r="0.32">
      <stop offset="0" stop-color="#c87838" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a2e10" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copperFigY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a2e10"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="hairBlkY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#3a1a14"/>
    </linearGradient>
    <linearGradient id="faceLitW_Y3" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#c87838"/>
    </linearGradient>
    <linearGradient id="brassKeyY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="copperWireY3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b860"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="deviceCoreY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <radialGradient id="eyeFocusY3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY3" x="-25%" y="-25%" width="150%" height="150%">
