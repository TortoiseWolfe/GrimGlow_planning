  </g>
  <g opacity="0.85" filter="url(#megaGlowY3)">
    <circle cx="122" cy="145" r="18" fill="#a85820" opacity="0.45"/>
  </g>
  <g opacity="0.95" filter="url(#bloomY3)">
    <circle cx="122" cy="145" r="4" fill="#fff8d8" opacity="0.65"/>
  </g>

  <g opacity="0.65">
    <ellipse cx="80" cy="174" rx="3" ry="1.4" fill="#1a0604"/>
    <ellipse cx="92" cy="178" rx="2.4" ry="1.2" fill="#1a0604"/>
