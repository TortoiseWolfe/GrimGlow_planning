<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 15 Panel 3 — Wren's face, the final splice, "CLEAR!"</title>
  <desc>Close-up eye level Wren's face and hands — concentrated certainty as she makes final splice, burned fingers connecting last wire. Device integrated into telegraph circuit glows intensifying copper-gold. Other hand reaches for telegraph key — enormous brass lever at her scale. She knows it will work. The physics says so. The moment before the solution fires.</desc>
