  </g>

  <g>
    <path d="M 88 144 Q 110 142 132 134 Q 156 122 174 110" stroke="url(#copperWireY3)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M 90 150 Q 116 148 140 142" stroke="url(#copperWireY3)" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 84 156 Q 110 156 134 152" stroke="url(#copperWireY3)" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.75"/>
  </g>

  <g>
