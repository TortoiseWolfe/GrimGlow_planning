    </radialGradient>
    <linearGradient id="handSkinZ5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5828"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <linearGradient id="suitCuffZ5" x1="0" y1="0" x2="0" y2="1">
