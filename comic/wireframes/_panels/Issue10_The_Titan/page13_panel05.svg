    <linearGradient id="brassConnZ5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#c87838"/>
      <stop offset="1" stop-color="#7a3e18"/>
    </linearGradient>
    <linearGradient id="copperWireZ5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#7a3e18"/>
