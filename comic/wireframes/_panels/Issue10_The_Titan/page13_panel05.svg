      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="copperPulseZ5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.5"/>
