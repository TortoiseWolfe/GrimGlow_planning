<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 10 Page 13 Panel 5 — ECU Wren's hands holding the device</title>
  <desc>Extreme close-up two hands holding small improvised device — telegraph copper wire wrapped around fairy-tech component pulsing copper-gold geometric light, brass Victorian connectors spliced to alien interfaces with precise solder points. Burned hands — singe marks from improvised soldering, oil and copper dust under nails. Two technologies married. Craft under crisis.</desc>
