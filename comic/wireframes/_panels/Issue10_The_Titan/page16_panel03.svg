      <stop offset="0" stop-color="#1a1a28"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="dawnY3" cx="0.85" cy="0.2" r="0.42">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#3a4868" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberRecY3" cx="0.18" cy="0.5" r="0.32">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonSteadyY3" cx="0.5" cy="0.55" r="0.38">
