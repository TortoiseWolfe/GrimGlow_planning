    <path d="M 174 130 L 188 196" stroke="#0a0606" stroke-width="2.4" opacity="0.85"/>
    <path d="M 158 142 L 184 148" stroke="#1a0606" stroke-width="0.6" opacity="0.5"/>

    <path d="M 120 110 L 100 200" stroke="url(#crimsonDamY3)" stroke-width="8" stroke-linecap="round"/>
