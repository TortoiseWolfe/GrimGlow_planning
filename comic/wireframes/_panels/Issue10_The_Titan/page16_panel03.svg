      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#dc4540" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomY3" x="-20%" y="-20%" width="140%" height="140%">
