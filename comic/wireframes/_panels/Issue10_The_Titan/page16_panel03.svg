    <linearGradient id="crimsonDamY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2018"/>
      <stop offset="0.5" stop-color="#3a1006"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="hairBuzzY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="faceLitT_Y3" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a85820"/>
    </linearGradient>
    <linearGradient id="rifleY3" x1="0" y1="0" x2="0" y2="1">
