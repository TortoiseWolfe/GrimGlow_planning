<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 16 Panel 3 — Thresh kneels, "I was afraid the whole time" — "I didn't stop"</title>
  <desc>Medium eye-level Thresh sinks to her knees at telegraph desk edge. Broad-shouldered muscular pale skin copper-red buzz cut blood from cut above eye. Crimson armored suit heavily damaged — pauldron crushed chest plate cracked, holographic edge-lighting now pulses steadily for first time. Weapon lowers to rest on desk surface. Exhaustion relief fragile pride — knowledge she was afraid and did not stop. Recovering warm amber gaslight. Grey-blue dawn from windows. The aftermath of courage.</desc>
