  <g transform="translate(200,12)">
    <rect x="-8" y="0" width="160" height="32" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#8a2520" stroke-width="1.2"/>
    <text x="72" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.8" fill="#8a2520" font-weight="700">THRESH (quiet):</text>
    <text x="72" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic">"I was afraid the</text>
    <text x="72" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#2a2a2a" font-style="italic">whole time."</text>
  </g>

  <g transform="translate(20,140)">
    <rect x="-8" y="0" width="120" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#5a6478" stroke-width="1.2"/>
    <text x="52" y="10" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#5a6478" font-weight="700">SABLE: "I know."</text>
    <text x="52" y="18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6.6" fill="#8a2520" font-weight="700">THRESH: "I didn't stop."</text>
  </g>
</svg>
