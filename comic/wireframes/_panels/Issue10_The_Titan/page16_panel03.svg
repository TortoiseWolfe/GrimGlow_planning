    <path d="M 152 80 L 150 110 Q 152 122 156 132" stroke="#a83830" stroke-width="0.6" fill="none" opacity="0.6"/>

    <path d="M 138 110 L 202 110 L 220 200 L 120 200 Z" fill="url(#crimsonArmorY3)"/>
