      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskTopY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="wallY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="crimsonArmorY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
