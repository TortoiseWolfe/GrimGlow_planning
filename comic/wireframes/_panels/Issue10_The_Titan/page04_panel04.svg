      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.4" stop-color="#080404"/>
      <stop offset="0.7" stop-color="#0a0608"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="backlitAmberP4" cx="0.05" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a3018" stroke-width="0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titanShadowP4" cx="0.78" cy="0.48" r="0.35">
      <stop offset="0" stop-color="#1a0e2e" stop-opacity="0.7"/>
