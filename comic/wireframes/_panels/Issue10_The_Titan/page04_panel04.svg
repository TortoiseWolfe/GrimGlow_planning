    <line x1="148" y1="222" x2="540" y2="180" stroke="#a89878" stroke-width="0.4" stroke-dasharray="2 2" opacity="0.55"/>
    <line x1="304" y1="218" x2="560" y2="170" stroke="#a878d0" stroke-width="0.4" stroke-dasharray="2 2" opacity="0.55"/>
