      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorDarkP4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="silverFP4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a626a"/>
