<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 10 Page 4 Panel 4 — All five at the doorway, the cloaked shape, "I see it"</title>
  <desc>Wide from behind squad stacked at doorway, looking into large dark room. Beyond: telegraph operating floor in near-darkness. At far end crouched over equipment, a SHAPE. Enormous. Cloaking makes eye slide off. Faint dark iridescence at edges. Squad weapons drawn, scanners glitch. Backlit by relay room lamps.</desc>
