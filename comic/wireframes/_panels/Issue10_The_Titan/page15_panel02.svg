    <circle cx="105" cy="149" r="0.8" fill="#dc4540"/>
    <path d="M 94 158 L 106 158" stroke="#0a0604" stroke-width="1"/>
    <path d="M 80 168 L 120 168 L 128 200 L 72 200 Z" fill="url(#crimsonArmorY2)"/>
    <path d="M 80 174 L 120 174 L 124 196 L 76 196 Z" fill="#1a0606" opacity="0.85"/>
    <path d="M 86 180 L 116 184 L 112 192 L 90 188 Z" fill="#5a1810" opacity="0.85"/>
    <path d="M 70 180 L 64 200" stroke="#a83830" stroke-width="3" stroke-linecap="round"/>
    <path d="M 130 178 L 138 196" stroke="#a83830" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g opacity="0.92">
    <rect x="116" y="138" width="58" height="8" fill="url(#rifleY2)" transform="rotate(-32 116 138)"/>
    <rect x="116" y="144" width="58" height="2" fill="#040404" transform="rotate(-32 116 138)"/>
    <rect x="166" y="134" width="6" height="14" fill="#040404" transform="rotate(-32 116 138)"/>
