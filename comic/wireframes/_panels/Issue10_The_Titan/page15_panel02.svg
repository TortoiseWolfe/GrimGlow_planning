      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="titanHandY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="titanIridY2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9858d8"/>
      <stop offset="0.5" stop-color="#5a2a8a"/>
      <stop offset="1" stop-color="#1a0a2a"/>
    </linearGradient>
    <linearGradient id="crimsonArmorY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83830"/>
      <stop offset="0.5" stop-color="#5a1810"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="hairBuzzY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="boltCrimY2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc4540"/>
      <stop offset="0.5" stop-color="#f4886a"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="rifleY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
