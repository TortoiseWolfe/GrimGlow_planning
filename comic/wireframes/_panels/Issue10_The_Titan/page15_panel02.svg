    <ellipse cx="116" cy="128" rx="5" ry="3" fill="url(#hairBuzzY2)"/>
    <ellipse cx="96" cy="150" rx="1.6" ry="2.2" fill="#0a0604"/>
    <ellipse cx="104" cy="150" rx="1.6" ry="2.2" fill="#0a0604"/>
