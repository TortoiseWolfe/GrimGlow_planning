    <path d="M 172 100 Q 196 70 176 28" stroke="url(#boltCrimY2)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 172 100 Q 158 70 130 32" stroke="url(#boltCrimY2)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
  </g>
