<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 15 Panel 2 — Thresh fires at Titan's joints, "aim for the joints"</title>
  <desc>Medium high-angle Titan's enormous multi-jointed hand reaches edge of desk — dark-surfaced iridescent at edges. Crimson geometric energy bolts strike finger joints causing twitch. Hand pauses. Below on desk surface broad-shouldered crimson-armored figure fires controlled bursts targeting joints specifically. Buying seconds through precision.</desc>
  <defs>
    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="crimsonHitY2" cx="0.6" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridFingY2" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#7848b8" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
