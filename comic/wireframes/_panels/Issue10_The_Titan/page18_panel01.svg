      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="overcastX1" cx="0.5" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.42"/>
