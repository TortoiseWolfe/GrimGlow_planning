<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 18 Panel 1 — Crowd at telegraph office, "From the inside OUT"</title>
  <desc>Wide exterior establishing Victorian telegraph office in grey overcast morning. Small crowd at entrance — workers in telegraph company uniforms, constable in tall hat, curious onlookers in working-class dress. Building shows visible damage — shattered rear window, scorch marks on brickwork, telegraph wires on roof crackling. One worker stands at doorway refusing to enter. Through open door devastated interior visible in cold daylight. Human world discovering something it cannot explain.</desc>
