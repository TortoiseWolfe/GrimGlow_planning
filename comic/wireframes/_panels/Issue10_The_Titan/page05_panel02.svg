<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 260" width="494" height="260">
  <title>Issue 10 Page 5 Panel 2 — The Titan glimpsed, the amber-black device pulses</title>
  <desc>Medium wide fairy-scale across dark telegraph operating floor. Far end Titan flickers between visibility and void. Cloaking failure moment: angular, inhuman, enormous, hunched, dark light-absorbing surface, hands too many joints elongated. Then cloaking reasserts. Device in terminal pulses sickly amber-black — third light language: sick, wrong, organic.</desc>
  <defs>
    <linearGradient id="bgQ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberBlackPulseQ2" cx="0.7" cy="0.55" r="0.35">
      <stop offset="0" stop-color="#7a4818" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#3a1810" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#1a0608" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="titanCloakQ2" cx="0.7" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#020100" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#040206" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridescentEdgeQ2" cx="0.7" cy="0.45" r="0.4">
      <stop offset="0.4" stop-color="#020100" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3a1a5a" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#7848b8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorDarkQ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="terminalBrassQ2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3818"/>
      <stop offset="0.5" stop-color="#3a2010"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="deviceCoreQ2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.4" stop-color="#5a2818"/>
      <stop offset="0.8" stop-color="#1a0608"/>
      <stop offset="1" stop-color="#020100"/>
    </radialGradient>
    <filter id="bloomQ2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowQ2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="megaGlowQ2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="cloakSlipQ2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="iridShimQ2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="softQ2" x="-10%" y="-10%" width="120%" height="120%">
