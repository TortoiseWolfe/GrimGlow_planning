<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 10 Page 6 Panel 4 — Titan fully revealed, EMP pulse, "FALL BACK!"</title>
  <desc>Wide dramatic from squad's position. Titan cloaking failed completely one terrible second — standing upright hunched, angular inhuman frame too large. Surface shimmers dark iridescence — oil on water bruise-purple/black. Too many joints. Face void. Hands extended — one on device, one reaching toward doorway. Device PULSES, fairy tech screams. Holographic displays shatter, scanners die, suits flicker.</desc>
