      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberBlackBurstR4" cx="0.65" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.95"/>
