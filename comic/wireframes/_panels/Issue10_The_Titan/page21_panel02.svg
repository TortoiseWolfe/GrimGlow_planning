      <line x1="116" y1="94" x2="116" y2="102" stroke="#5a2e10" stroke-width="0.4"/>
      <path d="M 113 95 L 119 101 M 113 101 L 119 95" stroke="#5a2e10" stroke-width="0.3"/>
