    <line x1="32" y1="232" x2="214" y2="232" stroke="#5a3018" stroke-width="0.3" opacity="0.45"/>
    <line x1="32" y1="240" x2="180" y2="240" stroke="#5a3018" stroke-width="0.3" opacity="0.4"/>
