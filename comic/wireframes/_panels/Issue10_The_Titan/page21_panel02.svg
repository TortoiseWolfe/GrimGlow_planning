<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 280" width="246" height="280">
  <title>Issue 10 Page 21 Panel 2 — Theodore's hands grip the newspaper</title>
  <desc>Close-up eye level Theodore's hands gripping newspaper — oil-stained fingers, small burn scar on one knuckle, brass gear ring on left index finger catching candlelight. Grip too tight — newspaper edges crumple. Headline TELEGRAPH DEMON visible between thumbs. Hands of boy who knows what demon really is and fears for tiny people he calls friends. Warm candlelight on hands, brass gear ring gleaming. Fear in the hands.</desc>
