    <text x="123" y="150" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" fill="#1a0a04" font-weight="900" letter-spacing="0.7">DEMON</text>
    <text x="123" y="162" text-anchor="middle" font-family="Times New Roman, serif" font-size="6" fill="#3a1a08" font-style="italic">— TERRORISES THREADNEEDLE STREET —</text>
    <line x1="32" y1="170" x2="214" y2="170" stroke="#5a3018" stroke-width="0.4"/>
