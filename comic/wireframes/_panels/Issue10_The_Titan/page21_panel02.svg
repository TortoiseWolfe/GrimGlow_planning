    </filter>
    <filter id="megaGlowY2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="246" height="280" fill="url(#bgY2)"/>
  <rect width="246" height="280" fill="url(#candleY2)"/>

