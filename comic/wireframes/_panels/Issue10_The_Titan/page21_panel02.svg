    <linearGradient id="bgY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="candleY2" cx="0.7" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1a1008" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ecd8"/>
      <stop offset="0.5" stop-color="#e0d4b8"/>
      <stop offset="1" stop-color="#a89888"/>
    </linearGradient>
    <linearGradient id="paperShadY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8b898"/>
      <stop offset="1" stop-color="#7a6850"/>
    </linearGradient>
    <linearGradient id="handY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c87838"/>
      <stop offset="0.5" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#3a261a"/>
    </linearGradient>
    <linearGradient id="brassRingY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#d88838"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="cuffY2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89888"/>
      <stop offset="0.5" stop-color="#7a6850"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <filter id="bloomY2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="strongGlowY2" x="-25%" y="-25%" width="150%" height="150%">
