<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 220" width="742" height="220">
  <title>Issue 10 Page 15 Panel 1 — Wren splices her device into the live telegraph circuit</title>
  <desc>Close-up at desk surface level Wren working at the guts of Victorian telegraph apparatus — connection housing cracked open, brass terminals, copper wire, insulation. Wiry copper-suited engineer with burned hands splicing improvised device into live circuit with surgical precision. Sparks fly from connection point where fairy technology meets Victorian wiring. Hands move with speed and certainty. Two technologies becoming one.</desc>
