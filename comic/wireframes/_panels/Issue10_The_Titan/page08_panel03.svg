  <g>
    <path d="M 60 92 Q 72 64 100 50 Q 130 42 158 44 Q 186 46 210 60 Q 226 76 222 96 L 198 100 Q 210 76 180 66 Q 150 60 122 66 Q 100 76 84 92 Z" fill="url(#hairGoldT3)"/>
    <ellipse cx="62" cy="88" rx="14" ry="18" fill="url(#hairGoldT3)" transform="rotate(-25 62 88)"/>
    <ellipse cx="220" cy="92" rx="12" ry="16" fill="url(#hairGoldT3)" transform="rotate(20 220 92)"/>
    <ellipse cx="86" cy="58" rx="10" ry="8" fill="url(#hairGoldT3)" transform="rotate(-30 86 58)"/>
    <ellipse cx="194" cy="56" rx="10" ry="8" fill="url(#hairGoldT3)" transform="rotate(30 194 56)"/>
    <ellipse cx="138" cy="46" rx="14" ry="9" fill="url(#hairGoldT3)"/>
