<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 8 Panel 3 — Jink fights failing wing-pack, "one second in three"</title>
  <desc>Medium slight low angle Jink mid-air struggling. Wing-pack flickers — emerald geometric dragonfly wings deploying sputtering dying deploying broken fragments. Between failures grabs telegraph cable swings. Frustration determination genuine fear. Wing-pack strobes — bright dark bright. Background Titan distortion shimmer.</desc>
  <defs>
    <linearGradient id="bgT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="emeraldStrobeT3" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3aa868" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#1f4a30" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridBgT3" cx="0.85" cy="0.5" r="0.3">
      <stop offset="0" stop-color="#3a1a5a" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#1a0e2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cableSwingT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperGleamT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88838"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <linearGradient id="faceLitJ_T3" x1="0" y1="0" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairGoldT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b020"/>
      <stop offset="0.5" stop-color="#a87820"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="emeraldSuitT3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <linearGradient id="wingFragmentT3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa868" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1f4a30" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="eyeStruggleT3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#5acc88" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5acc88" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomT3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowT3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="strobeBlurT3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softT3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

