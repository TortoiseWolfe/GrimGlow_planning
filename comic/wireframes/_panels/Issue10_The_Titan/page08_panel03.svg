  </g>

  <g stroke="#5a3818" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M 106 114 Q 124 108 140 114"/>
    <path d="M 150 112 Q 166 106 184 114"/>
  </g>

  <path d="M 144 130 Q 140 150 144 168" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 122 178 Q 144 182 166 178" stroke="#0a0604" stroke-width="1.4" fill="none"/>
  </g>

  <g>
    <path d="M 86 198 Q 100 218 132 224 Q 162 220 184 198 L 200 226 Q 174 240 144 240 Q 114 240 86 226 Z" fill="url(#emeraldSuitT3)"/>
    <path d="M 100 210 L 184 210" stroke="#1f4a30" stroke-width="2"/>
  </g>

  <g>
    <ellipse cx="186" cy="208" rx="3" ry="3.4" fill="#0a0604"/>
    <ellipse cx="186" cy="206" rx="2" ry="2" fill="#7a4830"/>
    <line x1="190" y1="210" x2="220" y2="100" stroke="#5a3622" stroke-width="2"/>
  </g>

  <g opacity="0.85" filter="url(#bloomT3)">
    <circle cx="86" cy="226" r="3" fill="#3aa868" opacity="0.55"/>
  </g>
  <g opacity="0.4" filter="url(#strobeBlurT3)">
    <circle cx="200" cy="216" r="2.5" fill="#3aa868" opacity="0.35"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a8858" font-weight="700">JINK: "Wings garbage —</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">one second in three —"</text>
