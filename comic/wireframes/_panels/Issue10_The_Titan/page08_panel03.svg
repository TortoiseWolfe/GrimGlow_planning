    <line x1="192" y1="140" x2="180" y2="116" stroke="#3aa868" stroke-width="0.4" opacity="0.4"/>
    <line x1="192" y1="140" x2="208" y2="124" stroke="#3aa868" stroke-width="0.4" opacity="0.4"/>
  </g>

  <g>
