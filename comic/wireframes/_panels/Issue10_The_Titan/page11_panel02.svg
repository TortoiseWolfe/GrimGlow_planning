<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 11 Panel 2 — Titan grips telegraph machine, Victorian tech weaponized</title>
  <desc>Close-up looking up. Titan's hand closes around telegraph machine on desk lifting it. Machine — at fairy scale size of car — comes up trailing wires. Brass key, sounder, wooden base. Used as weapon, rising about to descend. Amber-black device glow. Dark iridescence on gripping hand.</desc>
  <defs>
    <linearGradient id="bgW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberDeviceW2" cx="0.5" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridGripW2" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#3a1a5a" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#1a0e2e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassMachineW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d090"/>
      <stop offset="0.4" stop-color="#a87838"/>
      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassDarkW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="alienHandW2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="cableSnapW2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2010"/>
      <stop offset="0.5" stop-color="#a85820"/>
      <stop offset="1" stop-color="#5a2e10"/>
    </linearGradient>
    <filter id="bloomW2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowW2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="iridShimW2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="softW2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgW2)"/>
  <rect width="246" height="240" fill="url(#amberDeviceW2)"/>
  <rect width="246" height="240" fill="url(#iridGripW2)"/>

  <g>
