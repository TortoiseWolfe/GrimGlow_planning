<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 20 Panel 1 — Telegraph office boarded up, "everything is a gas leak"</title>
  <desc>Wide exterior Victorian telegraph office boarded up, work crew repairing wall breach. Sign reads CLOSED UNTIL FURTHER NOTICE. Telegraph company officials stand in worried cluster while workers board windows and repoint brick. Telegraph wires above intact — network functioning. Grey daylight functional and ordinary. Extraordinary event being papered over with bureaucratic explanation. The human world moving on.</desc>
