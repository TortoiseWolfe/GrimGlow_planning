<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 20 Panel 4 — Sable at the wall gap, "We have to stop them"</title>
  <desc>Medium wide Sable standing at wall gap in camp looking out at grey Victorian city through crack in brickwork. Silhouetted against grey daylight — dark brown skin, silver-white hair, soot-darkened silver suit. Behind her in camp the squad in recovery positions — shapes in dim camp light. Posture carries weight of command and new knowledge. Grey daylight from wall gap silhouetting her, warm depleted camp light behind. The captain who knows they cannot leave.</desc>
