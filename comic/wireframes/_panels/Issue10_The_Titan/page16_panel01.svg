<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 16 Panel 1 — Pulse seen from outside, Titan silhouetted in blazing windows</title>
  <desc>Wide widescreen exterior Victorian telegraph office viewed through windows. Every window blazes copper-gold light — feedback pulse illuminating interior. Through glass vast dark angular silhouette visible — Titan fully exposed turning toward windows. Victorian street outside quiet — cobblestones cool moonlight, distant gas lamps, no figures. Telegraph wires from roofline crackle with visible energy. Nightmare in the building.</desc>
