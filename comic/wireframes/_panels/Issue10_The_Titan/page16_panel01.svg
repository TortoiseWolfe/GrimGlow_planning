      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <radialGradient id="moonGlowX1" cx="0.05" cy="0.1" r="0.35">
      <stop offset="0" stop-color="#a8c0e0" stop-opacity="0.45"/>
