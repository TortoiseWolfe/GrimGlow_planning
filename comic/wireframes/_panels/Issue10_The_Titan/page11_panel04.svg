  </g>

  <g>
    <ellipse cx="240" cy="60" rx="11" ry="13" fill="#3a261a"/>
    <ellipse cx="240" cy="52" rx="8" ry="9" fill="url(#faceLitL_W4)"/>
    <path d="M 228 42 Q 240 32 252 42 Q 256 50 252 58 L 248 62 Q 244 50 240 50 Q 236 50 232 60 Z" fill="url(#hairBlkW4)"/>
    <path d="M 240 38 Q 244 60 246 90" stroke="url(#hairBlkW4)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="236" cy="60" rx="1.4" ry="2" fill="#0a0604"/>
    <ellipse cx="244" cy="60" rx="1.4" ry="2" fill="#0a0604"/>

    <rect x="220" y="48" width="14" height="10" rx="1.5" fill="none" stroke="#a878d0" stroke-width="0.6" opacity="0.85"/>
    <rect x="246" y="48" width="14" height="10" rx="1.5" fill="none" stroke="#a878d0" stroke-width="0.6" opacity="0.85"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowW4)">
    <rect x="220" y="48" width="14" height="10" fill="#7848b8" opacity="0.4"/>
    <rect x="246" y="48" width="14" height="10" fill="#7848b8" opacity="0.4"/>
  </g>

  <g>
    <rect x="216" y="74" width="48" height="18" fill="url(#violetSuitW4)"/>
    <rect x="262" y="80" width="20" height="12" rx="2" fill="#1a0e2e" stroke="#3a1a5a" stroke-width="0.5"/>
    <rect x="264" y="82" width="16" height="3" fill="#a878d0" opacity="0.85"/>
    <rect x="264" y="86" width="12" height="2" fill="#a878d0" opacity="0.65"/>
    <rect x="264" y="89" width="14" height="2" fill="#a878d0" opacity="0.5"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowW4)">
    <ellipse cx="272" cy="86" rx="11" ry="4" fill="#a878d0"/>
  </g>

  <g opacity="0.92">
    <line x1="220" y1="120" x2="320" y2="120" stroke="#a878d0" stroke-width="0.5" opacity="0.55"/>
    <line x1="220" y1="135" x2="320" y2="135" stroke="#a878d0" stroke-width="0.5" opacity="0.55"/>
    <path d="M 220 130 L 240 130 L 244 122 L 248 130 L 264 130 L 268 122 L 272 130 L 286 130 L 290 122 L 294 130 L 320 130" stroke="#a878d0" stroke-width="0.6" fill="none"/>
    <text x="270" y="115" text-anchor="middle" font-family="Courier New, monospace" font-size="3.2" fill="#a878d0" opacity="0.8">PULSE PATTERN</text>
    <text x="270" y="148" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a878d0" opacity="0.7">GAP: 2s / 12s</text>
  </g>

  <g opacity="0.6">
    <line x1="100" y1="92" x2="220" y2="92" stroke="#88a8d0" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.55"/>
