<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 11 Panel 4 — Sable and Luma find the gap, "Two seconds. Our window."</title>
  <desc>Medium eye level Sable and Luma behind cable bundle barricade. Sable orders into comm cutting in/out. Luma stabilized scanner brief bursts feeding tactical data — disruption field has pulse pattern, gaps. Sable absorbs Luma's data adapts. Faint silver-blue from suit recovering. Sapphire scanner glow.</desc>
  <defs>
    <linearGradient id="bgW4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="silverGapW4" cx="0.3" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2a3848" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetScanW4" cx="0.7" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#7848b8" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cableBarrierW4" x1="0" y1="0" x2="0" y2="1">
