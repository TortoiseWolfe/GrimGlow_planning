  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="32" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#7848b8" font-weight="700">LUMA: "Field pulses.</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">Two seconds every twelve."</text>
    <text x="92" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#5a6478" font-weight="700">SABLE: "Our window."</text>
  </g>
