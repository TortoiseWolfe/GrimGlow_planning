  <g>
    <ellipse cx="100" cy="60" rx="11" ry="13" fill="#3a261a"/>
    <ellipse cx="100" cy="52" rx="8" ry="9" fill="url(#faceLitS_W4)"/>
    <path d="M 88 42 Q 100 32 112 42 L 110 50 Q 104 38 100 38 Q 96 38 90 50 Z" fill="url(#hairSilW4)" opacity="0.92"/>
    <ellipse cx="96" cy="60" rx="1.4" ry="2" fill="#0a0604"/>
    <ellipse cx="104" cy="60" rx="1.4" ry="2" fill="#0a0604"/>
    <circle cx="97" cy="59" r="0.7" fill="#a8c0e0"/>
    <circle cx="105" cy="59" r="0.7" fill="#a8c0e0"/>
    <path d="M 94 68 L 106 68" stroke="#0a0604" stroke-width="1"/>
    <path d="M 84 78 L 116 78 L 124 80 L 124 92 L 116 88 L 84 88 L 76 92 L 76 80 Z" fill="url(#silverFigW4)"/>

    <rect x="106" y="64" width="14" height="6" rx="2" fill="#1a1c20" stroke="#3a3a3a" stroke-width="0.4"/>
    <line x1="108" y1="62" x2="118" y2="62" stroke="#3a3a3a" stroke-width="0.4"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowW4)">
