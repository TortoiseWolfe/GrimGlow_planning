<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 250" width="742" height="250">
  <title>Issue 10 Page 17 Panel 4 — Squad extracts through cable entry, Thresh covers rear</title>
  <desc>Wide slightly elevated five tiny figures in damaged metallic suits moving single file into cable entry passage in Victorian wall — same entry point from Page 2, now in grey dawn light. Move slowly, carrying small brass component and salvaged data. Each suit shows heavy damage — dents cracks burns grime — but faint department-color holographic glow returns at seams: silver copper emerald crimson sapphire-violet. Last figure broad-shouldered crimson armor covers rear weapon raised — soldier ensuring everyone gets out first. Cable entry passage dark ahead, grey dawn behind. Light endures through damage. The retreat together.</desc>
