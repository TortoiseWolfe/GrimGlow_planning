<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 17 Panel 3 — Through shattered window, ordinary city waking up</title>
  <desc>Medium eye level looking through shattered rear window of telegraph office at Victorian street in dawn light. Interior is devastation — breach in wall, debris. Beyond window: ordinary city waking up. Milk cart on cobblestones, street sweeper beginning work, gas lamp still burning in grey-blue dawn. Battlefield inside, mundane world outside. World does not know what happened. The secret world behind the ordinary one.</desc>
