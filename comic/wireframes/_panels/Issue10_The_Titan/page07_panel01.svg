<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 1100" width="742" height="1100">
  <title>Issue 10 Page 7 SPLASH — The Titan revealed, "It is not invisible. It is wrong."</title>
  <desc>Full-page splash dramatic low angle. Titan fully revealed crouched in telegraph office, hunched beneath ceiling. Angular inhuman dark-surfaced absorbing light. Dark iridescence at every edge. Too many joints, asymmetric torso, void head. Body wrong biology iridescent. Device sickly amber-black mechanical. Squad tiny at bottom. Thresh front weapon shaking. The defining image.</desc>
