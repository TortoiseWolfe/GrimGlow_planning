<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 280" width="742" height="280">
  <title>Issue 10 Page 14 Panel 4 — Thresh stands between Titan and Wren, "Through me."</title>
  <desc>Medium wide low-angle desk surface level. Broad-shouldered Thresh in heavily damaged crimson armor stands at edge of telegraph desk weapon raised looking up at Titan filling space above. Titan reaches downward — enormous multi-jointed hand, dark surface dark iridescence, amber-black device glowing in grip. Crimson holographic edge-lighting blazes full intensity during disruption gap. Earned heroism. Behind on desk wiry copper figure works at apparatus.</desc>
