<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 10 Page 18 Panel 3 — Claw marks on the wall, constable's reaching hand</title>
  <desc>Close-up Victorian interior wall showing deep claw marks gouged into plaster and brick — at height no human could reach, marks too large and deep for any known animal. Constable's gloved hand reaches up but falls short of highest mark. Below claw marks burned-out device in junction box, dark and inert, alien materials unrecognizable as technology — looks like melted slag to human eyes. Cold grey morning light catches depth of gouges. Evidence that tells a story no one present can read.</desc>
