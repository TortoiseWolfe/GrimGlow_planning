    <polygon points="296,164 300,162 304,164 302,168 298,168" opacity="0.55"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="240" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#1a2438" stroke-width="1.2"/>
    <text x="112" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#1a2438" font-weight="700">CONSTABLE: "Claw marks.</text>
    <text x="112" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#2a2a2a" font-style="italic" font-weight="700">Those are... claw marks."</text>
  </g>

  <g transform="translate(20,242)">
    <rect x="-8" y="0" width="240" height="22" rx="3" fill="#f5ecd8" opacity="0.95" stroke="#3a2410" stroke-width="1.2"/>
    <text x="112" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#3a2410" font-weight="700">WORKER (off-panel):</text>
    <text x="112" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">"I told you. It wasn't a man."</text>
