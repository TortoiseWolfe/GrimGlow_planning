    <ellipse cx="278" cy="208" rx="5" ry="3" fill="#080404"/>
    <ellipse cx="290" cy="226" rx="4" ry="2" fill="#080404"/>

    <g opacity="0.65">
      <rect x="216" y="174" width="22" height="10" rx="1.5" fill="#5a3018" stroke="#1a0a04" stroke-width="0.4"/>
