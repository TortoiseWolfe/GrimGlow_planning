    <rect x="208" y="168" width="104" height="84" rx="2" fill="#0a0604"/>

    <rect x="220" y="186" width="80" height="50" rx="3" fill="url(#deviceSlagY3)" stroke="#080404" stroke-width="1.4"/>
    <path d="M 220 196 Q 232 192 244 196 Q 256 200 268 194 Q 280 192 300 198" stroke="#1a0a04" stroke-width="0.7" fill="none" opacity="0.75"/>
    <path d="M 220 210 Q 232 208 244 214 Q 256 220 268 212 Q 280 210 300 216" stroke="#1a0a04" stroke-width="0.7" fill="none" opacity="0.65"/>
    <path d="M 220 226 Q 232 222 244 226 Q 260 230 280 224 Q 290 222 300 228" stroke="#1a0a04" stroke-width="0.7" fill="none" opacity="0.55"/>

