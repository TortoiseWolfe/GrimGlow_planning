      <stop offset="0.5" stop-color="#3a1a14"/>
      <stop offset="1" stop-color="#1a0a08"/>
    </linearGradient>
    <linearGradient id="gougeBlackY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a08"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="boxFrameY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3018"/>
      <stop offset="0.5" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#1a0a04"/>
    </linearGradient>
    <linearGradient id="deviceSlagY3" x1="0" y1="0" x2="0" y2="1">
