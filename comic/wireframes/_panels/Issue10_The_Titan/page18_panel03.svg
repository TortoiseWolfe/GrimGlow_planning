      <stop offset="0" stop-color="#1a1828"/>
      <stop offset="0.5" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#040206"/>
    </linearGradient>
    <linearGradient id="coatNavyY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4868"/>
      <stop offset="0.5" stop-color="#1a2438"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <filter id="bloomY3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="strongShadowY3" x="-25%" y="-25%" width="150%" height="150%">
