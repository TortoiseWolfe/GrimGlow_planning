      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="greyLightY3" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1a1828" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plasterWallY3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a89888"/>
      <stop offset="0.5" stop-color="#5a4838"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="plasterShadY3" x1="0" y1="0" x2="0" y2="1">
