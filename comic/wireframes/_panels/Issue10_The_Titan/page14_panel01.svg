<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 240" width="742" height="240">
  <title>Issue 10 Page 14 Panel 1 — Squad creates corridor, Wren sprints</title>
  <desc>Wide eye-level action across telegraph office floor. Coordinated operation: silver and crimson figures fire from positions on either side, bolts converging on Titan's dark form forcing it to turn. Emerald flyer makes a pass overhead. Through created opening, copper figure sprints flat across open floor toward primary telegraph desk. Plan in execution.</desc>
