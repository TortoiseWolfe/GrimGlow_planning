<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 10 Panel 2 — Thresh's face on the floor, "...I'm scared."</title>
  <desc>Extreme close-up Thresh face from ground level, cheek pressed against wood grain. Blood tracks from cut above eye. Pupils dilated — fear total visceral. But beneath terror: something forming. Decision to stand up despite everything. Lips barely move. Crimson glow intermittent — pulse dark pulse.</desc>
  <defs>
    <linearGradient id="bgV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="crimsonPulseV2" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#5a1810" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGrainV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="paleSkinV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b09a"/>
      <stop offset="0.5" stop-color="#a87878"/>
      <stop offset="1" stop-color="#5a3838"/>
    </linearGradient>
    <linearGradient id="hairBuzzV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85020"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <radialGradient id="eyeFearTotalV2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#dc4540" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dc4540" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bloodTrackV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc4540"/>
      <stop offset="0.5" stop-color="#8a2520"/>
      <stop offset="1" stop-color="#3a0e08"/>
    </linearGradient>
    <filter id="bloomV2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowV2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softV2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgV2)"/>
  <rect width="366" height="240" fill="url(#crimsonPulseV2)"/>

  <g>
    <rect x="0" y="0" width="366" height="240" fill="url(#floorGrainV2)" opacity="0.85"/>
    <line x1="0" y1="20" x2="366" y2="22" stroke="#3a2818" stroke-width="0.6" opacity="0.85"/>
    <line x1="0" y1="46" x2="366" y2="48" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="74" x2="366" y2="72" stroke="#3a2818" stroke-width="0.6" opacity="0.85"/>
    <line x1="0" y1="100" x2="366" y2="98" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="186" x2="366" y2="184" stroke="#3a2818" stroke-width="0.6" opacity="0.85"/>
    <line x1="0" y1="212" x2="366" y2="210" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="234" x2="366" y2="232" stroke="#3a2818" stroke-width="0.4" opacity="0.85"/>
    <ellipse cx="80" cy="42" rx="14" ry="3" fill="#1a1008" opacity="0.6"/>
    <ellipse cx="220" cy="60" rx="20" ry="3" fill="#1a1008" opacity="0.6"/>
    <ellipse cx="320" cy="208" rx="16" ry="3" fill="#1a1008" opacity="0.6"/>
  </g>

  <g>
    <ellipse cx="200" cy="130" rx="160" ry="80" fill="url(#paleSkinV2)"/>
    <path d="M 80 70 Q 100 56 160 50 Q 240 50 300 64 Q 340 80 350 100 L 320 110 Q 300 80 240 70 Q 180 64 130 76 Q 100 90 90 100 Z" fill="url(#hairBuzzV2)"/>
    <g stroke="#3a1410" stroke-width="0.5" opacity="0.55">
      <line x1="100" y1="68" x2="104" y2="84"/>
      <line x1="140" y1="60" x2="142" y2="78"/>
      <line x1="180" y1="56" x2="180" y2="76"/>
      <line x1="220" y1="56" x2="220" y2="76"/>
      <line x1="260" y1="60" x2="258" y2="80"/>
      <line x1="300" y1="68" x2="296" y2="84"/>
    </g>
  </g>

  <g>
    <path d="M 246 78 Q 252 92 256 110 Q 254 126 244 138 Q 240 134 240 120" stroke="url(#bloodTrackV2)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M 248 82 Q 256 100 252 124" stroke="#a83830" stroke-width="1.2" fill="none" opacity="0.85"/>
  </g>
  <g opacity="0.85" filter="url(#bloomV2)">
    <ellipse cx="244" cy="92" rx="9" ry="6" fill="#dc4540" opacity="0.55"/>
  </g>
  <g opacity="0.95">
    <ellipse cx="244" cy="92" rx="3" ry="2" fill="#a83830"/>
    <circle cx="244" cy="92" r="0.8" fill="#5a1810"/>
  </g>

  <g>
    <ellipse cx="148" cy="124" rx="22" ry="11" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="148" cy="124" rx="18" ry="9" fill="#0a0604"/>
    <circle cx="148" cy="124" r="7" fill="#080404"/>
    <circle cx="150" cy="122" r="3" fill="url(#eyeFearTotalV2)"/>

    <ellipse cx="246" cy="120" rx="24" ry="12" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="246" cy="120" rx="20" ry="10" fill="#0a0604"/>
    <circle cx="246" cy="120" r="8" fill="#080404"/>
    <circle cx="248" cy="118" r="3.5" fill="url(#eyeFearTotalV2)"/>
  </g>

  <g stroke="#0a0604" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M 116 108 Q 148 100 178 108"/>
    <path d="M 216 104 Q 246 96 280 104"/>
  </g>

  <path d="M 192 140 Q 188 162 192 178" stroke="#0a0604" stroke-width="1.2" fill="none" opacity="0.7"/>

  <g>
    <path d="M 162 192 L 224 192" stroke="#0a0604" stroke-width="1.4"/>
    <path d="M 168 196 L 218 196" stroke="#5a3030" stroke-width="0.7" opacity="0.65"/>
  </g>

  <g opacity="0.75" filter="url(#bloomV2)">
    <line x1="80" y1="180" x2="100" y2="220" stroke="#5a1810" stroke-width="0.4" opacity="0.4"/>
    <line x1="280" y1="180" x2="300" y2="220" stroke="#5a1810" stroke-width="0.4" opacity="0.4"/>
  </g>
  <g opacity="0.85" filter="url(#strongGlowV2)">
    <circle cx="50" cy="170" r="3" fill="#dc4540" opacity="0.55"/>
    <circle cx="320" cy="170" r="3" fill="#dc4540" opacity="0.55"/>
  </g>

  <g transform="translate(20,16)">
    <rect x="-8" y="0" width="180" height="20" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="2 1"/>
    <text x="82" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#8a2520" font-weight="700" font-style="italic">THRESH: "...I'm scared."</text>
  </g>
</svg>
