    </linearGradient>
    <linearGradient id="deskFootW1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="copperFigW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <linearGradient id="hairBlkW1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#2a1e1a"/>
    </linearGradient>
    <linearGradient id="faceLitW_W1" x1="0" y1="0" x2="0.7" y2="0.5">
