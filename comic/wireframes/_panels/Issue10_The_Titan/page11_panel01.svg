  <g font-family="Courier New, monospace" fill="#f4d090" opacity="0.95">
    <text x="350" y="114" font-size="3.6">FIELD</text>
    <text x="390" y="114" font-size="3.6">SIGNAL</text>
    <text x="350" y="154" font-size="3.6">COUNTER</text>
    <text x="406" y="154" font-size="3.6">PULSE</text>
    <text x="380" y="138" text-anchor="middle" font-size="3.4" opacity="0.7">if A → carry → B?</text>
    <text x="380" y="174" text-anchor="middle" font-size="4" font-weight="700">SOLUTION ▓░</text>
  </g>

