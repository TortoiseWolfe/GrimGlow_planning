    <line x1="320" y1="120" x2="440" y2="120" stroke="#f4d090" stroke-width="0.5" opacity="0.45"/>
    <line x1="320" y1="140" x2="440" y2="140" stroke="#f4d090" stroke-width="0.5" opacity="0.65"/>
    <line x1="320" y1="160" x2="440" y2="160" stroke="#f4d090" stroke-width="0.5" opacity="0.55"/>
    <line x1="320" y1="180" x2="440" y2="180" stroke="#f4d090" stroke-width="0.5" opacity="0.45"/>
