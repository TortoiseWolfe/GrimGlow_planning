    <path d="M 400 226 Q 406 232 410 240 L 406 244 Q 400 240 394 232 Z" fill="url(#copperFigW1)" stroke="#3a1f0a" stroke-width="0.4"/>

    <line x1="356" y1="240" x2="320" y2="244" stroke="#5a2e10" stroke-width="0.5"/>
    <line x1="356" y1="242" x2="324" y2="246" stroke="#5a2e10" stroke-width="0.5"/>
    <line x1="404" y1="240" x2="438" y2="240" stroke="#5a2e10" stroke-width="0.5"/>
