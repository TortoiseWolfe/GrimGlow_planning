<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 11 Panel 1 — Wren builds, "if the wires can carry the field, they can carry a counter-pulse"</title>
  <desc>Medium close-up tracking. Wren away from main fight crouching behind desk far end. Not fighting — building. Copper-gold interface flickers fragments. Floor: telegraph wire, brass connector from disassembled instrument, tools from suit kit. She's the one who will end this. Total focus.</desc>
  <defs>
