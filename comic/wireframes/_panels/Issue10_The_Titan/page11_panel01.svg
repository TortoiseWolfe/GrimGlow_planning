  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="320" height="32" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="2 1"/>
    <text x="148" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#a85820" font-weight="700" font-style="italic">WREN: "Disruption field on the same frequency</text>
    <text x="148" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">as the telegraph signal..."</text>
    <text x="148" y="29" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#a85820" font-weight="700">"Wires carry field. Carry counter-pulse."</text>
