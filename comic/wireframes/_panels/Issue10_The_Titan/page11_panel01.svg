    <line x1="60" y1="100" x2="100" y2="120" stroke="#dc4540" stroke-width="0.5" opacity="0.55"/>
    <line x1="80" y1="160" x2="100" y2="200" stroke="#dc4540" stroke-width="0.4" opacity="0.5"/>
  </g>
