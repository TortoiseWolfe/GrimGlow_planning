      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="amberFlickP2" cx="0.85" cy="0.15" r="0.4">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperGoldP2" cx="0.4" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#15110a" stop-opacity="0"/>
