<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 4 Panel 2 — Wren on the desk, "This is integration. Improved it."</title>
  <desc>Medium low angle Victorian telegraph machine on desk. Tiny figure standing on desk surface examining it. Wren's scanner copper-gold across mechanisms. Telegraph extensively modified — alien components throughout, dark iridescence in standard brass and copper. Sophisticated integration not destruction. Growing alarm.</desc>
