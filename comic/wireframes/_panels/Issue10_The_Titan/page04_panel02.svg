      <stop offset="1" stop-color="#5a3818"/>
    </linearGradient>
    <linearGradient id="brassDarkP2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="alienVeinP2" x1="0" y1="0" x2="1" y2="0">
