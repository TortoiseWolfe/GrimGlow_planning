<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 1 Panel 3 — Sable apart, "Extraction route?"</title>
  <desc>Medium shot Sable apart arms crossed watching Wren brief. Letting Wren lead. Costs her — captain who has ceded operational authority because she has to. Present, engaged, not undermining. Mask different now — not hiding secret, trying to rebuild trust. Captain on probation.</desc>
