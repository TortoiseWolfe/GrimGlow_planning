<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 2 Panel 2 — Jink in flight, "I have eyes on the target"</title>
  <desc>Close-up slight high angle Jink hovering above Victorian roofline. Wing-pack deployed at reduced power — geometric emerald lattice dimmer. Below: telegraph office, "EASTERN TELEGRAPH COMPANY" faded gold lettering, single ground-floor window lit warm amber. Operational seriousness. Reckless grin gone.</desc>
  <defs>
    <linearGradient id="bgN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2c"/>
      <stop offset="0.5" stop-color="#15110a"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="moonN2" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#2a3848" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlowN2" cx="0.5" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rooflineN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="bldgN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3828"/>
      <stop offset="0.5" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="emeraldDimN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8858"/>
      <stop offset="0.5" stop-color="#2e7048"/>
      <stop offset="1" stop-color="#142e1f"/>
    </linearGradient>
    <linearGradient id="hairGoldN2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b020"/>
      <stop offset="0.5" stop-color="#a87820"/>
      <stop offset="1" stop-color="#5a3810"/>
    </linearGradient>
    <linearGradient id="faceLitJ_N2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="wingLatticeN2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa868" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f4a30" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="eyeFocusN2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#5acc88" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5acc88" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomN2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowN2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softN2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="260" fill="url(#bgN2)"/>
  <rect width="366" height="260" fill="url(#moonN2)"/>
  <rect width="366" height="260" fill="url(#windowGlowN2)"/>

  <g>
    <path d="M 0 200 L 80 196 L 100 180 L 200 178 L 220 196 L 366 200 L 366 260 L 0 260 Z" fill="url(#rooflineN2)"/>
    <path d="M 0 200 L 366 200 L 366 260 L 0 260 Z" fill="url(#bldgN2)" opacity="0.85"/>
    <line x1="0" y1="220" x2="366" y2="220" stroke="#0e0805" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="240" x2="366" y2="240" stroke="#0e0805" stroke-width="0.5" opacity="0.85"/>
  </g>

  <g>
    <rect x="100" y="226" width="40" height="22" rx="1" fill="#1a1008"/>
    <rect x="220" y="226" width="40" height="22" rx="1" fill="#1a1008"/>
    <rect x="160" y="226" width="44" height="22" rx="1" fill="#080404"/>
  </g>
  <g opacity="0.95" filter="url(#strongGlowN2)">
    <rect x="160" y="226" width="44" height="22" fill="#f4c878" opacity="0.55"/>
  </g>
  <g>
    <rect x="162" y="228" width="40" height="18" fill="#f4c878" opacity="0.85"/>
    <line x1="182" y1="228" x2="182" y2="246" stroke="#a85820" stroke-width="0.5"/>
    <line x1="162" y1="237" x2="202" y2="237" stroke="#a85820" stroke-width="0.5"/>
  </g>

  <g opacity="0.85">
    <text x="183" y="220" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#a87838" font-weight="700" letter-spacing="0.6">EASTERN TELEGRAPH</text>
    <text x="183" y="226" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.5" fill="#a87838" letter-spacing="0.5">COMPANY</text>
  </g>

  <g opacity="0.75">
    <line x1="40" y1="190" x2="100" y2="180" stroke="#040608" stroke-width="0.6"/>
    <line x1="100" y1="180" x2="200" y2="178" stroke="#040608" stroke-width="0.6"/>
    <line x1="200" y1="178" x2="320" y2="186" stroke="#040608" stroke-width="0.6"/>
    <line x1="100" y1="180" x2="180" y2="186" stroke="#040608" stroke-width="0.5"/>
    <line x1="180" y1="186" x2="280" y2="178" stroke="#040608" stroke-width="0.5"/>
    <line x1="120" y1="184" x2="240" y2="180" stroke="#040608" stroke-width="0.4"/>
    <circle cx="100" cy="180" r="1" fill="#0a0808"/>
    <circle cx="200" cy="178" r="1" fill="#0a0808"/>
  </g>

  <g>
    <path d="M 130 50 Q 100 40 80 60 Q 76 80 92 90 Q 110 92 130 90 Z" fill="url(#wingLatticeN2)" opacity="0.85"/>
    <g stroke="#3aa868" stroke-width="0.4" opacity="0.7">
      <line x1="92" y1="90" x2="98" y2="60"/>
      <line x1="92" y1="90" x2="112" y2="56"/>
      <line x1="92" y1="90" x2="124" y2="68"/>
      <line x1="92" y1="90" x2="128" y2="80"/>
      <line x1="92" y1="68" x2="120" y2="74"/>
      <line x1="100" y1="56" x2="120" y2="80"/>
    </g>
    <path d="M 240 60 Q 270 50 290 70 Q 294 90 278 100 Q 260 102 240 100 Z" fill="url(#wingLatticeN2)" opacity="0.85"/>
    <g stroke="#3aa868" stroke-width="0.4" opacity="0.7">
      <line x1="278" y1="100" x2="272" y2="70"/>
      <line x1="278" y1="100" x2="258" y2="66"/>
      <line x1="278" y1="100" x2="246" y2="78"/>
      <line x1="278" y1="100" x2="242" y2="90"/>
      <line x1="278" y1="78" x2="250" y2="84"/>
      <line x1="270" y1="66" x2="250" y2="90"/>
    </g>
  </g>

  <g>
    <path d="M 158 68 Q 152 86 158 110 Q 168 134 184 138 Q 202 134 212 122 Q 218 100 214 78 Q 204 64 184 62 Q 168 64 158 68 Z" fill="url(#faceLitJ_N2)" opacity="0.95"/>
  </g>

  <g opacity="0.85" filter="url(#strongGlowN2)">
    <ellipse cx="170" cy="50" rx="32" ry="16" fill="#d8b020"/>
    <ellipse cx="200" cy="48" rx="28" ry="14" fill="#d8b020"/>
  </g>
  <g>
    <path d="M 130 64 Q 140 40 165 32 Q 190 26 215 28 Q 240 30 252 50 Q 256 68 250 78 L 234 80 Q 244 60 220 50 Q 200 46 180 50 Q 160 56 150 70 Z" fill="url(#hairGoldN2)"/>
    <ellipse cx="135" cy="56" rx="10" ry="14" fill="url(#hairGoldN2)" transform="rotate(-25 135 56)"/>
    <ellipse cx="248" cy="56" rx="10" ry="12" fill="url(#hairGoldN2)" transform="rotate(20 248 56)"/>
    <ellipse cx="156" cy="34" rx="10" ry="6" fill="url(#hairGoldN2)" transform="rotate(-30 156 34)"/>
    <ellipse cx="220" cy="32" rx="10" ry="6" fill="url(#hairGoldN2)" transform="rotate(30 220 32)"/>
    <ellipse cx="186" cy="28" rx="14" ry="6" fill="url(#hairGoldN2)"/>
  </g>

  <g>
    <ellipse cx="172" cy="92" rx="6" ry="3" fill="#0a0604"/>
    <ellipse cx="200" cy="91" rx="6.5" ry="3" fill="#0a0604"/>
    <circle cx="172" cy="92" r="2" fill="#1a3658"/>
    <circle cx="200" cy="91" r="2.2" fill="#1a3658"/>
    <circle cx="173" cy="91" r="0.9" fill="url(#eyeFocusN2)"/>
    <circle cx="201" cy="90" r="1" fill="url(#eyeFocusN2)"/>
  </g>

  <g stroke="#5a3818" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 162 86 Q 172 82 184 86"/>
    <path d="M 188 84 Q 200 80 214 84"/>
  </g>

  <path d="M 184 96 Q 182 108 184 116" stroke="#0a0604" stroke-width="0.7" fill="none" opacity="0.7"/>

  <g>
    <path d="M 174 122 L 196 122" stroke="#0a0604" stroke-width="1.1"/>
  </g>

  <g>
    <path d="M 144 134 Q 156 144 184 144 Q 212 144 224 134 L 224 156 Q 200 156 184 156 Q 168 156 144 156 Z" fill="url(#emeraldDimN2)"/>
    <path d="M 154 136 L 154 148" stroke="#1f4a30" stroke-width="0.8"/>
    <path d="M 214 136 L 214 148" stroke="#1f4a30" stroke-width="0.8"/>
  </g>

  <g opacity="0.85">
    <path d="M 130 52 Q 110 60 92 90" stroke="#3aa868" stroke-width="0.4" fill="none"/>
    <path d="M 240 52 Q 260 60 278 100" stroke="#3aa868" stroke-width="0.4" fill="none"/>
  </g>

  <g opacity="0.55">
    <circle cx="60" cy="40" r="0.6" fill="#a8c0e0"/>
    <circle cx="320" cy="50" r="0.7" fill="#a8c0e0"/>
    <circle cx="200" cy="20" r="0.6" fill="#a8c0e0"/>
    <circle cx="120" cy="20" r="0.5" fill="#7088a8"/>
    <circle cx="280" cy="30" r="0.5" fill="#7088a8"/>
  </g>

  <g transform="translate(180,164)">
    <rect x="-8" y="0" width="170" height="34" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="76" y="13" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.6" fill="#3a8858" font-weight="700">JINK (comms):</text>
    <text x="76" y="25" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">"Eyes on target. One light,</text>
    <text x="76" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#2a2a2a" font-style="italic">ground floor. Operator's at the key."</text>
  </g>
</svg>
