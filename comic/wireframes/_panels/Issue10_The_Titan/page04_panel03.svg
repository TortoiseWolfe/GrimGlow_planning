    </radialGradient>
    <linearGradient id="doorframeP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="floorP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.5" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="faceLitT_P3" x1="0" y1="0" x2="0.6" y2="0.5">
      <stop offset="0" stop-color="#3a2828"/>
      <stop offset="0.5" stop-color="#5a3838"/>
