    <ellipse cx="184" cy="180" rx="1.4" ry="2" fill="#0a0604"/>
    <circle cx="177" cy="179" r="0.7" fill="url(#eyeFearP3)"/>
    <circle cx="185" cy="179" r="0.7" fill="url(#eyeFearP3)"/>
    <path d="M 174 188 L 186 188" stroke="#0a0604" stroke-width="1"/>
    <path d="M 162 198 L 198 198 L 204 240 L 156 240 Z" fill="url(#crimsonArmorP3)"/>
    <path d="M 162 206 L 198 206 L 198 226 L 162 226 Z" fill="#1a0606"/>
    <path d="M 156 212 L 144 240" stroke="url(#crimsonArmorP3)" stroke-width="3"/>
