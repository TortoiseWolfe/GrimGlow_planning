<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 260" width="366" height="260">
  <title>Issue 10 Page 4 Panel 3 — Thresh covers the far doorway, "Something in the back room"</title>
  <desc>Medium close-up Thresh near doorway far end of room, weapon raised sweeping dark space beyond. White-knuckle grip. Beyond doorway: near-total darkness, deeper than absence of light, faint shimmer at edges like cold heat haze. Gas lamps near doorway barely functioning — light dies as it approaches.</desc>
  <defs>
    <linearGradient id="bgP3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="0.7" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberDyingP3" cx="0.05" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="darknessActiveP3" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#040206" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#080404" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coldShimmerP3" cx="0.7" cy="0.45" r="0.25">
