    <text x="320" y="222" text-anchor="middle" font-family="Times New Roman, serif" font-size="6.5" fill="#1a0a04" font-weight="700" transform="rotate(-6 320 222)">MYSTERIOUS LIGHTS</text>
    <text x="320" y="232" text-anchor="middle" font-family="Times New Roman, serif" font-size="5" fill="#3a2410" font-style="italic" transform="rotate(-6 320 232)">REPORTED IN CLERKENWELL</text>
