<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 19 Panel 4 — Newspaper boy, "TELEGRAPH DEMON" and "MYSTERIOUS LIGHTS" side by side</title>
  <desc>Wide morning Victorian newspaper boy on street corner holding up copies of morning edition calling headlines. Front page partially visible: large headline TELEGRAPH DEMON TERRORISES THREADNEEDLE STREET, smaller article below MYSTERIOUS LIGHTS REPORTED IN CLERKENWELL. Both stories on same page. Two mythologies side by side. Newspaper boy shouts with routine enthusiasm unaware of significance. Grey morning light, street waking up. The double mythology in print.</desc>
