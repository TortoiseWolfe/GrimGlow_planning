      <stop offset="0" stop-color="#5a6478"/>
      <stop offset="0.5" stop-color="#3a4858"/>
      <stop offset="1" stop-color="#1a1828"/>
    </linearGradient>
    <radialGradient id="overcastX4" cx="0.5" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#a8b0bc" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#5a6478" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1a1828" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cobbleX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4858"/>
      <stop offset="0.5" stop-color="#1a1828"/>
      <stop offset="1" stop-color="#0a0a14"/>
