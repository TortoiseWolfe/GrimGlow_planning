      <stop offset="0.5" stop-color="#e0d4b8"/>
      <stop offset="1" stop-color="#a89888"/>
    </linearGradient>
    <linearGradient id="newspaperShadX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8b898"/>
      <stop offset="1" stop-color="#7a6850"/>
    </linearGradient>
    <linearGradient id="capX4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4838"/>
      <stop offset="0.5" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a1008"/>
