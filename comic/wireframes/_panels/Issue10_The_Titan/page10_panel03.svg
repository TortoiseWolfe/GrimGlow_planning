      <stop offset="0.5" stop-color="#7a6048"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="paleSkinV3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b09a"/>
