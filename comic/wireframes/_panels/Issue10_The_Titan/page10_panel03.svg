      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="crimsonRecoverV3" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#8a2520" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.32"/>
