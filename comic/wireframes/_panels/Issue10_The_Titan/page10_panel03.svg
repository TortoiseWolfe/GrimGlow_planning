<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 10 Panel 3 — Thresh stands, "I'm scared. And I'm still here."</title>
  <desc>Medium low angle Thresh pulling herself upright against massive desk leg, one hand braced, other keeps rifle aimed. Damaged armor pauldron crushed chest cracked, telegraph tape draped like paper cloak. Blood from cut. Holographic edge-lighting flickers back partial. Fear and determination coexisting. Upright. Afraid. Fighting.</desc>
