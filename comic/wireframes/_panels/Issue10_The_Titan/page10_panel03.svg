    <text x="108" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#8a2520" font-weight="700">THRESH: "I'm scared.</text>
    <text x="108" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5a1810" font-weight="700">And I'm still here."</text>
