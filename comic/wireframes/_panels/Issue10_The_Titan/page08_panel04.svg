<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 240" width="246" height="240">
  <title>Issue 10 Page 8 Panel 4 — Luma's cracked lens, "frequency-targeted. It knows what we are."</title>
  <desc>Close-up Luma against baseboard, scanner arm extended but display dead. One holographic lens cracked further. Through remaining lens she sees the EM field — visual representation of disruption, like standing inside storm of wrong frequencies. Faint distorted sapphire from cracked lens — only fairy light.</desc>
  <defs>
    <linearGradient id="bgT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="violetCrackT4" cx="0.45" cy="0.45" r="0.4">
      <stop offset="0" stop-color="#7848b8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a1a5a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="baseboardT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="violetSuitDimT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a5a"/>
      <stop offset="0.5" stop-color="#1a0e2e"/>
      <stop offset="1" stop-color="#0a0610"/>
    </linearGradient>
    <linearGradient id="faceLitL_T4" x1="0" y1="0" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="hairBlkT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="0.5" stop-color="#1a1414"/>
      <stop offset="1" stop-color="#2a1818"/>
    </linearGradient>
    <linearGradient id="scannerArmT4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a5a"/>
      <stop offset="0.5" stop-color="#1a0e2e"/>
      <stop offset="1" stop-color="#0a0610"/>
    </linearGradient>
    <radialGradient id="eyeFrustT4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a878d0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a878d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomT4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="distortBlurT4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="softT4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="246" height="240" fill="url(#bgT4)"/>
  <rect width="246" height="240" fill="url(#violetCrackT4)"/>

  <g>
    <rect x="0" y="200" width="246" height="40" fill="url(#baseboardT4)"/>
    <line x1="0" y1="212" x2="246" y2="212" stroke="#0e0805" stroke-width="0.6"/>
    <line x1="0" y1="220" x2="246" y2="220" stroke="#3a2818" stroke-width="0.4" opacity="0.5"/>
  </g>

  <g>
    <rect x="0" y="0" width="20" height="200" fill="#3a2418"/>
    <line x1="20" y1="0" x2="20" y2="200" stroke="#0e0805" stroke-width="0.6"/>
  </g>

  <g>
    <path d="M 70 80 Q 60 100 70 130 Q 80 158 100 174 Q 124 184 150 184 Q 174 178 188 162 Q 196 138 192 110 Q 184 90 168 76 Q 144 70 122 72 Q 90 80 70 80 Z" fill="url(#faceLitL_T4)" opacity="0.95"/>
  </g>

  <g>
    <path d="M 60 76 Q 76 60 122 56 Q 168 56 188 66 Q 200 80 198 100 L 192 110 Q 182 84 162 74 Q 130 70 102 76 Q 80 82 76 92 Z" fill="url(#hairBlkT4)"/>
    <path d="M 124 64 Q 128 90 132 130 Q 134 170 130 200" stroke="url(#hairBlkT4)" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <g opacity="0.55" filter="url(#distortBlurT4)">
    <ellipse cx="116" cy="120" rx="20" ry="14" fill="#7848b8" opacity="0.55"/>
    <line x1="98" y1="116" x2="138" y2="116" stroke="#a878d0" stroke-width="0.5" opacity="0.55"/>
    <line x1="98" y1="124" x2="138" y2="124" stroke="#a878d0" stroke-width="0.5" opacity="0.55"/>
  </g>
  <g>
    <rect x="98" y="108" width="38" height="24" rx="2" fill="none" stroke="#a878d0" stroke-width="0.7" opacity="0.92"/>
    <path d="M 98 108 L 110 132" stroke="#3a1a5a" stroke-width="1" opacity="0.85"/>
    <path d="M 110 132 L 122 110" stroke="#3a1a5a" stroke-width="0.7" opacity="0.7"/>
    <line x1="100" y1="120" x2="138" y2="120" stroke="#a878d0" stroke-width="0.5" opacity="0.65"/>
    <text x="118" y="124" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#a878d0" opacity="0.6">▓░ FREQ ░▓</text>
  </g>

  <g opacity="0.7" filter="url(#distortBlurT4)">
    <path d="M 110 116 L 124 128 L 116 124" stroke="#a878d0" stroke-width="0.5" fill="none" opacity="0.5"/>
  </g>

  <g opacity="0.4" filter="url(#bloomT4)">
    <rect x="146" y="108" width="38" height="24" fill="#1a0e2e" opacity="0.55"/>
    <text x="165" y="124" text-anchor="middle" font-family="Courier New, monospace" font-size="3.4" fill="#3a1a5a">[ DEAD ]</text>
  </g>
  <g>
    <rect x="146" y="108" width="38" height="24" rx="2" fill="none" stroke="#3a1a5a" stroke-width="0.6" opacity="0.7"/>
  </g>

  <g>
    <ellipse cx="108" cy="124" rx="9" ry="4" fill="#0a0604"/>
    <ellipse cx="156" cy="122" rx="10" ry="4.5" fill="#0a0604"/>
    <circle cx="108" cy="124" r="3" fill="#1a0e2e"/>
    <circle cx="156" cy="122" r="3.4" fill="#1a0e2e"/>
    <circle cx="110" cy="123" r="1.4" fill="url(#eyeFrustT4)"/>
    <circle cx="158" cy="121" r="1.6" fill="url(#eyeFrustT4)"/>
  </g>

  <g stroke="#0a0604" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M 92 114 Q 108 108 124 114"/>
    <path d="M 142 112 Q 156 106 174 114"/>
  </g>

  <path d="M 132 130 Q 128 150 132 166" stroke="#0a0604" stroke-width="1" fill="none" opacity="0.7"/>

  <g>
    <path d="M 110 178 L 154 178" stroke="#0a0604" stroke-width="1.4"/>
  </g>

  <g>
    <path d="M 30 196 L 218 192 L 222 240 L 22 240 Z" fill="url(#violetSuitDimT4)"/>
    <path d="M 60 192 L 110 196 L 140 196 L 196 192 L 196 220 L 60 220 Z" fill="#1a0e2e" opacity="0.85"/>
    <rect x="200" y="194" width="36" height="14" fill="url(#scannerArmT4)" stroke="#0a0610" stroke-width="0.4"/>
    <rect x="204" y="198" width="28" height="6" fill="#0a0610"/>
  </g>
  <g opacity="0.4" filter="url(#bloomT4)">
    <ellipse cx="218" cy="201" rx="14" ry="3" fill="#7848b8" opacity="0.4"/>
  </g>
  <g opacity="0.55">
    <text x="218" y="204" text-anchor="middle" font-family="Courier New, monospace" font-size="3" fill="#3a1a5a">[ NULL ]</text>
  </g>

  <g opacity="0.85">
    <path d="M 196 212 L 220 212" stroke="#3a1a5a" stroke-width="0.5" stroke-linecap="round"/>
    <circle cx="200" cy="212" r="0.5" fill="#a878d0"/>
    <circle cx="216" cy="212" r="0.5" fill="#a878d0"/>
  </g>

  <g opacity="0.7">
    <ellipse cx="76" cy="208" rx="5" ry="1.6" fill="#0a0418"/>
    <ellipse cx="180" cy="208" rx="5" ry="1.6" fill="#0a0418"/>
  </g>
  <g opacity="0.5" filter="url(#bloomT4)">
    <circle cx="50" cy="208" r="2" fill="#a878d0" opacity="0.5"/>
    <circle cx="120" cy="218" r="1.6" fill="#a878d0" opacity="0.4"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#7848b8" font-weight="700">LUMA: "Frequency-targeted.</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">It knows what we are."</text>
  </g>
</svg>
