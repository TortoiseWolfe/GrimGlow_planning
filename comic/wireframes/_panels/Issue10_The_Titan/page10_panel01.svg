<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 10 Panel 1 — Thresh's impact, the fall before the rise</title>
  <desc>Medium wide ground level. Thresh's impact at base of desk hard. Armor brunt — left pauldron crushed inward, chest cracked. Lies dazed weapon still in hand. Telegraph tape spilled in enormous paper ribbons over her like streamers. Blood from cut above eye. Then hand tightens on rifle. Jaw sets.</desc>
  <defs>
    <linearGradient id="bgV1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="crimsonFlickV1" cx="0.5" cy="0.55" r="0.4">
      <stop offset="0" stop-color="#5a1810" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2a0808" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorWoodV1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.4" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="deskFootV1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="paperTapeV1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8868"/>
      <stop offset="0.5" stop-color="#5a4838"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="crimsonDamagedV1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1810"/>
      <stop offset="0.5" stop-color="#3a0e08"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <linearGradient id="hairBuzzV1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3018"/>
      <stop offset="0.5" stop-color="#5a2010"/>
      <stop offset="1" stop-color="#2a1008"/>
    </linearGradient>
    <linearGradient id="paleSkinV1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87878"/>
      <stop offset="0.5" stop-color="#7a5050"/>
      <stop offset="1" stop-color="#3a2828"/>
    </linearGradient>
    <linearGradient id="rifleV1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="bloodCutV1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5a1810" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a1810" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomV1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowV1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="softV1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="742" height="260" fill="url(#bgV1)"/>
  <rect width="742" height="260" fill="url(#crimsonFlickV1)"/>

  <g>
    <rect x="0" y="100" width="742" height="160" fill="url(#floorWoodV1)"/>
    <line x1="0" y1="120" x2="742" y2="118" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="140" x2="742" y2="138" stroke="#3a2818" stroke-width="0.4" opacity="0.85"/>
    <line x1="0" y1="160" x2="742" y2="158" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="180" x2="742" y2="178" stroke="#3a2818" stroke-width="0.4" opacity="0.85"/>
    <line x1="0" y1="200" x2="742" y2="198" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="226" x2="742" y2="224" stroke="#3a2818" stroke-width="0.4" opacity="0.75"/>
    <line x1="0" y1="248" x2="742" y2="246" stroke="#3a2818" stroke-width="0.5" opacity="0.75"/>
  </g>

  <g>
