    <rect x="80" y="40" width="20" height="60" fill="#1a1008"/>
    <rect x="100" y="60" width="60" height="40" fill="#1a1008"/>
    <rect x="60" y="80" width="20" height="20" fill="#1a1008"/>

    <rect x="660" y="0" width="82" height="100" fill="url(#deskFootV1)"/>
    <rect x="640" y="40" width="20" height="60" fill="#1a1008"/>
  </g>

  <g>
    <path d="M 80 60 Q 200 70 360 90 Q 480 110 600 130 Q 700 150 742 160 L 742 180 Q 700 168 600 150 Q 480 134 360 124 Q 200 110 80 100 Z" fill="url(#paperTapeV1)" opacity="0.85"/>
    <path d="M 80 100 L 100 120 L 120 130 L 200 150" stroke="url(#paperTapeV1)" stroke-width="14" fill="none" opacity="0.85"/>
    <path d="M 200 150 Q 280 170 360 180" stroke="url(#paperTapeV1)" stroke-width="12" fill="none" opacity="0.85"/>
    <line x1="100" y1="80" x2="120" y2="100" stroke="#5a4838" stroke-width="0.4" opacity="0.6"/>
    <line x1="200" y1="100" x2="220" y2="120" stroke="#5a4838" stroke-width="0.4" opacity="0.6"/>
    <line x1="500" y1="124" x2="520" y2="138" stroke="#5a4838" stroke-width="0.4" opacity="0.6"/>
  </g>

  <g>
    <ellipse cx="380" cy="200" rx="70" ry="22" fill="url(#crimsonDamagedV1)"/>
    <path d="M 312 200 L 320 180 Q 340 172 380 174 Q 420 176 440 184 L 448 200 L 446 220 L 380 226 L 314 222 Z" fill="url(#crimsonDamagedV1)"/>
    <path d="M 320 180 Q 340 168 380 170 Q 420 174 440 184" fill="#1a0606" opacity="0.85"/>

    <path d="M 320 180 L 312 174 L 308 188 L 314 200 Z" fill="#3a0e08"/>
    <path d="M 318 178 L 312 172 L 310 178 L 314 184 L 320 184 Z" fill="#1a0606"/>

    <path d="M 350 178 L 380 174 L 410 178 L 408 196 L 380 198 L 350 196 Z" fill="#1a0606" opacity="0.85"/>
    <path d="M 360 180 L 400 184" stroke="#5a1810" stroke-width="0.6" opacity="0.7"/>
    <path d="M 365 184 L 395 188" stroke="#5a1810" stroke-width="0.5" opacity="0.6"/>
  </g>

  <g>
    <ellipse cx="380" cy="148" rx="14" ry="16" fill="url(#paleSkinV1)"/>
    <path d="M 366 138 L 366 132 Q 380 126 394 126 Q 398 138 394 144 Q 388 134 380 134 Q 372 134 368 144 Z" fill="url(#hairBuzzV1)"/>

    <path d="M 386 134 Q 388 138 386 144" stroke="#dc4540" stroke-width="1.2" fill="none"/>
    <path d="M 386 144 Q 384 152 388 158" stroke="#dc4540" stroke-width="1" fill="none"/>
  </g>
  <g opacity="0.85" filter="url(#bloomV1)">
    <ellipse cx="386" cy="138" rx="3" ry="2" fill="url(#bloodCutV1)"/>
  </g>
  <g opacity="0.95">
    <ellipse cx="386" cy="138" rx="1.4" ry="0.8" fill="#a83830"/>
  </g>

  <g>
    <ellipse cx="376" cy="148" rx="9" ry="3.5" fill="#0a0604"/>
    <ellipse cx="384" cy="148" rx="3" ry="2" fill="#080404"/>
  </g>

  <g stroke="#0a0604" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M 366 142 Q 380 138 394 142"/>
    <path d="M 372 156 L 388 156"/>
  </g>

  <g>
    <rect x="440" y="194" width="80" height="10" fill="url(#rifleV1)" transform="rotate(15 440 194)"/>
    <rect x="440" y="194" width="80" height="2" fill="#3a3a3a" opacity="0.6" transform="rotate(15 440 194)"/>
    <rect x="440" y="202" width="80" height="2" fill="#040404" opacity="0.85" transform="rotate(15 440 194)"/>
    <rect x="514" y="192" width="6" height="14" fill="#040404" transform="rotate(15 440 194)"/>
  </g>

  <g>
    <path d="M 432 196 Q 442 198 446 204 L 442 210 L 434 206 Z" fill="url(#paleSkinV1)" stroke="#5a3838" stroke-width="0.4"/>
  </g>

  <g opacity="0.6" filter="url(#strongGlowV1)">
    <circle cx="316" cy="200" r="2.5" fill="#dc4540"/>
    <circle cx="446" cy="200" r="2" fill="#dc4540" opacity="0.65"/>
  </g>
  <g opacity="0.4" filter="url(#strongGlowV1)">
    <circle cx="380" cy="218" r="2" fill="#dc4540" opacity="0.5"/>
  </g>

  <g opacity="0.45">
    <ellipse cx="240" cy="240" rx="60" ry="6" fill="#040202"/>
    <ellipse cx="500" cy="240" rx="60" ry="6" fill="#040202"/>
  </g>

  <g opacity="0.55">
    <line x1="80" y1="100" x2="80" y2="240" stroke="#3a2818" stroke-width="0.4" opacity="0.65"/>
    <line x1="660" y1="100" x2="660" y2="240" stroke="#3a2818" stroke-width="0.4" opacity="0.65"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="92" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" fill="#5a6478" font-weight="700">SABLE: "Thresh! Report!"</text>
  </g>
