      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="impactFlashW3" cx="0.55" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f4d090" stop-opacity="0.65"/>
      <stop offset="0.4" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="0.8" stop-color="#5a2818" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonStrobeW3" cx="0.18" cy="0.65" r="0.3">
      <stop offset="0" stop-color="#dc4540" stop-opacity="0.45"/>
