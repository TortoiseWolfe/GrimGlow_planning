<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 240" width="494" height="240">
  <title>Issue 10 Page 11 Panel 3 — Telegraph machine smashes, Thresh dives, "THRESH! Move left!"</title>
  <desc>Wide action high angle. Machine crashed where Thresh stood. Thresh thrown sideways desperate combat roll as machine hits floor shatters. Brass shrapnel, wooden splinters, telegraph tape in coils. Thresh lands crouch weapon up, crimson edge-light strobing. Alive barely.</desc>
