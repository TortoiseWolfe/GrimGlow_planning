<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 13 Panel 3 — Squad fights together, "Gap in three... two... one — NOW!"</title>
  <desc>Wide low angle from behind squad. Four figures attack Titan multiple angles: Thresh+Sable forward firing weapons (silver-blue + crimson bolts), Jink swooping left sputtering emerald wings, Luma calling timing from cover with sapphire scanner. Titan one hand junction one hand sweeping. Coordinated unit fractured personally fused by combat.</desc>
