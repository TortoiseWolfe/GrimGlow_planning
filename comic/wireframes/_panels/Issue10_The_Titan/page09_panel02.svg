<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 260" width="246" height="260">
  <title>Issue 10 Page 9 Panel 2 — Wren analyzes, "Once it's in, the signal goes across the entire network"</title>
  <desc>Close-up Wren face. Watching Titan with analytical intensity. Recognizes connecting device to telegraph distribution hub. If completes, signal propagates across every wire in district. Engineer building solution while problem escalates. Amber-black glow on face. Faint copper-gold flicker.</desc>
  <defs>
    <linearGradient id="bgU2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberFaceU2" cx="0.55" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#5a2818" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperFlickU2" cx="0.5" cy="0.85" r="0.3">
      <stop offset="0" stop-color="#d88838" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a2e10" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLitW_U2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e08"/>
      <stop offset="0.4" stop-color="#3a261a"/>
      <stop offset="0.8" stop-color="#7a4830"/>
      <stop offset="1" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="hairBlkU2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0808"/>
      <stop offset="1" stop-color="#2a1e1a"/>
    </linearGradient>
    <linearGradient id="copperSuitU2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85820"/>
      <stop offset="0.5" stop-color="#7a3e18"/>
      <stop offset="1" stop-color="#3a1f0a"/>
    </linearGradient>
    <radialGradient id="eyeAnalU2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f4b860" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomU2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="strongGlowU2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softU2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="246" height="260" fill="url(#bgU2)"/>
  <rect width="246" height="260" fill="url(#amberFaceU2)"/>
  <rect width="246" height="260" fill="url(#copperFlickU2)"/>

  <g>
