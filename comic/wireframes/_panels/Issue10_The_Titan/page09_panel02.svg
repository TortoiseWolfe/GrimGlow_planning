  <g>
    <path d="M 78 80 Q 70 100 76 124 Q 84 152 100 168 Q 122 178 146 178 Q 170 174 184 158 Q 192 134 190 100 Q 184 80 168 66 Q 144 60 122 62 Q 94 70 78 80 Z" fill="url(#faceLitW_U2)" opacity="0.95"/>
