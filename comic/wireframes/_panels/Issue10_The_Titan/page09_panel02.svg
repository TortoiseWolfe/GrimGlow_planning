    <ellipse cx="120" cy="216" rx="10" ry="3" fill="#d88838"/>
  </g>
  <g opacity="0.85">
    <circle cx="100" cy="210" r="0.8" fill="#d88838"/>
    <circle cx="140" cy="212" r="0.8" fill="#d88838"/>
    <circle cx="120" cy="220" r="0.7" fill="#d88838"/>
  </g>

  <g opacity="0.55" filter="url(#bloomU2)">
    <ellipse cx="123" cy="220" rx="40" ry="6" fill="#a85820" opacity="0.5"/>
  </g>

  <g transform="translate(20,228)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700">WREN: "Once it's in,</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">signal goes across the network."</text>
  </g>
