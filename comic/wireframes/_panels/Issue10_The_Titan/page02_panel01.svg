<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 2 Panel 1 — Night transit, Threadneedle Street, fairy-scale ground level</title>
  <desc>Wide low angle Victorian street at night ground level. Squad moves along base of building wall, shadows for cover. Gas lamp = lighthouse, doorstep = cliff face, telegraph wires overhead = ship rigging. Jink airborne emerald smear above. Others on foot. Warm amber gaslight casts long shadows.</desc>
  <defs>
    <linearGradient id="bgN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2c"/>
      <stop offset="0.4" stop-color="#252a36"/>
      <stop offset="0.7" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="lampGlowN1" cx="0.92" cy="0.25" r="0.4">
      <stop offset="0" stop-color="#f4c878" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#a85820" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonlightN1" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#5a78a8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2a3848" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#080404" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brickWallN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5238"/>
      <stop offset="0.5" stop-color="#5a3828"/>
      <stop offset="1" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="cobblestoneN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a3a"/>
      <stop offset="0.5" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="lampPostN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <radialGradient id="lampCoreN1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f4c878" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a85820" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomN1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowN1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="megaGlowN1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="motionTrailN1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="softN1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

