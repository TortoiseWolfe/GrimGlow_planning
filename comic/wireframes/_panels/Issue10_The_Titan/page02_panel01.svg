  </g>
  <g opacity="0.85">
    <path d="M 460 60 Q 480 58 500 58" stroke="#5acc88" stroke-width="2" fill="none"/>
    <ellipse cx="500" cy="58" rx="4" ry="3" fill="#3aa868"/>
    <path d="M 490 56 L 484 50" stroke="#5acc88" stroke-width="0.6"/>
    <path d="M 510 60 L 516 54" stroke="#5acc88" stroke-width="0.6"/>
