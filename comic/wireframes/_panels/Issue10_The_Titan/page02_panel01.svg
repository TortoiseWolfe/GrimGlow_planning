  <g opacity="0.95" filter="url(#strongGlowN1)">
    <circle cx="640" cy="51" r="11" fill="#ffe888"/>
  </g>
  <g>
    <ellipse cx="640" cy="51" rx="6" ry="9" fill="url(#lampCoreN1)"/>
  </g>

