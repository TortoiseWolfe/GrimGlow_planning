    <path d="M 170 44 L 160 24" stroke="#3a1a5a" stroke-width="0.5"/>
    <path d="M 228 44 L 218 22" stroke="#3a1a5a" stroke-width="0.5"/>
    <path d="M 280 50 L 270 28" stroke="#3a1a5a" stroke-width="0.5"/>
