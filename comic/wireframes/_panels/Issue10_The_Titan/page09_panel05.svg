    <line x1="0" y1="200" x2="366" y2="198" stroke="#3a2818" stroke-width="0.4" opacity="0.85"/>
    <line x1="0" y1="212" x2="366" y2="210" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
