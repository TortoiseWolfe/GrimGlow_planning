    <path d="M 278 210 L 290 230" stroke="url(#crimsonStuttU5)" stroke-width="3"/>
  </g>

  <g opacity="0.7" filter="url(#bloomU5)">
    <circle cx="208" cy="190" r="2" fill="#dc4540" opacity="0.55"/>
    <circle cx="296" cy="170" r="1.6" fill="#dc4540" opacity="0.4"/>
  </g>

  <g opacity="0.55">
    <text x="200" y="220" font-family="Courier New, monospace" font-size="3.4" fill="#5a1810" opacity="0.55">▓░ . ░▓</text>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="100" height="20" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="42" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7" fill="#5a4a30" font-style="italic">[silence]</text>
  </g>
</svg>
