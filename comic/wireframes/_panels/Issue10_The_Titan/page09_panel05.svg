<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 9 Panel 5 — Titan swats, dismissive contempt</title>
  <desc>Close-up slight high angle Titan's multi-jointed hand sweeps downward — dismissive gesture not targeted attack. Hand enormous dark-surfaced iridescent edges. Below tiny figure crimson tumbles backward from air displacement alone, rolling, armor scraping wood grain. Crimson edge-lighting stutters. Hand returns to work. Insect.</desc>
  <defs>
    <linearGradient id="bgU5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="iridSweepU5" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#3a1a5a" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#1a0e2e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorU5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.4" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="alienHandU5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="0.5" stop-color="#040206"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <linearGradient id="iridFingerU5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1a5a" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7848b8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1a0e2e" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="crimsonStuttU5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a1810"/>
      <stop offset="0.5" stop-color="#3a0e08"/>
      <stop offset="1" stop-color="#1a0606"/>
    </linearGradient>
    <filter id="bloomU5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlowU5" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="iridShimU5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="motionTumbleU5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softU5" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgU5)"/>
  <rect width="366" height="240" fill="url(#iridSweepU5)"/>

