<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 1 Panel 1 — Dusk camp, the depleted state, "Component run — copper induction coil"</title>
  <desc>Wide establishing slightly elevated. Wall cavity camp at dusk. Equipment more improvised than before. Power cell dimmer. Wall gap shows amber gaslight, casts warm wedge across beams. Squad at positions physically present but spatially separated — Issue 9 aftermath visible in the gaps. Wren center with copper-gold schematic.</desc>
