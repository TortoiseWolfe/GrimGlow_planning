      <stop offset="0.4" stop-color="#251f15"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="duskAmberM1" cx="0.92" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d8a868" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#a87838" stop-opacity="0.28"/>
