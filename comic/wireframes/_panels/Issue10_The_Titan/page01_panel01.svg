    <text x="180" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-style="italic" font-size="9" fill="#5a4a30">"Dusk. Component run — copper induction coil."</text>
    <text x="180" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#a85820" font-weight="700" text-anchor="middle">WREN: "Telegraph station, Threadneedle. Night shift leaves at eleven."</text>
