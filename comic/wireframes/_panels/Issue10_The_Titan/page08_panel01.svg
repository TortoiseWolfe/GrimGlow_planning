    <path d="M 320 100 L 340 92 L 354 106 L 334 116 Z" fill="url(#paperCascadeT1)" opacity="0.6" transform="rotate(-15 334 106)"/>
    <path d="M 600 100 L 620 92 L 634 106 L 614 116 Z" fill="url(#paperCascadeT1)" opacity="0.6" transform="rotate(25 614 106)"/>
    <path d="M 460 60 L 480 52 L 494 66 L 474 76 Z" fill="url(#paperCascadeT1)" opacity="0.55" transform="rotate(-30 474 66)"/>
    <path d="M 80 80 L 100 72 L 114 86 L 94 96 Z" fill="url(#paperCascadeT1)" opacity="0.55" transform="rotate(15 94 86)"/>
