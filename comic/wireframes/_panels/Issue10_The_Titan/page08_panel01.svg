    <line x1="376" y1="174" x2="372" y2="200" stroke="url(#crimsonHoldT1)" stroke-width="2.5"/>
    <line x1="384" y1="174" x2="388" y2="200" stroke="url(#crimsonHoldT1)" stroke-width="2.5"/>
    <line x1="370" y1="200" x2="368" y2="220" stroke="#1a0606" stroke-width="2"/>
    <line x1="390" y1="200" x2="392" y2="220" stroke="#1a0606" stroke-width="2"/>
