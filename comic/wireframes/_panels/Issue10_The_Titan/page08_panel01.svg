    <linearGradient id="lampShatterT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3818"/>
      <stop offset="0.5" stop-color="#3a2010"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <filter id="bloomT1" x="-25%" y="-25%" width="150%" height="150%">
