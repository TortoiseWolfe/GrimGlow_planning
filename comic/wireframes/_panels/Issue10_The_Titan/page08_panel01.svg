    </filter>
    <filter id="strongGlowT1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="megaGlowT1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="shockBlurT1" x="-30%" y="-30%" width="160%" height="160%">
