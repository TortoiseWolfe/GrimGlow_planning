<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 260" width="742" height="260">
  <title>Issue 10 Page 8 Panel 1 — Disruption wave radiates, squad scattered, Thresh stands</title>
  <desc>Wide widescreen 10° dutch tilt. Chaos. Amber-black ring rippling outward shatters gas lamp. Telegraph tape cascades, papers blow. Squad scattered: Sable slides, Wren flat, Jink uncontrolled spin, Luma hits baseboard. Thresh stands, boots planted, leaning into blast.</desc>
  <defs>
    <linearGradient id="bgT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="shockwaveT1" cx="0.55" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#7a4818" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#3a1810" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iridShockEdgeT1" cx="0.55" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#020100" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3a1a5a" stop-opacity="0.32"/>
      <stop offset="0.75" stop-color="#7848b8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1008"/>
      <stop offset="0.5" stop-color="#0e0805"/>
      <stop offset="1" stop-color="#040202"/>
    </linearGradient>
    <linearGradient id="deskT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#1a1008"/>
      <stop offset="1" stop-color="#080404"/>
    </linearGradient>
    <linearGradient id="paperCascadeT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8868"/>
      <stop offset="0.5" stop-color="#5a4838"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="silverFlickT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e44"/>
      <stop offset="0.5" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="copperFlickT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2e10"/>
      <stop offset="0.5" stop-color="#3a1f0a"/>
      <stop offset="1" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="emeraldFlickT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7048"/>
      <stop offset="0.5" stop-color="#1f4a30"/>
      <stop offset="1" stop-color="#0a1f14"/>
    </linearGradient>
    <linearGradient id="violetFlickT1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a5a"/>
      <stop offset="0.5" stop-color="#1a0e2e"/>
      <stop offset="1" stop-color="#0a0610"/>
    </linearGradient>
    <linearGradient id="crimsonHoldT1" x1="0" y1="0" x2="0" y2="1">
