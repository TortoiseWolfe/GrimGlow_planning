    <line x1="0" y1="216" x2="366" y2="214" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
    <line x1="0" y1="232" x2="366" y2="230" stroke="#3a2818" stroke-width="0.4" opacity="0.85"/>
  </g>

