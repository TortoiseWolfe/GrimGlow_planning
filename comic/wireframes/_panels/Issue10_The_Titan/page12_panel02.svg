<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 10 Page 12 Panel 2 — Jink grounded, "Wing-pack is cooking"</title>
  <desc>Medium Jink crouched on desk among scattered telegraph tape brass components. Wing-pack collapsed thin trail acrid smoke from overtaxed mount. Breathing hard. Reckless grin faded to vulnerability. Post-adrenaline crash. Hair matted with sweat. New scoring along left flank.</desc>
  <defs>
    <linearGradient id="bgX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
    <radialGradient id="amberAmbX2" cx="0.85" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#a87838" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#5a3018" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldDyingX2" cx="0.5" cy="0.6" r="0.45">
      <stop offset="0" stop-color="#3a8858" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#1f4a30" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#020100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deskTopX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a20"/>
      <stop offset="0.4" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="paperScatterX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8868"/>
      <stop offset="0.5" stop-color="#5a4838"/>
      <stop offset="1" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="brassPartX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87838"/>
      <stop offset="0.5" stop-color="#5a3818"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="emeraldDamX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7048"/>
      <stop offset="0.5" stop-color="#1f4a30"/>
      <stop offset="1" stop-color="#0a1f14"/>
    </linearGradient>
    <linearGradient id="hairGoldSweatX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87820"/>
      <stop offset="0.5" stop-color="#7a5810"/>
      <stop offset="1" stop-color="#3a2810"/>
    </linearGradient>
    <linearGradient id="faceLitJ_X2" x1="0" y1="0" x2="0.7" y2="0.5">
      <stop offset="0" stop-color="#3a261a"/>
      <stop offset="0.5" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#7a4830"/>
    </linearGradient>
    <linearGradient id="smokeX2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4858" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#5a6478" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7a8898" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="eyeVulnerX2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5acc88" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5acc88" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomX2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="smokeBlurX2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="strongGlowX2" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softX2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="366" height="240" fill="url(#bgX2)"/>
  <rect width="366" height="240" fill="url(#amberAmbX2)"/>
  <rect width="366" height="240" fill="url(#emeraldDyingX2)"/>

  <g>
    <rect x="0" y="180" width="366" height="60" fill="url(#deskTopX2)"/>
    <line x1="0" y1="190" x2="366" y2="188" stroke="#3a2818" stroke-width="0.5" opacity="0.85"/>
