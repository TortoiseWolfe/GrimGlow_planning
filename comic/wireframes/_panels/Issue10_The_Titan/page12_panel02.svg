    <path d="M 60 188 Q 80 184 100 188 L 96 196 Q 78 198 56 196 Z" fill="url(#paperScatterX2)" opacity="0.85"/>
    <path d="M 240 188 Q 260 186 280 192 L 272 200 Q 254 200 238 196 Z" fill="url(#paperScatterX2)" opacity="0.85"/>
    <path d="M 280 192 Q 300 198 320 200 L 318 208 Q 298 208 280 200 Z" fill="url(#paperScatterX2)" opacity="0.85"/>
    <path d="M 30 216 L 70 218 L 78 226 L 30 226 Z" fill="url(#paperScatterX2)" opacity="0.85"/>
    <line x1="60" y1="190" x2="80" y2="194" stroke="#5a4838" stroke-width="0.4" opacity="0.55"/>
    <line x1="240" y1="190" x2="270" y2="194" stroke="#5a4838" stroke-width="0.4" opacity="0.55"/>
  </g>

  <g>
    <rect x="40" y="218" width="14" height="10" rx="2" fill="url(#brassPartX2)" stroke="#5a3818" stroke-width="0.4"/>
    <circle cx="280" cy="216" r="4" fill="url(#brassPartX2)" stroke="#5a3818" stroke-width="0.4"/>
    <rect x="320" y="218" width="10" height="6" fill="url(#brassPartX2)" stroke="#5a3818" stroke-width="0.4" transform="rotate(20 320 218)"/>
  </g>

  <g>
    <ellipse cx="180" cy="160" rx="13" ry="15" fill="#3a261a"/>
    <ellipse cx="180" cy="152" rx="9" ry="10" fill="url(#faceLitJ_X2)"/>
  </g>

  <g>
    <path d="M 162 138 Q 174 122 196 124 Q 218 128 226 144 L 220 156 Q 212 142 196 138 Q 178 138 168 152 Z" fill="url(#hairGoldSweatX2)"/>
    <ellipse cx="160" cy="140" rx="11" ry="14" fill="url(#hairGoldSweatX2)" transform="rotate(-25 160 140)"/>
    <ellipse cx="226" cy="140" rx="11" ry="14" fill="url(#hairGoldSweatX2)" transform="rotate(25 226 140)"/>
    <ellipse cx="172" cy="124" rx="8" ry="6" fill="url(#hairGoldSweatX2)" transform="rotate(-30 172 124)"/>
    <ellipse cx="208" cy="120" rx="8" ry="6" fill="url(#hairGoldSweatX2)" transform="rotate(30 208 120)"/>
    <path d="M 186 130 L 192 124" stroke="#5a3818" stroke-width="0.5" opacity="0.65"/>
    <path d="M 174 142 L 178 138" stroke="#5a3818" stroke-width="0.4" opacity="0.55"/>
  </g>

  <g>
    <ellipse cx="174" cy="158" rx="6" ry="3" fill="#0a0604"/>
    <ellipse cx="186" cy="158" rx="6.5" ry="3" fill="#0a0604"/>
    <circle cx="174" cy="158" r="2.2" fill="#1a3658"/>
    <circle cx="186" cy="158" r="2.4" fill="#1a3658"/>
    <circle cx="175" cy="157" r="0.9" fill="url(#eyeVulnerX2)"/>
    <circle cx="187" cy="157" r="1" fill="url(#eyeVulnerX2)"/>
  </g>

  <g stroke="#5a3818" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 162 152 Q 174 148 184 152"/>
    <path d="M 184 152 Q 198 148 210 152"/>
  </g>

  <path d="M 184 162 Q 180 174 184 184" stroke="#0a0604" stroke-width="0.7" fill="none" opacity="0.7"/>

  <g>
    <path d="M 174 188 L 196 188" stroke="#0a0604" stroke-width="1"/>
  </g>

  <g>
    <path d="M 154 200 Q 164 196 184 196 Q 204 196 218 200 L 220 220 L 154 220 Z" fill="url(#emeraldDamX2)"/>
    <path d="M 158 204 Q 174 202 184 202 Q 198 202 216 204 L 216 218 L 158 218 Z" fill="#1f4a30" opacity="0.85"/>
    <path d="M 154 200 L 144 196 L 140 220 L 154 220 Z" fill="#142e1f" opacity="0.85"/>
    <line x1="146" y1="208" x2="148" y2="218" stroke="#1f4a30" stroke-width="0.4"/>
    <line x1="142" y1="212" x2="144" y2="218" stroke="#1f4a30" stroke-width="0.4"/>

    <path d="M 220 200 L 230 196 L 234 220 L 220 220 Z" fill="#142e1f" opacity="0.85"/>
  </g>

  <g>
    <path d="M 200 184 Q 220 174 240 174 L 240 186 L 220 188 L 200 196 Z" fill="url(#emeraldDamX2)" opacity="0.85"/>
    <line x1="220" y1="178" x2="234" y2="180" stroke="#1f4a30" stroke-width="0.6"/>
  </g>

  <g>
    <path d="M 232 174 Q 240 170 250 168" stroke="url(#hairGoldSweatX2)" stroke-width="2" fill="none" opacity="0.7"/>
    <ellipse cx="248" cy="170" rx="3" ry="2" fill="#3a2010"/>
  </g>
  <g opacity="0.85" filter="url(#smokeBlurX2)">
    <path d="M 248 168 Q 240 140 244 110 Q 250 80 240 50" stroke="url(#smokeX2)" stroke-width="14" fill="none"/>
  </g>
  <g opacity="0.95">
    <path d="M 248 168 Q 240 140 244 110 Q 250 80 240 50" stroke="#9098a8" stroke-width="3" fill="none" opacity="0.65"/>
  </g>

  <g>
    <ellipse cx="252" cy="166" rx="4" ry="3" fill="url(#brassPartX2)" stroke="#5a3818" stroke-width="0.4"/>
    <ellipse cx="252" cy="166" rx="2" ry="1.4" fill="#3a2010"/>
  </g>
  <g opacity="0.65" filter="url(#bloomX2)">
    <ellipse cx="252" cy="166" rx="6" ry="4" fill="#dc4540" opacity="0.5"/>
  </g>

  <g>
    <line x1="200" y1="208" x2="204" y2="216" stroke="#0a0604" stroke-width="0.5" opacity="0.65"/>
    <line x1="206" y1="208" x2="210" y2="218" stroke="#0a0604" stroke-width="0.5" opacity="0.65"/>
  </g>

  <g opacity="0.55" filter="url(#strongGlowX2)">
    <circle cx="148" cy="208" r="2" fill="#3aa868" opacity="0.55"/>
    <circle cx="220" cy="208" r="2" fill="#3aa868" opacity="0.4"/>
  </g>

  <g transform="translate(20,12)">
    <rect x="-8" y="0" width="200" height="22" rx="3" fill="#f5ecd8" opacity="0.92" stroke="#c8b898" stroke-width="0.5" stroke-dasharray="2 1"/>
    <text x="92" y="11" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#3a8858" font-weight="700">JINK: "Wing-pack is cooking.</text>
    <text x="92" y="19" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.2" fill="#2a2a2a" font-style="italic">I can't keep doing that."</text>
  </g>
</svg>
