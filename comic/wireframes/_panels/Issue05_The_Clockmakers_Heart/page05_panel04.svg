<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 5 — Panel 4: Thresh climbing brickwork — mortar gaps as handholds — exposed</title>
  <desc>50mm MS. Thresh ascending stock brick face using mortar gaps. Brickwork as cliff face at fairy scale. Weapon slung across back. Armored suit scrapes brick. Window above with gap at sash. Faint crimson glow on dark wall.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p5p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p5p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <radialGradient id="p5p4crimsonSeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a0828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p5p4dimReflect" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#a87838" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5a4030" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p5p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- DARK BRICK WALL fills frame -->
  <rect width="366" height="364" fill="url(#p5p4brick)"/>

  <!-- Bricks at fairy scale — REGULAR LEDGES (this is a CLIFF FACE) -->
  <g stroke="#5a3018" stroke-width="0.7" opacity="0.75">
    <!-- Major horizontal courses, every 30px (a brick course at fairy scale) -->
    <line x1="0" y1="40" x2="366" y2="40"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="160" x2="366" y2="160"/>
    <line x1="0" y1="200" x2="366" y2="200"/>
    <line x1="0" y1="240" x2="366" y2="240"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
    <line x1="0" y1="320" x2="366" y2="320"/>
  </g>
  <!-- Vertical mortar gaps (offset between courses, like real bricklaying) -->
  <g stroke="#5a3018" stroke-width="0.55" opacity="0.7">
    <line x1="60" y1="0" x2="60" y2="40"/>
    <line x1="180" y1="0" x2="180" y2="40"/>
    <line x1="300" y1="0" x2="300" y2="40"/>
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="240" y1="40" x2="240" y2="80"/>
    <line x1="360" y1="40" x2="360" y2="80"/>
    <line x1="60" y1="80" x2="60" y2="120"/>
    <line x1="180" y1="80" x2="180" y2="120"/>
    <line x1="300" y1="80" x2="300" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="160"/>
    <line x1="240" y1="120" x2="240" y2="160"/>
    <line x1="60" y1="160" x2="60" y2="200"/>
    <line x1="180" y1="160" x2="180" y2="200"/>
    <line x1="300" y1="160" x2="300" y2="200"/>
    <line x1="120" y1="200" x2="120" y2="240"/>
    <line x1="240" y1="200" x2="240" y2="240"/>
    <line x1="60" y1="240" x2="60" y2="280"/>
    <line x1="180" y1="240" x2="180" y2="280"/>
    <line x1="300" y1="240" x2="300" y2="280"/>
    <line x1="120" y1="280" x2="120" y2="320"/>
    <line x1="240" y1="280" x2="240" y2="320"/>
    <line x1="60" y1="320" x2="60" y2="364"/>
    <line x1="300" y1="320" x2="300" y2="364"/>
  </g>

  <!-- Highlights on brick edges where amber gaslight catches -->
  <g opacity="0.45" fill="none">
    <rect x="50" y="280" width="80" height="2" fill="#a87838"/>
    <rect x="220" y="240" width="80" height="2" fill="#a87838"/>
  </g>

  <!-- Faint dim ambient gaslight wash from below -->
  <rect width="366" height="364" fill="url(#p5p4dimReflect)"/>

  <!-- ===== DARK FIRST-FLOOR SASH WINDOW above (her destination) ===== -->
  <rect x="200" y="20" width="120" height="80" fill="#0a0604"/>
  <rect x="200" y="20" width="120" height="80" fill="none" stroke="#3a2818" stroke-width="1.4"/>
  <line x1="260" y1="20" x2="260" y2="100" stroke="#3a2818" stroke-width="0.85"/>
  <line x1="200" y1="60" x2="320" y2="60" stroke="#3a2818" stroke-width="0.85"/>
  <!-- Gap at bottom sash -->
  <rect x="204" y="92" width="112" height="6" fill="#0a0604"/>
  <line x1="204" y1="96" x2="316" y2="96" stroke="#7a5028" stroke-width="0.55" opacity="0.85"/>
  <!-- Subtle warm leak from gap -->
  <ellipse cx="260" cy="98" rx="58" ry="5" fill="#ffd078" opacity="0.3" filter="url(#p5p4bloom)"/>

  <!-- ===== THRESH climbing — center-frame, mid-ascent ===== -->
  <g transform="translate(170 200)">
    <!-- Crimson seam halo on dark wall -->
    <ellipse cx="0" cy="0" rx="40" ry="36" fill="url(#p5p4crimsonSeam)" filter="url(#p5p4glow)" opacity="0.55"/>

    <!-- LEFT LEG planted on a course ledge below -->
    <ellipse cx="-8" cy="28" rx="3" ry="1.6" fill="#0a0408"/>
    <rect x="-10" y="6" width="6" height="22" fill="url(#p5p4suit)"/>
    <ellipse cx="-8" cy="22" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>
    <!-- RIGHT LEG braced higher -->
    <ellipse cx="6" cy="14" rx="3" ry="1.6" fill="#0a0408"/>
    <rect x="2" y="-4" width="6" height="18" fill="url(#p5p4suit)"/>
    <ellipse cx="6" cy="6" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>

    <!-- TORSO — angled forward against wall -->
    <path d="M-12,6 L-14,-22 L12,-22 L12,6 Z" fill="url(#p5p4suit)"/>
    <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#fff8e8" stroke-width="0.4" opacity="0.7" filter="url(#p5p4bloom)"/>
    <!-- Dented LEFT pauldron -->
    <ellipse cx="-14" cy="-22" rx="4" ry="2.4" fill="#5a0818"/>
    <ellipse cx="-15" cy="-22" rx="2.4" ry="1.4" fill="#3a0818"/>
    <!-- WEAPON SLUNG ACROSS BACK — visible diagonal strap + barrel -->
    <line x1="-10" y1="-22" x2="14" y2="0" stroke="#3a3030" stroke-width="2" opacity="0.85"/>
    <rect x="0" y="-16" width="18" height="2.4" fill="#3a3030" transform="rotate(35 9 -16)"/>
    <line x1="-2" y1="-12" x2="16" y2="2" stroke="#1a1a1a" stroke-width="0.55" opacity="0.85"/>

    <!-- Shoulders -->
    <path d="M-14,-22 Q-10,-32 -2,-34 Q10,-34 14,-26 L12,-22 Z" fill="url(#p5p4suit)"/>

    <!-- LEFT ARM — REACHING UP, hand gripping mortar gap above -->
    <path d="M-14,-22 L-22,-32 L-22,-44 L-18,-46 L-16,-36 L-10,-26 Z" fill="url(#p5p4suit)"/>
    <ellipse cx="-20" cy="-46" rx="3" ry="1.6" fill="url(#p5p4suit)"/>
    <!-- White-knuckle indication on hand -->
    <ellipse cx="-20" cy="-47" rx="1.6" ry="0.85" fill="#fff8e8" opacity="0.85" filter="url(#p5p4bloom)"/>
    <!-- RIGHT ARM — bracing against wall -->
    <path d="M14,-22 L18,-12 L20,-2 L16,-2 L14,-12 L10,-18 Z" fill="url(#p5p4suit)"/>
    <ellipse cx="18" cy="-2" rx="3" ry="1.6" fill="url(#p5p4suit)"/>
    <ellipse cx="18" cy="-2" rx="1.6" ry="0.85" fill="#fff8e8" opacity="0.85" filter="url(#p5p4bloom)"/>

    <!-- HEAD looking UP -->
    <ellipse cx="0" cy="-44" rx="5" ry="6.5" fill="#a86838"/>
    <path d="M-5,-51 Q-4,-53 0,-53 Q4,-53 5,-51 L4,-47 Q2,-50 0,-50 Q-2,-50 -4,-47 Z" fill="#c84838"/>
    <!-- Eyes UP, focused on next handhold -->
    <ellipse cx="-3" cy="-46" rx="1" ry="0.55" fill="#fff8e8"/>
    <circle cx="-3" cy="-46" r="0.4" fill="#0a0604"/>
    <ellipse cx="1" cy="-46" rx="1" ry="0.55" fill="#fff8e8"/>
    <circle cx="0" cy="-46" r="0.4" fill="#0a0604"/>
    <!-- Brows down — focused -->
    <path d="M-5,-51 L-1,-52" stroke="#3a1808" stroke-width="0.55"/>
    <path d="M1,-52 L5,-51" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Mouth set -->
    <path d="M-3,-37 L3,-37" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Comm earpiece -->
    <circle cx="3" cy="-44" r="0.85" fill="#dc2030" filter="url(#p5p4bloom)" opacity="0.85"/>
  </g>

  <!-- Faint scuff marks on brick where she has scraped -->
  <g opacity="0.4">
    <line x1="174" y1="240" x2="180" y2="244" stroke="#dc2030" stroke-width="0.55"/>
    <line x1="166" y1="216" x2="172" y2="220" stroke="#dc2030" stroke-width="0.55"/>
  </g>

  <!-- THRESH comms (between breaths) -->
  <g>
    <rect x="14" y="14" width="160" height="34" rx="2" fill="white" stroke="#dc2030" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#dc2030" font-weight="700">THRESH ((breath))</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Climbing.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,300 Q90,298 180,302 Q280,304 366,300"/>
  </g>
</svg>
