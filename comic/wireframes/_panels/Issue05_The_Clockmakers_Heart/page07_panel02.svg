<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 311" width="366" height="311">
  <title>Issue 5 — Page 7 — Panel 2: Wren in wall cavity — timber laths, plaster, dust, amber slits leaking</title>
  <desc>50mm. Wren inside dark wall cavity. Rough-hewn timber laths. Crumbling plaster. Horsehair insulation. Spider webs. Scanner casts copper-gold. Warm amber slits where shop light leaks through lath gaps.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p7p2timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p7p2plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a8878"/>
      <stop offset="100%" stop-color="#5a4838"/>
    </linearGradient>
    <linearGradient id="p7p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p7p2scannerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p2amberSlit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p7p2glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="366" height="311" fill="url(#p7p2bg)"/>

  <!-- TIMBER LATHS — vertical rough beams (foreground left) -->
  <rect x="0" y="0" width="60" height="311" fill="url(#p7p2timber)"/>
  <line x1="60" y1="0" x2="60" y2="311" stroke="#1a0c04" stroke-width="0.85"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="40" x2="60" y2="42"/>
    <line x1="0" y1="100" x2="60" y2="98"/>
    <line x1="0" y1="160" x2="60" y2="162"/>
    <line x1="0" y1="220" x2="60" y2="218"/>
    <line x1="0" y1="280" x2="60" y2="282"/>
  </g>

  <!-- PLASTER WALL — far right (crumbling) -->
  <rect x="280" y="0" width="86" height="311" fill="url(#p7p2plaster)"/>
  <g stroke="#3a2818" stroke-width="0.55" opacity="0.7">
    <path d="M280,40 Q320,42 366,38"/>
    <path d="M280,100 Q320,98 366,102"/>
    <path d="M280,160 Q320,162 366,158"/>
    <path d="M280,220 Q320,218 366,222"/>
    <path d="M280,280 Q320,282 366,278"/>
  </g>
  <!-- Crumbling chunks fallen -->
  <g fill="#7a6858" opacity="0.7">
    <ellipse cx="290" cy="80" rx="4" ry="3"/>
    <ellipse cx="320" cy="200" rx="5" ry="2.4"/>
    <ellipse cx="350" cy="260" rx="3.4" ry="2"/>
  </g>
  <!-- Crack in plaster -->
  <path d="M310,30 Q320,120 330,250" stroke="#3a2818" stroke-width="0.7" fill="none" opacity="0.65"/>

  <!-- HORSEHAIR INSULATION suggestion (curling fibers) -->
  <g stroke="#5a4830" stroke-width="0.45" fill="none" opacity="0.55">
    <path d="M70,60 Q80,70 76,80 Q70,86 76,92"/>
    <path d="M270,90 Q260,100 264,110 Q272,116 264,124"/>
    <path d="M240,180 Q230,190 234,200 Q244,206 236,214"/>
    <path d="M80,260 Q90,270 86,278 Q80,284 86,290"/>
  </g>

  <!-- ===== AMBER SLITS leaking through lath gaps (script demand) — bright vertical slits ===== -->
  <g>
    <ellipse cx="60" cy="80" rx="14" ry="6" fill="url(#p7p2amberSlit)" filter="url(#p7p2glow)" opacity="0.85"/>
    <rect x="58" y="74" width="3" height="14" fill="#ffd078" filter="url(#p7p2bloom)" opacity="0.85"/>
    <ellipse cx="60" cy="180" rx="14" ry="9" fill="url(#p7p2amberSlit)" filter="url(#p7p2glow)" opacity="0.85"/>
    <rect x="58" y="172" width="3" height="20" fill="#ffd078" filter="url(#p7p2bloom)" opacity="0.85"/>
    <ellipse cx="60" cy="260" rx="14" ry="6" fill="url(#p7p2amberSlit)" filter="url(#p7p2glow)" opacity="0.85"/>
    <rect x="58" y="254" width="3" height="14" fill="#ffd078" filter="url(#p7p2bloom)" opacity="0.85"/>
  </g>

  <!-- DUST MOTES drifting in scanner light -->
  <g fill="#ffd078" opacity="0.6" filter="url(#p7p2bloom)">
    <circle cx="120" cy="100" r="0.7"/>
    <circle cx="160" cy="120" r="0.85"/>
    <circle cx="200" cy="100" r="0.7"/>
    <circle cx="240" cy="130" r="0.85"/>
    <circle cx="180" cy="160" r="0.7"/>
    <circle cx="140" cy="180" r="0.85"/>
    <circle cx="220" cy="180" r="0.7"/>
  </g>

  <!-- COBWEB strands -->
  <g stroke="#a89888" stroke-width="0.4" fill="none" opacity="0.55">
    <path d="M60,80 Q140,90 200,80 Q260,72 280,80"/>
    <path d="M60,180 Q140,200 220,190"/>
    <path d="M60,80 L200,80"/>
    <path d="M60,80 L140,90"/>
    <path d="M60,260 Q160,270 280,265"/>
  </g>

  <!-- ===== WREN moving through cavity ===== -->
  <g transform="translate(160 200)">
    <!-- Scanner halo -->
    <ellipse cx="0" cy="-10" rx="40" ry="34" fill="url(#p7p2scannerGlow)" filter="url(#p7p2glow)" opacity="0.65"/>

    <!-- Body -->
    <ellipse cx="-3" cy="48" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="48" rx="3" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="22" width="4" height="26" fill="url(#p7p2suit)"/>
    <rect x="1" y="22" width="4" height="26" fill="url(#p7p2suit)"/>
    <ellipse cx="-3" cy="36" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="36" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <!-- Plaster fragments on suit (script: copper suit picking up dust + plaster) -->
    <circle cx="-2" cy="14" r="0.7" fill="#9a8878" opacity="0.65"/>
    <circle cx="3" cy="20" r="0.55" fill="#9a8878" opacity="0.65"/>
    <!-- Torso -->
    <path d="M-8,22 L-8,-12 L8,-12 L8,22 Z" fill="url(#p7p2suit)"/>
    <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p7p2bloom)"/>
    <ellipse cx="-8" cy="-12" rx="3" ry="2" fill="#1a0c04" opacity="0.85"/>
    <!-- Tool kit on back -->
    <rect x="-4" y="-8" width="9" height="14" fill="#3a2010"/>
    <line x1="-8" y1="-12" x2="-11" y2="-2" stroke="#1a0c04" stroke-width="1.2"/>
    <line x1="8" y1="-12" x2="11" y2="-2" stroke="#1a0c04" stroke-width="1.2"/>
    <!-- Shoulders -->
    <path d="M-8,-12 Q-5,-22 0,-24 Q5,-22 8,-12 L7,-8 L-7,-8 Z" fill="url(#p7p2suit)"/>
    <!-- LEFT arm — pulling cobweb aside (script demand) -->
    <path d="M-8,-12 L-18,-2 L-26,-8 L-22,-10 L-14,-6 L-6,-12 Z" fill="url(#p7p2suit)"/>
    <ellipse cx="-26" cy="-8" rx="3" ry="1.6" fill="#a86838"/>
    <!-- Cobweb strand pulled away from her hand -->
    <path d="M-29,-9 Q-40,-12 -50,-6" stroke="#a89888" stroke-width="0.55" opacity="0.7" fill="none"/>
    <!-- RIGHT arm holding scanner forward -->
    <path d="M8,-12 L16,-6 L24,-2 L24,2 L18,-2 L8,-6 Z" fill="url(#p7p2suit)"/>
    <ellipse cx="24" cy="0" rx="2.4" ry="1.6" fill="#a86838"/>
    <!-- Wrist scanner glow -->
    <circle cx="22" cy="-2" r="2.4" fill="#fff8e8" filter="url(#p7p2bloom)"/>
    <circle cx="22" cy="-2" r="4.4" fill="#ffd078" opacity="0.65" filter="url(#p7p2bloom)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#a86838"/>
    <ellipse cx="0" cy="-30" rx="3" ry="2.2" fill="#0a0604"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <!-- Mouth slightly tightened (controlled breathing through dust) -->
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Comm earpiece -->
    <circle cx="3" cy="-22" r="0.85" fill="#ffd078" filter="url(#p7p2bloom)" opacity="0.85"/>
  </g>

  <!-- WREN whisper -->
  <g>
    <rect x="14" y="14" width="338" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms, whisper))</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Inside the wall. Moving to floor access.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,260 Q90,258 180,262 Q280,264 366,260"/>
  </g>
</svg>
