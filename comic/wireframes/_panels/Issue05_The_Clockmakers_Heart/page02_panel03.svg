<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 2 — Panel 3: Plan set — schematic shows full operational positions — five colored dots + Theodore standby</title>
  <desc>35mm wide. Holographic schematic shows shop cutaway with five colored department dots at assigned positions, larger amber dot for Theodore standby, comm-link lines connecting them. Wren center, plan concluded. The moment between planning and doing.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p2p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p2p3beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p2p3wrenSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p2p3sableSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p2p3jinkSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a8848"/>
    </linearGradient>
    <linearGradient id="p2p3threshSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <linearGradient id="p2p3lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p2p3warRoom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p3silverDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dad5d0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a5860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p3copperDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p3emeraldDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a8848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p3crimsonDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8a0828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p3sapphireDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a3ad8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a2068" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p3amberDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p2p3glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p2p3bg)"/>

  <!-- Floorboards top -->
  <rect x="0" y="0" width="742" height="20" fill="#3a2818"/>
  <g stroke="#1a0c04" stroke-width="0.7" opacity="0.7">
    <line x1="200" y1="0" x2="200" y2="20"/>
    <line x1="500" y1="0" x2="500" y2="20"/>
  </g>
  <!-- Beam columns -->
  <rect x="20" y="20" width="14" height="304" fill="url(#p2p3beam)"/>
  <rect x="708" y="20" width="14" height="304" fill="url(#p2p3beam)"/>
  <!-- Floor below -->
  <rect x="34" y="280" width="674" height="44" fill="#1a0c04"/>

  <!-- War-room amber wash -->
  <rect width="742" height="364" fill="url(#p2p3warRoom)"/>

  <!-- ===== SCHEMATIC — full operational plan with positions ===== -->
  <g transform="translate(371 180)">
    <!-- Building cutaway in copper-gold -->
    <g stroke="#ffd078" stroke-width="1" fill="none" opacity="0.92" filter="url(#p2p3bloom)">
      <!-- Outer building shell -->
      <path d="M-200,-50 L-200,40 L200,40 L200,-50 Z"/>
      <!-- Roof -->
      <path d="M-200,-50 L-100,-100 L100,-100 L200,-50"/>
      <!-- Internal walls -->
      <line x1="-100" y1="-50" x2="-100" y2="40" opacity="0.85"/>
      <line x1="100" y1="-50" x2="100" y2="40" opacity="0.85"/>
      <line x1="-200" y1="0" x2="200" y2="0" opacity="0.85"/>
      <!-- Window frame -->
      <rect x="-60" y="6" width="120" height="22" rx="0.5"/>
      <line x1="0" y1="6" x2="0" y2="28" opacity="0.7"/>
      <!-- Door -->
      <rect x="-180" y="6" width="40" height="34" rx="0.5"/>
      <!-- Counter -->
      <rect x="140" y="6" width="40" height="34" rx="0.5"/>
      <!-- Workbenches in back -->
      <rect x="-180" y="-30" width="80" height="6"/>
      <rect x="100" y="-30" width="80" height="6"/>
      <!-- Wall clocks -->
      <circle cx="-150" cy="-44" r="4"/>
      <circle cx="150" cy="-44" r="4"/>
      <circle cx="-130" cy="-44" r="3"/>
      <circle cx="130" cy="-44" r="3"/>
      <!-- TARGET grandfather clock at center -->
      <rect x="-7" y="-44" width="14" height="74" rx="0.5"/>
      <circle cx="0" cy="-26" r="6"/>
    </g>
    <!-- Highlighted pulse around target -->
    <circle cx="0" cy="-26" r="14" fill="#fff8e8" opacity="0.4" filter="url(#p2p3bloom)"/>

    <!-- ===== POSITION DOTS ===== -->
    <!-- SILVER (Sable) — street corner outside building, left -->
    <g transform="translate(-220 22)">
      <ellipse cx="0" cy="0" rx="14" ry="14" fill="url(#p2p3silverDot)" filter="url(#p2p3glow)"/>
      <circle cx="0" cy="0" r="3" fill="#dad5d0" filter="url(#p2p3bloom)"/>
      <text x="0" y="-18" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#dad5d0" filter="url(#p2p3bloom)" font-weight="700" opacity="0.95">SABLE</text>
    </g>
    <!-- COPPER (Wren) — INSIDE the clock -->
    <g transform="translate(0 -10)">
      <ellipse cx="0" cy="0" rx="12" ry="12" fill="url(#p2p3copperDot)" filter="url(#p2p3glow)"/>
      <circle cx="0" cy="0" r="2.4" fill="#ffd078" filter="url(#p2p3bloom)"/>
      <text x="0" y="14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#ffd078" filter="url(#p2p3bloom)" font-weight="700" opacity="0.95">WREN</text>
    </g>
    <!-- EMERALD (Jink) — on rooftop -->
    <g transform="translate(0 -100)">
      <ellipse cx="0" cy="0" rx="12" ry="12" fill="url(#p2p3emeraldDot)" filter="url(#p2p3glow)"/>
      <circle cx="0" cy="0" r="2.4" fill="#2ed078" filter="url(#p2p3bloom)"/>
      <text x="0" y="-16" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#2ed078" filter="url(#p2p3bloom)" font-weight="700" opacity="0.95">JINK</text>
    </g>
    <!-- CRIMSON (Thresh) — at the window ledge -->
    <g transform="translate(40 18)">
      <ellipse cx="0" cy="0" rx="12" ry="12" fill="url(#p2p3crimsonDot)" filter="url(#p2p3glow)"/>
      <circle cx="0" cy="0" r="2.4" fill="#dc2030" filter="url(#p2p3bloom)"/>
      <text x="0" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#dc2030" filter="url(#p2p3bloom)" font-weight="700" opacity="0.95">THRESH</text>
    </g>
    <!-- SAPPHIRE (Luma) — at camp (off-building, far left) -->
    <g transform="translate(-260 -50)">
      <ellipse cx="0" cy="0" rx="12" ry="12" fill="url(#p2p3sapphireDot)" filter="url(#p2p3glow)"/>
      <circle cx="0" cy="0" r="2.4" fill="#5a3ad8" filter="url(#p2p3bloom)"/>
      <text x="0" y="-16" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#a888e8" filter="url(#p2p3bloom)" font-weight="700" opacity="0.95">LUMA</text>
    </g>
    <!-- AMBER (Theodore) — STANDBY position outside, larger dot -->
    <g transform="translate(220 22)">
      <ellipse cx="0" cy="0" rx="18" ry="18" fill="url(#p2p3amberDot)" filter="url(#p2p3glow)"/>
      <circle cx="0" cy="0" r="4" fill="#ffaa48" filter="url(#p2p3bloom)"/>
      <text x="0" y="-22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#ffd078" filter="url(#p2p3bloom)" font-weight="700" opacity="0.95">THEODORE</text>
      <text x="0" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4.4" fill="#ffaa48" filter="url(#p2p3bloom)" opacity="0.85">STANDBY</text>
    </g>

    <!-- COMM LINES (dashed) connecting positions -->
    <g stroke="#ffd078" stroke-width="0.45" fill="none" opacity="0.55" filter="url(#p2p3bloom)" stroke-dasharray="3 2">
      <line x1="-220" y1="22" x2="0" y2="-10"/>
      <line x1="0" y1="-10" x2="0" y2="-100"/>
      <line x1="0" y1="-10" x2="40" y2="18"/>
      <line x1="-260" y1="-50" x2="-220" y2="22"/>
      <line x1="-260" y1="-50" x2="0" y2="-10"/>
      <line x1="220" y1="22" x2="40" y2="18"/>
      <line x1="-220" y1="22" x2="220" y2="22"/>
    </g>
  </g>

  <!-- ===== SQUAD ARRAYED AT FLOOR LEVEL ===== -->
  <!-- WREN center, hands at sides, briefing concluded -->
  <g transform="translate(371 270)">
    <ellipse cx="-3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="22" fill="url(#p2p3wrenSuit)"/>
    <rect x="1" y="14" width="4" height="22" fill="url(#p2p3wrenSuit)"/>
    <ellipse cx="-3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p2p3wrenSuit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#ffd078" stroke-width="0.7" opacity="0.85" filter="url(#p2p3bloom)"/>
    <ellipse cx="-7" cy="-12" rx="3" ry="2" fill="#1a0c04" opacity="0.85"/>
    <rect x="-11" y="-12" width="4" height="24" fill="url(#p2p3wrenSuit)"/>
    <rect x="7" y="-12" width="4" height="24" fill="url(#p2p3wrenSuit)"/>
    <ellipse cx="-9" cy="14" rx="2.4" ry="1.6" fill="#a86838"/>
    <ellipse cx="9" cy="14" rx="2.4" ry="1.6" fill="#a86838"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#a86838"/>
    <ellipse cx="0" cy="-32" rx="3" ry="2.4" fill="#0a0604"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.5"/>
  </g>

  <!-- SABLE — slight nod -->
  <g transform="translate(160 272)">
    <ellipse cx="-3" cy="34" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="34" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="20" fill="url(#p2p3sableSuit)"/>
    <rect x="1" y="14" width="4" height="20" fill="url(#p2p3sableSuit)"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p2p3sableSuit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#a8c0ff" stroke-width="0.7" opacity="0.85" filter="url(#p2p3bloom)"/>
    <ellipse cx="7" cy="-12" rx="3" ry="2" fill="#3a3038"/>
    <rect x="-11" y="-12" width="4" height="22" fill="url(#p2p3sableSuit)"/>
    <rect x="7" y="-12" width="4" height="22" fill="url(#p2p3sableSuit)"/>
    <!-- Head slightly tipped (nodding) -->
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#7a4838" transform="rotate(-5)"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#e0d8d0"/>
    <ellipse cx="-2" cy="-21" rx="0.85" ry="0.4" fill="#fff8e8"/>
    <ellipse cx="2" cy="-21" rx="0.85" ry="0.4" fill="#fff8e8"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.5"/>
  </g>

  <!-- JINK — vibrating, on a low beam right of Wren -->
  <g transform="translate(490 270)">
    <ellipse cx="-3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="22" fill="url(#p2p3jinkSuit)"/>
    <rect x="1" y="14" width="4" height="22" fill="url(#p2p3jinkSuit)"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p2p3jinkSuit)"/>
    <ellipse cx="0" cy="-2" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>
    <!-- Arms slightly raised, ready -->
    <path d="M-7,-12 L-12,2 L-10,14 L-6,12 L-6,4 L-8,-2 Z" fill="url(#p2p3jinkSuit)"/>
    <path d="M7,-12 L12,2 L10,14 L6,12 L6,4 L8,-2 Z" fill="url(#p2p3jinkSuit)"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6" fill="#d8a878"/>
    <path d="M-5,-29 Q-3,-32 0,-32 Q3,-32 5,-29 L5,-25 Q2,-29 0,-29 Q-2,-29 -5,-25 Z" fill="#ffd078"/>
    <circle cx="-3" cy="-31" r="1.4" fill="#ffd078"/>
    <circle cx="3" cy="-30" r="1.6" fill="#ffd078"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 Q0,-12 3,-15" stroke="#3a1808" stroke-width="0.55" fill="none"/>
  </g>

  <!-- THRESH — still, jaw tight -->
  <g transform="translate(580 272)">
    <ellipse cx="-3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="22" fill="url(#p2p3threshSuit)"/>
    <rect x="1" y="14" width="4" height="22" fill="url(#p2p3threshSuit)"/>
    <ellipse cx="-3" cy="28" rx="2" ry="0.85" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="3" cy="28" rx="2" ry="0.85" fill="#1a0c04" opacity="0.7"/>
    <path d="M-9,14 L-9,-12 L9,-12 L9,14 Z" fill="url(#p2p3threshSuit)"/>
    <ellipse cx="-9" cy="-12" rx="3" ry="2" fill="#5a0818"/>
    <rect x="-13" y="-12" width="4" height="24" fill="url(#p2p3threshSuit)"/>
    <rect x="9" y="-12" width="4" height="24" fill="url(#p2p3threshSuit)"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#a86838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L4,-25 Q2,-28 0,-28 Q-2,-28 -4,-25 Z" fill="#c84838"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.7"/>
  </g>

  <!-- LUMA at low beam left, checking comm relay -->
  <g transform="translate(80 272)">
    <ellipse cx="-3" cy="34" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="34" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="20" fill="url(#p2p3lumaSuit)"/>
    <rect x="1" y="14" width="4" height="20" fill="url(#p2p3lumaSuit)"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p2p3lumaSuit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#a888e8" stroke-width="0.55" opacity="0.85" filter="url(#p2p3bloom)"/>
    <!-- Comm relay in lap -->
    <rect x="-5" y="6" width="10" height="6" fill="#3a2068" stroke="#a888e8" stroke-width="0.4"/>
    <ellipse cx="0" cy="9" rx="9" ry="3" fill="#a888e8" opacity="0.45" filter="url(#p2p3bloom)"/>
    <rect x="-11" y="-12" width="4" height="22" fill="url(#p2p3lumaSuit)"/>
    <rect x="7" y="-12" width="4" height="22" fill="url(#p2p3lumaSuit)"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6" fill="#7a4838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#0a0604"/>
    <path d="M5,-18 Q9,-2 10,16" stroke="#0a0604" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M5,-18 Q9,-2 10,16" stroke="#a888e8" stroke-width="0.5" fill="none" opacity="0.85" filter="url(#p2p3bloom)"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <line x1="-3" y1="-25" x2="-1" y2="-21" stroke="#ffd078" stroke-width="0.4"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.5"/>
  </g>

  <!-- WREN dialogue (top-left) -->
  <g>
    <rect x="14" y="14" width="320" height="36" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">We go at last light. Lock-up at seven. Move at seven-fifteen.</text>

  <!-- SABLE dialogue (top-right) -->
  <g>
    <rect x="568" y="14" width="160" height="32" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="576" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="576" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Questions.</text>

  <!-- JINK dialogue -->
  <g>
    <rect x="430" y="316" width="190" height="34" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="490,316 502,316 494,306" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="490.5" y1="316" x2="501.5" y2="316" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="438" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2ed078" font-weight="700">JINK</text>
  <text x="438" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Let's steal a clock.</text>

  <!-- WREN reply -->
  <g>
    <rect x="14" y="316" width="240" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="180,316 192,316 184,306" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="180.5" y1="316" x2="191.5" y2="316" stroke="white" stroke-width="1.5"/>
  </g>
