<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 422" width="366" height="422">
  <title>Issue 5 — Page 9 — Panel 4: Wren beside target — full toolkit deployed + holographic schematic mirror — high praise indeed</title>
  <desc>50mm MS. Wren beside target sixteen-tooth pinion / sixty-four-tooth wheel. Holographic toolkit (scanner, manipulators, calibrator) orbits hands. Translucent copper-gold schematic floats beside real mechanism. Two engineering traditions side by side.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p4cavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p9p4brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p9p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p9p4steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0c8"/>
      <stop offset="100%" stop-color="#5a5048"/>
    </linearGradient>
    <radialGradient id="p9p4amberHeart" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p4toolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p4schematicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p9p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="422" fill="url(#p9p4cavity)"/>
  <rect width="366" height="422" fill="url(#p9p4amberHeart)"/>

  <!-- Base plate suggestion at bottom -->
  <rect x="0" y="380" width="366" height="42" fill="#a86838"/>
  <line x1="0" y1="384" x2="366" y2="384" stroke="#7a4818" stroke-width="0.55"/>

  <!-- ===== TARGET GEAR ASSEMBLY (right side) — sixty-four-tooth wheel + pinion ===== -->
  <g transform="translate(260 200)">
    <!-- Sixty-four-tooth wheel -->
    <ellipse cx="0" cy="0" rx="100" ry="100" fill="url(#p9p4amberHeart)" filter="url(#p9p4glow)" opacity="0.7"/>
    <circle cx="0" cy="0" r="80" fill="url(#p9p4brass)" stroke="#7a4818" stroke-width="0.85"/>
    <!-- Many fine teeth -->
    <g fill="url(#p9p4brass)" stroke="#7a4818" stroke-width="0.3">
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(0)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(15)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(30)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(45)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(60)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(75)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(90)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(105)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(120)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(135)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(150)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(165)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(180)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(195)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(210)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(225)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(240)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(255)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(270)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(285)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(300)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(315)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(330)"/>
      <path d="M0,-80 L2,-86 L-2,-86 Z" transform="rotate(345)"/>
    </g>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#7a4818" stroke-width="0.55"/>
    <!-- Spokes -->
    <g stroke="#7a4818" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-56" x2="0" y2="-14"/>
      <line x1="56" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="56" x2="0" y2="14"/>
      <line x1="-56" y1="0" x2="-14" y2="0"/>
    </g>
    <!-- Center pivot -->
    <circle cx="0" cy="0" r="14" fill="url(#p9p4steel)" stroke="#1a0c04" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="6" fill="#3a3030"/>
    <!-- Polished sheen -->
    <ellipse cx="-22" cy="-22" rx="20" ry="34" fill="#fff8e8" opacity="0.55" filter="url(#p9p4bloom)"/>
  </g>

  <!-- Pinion (smaller, atop the wheel) -->
  <g transform="translate(260 80)">
    <circle cx="0" cy="0" r="22" fill="url(#p9p4brass)" stroke="#7a4818" stroke-width="0.55"/>
    <g fill="url(#p9p4brass)" stroke="#7a4818" stroke-width="0.3">
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(0)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(22.5)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(45)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(67.5)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(90)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(112.5)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(135)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(157.5)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(180)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(202.5)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(225)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(247.5)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(270)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(292.5)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(315)"/>
      <path d="M0,-22 L2,-26 L-2,-26 Z" transform="rotate(337.5)"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="url(#p9p4steel)"/>
    <circle cx="0" cy="0" r="2" fill="#1a0c04"/>
  </g>

  <!-- ===== HOLOGRAPHIC SCHEMATIC floating beside real mechanism (left of gear) ===== -->
  <g transform="translate(100 200)">
    <ellipse cx="0" cy="0" rx="60" ry="100" fill="url(#p9p4schematicGlow)" filter="url(#p9p4glow)" opacity="0.55"/>
    <!-- Wireframe gear schematic (translucent copper-gold) -->
    <g stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#p9p4bloom)">
      <!-- Big wheel wireframe -->
      <circle cx="0" cy="20" r="50"/>
      <circle cx="0" cy="20" r="38"/>
      <circle cx="0" cy="20" r="9"/>
      <line x1="0" y1="-30" x2="0" y2="10"/>
      <line x1="-50" y1="20" x2="-9" y2="20"/>
      <line x1="50" y1="20" x2="9" y2="20"/>
      <line x1="0" y1="70" x2="0" y2="29"/>
      <!-- Pinion wireframe (smaller, top) -->
      <circle cx="0" cy="-50" r="14"/>
      <circle cx="0" cy="-50" r="9"/>
      <line x1="-14" y1="-50" x2="14" y2="-50"/>
      <line x1="0" y1="-64" x2="0" y2="-36"/>
    </g>
    <!-- Annotations in fairy geometric script -->
    <g stroke="#fff8e8" stroke-width="0.4" fill="none" opacity="0.85" filter="url(#p9p4bloom)">
      <line x1="-50" y1="-30" x2="-30" y2="-30"/>
      <line x1="-50" y1="-22" x2="-30" y2="-22"/>
      <path d="M-50,-26 L-46,-22"/>
      <path d="M-44,-30 L-40,-22"/>
    </g>
    <text x="-50" y="-40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4" fill="#fff8e8" font-weight="700" opacity="0.85" filter="url(#p9p4bloom)">SCHEMATIC</text>
    <!-- Geometric tick marks -->
    <g fill="#ffd078" filter="url(#p9p4bloom)" opacity="0.85">
      <circle cx="-50" cy="20" r="0.85"/>
      <circle cx="50" cy="20" r="0.85"/>
      <circle cx="0" cy="-30" r="0.85"/>
      <circle cx="0" cy="70" r="0.85"/>
    </g>
  </g>

  <!-- ===== WREN — between schematic and mechanism, full toolkit deployed ===== -->
  <g transform="translate(180 280)">
    <!-- Boots -->
    <ellipse cx="-3" cy="40" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="26" fill="url(#p9p4suit)"/>
    <rect x="1" y="14" width="4" height="26" fill="url(#p9p4suit)"/>
    <ellipse cx="-3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <!-- Torso -->
    <path d="M-8,14 L-8,-22 L8,-22 L8,14 Z" fill="url(#p9p4suit)"/>
    <line x1="-6" y1="-12" x2="6" y2="-12" stroke="#ffd078" stroke-width="0.7" opacity="0.85" filter="url(#p9p4bloom)"/>
    <ellipse cx="-8" cy="-22" rx="3" ry="2" fill="#1a0c04" opacity="0.85"/>
    <!-- Tool kit on back -->
    <rect x="-4" y="-18" width="9" height="14" fill="#3a2010"/>
    <!-- Shoulders -->
    <path d="M-8,-22 Q-5,-32 0,-34 Q5,-32 8,-22 L7,-18 L-7,-18 Z" fill="url(#p9p4suit)"/>
    <!-- Both arms extended outward (tools floating around hands) -->
    <path d="M-8,-22 L-22,-14 L-30,-6 L-28,-2 L-22,-8 L-6,-18 Z" fill="url(#p9p4suit)"/>
    <ellipse cx="-30" cy="-4" rx="3" ry="2" fill="#a86838"/>
    <path d="M8,-22 L22,-14 L30,-6 L28,-2 L22,-8 L6,-18 Z" fill="url(#p9p4suit)"/>
    <ellipse cx="30" cy="-4" rx="3" ry="2" fill="#a86838"/>
    <!-- Wrist emitter glow on both hands -->
    <circle cx="-30" cy="-6" r="3" fill="#fff8e8" filter="url(#p9p4bloom)"/>
    <circle cx="-30" cy="-6" r="6" fill="#ffd078" opacity="0.65" filter="url(#p9p4glow)"/>
    <circle cx="30" cy="-6" r="3" fill="#fff8e8" filter="url(#p9p4bloom)"/>
    <circle cx="30" cy="-6" r="6" fill="#ffd078" opacity="0.65" filter="url(#p9p4glow)"/>
    <!-- Head — turning between schematic + mechanism -->
    <ellipse cx="0" cy="-32" rx="5" ry="6.5" fill="#a86838"/>
    <ellipse cx="0" cy="-40" rx="3" ry="2.2" fill="#0a0604"/>
    <ellipse cx="-2" cy="-32" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-32" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-32" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-32" r="0.4" fill="#0a0604"/>
    <path d="M-3,-25 L3,-25" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== HOLOGRAPHIC TOOLS orbiting hands ===== -->
  <!-- Tool 1 — SCANNER (left of Wren) -->
  <g transform="translate(135 250)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="url(#p9p4toolGlow)" filter="url(#p9p4glow)" opacity="0.85"/>
    <g stroke="#fff8e8" stroke-width="0.7" fill="none" opacity="0.95" filter="url(#p9p4bloom)">
      <path d="M-5,-3 L-3,-5 L3,-5 L5,-3 L5,3 L3,5 L-3,5 L-5,3 Z"/>
      <line x1="0" y1="-5" x2="0" y2="5"/>
      <line x1="-5" y1="0" x2="5" y2="0"/>
    </g>
  </g>
  <!-- Tool 2 — MANIPULATOR -->
  <g transform="translate(135 290)">
    <ellipse cx="0" cy="0" rx="11" ry="9" fill="url(#p9p4toolGlow)" filter="url(#p9p4glow)" opacity="0.85"/>
    <g stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#p9p4bloom)">
      <path d="M-3,-3 L-1,-1 L1,-3 L3,-1"/>
      <line x1="0" y1="-1" x2="0" y2="4"/>
    </g>
  </g>
  <!-- Tool 3 — CALIBRATOR (right of Wren) -->
  <g transform="translate(225 250)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="url(#p9p4toolGlow)" filter="url(#p9p4glow)" opacity="0.85"/>
    <g stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#p9p4bloom)">
      <circle cx="0" cy="0" r="5"/>
      <line x1="0" y1="-5" x2="0" y2="-3"/>
      <line x1="0" y1="5" x2="0" y2="3"/>
      <line x1="-5" y1="0" x2="-3" y2="0"/>
      <line x1="5" y1="0" x2="3" y2="0"/>
      <line x1="0" y1="0" x2="3" y2="-3"/>
    </g>
  </g>
  <!-- Tool 4 — CUTTER (above Wren) -->
  <g transform="translate(180 230)">
    <ellipse cx="0" cy="0" rx="9" ry="9" fill="url(#p9p4toolGlow)" filter="url(#p9p4glow)" opacity="0.85"/>
    <g stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#p9p4bloom)">
      <rect x="-3" y="-3" width="6" height="5" rx="0.4"/>
      <line x1="0" y1="2" x2="0" y2="6"/>
    </g>
  </g>
  <!-- Particles drifting -->
  <g fill="#ffd078" filter="url(#p9p4bloom)" opacity="0.65">
    <circle cx="135" cy="220" r="0.7"/>
    <circle cx="225" cy="220" r="0.7"/>
    <circle cx="160" cy="220" r="0.55"/>
    <circle cx="200" cy="220" r="0.55"/>
  </g>

  <!-- WREN comms (top) -->
  <g>
    <rect x="14" y="14" width="338" height="46" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">I have the target. Sixteen-tooth pinion,</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">sixty-four-tooth wheel. Machining is...</text>

  <!-- WREN beat -->
  <g>
    <rect x="14" y="362" width="160" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic" font-weight="500">...very good.</text>

  <!-- SABLE response -->
  <g>
    <rect x="180" y="362" width="172" height="32" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="188" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE ((comms))</text>
  <text x="188" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">High praise, Wren.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,360 Q90,358 180,362 Q280,364 366,360"/>
  </g>
</svg>
