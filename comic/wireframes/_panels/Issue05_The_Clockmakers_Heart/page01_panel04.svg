<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 5 — Page 1 — Panel 4: Full briefing low angle — schematic shows gear mechanism — Wren names Theodore as contingency</title>
  <desc>35mm wide medium, slight low angle. Schematic looms above. Gears in copper-gold wireframe with target assembly pulsing brighter. Wren gestures through projection, marking exit routes that flare. Jink crouches on beam looking down. Thresh stands back, jaw tense at window-ledge highlight. Luma sits with comm relay. Sable watches.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p1p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p1p4beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p1p4wrenSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p1p4sableSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p1p4jinkSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a8848"/>
    </linearGradient>
    <linearGradient id="p1p4threshSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <linearGradient id="p1p4lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p1p4schematicCage" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#e8a850" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p1p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#p1p4bg)"/>

  <!-- Background timber + brick -->
  <g opacity="0.5">
    <rect x="0" y="0" width="494" height="40" fill="#3a2818"/>
    <rect x="0" y="320" width="494" height="44" fill="#1a0c04"/>
    <rect x="20" y="40" width="14" height="280" fill="url(#p1p4beam)"/>
    <rect x="460" y="40" width="14" height="280" fill="url(#p1p4beam)"/>
  </g>

  <!-- Central beam (table) -->
  <rect x="34" y="220" width="426" height="14" fill="url(#p1p4beam)"/>

  <!-- ===== SCHEMATIC LOOMING ABOVE — gear mechanism detail ===== -->
  <g transform="translate(247 130)">
    <ellipse cx="0" cy="0" rx="240" ry="120" fill="url(#p1p4schematicCage)" filter="url(#p1p4glow)" opacity="0.85"/>
    <!-- Multiple gears in geometric wireframe — clock train visible -->
    <g stroke="#ffd078" stroke-width="1" fill="none" opacity="0.92" filter="url(#p1p4bloom)">
      <!-- Main wheel (large) -->
      <circle cx="-80" cy="0" r="34"/>
      <circle cx="-80" cy="0" r="28"/>
      <!-- Gear teeth markers -->
      <line x1="-114" y1="0" x2="-118" y2="0"/>
      <line x1="-46" y1="0" x2="-42" y2="0"/>
      <line x1="-80" y1="34" x2="-80" y2="38"/>
      <line x1="-80" y1="-34" x2="-80" y2="-38"/>
      <line x1="-104" y1="-24" x2="-107" y2="-27"/>
      <line x1="-56" y1="-24" x2="-53" y2="-27"/>
      <line x1="-104" y1="24" x2="-107" y2="27"/>
      <line x1="-56" y1="24" x2="-53" y2="27"/>
      <!-- Pinion (smaller, meshed) -->
      <circle cx="-46" cy="-30" r="10"/>
      <circle cx="-46" cy="-30" r="6"/>
      <!-- Center wheel -->
      <circle cx="0" cy="-10" r="20"/>
      <circle cx="0" cy="-10" r="14"/>
      <!-- Escape wheel (smaller) -->
      <circle cx="40" cy="-30" r="14"/>
      <circle cx="40" cy="-30" r="10"/>
      <!-- Pendulum suspension lines -->
      <line x1="0" y1="-30" x2="0" y2="20" opacity="0.7"/>
      <ellipse cx="0" cy="40" rx="14" ry="6"/>
      <!-- TARGET assembly — far right, brighter pulse -->
      <circle cx="100" cy="0" r="30"/>
      <circle cx="100" cy="0" r="22"/>
      <circle cx="100" cy="0" r="12"/>
      <line x1="70" y1="0" x2="74" y2="0"/>
      <line x1="126" y1="0" x2="130" y2="0"/>
      <line x1="100" y1="-30" x2="100" y2="-34"/>
      <line x1="100" y1="30" x2="100" y2="34"/>
    </g>
    <!-- TARGET — extra-bright pulse -->
    <circle cx="100" cy="0" r="38" fill="#fff8e8" opacity="0.4" filter="url(#p1p4bloom)"/>
    <text x="100" y="48" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" font-weight="700" filter="url(#p1p4bloom)" opacity="0.95">TARGET</text>

    <!-- Exit route arrows flaring -->
    <g stroke="#ffd078" stroke-width="0.7" fill="none" opacity="0.85" filter="url(#p1p4bloom)" stroke-dasharray="3 1.5">
      <path d="M0,40 L0,80 L-60,90"/>
      <path d="M0,40 L40,70 L80,80"/>
    </g>
    <text x="-60" y="100" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#ffd078" filter="url(#p1p4bloom)" opacity="0.85">PRIMARY</text>
    <text x="80" y="100" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#ffd078" filter="url(#p1p4bloom)" opacity="0.85">SECONDARY</text>

    <!-- Window ledge highlight (Thresh's position) -->
    <rect x="-180" y="40" width="40" height="6" fill="none" stroke="#ff8848" stroke-width="1.2" filter="url(#p1p4bloom)"/>
    <text x="-160" y="60" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="5" fill="#ff8848" filter="url(#p1p4bloom)" opacity="0.95" font-weight="700">OVERWATCH</text>
  </g>

  <!-- ===== JINK above on beam, leaning in to look at projection ===== -->
  <g transform="translate(80 70)">
    <rect x="-26" y="14" width="52" height="6" fill="#3a2818"/>
    <ellipse cx="-3" cy="6" rx="2.4" ry="1.6" fill="url(#p1p4jinkSuit)"/>
    <ellipse cx="3" cy="6" rx="2.4" ry="1.6" fill="url(#p1p4jinkSuit)"/>
    <!-- Crouched, leaning forward -->
    <rect x="-5" y="6" width="4" height="14" fill="url(#p1p4jinkSuit)"/>
    <rect x="1" y="6" width="4" height="14" fill="url(#p1p4jinkSuit)"/>
    <!-- Torso bent forward -->
    <path d="M-7,-12 L-7,8 L7,8 L7,-12 Z" fill="url(#p1p4jinkSuit)"/>
    <ellipse cx="0" cy="-2" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>
    <!-- Arms forward (leaning into projection) -->
    <path d="M-7,-12 L-12,-2 L-12,4 L-8,2 L-5,-6 Z" fill="url(#p1p4jinkSuit)"/>
    <path d="M7,-12 L12,-2 L12,4 L8,2 L5,-6 Z" fill="url(#p1p4jinkSuit)"/>
    <!-- Head looking down -->
    <ellipse cx="0" cy="-18" rx="4.5" ry="6" fill="#d8a878"/>
    <!-- Golden curls -->
    <path d="M-5,-25 Q-3,-28 0,-28 Q3,-28 5,-25 L5,-22 Q2,-25 0,-25 Q-2,-25 -5,-22 Z" fill="#ffd078"/>
    <circle cx="-3" cy="-26" r="1.4" fill="#ffd078"/>
    <circle cx="3" cy="-25" r="1.6" fill="#ffd078"/>
    <!-- Eyes looking down — eager grin -->
    <ellipse cx="-2" cy="-17" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-17" r="0.45" fill="#0a0604"/>
    <ellipse cx="2" cy="-17" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-17" r="0.45" fill="#0a0604"/>
    <!-- GRIN -->
    <path d="M-3,-12 Q0,-9 3,-12" stroke="#3a1808" stroke-width="0.55" fill="none"/>
    <!-- Wing-pack folded -->
    <path d="M-7,-12 L-9,-2 L-7,2 Z" fill="#1a0c04" opacity="0.85"/>
    <path d="M7,-12 L9,-2 L7,2 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="-7" y1="-8" x2="-7" y2="0" stroke="#2ed078" stroke-width="0.4" opacity="0.7" filter="url(#p1p4bloom)"/>
    <line x1="7" y1="-8" x2="7" y2="0" stroke="#2ed078" stroke-width="0.4" opacity="0.7" filter="url(#p1p4bloom)"/>
  </g>

  <!-- ===== WREN gesturing through schematic (right of center beam) ===== -->
  <g transform="translate(280 240)">
    <ellipse cx="-3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="22" fill="url(#p1p4wrenSuit)"/>
    <rect x="1" y="14" width="4" height="22" fill="url(#p1p4wrenSuit)"/>
    <ellipse cx="-3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <path d="M-8,14 L-8,-22 L8,-22 L8,14 Z" fill="url(#p1p4wrenSuit)"/>
    <line x1="-6" y1="-12" x2="6" y2="-12" stroke="#ffd078" stroke-width="0.7" opacity="0.85" filter="url(#p1p4bloom)"/>
    <ellipse cx="-8" cy="-22" rx="3.4" ry="2.4" fill="#1a0c04" opacity="0.85"/>
    <path d="M-8,-22 Q-5,-30 0,-32 Q5,-30 8,-22 L7,-18 L-7,-18 Z" fill="url(#p1p4wrenSuit)"/>
    <!-- LEFT arm extended UP into schematic, fingers tracing exit route -->
    <path d="M-8,-22 L-16,-38 L-22,-50 L-18,-52 L-12,-42 L-6,-26 Z" fill="url(#p1p4wrenSuit)"/>
    <ellipse cx="-22" cy="-50" rx="3" ry="2" fill="#a86838"/>
    <ellipse cx="-26" cy="-54" rx="2" ry="1.4" fill="#a86838"/>
    <!-- Finger glow at trace point -->
    <circle cx="-26" cy="-54" r="2" fill="#fff8e8" opacity="0.7" filter="url(#p1p4bloom)"/>
    <!-- Right arm at side -->
    <rect x="8" y="-22" width="4" height="32" fill="url(#p1p4wrenSuit)"/>
    <ellipse cx="10" cy="12" rx="2.5" ry="1.6" fill="#a86838"/>
    <!-- Oil stains on arms -->
    <ellipse cx="-12" cy="-30" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.6"/>
    <ellipse cx="10" cy="0" rx="2" ry="1.6" fill="#1a0c04" opacity="0.55"/>
    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="5.5" ry="7" fill="#a86838"/>
    <ellipse cx="0" cy="-40" rx="3" ry="2.2" fill="#0a0604"/>
    <ellipse cx="0" cy="-42" rx="2" ry="1.4" fill="#1a0c04"/>
    <ellipse cx="-2" cy="-30" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="-2" cy="-30" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-30" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="2" cy="-30" r="0.5" fill="#0a0604"/>
    <path d="M-3,-23 L3,-23" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== THRESH right side, arms crossed, jaw tense ===== -->
  <g transform="translate(420 250)">
    <ellipse cx="-3" cy="38" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="38" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="16" width="4" height="22" fill="url(#p1p4threshSuit)"/>
    <rect x="1" y="16" width="4" height="22" fill="url(#p1p4threshSuit)"/>
    <ellipse cx="-3" cy="30" rx="2" ry="0.85" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="3" cy="30" rx="2" ry="0.85" fill="#1a0c04" opacity="0.7"/>
    <path d="M-9,16 L-9,-12 L9,-12 L9,16 Z" fill="url(#p1p4threshSuit)"/>
    <ellipse cx="-9" cy="-12" rx="3" ry="2" fill="#5a0818"/>
    <path d="M-9,-12 L-12,-2 L-2,4 L9,-2 L9,-12 Z" fill="url(#p1p4threshSuit)"/>
    <path d="M9,-12 L12,-2 L2,4 L-9,-2 L-9,-12 Z" fill="url(#p1p4threshSuit)" opacity="0.92"/>
    <ellipse cx="0" cy="-22" rx="6" ry="7" fill="#a86838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L4,-25 Q2,-28 0,-28 Q-2,-28 -4,-25 Z" fill="#c84838"/>
    <ellipse cx="-2" cy="-22" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.5" fill="#0a0604"/>
    <!-- TENSE jaw — mouth tight -->
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.85"/>
    <!-- Brow furrowed (concern) -->
    <path d="M-5,-27 L-1,-28" stroke="#0a0604" stroke-width="0.55"/>
    <path d="M1,-28 L5,-27" stroke="#0a0604" stroke-width="0.55"/>
  </g>

  <!-- ===== LUMA seated lower beam with comm relay ===== -->
  <g transform="translate(180 250)">
    <ellipse cx="-3" cy="34" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="34" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="20" fill="url(#p1p4lumaSuit)"/>
    <rect x="1" y="14" width="4" height="20" fill="url(#p1p4lumaSuit)"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p1p4lumaSuit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#a888e8" stroke-width="0.7" opacity="0.85" filter="url(#p1p4bloom)"/>
    <!-- Comm relay in lap -->
    <rect x="-6" y="4" width="12" height="8" fill="#3a2068" stroke="#a888e8" stroke-width="0.4"/>
    <rect x="-4" y="6" width="8" height="4" fill="#5a3ad8" filter="url(#p1p4bloom)"/>
    <ellipse cx="0" cy="8" rx="10" ry="3" fill="#a888e8" opacity="0.4" filter="url(#p1p4bloom)"/>
    <!-- Hands on relay -->
    <ellipse cx="-6" cy="6" rx="2" ry="1.4" fill="#7a4838"/>
    <ellipse cx="6" cy="6" rx="2" ry="1.4" fill="#7a4838"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#7a4838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#0a0604"/>
    <path d="M5,-18 Q9,-2 10,14" stroke="#0a0604" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M5,-18 Q9,-2 10,14" stroke="#a888e8" stroke-width="0.5" fill="none" opacity="0.85" filter="url(#p1p4bloom)"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <line x1="-3" y1="-25" x2="-1" y2="-21" stroke="#ffd078" stroke-width="0.4"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.5"/>
  </g>

  <!-- ===== SABLE upper-right back, watching ===== -->
  <g transform="translate(360 250)">
    <ellipse cx="-3" cy="38" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="38" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="16" width="4" height="22" fill="url(#p1p4sableSuit)"/>
    <rect x="1" y="16" width="4" height="22" fill="url(#p1p4sableSuit)"/>
    <ellipse cx="-3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <path d="M-7,16 L-7,-12 L7,-12 L7,16 Z" fill="url(#p1p4sableSuit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#a8c0ff" stroke-width="0.7" opacity="0.85" filter="url(#p1p4bloom)"/>
    <ellipse cx="7" cy="-12" rx="3" ry="2" fill="#3a3038" opacity="0.85"/>
    <rect x="-11" y="-12" width="4" height="24" fill="url(#p1p4sableSuit)"/>
    <rect x="7" y="-12" width="4" height="24" fill="url(#p1p4sableSuit)"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#7a4838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#e0d8d0"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- WREN dialogue 1 (top-left) -->
  <g>
    <rect x="14" y="14" width="266" height="46" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Primary: clock case, window gap. Secondary:</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">floorboard crack, street drain.</text>

  <!-- WREN dialogue 2 (mid-right) — abort -->
  <g>
    <rect x="290" y="14" width="190" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="298" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="298" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410" font-weight="500">Abort = no hesitation.</text>

  <!-- JINK dialogue (right) -->
  <g>
    <rect x="276" y="58" width="200" height="34" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="100,92 112,92 104,102" fill="white" stroke="#2ed078" stroke-width="0.85"/>
    <line x1="100.5" y1="92" x2="111.5" y2="92" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="284" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2ed078" font-weight="700">JINK</text>
  <text x="284" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">If the clockmaker sits down at his bench?</text>

  <!-- WREN reply — single word -->
  <g>
    <rect x="14" y="306" width="160" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="120,306 132,306 124,296" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="120.5" y1="306" x2="131.5" y2="306" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1410" font-weight="500">Theodore.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q120,82 240,78 Q360,76 494,80"/>
    <path d="M0,290 Q120,292 240,288 Q360,286 494,290"/>
  </g>
</svg>
