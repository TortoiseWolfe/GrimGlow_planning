<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 422" width="494" height="422">
  <title>Issue 5 — Page 9 — Panel 3: Wren slips through meshing gear teeth — timed precision — dance with machine</title>
  <desc>35mm medium wide slight high angle. Wren mid-passage through gap between meshing brass teeth. Teeth interlock slowly — gap opens, she moves through, closes behind. Tool kit pulled after. Scanner copper-gold readout counts interval. Timed lethal precision.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p3cavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p9p3brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p9p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p9p3amberHeart" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p3readoutGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p9p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="494" height="422" fill="url(#p9p3cavity)"/>
  <rect width="494" height="422" fill="url(#p9p3amberHeart)"/>

  <!-- ===== LEFT GEAR (third wheel) — partial, with prominent teeth pointing right ===== -->
  <g>
    <!-- Wheel mass -->
    <ellipse cx="-50" cy="200" rx="180" ry="180" fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.85"/>
    <!-- Tooth tips visible (pointing toward mesh point center) -->
    <g fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.55">
      <path d="M130,160 L160,150 L160,170 Z"/>
      <path d="M130,200 L160,190 L160,210 Z"/>
      <path d="M130,240 L160,230 L160,250 Z"/>
      <path d="M120,120 L150,108 L154,128 Z"/>
      <path d="M120,280 L150,272 L154,292 Z"/>
    </g>
    <!-- Inner radial spokes hint -->
    <g stroke="#7a4818" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
      <line x1="-50" y1="200" x2="80" y2="200"/>
      <line x1="-50" y1="200" x2="0" y2="80"/>
      <line x1="-50" y1="200" x2="0" y2="320"/>
    </g>
    <!-- Inner ring -->
    <circle cx="-50" cy="200" r="120" fill="none" stroke="#7a4818" stroke-width="0.85" opacity="0.55"/>
    <!-- Sheen -->
    <ellipse cx="-90" cy="160" rx="34" ry="80" fill="#fff8e8" opacity="0.45" filter="url(#p9p3bloom)"/>
  </g>

  <!-- ===== RIGHT GEAR (fourth wheel target) — partial, teeth pointing left ===== -->
  <g>
    <ellipse cx="544" cy="200" rx="180" ry="180" fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.85"/>
    <g fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.55">
      <path d="M364,150 L334,160 L334,180 Z"/>
      <path d="M364,200 L334,210 L334,230 Z"/>
      <path d="M364,250 L334,260 L334,280 Z"/>
      <path d="M374,108 L344,120 L340,140 Z"/>
      <path d="M374,290 L344,278 L340,298 Z"/>
    </g>
    <g stroke="#7a4818" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
      <line x1="544" y1="200" x2="414" y2="200"/>
      <line x1="544" y1="200" x2="494" y2="80"/>
      <line x1="544" y1="200" x2="494" y2="320"/>
    </g>
    <circle cx="544" cy="200" r="120" fill="none" stroke="#7a4818" stroke-width="0.85" opacity="0.55"/>
    <ellipse cx="494" cy="160" rx="22" ry="80" fill="#fff8e8" opacity="0.45" filter="url(#p9p3bloom)"/>
  </g>

  <!-- ===== MESH GAP — opening at center where Wren passes through ===== -->
  <!-- Gap is dark (negative space between teeth) -->
  <g>
    <!-- Two prominent teeth at mesh point with GAP between them — highlighted -->
    <path d="M180,180 L160,170 L160,150 L180,160 Z" fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.85"/>
    <path d="M314,180 L334,170 L334,150 L314,160 Z" fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.85"/>
    <path d="M180,260 L160,250 L160,230 L180,240 Z" fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.85"/>
    <path d="M314,260 L334,250 L334,230 L314,240 Z" fill="url(#p9p3brass)" stroke="#7a4818" stroke-width="0.85"/>
  </g>

  <!-- TIMING WARNING zones — closing behind, opening ahead -->
  <g stroke="#dc2030" stroke-width="0.55" opacity="0.55" fill="none" stroke-dasharray="3 2">
    <ellipse cx="160" cy="190" rx="9" ry="22"/>
    <ellipse cx="334" cy="190" rx="9" ry="22"/>
  </g>

  <!-- Motion arrows showing teeth closing -->
  <g stroke="#1a1c20" stroke-width="0.55" fill="none" opacity="0.45" stroke-dasharray="2 1.5">
    <path d="M170,150 Q170,200 170,250"/>
    <path d="M324,150 Q324,200 324,250"/>
  </g>

  <!-- ===== WREN slipping through gap (mid-passage) ===== -->
  <g transform="translate(247 200)">
    <!-- Body, low and forward, as if mid-leap/pass -->
    <ellipse cx="-3" cy="14" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="14" rx="3" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="-2" width="4" height="16" fill="url(#p9p3suit)" transform="rotate(-8 -3 6)"/>
    <rect x="1" y="-2" width="4" height="16" fill="url(#p9p3suit)" transform="rotate(5 3 6)"/>
    <!-- Torso angled -->
    <path d="M-8,-2 L-7,-26 L7,-26 L8,-2 Z" fill="url(#p9p3suit)" transform="rotate(-3)"/>
    <line x1="-6" y1="-14" x2="6" y2="-14" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p9p3bloom)"/>
    <ellipse cx="-7" cy="-26" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.85"/>
    <!-- Tool kit being pulled (slightly behind, dragging) -->
    <rect x="-12" y="-22" width="11" height="14" fill="#3a2010" stroke="#1a0c04" stroke-width="0.55" transform="rotate(-12)"/>
    <line x1="-3" y1="-14" x2="-7" y2="-12" stroke="#5a2818" stroke-width="0.85"/>
    <!-- Shoulders -->
    <path d="M-7,-26 Q-5,-34 0,-36 Q5,-34 7,-26 L6,-22 L-6,-22 Z" fill="url(#p9p3suit)"/>
    <!-- Arms — leading + trailing -->
    <path d="M7,-26 L18,-26 L26,-22 L26,-18 L18,-22 L8,-22 Z" fill="url(#p9p3suit)"/>
    <ellipse cx="26" cy="-20" rx="2.4" ry="1.4" fill="#a86838"/>
    <path d="M-7,-26 L-16,-22 L-22,-16 L-18,-14 L-12,-18 L-6,-22 Z" fill="url(#p9p3suit)"/>
    <ellipse cx="-22" cy="-16" rx="2.4" ry="1.4" fill="#a86838"/>
    <!-- Head — looking forward, focused -->
    <ellipse cx="0" cy="-36" rx="5" ry="6.5" fill="#a86838"/>
    <ellipse cx="0" cy="-44" rx="3" ry="2.2" fill="#0a0604"/>
    <ellipse cx="-2" cy="-36" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-36" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-36" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-36" r="0.4" fill="#0a0604"/>
    <path d="M-3,-29 L3,-29" stroke="#3a1808" stroke-width="0.55"/>

    <!-- ===== SCANNER READOUT at her wrist — counting interval ===== -->
    <g transform="translate(28 -16)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#p9p3readoutGlow)" filter="url(#p9p3glow)" opacity="0.85"/>
      <rect x="-14" y="-9" width="28" height="18" rx="0.85" fill="none" stroke="#ffd078" stroke-width="0.55" filter="url(#p9p3bloom)"/>
      <!-- Timer numerals -->
      <text x="0" y="-2" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" font-weight="700" filter="url(#p9p3bloom)">2.4s</text>
      <text x="0" y="6" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.4" fill="#ffd078" filter="url(#p9p3bloom)" opacity="0.85">CLEARANCE</text>
      <!-- Timing pulse bar -->
      <rect x="-12" y="9" width="24" height="2" fill="#3a2010"/>
      <rect x="-12" y="9" width="14" height="2" fill="#80ff80" filter="url(#p9p3bloom)"/>
    </g>
  </g>

  <!-- TICK SFX -->
  <text x="80" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-style="italic" font-weight="700" opacity="0.55" filter="url(#p9p3bloom)" transform="rotate(-12 80 60)">tick</text>
  <text x="380" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-style="italic" font-weight="700" opacity="0.55" filter="url(#p9p3bloom)" transform="rotate(8 380 380)">tock</text>

  <!-- WREN comms (top) -->
  <g>
    <rect x="14" y="14" width="280" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((between ticks))</text>
  <text x="22" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Through the mesh point. At the fourth wheel.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q120,92 240,88 Q360,86 494,90"/>
    <path d="M0,360 Q120,358 240,362 Q360,364 494,360"/>
  </g>
</svg>
