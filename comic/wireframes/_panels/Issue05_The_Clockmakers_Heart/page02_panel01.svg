<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 2 — Panel 1: Theodore peering through floorboard gap — face fills the squad's sky — eager nervousness</title>
  <desc>50mm MS. Looking up from inside the camp through the floorboard gap. Theodore's face frames in the gap — chin on hands, brass gear ring on left index visible. Warm gaslight from above + cool copper-gold from briefing schematic below catches underside of chin.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p2p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c08"/>
    </linearGradient>
    <linearGradient id="p2p1floorboard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="p2p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#6a3828"/>
    </linearGradient>
    <radialGradient id="p2p1gaslightAbove" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p1schematicGlow" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p2p1glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p2p1bg)"/>

  <!-- FLOORBOARD STRUCTURE — viewer is below looking up -->
  <!-- Left floorboard -->
  <rect x="0" y="0" width="80" height="364" fill="url(#p2p1floorboard)"/>
  <line x1="80" y1="0" x2="80" y2="364" stroke="#0a0604" stroke-width="1.4"/>
  <g stroke="#0a0604" stroke-width="0.5" opacity="0.65">
    <line x1="0" y1="40" x2="80" y2="42"/>
    <line x1="0" y1="100" x2="80" y2="102"/>
    <line x1="0" y1="160" x2="80" y2="158"/>
    <line x1="0" y1="220" x2="80" y2="222"/>
    <line x1="0" y1="280" x2="80" y2="278"/>
  </g>
  <!-- Right floorboard -->
  <rect x="280" y="0" width="86" height="364" fill="url(#p2p1floorboard)"/>
  <line x1="280" y1="0" x2="280" y2="364" stroke="#0a0604" stroke-width="1.4"/>
  <g stroke="#0a0604" stroke-width="0.5" opacity="0.65">
    <line x1="280" y1="40" x2="366" y2="42"/>
    <line x1="280" y1="100" x2="366" y2="102"/>
    <line x1="280" y1="160" x2="366" y2="158"/>
    <line x1="280" y1="220" x2="366" y2="222"/>
    <line x1="280" y1="280" x2="366" y2="278"/>
  </g>
  <!-- Knot -->
  <ellipse cx="40" cy="200" rx="6" ry="4" fill="#1a0c04" opacity="0.7"/>
  <ellipse cx="320" cy="120" rx="5" ry="3" fill="#1a0c04" opacity="0.7"/>

  <!-- Schematic glow from BELOW -->
  <ellipse cx="183" cy="364" rx="200" ry="120" fill="url(#p2p1schematicGlow)" filter="url(#p2p1glow)" opacity="0.85"/>

  <!-- ===== GAP between floorboards — Theodore's face fills it ===== -->
  <rect x="80" y="0" width="200" height="364" fill="#0a0408"/>

  <!-- Gaslight from above (Theodore's world) bleeding through gap edges -->
  <ellipse cx="183" cy="0" rx="100" ry="80" fill="url(#p2p1gaslightAbove)" filter="url(#p2p1glow)" opacity="0.55"/>

  <!-- THEODORE'S FACE — looking down, chin on hands, fills most of gap -->
  <g transform="translate(183 200)">
    <!-- HEAD shape — large, looking down (so we see jaw/chin/lower face most prominent) -->
    <ellipse cx="0" cy="0" rx="92" ry="120" fill="url(#p2p1skin)"/>
    <!-- Cool wash on UNDERSIDE of chin (from camp schematic below) -->
    <ellipse cx="0" cy="80" rx="60" ry="24" fill="#ffd078" opacity="0.55" filter="url(#p2p1bloom)"/>
    <!-- Warm wash on TOP of head (from gaslight above) -->
    <ellipse cx="0" cy="-80" rx="80" ry="32" fill="#ffd078" opacity="0.45" filter="url(#p2p1bloom)"/>
    <!-- Hair (untidy, falling forward across forehead) -->
    <path d="M-86,-72 Q-60,-110 0,-118 Q60,-110 86,-72 L82,-58 Q60,-90 30,-86 Q14,-78 -2,-78 Q-18,-86 -32,-90 Q-60,-90 -82,-60 Z" fill="#a87838"/>
    <!-- Hair strands falling down across forehead -->
    <path d="M-22,-90 Q-18,-72 -16,-58" stroke="#7a5028" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M0,-94 Q4,-74 6,-58" stroke="#7a5028" stroke-width="1.6" fill="none" opacity="0.85"/>
    <path d="M22,-92 Q22,-72 20,-58" stroke="#7a5028" stroke-width="2" fill="none" opacity="0.85"/>

    <!-- Freckles on cheeks/nose -->
    <circle cx="-22" cy="-12" r="0.85" fill="#5a3018" opacity="0.85"/>
    <circle cx="-14" cy="-8" r="0.7" fill="#5a3018" opacity="0.85"/>
    <circle cx="14" cy="-8" r="0.7" fill="#5a3018" opacity="0.85"/>
    <circle cx="22" cy="-12" r="0.85" fill="#5a3018" opacity="0.85"/>
    <circle cx="-2" cy="-2" r="0.55" fill="#5a3018" opacity="0.7"/>
    <circle cx="6" cy="-2" r="0.55" fill="#5a3018" opacity="0.7"/>

    <!-- EYES — wide, hazel, reflecting copper-gold from below -->
    <ellipse cx="-26" cy="-30" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="-26" cy="-28" rx="9" ry="6.5" fill="#7a4818"/>
    <circle cx="-26" cy="-28" r="5" fill="#0a0604"/>
    <!-- Reflected copper-gold catchlight from below -->
    <circle cx="-24" cy="-26" r="2.4" fill="#ffd078" opacity="0.85" filter="url(#p2p1bloom)"/>
    <circle cx="-24" cy="-32" r="1.4" fill="#fff8e8" filter="url(#p2p1bloom)"/>

    <ellipse cx="26" cy="-30" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="26" cy="-28" rx="9" ry="6.5" fill="#7a4818"/>
    <circle cx="26" cy="-28" r="5" fill="#0a0604"/>
    <circle cx="28" cy="-26" r="2.4" fill="#ffd078" opacity="0.85" filter="url(#p2p1bloom)"/>
    <circle cx="28" cy="-32" r="1.4" fill="#fff8e8" filter="url(#p2p1bloom)"/>

    <!-- Brows raised — eager -->
    <path d="M-44,-50 L-12,-46" stroke="#5a3018" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M12,-46 L44,-50" stroke="#5a3018" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M-4,-12 L-2,16 Q2,20 6,18 L8,-12 Z" fill="url(#p2p1skin)" opacity="0.85"/>
    <ellipse cx="-1" cy="16" rx="2.4" ry="1" fill="#3a1c08" opacity="0.5"/>
    <ellipse cx="6" cy="16" rx="2.4" ry="1" fill="#3a1c08" opacity="0.5"/>

    <!-- Mouth — slight open, eager -->
    <ellipse cx="0" cy="42" rx="10" ry="3" fill="#3a1808" opacity="0.7"/>
    <path d="M-10,42 L10,42" stroke="#3a1808" stroke-width="1.2"/>
    <!-- Slight upward at corners -->
    <path d="M-10,40 Q-4,38 0,38" fill="none" stroke="#5a2818" stroke-width="0.7" opacity="0.7"/>
    <path d="M0,38 Q4,38 10,40" fill="none" stroke="#5a2818" stroke-width="0.7" opacity="0.7"/>

    <!-- HANDS BELOW chin (chin propped on hands) -->
    <ellipse cx="-50" cy="100" rx="34" ry="22" fill="url(#p2p1skin)"/>
    <ellipse cx="50" cy="100" rx="34" ry="22" fill="url(#p2p1skin)"/>
    <!-- Fingers visible -->
    <ellipse cx="-22" cy="92" rx="8" ry="4" fill="url(#p2p1skin)"/>
    <ellipse cx="-12" cy="84" rx="6" ry="3" fill="url(#p2p1skin)"/>
    <ellipse cx="22" cy="92" rx="8" ry="4" fill="url(#p2p1skin)"/>
    <ellipse cx="12" cy="84" rx="6" ry="3" fill="url(#p2p1skin)"/>
    <!-- Brass gear ring on LEFT INDEX (from his POV; visible on his right hand from our view) -->
    <g transform="translate(22 90)">
      <ellipse cx="0" cy="0" rx="5" ry="3" fill="#ffd078" opacity="0.55" filter="url(#p2p1glow)"/>
      <circle cx="0" cy="0" r="2.2" fill="none" stroke="#e8a850" stroke-width="0.85" filter="url(#p2p1bloom)"/>
      <circle cx="0" cy="0" r="1.4" fill="none" stroke="#ffd078" stroke-width="0.4" opacity="0.85"/>
    </g>
    <!-- Oil stains on hands -->
    <circle cx="-30" cy="100" r="1.6" fill="#1a0c04" opacity="0.7"/>
    <circle cx="-20" cy="106" r="1.2" fill="#1a0c04" opacity="0.65"/>
    <circle cx="32" cy="98" r="1.6" fill="#1a0c04" opacity="0.7"/>
    <circle cx="20" cy="108" r="1.2" fill="#1a0c04" opacity="0.65"/>
  </g>

  <!-- THEODORE dialogue (top) -->
  <g>
    <rect x="14" y="14" width="300" height="50" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="170,64 182,64 174,76" fill="white" stroke="#6a4220" stroke-width="0.85"/>
    <line x1="170.5" y1="64" x2="181.5" y2="64" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6a4220" font-weight="700">THEODORE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">I know Mr. Hoskins. He buys parts from</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Mr. Cribbage sometimes. I've delivered to his shop.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,300 Q90,298 180,302 Q280,304 366,300"/>
  </g>
</svg>
