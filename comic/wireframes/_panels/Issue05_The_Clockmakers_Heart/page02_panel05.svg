<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 5 — Page 2 — Panel 5: Schematic collapses — squad disperses to prepare — war room becomes home again</title>
  <desc>50mm slight high angle. Wren makes closing gesture — schematic geometric shapes folding inward into wrist emitter. Camp returns to baseline cool blue-white perimeter + warm amber filter from above. Jink stretches, Thresh reaches for rack, Luma adjusts comm relay, Sable watches Wren one beat longer.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p2p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p2p5beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p2p5wrenSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p2p5sableSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p2p5jinkSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a8848"/>
    </linearGradient>
    <linearGradient id="p2p5threshSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <linearGradient id="p2p5lumaSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <radialGradient id="p2p5collapsing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p5perimeter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p5floorLeak" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p2p5glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#p2p5bg)"/>

  <!-- Floorboards above -->
  <rect x="0" y="0" width="494" height="20" fill="#3a2818"/>
  <line x1="160" y1="0" x2="160" y2="20" stroke="#1a0c04" stroke-width="0.85"/>
  <line x1="340" y1="0" x2="340" y2="20" stroke="#1a0c04" stroke-width="0.85"/>
  <!-- Floor leaks (warm amber) -->
  <ellipse cx="160" cy="20" rx="34" ry="100" fill="url(#p2p5floorLeak)" filter="url(#p2p5glow)" opacity="0.55"/>
  <ellipse cx="340" cy="20" rx="34" ry="100" fill="url(#p2p5floorLeak)" filter="url(#p2p5glow)" opacity="0.55"/>

  <!-- Beams/walls at edges -->
  <rect x="20" y="20" width="14" height="304" fill="url(#p2p5beam)"/>
  <rect x="460" y="20" width="14" height="304" fill="url(#p2p5beam)"/>
  <!-- Floor -->
  <rect x="34" y="280" width="426" height="44" fill="#1a0c04"/>

  <!-- Cool perimeter wash -->
  <ellipse cx="247" cy="220" rx="240" ry="130" fill="url(#p2p5perimeter)" filter="url(#p2p5glow)" opacity="0.7"/>
  <!-- Perimeter dashed line -->
  <g stroke="#a8c0ff" stroke-width="0.55" fill="none" opacity="0.55" filter="url(#p2p5bloom)" stroke-dasharray="3 2">
    <path d="M40,40 L40,320 L454,320 L454,40 Z"/>
  </g>
  <g fill="#88aaff" filter="url(#p2p5bloom)">
    <circle cx="40" cy="40" r="1.2"/>
    <circle cx="454" cy="40" r="1.2"/>
    <circle cx="40" cy="320" r="1.2"/>
    <circle cx="454" cy="320" r="1.2"/>
  </g>

  <!-- ===== COLLAPSING SCHEMATIC — copper-gold geometric shapes folding inward ===== -->
  <g transform="translate(247 180)">
    <!-- Collapsing aura -->
    <ellipse cx="0" cy="0" rx="100" ry="60" fill="url(#p2p5collapsing)" filter="url(#p2p5glow)" opacity="0.7"/>
    <!-- Folding wireframe shapes — partial fragments -->
    <g stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.7" filter="url(#p2p5bloom)" stroke-dasharray="3 2">
      <path d="M-80,-30 L-50,-20"/>
      <path d="M80,-30 L50,-20"/>
      <path d="M-60,30 L-40,20"/>
      <path d="M60,30 L40,20"/>
      <line x1="-30" y1="-10" x2="-10" y2="-5"/>
      <line x1="30" y1="-10" x2="10" y2="-5"/>
    </g>
    <!-- Particles drifting toward Wren's wrist (right of schematic center) -->
    <g fill="#ffd078" opacity="0.85" filter="url(#p2p5bloom)">
      <circle cx="-40" cy="-10" r="0.7"/>
      <circle cx="-20" cy="-2" r="0.7"/>
      <circle cx="0" cy="2" r="0.7"/>
      <circle cx="20" cy="6" r="0.85"/>
      <circle cx="40" cy="10" r="0.7"/>
      <circle cx="-30" cy="20" r="0.7"/>
      <circle cx="10" cy="14" r="0.7"/>
      <circle cx="50" cy="18" r="0.85"/>
    </g>
    <!-- Inward arrows -->
    <g stroke="#ffd078" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#p2p5bloom)">
      <path d="M-80,0 L-30,10"/>
      <path d="M80,0 L30,10"/>
      <path d="M-60,-30 L-20,-5"/>
      <path d="M60,-30 L20,-5"/>
    </g>
  </g>

  <!-- ===== WREN — closing gesture, hands curling toward wrist emitter ===== -->
  <g transform="translate(247 250)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="26" fill="url(#p2p5wrenSuit)"/>
    <rect x="1" y="14" width="4" height="26" fill="url(#p2p5wrenSuit)"/>
    <ellipse cx="-3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <path d="M-8,14 L-8,-22 L8,-22 L8,14 Z" fill="url(#p2p5wrenSuit)"/>
    <line x1="-6" y1="-12" x2="6" y2="-12" stroke="#ffd078" stroke-width="0.7" opacity="0.85" filter="url(#p2p5bloom)"/>
    <ellipse cx="-8" cy="-22" rx="3" ry="2.4" fill="#1a0c04" opacity="0.85"/>
    <path d="M-8,-22 Q-5,-30 0,-32 Q5,-30 8,-22 L7,-18 L-7,-18 Z" fill="url(#p2p5wrenSuit)"/>
    <!-- Both arms forward making CLOSING gesture (hands meeting) -->
    <path d="M-8,-22 L-2,-14 L4,-14 L8,-22 Z" fill="url(#p2p5wrenSuit)"/>
    <path d="M8,-22 L14,-14 L18,-14 L8,-22 Z" fill="url(#p2p5wrenSuit)"/>
    <!-- Hands -->
    <ellipse cx="-2" cy="-12" rx="3.4" ry="2" fill="#a86838"/>
    <ellipse cx="14" cy="-12" rx="3.4" ry="2" fill="#a86838"/>
    <!-- WRIST EMITTER glow — bright (shapes folding INTO it) -->
    <circle cx="6" cy="-12" r="4" fill="#fff8e8" opacity="0.85" filter="url(#p2p5bloom)"/>
    <circle cx="6" cy="-12" r="9" fill="#ffd078" opacity="0.55" filter="url(#p2p5glow)"/>
    <!-- Forearm scorch -->
    <ellipse cx="-12" cy="-18" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.6"/>
    <ellipse cx="20" cy="-18" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.6"/>
    <!-- Head -->
    <ellipse cx="0" cy="-32" rx="5.5" ry="7" fill="#a86838"/>
    <ellipse cx="0" cy="-42" rx="3" ry="2.2" fill="#0a0604"/>
    <ellipse cx="0" cy="-44" rx="2" ry="1.4" fill="#1a0c04"/>
    <ellipse cx="-2" cy="-32" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="-2" cy="-32" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-32" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="2" cy="-32" r="0.5" fill="#0a0604"/>
    <path d="M-3,-25 L3,-25" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== JINK — stretching, rolling shoulders ===== -->
  <g transform="translate(80 250)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="26" fill="url(#p2p5jinkSuit)"/>
    <rect x="1" y="14" width="4" height="26" fill="url(#p2p5jinkSuit)"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p2p5jinkSuit)"/>
    <ellipse cx="0" cy="-2" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>
    <!-- Arms STRETCHED back, rolling shoulders -->
    <path d="M-7,-12 L-14,-22 L-20,-16 L-16,-12 L-12,-16 L-7,-8 Z" fill="url(#p2p5jinkSuit)"/>
    <path d="M7,-12 L14,-22 L20,-16 L16,-12 L12,-16 L7,-8 Z" fill="url(#p2p5jinkSuit)"/>
    <!-- Head tilted slightly back (stretching) -->
    <ellipse cx="0" cy="-22" rx="5" ry="6" fill="#d8a878"/>
    <path d="M-5,-29 Q-3,-32 0,-32 Q3,-32 5,-29 L5,-25 Q2,-29 0,-29 Q-2,-29 -5,-25 Z" fill="#ffd078"/>
    <circle cx="-3" cy="-31" r="1.4" fill="#ffd078"/>
    <circle cx="3" cy="-30" r="1.6" fill="#ffd078"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 Q0,-12 3,-15" stroke="#3a1808" stroke-width="0.55" fill="none"/>
    <!-- Wing-pack folded -->
    <path d="M-7,-12 L-9,-2 L-7,2 Z" fill="#1a0c04" opacity="0.85"/>
    <path d="M7,-12 L9,-2 L7,2 Z" fill="#1a0c04" opacity="0.85"/>
    <line x1="-7" y1="-8" x2="-7" y2="0" stroke="#2ed078" stroke-width="0.4" opacity="0.7" filter="url(#p2p5bloom)"/>
    <line x1="7" y1="-8" x2="7" y2="0" stroke="#2ed078" stroke-width="0.4" opacity="0.7" filter="url(#p2p5bloom)"/>
  </g>

  <!-- ===== THRESH — reaching for weapon rack on beam ledge ===== -->
  <g transform="translate(420 250)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="26" fill="url(#p2p5threshSuit)"/>
    <rect x="1" y="14" width="4" height="26" fill="url(#p2p5threshSuit)"/>
    <ellipse cx="-3" cy="28" rx="2" ry="0.85" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="3" cy="28" rx="2" ry="0.85" fill="#1a0c04" opacity="0.7"/>
    <path d="M-9,14 L-9,-12 L9,-12 L9,14 Z" fill="url(#p2p5threshSuit)"/>
    <ellipse cx="-9" cy="-12" rx="3" ry="2" fill="#5a0818"/>
    <!-- Right arm REACHING up to a weapon rack on beam (off-frame top) -->
    <path d="M9,-12 L14,-26 L18,-38 L14,-40 L10,-30 L7,-14 Z" fill="url(#p2p5threshSuit)"/>
    <ellipse cx="14" cy="-40" rx="3" ry="2" fill="#a86838"/>
    <!-- Weapon rack edge visible above -->
    <rect x="14" y="-46" width="14" height="3" fill="#3a2818"/>
    <rect x="18" y="-50" width="9" height="2" fill="#3a3030"/>
    <!-- Left arm at side -->
    <rect x="-13" y="-12" width="4" height="22" fill="url(#p2p5threshSuit)"/>
    <ellipse cx="-11" cy="14" rx="2.4" ry="1.6" fill="#a86838"/>
    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#a86838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L4,-25 Q2,-28 0,-28 Q-2,-28 -4,-25 Z" fill="#c84838"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.7"/>
  </g>

  <!-- ===== LUMA — adjusting comm relay ===== -->
  <g transform="translate(170 270)">
    <ellipse cx="-3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="36" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="22" fill="url(#p2p5lumaSuit)"/>
    <rect x="1" y="14" width="4" height="22" fill="url(#p2p5lumaSuit)"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p2p5lumaSuit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#a888e8" stroke-width="0.6" opacity="0.85" filter="url(#p2p5bloom)"/>
    <!-- Comm relay raised, hand on it -->
    <rect x="-6" y="2" width="14" height="8" fill="#3a2068" stroke="#a888e8" stroke-width="0.4"/>
    <rect x="-4" y="4" width="10" height="4" fill="#5a3ad8" filter="url(#p2p5bloom)"/>
    <ellipse cx="1" cy="6" rx="11" ry="3" fill="#a888e8" opacity="0.5" filter="url(#p2p5bloom)"/>
    <!-- Hands on relay -->
    <ellipse cx="-7" cy="6" rx="3" ry="2" fill="#7a4838"/>
    <ellipse cx="9" cy="6" rx="3" ry="2" fill="#7a4838"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6" fill="#7a4838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#0a0604"/>
    <path d="M5,-18 Q9,-2 10,16" stroke="#0a0604" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M5,-18 Q9,-2 10,16" stroke="#a888e8" stroke-width="0.5" fill="none" opacity="0.85" filter="url(#p2p5bloom)"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <line x1="-3" y1="-25" x2="-1" y2="-21" stroke="#ffd078" stroke-width="0.4"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.5"/>
  </g>

  <!-- ===== SABLE — watching Wren one beat longer ===== -->
  <g transform="translate(330 250)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.5" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="26" fill="url(#p2p5sableSuit)"/>
    <rect x="1" y="14" width="4" height="26" fill="url(#p2p5sableSuit)"/>
    <ellipse cx="-3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="3" cy="28" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p2p5sableSuit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#a8c0ff" stroke-width="0.7" opacity="0.85" filter="url(#p2p5bloom)"/>
    <ellipse cx="7" cy="-12" rx="3" ry="2" fill="#3a3038"/>
    <rect x="-11" y="-12" width="4" height="24" fill="url(#p2p5sableSuit)"/>
    <rect x="7" y="-12" width="4" height="24" fill="url(#p2p5sableSuit)"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#7a4838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#e0d8d0"/>
    <!-- Eyes turned toward Wren (left) -->
    <ellipse cx="-3" cy="-22" rx="1" ry="0.55" fill="#fff8e8"/>
    <circle cx="-3" cy="-22" r="0.45" fill="#0a0604"/>
    <ellipse cx="1" cy="-22" rx="1" ry="0.55" fill="#fff8e8"/>
    <circle cx="0" cy="-22" r="0.45" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- WREN dialogue (top-left) -->
  <g>
    <rect x="14" y="14" width="240" height="36" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="180,50 192,50 184,60" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="180.5" y1="50" x2="191.5" y2="50" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Check comms at six-thirty. Full system test.</text>

  <!-- LUMA dialogue (right) -->
  <g>
    <rect x="270" y="316" width="216" height="34" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="320,316 332,316 324,306" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="320.5" y1="316" x2="331.5" y2="316" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="278" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="278" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">I'll have the relay calibrated by six.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q120,82 240,78 Q360,76 494,80"/>
    <path d="M0,290 Q120,292 240,288 Q360,286 494,290"/>
  </g>
</svg>
