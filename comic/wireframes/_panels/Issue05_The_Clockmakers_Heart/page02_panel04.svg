<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 5 — Page 2 — Panel 4: Thresh CU — controlled tension at her exposed window-ledge assignment</title>
  <desc>85mm CU. Thresh staring at her crimson position marker. Jaw rigid. Eyes steady but the effort visible. Crimson glow catches her copper-red buzz. She is afraid. She will do it anyway. Silent panel.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p2p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p2p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#6a3828"/>
    </linearGradient>
    <linearGradient id="p2p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <radialGradient id="p2p4crimsonGlow" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a0828" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2p4coolBack" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p2p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="238" height="364" fill="url(#p2p4bg)"/>

  <!-- Crimson wash from off-panel left (her position marker in the schematic) -->
  <rect width="238" height="364" fill="url(#p2p4crimsonGlow)"/>
  <!-- Cool camp wash from right -->
  <rect width="238" height="364" fill="url(#p2p4coolBack)"/>

  <!-- ===== THRESH face — tight CU ===== -->
  <g transform="translate(119 200)">
    <!-- Body (top of pauldron visible) -->
    <path d="M-50,150 L-60,90 L60,90 L50,150 Z" fill="url(#p2p4suit)"/>
    <!-- Pauldron (dented left) -->
    <ellipse cx="-58" cy="80" rx="14" ry="10" fill="#5a0818"/>
    <ellipse cx="-60" cy="84" rx="6" ry="4" fill="#3a0818"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="0" rx="100" ry="130" fill="url(#p2p4skin)"/>
    <!-- Left side crimson wash -->
    <ellipse cx="-50" cy="-10" rx="34" ry="60" fill="#dc2030" opacity="0.4" filter="url(#p2p4glow)"/>
    <!-- Right side cool wash -->
    <ellipse cx="50" cy="-10" rx="34" ry="60" fill="#a8c0ff" opacity="0.25" filter="url(#p2p4glow)"/>

    <!-- HAIR — copper-red BUZZ cut, short -->
    <path d="M-78,-100 Q-60,-138 0,-144 Q60,-138 80,-94 L78,-80 Q56,-110 0,-110 Q-56,-110 -78,-80 Z" fill="#c84838"/>
    <!-- Catches crimson glow on left -->
    <path d="M-78,-100 Q-60,-130 -10,-138" stroke="#ff5048" stroke-width="2.4" fill="none" opacity="0.7" filter="url(#p2p4bloom)"/>
    <!-- Hair texture: short choppy strokes -->
    <g stroke="#a83020" stroke-width="0.85" opacity="0.7">
      <line x1="-40" y1="-130" x2="-38" y2="-110"/>
      <line x1="-20" y1="-138" x2="-18" y2="-118"/>
      <line x1="0" y1="-140" x2="0" y2="-120"/>
      <line x1="20" y1="-138" x2="22" y2="-118"/>
      <line x1="40" y1="-130" x2="42" y2="-110"/>
      <line x1="-60" y1="-118" x2="-56" y2="-100"/>
      <line x1="60" y1="-118" x2="56" y2="-100"/>
    </g>

    <!-- EYES — STEADY, the effort visible -->
    <ellipse cx="-32" cy="0" rx="20" ry="11" fill="#fff8e8"/>
    <ellipse cx="-32" cy="2" rx="13" ry="8" fill="#3a2010"/>
    <circle cx="-32" cy="2" r="7" fill="#0a0604"/>
    <circle cx="-30" cy="-1" r="2.4" fill="#fff8e8" filter="url(#p2p4bloom)"/>

    <ellipse cx="32" cy="0" rx="20" ry="11" fill="#fff8e8"/>
    <ellipse cx="32" cy="2" rx="13" ry="8" fill="#3a2010"/>
    <circle cx="32" cy="2" r="7" fill="#0a0604"/>
    <circle cx="34" cy="-1" r="2.4" fill="#fff8e8" filter="url(#p2p4bloom)"/>

    <!-- Brows level + RIGID — controlled tension -->
    <path d="M-54,-26 L-12,-30" stroke="#3a1808" stroke-width="3" stroke-linecap="round"/>
    <path d="M12,-30 L54,-26" stroke="#3a1808" stroke-width="3" stroke-linecap="round"/>
    <!-- Tension creases between brows -->
    <line x1="-2" y1="-28" x2="-1" y2="-12" stroke="#3a2010" stroke-width="0.85" opacity="0.7"/>
    <line x1="2" y1="-28" x2="3" y2="-12" stroke="#3a2010" stroke-width="0.85" opacity="0.7"/>

    <!-- Nose -->
    <path d="M-6,18 L-2,46 Q2,50 6,48 L10,18 Z" fill="url(#p2p4skin)" opacity="0.85"/>
    <ellipse cx="-2" cy="46" rx="3" ry="1.6" fill="#3a1c08" opacity="0.5"/>
    <ellipse cx="6" cy="46" rx="3" ry="1.6" fill="#3a1c08" opacity="0.5"/>

    <!-- MOUTH — RIGID line, JAW SET -->
    <path d="M-18,76 L18,76" stroke="#3a1808" stroke-width="3" stroke-linecap="round"/>
    <!-- Jaw muscle tension visible at corners -->
    <line x1="-22" y1="74" x2="-26" y2="84" stroke="#3a2010" stroke-width="0.85" opacity="0.65"/>
    <line x1="22" y1="74" x2="26" y2="84" stroke="#3a2010" stroke-width="0.85" opacity="0.65"/>

    <!-- Faint micro tremor — barely visible eye corner tension -->
    <path d="M-50,8 L-46,12" stroke="#3a2010" stroke-width="0.55" opacity="0.55"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q60,82 120,78 Q180,76 238,80"/>
    <path d="M0,300 Q60,298 120,302 Q180,304 238,300"/>
  </g>
</svg>
