<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 5 — Page 11 — Panel 5: Theodore's hand on brass door handle — gear ring catches light — first useful thing</title>
  <desc>85mm CU. Theodore's oil-stained fingers wrap around brass door handle. Brass gear ring on left index catches gaslight. Knuckles tense. Through glazed upper panel, warm shop interior. Threshold between observer and participant. Caption: First useful thing he'd ever done for them.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <linearGradient id="p11p5timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <linearGradient id="p11p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p11p5brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p11p5shopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p5gaslight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p11p5glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="238" height="364" fill="url(#p11p5bg)"/>

  <!-- DOOR — dark green timber surround -->
  <rect width="238" height="364" fill="url(#p11p5timber)"/>

  <!-- ===== GLAZED UPPER PANEL — shop interior visible behind ===== -->
  <rect x="20" y="20" width="198" height="160" fill="#3a2010"/>
  <rect x="24" y="24" width="190" height="152" fill="#7a5028"/>
  <ellipse cx="119" cy="100" rx="100" ry="70" fill="url(#p11p5shopGlow)" filter="url(#p11p5glow)" opacity="0.95"/>
  <line x1="119" y1="24" x2="119" y2="176" stroke="#0a1808" stroke-width="0.85"/>
  <line x1="24" y1="100" x2="214" y2="100" stroke="#0a1808" stroke-width="0.7"/>
  <!-- Faint clocks visible inside -->
  <g opacity="0.7">
    <circle cx="60" cy="80" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="60" cy="80" r="7" fill="#fff8e8" opacity="0.85"/>
    <circle cx="160" cy="80" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="160" cy="80" r="7" fill="#fff8e8" opacity="0.85"/>
    <circle cx="80" cy="140" r="6" fill="#3a2010" stroke="#a86838" stroke-width="0.4"/>
    <circle cx="160" cy="140" r="6" fill="#3a2010" stroke="#a86838" stroke-width="0.4"/>
  </g>

  <!-- DIVIDER between glass panel and door body -->
  <rect x="0" y="180" width="238" height="6" fill="#0a1808"/>

  <!-- DOOR BODY (lower part — wood paneling) -->
  <rect x="0" y="186" width="238" height="178" fill="url(#p11p5timber)"/>
  <g stroke="#0a1808" stroke-width="0.55" opacity="0.65">
    <line x1="40" y1="186" x2="40" y2="364"/>
    <line x1="119" y1="186" x2="119" y2="364"/>
    <line x1="198" y1="186" x2="198" y2="364"/>
  </g>

  <!-- ===== BRASS DOOR HANDLE — large, dominant ===== -->
  <g transform="translate(180 240)">
    <!-- Mount plate -->
    <rect x="-22" y="-30" width="44" height="60" rx="3" fill="url(#p11p5brass)" stroke="#7a4818" stroke-width="0.85"/>
    <!-- Handle (lever style, sticking out toward viewer) -->
    <rect x="-22" y="-6" width="80" height="12" rx="3" fill="url(#p11p5brass)" stroke="#7a4818" stroke-width="0.7"/>
    <ellipse cx="58" cy="0" rx="5" ry="6" fill="url(#p11p5brass)" stroke="#7a4818" stroke-width="0.55"/>
    <!-- Keyhole below -->
    <rect x="-3" y="14" width="6" height="9" fill="#1a0c04"/>
    <circle cx="0" cy="14" r="3" fill="#1a0c04"/>
    <!-- Brass screws on plate -->
    <circle cx="-18" cy="-26" r="1.4" fill="#7a4818"/>
    <circle cx="18" cy="-26" r="1.4" fill="#7a4818"/>
    <circle cx="-18" cy="26" r="1.4" fill="#7a4818"/>
    <circle cx="18" cy="26" r="1.4" fill="#7a4818"/>
    <!-- Polished sheen -->
    <line x1="-22" y1="-26" x2="22" y2="-22" stroke="#fff8e8" stroke-width="0.55" opacity="0.85" filter="url(#p11p5bloom)"/>
    <line x1="-22" y1="-2" x2="58" y2="0" stroke="#fff8e8" stroke-width="0.55" opacity="0.85" filter="url(#p11p5bloom)"/>
  </g>

  <!-- ===== THEODORE'S HAND — wrapping around handle ===== -->
  <g transform="translate(120 280)">
    <!-- Forearm visible at edge of frame -->
    <rect x="-46" y="-26" width="46" height="60" fill="#5a2828"/>
    <!-- Cuff -->
    <line x1="-46" y1="-22" x2="0" y2="-22" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Wrist + hand cradling handle -->
    <ellipse cx="20" cy="-2" rx="22" ry="14" fill="url(#p11p5skin)"/>

    <!-- Fingers WRAPPING around brass handle (thumb + four fingers visible) -->
    <ellipse cx="36" cy="-12" rx="6" ry="3.4" fill="url(#p11p5skin)" transform="rotate(-15 36 -12)"/>
    <ellipse cx="44" cy="-6" rx="6" ry="3.4" fill="url(#p11p5skin)" transform="rotate(-5 44 -6)"/>
    <ellipse cx="46" cy="2" rx="6" ry="3.4" fill="url(#p11p5skin)" transform="rotate(5 46 2)"/>
    <ellipse cx="42" cy="10" rx="5" ry="3" fill="url(#p11p5skin)" transform="rotate(15 42 10)"/>
    <!-- Thumb wrapped under -->
    <ellipse cx="22" cy="14" rx="9" ry="4" fill="url(#p11p5skin)"/>

    <!-- BRASS GEAR RING on left index finger -->
    <g transform="translate(36 -10)">
      <circle cx="0" cy="0" r="3.4" fill="url(#p11p5brass)" stroke="#7a4818" stroke-width="0.55"/>
      <circle cx="0" cy="0" r="2" fill="none" stroke="#a86838" stroke-width="0.55"/>
      <!-- Gear teeth -->
      <line x1="-3.4" y1="0" x2="-4.4" y2="0" stroke="#7a4818" stroke-width="0.7"/>
      <line x1="3.4" y1="0" x2="4.4" y2="0" stroke="#7a4818" stroke-width="0.7"/>
      <line x1="0" y1="-3.4" x2="0" y2="-4.4" stroke="#7a4818" stroke-width="0.7"/>
      <line x1="0" y1="3.4" x2="0" y2="4.4" stroke="#7a4818" stroke-width="0.7"/>
      <line x1="-2.4" y1="-2.4" x2="-3" y2="-3" stroke="#7a4818" stroke-width="0.7"/>
      <line x1="2.4" y1="-2.4" x2="3" y2="-3" stroke="#7a4818" stroke-width="0.7"/>
      <line x1="-2.4" y1="2.4" x2="-3" y2="3" stroke="#7a4818" stroke-width="0.7"/>
      <line x1="2.4" y1="2.4" x2="3" y2="3" stroke="#7a4818" stroke-width="0.7"/>
      <!-- Highlight -->
      <ellipse cx="-1" cy="-1" rx="1.4" ry="0.85" fill="#fff8e8" opacity="0.85" filter="url(#p11p5bloom)"/>
    </g>

    <!-- KNUCKLES TENSE — subtle knuckle whitening + tension creases -->
    <ellipse cx="36" cy="-14" rx="2" ry="0.85" fill="#fff8e8" opacity="0.65" filter="url(#p11p5bloom)"/>
    <ellipse cx="44" cy="-8" rx="2" ry="0.85" fill="#fff8e8" opacity="0.65" filter="url(#p11p5bloom)"/>
    <ellipse cx="46" cy="0" rx="2" ry="0.85" fill="#fff8e8" opacity="0.65" filter="url(#p11p5bloom)"/>
    <ellipse cx="42" cy="8" rx="2" ry="0.85" fill="#fff8e8" opacity="0.65" filter="url(#p11p5bloom)"/>
    <!-- Tension creases between fingers -->
    <path d="M40,-12 Q42,-9 44,-6" stroke="#7a4818" stroke-width="0.4" fill="none" opacity="0.55"/>
    <path d="M44,-2 Q46,1 46,4" stroke="#7a4818" stroke-width="0.4" fill="none" opacity="0.55"/>

    <!-- OIL STAINS on hand -->
    <circle cx="22" cy="-2" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="14" cy="6" r="1" fill="#1a0c04" opacity="0.55"/>
    <circle cx="36" cy="6" r="0.85" fill="#1a0c04" opacity="0.55"/>

    <!-- Small burn scar on knuckle -->
    <ellipse cx="44" cy="-8" rx="1.4" ry="0.85" fill="#5a2828" opacity="0.55"/>

    <!-- Warm gaslight halo around hand/handle -->
    <ellipse cx="36" cy="0" rx="50" ry="40" fill="url(#p11p5gaslight)" filter="url(#p11p5glow)" opacity="0.55"/>
  </g>

  <!-- CAPTION — bottom -->
  <g>
    <rect x="14" y="316" width="210" height="34" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5a4a30" font-style="italic" font-weight="500">First useful thing he'd ever done for them.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,300 Q60,298 120,302 Q180,304 238,300"/>
  </g>
</svg>
