<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 311" width="238" height="311">
  <title>Issue 5 — Page 13 — Panel 4: Wren's hand reaching toward earpiece — agonizing slowness — copper-gold pulse</title>
  <desc>100mm ECU. Oil-stained hand moves with agonizing slowness toward earpiece. Fingers steady despite everything. Brass plate beneath shows oil film. Faint copper-gold pulse at earpiece, barely visible. Deep shadow. Dialog: WREN sub-whisper: Sable. He's at the bench. I'm pinned.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p13p4brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="50%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p13p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <radialGradient id="p13p4earpiece" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p13p4amberFaint" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p13p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="238" height="311" fill="url(#p13p4bg)"/>
  <rect width="238" height="311" fill="url(#p13p4amberFaint)"/>

  <!-- BRASS PLATE — fills lower 2/3 -->
  <rect x="0" y="100" width="238" height="211" fill="url(#p13p4brass)"/>
  <line x1="0" y1="100" x2="238" y2="100" stroke="#7a4818" stroke-width="0.55" opacity="0.65" filter="url(#p13p4bloom)"/>
  <!-- Oil film on brass — subtle warm reflection -->
  <ellipse cx="119" cy="200" rx="80" ry="40" fill="#ffd078" opacity="0.18" filter="url(#p13p4bloom)"/>
  <!-- Brass texture lines -->
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="140" x2="238" y2="142"/>
    <line x1="0" y1="180" x2="238" y2="178"/>
    <line x1="0" y1="220" x2="238" y2="222"/>
    <line x1="0" y1="260" x2="238" y2="258"/>
    <line x1="0" y1="300" x2="238" y2="302"/>
  </g>

  <!-- EARPIECE at top edge — small device, copper-gold pulse barely visible -->
  <g transform="translate(60 50)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="url(#p13p4earpiece)" filter="url(#p13p4glow)"/>
    <ellipse cx="0" cy="0" rx="12" ry="7" fill="#5a3018"/>
    <ellipse cx="0" cy="0" rx="9" ry="5" fill="#3a1808"/>
    <!-- Tiny pulse -->
    <circle cx="0" cy="0" r="2" fill="#ffaa48" opacity="0.85" filter="url(#p13p4bloom)"/>
    <!-- Thin antenna line -->
    <line x1="-6" y1="-10" x2="-2" y2="-14" stroke="#a86838" stroke-width="0.55"/>
    <line x1="6" y1="-10" x2="2" y2="-14" stroke="#a86838" stroke-width="0.55"/>
  </g>

  <!-- WREN'S HAND — reaching UP-LEFT toward earpiece, agonizing slow movement -->
  <g transform="translate(120 200)">
    <!-- Forearm extending into frame from bottom-right -->
    <path d="M40,100 L60,40 L40,0 L20,80 Z" fill="url(#p13p4skin)"/>
    <!-- Suit cuff -->
    <line x1="44" y1="80" x2="60" y2="40" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Wrist -->
    <ellipse cx="40" cy="0" rx="12" ry="7" fill="url(#p13p4skin)"/>

    <!-- Palm and fingers reaching UP-LEFT toward earpiece -->
    <ellipse cx="20" cy="-20" rx="14" ry="8" fill="url(#p13p4skin)"/>

    <!-- Fingers extending toward earpiece -->
    <path d="M14,-26 L-30,-110 L-22,-118 L26,-32 Z" fill="url(#p13p4skin)"/>
    <ellipse cx="-26" cy="-114" rx="5" ry="3" fill="url(#p13p4skin)"/>
    <!-- Other fingers (curled) -->
    <ellipse cx="6" cy="-26" rx="4" ry="2.4" fill="url(#p13p4skin)"/>
    <ellipse cx="-2" cy="-22" rx="3" ry="2" fill="url(#p13p4skin)"/>

    <!-- Knuckle line -->
    <path d="M0,-22 L20,-20" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>

    <!-- HEAVY OIL STAINS on hand (heavier than P1-11) -->
    <circle cx="14" cy="-12" r="2" fill="#1a0c04" opacity="0.75"/>
    <circle cx="22" cy="-4" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="6" cy="-6" r="1.4" fill="#1a0c04" opacity="0.7"/>
    <circle cx="-12" cy="-50" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="-22" cy="-90" r="1" fill="#1a0c04" opacity="0.55"/>
    <circle cx="34" cy="40" r="1.8" fill="#1a0c04" opacity="0.7"/>
    <circle cx="40" cy="60" r="1.4" fill="#1a0c04" opacity="0.65"/>

    <!-- Faint warm reflection (brass beneath) -->
    <ellipse cx="20" cy="14" rx="14" ry="3" fill="#ffd078" opacity="0.35" filter="url(#p13p4bloom)"/>
  </g>

  <!-- DIALOG — WREN sub-whisper -->
  <g transform="translate(119 280)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-28,-18 L-38,-32 L-22,-20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-90" y="-8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-90" y="6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="600">"Sable. He's at the bench.</text>
    <text x="-90" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="600">I'm pinned."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,260 Q60,258 120,262 Q180,264 238,260"/>
  </g>
</svg>
