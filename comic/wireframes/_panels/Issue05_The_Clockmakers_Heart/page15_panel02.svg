<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 5 — Page 15 — Panel 2: Clockmaker face CU appraising — skeptical attention — categorizes Theodore</title>
  <desc>85mm CU. Clockmaker pushes spectacles up, looks at Theodore properly. Sees apprentice boy not customer. Expression: appraising skepticism, not unkind, evaluating eye. Categorizes: tinker, general repair, not clockwork trade. Dialog: CLOCKMAKER: My work. / CLOCKMAKER: And what would you know about my work, boy?</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p15p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a5828"/>
    </linearGradient>
    <linearGradient id="p15p2waistcoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p15p2lampGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p15p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="241" height="364" fill="url(#p15p2bg)"/>
  <rect width="241" height="364" fill="url(#p15p2lampGlow)" opacity="0.85"/>

  <!-- ===== CLOCKMAKER FACE ===== -->
  <g transform="translate(120 200)">
    <!-- Wool waistcoat collar at bottom -->
    <path d="M-100,150 L-110,90 L110,90 L100,150 Z" fill="url(#p15p2waistcoat)"/>
    <!-- Linen collar -->
    <ellipse cx="0" cy="84" rx="22" ry="9" fill="#d8c8a8"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="100" ry="120" fill="url(#p15p2skin)"/>

    <!-- Thinning brown hair -->
    <path d="M-90,-100 Q-70,-122 0,-128 Q70,-122 90,-100 L84,-80 Q56,-110 0,-110 Q-56,-110 -84,-80 Z" fill="#7a5028"/>

    <!-- WIRE-RIMMED SPECTACLES PUSHED UP on forehead now (he's looking at Theodore properly) -->
    <ellipse cx="-44" cy="-90" rx="22" ry="9" fill="none" stroke="#3a2818" stroke-width="1.4"/>
    <ellipse cx="44" cy="-90" rx="22" ry="9" fill="none" stroke="#3a2818" stroke-width="1.4"/>
    <line x1="-22" y1="-90" x2="22" y2="-90" stroke="#3a2818" stroke-width="0.7"/>
    <!-- Lens shine -->
    <ellipse cx="-50" cy="-92" rx="6" ry="3" fill="#fff8e8" opacity="0.85" filter="url(#p15p2bloom)"/>
    <ellipse cx="38" cy="-92" rx="6" ry="3" fill="#fff8e8" opacity="0.85" filter="url(#p15p2bloom)"/>

    <!-- EYES — pale blue-grey, appraising, evaluating -->
    <ellipse cx="-36" cy="-30" rx="20" ry="11" fill="#fff8e8"/>
    <ellipse cx="-36" cy="-26" rx="13" ry="8" fill="#a8b8c8"/>
    <circle cx="-36" cy="-26" r="6" fill="#3a4858"/>
    <circle cx="-36" cy="-26" r="2" fill="#0a0c14"/>
    <circle cx="-34" cy="-30" r="2" fill="#fff8e8" filter="url(#p15p2bloom)"/>
    <!-- Crow's feet creases — appraising squint -->
    <path d="M-58,-30 L-66,-32" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>
    <path d="M-58,-22 L-66,-20" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>

    <ellipse cx="36" cy="-30" rx="20" ry="11" fill="#fff8e8"/>
    <ellipse cx="36" cy="-26" rx="13" ry="8" fill="#a8b8c8"/>
    <circle cx="36" cy="-26" r="6" fill="#3a4858"/>
    <circle cx="36" cy="-26" r="2" fill="#0a0c14"/>
    <circle cx="38" cy="-30" r="2" fill="#fff8e8" filter="url(#p15p2bloom)"/>
    <path d="M58,-30 L66,-32" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>
    <path d="M58,-22 L66,-20" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>

    <!-- Brows — slightly down, evaluating -->
    <path d="M-58,-50 L-18,-48" stroke="#5a3018" stroke-width="3" stroke-linecap="round"/>
    <path d="M18,-48 L58,-50" stroke="#5a3018" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M-6,0 L-4,40 Q0,44 6,42 L10,0 Z" fill="url(#p15p2skin)" opacity="0.85"/>
    <ellipse cx="-2" cy="40" rx="3" ry="2" fill="#3a1c08" opacity="0.55"/>
    <ellipse cx="6" cy="40" rx="3" ry="2" fill="#3a1c08" opacity="0.55"/>

    <!-- Mouth — pursed, evaluating -->
    <path d="M-22,68 L22,68" stroke="#3a1808" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Faint downturn at corners (skepticism) -->
    <path d="M-22,68 Q-26,72 -28,76" stroke="#5a3018" stroke-width="0.85" fill="none" opacity="0.65"/>
    <path d="M22,68 Q26,72 28,76" stroke="#5a3018" stroke-width="0.85" fill="none" opacity="0.65"/>

    <!-- Salt-pepper stubble -->
    <g fill="#5a3018" opacity="0.55">
      <circle cx="-26" cy="74" r="0.55"/>
      <circle cx="-14" cy="78" r="0.55"/>
      <circle cx="0" cy="80" r="0.55"/>
      <circle cx="14" cy="78" r="0.55"/>
      <circle cx="26" cy="74" r="0.55"/>
    </g>

    <!-- Warm amber on cheek -->
    <ellipse cx="-50" cy="14" rx="11" ry="22" fill="#ffd078" opacity="0.45" filter="url(#p15p2bloom)"/>
    <ellipse cx="50" cy="14" rx="11" ry="22" fill="#ffd078" opacity="0.45" filter="url(#p15p2bloom)"/>
  </g>

  <!-- DIALOG (1) — short, flat -->
  <g transform="translate(120 30)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,16 L-32,28 L-18,18 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-50" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-50" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">"My work."</text>
  </g>

  <!-- DIALOG (2) — challenge -->
  <g transform="translate(120 330)">
    <ellipse cx="0" cy="0" rx="100" ry="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,-22 L-32,-36 L-18,-24 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-90" y="-12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-90" y="3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"And what would you know</text>
    <text x="-90" y="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">about my work, boy?"</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 241,90"/>
    <path d="M0,300 Q60,298 120,302 Q180,304 241,300"/>
  </g>
</svg>
