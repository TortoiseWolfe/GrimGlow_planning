<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 8 — Panel 2: Boot CU — clockmaker's tap is the metronome of infiltration</title>
  <desc>85mm low angle CU. Enormous Victorian work boot, leather scuffed and oil-stained, brass eyelets and thick lacing. Mid-tap with sole lifted slightly revealing worn leather + cobbler's nail. Wren blurred in shadow background mid-step.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p8p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1808"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p8p2floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p8p2leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="50%" stop-color="#7a3818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p8p2amberLight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p8p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p8p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="p8p2blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p8p2bg)"/>

  <!-- Warm amber wash from off-panel oil lamp -->
  <rect width="366" height="364" fill="url(#p8p2amberLight)"/>

  <!-- FLOOR -->
  <rect x="0" y="280" width="366" height="84" fill="url(#p8p2floor)"/>
  <line x1="0" y1="284" x2="366" y2="284" stroke="#3a1808" stroke-width="0.85"/>
  <g stroke="#3a1808" stroke-width="0.55" opacity="0.55">
    <line x1="0" y1="320" x2="366" y2="324"/>
    <line x1="120" y1="284" x2="100" y2="364"/>
    <line x1="280" y1="284" x2="260" y2="364"/>
  </g>

  <!-- ===== SHADOW (where Wren waits, blurred background) ===== -->
  <rect x="0" y="200" width="180" height="84" fill="#0a0604" opacity="0.55"/>

  <!-- ===== WREN BLURRED in background shadow — frozen mid-step ===== -->
  <g transform="translate(80 240)" filter="url(#p8p2blur)" opacity="0.7">
    <ellipse cx="-2" cy="20" rx="2.4" ry="1" fill="#0a0408"/>
    <ellipse cx="2" cy="20" rx="2.4" ry="1" fill="#0a0408"/>
    <rect x="-3" y="0" width="2.4" height="20" fill="#a86838"/>
    <rect x="0" y="0" width="2.4" height="20" fill="#a86838"/>
    <path d="M-5,0 L-4,-22 L4,-22 L5,0 Z" fill="#a86838"/>
    <ellipse cx="0" cy="-28" rx="3" ry="4" fill="#a86838"/>
    <ellipse cx="0" cy="-32" rx="2" ry="1.4" fill="#0a0604"/>
  </g>

  <!-- ===== CLOCKMAKER'S BOOT — DOMINANT, sharp focus ===== -->
  <g transform="translate(220 200)">
    <!-- Trouser cuff descending -->
    <rect x="-46" y="-200" width="62" height="160" fill="#3a2010"/>
    <line x1="-46" y1="-180" x2="16" y2="-180" stroke="#1a0c04" stroke-width="0.55" opacity="0.65"/>
    <line x1="-46" y1="-120" x2="16" y2="-120" stroke="#1a0c04" stroke-width="0.55" opacity="0.65"/>

    <!-- BOOT body — large, mid-tap with slight lift -->
    <ellipse cx="0" cy="40" rx="120" ry="36" fill="url(#p8p2leather)"/>
    <!-- Boot upper -->
    <path d="M-100,40 L-80,-40 L80,-40 L100,40 Z" fill="url(#p8p2leather)"/>
    <line x1="-80" y1="-40" x2="80" y2="-40" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Sole edge (lifted, revealing worn leather + cobbler's nail) -->
    <ellipse cx="0" cy="60" rx="120" ry="14" fill="#1a0c04"/>
    <rect x="-120" y="60" width="240" height="14" fill="#1a0c04"/>
    <!-- Worn leather under sole (script demand) -->
    <ellipse cx="-30" cy="68" rx="40" ry="6" fill="#5a3818" opacity="0.85"/>
    <ellipse cx="40" cy="70" rx="34" ry="5" fill="#5a3818" opacity="0.85"/>
    <!-- Cobbler's nail -->
    <circle cx="-20" cy="70" r="2" fill="#a8a0a0"/>
    <circle cx="-20" cy="70" r="0.85" fill="#fff8e8" filter="url(#p8p2bloom)"/>
    <circle cx="44" cy="70" r="1.6" fill="#7a8088"/>

    <!-- Brass eyelets (script demand) -->
    <g fill="#ffd078" stroke="#a86838" stroke-width="0.55">
      <circle cx="-60" cy="-20" r="6"/>
      <circle cx="-30" cy="-30" r="6"/>
      <circle cx="0" cy="-32" r="6"/>
      <circle cx="30" cy="-30" r="6"/>
      <circle cx="60" cy="-20" r="6"/>
    </g>
    <!-- Eyelet centers -->
    <g fill="#1a0c04">
      <circle cx="-60" cy="-20" r="3"/>
      <circle cx="-30" cy="-30" r="3"/>
      <circle cx="0" cy="-32" r="3"/>
      <circle cx="30" cy="-30" r="3"/>
      <circle cx="60" cy="-20" r="3"/>
    </g>
    <!-- Brass highlights on eyelets -->
    <g fill="#fff8e8" filter="url(#p8p2bloom)" opacity="0.85">
      <circle cx="-62" cy="-22" r="1.4"/>
      <circle cx="-32" cy="-32" r="1.4"/>
      <circle cx="-2" cy="-34" r="1.4"/>
      <circle cx="28" cy="-32" r="1.4"/>
      <circle cx="58" cy="-22" r="1.4"/>
    </g>

    <!-- Lacing (thick) -->
    <g stroke="#1a0c04" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-60,-20 L-30,-30"/>
      <path d="M-30,-30 L0,-32"/>
      <path d="M0,-32 L30,-30"/>
      <path d="M30,-30 L60,-20"/>
      <!-- Cross-laces beneath -->
      <path d="M-60,-20 Q-15,-14 30,-30"/>
      <path d="M60,-20 Q15,-14 -30,-30"/>
    </g>

    <!-- LEATHER scuffs + oil stains -->
    <g opacity="0.85">
      <ellipse cx="-50" cy="20" rx="22" ry="6" fill="#1a0c04"/>
      <ellipse cx="40" cy="14" rx="18" ry="5" fill="#1a0c04"/>
      <line x1="-30" y1="0" x2="-14" y2="6" stroke="#1a0c04" stroke-width="0.85"/>
      <line x1="14" y1="-4" x2="30" y2="2" stroke="#1a0c04" stroke-width="0.85"/>
      <!-- Oil stain (script: oil-stained) -->
      <ellipse cx="20" cy="34" rx="14" ry="4" fill="#0a0604" opacity="0.85"/>
    </g>

    <!-- Boot leather sheen -->
    <ellipse cx="-30" cy="0" rx="22" ry="14" fill="#a86838" opacity="0.45" filter="url(#p8p2bloom)"/>
    <ellipse cx="40" cy="14" rx="14" ry="9" fill="#a86838" opacity="0.45" filter="url(#p8p2bloom)"/>

    <!-- Slight motion arc above boot (mid-tap) -->
    <g stroke="#3a1808" stroke-width="0.55" opacity="0.45" fill="none" stroke-dasharray="2 1.5">
      <path d="M-100,46 Q0,40 100,46"/>
    </g>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,300 Q90,302 180,298 Q280,296 366,300"/>
  </g>
</svg>
