<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 249" width="742" height="249">
  <title>Issue 5 — Page 10 — Panel 2: Three-way perimeter intercut — Thresh prone with moth, Sable rooftop watching, Jink on sign bracket</title>
  <desc>Widescreen split into three sub-panels. LEFT: Thresh prone on sill weapon ready, moth size of hawk perched. CENTER: Sable rooftop in moonlight, hand to comm. RIGHT: Jink crouched on sign bracket wings folded. Three soldiers holding perimeter.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p2nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#3a2858"/>
    </linearGradient>
    <linearGradient id="p10p2leftBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#5a4838"/>
    </linearGradient>
    <linearGradient id="p10p2centerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#3a4858"/>
    </linearGradient>
    <linearGradient id="p10p2rightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p10p2crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <linearGradient id="p10p2silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p10p2emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a8848"/>
    </linearGradient>
    <linearGradient id="p10p2mothBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p10p2amberFromBelow" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p2moonlight" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8b0c8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a6878" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p10p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- ===== LEFT THIRD — THRESH PRONE on sill ===== -->
  <rect width="247" height="249" fill="url(#p10p2leftBg)"/>
  <rect width="247" height="249" fill="url(#p10p2amberFromBelow)"/>

  <!-- Stone sill -->
  <rect x="0" y="180" width="247" height="69" fill="#7a7068"/>
  <line x1="0" y1="184" x2="247" y2="184" stroke="#3a3028" stroke-width="0.7"/>
  <g stroke="#3a3028" stroke-width="0.4" opacity="0.55" fill="none">
    <path d="M0,210 Q120,212 247,208"/>
    <path d="M0,230 Q120,228 247,232"/>
  </g>

  <!-- Window frame back wall -->
  <rect x="0" y="0" width="247" height="180" fill="#1a1438"/>
  <rect x="20" y="20" width="207" height="160" fill="none" stroke="#3a2828" stroke-width="0.7"/>
  <rect x="22" y="22" width="203" height="156" fill="#3a2828" opacity="0.55"/>

  <!-- Distant gaslight pool below sill suggested -->
  <ellipse cx="123" cy="249" rx="160" ry="22" fill="#ffaa48" opacity="0.35" filter="url(#p10p2glow)"/>

  <!-- THRESH PRONE — flat on sill -->
  <g transform="translate(140 200)">
    <!-- Body flat -->
    <ellipse cx="0" cy="0" rx="40" ry="9" fill="url(#p10p2crimson)"/>
    <!-- Pauldron dent -->
    <ellipse cx="-22" cy="0" rx="6" ry="3.4" fill="#5a0818"/>
    <!-- Weapon along sill edge -->
    <rect x="-10" y="-9" width="40" height="3" fill="#3a3030"/>
    <rect x="28" y="-10" width="3" height="4" fill="#1a1a1a"/>
    <!-- Head looking forward -->
    <ellipse cx="-30" cy="-3" rx="5" ry="3.4" fill="#a86838"/>
    <ellipse cx="-32" cy="-5" rx="3" ry="1.4" fill="#c84838"/>
    <!-- Arms forward holding weapon -->
    <ellipse cx="-12" cy="-2" rx="3" ry="2" fill="url(#p10p2crimson)"/>
    <!-- White-knuckle grip -->
    <ellipse cx="-9" cy="-4" rx="1.6" ry="0.85" fill="#fff8e8" opacity="0.85" filter="url(#p10p2bloom)"/>
    <!-- Crimson seam glow -->
    <line x1="-22" y1="-2" x2="22" y2="-2" stroke="#dc2030" stroke-width="0.55" opacity="0.85" filter="url(#p10p2bloom)"/>
  </g>

  <!-- MOTH on sill (size of hawk at fairy scale) -->
  <g transform="translate(50 196)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="14" ry="5" fill="url(#p10p2mothBody)"/>
    <ellipse cx="-6" cy="-1" rx="4" ry="3" fill="#5a4838"/>
    <!-- Wings DUSTY (the script demands "dusty and twitching") -->
    <path d="M-8,-2 Q-22,-14 -28,-9 Q-22,-2 -10,0 Z" fill="#7a6858" opacity="0.85"/>
    <path d="M-8,-2 Q-22,-14 -28,-9 Q-22,-2 -10,0 Z" fill="#9a8878" opacity="0.45"/>
    <path d="M-8,2 Q-18,11 -22,7 Q-18,1 -8,2 Z" fill="#7a6858" opacity="0.7"/>
    <path d="M8,-2 Q22,-14 28,-9 Q22,-2 10,0 Z" fill="#7a6858" opacity="0.85"/>
    <path d="M8,-2 Q22,-14 28,-9 Q22,-2 10,0 Z" fill="#9a8878" opacity="0.45"/>
    <path d="M8,2 Q18,11 22,7 Q18,1 8,2 Z" fill="#7a6858" opacity="0.7"/>
    <!-- Wing eyespots -->
    <circle cx="-18" cy="-7" r="1.6" fill="#1a0c04" opacity="0.7"/>
    <circle cx="18" cy="-7" r="1.6" fill="#1a0c04" opacity="0.7"/>
    <!-- Antennae feathered -->
    <path d="M-8,-3 Q-12,-9 -16,-12" stroke="#1a0c04" stroke-width="0.7" fill="none"/>
    <g stroke="#1a0c04" stroke-width="0.3" opacity="0.7">
      <line x1="-12" y1="-7" x2="-13" y2="-9"/>
      <line x1="-13" y1="-9" x2="-14" y2="-11"/>
      <line x1="-14" y1="-11" x2="-15" y2="-12"/>
    </g>
    <!-- Faint dust shed around -->
    <g fill="#9a8878" opacity="0.45">
      <circle cx="-26" cy="-5" r="0.4"/>
      <circle cx="-20" cy="2" r="0.4"/>
      <circle cx="22" cy="-2" r="0.4"/>
    </g>
  </g>

  <!-- THRESH comms top -->
  <g>
    <rect x="6" y="6" width="234" height="34" rx="2" fill="white" stroke="#dc2030" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="14" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#dc2030" font-weight="700">THRESH ((comms))</text>
  <text x="14" y="35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Street clear. Next patrol in twenty.</text>

  <!-- ===== CENTER THIRD — SABLE rooftop ===== -->
  <rect x="247" y="0" width="248" height="249" fill="url(#p10p2centerBg)"/>
  <line x1="247" y1="0" x2="247" y2="249" stroke="#0a0408" stroke-width="2"/>
  <!-- Moon -->
  <circle cx="320" cy="40" r="9" fill="#fff8e8" opacity="0.85" filter="url(#p10p2bloom)"/>
  <ellipse cx="320" cy="40" rx="22" ry="22" fill="#fff8e8" opacity="0.35" filter="url(#p10p2glow)"/>
  <!-- Stars -->
  <g fill="#fff8e8" opacity="0.85" filter="url(#p10p2bloom)">
    <circle cx="380" cy="22" r="0.7"/>
    <circle cx="420" cy="44" r="0.85"/>
    <circle cx="280" cy="60" r="0.55"/>
    <circle cx="460" cy="20" r="0.7"/>
    <circle cx="350" cy="12" r="0.55"/>
  </g>
  <!-- Distant rooflines -->
  <g fill="#3a3850" opacity="0.7">
    <path d="M247,140 L247,180 L300,180 L300,150 L350,150 L350,160 L400,160 L400,140 L460,140 L460,160 L494,160 L494,180 Z"/>
  </g>
  <!-- Foreground rooftop -->
  <rect x="247" y="180" width="248" height="69" fill="url(#p10p2crimson)" opacity="0.0"/>
  <rect x="247" y="180" width="248" height="69" fill="#3a4048"/>
  <line x1="247" y1="184" x2="495" y2="184" stroke="#1a1c20" stroke-width="0.55"/>
  <ellipse cx="370" cy="249" rx="180" ry="22" fill="#ffaa48" opacity="0.35" filter="url(#p10p2glow)"/>

  <!-- Moonlight wash -->
  <rect x="247" y="0" width="248" height="180" fill="url(#p10p2moonlight)"/>

  <!-- Chimney pot left side (Sable's cover) -->
  <g transform="translate(290 170)">
    <rect x="-14" y="0" width="28" height="80" fill="#3a2818"/>
    <ellipse cx="0" cy="-10" rx="11" ry="3" fill="#5a2818"/>
    <rect x="-11" y="-10" width="22" height="20" fill="#7a3818"/>
  </g>

  <!-- SABLE standing at chimney base -->
  <g transform="translate(360 200)">
    <ellipse cx="-3" cy="40" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="40" rx="3" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="20" width="4" height="20" fill="url(#p10p2silver)"/>
    <rect x="1" y="20" width="4" height="20" fill="url(#p10p2silver)"/>
    <ellipse cx="-3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="3" cy="32" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <path d="M-7,20 L-7,-12 L7,-12 L7,20 Z" fill="url(#p10p2silver)"/>
    <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#a8c0ff" stroke-width="0.7" opacity="0.85" filter="url(#p10p2bloom)"/>
    <ellipse cx="7" cy="-12" rx="3" ry="2" fill="#3a3038"/>
    <!-- Right arm to ear -->
    <path d="M7,-12 L9,-22 L7,-26 L4,-22 L3,-14 Z" fill="url(#p10p2silver)"/>
    <ellipse cx="6" cy="-26" rx="2.4" ry="1.4" fill="#7a4838"/>
    <rect x="-11" y="-12" width="4" height="22" fill="url(#p10p2silver)"/>
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#7a4838"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#e0d8d0"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Comm earpiece -->
    <circle cx="4" cy="-22" r="0.85" fill="#a8c0ff" filter="url(#p10p2bloom)" opacity="0.85"/>
    <!-- Cool moonlight on left side, warm amber on right side of suit -->
    <ellipse cx="-3" cy="0" rx="2.4" ry="20" fill="#a8c0ff" opacity="0.35" filter="url(#p10p2bloom)"/>
    <ellipse cx="3" cy="0" rx="2.4" ry="20" fill="#ffaa48" opacity="0.3" filter="url(#p10p2bloom)"/>
  </g>

  <!-- SABLE comms -->
  <g>
    <rect x="252" y="6" width="234" height="34" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="260" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE ((comms))</text>
  <text x="260" y="35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Hold positions. Wren has four minutes.</text>

  <!-- ===== RIGHT THIRD — JINK on sign bracket ===== -->
  <rect x="495" y="0" width="247" height="249" fill="url(#p10p2rightBg)"/>
  <line x1="495" y1="0" x2="495" y2="249" stroke="#0a0408" stroke-width="2"/>

  <!-- Brick facade -->
  <rect x="495" y="0" width="247" height="249" fill="#5a3018"/>
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.55">
    <line x1="495" y1="60" x2="742" y2="60"/>
    <line x1="495" y1="120" x2="742" y2="120"/>
    <line x1="495" y1="180" x2="742" y2="180"/>
    <line x1="495" y1="240" x2="742" y2="240"/>
  </g>

  <!-- Sign bracket arm -->
  <g transform="translate(560 170)">
    <rect x="-4" y="-30" width="6" height="60" fill="#3a3030"/>
    <rect x="2" y="-3" width="120" height="6" fill="#3a3030"/>
    <path d="M2,3 Q40,30 80,30" fill="none" stroke="#3a3030" stroke-width="2.4"/>
    <!-- Sign hanging -->
    <rect x="20" y="3" width="100" height="34" fill="#5a3818" stroke="#1a0c04" stroke-width="0.55"/>
    <text x="70" y="20" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#ffd078" font-weight="700" filter="url(#p10p2bloom)" opacity="0.85">HOSKINS</text>
    <text x="70" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="4" fill="#ffd078" filter="url(#p10p2bloom)" opacity="0.75">HOROLOGY</text>
  </g>

  <!-- Gas lamp glow from below -->
  <ellipse cx="618" cy="249" rx="180" ry="34" fill="#ffd078" opacity="0.55" filter="url(#p10p2glow)"/>

  <!-- JINK crouched on bracket arm -->
  <g transform="translate(560 165)">
    <ellipse cx="-3" cy="6" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="6" rx="3" ry="1.4" fill="#0a0408"/>
    <!-- Crouched legs -->
    <path d="M-6,4 L-8,-4 L-3,-4 L-3,4 Z" fill="url(#p10p2emerald)"/>
    <path d="M6,4 L8,-4 L3,-4 L3,4 Z" fill="url(#p10p2emerald)"/>
    <path d="M-7,-4 L-7,-16 L7,-16 L7,-4 Z" fill="url(#p10p2emerald)"/>
    <ellipse cx="0" cy="-8" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>
    <line x1="-5" y1="-12" x2="5" y2="-12" stroke="#fff8e8" stroke-width="0.4" opacity="0.85" filter="url(#p10p2bloom)"/>
    <!-- Wings folded (low glow) -->
    <path d="M-7,-16 L-9,-8 L-7,-4 Z" fill="#1a0c04"/>
    <path d="M7,-16 L9,-8 L7,-4 Z" fill="#1a0c04"/>
    <line x1="-7" y1="-12" x2="-7" y2="-6" stroke="#2ed078" stroke-width="0.55" opacity="0.85" filter="url(#p10p2bloom)"/>
    <line x1="7" y1="-12" x2="7" y2="-6" stroke="#2ed078" stroke-width="0.55" opacity="0.85" filter="url(#p10p2bloom)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="5" ry="6" fill="#d8a878"/>
    <path d="M-5,-29 Q-3,-32 0,-32 Q3,-32 5,-29 L5,-25 Q2,-29 0,-29 Q-2,-29 -5,-25 Z" fill="#ffd078"/>
    <circle cx="-3" cy="-31" r="1.4" fill="#ffd078"/>
    <circle cx="3" cy="-30" r="1.6" fill="#ffd078"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Comm earpiece -->
    <circle cx="3" cy="-22" r="0.85" fill="#2ed078" filter="url(#p10p2bloom)" opacity="0.85"/>
  </g>

  <!-- JINK comms top -->
  <g>
    <rect x="500" y="6" width="234" height="34" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="508" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK ((comms))</text>
  <text x="508" y="35" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Shop quiet. No movement at door.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
