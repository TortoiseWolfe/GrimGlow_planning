<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 311" width="742" height="311">
  <title>Issue 5 — Page 7 — Panel 1: Wren at entry crack — scanner blooms into darkness — threshold of infiltration</title>
  <desc>35mm wide. Wren at entry — narrow crack between window frame and brickwork. Sideways stance to fit. Copper-gold scanner light reveals dust, cobweb strands, dead spider, dark wall cavity beyond. Brick + timber in geometric detail.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p7p1timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <linearGradient id="p7p1darkInterior" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p7p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p7p1scannerBeam" cx="0%" cy="50%" r="120%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a86838" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p7p1glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <!-- BRICK left side -->
  <rect width="180" height="311" fill="url(#p7p1brick)"/>
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.65">
    <line x1="0" y1="40" x2="180" y2="40"/>
    <line x1="0" y1="80" x2="180" y2="80"/>
    <line x1="0" y1="120" x2="180" y2="120"/>
    <line x1="0" y1="160" x2="180" y2="160"/>
    <line x1="0" y1="200" x2="180" y2="200"/>
    <line x1="0" y1="240" x2="180" y2="240"/>
    <line x1="0" y1="280" x2="180" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="40"/>
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="40" y1="80" x2="40" y2="120"/>
    <line x1="100" y1="120" x2="100" y2="160"/>
    <line x1="60" y1="160" x2="60" y2="200"/>
    <line x1="140" y1="200" x2="140" y2="240"/>
  </g>

  <!-- WINDOW FRAME timber on right -->
  <rect x="540" y="0" width="202" height="311" fill="url(#p7p1timber)"/>
  <line x1="540" y1="0" x2="540" y2="311" stroke="#0a1808" stroke-width="0.85"/>
  <g stroke="#0a1808" stroke-width="0.5" opacity="0.55">
    <line x1="600" y1="0" x2="600" y2="311"/>
    <line x1="660" y1="0" x2="660" y2="311"/>
  </g>

  <!-- ===== ENTRY CRACK — vertical dark slot between brick and timber ===== -->
  <rect x="180" y="0" width="360" height="311" fill="url(#p7p1darkInterior)"/>
  <!-- Crack edges (left brick edge, right timber edge) -->
  <line x1="180" y1="0" x2="180" y2="311" stroke="#1a0c04" stroke-width="1.4"/>
  <line x1="540" y1="0" x2="540" y2="311" stroke="#0a1808" stroke-width="1.4"/>

  <!-- Inside the crack: cobweb strands, dust -->
  <g stroke="#a89888" stroke-width="0.4" fill="none" opacity="0.45">
    <path d="M180,40 Q260,60 340,50 Q420,42 540,50"/>
    <path d="M180,40 Q260,80 340,90"/>
    <path d="M260,60 L420,42"/>
    <path d="M180,200 Q260,210 340,200"/>
    <path d="M340,200 Q420,220 540,210"/>
    <path d="M180,260 Q300,270 540,260"/>
  </g>

  <!-- DEAD SPIDER in corner -->
  <g transform="translate(220 280)">
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#3a3030"/>
    <ellipse cx="-4" cy="-1" rx="3" ry="2" fill="#1a1414"/>
    <g stroke="#1a1414" stroke-width="0.7" fill="none" stroke-linecap="round">
      <path d="M-4,2 L-10,6 L-8,10"/>
      <path d="M-2,3 L-3,9 L0,12"/>
      <path d="M2,3 L4,9 L7,11"/>
      <path d="M4,2 L9,5 L11,8"/>
      <path d="M-4,-2 L-10,-5 L-8,-9"/>
      <path d="M-2,-3 L-3,-9 L0,-12"/>
      <path d="M2,-3 L4,-9 L7,-11"/>
      <path d="M4,-2 L9,-5 L11,-8"/>
    </g>
  </g>

  <!-- TIMBER LATH visible deeper in crack (at far right beyond crack midpoint) -->
  <g opacity="0.55">
    <rect x="420" y="60" width="9" height="200" fill="#3a2010"/>
    <rect x="450" y="40" width="9" height="240" fill="#3a2010"/>
    <rect x="480" y="80" width="9" height="180" fill="#3a2010"/>
    <line x1="420" y1="60" x2="420" y2="260" stroke="#1a0c04" stroke-width="0.4"/>
    <line x1="450" y1="40" x2="450" y2="280" stroke="#1a0c04" stroke-width="0.4"/>
    <line x1="480" y1="80" x2="480" y2="260" stroke="#1a0c04" stroke-width="0.4"/>
  </g>
  <!-- Plaster crumbs on timber laths -->
  <g fill="#9a9088" opacity="0.55">
    <ellipse cx="430" cy="120" rx="5" ry="3"/>
    <ellipse cx="455" cy="180" rx="6" ry="3"/>
    <ellipse cx="485" cy="220" rx="4" ry="2.4"/>
  </g>

  <!-- Dust motes drifting in scanner beam -->
  <g fill="#ffd078" opacity="0.7" filter="url(#p7p1bloom)">
    <circle cx="280" cy="130" r="0.85"/>
    <circle cx="320" cy="150" r="0.7"/>
    <circle cx="360" cy="120" r="0.85"/>
    <circle cx="400" cy="160" r="0.7"/>
    <circle cx="340" cy="180" r="0.85"/>
    <circle cx="290" cy="170" r="0.55"/>
    <circle cx="380" cy="140" r="0.55"/>
  </g>

  <!-- ===== SCANNER BEAM blooming copper-gold from Wren's wrist into darkness ===== -->
  <g transform="translate(180 160)">
    <ellipse cx="200" cy="0" rx="220" ry="80" fill="url(#p7p1scannerBeam)" filter="url(#p7p1glow)" opacity="0.85"/>
    <!-- Beam edges (geometric structure) -->
    <line x1="0" y1="-30" x2="280" y2="-60" stroke="#ffd078" stroke-width="0.55" opacity="0.55"/>
    <line x1="0" y1="30" x2="280" y2="60" stroke="#ffd078" stroke-width="0.55" opacity="0.55"/>
  </g>

  <!-- ===== WREN at entry — sideways stance, hand braced, scanner active ===== -->
  <g transform="translate(150 180)">
    <ellipse cx="-3" cy="44" rx="3.4" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="44" rx="3.4" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="20" width="4" height="24" fill="url(#p7p1suit)"/>
    <rect x="1" y="20" width="4" height="24" fill="url(#p7p1suit)"/>
    <ellipse cx="-3" cy="34" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="34" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <!-- Torso turned sideways (narrow profile to fit through crack) -->
    <path d="M-6,20 L-4,-22 L4,-22 L6,20 Z" fill="url(#p7p1suit)"/>
    <line x1="-3" y1="-12" x2="3" y2="-12" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p7p1bloom)"/>
    <ellipse cx="-4" cy="-22" rx="2.4" ry="2" fill="#1a0c04" opacity="0.85"/>
    <!-- Tool kit on back -->
    <rect x="-4" y="-18" width="9" height="14" fill="#3a2010"/>
    <line x1="-4" y1="-22" x2="-7" y2="-12" stroke="#1a0c04" stroke-width="1.2"/>
    <line x1="5" y1="-22" x2="8" y2="-12" stroke="#1a0c04" stroke-width="1.2"/>
    <!-- LEFT arm braced on brick (back-left) -->
    <path d="M-4,-22 L-12,-12 L-22,-2 L-26,4 L-22,4 L-14,-2 L-6,-14 Z" fill="url(#p7p1suit)"/>
    <ellipse cx="-26" cy="2" rx="3" ry="2" fill="#a86838"/>
    <!-- RIGHT arm extended forward holding scanner -->
    <path d="M4,-22 L12,-14 L26,-8 L34,-4 L38,-2 L34,2 L28,-2 L14,-8 L6,-12 Z" fill="url(#p7p1suit)"/>
    <ellipse cx="36" cy="0" rx="3.4" ry="2.4" fill="#a86838"/>
    <!-- Oil stain on right forearm -->
    <ellipse cx="22" cy="-6" rx="2" ry="1.4" fill="#1a0c04" opacity="0.6"/>
    <!-- WRIST EMITTER glow -->
    <circle cx="36" cy="-4" r="3.4" fill="#fff8e8" filter="url(#p7p1bloom)"/>
    <circle cx="36" cy="-4" r="6" fill="#ffd078" opacity="0.65" filter="url(#p7p1bloom)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="5.5" ry="7" fill="#a86838"/>
    <ellipse cx="0" cy="-40" rx="3" ry="2.2" fill="#0a0604"/>
    <ellipse cx="0" cy="-42" rx="2" ry="1.4" fill="#1a0c04"/>
    <!-- Eyes (looking forward into scanner beam) -->
    <ellipse cx="-2" cy="-30" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="-2" cy="-30" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-30" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="2" cy="-30" r="0.5" fill="#0a0604"/>
    <path d="M-3,-23 L3,-23" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Comm earpiece -->
    <circle cx="3" cy="-30" r="0.85" fill="#ffd078" filter="url(#p7p1bloom)" opacity="0.85"/>
  </g>

  <!-- WREN comms (top) -->
  <g>
    <rect x="14" y="14" width="334" height="46" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Entry sound. Wall cavity behind. I see the shop floor.</text>

  <!-- WREN comms 2 -->
  <g>
    <rect x="14" y="60" width="180" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Going in.</text>

  <!-- SABLE response -->
  <g>
    <rect x="540" y="14" width="190" height="34" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="548" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE ((comms))</text>
  <text x="548" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Comms check every two minutes.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,250 Q200,252 400,248 Q580,246 742,250"/>
  </g>
</svg>
