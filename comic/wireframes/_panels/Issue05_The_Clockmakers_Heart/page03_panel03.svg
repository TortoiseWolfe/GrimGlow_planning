<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 422" width="366" height="422">
  <title>Issue 5 — Page 3 — Panel 3: Luma at comm relay — calibrating five-signal display + map overlay</title>
  <desc>50mm MS. Luma at communications station on timber ledge. Blue-violet display: five signal indicators + map overlay. Fingers calibrating. Calm professional focus, faintest hint of concern (wishes she were going). Support is its own form of courage.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p3p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c14"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p3p3ledge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="p3p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3ad8"/>
      <stop offset="100%" stop-color="#3a2068"/>
    </linearGradient>
    <linearGradient id="p3p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4838"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#6a3828"/>
    </linearGradient>
    <radialGradient id="p3p3displayGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a888e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p3p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p3p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="422" fill="url(#p3p3bg)"/>

  <!-- Distant brick + timber -->
  <g opacity="0.4">
    <rect x="0" y="0" width="366" height="60" fill="#3a2818"/>
    <rect x="0" y="0" width="366" height="422" fill="#2a1810"/>
    <g stroke="#5a2818" stroke-width="0.5" fill="none">
      <path d="M0,120 Q120,122 240,118 Q320,116 366,120"/>
      <path d="M0,200 Q120,198 240,202 Q320,204 366,200"/>
      <path d="M0,280 Q120,282 240,278 Q320,276 366,280"/>
    </g>
  </g>

  <!-- Timber ledge (Luma's workstation) -->
  <rect x="0" y="320" width="366" height="100" fill="url(#p3p3ledge)"/>
  <line x1="0" y1="330" x2="366" y2="330" stroke="#0a0604" stroke-width="0.7"/>
  <line x1="0" y1="370" x2="366" y2="370" stroke="#0a0604" stroke-width="0.55"/>

  <!-- ===== HOLOGRAPHIC COMM DISPLAY ===== -->
  <g transform="translate(220 260)">
    <!-- Display halo -->
    <ellipse cx="0" cy="0" rx="90" ry="80" fill="url(#p3p3displayGlow)" filter="url(#p3p3glow)" opacity="0.85"/>
    <!-- Display frame -->
    <rect x="-70" y="-60" width="140" height="120" rx="2" fill="none" stroke="#a888e8" stroke-width="1" filter="url(#p3p3bloom)" opacity="0.85"/>
    <text x="-66" y="-46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" font-weight="700" opacity="0.95">COMM RELAY · CAL</text>
    <line x1="-66" y1="-40" x2="66" y2="-40" stroke="#a888e8" stroke-width="0.4" opacity="0.7"/>

    <!-- Five signal indicators -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" opacity="0.95">
      <!-- SABLE silver -->
      <text x="-66" y="-26" font-size="5" fill="#dad5d0" font-weight="700">SABLE</text>
      <rect x="-30" y="-30" width="50" height="3" fill="#3a3038" stroke="#5a606a" stroke-width="0.2"/>
      <rect x="-30" y="-30" width="48" height="3" fill="#dad5d0" filter="url(#p3p3bloom)"/>
      <text x="26" y="-26" font-size="4.4" fill="#80ff80" filter="url(#p3p3bloom)">96%</text>
      <!-- WREN copper -->
      <text x="-66" y="-14" font-size="5" fill="#ffd078" font-weight="700">WREN</text>
      <rect x="-30" y="-18" width="50" height="3" fill="#3a3038" stroke="#5a606a" stroke-width="0.2"/>
      <rect x="-30" y="-18" width="49" height="3" fill="#ffd078" filter="url(#p3p3bloom)"/>
      <text x="26" y="-14" font-size="4.4" fill="#80ff80" filter="url(#p3p3bloom)">98%</text>
      <!-- JINK emerald -->
      <text x="-66" y="-2" font-size="5" fill="#2ed078" font-weight="700">JINK</text>
      <rect x="-30" y="-6" width="50" height="3" fill="#3a3038" stroke="#5a606a" stroke-width="0.2"/>
      <rect x="-30" y="-6" width="46" height="3" fill="#2ed078" filter="url(#p3p3bloom)"/>
      <text x="26" y="-2" font-size="4.4" fill="#80ff80" filter="url(#p3p3bloom)">93%</text>
      <!-- THRESH crimson -->
      <text x="-66" y="10" font-size="5" fill="#dc2030" font-weight="700">THRESH</text>
      <rect x="-30" y="6" width="50" height="3" fill="#3a3038" stroke="#5a606a" stroke-width="0.2"/>
      <rect x="-30" y="6" width="47" height="3" fill="#dc2030" filter="url(#p3p3bloom)"/>
      <text x="26" y="10" font-size="4.4" fill="#80ff80" filter="url(#p3p3bloom)">95%</text>
      <!-- LUMA self -->
      <text x="-66" y="22" font-size="5" fill="#a888e8" font-weight="700">LUMA</text>
      <rect x="-30" y="18" width="50" height="3" fill="#3a3038" stroke="#5a606a" stroke-width="0.2"/>
      <rect x="-30" y="18" width="50" height="3" fill="#a888e8" filter="url(#p3p3bloom)"/>
      <text x="26" y="22" font-size="4.4" fill="#80ff80" filter="url(#p3p3bloom)">100%</text>
    </g>

    <!-- Map overlay below signals -->
    <rect x="-66" y="32" width="132" height="22" fill="none" stroke="#a888e8" stroke-width="0.5" opacity="0.85"/>
    <!-- Streets -->
    <line x1="-58" y1="42" x2="58" y2="42" stroke="#a888e8" stroke-width="0.4" opacity="0.7"/>
    <line x1="-30" y1="34" x2="-30" y2="52" stroke="#a888e8" stroke-width="0.4" opacity="0.7"/>
    <line x1="20" y1="34" x2="20" y2="52" stroke="#a888e8" stroke-width="0.4" opacity="0.7"/>
    <!-- Camp marker -->
    <circle cx="-50" cy="44" r="1.6" fill="#a888e8" filter="url(#p3p3bloom)"/>
    <text x="-50" y="34" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3" fill="#fff8e8" opacity="0.85">CAMP</text>
    <!-- Target marker (4 blocks N) -->
    <circle cx="40" cy="44" r="2" fill="#fff8e8" filter="url(#p3p3bloom)"/>
    <text x="40" y="34" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3" fill="#fff8e8" opacity="0.95">TARGET</text>
    <!-- Range circle -->
    <circle cx="-50" cy="44" r="36" fill="none" stroke="#a888e8" stroke-width="0.3" opacity="0.55" stroke-dasharray="1.5 1"/>

    <!-- Corner ticks -->
    <path d="M-70,-60 L-64,-60 L-70,-54 Z" fill="#a888e8"/>
    <path d="M70,-60 L64,-60 L70,-54 Z" fill="#a888e8"/>
    <path d="M-70,60 L-64,60 L-70,54 Z" fill="#a888e8"/>
    <path d="M70,60 L64,60 L70,54 Z" fill="#a888e8"/>
  </g>

  <!-- Comm relay device on ledge below display -->
  <g transform="translate(220 340)">
    <rect x="-12" y="-7" width="24" height="14" rx="1" fill="#3a2068" stroke="#a888e8" stroke-width="0.55"/>
    <rect x="-9" y="-4" width="18" height="8" fill="#5a3ad8" filter="url(#p3p3bloom)"/>
    <ellipse cx="0" cy="0" rx="20" ry="9" fill="#a888e8" opacity="0.45" filter="url(#p3p3glow)"/>
    <line x1="-9" y1="2" x2="9" y2="2" stroke="#a888e8" stroke-width="0.4" opacity="0.85"/>
    <!-- Wire trailing to display source -->
    <path d="M0,-7 Q0,-30 0,-60" stroke="#a888e8" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#p3p3bloom)"/>
  </g>

  <!-- ===== LUMA seated at relay ===== -->
  <g transform="translate(100 290)">
    <!-- Boots tucked under -->
    <ellipse cx="-3" cy="46" rx="5" ry="2" fill="#0a0408"/>
    <ellipse cx="3" cy="46" rx="5" ry="2" fill="#0a0408"/>
    <!-- Legs (one folded under, one extended slightly) -->
    <ellipse cx="0" cy="40" rx="14" ry="5" fill="url(#p3p3suit)"/>
    <rect x="-6" y="20" width="11" height="20" fill="url(#p3p3suit)"/>
    <!-- Torso -->
    <path d="M-12,20 L-14,-26 L14,-26 L12,20 Z" fill="url(#p3p3suit)"/>
    <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#a888e8" stroke-width="1.2" opacity="0.85" filter="url(#p3p3bloom)"/>
    <line x1="0" y1="-26" x2="0" y2="14" stroke="#a888e8" stroke-width="0.7" opacity="0.7"/>
    <!-- Shoulders -->
    <path d="M-14,-26 Q-10,-40 -2,-44 Q10,-44 14,-32 L14,-26 Z" fill="url(#p3p3suit)"/>
    <!-- LEFT arm — extended toward display, fingers calibrating -->
    <path d="M-14,-26 L-30,-12 L-50,-2 L-50,2 L-30,-8 L-12,-20 Z" fill="url(#p3p3suit)"/>
    <ellipse cx="-50" cy="0" rx="5" ry="3.4" fill="url(#p3p3skin)"/>
    <!-- Fingers extended INTO display -->
    <ellipse cx="-58" cy="-2" rx="3" ry="1.6" fill="url(#p3p3skin)"/>
    <ellipse cx="-62" cy="-6" rx="2.4" ry="1.4" fill="url(#p3p3skin)"/>
    <!-- Glow at fingertip in display -->
    <circle cx="-62" cy="-6" r="2.4" fill="#fff8e8" opacity="0.85" filter="url(#p3p3bloom)"/>
    <!-- INK STAINS on hand -->
    <circle cx="-48" cy="2" r="0.85" fill="#1a1c34" opacity="0.7"/>
    <circle cx="-44" cy="-2" r="0.7" fill="#1a1c34" opacity="0.7"/>
    <!-- Right arm at side -->
    <rect x="14" y="-26" width="6" height="40" fill="url(#p3p3suit)"/>
    <ellipse cx="16" cy="14" rx="3" ry="2" fill="url(#p3p3skin)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-46" rx="12" ry="14" fill="url(#p3p3skin)"/>
    <!-- Hair top -->
    <path d="M-9,-58 Q-7,-66 0,-68 Q7,-66 10,-58 L9,-52 Q4,-58 0,-58 Q-4,-58 -9,-52 Z" fill="#0a0604"/>
    <!-- Braid back -->
    <path d="M9,-34 Q14,-12 16,16" stroke="#0a0604" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M9,-34 Q14,-12 16,16" stroke="#a888e8" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#p3p3bloom)"/>
    <circle cx="13" cy="-12" r="1" fill="#fff8e8" filter="url(#p3p3bloom)"/>
    <circle cx="16" cy="14" r="1" fill="#fff8e8" filter="url(#p3p3bloom)"/>

    <!-- Eyes — focused on display -->
    <ellipse cx="-4" cy="-46" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="-4" cy="-45" rx="1.6" ry="1.1" fill="#3a2010"/>
    <circle cx="-4" cy="-45" r="0.85" fill="#0a0604"/>
    <ellipse cx="4" cy="-46" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="4" cy="-45" rx="1.6" ry="1.1" fill="#3a2010"/>
    <circle cx="4" cy="-45" r="0.85" fill="#0a0604"/>
    <!-- Holo lenses (warm gold cycling) -->
    <rect x="-9" y="-50" width="8" height="6" rx="0.55" fill="none" stroke="#ffd078" stroke-width="0.55" opacity="0.85"/>
    <rect x="1" y="-50" width="8" height="6" rx="0.55" fill="none" stroke="#ffd078" stroke-width="0.55" opacity="0.85"/>
    <line x1="-9" y1="-46" x2="-1" y2="-46" stroke="#ffd078" stroke-width="0.3" opacity="0.7"/>
    <line x1="1" y1="-46" x2="9" y2="-46" stroke="#ffd078" stroke-width="0.3" opacity="0.7"/>
    <!-- Crack on right -->
    <line x1="-5" y1="-50" x2="-3" y2="-46" stroke="#ffd078" stroke-width="0.3"/>
    <!-- Brows level + slight concern -->
    <path d="M-9,-54 L-1,-55" stroke="#0a0604" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M1,-55 L9,-54" stroke="#0a0604" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — calm focus -->
    <path d="M-3,-36 L3,-36" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- LUMA dialogue (top) -->
  <g>
    <rect x="14" y="14" width="338" height="60" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="180,74 192,74 184,86" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="180.5" y1="74" x2="191.5" y2="74" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Comms are clean to four blocks. Signal degrades</text>
  <text x="22" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">past six. Clockmaker's well within range.</text>

  <!-- LUMA dialogue 2 (bottom) -->
  <g>
    <rect x="14" y="378" width="280" height="32" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="180,378 192,378 184,368" fill="white" stroke="#5a3ad8" stroke-width="0.85"/>
    <line x1="180.5" y1="378" x2="191.5" y2="378" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a3ad8" font-weight="700">LUMA</text>
  <text x="22" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">I'll have medical on standby. Just in case.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,360 Q90,358 180,362 Q280,364 366,360"/>
  </g>
</svg>
