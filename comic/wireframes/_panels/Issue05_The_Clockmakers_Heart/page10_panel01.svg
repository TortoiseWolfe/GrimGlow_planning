<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 422" width="742" height="422">
  <title>Issue 5 — Page 10 — Panel 1: Wren extraction begins — manipulators floating, gear train turning around her</title>
  <desc>35mm medium wide. Wren at work inside clock mechanism. Holographic manipulators orbit hands. One stabilizes wheel, another maps points, third prepares cutter. Gear train continues turning. She works between ticks. Total operational focus.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p10p1cavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p10p1brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p10p1steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0c8"/>
      <stop offset="100%" stop-color="#5a5048"/>
    </linearGradient>
    <linearGradient id="p10p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p10p1basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p10p1amberHeart" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p1toolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p10p1brassGleam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p10p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p10p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="422" fill="url(#p10p1cavity)"/>
  <rect width="742" height="422" fill="url(#p10p1amberHeart)"/>

  <!-- Base plate at bottom -->
  <rect x="0" y="380" width="742" height="42" fill="url(#p10p1basePlate)"/>
  <line x1="0" y1="384" x2="742" y2="384" stroke="#7a4818" stroke-width="0.7"/>
  <ellipse cx="371" cy="400" rx="360" ry="6" fill="#fff8e8" opacity="0.45" filter="url(#p10p1bloom)"/>

  <!-- ===== GEAR TRAIN ENVIRONMENT — Wren is in the middle of moving machinery ===== -->
  <!-- LEFT — adjacent gear (continuing to turn — motion lines) -->
  <g transform="translate(110 200)">
    <ellipse cx="0" cy="0" rx="120" ry="120" fill="url(#p10p1amberHeart)" filter="url(#p10p1glow)" opacity="0.4"/>
    <circle cx="0" cy="0" r="100" fill="url(#p10p1brass)" stroke="#7a4818" stroke-width="0.85"/>
    <g fill="url(#p10p1brass)" stroke="#7a4818" stroke-width="0.55">
      <path d="M0,-100 L3,-110 L-3,-110 Z"/>
      <path d="M50,-86 L62,-94 L57,-100 Z"/>
      <path d="M86,-50 L100,-57 L94,-64 Z"/>
      <path d="M100,0 L114,0 L114,-5 L94,-5 Z"/>
      <path d="M86,50 L100,57 L94,64 Z"/>
      <path d="M50,86 L62,94 L57,100 Z"/>
      <path d="M0,100 L3,110 L-3,110 Z"/>
      <path d="M-50,86 L-62,94 L-57,100 Z"/>
      <path d="M-86,50 L-100,57 L-94,64 Z"/>
      <path d="M-100,0 L-114,0 L-114,-5 L-94,-5 Z"/>
      <path d="M-86,-50 L-100,-57 L-94,-64 Z"/>
      <path d="M-50,-86 L-62,-94 L-57,-100 Z"/>
    </g>
    <g stroke="#7a4818" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-70" x2="0" y2="-18"/>
      <line x1="70" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="70" x2="0" y2="18"/>
      <line x1="-70" y1="0" x2="-18" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="url(#p10p1steel)"/>
    <circle cx="0" cy="0" r="6" fill="#3a3030"/>
    <ellipse cx="-30" cy="-30" rx="18" ry="34" fill="url(#p10p1brassGleam)" filter="url(#p10p1glow)" opacity="0.6"/>
    <!-- Motion blur indicator (this gear is turning) -->
    <g stroke="#fff8e8" stroke-width="0.4" opacity="0.4" stroke-dasharray="2 2" fill="none">
      <path d="M-100,-15 Q-110,0 -100,15"/>
      <path d="M-110,-25 Q-122,0 -110,25"/>
    </g>
  </g>

  <!-- RIGHT — TARGET wheel (the one Wren works on, held STILL) -->
  <g transform="translate(550 200)">
    <ellipse cx="0" cy="0" rx="140" ry="140" fill="url(#p10p1amberHeart)" filter="url(#p10p1glow)" opacity="0.65"/>
    <circle cx="0" cy="0" r="100" fill="url(#p10p1brass)" stroke="#7a4818" stroke-width="0.85"/>
    <g fill="url(#p10p1brass)" stroke="#7a4818" stroke-width="0.4">
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(0)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(15)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(30)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(45)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(60)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(75)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(90)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(105)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(120)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(135)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(150)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(165)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(180)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(195)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(210)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(225)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(240)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(255)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(270)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(285)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(300)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(315)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(330)"/>
      <path d="M0,-100 L2,-108 L-2,-108 Z" transform="rotate(345)"/>
    </g>
    <g stroke="#7a4818" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-70" x2="0" y2="-18"/>
      <line x1="70" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="70" x2="0" y2="18"/>
      <line x1="-70" y1="0" x2="-18" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="url(#p10p1steel)"/>
    <circle cx="0" cy="0" r="6" fill="#3a3030"/>
    <ellipse cx="-22" cy="-22" rx="22" ry="40" fill="url(#p10p1brassGleam)" filter="url(#p10p1glow)" opacity="0.55"/>
    <!-- HOLD INDICATOR — copper-gold ring around target showing it's stabilized -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#fff8e8" stroke-width="0.85" stroke-dasharray="3 2" opacity="0.85" filter="url(#p10p1bloom)"/>
    <text x="0" y="-130" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" font-weight="700" filter="url(#p10p1bloom)" opacity="0.85">STABILIZED</text>
  </g>

  <!-- Steel arbor connecting -->
  <rect x="107" y="120" width="6" height="160" fill="url(#p10p1steel)"/>
  <line x1="110" y1="140" x2="110" y2="260" stroke="#fff8e8" stroke-width="0.55" opacity="0.65"/>
  <rect x="547" y="120" width="6" height="160" fill="url(#p10p1steel)"/>

  <!-- ===== WREN at center, working ===== -->
  <g transform="translate(330 280)">
    <!-- Boots -->
    <ellipse cx="-3" cy="56" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="56" rx="3" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="30" width="4" height="26" fill="url(#p10p1suit)"/>
    <rect x="1" y="30" width="4" height="26" fill="url(#p10p1suit)"/>
    <ellipse cx="-3" cy="44" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="44" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <!-- Torso -->
    <path d="M-9,30 L-9,-22 L9,-22 L9,30 Z" fill="url(#p10p1suit)"/>
    <line x1="-7" y1="-12" x2="7" y2="-12" stroke="#ffd078" stroke-width="0.85" opacity="0.85" filter="url(#p10p1bloom)"/>
    <ellipse cx="-9" cy="-22" rx="3" ry="2" fill="#1a0c04" opacity="0.85"/>
    <!-- Tool kit on back -->
    <rect x="-4" y="-18" width="9" height="14" fill="#3a2010"/>
    <!-- Shoulders -->
    <path d="M-9,-22 Q-6,-32 0,-34 Q6,-32 9,-22 L8,-18 L-8,-18 Z" fill="url(#p10p1suit)"/>
    <!-- Both arms extended forward, conducting tools -->
    <path d="M-9,-22 L-22,-12 L-30,-2 L-32,2 L-26,0 L-18,-8 L-6,-18 Z" fill="url(#p10p1suit)"/>
    <ellipse cx="-32" cy="2" rx="3" ry="2" fill="#a86838"/>
    <path d="M9,-22 L22,-12 L30,-2 L32,2 L26,0 L18,-8 L6,-18 Z" fill="url(#p10p1suit)"/>
    <ellipse cx="32" cy="2" rx="3" ry="2" fill="#a86838"/>
    <!-- Wrist emitters glowing brightly -->
    <circle cx="-32" cy="0" r="3" fill="#fff8e8" filter="url(#p10p1bloom)"/>
    <circle cx="-32" cy="0" r="6" fill="#ffd078" opacity="0.7" filter="url(#p10p1glow)"/>
    <circle cx="32" cy="0" r="3" fill="#fff8e8" filter="url(#p10p1bloom)"/>
    <circle cx="32" cy="0" r="6" fill="#ffd078" opacity="0.7" filter="url(#p10p1glow)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-32" rx="6" ry="7.5" fill="#a86838"/>
    <ellipse cx="0" cy="-40" rx="3" ry="2.4" fill="#0a0604"/>
    <ellipse cx="0" cy="-42" rx="2" ry="1.4" fill="#1a0c04"/>
    <ellipse cx="-2" cy="-32" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="-2" cy="-32" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-32" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="2" cy="-32" r="0.5" fill="#0a0604"/>
    <!-- Brows down — focus -->
    <path d="M-4,-40 L0,-41" stroke="#0a0604" stroke-width="0.55"/>
    <path d="M0,-41 L4,-40" stroke="#0a0604" stroke-width="0.55"/>
    <!-- Mouth — slightly open, counting silently -->
    <path d="M-2,-25 L2,-25" stroke="#3a1808" stroke-width="0.55"/>
    <ellipse cx="0" cy="-25" rx="1.4" ry="0.55" fill="#3a1808" opacity="0.65"/>
  </g>

  <!-- ===== HOLOGRAPHIC TOOLS orbiting Wren's hands ===== -->
  <!-- Tool 1 — STABILIZER (over target wheel center) -->
  <g transform="translate(420 240)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#p10p1toolGlow)" filter="url(#p10p1glow)" opacity="0.85"/>
    <g stroke="#fff8e8" stroke-width="0.7" fill="none" opacity="0.95" filter="url(#p10p1bloom)">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="0" cy="0" r="5"/>
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <circle cx="0" cy="0" r="1.4" fill="#fff8e8"/>
    </g>
    <text x="0" y="-14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.6" fill="#fff8e8" font-weight="700" filter="url(#p10p1bloom)" opacity="0.85">STABILIZE</text>
    <!-- Beam to wheel -->
    <line x1="9" y1="0" x2="40" y2="-20" stroke="#ffd078" stroke-width="0.55" opacity="0.55" filter="url(#p10p1bloom)"/>
  </g>
  <!-- Tool 2 — MAPPER -->
  <g transform="translate(370 200)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="url(#p10p1toolGlow)" filter="url(#p10p1glow)" opacity="0.85"/>
    <g stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#p10p1bloom)">
      <rect x="-5" y="-3" width="10" height="6" rx="0.85"/>
      <line x1="-5" y1="-3" x2="5" y2="3"/>
      <line x1="5" y1="-3" x2="-5" y2="3"/>
      <circle cx="0" cy="0" r="1.4"/>
    </g>
    <text x="0" y="-12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.4" fill="#fff8e8" filter="url(#p10p1bloom)" opacity="0.85">MAP</text>
    <!-- Mapping rays -->
    <g stroke="#ffd078" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#p10p1bloom)" stroke-dasharray="2 1.5">
      <line x1="0" y1="0" x2="60" y2="40"/>
      <line x1="0" y1="0" x2="80" y2="20"/>
      <line x1="0" y1="0" x2="60" y2="-20"/>
    </g>
  </g>
  <!-- Tool 3 — CUTTER preparing -->
  <g transform="translate(280 180)">
    <ellipse cx="0" cy="0" rx="11" ry="9" fill="url(#p10p1toolGlow)" filter="url(#p10p1glow)" opacity="0.85"/>
    <g stroke="#fff8e8" stroke-width="0.55" fill="none" opacity="0.95" filter="url(#p10p1bloom)">
      <rect x="-3" y="-3" width="6" height="5" rx="0.4"/>
      <line x1="0" y1="2" x2="0" y2="8"/>
      <line x1="0" y1="2" x2="0" y2="10"/>
    </g>
    <text x="0" y="-12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.4" fill="#fff8e8" filter="url(#p10p1bloom)" opacity="0.85">CUTTER</text>
    <!-- Standby pulse -->
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="none" stroke="#ffd078" stroke-width="0.55" stroke-dasharray="2 1.5" opacity="0.55"/>
  </g>

  <!-- Drift particles around tools -->
  <g fill="#ffd078" filter="url(#p10p1bloom)" opacity="0.65">
    <circle cx="350" cy="160" r="0.7"/>
    <circle cx="400" cy="170" r="0.85"/>
    <circle cx="440" cy="200" r="0.7"/>
    <circle cx="290" cy="200" r="0.55"/>
    <circle cx="320" cy="180" r="0.55"/>
  </g>

  <!-- WREN comms (top) -->
  <g>
    <rect x="14" y="14" width="338" height="46" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Beginning extraction. I need four minutes.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Nobody talk to me.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q200,92 400,88 Q580,86 742,90"/>
    <path d="M0,360 Q200,362 400,358 Q580,356 742,360"/>
  </g>
</svg>
