<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 5 — Panel 5: Sable on opposite rooftop, behind chimney pot — command from high ground</title>
  <desc>50mm slight low angle. Sable on rooftop opposite shop. Behind chimney pot base for partial cover. Hand to comms earpiece. Sightlines to shop, Thresh climbing, Jink perch. Silver suit catches faint amber from across street. Ghost on rooftop.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p5p5sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#3a4858"/>
    </linearGradient>
    <linearGradient id="p5p5slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="p5p5terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="50%" stop-color="#7a3818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p5p5suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p5p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="50%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a3828"/>
    </linearGradient>
    <radialGradient id="p5p5amberDistant" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p5p5glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <!-- DUSK SKY -->
  <rect width="366" height="200" fill="url(#p5p5sky)"/>

  <!-- DISTANT SHOP across street — small but visible amber smudge -->
  <g transform="translate(280 130)" opacity="0.85">
    <rect x="-30" y="0" width="60" height="36" fill="#3a1808"/>
    <rect x="-26" y="6" width="52" height="22" fill="#ffd078" filter="url(#p5p5bloom)" opacity="0.85"/>
    <ellipse cx="0" cy="14" rx="40" ry="14" fill="#ffd078" opacity="0.45" filter="url(#p5p5glow)"/>
    <text x="0" y="3" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3" fill="#ffd078" font-weight="700" letter-spacing="0.5" opacity="0.85">HOROLOGY</text>
  </g>

  <!-- DISTANT JINK on bracket (tiny emerald speck) -->
  <circle cx="270" cy="118" r="1.4" fill="#2ed078" filter="url(#p5p5bloom)" opacity="0.85"/>
  <ellipse cx="270" cy="118" rx="4" ry="2.4" fill="#2ed078" opacity="0.35" filter="url(#p5p5glow)"/>

  <!-- DISTANT THRESH climbing (tiny crimson speck) -->
  <circle cx="320" cy="100" r="1.2" fill="#dc2030" filter="url(#p5p5bloom)" opacity="0.85"/>
  <ellipse cx="320" cy="100" rx="3.4" ry="2" fill="#dc2030" opacity="0.35" filter="url(#p5p5glow)"/>

  <!-- Distant rooftop edges -->
  <g opacity="0.7" fill="#3a4048">
    <path d="M240,140 L240,200 L366,200 L366,140 Z"/>
  </g>
  <line x1="240" y1="140" x2="366" y2="140" stroke="#1a2030" stroke-width="0.7"/>

  <!-- Cobblestone street between (deep canyon) -->
  <rect x="240" y="200" width="126" height="30" fill="#0a0604"/>

  <!-- ===== FOREGROUND ROOFTOP — Sable's position ===== -->
  <rect x="0" y="200" width="366" height="164" fill="url(#p5p5slate)"/>
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.65">
    <path d="M0,220 Q90,222 180,218 Q270,216 366,220"/>
    <path d="M0,250 Q90,248 180,252 Q270,254 366,250"/>
    <path d="M0,290 Q90,292 180,288 Q270,286 366,290"/>
    <path d="M0,330 Q90,328 180,332 Q270,334 366,330"/>
  </g>

  <!-- Faint amber wash from below (street gaslight) -->
  <rect width="366" height="200" y="200" fill="url(#p5p5amberDistant)"/>

  <!-- ===== CHIMNEY POT BASE (foreground left) — partial cover ===== -->
  <g transform="translate(60 240)">
    <!-- Base of pot (we see lower part — pot extends up off-frame) -->
    <rect x="-30" y="0" width="60" height="80" fill="#3a2818"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="-30" y1="40" x2="30" y2="40" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Pot starts (just bottom rim visible) -->
    <ellipse cx="0" cy="-12" rx="22" ry="6" fill="#5a2818"/>
    <rect x="-22" y="-12" width="44" height="20" fill="url(#p5p5terracotta)"/>
    <line x1="-22" y1="-2" x2="22" y2="-2" stroke="#5a2818" stroke-width="0.55"/>
  </g>

  <!-- ===== SABLE behind pot base ===== -->
  <g transform="translate(140 250)">
    <ellipse cx="-3" cy="60" rx="3.4" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="60" rx="3.4" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="32" width="4" height="28" fill="url(#p5p5suit)"/>
    <rect x="1" y="32" width="4" height="28" fill="url(#p5p5suit)"/>
    <ellipse cx="-3" cy="50" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="3" cy="50" rx="4" ry="1" fill="#5a4838" opacity="0.55"/>
    <!-- Torso -->
    <path d="M-9,32 L-9,-12 L9,-12 L9,32 Z" fill="url(#p5p5suit)"/>
    <line x1="-7" y1="-2" x2="7" y2="-2" stroke="#a8c0ff" stroke-width="0.85" opacity="0.85" filter="url(#p5p5bloom)"/>
    <line x1="0" y1="-12" x2="0" y2="20" stroke="#a8c0ff" stroke-width="0.55" opacity="0.7"/>
    <!-- Faint amber kick on right side from across street -->
    <ellipse cx="7" cy="10" rx="4" ry="14" fill="#ffaa48" opacity="0.3" filter="url(#p5p5bloom)"/>
    <!-- Soot bloom right shoulder -->
    <ellipse cx="9" cy="-12" rx="3" ry="2" fill="#3a3038"/>
    <!-- Shoulders -->
    <path d="M-9,-12 Q-7,-22 0,-26 Q8,-26 9,-22 L9,-12 Z" fill="url(#p5p5suit)"/>

    <!-- Right arm raised to ear (comms) -->
    <path d="M9,-12 L11,-22 L9,-26 L6,-22 L5,-14 Z" fill="url(#p5p5suit)"/>
    <ellipse cx="8" cy="-26" rx="2.4" ry="1.4" fill="url(#p5p5skin)"/>
    <!-- Comm earpiece glow at ear -->
    <circle cx="6" cy="-22" r="1.2" fill="#a8c0ff" filter="url(#p5p5bloom)" opacity="0.85"/>
    <!-- Left arm at side -->
    <rect x="-13" y="-12" width="4" height="28" fill="url(#p5p5suit)"/>
    <ellipse cx="-11" cy="20" rx="2.4" ry="1.6" fill="url(#p5p5skin)"/>

    <!-- HEAD — slightly turned watching the operation -->
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="url(#p5p5skin)"/>
    <path d="M-5,-29 Q-4,-31 0,-31 Q4,-31 5,-29 L5,-25 Q2,-28 0,-28 Q-2,-28 -5,-25 Z" fill="#e0d8d0"/>
    <!-- Faint amber wash on right cheek -->
    <ellipse cx="3" cy="-22" rx="2" ry="3" fill="#ffaa48" opacity="0.3" filter="url(#p5p5bloom)"/>
    <ellipse cx="-2" cy="-22" rx="1" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="1" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- SABLE comms (top) — to Luma -->
  <g>
    <rect x="14" y="14" width="338" height="48" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE ((comms))</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Luma, eyes on shop. Jink on bracket.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Thresh climbing to overwatch.</text>

  <!-- LUMA reply -->
  <g>
    <rect x="14" y="306" width="220" height="32" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700">LUMA ((comms))</text>
  <text x="22" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">Copy. All vitals holding steady.</text>

  <!-- SABLE final order -->
  <g>
    <rect x="14" y="338" width="220" height="22" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="354" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410" font-weight="500"><tspan fill="#5a606a" font-weight="700">SABLE: </tspan>Wren, clear to approach.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,260 Q90,262 180,258 Q280,256 366,260"/>
  </g>
</svg>
