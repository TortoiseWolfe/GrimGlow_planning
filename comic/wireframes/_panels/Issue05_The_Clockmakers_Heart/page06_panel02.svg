<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 422" width="366" height="422">
  <title>Issue 5 — Page 6 — Panel 2: Dead fly carcass on sill — scale anchor — Thresh's armored boot stepping wide around</title>
  <desc>85mm CU slight high angle. Dead fly on its back, legs curled, compound eyes dull, chitinous body with faint iridescence. Stone sill texture sharp — dust, grit, hairline crack. Thresh's armored boot at edge of frame, paused mid-step. The mundane made alien by scale.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p2stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a9088"/>
      <stop offset="100%" stop-color="#5a5048"/>
    </linearGradient>
    <linearGradient id="p6p2flyBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="50%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#1a1414"/>
    </linearGradient>
    <linearGradient id="p6p2eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a8068"/>
      <stop offset="50%" stop-color="#5a5848"/>
      <stop offset="100%" stop-color="#3a3030"/>
    </linearGradient>
    <linearGradient id="p6p2boot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1414"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <radialGradient id="p6p2crimsonHint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a0828" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p6p2glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <!-- STONE SILL fills frame -->
  <rect width="366" height="422" fill="url(#p6p2stone)"/>

  <!-- Sill weathering — cracks, dust, grit -->
  <g stroke="#3a3028" stroke-width="0.55" opacity="0.55" fill="none">
    <path d="M0,80 Q120,78 240,82 Q300,84 366,80"/>
    <path d="M0,160 Q120,162 240,158 Q300,156 366,160"/>
    <path d="M0,240 Q120,238 240,242 Q300,244 366,240"/>
    <path d="M0,320 Q120,322 240,318 Q300,316 366,320"/>
    <path d="M0,380 Q120,378 240,382 Q300,384 366,380"/>
  </g>
  <!-- Hairline crack (script demand) — running diagonally -->
  <path d="M40,40 Q120,140 200,260 Q260,340 300,400" stroke="#3a3028" stroke-width="0.85" fill="none" opacity="0.7"/>
  <!-- Dust patches -->
  <g opacity="0.55">
    <ellipse cx="80" cy="120" rx="60" ry="14" fill="#7a6858"/>
    <ellipse cx="280" cy="200" rx="60" ry="14" fill="#7a6858"/>
    <ellipse cx="120" cy="350" rx="50" ry="12" fill="#7a6858"/>
  </g>
  <!-- Grit specks scattered -->
  <g fill="#3a3028" opacity="0.7">
    <circle cx="60" cy="60" r="0.85"/>
    <circle cx="120" cy="100" r="1"/>
    <circle cx="200" cy="80" r="0.7"/>
    <circle cx="280" cy="60" r="0.85"/>
    <circle cx="40" cy="220" r="1"/>
    <circle cx="160" cy="280" r="0.85"/>
    <circle cx="240" cy="320" r="1"/>
    <circle cx="320" cy="180" r="0.7"/>
    <circle cx="80" cy="380" r="0.85"/>
    <circle cx="220" cy="400" r="1"/>
  </g>

  <!-- Slight diagonal grey dusk light wash -->
  <rect width="366" height="422" fill="#3a4858" opacity="0.2"/>

  <!-- ===== THRESH'S ARMORED BOOT at edge of frame (paused mid-step) ===== -->
  <g transform="translate(50 360)">
    <!-- Crimson hint glow -->
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="url(#p6p2crimsonHint)" filter="url(#p6p2glow)" opacity="0.45"/>
    <!-- Boot (armored, wide step) -->
    <ellipse cx="0" cy="0" rx="44" ry="20" fill="url(#p6p2boot)"/>
    <!-- Boot armor plate -->
    <path d="M-44,0 L-30,-20 L30,-20 L44,0 Z" fill="url(#p6p2boot)"/>
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#3a1818" stroke-width="0.85" opacity="0.85"/>
    <!-- Crimson seam glowing faintly -->
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#dc2030" stroke-width="0.85" opacity="0.85" filter="url(#p6p2bloom)"/>
    <!-- Suit edge above boot -->
    <rect x="-22" y="-40" width="44" height="20" fill="#dc2030"/>
    <line x1="-22" y1="-30" x2="22" y2="-30" stroke="#fff8e8" stroke-width="0.55" opacity="0.45" filter="url(#p6p2bloom)"/>
  </g>

  <!-- Boot's shadow on sill (suggests step paused) -->
  <ellipse cx="50" cy="380" rx="40" ry="6" fill="#0a0408" opacity="0.45" filter="url(#p6p2bloom)"/>

  <!-- ===== DEAD FLY — large, central, dominant subject ===== -->
  <g transform="translate(220 220)">
    <!-- Body shadow on sill -->
    <ellipse cx="0" cy="60" rx="120" ry="18" fill="#0a0408" opacity="0.4" filter="url(#p6p2bloom)"/>

    <!-- ABDOMEN (rear segment) -->
    <ellipse cx="60" cy="0" rx="56" ry="32" fill="url(#p6p2flyBody)"/>
    <!-- Abdomen segments -->
    <line x1="20" y1="-22" x2="100" y2="-22" stroke="#1a1414" stroke-width="0.7" opacity="0.85"/>
    <line x1="22" y1="-10" x2="98" y2="-10" stroke="#1a1414" stroke-width="0.7" opacity="0.85"/>
    <line x1="22" y1="2" x2="98" y2="2" stroke="#1a1414" stroke-width="0.7" opacity="0.85"/>
    <line x1="22" y1="14" x2="98" y2="14" stroke="#1a1414" stroke-width="0.7" opacity="0.85"/>
    <!-- Highlight band -->
    <ellipse cx="60" cy="-14" rx="40" ry="10" fill="#7a6858" opacity="0.45" filter="url(#p6p2bloom)"/>

    <!-- THORAX (mid segment) -->
    <ellipse cx="-10" cy="0" rx="28" ry="24" fill="#3a3030"/>
    <!-- Thorax bristles -->
    <g stroke="#1a1414" stroke-width="0.7" opacity="0.85">
      <line x1="-22" y1="-18" x2="-26" y2="-22"/>
      <line x1="-14" y1="-22" x2="-15" y2="-26"/>
      <line x1="-6" y1="-22" x2="-4" y2="-26"/>
      <line x1="2" y1="-20" x2="4" y2="-24"/>
    </g>

    <!-- HEAD with COMPOUND EYES -->
    <ellipse cx="-50" cy="0" rx="28" ry="22" fill="#3a3030"/>
    <!-- Compound eye (left, dominant) -->
    <ellipse cx="-66" cy="-6" rx="14" ry="14" fill="url(#p6p2eye)"/>
    <ellipse cx="-66" cy="-6" rx="11" ry="11" fill="#5a5048"/>
    <!-- Compound eye facets (small hexagonal grid) -->
    <g stroke="#3a3030" stroke-width="0.4" opacity="0.55" fill="none">
      <line x1="-72" y1="-12" x2="-60" y2="-12"/>
      <line x1="-72" y1="-6" x2="-60" y2="-6"/>
      <line x1="-72" y1="0" x2="-60" y2="0"/>
      <line x1="-66" y1="-15" x2="-66" y2="3"/>
      <line x1="-72" y1="-12" x2="-66" y2="-15"/>
      <line x1="-60" y1="-12" x2="-66" y2="-15"/>
      <line x1="-72" y1="0" x2="-66" y2="3"/>
      <line x1="-60" y1="0" x2="-66" y2="3"/>
    </g>
    <!-- Faint iridescent sheen (script: "faint iridescence on the compound eyes") -->
    <ellipse cx="-66" cy="-9" rx="6" ry="3" fill="#7a8068" opacity="0.7" filter="url(#p6p2bloom)"/>
    <ellipse cx="-66" cy="-7" rx="2.4" ry="1.4" fill="#a8a888" opacity="0.5" filter="url(#p6p2bloom)"/>
    <!-- Right compound eye (smaller, partial visible) -->
    <ellipse cx="-60" cy="14" rx="9" ry="8" fill="url(#p6p2eye)"/>
    <ellipse cx="-60" cy="14" rx="7" ry="6" fill="#5a5048"/>
    <ellipse cx="-60" cy="12" rx="4" ry="2" fill="#7a8068" opacity="0.55" filter="url(#p6p2bloom)"/>
    <!-- Antennae (short) -->
    <line x1="-72" y1="-18" x2="-78" y2="-26" stroke="#1a1414" stroke-width="1.2"/>
    <line x1="-72" y1="-22" x2="-80" y2="-30" stroke="#1a1414" stroke-width="1.2"/>
    <!-- Proboscis -->
    <path d="M-78,4 Q-86,8 -82,12" stroke="#1a1414" stroke-width="1.4" fill="none"/>

    <!-- WINGS — curled, dead, translucent -->
    <path d="M-10,-22 Q12,-60 36,-50 Q24,-30 -2,-22 Z" fill="#7a8088" opacity="0.55" filter="url(#p6p2bloom)"/>
    <path d="M-10,-26 Q4,-58 28,-54 Q22,-36 -8,-22 Z" fill="#7a8088" opacity="0.45" filter="url(#p6p2bloom)"/>
    <!-- Wing veins -->
    <g stroke="#3a3030" stroke-width="0.55" fill="none" opacity="0.7">
      <path d="M-8,-22 Q4,-40 22,-46"/>
      <path d="M-6,-22 Q8,-36 26,-40"/>
      <path d="M-4,-24 Q14,-34 30,-46"/>
      <path d="M-2,-26 Q18,-36 32,-50"/>
    </g>

    <!-- LEGS — six legs, all curled in death -->
    <g stroke="#1a0c04" stroke-width="2" stroke-linecap="round" fill="none">
      <!-- LEFT 3 legs -->
      <path d="M-30,16 L-44,30 L-32,40"/>
      <path d="M-12,22 L-12,42 L-2,50"/>
      <path d="M6,20 L14,38 L26,42"/>
      <!-- RIGHT 3 legs (mirror, since fly is on its back) -->
      <path d="M-30,-16 L-44,-30 L-32,-40"/>
      <path d="M-12,-22 L-12,-42 L-2,-50"/>
      <path d="M6,-20 L14,-38 L26,-42"/>
    </g>
    <!-- Leg joints -->
    <g fill="#0a0604">
      <circle cx="-44" cy="30" r="1.4"/>
      <circle cx="-12" cy="42" r="1.4"/>
      <circle cx="14" cy="38" r="1.4"/>
      <circle cx="-44" cy="-30" r="1.4"/>
      <circle cx="-12" cy="-42" r="1.4"/>
      <circle cx="14" cy="-38" r="1.4"/>
    </g>

    <!-- FAINT iridescence on chitinous body (script demand) -->
    <ellipse cx="60" cy="-20" rx="20" ry="6" fill="#a8b8a8" opacity="0.25" filter="url(#p6p2bloom)"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,360 Q90,358 180,362 Q280,364 366,360"/>
  </g>
</svg>
