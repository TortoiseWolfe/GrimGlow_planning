<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 11 — Panel 1: Clockmaker silhouette grows through glass — Wren kills tools, presses flat behind mainspring</title>
  <desc>28mm wide low angle inside mechanism. Through glass panel: enormous shadow approaching, colossus' shape. Inside: Wren flat behind mainspring barrel, tools dark, only filtered amber + red pallet pulse. Tools off. Going dark.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p1cavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p11p1glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p11p1brassDim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p11p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p11p1basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <radialGradient id="p11p1amberFiltered" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p1rubyPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5040" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a0818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p1shadowGrowing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0408" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0408" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p11p1glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p11p1cavity)"/>

  <!-- Filtered amber from above -->
  <rect width="742" height="364" fill="url(#p11p1amberFiltered)"/>

  <!-- Base plate at bottom -->
  <rect x="0" y="320" width="742" height="44" fill="url(#p11p1basePlate)"/>
  <line x1="0" y1="324" x2="742" y2="324" stroke="#7a4818" stroke-width="0.7"/>

  <!-- ===== GLASS PANEL at top — viewer inside clock looking out ===== -->
  <rect x="60" y="0" width="622" height="120" fill="url(#p11p1glass)"/>
  <rect x="60" y="0" width="622" height="120" fill="none" stroke="#1a0c04" stroke-width="2"/>
  <line x1="120" y1="0" x2="120" y2="120" stroke="#3a1808" stroke-width="0.85"/>
  <line x1="622" y1="0" x2="622" y2="120" stroke="#3a1808" stroke-width="0.85"/>

  <!-- ===== CLOCKMAKER SILHOUETTE through glass — shape growing, shadow looming ===== -->
  <g transform="translate(371 60)">
    <ellipse cx="0" cy="0" rx="220" ry="90" fill="url(#p11p1shadowGrowing)" filter="url(#p11p1glow)" opacity="0.92"/>
    <!-- Body silhouette emerging through glass -->
    <ellipse cx="0" cy="50" rx="100" ry="60" fill="#0a0408" opacity="0.85"/>
    <!-- Head (large, looming) -->
    <ellipse cx="0" cy="-40" rx="60" ry="70" fill="#0a0408" opacity="0.85"/>
    <!-- Shoulders -->
    <path d="M-100,30 Q-80,-10 0,-20 Q80,-10 100,30 Z" fill="#0a0408" opacity="0.85"/>
    <!-- Hand reaching toward case door -->
    <ellipse cx="80" cy="40" rx="34" ry="22" fill="#0a0408" opacity="0.85"/>
    <ellipse cx="120" cy="44" rx="22" ry="14" fill="#0a0408" opacity="0.85"/>
  </g>

  <!-- Glass reflection of mechanism inside (faint amber traces) -->
  <g opacity="0.45">
    <path d="M70,40 Q120,30 200,40 Q280,50 360,40" stroke="#ffd078" stroke-width="0.55" fill="none" filter="url(#p11p1bloom)"/>
    <path d="M380,50 Q460,40 540,50 Q620,60 672,52" stroke="#ffd078" stroke-width="0.55" fill="none" filter="url(#p11p1bloom)"/>
  </g>

  <!-- ===== INTERIOR MECHANISM — gear edges visible, dimmed ===== -->
  <!-- Mainspring barrel (Wren's hiding place) — left side, looming -->
  <g transform="translate(160 250)">
    <ellipse cx="0" cy="-80" rx="60" ry="11" fill="#7a4818"/>
    <rect x="-60" y="-80" width="120" height="160" fill="url(#p11p1brassDim)"/>
    <ellipse cx="0" cy="80" rx="60" ry="11" fill="#3a1808"/>
    <g stroke="#3a1808" stroke-width="0.55" opacity="0.7">
      <line x1="-60" y1="-50" x2="60" y2="-50"/>
      <line x1="-60" y1="-10" x2="60" y2="-10"/>
      <line x1="-60" y1="30" x2="60" y2="30"/>
      <line x1="-60" y1="60" x2="60" y2="60"/>
    </g>
    <g stroke="#5a3018" stroke-width="0.7" fill="none" opacity="0.85">
      <ellipse cx="0" cy="-30" rx="44" ry="9"/>
      <ellipse cx="0" cy="0" rx="42" ry="9"/>
      <ellipse cx="0" cy="30" rx="40" ry="9"/>
    </g>
    <ellipse cx="-30" cy="-20" rx="14" ry="80" fill="#fff8e8" opacity="0.18" filter="url(#p11p1bloom)"/>
  </g>

  <!-- Adjacent gear (right) — dim brass shape -->
  <g transform="translate(560 240)">
    <ellipse cx="0" cy="0" rx="120" ry="120" fill="url(#p11p1brassDim)" opacity="0.85"/>
    <circle cx="0" cy="0" r="100" fill="url(#p11p1brassDim)" stroke="#3a1808" stroke-width="0.7"/>
    <g fill="url(#p11p1brassDim)" stroke="#3a1808" stroke-width="0.4">
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(0)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(30)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(60)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(90)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(120)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(150)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(180)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(210)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(240)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(270)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(300)"/>
      <path d="M0,-100 L2,-110 L-2,-110 Z" transform="rotate(330)"/>
    </g>
    <circle cx="0" cy="0" r="11" fill="#5a5048"/>
  </g>

  <!-- ===== ESCAPEMENT with RUBY JEWELS PULSING (red flashes — only color in scene) ===== -->
  <g transform="translate(660 80)">
    <ellipse cx="0" cy="0" rx="40" ry="22" fill="url(#p11p1rubyPulse)" filter="url(#p11p1glow)" opacity="0.65"/>
    <ellipse cx="-14" cy="0" rx="3" ry="2" fill="#ff5040" filter="url(#p11p1bloom)"/>
    <ellipse cx="14" cy="0" rx="3" ry="2" fill="#ff5040" filter="url(#p11p1bloom)"/>
    <circle cx="-14" cy="0" r="1.4" fill="#ffaa90"/>
    <circle cx="14" cy="0" r="1.4" fill="#ffaa90"/>
  </g>
  <!-- Red pulse extending into mechanism interior -->
  <ellipse cx="500" cy="200" rx="200" ry="80" fill="#ff5040" opacity="0.18" filter="url(#p11p1glow)"/>

  <!-- ===== WREN pressed flat behind mainspring barrel — barely visible, dark, motionless ===== -->
  <g transform="translate(112 290)">
    <!-- Boots -->
    <ellipse cx="-3" cy="34" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="34" rx="3" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="14" width="4" height="20" fill="url(#p11p1suit)"/>
    <rect x="1" y="14" width="4" height="20" fill="url(#p11p1suit)"/>
    <!-- Crouched, pressed against barrel -->
    <path d="M-7,14 L-7,-12 L7,-12 L7,14 Z" fill="url(#p11p1suit)"/>
    <!-- All seams DARK — no glow -->
    <ellipse cx="-7" cy="-12" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.85"/>
    <!-- Tool kit -->
    <rect x="-4" y="-8" width="9" height="11" fill="#3a2010"/>
    <!-- Arms tucked in (motionless) -->
    <rect x="-11" y="-12" width="4" height="22" fill="url(#p11p1suit)"/>
    <rect x="7" y="-12" width="4" height="22" fill="url(#p11p1suit)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#7a4818"/>
    <ellipse cx="0" cy="-30" rx="3" ry="2.2" fill="#0a0604"/>
    <!-- Eyes wide, looking up -->
    <ellipse cx="-2" cy="-23" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-23" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-23" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-23" r="0.4" fill="#0a0604"/>
    <!-- Lips pressed -->
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.7"/>
  </g>

  <!-- WREN comms (top) — barely a breath -->
  <g>
    <rect x="14" y="14" width="320" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((breath))</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">He's coming. Tools off. Going dark.</text>

  <!-- SABLE response -->
  <g>
    <rect x="14" y="56" width="320" height="32" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE ((comms))</text>
  <text x="22" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Theodore, move. Now.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
