<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 422" width="241" height="422">
  <title>Issue 5 — Page 4 — Panel 4: Thresh hands CU — fear in the grip — silent panel</title>
  <desc>85mm tight CU, slight 5-deg dutch angle. Armored ruby-crimson forearms with dents. Gloved fingers gripping rifle too tight. Knuckles white beneath suit material. Faint crimson holographic glow at seams. Hands tell the truth her face won't.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p4p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8b0b8"/>
      <stop offset="100%" stop-color="#9aa098"/>
    </linearGradient>
    <linearGradient id="p4p4armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="50%" stop-color="#a8182a"/>
      <stop offset="100%" stop-color="#5a0818"/>
    </linearGradient>
    <linearGradient id="p4p4weapon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5860"/>
      <stop offset="100%" stop-color="#3a3030"/>
    </linearGradient>
    <radialGradient id="p4p4crimsonSeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2030" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8a0828" stop-opacity="0"/>
    </radialGradient>
    <filter id="p4p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p4p4glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Slight dutch angle on whole panel -->
  <g transform="rotate(-5 120 211)">
    <!-- Sky background (the weapon angled toward sky) -->
    <rect x="-40" y="-60" width="320" height="500" fill="url(#p4p4sky)"/>

    <!-- ===== WEAPON across knees (resting horizontal) ===== -->
    <g transform="translate(120 260)">
      <!-- Stock -->
      <rect x="-100" y="-6" width="50" height="14" rx="1" fill="url(#p4p4weapon)"/>
      <!-- Receiver -->
      <rect x="-50" y="-9" width="60" height="20" rx="1" fill="#3a3030"/>
      <line x1="-50" y1="-3" x2="10" y2="-3" stroke="#1a1a1a" stroke-width="0.55"/>
      <!-- Grip detail -->
      <rect x="-30" y="11" width="14" height="14" fill="#3a3030"/>
      <!-- Trigger guard -->
      <rect x="-32" y="20" width="18" height="3" rx="1" fill="#1a1a1a"/>
      <!-- Barrel forward, angled toward sky -->
      <rect x="10" y="-7" width="80" height="14" rx="1" fill="url(#p4p4weapon)"/>
      <!-- Sight -->
      <rect x="14" y="-12" width="3" height="5" fill="#1a1a1a"/>
      <!-- Muzzle -->
      <rect x="88" y="-7" width="6" height="14" fill="#1a1a1a"/>
      <ellipse cx="92" cy="0" rx="2.4" ry="3.4" fill="#0a0a0a"/>
      <!-- Texture lines on barrel -->
      <line x1="10" y1="-2" x2="90" y2="-2" stroke="#1a1a1a" stroke-width="0.4" opacity="0.7"/>
      <line x1="10" y1="2" x2="90" y2="2" stroke="#1a1a1a" stroke-width="0.4" opacity="0.7"/>
      <!-- Reflective sheen -->
      <line x1="-50" y1="-7" x2="90" y2="-7" stroke="#a8a0a0" stroke-width="0.55" opacity="0.55"/>
    </g>

    <!-- ===== LEFT FOREARM (gripping near trigger) — armored ===== -->
    <g transform="translate(80 290)">
      <!-- Forearm armor plate -->
      <path d="M-40,40 L-30,-30 L40,-30 L50,40 Z" fill="url(#p4p4armor)"/>
      <!-- Plate seam edges glowing -->
      <line x1="-30" y1="-30" x2="40" y2="-30" stroke="#ff5050" stroke-width="0.85" opacity="0.85" filter="url(#p4p4bloom)"/>
      <line x1="-40" y1="40" x2="50" y2="40" stroke="#ff5050" stroke-width="0.85" opacity="0.85" filter="url(#p4p4bloom)"/>
      <!-- Crimson seam glow halo -->
      <ellipse cx="0" cy="0" rx="50" ry="40" fill="url(#p4p4crimsonSeam)" filter="url(#p4p4glow)" opacity="0.45"/>
      <!-- DENTS + scratches -->
      <ellipse cx="-20" cy="-10" rx="6" ry="3.4" fill="#5a0818"/>
      <ellipse cx="-22" cy="-10" rx="3" ry="1.6" fill="#3a0818"/>
      <ellipse cx="22" cy="6" rx="5" ry="2.4" fill="#5a0818"/>
      <ellipse cx="22" cy="6" rx="2.4" ry="1.4" fill="#3a0818"/>
      <line x1="-14" y1="14" x2="-2" y2="22" stroke="#5a0818" stroke-width="0.55" opacity="0.85"/>
      <line x1="14" y1="-2" x2="26" y2="6" stroke="#5a0818" stroke-width="0.55" opacity="0.85"/>
      <!-- HAND GRIPPING (gloved fingers wrapping) -->
      <ellipse cx="50" cy="40" rx="22" ry="14" fill="url(#p4p4armor)"/>
      <!-- Fingers wrapped around weapon (knuckles visible) -->
      <ellipse cx="36" cy="30" rx="6" ry="4" fill="url(#p4p4armor)"/>
      <ellipse cx="44" cy="22" rx="5" ry="3.4" fill="url(#p4p4armor)"/>
      <ellipse cx="56" cy="22" rx="5" ry="3.4" fill="url(#p4p4armor)"/>
      <ellipse cx="64" cy="30" rx="6" ry="4" fill="url(#p4p4armor)"/>
      <!-- WHITE KNUCKLES — knuckle highlights are NEARLY WHITE -->
      <ellipse cx="36" cy="28" rx="3.4" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
      <ellipse cx="44" cy="20" rx="2.4" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
      <ellipse cx="56" cy="20" rx="2.4" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
      <ellipse cx="64" cy="28" rx="3.4" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
    </g>

    <!-- ===== RIGHT FOREARM (gripping forend) ===== -->
    <g transform="translate(160 280)">
      <!-- Forearm armor plate -->
      <path d="M-40,40 L-50,-30 L20,-30 L30,40 Z" fill="url(#p4p4armor)"/>
      <line x1="-50" y1="-30" x2="20" y2="-30" stroke="#ff5050" stroke-width="0.85" opacity="0.85" filter="url(#p4p4bloom)"/>
      <line x1="-40" y1="40" x2="30" y2="40" stroke="#ff5050" stroke-width="0.85" opacity="0.85" filter="url(#p4p4bloom)"/>
      <ellipse cx="0" cy="0" rx="50" ry="40" fill="url(#p4p4crimsonSeam)" filter="url(#p4p4glow)" opacity="0.45"/>
      <!-- Dents -->
      <ellipse cx="-22" cy="-6" rx="5" ry="2.4" fill="#5a0818"/>
      <ellipse cx="14" cy="14" rx="6" ry="3" fill="#5a0818"/>
      <line x1="-30" y1="20" x2="-18" y2="26" stroke="#5a0818" stroke-width="0.55" opacity="0.85"/>
      <!-- Hand gripping forend -->
      <ellipse cx="-40" cy="40" rx="22" ry="14" fill="url(#p4p4armor)"/>
      <ellipse cx="-26" cy="30" rx="6" ry="4" fill="url(#p4p4armor)"/>
      <ellipse cx="-34" cy="22" rx="5" ry="3.4" fill="url(#p4p4armor)"/>
      <ellipse cx="-46" cy="22" rx="5" ry="3.4" fill="url(#p4p4armor)"/>
      <ellipse cx="-54" cy="30" rx="6" ry="4" fill="url(#p4p4armor)"/>
      <!-- White knuckles -->
      <ellipse cx="-26" cy="28" rx="3.4" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
      <ellipse cx="-34" cy="20" rx="2.4" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
      <ellipse cx="-46" cy="20" rx="2.4" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
      <ellipse cx="-54" cy="28" rx="3.4" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p4p4bloom)"/>
    </g>

    <!-- KNEES suggested at bottom (where weapon rests) -->
    <rect x="-20" y="320" width="280" height="100" fill="#5a0818" opacity="0.85"/>
    <line x1="-20" y1="320" x2="260" y2="320" stroke="#ff5050" stroke-width="0.85" opacity="0.7" filter="url(#p4p4bloom)"/>
  </g>

  <!-- Subtle vignette (CU intensity) -->
  <radialGradient id="p4p4vignette" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="241" height="422" fill="url(#p4p4vignette)"/>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q60,82 120,78 Q180,76 241,80"/>
    <path d="M0,340 Q60,338 120,342 Q180,344 241,340"/>
  </g>
</svg>
