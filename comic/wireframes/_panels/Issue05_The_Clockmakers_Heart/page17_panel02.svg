<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 364" width="238" height="364">
  <title>Issue 5 — Page 17 — Panel 2: Wren's hands extracting target gear with copper-gold cutting beam — surgical precision</title>
  <desc>100mm ECU. Wren's oil-stained hands working. Copper-gold holographic cutting beam — thin precise geometric — separates axle pin from housing. Hands catch released gear with practiced steadiness. Gear gleams in holographic light, teeth exquisitely machined. No dialog.</desc>

  <defs>
    <linearGradient id="p17p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p17p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="50%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p17p2target" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p17p2housing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p17p2beamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p17p2gearHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p17p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="238" height="364" fill="url(#p17p2bg)"/>

  <!-- Brass surroundings (housing) -->
  <rect x="0" y="0" width="80" height="364" fill="url(#p17p2housing)"/>
  <rect x="158" y="0" width="80" height="364" fill="url(#p17p2housing)"/>
  <rect x="0" y="0" width="238" height="60" fill="url(#p17p2housing)"/>
  <rect x="0" y="304" width="238" height="60" fill="url(#p17p2housing)"/>

  <!-- Beam halo glow filling center -->
  <ellipse cx="119" cy="180" rx="100" ry="160" fill="url(#p17p2beamGlow)" filter="url(#p17p2glow)"/>

  <!-- ===== TARGET GEAR — center, gleaming ===== -->
  <g transform="translate(119 180)">
    <!-- Halo -->
    <circle cx="0" cy="0" r="80" fill="url(#p17p2gearHalo)" filter="url(#p17p2glow)"/>

    <circle cx="0" cy="0" r="50" fill="url(#p17p2target)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#5a3018" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="32" fill="#7a4818" opacity="0.65"/>
    <circle cx="0" cy="0" r="9" fill="#1a0c04"/>
    <!-- Spokes -->
    <g stroke="#5a3018" stroke-width="0.7" opacity="0.85">
      <line x1="0" y1="-40" x2="0" y2="40"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="-28" y1="-28" x2="28" y2="28"/>
      <line x1="28" y1="-28" x2="-28" y2="28"/>
    </g>
    <!-- Fine teeth -->
    <g fill="url(#p17p2target)" stroke="#5a3018" stroke-width="0.4">
      <rect x="-2" y="-56" width="4" height="6"/>
      <rect x="-2" y="50" width="4" height="6"/>
      <rect x="-56" y="-2" width="6" height="4"/>
      <rect x="50" y="-2" width="6" height="4"/>
      <g transform="rotate(20)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(40)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(60)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(80)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(100)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(120)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(140)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(160)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(200)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(220)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(240)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(260)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(280)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(300)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(320)"><rect x="-2" y="-56" width="4" height="6"/></g>
      <g transform="rotate(340)"><rect x="-2" y="-56" width="4" height="6"/></g>
    </g>
    <!-- Highlight -->
    <ellipse cx="-14" cy="-14" rx="9" ry="6" fill="#fff8e8" opacity="0.85" filter="url(#p17p2bloom)"/>
    <ellipse cx="-22" cy="-22" rx="3" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p17p2bloom)"/>
  </g>

  <!-- AXLE PIN being separated (above gear, vertical pin) -->
  <g transform="translate(119 100)">
    <rect x="-3" y="-30" width="6" height="40" fill="url(#p17p2target)"/>
    <ellipse cx="0" cy="-30" rx="3" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p17p2bloom)"/>
    <!-- Pin edge being cut -->
    <line x1="-6" y1="20" x2="6" y2="20" stroke="#ffaa48" stroke-width="0.85" opacity="0.85" filter="url(#p17p2bloom)"/>
  </g>

  <!-- ===== HOLOGRAPHIC CUTTING BEAM — thin, precise, copper-gold geometric ===== -->
  <g transform="translate(119 130)">
    <!-- Beam axis -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffaa48" stroke-width="2" filter="url(#p17p2bloom)"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#fff8e8" stroke-width="0.7" opacity="0.85" filter="url(#p17p2bloom)"/>
    <!-- Geometric pulse markers along beam -->
    <polygon points="-20,-3 -16,-3 -14,0 -16,3 -20,3 -22,0" fill="none" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p17p2bloom)"/>
    <polygon points="-3,-3 1,-3 3,0 1,3 -3,3 -5,0" fill="#ffaa48" opacity="0.85" filter="url(#p17p2bloom)"/>
    <polygon points="14,-3 18,-3 20,0 18,3 14,3 12,0" fill="none" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p17p2bloom)"/>
    <!-- Cutting glow at beam center -->
    <circle cx="0" cy="0" r="6" fill="#ffaa48" opacity="0.85" filter="url(#p17p2glow)"/>
    <circle cx="0" cy="0" r="2" fill="#fff8e8" filter="url(#p17p2bloom)"/>
    <!-- Sparks -->
    <line x1="0" y1="0" x2="-6" y2="-9" stroke="#fff8e8" stroke-width="0.4" opacity="0.85"/>
    <line x1="0" y1="0" x2="6" y2="-9" stroke="#fff8e8" stroke-width="0.4" opacity="0.85"/>
    <line x1="0" y1="0" x2="-9" y2="6" stroke="#ffd078" stroke-width="0.4" opacity="0.85"/>
    <line x1="0" y1="0" x2="9" y2="6" stroke="#ffd078" stroke-width="0.4" opacity="0.85"/>
  </g>

  <!-- ===== WREN'S HANDS — coming up from below, catching gear ===== -->
  <!-- LEFT HAND -->
  <g transform="translate(70 280)">
    <!-- Forearm/wrist visible from below -->
    <rect x="-3" y="20" width="22" height="80" fill="url(#p17p2skin)"/>
    <ellipse cx="8" cy="20" rx="14" ry="9" fill="url(#p17p2skin)"/>
    <!-- Fingers extended toward gear -->
    <ellipse cx="14" cy="-20" rx="3.4" ry="14" fill="url(#p17p2skin)"/>
    <ellipse cx="22" cy="-30" rx="3.4" ry="20" fill="url(#p17p2skin)"/>
    <ellipse cx="30" cy="-40" rx="3.4" ry="22" fill="url(#p17p2skin)"/>
    <ellipse cx="38" cy="-50" rx="3" ry="20" fill="url(#p17p2skin)"/>
    <!-- Thumb -->
    <ellipse cx="-9" cy="-10" rx="9" ry="6" fill="url(#p17p2skin)" transform="rotate(-15 -9 -10)"/>
    <!-- Heavy oil stains -->
    <circle cx="0" cy="22" r="2" fill="#1a0c04" opacity="0.7"/>
    <circle cx="14" cy="0" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="22" cy="-14" r="1" fill="#1a0c04" opacity="0.55"/>
    <circle cx="-7" cy="-9" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <!-- Knuckle creases -->
    <path d="M0,-12 Q14,-10 28,-14" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>
    <!-- Holographic pulse on fingertips (tool-active) -->
    <circle cx="38" cy="-70" r="1.4" fill="#ffaa48" opacity="0.85" filter="url(#p17p2bloom)"/>
  </g>

  <!-- RIGHT HAND - coming from below right -->
  <g transform="translate(168 280)">
    <rect x="-19" y="20" width="22" height="80" fill="url(#p17p2skin)"/>
    <ellipse cx="-8" cy="20" rx="14" ry="9" fill="url(#p17p2skin)"/>
    <!-- Fingers (mirrored) -->
    <ellipse cx="-14" cy="-20" rx="3.4" ry="14" fill="url(#p17p2skin)"/>
    <ellipse cx="-22" cy="-30" rx="3.4" ry="20" fill="url(#p17p2skin)"/>
    <ellipse cx="-30" cy="-40" rx="3.4" ry="22" fill="url(#p17p2skin)"/>
    <ellipse cx="-38" cy="-50" rx="3" ry="20" fill="url(#p17p2skin)"/>
    <ellipse cx="9" cy="-10" rx="9" ry="6" fill="url(#p17p2skin)" transform="rotate(15 9 -10)"/>
    <!-- Oil stains -->
    <circle cx="0" cy="22" r="2" fill="#1a0c04" opacity="0.7"/>
    <circle cx="-14" cy="0" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="-22" cy="-14" r="1" fill="#1a0c04" opacity="0.55"/>
    <circle cx="7" cy="-9" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <path d="M0,-12 Q-14,-10 -28,-14" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>
    <circle cx="-38" cy="-70" r="1.4" fill="#ffaa48" opacity="0.85" filter="url(#p17p2bloom)"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,300 Q60,298 120,302 Q180,304 238,300"/>
  </g>
</svg>
