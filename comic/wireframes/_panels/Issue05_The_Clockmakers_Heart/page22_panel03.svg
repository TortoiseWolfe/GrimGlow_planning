<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 439" width="238" height="439">
  <title>Issue 5 — Page 22 — Panel 3: Final image — gear in drive — brass among alien alloy — She did not sleep</title>
  <desc>100mm ECU. The final image. Precision gear seated in temporal drive. Brass among alien alloy. Warm among cool. Clockmaker's work in technology centuries beyond. Gear teeth mesh with materials that don't exist 1886. Faint copper-gold halo where Wren's tools interfaced. Blue-white drive light + warm holo halo coexist. Brass gleams essential undiminished. Captions: She did not sleep that night. / She studied.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p22p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="p22p3gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p22p3alien" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a98e8"/>
      <stop offset="100%" stop-color="#1a3868"/>
    </linearGradient>
    <radialGradient id="p22p3coolDriveGlow" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8d8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3060a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p3warmHaloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p22p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="238" height="439" fill="url(#p22p3bg)"/>

  <!-- Cool blue drive ambient -->
  <rect width="238" height="439" fill="url(#p22p3coolDriveGlow)" opacity="0.85"/>

  <!-- ALIEN DRIVE COMPONENTS surrounding the gear -->
  <!-- Hex chambers above -->
  <g transform="translate(119 80)">
    <polygon points="-50,-20 -36,-34 -16,-34 -2,-20 -16,-6 -36,-6" fill="url(#p22p3alien)" stroke="#a8d8ff" stroke-width="0.85" filter="url(#p22p3bloom)"/>
    <polygon points="20,-20 34,-34 54,-34 68,-20 54,-6 34,-6" fill="url(#p22p3alien)" stroke="#a8d8ff" stroke-width="0.85" filter="url(#p22p3bloom)"/>
    <!-- Crystalline nodes -->
    <circle cx="-26" cy="-20" r="3" fill="#a8d8ff" filter="url(#p22p3bloom)"/>
    <circle cx="44" cy="-20" r="3" fill="#a8d8ff" filter="url(#p22p3bloom)"/>
  </g>

  <!-- Hex chamber below (mounting bracket for the gear) -->
  <g transform="translate(119 360)">
    <polygon points="-60,-20 -40,-40 -20,-40 0,-20 -20,0 -40,0" fill="url(#p22p3alien)" stroke="#a8d8ff" stroke-width="0.85" filter="url(#p22p3bloom)"/>
    <polygon points="20,-20 40,-40 60,-40 80,-20 60,0 40,0" fill="url(#p22p3alien)" stroke="#a8d8ff" stroke-width="0.85" filter="url(#p22p3bloom)"/>
    <circle cx="-30" cy="-20" r="2" fill="#5a98e8"/>
    <circle cx="50" cy="-20" r="2" fill="#5a98e8"/>
  </g>

  <!-- Connecting linkages (alien) -->
  <g stroke="#a8d8ff" stroke-width="0.85" opacity="0.85" filter="url(#p22p3bloom)">
    <line x1="80" y1="100" x2="100" y2="160"/>
    <line x1="158" y1="100" x2="138" y2="160"/>
    <line x1="80" y1="320" x2="100" y2="260"/>
    <line x1="158" y1="320" x2="138" y2="260"/>
  </g>

  <!-- ===== INTEGRATED PRECISION GEAR — center, dominant ===== -->
  <g transform="translate(119 220)">
    <!-- Warm halo (where Wren's tools interface) -->
    <circle cx="0" cy="0" r="80" fill="url(#p22p3warmHaloGlow)" filter="url(#p22p3glow)"/>
    <!-- Dual halo: cool drive light wraps gear -->
    <circle cx="0" cy="0" r="60" fill="#a8d8ff" opacity="0.45" filter="url(#p22p3glow)"/>

    <!-- LARGER OUTER WHEEL -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="url(#p22p3gear)"/>
    <ellipse cx="0" cy="0" rx="56" ry="46" fill="none" stroke="#5a3018" stroke-width="0.55"/>
    <ellipse cx="0" cy="0" rx="40" ry="32" fill="#7a4818" opacity="0.65"/>
    <!-- Spokes -->
    <g stroke="#5a3018" stroke-width="1.4" opacity="0.85">
      <line x1="0" y1="-46" x2="0" y2="46"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-36" y1="-30" x2="36" y2="30"/>
      <line x1="36" y1="-30" x2="-36" y2="30"/>
    </g>
    <!-- Outer teeth (fine, even) -->
    <g fill="url(#p22p3gear)" stroke="#5a3018" stroke-width="0.4">
      <rect x="-2" y="-66" width="4" height="6"/>
      <rect x="-2" y="60" width="4" height="6"/>
      <rect x="-66" y="-2" width="6" height="4"/>
      <rect x="60" y="-2" width="6" height="4"/>
      <g transform="rotate(20)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(40)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(60)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(80)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(100)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(120)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(140)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(160)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(200)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(220)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(240)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(260)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(280)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(300)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(320)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(340)"><rect x="-2" y="-66" width="4" height="6"/></g>
    </g>

    <!-- SMALLER WHEEL -->
    <circle cx="0" cy="0" r="22" fill="url(#p22p3gear)"/>
    <circle cx="0" cy="0" r="14" fill="#7a4818" opacity="0.65"/>
    <circle cx="0" cy="0" r="4" fill="#1a0c04"/>
    <g fill="url(#p22p3gear)" stroke="#5a3018" stroke-width="0.4">
      <rect x="-1.4" y="-26" width="2.8" height="4"/>
      <rect x="-1.4" y="22" width="2.8" height="4"/>
      <rect x="-26" y="-1.4" width="4" height="2.8"/>
      <rect x="22" y="-1.4" width="4" height="2.8"/>
    </g>

    <!-- BRIGHT HIGHLIGHTS — the brass catches both lights -->
    <path d="M-40,-40 Q0,-50 40,-40" stroke="#fff8e8" stroke-width="1.4" fill="none" opacity="0.85" filter="url(#p22p3bloom)"/>
    <ellipse cx="-12" cy="-22" rx="6" ry="3" fill="#fff8e8" opacity="0.85" filter="url(#p22p3bloom)"/>
    <ellipse cx="-7" cy="-7" rx="3" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p22p3bloom)"/>
    <!-- Cool blue catching bottom-right edge -->
    <path d="M30,30 Q50,40 50,20" stroke="#a8d8ff" stroke-width="0.85" fill="none" opacity="0.65" filter="url(#p22p3bloom)"/>

    <!-- Where brass MEETS alien alloy: copper-gold interface markings -->
    <g stroke="#ffaa48" stroke-width="0.4" opacity="0.85" filter="url(#p22p3bloom)">
      <line x1="-50" y1="-40" x2="-46" y2="-44"/>
      <line x1="50" y1="-40" x2="46" y2="-44"/>
      <line x1="-50" y1="40" x2="-46" y2="44"/>
      <line x1="50" y1="40" x2="46" y2="44"/>
    </g>
    <!-- Tiny holo nodes at interface points -->
    <circle cx="-50" cy="-40" r="1.4" fill="#ffd078" opacity="0.85" filter="url(#p22p3bloom)"/>
    <circle cx="50" cy="-40" r="1.4" fill="#ffd078" opacity="0.85" filter="url(#p22p3bloom)"/>
    <circle cx="-50" cy="40" r="1.4" fill="#ffd078" opacity="0.85" filter="url(#p22p3bloom)"/>
    <circle cx="50" cy="40" r="1.4" fill="#ffd078" opacity="0.85" filter="url(#p22p3bloom)"/>
  </g>

  <!-- CAPTION 1 — She did not sleep -->
  <g>
    <rect x="14" y="34" width="210" height="34" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4a30" font-weight="700">CAPTION</text>
    <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="500">"She did not sleep that night."</text>
  </g>

  <!-- CAPTION 2 — She studied -->
  <g>
    <rect x="14" y="380" width="120" height="34" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <text x="22" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4a30" font-weight="700">CAPTION</text>
    <text x="22" y="408" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="700">"She studied."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,380 Q60,378 120,382 Q180,384 238,380"/>
  </g>
</svg>
