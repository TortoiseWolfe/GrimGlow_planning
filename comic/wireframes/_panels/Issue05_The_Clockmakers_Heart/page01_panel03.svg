<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 1 — Panel 3: Sable listening — split light from schematic + perimeter — Contingencies</title>
  <desc>50mm MCU. Sable listening, arms at sides, chin slightly raised. Schematic copper-gold wireframe casts geometric pattern across left side of silver suit and face. Cool blue-white perimeter glow at right. Two light sources split her face. Quiet authority.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p1p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p1p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p1p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3828"/>
      <stop offset="50%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a3828"/>
    </linearGradient>
    <radialGradient id="p1p3warmLeft" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1p3coolRight" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p1p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p1p3bg)"/>

  <!-- Distant brick texture -->
  <g opacity="0.4">
    <rect x="0" y="0" width="366" height="364" fill="#2a1810"/>
    <g stroke="#5a2818" stroke-width="0.5" fill="none">
      <path d="M0,80 Q120,82 240,78 Q320,76 366,80"/>
      <path d="M0,160 Q120,162 240,158 Q320,156 366,160"/>
      <path d="M0,240 Q120,238 240,242 Q320,244 366,240"/>
    </g>
  </g>

  <!-- LEFT WASH — copper-gold from schematic (off-panel left) -->
  <rect width="366" height="364" fill="url(#p1p3warmLeft)"/>
  <!-- RIGHT WASH — cool blue-white perimeter -->
  <rect width="366" height="364" fill="url(#p1p3coolRight)"/>

  <!-- Geometric wireframe shadow patterns on left side -->
  <g stroke="#ffd078" stroke-width="0.4" fill="none" opacity="0.5" filter="url(#p1p3bloom)">
    <path d="M-20,80 L100,90 L100,180 L-20,170 Z"/>
    <line x1="-20" y1="120" x2="100" y2="130"/>
    <line x1="40" y1="80" x2="40" y2="180"/>
    <path d="M0,260 L80,270 L80,330 L0,320 Z"/>
  </g>

  <!-- Right side perimeter dashed lines -->
  <g stroke="#a8c0ff" stroke-width="0.5" fill="none" opacity="0.55" filter="url(#p1p3bloom)" stroke-dasharray="3 2">
    <line x1="340" y1="40" x2="340" y2="324"/>
  </g>
  <circle cx="340" cy="40" r="1.4" fill="#88aaff" filter="url(#p1p3bloom)"/>
  <circle cx="340" cy="324" r="1.4" fill="#88aaff" filter="url(#p1p3bloom)"/>

  <!-- ===== SABLE — arms at sides, chin slightly raised ===== -->
  <g transform="translate(183 200)">
    <!-- Boots -->
    <ellipse cx="-7" cy="148" rx="8" ry="3" fill="#0a0408"/>
    <ellipse cx="7" cy="148" rx="8" ry="3" fill="#0a0408"/>
    <!-- Trousers -->
    <rect x="-12" y="80" width="11" height="68" fill="url(#p1p3suit)"/>
    <rect x="1" y="80" width="11" height="68" fill="url(#p1p3suit)"/>
    <!-- Dust at knees -->
    <ellipse cx="-7" cy="120" rx="9" ry="3" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="7" cy="120" rx="9" ry="3" fill="#5a4838" opacity="0.6"/>
    <!-- Torso -->
    <path d="M-22,80 L-22,-20 L22,-20 L22,80 Z" fill="url(#p1p3suit)"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#a8c0ff" stroke-width="1.4" opacity="0.85" filter="url(#p1p3bloom)"/>
    <line x1="0" y1="-20" x2="0" y2="50" stroke="#a8c0ff" stroke-width="0.85" opacity="0.7"/>
    <!-- LEFT side of torso catches warm copper-gold -->
    <ellipse cx="-22" cy="20" rx="14" ry="40" fill="#ffd078" opacity="0.35" filter="url(#p1p3bloom)"/>
    <!-- RIGHT side catches cool blue -->
    <ellipse cx="22" cy="20" rx="14" ry="40" fill="#a8c0ff" opacity="0.3" filter="url(#p1p3bloom)"/>
    <!-- Soot bloom right shoulder -->
    <ellipse cx="22" cy="-20" rx="6" ry="4" fill="#3a3038" opacity="0.85"/>
    <!-- Shoulders -->
    <path d="M-22,-20 Q-18,-36 -2,-42 Q14,-42 22,-32 L22,-20 Z" fill="url(#p1p3suit)"/>
    <!-- Arms at sides — controlled -->
    <rect x="-30" y="-20" width="8" height="80" fill="url(#p1p3suit)"/>
    <rect x="22" y="-20" width="8" height="80" fill="url(#p1p3suit)"/>
    <ellipse cx="-26" cy="64" rx="4" ry="3" fill="url(#p1p3skin)"/>
    <ellipse cx="26" cy="64" rx="4" ry="3" fill="url(#p1p3skin)"/>

    <!-- Head — chin slightly raised (looking forward at Wren/schematic) -->
    <ellipse cx="0" cy="-58" rx="22" ry="28" fill="url(#p1p3skin)"/>
    <!-- Left side warm wash on cheek -->
    <ellipse cx="-12" cy="-58" rx="10" ry="20" fill="#ffd078" opacity="0.4" filter="url(#p1p3bloom)"/>
    <!-- Right side cool wash -->
    <ellipse cx="12" cy="-58" rx="10" ry="20" fill="#a8c0ff" opacity="0.35" filter="url(#p1p3bloom)"/>
    <!-- Silver-buzz hair -->
    <path d="M-18,-78 Q-15,-86 0,-88 Q15,-86 18,-78 L17,-72 Q10,-80 0,-80 Q-10,-80 -17,-72 Z" fill="#e0d8d0"/>
    <!-- Hair side highlights -->
    <line x1="-16" y1="-82" x2="-12" y2="-78" stroke="#fff8e8" stroke-width="0.55" opacity="0.7"/>
    <line x1="12" y1="-80" x2="16" y2="-76" stroke="#fff8e8" stroke-width="0.55" opacity="0.7"/>
    <!-- Eyes — controlled, attentive -->
    <ellipse cx="-7" cy="-58" rx="3.4" ry="2" fill="#fff8e8"/>
    <ellipse cx="-7" cy="-57" rx="2.4" ry="1.6" fill="#3a2010"/>
    <circle cx="-7" cy="-57" r="1.4" fill="#0a0604"/>
    <circle cx="-6" cy="-58" r="0.55" fill="#fff8e8" filter="url(#p1p3bloom)"/>
    <ellipse cx="7" cy="-58" rx="3.4" ry="2" fill="#fff8e8"/>
    <ellipse cx="7" cy="-57" rx="2.4" ry="1.6" fill="#3a2010"/>
    <circle cx="7" cy="-57" r="1.4" fill="#0a0604"/>
    <circle cx="8" cy="-58" r="0.55" fill="#fff8e8" filter="url(#p1p3bloom)"/>
    <!-- Brows level — controlled -->
    <path d="M-13,-70 L-2,-71" stroke="#0a0604" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M2,-71 L13,-70" stroke="#0a0604" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M-2,-50 L-1,-40 Q1,-38 3,-38 L3,-44 Z" fill="url(#p1p3skin)" opacity="0.85"/>
    <!-- Mouth — set, jaw set, about to speak -->
    <path d="M-6,-32 L6,-32" stroke="#3a1808" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Chin lift slightly -->
    <path d="M-4,-26 Q0,-22 4,-26" fill="none" stroke="#5a3018" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- SABLE dialogue — single word command -->
  <g>
    <rect x="14" y="14" width="178" height="38" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="120,52 132,52 124,62" fill="white" stroke="#5a606a" stroke-width="0.85"/>
    <line x1="120.5" y1="52" x2="131.5" y2="52" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1410" font-weight="500">Contingencies.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,290 Q90,288 180,292 Q280,294 366,290"/>
  </g>
</svg>
