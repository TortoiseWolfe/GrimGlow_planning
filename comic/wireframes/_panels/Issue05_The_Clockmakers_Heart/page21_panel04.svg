<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 5 — Page 21 — Panel 4: Clockmaker tells wife Margaret about brownie — fond skepticism — between two warm worlds</title>
  <desc>50mm. Kitchen doorway. Clockmaker at threshold between workshop and domestic space. Margaret beyond — practical, mid-40s, flour on hands at kitchen table. He holds spectacles in one hand, rubbing face with other. Telling something he knows sounds insane. She: fond skeptical, smile forming. Two warm zones: workshop behind him, kitchen behind her. Dialog: CLOCKMAKER: Margaret. I think we've had a visitor. / MARGARET not looking up: Mm? / CLOCKMAKER: A brownie. In the workshop. / MARGARET now looking up: A brownie. / CLOCKMAKER: My grandmother used to leave milk for them. When she had the workshop in Holborn. / MARGARET smile forming: Henry.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p21p4bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5028"/>
      <stop offset="50%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#7a5028"/>
    </linearGradient>
    <linearGradient id="p21p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p21p4waistcoat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="50%" stop-color="#7a5828"/>
      <stop offset="100%" stop-color="#4a3818"/>
    </linearGradient>
    <linearGradient id="p21p4dress" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="50%" stop-color="#7a4838"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <radialGradient id="p21p4workshopGlow" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p21p4kitchenGlow" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p21p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p21p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="494" height="364" fill="url(#p21p4bg)"/>

  <!-- WORKSHOP GLOW from LEFT -->
  <rect width="494" height="364" fill="url(#p21p4workshopGlow)" opacity="0.85"/>
  <!-- KITCHEN GLOW from RIGHT -->
  <rect width="494" height="364" fill="url(#p21p4kitchenGlow)" opacity="0.85"/>

  <!-- DOORWAY frame (vertical division at center-left) -->
  <g transform="translate(180 0)">
    <rect x="-12" y="0" width="24" height="364" fill="#3a1808"/>
    <rect x="-9" y="0" width="18" height="364" fill="#5a3018"/>
    <line x1="0" y1="0" x2="0" y2="364" stroke="#1a0c04" stroke-width="0.55"/>
  </g>

  <!-- WORKSHOP suggestion (left of doorway) — bench, clocks faintly -->
  <g opacity="0.55">
    <rect y="240" width="180" height="40" fill="#a86838"/>
    <rect x="0" y="60" width="180" height="3" fill="#3a1808"/>
    <circle cx="40" cy="90" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="40" cy="90" r="6" fill="#fff8e8" opacity="0.85"/>
    <circle cx="120" cy="90" r="11" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="120" cy="90" r="8" fill="#fff8e8" opacity="0.85"/>
  </g>

  <!-- KITCHEN suggestion (right of doorway) — table, flour bag, hearth -->
  <g opacity="0.55">
    <rect y="240" width="494" height="40" fill="#5a3018"/>
    <!-- Kitchen table on right -->
    <rect x="220" y="200" width="200" height="60" fill="#7a5028"/>
    <line x1="220" y1="200" x2="420" y2="200" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Flour sack on table -->
    <ellipse cx="320" cy="190" rx="22" ry="14" fill="#fff8e8"/>
    <line x1="310" y1="180" x2="330" y2="180" stroke="#a86838" stroke-width="0.4"/>
    <!-- Mixing bowl -->
    <ellipse cx="380" cy="195" rx="14" ry="6" fill="#7a4818"/>
    <ellipse cx="380" cy="193" rx="11" ry="3" fill="#a86838"/>
  </g>

  <!-- ===== CLOCKMAKER at threshold (LEFT side, in doorway) ===== -->
  <g transform="translate(140 220)">
    <!-- Body -->
    <path d="M-22,30 L-26,140 L26,140 L22,30 Z" fill="url(#p21p4waistcoat)"/>
    <ellipse cx="0" cy="22" rx="14" ry="6" fill="#d8c8a8"/>

    <!-- Arms — one HOLDING SPECTACLES, other rubbing face -->
    <line x1="-22" y1="40" x2="-30" y2="0" stroke="#d8a878" stroke-width="11" stroke-linecap="round"/>
    <line x1="22" y1="40" x2="22" y2="80" stroke="#d8a878" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="-30" cy="0" rx="6" ry="4" fill="url(#p21p4skin)"/>
    <ellipse cx="22" cy="80" rx="9" ry="6" fill="url(#p21p4skin)"/>
    <!-- Spectacles in left hand -->
    <g transform="translate(-30 -3)">
      <ellipse cx="-2" cy="0" rx="3" ry="2" fill="none" stroke="#3a2818" stroke-width="0.55"/>
      <ellipse cx="3" cy="0" rx="3" ry="2" fill="none" stroke="#3a2818" stroke-width="0.55"/>
      <line x1="0" y1="0" x2="2" y2="0" stroke="#3a2818" stroke-width="0.4"/>
    </g>

    <!-- HEAD turned toward Margaret (RIGHT) -->
    <ellipse cx="9" cy="0" rx="20" ry="22" fill="url(#p21p4skin)"/>
    <path d="M-9,-22 Q-3,-28 9,-30 Q21,-28 27,-22 L25,-12 Q15,-26 9,-26 Q3,-26 -7,-12 Z" fill="#7a5028"/>
    <!-- Right HAND rubbing face (visible up at face level) -->
    <ellipse cx="22" cy="-8" rx="9" ry="6" fill="url(#p21p4skin)"/>
    <line x1="22" y1="80" x2="22" y2="-8" stroke="#d8a878" stroke-width="9" stroke-linecap="round"/>
    <!-- Eyes — looking right toward Margaret, slightly worried -->
    <ellipse cx="2" cy="-2" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <circle cx="4" cy="-2" r="1.2" fill="#a8b8c8"/>
    <circle cx="4" cy="-2" r="0.55" fill="#0a0c14"/>
    <ellipse cx="16" cy="-2" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <circle cx="18" cy="-2" r="1.2" fill="#a8b8c8"/>
    <circle cx="18" cy="-2" r="0.55" fill="#0a0c14"/>
    <!-- Brows up — embarrassed -->
    <path d="M-2,-10 L7,-12" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M11,-12 L20,-10" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — slightly open, mid-sentence -->
    <ellipse cx="9" cy="10" rx="3" ry="2" fill="#3a1808"/>
  </g>

  <!-- ===== MARGARET at kitchen table (RIGHT side, beyond doorway) ===== -->
  <g transform="translate(330 230)">
    <!-- Body — Victorian domestic dress -->
    <path d="M-26,30 L-32,134 L32,134 L26,30 Z" fill="url(#p21p4dress)"/>
    <!-- Apron front (lighter) -->
    <path d="M-22,30 L-26,134 L26,134 L22,30 Z" fill="#d8c8a8" opacity="0.65"/>
    <!-- Collar/bodice -->
    <ellipse cx="0" cy="22" rx="20" ry="9" fill="#d8c8a8"/>

    <!-- Arms working at table (down, kneading or stirring) -->
    <line x1="-22" y1="40" x2="-26" y2="80" stroke="url(#p21p4skin)" stroke-width="11" stroke-linecap="round"/>
    <line x1="22" y1="40" x2="22" y2="80" stroke="url(#p21p4skin)" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="-26" cy="80" rx="9" ry="6" fill="url(#p21p4skin)"/>
    <ellipse cx="22" cy="80" rx="9" ry="6" fill="url(#p21p4skin)"/>
    <!-- FLOUR ON HANDS -->
    <ellipse cx="-26" cy="80" rx="6" ry="3" fill="#fff8e8" opacity="0.65"/>
    <ellipse cx="22" cy="80" rx="6" ry="3" fill="#fff8e8" opacity="0.65"/>
    <!-- Flour dust on apron -->
    <circle cx="-7" cy="60" r="1.4" fill="#fff8e8" opacity="0.55"/>
    <circle cx="9" cy="80" r="1" fill="#fff8e8" opacity="0.45"/>

    <!-- HEAD — looking UP NOW (mid-panel — eyebrows raised, smile forming) -->
    <ellipse cx="0" cy="0" rx="20" ry="22" fill="url(#p21p4skin)"/>
    <!-- Hair pulled back in bun -->
    <path d="M-18,-22 Q-12,-30 0,-32 Q12,-30 18,-22 L16,-12 Q8,-26 0,-26 Q-8,-26 -16,-12 Z" fill="#7a4818"/>
    <ellipse cx="14" cy="-26" rx="6" ry="4" fill="#7a4818"/>
    <!-- Hazel/brown eyes -->
    <ellipse cx="-7" cy="-4" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <circle cx="-7" cy="-3" r="1.2" fill="#5a3018"/>
    <circle cx="-7" cy="-3" r="0.55" fill="#0a0604"/>
    <ellipse cx="7" cy="-4" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <circle cx="7" cy="-3" r="1.2" fill="#5a3018"/>
    <circle cx="7" cy="-3" r="0.55" fill="#0a0604"/>
    <!-- Brows RAISED — fond skepticism -->
    <path d="M-12,-12 L-3,-13" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M3,-13 L12,-12" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — smile forming -->
    <path d="M-5,8 Q0,11 5,8" stroke="#3a1808" stroke-width="0.85" fill="none" stroke-linecap="round"/>
    <!-- Smile lines forming -->
    <path d="M-9,4 Q-7,8 -5,9" stroke="#5a3018" stroke-width="0.4" fill="none" opacity="0.65"/>
    <path d="M9,4 Q7,8 5,9" stroke="#5a3018" stroke-width="0.4" fill="none" opacity="0.65"/>
  </g>

  <!-- DIALOG CLOCKMAKER (Margaret visitor) -->
  <g transform="translate(120 50)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,18 L36,30 L26,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-90" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-90" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"Margaret. I think we've had a visitor."</text>
  </g>

  <!-- DIALOG MARGARET (Mm?) -->
  <g transform="translate(380 60)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#ffffff" stroke="#7a4838" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,16 L-36,28 L-26,18 Z" fill="#ffffff" stroke="#7a4838" stroke-width="1"/>
    <text x="-30" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4838" font-weight="700">MARGARET</text>
    <text x="-30" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="500">"Mm?"</text>
  </g>

  <!-- DIALOG CLOCKMAKER (a brownie) -->
  <g transform="translate(120 130)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,18 L36,30 L26,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-90" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-90" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"A brownie. In the workshop."</text>
  </g>

  <!-- DIALOG MARGARET (A brownie) -->
  <g transform="translate(380 130)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="#ffffff" stroke="#7a4838" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,16 L-36,28 L-26,18 Z" fill="#ffffff" stroke="#7a4838" stroke-width="1"/>
    <text x="-50" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4838" font-weight="700">MARGARET</text>
    <text x="-50" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"A brownie."</text>
  </g>

  <!-- DIALOG CLOCKMAKER (grandmother Holborn) -->
  <g transform="translate(120 320)">
    <ellipse cx="0" cy="0" rx="220" ry="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M30,20 L46,38 L36,22 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-210" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-210" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"My grandmother used to leave milk for them. When she had the workshop in Holborn."</text>
  </g>

  <!-- DIALOG MARGARET (Henry) -->
  <g transform="translate(420 290)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#ffffff" stroke="#7a4838" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,-16 L-36,-28 L-26,-18 Z" fill="#ffffff" stroke="#7a4838" stroke-width="1"/>
    <text x="-30" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4838" font-weight="700">MARGARET</text>
    <text x="-30" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">"Henry."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,138 240,142 Q360,144 494,140"/>
    <path d="M0,310 Q120,308 240,312 Q360,314 494,310"/>
  </g>
</svg>
