<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 663" width="742" height="663">
  <title>Issue 5 — Page 22 — Panel 1: Wren at workstation, clock schematic open beside drive assembly — studying by choice</title>
  <desc>28mm wide tall. Wren's workstation. Cross-legged on timber beam. Damaged temporal drive in stages of reconstruction, components arranged precise order. Fairy holo tools + improvised Victorian (bent pin lever, hair tie-wire). Precision gear integrated into drive. Holographic clock schematic still open beside drive, copper-gold rotating. Wren not working on drive — studying clock, hand tracing gears. Other squad shapes in darkness. A student not a soldier. Dialog: WREN: Bimetallic strip for temperature compensation. Brass and steel expand at different rates... / WREN: ...and he calibrated the ratio by trial. Years of trial. / WREN very quiet: I would not have thought of that.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p22p1bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="50%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#1a1218"/>
    </linearGradient>
    <linearGradient id="p22p1timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p22p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p22p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p22p1stolen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <radialGradient id="p22p1coolDrive" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a8d8ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3060a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p22p1warmClock" cx="80%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p22p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p22p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="663" fill="url(#p22p1bg)"/>

  <!-- COOL BLUE drive light from LEFT -->
  <rect width="742" height="663" fill="url(#p22p1coolDrive)" opacity="0.85"/>
  <!-- WARM COPPER-GOLD clock light from RIGHT (DOMINANT) -->
  <rect width="742" height="663" fill="url(#p22p1warmClock)" opacity="0.85"/>

  <!-- TIMBER BEAM HORIZONTAL where Wren sits cross-legged -->
  <rect x="60" y="380" width="622" height="22" fill="url(#p22p1timber)"/>
  <line x1="60" y1="380" x2="682" y2="380" stroke="#a86838" stroke-width="0.55" opacity="0.65" filter="url(#p22p1bloom)"/>

  <!-- TIMBER BEAMS framing left/right -->
  <rect width="60" height="663" fill="url(#p22p1timber)"/>
  <rect x="682" width="60" height="663" fill="url(#p22p1timber)"/>
  <!-- Timber crossbeams -->
  <rect y="80" width="60" height="9" fill="#3a1808"/>
  <rect y="240" width="60" height="9" fill="#3a1808"/>
  <rect y="500" width="60" height="9" fill="#3a1808"/>
  <rect x="682" y="80" width="60" height="9" fill="#3a1808"/>
  <rect x="682" y="240" width="60" height="9" fill="#3a1808"/>
  <rect x="682" y="500" width="60" height="9" fill="#3a1808"/>

  <!-- TIMBER BEAMS overhead suggesting cavity -->
  <rect x="0" y="0" width="742" height="40" fill="url(#p22p1timber)"/>
  <rect x="100" y="0" width="20" height="80" fill="#3a1808"/>
  <rect x="280" y="0" width="20" height="60" fill="#3a1808"/>
  <rect x="440" y="0" width="20" height="80" fill="#3a1808"/>
  <rect x="620" y="0" width="20" height="60" fill="#3a1808"/>

  <!-- DIM CAMP BACKGROUND — other squad shapes in darkness -->
  <g opacity="0.45">
    <!-- Sleeping figures (just shapes) -->
    <ellipse cx="120" cy="560" rx="22" ry="9" fill="#3a2818"/>
    <ellipse cx="640" cy="560" rx="22" ry="9" fill="#3a2818"/>
    <!-- Faint power cell at edge -->
    <rect x="80" y="620" width="14" height="22" fill="#3060a8"/>
    <ellipse cx="87" cy="620" rx="14" ry="6" fill="#a8d8ff" opacity="0.65" filter="url(#p22p1bloom)"/>
    <!-- Quiet watch figure top-right -->
    <ellipse cx="660" cy="80" rx="11" ry="9" fill="#3a2818"/>
    <!-- Faint emerald hint (Jink) -->
    <circle cx="660" cy="80" r="2" fill="#3ad0a8" opacity="0.65" filter="url(#p22p1bloom)"/>
  </g>

  <!-- FAINT perimeter emitter line at floor -->
  <g fill="#a8d8ff" opacity="0.65">
    <rect x="80" y="640" width="6" height="3" filter="url(#p22p1bloom)"/>
    <rect x="280" y="640" width="6" height="3" filter="url(#p22p1bloom)"/>
    <rect x="480" y="640" width="6" height="3" filter="url(#p22p1bloom)"/>
    <rect x="640" y="640" width="6" height="3" filter="url(#p22p1bloom)"/>
  </g>
  <line x1="80" y1="642" x2="640" y2="642" stroke="#a8d8ff" stroke-width="0.4" opacity="0.45"/>

  <!-- ===== DRIVE ASSEMBLY (LEFT side, on timber beam workspace) ===== -->
  <g transform="translate(160 280)">
    <!-- Halo -->
    <ellipse cx="0" cy="0" rx="140" ry="100" fill="#a8d8ff" opacity="0.45" filter="url(#p22p1glow)"/>

    <!-- Drive components (alien aesthetic — hex shapes, crystalline) -->
    <g stroke="#a8d8ff" stroke-width="1" fill="none" opacity="0.85" filter="url(#p22p1bloom)">
      <ellipse cx="0" cy="0" rx="120" ry="80"/>
      <ellipse cx="0" cy="0" rx="80" ry="50"/>
      <!-- Hex assembly nodes -->
      <polygon points="-50,-30 -36,-44 -16,-44 -2,-30 -16,-16 -36,-16"/>
      <polygon points="20,-30 34,-44 54,-44 68,-30 54,-16 34,-16"/>
      <polygon points="-15,15 -1,1 19,1 33,15 19,29 -1,29"/>
      <line x1="-2" y1="-30" x2="20" y2="-30"/>
      <line x1="40" y1="-16" x2="0" y2="0"/>
      <line x1="-20" y1="-16" x2="0" y2="0"/>
    </g>
    <!-- Crystalline filled nodes -->
    <g fill="#5a98e8" opacity="0.85">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="-50" cy="-30" r="2"/>
      <circle cx="40" cy="-30" r="2"/>
      <circle cx="9" cy="15" r="2"/>
    </g>

    <!-- ===== INTEGRATED PRECISION GEAR — brass, warm, AT CENTER ===== -->
    <g transform="translate(0 0)">
      <!-- Warm halo around the gear (the warm note in cool field) -->
      <circle cx="0" cy="0" r="34" fill="#ffd078" opacity="0.55" filter="url(#p22p1glow)"/>
      <circle cx="0" cy="0" r="22" fill="url(#p22p1stolen)"/>
      <circle cx="0" cy="0" r="18" fill="#7a4818" opacity="0.65"/>
      <circle cx="0" cy="0" r="6" fill="#1a0c04"/>
      <g stroke="#5a3018" stroke-width="0.55">
        <line x1="0" y1="-22" x2="0" y2="-26"/>
        <line x1="0" y1="22" x2="0" y2="26"/>
        <line x1="-22" y1="0" x2="-26" y2="0"/>
        <line x1="22" y1="0" x2="26" y2="0"/>
        <line x1="-15" y1="-15" x2="-18" y2="-18"/>
        <line x1="15" y1="-15" x2="18" y2="-18"/>
        <line x1="-15" y1="15" x2="-18" y2="18"/>
        <line x1="15" y1="15" x2="18" y2="18"/>
      </g>
      <ellipse cx="-6" cy="-6" rx="3" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p22p1bloom)"/>
      <!-- Faint copper-gold halo (where Wren's tools interface) -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#ffaa48" stroke-width="0.55" opacity="0.65" filter="url(#p22p1bloom)"/>
    </g>
  </g>

  <!-- ===== HOLOGRAPHIC CLOCK SCHEMATIC (RIGHT side) — large, rotating, copper-gold ===== -->
  <g transform="translate(560 280)">
    <!-- Massive halo -->
    <circle cx="0" cy="0" r="140" fill="#ffaa48" opacity="0.55" filter="url(#p22p1glow)"/>

    <!-- Rotating wireframe (perspective rings) -->
    <g stroke="#ffd078" stroke-width="1" fill="none" opacity="0.85" filter="url(#p22p1bloom)">
      <ellipse cx="0" cy="0" rx="120" ry="90"/>
      <ellipse cx="0" cy="0" rx="100" ry="75"/>
      <ellipse cx="0" cy="0" rx="80" ry="60"/>
      <ellipse cx="0" cy="0" rx="20" ry="90"/>
      <ellipse cx="0" cy="0" rx="40" ry="90"/>
    </g>

    <!-- Inner gears wireframe -->
    <g stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.85" filter="url(#p22p1bloom)">
      <circle cx="-44" cy="-30" r="22"/>
      <circle cx="-44" cy="-30" r="14"/>
      <circle cx="-44" cy="-30" r="3"/>
      <circle cx="44" cy="-30" r="18"/>
      <circle cx="44" cy="-30" r="11"/>
      <circle cx="0" cy="11" r="26" stroke="#fff8e8" stroke-width="1"/>
      <circle cx="0" cy="11" r="18"/>
      <circle cx="0" cy="11" r="6"/>
      <circle cx="0" cy="50" r="14"/>
      <circle cx="0" cy="50" r="8"/>
    </g>
    <!-- Spokes -->
    <g stroke="#ffd078" stroke-width="0.55" filter="url(#p22p1bloom)" opacity="0.85">
      <line x1="-44" y1="-50" x2="-44" y2="-10"/>
      <line x1="-66" y1="-30" x2="-22" y2="-30"/>
      <line x1="-58" y1="-44" x2="-30" y2="-16"/>
      <line x1="44" y1="-46" x2="44" y2="-14"/>
      <line x1="28" y1="-30" x2="60" y2="-30"/>
      <line x1="0" y1="-14" x2="0" y2="34"/>
      <line x1="-24" y1="11" x2="24" y2="11"/>
      <line x1="-18" y1="-8" x2="18" y2="28"/>
      <line x1="18" y1="-8" x2="-18" y2="28"/>
    </g>
    <!-- Tooth marks -->
    <g stroke="#fff8e8" stroke-width="0.4" filter="url(#p22p1bloom)" opacity="0.85">
      <line x1="0" y1="-14" x2="0" y2="-18"/>
      <line x1="-26" y1="11" x2="-30" y2="11"/>
      <line x1="26" y1="11" x2="30" y2="11"/>
      <line x1="0" y1="34" x2="0" y2="38"/>
    </g>

    <!-- PENDULUM swinging -->
    <line x1="0" y1="-90" x2="0" y2="0" stroke="#ffd078" stroke-width="0.85" opacity="0.85" filter="url(#p22p1bloom)"/>
    <ellipse cx="0" cy="-90" rx="6" ry="3" fill="#ffd078" opacity="0.85" filter="url(#p22p1bloom)"/>

    <!-- Arc trail -->
    <path d="M-22,-78 Q0,-92 22,-78" stroke="#ffaa48" stroke-width="0.4" fill="none" opacity="0.65" stroke-dasharray="2,2"/>

    <!-- Hex emitter base at bottom -->
    <polygon points="-9,90 -5,84 5,84 9,90 5,96 -5,96" fill="#ffd078" opacity="0.85" filter="url(#p22p1bloom)"/>
  </g>

  <!-- ===== WREN — cross-legged on beam, BETWEEN both schematics ===== -->
  <g transform="translate(371 350)">
    <!-- Body — seated cross-legged -->
    <path d="M-22,-50 L-26,30 L26,30 L22,-50 Z" fill="url(#p22p1suit)"/>
    <line x1="-12" y1="-30" x2="12" y2="-30" stroke="#ffaa48" stroke-width="0.85" opacity="0.85" filter="url(#p22p1bloom)"/>
    <!-- Heavy clock oil smear -->
    <ellipse cx="0" cy="-15" rx="14" ry="6" fill="#1a0c04" opacity="0.55" transform="rotate(-15 0 -15)"/>

    <!-- Shoulders -->
    <ellipse cx="-22" cy="-50" rx="6" ry="4" fill="url(#p22p1suit)"/>
    <ellipse cx="22" cy="-50" rx="6" ry="4" fill="url(#p22p1suit)"/>
    <ellipse cx="-22" cy="-50" rx="4" ry="3" fill="#1a0c04" opacity="0.7"/>

    <!-- Cross-legged: visible legs folded under body -->
    <ellipse cx="0" cy="32" rx="40" ry="9" fill="url(#p22p1suit)"/>
    <ellipse cx="-22" cy="22" rx="14" ry="6" fill="url(#p22p1suit)"/>
    <ellipse cx="22" cy="22" rx="14" ry="6" fill="url(#p22p1suit)"/>
    <!-- Knee bumps -->
    <circle cx="-26" cy="20" r="6" fill="url(#p22p1suit)"/>
    <circle cx="26" cy="20" r="6" fill="url(#p22p1suit)"/>
    <!-- COPPER DUST at knees (visible) -->
    <circle cx="-26" cy="22" r="3" fill="#c87a35" opacity="0.55"/>
    <circle cx="26" cy="22" r="3" fill="#c87a35" opacity="0.55"/>

    <!-- LEFT ARM — resting on drive (toward LEFT) -->
    <line x1="-22" y1="-46" x2="-100" y2="-30" stroke="url(#p22p1skin)" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="-100" cy="-30" rx="4" ry="3" fill="url(#p22p1skin)"/>
    <!-- Faint cool blue holo halo around left hand (interface with drive) -->
    <circle cx="-100" cy="-30" r="9" fill="#a8d8ff" opacity="0.45" filter="url(#p22p1glow)"/>

    <!-- RIGHT ARM — extended, finger TRACING clock schematic (toward RIGHT) -->
    <line x1="22" y1="-46" x2="180" y2="-50" stroke="url(#p22p1skin)" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="180" cy="-50" rx="5" ry="3" fill="url(#p22p1skin)"/>
    <!-- Index finger extended -->
    <line x1="180" y1="-50" x2="200" y2="-54" stroke="url(#p22p1skin)" stroke-width="2" stroke-linecap="round"/>
    <!-- Warm halo around tracing finger -->
    <circle cx="200" cy="-54" r="9" fill="#ffd078" opacity="0.65" filter="url(#p22p1glow)"/>
    <!-- Faint trace line into schematic -->
    <path d="M200,-54 Q220,-50 230,-44" stroke="#ffaa48" stroke-width="0.55" fill="none" opacity="0.65" stroke-dasharray="2,2"/>

    <!-- Wrist holo emitter (right) — copper-gold active -->
    <g transform="translate(180 -50)">
      <circle cx="0" cy="0" r="9" fill="#ffaa48" opacity="0.65" filter="url(#p22p1glow)"/>
      <polygon points="-3,0 -1.4,-2.4 1.4,-2.4 3,0 1.4,2.4 -1.4,2.4" fill="none" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p22p1bloom)"/>
      <circle cx="0" cy="0" r="1.4" fill="#fff8e8" filter="url(#p22p1bloom)"/>
    </g>

    <!-- HEAD turned LEFT-of-center toward clock schematic -->
    <ellipse cx="9" cy="-70" rx="9" ry="11" fill="url(#p22p1skin)"/>
    <!-- Hair UP — bun + WILD with copper dust -->
    <ellipse cx="9" cy="-80" rx="5" ry="3" fill="#0a0604"/>
    <ellipse cx="9" cy="-86" rx="3" ry="2" fill="#1a0c04"/>
    <path d="M-3,-78 Q-1,-86 9,-90 Q19,-86 21,-78 L19,-72 Q15,-83 9,-83 Q3,-83 -1,-72 Z" fill="#0a0604"/>
    <circle cx="3" cy="-83" r="0.4" fill="#c87a35" opacity="0.85"/>
    <circle cx="15" cy="-83" r="0.4" fill="#c87a35" opacity="0.85"/>
    <!-- Loose strands -->
    <path d="M3,-66 Q-1,-58 1,-50" stroke="#0a0604" stroke-width="0.7" fill="none"/>
    <path d="M15,-66 Q19,-58 17,-50" stroke="#0a0604" stroke-width="0.55" fill="none"/>

    <!-- Eyes — looking RIGHT at clock schematic, soft focus (a student) -->
    <ellipse cx="6" cy="-70" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="9" cy="-70" r="1" fill="#3a2010"/>
    <circle cx="9" cy="-70" r="0.55" fill="#0a0604"/>
    <ellipse cx="14" cy="-70" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="16" cy="-70" r="1" fill="#3a2010"/>
    <circle cx="16" cy="-70" r="0.55" fill="#0a0604"/>
    <!-- Reflection of clock schematic in eyes -->
    <circle cx="11" cy="-72" r="0.4" fill="#ffd078" filter="url(#p22p1bloom)"/>
    <circle cx="17" cy="-72" r="0.4" fill="#ffd078" filter="url(#p22p1bloom)"/>
    <!-- Brows level — soft -->
    <path d="M3,-74 L9,-75" stroke="#0a0604" stroke-width="0.55" stroke-linecap="round"/>
    <path d="M11,-75 L19,-74" stroke="#0a0604" stroke-width="0.55" stroke-linecap="round"/>
    <!-- Mouth — slightly parted, contemplative -->
    <ellipse cx="11" cy="-62" rx="1.4" ry="0.85" fill="#3a1808"/>

    <!-- Both lights on her face -->
    <ellipse cx="6" cy="-66" rx="6" ry="9" fill="#a8c8e8" opacity="0.45" filter="url(#p22p1bloom)"/>
    <ellipse cx="16" cy="-66" rx="9" ry="11" fill="#ffd078" opacity="0.55" filter="url(#p22p1bloom)"/>
  </g>

  <!-- TOOLS scattered on beam — fairy + improvised Victorian -->
  <g transform="translate(280 380)">
    <!-- Bent pin (Victorian salvage) -->
    <path d="M-44,-3 L-40,-9 L-36,-3" stroke="#a86838" stroke-width="0.85" fill="none"/>
    <!-- Hair as tie-wire -->
    <path d="M-22,-3 Q-15,-7 -8,-3" stroke="#5a3818" stroke-width="0.4" fill="none"/>
    <!-- Tiny holo tool emitter (fairy) -->
    <circle cx="14" cy="-3" r="2" fill="#ffaa48" opacity="0.65" filter="url(#p22p1bloom)"/>
    <!-- Schematic chip -->
    <rect x="40" y="-6" width="9" height="6" fill="#3060a8" opacity="0.85"/>
    <ellipse cx="44" cy="-3" rx="4" ry="2" fill="#a8d8ff" opacity="0.65" filter="url(#p22p1bloom)"/>
  </g>

  <!-- DIALOG WREN (bimetallic strip) -->
  <g transform="translate(180 100)">
    <ellipse cx="0" cy="0" rx="160" ry="22" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,18 L36,32 L26,20 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-150" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-150" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"Bimetallic strip for temperature compensation."</text>
  </g>

  <!-- DIALOG WREN (years of trial) -->
  <g transform="translate(560 160)">
    <ellipse cx="0" cy="0" rx="160" ry="22" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-30,18 L-44,32 L-24,20 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-150" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-150" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"...he calibrated by trial. Years of trial."</text>
  </g>

  <!-- DIALOG WREN (very quiet) -->
  <g transform="translate(180 600)">
    <ellipse cx="0" cy="0" rx="180" ry="22" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,-18 L36,-32 L26,-20 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-170" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-170" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="600">"I would not have thought of that."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,500 Q180,498 360,502 Q540,504 742,500"/>
  </g>
</svg>
