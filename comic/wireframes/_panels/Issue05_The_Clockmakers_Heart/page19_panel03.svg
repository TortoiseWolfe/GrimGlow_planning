<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 19 — Panel 3: Wren CU — clock schematic at wrist — assumption challenged by evidence</title>
  <desc>85mm CU. Wren's face. Holographic wrist-display active — but she has called up the clock mechanism, not the drive schematic. Three-dimensional rotating diagram of regulator hovers at wrist, copper-gold geometric. She is staring at it. Expression: not quite admiration, not quite confusion. Assumption challenged. Dialog: SABLE off-panel: Wren. Debrief in five. / WREN not looking away: ...Yeah.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p19p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="p19p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p19p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p19p3warmHolo" cx="20%" cy="100%" r="120%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c87a35" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p3coolCamp" cx="100%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a8c8e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a708a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p19p3holoCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p19p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p19p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p19p3bg)"/>
  <!-- Cool blue camp light from BACK-RIGHT -->
  <rect width="366" height="364" fill="url(#p19p3coolCamp)" opacity="0.65"/>
  <!-- Warm copper-gold holo from WRIST (foreground-left) -->
  <rect width="366" height="364" fill="url(#p19p3warmHolo)" opacity="0.85"/>

  <!-- ===== WREN'S FACE ===== -->
  <g transform="translate(183 200)">
    <!-- Suit collar at bottom -->
    <path d="M-100,150 L-120,90 L120,90 L100,150 Z" fill="url(#p19p3suit)"/>
    <line x1="-60" y1="100" x2="60" y2="100" stroke="#ffaa48" stroke-width="0.85" opacity="0.85" filter="url(#p19p3bloom)"/>
    <!-- New CLOCK OIL SMEAR across collar -->
    <ellipse cx="0" cy="110" rx="34" ry="9" fill="#1a0c04" opacity="0.55" transform="rotate(-15 0 110)"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="0" rx="120" ry="140" fill="url(#p19p3skin)"/>
    <!-- Warm glow on left of face (from holographic schematic) -->
    <ellipse cx="-40" cy="20" rx="60" ry="80" fill="#ffd078" opacity="0.55" filter="url(#p19p3bloom)"/>
    <!-- Cool glow on right (from camp light) -->
    <ellipse cx="60" cy="-30" rx="40" ry="60" fill="#a8c8e8" opacity="0.45" filter="url(#p19p3bloom)"/>

    <!-- Hair UP — bun + WILD with COPPER DUST -->
    <ellipse cx="0" cy="-110" rx="20" ry="14" fill="#0a0604"/>
    <ellipse cx="0" cy="-118" rx="14" ry="9" fill="#1a0c04"/>
    <path d="M-110,-110 Q-90,-140 0,-148 Q90,-140 110,-110 L106,-94 Q70,-128 0,-128 Q-70,-128 -106,-94 Z" fill="#0a0604"/>
    <!-- Copper dust flecks in hair -->
    <circle cx="-30" cy="-110" r="0.85" fill="#c87a35" opacity="0.85"/>
    <circle cx="30" cy="-110" r="0.85" fill="#c87a35" opacity="0.85"/>
    <circle cx="0" cy="-130" r="0.7" fill="#c87a35" opacity="0.85"/>
    <circle cx="-50" cy="-95" r="0.7" fill="#c87a35" opacity="0.85"/>
    <circle cx="60" cy="-100" r="0.7" fill="#c87a35" opacity="0.85"/>
    <!-- Wild loose strands -->
    <path d="M-80,-50 Q-92,-20 -84,20" stroke="#0a0604" stroke-width="2" fill="none"/>
    <path d="M-60,-60 Q-72,-30 -64,10" stroke="#0a0604" stroke-width="1.4" fill="none"/>
    <path d="M80,-50 Q92,-20 84,20" stroke="#0a0604" stroke-width="2" fill="none"/>

    <!-- Oil smudge on cheek -->
    <ellipse cx="-50" cy="40" rx="14" ry="9" fill="#1a0c04" opacity="0.55" transform="rotate(-15 -50 40)"/>

    <!-- EYES — open, intent, complex -->
    <ellipse cx="-44" cy="-30" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="-44" cy="-26" rx="14" ry="11" fill="#3a2010"/>
    <circle cx="-44" cy="-26" r="9" fill="#0a0604"/>
    <!-- WARM (copper-gold) reflection in pupil from holo -->
    <circle cx="-40" cy="-30" r="3" fill="#ffd078" filter="url(#p19p3bloom)"/>
    <circle cx="-38" cy="-32" r="1" fill="#fff8e8" filter="url(#p19p3bloom)"/>

    <ellipse cx="44" cy="-30" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="44" cy="-26" rx="14" ry="11" fill="#3a2010"/>
    <circle cx="44" cy="-26" r="9" fill="#0a0604"/>
    <circle cx="48" cy="-30" r="3" fill="#ffd078" filter="url(#p19p3bloom)"/>
    <circle cx="50" cy="-32" r="1" fill="#fff8e8" filter="url(#p19p3bloom)"/>

    <!-- Brows — slightly knit, complex -->
    <path d="M-66,-50 L-22,-50" stroke="#0a0604" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M22,-50 L66,-50" stroke="#0a0604" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Subtle furrow between brows -->
    <line x1="-6" y1="-44" x2="6" y2="-44" stroke="#5a3018" stroke-width="0.55" opacity="0.55"/>

    <!-- Nose -->
    <path d="M-6,4 L-2,40 Q2,44 6,42 L10,4 Z" fill="url(#p19p3skin)" opacity="0.85"/>

    <!-- Mouth — slightly parted, contemplative -->
    <ellipse cx="0" cy="68" rx="11" ry="3.4" fill="#3a1808"/>
    <ellipse cx="0" cy="66" rx="6" ry="1.4" fill="#a86838"/>
  </g>

  <!-- HOLOGRAPHIC CLOCK SCHEMATIC at wrist (lower-left of frame) -->
  <g transform="translate(60 320)">
    <!-- Halo -->
    <circle cx="0" cy="0" r="60" fill="url(#p19p3holoCenter)" filter="url(#p19p3glow)"/>

    <!-- Wrist visible at bottom -->
    <rect x="-22" y="20" width="44" height="40" fill="url(#p19p3suit)"/>
    <line x1="-15" y1="30" x2="15" y2="30" stroke="#ffaa48" stroke-width="0.85" opacity="0.85" filter="url(#p19p3bloom)"/>

    <!-- Holographic schematic — small wireframe clock mechanism rotating -->
    <g opacity="0.85">
      <!-- Outer wireframe ring -->
      <circle cx="0" cy="0" r="34" fill="none" stroke="#ffd078" stroke-width="0.85" filter="url(#p19p3bloom)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#ffaa48" stroke-width="0.55" filter="url(#p19p3bloom)"/>
      <!-- Inner gears (simplified wireframe) -->
      <circle cx="-9" cy="-9" r="11" fill="none" stroke="#ffd078" stroke-width="0.7" filter="url(#p19p3bloom)"/>
      <circle cx="9" cy="-9" r="9" fill="none" stroke="#ffaa48" stroke-width="0.55" filter="url(#p19p3bloom)"/>
      <circle cx="0" cy="9" r="14" fill="none" stroke="#ffd078" stroke-width="0.7" filter="url(#p19p3bloom)"/>
      <!-- Spokes on each -->
      <g stroke="#ffd078" stroke-width="0.4" opacity="0.85">
        <line x1="-9" y1="-20" x2="-9" y2="2"/>
        <line x1="-20" y1="-9" x2="2" y2="-9"/>
        <line x1="9" y1="-18" x2="9" y2="0"/>
        <line x1="0" y1="-5" x2="18" y2="-5"/>
        <line x1="0" y1="-5" x2="0" y2="23"/>
        <line x1="-14" y1="9" x2="14" y2="9"/>
      </g>
      <!-- Gear teeth (tiny radial marks) -->
      <g stroke="#fff8e8" stroke-width="0.4" filter="url(#p19p3bloom)">
        <line x1="-9" y1="-22" x2="-9" y2="-24"/>
        <line x1="-22" y1="-9" x2="-24" y2="-9"/>
        <line x1="9" y1="-20" x2="9" y2="-22"/>
        <line x1="0" y1="-7" x2="0" y2="-9"/>
        <line x1="0" y1="25" x2="0" y2="27"/>
        <line x1="-16" y1="9" x2="-18" y2="9"/>
        <line x1="16" y1="9" x2="18" y2="9"/>
      </g>
      <!-- Pendulum line -->
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#ffd078" stroke-width="0.55" opacity="0.85"/>
      <ellipse cx="0" cy="-30" rx="3" ry="2" fill="#ffd078" opacity="0.85" filter="url(#p19p3bloom)"/>
      <!-- Subtle rotation arrow -->
      <path d="M-30,-20 Q-32,-16 -30,-12" stroke="#ffaa48" stroke-width="0.4" fill="none" opacity="0.65"/>
    </g>
    <!-- Hex base pattern (where holo emanates) -->
    <polygon points="-6,18 -3,14 3,14 6,18 3,22 -3,22" fill="#ffd078" opacity="0.85" filter="url(#p19p3bloom)"/>
  </g>

  <!-- DIALOG SABLE off-panel (faded, dashed) -->
  <g transform="translate(280 50)">
    <ellipse cx="0" cy="0" rx="80" ry="20" fill="#ffffff" stroke="#5a606a" stroke-width="1" stroke-dasharray="2,2" opacity="0.85" filter="url(#balloonShadow)"/>
    <path d="M-22,16 L-36,30 L-26,18 Z" fill="#ffffff" stroke="#5a606a" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="-70" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
    <text x="-70" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"Wren. Debrief in five."</text>
  </g>

  <!-- DIALOG WREN -->
  <g transform="translate(260 320)">
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,-14 L-36,-26 L-26,-16 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-40" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-40" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="500">"...Yeah."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,300 Q90,298 180,302 Q280,304 366,300"/>
  </g>
</svg>
