<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 311" width="742" height="311">
  <title>Issue 5 — Page 7 — Panel 4: WORKSHOP REVEAL — cathedral of craft from baseboard — clockmaker hunched at bench, grandfather clock back wall</title>
  <desc>24mm wide low angle from baseboard. Workbench legs as columns. Floor as plain. Wall clocks. Display cases. Grandfather clock dominant back wall. Clockmaker enormous at bench. Oil lamp amber filling room. Brass surfaces multiplying light. Caption: Hoskins and Sons. Precision horology since 1847.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p4walls" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#4a2818"/>
    </linearGradient>
    <linearGradient id="p7p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p7p4mahogany" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p7p4bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p7p4brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p7p4lampHearth" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p4ambientWarm" cx="50%" cy="60%" r="80%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a4828" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="p7p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p7p4glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- Walls -->
  <rect width="742" height="240" fill="url(#p7p4walls)"/>
  <!-- Wall plank seams -->
  <g stroke="#3a1808" stroke-width="0.55" opacity="0.6">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="220" x2="742" y2="220"/>
  </g>

  <!-- AMBIENT WARM WASH filling room -->
  <rect width="742" height="311" fill="url(#p7p4ambientWarm)"/>

  <!-- ===== GRANDFATHER CLOCK — dominant back wall ===== -->
  <g transform="translate(550 130)">
    <!-- Plinth -->
    <rect x="-44" y="100" width="88" height="20" fill="#3a1808"/>
    <!-- Case body — tall mahogany tower -->
    <rect x="-38" y="-130" width="76" height="240" fill="url(#p7p4mahogany)" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Crown moulding -->
    <path d="M-44,-130 L-38,-145 L38,-145 L44,-130 Z" fill="#5a2818"/>
    <rect x="-46" y="-148" width="92" height="6" fill="#3a1808"/>
    <!-- Clock face circle -->
    <circle cx="0" cy="-100" r="18" fill="#fff8e8" filter="url(#p7p4bloom)" opacity="0.95"/>
    <circle cx="0" cy="-100" r="14" fill="#ffd078" opacity="0.7"/>
    <line x1="0" y1="-100" x2="0" y2="-114" stroke="#1a0c04" stroke-width="0.85"/>
    <line x1="0" y1="-100" x2="8" y2="-94" stroke="#1a0c04" stroke-width="0.7"/>
    <!-- Hour markers -->
    <g fill="#1a0c04">
      <circle cx="0" cy="-114" r="0.7"/>
      <circle cx="14" cy="-100" r="0.7"/>
      <circle cx="0" cy="-86" r="0.7"/>
      <circle cx="-14" cy="-100" r="0.7"/>
    </g>
    <!-- Glass panel showing pendulum -->
    <rect x="-26" y="-78" width="52" height="180" fill="#0a0604"/>
    <line x1="-26" y1="-78" x2="-26" y2="102" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="26" y1="-78" x2="26" y2="102" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="-26" y1="-78" x2="26" y2="-78" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Reflection on glass -->
    <ellipse cx="-14" cy="-50" rx="6" ry="20" fill="#fff8e8" opacity="0.18"/>
    <!-- Pendulum disc (mid-swing) -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#ffd078" stroke-width="1.6" opacity="0.85"/>
    <circle cx="0" cy="60" r="14" fill="url(#p7p4brass)" stroke="#7a4818" stroke-width="0.55"/>
    <circle cx="0" cy="60" r="10" fill="#ffd078" opacity="0.85"/>
    <!-- Reflective sheen on case -->
    <rect x="-38" y="-130" width="9" height="240" fill="#fff8e8" opacity="0.18"/>
  </g>

  <!-- ===== WORKBENCH — turned legs as pillars ===== -->
  <g>
    <!-- Bench top -->
    <rect x="80" y="180" width="380" height="14" fill="url(#p7p4bench)" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="80" y1="184" x2="460" y2="184" stroke="#1a0c04" stroke-width="0.4"/>
    <!-- Turned legs (pillars at fairy scale) -->
    <g fill="url(#p7p4bench)" stroke="#1a0c04" stroke-width="0.55">
      <rect x="100" y="194" width="14" height="46"/>
      <ellipse cx="107" cy="200" rx="9" ry="3"/>
      <ellipse cx="107" cy="216" rx="9" ry="3"/>
      <ellipse cx="107" cy="232" rx="9" ry="3"/>
    </g>
    <g fill="url(#p7p4bench)" stroke="#1a0c04" stroke-width="0.55">
      <rect x="240" y="194" width="14" height="46"/>
      <ellipse cx="247" cy="200" rx="9" ry="3"/>
      <ellipse cx="247" cy="216" rx="9" ry="3"/>
      <ellipse cx="247" cy="232" rx="9" ry="3"/>
    </g>
    <g fill="url(#p7p4bench)" stroke="#1a0c04" stroke-width="0.55">
      <rect x="420" y="194" width="14" height="46"/>
      <ellipse cx="427" cy="200" rx="9" ry="3"/>
      <ellipse cx="427" cy="216" rx="9" ry="3"/>
      <ellipse cx="427" cy="232" rx="9" ry="3"/>
    </g>
    <!-- TOOLS hanging from edge of bench -->
    <g stroke="#a86838" stroke-width="0.7" fill="#7a4818">
      <rect x="160" y="194" width="3" height="14"/>
      <rect x="180" y="194" width="3" height="11"/>
      <rect x="200" y="194" width="3" height="14"/>
      <rect x="220" y="194" width="3" height="9"/>
      <rect x="280" y="194" width="3" height="14"/>
      <rect x="300" y="194" width="3" height="11"/>
      <rect x="320" y="194" width="3" height="14"/>
      <rect x="340" y="194" width="3" height="9"/>
      <rect x="380" y="194" width="3" height="14"/>
      <rect x="400" y="194" width="3" height="11"/>
    </g>
    <!-- Tool handles (suggesting screwdrivers, files, pliers) -->
    <g fill="#5a2818">
      <rect x="158" y="208" width="7" height="7" rx="0.55"/>
      <rect x="178" y="205" width="7" height="6" rx="0.55"/>
      <rect x="198" y="208" width="7" height="7" rx="0.55"/>
      <rect x="278" y="208" width="7" height="7" rx="0.55"/>
      <rect x="298" y="205" width="7" height="6" rx="0.55"/>
      <rect x="318" y="208" width="7" height="7" rx="0.55"/>
    </g>
  </g>

  <!-- OIL LAMP on bench (huge amber hearth) -->
  <g transform="translate(220 174)">
    <ellipse cx="0" cy="0" rx="60" ry="44" fill="url(#p7p4lampHearth)" filter="url(#p7p4glow)" opacity="0.95"/>
    <!-- Lamp base -->
    <rect x="-9" y="-2" width="18" height="6" fill="url(#p7p4brass)"/>
    <!-- Glass chimney -->
    <path d="M-7,-2 L-9,-22 L9,-22 L7,-2 Z" fill="#fff8e8" opacity="0.65" filter="url(#p7p4bloom)"/>
    <!-- Flame -->
    <ellipse cx="0" cy="-12" rx="3.4" ry="6" fill="#fff8e8" filter="url(#p7p4bloom)"/>
    <ellipse cx="0" cy="-10" rx="2" ry="3.4" fill="#ffd078"/>
  </g>

  <!-- ===== CLOCKMAKER hunched at bench (mid-ground) ===== -->
  <g transform="translate(330 150)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="22" ry="18" fill="#3a2010"/>
    <ellipse cx="-5" cy="8" rx="14" ry="11" fill="#5a3018"/>
    <!-- Head bowed forward -->
    <ellipse cx="-9" cy="-7" rx="9" ry="11" fill="#a86838"/>
    <!-- Hair (grey/brown) -->
    <ellipse cx="-9" cy="-15" rx="7" ry="4" fill="#5a4838"/>
    <!-- Magnifying loupe -->
    <ellipse cx="-12" cy="-3" rx="5" ry="3" fill="none" stroke="#7a4818" stroke-width="0.85"/>
    <ellipse cx="-12" cy="-3" rx="3.4" ry="2" fill="#fff8e8" opacity="0.55" filter="url(#p7p4bloom)"/>
    <!-- Headband -->
    <ellipse cx="-9" cy="-12" rx="9" ry="1.4" fill="#3a1808"/>
    <!-- Apron over chest -->
    <path d="M-12,4 L-14,22 L14,22 L12,4 Z" fill="#5a3018"/>
    <line x1="-14" y1="22" x2="14" y2="22" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Rolled shirtsleeves -->
    <ellipse cx="-22" cy="20" rx="7" ry="4" fill="#d8c8a8"/>
    <ellipse cx="22" cy="20" rx="7" ry="4" fill="#d8c8a8"/>
    <!-- Large capable hands at work -->
    <ellipse cx="-26" cy="28" rx="7" ry="4" fill="#a86838"/>
    <ellipse cx="26" cy="28" rx="7" ry="4" fill="#a86838"/>
  </g>

  <!-- WALL CLOCKS along upper walls -->
  <g transform="translate(80 60)">
    <circle cx="0" cy="0" r="14" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="11" fill="#fff8e8" opacity="0.85"/>
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#1a0c04" stroke-width="0.55"/>
  </g>
  <g transform="translate(160 50)">
    <rect x="-12" y="-9" width="24" height="18" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="6" fill="#fff8e8" opacity="0.85"/>
  </g>
  <g transform="translate(240 60)">
    <circle cx="0" cy="0" r="11" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="9" fill="#fff8e8" opacity="0.85"/>
  </g>
  <g transform="translate(440 50)">
    <rect x="-14" y="-11" width="28" height="22" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="7" fill="#fff8e8" opacity="0.85"/>
  </g>

  <!-- Display cases on shelves -->
  <rect x="100" y="80" width="80" height="14" fill="#3a1808"/>
  <rect x="220" y="80" width="80" height="14" fill="#3a1808"/>
  <!-- Pocket watches -->
  <g fill="#a86838" stroke="#7a4818" stroke-width="0.4">
    <circle cx="120" cy="86" r="3"/>
    <circle cx="150" cy="86" r="3"/>
    <circle cx="240" cy="86" r="3"/>
    <circle cx="270" cy="86" r="3"/>
  </g>

  <!-- FLOOR planks (wide roads at fairy scale) -->
  <rect x="0" y="240" width="742" height="71" fill="url(#p7p4floor)"/>
  <line x1="0" y1="244" x2="742" y2="244" stroke="#3a1808" stroke-width="0.85"/>
  <g stroke="#3a1808" stroke-width="0.7" opacity="0.7">
    <line x1="80" y1="244" x2="100" y2="311"/>
    <line x1="220" y1="244" x2="240" y2="311"/>
    <line x1="380" y1="244" x2="400" y2="311"/>
    <line x1="540" y1="244" x2="560" y2="311"/>
    <line x1="660" y1="244" x2="680" y2="311"/>
  </g>

  <!-- Polished brass reflections on floor (long shadows + amber pools) -->
  <ellipse cx="220" cy="270" rx="180" ry="34" fill="#ffd078" opacity="0.45" filter="url(#p7p4glow)"/>
  <ellipse cx="540" cy="280" rx="120" ry="22" fill="#ffd078" opacity="0.35" filter="url(#p7p4glow)"/>

  <!-- CAPTION (top-left) -->
  <g>
    <rect x="14" y="14" width="394" height="38" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#5a4a30" font-style="italic" font-weight="500">The workshop of Hoskins and Sons. Precision horology since 1847.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,250 Q200,252 400,248 Q580,246 742,250"/>
  </g>
</svg>
