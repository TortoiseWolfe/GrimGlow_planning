<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 311" width="494" height="311">
  <title>Issue 5 — Page 13 — Panel 5: Sable at comms relay receives Wren's transmission — Jink already moving — Thresh at exit</title>
  <desc>65mm MCU. Camp interior. Sable at holographic comms relay, hand pressed to earpiece. Sharp calculation, no panic. Behind: Jink wing-pack seams brightening, ready to fly. Thresh at wall-gap exit with weapon. Cool blue-white holo light. Warm gaslight leaks through wall-gap. Dialog: SABLE: Copy. Hold position. Do not engage. / SABLE to Jink: Get the boy. / JINK already moving: On it.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="p13p5timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p13p5sableSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9098a8"/>
      <stop offset="50%" stop-color="#5a606a"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="p13p5skinDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="50%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p13p5jinkSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ad0a8"/>
      <stop offset="50%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a4018"/>
    </linearGradient>
    <linearGradient id="p13p5threshSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc4040"/>
      <stop offset="50%" stop-color="#a82020"/>
      <stop offset="100%" stop-color="#5a0810"/>
    </linearGradient>
    <radialGradient id="p13p5holoBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8d8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3060a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p13p5gasGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p13p5commsRelay" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8d8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3060a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p13p5glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="494" height="311" fill="url(#p13p5bg)"/>

  <!-- WALL CAVITY interior — timber beams left and right -->
  <rect x="0" y="0" width="60" height="311" fill="url(#p13p5timber)"/>
  <line x1="0" y1="60" x2="60" y2="60" stroke="#5a3018" stroke-width="0.55" opacity="0.65"/>
  <line x1="0" y1="180" x2="60" y2="180" stroke="#5a3018" stroke-width="0.55" opacity="0.65"/>
  <rect x="434" y="0" width="60" height="311" fill="url(#p13p5timber)"/>

  <!-- WALL GAP exit on RIGHT — warm gaslight leaks through -->
  <g transform="translate(440 200)">
    <rect x="0" y="-60" width="54" height="120" fill="#1a0c04"/>
    <ellipse cx="27" cy="0" rx="40" ry="60" fill="url(#p13p5gasGlow)" filter="url(#p13p5glow)"/>
    <!-- Visible alley light hint -->
    <rect x="10" y="-40" width="20" height="80" fill="#5a3018" opacity="0.85"/>
    <rect x="14" y="-36" width="12" height="72" fill="#7a4818" opacity="0.65"/>
  </g>

  <!-- Cool blue holographic ambient -->
  <ellipse cx="200" cy="150" rx="200" ry="120" fill="url(#p13p5holoBlue)" filter="url(#p13p5glow)" opacity="0.55"/>

  <!-- Faint perimeter emitters (small geometric dots at floor edges) -->
  <g fill="#a8d8ff" opacity="0.85">
    <rect x="80" y="280" width="6" height="3" filter="url(#p13p5bloom)"/>
    <rect x="180" y="280" width="6" height="3" filter="url(#p13p5bloom)"/>
    <rect x="280" y="280" width="6" height="3" filter="url(#p13p5bloom)"/>
    <rect x="380" y="280" width="6" height="3" filter="url(#p13p5bloom)"/>
  </g>
  <line x1="80" y1="282" x2="380" y2="282" stroke="#a8d8ff" stroke-width="0.55" opacity="0.55"/>

  <!-- COMMS RELAY — holographic, on small ledge, foreground left of center -->
  <g transform="translate(120 200)">
    <!-- Base device -->
    <rect x="-14" y="0" width="28" height="20" fill="#3a2818" stroke="#5a3018" stroke-width="0.55"/>
    <!-- Holographic projection -->
    <ellipse cx="0" cy="-30" rx="40" ry="40" fill="url(#p13p5commsRelay)" filter="url(#p13p5glow)"/>
    <!-- Hex pattern at center of relay -->
    <polygon points="-8,-26 8,-26 12,-32 8,-38 -8,-38 -12,-32" fill="none" stroke="#a8d8ff" stroke-width="0.85" opacity="0.85" filter="url(#p13p5bloom)"/>
    <polygon points="-4,-30 4,-30 6,-33 4,-36 -4,-36 -6,-33" fill="#a8d8ff" opacity="0.75" filter="url(#p13p5bloom)"/>
    <!-- Pulse circles (transmission) -->
    <circle cx="0" cy="-30" r="22" fill="none" stroke="#a8d8ff" stroke-width="0.55" opacity="0.55" filter="url(#p13p5bloom)"/>
    <circle cx="0" cy="-30" r="32" fill="none" stroke="#a8d8ff" stroke-width="0.4" opacity="0.45"/>
  </g>

  <!-- ===== SABLE — at comms relay, MCU foreground left ===== -->
  <g transform="translate(160 150)">
    <!-- Body -->
    <path d="M-28,40 L-32,140 L32,140 L28,40 Z" fill="url(#p13p5sableSuit)"/>
    <!-- SOOT BLOOM right shoulder -->
    <ellipse cx="22" cy="36" rx="14" ry="9" fill="#1a0c04" opacity="0.7"/>
    <!-- DUST at knees -->
    <ellipse cx="-22" cy="120" rx="12" ry="6" fill="#5a4838" opacity="0.55"/>
    <ellipse cx="22" cy="120" rx="12" ry="6" fill="#5a4838" opacity="0.55"/>
    <!-- Suit accent (DIM holographic seams under grime) -->
    <line x1="-14" y1="50" x2="14" y2="50" stroke="#a8d8ff" stroke-width="0.55" opacity="0.55" filter="url(#p13p5bloom)"/>
    <line x1="-12" y1="80" x2="12" y2="80" stroke="#a8d8ff" stroke-width="0.4" opacity="0.45"/>

    <!-- Shoulders -->
    <ellipse cx="-26" cy="34" rx="12" ry="7" fill="url(#p13p5sableSuit)"/>
    <ellipse cx="26" cy="34" rx="12" ry="7" fill="url(#p13p5sableSuit)"/>

    <!-- Arm 1 — pressed to earpiece (right hand to head, listening) -->
    <line x1="20" y1="40" x2="6" y2="-14" stroke="#5a606a" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="6" cy="-14" rx="5" ry="3.4" fill="url(#p13p5skinDark)"/>
    <!-- Arm 2 — at side -->
    <line x1="-22" y1="48" x2="-30" y2="100" stroke="#5a606a" stroke-width="8" stroke-linecap="round"/>

    <!-- HEAD — dark skin, sharp angular features -->
    <ellipse cx="0" cy="0" rx="22" ry="26" fill="url(#p13p5skinDark)"/>
    <!-- Silver-white BUZZ CUT (almost no length) -->
    <path d="M-20,-22 Q-14,-30 0,-32 Q14,-30 20,-22 L18,-14 Q10,-26 0,-26 Q-10,-26 -18,-14 Z" fill="#e8e8f0"/>
    <!-- Sharp bone structure -->
    <path d="M-22,-2 L-20,8" stroke="#1a0c04" stroke-width="0.55" opacity="0.65"/>
    <path d="M22,-2 L20,8" stroke="#1a0c04" stroke-width="0.55" opacity="0.65"/>

    <!-- Eyes — sharp, calculating -->
    <ellipse cx="-9" cy="-6" rx="4" ry="2.4" fill="#fff8e8"/>
    <circle cx="-9" cy="-6" r="2" fill="#3a2810"/>
    <circle cx="-8.5" cy="-6.5" r="0.85" fill="#0a0604"/>
    <ellipse cx="9" cy="-6" rx="4" ry="2.4" fill="#fff8e8"/>
    <circle cx="9" cy="-6" r="2" fill="#3a2810"/>
    <circle cx="9.5" cy="-6.5" r="0.85" fill="#0a0604"/>
    <!-- Brows — set, sharp -->
    <path d="M-14,-12 L-4,-13" stroke="#3a2818" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M4,-13 L14,-12" stroke="#3a2818" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Mouth — jaw set -->
    <path d="M-7,12 L7,12" stroke="#3a1808" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Earpiece -->
    <circle cx="-20" cy="-2" r="2" fill="#a8d8ff" opacity="0.85" filter="url(#p13p5bloom)"/>
  </g>

  <!-- ===== JINK — behind Sable, already moving, wing-pack seams brightening ===== -->
  <g transform="translate(290 130)">
    <!-- Body in motion -->
    <path d="M-14,40 L-20,130 L20,130 L14,40 Z" fill="url(#p13p5jinkSuit)"/>
    <!-- Wing-pack seams BRIGHTENING (emerald geometric lattice) -->
    <line x1="-14" y1="50" x2="14" y2="50" stroke="#3ad0a8" stroke-width="1.4" opacity="0.85" filter="url(#p13p5bloom)"/>
    <line x1="-12" y1="70" x2="12" y2="70" stroke="#3ad0a8" stroke-width="1" opacity="0.75" filter="url(#p13p5bloom)"/>
    <line x1="-10" y1="90" x2="10" y2="90" stroke="#3ad0a8" stroke-width="0.85" opacity="0.65" filter="url(#p13p5bloom)"/>
    <!-- Wing-pack edges glowing on shoulder -->
    <path d="M-20,40 L-30,30 L-26,38 Z" fill="#3ad0a8" opacity="0.65" filter="url(#p13p5bloom)"/>
    <path d="M20,40 L30,30 L26,38 Z" fill="#3ad0a8" opacity="0.65" filter="url(#p13p5bloom)"/>
    <!-- CHEST SOOT STREAK -->
    <ellipse cx="-3" cy="60" rx="9" ry="11" fill="#1a0c04" opacity="0.55" transform="rotate(-15 -3 60)"/>

    <!-- Shoulders -->
    <ellipse cx="-14" cy="34" rx="9" ry="6" fill="url(#p13p5jinkSuit)"/>
    <ellipse cx="14" cy="34" rx="9" ry="6" fill="url(#p13p5jinkSuit)"/>

    <!-- HEAD — young, androgynous, golden curly hair -->
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#d8a878"/>
    <!-- Golden curly blonde hair -->
    <ellipse cx="0" cy="-18" rx="22" ry="14" fill="#f8d068"/>
    <ellipse cx="-12" cy="-22" rx="6" ry="5" fill="#f8d068"/>
    <ellipse cx="12" cy="-22" rx="6" ry="5" fill="#f8d068"/>
    <ellipse cx="0" cy="-26" rx="14" ry="6" fill="#f8d068"/>
    <ellipse cx="-16" cy="-12" rx="4" ry="6" fill="#f8d068"/>
    <ellipse cx="16" cy="-12" rx="4" ry="6" fill="#f8d068"/>

    <!-- Eyes — alert, ready -->
    <ellipse cx="-7" cy="-2" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="-7" cy="-2" r="1.4" fill="#2ed078"/>
    <circle cx="-7" cy="-2.5" r="0.4" fill="#0a0604"/>
    <ellipse cx="7" cy="-2" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="7" cy="-2" r="1.4" fill="#2ed078"/>
    <circle cx="7" cy="-2.5" r="0.4" fill="#0a0604"/>
    <!-- Brows -->
    <path d="M-12,-8 L-3,-9" stroke="#5a3818" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M3,-9 L12,-8" stroke="#5a3818" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — slight smirk (action loved) -->
    <path d="M-5,8 Q0,11 6,8" stroke="#3a1808" stroke-width="0.85" fill="none" stroke-linecap="round"/>

    <!-- Wings DEPLOYED — translucent dragonfly wings, prismatic trails -->
    <g opacity="0.55">
      <path d="M-30,30 Q-60,20 -80,40 Q-50,30 -30,50 Z" fill="#3ad0a8" filter="url(#p13p5glow)"/>
      <path d="M30,30 Q60,20 80,40 Q50,30 30,50 Z" fill="#3ad0a8" filter="url(#p13p5glow)"/>
      <!-- Wing veins -->
      <line x1="-30" y1="30" x2="-70" y2="30" stroke="#3ad0a8" stroke-width="0.4" opacity="0.85"/>
      <line x1="30" y1="30" x2="70" y2="30" stroke="#3ad0a8" stroke-width="0.4" opacity="0.85"/>
    </g>
  </g>

  <!-- ===== THRESH — at wall-gap exit, weapon ready, watching alley ===== -->
  <g transform="translate(420 180)">
    <!-- Body in armor (broad-shouldered, crimson) -->
    <path d="M-22,30 L-28,110 L28,110 L22,30 Z" fill="url(#p13p5threshSuit)"/>
    <!-- DENTED LEFT PAULDRON (dark dent) -->
    <ellipse cx="-18" cy="34" rx="9" ry="6" fill="url(#p13p5threshSuit)"/>
    <ellipse cx="-18" cy="34" rx="5" ry="3" fill="#1a0c04" opacity="0.7"/>
    <ellipse cx="18" cy="34" rx="9" ry="6" fill="url(#p13p5threshSuit)"/>
    <!-- LEG SCUFF MARKS -->
    <ellipse cx="-12" cy="92" rx="5" ry="3" fill="#5a4838" opacity="0.65"/>
    <ellipse cx="12" cy="92" rx="5" ry="3" fill="#5a4838" opacity="0.65"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#d8a878"/>
    <!-- Copper-red BUZZ CUT -->
    <path d="M-12,-12 Q0,-22 12,-12 L10,-6 Q4,-16 0,-16 Q-4,-16 -10,-6 Z" fill="#a85020"/>

    <!-- Eyes -->
    <ellipse cx="-5" cy="-2" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-5" cy="-2" r="1" fill="#3a2010"/>
    <ellipse cx="5" cy="-2" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="5" cy="-2" r="1" fill="#3a2010"/>
    <!-- Brows tense -->
    <path d="M-9,-8 L-2,-9" stroke="#5a2010" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M2,-9 L9,-8" stroke="#5a2010" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — set -->
    <path d="M-4,6 L4,6" stroke="#3a1808" stroke-width="0.7" stroke-linecap="round"/>

    <!-- Weapon (compact rifle in white-knuckle grip) — held forward toward exit -->
    <g transform="translate(20 50)">
      <rect x="0" y="-6" width="34" height="6" fill="#3a2818"/>
      <rect x="0" y="-3" width="34" height="2" fill="#1a0c04"/>
      <rect x="-6" y="-9" width="10" height="14" fill="#3a2818"/>
      <!-- Holo sight -->
      <circle cx="6" cy="-12" r="2" fill="#a8d8ff" opacity="0.85" filter="url(#p13p5bloom)"/>
      <!-- Hand grip (white knuckle) -->
      <ellipse cx="-2" cy="-2" rx="5" ry="3.4" fill="url(#p13p5skinDark)"/>
      <ellipse cx="-2" cy="-2" rx="2" ry="1" fill="#fff8e8" opacity="0.85" filter="url(#p13p5bloom)"/>
    </g>
  </g>

  <!-- DIALOG — SABLE first line -->
  <g transform="translate(244 36)">
    <ellipse cx="0" cy="0" rx="120" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-78,18 L-94,32 L-72,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-110" y="-4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
    <text x="-110" y="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">"Copy. Hold position. Do not engage."</text>
  </g>

  <!-- DIALOG — SABLE to Jink -->
  <g transform="translate(360 90)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,16 L-32,28 L-18,18 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-50" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
    <text x="-50" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="700">"Get the boy."</text>
  </g>

  <!-- DIALOG — JINK -->
  <g transform="translate(366 270)">
    <ellipse cx="0" cy="0" rx="48" ry="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,-16 L-32,-28 L-18,-18 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-40" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK</text>
    <text x="-40" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="700">"On it."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q120,92 240,88 Q360,86 494,90"/>
    <path d="M0,260 Q120,258 240,262 Q360,264 494,260"/>
  </g>
</svg>
