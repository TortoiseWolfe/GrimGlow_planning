<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 311" width="366" height="311">
  <title>Issue 5 — Page 18 — Panel 4: Wren on workshop floor — looks UP at clock — reluctant respect — Damn</title>
  <desc>50mm fairy-scale. Wren on sawdust floorboard, just dropped from clock base. Precision gear secured to back. Suit filthy — fresh clock oil over existing stains, copper dust in hair, new scratch on forearm. Breathing hard. Looks UP at clock towering above her like a building of brass and precision. Reluctant respect. Dialog: WREN quiet to herself: Damn.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p18p4floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p18p4clockCase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p18p4clockGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p18p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p18p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p18p4stolen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <radialGradient id="p18p4amberStray" cx="80%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p18p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="311" fill="url(#p18p4bg)"/>
  <!-- Stray amber from above-right -->
  <rect width="366" height="311" fill="url(#p18p4amberStray)"/>

  <!-- ===== GRANDFATHER CLOCK looming above (fills upper 2/3, towering) ===== -->
  <g transform="translate(183 0)">
    <!-- Clock case rising -->
    <rect x="-100" y="0" width="200" height="220" fill="url(#p18p4clockCase)"/>
    <rect x="-96" y="4" width="192" height="216" fill="none" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Wood grain -->
    <line x1="-96" y1="60" x2="96" y2="60" stroke="#1a0c04" stroke-width="0.4" opacity="0.55"/>
    <line x1="-96" y1="120" x2="96" y2="120" stroke="#1a0c04" stroke-width="0.4" opacity="0.55"/>
    <line x1="-96" y1="180" x2="96" y2="180" stroke="#1a0c04" stroke-width="0.4" opacity="0.55"/>
    <!-- Polish gloss -->
    <rect x="-90" y="0" width="22" height="220" fill="url(#p18p4clockGloss)" opacity="0.45"/>

    <!-- Crown molding at top -->
    <rect x="-110" y="0" width="220" height="14" fill="#3a1808"/>
    <path d="M-110,0 L-100,-9 L100,-9 L110,0 Z" fill="#3a1808"/>

    <!-- Glass panel (showing pendulum within) -->
    <rect x="-30" y="40" width="60" height="100" fill="#7a8898" opacity="0.45"/>
    <rect x="-26" y="44" width="52" height="92" fill="#1a0c04"/>
    <line x1="0" y1="44" x2="0" y2="120" stroke="#a86838" stroke-width="1.4"/>
    <ellipse cx="0" cy="120" rx="11" ry="6" fill="url(#p18p4clockGloss)"/>
    <ellipse cx="-3" cy="118" rx="3" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p18p4bloom)"/>

    <!-- Bottom of case (where Wren dropped from) — hint of OPENING above -->
    <rect x="-90" y="200" width="180" height="20" fill="#1a0c04"/>
    <line x1="-90" y1="200" x2="90" y2="200" stroke="#5a3018" stroke-width="0.85"/>
    <!-- Faint emerald exit gap (the access point) -->
    <rect x="-44" y="205" width="14" height="11" fill="#0a0408"/>
  </g>

  <!-- FLOOR with sawdust -->
  <rect y="220" width="366" height="91" fill="url(#p18p4floor)"/>
  <line x1="0" y1="220" x2="366" y2="220" stroke="#1a0c04" stroke-width="0.55"/>
  <!-- Floorboards -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="250" x2="366" y2="250"/>
    <line x1="0" y1="280" x2="366" y2="280"/>
    <line x1="0" y1="305" x2="366" y2="305"/>
  </g>
  <!-- Sawdust texture (small flecks) -->
  <g fill="#7a5028" opacity="0.65">
    <circle cx="40" cy="240" r="0.85"/>
    <circle cx="80" cy="252" r="0.7"/>
    <circle cx="120" cy="244" r="0.85"/>
    <circle cx="160" cy="258" r="0.7"/>
    <circle cx="200" cy="252" r="0.85"/>
    <circle cx="240" cy="240" r="0.7"/>
    <circle cx="280" cy="256" r="0.85"/>
    <circle cx="320" cy="248" r="0.7"/>
    <circle cx="60" cy="270" r="0.85"/>
    <circle cx="140" cy="278" r="0.55"/>
    <circle cx="220" cy="272" r="0.85"/>
    <circle cx="300" cy="276" r="0.55"/>
  </g>

  <!-- Stray amber beam catching the gear on her back -->
  <ellipse cx="180" cy="240" rx="60" ry="22" fill="#ffd078" opacity="0.45" filter="url(#p18p4glow)"/>

  <!-- ===== WREN — center floor, looking UP ===== -->
  <g transform="translate(183 245)">
    <!-- Body — facing AWAY (back to viewer), HEAD turned/tilted UP -->
    <path d="M-9,-30 L-12,-9 L-15,30 L0,30 L0,-30 Z" fill="url(#p18p4suit)"/>
    <path d="M2,-30 L4,-9 L8,30 L18,28 L14,-30 Z" fill="url(#p18p4suit)"/>
    <line x1="-9" y1="-22" x2="14" y2="-22" stroke="#ffaa48" stroke-width="0.55" opacity="0.85" filter="url(#p18p4bloom)"/>

    <!-- Shoulders -->
    <ellipse cx="-9" cy="-30" rx="4" ry="3" fill="url(#p18p4suit)"/>
    <ellipse cx="14" cy="-30" rx="4" ry="3" fill="url(#p18p4suit)"/>
    <!-- SCORCH MARK -->
    <ellipse cx="-9" cy="-30" rx="3" ry="2" fill="#1a0c04" opacity="0.7"/>
    <!-- New CLOCK OIL SMEAR across chest (heavy) -->
    <ellipse cx="0" cy="-15" rx="14" ry="6" fill="#1a0c04" opacity="0.55" transform="rotate(-15 0 -15)"/>

    <!-- Arms hanging slightly raised (steadying after drop) -->
    <line x1="-9" y1="-26" x2="-30" y2="6" stroke="url(#p18p4skin)" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="14" y1="-26" x2="32" y2="6" stroke="url(#p18p4skin)" stroke-width="3.4" stroke-linecap="round"/>
    <!-- NEW SCRATCH on right forearm (red wound) -->
    <line x1="22" y1="-12" x2="26" y2="-4" stroke="#dc4040" stroke-width="0.55"/>
    <line x1="20" y1="-10" x2="24" y2="-2" stroke="#a82020" stroke-width="0.4"/>

    <!-- Legs (knees slightly bent, just landed) -->
    <line x1="-6" y1="32" x2="-12" y2="50" stroke="#5a2818" stroke-width="2.4"/>
    <line x1="6" y1="32" x2="12" y2="50" stroke="#5a2818" stroke-width="2.4"/>

    <!-- ===== STOLEN PRECISION GEAR ON BACK ===== -->
    <g transform="translate(4 -10)">
      <circle cx="0" cy="0" r="22" fill="#ffd078" opacity="0.45" filter="url(#p18p4glow)"/>
      <circle cx="0" cy="0" r="11" fill="url(#p18p4stolen)"/>
      <circle cx="0" cy="0" r="9" fill="#7a4818" opacity="0.55"/>
      <circle cx="0" cy="0" r="3" fill="#1a0c04"/>
      <g stroke="#5a3018" stroke-width="0.4">
        <line x1="0" y1="-11" x2="0" y2="-13"/>
        <line x1="0" y1="11" x2="0" y2="13"/>
        <line x1="-11" y1="0" x2="-13" y2="0"/>
        <line x1="11" y1="0" x2="13" y2="0"/>
      </g>
      <ellipse cx="-4" cy="-4" rx="2" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p18p4bloom)"/>
      <path d="M-11,0 Q0,-9 11,0" stroke="#c87a35" stroke-width="0.55" fill="none"/>
      <path d="M-11,0 Q0,9 11,0" stroke="#c87a35" stroke-width="0.55" fill="none"/>
    </g>

    <!-- HEAD turned UP, tilted way back -->
    <ellipse cx="3" cy="-44" rx="6" ry="7" fill="url(#p18p4skin)"/>
    <!-- Hair WILD with COPPER DUST -->
    <ellipse cx="3" cy="-50" rx="4" ry="2" fill="#0a0604"/>
    <!-- Copper dust in hair (small flecks) -->
    <circle cx="0" cy="-49" r="0.55" fill="#c87a35" opacity="0.85"/>
    <circle cx="6" cy="-49" r="0.55" fill="#c87a35" opacity="0.85"/>
    <circle cx="3" cy="-52" r="0.4" fill="#c87a35" opacity="0.85"/>
    <!-- Wild strands -->
    <path d="M-3,-44 Q-7,-38 -7,-32" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M9,-44 Q12,-38 11,-32" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <!-- Eyes — looking UP (whites visible at bottom) -->
    <ellipse cx="0" cy="-44" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="0" cy="-43" r="1" fill="#0a0604"/>
    <ellipse cx="6" cy="-44" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="6" cy="-43" r="1" fill="#0a0604"/>
    <!-- Brows — slightly raised (reluctant awe) -->
    <path d="M-3,-48 L3,-49" stroke="#0a0604" stroke-width="0.55" stroke-linecap="round"/>
    <path d="M3,-49 L9,-48" stroke="#0a0604" stroke-width="0.55" stroke-linecap="round"/>
    <!-- Mouth — slightly parted, breathing hard -->
    <ellipse cx="3" cy="-38" rx="1.4" ry="0.85" fill="#3a1808"/>
  </g>

  <!-- DIALOG WREN -->
  <g transform="translate(280 80)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,16 L-36,28 L-26,18 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-40" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-40" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">"Damn."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,260 Q90,258 180,262 Q280,264 366,260"/>
  </g>
</svg>
