<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 422" width="238" height="422">
  <title>Issue 5 — Page 9 — Panel 2: Wren's hand on gear tooth — oil film transfers — touch as understanding</title>
  <desc>85mm CU. Tiny copper-suited fingers reaching toward enormous polished brass gear tooth. Tooth size of door, edge precise. Fingers touch surface — come away with thin film of oil. Hand-lapped craft. Engineer's instinct.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p9p2brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p9p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p9p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p9p2amberWash" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p2oilSheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p9p2glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="238" height="422" fill="url(#p9p2bg)"/>
  <rect width="238" height="422" fill="url(#p9p2amberWash)"/>

  <!-- ===== ENORMOUS GEAR TOOTH dominating right side (the size of a door) ===== -->
  <g>
    <!-- Tooth body -->
    <path d="M138,0 L160,0 L240,40 L240,380 L160,420 L138,420 Z" fill="url(#p9p2brass)"/>
    <!-- Tooth edge profile (precise, smooth machining) -->
    <path d="M138,0 L160,0 L240,40" fill="none" stroke="#7a4818" stroke-width="0.85"/>
    <path d="M138,420 L160,420 L240,380" fill="none" stroke="#7a4818" stroke-width="0.85"/>
    <line x1="240" y1="40" x2="240" y2="380" stroke="#7a4818" stroke-width="0.7"/>
    <line x1="160" y1="0" x2="160" y2="420" stroke="#7a4818" stroke-width="0.55" opacity="0.55"/>
    <!-- Subtle hand-lapped texture lines (script demand: hand-lapped, hand-finished) -->
    <g stroke="#7a4818" stroke-width="0.4" opacity="0.55" fill="none">
      <path d="M170,40 L235,80"/>
      <path d="M170,80 L235,120"/>
      <path d="M170,120 L235,160"/>
      <path d="M170,160 L235,200"/>
      <path d="M170,200 L235,240"/>
      <path d="M170,240 L235,280"/>
      <path d="M170,280 L235,320"/>
      <path d="M170,320 L235,360"/>
    </g>
    <!-- Polished brass GLEAM streaks -->
    <ellipse cx="200" cy="180" rx="14" ry="120" fill="url(#p9p2oilSheen)" filter="url(#p9p2glow)" opacity="0.85"/>
    <ellipse cx="195" cy="120" rx="6" ry="60" fill="#fff8e8" filter="url(#p9p2bloom)" opacity="0.65"/>
    <!-- OIL FILM — visible thin sheen on surface -->
    <ellipse cx="180" cy="220" rx="40" ry="14" fill="#fff8e8" opacity="0.45" filter="url(#p9p2bloom)"/>
    <ellipse cx="180" cy="220" rx="22" ry="8" fill="#fff8e8" opacity="0.65" filter="url(#p9p2bloom)"/>
  </g>

  <!-- ===== WREN'S HAND extending from left toward tooth ===== -->
  <g transform="translate(60 220)">
    <!-- Forearm visible at edge of frame -->
    <rect x="-60" y="-22" width="60" height="40" fill="url(#p9p2suit)"/>
    <line x1="-60" y1="0" x2="0" y2="0" stroke="#ffd078" stroke-width="0.7" opacity="0.85" filter="url(#p9p2bloom)"/>
    <!-- Oil stain on forearm -->
    <ellipse cx="-40" cy="-8" rx="9" ry="4" fill="#1a0c04" opacity="0.55"/>

    <!-- Wrist + cuff -->
    <ellipse cx="0" cy="0" rx="14" ry="22" fill="url(#p9p2suit)"/>
    <line x1="-9" y1="-18" x2="14" y2="-18" stroke="#7a4818" stroke-width="0.85" opacity="0.85"/>

    <!-- HAND — fingers EXTENDED toward gear tooth -->
    <ellipse cx="14" cy="0" rx="22" ry="14" fill="url(#p9p2skin)"/>
    <!-- Index finger — leading, touches tooth -->
    <ellipse cx="38" cy="-4" rx="20" ry="5" fill="url(#p9p2skin)"/>
    <ellipse cx="56" cy="-6" rx="14" ry="4" fill="url(#p9p2skin)"/>
    <ellipse cx="68" cy="-7" rx="9" ry="3" fill="url(#p9p2skin)"/>
    <ellipse cx="76" cy="-7" rx="4" ry="2.4" fill="url(#p9p2skin)"/>
    <!-- Other fingers slightly curled -->
    <ellipse cx="34" cy="6" rx="14" ry="4" fill="url(#p9p2skin)"/>
    <ellipse cx="44" cy="9" rx="9" ry="3" fill="url(#p9p2skin)"/>
    <ellipse cx="32" cy="14" rx="11" ry="4" fill="url(#p9p2skin)"/>
    <ellipse cx="40" cy="17" rx="6" ry="2.4" fill="url(#p9p2skin)"/>
    <ellipse cx="28" cy="-12" rx="11" ry="3.4" fill="url(#p9p2skin)"/>
    <!-- Thumb tucked -->
    <ellipse cx="6" cy="14" rx="9" ry="4" fill="url(#p9p2skin)"/>

    <!-- OIL FILM transferring to fingertip — subtle shine -->
    <ellipse cx="76" cy="-7" rx="3" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p9p2bloom)"/>
    <!-- Oil sheen smear leading from gear -->
    <path d="M80,-7 Q90,-6 100,-4" stroke="#fff8e8" stroke-width="0.55" opacity="0.55" filter="url(#p9p2bloom)" fill="none"/>

    <!-- Small ink/oil stain on palm from previous work -->
    <circle cx="20" cy="6" r="1.6" fill="#1a0c04" opacity="0.45"/>
    <circle cx="14" cy="-2" r="1" fill="#1a0c04" opacity="0.45"/>
  </g>

  <!-- WREN dialogue (top, barely audible) -->
  <g>
    <rect x="14" y="14" width="210" height="44" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN (barely audible)</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410" font-style="italic">Hand-lapped. Even the tooth profiles —</text>
  <text x="22" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410" font-style="italic">finished by hand.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,360 Q60,358 120,362 Q180,364 238,360"/>
  </g>
</svg>
