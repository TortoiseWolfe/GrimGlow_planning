<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 422" width="742" height="422">
  <title>Issue 5 — Page 3 — Panel 4: Threshold view through wall gap — Sable silhouette + Victorian world beyond — Last light. Four blocks. One gear.</title>
  <desc>28mm wide, framed through wall gap. Sable silhouetted at gap edge looking out. Victorian afternoon: courtyard, terraced building backs, chimney pots, distant church spire, grey sky. Cobweb upper corner, crumbled mortar.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p3p4interior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p3p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p3p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8b0b8"/>
      <stop offset="100%" stop-color="#c8b888"/>
    </linearGradient>
    <linearGradient id="p3p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <radialGradient id="p3p4dayWash" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a8b0b8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6a7080" stop-opacity="0"/>
    </radialGradient>
    <filter id="p3p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p3p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- DARK CAMP INTERIOR fills frame (we are inside looking out) -->
  <rect width="742" height="422" fill="url(#p3p4interior)"/>

  <!-- BRICK WALL frame around the gap -->
  <rect x="0" y="0" width="742" height="422" fill="url(#p3p4brick)"/>
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.65">
    <path d="M0,60 Q120,62 240,58 Q380,56 500,60 Q620,62 742,58"/>
    <path d="M0,120 Q120,118 240,122 Q380,124 500,120 Q620,118 742,122"/>
    <path d="M0,180 Q120,182 240,178 Q380,176 500,182 Q620,184 742,180"/>
    <path d="M0,240 Q120,238 240,242 Q380,244 500,240 Q620,238 742,242"/>
    <path d="M0,300 Q120,302 240,298 Q380,296 500,302 Q620,304 742,300"/>
    <path d="M0,360 Q120,358 240,362 Q380,364 500,360 Q620,358 742,362"/>
  </g>
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.55">
    <line x1="80" y1="0" x2="80" y2="60"/>
    <line x1="160" y1="60" x2="160" y2="120"/>
    <line x1="640" y1="60" x2="640" y2="120"/>
    <line x1="60" y1="180" x2="60" y2="240"/>
    <line x1="700" y1="240" x2="700" y2="300"/>
    <line x1="120" y1="300" x2="120" y2="360"/>
  </g>

  <!-- ===== WALL GAP (narrow vertical slit, wide enough to frame Sable) — center ===== -->
  <rect x="220" y="60" width="302" height="320" fill="#0a0604"/>

  <!-- ===== VICTORIAN WORLD beyond gap ===== -->
  <!-- Sky at top -->
  <rect x="226" y="66" width="290" height="120" fill="url(#p3p4sky)"/>
  <!-- Distant chimney smoke -->
  <g opacity="0.55" fill="#5a4838">
    <ellipse cx="260" cy="96" rx="20" ry="6"/>
    <ellipse cx="280" cy="84" rx="18" ry="5"/>
    <ellipse cx="430" cy="96" rx="22" ry="6"/>
    <ellipse cx="450" cy="80" rx="20" ry="5.4"/>
    <ellipse cx="470" cy="70" rx="18" ry="4.4"/>
  </g>

  <!-- DISTANT BUILDING BACKS — terraced -->
  <rect x="226" y="120" width="290" height="80" fill="#3a2818"/>
  <g fill="#0a0408">
    <rect x="240" y="120" width="14" height="32"/>
    <rect x="270" y="120" width="14" height="32"/>
    <rect x="300" y="120" width="14" height="32"/>
    <rect x="350" y="120" width="14" height="32"/>
    <rect x="380" y="120" width="14" height="32"/>
    <rect x="410" y="120" width="14" height="32"/>
    <rect x="440" y="120" width="14" height="32"/>
    <rect x="480" y="120" width="14" height="32"/>
  </g>
  <!-- Slate roofs -->
  <g stroke="#0a0604" stroke-width="0.4" opacity="0.55">
    <line x1="226" y1="115" x2="516" y2="115"/>
    <line x1="240" y1="120" x2="240" y2="115"/>
    <line x1="316" y1="120" x2="316" y2="115"/>
    <line x1="396" y1="120" x2="396" y2="115"/>
    <line x1="476" y1="120" x2="476" y2="115"/>
  </g>
  <!-- Chimney pots -->
  <g fill="#5a2818">
    <rect x="270" y="100" width="9" height="20"/>
    <rect x="320" y="100" width="9" height="20"/>
    <rect x="380" y="100" width="9" height="20"/>
    <rect x="440" y="100" width="9" height="20"/>
    <rect x="490" y="100" width="9" height="20"/>
  </g>

  <!-- DISTANT CHURCH SPIRE — tall against sky, far back -->
  <g transform="translate(420 90)">
    <path d="M-3,30 L-3,-20 L0,-50 L3,-20 L3,30 Z" fill="#3a3838"/>
    <path d="M-3,-20 L0,-50 L3,-20 Z" fill="#5a5860"/>
    <circle cx="0" cy="-2" r="2" fill="#3a3838"/>
    <circle cx="0" cy="-2" r="1.4" fill="#a8a0a0"/>
    <line x1="0" y1="-50" x2="0" y2="-58" stroke="#3a3838" stroke-width="0.7"/>
    <circle cx="0" cy="-58" r="0.85" fill="#a8a0a0"/>
  </g>

  <!-- COURTYARD wall + cobblestones below -->
  <rect x="226" y="200" width="290" height="180" fill="#3a2818"/>
  <rect x="226" y="280" width="290" height="100" fill="url(#p3p4cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55">
    <path d="M226,300 Q380,302 516,298"/>
    <path d="M226,330 Q380,328 516,332"/>
    <path d="M226,360 Q380,362 516,358"/>
  </g>
  <g fill="#1a0c04" opacity="0.55">
    <circle cx="280" cy="290" r="1"/>
    <circle cx="380" cy="295" r="1"/>
    <circle cx="480" cy="290" r="1"/>
    <circle cx="320" cy="320" r="1"/>
    <circle cx="430" cy="325" r="1"/>
    <circle cx="500" cy="320" r="1"/>
    <circle cx="260" cy="350" r="1"/>
    <circle cx="350" cy="355" r="1"/>
    <circle cx="450" cy="350" r="1"/>
  </g>
  <!-- Wall divider -->
  <line x1="226" y1="280" x2="516" y2="280" stroke="#1a0c04" stroke-width="0.7" opacity="0.65"/>

  <!-- Day wash filling the gap -->
  <rect x="226" y="66" width="290" height="320" fill="url(#p3p4dayWash)"/>

  <!-- Crumbled mortar around gap edges -->
  <g fill="#1a0c04">
    <ellipse cx="222" cy="80" rx="3" ry="2.4"/>
    <ellipse cx="222" cy="160" rx="2.4" ry="3"/>
    <ellipse cx="222" cy="240" rx="3" ry="2"/>
    <ellipse cx="222" cy="320" rx="2.4" ry="2.6"/>
    <ellipse cx="522" cy="100" rx="2.6" ry="2.4"/>
    <ellipse cx="522" cy="200" rx="3" ry="2.4"/>
    <ellipse cx="522" cy="280" rx="2.4" ry="3"/>
    <ellipse cx="522" cy="340" rx="3" ry="2"/>
  </g>
  <!-- Cobweb upper corner -->
  <g stroke="#a89888" stroke-width="0.4" fill="none" opacity="0.5">
    <path d="M226,80 Q256,84 286,78"/>
    <path d="M226,80 Q240,100 250,90"/>
    <path d="M226,80 L286,78"/>
    <path d="M226,80 L260,96"/>
    <path d="M250,90 L286,78"/>
  </g>

  <!-- ===== SABLE SILHOUETTED at gap edge ===== -->
  <g transform="translate(280 290)">
    <!-- Boots -->
    <ellipse cx="-7" cy="74" rx="9" ry="3.4" fill="#0a0408"/>
    <ellipse cx="7" cy="74" rx="9" ry="3.4" fill="#0a0408"/>
    <!-- Trousers -->
    <rect x="-13" y="20" width="11" height="54" fill="#1a0c04"/>
    <rect x="2" y="20" width="11" height="54" fill="#1a0c04"/>
    <!-- Body silhouette -->
    <path d="M-22,20 L-22,-50 L22,-50 L22,20 Z" fill="#1a0c04"/>
    <!-- Backlit edge along right side -->
    <line x1="22" y1="-50" x2="22" y2="20" stroke="#a8b0b8" stroke-width="1.4" opacity="0.55" filter="url(#p3p4bloom)"/>
    <line x1="-22" y1="-50" x2="-22" y2="20" stroke="#a8b0b8" stroke-width="0.85" opacity="0.4" filter="url(#p3p4bloom)"/>
    <!-- Shoulders -->
    <path d="M-22,-50 Q-18,-66 -2,-72 Q14,-72 22,-62 L22,-50 Z" fill="#1a0c04"/>
    <!-- Backlight on shoulders -->
    <path d="M-18,-66 Q-2,-72 14,-72" stroke="#a8b0b8" stroke-width="0.7" fill="none" opacity="0.45" filter="url(#p3p4bloom)"/>
    <!-- Head silhouette -->
    <ellipse cx="0" cy="-86" rx="14" ry="18" fill="#1a0c04"/>
    <!-- Silver-buzz catches edge light -->
    <path d="M-12,-100 Q-9,-104 0,-104 Q9,-104 12,-100" stroke="#fff8e8" stroke-width="0.85" fill="none" opacity="0.55" filter="url(#p3p4bloom)"/>
    <path d="M-12,-100 Q-9,-103 0,-103 Q9,-103 12,-100" stroke="#dad5d0" stroke-width="0.55" fill="none" opacity="0.7" filter="url(#p3p4bloom)"/>
    <!-- Faint suit accent -->
    <line x1="-14" y1="-30" x2="14" y2="-30" stroke="#5a606a" stroke-width="0.4" opacity="0.45"/>

    <!-- Arms at sides, hand on hip -->
    <rect x="-30" y="-50" width="8" height="60" fill="#1a0c04"/>
    <path d="M22,-50 L34,-30 L26,-10 L20,-12 L18,-20 L20,-40 Z" fill="#1a0c04"/>
  </g>

  <!-- CAPTION top-left — Last light. Four blocks. One gear. -->
  <g>
    <rect x="14" y="14" width="278" height="38" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">CAPTION</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#5a4a30" font-style="italic" font-weight="500">Last light. Four blocks. One gear.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,360 Q200,362 400,358 Q580,356 742,360"/>
  </g>
</svg>
