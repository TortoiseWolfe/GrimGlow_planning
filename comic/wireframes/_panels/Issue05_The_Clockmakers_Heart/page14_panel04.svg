<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 14 — Panel 4: Theodore approaches shop, Jink on his shoulder — H. NAYLOR storefront — terrible liar's stage</title>
  <desc>28mm wide. Theodore walks toward H. NAYLOR CLOCKMAKER & HOROLOGIST shop front. Manufactured casualness — shoulders too stiff, stride too long, face performs relaxation badly. On right shoulder: Jink hidden behind turned-up collar, flash of emerald and golden curls. Bow window with finished clocks. Brass gear ring catches gaslight on left index. Dialog: JINK from collar: Remember. You're interested in apprenticeships. You've always loved clocks. / THEODORE: I have always loved clocks. That bit's actually true. / JINK: Even better. Lead with that.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p14p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p14p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p14p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p14p4timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <linearGradient id="p14p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p14p4waistcoat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p14p4shopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p14p4gasLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p14p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p14p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- SKY -->
  <rect width="742" height="120" fill="url(#p14p4sky)"/>

  <!-- BUILDING FACADES — far background -->
  <rect x="0" y="40" width="280" height="240" fill="#1a0c04" opacity="0.85"/>
  <rect x="540" y="60" width="202" height="220" fill="#1a0c04" opacity="0.85"/>
  <!-- Distant lit windows -->
  <rect x="40" y="100" width="14" height="20" fill="#ffd078" opacity="0.45" filter="url(#p14p4bloom)"/>
  <rect x="100" y="140" width="14" height="20" fill="#ffd078" opacity="0.35" filter="url(#p14p4bloom)"/>
  <rect x="600" y="120" width="14" height="20" fill="#ffd078" opacity="0.45" filter="url(#p14p4bloom)"/>

  <!-- COBBLESTONE STREET -->
  <rect y="280" width="742" height="84" fill="url(#p14p4cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.65">
    <path d="M0,290 Q60,288 120,292 Q180,294 240,290 Q300,286 360,292 Q420,294 480,288 Q540,290 600,292 Q660,288 742,290"/>
    <path d="M0,310 Q60,308 120,312 Q180,314 240,310 Q300,306 360,312 Q420,314 480,308 Q540,310 600,312 Q660,308 742,310"/>
    <path d="M0,330 Q60,328 120,332 Q180,334 240,330 Q300,326 360,332 Q420,334 480,328 Q540,330 600,332 Q660,328 742,330"/>
    <path d="M0,350 Q60,348 120,352 Q180,354 240,350 Q300,346 360,352 Q420,354 480,348 Q540,350 600,352 Q660,348 742,350"/>
  </g>

  <!-- ===== H. NAYLOR SHOP FRONT — center-right ===== -->
  <g transform="translate(440 0)">
    <!-- Stock brick facade -->
    <rect x="0" y="60" width="200" height="220" fill="url(#p14p4brick)"/>
    <!-- Brick texture lines -->
    <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
      <line x1="0" y1="80" x2="200" y2="80"/>
      <line x1="0" y1="100" x2="200" y2="100"/>
      <line x1="0" y1="120" x2="200" y2="120"/>
      <line x1="0" y1="140" x2="200" y2="140"/>
      <line x1="0" y1="160" x2="200" y2="160"/>
      <line x1="0" y1="180" x2="200" y2="180"/>
      <line x1="0" y1="200" x2="200" y2="200"/>
    </g>

    <!-- Dark green TIMBER SURROUND -->
    <rect x="-4" y="120" width="208" height="160" fill="url(#p14p4timber)"/>
    <rect x="0" y="124" width="200" height="156" fill="#3a2010"/>

    <!-- Warm shop interior glow filling window -->
    <rect x="14" y="138" width="172" height="120" fill="url(#p14p4shopGlow)" filter="url(#p14p4glow)"/>
    <rect x="14" y="138" width="172" height="120" fill="#ffd078" opacity="0.65"/>

    <!-- BOW WINDOW — curved plate glass with finished clocks displayed -->
    <path d="M14,138 Q100,128 186,138 L186,256 L14,256 Z" fill="#fff8e8" opacity="0.85" filter="url(#p14p4bloom)"/>
    <path d="M14,138 Q100,128 186,138" stroke="url(#p14p4timber)" stroke-width="3" fill="none"/>
    <!-- Window mullions -->
    <line x1="100" y1="130" x2="100" y2="256" stroke="#1a3818" stroke-width="1"/>
    <line x1="60" y1="134" x2="60" y2="256" stroke="#1a3818" stroke-width="0.85"/>
    <line x1="140" y1="134" x2="140" y2="256" stroke="#1a3818" stroke-width="0.85"/>
    <line x1="14" y1="200" x2="186" y2="200" stroke="#1a3818" stroke-width="0.85"/>

    <!-- Clocks on display in window -->
    <g>
      <circle cx="40" cy="170" r="14" fill="#3a2010" stroke="#a86838" stroke-width="0.85"/>
      <circle cx="40" cy="170" r="10" fill="#fff8e8" opacity="0.85"/>
      <line x1="40" y1="170" x2="40" y2="162" stroke="#1a0c04" stroke-width="0.85"/>
      <line x1="40" y1="170" x2="46" y2="170" stroke="#1a0c04" stroke-width="0.55"/>
      <circle cx="80" cy="172" r="11" fill="#3a2010" stroke="#a86838" stroke-width="0.7"/>
      <circle cx="80" cy="172" r="8" fill="#fff8e8" opacity="0.85"/>
      <circle cx="120" cy="170" r="14" fill="#3a2010" stroke="#a86838" stroke-width="0.85"/>
      <circle cx="120" cy="170" r="10" fill="#fff8e8" opacity="0.85"/>
      <circle cx="160" cy="172" r="11" fill="#3a2010" stroke="#a86838" stroke-width="0.7"/>
      <circle cx="160" cy="172" r="8" fill="#fff8e8" opacity="0.85"/>
      <!-- Mantel clock at bottom -->
      <rect x="40" y="220" width="40" height="30" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
      <circle cx="60" cy="232" r="8" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
      <rect x="120" y="220" width="36" height="30" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
      <circle cx="138" cy="232" r="8" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    </g>

    <!-- GOLD-LEAF LETTERING on glass — H. NAYLOR --- CLOCKMAKER &amp; HOROLOGIST -->
    <text x="100" y="148" font-family="serif" font-size="11" fill="#ffd078" font-weight="700" text-anchor="middle" filter="url(#p14p4bloom)" opacity="0.95">H. NAYLOR</text>
    <text x="100" y="160" font-family="serif" font-size="7" fill="#ffd078" font-weight="600" text-anchor="middle" filter="url(#p14p4bloom)" opacity="0.85">CLOCKMAKER &amp; HOROLOGIST</text>

    <!-- DOOR (right side of shop) -->
    <rect x="190" y="170" width="40" height="110" fill="url(#p14p4timber)"/>
    <rect x="194" y="174" width="32" height="50" fill="#3a2010"/>
    <ellipse cx="210" cy="200" rx="14" ry="22" fill="#ffd078" opacity="0.55" filter="url(#p14p4glow)"/>

    <!-- GAS LAMP BRACKET beside door -->
    <g transform="translate(240 100)">
      <rect x="-3" y="0" width="6" height="20" fill="#5a3018"/>
      <rect x="-7" y="20" width="14" height="22" fill="#3a1808"/>
      <ellipse cx="0" cy="20" rx="20" ry="18" fill="url(#p14p4gasLamp)" filter="url(#p14p4glow)"/>
      <ellipse cx="0" cy="22" rx="6" ry="9" fill="#fff8e8" filter="url(#p14p4bloom)"/>
    </g>
  </g>

  <!-- ===== THEODORE — walking, mid-frame, manufactured casualness ===== -->
  <g transform="translate(280 200)">
    <!-- Body (slightly stiff, walking pose) -->
    <path d="M-22,40 L-26,120 L-12,120 L-10,40 L10,40 L12,120 L26,120 L22,40 Z" fill="#5a3818"/>
    <!-- Patched wool trousers -->
    <line x1="-20" y1="80" x2="20" y2="80" stroke="#3a2010" stroke-width="0.85"/>
    <ellipse cx="-12" cy="100" rx="6" ry="3" fill="#3a2010" opacity="0.85"/>
    <!-- Worn leather waistcoat with COLLAR TURNED UP -->
    <path d="M-22,40 L-30,-10 L-28,40 Z" fill="url(#p14p4waistcoat)"/>
    <path d="M22,40 L30,-10 L28,40 Z" fill="url(#p14p4waistcoat)"/>
    <path d="M-22,40 L-22,30 L-3,30 L-3,40 Z" fill="#3a2818"/>
    <path d="M22,40 L22,30 L3,30 L3,40 Z" fill="#3a2818"/>
    <!-- Collarless linen shirt -->
    <ellipse cx="0" cy="32" rx="14" ry="6" fill="#d8c8a8"/>

    <!-- Arms (slightly stiff) -->
    <line x1="-22" y1="40" x2="-30" y2="100" stroke="url(#p14p4skin)" stroke-width="11" stroke-linecap="round"/>
    <line x1="22" y1="40" x2="30" y2="100" stroke="url(#p14p4skin)" stroke-width="11" stroke-linecap="round"/>
    <!-- LEFT HAND (visible at waist, brass gear ring catches gaslight) -->
    <ellipse cx="-30" cy="100" rx="8" ry="6" fill="url(#p14p4skin)"/>
    <!-- Oil-stained -->
    <circle cx="-30" cy="100" r="2" fill="#1a0c04" opacity="0.55"/>
    <!-- BRASS GEAR RING on left index -->
    <circle cx="-32" cy="106" r="2" fill="#ffd078" stroke="#7a4818" stroke-width="0.4" filter="url(#p14p4bloom)"/>
    <!-- Right hand -->
    <ellipse cx="30" cy="100" rx="8" ry="6" fill="url(#p14p4skin)"/>
    <circle cx="30" cy="100" r="1.4" fill="#1a0c04" opacity="0.55"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="0" rx="20" ry="26" fill="url(#p14p4skin)"/>
    <!-- Sandy-brown hair -->
    <path d="M-18,-22 Q-12,-30 0,-32 Q12,-30 18,-22 L16,-12 Q8,-26 0,-26 Q-8,-26 -16,-12 Z" fill="#a87838"/>
    <!-- Freckles -->
    <g fill="#7a4818" opacity="0.65">
      <circle cx="-9" cy="2" r="0.55"/>
      <circle cx="-3" cy="0" r="0.55"/>
      <circle cx="3" cy="3" r="0.55"/>
      <circle cx="9" cy="0" r="0.55"/>
      <circle cx="-7" cy="-3" r="0.4"/>
      <circle cx="0" cy="6" r="0.55"/>
    </g>
    <!-- Hazel eyes — face performing relaxation BADLY (slightly wide, alert) -->
    <ellipse cx="-7" cy="-4" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="-7" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="-7" cy="-3.5" r="0.55" fill="#0a0604"/>
    <ellipse cx="7" cy="-4" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="7" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="7" cy="-3.5" r="0.55" fill="#0a0604"/>
    <!-- Brows raised slightly (poor acting) -->
    <path d="M-12,-10 L-3,-12" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M3,-12 L12,-10" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — fake-relaxed, lips compressed -->
    <path d="M-5,10 L5,10" stroke="#3a1808" stroke-width="0.85" stroke-linecap="round"/>

    <!-- COLLAR TURNED UP — Jink hidden behind it -->
    <path d="M14,16 L20,4 L22,16 Z" fill="#3a2818"/>
    <path d="M-14,16 L-20,4 L-22,16 Z" fill="#3a2818"/>

    <!-- JINK on right shoulder — barely visible, tiny figure crouching -->
    <g transform="translate(20 12)">
      <!-- Tiny body crouched -->
      <ellipse cx="0" cy="0" rx="3" ry="2.4" fill="#2ed078"/>
      <!-- GOLDEN CURLS visible peeking over collar -->
      <ellipse cx="0" cy="-3" rx="2.4" ry="2" fill="#f8d068"/>
      <ellipse cx="-2" cy="-4" rx="1" ry="0.85" fill="#f8d068"/>
      <ellipse cx="2" cy="-4" rx="1" ry="0.85" fill="#f8d068"/>
      <!-- Tiny eye -->
      <circle cx="-1" cy="-2" r="0.4" fill="#0a0604"/>
      <!-- Faint emerald seam-glow -->
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#3ad0a8" opacity="0.45" filter="url(#p14p4bloom)"/>
    </g>
  </g>

  <!-- DIALOG JINK from collar -->
  <g transform="translate(140 70)">
    <ellipse cx="0" cy="0" rx="100" ry="36" fill="#ffffff" stroke="#2ed078" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M40,30 L66,50 L48,32 Z" fill="#ffffff" stroke="#2ed078" stroke-width="1"/>
    <text x="-90" y="-18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK</text>
    <text x="-90" y="-3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"Remember. You're interested</text>
    <text x="-90" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">in apprenticeships. You've</text>
    <text x="-90" y="25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">always loved clocks."</text>
  </g>

  <!-- DIALOG THEODORE -->
  <g transform="translate(420 80)">
    <ellipse cx="0" cy="0" rx="120" ry="24" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-50,20 L-66,38 L-44,22 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-110" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-110" y="6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"I have always loved clocks.</text>
    <text x="-110" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">That bit's actually true."</text>
  </g>

  <!-- DIALOG JINK reply -->
  <g transform="translate(640 280)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#2ed078" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-30,-18 L-44,-32 L-26,-20 Z" fill="#ffffff" stroke="#2ed078" stroke-width="1"/>
    <text x="-70" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK</text>
    <text x="-70" y="8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"Even better. Lead with that."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,310 Q180,308 360,312 Q540,314 742,310"/>
  </g>
</svg>
