<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 471" width="742" height="471">
  <title>Issue 5 — Page 16 — Panel 1: Theodore + clockmaker bond over mechanism — two craftsmen across a generation</title>
  <desc>50mm. Clockmaker has fully engaged. Showing Theodore the regulator mechanism, pointing with screwdriver. Theodore rapt, oil-stained hands braced on bench, face close. Clockmaker's eyebrows rise — a good question. Both absorbed in the work. Neither remembers why this conversation started. Dialog: CLOCKMAKER: The standard Graham profile loses energy at the impulse face. I reshaped the tooth to extend contact by— / THEODORE: —by a half-degree? To keep the arc constant? / CLOCKMAKER pause surprised: ...Just so. Where did you learn that? / THEODORE: I— I take things apart, sir. To see how they think. / CLOCKMAKER beat then almost a smile: To see how they think. Yes.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p16p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p16p1bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p16p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p16p1waistcoatT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p16p1waistcoatC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="50%" stop-color="#7a5828"/>
      <stop offset="100%" stop-color="#4a3818"/>
    </linearGradient>
    <linearGradient id="p16p1brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p16p1clockCase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a0c04"/>
    </linearGradient>
    <radialGradient id="p16p1lampGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p16p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p16p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="471" fill="url(#p16p1bg)"/>

  <!-- Soft dark walls receding into amber dimness -->
  <rect width="742" height="380" fill="#3a2010" opacity="0.55"/>

  <!-- Lamp glow pool centered on bench -->
  <ellipse cx="371" cy="280" rx="380" ry="200" fill="url(#p16p1lampGlow)" filter="url(#p16p1glow)"/>

  <!-- WORKBENCH -->
  <rect x="0" y="350" width="742" height="121" fill="url(#p16p1bench)"/>
  <line x1="0" y1="350" x2="742" y2="350" stroke="#a86838" stroke-width="0.85" opacity="0.85" filter="url(#p16p1bloom)"/>
  <line x1="0" y1="380" x2="742" y2="380" stroke="#1a0c04" stroke-width="0.55"/>

  <!-- ===== OPEN CLOCK MECHANISM center of bench ===== -->
  <g transform="translate(371 320)">
    <!-- Clock case (mahogany) -->
    <rect x="-100" y="-60" width="200" height="80" fill="url(#p16p1clockCase)"/>
    <rect x="-96" y="-56" width="192" height="72" fill="none" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Dial face on top -->
    <circle cx="0" cy="-44" r="22" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.55"/>
    <line x1="0" y1="-44" x2="0" y2="-58" stroke="#1a0c04" stroke-width="1.4"/>
    <line x1="0" y1="-44" x2="14" y2="-44" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Roman numeral hints -->
    <text x="0" y="-58" font-family="serif" font-size="5" fill="#1a0c04" text-anchor="middle">XII</text>
    <text x="14" y="-44" font-family="serif" font-size="5" fill="#1a0c04">III</text>
    <text x="0" y="-30" font-family="serif" font-size="5" fill="#1a0c04" text-anchor="middle">VI</text>
    <text x="-14" y="-44" font-family="serif" font-size="5" fill="#1a0c04">IX</text>

    <!-- Open mechanism interior (top opens upward) -->
    <rect x="-80" y="-50" width="160" height="60" fill="#0a0408"/>
    <!-- Brass gears glimpsed -->
    <circle cx="-44" cy="-22" r="14" fill="url(#p16p1brass)"/>
    <circle cx="-44" cy="-22" r="11" fill="#7a4818" opacity="0.65"/>
    <circle cx="-44" cy="-22" r="3" fill="#1a0c04"/>
    <g stroke="#5a3018" stroke-width="0.55" opacity="0.85">
      <line x1="-44" y1="-36" x2="-44" y2="-8"/>
      <line x1="-58" y1="-22" x2="-30" y2="-22"/>
    </g>
    <circle cx="0" cy="-22" r="18" fill="url(#p16p1brass)"/>
    <circle cx="0" cy="-22" r="14" fill="#7a4818" opacity="0.65"/>
    <circle cx="0" cy="-22" r="4" fill="#1a0c04"/>
    <g stroke="#5a3018" stroke-width="0.55" opacity="0.85">
      <line x1="0" y1="-40" x2="0" y2="-4"/>
      <line x1="-18" y1="-22" x2="18" y2="-22"/>
    </g>
    <circle cx="44" cy="-22" r="14" fill="url(#p16p1brass)"/>
    <circle cx="44" cy="-22" r="11" fill="#7a4818" opacity="0.65"/>
    <circle cx="44" cy="-22" r="3" fill="#1a0c04"/>
    <!-- Pendulum suspension visible -->
    <line x1="60" y1="-30" x2="60" y2="6" stroke="#a86838" stroke-width="1.4"/>
    <ellipse cx="60" cy="6" rx="7" ry="3" fill="url(#p16p1brass)"/>
    <!-- Tiny dim copper hint inside (Wren's holo, suppressed during conversation) -->
    <circle cx="22" cy="-30" r="0.85" fill="#ffaa48" opacity="0.55" filter="url(#p16p1bloom)"/>
    <!-- Mechanism brass glow -->
    <ellipse cx="0" cy="-22" rx="80" ry="20" fill="#ffd078" opacity="0.45" filter="url(#p16p1bloom)"/>
  </g>

  <!-- OIL LAMP behind clock -->
  <g transform="translate(560 290)">
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="url(#p16p1lampGlow)" filter="url(#p16p1glow)"/>
    <rect x="-7" y="14" width="14" height="14" fill="#5a3018"/>
    <path d="M-6,14 L-4,-6 L-3,-18 L3,-18 L4,-6 L6,14 Z" fill="#ffd078" opacity="0.75"/>
    <ellipse cx="0" cy="-2" rx="2.4" ry="6" fill="#fff8e8" filter="url(#p16p1bloom)"/>
  </g>

  <!-- ===== THEODORE — left side, leaning in over bench ===== -->
  <g transform="translate(180 200)">
    <!-- Body leaning forward -->
    <path d="M-28,40 L-36,140 L36,140 L28,40 Z" fill="#5a3818"/>
    <!-- Worn leather waistcoat -->
    <path d="M-28,40 L-36,-10 L-32,40 Z" fill="url(#p16p1waistcoatT)"/>
    <path d="M28,40 L36,-10 L32,40 Z" fill="url(#p16p1waistcoatT)"/>
    <ellipse cx="0" cy="32" rx="14" ry="6" fill="#d8c8a8"/>
    <!-- Collar UP -->
    <path d="M14,16 L20,4 L22,16 Z" fill="#3a2818"/>
    <path d="M-14,16 L-20,4 L-22,16 Z" fill="#3a2818"/>

    <!-- Arms BRACED on bench edge — both forearms extended forward -->
    <line x1="-28" y1="40" x2="60" y2="120" stroke="url(#p16p1skin)" stroke-width="13" stroke-linecap="round"/>
    <line x1="28" y1="40" x2="100" y2="110" stroke="url(#p16p1skin)" stroke-width="13" stroke-linecap="round"/>
    <!-- Hands braced on bench -->
    <ellipse cx="60" cy="120" rx="11" ry="7" fill="url(#p16p1skin)"/>
    <ellipse cx="100" cy="110" rx="11" ry="7" fill="url(#p16p1skin)"/>
    <!-- Oil stains -->
    <circle cx="56" cy="118" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="64" cy="124" r="1" fill="#1a0c04" opacity="0.55"/>
    <circle cx="98" cy="108" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="104" cy="114" r="1" fill="#1a0c04" opacity="0.55"/>
    <!-- BRASS GEAR RING on left index -->
    <circle cx="56" cy="124" r="2" fill="#ffd078" stroke="#7a4818" stroke-width="0.4" filter="url(#p16p1bloom)"/>

    <!-- HEAD leaning forward, eyes on mechanism -->
    <ellipse cx="20" cy="0" rx="20" ry="24" fill="url(#p16p1skin)"/>
    <!-- Sandy-brown hair -->
    <path d="M0,-22 Q6,-30 20,-32 Q34,-30 40,-22 L38,-12 Q30,-26 20,-26 Q10,-26 2,-12 Z" fill="#a87838"/>
    <!-- Freckles -->
    <g fill="#7a4818" opacity="0.65">
      <circle cx="11" cy="0" r="0.55"/>
      <circle cx="20" cy="-2" r="0.55"/>
      <circle cx="28" cy="3" r="0.55"/>
      <circle cx="14" cy="6" r="0.4"/>
    </g>
    <!-- Hazel eyes — wide, focused on mechanism -->
    <ellipse cx="11" cy="-4" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="11" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="12" cy="-3.5" r="0.55" fill="#0a0604"/>
    <ellipse cx="25" cy="-4" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="25" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="26" cy="-3.5" r="0.55" fill="#0a0604"/>
    <!-- Brows raised in engagement -->
    <path d="M6,-12 L13,-13" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M19,-13 L30,-12" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — slightly open, asking -->
    <ellipse cx="20" cy="10" rx="3" ry="2" fill="#3a1808"/>
    <!-- Slight delighted curve -->
    <path d="M16,11 Q20,13 24,11" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>
  </g>

  <!-- ===== CLOCKMAKER — right side, gesturing with screwdriver ===== -->
  <g transform="translate(580 200)">
    <!-- Stool -->
    <rect x="-22" y="100" width="44" height="40" fill="#3a1808"/>

    <!-- Body half-turned toward Theodore (left) -->
    <path d="M-30,40 L-44,120 L44,120 L30,40 Z" fill="url(#p16p1waistcoatC)"/>
    <!-- Linen shirt -->
    <ellipse cx="0" cy="32" rx="20" ry="9" fill="#d8c8a8"/>

    <!-- Arms — left arm gesturing with screwdriver toward mechanism, right hand resting on bench -->
    <line x1="-30" y1="40" x2="-100" y2="80" stroke="#d8a878" stroke-width="13" stroke-linecap="round"/>
    <line x1="30" y1="40" x2="50" y2="100" stroke="#d8a878" stroke-width="13" stroke-linecap="round"/>
    <!-- Left hand pointing with screwdriver (extended) -->
    <ellipse cx="-100" cy="80" rx="11" ry="7" fill="url(#p16p1skin)"/>
    <!-- Screwdriver -->
    <line x1="-104" y1="78" x2="-140" y2="60" stroke="#5a3018" stroke-width="3"/>
    <line x1="-140" y1="60" x2="-160" y2="48" stroke="#a8a8a8" stroke-width="1.4"/>
    <line x1="-140" y1="60" x2="-160" y2="48" stroke="#fff8e8" stroke-width="0.4" opacity="0.85" filter="url(#p16p1bloom)"/>
    <!-- Right hand on bench -->
    <ellipse cx="50" cy="100" rx="11" ry="7" fill="url(#p16p1skin)"/>
    <!-- Tiny calluses -->
    <line x1="-100" y1="76" x2="-96" y2="72" stroke="#5a3018" stroke-width="0.4"/>
    <line x1="48" y1="98" x2="54" y2="96" stroke="#5a3018" stroke-width="0.4"/>

    <!-- HEAD half-turned toward Theodore -->
    <ellipse cx="-12" cy="0" rx="22" ry="26" fill="url(#p16p1skin)"/>
    <!-- Thinning brown hair -->
    <path d="M-32,-22 Q-22,-32 -12,-34 Q-2,-32 8,-22 L6,-12 Q-2,-26 -12,-26 Q-22,-26 -30,-12 Z" fill="#7a5028"/>
    <!-- Spectacles -->
    <ellipse cx="-22" cy="-2" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <ellipse cx="-6" cy="-2" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <line x1="-16" y1="-2" x2="-12" y2="-2" stroke="#3a2818" stroke-width="0.4"/>
    <ellipse cx="-24" cy="-3.4" rx="2" ry="1" fill="#fff8e8" opacity="0.85" filter="url(#p16p1bloom)"/>
    <ellipse cx="-8" cy="-3.4" rx="2" ry="1" fill="#fff8e8" opacity="0.85" filter="url(#p16p1bloom)"/>
    <!-- Eyes -->
    <ellipse cx="-22" cy="-1" rx="2.4" ry="1.4" fill="#a8b8c8"/>
    <circle cx="-22" cy="-1" r="1.2" fill="#0a0c14"/>
    <ellipse cx="-6" cy="-1" rx="2.4" ry="1.4" fill="#a8b8c8"/>
    <circle cx="-6" cy="-1" r="1.2" fill="#0a0c14"/>
    <!-- Brows raised — pleased, demonstrating -->
    <path d="M-32,-12 L-18,-14" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M-12,-14 L4,-12" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — almost a smile (warming) -->
    <path d="M-20,12 Q-12,14 -4,12" stroke="#3a1808" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- DIALOG CLOCKMAKER (Graham profile) -->
  <g transform="translate(360 60)">
    <ellipse cx="0" cy="0" rx="320" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M180,18 L196,32 L186,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-310" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-310" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="500">"The standard Graham profile loses energy at the impulse face. I reshaped the tooth to extend contact by—"</text>
  </g>

  <!-- DIALOG THEODORE (half-degree) -->
  <g transform="translate(620 110)">
    <ellipse cx="0" cy="0" rx="120" ry="24" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-30,20 L-44,38 L-24,22 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-110" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-110" y="6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"—by a half-degree?</text>
    <text x="-110" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">To keep the arc constant?"</text>
  </g>

  <!-- DIALOG CLOCKMAKER (just so) -->
  <g transform="translate(120 160)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M50,18 L66,32 L54,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-90" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-90" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"...Just so. Where did</text>
  </g>

  <!-- DIALOG THEODORE (take things apart) -->
  <g transform="translate(580 350)">
    <ellipse cx="0" cy="0" rx="160" ry="36" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-50,30 L-66,46 L-44,32 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-150" y="-18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-150" y="-3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"I— I take things apart, sir.</text>
    <text x="-150" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">To see how they think."</text>
  </g>

  <!-- DIALOG CLOCKMAKER (yes) -->
  <g transform="translate(140 400)">
    <ellipse cx="0" cy="0" rx="120" ry="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M50,20 L66,38 L54,22 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-110" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-110" y="6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"To see how they think.</text>
    <text x="-110" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">Yes."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,400 Q180,402 360,398 Q540,396 742,400"/>
  </g>
</svg>
