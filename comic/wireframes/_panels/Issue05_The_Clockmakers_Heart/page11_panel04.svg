<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 5 — Page 11 — Panel 4: Theodore approaches shop — manufactured casualness, terrible actor — brave boy</title>
  <desc>35mm medium wide eye level. Theodore on Sekforde Street pavement walking toward shop. Hands in pockets, chin too high, shoulders too tight. Tuneless whistle. Shop ahead with HOROLOGY gold-leaf, gas lamp pool, clockmaker's silhouette through window. Evening gaslight.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1438"/>
      <stop offset="100%" stop-color="#3a3850"/>
    </linearGradient>
    <linearGradient id="p11p4building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p11p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p11p4darkGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <linearGradient id="p11p4theoSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p11p4lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p11p4windowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p11p4glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="494" height="80" fill="url(#p11p4sky)"/>
  <!-- Stars -->
  <g fill="#fff8e8" opacity="0.85" filter="url(#p11p4bloom)">
    <circle cx="80" cy="20" r="0.7"/>
    <circle cx="180" cy="40" r="0.85"/>
    <circle cx="320" cy="20" r="0.7"/>
    <circle cx="440" cy="44" r="0.85"/>
  </g>

  <!-- BUILDINGS along street -->
  <rect x="0" y="80" width="494" height="220" fill="url(#p11p4building)"/>
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.6">
    <line x1="0" y1="120" x2="494" y2="120"/>
    <line x1="0" y1="160" x2="494" y2="160"/>
    <line x1="0" y1="200" x2="494" y2="200"/>
    <line x1="0" y1="240" x2="494" y2="240"/>
  </g>

  <!-- ===== HOROLOGY SHOP — center-right of frame ===== -->
  <!-- Dark green timber surround + fascia -->
  <rect x="280" y="100" width="180" height="34" fill="url(#p11p4darkGreen)"/>
  <text x="370" y="125" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffd078" font-weight="700" letter-spacing="3" filter="url(#p11p4bloom)" opacity="0.95">HOROLOGY</text>
  <!-- Plate glass window -->
  <rect x="280" y="134" width="160" height="100" fill="url(#p11p4darkGreen)"/>
  <rect x="284" y="138" width="152" height="92" fill="#7a5028"/>
  <ellipse cx="360" cy="184" rx="120" ry="60" fill="url(#p11p4windowAmber)" filter="url(#p11p4glow)" opacity="0.95"/>
  <line x1="360" y1="138" x2="360" y2="230" stroke="#0a1808" stroke-width="0.85"/>
  <line x1="284" y1="184" x2="436" y2="184" stroke="#0a1808" stroke-width="0.7"/>

  <!-- Clocks suggested in display window -->
  <g opacity="0.85">
    <circle cx="310" cy="160" r="8" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="310" cy="160" r="6" fill="#fff8e8" opacity="0.85"/>
    <circle cx="410" cy="160" r="8" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="410" cy="160" r="6" fill="#fff8e8" opacity="0.85"/>
    <circle cx="320" cy="210" r="6" fill="#3a2010" stroke="#a86838" stroke-width="0.4"/>
    <circle cx="400" cy="210" r="6" fill="#3a2010" stroke="#a86838" stroke-width="0.4"/>
  </g>

  <!-- CLOCKMAKER silhouette through window (standing at grandfather clock at back) -->
  <g transform="translate(380 200)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="9" ry="14" fill="#1a0c04"/>
    <ellipse cx="0" cy="-12" rx="6" ry="6" fill="#1a0c04"/>
  </g>

  <!-- Door (left side of shop) -->
  <rect x="440" y="180" width="20" height="100" fill="url(#p11p4darkGreen)"/>
  <rect x="442" y="182" width="16" height="96" fill="#0a2008"/>

  <!-- ===== GAS LAMP beside door ===== -->
  <g transform="translate(478 210)">
    <ellipse cx="0" cy="0" rx="40" ry="40" fill="url(#p11p4lampPool)" filter="url(#p11p4glow)" opacity="0.95"/>
    <circle cx="0" cy="0" r="9" fill="#fff8e8" opacity="0.85" filter="url(#p11p4bloom)"/>
    <line x1="6" y1="2" x2="22" y2="2" stroke="#1a0c04" stroke-width="1.6"/>
    <rect x="-4" y="-5" width="8" height="7" fill="#3a2818"/>
    <circle cx="0" cy="0" r="3" fill="#fff8e8" filter="url(#p11p4bloom)"/>
    <circle cx="0" cy="0" r="1.6" fill="#ffd078"/>
  </g>

  <!-- Other (neighboring) buildings -->
  <rect x="0" y="80" width="280" height="220" fill="#2a1810"/>
  <g fill="#1a0c08">
    <rect x="40" y="120" width="40" height="40"/>
    <rect x="120" y="140" width="40" height="40"/>
    <rect x="200" y="120" width="40" height="40"/>
  </g>
  <rect x="44" y="124" width="32" height="32" fill="#1a0c04" opacity="0.85"/>
  <rect x="124" y="144" width="32" height="32" fill="#3a2828" opacity="0.65"/>
  <ellipse cx="140" cy="160" rx="22" ry="18" fill="#ffd078" opacity="0.18" filter="url(#p11p4bloom)"/>
  <rect x="204" y="124" width="32" height="32" fill="#1a0c04" opacity="0.85"/>

  <!-- COBBLESTONES with alternating pools of light -->
  <rect x="0" y="300" width="494" height="64" fill="url(#p11p4cobble)"/>
  <ellipse cx="80" cy="335" rx="80" ry="22" fill="#ffaa48" opacity="0.55" filter="url(#p11p4glow)"/>
  <ellipse cx="247" cy="335" rx="120" ry="22" fill="#1a0c04" opacity="0.55"/>
  <ellipse cx="450" cy="335" rx="120" ry="22" fill="#ffaa48" opacity="0.85" filter="url(#p11p4glow)"/>
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55">
    <path d="M0,318 Q120,316 240,320 Q360,322 494,318"/>
    <path d="M0,340 Q120,342 240,338 Q360,336 494,340"/>
    <path d="M0,358 Q120,356 240,360 Q360,362 494,358"/>
  </g>
  <!-- Lamp post at left -->
  <g fill="#fff8e8" filter="url(#p11p4bloom)">
    <circle cx="80" cy="335" r="0.85"/>
  </g>

  <!-- ===== THEODORE walking toward shop — center-left, mid-stride ===== -->
  <g transform="translate(247 280)">
    <!-- Boots -->
    <ellipse cx="-7" cy="50" rx="6" ry="3" fill="#1a0c04"/>
    <ellipse cx="7" cy="50" rx="6" ry="3" fill="#1a0c04"/>
    <ellipse cx="-6" cy="48" rx="3" ry="1" fill="#5a4838" opacity="0.7"/>
    <ellipse cx="8" cy="48" rx="3" ry="1" fill="#5a4838" opacity="0.7"/>
    <!-- Trousers — stiff stride (too straight) -->
    <rect x="-8" y="20" width="6" height="30" fill="url(#p11p4theoSuit)"/>
    <rect x="2" y="20" width="6" height="30" fill="url(#p11p4theoSuit)"/>
    <rect x="-7" y="38" width="4" height="4" fill="#7a4838" opacity="0.85" stroke="#5a3818" stroke-width="0.3"/>
    <!-- Shirt collar -->
    <rect x="-5" y="-10" width="10" height="6" fill="#d8c8a8"/>
    <!-- Waistcoat (worn leather) -->
    <path d="M-13,20 L-13,-8 L13,-8 L13,20 Z" fill="#5a2828"/>
    <line x1="0" y1="-8" x2="0" y2="18" stroke="#3a1808" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="8" r="0.7" fill="#5a3818"/>
    <circle cx="0" cy="14" r="0.7" fill="#5a3818"/>
    <!-- Shoulders TOO TIGHT (script: "shoulders too tight") -->
    <path d="M-13,-8 Q-9,-22 -2,-24 Q4,-24 9,-20 L13,-8 Z" fill="#5a2828"/>
    <!-- Arms with HANDS DEEP IN POCKETS -->
    <path d="M-13,-8 L-18,12 L-12,24 L-4,24 L-4,16 L-9,12 L-11,2 Z" fill="#5a2828"/>
    <path d="M13,-8 L18,12 L12,24 L4,24 L4,16 L9,12 L11,2 Z" fill="#5a2828"/>
    <!-- Hand bumps in pockets -->
    <ellipse cx="-7" cy="22" rx="4" ry="3" fill="url(#p11p4theoSuit)"/>
    <ellipse cx="7" cy="22" rx="4" ry="3" fill="url(#p11p4theoSuit)"/>
    <!-- Faint shard glow through pocket (still there) -->
    <ellipse cx="7" cy="24" rx="6" ry="3" fill="#88aaff" opacity="0.18" filter="url(#p11p4glow)"/>

    <!-- Head — CHIN TOO HIGH (script demand) -->
    <ellipse cx="0" cy="-32" rx="11" ry="13" fill="#a86838"/>
    <!-- Hair -->
    <path d="M-9,-44 Q-7,-49 0,-50 Q9,-49 9,-44 L9,-38 Q4,-44 0,-44 Q-4,-44 -9,-38 Z" fill="#a87838"/>
    <path d="M-3,-48 L-1,-40" stroke="#7a5028" stroke-width="0.85" opacity="0.85"/>
    <!-- Freckles -->
    <circle cx="-3" cy="-30" r="0.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="-1" cy="-28" r="0.4" fill="#5a3018" opacity="0.85"/>
    <circle cx="3" cy="-30" r="0.4" fill="#5a3018" opacity="0.85"/>
    <!-- Eyes — looking forward (chin up) -->
    <ellipse cx="-3" cy="-32" rx="1.6" ry="1" fill="#fff8e8"/>
    <ellipse cx="-3" cy="-31" rx="1" ry="0.7" fill="#7a4818"/>
    <circle cx="-3" cy="-31" r="0.55" fill="#0a0604"/>
    <ellipse cx="3" cy="-32" rx="1.6" ry="1" fill="#fff8e8"/>
    <ellipse cx="3" cy="-31" rx="1" ry="0.7" fill="#7a4818"/>
    <circle cx="3" cy="-31" r="0.55" fill="#0a0604"/>
    <!-- Brows up — nervous -->
    <path d="M-7,-39 L-1,-40" stroke="#5a3018" stroke-width="0.7"/>
    <path d="M1,-40 L7,-39" stroke="#5a3018" stroke-width="0.7"/>
    <!-- Mouth — slight whistle pucker (tuneless) -->
    <ellipse cx="0" cy="-22" rx="1.4" ry="0.85" fill="#3a1808" opacity="0.65"/>
    <path d="M-2,-22 L2,-22" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Whistle motion lines (tuneless) -->
    <g stroke="#5a3018" stroke-width="0.3" opacity="0.45" fill="none" stroke-dasharray="1.5 1.5">
      <path d="M3,-22 Q7,-23 9,-21"/>
      <path d="M3,-20 Q7,-19 9,-21"/>
    </g>
    <!-- Breath fog -->
    <ellipse cx="6" cy="-19" rx="3" ry="1.4" fill="#fff8e8" opacity="0.4" filter="url(#p11p4bloom)"/>
  </g>

  <!-- THEODORE muttering -->
  <g>
    <rect x="14" y="14" width="280" height="46" rx="2" fill="white" stroke="#6a4220" stroke-width="0.85" opacity="0.95" stroke-dasharray="3 2" filter="url(#balloonShadow)"/>
    <polygon points="180,60 192,60 184,72" fill="white" stroke="#6a4220" stroke-width="0.85" stroke-dasharray="3 2"/>
    <line x1="180.5" y1="60" x2="191.5" y2="60" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#6a4220" font-weight="700">THEODORE (mutter)</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Just walk in. Ask about the — the commission.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Mr. Cribbage's commission. Right. Right.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q120,82 240,78 Q360,76 494,80"/>
    <path d="M0,290 Q120,292 240,288 Q360,286 494,290"/>
  </g>
</svg>
