<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 11 — Panel 2: Clockmaker face through glass — checking dial — pale blue eyes — inches from Wren</title>
  <desc>50mm MCU. Clockmaker's face fills glass panel. Pale blue eyes creased from decades of close work. Magnifying loupe pushed up on leather headband. Mild professional attention. Checking dial, not looking down. He cannot see what hides inside.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p11p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p11p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a5828"/>
    </linearGradient>
    <linearGradient id="p11p2glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p11p2warmGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p11p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p11p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p11p2bg)"/>

  <!-- ===== GLASS PANEL FRAME ===== -->
  <rect x="0" y="0" width="366" height="364" fill="url(#p11p2glass)"/>
  <rect x="20" y="20" width="326" height="324" fill="none" stroke="#3a1808" stroke-width="2"/>
  <rect x="22" y="22" width="322" height="320" fill="#3a1808" opacity="0.55"/>

  <!-- Warm amber glow filling the glass space -->
  <rect x="22" y="22" width="322" height="320" fill="url(#p11p2warmGlow)" opacity="0.85"/>

  <!-- ===== CLOCKMAKER'S FACE filling glass panel ===== -->
  <g transform="translate(183 200)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="120" ry="140" fill="url(#p11p2skin)"/>

    <!-- Hair (thinning brown) -->
    <path d="M-100,-110 Q-80,-138 0,-144 Q80,-138 100,-110 L94,-90 Q60,-122 0,-122 Q-60,-122 -94,-90 Z" fill="#7a5028"/>
    <path d="M-100,-110 Q-90,-130 -60,-130" stroke="#5a3818" stroke-width="0.85" fill="none"/>
    <path d="M100,-110 Q90,-130 60,-130" stroke="#5a3818" stroke-width="0.85" fill="none"/>

    <!-- LEATHER HEADBAND with magnifying loupe pushed UP on forehead -->
    <rect x="-60" y="-100" width="120" height="14" fill="#3a1808"/>
    <line x1="-60" y1="-93" x2="60" y2="-93" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Loupe lens (brass-mounted, on swing arm) -->
    <g transform="translate(-30 -106)">
      <ellipse cx="0" cy="-9" rx="14" ry="11" fill="#3a3030"/>
      <ellipse cx="0" cy="-9" rx="11" ry="9" fill="none" stroke="#a86838" stroke-width="2"/>
      <ellipse cx="0" cy="-9" rx="9" ry="7" fill="#5a4838" opacity="0.65"/>
      <!-- Lens shine -->
      <ellipse cx="-4" cy="-12" rx="3" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p11p2bloom)"/>
      <!-- Swing arm -->
      <line x1="14" y1="-9" x2="20" y2="-2" stroke="#5a4838" stroke-width="1.4"/>
    </g>

    <!-- EYES — PALE BLUE, creased corners, professional attention -->
    <ellipse cx="-44" cy="-30" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="-44" cy="-26" rx="14" ry="10" fill="#a8b8c8"/>
    <circle cx="-44" cy="-26" r="6" fill="#3a4858"/>
    <circle cx="-44" cy="-26" r="2.4" fill="#0a0c14"/>
    <circle cx="-42" cy="-30" r="2" fill="#fff8e8" filter="url(#p11p2bloom)"/>
    <!-- Crow's feet (decades of close work) -->
    <path d="M-66,-30 L-72,-32" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>
    <path d="M-66,-26 L-74,-26" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>
    <path d="M-66,-22 L-72,-20" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>

    <ellipse cx="44" cy="-30" rx="22" ry="14" fill="#fff8e8"/>
    <ellipse cx="44" cy="-26" rx="14" ry="10" fill="#a8b8c8"/>
    <circle cx="44" cy="-26" r="6" fill="#3a4858"/>
    <circle cx="44" cy="-26" r="2.4" fill="#0a0c14"/>
    <circle cx="46" cy="-30" r="2" fill="#fff8e8" filter="url(#p11p2bloom)"/>
    <path d="M66,-30 L72,-32" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>
    <path d="M66,-26 L74,-26" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>
    <path d="M66,-22 L72,-20" stroke="#5a3018" stroke-width="0.85" opacity="0.7"/>

    <!-- Brows level — mild attention -->
    <path d="M-66,-50 L-22,-54" stroke="#5a3018" stroke-width="3" stroke-linecap="round"/>
    <path d="M22,-54 L66,-50" stroke="#5a3018" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M-8,0 L-4,40 Q0,46 6,44 L10,0 Z" fill="url(#p11p2skin)" opacity="0.85"/>
    <ellipse cx="-2" cy="40" rx="3" ry="2" fill="#3a1c08" opacity="0.55"/>
    <ellipse cx="6" cy="40" rx="3" ry="2" fill="#3a1c08" opacity="0.55"/>

    <!-- Mouth — neutral, focused on his work -->
    <path d="M-22,72 L22,72" stroke="#3a1808" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Slight downward at corners (concentration) -->
    <path d="M-22,72 Q-26,76 -28,80" fill="none" stroke="#5a3018" stroke-width="0.85" opacity="0.55"/>
    <path d="M22,72 Q26,76 28,80" fill="none" stroke="#5a3018" stroke-width="0.85" opacity="0.55"/>

    <!-- Salt-and-pepper stubble -->
    <g fill="#5a3018" opacity="0.55">
      <circle cx="-30" cy="76" r="0.7"/>
      <circle cx="-22" cy="80" r="0.55"/>
      <circle cx="-14" cy="84" r="0.7"/>
      <circle cx="0" cy="86" r="0.55"/>
      <circle cx="14" cy="84" r="0.7"/>
      <circle cx="22" cy="80" r="0.55"/>
      <circle cx="30" cy="76" r="0.7"/>
    </g>

    <!-- Subtle warm light reflection on cheeks -->
    <ellipse cx="-50" cy="20" rx="14" ry="22" fill="#ffd078" opacity="0.35" filter="url(#p11p2bloom)"/>
    <ellipse cx="50" cy="20" rx="14" ry="22" fill="#ffd078" opacity="0.35" filter="url(#p11p2bloom)"/>
  </g>

  <!-- Glass reflection lines (we're inside looking out) -->
  <g opacity="0.45">
    <line x1="40" y1="60" x2="80" y2="120" stroke="#fff8e8" stroke-width="0.7" filter="url(#p11p2bloom)"/>
    <line x1="320" y1="60" x2="280" y2="120" stroke="#fff8e8" stroke-width="0.55" filter="url(#p11p2bloom)"/>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,300 Q90,298 180,302 Q280,304 366,300"/>
  </g>
</svg>
