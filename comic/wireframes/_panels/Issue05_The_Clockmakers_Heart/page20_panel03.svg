<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 20 — Panel 3: Wren studies clock schematic — finger tracing — past gets same respect as future</title>
  <desc>35mm wide. Wren sits at workstation between timber beams. Two schematics deployed: clock (left, copper-gold) + drive (right, blue-white). She studies the CLOCK, not the drive. Finger traces holographic gears. Same focused attention she gives to advanced tech. Sits in overlap of both lights. Dialog: WREN quiet to herself: How did you solve the temperature compensation? / WREN: ...Oh. That's clever. / WREN: That is very clever.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p20p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1218"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p20p3timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p20p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p20p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p20p3warmHolo" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p3coolHolo" cx="80%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a8d8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3060a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p20p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p20p3bg)"/>

  <!-- DUAL LIGHTING — warm copper-gold (LEFT) + cool blue (RIGHT) -->
  <rect width="742" height="364" fill="url(#p20p3warmHolo)"/>
  <rect width="742" height="364" fill="url(#p20p3coolHolo)"/>

  <!-- Dark timber beams framing -->
  <rect width="60" height="364" fill="url(#p20p3timber)"/>
  <rect x="682" width="60" height="364" fill="url(#p20p3timber)"/>
  <rect y="60" width="60" height="9" fill="#3a1808"/>
  <rect y="200" width="60" height="9" fill="#3a1808"/>
  <rect x="682" y="60" width="60" height="9" fill="#3a1808"/>
  <rect x="682" y="200" width="60" height="9" fill="#3a1808"/>

  <!-- Workstation (low, in shadow) -->
  <rect x="60" y="280" width="622" height="84" fill="#1a0c04"/>
  <line x1="60" y1="280" x2="682" y2="280" stroke="#5a3018" stroke-width="0.55"/>

  <!-- ===== CLOCK SCHEMATIC on LEFT — copper-gold wireframe ===== -->
  <g transform="translate(180 180)">
    <!-- Halo -->
    <circle cx="0" cy="0" r="120" fill="#ffaa48" opacity="0.45" filter="url(#p20p3glow)"/>

    <!-- Wireframe gears (3D suggestion) -->
    <g stroke="#ffd078" stroke-width="1" fill="none" opacity="0.85" filter="url(#p20p3bloom)">
      <ellipse cx="0" cy="0" rx="80" ry="60"/>
      <ellipse cx="0" cy="0" rx="60" ry="45"/>
      <ellipse cx="0" cy="0" rx="14" ry="60"/>
      <ellipse cx="0" cy="0" rx="32" ry="60"/>
      <!-- Gears -->
      <circle cx="-30" cy="-22" r="14"/>
      <circle cx="30" cy="-22" r="11"/>
      <circle cx="0" cy="11" r="18"/>
      <!-- Linkages -->
      <line x1="-30" y1="-32" x2="-30" y2="-12"/>
      <line x1="-44" y1="-22" x2="-16" y2="-22"/>
      <line x1="30" y1="-30" x2="30" y2="-14"/>
      <line x1="0" y1="-7" x2="0" y2="29"/>
      <line x1="-18" y1="11" x2="18" y2="11"/>
    </g>
    <!-- Tooth marks -->
    <g stroke="#fff8e8" stroke-width="0.4" filter="url(#p20p3bloom)" opacity="0.85">
      <line x1="0" y1="-7" x2="0" y2="-9"/>
      <line x1="0" y1="29" x2="0" y2="31"/>
      <line x1="-18" y1="11" x2="-20" y2="11"/>
      <line x1="18" y1="11" x2="20" y2="11"/>
    </g>
    <!-- Pendulum -->
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#ffd078" stroke-width="0.55" opacity="0.85"/>
    <ellipse cx="0" cy="-50" rx="3" ry="2" fill="#ffd078" opacity="0.85" filter="url(#p20p3bloom)"/>

    <!-- Hex emitter base -->
    <polygon points="-7,68 -3,62 3,62 7,68 3,74 -3,74" fill="#ffd078" opacity="0.85" filter="url(#p20p3bloom)"/>
  </g>

  <!-- ===== DRIVE SCHEMATIC on RIGHT — blue-white wireframe ===== -->
  <g transform="translate(560 180)">
    <circle cx="0" cy="0" r="100" fill="#a8d8ff" opacity="0.35" filter="url(#p20p3glow)"/>

    <g stroke="#a8d8ff" stroke-width="1" fill="none" opacity="0.85" filter="url(#p20p3bloom)">
      <ellipse cx="0" cy="0" rx="80" ry="60"/>
      <ellipse cx="0" cy="0" rx="60" ry="45"/>
      <ellipse cx="0" cy="0" rx="14" ry="60"/>
      <!-- Hex lattice components -->
      <polygon points="-26,-22 -18,-30 -6,-30 2,-22 -6,-14 -18,-14"/>
      <polygon points="6,-22 14,-30 26,-30 34,-22 26,-14 14,-14"/>
      <polygon points="-9,11 -1,3 11,3 19,11 11,19 -1,19"/>
      <line x1="2" y1="-22" x2="6" y2="-22"/>
      <line x1="14" y1="-14" x2="0" y2="0"/>
      <line x1="-14" y1="-14" x2="0" y2="0"/>
      <!-- Crystalline nodes -->
      <circle cx="0" cy="0" r="3"/>
      <circle cx="-26" cy="-22" r="2"/>
      <circle cx="30" cy="-22" r="2"/>
      <circle cx="5" cy="11" r="2"/>
    </g>

    <!-- Hex emitter base -->
    <polygon points="-7,68 -3,62 3,62 7,68 3,74 -3,74" fill="#a8d8ff" opacity="0.85" filter="url(#p20p3bloom)"/>
  </g>

  <!-- ===== WREN — sitting at workstation, BETWEEN both schematics ===== -->
  <g transform="translate(371 220)">
    <!-- Stool (low) -->
    <rect x="-22" y="60" width="44" height="40" fill="#3a1808"/>

    <!-- Body — seated, leaning slightly LEFT (toward clock) -->
    <path d="M-26,30 L-32,90 L32,90 L26,30 Z" fill="url(#p20p3suit)"/>
    <line x1="-15" y1="50" x2="15" y2="50" stroke="#ffaa48" stroke-width="0.7" opacity="0.85" filter="url(#p20p3bloom)"/>
    <!-- Heavy oil/clock smear -->
    <ellipse cx="0" cy="55" rx="14" ry="6" fill="#1a0c04" opacity="0.55" transform="rotate(-15 0 55)"/>

    <!-- Shoulders -->
    <ellipse cx="-26" cy="24" rx="9" ry="6" fill="url(#p20p3suit)"/>
    <ellipse cx="26" cy="24" rx="9" ry="6" fill="url(#p20p3suit)"/>
    <!-- Scorch -->
    <ellipse cx="-26" cy="24" rx="6" ry="4" fill="#1a0c04" opacity="0.7"/>

    <!-- LEFT ARM extended toward clock schematic — finger TRACING gears -->
    <line x1="-22" y1="30" x2="-160" y2="-4" stroke="url(#p20p3skin)" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="-160" cy="-4" rx="5" ry="3" fill="url(#p20p3skin)"/>
    <!-- Finger pointing/tracing into schematic (extended index) -->
    <line x1="-160" y1="-4" x2="-180" y2="-9" stroke="url(#p20p3skin)" stroke-width="2" stroke-linecap="round"/>
    <!-- Faint warm halo around finger (touching virtual gear) -->
    <circle cx="-180" cy="-9" r="6" fill="#ffd078" opacity="0.65" filter="url(#p20p3glow)"/>
    <!-- Tracing trail line -->
    <path d="M-180,-9 Q-200,-4 -212,4" stroke="#ffaa48" stroke-width="0.55" fill="none" opacity="0.65" stroke-dasharray="2,2"/>

    <!-- RIGHT ARM resting on workstation -->
    <line x1="22" y1="30" x2="40" y2="60" stroke="url(#p20p3skin)" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="40" cy="60" rx="5" ry="3" fill="url(#p20p3skin)"/>

    <!-- HEAD — turned slightly LEFT, looking at clock schematic -->
    <ellipse cx="-3" cy="0" rx="11" ry="14" fill="url(#p20p3skin)"/>
    <!-- Hair UP (loose, dust-flecked) -->
    <ellipse cx="-3" cy="-9" rx="6" ry="4" fill="#0a0604"/>
    <ellipse cx="-3" cy="-15" rx="3" ry="2" fill="#1a0c04"/>
    <path d="M-14,-9 Q-12,-15 -3,-18 Q6,-15 8,-9 L7,-5 Q3,-13 -3,-13 Q-9,-13 -13,-5 Z" fill="#0a0604"/>
    <!-- Copper dust -->
    <circle cx="-9" cy="-12" r="0.4" fill="#c87a35" opacity="0.85"/>
    <circle cx="3" cy="-12" r="0.4" fill="#c87a35" opacity="0.85"/>
    <!-- Loose strands -->
    <path d="M-9,-3 Q-12,4 -10,9" stroke="#0a0604" stroke-width="0.55" fill="none"/>

    <!-- Eyes — looking LEFT toward schematic, ABSORBED -->
    <ellipse cx="-7" cy="0" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-9" cy="1" r="1" fill="#3a2010"/>
    <circle cx="-9" cy="1" r="0.55" fill="#0a0604"/>
    <ellipse cx="3" cy="0" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="1" cy="1" r="1" fill="#3a2010"/>
    <circle cx="1" cy="1" r="0.55" fill="#0a0604"/>
    <!-- Brows level — focused, intent -->
    <path d="M-11,-4 L-3,-4" stroke="#0a0604" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M-1,-4 L7,-4" stroke="#0a0604" stroke-width="0.7" stroke-linecap="round"/>
    <!-- Mouth — slightly open (saying "Oh. That's clever.") -->
    <ellipse cx="-3" cy="8" rx="2" ry="1" fill="#3a1808"/>
    <ellipse cx="-3" cy="7" rx="1.4" ry="0.55" fill="#a86838"/>

    <!-- Light catching her face from BOTH sides -->
    <ellipse cx="-9" cy="3" rx="6" ry="9" fill="#ffd078" opacity="0.45" filter="url(#p20p3bloom)"/>
    <ellipse cx="6" cy="3" rx="4" ry="6" fill="#a8c8e8" opacity="0.45" filter="url(#p20p3bloom)"/>
  </g>

  <!-- DIALOG WREN (temperature compensation) -->
  <g transform="translate(180 60)">
    <ellipse cx="0" cy="0" rx="160" ry="22" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M30,18 L46,32 L36,20 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-150" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-150" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"How did you solve the temperature compensation?"</text>
  </g>

  <!-- DIALOG WREN (Oh that's clever) -->
  <g transform="translate(560 100)">
    <ellipse cx="0" cy="0" rx="120" ry="22" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-40,18 L-56,32 L-34,20 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-110" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-110" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"...Oh. That's clever."</text>
  </g>

  <!-- DIALOG WREN (very clever) -->
  <g transform="translate(180 320)">
    <ellipse cx="0" cy="0" rx="100" ry="20" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M30,-16 L46,-32 L36,-18 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-90" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-90" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">"That is very clever."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,310 Q180,308 360,312 Q540,314 742,310"/>
  </g>
</svg>
