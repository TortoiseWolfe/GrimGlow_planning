<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 311" width="238" height="311">
  <title>Issue 5 — Page 12 — Panel 4: Clockmaker's eye through loupe — magnified iris filling Wren's sky — capillaries like rivers</title>
  <desc>100mm ECU. Loupe-magnified eye searches mechanism. Vast grey-blue iris fills frame. Capillaries in sclera now size of rivers. Brass loupe rim frames eye like porthole. Concentrated amber beam enters mechanism. Brass gear edges in extreme foreground. Dialog: CLOCKMAKER muttering enormous: Hmm. Something's shifted.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="p12p4iris" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="20%" stop-color="#3a4858"/>
      <stop offset="60%" stop-color="#7888a0"/>
      <stop offset="100%" stop-color="#a8b8c8"/>
    </radialGradient>
    <radialGradient id="p12p4sclera" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#d8c8b8"/>
    </radialGradient>
    <radialGradient id="p12p4loupeRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a86838" stop-opacity="0"/>
      <stop offset="80%" stop-color="#a86838" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </radialGradient>
    <radialGradient id="p12p4amberBeam" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p12p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <filter id="p12p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p12p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="238" height="311" fill="url(#p12p4bg)"/>

  <!-- BRASS GEAR EDGE foreground left (out of focus framing) -->
  <g opacity="0.85">
    <circle cx="0" cy="155" r="120" fill="#3a1808" filter="url(#p12p4bloom)"/>
    <circle cx="0" cy="155" r="100" fill="none" stroke="#1a0c04" stroke-width="0.85"/>
  </g>
  <g opacity="0.85">
    <circle cx="238" cy="155" r="100" fill="#3a1808" filter="url(#p12p4bloom)"/>
    <circle cx="238" cy="155" r="80" fill="none" stroke="#1a0c04" stroke-width="0.85"/>
  </g>

  <!-- Concentrated amber beam entering -->
  <ellipse cx="119" cy="155" rx="120" ry="160" fill="url(#p12p4amberBeam)" filter="url(#p12p4glow)"/>

  <!-- BRASS LOUPE RING — porthole framing the eye -->
  <circle cx="119" cy="155" r="115" fill="url(#p12p4loupeRing)"/>
  <circle cx="119" cy="155" r="110" fill="#0a0408" opacity="0.85"/>
  <circle cx="119" cy="155" r="105" fill="none" stroke="#a86838" stroke-width="2.5"/>
  <circle cx="119" cy="155" r="100" fill="none" stroke="#7a4818" stroke-width="0.85"/>

  <!-- Loupe rim highlight -->
  <path d="M40,80 Q119,40 198,80" stroke="#fff8e8" stroke-width="1.4" fill="none" opacity="0.75" filter="url(#p12p4bloom)"/>
  <path d="M40,230 Q119,270 198,230" stroke="#5a3018" stroke-width="1" fill="none" opacity="0.85"/>

  <!-- ===== EYE FILLS LOUPE ===== -->
  <!-- Sclera (eye white) -->
  <ellipse cx="119" cy="155" rx="98" ry="62" fill="url(#p12p4sclera)"/>

  <!-- Capillaries — RIVERS at this scale -->
  <g fill="none" stroke="#dc4040" stroke-width="0.85" opacity="0.65">
    <path d="M30,140 Q50,135 70,140 Q85,145 95,144"/>
    <path d="M30,160 Q55,158 75,164 Q90,168 100,166"/>
    <path d="M30,175 Q60,180 85,175"/>
    <path d="M210,140 Q190,138 170,142 Q155,144 145,144"/>
    <path d="M210,158 Q185,160 165,164 Q150,166 140,166"/>
    <path d="M210,178 Q180,180 155,178"/>
  </g>
  <g fill="none" stroke="#a83030" stroke-width="0.55" opacity="0.55">
    <path d="M40,130 Q60,135 75,140"/>
    <path d="M40,180 Q60,185 75,180"/>
    <path d="M200,130 Q180,135 165,140"/>
    <path d="M200,180 Q180,185 165,180"/>
  </g>

  <!-- IRIS — vast grey-blue disc -->
  <circle cx="119" cy="155" r="60" fill="url(#p12p4iris)"/>
  <!-- Iris fiber pattern (radial striations) -->
  <g stroke="#5a6878" stroke-width="0.55" opacity="0.55">
    <line x1="119" y1="100" x2="119" y2="115"/>
    <line x1="119" y1="195" x2="119" y2="210"/>
    <line x1="64" y1="155" x2="79" y2="155"/>
    <line x1="159" y1="155" x2="174" y2="155"/>
    <line x1="80" y1="116" x2="89" y2="125"/>
    <line x1="158" y1="116" x2="149" y2="125"/>
    <line x1="80" y1="194" x2="89" y2="185"/>
    <line x1="158" y1="194" x2="149" y2="185"/>
    <line x1="119" y1="120" x2="119" y2="130"/>
    <line x1="119" y1="180" x2="119" y2="190"/>
    <line x1="74" y1="155" x2="84" y2="155"/>
    <line x1="154" y1="155" x2="164" y2="155"/>
    <line x1="92" y1="128" x2="100" y2="135"/>
    <line x1="146" y1="128" x2="138" y2="135"/>
  </g>
  <!-- Limbal ring (darker outer iris) -->
  <circle cx="119" cy="155" r="60" fill="none" stroke="#1a1818" stroke-width="1.4" opacity="0.85"/>

  <!-- PUPIL — dark well -->
  <circle cx="119" cy="155" r="22" fill="#0a0c14"/>
  <!-- Pupil reflection (loupe lens light) -->
  <circle cx="115" cy="148" r="6" fill="#fff8e8" opacity="0.85" filter="url(#p12p4bloom)"/>
  <circle cx="124" cy="160" r="2" fill="#ffd078" opacity="0.55" filter="url(#p12p4bloom)"/>

  <!-- Subtle searching attention — slight pupil offset (eye is moving) -->
  <ellipse cx="119" cy="155" rx="24" ry="22" fill="none" stroke="#0a0c14" stroke-width="0.55" opacity="0.55"/>

  <!-- Reflection of mechanism in the iris (tiny brass curves) -->
  <g opacity="0.45">
    <path d="M100,150 Q119,148 138,150" stroke="#a86838" stroke-width="0.4" fill="none"/>
    <path d="M105,160 Q119,158 133,160" stroke="#a86838" stroke-width="0.4" fill="none"/>
  </g>

  <!-- DIALOG — CLOCKMAKER muttering, top -->
  <g transform="translate(119 38)">
    <ellipse cx="0" cy="0" rx="100" ry="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,22 L-32,40 L-16,24 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-90" y="-8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-90" y="6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">"Hmm. Something's</text>
    <text x="-90" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">shifted."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 238,90"/>
    <path d="M0,260 Q60,258 120,262 Q180,264 238,260"/>
  </g>
</svg>
