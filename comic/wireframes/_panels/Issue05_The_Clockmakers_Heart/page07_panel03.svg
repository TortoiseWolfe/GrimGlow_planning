<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 311" width="366" height="311">
  <title>Issue 5 — Page 7 — Panel 3: Wren peers through cracked lath — first interior view + scanner route map projected</title>
  <desc>50mm slight low angle. Wren peers through gap. Beyond: workshop interior at baseboard scale — bench legs as columns, vast floor, grandfather clock in back, clockmaker hunched at bench. Copper-gold dotted route line projected through air.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p7p3lathDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p7p3interior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p7p3floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p7p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p7p3clockCase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p7p3lampFlood" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p7p3scannerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p7p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p7p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- LATH on left side foreground (Wren peering through gap to right) -->
  <rect x="0" y="0" width="120" height="311" fill="url(#p7p3lathDark)"/>
  <line x1="120" y1="0" x2="120" y2="311" stroke="#0a0604" stroke-width="0.85"/>

  <!-- ===== INTERIOR view through gap (right side) — workshop visible ===== -->
  <rect x="120" y="0" width="246" height="311" fill="url(#p7p3interior)"/>

  <!-- Wash from oil lamp -->
  <rect x="120" y="0" width="246" height="311" fill="url(#p7p3lampFlood)"/>

  <!-- Floor / baseboard line -->
  <rect x="120" y="240" width="246" height="71" fill="url(#p7p3floor)"/>
  <line x1="120" y1="244" x2="366" y2="244" stroke="#3a1808" stroke-width="0.85"/>
  <!-- Floor planks -->
  <g stroke="#3a1808" stroke-width="0.55" opacity="0.55">
    <line x1="120" y1="280" x2="366" y2="280"/>
    <line x1="160" y1="244" x2="170" y2="311"/>
    <line x1="240" y1="244" x2="250" y2="311"/>
    <line x1="320" y1="244" x2="330" y2="311"/>
  </g>

  <!-- BACK WALL with grandfather clock -->
  <rect x="120" y="0" width="246" height="244" fill="#5a3018"/>

  <!-- ===== GRANDFATHER CLOCK — tall mahogany tower against far wall ===== -->
  <g transform="translate(280 130)">
    <!-- Case body -->
    <rect x="-26" y="-110" width="52" height="220" fill="url(#p7p3clockCase)" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Base / plinth -->
    <rect x="-30" y="100" width="60" height="14" fill="#3a1808"/>
    <!-- Crown moulding -->
    <path d="M-30,-110 L-26,-118 L26,-118 L30,-110 Z" fill="#3a1808"/>
    <rect x="-32" y="-118" width="64" height="6" fill="#5a2818"/>
    <!-- Clock face -->
    <circle cx="0" cy="-90" r="14" fill="#fff8e8" filter="url(#p7p3bloom)" opacity="0.85"/>
    <circle cx="0" cy="-90" r="11" fill="#ffd078" opacity="0.55"/>
    <line x1="0" y1="-90" x2="0" y2="-100" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="0" y1="-90" x2="6" y2="-86" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Glass panel showing pendulum -->
    <rect x="-18" y="-70" width="36" height="160" fill="#0a0604"/>
    <line x1="-18" y1="-70" x2="-18" y2="90" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="18" y1="-70" x2="18" y2="90" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Brass pendulum disc visible -->
    <circle cx="0" cy="60" r="10" fill="#ffd078" filter="url(#p7p3bloom)" opacity="0.85"/>
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#ffd078" stroke-width="1" opacity="0.85"/>
    <!-- Reflective sheen on case -->
    <rect x="-26" y="-110" width="6" height="220" fill="#fff8e8" opacity="0.18"/>
  </g>

  <!-- WORKBENCH (left of clock, mid-frame) — visible only as columns/edge -->
  <rect x="140" y="200" width="14" height="44" fill="#3a1808"/>
  <rect x="178" y="200" width="14" height="44" fill="#3a1808"/>
  <rect x="138" y="190" width="62" height="14" fill="#5a2818"/>

  <!-- CLOCKMAKER hunched at bench (back partially turned) -->
  <g transform="translate(220 195)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#1a0c04"/>
    <ellipse cx="-4" cy="-10" rx="5" ry="5" fill="#1a0c04"/>
    <ellipse cx="-4" cy="-13" rx="3" ry="2" fill="#1a0c04"/>
    <!-- Apron suggestion -->
    <rect x="-6" y="2" width="12" height="6" fill="#3a2010"/>
  </g>

  <!-- OIL LAMP on bench -->
  <g transform="translate(170 188)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="#ffd078" filter="url(#p7p3bloom)" opacity="0.85"/>
    <circle cx="0" cy="0" r="3.4" fill="#fff8e8" filter="url(#p7p3bloom)"/>
    <circle cx="0" cy="0" r="1.6" fill="#ffaa48"/>
    <ellipse cx="0" cy="2" rx="20" ry="14" fill="#ffd078" opacity="0.45" filter="url(#p7p3glow)"/>
  </g>

  <!-- ===== SCANNER ROUTE LINE — copper-gold dotted projection ===== -->
  <g stroke="#fff8e8" stroke-width="0.85" fill="none" opacity="0.85" stroke-dasharray="3 2" filter="url(#p7p3bloom)">
    <path d="M120,260 Q160,250 200,255 Q240,260 280,150"/>
  </g>
  <!-- Route waypoint markers -->
  <g fill="#ffd078" filter="url(#p7p3bloom)">
    <circle cx="160" cy="252" r="0.85"/>
    <circle cx="200" cy="255" r="0.85"/>
    <circle cx="240" cy="220" r="0.85"/>
    <circle cx="280" cy="150" r="1.4"/>
  </g>

  <!-- ===== WREN peering through gap (left foreground) ===== -->
  <g transform="translate(80 180)">
    <ellipse cx="0" cy="0" rx="34" ry="34" fill="url(#p7p3scannerHalo)" filter="url(#p7p3glow)" opacity="0.55"/>
    <!-- Body -->
    <ellipse cx="-3" cy="48" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="48" rx="3" ry="1.4" fill="#0a0408"/>
    <rect x="-5" y="22" width="4" height="26" fill="url(#p7p3suit)"/>
    <rect x="1" y="22" width="4" height="26" fill="url(#p7p3suit)"/>
    <ellipse cx="-3" cy="36" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="3" cy="36" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <!-- Torso -->
    <path d="M-7,22 L-7,-14 L7,-14 L7,22 Z" fill="url(#p7p3suit)"/>
    <line x1="-5" y1="-4" x2="5" y2="-4" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p7p3bloom)"/>
    <ellipse cx="-7" cy="-14" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.85"/>
    <!-- Right hand on lath edge (forward into gap) -->
    <path d="M7,-14 L18,-8 L24,-2 L20,2 L14,-2 L4,-8 Z" fill="url(#p7p3suit)"/>
    <ellipse cx="24" cy="0" rx="2.4" ry="1.6" fill="#a86838"/>
    <!-- Scanner emitter glow at wrist -->
    <circle cx="22" cy="-2" r="2" fill="#fff8e8" filter="url(#p7p3bloom)"/>
    <circle cx="22" cy="-2" r="4" fill="#ffd078" opacity="0.65" filter="url(#p7p3bloom)"/>
    <!-- Left arm at side -->
    <rect x="-11" y="-14" width="4" height="32" fill="url(#p7p3suit)"/>
    <ellipse cx="-9" cy="18" rx="2.4" ry="1.6" fill="#a86838"/>
    <!-- Head (looking RIGHT toward gap) -->
    <ellipse cx="0" cy="-24" rx="5.5" ry="7" fill="#a86838"/>
    <ellipse cx="0" cy="-32" rx="3" ry="2.2" fill="#0a0604"/>
    <!-- Profile turning right — eye on right side dominant -->
    <ellipse cx="2" cy="-23" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <ellipse cx="3" cy="-23" rx="1" ry="0.7" fill="#3a2010"/>
    <circle cx="3" cy="-23" r="0.55" fill="#0a0604"/>
    <!-- Warm amber wash on right side of face -->
    <ellipse cx="6" cy="-22" rx="3" ry="4" fill="#ffd078" opacity="0.55" filter="url(#p7p3bloom)"/>
    <!-- Brows level -->
    <path d="M-2,-30 L5,-31" stroke="#0a0604" stroke-width="0.7"/>
    <path d="M-3,-17 L3,-17" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- WREN comms (top) -->
  <g>
    <rect x="14" y="14" width="338" height="60" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms, barely audible))</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">I see the clock. Twenty feet of open floor.</text>
  <text x="22" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1410">The clockmaker is at his bench.</text>

  <!-- WREN comms 2 -->
  <g>
    <rect x="14" y="266" width="240" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="294" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">I'll wait for him to move.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q90,82 180,78 Q280,76 366,80"/>
    <path d="M0,260 Q90,262 180,258 Q280,256 366,260"/>
  </g>
</svg>
