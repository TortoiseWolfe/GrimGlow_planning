<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 17 — Panel 3: Theodore nearly drops Boley — clockmaker laughs — Chardin still life</title>
  <desc>35mm. Theodore holds Boley tweezers with reverent care, nearly drops, clockmaker's hand shoots out to steady boy's grip. Theodore mortified. Clockmaker laughs — genuine, not unkind. Lit like Chardin still life: golden close human. Dialog: THEODORE: Sorry! Sorry I'm sorry— / CLOCKMAKER laughing: Easy, lad. Steady hands. You've got steady hands — I can see that. Just slow down. / THEODORE flushed: Yes, sir.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p17p3bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p17p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p17p3waistcoatT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p17p3waistcoatC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="50%" stop-color="#7a5828"/>
      <stop offset="100%" stop-color="#4a3818"/>
    </linearGradient>
    <linearGradient id="p17p3steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="50%" stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#5a5858"/>
    </linearGradient>
    <radialGradient id="p17p3lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p17p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p17p3bg)"/>

  <!-- Soft dark walls -->
  <rect width="742" height="280" fill="#3a2010" opacity="0.55"/>

  <!-- Concentrated lamp pool -->
  <ellipse cx="371" cy="200" rx="320" ry="160" fill="url(#p17p3lampGlow)" filter="url(#p17p3glow)"/>

  <!-- BENCH -->
  <rect x="0" y="280" width="742" height="84" fill="url(#p17p3bench)"/>
  <line x1="0" y1="280" x2="742" y2="280" stroke="#a86838" stroke-width="0.85" opacity="0.85" filter="url(#p17p3bloom)"/>

  <!-- Background suggestion of clocks/tools (out of focus) -->
  <g opacity="0.45">
    <rect x="0" y="60" width="742" height="3" fill="#3a1808"/>
    <circle cx="60" cy="40" r="14" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="60" cy="40" r="10" fill="#fff8e8" opacity="0.85"/>
    <circle cx="680" cy="40" r="14" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="680" cy="40" r="10" fill="#fff8e8" opacity="0.85"/>
  </g>

  <!-- ===== BOLEY TWEEZERS in shared grip - center-foreground ===== -->
  <g transform="translate(371 230)">
    <!-- Tweezers -->
    <line x1="-22" y1="-30" x2="0" y2="40" stroke="url(#p17p3steel)" stroke-width="2.4"/>
    <line x1="22" y1="-30" x2="0" y2="40" stroke="url(#p17p3steel)" stroke-width="2.4"/>
    <line x1="-22" y1="-30" x2="0" y2="40" stroke="#fff8e8" stroke-width="0.55" opacity="0.85" filter="url(#p17p3bloom)"/>
    <line x1="22" y1="-30" x2="0" y2="40" stroke="#fff8e8" stroke-width="0.55" opacity="0.85" filter="url(#p17p3bloom)"/>
    <!-- Highlight haze -->
    <ellipse cx="0" cy="0" rx="22" ry="40" fill="#ffd078" opacity="0.35" filter="url(#p17p3glow)"/>
  </g>

  <!-- ===== THEODORE on left, holding tweezers, mortified ===== -->
  <g transform="translate(220 200)">
    <!-- Body -->
    <path d="M-22,40 L-26,140 L-12,140 L-10,40 L10,40 L12,140 L26,140 L22,40 Z" fill="#5a3818"/>
    <path d="M-22,40 L-30,-10 L-26,40 Z" fill="url(#p17p3waistcoatT)"/>
    <path d="M22,40 L30,-10 L26,40 Z" fill="url(#p17p3waistcoatT)"/>
    <ellipse cx="0" cy="32" rx="12" ry="6" fill="#d8c8a8"/>
    <path d="M14,16 L20,4 L22,16 Z" fill="#3a2818"/>
    <path d="M-14,16 L-20,4 L-22,16 Z" fill="#3a2818"/>

    <!-- Arms — extending FORWARD with tweezers (held reverently) -->
    <line x1="-22" y1="40" x2="60" y2="60" stroke="url(#p17p3skin)" stroke-width="11" stroke-linecap="round"/>
    <line x1="22" y1="40" x2="80" y2="50" stroke="url(#p17p3skin)" stroke-width="11" stroke-linecap="round"/>
    <!-- Hands holding tweezers (one cradling, one above) -->
    <ellipse cx="60" cy="60" rx="9" ry="6" fill="url(#p17p3skin)"/>
    <ellipse cx="80" cy="50" rx="9" ry="6" fill="url(#p17p3skin)"/>
    <!-- Brass gear ring -->
    <circle cx="58" cy="64" r="1.4" fill="#ffd078" stroke="#7a4818" stroke-width="0.4" filter="url(#p17p3bloom)"/>

    <!-- HEAD — mortified -->
    <ellipse cx="0" cy="0" rx="20" ry="24" fill="url(#p17p3skin)"/>
    <path d="M-18,-22 Q-12,-30 0,-32 Q12,-30 18,-22 L16,-12 Q8,-26 0,-26 Q-8,-26 -16,-12 Z" fill="#a87838"/>
    <!-- Freckles -->
    <g fill="#7a4818" opacity="0.65">
      <circle cx="-7" cy="0" r="0.55"/>
      <circle cx="-2" cy="-2" r="0.55"/>
      <circle cx="3" cy="2" r="0.55"/>
      <circle cx="7" cy="0" r="0.55"/>
    </g>
    <!-- FLUSHED CHEEKS -->
    <ellipse cx="-12" cy="6" rx="6" ry="4" fill="#dc7868" opacity="0.55" filter="url(#p17p3bloom)"/>
    <ellipse cx="12" cy="6" rx="6" ry="4" fill="#dc7868" opacity="0.55" filter="url(#p17p3bloom)"/>
    <!-- Eyes — wide, mortified -->
    <ellipse cx="-7" cy="-4" rx="3" ry="2.4" fill="#fff8e8"/>
    <circle cx="-7" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="-7" cy="-4" r="0.55" fill="#0a0604"/>
    <ellipse cx="7" cy="-4" rx="3" ry="2.4" fill="#fff8e8"/>
    <circle cx="7" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="7" cy="-4" r="0.55" fill="#0a0604"/>
    <!-- Brows — RAISED HIGH (alarm) -->
    <path d="M-12,-14 L-3,-16" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M3,-16 L12,-14" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — open in mortified apology -->
    <ellipse cx="0" cy="10" rx="4" ry="3" fill="#3a1808"/>
  </g>

  <!-- ===== CLOCKMAKER on right, hand steadying tweezers, LAUGHING ===== -->
  <g transform="translate(540 190)">
    <rect x="-26" y="100" width="52" height="40" fill="#3a1808"/>
    <path d="M-30,40 L-44,140 L44,140 L30,40 Z" fill="url(#p17p3waistcoatC)"/>
    <ellipse cx="0" cy="32" rx="20" ry="9" fill="#d8c8a8"/>

    <!-- Arm reaching FORWARD to steady (toward Theodore) -->
    <line x1="-30" y1="40" x2="-130" y2="60" stroke="#d8a878" stroke-width="13" stroke-linecap="round"/>
    <line x1="30" y1="40" x2="40" y2="100" stroke="#d8a878" stroke-width="11" stroke-linecap="round"/>
    <!-- Steadying hand -->
    <ellipse cx="-130" cy="60" rx="11" ry="7" fill="url(#p17p3skin)"/>
    <ellipse cx="40" cy="100" rx="9" ry="6" fill="url(#p17p3skin)"/>
    <!-- Tiny calluses on steadying hand -->
    <line x1="-130" y1="56" x2="-126" y2="52" stroke="#5a3018" stroke-width="0.4"/>
    <line x1="-128" y1="64" x2="-124" y2="60" stroke="#5a3018" stroke-width="0.4"/>

    <!-- HEAD — LAUGHING (mouth open, eyes crinkled) -->
    <ellipse cx="-12" cy="0" rx="22" ry="24" fill="url(#p17p3skin)"/>
    <path d="M-32,-22 Q-22,-30 -12,-32 Q-2,-30 8,-22 L6,-12 Q-2,-26 -12,-26 Q-22,-26 -30,-12 Z" fill="#7a5028"/>
    <!-- Spectacles -->
    <ellipse cx="-22" cy="-2" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <ellipse cx="-2" cy="-2" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <line x1="-15" y1="-2" x2="-9" y2="-2" stroke="#3a2818" stroke-width="0.4"/>
    <ellipse cx="-24" cy="-3.4" rx="2" ry="1" fill="#fff8e8" opacity="0.85" filter="url(#p17p3bloom)"/>
    <ellipse cx="-4" cy="-3.4" rx="2" ry="1" fill="#fff8e8" opacity="0.85" filter="url(#p17p3bloom)"/>
    <!-- Eyes — crinkled in laugh (use curved closed-eye lines) -->
    <path d="M-26,-2 Q-22,-5 -18,-2" stroke="#3a2818" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M-6,-2 Q-2,-5 2,-2" stroke="#3a2818" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- Crow's feet (laugh lines) -->
    <path d="M-32,-4 L-36,-3" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>
    <path d="M-32,0 L-38,1" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>
    <path d="M8,-4 L12,-3" stroke="#5a3018" stroke-width="0.55" opacity="0.85"/>
    <!-- Brows — RAISED in laughter -->
    <path d="M-32,-14 L-18,-15" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M-8,-15 L4,-14" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — open laugh -->
    <ellipse cx="-12" cy="14" rx="6" ry="4" fill="#3a1808"/>
    <ellipse cx="-12" cy="13" rx="3" ry="1.4" fill="#a86838"/>
    <!-- Smile lines -->
    <path d="M-22,8 Q-18,16 -14,18" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>
    <path d="M-2,8 Q-6,16 -10,18" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>
  </g>

  <!-- DIALOG THEODORE Sorry -->
  <g transform="translate(120 100)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,18 L36,32 L26,20 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-90" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-90" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">"Sorry! Sorry, I'm sorry—"</text>
  </g>

  <!-- DIALOG CLOCKMAKER laughing -->
  <g transform="translate(540 100)">
    <ellipse cx="0" cy="0" rx="200" ry="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-30,30 L-46,46 L-26,32 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-190" y="-18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-190" y="-3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"Easy, lad. Steady hands. You've got steady</text>
    <text x="-190" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">hands — I can see that. Just slow down."</text>
  </g>

  <!-- DIALOG THEODORE Yes sir -->
  <g transform="translate(220 320)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,-16 L-36,-32 L-26,-18 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-50" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-50" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">"Yes, sir."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,310 Q180,308 360,312 Q540,314 742,310"/>
  </g>
</svg>
