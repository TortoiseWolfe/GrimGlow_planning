<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 311" width="742" height="311">
  <title>Issue 5 — Page 18 — Panel 2: Theodore walks away — shop window glows behind — Jink at collar — quiet discomfort</title>
  <desc>28mm wide. Theodore walking away from clockmaker's shop on cobblestones at evening. Shoulders heavy, head lowered. Behind: shop window glows warm, clockmaker visible inside returning to bench. Gas lamps cast amber pools. On collar: Jink barely visible. Theodore quiet — decent boy who tricked decent man. Dialog: JINK from collar bright: That was brilliant. The tweezers bit? Perfect. / THEODORE quiet not looking: He offered to teach me. / JINK beat brightness fading: ...Oh.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p2sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p18p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p18p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p18p2waistcoat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p18p2timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <radialGradient id="p18p2shopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p2gasLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p18p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- SKY -->
  <rect width="742" height="120" fill="url(#p18p2sky)"/>

  <!-- BUILDING FACADES -->
  <rect x="0" y="40" width="742" height="200" fill="#1a0c04"/>
  <!-- Distant lit windows (fewer, evening) -->
  <rect x="80" y="100" width="14" height="20" fill="#ffd078" opacity="0.45" filter="url(#p18p2bloom)"/>
  <rect x="180" y="120" width="14" height="20" fill="#ffd078" opacity="0.35" filter="url(#p18p2bloom)"/>

  <!-- ===== H. NAYLOR SHOP (right side, behind Theodore) ===== -->
  <g transform="translate(560 0)">
    <!-- Brick facade -->
    <rect x="0" y="40" width="180" height="200" fill="#5a3818"/>
    <!-- Brick texture -->
    <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
      <line x1="0" y1="80" x2="180" y2="80"/>
      <line x1="0" y1="120" x2="180" y2="120"/>
      <line x1="0" y1="160" x2="180" y2="160"/>
    </g>
    <!-- Dark green timber surround -->
    <rect x="-4" y="100" width="188" height="140" fill="url(#p18p2timber)"/>
    <rect x="0" y="104" width="180" height="136" fill="#3a2010"/>

    <!-- Bow window — warm shop interior -->
    <rect x="14" y="118" width="152" height="100" fill="url(#p18p2shopGlow)" filter="url(#p18p2glow)"/>
    <rect x="14" y="118" width="152" height="100" fill="#ffd078" opacity="0.65"/>
    <path d="M14,118 Q90,108 166,118" stroke="url(#p18p2timber)" stroke-width="3" fill="none"/>
    <line x1="90" y1="110" x2="90" y2="218" stroke="#1a3818" stroke-width="0.85"/>
    <line x1="50" y1="114" x2="50" y2="218" stroke="#1a3818" stroke-width="0.55"/>
    <line x1="130" y1="114" x2="130" y2="218" stroke="#1a3818" stroke-width="0.55"/>
    <line x1="14" y1="170" x2="166" y2="170" stroke="#1a3818" stroke-width="0.55"/>

    <!-- Clocks ghost-visible -->
    <g opacity="0.65">
      <circle cx="35" cy="145" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
      <circle cx="35" cy="145" r="6" fill="#fff8e8" opacity="0.85"/>
      <circle cx="70" cy="148" r="7" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
      <circle cx="105" cy="145" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
      <circle cx="105" cy="145" r="6" fill="#fff8e8" opacity="0.85"/>
      <circle cx="140" cy="148" r="7" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    </g>

    <!-- CLOCKMAKER SILHOUETTE inside, returning to bench (smaller figure) -->
    <g transform="translate(90 200)">
      <ellipse cx="0" cy="0" rx="14" ry="22" fill="#3a2010" opacity="0.85"/>
      <ellipse cx="0" cy="-26" rx="9" ry="11" fill="#3a2010" opacity="0.85"/>
      <!-- Faint silhouette suggesting head bowed over bench -->
    </g>

    <!-- Gold-leaf lettering -->
    <text x="90" y="128" font-family="serif" font-size="9" fill="#ffd078" font-weight="700" text-anchor="middle" filter="url(#p18p2bloom)" opacity="0.95">H. NAYLOR</text>

    <!-- DOOR (left side of shop) -->
    <rect x="-30" y="140" width="40" height="100" fill="url(#p18p2timber)"/>
    <rect x="-26" y="144" width="32" height="40" fill="#3a2010"/>
    <ellipse cx="-10" cy="170" rx="14" ry="20" fill="#ffd078" opacity="0.55" filter="url(#p18p2glow)"/>
  </g>

  <!-- COBBLESTONE STREET -->
  <rect y="240" width="742" height="71" fill="url(#p18p2cobble)"/>
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.65">
    <path d="M0,250 Q60,248 120,252 Q180,254 240,250 Q300,246 360,252 Q420,254 480,248 Q540,250 600,252 Q660,248 742,250"/>
    <path d="M0,270 Q60,268 120,272 Q180,274 240,270 Q300,266 360,272 Q420,274 480,268 Q540,270 600,272 Q660,268 742,270"/>
    <path d="M0,290 Q60,288 120,292 Q180,294 240,290 Q300,286 360,292 Q420,294 480,288 Q540,290 600,292 Q660,288 742,290"/>
  </g>
  <!-- Wet sheen -->
  <ellipse cx="200" cy="280" rx="40" ry="3" fill="#ffd078" opacity="0.25" filter="url(#p18p2bloom)"/>
  <ellipse cx="500" cy="278" rx="50" ry="4" fill="#ffd078" opacity="0.25" filter="url(#p18p2bloom)"/>

  <!-- GAS LAMPS along street -->
  <g transform="translate(120 60)">
    <ellipse cx="0" cy="20" rx="22" ry="20" fill="url(#p18p2gasLamp)" filter="url(#p18p2glow)"/>
    <rect x="-3" y="0" width="6" height="20" fill="#5a3018"/>
    <ellipse cx="0" cy="22" rx="6" ry="9" fill="#fff8e8" filter="url(#p18p2bloom)"/>
    <!-- Pole down to ground -->
    <line x1="0" y1="38" x2="0" y2="240" stroke="#3a1808" stroke-width="2"/>
  </g>
  <ellipse cx="120" cy="280" rx="120" ry="12" fill="#ffd078" opacity="0.35" filter="url(#p18p2glow)"/>

  <g transform="translate(380 60)">
    <ellipse cx="0" cy="20" rx="22" ry="20" fill="url(#p18p2gasLamp)" filter="url(#p18p2glow)"/>
    <rect x="-3" y="0" width="6" height="20" fill="#5a3018"/>
    <ellipse cx="0" cy="22" rx="6" ry="9" fill="#fff8e8" filter="url(#p18p2bloom)"/>
    <line x1="0" y1="38" x2="0" y2="240" stroke="#3a1808" stroke-width="2"/>
  </g>
  <ellipse cx="380" cy="280" rx="120" ry="12" fill="#ffd078" opacity="0.35" filter="url(#p18p2glow)"/>

  <!-- ===== THEODORE walking AWAY (toward LEFT — away from shop) ===== -->
  <g transform="translate(280 220)">
    <!-- Body — shoulders LOWERED, head bowed -->
    <path d="M-22,30 L-26,90 L-12,90 L-10,30 L10,30 L12,90 L26,90 L22,30 Z" fill="#5a3818"/>
    <path d="M-22,30 L-30,-12 L-26,30 Z" fill="url(#p18p2waistcoat)"/>
    <path d="M22,30 L30,-12 L26,30 Z" fill="url(#p18p2waistcoat)"/>
    <ellipse cx="0" cy="22" rx="12" ry="6" fill="#d8c8a8"/>
    <!-- COLLAR TURNED UP -->
    <path d="M14,16 L20,4 L22,16 Z" fill="#3a2818"/>
    <path d="M-14,16 L-20,4 L-22,16 Z" fill="#3a2818"/>

    <!-- Arms hanging (low, dispirited) -->
    <line x1="-22" y1="30" x2="-22" y2="76" stroke="url(#p18p2skin)" stroke-width="9" stroke-linecap="round"/>
    <line x1="22" y1="30" x2="22" y2="76" stroke="url(#p18p2skin)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-22" cy="76" rx="6" ry="4" fill="url(#p18p2skin)"/>
    <ellipse cx="22" cy="76" rx="6" ry="4" fill="url(#p18p2skin)"/>
    <!-- Brass gear ring -->
    <circle cx="-24" cy="80" r="1.4" fill="#ffd078" stroke="#7a4818" stroke-width="0.4" filter="url(#p18p2bloom)"/>

    <!-- HEAD — slightly DOWN/forward -->
    <ellipse cx="-3" cy="-4" rx="16" ry="20" fill="url(#p18p2skin)"/>
    <path d="M-19,-22 Q-13,-28 -3,-30 Q7,-28 13,-22 L11,-14 Q3,-26 -3,-26 Q-9,-26 -17,-14 Z" fill="#a87838"/>
    <!-- Freckles -->
    <g fill="#7a4818" opacity="0.65">
      <circle cx="-9" cy="-2" r="0.55"/>
      <circle cx="-2" cy="-4" r="0.55"/>
      <circle cx="5" cy="-2" r="0.55"/>
    </g>
    <!-- Eyes — LOOKING DOWN -->
    <ellipse cx="-7" cy="-4" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <circle cx="-7" cy="-3" r="1" fill="#7a4818"/>
    <ellipse cx="3" cy="-4" rx="2.4" ry="1.4" fill="#fff8e8"/>
    <circle cx="3" cy="-3" r="1" fill="#7a4818"/>
    <!-- Brows slightly drawn together -->
    <path d="M-12,-12 L-3,-13" stroke="#5a3018" stroke-width="0.7"/>
    <path d="M-1,-13 L8,-12" stroke="#5a3018" stroke-width="0.7"/>
    <!-- Mouth — slight downturn -->
    <path d="M-5,8 L3,8" stroke="#3a1808" stroke-width="0.7"/>

    <!-- COLLAR with JINK on his shoulder (right side, barely visible) -->
    <g transform="translate(20 8)">
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#2ed078"/>
      <ellipse cx="0" cy="-2" rx="2.4" ry="1.4" fill="#f8d068"/>
      <!-- Faint emerald glow -->
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#3ad0a8" opacity="0.55" filter="url(#p18p2bloom)"/>
      <!-- Tiny eye -->
      <circle cx="-1" cy="-1" r="0.4" fill="#0a0604"/>
    </g>
  </g>

  <!-- DIALOG JINK bright (from collar) -->
  <g transform="translate(180 70)">
    <ellipse cx="0" cy="0" rx="160" ry="22" fill="#ffffff" stroke="#2ed078" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M50,18 L66,32 L54,20 Z" fill="#ffffff" stroke="#2ed078" stroke-width="1"/>
    <text x="-150" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK</text>
    <text x="-150" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"That was brilliant. The tweezers bit? Perfect."</text>
  </g>

  <!-- DIALOG THEODORE (he offered to teach me) -->
  <g transform="translate(540 130)">
    <ellipse cx="0" cy="0" rx="160" ry="22" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-50,18 L-66,32 L-44,20 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-150" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-150" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"He offered to teach me."</text>
  </g>

  <!-- DIALOG JINK (Oh) -->
  <g transform="translate(140 200)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="#ffffff" stroke="#2ed078" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,16 L36,28 L26,18 Z" fill="#ffffff" stroke="#2ed078" stroke-width="1"/>
    <text x="-40" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#2ed078" font-weight="700">JINK</text>
    <text x="-40" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="500">"...Oh."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q180,92 360,88 Q540,86 742,90"/>
    <path d="M0,260 Q180,258 360,262 Q540,264 742,260"/>
  </g>
</svg>
