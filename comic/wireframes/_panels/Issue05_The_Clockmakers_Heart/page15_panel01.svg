<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 15 — Panel 1: Theodore enters shop, bell rings, clockmaker looks up — terrible liar arrives</title>
  <desc>35mm. Theodore in doorway, backlit by cool gaslight from street. Bell above door rings TING-a-ling. Shop interior: shelves of clocks, brass, glass. Clockmaker in back at bench looks up with mild annoyance, screwdriver in hand. Theodore: face of boy who just forgot his rehearsed line. Jink already invisible — slipped off shoulder, moving along baseboard. Dialog: SFX TING-a-ling / CLOCKMAKER not looking up: Shop's closed. / THEODORE: I-- yes sir. Sorry sir. I saw your light. I-- wanted to ask about-- / THEODORE finding it: --about your work.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p15p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p15p1wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p15p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p15p1waistcoat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p15p1clockMaker" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="50%" stop-color="#7a5828"/>
      <stop offset="100%" stop-color="#4a3818"/>
    </linearGradient>
    <radialGradient id="p15p1lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p15p1gaslight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c8e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a4858" stop-opacity="0"/>
    </radialGradient>
    <filter id="p15p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p15p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p15p1bg)"/>

  <!-- WALL behind shelves -->
  <rect x="0" y="0" width="742" height="280" fill="url(#p15p1wall)"/>

  <!-- FLOOR -->
  <rect y="280" width="742" height="84" fill="url(#p15p1floor)"/>
  <line x1="0" y1="280" x2="742" y2="280" stroke="#1a0c04" stroke-width="0.55"/>
  <!-- Floorboards -->
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="310" x2="742" y2="310"/>
    <line x1="0" y1="340" x2="742" y2="340"/>
  </g>

  <!-- SHELVES OF CLOCKS - LEFT WALL -->
  <g>
    <rect x="0" y="80" width="240" height="3" fill="#3a1808"/>
    <rect x="0" y="170" width="240" height="3" fill="#3a1808"/>
    <!-- Mantel clocks on top shelf -->
    <rect x="20" y="60" width="40" height="20" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="40" cy="70" r="6" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <line x1="40" y1="70" x2="40" y2="66" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="80" y="50" width="50" height="30" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="105" cy="65" r="9" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <rect x="160" y="60" width="40" height="20" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="180" cy="70" r="6" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <!-- Bracket clocks on second shelf -->
    <rect x="20" y="140" width="44" height="30" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="42" cy="155" r="9" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <line x1="42" y1="155" x2="42" y2="148" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="42" y1="155" x2="48" y2="155" stroke="#1a0c04" stroke-width="0.4"/>
    <rect x="100" y="130" width="50" height="40" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="125" cy="150" r="14" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <rect x="180" y="140" width="40" height="30" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="200" cy="155" r="9" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
  </g>

  <!-- SHELVES — RIGHT WALL -->
  <g>
    <rect x="500" y="80" width="242" height="3" fill="#3a1808"/>
    <rect x="500" y="170" width="242" height="3" fill="#3a1808"/>
    <rect x="520" y="50" width="50" height="30" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="545" cy="65" r="9" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <rect x="600" y="60" width="40" height="20" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="620" cy="70" r="6" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <rect x="660" y="50" width="50" height="30" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="685" cy="65" r="9" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <!-- Pocket watch display case below -->
    <rect x="510" y="200" width="220" height="40" fill="#3a2010" stroke="#a86838" stroke-width="0.7"/>
    <rect x="514" y="204" width="212" height="32" fill="#5a3818" opacity="0.55"/>
    <circle cx="540" cy="218" r="7" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <circle cx="580" cy="220" r="7" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <circle cx="620" cy="218" r="7" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <circle cx="660" cy="220" r="7" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
    <circle cx="700" cy="218" r="7" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.4"/>
  </g>

  <!-- DOORWAY at LEFT — Theodore backlit by cool gaslight from street -->
  <g transform="translate(60 180)">
    <!-- Doorway frame (dark green timber) -->
    <rect x="-30" y="-150" width="100" height="184" fill="#1a3818"/>
    <rect x="-26" y="-146" width="92" height="180" fill="#0a0408"/>
    <!-- Cool gaslight halo coming through -->
    <ellipse cx="20" cy="-50" rx="60" ry="100" fill="url(#p15p1gaslight)" filter="url(#p15p1glow)"/>
    <!-- BELL on bracket above door -->
    <rect x="-3" y="-150" width="6" height="22" fill="#5a3018"/>
    <circle cx="0" cy="-130" r="6" fill="#a86838" stroke="#5a3018" stroke-width="0.55"/>
    <ellipse cx="0" cy="-126" rx="3" ry="4" fill="#fff8e8" opacity="0.85" filter="url(#p15p1bloom)"/>
    <!-- Bell in motion lines -->
    <path d="M-10,-130 L-14,-128" stroke="#a86838" stroke-width="0.55"/>
    <path d="M10,-130 L14,-128" stroke="#a86838" stroke-width="0.55"/>
  </g>

  <!-- ===== THEODORE in doorway, backlit ===== -->
  <g transform="translate(140 220)">
    <!-- Body silhouetted edge — backlit halo -->
    <ellipse cx="0" cy="0" rx="32" ry="80" fill="#a8c8e8" opacity="0.35" filter="url(#p15p1glow)"/>
    <!-- Trousers -->
    <path d="M-18,30 L-22,90 L-10,90 L-8,30 L8,30 L10,90 L22,90 L18,30 Z" fill="#5a3818"/>
    <!-- Worn leather waistcoat — collar UP -->
    <path d="M-18,30 L-26,-10 L-22,30 Z" fill="url(#p15p1waistcoat)"/>
    <path d="M18,30 L26,-10 L22,30 Z" fill="url(#p15p1waistcoat)"/>
    <path d="M-18,30 L-18,20 L-3,20 L-3,30 Z" fill="#3a2818"/>
    <path d="M18,30 L18,20 L3,20 L3,30 Z" fill="#3a2818"/>
    <!-- Linen shirt -->
    <ellipse cx="0" cy="22" rx="11" ry="5" fill="#d8c8a8"/>
    <!-- COLLAR TURNED UP -->
    <path d="M11,12 L18,2 L20,12 Z" fill="#3a2818"/>
    <path d="M-11,12 L-18,2 L-20,12 Z" fill="#3a2818"/>

    <!-- Arms slightly stiff (rehearsing failure) -->
    <line x1="-18" y1="30" x2="-26" y2="80" stroke="url(#p15p1skin)" stroke-width="9" stroke-linecap="round"/>
    <line x1="18" y1="30" x2="26" y2="80" stroke="url(#p15p1skin)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-26" cy="80" rx="6" ry="5" fill="url(#p15p1skin)"/>
    <ellipse cx="26" cy="80" rx="6" ry="5" fill="url(#p15p1skin)"/>
    <!-- Brass gear ring -->
    <circle cx="-28" cy="84" r="1.4" fill="#ffd078" stroke="#7a4818" stroke-width="0.4" filter="url(#p15p1bloom)"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="-2" rx="16" ry="20" fill="url(#p15p1skin)"/>
    <!-- Sandy-brown hair -->
    <path d="M-14,-18 Q-10,-24 0,-26 Q10,-24 14,-18 L12,-10 Q6,-22 0,-22 Q-6,-22 -12,-10 Z" fill="#a87838"/>
    <!-- Freckles -->
    <g fill="#7a4818" opacity="0.65">
      <circle cx="-7" cy="0" r="0.55"/>
      <circle cx="-2" cy="-2" r="0.55"/>
      <circle cx="3" cy="2" r="0.55"/>
      <circle cx="7" cy="0" r="0.55"/>
    </g>
    <!-- Hazel eyes — wide, anxious -->
    <ellipse cx="-5" cy="-6" rx="2.4" ry="2" fill="#fff8e8"/>
    <circle cx="-5" cy="-5" r="1.4" fill="#7a4818"/>
    <circle cx="-5" cy="-5.5" r="0.55" fill="#0a0604"/>
    <ellipse cx="5" cy="-6" rx="2.4" ry="2" fill="#fff8e8"/>
    <circle cx="5" cy="-5" r="1.4" fill="#7a4818"/>
    <circle cx="5" cy="-5.5" r="0.55" fill="#0a0604"/>
    <!-- Brows raised, slightly furrowed (anxious) -->
    <path d="M-10,-12 L-3,-13" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M3,-13 L10,-12" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth: open, mid-stutter -->
    <ellipse cx="0" cy="6" rx="2" ry="3" fill="#3a1808"/>
  </g>

  <!-- ===== CLOCKMAKER at workbench in back of shop, half-turned ===== -->
  <g transform="translate(580 220)">
    <!-- Workbench front -->
    <rect x="-90" y="50" width="180" height="60" fill="#3a1808"/>
    <line x1="-90" y1="50" x2="90" y2="50" stroke="#a86838" stroke-width="0.55"/>
    <!-- Open clock on bench -->
    <rect x="-40" y="20" width="80" height="40" fill="#3a1808"/>
    <rect x="-36" y="24" width="72" height="34" fill="#1a0c04"/>
    <!-- Mechanism gears glimpsed -->
    <circle cx="-20" cy="40" r="7" fill="#a86838" opacity="0.85"/>
    <circle cx="-20" cy="40" r="5" fill="#5a3018"/>
    <circle cx="0" cy="40" r="9" fill="#a86838" opacity="0.85"/>
    <circle cx="0" cy="40" r="6" fill="#5a3018"/>
    <circle cx="20" cy="40" r="7" fill="#a86838" opacity="0.85"/>
    <circle cx="20" cy="40" r="5" fill="#5a3018"/>

    <!-- OIL LAMP behind clock -->
    <g transform="translate(60 0)">
      <ellipse cx="0" cy="0" rx="60" ry="80" fill="url(#p15p1lampGlow)" filter="url(#p15p1glow)"/>
      <rect x="-7" y="14" width="14" height="14" fill="#5a3018"/>
      <path d="M-6,14 L-4,-6 L-3,-18 L3,-18 L4,-6 L6,14 Z" fill="#ffd078" opacity="0.65"/>
      <ellipse cx="0" cy="-2" rx="2.4" ry="6" fill="#fff8e8" filter="url(#p15p1bloom)"/>
    </g>

    <!-- Clockmaker BODY (half-turned, hunched over bench) -->
    <path d="M-40,-30 L-50,50 L40,50 L30,-30 Z" fill="url(#p15p1clockMaker)"/>
    <line x1="-22" y1="0" x2="0" y2="0" stroke="#3a1808" stroke-width="0.55"/>

    <!-- Arms — one holding screwdriver, both at bench -->
    <line x1="-30" y1="-20" x2="-22" y2="20" stroke="#d8a878" stroke-width="9" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="14" y2="22" stroke="#d8a878" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-22" cy="20" rx="6" ry="4" fill="url(#p15p1skin)"/>
    <ellipse cx="14" cy="22" rx="6" ry="4" fill="url(#p15p1skin)"/>
    <!-- Screwdriver in right hand -->
    <line x1="14" y1="22" x2="22" y2="40" stroke="#5a3018" stroke-width="2"/>
    <line x1="22" y1="40" x2="22" y2="50" stroke="#a8a8a8" stroke-width="0.85"/>

    <!-- HEAD — half-turned toward Theodore (looking up) -->
    <ellipse cx="-22" cy="-44" rx="14" ry="18" fill="url(#p15p1skin)"/>
    <!-- Thinning brown hair -->
    <path d="M-32,-58 Q-26,-66 -22,-68 Q-18,-66 -12,-58 L-14,-50 Q-18,-62 -22,-62 Q-26,-62 -30,-50 Z" fill="#7a5028"/>
    <!-- Spectacles catching light -->
    <ellipse cx="-26" cy="-46" rx="4" ry="2.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <ellipse cx="-18" cy="-46" rx="4" ry="2.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <ellipse cx="-26" cy="-46" rx="2" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p15p1bloom)"/>
    <ellipse cx="-18" cy="-46" rx="2" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p15p1bloom)"/>
    <!-- Brows slightly furrowed (mild annoyance) -->
    <path d="M-30,-52 L-22,-53" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M-22,-53 L-14,-52" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — flat -->
    <path d="M-26,-38 L-18,-38" stroke="#3a1808" stroke-width="0.85" stroke-linecap="round"/>
  </g>

  <!-- JINK — invisible, tiny shape near baseboard moving toward back -->
  <g transform="translate(280 354)">
    <ellipse cx="0" cy="0" rx="3" ry="1.4" fill="#2ed078" opacity="0.55"/>
    <!-- Faint emerald trail -->
    <line x1="-12" y1="0" x2="0" y2="0" stroke="#3ad0a8" stroke-width="0.4" opacity="0.45" stroke-dasharray="1,2" filter="url(#p15p1bloom)"/>
  </g>

  <!-- DIALOG SFX TING-a-ling -->
  <g transform="translate(80 60)">
    <text x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#ffd078" font-style="italic" font-weight="700" filter="url(#p15p1bloom)" opacity="0.85">TING</text>
    <text x="50" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#ffd078" font-style="italic" font-weight="600" filter="url(#p15p1bloom)" opacity="0.75">a-ling</text>
  </g>

  <!-- DIALOG CLOCKMAKER (flat) -->
  <g transform="translate(620 130)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-40,18 L-56,32 L-34,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-70" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-70" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="500">"Shop's closed."</text>
  </g>

  <!-- DIALOG THEODORE (stuttering) -->
  <g transform="translate(280 130)">
    <ellipse cx="0" cy="0" rx="120" ry="36" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-50,30 L-66,50 L-44,32 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-110" y="-18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-110" y="-3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"I— yes, sir. Sorry, sir.</text>
    <text x="-110" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">I saw your light. I— wanted</text>
    <text x="-110" y="25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">to ask about—"</text>
  </g>

  <!-- DIALOG THEODORE (finding it) -->
  <g transform="translate(280 240)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-30,18 L-44,32 L-24,20 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-90" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-90" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">"—about your work."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,310 Q180,308 360,312 Q540,314 742,310"/>
  </g>
</svg>
