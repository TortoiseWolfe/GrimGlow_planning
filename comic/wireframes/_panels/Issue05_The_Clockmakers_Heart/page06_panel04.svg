<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 249" width="742" height="249">
  <title>Issue 5 — Page 6 — Panel 4: Wren descends brickwork toward entry crack — engineer on approach</title>
  <desc>28mm widescreen tracking. Wren mid-descent on stock brick facade. Mountaineer movement, mortar gaps + pipe brackets as holds. Tool kit on back. Copper suit blends with sooty brick. Below: shop window edge. Destination: dark crack where window frame meets brickwork. Amber from below catches underside of suit.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p6p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#3a4858"/>
    </linearGradient>
    <linearGradient id="p6p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p6p4windowEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <linearGradient id="p6p4suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p6p4toolKit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="p6p4amberFromBelow" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p6p4copperSeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p6p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p6p4glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <!-- DUSK SKY — top sliver -->
  <rect width="742" height="40" fill="url(#p6p4sky)"/>

  <!-- BRICK FACADE — fills frame -->
  <rect x="0" y="40" width="742" height="209" fill="url(#p6p4brick)"/>
  <!-- Brick courses (regular ledges at fairy scale) -->
  <g stroke="#3a1808" stroke-width="0.7" opacity="0.7">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="100" x2="742" y2="100"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="140" x2="742" y2="140"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
  </g>
  <!-- Vertical mortar gaps offset -->
  <g stroke="#3a1808" stroke-width="0.55" opacity="0.55">
    <line x1="80" y1="40" x2="80" y2="60"/>
    <line x1="200" y1="40" x2="200" y2="60"/>
    <line x1="320" y1="40" x2="320" y2="60"/>
    <line x1="440" y1="40" x2="440" y2="60"/>
    <line x1="560" y1="40" x2="560" y2="60"/>
    <line x1="660" y1="40" x2="660" y2="60"/>
    <line x1="40" y1="60" x2="40" y2="80"/>
    <line x1="160" y1="60" x2="160" y2="80"/>
    <line x1="280" y1="60" x2="280" y2="80"/>
    <line x1="400" y1="60" x2="400" y2="80"/>
    <line x1="520" y1="60" x2="520" y2="80"/>
    <line x1="640" y1="60" x2="640" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="100"/>
    <line x1="220" y1="80" x2="220" y2="100"/>
    <line x1="340" y1="80" x2="340" y2="100"/>
    <line x1="460" y1="80" x2="460" y2="100"/>
    <line x1="580" y1="80" x2="580" y2="100"/>
    <line x1="40" y1="100" x2="40" y2="120"/>
    <line x1="160" y1="100" x2="160" y2="120"/>
    <line x1="280" y1="100" x2="280" y2="120"/>
    <line x1="400" y1="100" x2="400" y2="120"/>
    <line x1="520" y1="100" x2="520" y2="120"/>
    <line x1="640" y1="100" x2="640" y2="120"/>
    <line x1="100" y1="120" x2="100" y2="140"/>
    <line x1="220" y1="120" x2="220" y2="140"/>
    <line x1="340" y1="120" x2="340" y2="140"/>
    <line x1="460" y1="120" x2="460" y2="140"/>
    <line x1="580" y1="120" x2="580" y2="140"/>
    <line x1="40" y1="140" x2="40" y2="160"/>
    <line x1="160" y1="140" x2="160" y2="160"/>
    <line x1="280" y1="140" x2="280" y2="160"/>
    <line x1="400" y1="140" x2="400" y2="160"/>
    <line x1="520" y1="140" x2="520" y2="160"/>
    <line x1="640" y1="140" x2="640" y2="160"/>
    <line x1="100" y1="160" x2="100" y2="180"/>
    <line x1="220" y1="160" x2="220" y2="180"/>
    <line x1="340" y1="160" x2="340" y2="180"/>
    <line x1="460" y1="160" x2="460" y2="180"/>
    <line x1="580" y1="160" x2="580" y2="180"/>
  </g>

  <!-- WARM amber from below catching brick + suit -->
  <rect width="742" height="80" y="160" fill="url(#p6p4amberFromBelow)"/>

  <!-- SHOP WINDOW edge at bottom (top of plate glass + dark green frame) -->
  <rect x="0" y="220" width="742" height="29" fill="url(#p6p4windowEdge)"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#0a1808" stroke-width="0.85"/>
  <!-- Window glass amber visible just below frame -->
  <ellipse cx="371" cy="240" rx="380" ry="14" fill="#ffd078" opacity="0.7" filter="url(#p6p4bloom)"/>

  <!-- ===== ENTRY CRACK — dark gap where window frame meets brickwork ===== -->
  <g transform="translate(540 200)">
    <!-- The crack itself — irregular dark slot -->
    <path d="M-12,-10 L-10,-2 L-14,4 L-10,14 L-14,20 L-8,30 L8,28 L10,18 L14,8 L8,-2 L12,-12 L-12,-10 Z" fill="#0a0604"/>
    <!-- Crack edge highlights -->
    <path d="M-12,-10 L-10,-2 L-14,4 L-10,14 L-14,20" stroke="#3a1808" stroke-width="0.4" fill="none" opacity="0.85"/>
    <!-- Faint warm leak from crack interior -->
    <ellipse cx="0" cy="10" rx="20" ry="14" fill="#7a3818" opacity="0.55" filter="url(#p6p4bloom)"/>
  </g>

  <!-- IRON PIPE BRACKET on facade (Wren uses for handhold) -->
  <g transform="translate(440 130)">
    <rect x="-3" y="-4" width="14" height="8" fill="#3a3030"/>
    <line x1="-3" y1="0" x2="11" y2="0" stroke="#1a1414" stroke-width="0.55"/>
    <!-- Pipe extending up -->
    <rect x="2" y="-30" width="6" height="26" fill="#3a3030"/>
  </g>

  <!-- ===== WREN — descending mid-frame ===== -->
  <g transform="translate(420 165)">
    <!-- Copper seam halo (subtle, since suit blends with brick) -->
    <ellipse cx="0" cy="0" rx="22" ry="22" fill="url(#p6p4copperSeam)" filter="url(#p6p4glow)" opacity="0.45"/>

    <!-- Lower body — descending pose -->
    <ellipse cx="-4" cy="32" rx="3.4" ry="1.4" fill="#0a0408"/>
    <ellipse cx="4" cy="32" rx="3.4" ry="1.4" fill="#0a0408"/>
    <!-- Trousers -->
    <rect x="-7" y="6" width="6" height="26" fill="url(#p6p4suit)"/>
    <rect x="1" y="6" width="6" height="26" fill="url(#p6p4suit)"/>
    <ellipse cx="-4" cy="22" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="4" cy="22" rx="4" ry="1" fill="#5a4838" opacity="0.6"/>

    <!-- Torso, leaning into wall -->
    <path d="M-9,6 L-9,-22 L9,-22 L9,6 Z" fill="url(#p6p4suit)"/>
    <line x1="-7" y1="-12" x2="7" y2="-12" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p6p4bloom)"/>
    <ellipse cx="-9" cy="-22" rx="3" ry="2" fill="#1a0c04" opacity="0.85"/>

    <!-- TOOL KIT secured to back -->
    <rect x="-9" y="-18" width="18" height="14" fill="url(#p6p4toolKit)" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#1a0c04" stroke-width="0.4"/>
    <!-- Strap visible at shoulders -->
    <line x1="-9" y1="-22" x2="-12" y2="-12" stroke="#1a0c04" stroke-width="1.4"/>
    <line x1="9" y1="-22" x2="12" y2="-12" stroke="#1a0c04" stroke-width="1.4"/>

    <!-- Shoulders -->
    <path d="M-9,-22 Q-6,-30 -2,-32 Q6,-32 9,-26 L9,-22 Z" fill="url(#p6p4suit)"/>

    <!-- LEFT arm reaching DOWN to next handhold -->
    <path d="M-9,-22 L-12,-6 L-16,8 L-14,12 L-10,8 L-6,-12 Z" fill="url(#p6p4suit)"/>
    <ellipse cx="-15" cy="10" rx="3" ry="1.6" fill="url(#p6p4suit)"/>
    <ellipse cx="-15" cy="11" rx="1.6" ry="0.85" fill="#fff8e8" opacity="0.7" filter="url(#p6p4bloom)"/>

    <!-- RIGHT arm reaching UP holding mortar gap above -->
    <path d="M9,-22 L14,-32 L16,-40 L12,-40 L10,-30 L6,-22 Z" fill="url(#p6p4suit)"/>
    <ellipse cx="14" cy="-40" rx="3" ry="1.6" fill="url(#p6p4suit)"/>
    <ellipse cx="14" cy="-41" rx="1.6" ry="0.85" fill="#fff8e8" opacity="0.7" filter="url(#p6p4bloom)"/>

    <!-- Head — looking down toward entry crack -->
    <ellipse cx="0" cy="-40" rx="5" ry="6" fill="#a86838"/>
    <ellipse cx="0" cy="-46" rx="3" ry="2" fill="#0a0604"/>
    <ellipse cx="-2" cy="-39" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-39" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-39" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-39" r="0.4" fill="#0a0604"/>
    <path d="M-3,-32 L3,-32" stroke="#3a1808" stroke-width="0.55"/>

    <!-- Subtle warm light catching underside (amber from below) -->
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="#ffd078" opacity="0.55" filter="url(#p6p4bloom)"/>
  </g>

  <!-- WREN comms (top-left) -->
  <g>
    <rect x="14" y="14" width="320" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Approaching entry. West side of window frame.</text>

  <!-- SABLE response -->
  <g>
    <rect x="14" y="56" width="280" height="32" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE ((comms))</text>
  <text x="22" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">You're clear. Take your time.</text>

  <!-- WREN reply -->
  <g>
    <rect x="540" y="56" width="190" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="548" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="548" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">I intend to.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
