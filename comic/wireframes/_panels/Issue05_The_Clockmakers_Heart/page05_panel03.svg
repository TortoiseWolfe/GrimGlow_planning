<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 5 — Panel 3: Jink lands on sign bracket — recon position — sash window above visible</title>
  <desc>35mm wide. Jink touches down on iron sign bracket projecting from brickwork. Wings folding, emerald glow dimming. Painted timber sign beside as wall. Below: shop window amber. Above-right: dark first-floor sash window with gap at bottom (Thresh's overwatch).</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p5p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#3a4858"/>
    </linearGradient>
    <linearGradient id="p5p3brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p5p3signTimber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="p5p3iron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1414"/>
    </linearGradient>
    <linearGradient id="p5p3suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a8848"/>
    </linearGradient>
    <radialGradient id="p5p3wingFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a8848" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p5p3windowAmber" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p5p3glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- DUSK SKY top portion -->
  <rect width="742" height="60" fill="url(#p5p3sky)"/>

  <!-- BRICK FACADE -->
  <rect x="0" y="60" width="742" height="304" fill="url(#p5p3brick)"/>
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.6">
    <path d="M0,80 Q160,82 320,78 Q500,76 742,80"/>
    <path d="M0,120 Q160,118 320,122 Q500,124 742,120"/>
    <path d="M0,160 Q160,162 320,158 Q500,156 742,160"/>
    <path d="M0,200 Q160,198 320,202 Q500,204 742,200"/>
    <path d="M0,240 Q160,242 320,238 Q500,236 742,240"/>
    <path d="M0,280 Q160,278 320,282 Q500,284 742,280"/>
    <path d="M0,320 Q160,322 320,318 Q500,316 742,320"/>
    <path d="M0,360 Q160,358 320,362 Q500,364 742,360"/>
  </g>
  <g stroke="#0a0604" stroke-width="0.4" opacity="0.5">
    <line x1="80" y1="60" x2="80" y2="80"/>
    <line x1="200" y1="80" x2="200" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="160"/>
    <line x1="280" y1="160" x2="280" y2="200"/>
    <line x1="160" y1="200" x2="160" y2="240"/>
    <line x1="220" y1="240" x2="220" y2="280"/>
    <line x1="380" y1="280" x2="380" y2="320"/>
    <line x1="540" y1="60" x2="540" y2="80"/>
    <line x1="620" y1="120" x2="620" y2="160"/>
    <line x1="660" y1="200" x2="660" y2="240"/>
    <line x1="600" y1="280" x2="600" y2="320"/>
  </g>

  <!-- WARM amber leak from below (shop window) -->
  <rect width="742" height="80" y="284" fill="url(#p5p3windowAmber)"/>

  <!-- ===== FIRST-FLOOR SASH WINDOW (top-right area, dark, curtains drawn) ===== -->
  <rect x="540" y="100" width="80" height="100" fill="#1a1410"/>
  <rect x="544" y="104" width="72" height="92" fill="#0a0604"/>
  <!-- Window frame -->
  <rect x="540" y="100" width="80" height="100" fill="none" stroke="#3a2818" stroke-width="1.4"/>
  <line x1="580" y1="100" x2="580" y2="200" stroke="#3a2818" stroke-width="0.85"/>
  <line x1="540" y1="148" x2="620" y2="148" stroke="#3a2818" stroke-width="0.85"/>
  <!-- Curtains drawn (faint amber glow leaking through edges) -->
  <rect x="544" y="104" width="36" height="92" fill="#3a2828" opacity="0.7"/>
  <rect x="582" y="104" width="36" height="92" fill="#3a2828" opacity="0.7"/>
  <!-- GAP at bottom sash — slight opening -->
  <rect x="544" y="186" width="72" height="6" fill="#0a0604"/>
  <line x1="544" y1="190" x2="616" y2="190" stroke="#7a5028" stroke-width="0.55" opacity="0.85"/>
  <!-- Faint warm leak through gap -->
  <ellipse cx="580" cy="192" rx="38" ry="5" fill="#ffd078" opacity="0.35" filter="url(#p5p3bloom)"/>
  <!-- Sill -->
  <rect x="536" y="200" width="88" height="4" fill="#3a2818"/>

  <!-- ===== IRON SIGN BRACKET — horizontal arm with painted timber sign ===== -->
  <!-- Bracket (iron, decorative scrolling supports) -->
  <g transform="translate(280 220)">
    <!-- Vertical mounting plate against brick -->
    <rect x="-4" y="-30" width="6" height="80" fill="url(#p5p3iron)"/>
    <!-- Horizontal arm -->
    <rect x="2" y="-3" width="160" height="6" fill="url(#p5p3iron)"/>
    <!-- Decorative scroll support beneath -->
    <path d="M2,3 Q40,30 80,30" fill="none" stroke="#3a3030" stroke-width="2.4"/>
    <path d="M2,3 Q60,40 100,30 L80,30" fill="none" stroke="#3a3030" stroke-width="1.6"/>
    <!-- Bolts holding bracket to brick -->
    <circle cx="-1" cy="-20" r="1.4" fill="#1a1414"/>
    <circle cx="-1" cy="40" r="1.4" fill="#1a1414"/>
    <!-- Sign hanging from bracket -->
    <rect x="20" y="3" width="140" height="40" fill="url(#p5p3signTimber)" stroke="#1a0c04" stroke-width="0.7"/>
    <!-- Sign text — period-appropriate -->
    <text x="90" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#ffd078" font-weight="700" font-style="italic" filter="url(#p5p3bloom)" opacity="0.85">HOSKINS</text>
    <text x="90" y="36" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#ffd078" font-style="italic" opacity="0.75">&amp; SONS · HOROLOGY</text>
    <!-- Sign hangers -->
    <line x1="40" y1="3" x2="40" y2="-2" stroke="#1a1414" stroke-width="1.2"/>
    <line x1="140" y1="3" x2="140" y2="-2" stroke="#1a1414" stroke-width="1.2"/>
  </g>

  <!-- ===== JINK LANDING on bracket arm ===== -->
  <g transform="translate(220 218)">
    <!-- Wing fold motion blur -->
    <ellipse cx="0" cy="0" rx="34" ry="20" fill="url(#p5p3wingFade)" filter="url(#p5p3glow)" opacity="0.55"/>
    <!-- Wings FOLDING — partial extension -->
    <g opacity="0.7">
      <path d="M-3,-2 Q-12,-12 -18,-8 Q-14,-2 -6,0 Z" fill="#2ed078" opacity="0.45" filter="url(#p5p3bloom)"/>
      <path d="M3,-2 Q12,-12 18,-8 Q14,-2 6,0 Z" fill="#2ed078" opacity="0.45" filter="url(#p5p3bloom)"/>
      <g stroke="#fff8e8" stroke-width="0.4" opacity="0.55" filter="url(#p5p3bloom)" fill="none">
        <line x1="-6" y1="-2" x2="-16" y2="-8"/>
        <line x1="6" y1="-2" x2="16" y2="-8"/>
      </g>
    </g>
    <!-- Body crouched on bracket (knees bent, landing pose) -->
    <ellipse cx="-3" cy="14" rx="3" ry="1.4" fill="#0a0408"/>
    <ellipse cx="3" cy="14" rx="3" ry="1.4" fill="#0a0408"/>
    <path d="M-7,12 L-9,2 L-3,2 L-3,12 Z" fill="url(#p5p3suit)"/>
    <path d="M7,12 L9,2 L3,2 L3,12 Z" fill="url(#p5p3suit)"/>
    <path d="M-9,2 L-9,-12 L9,-12 L9,2 Z" fill="url(#p5p3suit)"/>
    <ellipse cx="0" cy="-2" rx="3" ry="1" fill="#1a0c04" opacity="0.7"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#fff8e8" stroke-width="0.55" opacity="0.85" filter="url(#p5p3bloom)"/>
    <!-- Arms -->
    <path d="M-9,-12 L-14,-2 L-12,4 L-8,2 L-6,-6 Z" fill="url(#p5p3suit)"/>
    <path d="M9,-12 L14,-2 L12,4 L8,2 L6,-6 Z" fill="url(#p5p3suit)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-22" rx="5" ry="6.5" fill="#d8a878"/>
    <path d="M-5,-29 Q-3,-32 0,-32 Q3,-32 5,-29 L5,-25 Q2,-29 0,-29 Q-2,-29 -5,-25 Z" fill="#ffd078"/>
    <circle cx="-3" cy="-31" r="1.4" fill="#ffd078"/>
    <circle cx="3" cy="-30" r="1.6" fill="#ffd078"/>
    <ellipse cx="-2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="-2" cy="-22" r="0.4" fill="#0a0604"/>
    <ellipse cx="2" cy="-22" rx="0.85" ry="0.55" fill="#fff8e8"/>
    <circle cx="2" cy="-22" r="0.4" fill="#0a0604"/>
    <path d="M-3,-15 L3,-15" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Comm earpiece -->
    <circle cx="3" cy="-22" r="0.85" fill="#2ed078" filter="url(#p5p3bloom)" opacity="0.85"/>
  </g>

  <!-- JINK comms (top-left) -->
  <g>
    <rect x="14" y="14" width="200" height="34" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#2ed078" font-weight="700">JINK ((comms))</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Sign bracket is solid. Good perch.</text>

  <!-- JINK comms 2 -->
  <g>
    <rect x="430" y="14" width="298" height="40" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
    <polygon points="540,54 552,54 544,64" fill="white" stroke="#2ed078" stroke-width="0.85" stroke-dasharray="2 1"/>
    <line x1="540.5" y1="54" x2="551.5" y2="54" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="438" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#2ed078" font-weight="700">JINK ((comms))</text>
  <text x="438" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Window — gap at bottom sash. Thresh can squeeze through.</text>

  <!-- THRESH dry comms reply (bottom-right) -->
  <g>
    <rect x="540" y="316" width="190" height="34" rx="2" fill="white" stroke="#dc2030" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="548" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#dc2030" font-weight="700">THRESH ((comms, dry))</text>
  <text x="548" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Delightful.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,290 Q200,292 400,288 Q580,286 742,290"/>
  </g>
</svg>
