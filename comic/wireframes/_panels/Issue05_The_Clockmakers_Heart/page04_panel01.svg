<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 249" width="742" height="249">
  <title>Issue 5 — Page 4 — Panel 1: Rooftop transit — squad on flashing seam, Jink airborne above chimney pots</title>
  <desc>24mm wide widescreen establishing. Welsh slate landscape at fairy scale. Chimney pots as towers. Lead flashing seam path. Sable lead, Wren mid, Thresh rear with weapon. Jink banking on dragonfly wings between pots. Grey-gold overcast.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p4p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8b0b8"/>
      <stop offset="100%" stop-color="#c8b888"/>
    </linearGradient>
    <linearGradient id="p4p1slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6068"/>
      <stop offset="100%" stop-color="#3a4048"/>
    </linearGradient>
    <linearGradient id="p4p1terracotta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b86838"/>
      <stop offset="100%" stop-color="#7a3818"/>
    </linearGradient>
    <linearGradient id="p4p1leadFlash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8088"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p4p1silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dad5d0"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p4p1copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p4p1crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2030"/>
      <stop offset="100%" stop-color="#8a0828"/>
    </linearGradient>
    <linearGradient id="p4p1emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed078"/>
      <stop offset="100%" stop-color="#0a8848"/>
    </linearGradient>
    <radialGradient id="p4p1emeraldTrail" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ed078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a8848" stop-opacity="0"/>
    </radialGradient>
    <filter id="p4p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p4p1glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <!-- SKY -->
  <rect width="742" height="160" fill="url(#p4p1sky)"/>

  <!-- DISTANT ROOFLINE haze -->
  <g opacity="0.45" fill="#5a6068">
    <path d="M0,140 L0,160 L60,160 L60,120 L120,120 L120,140 L180,140 L180,110 L240,110 L240,130 L320,130 L320,108 L380,108 L380,135 L460,135 L460,118 L540,118 L540,128 L620,128 L620,112 L680,112 L680,138 L742,138 L742,160 Z"/>
  </g>

  <!-- CHIMNEY SMOKE columns drifting -->
  <g opacity="0.4" fill="#5a4838">
    <ellipse cx="120" cy="60" rx="34" ry="14"/>
    <ellipse cx="140" cy="40" rx="30" ry="12"/>
    <ellipse cx="160" cy="22" rx="26" ry="10"/>
    <ellipse cx="380" cy="50" rx="36" ry="14"/>
    <ellipse cx="400" cy="30" rx="32" ry="12"/>
    <ellipse cx="420" cy="14" rx="28" ry="10"/>
    <ellipse cx="600" cy="60" rx="34" ry="14"/>
    <ellipse cx="620" cy="42" rx="30" ry="12"/>
    <ellipse cx="640" cy="22" rx="26" ry="10"/>
  </g>

  <!-- SLATE TILE LANDSCAPE — foreground rooftop, fills lower half -->
  <rect x="0" y="160" width="742" height="89" fill="url(#p4p1slate)"/>
  <!-- Tile rows -->
  <g stroke="#1a1c20" stroke-width="0.55" opacity="0.65">
    <path d="M0,180 Q120,182 240,178 Q380,176 500,180 Q620,182 742,178"/>
    <path d="M0,200 Q120,198 240,202 Q380,204 500,200 Q620,198 742,202"/>
    <path d="M0,220 Q120,222 240,218 Q380,216 500,222 Q620,224 742,218"/>
    <path d="M0,240 Q120,238 240,242 Q380,244 500,240 Q620,238 742,242"/>
  </g>
  <!-- Slate seams -->
  <g stroke="#1a1c20" stroke-width="0.4" opacity="0.55">
    <line x1="40" y1="160" x2="40" y2="180"/>
    <line x1="80" y1="180" x2="80" y2="200"/>
    <line x1="120" y1="160" x2="120" y2="180"/>
    <line x1="160" y1="180" x2="160" y2="200"/>
    <line x1="200" y1="160" x2="200" y2="180"/>
    <line x1="240" y1="180" x2="240" y2="200"/>
    <line x1="280" y1="160" x2="280" y2="180"/>
    <line x1="320" y1="180" x2="320" y2="200"/>
    <line x1="360" y1="160" x2="360" y2="180"/>
    <line x1="400" y1="180" x2="400" y2="200"/>
    <line x1="440" y1="160" x2="440" y2="180"/>
    <line x1="480" y1="180" x2="480" y2="200"/>
    <line x1="520" y1="160" x2="520" y2="180"/>
    <line x1="560" y1="180" x2="560" y2="200"/>
    <line x1="600" y1="160" x2="600" y2="180"/>
    <line x1="640" y1="180" x2="640" y2="200"/>
    <line x1="680" y1="160" x2="680" y2="180"/>
    <line x1="720" y1="180" x2="720" y2="200"/>
  </g>

  <!-- LEAD FLASHING SEAM — winding path the squad walks along -->
  <path d="M0,210 Q160,205 320,210 Q480,215 640,208 L742,212" fill="none" stroke="url(#p4p1leadFlash)" stroke-width="14" stroke-linecap="round"/>
  <path d="M0,210 Q160,205 320,210 Q480,215 640,208 L742,212" fill="none" stroke="#a8b0b8" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>

  <!-- ===== CHIMNEY POTS as towers ===== -->
  <!-- Left chimney stack (large, near foreground) -->
  <g transform="translate(120 80)">
    <rect x="-18" y="40" width="36" height="50" fill="#3a2818"/>
    <line x1="-18" y1="60" x2="18" y2="60" stroke="#1a0c04" stroke-width="0.55"/>
    <line x1="-18" y1="80" x2="18" y2="80" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Chimney pot (terracotta cylinder) -->
    <ellipse cx="0" cy="-20" rx="14" ry="5" fill="#b86838"/>
    <rect x="-14" y="-20" width="28" height="64" fill="url(#p4p1terracotta)"/>
    <ellipse cx="0" cy="44" rx="14" ry="5" fill="#7a3818"/>
    <line x1="-14" y1="-10" x2="14" y2="-10" stroke="#5a2818" stroke-width="0.55"/>
    <line x1="-14" y1="20" x2="14" y2="20" stroke="#5a2818" stroke-width="0.55"/>
    <line x1="-14" y1="36" x2="14" y2="36" stroke="#5a2818" stroke-width="0.55"/>
    <!-- Smoke from this pot -->
    <ellipse cx="0" cy="-26" rx="9" ry="2" fill="#5a4838" opacity="0.6"/>
  </g>

  <!-- Mid chimney stack -->
  <g transform="translate(380 90)">
    <rect x="-22" y="34" width="44" height="56" fill="#3a2818"/>
    <line x1="-22" y1="60" x2="22" y2="60" stroke="#1a0c04" stroke-width="0.55"/>
    <ellipse cx="-12" cy="-10" rx="9" ry="3" fill="#b86838"/>
    <rect x="-21" y="-10" width="18" height="44" fill="url(#p4p1terracotta)"/>
    <ellipse cx="12" cy="-22" rx="11" ry="4" fill="#b86838"/>
    <rect x="1" y="-22" width="22" height="56" fill="url(#p4p1terracotta)"/>
    <line x1="-21" y1="0" x2="-3" y2="0" stroke="#5a2818" stroke-width="0.4"/>
    <line x1="1" y1="-12" x2="23" y2="-12" stroke="#5a2818" stroke-width="0.4"/>
    <line x1="1" y1="6" x2="23" y2="6" stroke="#5a2818" stroke-width="0.4"/>
  </g>

  <!-- Right chimney stack with IRON COWL -->
  <g transform="translate(620 100)">
    <rect x="-18" y="24" width="36" height="50" fill="#3a2818"/>
    <ellipse cx="0" cy="-12" rx="14" ry="5" fill="#b86838"/>
    <rect x="-14" y="-12" width="28" height="36" fill="url(#p4p1terracotta)"/>
    <!-- Iron cowl on top -->
    <ellipse cx="0" cy="-18" rx="16" ry="3" fill="#3a3030"/>
    <path d="M-16,-18 L-16,-26 L16,-26 L16,-18 Z" fill="#5a4030"/>
    <ellipse cx="0" cy="-26" rx="14" ry="2.4" fill="#3a3030"/>
    <!-- H-shape vents -->
    <line x1="-9" y1="-22" x2="9" y2="-22" stroke="#1a1c20" stroke-width="0.7"/>
    <line x1="-5" y1="-26" x2="-5" y2="-18" stroke="#1a1c20" stroke-width="0.55"/>
    <line x1="5" y1="-26" x2="5" y2="-18" stroke="#1a1c20" stroke-width="0.55"/>
  </g>

  <!-- Distant smaller chimney pots -->
  <g transform="translate(240 130)">
    <rect x="-7" y="0" width="14" height="22" fill="#3a2818"/>
    <ellipse cx="0" cy="-7" rx="6" ry="2" fill="#b86838"/>
    <rect x="-6" y="-7" width="12" height="14" fill="url(#p4p1terracotta)"/>
  </g>
  <g transform="translate(500 130)">
    <rect x="-7" y="0" width="14" height="22" fill="#3a2818"/>
    <ellipse cx="0" cy="-7" rx="6" ry="2" fill="#b86838"/>
    <rect x="-6" y="-7" width="12" height="14" fill="url(#p4p1terracotta)"/>
  </g>
  <g transform="translate(680 132)">
    <rect x="-6" y="0" width="12" height="20" fill="#3a2818"/>
    <ellipse cx="0" cy="-5" rx="5" ry="1.6" fill="#b86838"/>
    <rect x="-5" y="-5" width="10" height="12" fill="url(#p4p1terracotta)"/>
  </g>

  <!-- ===== JINK AIRBORNE — banking between chimney pots ===== -->
  <g transform="translate(280 90)">
    <!-- Wing trail behind -->
    <ellipse cx="-30" cy="0" rx="40" ry="12" fill="url(#p4p1emeraldTrail)" filter="url(#p4p1glow)" opacity="0.45"/>
    <!-- Body in flight (slight banking lean) -->
    <ellipse cx="0" cy="0" rx="3.4" ry="6" fill="url(#p4p1emerald)" transform="rotate(-15)"/>
    <!-- Head -->
    <ellipse cx="3" cy="-7" rx="2.4" ry="3" fill="#d8a878"/>
    <!-- Curls -->
    <path d="M0,-10 Q3,-12 6,-10 L5,-9 Q3,-10 1,-9 Z" fill="#ffd078"/>
    <!-- Limbs streamlined -->
    <line x1="-2" y1="2" x2="-7" y2="6" stroke="#0a8848" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="2" y1="2" x2="7" y2="6" stroke="#0a8848" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="-1" y1="-3" x2="-5" y2="-2" stroke="#0a8848" stroke-width="2" stroke-linecap="round"/>
    <line x1="1" y1="-3" x2="5" y2="-2" stroke="#0a8848" stroke-width="2" stroke-linecap="round"/>
    <!-- DRAGONFLY WINGS — translucent emerald lattice -->
    <g opacity="0.85">
      <!-- Upper wings -->
      <path d="M-3,-3 Q-22,-18 -34,-12 Q-26,-2 -8,0 Z" fill="#2ed078" opacity="0.45" filter="url(#p4p1bloom)"/>
      <path d="M3,-3 Q22,-18 34,-12 Q26,-2 8,0 Z" fill="#2ed078" opacity="0.45" filter="url(#p4p1bloom)"/>
      <!-- Lower wings -->
      <path d="M-3,2 Q-20,12 -28,6 Q-22,-2 -6,0 Z" fill="#2ed078" opacity="0.4" filter="url(#p4p1bloom)"/>
      <path d="M3,2 Q20,12 28,6 Q22,-2 6,0 Z" fill="#2ed078" opacity="0.4" filter="url(#p4p1bloom)"/>
      <!-- Geometric lattice lines -->
      <g stroke="#fff8e8" stroke-width="0.4" opacity="0.85" filter="url(#p4p1bloom)" fill="none">
        <line x1="-8" y1="-2" x2="-30" y2="-12"/>
        <line x1="-6" y1="0" x2="-26" y2="-4"/>
        <line x1="-6" y1="2" x2="-22" y2="6"/>
        <line x1="8" y1="-2" x2="30" y2="-12"/>
        <line x1="6" y1="0" x2="26" y2="-4"/>
        <line x1="6" y1="2" x2="22" y2="6"/>
      </g>
    </g>
    <!-- Prismatic trail -->
    <g opacity="0.65" filter="url(#p4p1bloom)">
      <circle cx="-20" cy="0" r="1" fill="#fff8e8"/>
      <circle cx="-26" cy="2" r="0.85" fill="#a8c0ff"/>
      <circle cx="-32" cy="-2" r="0.7" fill="#ffd078"/>
      <circle cx="-38" cy="4" r="0.55" fill="#fff8e8"/>
    </g>
  </g>

  <!-- ===== SQUAD on lead flashing — moving right-to-left or staggered ===== -->
  <!-- SABLE leading (forward-most, slightly larger) -->
  <g transform="translate(440 196)">
    <ellipse cx="-2" cy="14" rx="2.4" ry="1" fill="#0a0408"/>
    <ellipse cx="2" cy="14" rx="2.4" ry="1" fill="#0a0408"/>
    <rect x="-3" y="2" width="3" height="12" fill="url(#p4p1silver)"/>
    <rect x="0" y="2" width="3" height="12" fill="url(#p4p1silver)"/>
    <path d="M-5,2 L-5,-10 L5,-10 L5,2 Z" fill="url(#p4p1silver)"/>
    <ellipse cx="5" cy="-10" rx="2" ry="1.4" fill="#3a3038"/>
    <line x1="-3" y1="-4" x2="3" y2="-4" stroke="#a8c0ff" stroke-width="0.4" opacity="0.85" filter="url(#p4p1bloom)"/>
    <ellipse cx="0" cy="-15" rx="3" ry="3.6" fill="#7a4838"/>
    <ellipse cx="0" cy="-19" rx="2.4" ry="1" fill="#e0d8d0"/>
    <!-- Comm earpiece glow -->
    <circle cx="2" cy="-15" r="0.7" fill="#a8c0ff" opacity="0.85" filter="url(#p4p1bloom)"/>
  </g>

  <!-- WREN behind Sable -->
  <g transform="translate(390 198)">
    <ellipse cx="-2" cy="14" rx="2.4" ry="1" fill="#0a0408"/>
    <ellipse cx="2" cy="14" rx="2.4" ry="1" fill="#0a0408"/>
    <rect x="-3" y="2" width="3" height="12" fill="url(#p4p1copper)"/>
    <rect x="0" y="2" width="3" height="12" fill="url(#p4p1copper)"/>
    <path d="M-5,2 L-5,-10 L5,-10 L5,2 Z" fill="url(#p4p1copper)"/>
    <ellipse cx="-5" cy="-10" rx="2" ry="1.4" fill="#1a0c04"/>
    <line x1="-3" y1="-4" x2="3" y2="-4" stroke="#ffd078" stroke-width="0.4" opacity="0.85" filter="url(#p4p1bloom)"/>
    <!-- Tool kit (small box held against side) -->
    <rect x="4" y="0" width="5" height="6" fill="#5a3828" stroke="#a86838" stroke-width="0.4"/>
    <ellipse cx="0" cy="-15" rx="3" ry="3.6" fill="#a86838"/>
    <ellipse cx="0" cy="-19" rx="2" ry="1.4" fill="#0a0604"/>
    <circle cx="2" cy="-15" r="0.7" fill="#ffd078" opacity="0.85" filter="url(#p4p1bloom)"/>
  </g>

  <!-- THRESH rear -->
  <g transform="translate(340 200)">
    <ellipse cx="-2" cy="14" rx="2.4" ry="1" fill="#0a0408"/>
    <ellipse cx="2" cy="14" rx="2.4" ry="1" fill="#0a0408"/>
    <rect x="-3" y="2" width="3" height="12" fill="url(#p4p1crimson)"/>
    <rect x="0" y="2" width="3" height="12" fill="url(#p4p1crimson)"/>
    <path d="M-6,2 L-6,-10 L6,-10 L6,2 Z" fill="url(#p4p1crimson)"/>
    <ellipse cx="-6" cy="-10" rx="2.4" ry="1.6" fill="#5a0818"/>
    <!-- Weapon ready -->
    <rect x="6" y="-8" width="9" height="2" fill="#3a3030"/>
    <rect x="14" y="-9" width="2" height="3" fill="#1a1a1a"/>
    <ellipse cx="0" cy="-15" rx="3" ry="3.4" fill="#a86838"/>
    <ellipse cx="0" cy="-19" rx="2" ry="1" fill="#c84838"/>
    <circle cx="2" cy="-15" r="0.7" fill="#dc2030" opacity="0.85" filter="url(#p4p1bloom)"/>
  </g>

  <!-- JINK comms dialogue (top-left radio crackle) -->
  <g>
    <rect x="14" y="14" width="320" height="34" rx="2" fill="white" stroke="#2ed078" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#2ed078" font-weight="700">JINK ((comms))</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Route clear to second chimney. Turn west at the iron cowl.</text>

  <!-- SABLE response -->
  <g>
    <rect x="600" y="14" width="130" height="34" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="608" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE ((comms))</text>
  <text x="608" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Copy.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
