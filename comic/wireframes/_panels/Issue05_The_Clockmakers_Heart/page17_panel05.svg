<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 17 — Panel 5: Wren retreats with stolen gear on her back — backward glance at the engineering — Sable's sixty seconds</title>
  <desc>50mm fairy-scale. Wren moves back through mechanism, ducking gear tooth. Copper-gold schematic at wrist. Stolen precision gear secured to back with copper wire — teeth perfect, machining flawless. Mission focus + lingering backward glance at the engineering. Dialog: WREN sub-whisper into comms: Package secured. Extracting. / SABLE through earpiece: Copy. Theodore, you have sixty seconds to exit.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p17p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p17p5brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p17p5brassWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p17p5suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p17p5skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p17p5stolen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <radialGradient id="p17p5holo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p17p5amber" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <filter id="p17p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p17p5glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p17p5bg)"/>
  <rect width="366" height="364" fill="url(#p17p5amber)"/>

  <!-- ROTATING GEAR overhead (Wren ducking under tooth) -->
  <g transform="translate(280 80)">
    <circle cx="0" cy="0" r="100" fill="url(#p17p5brass)"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1a0c04" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="14" fill="#1a0c04"/>
    <g stroke="#1a0c04" stroke-width="2" opacity="0.85">
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <line x1="-56" y1="-56" x2="56" y2="56"/>
      <line x1="56" y1="-56" x2="-56" y2="56"/>
    </g>
    <g fill="url(#p17p5brassWarm)">
      <rect x="-4" y="-108" width="8" height="8"/>
      <rect x="-4" y="100" width="8" height="8"/>
      <rect x="-108" y="-4" width="8" height="8"/>
      <rect x="100" y="-4" width="8" height="8"/>
      <g transform="rotate(45)"><rect x="-4" y="-108" width="8" height="8"/></g>
      <g transform="rotate(135)"><rect x="-4" y="-108" width="8" height="8"/></g>
    </g>
    <!-- Tooth descending toward Wren -->
    <rect x="-4" y="100" width="8" height="14" fill="url(#p17p5brassWarm)"/>
  </g>

  <!-- Distant target gear (now empty housing — visible behind, fainter) -->
  <g transform="translate(60 100)" opacity="0.45">
    <rect x="-30" y="-22" width="60" height="44" fill="#3a1808"/>
    <rect x="-26" y="-18" width="52" height="36" fill="#1a0c04"/>
    <!-- Substitute (rough) visible in housing -->
    <circle cx="0" cy="0" r="14" fill="url(#p17p5brass)"/>
    <circle cx="0" cy="0" r="9" fill="#5a3018"/>
  </g>

  <!-- BRASS PLATE — mid-frame, Wren's path -->
  <rect x="0" y="220" width="366" height="91" fill="url(#p17p5brassWarm)"/>
  <line x1="0" y1="220" x2="366" y2="220" stroke="#fff8e8" stroke-width="0.55" opacity="0.55" filter="url(#p17p5bloom)"/>
  <g stroke="#3a1808" stroke-width="0.4" opacity="0.65">
    <line x1="0" y1="250" x2="366" y2="252"/>
    <line x1="0" y1="280" x2="366" y2="278"/>
  </g>

  <!-- Steel shaft to step over -->
  <rect x="160" y="260" width="206" height="11" fill="#5a5858"/>
  <line x1="160" y1="260" x2="366" y2="260" stroke="#fff8e8" stroke-width="0.4" opacity="0.85" filter="url(#p17p5bloom)"/>

  <!-- Schematic path lines (faint, dashed, leading back) -->
  <g stroke="#ffaa48" stroke-width="0.55" fill="none" opacity="0.55" stroke-dasharray="3,3" filter="url(#p17p5bloom)">
    <path d="M280,200 Q200,210 120,225"/>
    <path d="M120,225 Q60,230 0,235"/>
  </g>

  <!-- ===== WREN — moving LEFT (retreating), GLANCING BACK ===== -->
  <g transform="translate(180 260)">
    <!-- Holographic schematic glow -->
    <circle cx="-22" cy="0" r="22" fill="url(#p17p5holo)" filter="url(#p17p5glow)"/>

    <!-- Body in motion, leaning LEFT (away from target), HEAD turned BACK to RIGHT -->
    <path d="M-6,-30 L-10,-10 L-14,30 L-2,32 L0,-10 Z" fill="url(#p17p5suit)"/>
    <path d="M2,-30 L6,-10 L8,32 L18,28 L14,-10 Z" fill="url(#p17p5suit)"/>
    <line x1="-6" y1="-20" x2="14" y2="-20" stroke="#ffaa48" stroke-width="0.55" opacity="0.85" filter="url(#p17p5bloom)"/>

    <!-- Shoulders -->
    <ellipse cx="-6" cy="-30" rx="4" ry="3" fill="url(#p17p5suit)"/>
    <ellipse cx="14" cy="-30" rx="4" ry="3" fill="url(#p17p5suit)"/>
    <!-- SCORCH MARK -->
    <ellipse cx="-6" cy="-30" rx="3" ry="2" fill="#1a0c04" opacity="0.7"/>

    <!-- ===== STOLEN PRECISION GEAR ON HER BACK ===== -->
    <g transform="translate(4 -10)">
      <!-- Halo around stolen gear -->
      <circle cx="0" cy="0" r="18" fill="#ffd078" opacity="0.45" filter="url(#p17p5glow)"/>
      <!-- The gear (precision, bright, perfect) -->
      <circle cx="0" cy="0" r="11" fill="url(#p17p5stolen)"/>
      <circle cx="0" cy="0" r="9" fill="#7a4818" opacity="0.55"/>
      <circle cx="0" cy="0" r="3" fill="#1a0c04"/>
      <!-- Fine teeth (perfect, even spacing) -->
      <g stroke="#5a3018" stroke-width="0.4">
        <line x1="0" y1="-11" x2="0" y2="-13"/>
        <line x1="0" y1="11" x2="0" y2="13"/>
        <line x1="-11" y1="0" x2="-13" y2="0"/>
        <line x1="11" y1="0" x2="13" y2="0"/>
        <line x1="-8" y1="-8" x2="-9" y2="-9"/>
        <line x1="8" y1="-8" x2="9" y2="-9"/>
        <line x1="-8" y1="8" x2="-9" y2="9"/>
        <line x1="8" y1="8" x2="9" y2="9"/>
      </g>
      <!-- Bright highlight (catches light beautifully) -->
      <ellipse cx="-4" cy="-4" rx="2" ry="1.4" fill="#fff8e8" opacity="0.85" filter="url(#p17p5bloom)"/>
      <!-- Copper wire securing -->
      <path d="M-11,0 Q0,-9 11,0" stroke="#c87a35" stroke-width="0.55" fill="none"/>
      <path d="M-11,0 Q0,9 11,0" stroke="#c87a35" stroke-width="0.55" fill="none"/>
      <line x1="-11" y1="0" x2="-15" y2="2" stroke="#c87a35" stroke-width="0.55"/>
      <line x1="11" y1="0" x2="15" y2="2" stroke="#c87a35" stroke-width="0.55"/>
    </g>

    <!-- Arms in motion -->
    <line x1="-6" y1="-26" x2="-22" y2="0" stroke="#7a4818" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="-22" cy="0" rx="3" ry="2" fill="url(#p17p5skin)"/>
    <!-- WRIST HOLO (active path-mapping) -->
    <g transform="translate(-22 0)">
      <circle cx="0" cy="0" r="6" fill="url(#p17p5holo)" filter="url(#p17p5glow)"/>
      <polygon points="-3,0 -1.4,-2.4 1.4,-2.4 3,0 1.4,2.4 -1.4,2.4" fill="none" stroke="#ffd078" stroke-width="0.55" opacity="0.85" filter="url(#p17p5bloom)"/>
      <circle cx="0" cy="0" r="1.4" fill="#fff8e8" filter="url(#p17p5bloom)"/>
    </g>

    <line x1="14" y1="-26" x2="22" y2="-2" stroke="#7a4818" stroke-width="3" stroke-linecap="round"/>

    <!-- Legs mid-stride -->
    <line x1="-6" y1="32" x2="-12" y2="48" stroke="#5a2818" stroke-width="2.4"/>
    <line x1="6" y1="32" x2="14" y2="48" stroke="#5a2818" stroke-width="2.4"/>

    <!-- HEAD turned BACK (looking right toward mechanism — backward glance at engineering) -->
    <ellipse cx="9" cy="-44" rx="6" ry="7" fill="url(#p17p5skin)"/>
    <!-- Hair UP bun + wild strands -->
    <ellipse cx="11" cy="-50" rx="3" ry="2" fill="#0a0604"/>
    <path d="M5,-44 Q-1,-40 -2,-36" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <path d="M14,-44 Q18,-40 16,-36" stroke="#0a0604" stroke-width="0.85" fill="none"/>
    <!-- Eyes — looking BACKWARD/RIGHT (lingering glance) -->
    <ellipse cx="11" cy="-44" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="13" cy="-44" r="1" fill="#0a0604"/>
    <!-- Brow — slightly raised (wonder mixed with mission) -->
    <path d="M7,-48 L13,-48" stroke="#0a0604" stroke-width="0.55" stroke-linecap="round"/>
    <!-- Mouth — slight curve, not quite smile -->
    <path d="M7,-38 L13,-38" stroke="#3a1808" stroke-width="0.4"/>
  </g>

  <!-- DIALOG WREN -->
  <g transform="translate(120 60)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#c87a35" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M30,18 L46,32 L36,20 Z" fill="#ffffff" stroke="#c87a35" stroke-width="1"/>
    <text x="-90" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-90" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"Package secured. Extracting."</text>
  </g>

  <!-- DIALOG SABLE through earpiece (dashed) -->
  <g transform="translate(180 320)">
    <ellipse cx="0" cy="0" rx="160" ry="22" fill="#ffffff" stroke="#5a606a" stroke-width="1" stroke-dasharray="2,2" opacity="0.85" filter="url(#balloonShadow)"/>
    <path d="M-40,-18 L-56,-32 L-44,-20 Z" fill="#ffffff" stroke="#5a606a" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="-150" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
    <text x="-150" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"Copy. Theodore, you have sixty seconds to exit."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,300 Q90,298 180,302 Q280,304 366,300"/>
  </g>
</svg>
