<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 311" width="366" height="311">
  <title>Issue 5 — Page 13 — Panel 2: Clockmaker's fingers working on escapement — screwdriver size of telegraph pole — Wren shape in shadow background</title>
  <desc>50mm fairy-scale. Foreground: enormous scarred callused fingers hold fine screwdriver between thumb and forefinger, adjusting tiny screw. Screwdriver size of telegraph pole. Background: dark shape on brass plate (Wren). Master craftsman's hands. Dialog: CLOCKMAKER muttering: Quarter turn... there. SFX: tick... tick... tick...</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p13p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p13p2hand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a5828"/>
    </linearGradient>
    <linearGradient id="p13p2steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a5858"/>
      <stop offset="50%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#5a5858"/>
    </linearGradient>
    <linearGradient id="p13p2brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p13p2amber" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <filter id="p13p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p13p2glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="311" fill="url(#p13p2bg)"/>
  <rect width="366" height="311" fill="url(#p13p2amber)"/>

  <!-- BRASS GEAR FRAME — left edge -->
  <circle cx="0" cy="180" r="80" fill="url(#p13p2brass)" opacity="0.85"/>
  <circle cx="0" cy="180" r="60" fill="none" stroke="#1a0c04" stroke-width="0.55"/>
  <!-- Right gear edge -->
  <circle cx="366" cy="200" r="100" fill="url(#p13p2brass)" opacity="0.85"/>
  <circle cx="366" cy="200" r="80" fill="none" stroke="#1a0c04" stroke-width="0.55"/>

  <!-- BRASS PLATE — bottom -->
  <rect x="0" y="240" width="366" height="71" fill="url(#p13p2brass)"/>
  <line x1="0" y1="240" x2="366" y2="240" stroke="#fff8e8" stroke-width="0.55" opacity="0.55" filter="url(#p13p2bloom)"/>

  <!-- WREN — small dark shape in BACKGROUND on brass plate (face-down, barely visible) -->
  <g transform="translate(140 268)">
    <ellipse cx="0" cy="0" rx="32" ry="9" fill="#3a1808" opacity="0.85"/>
    <ellipse cx="-22" cy="-3" rx="6" ry="4" fill="#5a2818"/>
    <!-- Loose hair -->
    <path d="M-26,-3 Q-30,0 -28,4" stroke="#0a0604" stroke-width="0.55" fill="none"/>
  </g>

  <!-- ENORMOUS HAND — fingers in FOREGROUND, holding screwdriver -->
  <g transform="translate(180 130)">
    <!-- Mass of hand entering from top-right -->
    <path d="M60,-130 Q-30,-100 -100,-50 L-100,30 Q-40,60 60,40 L100,40 L100,-130 Z" fill="url(#p13p2hand)"/>
    <!-- Knuckle creases -->
    <path d="M-80,-30 Q-40,-20 0,-30" stroke="#5a3018" stroke-width="1" fill="none" opacity="0.65"/>
    <path d="M-60,0 Q-20,10 20,0" stroke="#5a3018" stroke-width="1" fill="none" opacity="0.65"/>

    <!-- THUMB curling around screwdriver -->
    <path d="M-90,30 L-80,80 L-60,90 L-40,40 Z" fill="url(#p13p2hand)"/>
    <ellipse cx="-70" cy="80" rx="14" ry="9" fill="url(#p13p2hand)"/>

    <!-- INDEX FINGER pinching screwdriver -->
    <path d="M-30,40 L-20,90 L0,98 L10,38 Z" fill="url(#p13p2hand)"/>
    <ellipse cx="-10" cy="92" rx="11" ry="7" fill="url(#p13p2hand)"/>

    <!-- Other fingers curled back -->
    <path d="M30,40 L40,80 L60,80 L65,38 Z" fill="url(#p13p2hand)" opacity="0.85"/>
    <path d="M70,40 L78,72 L94,72 L98,40 Z" fill="url(#p13p2hand)" opacity="0.85"/>

    <!-- TINY CUTS + CALLUSES (texture on hand) -->
    <g fill="#5a3018" opacity="0.65">
      <line x1="-40" y1="-20" x2="-30" y2="-22" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="0" y1="-30" x2="10" y2="-32" stroke="#5a3018" stroke-width="0.55"/>
      <line x1="40" y1="-15" x2="50" y2="-18" stroke="#5a3018" stroke-width="0.55"/>
      <circle cx="-50" cy="-40" r="1"/>
      <circle cx="-20" cy="-50" r="0.85"/>
      <circle cx="20" cy="-40" r="0.85"/>
      <circle cx="50" cy="-30" r="1"/>
      <circle cx="-70" cy="50" r="0.85"/>
      <circle cx="-50" cy="20" r="0.85"/>
    </g>
    <!-- Coarse hair on back of hand -->
    <g stroke="#3a1808" stroke-width="0.4" opacity="0.65">
      <line x1="-40" y1="-50" x2="-35" y2="-58"/>
      <line x1="-10" y1="-60" x2="-5" y2="-68"/>
      <line x1="20" y1="-50" x2="25" y2="-58"/>
      <line x1="50" y1="-60" x2="55" y2="-68"/>
    </g>
    <!-- Faint vein -->
    <path d="M-80,-40 Q-40,-30 0,-40" stroke="#5a4868" stroke-width="0.7" fill="none" opacity="0.45"/>

    <!-- SCREWDRIVER — held between thumb and forefinger — telegraph pole scale -->
    <g transform="translate(-30 120)">
      <!-- Wooden handle (top, in fingers) -->
      <rect x="-6" y="-50" width="12" height="40" fill="#5a3018"/>
      <ellipse cx="0" cy="-50" rx="6" ry="2" fill="#7a4818"/>
      <ellipse cx="0" cy="-10" rx="6" ry="2" fill="#3a1808"/>
      <!-- Steel shaft (long, downward) — bright line of light -->
      <rect x="-2" y="-10" width="4" height="100" fill="url(#p13p2steel)"/>
      <line x1="0" y1="-10" x2="0" y2="90" stroke="#fff8e8" stroke-width="0.7" opacity="0.85" filter="url(#p13p2bloom)"/>
      <!-- Tip — flat blade -->
      <path d="M-2,90 L0,98 L2,90 Z" fill="#a8a8a8"/>
      <!-- Adjusting tiny screw — small dark circle below tip -->
      <circle cx="0" cy="100" r="3" fill="#3a1808"/>
      <line x1="-3" y1="100" x2="3" y2="100" stroke="#1a0c04" stroke-width="0.55"/>
    </g>
  </g>

  <!-- DIALOG — CLOCKMAKER muttering -->
  <g transform="translate(280 30)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-50,18 L-66,32 L-44,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-70" y="-4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-70" y="12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="500">"Quarter turn... there."</text>
  </g>

  <!-- SFX — tick tick tick (italic, drifting) -->
  <g transform="translate(40 80)">
    <text x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" font-style="italic" font-weight="700" opacity="0.85">tick...</text>
    <text x="40" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600" opacity="0.75">tick...</text>
    <text x="80" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" font-style="italic" font-weight="500" opacity="0.65">tick...</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,260 Q90,258 180,262 Q280,264 366,260"/>
  </g>
</svg>
