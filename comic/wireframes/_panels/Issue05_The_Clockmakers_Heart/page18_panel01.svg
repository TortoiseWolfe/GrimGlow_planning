<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 471" width="742" height="471">
  <title>Issue 5 — Page 18 — Panel 1: Theodore-clockmaker handshake at shop door — scale beat — dual lighting</title>
  <desc>50mm. Theodore at shop door, clockmaker walks him out. Handshake — clockmaker's hand envelops Theodore's entirely. Theodore: gratitude wrestling with guilt. Clockmaker: open, almost fond. Bell above door. Behind clockmaker: warm amber workshop light. Through door glass behind Theodore: cool gaslight. Two lights meet on handshake. Dialog: CLOCKMAKER: You've a good eye, lad. Better than most apprentices twice your age. / THEODORE quiet meaning it: Thank you, sir. Truly. / CLOCKMAKER: If you've a mind to learn proper clockwork, you come back. Daylight hours. / CLOCKMAKER: I could use someone who sees how things think.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p1bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a2030"/>
    </linearGradient>
    <linearGradient id="p18p1floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p18p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p18p1waistcoatT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="p18p1waistcoatC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="50%" stop-color="#7a5828"/>
      <stop offset="100%" stop-color="#4a3818"/>
    </linearGradient>
    <linearGradient id="p18p1door" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <radialGradient id="p18p1warmShop" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p18p1coolStreet" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c8e8" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#5a708a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a4858" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p18p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="471" fill="url(#p18p1bg)"/>

  <!-- Warm amber pool from LEFT (workshop interior) -->
  <rect width="742" height="471" fill="url(#p18p1warmShop)"/>
  <!-- Cool blue pool from RIGHT (street gaslight through door glass) -->
  <rect width="742" height="471" fill="url(#p18p1coolStreet)"/>

  <!-- FLOOR -->
  <rect y="380" width="742" height="91" fill="url(#p18p1floor)"/>
  <line x1="0" y1="380" x2="742" y2="380" stroke="#1a0c04" stroke-width="0.55"/>
  <g stroke="#1a0c04" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="420" x2="742" y2="420"/>
  </g>

  <!-- ===== SHOP DOOR with bell (RIGHT side of frame) ===== -->
  <g transform="translate(580 0)">
    <!-- Door frame (dark green timber) -->
    <rect x="-30" y="0" width="160" height="380" fill="url(#p18p1door)"/>
    <rect x="-26" y="4" width="152" height="372" fill="#0a0408"/>
    <!-- DOOR with glass upper -->
    <rect x="-22" y="20" width="144" height="360" fill="#3a2010"/>
    <!-- Glass upper panel -->
    <rect x="-18" y="24" width="136" height="180" fill="#7a8898" opacity="0.65"/>
    <!-- Cool gaslight through glass -->
    <ellipse cx="50" cy="114" rx="80" ry="100" fill="url(#p18p1coolStreet)" opacity="0.85"/>
    <!-- Mullion -->
    <line x1="50" y1="24" x2="50" y2="204" stroke="#0a1808" stroke-width="0.85"/>
    <line x1="-18" y1="114" x2="118" y2="114" stroke="#0a1808" stroke-width="0.85"/>
    <!-- Faint street suggestion through glass -->
    <rect x="-14" y="180" width="40" height="20" fill="#5a4838" opacity="0.55"/>
    <rect x="60" y="170" width="50" height="30" fill="#5a4838" opacity="0.55"/>
    <!-- Lower panel (wood) -->
    <rect x="-18" y="208" width="136" height="172" fill="#3a1808"/>
    <line x1="50" y1="208" x2="50" y2="380" stroke="#1a0c04" stroke-width="0.55"/>

    <!-- BELL on bracket above door -->
    <g transform="translate(50 -10)">
      <rect x="-3" y="0" width="6" height="20" fill="#5a3018"/>
      <ellipse cx="0" cy="20" rx="6" ry="3" fill="#a86838" stroke="#5a3018" stroke-width="0.55"/>
      <path d="M-7,20 Q0,30 7,20 L6,12 Q0,18 -6,12 Z" fill="#a86838" stroke="#5a3018" stroke-width="0.55"/>
      <ellipse cx="0" cy="22" rx="3" ry="2" fill="#fff8e8" opacity="0.85" filter="url(#p18p1bloom)"/>
    </g>
  </g>

  <!-- ===== CLOCKMAKER on LEFT (warmer light, fuller figure) ===== -->
  <g transform="translate(180 200)">
    <!-- Body -->
    <path d="M-44,40 L-58,180 L58,180 L44,40 Z" fill="url(#p18p1waistcoatC)"/>
    <!-- Linen shirt collar -->
    <ellipse cx="0" cy="32" rx="22" ry="9" fill="#d8c8a8"/>

    <!-- Right arm extending FORWARD-RIGHT to handshake -->
    <line x1="44" y1="50" x2="200" y2="100" stroke="#d8a878" stroke-width="20" stroke-linecap="round"/>
    <!-- Left arm at side -->
    <line x1="-44" y1="50" x2="-50" y2="160" stroke="#d8a878" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="-50" cy="160" rx="9" ry="6" fill="url(#p18p1skin)"/>

    <!-- HEAD looking RIGHT toward Theodore -->
    <ellipse cx="14" cy="-10" rx="22" ry="26" fill="url(#p18p1skin)"/>
    <path d="M-6,-32 Q4,-42 14,-44 Q24,-42 34,-32 L32,-22 Q22,-36 14,-36 Q6,-36 -4,-22 Z" fill="#7a5028"/>
    <!-- Spectacles -->
    <ellipse cx="2" cy="-12" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <ellipse cx="22" cy="-12" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <line x1="8" y1="-12" x2="16" y2="-12" stroke="#3a2818" stroke-width="0.4"/>
    <ellipse cx="0" cy="-13" rx="2" ry="1" fill="#fff8e8" opacity="0.85" filter="url(#p18p1bloom)"/>
    <ellipse cx="20" cy="-13" rx="2" ry="1" fill="#fff8e8" opacity="0.85" filter="url(#p18p1bloom)"/>
    <ellipse cx="2" cy="-11" rx="2.4" ry="1.4" fill="#a8b8c8"/>
    <circle cx="2" cy="-11" r="1.2" fill="#0a0c14"/>
    <ellipse cx="22" cy="-11" rx="2.4" ry="1.4" fill="#a8b8c8"/>
    <circle cx="22" cy="-11" r="1.2" fill="#0a0c14"/>
    <!-- Brows raised slightly — fond -->
    <path d="M-4,-22 L8,-23" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M16,-23 L28,-22" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — almost-smile, fond -->
    <path d="M2,4 Q14,8 26,4" stroke="#3a1808" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M-4,-2 Q2,4 4,5" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>
    <path d="M30,-2 Q26,4 24,5" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.65"/>
  </g>

  <!-- ===== THEODORE on right of clockmaker, smaller, body half-turned ===== -->
  <g transform="translate(440 230)">
    <path d="M-22,40 L-26,140 L-12,140 L-10,40 L10,40 L12,140 L26,140 L22,40 Z" fill="#5a3818"/>
    <path d="M-22,40 L-30,-10 L-26,40 Z" fill="url(#p18p1waistcoatT)"/>
    <path d="M22,40 L30,-10 L26,40 Z" fill="url(#p18p1waistcoatT)"/>
    <ellipse cx="0" cy="32" rx="12" ry="6" fill="#d8c8a8"/>
    <path d="M14,16 L20,4 L22,16 Z" fill="#3a2818"/>
    <path d="M-14,16 L-20,4 L-22,16 Z" fill="#3a2818"/>

    <!-- Left arm extending out to handshake (toward LEFT) -->
    <line x1="-22" y1="40" x2="-100" y2="60" stroke="url(#p18p1skin)" stroke-width="11" stroke-linecap="round"/>
    <!-- Right arm at side -->
    <line x1="22" y1="40" x2="30" y2="100" stroke="url(#p18p1skin)" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="30" cy="100" rx="6" ry="4" fill="url(#p18p1skin)"/>
    <!-- Brass gear ring -->
    <circle cx="32" cy="104" r="1.4" fill="#ffd078" stroke="#7a4818" stroke-width="0.4" filter="url(#p18p1bloom)"/>

    <!-- HEAD looking LEFT (up at clockmaker) — slightly tilted up -->
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="url(#p18p1skin)"/>
    <path d="M-16,-20 Q-10,-26 0,-28 Q10,-26 16,-20 L14,-12 Q6,-24 0,-24 Q-6,-24 -14,-12 Z" fill="#a87838"/>
    <!-- Freckles -->
    <g fill="#7a4818" opacity="0.65">
      <circle cx="-7" cy="-2" r="0.55"/>
      <circle cx="0" cy="-4" r="0.55"/>
      <circle cx="7" cy="-2" r="0.55"/>
    </g>
    <!-- FLUSHED CHEEKS (genuine emotion) -->
    <ellipse cx="-12" cy="6" rx="4" ry="3" fill="#dc7868" opacity="0.45" filter="url(#p18p1bloom)"/>
    <ellipse cx="12" cy="6" rx="4" ry="3" fill="#dc7868" opacity="0.45" filter="url(#p18p1bloom)"/>
    <!-- Eyes — looking LEFT, slightly damp/grateful -->
    <ellipse cx="-7" cy="-4" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="-9" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="-9" cy="-3" r="0.55" fill="#0a0604"/>
    <ellipse cx="7" cy="-4" rx="3" ry="2" fill="#fff8e8"/>
    <circle cx="5" cy="-3" r="1.4" fill="#7a4818"/>
    <circle cx="5" cy="-3" r="0.55" fill="#0a0604"/>
    <!-- Brows — slightly knit (the guilt) -->
    <path d="M-12,-12 L-3,-13" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M3,-13 L12,-12" stroke="#5a3018" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Mouth — soft, slightly downturned (gratitude + guilt) -->
    <path d="M-5,8 Q0,10 5,8" stroke="#3a1808" stroke-width="0.85" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ===== HANDSHAKE — center, scale beat (clockmaker hand envelops Theodore's) ===== -->
  <g transform="translate(360 290)">
    <!-- Glow at the meeting point of the two lights -->
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="#ffd078" opacity="0.45" filter="url(#p18p1glow)"/>
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="#a8c8e8" opacity="0.35" filter="url(#p18p1glow)"/>
    <!-- Clockmaker's enveloping hand (large) -->
    <ellipse cx="-9" cy="0" rx="44" ry="26" fill="url(#p18p1skin)"/>
    <!-- Theodore's smaller hand (DISAPPEARING into clockmaker's grip) -->
    <ellipse cx="14" cy="0" rx="22" ry="14" fill="url(#p18p1skin)"/>
    <!-- Wrap of larger fingers around smaller hand -->
    <path d="M-30,0 Q-30,-20 14,-14 L34,-14 L36,0 L34,14 L14,14 Q-30,20 -30,0 Z" fill="url(#p18p1skin)"/>
    <!-- Fine details — Theodore's fingertips visible peeking out -->
    <ellipse cx="36" cy="-6" rx="3" ry="2" fill="url(#p18p1skin)"/>
    <ellipse cx="36" cy="6" rx="3" ry="2" fill="url(#p18p1skin)"/>
    <!-- Knuckle creases on clockmaker hand -->
    <path d="M-30,-8 Q-15,-12 0,-8" stroke="#5a3018" stroke-width="0.7" fill="none" opacity="0.65"/>
    <path d="M-30,8 Q-15,12 0,8" stroke="#5a3018" stroke-width="0.55" fill="none" opacity="0.55"/>
    <!-- Calluses + cuts -->
    <g fill="#5a3018" opacity="0.55">
      <circle cx="-22" cy="-2" r="0.7"/>
      <circle cx="-15" cy="6" r="0.55"/>
      <circle cx="-7" cy="-3" r="0.55"/>
    </g>
    <!-- Theodore's oil stains (vis on his small hand) -->
    <circle cx="14" cy="-2" r="1.4" fill="#1a0c04" opacity="0.65"/>
    <circle cx="20" cy="3" r="1" fill="#1a0c04" opacity="0.55"/>
    <!-- Light catching the meeting -->
    <ellipse cx="0" cy="-4" rx="22" ry="3" fill="#fff8e8" opacity="0.45" filter="url(#p18p1bloom)"/>
  </g>

  <!-- DIALOG CLOCKMAKER (good eye) -->
  <g transform="translate(220 60)">
    <ellipse cx="0" cy="0" rx="200" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-50,18 L-66,32 L-44,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-190" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-190" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"You've a good eye, lad. Better than most apprentices twice your age."</text>
  </g>

  <!-- DIALOG THEODORE (Thank you sir truly) -->
  <g transform="translate(620 130)">
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#6a4220" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-30,18 L-44,32 L-24,20 Z" fill="#ffffff" stroke="#6a4220" stroke-width="1"/>
    <text x="-90" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#6a4220" font-weight="700">THEODORE</text>
    <text x="-90" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-style="italic" font-weight="500">"Thank you, sir. Truly."</text>
  </g>

  <!-- DIALOG CLOCKMAKER (come back daylight) -->
  <g transform="translate(220 200)">
    <ellipse cx="0" cy="0" rx="200" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M50,18 L66,32 L46,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-190" y="-7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-190" y="9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"If you've a mind to learn proper clockwork, you come back. Daylight hours."</text>
  </g>

  <!-- DIALOG CLOCKMAKER (someone who sees how things think) -->
  <g transform="translate(620 270)">
    <ellipse cx="0" cy="0" rx="140" ry="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-30,28 L-46,46 L-26,30 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-130" y="-15" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-130" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"I could use someone who sees</text>
    <text x="-130" y="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">how things think."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,400 Q180,402 360,398 Q540,396 742,400"/>
  </g>
</svg>
