<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 364" width="366" height="364">
  <title>Issue 5 — Page 1 — Panel 2: Wren beside resolved schematic — hand inside, pointing to clock — sharp focus, in her element</title>
  <desc>50mm MS. Wren beside fully-resolved holographic shop cutaway in copper-gold wireframe. Left hand inside the projection pointing to the highlighted grandfather clock. Sharp focus expression. Schematic light catches her oil-stained forearms.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p1p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p1p2suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p1p2skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#c89048"/>
      <stop offset="100%" stop-color="#8a4828"/>
    </linearGradient>
    <radialGradient id="p1p2schematicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1p2warmWash" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p1p2glow"><feGaussianBlur stdDeviation="2.8"/></filter>
  </defs>

  <rect width="366" height="364" fill="url(#p1p2bg)"/>

  <!-- Distant timber + brick -->
  <g opacity="0.45">
    <rect x="0" y="0" width="366" height="364" fill="#2a1810"/>
    <line x1="60" y1="0" x2="60" y2="364" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="306" y1="0" x2="306" y2="364" stroke="#1a0c04" stroke-width="0.7"/>
    <path d="M0,80 Q120,82 240,78 Q320,76 366,80" stroke="#5a2818" stroke-width="0.5" fill="none"/>
    <path d="M0,160 Q120,162 240,158 Q320,156 366,160" stroke="#5a2818" stroke-width="0.5" fill="none"/>
    <path d="M0,240 Q120,238 240,242 Q320,244 366,240" stroke="#5a2818" stroke-width="0.5" fill="none"/>
  </g>

  <!-- ===== HOLOGRAPHIC SCHEMATIC at WAIST HEIGHT ===== -->
  <g transform="translate(220 200)">
    <ellipse cx="0" cy="0" rx="120" ry="90" fill="url(#p1p2schematicGlow)" filter="url(#p1p2glow)" opacity="0.75"/>
    <!-- Building cutaway, copper-gold wireframe — fully resolved -->
    <g stroke="#ffd078" stroke-width="1.2" fill="none" opacity="0.95" filter="url(#p1p2bloom)">
      <!-- Outer building shell -->
      <path d="M-80,-50 L-80,40 L80,40 L80,-50 Z"/>
      <!-- Roof -->
      <path d="M-80,-50 L-40,-78 L40,-78 L80,-50"/>
      <!-- Internal walls -->
      <line x1="-40" y1="-50" x2="-40" y2="40" opacity="0.85"/>
      <line x1="40" y1="-50" x2="40" y2="40" opacity="0.85"/>
      <!-- Floor / counter -->
      <line x1="-80" y1="0" x2="80" y2="0" opacity="0.85"/>
      <line x1="-80" y1="20" x2="80" y2="20" opacity="0.65"/>
      <!-- Window -->
      <rect x="-26" y="6" width="52" height="20" rx="0.5"/>
      <line x1="0" y1="6" x2="0" y2="26" opacity="0.7"/>
      <!-- Door + counter -->
      <rect x="-66" y="6" width="20" height="34" rx="0.5"/>
      <rect x="46" y="6" width="20" height="34" rx="0.5"/>
      <!-- Workbenches inside back room -->
      <rect x="-66" y="-30" width="50" height="6"/>
      <rect x="16" y="-30" width="50" height="6"/>
      <!-- Wall clocks suggested -->
      <circle cx="-50" cy="-40" r="4"/>
      <circle cx="60" cy="-40" r="4"/>
      <circle cx="-30" cy="-44" r="3"/>
      <circle cx="30" cy="-44" r="3"/>
    </g>
    <!-- TARGET: TALL grandfather clock at center — brighter -->
    <g stroke="#fff8e8" stroke-width="2" fill="none" opacity="0.95" filter="url(#p1p2bloom)">
      <rect x="-7" y="-44" width="14" height="74" rx="0.5"/>
      <circle cx="0" cy="-26" r="6"/>
      <line x1="0" y1="-26" x2="0" y2="-30"/>
      <line x1="0" y1="-26" x2="3" y2="-23"/>
      <!-- Pendulum slot -->
      <line x1="0" y1="-18" x2="0" y2="20"/>
      <circle cx="0" cy="22" r="2"/>
    </g>
    <!-- Bright pulse around clock -->
    <circle cx="0" cy="-26" r="14" fill="#fff8e8" opacity="0.4" filter="url(#p1p2bloom)"/>
    <!-- Geometric particles drifting up -->
    <g fill="#ffd078" opacity="0.85" filter="url(#p1p2bloom)">
      <circle cx="-90" cy="-70" r="0.7"/>
      <circle cx="90" cy="-70" r="0.7"/>
      <circle cx="-100" cy="50" r="0.85"/>
      <circle cx="100" cy="50" r="0.85"/>
      <circle cx="-30" cy="-90" r="0.7"/>
      <circle cx="30" cy="-90" r="0.7"/>
    </g>
  </g>

  <!-- WARM WASH from schematic onto Wren -->
  <rect width="366" height="364" fill="url(#p1p2warmWash)"/>

  <!-- ===== WREN beside schematic, left hand INSIDE pointing to clock ===== -->
  <g transform="translate(80 220)">
    <!-- Boots -->
    <ellipse cx="-4" cy="74" rx="4.5" ry="2" fill="#0a0408"/>
    <ellipse cx="4" cy="74" rx="4.5" ry="2" fill="#0a0408"/>
    <!-- Trousers — copper dust -->
    <rect x="-7" y="40" width="6" height="34" fill="url(#p1p2suit)"/>
    <rect x="1" y="40" width="6" height="34" fill="url(#p1p2suit)"/>
    <ellipse cx="-4" cy="60" rx="6" ry="1.8" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="4" cy="60" rx="6" ry="1.8" fill="#5a4838" opacity="0.6"/>
    <!-- Torso -->
    <path d="M-12,40 L-12,-10 L12,-10 L12,40 Z" fill="url(#p1p2suit)"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#ffd078" stroke-width="1" opacity="0.85" filter="url(#p1p2bloom)"/>
    <line x1="0" y1="-10" x2="0" y2="20" stroke="#ffd078" stroke-width="0.6" opacity="0.7"/>
    <!-- Scorch left shoulder -->
    <ellipse cx="-12" cy="-10" rx="4" ry="2.6" fill="#1a0c04" opacity="0.85"/>
    <!-- Shoulders -->
    <path d="M-12,-10 Q-9,-22 -2,-26 Q4,-26 9,-22 L12,-10 Z" fill="url(#p1p2suit)"/>
    <!-- LEFT arm — extended INTO schematic (pointing) -->
    <path d="M-12,-10 L0,-2 L40,-26 L80,-44 L84,-44 L84,-40 L80,-38 L40,-22 L0,4 L-8,2 Z" fill="url(#p1p2suit)"/>
    <!-- Forearm catches warm light -->
    <ellipse cx="40" cy="-26" rx="14" ry="6" fill="#ffd078" opacity="0.45" filter="url(#p1p2bloom)"/>
    <!-- Oil stain on forearm -->
    <ellipse cx="20" cy="-12" rx="3" ry="2" fill="#1a0c04" opacity="0.55"/>
    <ellipse cx="50" cy="-30" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.55"/>
    <!-- Hand pointing -->
    <ellipse cx="84" cy="-42" rx="4" ry="3" fill="url(#p1p2skin)"/>
    <!-- Index finger extended toward clock -->
    <ellipse cx="92" cy="-46" rx="4" ry="2" fill="url(#p1p2skin)"/>
    <ellipse cx="98" cy="-48" rx="3" ry="1.4" fill="url(#p1p2skin)"/>
    <!-- Glow around fingertip (touching schematic) -->
    <circle cx="100" cy="-49" r="3" fill="#fff8e8" opacity="0.7" filter="url(#p1p2bloom)"/>
    <!-- Right arm at side -->
    <rect x="-18" y="-10" width="6" height="38" fill="url(#p1p2suit)"/>
    <ellipse cx="-15" cy="30" rx="3" ry="2" fill="url(#p1p2skin)"/>
    <!-- Oil stains -->
    <ellipse cx="-15" cy="0" rx="2" ry="2.4" fill="#1a0c04" opacity="0.55"/>

    <!-- HEAD -->
    <ellipse cx="0" cy="-38" rx="11" ry="14" fill="url(#p1p2skin)"/>
    <!-- Warm-side cheek light -->
    <ellipse cx="6" cy="-36" rx="6" ry="9" fill="#ffd078" opacity="0.45" filter="url(#p1p2bloom)"/>
    <!-- HAIR UP messy bun on top -->
    <ellipse cx="0" cy="-58" rx="5" ry="4" fill="#0a0604"/>
    <ellipse cx="0" cy="-60" rx="3" ry="2.4" fill="#1a0c04"/>
    <!-- Wisps -->
    <path d="M-9,-46 Q-12,-40 -10,-34" stroke="#0a0604" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M9,-46 Q12,-40 10,-34" stroke="#0a0604" stroke-width="0.7" fill="none" opacity="0.7"/>
    <!-- Hair fringe -->
    <path d="M-7,-50 Q-4,-52 0,-52 Q4,-52 7,-50 L7,-48 Q3,-50 0,-50 Q-3,-50 -7,-48 Z" fill="#0a0604"/>
    <!-- Eyes — sharp focus, looking AT schematic (right) -->
    <ellipse cx="-4" cy="-38" rx="2" ry="1.2" fill="#fff8e8"/>
    <ellipse cx="-3" cy="-37" rx="1.4" ry="1" fill="#3a2010"/>
    <circle cx="-3" cy="-37" r="0.85" fill="#0a0604"/>
    <ellipse cx="4" cy="-38" rx="2" ry="1.2" fill="#fff8e8"/>
    <ellipse cx="5" cy="-37" rx="1.4" ry="1" fill="#3a2010"/>
    <circle cx="5" cy="-37" r="0.85" fill="#0a0604"/>
    <!-- Catchlights -->
    <circle cx="-2" cy="-38" r="0.45" fill="#fff8e8" filter="url(#p1p2bloom)"/>
    <circle cx="6" cy="-38" r="0.45" fill="#fff8e8" filter="url(#p1p2bloom)"/>
    <!-- Brows level + intent -->
    <path d="M-8,-46 L-1,-47" stroke="#0a0604" stroke-width="0.85" stroke-linecap="round"/>
    <path d="M1,-47 L8,-46" stroke="#0a0604" stroke-width="0.85" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M-1,-32 L0,-28 Q1,-26 3,-26 L3,-30 Z" fill="url(#p1p2skin)" opacity="0.85"/>
    <!-- Mouth — thin line of concentration -->
    <path d="M-3,-22 L3,-22" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- WREN dialogue (top) -->
  <g>
    <rect x="14" y="14" width="338" height="74" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <polygon points="120,88 132,88 124,98" fill="white" stroke="#c87a35" stroke-width="0.85"/>
    <line x1="120.5" y1="88" x2="131.5" y2="88" stroke="white" stroke-width="1.5"/>
  </g>
  <text x="22" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">The assembly sits inside the pendulum clock's gear</text>
  <text x="22" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">train. Fourth wheel. Sixteen-tooth pinion driving</text>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">a sixty-four-tooth wheel. Most precise in the shop.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,290 Q90,288 180,292 Q280,294 366,290"/>
  </g>
</svg>
