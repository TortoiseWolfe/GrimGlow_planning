<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 311" width="366" height="311">
  <title>Issue 5 — Page 18 — Panel 3: Clockmaker back at bench, satisfied — unaware — substitute passes</title>
  <desc>50mm. Clockmaker returned to bench and tea. Peers into mechanism, nods satisfied. Substitute invisible — from this angle in this light it passes. Picks up screwdriver. Does not know what was taken. Dialog: CLOCKMAKER to himself: Good lad.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p18p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p18p3bench" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="p18p3skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p18p3waistcoat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="50%" stop-color="#7a5828"/>
      <stop offset="100%" stop-color="#4a3818"/>
    </linearGradient>
    <linearGradient id="p18p3brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p18p3lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p18p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p18p3glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="366" height="311" fill="url(#p18p3bg)"/>

  <!-- Lamp pool -->
  <ellipse cx="183" cy="200" rx="220" ry="160" fill="url(#p18p3lampGlow)" filter="url(#p18p3glow)"/>

  <!-- Wall background suggestion (out of focus) -->
  <rect width="366" height="220" fill="#3a2010" opacity="0.55"/>
  <g opacity="0.45">
    <circle cx="60" cy="60" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="60" cy="60" r="6" fill="#fff8e8" opacity="0.85"/>
    <circle cx="306" cy="60" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="306" cy="60" r="6" fill="#fff8e8" opacity="0.85"/>
  </g>

  <!-- BENCH -->
  <rect y="220" width="366" height="91" fill="url(#p18p3bench)"/>
  <line x1="0" y1="220" x2="366" y2="220" stroke="#a86838" stroke-width="0.85" opacity="0.85" filter="url(#p18p3bloom)"/>

  <!-- OPEN CLOCK on bench -->
  <g transform="translate(120 200)">
    <rect x="-40" y="-30" width="80" height="40" fill="#3a1808"/>
    <rect x="-36" y="-26" width="72" height="32" fill="#0a0408"/>
    <!-- Brass gears (with substitute among them — slightly rougher) -->
    <circle cx="-22" cy="-10" r="9" fill="url(#p18p3brass)" opacity="0.85"/>
    <circle cx="-22" cy="-10" r="6" fill="#5a3018"/>
    <!-- Substitute — slightly off, but not visibly so from this angle -->
    <circle cx="0" cy="-10" r="11" fill="#a86838" opacity="0.85"/>
    <circle cx="0" cy="-10" r="7" fill="#5a3018"/>
    <circle cx="22" cy="-10" r="9" fill="url(#p18p3brass)" opacity="0.85"/>
    <circle cx="22" cy="-10" r="6" fill="#5a3018"/>
    <!-- Dial above -->
    <circle cx="0" cy="-44" r="14" fill="#fff8e8" opacity="0.85" stroke="#a86838" stroke-width="0.55"/>
  </g>

  <!-- TEA MUG + sandwich on bench -->
  <g transform="translate(280 220)">
    <ellipse cx="0" cy="-2" rx="14" ry="3" fill="#3a1808"/>
    <rect x="-12" y="-2" width="24" height="22" fill="#a8a8a8" opacity="0.85"/>
    <ellipse cx="0" cy="-2" rx="11" ry="2" fill="#5a3018"/>
    <!-- Steam wisp -->
    <path d="M0,-12 Q-3,-18 0,-26" stroke="#d8c8a8" stroke-width="0.85" fill="none" opacity="0.65"/>
  </g>

  <!-- ===== CLOCKMAKER seated, leaning over mechanism ===== -->
  <g transform="translate(180 130)">
    <!-- Stool -->
    <rect x="-22" y="100" width="44" height="40" fill="#3a1808"/>

    <!-- Body leaning forward -->
    <path d="M-30,40 L-44,150 L44,150 L30,40 Z" fill="url(#p18p3waistcoat)"/>
    <ellipse cx="0" cy="32" rx="20" ry="9" fill="#d8c8a8"/>

    <!-- Arms working at clock -->
    <line x1="-30" y1="40" x2="-50" y2="80" stroke="#d8a878" stroke-width="13" stroke-linecap="round"/>
    <line x1="30" y1="40" x2="20" y2="80" stroke="#d8a878" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="-50" cy="80" rx="9" ry="6" fill="url(#p18p3skin)"/>
    <ellipse cx="20" cy="80" rx="9" ry="6" fill="url(#p18p3skin)"/>
    <!-- Screwdriver in hand -->
    <line x1="20" y1="80" x2="14" y2="100" stroke="#a8a8a8" stroke-width="1.4"/>

    <!-- HEAD slightly down at clock -->
    <ellipse cx="-12" cy="0" rx="20" ry="22" fill="url(#p18p3skin)"/>
    <path d="M-32,-22 Q-22,-30 -12,-32 Q-2,-30 8,-22 L6,-12 Q-2,-26 -12,-26 Q-22,-26 -30,-12 Z" fill="#7a5028"/>
    <!-- Spectacles down -->
    <ellipse cx="-22" cy="-2" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <ellipse cx="-2" cy="-2" rx="6" ry="3.4" fill="none" stroke="#3a2818" stroke-width="0.55"/>
    <ellipse cx="-22" cy="-1" rx="2.4" ry="1.4" fill="#a8b8c8"/>
    <circle cx="-22" cy="-1" r="1.2" fill="#0a0c14"/>
    <ellipse cx="-2" cy="-1" rx="2.4" ry="1.4" fill="#a8b8c8"/>
    <circle cx="-2" cy="-1" r="1.2" fill="#0a0c14"/>
    <!-- Brows level (content) -->
    <path d="M-32,-12 L-15,-13" stroke="#5a3018" stroke-width="0.7"/>
    <path d="M-7,-13 L8,-12" stroke="#5a3018" stroke-width="0.7"/>
    <!-- Mouth — slight smile (content) -->
    <path d="M-18,8 Q-12,11 -6,8" stroke="#3a1808" stroke-width="0.85" fill="none" stroke-linecap="round"/>
  </g>

  <!-- DIALOG — to himself, settling back -->
  <g transform="translate(80 250)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,-16 L36,-28 L26,-18 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-50" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-50" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">"Good lad."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q90,92 180,88 Q280,86 366,90"/>
    <path d="M0,260 Q90,258 180,262 Q280,264 366,260"/>
  </g>
</svg>
