<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 422" width="742" height="422">
  <title>Issue 5 — Page 4 — Panel 5: Bird's-eye street — HOROLOGY shop visible — vertiginous fairy-altitude</title>
  <desc>24mm bird's-eye looking straight down. Street as deep canyon. HOROLOGY shop directly below — plate glass amber rectangle, gold lettering readable from above, dark green timber surround. Pedestrian silhouettes, horse cart, lamplighter. Vertiginous scale.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p4p5cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p4p5buildingTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1414"/>
    </linearGradient>
    <linearGradient id="p4p5shopFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <radialGradient id="p4p5lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p4p5shopWindow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p4p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p4p5glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- Cobblestone street fills frame -->
  <rect width="742" height="422" fill="url(#p4p5cobble)"/>

  <!-- BUILDING ROOFS at edges (we're looking down between them) -->
  <!-- Top buildings -->
  <rect x="0" y="0" width="742" height="60" fill="url(#p4p5buildingTop)"/>
  <line x1="0" y1="60" x2="742" y2="60" stroke="#0a0604" stroke-width="0.85"/>
  <!-- Building roof seams -->
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.65">
    <line x1="160" y1="0" x2="160" y2="60"/>
    <line x1="320" y1="0" x2="320" y2="60"/>
    <line x1="480" y1="0" x2="480" y2="60"/>
    <line x1="620" y1="0" x2="620" y2="60"/>
  </g>
  <!-- Chimney pots (tiny from this altitude) -->
  <g fill="#5a2818">
    <ellipse cx="80" cy="20" rx="6" ry="5"/>
    <ellipse cx="240" cy="20" rx="6" ry="5"/>
    <ellipse cx="400" cy="20" rx="6" ry="5"/>
    <ellipse cx="560" cy="20" rx="6" ry="5"/>
    <ellipse cx="700" cy="20" rx="6" ry="5"/>
  </g>
  <g fill="#7a3818">
    <ellipse cx="80" cy="18" rx="5" ry="4"/>
    <ellipse cx="240" cy="18" rx="5" ry="4"/>
    <ellipse cx="400" cy="18" rx="5" ry="4"/>
    <ellipse cx="560" cy="18" rx="5" ry="4"/>
    <ellipse cx="700" cy="18" rx="5" ry="4"/>
  </g>

  <!-- Bottom buildings -->
  <rect x="0" y="362" width="742" height="60" fill="url(#p4p5buildingTop)"/>
  <line x1="0" y1="362" x2="742" y2="362" stroke="#0a0604" stroke-width="0.85"/>
  <g fill="#5a2818">
    <ellipse cx="60" cy="402" rx="6" ry="5"/>
    <ellipse cx="220" cy="402" rx="6" ry="5"/>
    <ellipse cx="500" cy="402" rx="6" ry="5"/>
    <ellipse cx="680" cy="402" rx="6" ry="5"/>
  </g>

  <!-- ===== HOROLOGY SHOP — directly below (centered) ===== -->
  <!-- Shop awning area, dark green timber -->
  <rect x="280" y="60" width="180" height="40" fill="url(#p4p5shopFront)"/>
  <!-- Plate glass window (warm amber rectangle from above) -->
  <rect x="290" y="65" width="160" height="30" fill="#ffd078" filter="url(#p4p5bloom)" opacity="0.85"/>
  <ellipse cx="370" cy="80" rx="120" ry="40" fill="url(#p4p5shopWindow)" filter="url(#p4p5glow)" opacity="0.95"/>
  <!-- Window frame -->
  <line x1="370" y1="65" x2="370" y2="95" stroke="#1a3818" stroke-width="0.85"/>
  <line x1="290" y1="80" x2="450" y2="80" stroke="#1a3818" stroke-width="0.85"/>
  <!-- HOROLOGY GOLD LEAF lettering on awning fascia -->
  <text x="370" y="78" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#ffd078" font-weight="700" letter-spacing="2" filter="url(#p4p5bloom)" opacity="0.95">HOROLOGY</text>
  <!-- Door visible -->
  <rect x="282" y="60" width="14" height="40" fill="#0a1808"/>
  <rect x="446" y="60" width="14" height="40" fill="#0a1808"/>
  <!-- Pavement around shop -->
  <rect x="280" y="100" width="180" height="20" fill="#5a4838"/>

  <!-- Surrounding building backs (where the shop sits between others) -->
  <rect x="0" y="60" width="280" height="40" fill="#2a2018"/>
  <rect x="460" y="60" width="282" height="40" fill="#2a2018"/>
  <!-- Vague window grids on neighbor buildings -->
  <g fill="#1a1410" opacity="0.7">
    <rect x="40" y="70" width="20" height="14"/>
    <rect x="100" y="70" width="20" height="14"/>
    <rect x="170" y="70" width="20" height="14"/>
    <rect x="230" y="70" width="20" height="14"/>
    <rect x="490" y="70" width="20" height="14"/>
    <rect x="560" y="70" width="20" height="14"/>
    <rect x="630" y="70" width="20" height="14"/>
    <rect x="700" y="70" width="20" height="14"/>
  </g>

  <!-- COBBLESTONE STREET (bulk of frame) -->
  <g stroke="#1a0c04" stroke-width="0.55" opacity="0.55">
    <path d="M0,140 Q200,142 400,138 Q580,136 742,140"/>
    <path d="M0,180 Q200,178 400,182 Q580,184 742,180"/>
    <path d="M0,220 Q200,222 400,218 Q580,216 742,220"/>
    <path d="M0,260 Q200,258 400,262 Q580,264 742,260"/>
    <path d="M0,300 Q200,302 400,298 Q580,296 742,300"/>
    <path d="M0,340 Q200,338 400,342 Q580,344 742,340"/>
  </g>
  <g fill="#1a0c04" opacity="0.55">
    <circle cx="60" cy="160" r="1.4"/>
    <circle cx="180" cy="160" r="1.4"/>
    <circle cx="300" cy="160" r="1.4"/>
    <circle cx="540" cy="160" r="1.4"/>
    <circle cx="660" cy="160" r="1.4"/>
    <circle cx="100" cy="200" r="1.4"/>
    <circle cx="240" cy="200" r="1.4"/>
    <circle cx="380" cy="200" r="1.4"/>
    <circle cx="500" cy="200" r="1.4"/>
    <circle cx="620" cy="200" r="1.4"/>
    <circle cx="80" cy="240" r="1.4"/>
    <circle cx="200" cy="240" r="1.4"/>
    <circle cx="340" cy="240" r="1.4"/>
    <circle cx="480" cy="240" r="1.4"/>
    <circle cx="600" cy="240" r="1.4"/>
    <circle cx="160" cy="280" r="1.4"/>
    <circle cx="280" cy="280" r="1.4"/>
    <circle cx="420" cy="280" r="1.4"/>
    <circle cx="540" cy="280" r="1.4"/>
    <circle cx="60" cy="320" r="1.4"/>
    <circle cx="200" cy="320" r="1.4"/>
    <circle cx="380" cy="320" r="1.4"/>
    <circle cx="520" cy="320" r="1.4"/>
    <circle cx="660" cy="320" r="1.4"/>
  </g>

  <!-- ===== GASLIGHT POOLS along street ===== -->
  <ellipse cx="120" cy="200" rx="60" ry="40" fill="url(#p4p5lampPool)" filter="url(#p4p5glow)" opacity="0.7"/>
  <ellipse cx="370" cy="220" rx="80" ry="60" fill="url(#p4p5lampPool)" filter="url(#p4p5glow)" opacity="0.85"/>
  <ellipse cx="620" cy="200" rx="60" ry="40" fill="url(#p4p5lampPool)" filter="url(#p4p5glow)" opacity="0.6"/>
  <ellipse cx="240" cy="320" rx="50" ry="30" fill="url(#p4p5lampPool)" filter="url(#p4p5glow)" opacity="0.45"/>
  <ellipse cx="500" cy="320" rx="50" ry="30" fill="url(#p4p5lampPool)" filter="url(#p4p5glow)" opacity="0.4"/>

  <!-- LAMP POSTS -->
  <g fill="#0a0604">
    <circle cx="120" cy="200" r="2"/>
    <circle cx="370" cy="220" r="2.4"/>
    <circle cx="620" cy="200" r="2"/>
  </g>
  <g fill="#fff8e8" filter="url(#p4p5bloom)">
    <circle cx="120" cy="200" r="0.85"/>
    <circle cx="370" cy="220" r="1"/>
    <circle cx="620" cy="200" r="0.85"/>
  </g>

  <!-- ===== PEDESTRIAN SILHOUETTES (enormous from fairy POV) ===== -->
  <!-- Pedestrian 1 — top hat man near shop -->
  <g transform="translate(420 180)">
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="#2a1410"/>
    <rect x="-6" y="6" width="12" height="22" fill="#1a0c04"/>
    <ellipse cx="-2" cy="28" rx="3.4" ry="1.6" fill="#0a0604"/>
    <ellipse cx="3" cy="28" rx="3.4" ry="1.6" fill="#0a0604"/>
    <!-- Top hat (visible from above as small black disc on head crown) -->
    <ellipse cx="0" cy="-2" rx="9" ry="6" fill="#0a0604"/>
    <ellipse cx="0" cy="-3" rx="6" ry="4" fill="#1a1410"/>
  </g>

  <!-- Pedestrian 2 — woman with shawl + basket, walking opposite direction -->
  <g transform="translate(540 250)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#3a1828"/>
    <path d="M-12,8 L-15,28 L15,28 L12,8 Z" fill="#5a2030"/>
    <ellipse cx="-2" cy="28" rx="3" ry="1.4" fill="#0a0604"/>
    <ellipse cx="3" cy="28" rx="3" ry="1.4" fill="#0a0604"/>
    <ellipse cx="0" cy="-2" rx="9" ry="6" fill="#3a1828"/>
    <ellipse cx="0" cy="-2" rx="6" ry="4" fill="#5a2030"/>
    <!-- Basket -->
    <rect x="11" y="2" width="9" height="8" fill="#5a3018"/>
  </g>

  <!-- Pedestrian 3 — small boy running -->
  <g transform="translate(280 280)">
    <ellipse cx="0" cy="0" rx="9" ry="7" fill="#3a2010"/>
    <rect x="-5" y="6" width="9" height="14" fill="#2a1810"/>
    <ellipse cx="-3" cy="20" rx="2.4" ry="1" fill="#0a0604"/>
    <ellipse cx="4" cy="22" rx="2.4" ry="1" fill="#0a0604"/>
    <ellipse cx="0" cy="-2" rx="6" ry="4.4" fill="#1a0c04"/>
  </g>

  <!-- ===== HORSE AND CART ===== -->
  <g transform="translate(150 270)">
    <!-- Cart body (rectangle from above) -->
    <rect x="-30" y="-12" width="60" height="24" fill="#3a2010" stroke="#1a0c04" stroke-width="0.85"/>
    <!-- Cart contents (sacks/barrels) -->
    <ellipse cx="-14" cy="-2" rx="6" ry="5" fill="#5a3818"/>
    <ellipse cx="0" cy="0" rx="6" ry="5" fill="#5a3818"/>
    <ellipse cx="14" cy="-4" rx="6" ry="5" fill="#5a3818"/>
    <!-- Cart wheels (visible as ellipses from above) -->
    <ellipse cx="-32" cy="-12" rx="4" ry="3" fill="#1a0c04"/>
    <ellipse cx="32" cy="-12" rx="4" ry="3" fill="#1a0c04"/>
    <ellipse cx="-32" cy="12" rx="4" ry="3" fill="#1a0c04"/>
    <ellipse cx="32" cy="12" rx="4" ry="3" fill="#1a0c04"/>
    <!-- Hitch -->
    <line x1="-30" y1="0" x2="-50" y2="-2" stroke="#3a2010" stroke-width="2.4"/>
    <!-- HORSE — from above, broad as ship's deck -->
    <ellipse cx="-66" cy="-2" rx="22" ry="10" fill="#5a3018"/>
    <ellipse cx="-72" cy="-2" rx="14" ry="6" fill="#3a1810"/>
    <!-- Horse mane -->
    <line x1="-78" y1="-6" x2="-58" y2="-4" stroke="#1a0c04" stroke-width="1" opacity="0.85"/>
    <!-- Horse legs (from above just hooves visible) -->
    <ellipse cx="-58" cy="-12" rx="2.4" ry="1.4" fill="#0a0604"/>
    <ellipse cx="-72" cy="-12" rx="2.4" ry="1.4" fill="#0a0604"/>
    <ellipse cx="-58" cy="12" rx="2.4" ry="1.4" fill="#0a0604"/>
    <ellipse cx="-72" cy="12" rx="2.4" ry="1.4" fill="#0a0604"/>
  </g>

  <!-- ===== LAMPLIGHTER walking north (with pole) ===== -->
  <g transform="translate(620 320)">
    <ellipse cx="0" cy="0" rx="9" ry="7" fill="#3a2010"/>
    <rect x="-6" y="6" width="12" height="20" fill="#3a2010"/>
    <ellipse cx="-3" cy="26" rx="3" ry="1.4" fill="#0a0604"/>
    <ellipse cx="3" cy="26" rx="3" ry="1.4" fill="#0a0604"/>
    <ellipse cx="0" cy="-2" rx="6" ry="4.4" fill="#1a0c04"/>
    <!-- Pole on shoulder -->
    <line x1="0" y1="0" x2="22" y2="-50" stroke="#3a2018" stroke-width="1.4"/>
    <path d="M22,-50 L26,-52 L24,-46" fill="none" stroke="#3a2018" stroke-width="1"/>
  </g>

  <!-- LUMA comms (top right) -->
  <g>
    <rect x="14" y="14" width="306" height="46" rx="2" fill="white" stroke="#5a3ad8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a3ad8" font-weight="700">LUMA ((comms))</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Heart rates nominal. Thresh, your pulse</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">is elevated. Breathe.</text>

  <!-- THRESH reply (bottom-right) -->
  <g>
    <rect x="540" y="378" width="180" height="32" rx="2" fill="white" stroke="#dc2030" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="548" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#dc2030" font-weight="700">THRESH ((comms, tight))</text>
  <text x="548" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">I'm fine.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,360 Q200,362 400,358 Q580,356 742,360"/>
  </g>
</svg>
