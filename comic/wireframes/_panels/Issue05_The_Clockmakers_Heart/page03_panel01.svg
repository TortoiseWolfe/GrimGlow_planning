<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 249" width="742" height="249">
  <title>Issue 5 — Page 3 — Panel 1: Wren tool-check — holographic engineering toolkit deployed — preparation as ritual</title>
  <desc>28mm widescreen low angle. Wren crouched on timber ledge. Toolkit deployed: scanner, manipulators, cutter, calibrator orbiting hands in copper-gold. On ledge: schematic emitter, power cell shard, coil of conductor wire. Surgeon with instruments.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p3p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p3p1ledge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="p3p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p3p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#c89048"/>
      <stop offset="100%" stop-color="#8a4828"/>
    </linearGradient>
    <radialGradient id="p3p1toolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3p1coolBack" cx="100%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#a8c0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5a78c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="p3p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p3p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="249" fill="url(#p3p1bg)"/>

  <!-- Cool back wash from camp perimeter -->
  <rect width="742" height="249" fill="url(#p3p1coolBack)"/>

  <!-- TIMBER LEDGE — fills lower half -->
  <rect x="0" y="170" width="742" height="79" fill="url(#p3p1ledge)"/>
  <line x1="0" y1="180" x2="742" y2="180" stroke="#0a0604" stroke-width="0.7"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#0a0604" stroke-width="0.55"/>
  <g stroke="#0a0604" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
  </g>
  <ellipse cx="120" cy="210" rx="6" ry="3" fill="#1a0c04" opacity="0.7"/>
  <ellipse cx="500" cy="210" rx="5" ry="2.4" fill="#1a0c04" opacity="0.7"/>

  <!-- Distant brick + perimeter behind -->
  <g opacity="0.5">
    <path d="M0,80 Q120,82 240,78 Q320,76 440,80 Q580,82 742,78" stroke="#5a2818" stroke-width="0.6" fill="none"/>
    <path d="M0,140 Q120,142 240,138 Q380,134 500,140 Q620,142 742,138" stroke="#5a2818" stroke-width="0.55" fill="none"/>
  </g>
  <g stroke="#a8c0ff" stroke-width="0.55" fill="none" opacity="0.45" filter="url(#p3p1bloom)" stroke-dasharray="3 2">
    <line x1="40" y1="40" x2="40" y2="170"/>
    <line x1="700" y1="40" x2="700" y2="170"/>
  </g>

  <!-- ===== EQUIPMENT on ledge — schematic emitter, power cell shard, coil of wire ===== -->
  <g transform="translate(160 175)">
    <!-- Schematic emitter — cube w/ glow -->
    <rect x="-7" y="-7" width="14" height="14" rx="1.4" fill="#3a2818" stroke="#c87838" stroke-width="0.7"/>
    <rect x="-5" y="-5" width="10" height="10" fill="#ffd078" filter="url(#p3p1bloom)" opacity="0.65"/>
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#ffd078" opacity="0.35" filter="url(#p3p1glow)"/>
  </g>
  <g transform="translate(190 178)">
    <!-- Power cell shard — angular shard, blue-amber glow -->
    <path d="M-6,-8 L4,-10 L7,-2 L3,6 L-7,4 Z" fill="#3a2068" stroke="#a888e8" stroke-width="0.55"/>
    <ellipse cx="0" cy="-2" rx="6" ry="4" fill="#a8c0ff" filter="url(#p3p1bloom)" opacity="0.55"/>
    <ellipse cx="0" cy="-2" rx="14" ry="9" fill="#a8c0ff" opacity="0.25" filter="url(#p3p1glow)"/>
  </g>
  <g transform="translate(228 180)">
    <!-- Coil of wire — copper -->
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="none" stroke="#c87838" stroke-width="1.2"/>
    <ellipse cx="0" cy="-2" rx="14" ry="6" fill="none" stroke="#c87838" stroke-width="0.85"/>
    <ellipse cx="0" cy="-4" rx="14" ry="6" fill="none" stroke="#c87838" stroke-width="0.85"/>
    <ellipse cx="0" cy="2" rx="14" ry="6" fill="none" stroke="#a86838" stroke-width="0.7"/>
  </g>

  <!-- ===== WREN crouched, hands extended for tool-check ===== -->
  <g transform="translate(420 175)">
    <!-- Crouched legs (knees bent + heels lifted) -->
    <ellipse cx="-12" cy="44" rx="6" ry="2.4" fill="#0a0408"/>
    <ellipse cx="12" cy="44" rx="6" ry="2.4" fill="#0a0408"/>
    <!-- Thigh fold -->
    <path d="M-18,40 L-12,4 L-6,4 L-12,40 Z" fill="url(#p3p1suit)"/>
    <path d="M18,40 L12,4 L6,4 L12,40 Z" fill="url(#p3p1suit)"/>
    <!-- Knees forward (copper dust) -->
    <ellipse cx="-12" cy="22" rx="6" ry="2.4" fill="#5a4838" opacity="0.6"/>
    <ellipse cx="12" cy="22" rx="6" ry="2.4" fill="#5a4838" opacity="0.6"/>
    <!-- Lower legs back -->
    <rect x="-14" y="20" width="4" height="20" fill="url(#p3p1suit)"/>
    <rect x="10" y="20" width="4" height="20" fill="url(#p3p1suit)"/>
    <!-- Torso leaning forward, low -->
    <path d="M-14,4 L-12,-32 L12,-32 L14,4 Z" fill="url(#p3p1suit)"/>
    <line x1="-9" y1="-22" x2="9" y2="-22" stroke="#ffd078" stroke-width="0.85" opacity="0.85" filter="url(#p3p1bloom)"/>
    <ellipse cx="-12" cy="-32" rx="4" ry="2.4" fill="#1a0c04" opacity="0.85"/>
    <!-- Shoulders -->
    <path d="M-12,-32 Q-7,-44 0,-46 Q7,-44 12,-32 L11,-28 L-11,-28 Z" fill="url(#p3p1suit)"/>
    <!-- ARMS extended forward — both palms up, hovering tools -->
    <path d="M-12,-32 L-30,-22 L-50,-12 L-50,-8 L-30,-18 L-14,-26 Z" fill="url(#p3p1suit)"/>
    <path d="M12,-32 L30,-22 L50,-12 L50,-8 L30,-18 L14,-26 Z" fill="url(#p3p1suit)"/>
    <!-- Hands palms-up -->
    <ellipse cx="-50" cy="-10" rx="5" ry="3" fill="url(#p3p1skin)"/>
    <ellipse cx="50" cy="-10" rx="5" ry="3" fill="url(#p3p1skin)"/>
    <!-- Oil stains -->
    <ellipse cx="-30" cy="-20" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.6"/>
    <ellipse cx="30" cy="-20" rx="2.4" ry="1.6" fill="#1a0c04" opacity="0.6"/>
    <!-- Wrist emitter glow -->
    <ellipse cx="-50" cy="-12" rx="9" ry="4" fill="#ffd078" opacity="0.65" filter="url(#p3p1glow)"/>
    <ellipse cx="50" cy="-12" rx="9" ry="4" fill="#ffd078" opacity="0.65" filter="url(#p3p1glow)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-54" rx="5.5" ry="7" fill="url(#p3p1skin)"/>
    <ellipse cx="0" cy="-64" rx="3" ry="2.4" fill="#0a0604"/>
    <ellipse cx="0" cy="-66" rx="2" ry="1.4" fill="#1a0c04"/>
    <ellipse cx="-2" cy="-54" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="-2" cy="-54" r="0.5" fill="#0a0604"/>
    <ellipse cx="2" cy="-54" rx="1" ry="0.65" fill="#fff8e8"/>
    <circle cx="2" cy="-54" r="0.5" fill="#0a0604"/>
    <path d="M-3,-47 L3,-47" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== HOLOGRAPHIC TOOLKIT orbiting Wren's hands ===== -->
  <!-- Tool 1 — SCANNER (hexagonal sensor, left) -->
  <g transform="translate(355 150)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#p3p1toolGlow)" filter="url(#p3p1glow)" opacity="0.85"/>
    <g stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#p3p1bloom)">
      <path d="M-8,-4 L-4,-8 L4,-8 L8,-4 L8,4 L4,8 L-4,8 L-8,4 Z"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <circle cx="0" cy="0" r="1.4"/>
    </g>
    <text x="0" y="-14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.6" fill="#ffd078" font-weight="700" filter="url(#p3p1bloom)" opacity="0.85">SCAN</text>
  </g>
  <!-- Tool 2 — MANIPULATORS (small claws, left of Wren) -->
  <g transform="translate(388 144)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="url(#p3p1toolGlow)" filter="url(#p3p1glow)" opacity="0.85"/>
    <g stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#p3p1bloom)">
      <path d="M-5,-5 L-2,-2 L0,-4 L2,-2 L5,-5"/>
      <line x1="0" y1="-4" x2="0" y2="6"/>
      <path d="M-3,3 Q-2,5 0,5 Q2,5 3,3"/>
    </g>
    <text x="0" y="-12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.4" fill="#ffd078" filter="url(#p3p1bloom)" opacity="0.85">MANIP</text>
  </g>
  <!-- Tool 3 — CUTTER (beam emitter, right of Wren) -->
  <g transform="translate(452 144)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="url(#p3p1toolGlow)" filter="url(#p3p1glow)" opacity="0.85"/>
    <g stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#p3p1bloom)">
      <rect x="-4" y="-4" width="8" height="6" rx="0.4"/>
      <line x1="0" y1="2" x2="0" y2="6"/>
      <line x1="-2" y1="6" x2="2" y2="6"/>
    </g>
    <line x1="452" y1="148" x2="452" y2="156" stroke="#fff8e8" stroke-width="0.7" filter="url(#p3p1bloom)" opacity="0.9" transform="translate(-452 -148)" />
    <line x1="0" y1="6" x2="0" y2="10" stroke="#fff8e8" stroke-width="0.55" filter="url(#p3p1bloom)" opacity="0.85"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.4" fill="#ffd078" filter="url(#p3p1bloom)" opacity="0.85">CUTTER</text>
  </g>
  <!-- Tool 4 — CALIBRATOR (right edge) -->
  <g transform="translate(485 150)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#p3p1toolGlow)" filter="url(#p3p1glow)" opacity="0.85"/>
    <g stroke="#ffd078" stroke-width="0.85" fill="none" opacity="0.95" filter="url(#p3p1bloom)">
      <circle cx="0" cy="0" r="6"/>
      <line x1="0" y1="-6" x2="0" y2="-3"/>
      <line x1="0" y1="6" x2="0" y2="3"/>
      <line x1="-6" y1="0" x2="-3" y2="0"/>
      <line x1="6" y1="0" x2="3" y2="0"/>
      <circle cx="0" cy="0" r="1.4"/>
      <line x1="0" y1="0" x2="3" y2="-3"/>
    </g>
    <text x="0" y="-14" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.6" fill="#ffd078" filter="url(#p3p1bloom)" opacity="0.85">CALIB</text>
  </g>
  <!-- Drift particles around tools -->
  <g fill="#ffd078" opacity="0.7" filter="url(#p3p1bloom)">
    <circle cx="370" cy="125" r="0.7"/>
    <circle cx="395" cy="120" r="0.85"/>
    <circle cx="420" cy="118" r="0.7"/>
    <circle cx="445" cy="120" r="0.85"/>
    <circle cx="470" cy="125" r="0.7"/>
    <circle cx="345" cy="160" r="0.55"/>
    <circle cx="495" cy="160" r="0.55"/>
  </g>

  <!-- WREN dialogue (left, quiet) -->
  <g>
    <rect x="14" y="14" width="240" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN (quiet)</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">Scanner. Manipulators. Cutter. Calibrator.</text>

  <!-- WREN dialogue 2 (top right) -->
  <g>
    <rect x="540" y="14" width="190" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)" stroke-dasharray="3 2"/>
  </g>
  <text x="548" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#c87a35" font-weight="700">WREN</text>
  <text x="548" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic">...that should do.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,180 Q200,182 400,178 Q580,176 742,180"/>
  </g>
</svg>
