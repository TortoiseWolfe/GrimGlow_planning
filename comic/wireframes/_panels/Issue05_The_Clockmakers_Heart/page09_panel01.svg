<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 249" width="742" height="249">
  <title>Issue 5 — Page 9 — Panel 1: Gear train panoramic — mainspring → great wheel → center → third → target fourth wheel — Wren tiny in frame</title>
  <desc>24mm widescreen panoramic. Full gear train from Wren's POV. Mainspring barrel left. Great wheel. Center wheel. Third wheel. Fourth wheel target right. Cascade of motion. Wren tiny on base plate moving toward target with copper-gold scanner beam.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p9p1cavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p9p1brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="30%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p9p1steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0c8"/>
      <stop offset="100%" stop-color="#5a5048"/>
    </linearGradient>
    <linearGradient id="p9p1basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="p9p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <radialGradient id="p9p1amberHeart" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p1brassGleam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd078" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p9p1scannerBeam" cx="0%" cy="50%" r="120%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p9p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p9p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="249" fill="url(#p9p1cavity)"/>
  <rect width="742" height="249" fill="url(#p9p1amberHeart)"/>

  <!-- Base plate fills bottom -->
  <rect x="0" y="200" width="742" height="49" fill="url(#p9p1basePlate)"/>
  <line x1="0" y1="204" x2="742" y2="204" stroke="#7a4818" stroke-width="0.7"/>
  <ellipse cx="371" cy="220" rx="360" ry="6" fill="#fff8e8" opacity="0.45" filter="url(#p9p1bloom)"/>

  <!-- ===== MAINSPRING BARREL — far left ===== -->
  <g transform="translate(60 110)">
    <ellipse cx="0" cy="-50" rx="40" ry="9" fill="#a86838"/>
    <rect x="-40" y="-50" width="80" height="160" fill="url(#p9p1brass)"/>
    <ellipse cx="0" cy="110" rx="40" ry="9" fill="#5a3018"/>
    <g stroke="#7a4818" stroke-width="0.55" opacity="0.7">
      <line x1="-40" y1="-20" x2="40" y2="-20"/>
      <line x1="-40" y1="20" x2="40" y2="20"/>
      <line x1="-40" y1="60" x2="40" y2="60"/>
    </g>
    <g stroke="#5a4838" stroke-width="0.7" fill="none" opacity="0.85">
      <ellipse cx="0" cy="20" rx="30" ry="6"/>
      <ellipse cx="0" cy="40" rx="28" ry="6"/>
    </g>
    <ellipse cx="-26" cy="0" rx="6" ry="80" fill="url(#p9p1brassGleam)" filter="url(#p9p1glow)" opacity="0.85"/>
    <circle cx="0" cy="-20" r="6" fill="url(#p9p1steel)"/>
  </g>

  <!-- ===== GREAT WHEEL ===== -->
  <g transform="translate(190 100)">
    <circle cx="0" cy="0" r="50" fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.85"/>
    <g fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.55">
      <path d="M0,-50 L3,-60 L-3,-60 Z"/>
      <path d="M18,-46 L22,-56 L17,-58 Z"/>
      <path d="M35,-35 L42,-42 L38,-46 Z"/>
      <path d="M46,-18 L56,-22 L52,-28 Z"/>
      <path d="M50,0 L60,0 L60,-4 L52,-4 Z"/>
      <path d="M46,18 L56,22 L52,28 Z"/>
      <path d="M35,35 L42,42 L38,46 Z"/>
      <path d="M18,46 L22,56 L17,58 Z"/>
      <path d="M0,50 L3,60 L-3,60 Z"/>
      <path d="M-18,46 L-22,56 L-17,58 Z"/>
      <path d="M-35,35 L-42,42 L-38,46 Z"/>
      <path d="M-46,18 L-56,22 L-52,28 Z"/>
      <path d="M-50,0 L-60,0 L-60,-4 L-52,-4 Z"/>
      <path d="M-46,-18 L-56,-22 L-52,-28 Z"/>
      <path d="M-35,-35 L-42,-42 L-38,-46 Z"/>
      <path d="M-18,-46 L-22,-56 L-17,-58 Z"/>
    </g>
    <g stroke="#7a4818" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-34" x2="0" y2="-9"/>
      <line x1="34" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="34" x2="0" y2="9"/>
      <line x1="-34" y1="0" x2="-9" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="url(#p9p1steel)"/>
    <circle cx="0" cy="0" r="3.4" fill="#1a1c20"/>
    <ellipse cx="-22" cy="-22" rx="14" ry="22" fill="url(#p9p1brassGleam)" filter="url(#p9p1glow)" opacity="0.55" transform="rotate(-30 -22 -22)"/>
  </g>

  <!-- ===== CENTER WHEEL ===== -->
  <g transform="translate(310 110)">
    <circle cx="0" cy="0" r="34" fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.7"/>
    <g fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.4">
      <path d="M0,-34 L2,-42 L-2,-42 Z"/>
      <path d="M17,-28 L22,-34 L18,-38 Z"/>
      <path d="M28,-17 L34,-22 L30,-26 Z"/>
      <path d="M34,0 L42,0 L42,-2 L30,-2 Z"/>
      <path d="M28,17 L34,22 L30,26 Z"/>
      <path d="M17,28 L22,34 L18,38 Z"/>
      <path d="M0,34 L2,42 L-2,42 Z"/>
      <path d="M-17,28 L-22,34 L-18,38 Z"/>
      <path d="M-28,17 L-34,22 L-30,26 Z"/>
      <path d="M-34,0 L-42,0 L-42,-2 L-30,-2 Z"/>
      <path d="M-28,-17 L-34,-22 L-30,-26 Z"/>
      <path d="M-17,-28 L-22,-34 L-18,-38 Z"/>
    </g>
    <g stroke="#7a4818" stroke-width="1.4" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-7"/>
      <line x1="22" y1="0" x2="7" y2="0"/>
      <line x1="0" y1="22" x2="0" y2="7"/>
      <line x1="-22" y1="0" x2="-7" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="url(#p9p1steel)"/>
    <circle cx="0" cy="0" r="2.4" fill="#1a1c20"/>
  </g>

  <!-- ===== THIRD WHEEL ===== -->
  <g transform="translate(420 90)">
    <circle cx="0" cy="0" r="28" fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.55"/>
    <g fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.4">
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(0)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(30)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(60)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(90)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(120)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(150)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(180)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(210)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(240)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(270)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(300)"/>
      <path d="M0,-28 L2,-34 L-2,-34 Z" transform="rotate(330)"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="url(#p9p1steel)"/>
    <circle cx="0" cy="0" r="2" fill="#1a1c20"/>
  </g>

  <!-- ===== FOURTH WHEEL — TARGET — sixty-four-tooth wheel + sixteen-tooth pinion ===== -->
  <g transform="translate(560 110)">
    <!-- Sixty-four-tooth wheel -->
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="url(#p9p1amberHeart)" filter="url(#p9p1glow)" opacity="0.85"/>
    <circle cx="0" cy="0" r="40" fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.85"/>
    <!-- Many fine teeth (suggested as a band of triangles) -->
    <g fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.3">
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(0)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(15)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(30)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(45)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(60)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(75)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(90)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(105)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(120)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(135)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(150)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(165)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(180)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(195)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(210)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(225)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(240)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(255)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(270)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(285)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(300)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(315)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(330)"/>
      <path d="M0,-40 L1,-44 L-1,-44 Z" transform="rotate(345)"/>
    </g>
    <g stroke="#7a4818" stroke-width="1.6" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-9"/>
      <line x1="26" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="26" x2="0" y2="9"/>
      <line x1="-26" y1="0" x2="-9" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="url(#p9p1steel)"/>
    <circle cx="0" cy="0" r="3" fill="#1a1c20"/>
    <ellipse cx="-14" cy="-14" rx="12" ry="20" fill="url(#p9p1brassGleam)" filter="url(#p9p1glow)" opacity="0.65"/>
  </g>
  <!-- Sixteen-tooth pinion (smaller, paired with target wheel) -->
  <g transform="translate(640 80)">
    <circle cx="0" cy="0" r="14" fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.55"/>
    <g fill="url(#p9p1brass)" stroke="#7a4818" stroke-width="0.4">
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(0)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(22.5)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(45)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(67.5)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(90)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(112.5)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(135)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(157.5)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(180)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(202.5)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(225)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(247.5)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(270)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(292.5)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(315)"/>
      <path d="M0,-14 L2,-18 L-2,-18 Z" transform="rotate(337.5)"/>
    </g>
    <circle cx="0" cy="0" r="3.4" fill="url(#p9p1steel)"/>
    <circle cx="0" cy="0" r="1.4" fill="#1a1c20"/>
  </g>
  <text x="600" y="170" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="6" fill="#fff8e8" opacity="0.85" font-weight="700" filter="url(#p9p1bloom)">TARGET</text>

  <!-- ===== STEEL ARBORS connecting gears ===== -->
  <g>
    <rect x="187" y="60" width="6" height="100" fill="url(#p9p1steel)"/>
    <line x1="190" y1="80" x2="190" y2="140" stroke="#fff8e8" stroke-width="0.55" opacity="0.65"/>
    <rect x="307" y="80" width="6" height="80" fill="url(#p9p1steel)"/>
    <rect x="417" y="60" width="6" height="80" fill="url(#p9p1steel)"/>
    <rect x="557" y="60" width="6" height="100" fill="url(#p9p1steel)"/>
  </g>

  <!-- ===== WREN tiny on base plate, moving toward target (right side) ===== -->
  <g transform="translate(490 195)">
    <ellipse cx="-2" cy="6" rx="1.6" ry="0.85" fill="#0a0408"/>
    <ellipse cx="2" cy="6" rx="1.6" ry="0.85" fill="#0a0408"/>
    <rect x="-3" y="-6" width="2.4" height="12" fill="url(#p9p1suit)"/>
    <rect x="0.6" y="-6" width="2.4" height="12" fill="url(#p9p1suit)"/>
    <path d="M-4,-6 L-4,-18 L4,-18 L4,-6 Z" fill="url(#p9p1suit)"/>
    <ellipse cx="0" cy="-22" rx="2.4" ry="3" fill="#a86838"/>
    <ellipse cx="0" cy="-26" rx="1.6" ry="1" fill="#0a0604"/>
    <!-- Scanner beam projecting forward -->
    <path d="M4,-12 L40,-22 L40,-2 L4,-6 Z" fill="url(#p9p1scannerBeam)" filter="url(#p9p1glow)" opacity="0.65"/>
    <line x1="4" y1="-12" x2="40" y2="-22" stroke="#ffd078" stroke-width="0.4" opacity="0.55"/>
    <line x1="4" y1="-2" x2="40" y2="-2" stroke="#ffd078" stroke-width="0.4" opacity="0.55"/>
  </g>

  <!-- WREN comms (top-left) -->
  <g>
    <rect x="14" y="14" width="334" height="34" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">The mechanism is... remarkable. Tolerances extraordinary.</text>

  <!-- SABLE dry response -->
  <g>
    <rect x="540" y="14" width="190" height="34" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="548" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a606a" font-weight="700">SABLE ((dry))</text>
  <text x="548" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">Can you get the gear?</text>

  <!-- WREN reply (bottom) -->
  <g>
    <rect x="14" y="56" width="280" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">Yes. Moving to the fourth wheel now.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q200,82 400,78 Q580,76 742,80"/>
    <path d="M0,200 Q200,202 400,198 Q580,196 742,200"/>
  </g>
</svg>
