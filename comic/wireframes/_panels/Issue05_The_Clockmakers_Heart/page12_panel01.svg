<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 471" width="742" height="471">
  <title>Issue 5 — Page 12 — Panel 1: Wren mid-reach for target gear, freezes at door bell — cathedral of clockwork — TING-a-ling</title>
  <desc>28mm wide. Fairy-scale interior of clock mechanism. Wren crouches on stationary brass plate between two rotating gear trains. Steel shafts cross overhead like girders. Target gear gleams in mid-ground. Hand extends toward it then freezes at door bell. SFX TING-a-ling reverberates through brass. Dialog: WREN: No.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p12p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p12p1brassDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p12p1brassWarm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="p12p1targetGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p12p1suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#5a2818"/>
    </linearGradient>
    <linearGradient id="p12p1skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a5828"/>
    </linearGradient>
    <radialGradient id="p12p1ambientAmber" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p12p1holoDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3018" stop-opacity="0"/>
    </radialGradient>
    <filter id="p12p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p12p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="471" fill="url(#p12p1bg)"/>
  <rect width="742" height="471" fill="url(#p12p1ambientAmber)"/>

  <!-- Steel girder shafts crossing overhead -->
  <g>
    <rect x="0" y="38" width="742" height="14" fill="url(#p12p1brassDeep)"/>
    <line x1="0" y1="38" x2="742" y2="38" stroke="#fff8e8" stroke-width="0.85" opacity="0.55" filter="url(#p12p1bloom)"/>
    <line x1="0" y1="52" x2="742" y2="52" stroke="#1a0c04" stroke-width="0.55"/>
    <rect x="0" y="80" width="742" height="10" fill="#5a3018"/>
    <line x1="0" y1="80" x2="742" y2="80" stroke="#a86838" stroke-width="0.55"/>
    <rect x="120" y="14" width="20" height="36" fill="#3a1808"/>
    <rect x="420" y="14" width="20" height="36" fill="#3a1808"/>
    <rect x="640" y="14" width="20" height="36" fill="#3a1808"/>
  </g>

  <!-- LEFT GEAR TRAIN — large rotating gear -->
  <g transform="translate(120 280)">
    <circle cx="0" cy="0" r="180" fill="url(#p12p1brassDeep)"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#1a0c04" stroke-width="0.85"/>
    <circle cx="0" cy="0" r="120" fill="#3a1808" opacity="0.55"/>
    <circle cx="0" cy="0" r="40" fill="#1a0c04"/>
    <!-- Spokes -->
    <g stroke="#1a0c04" stroke-width="3.5" opacity="0.85">
      <line x1="0" y1="-150" x2="0" y2="150"/>
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="-106" y1="-106" x2="106" y2="106"/>
      <line x1="106" y1="-106" x2="-106" y2="106"/>
    </g>
    <!-- Gear teeth (radial) -->
    <g fill="url(#p12p1brassWarm)">
      <rect x="-7" y="-194" width="14" height="14"/>
      <rect x="-7" y="180" width="14" height="14"/>
      <rect x="-194" y="-7" width="14" height="14"/>
      <rect x="180" y="-7" width="14" height="14"/>
      <g transform="rotate(30)"><rect x="-7" y="-194" width="14" height="14"/></g>
      <g transform="rotate(60)"><rect x="-7" y="-194" width="14" height="14"/></g>
      <g transform="rotate(120)"><rect x="-7" y="-194" width="14" height="14"/></g>
      <g transform="rotate(150)"><rect x="-7" y="-194" width="14" height="14"/></g>
      <g transform="rotate(210)"><rect x="-7" y="-194" width="14" height="14"/></g>
      <g transform="rotate(240)"><rect x="-7" y="-194" width="14" height="14"/></g>
      <g transform="rotate(300)"><rect x="-7" y="-194" width="14" height="14"/></g>
      <g transform="rotate(330)"><rect x="-7" y="-194" width="14" height="14"/></g>
    </g>
    <!-- Light reflection -->
    <ellipse cx="-50" cy="-80" rx="40" ry="80" fill="#fff8e8" opacity="0.25" filter="url(#p12p1bloom)"/>
  </g>

  <!-- RIGHT GEAR TRAIN — second large rotating gear, partially visible -->
  <g transform="translate(620 280)">
    <circle cx="0" cy="0" r="170" fill="url(#p12p1brassDeep)"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1a0c04" stroke-width="0.85"/>
    <circle cx="0" cy="0" r="110" fill="#3a1808" opacity="0.55"/>
    <circle cx="0" cy="0" r="38" fill="#1a0c04"/>
    <g stroke="#1a0c04" stroke-width="3.5" opacity="0.85">
      <line x1="0" y1="-140" x2="0" y2="140"/>
      <line x1="-140" y1="0" x2="140" y2="0"/>
      <line x1="-100" y1="-100" x2="100" y2="100"/>
      <line x1="100" y1="-100" x2="-100" y2="100"/>
    </g>
    <g fill="url(#p12p1brassWarm)">
      <rect x="-7" y="-184" width="14" height="14"/>
      <rect x="-7" y="170" width="14" height="14"/>
      <rect x="-184" y="-7" width="14" height="14"/>
      <rect x="170" y="-7" width="14" height="14"/>
      <g transform="rotate(45)"><rect x="-7" y="-184" width="14" height="14"/></g>
      <g transform="rotate(90)"><rect x="-184" y="-7" width="14" height="14"/></g>
      <g transform="rotate(135)"><rect x="-7" y="-184" width="14" height="14"/></g>
      <g transform="rotate(225)"><rect x="-7" y="-184" width="14" height="14"/></g>
      <g transform="rotate(315)"><rect x="-7" y="-184" width="14" height="14"/></g>
    </g>
    <ellipse cx="40" cy="-60" rx="30" ry="70" fill="#fff8e8" opacity="0.18" filter="url(#p12p1bloom)"/>
  </g>

  <!-- STATIONARY BRASS PLATE — center, between gears, where Wren stands -->
  <g transform="translate(371 320)">
    <rect x="-90" y="-12" width="180" height="60" fill="url(#p12p1brassWarm)"/>
    <rect x="-90" y="-12" width="180" height="60" fill="none" stroke="#1a0c04" stroke-width="0.85"/>
    <line x1="-90" y1="-12" x2="90" y2="-12" stroke="#fff8e8" stroke-width="0.7" opacity="0.65" filter="url(#p12p1bloom)"/>
    <!-- Plate texture -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="-80" y1="14" x2="80" y2="14" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="-80" y1="28" x2="80" y2="28" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="-80" y1="42" x2="80" y2="42" stroke="#3a1808" stroke-width="0.4"/>
  </g>

  <!-- TARGET GEAR — smaller, exquisite, gleaming, mid-ground -->
  <g transform="translate(440 200)">
    <circle cx="0" cy="0" r="36" fill="url(#p12p1targetGear)"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#5a3018" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="22" fill="#7a4818" opacity="0.65"/>
    <circle cx="0" cy="0" r="10" fill="#1a0c04"/>
    <!-- Fine teeth -->
    <g stroke="#5a3018" stroke-width="0.7">
      <line x1="0" y1="-36" x2="0" y2="-40"/>
      <line x1="0" y1="36" x2="0" y2="40"/>
      <line x1="-36" y1="0" x2="-40" y2="0"/>
      <line x1="36" y1="0" x2="40" y2="0"/>
      <line x1="-25" y1="-25" x2="-28" y2="-28"/>
      <line x1="25" y1="-25" x2="28" y2="-28"/>
      <line x1="-25" y1="25" x2="-28" y2="28"/>
      <line x1="25" y1="25" x2="28" y2="28"/>
    </g>
    <!-- Glow -->
    <circle cx="0" cy="0" r="50" fill="#ffd078" opacity="0.35" filter="url(#p12p1glow)"/>
    <ellipse cx="-10" cy="-10" rx="6" ry="3" fill="#fff8e8" opacity="0.85" filter="url(#p12p1bloom)"/>
    <!-- Highlight label -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffd078" stroke-width="0.55" opacity="0.65" stroke-dasharray="2,4" filter="url(#p12p1bloom)"/>
  </g>

  <!-- WREN — small figure on brass plate, hand extending toward target gear, FROZEN -->
  <g transform="translate(371 296)">
    <!-- Body -->
    <path d="M-6,0 L-7,18 L7,18 L6,0 Z" fill="url(#p12p1suit)"/>
    <!-- Suit accent — DIM copper-gold (deliberately dim) -->
    <line x1="-4" y1="3" x2="4" y2="3" stroke="#ffaa48" stroke-width="0.4" opacity="0.55"/>
    <!-- Shoulders -->
    <ellipse cx="-7" cy="-4" rx="3.4" ry="2" fill="url(#p12p1suit)"/>
    <ellipse cx="7" cy="-4" rx="3.4" ry="2" fill="url(#p12p1suit)"/>
    <!-- SCORCH MARK on left shoulder -->
    <ellipse cx="-7" cy="-4" rx="2" ry="1.2" fill="#1a0c04" opacity="0.7"/>
    <!-- Head -->
    <circle cx="0" cy="-7" r="3" fill="url(#p12p1skin)"/>
    <!-- Hair UP bun + strands -->
    <ellipse cx="0" cy="-9" rx="2" ry="1.4" fill="#0a0604"/>
    <path d="M-3,-7 Q-4,-5 -3,-2" stroke="#0a0604" stroke-width="0.4" fill="none"/>
    <!-- Hand reaching toward target gear (arm extended, hand stops mid-air, body language frozen) -->
    <line x1="3" y1="-2" x2="34" y2="-26" stroke="#7a4818" stroke-width="2.4"/>
    <ellipse cx="34" cy="-26" rx="2" ry="1.4" fill="url(#p12p1skin)"/>
    <!-- Arm tense — knee crouched -->
    <line x1="-4" y1="14" x2="-7" y2="22" stroke="#5a2818" stroke-width="1.4"/>
    <line x1="4" y1="14" x2="7" y2="22" stroke="#5a2818" stroke-width="1.4"/>
    <!-- DIM copper-gold holo at wrist (faint, suppressed) -->
    <circle cx="3" cy="-2" r="1.2" fill="#ffaa48" opacity="0.45" filter="url(#p12p1bloom)"/>
    <circle cx="3" cy="-2" r="3.4" fill="url(#p12p1holoDim)" opacity="0.55"/>
  </g>

  <!-- SFX — TING-a-ling (distant, distorted through brass — wavy ribbon top right) -->
  <g transform="translate(680 100)">
    <text x="0" y="0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#ffd078" font-style="italic" font-weight="700" text-anchor="end" filter="url(#p12p1bloom)" opacity="0.85">TING</text>
    <text x="0" y="22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#ffd078" font-style="italic" font-weight="600" text-anchor="end" filter="url(#p12p1bloom)" opacity="0.75">a-ling</text>
    <!-- Wavy lines suggesting reverb -->
    <path d="M-90,5 Q-80,2 -70,5 Q-60,8 -50,5" stroke="#ffd078" stroke-width="0.55" fill="none" opacity="0.55"/>
    <path d="M-90,28 Q-80,25 -70,28 Q-60,31 -50,28" stroke="#ffd078" stroke-width="0.55" fill="none" opacity="0.45"/>
  </g>

  <!-- DIALOG — WREN under breath (small balloon, near her position) -->
  <g transform="translate(280 200)">
    <ellipse cx="0" cy="0" rx="44" ry="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M20,18 L36,32 L24,20 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-32" y="-6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="-32" y="10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-style="italic" font-weight="600">"No."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,120 Q180,118 360,122 Q540,124 742,120"/>
    <path d="M0,400 Q180,402 360,398 Q540,396 742,400"/>
  </g>
</svg>
