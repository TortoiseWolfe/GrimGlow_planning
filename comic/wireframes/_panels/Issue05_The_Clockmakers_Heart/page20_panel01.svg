<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 364" width="742" height="364">
  <title>Issue 5 — Page 20 — Panel 1: Precision gear isolated — file marks visible — human artifact rendered as art</title>
  <desc>100mm ECU. Stolen gear set on Wren's workstation. Isolated against dark background. Lit copper-gold from above + warm amber from below. Every tooth perfect, axle polished. File marks consistent — hand-tool precision rivaling machine output. Glowing at intersection of fairy and human light. Caption: WREN: In my time this would be printed in a fabricator. Molecular deposition. Perfect every time.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p20p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="p20p1gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="40%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <linearGradient id="p20p1gearDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="50%" stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <radialGradient id="p20p1holoTop" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffaa48" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p1amberBottom" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p20p1gearHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a4818" stop-opacity="0"/>
    </radialGradient>
    <filter id="p20p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p20p1glow"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="742" height="364" fill="url(#p20p1bg)"/>

  <!-- Holographic light from above -->
  <rect width="742" height="364" fill="url(#p20p1holoTop)"/>
  <!-- Warm amber from below -->
  <rect width="742" height="364" fill="url(#p20p1amberBottom)"/>

  <!-- Workstation surface (faint, suggestion) -->
  <rect y="280" width="742" height="84" fill="#3a1808" opacity="0.45"/>
  <line x1="0" y1="280" x2="742" y2="280" stroke="#5a3018" stroke-width="0.55" opacity="0.55"/>

  <!-- ===== PRECISION GEAR — isolated, elevated, beautiful ===== -->
  <g transform="translate(371 200)">
    <!-- Halo at intersection of two lights -->
    <circle cx="0" cy="0" r="200" fill="url(#p20p1gearHalo)" filter="url(#p20p1glow)"/>

    <!-- COMPOUND GEAR — two wheels different sizes on shared axle -->
    <!-- LARGER WHEEL (back/lower) -->
    <ellipse cx="0" cy="0" rx="160" ry="120" fill="url(#p20p1gear)"/>
    <ellipse cx="0" cy="0" rx="156" ry="116" fill="none" stroke="#5a3018" stroke-width="0.85"/>
    <ellipse cx="0" cy="0" rx="100" ry="75" fill="#7a4818" opacity="0.55"/>
    <!-- Spokes (six, evenly spaced) -->
    <g stroke="#5a3018" stroke-width="2.4" opacity="0.85">
      <line x1="0" y1="-110" x2="0" y2="110"/>
      <line x1="-130" y1="0" x2="130" y2="0"/>
      <line x1="-92" y1="-78" x2="92" y2="78"/>
      <line x1="92" y1="-78" x2="-92" y2="78"/>
    </g>

    <!-- Fine teeth around outer rim (very many, very even) -->
    <g fill="url(#p20p1gear)" stroke="#5a3018" stroke-width="0.4">
      <rect x="-3" y="-168" width="6" height="9"/>
      <rect x="-3" y="159" width="6" height="9"/>
      <rect x="-168" y="-3" width="9" height="6"/>
      <rect x="159" y="-3" width="9" height="6"/>
      <g transform="rotate(15)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(30)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(45)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(60)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(75)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(105)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(120)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(135)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(150)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(165)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(195)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(210)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(225)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(240)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(255)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(285)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(300)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(315)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(330)"><rect x="-3" y="-168" width="6" height="9"/></g>
      <g transform="rotate(345)"><rect x="-3" y="-168" width="6" height="9"/></g>
    </g>

    <!-- File marks (visible at extreme magnification) — fine cross-hatch, consistent -->
    <g stroke="#5a3018" stroke-width="0.4" opacity="0.55">
      <line x1="-80" y1="-30" x2="-78" y2="-32"/>
      <line x1="-78" y1="-26" x2="-76" y2="-28"/>
      <line x1="-76" y1="-22" x2="-74" y2="-24"/>
      <line x1="-74" y1="-18" x2="-72" y2="-20"/>
      <line x1="-72" y1="-14" x2="-70" y2="-16"/>
      <line x1="60" y1="-30" x2="62" y2="-32"/>
      <line x1="62" y1="-26" x2="64" y2="-28"/>
      <line x1="64" y1="-22" x2="66" y2="-24"/>
      <line x1="66" y1="-18" x2="68" y2="-20"/>
      <line x1="-30" y1="40" x2="-32" y2="42"/>
      <line x1="-26" y1="44" x2="-28" y2="46"/>
      <line x1="-22" y1="48" x2="-24" y2="50"/>
      <line x1="22" y1="40" x2="24" y2="42"/>
      <line x1="26" y1="44" x2="28" y2="46"/>
      <line x1="30" y1="48" x2="32" y2="50"/>
    </g>

    <!-- SMALLER WHEEL (front, on shared axle) -->
    <circle cx="0" cy="0" r="60" fill="url(#p20p1gear)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#5a3018" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="34" fill="#7a4818" opacity="0.65"/>
    <circle cx="0" cy="0" r="11" fill="#1a0c04"/>
    <!-- Smaller wheel teeth -->
    <g fill="url(#p20p1gear)" stroke="#5a3018" stroke-width="0.4">
      <rect x="-2" y="-66" width="4" height="6"/>
      <rect x="-2" y="60" width="4" height="6"/>
      <rect x="-66" y="-2" width="6" height="4"/>
      <rect x="60" y="-2" width="6" height="4"/>
      <g transform="rotate(20)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(40)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(60)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(80)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(100)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(120)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(140)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(160)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(200)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(220)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(240)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(260)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(280)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(300)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(320)"><rect x="-2" y="-66" width="4" height="6"/></g>
      <g transform="rotate(340)"><rect x="-2" y="-66" width="4" height="6"/></g>
    </g>

    <!-- BRIGHT HIGHLIGHTS (warm increment) -->
    <path d="M-100,-100 Q0,-130 100,-100" stroke="#fff8e8" stroke-width="2" fill="none" opacity="0.85" filter="url(#p20p1bloom)"/>
    <ellipse cx="-30" cy="-50" rx="14" ry="9" fill="#fff8e8" opacity="0.75" filter="url(#p20p1bloom)"/>
    <ellipse cx="-14" cy="-14" rx="6" ry="4" fill="#fff8e8" opacity="0.85" filter="url(#p20p1bloom)"/>
    <!-- Cool blue catching one edge -->
    <path d="M100,-80 Q120,0 100,80" stroke="#a8c8e8" stroke-width="0.85" fill="none" opacity="0.65" filter="url(#p20p1bloom)"/>
  </g>

  <!-- CAPTION (Wren) -->
  <g>
    <rect x="14" y="14" width="320" height="48" rx="2" fill="#f5ecd8" stroke="#c8b898" stroke-width="0.85" opacity="0.95" filter="url(#balloonShadow)"/>
    <text x="22" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#c87a35" font-weight="700">WREN</text>
    <text x="22" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">"In my time, this would be printed in</text>
    <text x="22" y="56" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a4a30" font-style="italic" font-weight="500">a fabricator. Molecular deposition. Perfect every time."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q180,138 360,142 Q540,144 742,140"/>
    <path d="M0,310 Q180,308 360,312 Q540,314 742,310"/>
  </g>
</svg>
