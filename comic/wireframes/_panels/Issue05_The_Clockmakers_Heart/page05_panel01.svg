<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 364" width="494" height="364">
  <title>Issue 5 — Page 5 — Panel 1: HOROLOGY shop facade — plate glass blazing amber, grandfather clock silhouette in back, gas lamp beside door</title>
  <desc>35mm wide. Stock brick facade. Plate glass display window enormous. HOROLOGY gold-leaf on fascia. Clocks crowd display. Grandfather clock tall silhouette in back. Clockmaker's shadowed shape moving at workbench. Gas lamp blazing amber beside door. Grey-blue dusk street.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p5p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3850"/>
      <stop offset="100%" stop-color="#5a5860"/>
    </linearGradient>
    <linearGradient id="p5p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="p5p1darkGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3818"/>
      <stop offset="100%" stop-color="#0a2008"/>
    </linearGradient>
    <linearGradient id="p5p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <radialGradient id="p5p1windowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd078" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p5p1gaslight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffd078" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a87838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p5p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="p5p1glow"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- DUSK SKY top -->
  <rect width="494" height="60" fill="url(#p5p1sky)"/>

  <!-- BRICK FACADE -->
  <rect x="0" y="60" width="494" height="240" fill="url(#p5p1brick)"/>
  <g stroke="#0a0604" stroke-width="0.55" opacity="0.6">
    <line x1="0" y1="80" x2="494" y2="80"/>
    <line x1="0" y1="100" x2="494" y2="100"/>
    <line x1="0" y1="120" x2="494" y2="120"/>
    <line x1="0" y1="140" x2="494" y2="140"/>
    <line x1="0" y1="160" x2="494" y2="160"/>
    <line x1="0" y1="180" x2="494" y2="180"/>
    <line x1="0" y1="200" x2="494" y2="200"/>
    <line x1="0" y1="220" x2="494" y2="220"/>
    <line x1="0" y1="240" x2="494" y2="240"/>
  </g>
  <g stroke="#0a0604" stroke-width="0.4" opacity="0.5">
    <line x1="40" y1="60" x2="40" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="100"/>
    <line x1="160" y1="100" x2="160" y2="120"/>
    <line x1="220" y1="120" x2="220" y2="140"/>
    <line x1="280" y1="140" x2="280" y2="160"/>
    <line x1="340" y1="160" x2="340" y2="180"/>
    <line x1="400" y1="180" x2="400" y2="200"/>
    <line x1="60" y1="200" x2="60" y2="220"/>
    <line x1="180" y1="220" x2="180" y2="240"/>
    <line x1="320" y1="60" x2="320" y2="80"/>
    <line x1="460" y1="80" x2="460" y2="100"/>
  </g>

  <!-- ===== FASCIA BOARD (dark green timber surround) above shop window ===== -->
  <rect x="40" y="120" width="414" height="40" fill="url(#p5p1darkGreen)"/>
  <line x1="40" y1="120" x2="454" y2="120" stroke="#0a1808" stroke-width="0.85"/>
  <line x1="40" y1="160" x2="454" y2="160" stroke="#0a1808" stroke-width="0.85"/>
  <!-- HOROLOGY gold leaf -->
  <text x="247" y="148" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#ffd078" font-weight="700" letter-spacing="6" filter="url(#p5p1bloom)">HOROLOGY</text>
  <text x="247" y="148" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#fff8e8" font-weight="700" letter-spacing="6" opacity="0.5">HOROLOGY</text>

  <!-- ===== PLATE GLASS WINDOW (huge) ===== -->
  <rect x="60" y="160" width="380" height="120" fill="url(#p5p1darkGreen)"/>
  <rect x="64" y="164" width="372" height="112" fill="#3a2010"/>
  <!-- Window glass with warm amber interior glow -->
  <rect x="68" y="168" width="364" height="104" fill="#7a5028"/>
  <ellipse cx="250" cy="220" rx="220" ry="80" fill="url(#p5p1windowAmber)" filter="url(#p5p1glow)" opacity="0.95"/>
  <!-- Window mullions -->
  <line x1="250" y1="168" x2="250" y2="272" stroke="#0a1808" stroke-width="1.2"/>
  <line x1="68" y1="220" x2="432" y2="220" stroke="#0a1808" stroke-width="1.2"/>

  <!-- ===== CLOCKS IN DISPLAY ===== -->
  <!-- Wall clocks (left side) -->
  <g transform="translate(110 195)">
    <circle cx="0" cy="0" r="14" fill="#3a2010" stroke="#a86838" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="11" fill="#fff8e8" opacity="0.85"/>
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="0" y1="0" x2="5" y2="3" stroke="#1a0c04" stroke-width="0.55"/>
  </g>
  <g transform="translate(160 200)">
    <rect x="-12" y="-9" width="24" height="18" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="6" fill="#fff8e8" opacity="0.85"/>
  </g>
  <!-- Mantel clocks (center top) -->
  <g transform="translate(200 195)">
    <path d="M-10,9 L-10,-3 L-7,-9 L7,-9 L10,-3 L10,9 Z" fill="#5a3018" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="-1" r="5" fill="#fff8e8" opacity="0.85"/>
  </g>
  <g transform="translate(310 197)">
    <path d="M-9,9 L-9,-2 L-6,-7 L6,-7 L9,-2 L9,9 Z" fill="#5a3018" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="4.4" fill="#fff8e8" opacity="0.85"/>
  </g>
  <!-- Wall clocks (right side) -->
  <g transform="translate(380 200)">
    <circle cx="0" cy="0" r="11" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="9" fill="#fff8e8" opacity="0.85"/>
    <line x1="0" y1="0" x2="-5" y2="-5" stroke="#1a0c04" stroke-width="0.55"/>
  </g>
  <g transform="translate(140 250)">
    <circle cx="0" cy="0" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="7" fill="#fff8e8" opacity="0.85"/>
  </g>
  <g transform="translate(360 250)">
    <circle cx="0" cy="0" r="9" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="7" fill="#fff8e8" opacity="0.85"/>
  </g>
  <!-- Pocket watches arranged -->
  <g transform="translate(180 260)">
    <circle cx="0" cy="0" r="5" fill="#a86838" stroke="#7a5028" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="3.4" fill="#fff8e8" opacity="0.85"/>
  </g>
  <g transform="translate(320 260)">
    <circle cx="0" cy="0" r="5" fill="#a86838" stroke="#7a5028" stroke-width="0.55"/>
    <circle cx="0" cy="0" r="3.4" fill="#fff8e8" opacity="0.85"/>
  </g>
  <!-- Display shelves -->
  <line x1="68" y1="232" x2="432" y2="232" stroke="#3a1808" stroke-width="0.7"/>

  <!-- ===== GRANDFATHER CLOCK in BACK (TARGET) — tall silhouette ===== -->
  <g transform="translate(250 200)">
    <rect x="-22" y="-30" width="44" height="80" fill="#3a1808" stroke="#5a2818" stroke-width="0.7"/>
    <!-- Glass panel with pendulum visible -->
    <rect x="-16" y="0" width="32" height="40" fill="#0a0604" stroke="#5a2818" stroke-width="0.55"/>
    <!-- Pendulum disc visible -->
    <circle cx="0" cy="32" r="6" fill="#a86838"/>
    <line x1="0" y1="0" x2="0" y2="32" stroke="#a86838" stroke-width="0.85"/>
    <!-- Clock face on top -->
    <circle cx="0" cy="-12" r="11" fill="#3a2010" stroke="#a86838" stroke-width="0.55"/>
    <circle cx="0" cy="-12" r="9" fill="#fff8e8" opacity="0.85"/>
    <line x1="0" y1="-12" x2="0" y2="-19" stroke="#1a0c04" stroke-width="0.7"/>
    <line x1="0" y1="-12" x2="5" y2="-9" stroke="#1a0c04" stroke-width="0.55"/>
    <!-- Crown moulding -->
    <rect x="-25" y="-32" width="50" height="4" fill="#5a2818"/>
    <!-- Highlight on grandfather clock -->
    <ellipse cx="0" cy="0" rx="34" ry="50" fill="#fff8e8" opacity="0.18" filter="url(#p5p1bloom)"/>
  </g>

  <!-- CLOCKMAKER shadow at bench (behind display, deeper into shop) -->
  <g transform="translate(380 230)" opacity="0.45">
    <ellipse cx="0" cy="0" rx="9" ry="14" fill="#1a0c04"/>
    <ellipse cx="0" cy="-12" rx="6" ry="6" fill="#1a0c04"/>
  </g>

  <!-- DOOR (left of window) -->
  <rect x="40" y="180" width="20" height="100" fill="url(#p5p1darkGreen)"/>
  <rect x="42" y="182" width="16" height="96" fill="#0a2008"/>
  <line x1="50" y1="182" x2="50" y2="278" stroke="#0a1808" stroke-width="0.4"/>
  <circle cx="55" cy="240" r="0.85" fill="#a86838"/>

  <!-- ===== GAS LAMP BRACKET beside door — blazing amber sphere ===== -->
  <g transform="translate(28 175)">
    <!-- Halo -->
    <ellipse cx="0" cy="0" rx="34" ry="34" fill="url(#p5p1gaslight)" filter="url(#p5p1glow)" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="14" ry="14" fill="#fff8e8" filter="url(#p5p1bloom)" opacity="0.85"/>
    <!-- Bracket arm -->
    <line x1="14" y1="2" x2="40" y2="2" stroke="#1a0c04" stroke-width="2.4"/>
    <line x1="40" y1="-2" x2="40" y2="2" stroke="#1a0c04" stroke-width="2"/>
    <!-- Lamp head -->
    <rect x="-6" y="-8" width="12" height="10" fill="#3a2818"/>
    <rect x="-5" y="-7" width="10" height="2" fill="#1a0c04"/>
    <!-- Flame core -->
    <circle cx="0" cy="0" r="5" fill="#fff8e8" filter="url(#p5p1bloom)"/>
    <circle cx="0" cy="0" r="2.4" fill="#ffd078"/>
  </g>

  <!-- COBBLESTONE STREET BELOW -->
  <rect x="0" y="300" width="494" height="64" fill="url(#p5p1cobble)"/>
  <ellipse cx="80" cy="335" rx="100" ry="22" fill="#ffaa48" opacity="0.32" filter="url(#p5p1glow)"/>
  <ellipse cx="247" cy="335" rx="160" ry="22" fill="#ffaa48" opacity="0.22" filter="url(#p5p1glow)"/>
  <g stroke="#1a0c04" stroke-width="0.45" opacity="0.55">
    <path d="M0,318 Q160,316 320,320 Q420,322 494,318"/>
    <path d="M0,340 Q160,342 320,338 Q420,336 494,340"/>
    <path d="M0,358 Q160,356 320,360 Q420,362 494,358"/>
  </g>
  <g fill="#1a0c04" opacity="0.55">
    <circle cx="60" cy="328" r="1"/>
    <circle cx="180" cy="334" r="1"/>
    <circle cx="280" cy="328" r="1"/>
    <circle cx="380" cy="334" r="1"/>
    <circle cx="100" cy="350" r="1"/>
    <circle cx="240" cy="354" r="1"/>
    <circle cx="380" cy="350" r="1"/>
  </g>

  <!-- WREN comms (top-left) -->
  <g>
    <rect x="14" y="14" width="320" height="36" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410">There it is. Grandfather clock is in the back.</text>

  <!-- WREN comms 2 -->
  <g>
    <rect x="14" y="56" width="320" height="32" rx="2" fill="white" stroke="#c87a35" stroke-width="0.85" opacity="0.95" stroke-dasharray="2 1" filter="url(#balloonShadow)"/>
  </g>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#c87a35" font-weight="700">WREN ((comms))</text>
  <text x="22" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="500">I need to get inside that mechanism. Deep.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,80 Q120,82 240,78 Q360,76 494,80"/>
    <path d="M0,290 Q120,292 240,288 Q360,286 494,290"/>
  </g>
</svg>
