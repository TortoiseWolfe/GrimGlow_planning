<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 241 364" width="241" height="364">
  <title>Issue 5 — Page 15 — Panel 4: Clockmaker face shift — appraising to surprised interest — recognition of kindred mind</title>
  <desc>85mm CU. Clockmaker's expression CHANGES. Skepticism gives way to surprise. Eyebrows rise. Screwdriver lowers. Architecture of a smile beginning. Theodore has full attention now. Dialog: CLOCKMAKER: ...It is. / CLOCKMAKER: Come here, then. If you know that much.</desc>

  <defs>
    <filter id="balloonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p15p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>
    <linearGradient id="p15p4skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a87858"/>
      <stop offset="50%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a5828"/>
    </linearGradient>
    <linearGradient id="p15p4waistcoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3818"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="p15p4lampWarm" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd078" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <filter id="p15p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="241" height="364" fill="url(#p15p4bg)"/>
  <!-- Closer to lamp now — fuller warmth -->
  <rect width="241" height="364" fill="url(#p15p4lampWarm)" opacity="0.85"/>

  <!-- ===== CLOCKMAKER FACE ===== -->
  <g transform="translate(120 200)">
    <!-- Waistcoat collar -->
    <path d="M-100,150 L-110,90 L110,90 L100,150 Z" fill="url(#p15p4waistcoat)"/>
    <ellipse cx="0" cy="84" rx="22" ry="9" fill="#d8c8a8"/>

    <!-- Head -->
    <ellipse cx="0" cy="0" rx="100" ry="120" fill="url(#p15p4skin)"/>

    <!-- Thinning brown hair -->
    <path d="M-90,-100 Q-70,-122 0,-128 Q70,-122 90,-100 L84,-80 Q56,-110 0,-110 Q-56,-110 -84,-80 Z" fill="#7a5028"/>

    <!-- WIRE-RIMMED SPECTACLES — at bridge of nose now (he's looking through them with attention) -->
    <ellipse cx="-44" cy="-30" rx="20" ry="11" fill="none" stroke="#3a2818" stroke-width="1.4"/>
    <ellipse cx="44" cy="-30" rx="20" ry="11" fill="none" stroke="#3a2818" stroke-width="1.4"/>
    <line x1="-22" y1="-30" x2="22" y2="-30" stroke="#3a2818" stroke-width="0.7"/>
    <!-- Lens shine -->
    <ellipse cx="-50" cy="-32" rx="6" ry="3" fill="#fff8e8" opacity="0.85" filter="url(#p15p4bloom)"/>
    <ellipse cx="38" cy="-32" rx="6" ry="3" fill="#fff8e8" opacity="0.85" filter="url(#p15p4bloom)"/>

    <!-- EYES — pale blue-grey, OPEN/SURPRISED INTEREST (not skeptical now) -->
    <ellipse cx="-36" cy="-26" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="-36" cy="-23" rx="11" ry="7" fill="#a8b8c8"/>
    <circle cx="-36" cy="-23" r="6" fill="#3a4858"/>
    <circle cx="-36" cy="-23" r="2.4" fill="#0a0c14"/>
    <circle cx="-34" cy="-26" r="2" fill="#fff8e8" filter="url(#p15p4bloom)"/>

    <ellipse cx="36" cy="-26" rx="14" ry="9" fill="#fff8e8"/>
    <ellipse cx="36" cy="-23" rx="11" ry="7" fill="#a8b8c8"/>
    <circle cx="36" cy="-23" r="6" fill="#3a4858"/>
    <circle cx="36" cy="-23" r="2.4" fill="#0a0c14"/>
    <circle cx="38" cy="-26" r="2" fill="#fff8e8" filter="url(#p15p4bloom)"/>

    <!-- Brows RAISED (the shift — surprise, attention) -->
    <path d="M-58,-58 L-18,-58" stroke="#5a3018" stroke-width="3" stroke-linecap="round"/>
    <path d="M18,-58 L58,-58" stroke="#5a3018" stroke-width="3" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M-6,0 L-4,40 Q0,44 6,42 L10,0 Z" fill="url(#p15p4skin)" opacity="0.85"/>
    <ellipse cx="-2" cy="40" rx="3" ry="2" fill="#3a1c08" opacity="0.55"/>
    <ellipse cx="6" cy="40" rx="3" ry="2" fill="#3a1c08" opacity="0.55"/>

    <!-- Mouth — ARCHITECTURE OF SMILE beginning — corners turning up slightly -->
    <path d="M-22,68 Q0,72 22,68" stroke="#3a1808" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Slight smile lines (cheeks lifting) -->
    <path d="M-30,56 Q-26,64 -22,68" stroke="#5a3018" stroke-width="0.85" fill="none" opacity="0.65"/>
    <path d="M30,56 Q26,64 22,68" stroke="#5a3018" stroke-width="0.85" fill="none" opacity="0.65"/>

    <!-- Salt-pepper stubble -->
    <g fill="#5a3018" opacity="0.55">
      <circle cx="-26" cy="74" r="0.55"/>
      <circle cx="-14" cy="78" r="0.55"/>
      <circle cx="0" cy="80" r="0.55"/>
      <circle cx="14" cy="78" r="0.55"/>
      <circle cx="26" cy="74" r="0.55"/>
    </g>

    <!-- Strong warm catch on cheeks (closer to lamp) -->
    <ellipse cx="-50" cy="14" rx="14" ry="22" fill="#ffd078" opacity="0.65" filter="url(#p15p4bloom)"/>
    <ellipse cx="50" cy="14" rx="14" ry="22" fill="#ffd078" opacity="0.65" filter="url(#p15p4bloom)"/>
  </g>

  <!-- SCREWDRIVER LOWERING (visible at edge of frame, hand at chin level) -->
  <g transform="translate(40 280)">
    <ellipse cx="0" cy="0" rx="11" ry="6" fill="url(#p15p4skin)"/>
    <rect x="-3" y="-22" width="6" height="14" fill="#5a3018"/>
    <line x1="0" y1="-22" x2="0" y2="-50" stroke="#a8a8a8" stroke-width="1.4"/>
    <line x1="0" y1="-22" x2="0" y2="-50" stroke="#fff8e8" stroke-width="0.4" opacity="0.85" filter="url(#p15p4bloom)"/>
  </g>

  <!-- DIALOG ...It is -->
  <g transform="translate(80 30)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M22,16 L36,28 L24,18 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-40" y="-5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-40" y="11" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600">"...It is."</text>
  </g>

  <!-- DIALOG come here -->
  <g transform="translate(120 330)">
    <ellipse cx="0" cy="0" rx="100" ry="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" opacity="0.95" filter="url(#balloonShadow)"/>
    <path d="M-22,-22 L-32,-36 L-18,-24 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="-90" y="-12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a4030" font-weight="700">CLOCKMAKER</text>
    <text x="-90" y="3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">"Come here, then.</text>
    <text x="-90" y="17" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" font-weight="500">If you know that much."</text>
  </g>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,90 Q60,92 120,88 Q180,86 241,90"/>
    <path d="M0,300 Q60,298 120,302 Q180,304 241,300"/>
  </g>
</svg>
