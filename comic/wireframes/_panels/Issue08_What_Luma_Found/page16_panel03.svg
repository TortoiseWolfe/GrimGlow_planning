<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 16 — Panel 3: The almost-touch — child's open hand reaching, Thresh's gauntleted hand half-raised — the space between worlds</title>
  <desc>50mm medium eye level focused on space between two hands. Right, in warm amber light: child's hand — small rounded fingers, dirt under nails, palm up open reaching into shadow at wall base. Left, in shadow: tiny gauntleted hand — dented ruby-crimson armored glove, approximately one-tenth size of child's hand, half-raised, tense, uncertain. Space between them inches — vast at fairy scale, nothing at human scale. Neither moves. Warm amber light enters shadow zone through child's presence, darkness lightening where child reaches. Faint crimson suit node points glow in dark, marking Thresh's position. Cobblestones between hands textured with dust and grime.</desc>

  <defs>
    <linearGradient id="i8p16p3bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="50%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="i8p16p3warmRight" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p16p3childSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#c89868"/>
    </linearGradient>
    <linearGradient id="i8p16p3cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="i8p16p3gauntlet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <radialGradient id="i8p16p3crimsonNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f04838" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="i8p16p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p16p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p16p3strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p16p3megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p16p3bg)"/>

  <!-- Warm amber bath from RIGHT (child's side) -->
  <ellipse cx="366" cy="150" rx="280" ry="240" fill="url(#i8p16p3warmRight)" filter="url(#i8p16p3megaglow)"/>

  <!-- Cobblestones (mid-frame, where the hands meet) -->
  <rect x="0" y="220" width="366" height="80" fill="url(#i8p16p3cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.7">
    <ellipse cx="60" cy="240" rx="14" ry="6"/>
    <ellipse cx="120" cy="245" rx="14" ry="6"/>
    <ellipse cx="180" cy="240" rx="14" ry="6"/>
    <ellipse cx="240" cy="245" rx="14" ry="6"/>
    <ellipse cx="300" cy="240" rx="14" ry="6"/>
    <ellipse cx="80" cy="270" rx="14" ry="6"/>
    <ellipse cx="160" cy="275" rx="14" ry="6"/>
    <ellipse cx="240" cy="270" rx="14" ry="6"/>
    <ellipse cx="320" cy="275" rx="14" ry="6"/>
  </g>
  <!-- Dust and grime between cobblestones -->
  <g fill="#1a1208" opacity="0.55">
    <ellipse cx="100" cy="255" rx="11" ry="2"/>
    <ellipse cx="220" cy="262" rx="14" ry="2"/>
    <ellipse cx="280" cy="255" rx="11" ry="2"/>
  </g>
  <!-- Light gradient on cobblestones — warm right, dark left -->
  <g opacity="0.55" filter="url(#i8p16p3bloom)">
    <ellipse cx="280" cy="240" rx="40" ry="4" fill="#ffd898" opacity="0.55"/>
    <ellipse cx="320" cy="270" rx="22" ry="3" fill="#ffd898" opacity="0.7"/>
  </g>

  <!-- Faint warm light entering shadow zone (left, where Thresh is) -->
  <ellipse cx="120" cy="200" rx="80" ry="60" fill="url(#i8p16p3warmRight)" filter="url(#i8p16p3megaglow)" opacity="0.18"/>

  <!-- ===== CHILD'S HAND — right side, large, in warm light ===== -->
  <g transform="translate(280 180)">
    <!-- Forearm (cropped at right edge) -->
    <path d="M44,-22 L100,-15 L100,9 L44,3 Z" fill="url(#i8p16p3childSkin)"/>

    <!-- Hand back/wrist -->
    <ellipse cx="0" cy="0" rx="50" ry="28" fill="url(#i8p16p3childSkin)"/>

    <!-- Fingers extending forward (palm up, OPEN) -->
    <!-- Index finger -->
    <ellipse cx="-44" cy="-22" rx="22" ry="6" fill="url(#i8p16p3childSkin)"/>
    <ellipse cx="-66" cy="-26" rx="11" ry="5" fill="url(#i8p16p3childSkin)"/>
    <!-- Middle finger -->
    <ellipse cx="-44" cy="-7" rx="22" ry="6" fill="url(#i8p16p3childSkin)"/>
    <ellipse cx="-72" cy="-9" rx="11" ry="5" fill="url(#i8p16p3childSkin)"/>
    <!-- Ring finger -->
    <ellipse cx="-44" cy="9" rx="22" ry="6" fill="url(#i8p16p3childSkin)"/>
    <ellipse cx="-66" cy="11" rx="11" ry="5" fill="url(#i8p16p3childSkin)"/>
    <!-- Pinky -->
    <ellipse cx="-44" cy="22" rx="22" ry="6" fill="url(#i8p16p3childSkin)"/>
    <ellipse cx="-58" cy="22" rx="9" ry="4" fill="url(#i8p16p3childSkin)"/>
    <!-- Thumb (curled to side) -->
    <ellipse cx="9" cy="22" rx="14" ry="6" fill="url(#i8p16p3childSkin)"/>
    <ellipse cx="22" cy="30" rx="9" ry="5" fill="url(#i8p16p3childSkin)"/>

    <!-- Palm crease lines -->
    <path d="M-22,11 Q-9,3 11,9" stroke="#a87838" stroke-width="0.85" fill="none" opacity="0.55"/>
    <path d="M-22,3 Q-9,-7 11,3" stroke="#a87838" stroke-width="0.85" fill="none" opacity="0.55"/>

    <!-- Tiny fingernails (small, slightly dirty) -->
    <g fill="#fff8d8" opacity="0.55">
      <ellipse cx="-66" cy="-26" rx="3" ry="1"/>
      <ellipse cx="-72" cy="-9" rx="3" ry="1"/>
      <ellipse cx="-66" cy="11" rx="3" ry="1"/>
      <ellipse cx="-58" cy="22" rx="2" ry="0.85"/>
    </g>
    <!-- DIRT UNDER NAILS (working-class child) -->
    <g fill="#3a2010" opacity="0.85">
      <ellipse cx="-68" cy="-26" rx="1.4" ry="0.55"/>
      <ellipse cx="-74" cy="-9" rx="1.4" ry="0.55"/>
      <ellipse cx="-68" cy="11" rx="1.4" ry="0.55"/>
      <ellipse cx="-60" cy="22" rx="1" ry="0.4"/>
    </g>

    <!-- Backlight rim on hand (warm gaslight) -->
    <path d="M-78,-30 Q-50,-44 -22,-30" stroke="#ffd898" stroke-width="0.85" filter="url(#i8p16p3bloom)" opacity="0.85" fill="none"/>
    <path d="M44,30 L80,40" stroke="#ffd898" stroke-width="0.55" filter="url(#i8p16p3bloom)" opacity="0.7" fill="none"/>
  </g>

  <!-- ===== THRESH'S TINY GAUNTLETED HAND — left side, in shadow ===== -->
  <g transform="translate(80 200)">
    <!-- Position glow (faint crimson) -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#i8p16p3crimsonNode)" filter="url(#i8p16p3glow)" opacity="0.4"/>

    <!-- Forearm (gauntlet at frame edge) -->
    <path d="M-22,-9 L-44,-3 L-44,9 L-22,7 Z" fill="url(#i8p16p3gauntlet)"/>
    <!-- Heavy dents on forearm -->
    <ellipse cx="-30" cy="0" rx="3" ry="2" fill="#3a0a0a"/>

    <!-- Hand back -->
    <ellipse cx="-9" cy="-3" rx="11" ry="6" fill="url(#i8p16p3gauntlet)"/>
    <!-- Knuckles raised (gauntleted) -->
    <g stroke="#1a0606" stroke-width="0.55" fill="none">
      <line x1="-15" y1="-7" x2="-15" y2="-3"/>
      <line x1="-9" y1="-9" x2="-9" y2="-3"/>
      <line x1="-3" y1="-9" x2="-3" y2="-3"/>
      <line x1="3" y1="-7" x2="3" y2="-3"/>
    </g>

    <!-- Fingers extended UP (half-raised, uncertain) -->
    <ellipse cx="-15" cy="-11" rx="2" ry="4" fill="url(#i8p16p3gauntlet)"/>
    <ellipse cx="-9" cy="-14" rx="2" ry="5" fill="url(#i8p16p3gauntlet)"/>
    <ellipse cx="-3" cy="-14" rx="2" ry="5" fill="url(#i8p16p3gauntlet)"/>
    <ellipse cx="3" cy="-11" rx="2" ry="4" fill="url(#i8p16p3gauntlet)"/>
    <!-- Thumb -->
    <ellipse cx="9" cy="-3" rx="3" ry="2" fill="url(#i8p16p3gauntlet)"/>

    <!-- Crimson suit node on the back of the gauntlet (the glow visible from the child) -->
    <circle cx="-9" cy="-3" r="1.4" fill="#f04838" filter="url(#i8p16p3strongglow)" opacity="0.95"/>
    <!-- Faint suit accent line on gauntlet -->
    <line x1="-9" y1="-9" x2="-9" y2="3" stroke="#ff8868" stroke-width="0.4" opacity="0.85" filter="url(#i8p16p3bloom)"/>

    <!-- Plate seams -->
    <line x1="-22" y1="-3" x2="-15" y2="-7" stroke="#1a0606" stroke-width="0.4"/>
    <line x1="-22" y1="3" x2="-15" y2="3" stroke="#1a0606" stroke-width="0.4"/>
  </g>

  <!-- ===== THE GAP — inches at human scale, vast at fairy scale ===== -->
  <!-- Subtle visual emphasis on the gap between the hands -->
  <ellipse cx="170" cy="200" rx="60" ry="22" fill="#7a4838" opacity="0.18" filter="url(#i8p16p3glow)"/>

  <!-- Tiny scale comparison hints — the gauntlet is fairy-scale, the child's hand is human-scale -->
  <!-- Approximately 1:10 ratio (Thresh's hand ~22px wide, child's hand ~120px wide) -->

  <!-- Cobblestones BETWEEN the hands (the literal space) — visible textured ground -->
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.7" fill="none">
    <ellipse cx="170" cy="220" rx="11" ry="3"/>
  </g>

  <!-- Faint warm reflected light reaching Thresh's gauntlet (the warmth touching her armor) -->
  <ellipse cx="80" cy="195" rx="22" ry="6" fill="#ffd898" opacity="0.18" filter="url(#i8p16p3bloom)"/>

  <!-- (No dialogue — the space IS the panel) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
