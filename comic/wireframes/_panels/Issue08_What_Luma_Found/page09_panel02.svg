<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 9 — Panel 2: Theodore lifts the heavy floor stone — cold air rises from the void below — face uplit by Luma's scanner from beneath</title>
  <desc>50mm medium shot slight high angle. Theodore strains to lift heavy stone floor slab — old stone, crumbled mortar, slight frame bracing against weight. Beneath lifted stone: absolute darkness. Cold air rises, disturbing centuries of dust into swirling motes. Face lit from below by blue-violet scanner light — eerie uplight casting features in dramatic shadow. Beside opening, Luma leans over edge — tiny figure scanner beam plunging straight down into darkness below, projecting structured blue-violet light into void that hasn't seen light in centuries. Grey church light from above contrasts with absolute black of cavity.</desc>

  <defs>
    <linearGradient id="i8p9p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i8p9p2stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i8p9p2voidDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0408"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <radialGradient id="i8p9p2greyLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#a8a8b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p9p2violetUplight" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p9p2waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p9p2skinUplit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7858b8"/>
      <stop offset="100%" stop-color="#a878e8"/>
    </linearGradient>
    <linearGradient id="i8p9p2lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <filter id="i8p9p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p9p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p9p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p9p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p9p2bg)"/>

  <!-- Grey church light from above -->
  <ellipse cx="183" cy="0" rx="280" ry="100" fill="url(#i8p9p2greyLight)" filter="url(#i8p9p2megaglow)"/>

  <!-- ===== STONE FLOOR (with the slab being lifted) ===== -->
  <rect x="0" y="180" width="366" height="120" fill="url(#i8p9p2stone)"/>
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.7">
    <line x1="0" y1="220" x2="366" y2="220"/>
    <line x1="0" y1="260" x2="366" y2="260"/>
    <line x1="80" y1="180" x2="80" y2="220"/>
    <line x1="200" y1="180" x2="200" y2="220"/>
    <line x1="320" y1="180" x2="320" y2="220"/>
    <line x1="40" y1="220" x2="40" y2="260"/>
    <line x1="280" y1="220" x2="280" y2="260"/>
    <line x1="120" y1="260" x2="120" y2="300"/>
    <line x1="240" y1="260" x2="240" y2="300"/>
  </g>
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="80" cy="200" rx="40" ry="6"/>
    <ellipse cx="280" cy="240" rx="50" ry="6"/>
    <ellipse cx="60" cy="280" rx="40" ry="5"/>
  </g>

  <!-- ===== THE OPENING — absolute darkness with cold air ===== -->
  <g transform="translate(160 230)">
    <!-- Void -->
    <path d="M-50,-22 L50,-22 L60,40 L-60,40 Z" fill="url(#i8p9p2voidDark)"/>
    <!-- Crumbled mortar around edge -->
    <g fill="#3a2818" opacity="0.85">
      <path d="M-50,-22 L-44,-26 L-30,-22 L-22,-25 L-7,-22 L7,-25 L22,-22 L36,-26 L50,-22 Z"/>
    </g>
    <!-- Edge highlights (purple uplight catches edge of opening) -->
    <line x1="-50" y1="-22" x2="50" y2="-22" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p9p2bloom)" opacity="0.85"/>
  </g>

  <!-- Violet uplight pouring from the opening -->
  <ellipse cx="160" cy="200" rx="120" ry="80" fill="url(#i8p9p2violetUplight)" filter="url(#i8p9p2megaglow)"/>

  <!-- ===== DUST MOTES rising and swirling ===== -->
  <g fill="#a8a8b8" opacity="0.7" filter="url(#i8p9p2bloom)">
    <circle cx="140" cy="180" r="0.85"/>
    <circle cx="180" cy="160" r="0.55"/>
    <circle cx="120" cy="140" r="0.7"/>
    <circle cx="200" cy="120" r="0.4"/>
    <circle cx="160" cy="100" r="0.55"/>
    <circle cx="220" cy="80" r="0.4"/>
    <circle cx="100" cy="180" r="0.55"/>
    <circle cx="240" cy="160" r="0.7"/>
    <circle cx="170" cy="140" r="0.4"/>
    <circle cx="130" cy="120" r="0.55"/>
  </g>
  <!-- Swirl path -->
  <g stroke="#a8a8b8" stroke-width="0.4" fill="none" opacity="0.4">
    <path d="M120,200 Q140,180 160,160 Q200,150 220,140"/>
    <path d="M180,200 Q200,180 180,140 Q160,120 180,80"/>
  </g>

  <!-- ===== THE LIFTED STONE SLAB — heavy, tilted up ===== -->
  <g transform="translate(160 200)">
    <!-- Slab body (in motion, tilted up to viewer's right) -->
    <path d="M-50,11 L60,-22 L70,-3 L-44,30 Z" fill="url(#i8p9p2stone)"/>
    <!-- Dark underside -->
    <path d="M-50,11 L-44,30 L-44,32 L-50,13 Z" fill="#1a0808"/>
    <line x1="-50" y1="11" x2="60" y2="-22" stroke="#1a0808" stroke-width="0.7"/>
    <line x1="-44" y1="30" x2="70" y2="-3" stroke="#1a0808" stroke-width="0.7"/>
    <!-- Crumbling mortar -->
    <g fill="#5a3818" opacity="0.85">
      <ellipse cx="-30" cy="14" rx="6" ry="2"/>
      <ellipse cx="22" cy="-9" rx="9" ry="3"/>
      <ellipse cx="50" cy="-18" rx="6" ry="2"/>
    </g>
    <!-- Highlights catching grey light -->
    <line x1="-44" y1="11" x2="60" y2="-20" stroke="#a8a8b8" stroke-width="0.4" filter="url(#i8p9p2bloom)" opacity="0.55"/>
  </g>

  <!-- ===== THEODORE — straining to lift, face uplit by violet ===== -->
  <g transform="translate(280 200)">
    <!-- Body — bracing, leaning back -->
    <path d="M-22,80 L-30,40 L-30,9 L-22,-22 L-9,-44 L9,-50 L22,-44 L30,-22 L36,9 L30,40 L22,80 Z" fill="url(#i8p9p2waistcoat)"/>
    <!-- Buttons -->
    <circle cx="-3" cy="-30" r="1.4" fill="#a86838" filter="url(#i8p9p2bloom)"/>
    <circle cx="-3" cy="-15" r="1.4" fill="#a86838" filter="url(#i8p9p2bloom)"/>
    <circle cx="-3" cy="0" r="1.4" fill="#a86838" filter="url(#i8p9p2bloom)"/>
    <line x1="-3" y1="-44" x2="-3" y2="40" stroke="#1a0808" stroke-width="0.4"/>
    <!-- Breast pocket -->
    <rect x="-18" y="-30" width="11" height="11" fill="#3a2010" opacity="0.85"/>

    <!-- Arms straining forward -->
    <path d="M-30,-22 L-80,-3 L-80,11 L-22,0 Z" fill="url(#i8p9p2waistcoat)"/>
    <path d="M-30,3 L-66,18 L-60,30 L-22,18 Z" fill="url(#i8p9p2waistcoat)"/>

    <!-- Hands gripping the slab -->
    <ellipse cx="-80" cy="3" rx="9" ry="6" fill="url(#i8p9p2skinUplit)"/>
    <ellipse cx="-66" cy="22" rx="9" ry="6" fill="url(#i8p9p2skinUplit)"/>
    <!-- Strained tendons -->
    <line x1="-86" y1="0" x2="-86" y2="9" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>
    <line x1="-78" y1="0" x2="-78" y2="9" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>
    <line x1="-72" y1="0" x2="-72" y2="9" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>
    <!-- White knuckle highlights -->
    <ellipse cx="-80" cy="0" rx="3" ry="1.4" fill="#fff8d8" filter="url(#i8p9p2bloom)" opacity="0.7"/>
    <ellipse cx="-66" cy="22" rx="3" ry="1.4" fill="#fff8d8" filter="url(#i8p9p2bloom)" opacity="0.7"/>

    <!-- Brass gear ring catches violet uplight -->
    <circle cx="-86" cy="0" r="2" fill="#a86838" stroke="#3a1808" stroke-width="0.4"/>
    <ellipse cx="-86" cy="-1" rx="1.4" ry="0.55" fill="#c8a8e8" filter="url(#i8p9p2bloom)" opacity="0.7"/>

    <!-- Legs braced -->
    <path d="M-9,80 L-14,140 L-3,140 L0,80 Z" fill="url(#i8p9p2waistcoat)"/>
    <path d="M3,80 L9,140 L18,140 L14,80 Z" fill="url(#i8p9p2waistcoat)"/>

    <!-- White collar -->
    <path d="M-9,-58 L-7,-62 L7,-62 L9,-58 L7,-50 L-7,-50 Z" fill="#e8d0a8"/>
    <!-- Neck -->
    <path d="M-7,-62 L7,-62 L4,-72 L-4,-72 Z" fill="url(#i8p9p2skinUplit)"/>

    <!-- ===== HEAD — UPLIT BY VIOLET (eerie effect) ===== -->
    <ellipse cx="0" cy="-94" rx="14" ry="16" fill="url(#i8p9p2skinUplit)"/>

    <!-- Untidy hair (top in dim grey, bottom catches violet uplight) -->
    <path d="M-14,-108 Q0,-114 14,-108 L14,-90 Q11,-104 0,-104 Q-11,-104 -14,-90 Z" fill="#3a2818"/>
    <!-- Hair tufts -->
    <path d="M-9,-114 L-7,-108" stroke="#3a2818" stroke-width="2"/>
    <path d="M3,-114 L5,-108" stroke="#3a2818" stroke-width="2"/>

    <!-- Brow shadow (CAST UPWARD because uplit) -->
    <ellipse cx="0" cy="-100" rx="14" ry="3" fill="#3a1858" opacity="0.7"/>

    <!-- ===== EYES — straining, uplit -->
    <ellipse cx="-3" cy="-92" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-3" cy="-92" r="0.85" fill="#3a1808"/>
    <ellipse cx="3" cy="-92" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="3" cy="-92" r="0.85" fill="#3a1808"/>
    <!-- Violet catchlight (the uplight effect) -->
    <circle cx="-3" cy="-91" r="0.55" fill="#c8a8e8" filter="url(#i8p9p2bloom)" opacity="0.95"/>
    <circle cx="3" cy="-91" r="0.55" fill="#c8a8e8" filter="url(#i8p9p2bloom)" opacity="0.95"/>

    <!-- Brows down (straining) -->
    <line x1="-7" y1="-99" x2="-1" y2="-99" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="1" y1="-99" x2="7" y2="-99" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Nose — uplit gives shadow inverted -->
    <path d="M-1,-86 L0,-78 L2,-78 L2,-86 Z" fill="#3a1858" opacity="0.55"/>

    <!-- Mouth — gritted teeth (straining) -->
    <line x1="-5" y1="-72" x2="5" y2="-72" stroke="#1a0808" stroke-width="1.4"/>
    <line x1="-5" y1="-70" x2="5" y2="-70" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== LUMA leaning over the edge of the opening ===== -->
  <g transform="translate(80 215)">
    <!-- Body leaning forward, looking down -->
    <path d="M-3,3 L-7,-9 L-9,-22 L-3,-30 L3,-30 L9,-22 L11,-9 L7,3 Z" fill="url(#i8p9p2lumaSuit)"/>
    <!-- Suit accent -->
    <line x1="0" y1="-22" x2="0" y2="3" stroke="#c8a8e8" stroke-width="0.55" filter="url(#i8p9p2bloom)" opacity="0.85"/>
    <!-- Arm extending DOWN with scanner -->
    <path d="M9,-9 L14,3 L11,11 L7,3 Z" fill="url(#i8p9p2lumaSuit)"/>
    <!-- Scanner beam going STRAIGHT DOWN into the darkness -->
    <line x1="14" y1="11" x2="20" y2="40" stroke="#a878e8" stroke-width="1.4" filter="url(#i8p9p2strongglow)" opacity="0.95"/>
    <line x1="14" y1="11" x2="20" y2="40" stroke="#fff" stroke-width="0.4" filter="url(#i8p9p2bloom)" opacity="0.85"/>
    <!-- Beam expansion in void -->
    <path d="M16,18 L11,40 L26,40 L22,18 Z" fill="#a878e8" opacity="0.4" filter="url(#i8p9p2glow)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-36" rx="3" ry="4" fill="#7a4828"/>
    <path d="M2,-30 Q5,-22 7,-9" stroke="#1a0808" stroke-width="1.4" fill="none"/>
    <path d="M2,-30 Q5,-22 7,-9" stroke="#a878e8" stroke-width="0.4" fill="none" filter="url(#i8p9p2bloom)"/>
    <path d="M-3,-40 Q0,-42 3,-40 L3,-36 Q0,-38 -3,-36 Z" fill="#1a0808"/>
    <!-- Lenses -->
    <ellipse cx="-1" cy="-36" rx="1.4" ry="1" fill="none" stroke="#a878e8" stroke-width="0.4" filter="url(#i8p9p2bloom)" opacity="0.95"/>
    <ellipse cx="2" cy="-36" rx="1.4" ry="1" fill="none" stroke="#a878e8" stroke-width="0.4" filter="url(#i8p9p2bloom)" opacity="0.95"/>
    <!-- Eyes glowing -->
    <circle cx="-1" cy="-36" r="0.4" fill="#fff8e8" filter="url(#i8p9p2bloom)"/>
    <circle cx="2" cy="-36" r="0.4" fill="#fff8e8" filter="url(#i8p9p2bloom)"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- THEODORE — straining -->
  <g>
    <rect x="14" y="14" width="180" height="36" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE  <tspan font-style="italic" font-size="8" font-weight="500">(straining)</tspan></text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Heavy — got it.</text>

  <!-- LUMA -->
  <g>
    <rect x="14" y="60" width="338" height="50" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Chamber floor four meters down.</text>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Stone steps along the far wall — partially collapsed but navigable.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
