<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 240" width="494" height="240">
  <title>Issue 8 — Page 10 — Panel 5: Luma stops — the recess ahead — scientist breaks before the reader sees what she sees</title>
  <desc>50mm medium slight low angle. Luma stopped. Ahead glyph trail ends — wall opens into deeper recess. Scanner beam penetrates recess and illuminates something that makes Luma go still. Not the cache yet — reaction before reveal. Scanner hand lowers slightly. Other hand rises toward mouth. Shock — not fear but devastating recognition. Reflected light hits face — blue-violet from scanner mixed with warmer residual glow from whatever lies ahead. Holographic lenses have stopped scrolling — frozen on whatever they're displaying. Scanner trembles.</desc>

  <defs>
    <linearGradient id="i8p10p5bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p10p5stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <radialGradient id="i8p10p5recessLight" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7a4838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p10p5residualWarm" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p10p5lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p10p5skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i8p10p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p10p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p10p5strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p10p5megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="494" height="240" fill="url(#i8p10p5bg)"/>

  <!-- Stone wall -->
  <rect x="0" y="0" width="494" height="220" fill="url(#i8p10p5stone)"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
    <line x1="0" y1="200" x2="320" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="40"/>
    <line x1="200" y1="40" x2="200" y2="80"/>
    <line x1="120" y1="80" x2="120" y2="120"/>
    <line x1="240" y1="120" x2="240" y2="160"/>
    <line x1="60" y1="160" x2="60" y2="200"/>
    <line x1="180" y1="200" x2="180" y2="220"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="220" width="494" height="20" fill="#040408"/>
  <g fill="#1a1208" opacity="0.85">
    <ellipse cx="40" cy="230" rx="6" ry="2"/>
    <ellipse cx="120" cy="230" rx="9" ry="3"/>
    <ellipse cx="220" cy="230" rx="6" ry="2"/>
    <ellipse cx="300" cy="230" rx="9" ry="3"/>
  </g>

  <!-- ===== THE DEEPER RECESS (right edge) ===== -->
  <path d="M320,40 L494,40 L494,220 L320,220 L320,180 L350,160 L350,80 L320,60 Z" fill="#040408"/>
  <!-- Recess opening edge -->
  <line x1="320" y1="40" x2="320" y2="220" stroke="#1a0808" stroke-width="0.85"/>
  <!-- Inside recess: the cache lit by scanner+residual glow -->
  <ellipse cx="420" cy="120" rx="120" ry="80" fill="url(#i8p10p5recessLight)" filter="url(#i8p10p5megaglow)"/>
  <ellipse cx="430" cy="120" rx="60" ry="40" fill="url(#i8p10p5residualWarm)" filter="url(#i8p10p5megaglow)" opacity="0.7"/>

  <!-- Glimpses of objects in recess (silhouettes — not yet revealed) -->
  <g fill="#1a1410" opacity="0.55">
    <!-- Wing-pack skeleton hint -->
    <path d="M380,140 L400,100 L420,110 L410,150 Z"/>
    <line x1="380" y1="140" x2="420" y2="110" stroke="#a86838" stroke-width="0.4" filter="url(#i8p10p5bloom)" opacity="0.7"/>
    <!-- Data core hint -->
    <ellipse cx="450" cy="160" rx="22" ry="11"/>
  </g>
  <!-- Residual ghost-glow on cache items -->
  <g opacity="0.55" filter="url(#i8p10p5bloom)">
    <ellipse cx="400" cy="120" rx="14" ry="6" fill="#a86838"/>
    <ellipse cx="450" cy="155" rx="11" ry="3" fill="#a86838"/>
  </g>

  <!-- Last few glyphs trailing off (ending at recess) -->
  <g transform="translate(120 200)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#5a4ab8" filter="url(#i8p10p5bloom)" opacity="0.7"/>
    <g stroke="#c8a8e8" stroke-width="0.7" fill="none" filter="url(#i8p10p5bloom)" opacity="0.95">
      <circle cx="0" cy="0" r="9"/>
      <line x1="-9" y1="0" x2="9" y2="0"/>
    </g>
  </g>
  <g transform="translate(220 200)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#5a4ab8" filter="url(#i8p10p5bloom)" opacity="0.7"/>
    <g stroke="#c8a8e8" stroke-width="0.7" fill="none" filter="url(#i8p10p5bloom)" opacity="0.95">
      <polygon points="-9,-7 9,-7 9,7 -9,7"/>
      <line x1="0" y1="-7" x2="0" y2="7"/>
    </g>
  </g>

  <!-- ===== LUMA — STOPPED, hand to mouth ===== -->
  <g transform="translate(290 180)">
    <!-- Body — frozen mid-step -->
    <path d="M-9,30 L-11,11 L-14,-7 L-11,-22 L-3,-32 L3,-32 L11,-22 L14,-7 L11,11 L9,30 Z" fill="url(#i8p10p5lumaSuit)"/>

    <!-- Heavy ink stains -->
    <ellipse cx="-14" cy="3" rx="3" ry="2" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent -->
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#c8a8e8" stroke-width="0.55" filter="url(#i8p10p5bloom)" opacity="0.95"/>
    <circle cx="-9" cy="-15" r="0.85" fill="#c8a8e8" filter="url(#i8p10p5bloom)" opacity="0.95"/>
    <circle cx="9" cy="-15" r="0.85" fill="#c8a8e8" filter="url(#i8p10p5bloom)" opacity="0.95"/>

    <!-- Right arm — scanner hand LOWERED slightly (trembling) -->
    <path d="M11,-15 L26,3 L22,11 L9,3 Z" fill="url(#i8p10p5lumaSuit)"/>
    <ellipse cx="26" cy="3" rx="3" ry="2" fill="url(#i8p10p5skin)"/>
    <!-- Scanner pointing slightly downward (lowered) -->
    <rect x="22" y="3" width="9" height="6" fill="#3a1858"/>
    <ellipse cx="27" cy="6" rx="3" ry="0.4" fill="#a878e8" filter="url(#i8p10p5bloom)" opacity="0.95"/>
    <!-- Beam going slightly down/forward -->
    <line x1="32" y1="6" x2="80" y2="14" stroke="#a878e8" stroke-width="1.4" filter="url(#i8p10p5strongglow)" opacity="0.85"/>
    <!-- Tremble lines on scanner arm -->
    <path d="M14,-3 L18,3" stroke="#fff" stroke-width="0.4" opacity="0.4"/>
    <path d="M22,3 L24,7" stroke="#fff" stroke-width="0.4" opacity="0.4"/>

    <!-- ===== LEFT ARM — RAISED toward mouth ===== -->
    <path d="M-11,-15 L-22,-30 L-14,-40 L-7,-22 Z" fill="url(#i8p10p5lumaSuit)"/>
    <!-- Hand at mouth -->
    <ellipse cx="-22" cy="-30" rx="4" ry="3" fill="url(#i8p10p5skin)"/>
    <!-- Fingers covering mouth -->
    <ellipse cx="-22" cy="-26" rx="3" ry="2" fill="url(#i8p10p5skin)"/>

    <!-- Legs (frozen mid-stride) -->
    <path d="M-3,30 L-7,52 L-1,52 L0,30 Z" fill="url(#i8p10p5lumaSuit)"/>
    <path d="M3,30 L7,52 L1,52 L0,30 Z" fill="url(#i8p10p5lumaSuit)"/>

    <!-- Head — turned RIGHT, looking into recess -->
    <ellipse cx="3" cy="-44" rx="6" ry="7" fill="url(#i8p10p5skin)"/>

    <!-- Braid — filament FROZEN bright (responding) -->
    <path d="M9,-36 Q14,-22 18,11" stroke="#1a0808" stroke-width="2" fill="none"/>
    <path d="M9,-36 Q14,-22 18,11" stroke="#a878e8" stroke-width="0.55" fill="none" filter="url(#i8p10p5bloom)" opacity="0.95"/>
    <!-- Hair -->
    <path d="M-3,-50 Q3,-54 9,-50 L9,-44 Q3,-48 -3,-44 Z" fill="#1a0808"/>

    <!-- Holographic lenses — FROZEN on their data -->
    <ellipse cx="3" cy="-44" rx="9" ry="3" fill="#7848b8" filter="url(#i8p10p5strongglow)" opacity="0.55"/>
    <ellipse cx="0" cy="-44" rx="2" ry="1.4" fill="none" stroke="#a878e8" stroke-width="0.7" filter="url(#i8p10p5bloom)" opacity="0.95"/>
    <ellipse cx="6" cy="-44" rx="2" ry="1.4" fill="none" stroke="#a878e8" stroke-width="0.7" filter="url(#i8p10p5bloom)" opacity="0.95"/>

    <!-- Eyes WIDE (shock, recognition) -->
    <circle cx="0" cy="-44" r="1" fill="#fff" filter="url(#i8p10p5bloom)"/>
    <circle cx="6" cy="-44" r="1" fill="#fff" filter="url(#i8p10p5bloom)"/>

    <!-- Brows raised in shock -->
    <line x1="-3" y1="-50" x2="3" y2="-51" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="3" y1="-51" x2="9" y2="-50" stroke="#3a1808" stroke-width="0.55"/>

    <!-- Mouth covered by hand (above) - slightly visible -->
    <line x1="0" y1="-37" x2="6" y2="-37" stroke="#3a1808" stroke-width="0.55"/>

    <!-- ===== Reflected glow on face (warmer than scanner — residual fairy tech) ===== -->
    <ellipse cx="9" cy="-44" rx="5" ry="6" fill="#a86838" opacity="0.4" filter="url(#i8p10p5bloom)"/>
    <ellipse cx="9" cy="-32" rx="3" ry="3" fill="#a86838" opacity="0.55" filter="url(#i8p10p5bloom)"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- LUMA — silence, then... -->
  <g>
    <rect x="14" y="14" width="160" height="32" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">...</text>

  <!-- LUMA 2 — the line -->
  <g>
    <rect x="14" y="56" width="200" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="1.4" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="700">Oh no.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140"/>
    <path d="M0,200 Q120,202 240,198 Q360,196 494,200"/>
  </g>
</svg>
