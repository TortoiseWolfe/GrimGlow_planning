<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 21 — Panel 2: Thresh stows weapon — same routine, different posture, the brief involuntary glance toward the wall gap</title>
  <desc>50mm medium eye level. Thresh stows compact weapon with practiced efficiency, moving through post-watch routine in camp space. Ruby-crimson armor dented and worn, copper-red buzz cut catching grey morning light. Movements military-precise but posture has shifted — less rigid, tension at different frequency. Glances once toward wall gap — direction of alley, brief involuntary look of someone thinking about a place they've left — then looks away. Moment small. No one in camp seems to notice. Grey morning light, flat and even. The soldier who carries a gentle secret.</desc>

  <defs>
    <linearGradient id="i8p21p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i8p21p2timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="i8p21p2greyDawn" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#a8a8b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p21p2threshArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="i8p21p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p21p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p21p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p21p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p21p2bg)"/>

  <!-- Grey dawn from above -->
  <ellipse cx="183" cy="0" rx="280" ry="180" fill="url(#i8p21p2greyDawn)" filter="url(#i8p21p2megaglow)"/>

  <!-- Camp wall background -->
  <rect x="0" y="0" width="366" height="220" fill="#2a2030"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.55">
    <line x1="0" y1="60" x2="366" y2="60"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="180" x2="366" y2="180"/>
  </g>
  <!-- Beam Thresh stands on -->
  <rect x="0" y="220" width="366" height="14" fill="url(#i8p21p2timber)"/>
  <rect x="0" y="270" width="366" height="30" fill="#0a0606"/>

  <!-- Weapon storage hook on wall (where she stows it) -->
  <g transform="translate(280 80)">
    <rect x="-3" y="-22" width="6" height="44" fill="#5a4838"/>
    <ellipse cx="0" cy="-22" rx="4" ry="2" fill="#7a6048"/>
    <!-- Hook -->
    <path d="M0,9 L11,11 L11,18" stroke="#3a2010" stroke-width="2" fill="none"/>
  </g>

  <!-- Wall gap visible far right (the direction of the alley) -->
  <rect x="340" y="60" width="26" height="160" fill="#1a1208"/>
  <ellipse cx="350" cy="140" rx="14" ry="60" fill="#a8a8b8" opacity="0.4" filter="url(#i8p21p2glow)"/>

  <!-- ===== THRESH stowing weapon — practiced efficiency ===== -->
  <g transform="translate(180 230)">
    <!-- Body — stretched UP, reaching to hook -->
    <path d="M-9,40 L-11,11 L-14,-22 L-11,-44 L-3,-58 L3,-58 L11,-44 L14,-22 L11,11 L9,40 Z" fill="url(#i8p21p2threshArmor)"/>

    <!-- Heavy dents (continuity) -->
    <ellipse cx="-11" cy="-22" rx="6" ry="4" fill="#5a1410"/>
    <line x1="-13" y1="-26" x2="-9" y2="-15" stroke="#1a0606" stroke-width="0.85"/>
    <ellipse cx="11" cy="-22" rx="6" ry="4" fill="#7a1810"/>

    <!-- Long chest scratch -->
    <path d="M-7,-7 L7,3" stroke="#3a0a0a" stroke-width="2" opacity="0.85"/>

    <!-- Suit accent (composed, dim — settled) -->
    <line x1="0" y1="-44" x2="0" y2="30" stroke="#a82818" stroke-width="0.7" opacity="0.7" filter="url(#i8p21p2bloom)"/>
    <circle cx="-9" cy="-22" r="0.85" fill="#a82818" filter="url(#i8p21p2bloom)" opacity="0.7"/>
    <circle cx="9" cy="-22" r="0.85" fill="#a82818" filter="url(#i8p21p2bloom)" opacity="0.7"/>

    <!-- ===== ARM EXTENDED to hook (right) — stowing weapon ===== -->
    <path d="M14,-22 L60,-44 L66,-32 L18,-9 Z" fill="url(#i8p21p2threshArmor)"/>
    <ellipse cx="60" cy="-44" rx="4" ry="3" fill="url(#i8p21p2skin)"/>
    <!-- Weapon being placed on hook -->
    <rect x="55" y="-50" width="22" height="3" fill="#1a1818"/>
    <ellipse cx="64" cy="-48" rx="6" ry="0.85" fill="#a82818" filter="url(#i8p21p2bloom)" opacity="0.55"/>

    <!-- Other arm at side -->
    <path d="M-14,-22 L-22,3 L-14,11 L-9,-9 Z" fill="url(#i8p21p2threshArmor)"/>

    <!-- Legs planted -->
    <path d="M-3,40 L-7,55 L-3,55 L0,40 Z" fill="url(#i8p21p2threshArmor)"/>
    <path d="M3,40 L7,55 L11,55 L9,40 Z" fill="url(#i8p21p2threshArmor)"/>

    <!-- Head — looking forward, but eye flicked RIGHT (the involuntary glance) -->
    <ellipse cx="0" cy="-72" rx="9" ry="11" fill="url(#i8p21p2skin)"/>
    <!-- Buzz cut catching grey light -->
    <path d="M-9,-86 Q0,-90 9,-86 L9,-72 Q0,-76 -9,-72 Z" fill="#a83820"/>
    <!-- Cool grey catch -->
    <ellipse cx="0" cy="-88" rx="6" ry="2" fill="#a8b8c8" opacity="0.55" filter="url(#i8p21p2bloom)"/>

    <!-- Defined cheekbone -->
    <path d="M-7,-66 Q-9,-72 -3,-72" stroke="#7a4818" stroke-width="0.4" fill="none" opacity="0.55"/>
    <path d="M7,-66 Q9,-72 3,-72" stroke="#7a4818" stroke-width="0.4" fill="none" opacity="0.55"/>

    <!-- Eyes — flicked RIGHT (toward wall gap, the alley direction) -->
    <ellipse cx="-3" cy="-72" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-2" cy="-72" r="0.55" fill="#3a1808"/>
    <ellipse cx="3" cy="-72" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="4" cy="-72" r="0.55" fill="#3a1808"/>

    <!-- Brows — set (composed, but the glance is involuntary) -->
    <line x1="-7" y1="-78" x2="-1" y2="-78" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="1" y1="-78" x2="7" y2="-78" stroke="#3a1808" stroke-width="0.7"/>

    <!-- Mouth — flat, settled -->
    <line x1="-3" y1="-66" x2="3" y2="-66" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- Subtle eye-line dashing toward the wall gap (her glance) -->
  <g opacity="0.18" stroke="#a8b8c8" stroke-width="0.4" filter="url(#i8p21p2bloom)" stroke-dasharray="2,2">
    <line x1="190" y1="158" x2="340" y2="140"/>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
