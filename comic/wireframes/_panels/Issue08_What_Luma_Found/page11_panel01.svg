<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 900" width="742" height="900">
  <title>Issue 8 — Page 11 — Panel 1: THE CACHE — splash reveal — wing-pack skeleton, dead data core, blackened suit fragments — archaeology of sacrifice</title>
  <desc>Full-page splash 24mm wide slight elevated angle. Stone alcove deepest part of basement, illuminated by single scanner beam. Stone shelf thick with centuries of dust: corroded fairy tech relics. Wing-pack corroded to skeleton of geometric struts — translucent wing material gone, only lattice remaining, dead luminous seams showing faint ghost-glow where scanner light touches. Data core dark cracked. Fragments of silver suit turned black with age. Ancient corroded scanner, depleted sidearm, dark-screened data tablet, ration containers. Tiny woman in sapphire-violet suit at edge of alcove, hand over mouth, scanner trembling. Living suit sharp contrast to dead technology. Blue-violet scanner light sweeps cache, waking faint residual ghost-glow — warm phosphorescence answering scanner's frequency across centuries. Total darkness beyond reach. Dust thick and undisturbed.</desc>

  <defs>
    <linearGradient id="i8p11p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p11p1stoneAlcove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p11p1shelfStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i8p11p1scannerSweep" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#7848b8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p11p1ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p11p1corroded" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i8p11p1blackSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p11p1deadCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i8p11p1lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p11p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i8p11p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p11p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p11p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p11p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="900" fill="url(#i8p11p1bg)"/>

  <!-- ===== STONE ALCOVE (back wall, deeper space) ===== -->
  <rect x="100" y="100" width="600" height="500" fill="url(#i8p11p1stoneAlcove)"/>
  <!-- Alcove arched top -->
  <path d="M100,100 Q400,40 700,100" stroke="url(#i8p11p1stoneAlcove)" stroke-width="40" fill="none"/>
  <path d="M100,100 Q400,40 700,100" stroke="#040408" stroke-width="0.85" fill="none"/>
  <!-- Stone block lines (rough-hewn) -->
  <g stroke="#040408" stroke-width="0.7" fill="none" opacity="0.85">
    <path d="M100,180 L200,182 L320,178 L460,180 L600,178 L700,182"/>
    <path d="M100,260 L200,262 L320,258 L460,260 L600,258 L700,262"/>
    <path d="M100,340 L200,342 L320,338 L460,340 L600,338 L700,342"/>
    <path d="M100,420 L200,422 L320,418 L460,420 L600,418 L700,422"/>
    <path d="M100,500 L200,502 L320,498 L460,500 L600,498 L700,502"/>
    <line x1="200" y1="100" x2="200" y2="180"/>
    <line x1="380" y1="100" x2="380" y2="180"/>
    <line x1="560" y1="100" x2="560" y2="180"/>
    <line x1="160" y1="180" x2="160" y2="260"/>
    <line x1="320" y1="180" x2="320" y2="260"/>
    <line x1="520" y1="180" x2="520" y2="260"/>
    <line x1="240" y1="260" x2="240" y2="340"/>
    <line x1="420" y1="260" x2="420" y2="340"/>
    <line x1="600" y1="260" x2="600" y2="340"/>
    <line x1="180" y1="340" x2="180" y2="420"/>
    <line x1="360" y1="340" x2="360" y2="420"/>
    <line x1="540" y1="340" x2="540" y2="420"/>
  </g>
  <!-- Stone weathering -->
  <g fill="#040408" opacity="0.55">
    <ellipse cx="160" cy="180" rx="40" ry="14"/>
    <ellipse cx="380" cy="280" rx="40" ry="14"/>
    <ellipse cx="600" cy="200" rx="30" ry="11"/>
    <ellipse cx="200" cy="380" rx="40" ry="14"/>
    <ellipse cx="540" cy="380" rx="40" ry="14"/>
    <ellipse cx="240" cy="480" rx="30" ry="11"/>
  </g>

  <!-- ===== STONE SHELF (mid-frame, where the cache rests) ===== -->
  <path d="M100,500 L700,500 L740,560 L60,560 Z" fill="url(#i8p11p1shelfStone)"/>
  <line x1="100" y1="500" x2="700" y2="500" stroke="#040408" stroke-width="0.85"/>
  <line x1="60" y1="560" x2="740" y2="560" stroke="#040408" stroke-width="0.85"/>
  <!-- Shelf front edge -->
  <line x1="60" y1="560" x2="740" y2="560" stroke="#5a4838" stroke-width="0.7" filter="url(#i8p11p1bloom)" opacity="0.55"/>
  <!-- Centuries of DUST on shelf -->
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="200" cy="510" rx="80" ry="6"/>
    <ellipse cx="400" cy="515" rx="100" ry="7"/>
    <ellipse cx="600" cy="510" rx="80" ry="6"/>
  </g>

  <!-- Floor below shelf -->
  <rect x="0" y="560" width="742" height="340" fill="url(#i8p11p1stoneAlcove)"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="0" y1="640" x2="742" y2="640"/>
    <line x1="0" y1="720" x2="742" y2="720"/>
    <line x1="0" y1="800" x2="742" y2="800"/>
    <line x1="100" y1="560" x2="100" y2="640"/>
    <line x1="280" y1="640" x2="280" y2="720"/>
    <line x1="460" y1="640" x2="460" y2="720"/>
    <line x1="640" y1="640" x2="640" y2="720"/>
    <line x1="180" y1="720" x2="180" y2="800"/>
    <line x1="360" y1="800" x2="360" y2="900"/>
    <line x1="560" y1="720" x2="560" y2="800"/>
  </g>
  <!-- Heavy floor dust -->
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="200" cy="700" rx="80" ry="9"/>
    <ellipse cx="500" cy="780" rx="120" ry="11"/>
    <ellipse cx="380" cy="850" rx="160" ry="11"/>
  </g>

  <!-- ===== SCANNER SWEEP cone — from Luma's position (lower right) toward cache (mid-left) ===== -->
  <g filter="url(#i8p11p1megaglow)" opacity="0.85">
    <path d="M540,800 L80,400 L80,600 L540,860 Z" fill="url(#i8p11p1scannerSweep)"/>
  </g>
  <g stroke="#a878e8" stroke-width="0.4" fill="none" opacity="0.85" filter="url(#i8p11p1bloom)">
    <line x1="540" y1="800" x2="100" y2="450"/>
    <line x1="540" y1="800" x2="100" y2="540"/>
    <line x1="540" y1="800" x2="200" y2="500"/>
  </g>

  <!-- ===== CACHE RELICS on the stone shelf ===== -->

  <!-- 1. WING-PACK SKELETON (left of center, prominent) -->
  <g transform="translate(220 470)">
    <!-- Ghost glow halo -->
    <ellipse cx="0" cy="0" rx="80" ry="40" fill="url(#i8p11p1ghostGlow)" filter="url(#i8p11p1strongglow)" opacity="0.55"/>
    <!-- Wing-pack mounting block -->
    <rect x="-22" y="-9" width="44" height="22" fill="url(#i8p11p1corroded)"/>
    <rect x="-22" y="-9" width="44" height="22" fill="none" stroke="#040408" stroke-width="0.55"/>
    <line x1="-22" y1="-3" x2="22" y2="-3" stroke="#5a4838" stroke-width="0.4" opacity="0.55"/>
    <!-- Verdigris on metal -->
    <ellipse cx="-9" cy="0" rx="9" ry="3" fill="#3a4838" opacity="0.55"/>
    <ellipse cx="11" cy="3" rx="6" ry="2" fill="#5a3818" opacity="0.55"/>
    <!-- ===== WING LATTICE — geometric struts, dragonfly geometry, skeletal ===== -->
    <g stroke="url(#i8p11p1corroded)" stroke-width="2" fill="none">
      <!-- Left wing skeleton -->
      <path d="M-22,-3 L-44,-26 L-66,-15 L-66,11 L-44,22 L-22,9"/>
      <line x1="-22" y1="-3" x2="-66" y2="-3"/>
      <line x1="-44" y1="-26" x2="-44" y2="22"/>
      <line x1="-44" y1="-26" x2="-66" y2="11"/>
      <line x1="-44" y1="22" x2="-66" y2="-15"/>
      <line x1="-30" y1="-15" x2="-58" y2="-15"/>
      <line x1="-30" y1="11" x2="-58" y2="11"/>
      <!-- Right wing skeleton -->
      <path d="M22,-3 L44,-26 L66,-15 L66,11 L44,22 L22,9"/>
      <line x1="22" y1="-3" x2="66" y2="-3"/>
      <line x1="44" y1="-26" x2="44" y2="22"/>
      <line x1="44" y1="-26" x2="66" y2="11"/>
      <line x1="44" y1="22" x2="66" y2="-15"/>
      <line x1="30" y1="-15" x2="58" y2="-15"/>
      <line x1="30" y1="11" x2="58" y2="11"/>
    </g>
    <!-- Ghost-glow on luminous channels (where light USED to flow) -->
    <g stroke="#a86838" stroke-width="0.55" fill="none" opacity="0.55" filter="url(#i8p11p1bloom)">
      <line x1="-22" y1="-3" x2="-66" y2="-3"/>
      <line x1="-44" y1="-26" x2="-44" y2="22"/>
      <line x1="22" y1="-3" x2="66" y2="-3"/>
      <line x1="44" y1="-26" x2="44" y2="22"/>
    </g>
    <!-- Faint ghost-glow at strut joints -->
    <g opacity="0.55" filter="url(#i8p11p1bloom)">
      <circle cx="-44" cy="-3" r="2" fill="#a86838"/>
      <circle cx="44" cy="-3" r="2" fill="#a86838"/>
      <circle cx="-44" cy="-26" r="1.4" fill="#a86838"/>
      <circle cx="44" cy="-26" r="1.4" fill="#a86838"/>
      <circle cx="-44" cy="22" r="1.4" fill="#a86838"/>
      <circle cx="44" cy="22" r="1.4" fill="#a86838"/>
    </g>
  </g>

  <!-- 2. DEAD DATA CORE (mid-shelf) -->
  <g transform="translate(400 510)">
    <ellipse cx="0" cy="-3" rx="40" ry="14" fill="url(#i8p11p1deadCore)"/>
    <rect x="-36" y="-15" width="72" height="22" fill="url(#i8p11p1deadCore)" rx="4"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#040408" stroke-width="0.55"/>
    <!-- Crack lines -->
    <path d="M-22,-9 L-9,3 L0,-3 L11,7" stroke="#040408" stroke-width="0.85" opacity="0.95"/>
    <path d="M14,-11 L22,0 L18,7" stroke="#040408" stroke-width="0.55" opacity="0.85"/>
    <!-- Faint warmth escaping cracks -->
    <line x1="-22" y1="-9" x2="-9" y2="3" stroke="#7a4838" stroke-width="0.4" opacity="0.55" filter="url(#i8p11p1bloom)"/>
    <line x1="14" y1="-11" x2="22" y2="0" stroke="#7a4838" stroke-width="0.4" opacity="0.55" filter="url(#i8p11p1bloom)"/>
    <!-- Surface texture -->
    <g fill="#040408" opacity="0.55">
      <ellipse cx="-18" cy="-7" rx="6" ry="2"/>
      <ellipse cx="18" cy="3" rx="6" ry="2"/>
    </g>
  </g>

  <!-- 3. BLACKENED SUIT FRAGMENTS (right of core) -->
  <g transform="translate(540 510)">
    <!-- Crumbling fragment 1 (silver gone black) -->
    <path d="M-22,-3 L-14,-15 L0,-11 L7,3 L-3,11 L-15,7 Z" fill="url(#i8p11p1blackSuit)"/>
    <!-- Crumbling edges -->
    <g fill="#040408" opacity="0.85">
      <ellipse cx="-22" cy="-3" rx="3" ry="1.4"/>
      <ellipse cx="-3" cy="11" rx="3" ry="1.4"/>
      <ellipse cx="7" cy="3" rx="3" ry="1.4"/>
    </g>
    <!-- Empty node mounts (dark sockets) -->
    <circle cx="-9" cy="-7" r="1.4" fill="#040408"/>
    <circle cx="0" cy="0" r="1.4" fill="#040408"/>
    <circle cx="-3" cy="3" r="1.4" fill="#040408"/>
    <!-- Fragment 2 (smaller, scattered) -->
    <path d="M14,-7 L22,-15 L30,-9 L26,3 L18,5 Z" fill="url(#i8p11p1blackSuit)" opacity="0.85"/>
    <circle cx="22" cy="-7" r="1.4" fill="#040408"/>
    <!-- Black dust around -->
    <g fill="#040408" opacity="0.55">
      <ellipse cx="-30" cy="11" rx="11" ry="2"/>
      <ellipse cx="36" cy="11" rx="9" ry="2"/>
    </g>
  </g>

  <!-- 4. ANCIENT SCANNER (corroded, smaller, right edge of shelf) -->
  <g transform="translate(640 515)" opacity="0.85">
    <rect x="-14" y="-7" width="28" height="14" fill="url(#i8p11p1corroded)" stroke="#040408" stroke-width="0.4"/>
    <ellipse cx="0" cy="-3" rx="3" ry="0.85" fill="#040408"/>
    <!-- Verdigris -->
    <ellipse cx="-7" cy="0" rx="4" ry="1.4" fill="#3a4838" opacity="0.7"/>
  </g>

  <!-- 5. DEPLETED SIDEARM (left of wing-pack, on shelf) -->
  <g transform="translate(120 520)" opacity="0.85">
    <path d="M-14,-3 L11,-7 L14,3 L-9,7 Z" fill="url(#i8p11p1corroded)"/>
    <line x1="-14" y1="-3" x2="14" y2="3" stroke="#040408" stroke-width="0.4"/>
    <!-- Trigger guard -->
    <path d="M-3,3 L0,11 L7,7" stroke="#040408" stroke-width="0.55" fill="none"/>
    <!-- Charge indicator (depleted, dark) -->
    <circle cx="0" cy="-3" r="1" fill="#040408"/>
  </g>

  <!-- 6. DARK-SCREENED DATA TABLET (above the rest, smaller, leaning) -->
  <g transform="translate(450 480)" opacity="0.7">
    <rect x="-14" y="-9" width="28" height="22" fill="#1a1410" stroke="#040408" stroke-width="0.4"/>
    <rect x="-12" y="-7" width="24" height="18" fill="#040408"/>
  </g>

  <!-- 7. RATION CONTAINERS (rectangular shapes, almost unrecognizable) -->
  <g transform="translate(290 525)" opacity="0.7">
    <rect x="-9" y="-5" width="11" height="9" fill="#3a3030" stroke="#040408" stroke-width="0.4"/>
    <rect x="3" y="-3" width="9" height="7" fill="#3a3030" stroke="#040408" stroke-width="0.4"/>
  </g>

  <!-- ===== LUMA at lower-right edge of alcove ===== -->
  <g transform="translate(540 700)">
    <!-- Body — frozen, hand to mouth -->
    <path d="M-22,80 L-26,30 L-30,-15 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-15 L26,30 L22,80 Z" fill="url(#i8p11p1lumaSuit)"/>

    <!-- Heavy ink stains -->
    <ellipse cx="-26" cy="11" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent (LIVING — vivid contrast with dead tech) -->
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#c8a8e8" stroke-width="0.85" filter="url(#i8p11p1bloom)" opacity="0.95"/>
    <circle cx="-9" cy="-30" r="1.4" fill="#c8a8e8" filter="url(#i8p11p1strongglow)" opacity="0.95"/>
    <circle cx="9" cy="-30" r="1.4" fill="#c8a8e8" filter="url(#i8p11p1strongglow)" opacity="0.95"/>
    <circle cx="0" cy="0" r="1.4" fill="#c8a8e8" filter="url(#i8p11p1strongglow)" opacity="0.95"/>

    <!-- Right arm — scanner extended, TREMBLING -->
    <path d="M22,-30 L40,-22 L40,-9 L26,-7 Z" fill="url(#i8p11p1lumaSuit)"/>
    <ellipse cx="40" cy="-22" rx="3" ry="2" fill="url(#i8p11p1skin)"/>
    <rect x="40" y="-26" width="14" height="11" fill="#3a1858" stroke="#1a0810" stroke-width="0.55"/>
    <ellipse cx="47" cy="-22" rx="6" ry="0.85" fill="#a878e8" filter="url(#i8p11p1strongglow)" opacity="0.95"/>
    <!-- Tremble lines -->
    <path d="M30,-15 L36,-18" stroke="#fff" stroke-width="0.4" opacity="0.4"/>
    <path d="M40,-9 L44,-3" stroke="#fff" stroke-width="0.4" opacity="0.4"/>

    <!-- ===== LEFT ARM raised, hand OVER MOUTH ===== -->
    <path d="M-22,-30 L-26,-58 L-14,-66 L-7,-44 Z" fill="url(#i8p11p1lumaSuit)"/>
    <!-- Hand at mouth -->
    <ellipse cx="-22" cy="-58" rx="6" ry="4" fill="url(#i8p11p1skin)"/>
    <!-- Fingers -->
    <ellipse cx="-22" cy="-54" rx="5" ry="3" fill="url(#i8p11p1skin)"/>
    <line x1="-26" y1="-54" x2="-26" y2="-50" stroke="#7a4818" stroke-width="0.4"/>
    <line x1="-22" y1="-54" x2="-22" y2="-49" stroke="#7a4818" stroke-width="0.4"/>
    <line x1="-18" y1="-54" x2="-18" y2="-50" stroke="#7a4818" stroke-width="0.4"/>

    <!-- Legs -->
    <path d="M-9,80 L-14,140 L-3,140 L0,80 Z" fill="url(#i8p11p1lumaSuit)"/>
    <path d="M3,80 L9,140 L18,140 L14,80 Z" fill="url(#i8p11p1lumaSuit)"/>

    <!-- Head — tilted slightly back, eyes lifted to cache -->
    <ellipse cx="0" cy="-86" rx="14" ry="16" fill="url(#i8p11p1skin)"/>

    <!-- Long thick braid -->
    <path d="M11,-72 Q22,-22 30,40" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <path d="M11,-72 Q22,-22 30,40" stroke="#a878e8" stroke-width="0.55" fill="none" filter="url(#i8p11p1bloom)" opacity="0.95"/>
    <ellipse cx="22" cy="-22" rx="3" ry="1" fill="#c8a8e8" filter="url(#i8p11p1strongglow)" opacity="0.95"/>

    <!-- Hair pulled back -->
    <path d="M-14,-100 Q0,-104 14,-100 L14,-86 Q0,-90 -14,-86 Z" fill="#1a0808"/>

    <!-- Holographic lenses — frozen on display -->
    <ellipse cx="0" cy="-86" rx="22" ry="6" fill="#7848b8" filter="url(#i8p11p1strongglow)" opacity="0.55"/>
    <ellipse cx="-7" cy="-86" rx="6" ry="4" fill="none" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p11p1bloom)" opacity="0.95"/>
    <ellipse cx="7" cy="-86" rx="6" ry="4" fill="none" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p11p1bloom)" opacity="0.95"/>

    <!-- Eyes WIDE -->
    <circle cx="-7" cy="-86" r="1.4" fill="#fff" filter="url(#i8p11p1bloom)"/>
    <circle cx="7" cy="-86" r="1.4" fill="#fff" filter="url(#i8p11p1bloom)"/>

    <!-- Brows raised in shock -->
    <line x1="-14" y1="-94" x2="-3" y2="-95" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="3" y1="-95" x2="14" y2="-94" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M-2,-78 L0,-66 L3,-66 L3,-78 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth covered by hand -->
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- LUMA -->
  <g>
    <rect x="14" y="14" width="500" height="48" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Someone lived here.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-weight="700">Someone stayed.</text>

  <!-- THEODORE — calling from above -->
  <g>
    <rect x="14" y="828" width="338" height="36" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="844" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE  <tspan font-style="italic" font-size="8" font-weight="500">(off-panel, from above)</tspan></text>
  <text x="22" y="858" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">Miss Luma? Are you all right?</text>

  <!-- LUMA reply -->
  <g>
    <rect x="380" y="828" width="338" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="388" y="844" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="388" y="858" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">No. No, I don't think I am.</text>

