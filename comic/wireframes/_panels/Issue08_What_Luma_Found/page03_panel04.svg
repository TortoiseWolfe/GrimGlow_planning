<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 120" width="742" height="120">
  <title>Issue 8 — Page 3 — Panel 4: Sable's hand on the data module — practiced encryption lock — geometric fairy script flickers, then dark</title>
  <desc>85mm extreme close-up tight framing. Hand and small device. Dark brown fingers press encryption lock on compact data module — sleek future device size of playing card, screen flickering with geometric fairy script in blue-white light before going dark. Fingers press with practiced pressure. Hand belongs to scuffed silver suit — cuff visible at wrist. Warm gaslight illuminates dark skin. Module screen flash brief — geometric characters visible for instant before lock engages and screen goes black. The secret locked away again.</desc>

  <defs>
    <linearGradient id="i8p3p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <radialGradient id="i8p3p4amber" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p3p4moduleFlash" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a3848" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p3p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i8p3p4suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </linearGradient>
    <linearGradient id="i8p3p4module" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a40"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <filter id="i8p3p4bloom"><feGaussianBlur stdDeviation="0.85"/></filter>
    <filter id="i8p3p4glow"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="i8p3p4strongglow"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="i8p3p4dataPulse"><feGaussianBlur stdDeviation="0.4"/></filter>
  </defs>

  <rect width="742" height="120" fill="url(#i8p3p4bg)"/>

  <!-- Warm amber from upper right -->
  <ellipse cx="600" cy="0" rx="280" ry="120" fill="url(#i8p3p4amber)" filter="url(#i8p3p4strongglow)"/>

  <!-- ===== DATA MODULE — playing-card sized device, screen flashing ===== -->
  <g transform="translate(440 60)">
    <!-- Module body -->
    <rect x="-90" y="-30" width="180" height="60" rx="4" fill="url(#i8p3p4module)" stroke="#1a1a20" stroke-width="0.85"/>
    <!-- Bezel -->
    <rect x="-86" y="-26" width="172" height="52" rx="2" fill="#0a0a14"/>
    <!-- Screen -->
    <rect x="-80" y="-22" width="160" height="44" rx="1" fill="#0a0a14"/>

    <!-- ===== SCREEN FLASH — geometric fairy script briefly visible ===== -->
    <g filter="url(#i8p3p4strongglow)" opacity="0.95">
      <ellipse cx="0" cy="0" rx="80" ry="22" fill="url(#i8p3p4moduleFlash)"/>
    </g>
    <!-- Geometric fairy script (blue-white) -->
    <g stroke="#a8c8d8" stroke-width="0.85" fill="none" filter="url(#i8p3p4bloom)" opacity="0.95">
      <!-- Glyph 1 -->
      <circle cx="-50" cy="0" r="9"/>
      <line x1="-59" y1="0" x2="-41" y2="0"/>
      <line x1="-50" y1="-9" x2="-50" y2="9"/>
      <!-- Glyph 2 -->
      <polygon points="-15,-9 -7,0 -15,9 -23,0"/>
      <line x1="-15" y1="-9" x2="-15" y2="9"/>
      <!-- Glyph 3 -->
      <rect x="0" y="-9" width="14" height="18"/>
      <line x1="0" y1="0" x2="14" y2="0"/>
      <line x1="7" y1="-9" x2="7" y2="9"/>
      <!-- Glyph 4 -->
      <path d="M22,-9 L36,-9 L29,0 L36,9 L22,9 Z"/>
      <line x1="29" y1="-7" x2="29" y2="7"/>
      <!-- Glyph 5 -->
      <circle cx="55" cy="0" r="9"/>
      <path d="M48,-7 L62,7 M62,-7 L48,7"/>
    </g>
    <!-- Data line above glyphs -->
    <text x="-78" y="-15" font-family="monospace" font-size="3" fill="#a8c8d8" filter="url(#i8p3p4dataPulse)" opacity="0.95">CLAS://OPS-RECORD/STAY-STAY-STAY</text>
    <!-- Status indicator -->
    <text x="-78" y="18" font-family="monospace" font-size="3" fill="#a8c8d8" filter="url(#i8p3p4dataPulse)" opacity="0.95">LOCK://ENGAGING</text>

    <!-- Encryption lock indicator (on right edge) -->
    <g transform="translate(75 0)">
      <circle cx="0" cy="0" r="3" fill="#a8c8d8" filter="url(#i8p3p4bloom)" opacity="0.95"/>
      <circle cx="0" cy="0" r="1.4" fill="#fff" opacity="0.95"/>
    </g>

    <!-- Glitch lines (the screen going dark) -->
    <g stroke="#5a606a" stroke-width="0.4" opacity="0.55">
      <line x1="-80" y1="11" x2="80" y2="11" stroke-dasharray="2,2"/>
      <line x1="-80" y1="-15" x2="80" y2="-15" stroke-dasharray="1,3"/>
    </g>

    <!-- Module side buttons -->
    <rect x="-90" y="-9" width="3" height="6" fill="#1a1a20"/>
    <rect x="-90" y="3" width="3" height="6" fill="#1a1a20"/>
  </g>

  <!-- ===== HAND — dark brown fingers pressing encryption lock ===== -->
  <g transform="translate(580 60)">
    <!-- Suit cuff -->
    <path d="M50,-30 L80,-22 L80,30 L50,40 L40,11 L40,-9 Z" fill="url(#i8p3p4suit)"/>
    <line x1="50" y1="-22" x2="78" y2="-14" stroke="#1a1a20" stroke-width="0.85"/>
    <line x1="50" y1="22" x2="78" y2="30" stroke="#1a1a20" stroke-width="0.55"/>
    <!-- Worn cuff edge -->
    <ellipse cx="55" cy="-14" rx="9" ry="3" fill="#1a1818" opacity="0.85"/>

    <!-- Wrist (skin) -->
    <ellipse cx="40" cy="0" rx="14" ry="22" fill="url(#i8p3p4skin)"/>

    <!-- Hand back -->
    <path d="M28,-22 L0,-26 L-26,-14 L-28,11 L-9,22 L18,22 L36,18 L42,11 L42,-9 Z" fill="url(#i8p3p4skin)"/>

    <!-- Tendons -->
    <line x1="14" y1="-9" x2="-14" y2="-3" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>
    <line x1="14" y1="0" x2="-14" y2="9" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>
    <line x1="14" y1="9" x2="-9" y2="14" stroke="#3a1808" stroke-width="0.55" opacity="0.7"/>

    <!-- Knuckle line -->
    <path d="M-26,-9 Q-22,-3 -14,0" stroke="#3a1808" stroke-width="0.4" fill="none" opacity="0.7"/>

    <!-- Index finger pressing the lock -->
    <ellipse cx="-30" cy="-3" rx="9" ry="6" fill="url(#i8p3p4skin)"/>
    <!-- Fingertip pressing module's encryption point -->
    <ellipse cx="-36" cy="-3" rx="3" ry="2" fill="url(#i8p3p4skin)"/>
    <!-- White-knuckle pressure highlight -->
    <ellipse cx="-36" cy="-3" rx="2" ry="1.4" fill="#fff8d8" opacity="0.55" filter="url(#i8p3p4bloom)"/>

    <!-- Thumb visible at lower edge -->
    <ellipse cx="0" cy="22" rx="9" ry="4" fill="url(#i8p3p4skin)"/>

    <!-- Other fingers folded -->
    <ellipse cx="-9" cy="-22" rx="3" ry="9" fill="url(#i8p3p4skin)"/>
    <ellipse cx="-3" cy="-26" rx="3" ry="9" fill="url(#i8p3p4skin)"/>
    <ellipse cx="9" cy="-26" rx="3" ry="9" fill="url(#i8p3p4skin)"/>

    <!-- Fingernails (small, dark) -->
    <ellipse cx="-36" cy="-5" rx="0.85" ry="0.55" fill="#fff8d8" opacity="0.7"/>
  </g>

  <!-- ===== Light from module reflected on hand ===== -->
  <g opacity="0.55" filter="url(#i8p3p4bloom)">
    <ellipse cx="540" cy="50" rx="22" ry="6" fill="#a8c8d8"/>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,60 Q120,62 240,58 Q360,56 494,60 Q620,58 742,60"/>
  </g>
</svg>
