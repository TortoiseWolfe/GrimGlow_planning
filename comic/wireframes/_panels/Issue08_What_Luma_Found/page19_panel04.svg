<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 19 — Panel 4: Approaching the wall gap — familiar route, fog thick, faint perimeter markers — the return with the dead world's secrets</title>
  <desc>28mm wide slightly high angle. Theodore approaches familiar Victorian building — brickwork wall with barely visible gap, gaslight at corner, route to squad's hidden camp. Fog thick, softening gaslight into amber halos. Boy moves with practiced ease toward wall gap — routine. Posture different tonight — one arm across chest guarding cargo, stride more deliberate, weight of evening visible in shoulders. Faint blue-white of holographic perimeter markers barely visible at wall gap. Street empty. Fog holds everything in amber and grey.</desc>

  <defs>
    <linearGradient id="i8p19p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="i8p19p4building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="i8p19p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <radialGradient id="i8p19p4lampHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a86838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p19p4perimeter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a3848" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p19p4fogLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5a4838" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="i8p19p4waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p19p4trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i8p19p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p19p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p19p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p19p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p19p4megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="742" height="50" fill="url(#i8p19p4sky)"/>

  <!-- ===== BUILDING (the camp building) — familiar brickwork ===== -->
  <rect x="0" y="40" width="742" height="220" fill="url(#i8p19p4building)"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="80" y1="40" x2="80" y2="80"/>
    <line x1="220" y1="40" x2="220" y2="80"/>
    <line x1="380" y1="80" x2="380" y2="120"/>
    <line x1="540" y1="40" x2="540" y2="80"/>
    <line x1="660" y1="40" x2="660" y2="80"/>
    <line x1="40" y1="80" x2="40" y2="120"/>
    <line x1="180" y1="120" x2="180" y2="160"/>
    <line x1="320" y1="160" x2="320" y2="200"/>
    <line x1="460" y1="120" x2="460" y2="160"/>
    <line x1="620" y1="200" x2="620" y2="240"/>
  </g>
  <g fill="#040408" opacity="0.55">
    <ellipse cx="80" cy="100" rx="22" ry="9"/>
    <ellipse cx="280" cy="160" rx="22" ry="9"/>
    <ellipse cx="500" cy="100" rx="22" ry="9"/>
    <ellipse cx="660" cy="180" rx="22" ry="9"/>
  </g>

  <!-- ===== WALL GAP — barely visible (the route to camp) ===== -->
  <rect x="500" y="120" width="40" height="120" fill="#040408"/>
  <!-- Broken brick edges of gap -->
  <path d="M500,120 L500,240 L508,235 L502,160 L508,150 L500,130 Z" fill="#1a1208" opacity="0.85"/>
  <path d="M540,120 L540,240 L532,235 L538,160 L532,150 L540,130 Z" fill="#1a1208" opacity="0.85"/>
  <!-- ===== HOLOGRAPHIC PERIMETER MARKERS at gap (faint blue-white) ===== -->
  <ellipse cx="520" cy="220" rx="22" ry="14" fill="url(#i8p19p4perimeter)" filter="url(#i8p19p4glow)" opacity="0.7"/>
  <g opacity="0.7" filter="url(#i8p19p4bloom)">
    <line x1="510" y1="230" x2="510" y2="218" stroke="#a8c8d8" stroke-width="1"/>
    <circle cx="510" cy="218" r="1.4" fill="#a8c8d8"/>
    <line x1="530" y1="230" x2="530" y2="218" stroke="#a8c8d8" stroke-width="1"/>
    <circle cx="530" cy="218" r="1.4" fill="#a8c8d8"/>
  </g>
  <!-- Marker connector -->
  <g stroke="#fff" stroke-width="0.4" fill="none" opacity="0.7" filter="url(#i8p19p4bloom)">
    <line x1="510" y1="218" x2="530" y2="218" stroke-dasharray="2,1.5"/>
  </g>

  <!-- ===== GASLIGHT at corner (left side) ===== -->
  <g transform="translate(80 100)" opacity="0.85">
    <rect x="-2" y="0" width="4" height="160" fill="#3a3030" filter="url(#i8p19p4glow)"/>
    <rect x="-22" y="-22" width="22" height="22" fill="#1a1818" filter="url(#i8p19p4glow)"/>
    <ellipse cx="-11" cy="-12" rx="6" ry="9" fill="#fff8d8" filter="url(#i8p19p4strongglow)" opacity="0.85"/>
  </g>
  <ellipse cx="60" cy="240" rx="180" ry="60" fill="url(#i8p19p4lampHalo)" filter="url(#i8p19p4megaglow)"/>

  <!-- THICK FOG -->
  <rect x="0" y="100" width="742" height="180" fill="url(#i8p19p4fogLayer)"/>
  <g opacity="0.7" filter="url(#i8p19p4glow)">
    <ellipse cx="200" cy="180" rx="120" ry="22" fill="#5a4838"/>
    <ellipse cx="500" cy="200" rx="140" ry="22" fill="#5a4838"/>
    <ellipse cx="380" cy="220" rx="100" ry="14" fill="#3a2818"/>
  </g>

  <!-- Cobblestone -->
  <rect x="0" y="240" width="742" height="60" fill="url(#i8p19p4cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="40" cy="260" rx="11" ry="6"/>
    <ellipse cx="120" cy="270" rx="11" ry="6"/>
    <ellipse cx="200" cy="265" rx="11" ry="6"/>
    <ellipse cx="280" cy="270" rx="11" ry="6"/>
    <ellipse cx="380" cy="265" rx="11" ry="6"/>
    <ellipse cx="460" cy="270" rx="11" ry="6"/>
    <ellipse cx="540" cy="265" rx="11" ry="6"/>
    <ellipse cx="620" cy="270" rx="11" ry="6"/>
    <ellipse cx="700" cy="265" rx="11" ry="6"/>
  </g>

  <!-- ===== THEODORE walking toward wall gap (right side) ===== -->
  <g transform="translate(420 240)">
    <!-- Body -->
    <path d="M-7,40 L-9,9 L-7,-22 L-3,-32 L7,-32 L11,-22 L14,9 L11,40 Z" fill="url(#i8p19p4waistcoat)"/>
    <!-- Buttons -->
    <circle cx="3" cy="-22" r="0.85" fill="#a86838" filter="url(#i8p19p4bloom)"/>
    <circle cx="3" cy="-9" r="0.85" fill="#a86838" filter="url(#i8p19p4bloom)"/>
    <line x1="3" y1="-30" x2="3" y2="36" stroke="#1a0808" stroke-width="0.4"/>

    <!-- Cargo bulge -->
    <path d="M-9,-15 L-3,-22 L11,-22 L14,-15 L11,-7 L-3,-7 Z" fill="#a89878" opacity="0.55"/>

    <!-- Arm across chest (guarding) -->
    <path d="M14,-14 L-15,-7 L-15,3 L11,7 Z" fill="url(#i8p19p4waistcoat)"/>
    <ellipse cx="-15" cy="-3" rx="3" ry="2" fill="url(#i8p19p4skin)"/>

    <!-- Walking legs (mid-stride deliberate) -->
    <path d="M-3,40 L-7,55 L-3,55 L0,40 Z" fill="url(#i8p19p4trousers)"/>
    <path d="M3,40 L7,55 L11,55 L9,40 Z" fill="url(#i8p19p4trousers)"/>
    <path d="M-7,55 L-9,62 L-3,62 L-3,55 Z" fill="#1a1008"/>
    <path d="M7,55 L11,62 L7,62 L7,55 Z" fill="#1a1008"/>

    <!-- Shirt collar -->
    <path d="M-3,-50 L-1,-54 L7,-54 L9,-50 L7,-44 L-1,-44 Z" fill="#e8d0a8"/>

    <!-- Head — focused forward, slightly older -->
    <ellipse cx="3" cy="-66" rx="6" ry="7" fill="url(#i8p19p4skin)"/>
    <path d="M-3,-76 Q3,-80 9,-76 L9,-66 Q3,-70 -3,-66 Z" fill="#5a4838"/>
    <ellipse cx="3" cy="-78" rx="5" ry="2" fill="#ffd898" opacity="0.55" filter="url(#i8p19p4bloom)"/>
    <ellipse cx="0" cy="-66" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="0" cy="-66" r="0.4" fill="#5a3018"/>
    <ellipse cx="6" cy="-66" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="6" cy="-66" r="0.4" fill="#5a3018"/>
    <line x1="-3" y1="-71" x2="3" y2="-71" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="3" y1="-71" x2="9" y2="-71" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="0" y1="-58" x2="6" y2="-58" stroke="#3a1808" stroke-width="0.4"/>
  </g>

  <!-- (No dialogue — return is silent) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
