<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="240" height="270">
  <title>Issue 8 — Page 11 — Panel 3: Inset — blackened suit fragments — silver turned to ash, the empty node mounts where light once pulsed</title>
  <desc>85mm close-up. Fragments of metallic suit — what was once silver turned black with centuries of oxidation, crumbling at edges. Fabric structure recognizable as fairy-tech suit material — holographic node mounts visible as empty dark sockets in degraded surface, same pattern seen on living suits. Material brittle, flaking, edges crumbling into dark dust. Scanner light illuminates fragments on stone shelf, empty node mounts catch blue-violet light as dark points — sockets that once held structured luminescence, now empty. Dust surrounds fragments. The suit that outlasted its wearer.</desc>

  <defs>
    <linearGradient id="i8p11p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p11p3blackSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p11p3shelf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i8p11p3scannerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <filter id="i8p11p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p11p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p11p3megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="240" height="270" fill="url(#i8p11p3bg)"/>

  <!-- Stone shelf -->
  <rect x="0" y="180" width="240" height="90" fill="url(#i8p11p3shelf)"/>
  <line x1="0" y1="180" x2="240" y2="180" stroke="#040408" stroke-width="0.85"/>
  <!-- Dust on shelf -->
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="60" cy="200" rx="40" ry="3"/>
    <ellipse cx="160" cy="220" rx="50" ry="4"/>
    <ellipse cx="120" cy="240" rx="60" ry="4"/>
  </g>

  <!-- Scanner light wash -->
  <ellipse cx="120" cy="120" rx="160" ry="100" fill="url(#i8p11p3scannerLight)" filter="url(#i8p11p3megaglow)"/>

  <!-- ===== LARGE FRAGMENT (center) — torso piece, blackened ===== -->
  <g transform="translate(120 130)">
    <!-- Crumbling fragment outline (irregular) -->
    <path d="M-50,-22 L-30,-44 L-7,-50 L22,-44 L44,-22 L50,0 L40,22 L18,30 L-14,28 L-40,18 L-50,0 Z" fill="url(#i8p11p3blackSuit)"/>

    <!-- Crumbling edges (darker chips) -->
    <g fill="#040408" opacity="0.95">
      <ellipse cx="-50" cy="-15" rx="6" ry="2.5"/>
      <ellipse cx="-30" cy="-44" rx="4" ry="2"/>
      <ellipse cx="22" cy="-44" rx="4" ry="2"/>
      <ellipse cx="50" cy="0" rx="4" ry="2"/>
      <ellipse cx="40" cy="22" rx="4" ry="2"/>
      <ellipse cx="-40" cy="18" rx="6" ry="2.5"/>
    </g>
    <!-- Suit structure lines (degraded but visible) -->
    <g stroke="#3a3030" stroke-width="0.55" fill="none" opacity="0.7">
      <line x1="-30" y1="-30" x2="22" y2="-30"/>
      <line x1="-40" y1="-9" x2="40" y2="-9"/>
      <line x1="-44" y1="11" x2="36" y2="11"/>
    </g>

    <!-- ===== EMPTY NODE MOUNTS (dark sockets where light once pulsed) ===== -->
    <!-- 4 nodes in shoulder/chest pattern (matching living suit accent positions) -->
    <circle cx="-22" cy="-22" r="3" fill="#040408"/>
    <circle cx="-22" cy="-22" r="2" fill="#1a1018"/>
    <line x1="-22" y1="-25" x2="-22" y2="-19" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>
    <line x1="-25" y1="-22" x2="-19" y2="-22" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>

    <circle cx="22" cy="-22" r="3" fill="#040408"/>
    <circle cx="22" cy="-22" r="2" fill="#1a1018"/>
    <line x1="22" y1="-25" x2="22" y2="-19" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>
    <line x1="19" y1="-22" x2="25" y2="-22" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>

    <circle cx="0" cy="0" r="3.5" fill="#040408"/>
    <circle cx="0" cy="0" r="2.5" fill="#1a1018"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>

    <circle cx="-14" cy="14" r="2.5" fill="#040408"/>
    <circle cx="14" cy="14" r="2.5" fill="#040408"/>

    <!-- Faint scanner-light catch on fragment surface (showing it IS metal still) -->
    <line x1="-40" y1="-22" x2="40" y2="-22" stroke="#3a3030" stroke-width="0.4" opacity="0.7" filter="url(#i8p11p3bloom)"/>

    <!-- Crumbling crack lines -->
    <path d="M-30,-22 L-22,-9 L-30,11" stroke="#040408" stroke-width="0.55" opacity="0.85"/>
    <path d="M22,-22 L30,-3 L22,18" stroke="#040408" stroke-width="0.55" opacity="0.85"/>
    <path d="M0,18 L-7,28" stroke="#040408" stroke-width="0.55" opacity="0.85"/>
  </g>

  <!-- ===== SMALLER FRAGMENT (lower right, scattered) ===== -->
  <g transform="translate(180 195)">
    <path d="M-22,-7 L-14,-15 L0,-11 L7,-3 L0,3 L-15,5 Z" fill="url(#i8p11p3blackSuit)" opacity="0.85"/>
    <!-- Empty node mount -->
    <circle cx="-7" cy="-7" r="2" fill="#040408"/>
    <circle cx="-7" cy="-7" r="1.4" fill="#1a1018"/>
    <!-- Crumbling edges -->
    <g fill="#040408" opacity="0.85">
      <ellipse cx="-22" cy="-7" rx="2.5" ry="1.4"/>
      <ellipse cx="0" cy="3" rx="2.5" ry="1.4"/>
    </g>
  </g>

  <!-- Tiny chip fragments -->
  <g transform="translate(60 200)">
    <path d="M-7,0 L-3,-7 L3,-3 L0,5 Z" fill="url(#i8p11p3blackSuit)" opacity="0.7"/>
    <ellipse cx="-3" cy="-3" rx="1" ry="0.55" fill="#040408"/>
  </g>

  <!-- BLACK DUST (the suit crumbling into the shelf dust) -->
  <g fill="#040408" opacity="0.7">
    <ellipse cx="40" cy="200" rx="14" ry="3"/>
    <ellipse cx="80" cy="220" rx="22" ry="4"/>
    <ellipse cx="160" cy="225" rx="14" ry="3"/>
    <ellipse cx="200" cy="245" rx="22" ry="4"/>
    <ellipse cx="120" cy="250" rx="22" ry="3"/>
  </g>

  <!-- Faint scanner-light flecks -->
  <g fill="#a878e8" opacity="0.4" filter="url(#i8p11p3bloom)">
    <circle cx="50" cy="100" r="0.55"/>
    <circle cx="180" cy="80" r="0.4"/>
    <circle cx="100" cy="60" r="0.55"/>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q60,142 120,138 Q180,136 240,140"/>
  </g>
</svg>
