<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 5 — Panel 5: The alley as canyon — vertical slice between brick buildings, gaslight a warm sun, Thresh a tiny crimson speck — solitude rendered at scale</title>
  <desc>28mm wide slightly high angle looking down into narrow Victorian alley — vertical canyon between dark brick buildings, sky narrow strip of fog-hazed moonlight above. One end single gas lamp casts warm amber pool. Other end deep shadow tiny figure approximately four inches tall barely visible — speck of dented ruby-crimson against dark brickwork base, compact weapon across knees, utterly alone. Scale annihilating — alley walls tower, cobblestones vast, gaslight warm sun at impossible distance. Fog curls at roofline. City beyond walls felt in texture — vibration of distant sounds in brick, trembling of gaslight flame.</desc>

  <defs>
    <linearGradient id="i8p5p5skyStrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4858"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <linearGradient id="i8p5p5brickWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p5p5cobbleFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p5p5sunHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p5p5moonlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8c8e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a4858" stop-opacity="0"/>
    </linearGradient>
    <filter id="i8p5p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p5p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p5p5strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p5p5megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky strip (narrow above) -->
  <rect width="742" height="40" fill="url(#i8p5p5skyStrip)"/>
  <!-- Cold moonlight from sky on top of walls -->
  <ellipse cx="371" cy="40" rx="500" ry="14" fill="url(#i8p5p5moonlight)" filter="url(#i8p5p5strongglow)"/>
  <!-- Fog curling at roofline -->
  <g opacity="0.55" filter="url(#i8p5p5glow)">
    <ellipse cx="180" cy="50" rx="80" ry="11" fill="#3a4858"/>
    <ellipse cx="380" cy="55" rx="100" ry="14" fill="#3a4858"/>
    <ellipse cx="580" cy="50" rx="80" ry="11" fill="#3a4858"/>
  </g>
  <!-- Stars (faint through fog) -->
  <circle cx="120" cy="20" r="0.55" fill="#fff8e8" filter="url(#i8p5p5bloom)" opacity="0.7"/>
  <circle cx="320" cy="15" r="0.55" fill="#fff8e8" filter="url(#i8p5p5bloom)" opacity="0.55"/>
  <circle cx="520" cy="22" r="0.4" fill="#fff8e8" filter="url(#i8p5p5bloom)" opacity="0.4"/>

  <!-- Top edges of the brick buildings (silhouettes) -->
  <rect x="0" y="40" width="742" height="14" fill="#040408"/>
  <!-- Chimney pot silhouettes on the walls -->
  <rect x="80" y="20" width="11" height="20" fill="#040408"/>
  <rect x="220" y="22" width="14" height="18" fill="#040408"/>
  <rect x="500" y="18" width="11" height="22" fill="#040408"/>
  <rect x="640" y="22" width="14" height="18" fill="#040408"/>

  <!-- ===== BRICK WALLS — towering vertical canyon ===== -->
  <!-- Left wall -->
  <rect x="0" y="40" width="200" height="220" fill="url(#i8p5p5brickWall)"/>
  <!-- Right wall -->
  <rect x="540" y="40" width="202" height="220" fill="url(#i8p5p5brickWall)"/>

  <!-- Brick mortar (LEFT — densely textured for scale) -->
  <g stroke="#040408" stroke-width="0.7" opacity="0.85">
    <line x1="0" y1="60" x2="200" y2="60"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
    <line x1="0" y1="200" x2="200" y2="200"/>
    <line x1="0" y1="220" x2="200" y2="220"/>
    <line x1="0" y1="240" x2="200" y2="240"/>
  </g>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="60" y1="40" x2="60" y2="60"/>
    <line x1="120" y1="40" x2="120" y2="60"/>
    <line x1="180" y1="40" x2="180" y2="60"/>
    <line x1="40" y1="60" x2="40" y2="80"/>
    <line x1="100" y1="60" x2="100" y2="80"/>
    <line x1="160" y1="60" x2="160" y2="80"/>
    <line x1="80" y1="80" x2="80" y2="100"/>
    <line x1="140" y1="80" x2="140" y2="100"/>
    <line x1="20" y1="100" x2="20" y2="120"/>
    <line x1="80" y1="100" x2="80" y2="120"/>
    <line x1="160" y1="100" x2="160" y2="120"/>
    <line x1="60" y1="120" x2="60" y2="140"/>
    <line x1="120" y1="120" x2="120" y2="140"/>
    <line x1="40" y1="140" x2="40" y2="160"/>
    <line x1="100" y1="140" x2="100" y2="160"/>
    <line x1="160" y1="140" x2="160" y2="160"/>
    <line x1="80" y1="160" x2="80" y2="180"/>
    <line x1="140" y1="160" x2="140" y2="180"/>
    <line x1="60" y1="200" x2="60" y2="220"/>
    <line x1="120" y1="200" x2="120" y2="220"/>
    <line x1="40" y1="220" x2="40" y2="240"/>
    <line x1="100" y1="220" x2="100" y2="240"/>
    <line x1="160" y1="220" x2="160" y2="240"/>
  </g>
  <!-- RIGHT wall mortar -->
  <g stroke="#040408" stroke-width="0.7" opacity="0.85">
    <line x1="540" y1="60" x2="742" y2="60"/>
    <line x1="540" y1="80" x2="742" y2="80"/>
    <line x1="540" y1="100" x2="742" y2="100"/>
    <line x1="540" y1="120" x2="742" y2="120"/>
    <line x1="540" y1="140" x2="742" y2="140"/>
    <line x1="540" y1="160" x2="742" y2="160"/>
    <line x1="540" y1="180" x2="742" y2="180"/>
    <line x1="540" y1="200" x2="742" y2="200"/>
    <line x1="540" y1="220" x2="742" y2="220"/>
    <line x1="540" y1="240" x2="742" y2="240"/>
  </g>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="600" y1="40" x2="600" y2="60"/>
    <line x1="680" y1="40" x2="680" y2="60"/>
    <line x1="580" y1="60" x2="580" y2="80"/>
    <line x1="660" y1="60" x2="660" y2="80"/>
    <line x1="620" y1="80" x2="620" y2="100"/>
    <line x1="700" y1="80" x2="700" y2="100"/>
    <line x1="580" y1="100" x2="580" y2="120"/>
    <line x1="660" y1="100" x2="660" y2="120"/>
    <line x1="620" y1="120" x2="620" y2="140"/>
    <line x1="700" y1="120" x2="700" y2="140"/>
    <line x1="580" y1="140" x2="580" y2="160"/>
    <line x1="660" y1="140" x2="660" y2="160"/>
    <line x1="620" y1="160" x2="620" y2="180"/>
    <line x1="700" y1="160" x2="700" y2="180"/>
    <line x1="600" y1="200" x2="600" y2="220"/>
    <line x1="680" y1="200" x2="680" y2="220"/>
    <line x1="580" y1="220" x2="580" y2="240"/>
    <line x1="660" y1="220" x2="660" y2="240"/>
  </g>

  <!-- Soot stains and grime -->
  <g fill="#040408" opacity="0.55">
    <ellipse cx="60" cy="100" rx="22" ry="9"/>
    <ellipse cx="140" cy="160" rx="22" ry="9"/>
    <ellipse cx="600" cy="120" rx="22" ry="9"/>
    <ellipse cx="680" cy="180" rx="22" ry="9"/>
  </g>

  <!-- ===== COBBLESTONE FLOOR ===== -->
  <rect x="200" y="240" width="340" height="60" fill="url(#i8p5p5cobbleFloor)"/>
  <!-- Cobblestones -->
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="240" cy="260" rx="11" ry="6"/>
    <ellipse cx="280" cy="270" rx="11" ry="6"/>
    <ellipse cx="320" cy="260" rx="11" ry="6"/>
    <ellipse cx="360" cy="270" rx="11" ry="6"/>
    <ellipse cx="400" cy="265" rx="11" ry="6"/>
    <ellipse cx="440" cy="270" rx="11" ry="6"/>
    <ellipse cx="480" cy="260" rx="11" ry="6"/>
    <ellipse cx="520" cy="270" rx="11" ry="6"/>
    <ellipse cx="260" cy="285" rx="11" ry="6"/>
    <ellipse cx="320" cy="290" rx="11" ry="6"/>
    <ellipse cx="380" cy="285" rx="11" ry="6"/>
    <ellipse cx="440" cy="290" rx="11" ry="6"/>
    <ellipse cx="500" cy="285" rx="11" ry="6"/>
  </g>

  <!-- ===== GASLIGHT — far-right end, the warm sun ===== -->
  <g transform="translate(620 100)">
    <rect x="-2" y="0" width="4" height="140" fill="#3a3030"/>
    <rect x="-22" y="-26" width="22" height="22" fill="#1a1818"/>
    <polygon points="-26,-26 4,-26 0,-36 -22,-36" fill="#3a3030"/>
    <rect x="-18" y="-22" width="14" height="16" fill="#3a1808"/>
    <ellipse cx="-11" cy="-14" rx="6" ry="9" fill="url(#i8p5p5sunHalo)" filter="url(#i8p5p5strongglow)"/>
    <ellipse cx="-11" cy="-14" rx="3" ry="6" fill="#fff" filter="url(#i8p5p5bloom)"/>
  </g>
  <!-- Massive amber halo (the sun at impossible distance) -->
  <ellipse cx="600" cy="86" rx="280" ry="180" fill="url(#i8p5p5sunHalo)" filter="url(#i8p5p5megaglow)" opacity="0.85"/>
  <ellipse cx="540" cy="270" rx="220" ry="44" fill="url(#i8p5p5sunHalo)" filter="url(#i8p5p5megaglow)" opacity="0.7"/>

  <!-- Cobblestones gleam where gaslight reaches -->
  <g opacity="0.85" filter="url(#i8p5p5bloom)">
    <ellipse cx="440" cy="270" rx="6" ry="2" fill="#ffd898" opacity="0.55"/>
    <ellipse cx="480" cy="260" rx="9" ry="3" fill="#ffd898" opacity="0.7"/>
    <ellipse cx="520" cy="270" rx="9" ry="3" fill="#ffd898" opacity="0.85"/>
  </g>

  <!-- Long shadow stretching from gaslight back -->
  <g opacity="0.55">
    <path d="M540,100 L240,260 L260,295 L580,180 Z" fill="#040408" filter="url(#i8p5p5glow)"/>
  </g>

  <!-- Drainpipe on right wall -->
  <g transform="translate(700 0)" opacity="0.85">
    <rect x="-2" y="40" width="4" height="220" fill="#3a2010"/>
    <line x1="0" y1="40" x2="0" y2="260" stroke="#5a3018" stroke-width="0.55" opacity="0.7"/>
  </g>

  <!-- ===== THRESH — tiny crimson speck at far-left end of alley ===== -->
  <g transform="translate(220 256)">
    <ellipse cx="0" cy="0" rx="3" ry="6" fill="#3a0a0a" opacity="0.95"/>
    <ellipse cx="0" cy="-6" rx="2" ry="2" fill="#3a0a0a"/>
    <!-- Faint crimson hint -->
    <circle cx="0" cy="-3" r="0.55" fill="#a82818" filter="url(#i8p5p5bloom)" opacity="0.85"/>
  </g>
  <!-- Faint crimson glow halo -->
  <ellipse cx="220" cy="256" rx="14" ry="9" fill="#3a0a0a" opacity="0.4" filter="url(#i8p5p5glow)"/>

  <!-- ===== CAPTION ===== -->
  <g>
    <rect x="14" y="240" width="500" height="48" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">She counted the bricks. She counted the cobblestones.</text>
  <text x="22" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">She counted the seconds between the gaslight's flicker and its steadying.</text>
  <text x="22" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic" font-weight="700">She counted everything because counting was something her hands could do.</text>

  <!-- Brushwork overlay -->
  <g stroke="#040408" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
