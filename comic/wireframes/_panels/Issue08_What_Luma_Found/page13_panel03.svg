<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 8 — Page 13 — Panel 3: Luma lifts the dead data core — wraps both arms around it, holds it like something precious and terrible</title>
  <desc>85mm close-up eye level. Luma wraps both arms around dead data core, bracing it against her chest. Core dark — cracked, inert, absorbing light — approximately her forearm length and clearly heavy, requiring both arms. Against her living sapphire-violet suit with pulsing holographic nodes, dead core stark contrast — dark against light, cold against warm, past against present. Holds it like something precious and terrible. Determination over grief — jaw set, eyes forward, scientist who now has mission. Long braided hair with luminous filament falls over core. Alcove behind dark, word STAY fading back to dormancy. The living holding the dead.</desc>

  <defs>
    <linearGradient id="i8p13p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p13p3stoneAlcove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p13p3lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p13p3deadCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i8p13p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <radialGradient id="i8p13p3suitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p13p3stayDormant" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a1858" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a0828" stop-opacity="0"/>
    </radialGradient>
    <filter id="i8p13p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p13p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p13p3strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p13p3megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="240" fill="url(#i8p13p3bg)"/>

  <!-- Stone alcove behind (dark, fading) -->
  <rect x="0" y="0" width="366" height="240" fill="url(#i8p13p3stoneAlcove)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <line x1="0" y1="40" x2="366" y2="40"/>
    <line x1="0" y1="80" x2="366" y2="80"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="60" y1="0" x2="60" y2="40"/>
    <line x1="180" y1="40" x2="180" y2="80"/>
    <line x1="280" y1="0" x2="280" y2="40"/>
  </g>

  <!-- STAY very faint, fading back to dormancy (top-right) -->
  <g transform="translate(280 60)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="url(#i8p13p3stayDormant)" filter="url(#i8p13p3megaglow)"/>
    <g stroke="#7848b8" stroke-width="1" fill="none" filter="url(#i8p13p3bloom)" opacity="0.55">
      <g transform="translate(-44 0)"><path d="M7,-9 L-7,-9 L-7,-1 L7,-1 L7,7 L-7,7"/></g>
      <g transform="translate(-22 0)"><path d="M-7,-9 L7,-9"/><path d="M0,-9 L0,7"/></g>
      <g transform="translate(0 0)"><path d="M-7,7 L0,-9 L7,7"/></g>
      <g transform="translate(22 0)"><path d="M-7,-9 L0,-1"/><path d="M7,-9 L0,-1"/><path d="M0,-1 L0,7"/></g>
    </g>
  </g>

  <!-- Living suit halo (vivid, central) -->
  <ellipse cx="183" cy="120" rx="180" ry="120" fill="url(#i8p13p3suitGlow)" filter="url(#i8p13p3megaglow)"/>

  <!-- ===== LUMA — close-up, holding the core ===== -->
  <g transform="translate(183 130)">
    <!-- Body — both arms wrapped forward around core -->
    <path d="M-30,80 L-36,40 L-40,-3 L-30,-30 L-14,-50 L-3,-58 L9,-58 L22,-50 L36,-30 L40,-3 L36,40 L30,80 Z" fill="url(#i8p13p3lumaSuit)"/>

    <!-- Heavy ink stains -->
    <ellipse cx="-30" cy="11" rx="6" ry="4" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="30" cy="11" rx="6" ry="4" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent vivid (LIVING — pulsing) -->
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#c8a8e8" stroke-width="0.85" opacity="0.95" filter="url(#i8p13p3bloom)"/>
    <circle cx="-14" cy="-30" r="2" fill="#c8a8e8" filter="url(#i8p13p3strongglow)" opacity="0.95"/>
    <circle cx="14" cy="-30" r="2" fill="#c8a8e8" filter="url(#i8p13p3strongglow)" opacity="0.95"/>
    <circle cx="0" cy="0" r="2" fill="#c8a8e8" filter="url(#i8p13p3strongglow)" opacity="0.95"/>
    <circle cx="-22" cy="22" r="1.4" fill="#c8a8e8" filter="url(#i8p13p3bloom)" opacity="0.85"/>
    <circle cx="22" cy="22" r="1.4" fill="#c8a8e8" filter="url(#i8p13p3bloom)" opacity="0.85"/>

    <!-- ===== ARMS WRAPPED around core ===== -->
    <!-- Left arm wrapped -->
    <path d="M-30,-30 L-50,-3 L-50,18 L-30,11 L-22,-9 Z" fill="url(#i8p13p3lumaSuit)"/>
    <!-- Right arm wrapped -->
    <path d="M30,-30 L50,-3 L50,18 L30,11 L22,-9 Z" fill="url(#i8p13p3lumaSuit)"/>
    <!-- Forearms holding from below the core -->
    <path d="M-50,11 L-30,30 L0,30 L-22,18 Z" fill="url(#i8p13p3lumaSuit)"/>
    <path d="M50,11 L30,30 L0,30 L22,18 Z" fill="url(#i8p13p3lumaSuit)"/>

    <!-- Hands clasped underneath the core -->
    <ellipse cx="-22" cy="22" rx="6" ry="4" fill="url(#i8p13p3skin)"/>
    <ellipse cx="22" cy="22" rx="6" ry="4" fill="url(#i8p13p3skin)"/>
    <!-- Fingers gripping -->
    <line x1="-26" y1="22" x2="-26" y2="26" stroke="#7a4818" stroke-width="0.55"/>
    <line x1="-22" y1="22" x2="-22" y2="26" stroke="#7a4818" stroke-width="0.55"/>
    <line x1="-18" y1="22" x2="-18" y2="26" stroke="#7a4818" stroke-width="0.55"/>
    <line x1="22" y1="22" x2="22" y2="26" stroke="#7a4818" stroke-width="0.55"/>
    <line x1="18" y1="22" x2="18" y2="26" stroke="#7a4818" stroke-width="0.55"/>
    <line x1="26" y1="22" x2="26" y2="26" stroke="#7a4818" stroke-width="0.55"/>

    <!-- ===== DEAD DATA CORE held against chest ===== -->
    <g transform="translate(0 0)">
      <rect x="-44" y="-9" width="88" height="22" fill="url(#i8p13p3deadCore)" stroke="#040408" stroke-width="0.85" rx="3"/>
      <line x1="-44" y1="3" x2="44" y2="3" stroke="#040408" stroke-width="0.55"/>
      <!-- Hairline fractures -->
      <path d="M-30,-3 L-22,7 L-15,-3" stroke="#040408" stroke-width="0.55" opacity="0.95"/>
      <path d="M14,-7 L22,3 L30,-3" stroke="#040408" stroke-width="0.55" opacity="0.85"/>
      <!-- Faint warm glow at fractures -->
      <path d="M-30,-3 L-22,7 L-15,-3" stroke="#a86838" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#i8p13p3bloom)"/>
      <!-- Surface dust transferred -->
      <ellipse cx="-22" cy="-7" rx="9" ry="2" fill="#a89878" opacity="0.4"/>
      <!-- Interface ports -->
      <circle cx="-30" cy="3" r="2" fill="#040408"/>
      <circle cx="30" cy="3" r="2" fill="#040408"/>
    </g>

    <!-- Head -->
    <ellipse cx="0" cy="-86" rx="14" ry="16" fill="url(#i8p13p3skin)"/>

    <!-- Long thick BRAID falling over the core -->
    <path d="M11,-72 Q22,-50 30,-22 Q35,0 40,22" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <g stroke="#a878e8" stroke-width="0.55" fill="none" filter="url(#i8p13p3bloom)" opacity="0.95">
      <path d="M11,-72 Q22,-50 30,-22 Q35,0 40,22"/>
    </g>
    <!-- Filament pulses -->
    <ellipse cx="22" cy="-50" rx="3" ry="1" fill="#c8a8e8" filter="url(#i8p13p3strongglow)" opacity="0.95"/>
    <ellipse cx="30" cy="-22" rx="3" ry="1" fill="#c8a8e8" filter="url(#i8p13p3strongglow)" opacity="0.95"/>
    <ellipse cx="40" cy="22" rx="3" ry="1" fill="#c8a8e8" filter="url(#i8p13p3strongglow)" opacity="0.85"/>

    <!-- Hair pulled back -->
    <path d="M-14,-100 Q0,-104 14,-100 L14,-86 Q0,-90 -14,-86 Z" fill="#1a0808"/>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-92" rx="14" ry="3" fill="#5a3018" opacity="0.4"/>

    <!-- Brows — DETERMINED, set -->
    <line x1="-9" y1="-94" x2="-3" y2="-94" stroke="#3a1808" stroke-width="1.4"/>
    <line x1="3" y1="-94" x2="9" y2="-94" stroke="#3a1808" stroke-width="1.4"/>

    <!-- Lenses (still active, scrolling but composed) -->
    <ellipse cx="0" cy="-86" rx="14" ry="4" fill="#7848b8" filter="url(#i8p13p3strongglow)" opacity="0.55"/>
    <ellipse cx="-3" cy="-86" rx="3" ry="2" fill="none" stroke="#a878e8" stroke-width="0.7" filter="url(#i8p13p3bloom)" opacity="0.95"/>
    <ellipse cx="3" cy="-86" rx="3" ry="2" fill="none" stroke="#a878e8" stroke-width="0.7" filter="url(#i8p13p3bloom)" opacity="0.95"/>

    <!-- Eyes — FORWARD, focused, jaw set -->
    <ellipse cx="-3" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-86" r="0.7" fill="#3a1808"/>
    <ellipse cx="3" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-86" r="0.7" fill="#3a1808"/>
    <!-- Catchlight -->
    <circle cx="-3" cy="-87" r="0.4" fill="#c8a8e8" filter="url(#i8p13p3bloom)" opacity="0.95"/>
    <circle cx="3" cy="-87" r="0.4" fill="#c8a8e8" filter="url(#i8p13p3bloom)" opacity="0.95"/>

    <!-- Nose -->
    <path d="M-2,-80 L0,-72 L3,-72 L3,-80 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth — flat, jaw SET (determination over grief) -->
    <line x1="-5" y1="-72" x2="5" y2="-72" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- ===== DIALOGUE — LUMA ===== -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Taking the data core. Everything else stays in situ.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">This site is a grave, Theodore. We treat it as one.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
  </g>
</svg>
