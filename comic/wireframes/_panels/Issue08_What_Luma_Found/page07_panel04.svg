<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 300" width="494" height="300">
  <title>Issue 8 — Page 7 — Panel 4: Theodore deeper into the old quarter — Tudor + Georgian + Victorian, layered like geological strata</title>
  <desc>28mm wide eye level down narrowing Victorian street. Architecture layered — Tudor timber frames with dark beams beside Georgian brick beside later Victorian additions, centuries of construction pressing together. Buildings lean, sky narrow strip darkening to night. Gaslight sparse — one lamp behind warm amber pool receding, street ahead darker. Theodore walks forward with purpose, sandy-brown hair catching last amber light. Faintest blue-violet glow from breast pocket. Buildings close in. Architecture gets older deeper he goes.</desc>

  <defs>
    <linearGradient id="i8p7p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3038"/>
      <stop offset="100%" stop-color="#1a1820"/>
    </linearGradient>
    <linearGradient id="i8p7p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p7p4tudor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a6038"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p7p4georgian" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="i8p7p4tudorBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p7p4lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p7p4waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p7p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p7p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p7p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p7p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p7p4megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- Sky strip - narrow, dark -->
  <rect width="494" height="50" fill="url(#i8p7p4sky)"/>

  <!-- ===== LEFT SIDE — Tudor (foreground) into Georgian (mid) into Victorian (back) ===== -->
  <!-- Tudor (foreground, with timber X-frames) -->
  <path d="M0,30 L120,40 L120,260 L0,260 Z" fill="url(#i8p7p4tudor)"/>
  <!-- Tudor timber framing -->
  <g stroke="url(#i8p7p4tudorBeam)" stroke-width="3" fill="none">
    <line x1="0" y1="100" x2="120" y2="105"/>
    <line x1="0" y1="170" x2="120" y2="175"/>
    <line x1="40" y1="35" x2="40" y2="260"/>
    <line x1="80" y1="38" x2="80" y2="260"/>
  </g>
  <g stroke="url(#i8p7p4tudorBeam)" stroke-width="2" fill="none">
    <path d="M0,170 L40,100"/>
    <path d="M40,170 L80,105"/>
    <path d="M80,175 L120,105"/>
    <path d="M40,260 L80,170"/>
  </g>
  <!-- Small leaded windows -->
  <g fill="#1a1008">
    <rect x="14" y="60" width="14" height="14"/>
    <rect x="55" y="60" width="14" height="14"/>
    <rect x="95" y="60" width="14" height="14"/>
    <rect x="14" y="130" width="14" height="14"/>
    <rect x="95" y="130" width="14" height="14"/>
    <rect x="55" y="200" width="14" height="14"/>
  </g>
  <!-- One lit window -->
  <rect x="14" y="60" width="14" height="14" fill="#a86838" opacity="0.85"/>
  <line x1="14" y1="66" x2="28" y2="66" stroke="#1a0808" stroke-width="0.4"/>

  <!-- Georgian brick (mid-distance, narrower) -->
  <path d="M120,40 L240,60 L240,260 L120,260 Z" fill="url(#i8p7p4georgian)"/>
  <g stroke="#040408" stroke-width="0.4" opacity="0.7">
    <line x1="125" y1="80" x2="240" y2="80"/>
    <line x1="125" y1="110" x2="240" y2="110"/>
    <line x1="125" y1="140" x2="240" y2="140"/>
    <line x1="125" y1="170" x2="240" y2="170"/>
    <line x1="125" y1="200" x2="240" y2="200"/>
    <line x1="170" y1="40" x2="170" y2="80"/>
    <line x1="210" y1="40" x2="210" y2="80"/>
  </g>
  <g fill="#1a0808">
    <rect x="140" y="80" width="22" height="40"/>
    <rect x="190" y="80" width="22" height="40"/>
    <rect x="140" y="150" width="22" height="40"/>
    <rect x="190" y="150" width="22" height="40"/>
  </g>

  <!-- Victorian distant (background, very narrow) -->
  <path d="M240,60 L320,80 L320,260 L240,260 Z" fill="#1a1008"/>
  <g fill="#040408">
    <rect x="250" y="100" width="14" height="22"/>
    <rect x="290" y="100" width="14" height="22"/>
  </g>

  <!-- ===== RIGHT SIDE — same layering, opposite direction ===== -->
  <path d="M494,30 L380,40 L380,260 L494,260 Z" fill="url(#i8p7p4tudor)"/>
  <g stroke="url(#i8p7p4tudorBeam)" stroke-width="3" fill="none">
    <line x1="494" y1="100" x2="380" y2="105"/>
    <line x1="494" y1="170" x2="380" y2="175"/>
    <line x1="450" y1="35" x2="450" y2="260"/>
  </g>
  <g stroke="url(#i8p7p4tudorBeam)" stroke-width="2" fill="none">
    <path d="M494,170 L450,100"/>
    <path d="M450,170 L380,105"/>
    <path d="M450,260 L380,170"/>
  </g>
  <g fill="#1a1008">
    <rect x="465" y="60" width="14" height="14"/>
    <rect x="425" y="60" width="14" height="14"/>
    <rect x="395" y="60" width="14" height="14"/>
    <rect x="465" y="130" width="14" height="14"/>
    <rect x="395" y="130" width="14" height="14"/>
  </g>

  <!-- Georgian -->
  <path d="M380,40 L320,60 L320,260 L380,260 Z" fill="url(#i8p7p4georgian)"/>
  <g stroke="#040408" stroke-width="0.4" opacity="0.7">
    <line x1="320" y1="80" x2="380" y2="80"/>
    <line x1="320" y1="110" x2="380" y2="110"/>
    <line x1="320" y1="140" x2="380" y2="140"/>
  </g>
  <g fill="#1a0808">
    <rect x="335" y="80" width="22" height="40"/>
    <rect x="335" y="150" width="22" height="40"/>
  </g>

  <!-- Sky narrows (buildings lean toward each other) - emphasized by darkness -->

  <!-- Cobblestone street -->
  <rect x="0" y="240" width="494" height="60" fill="url(#i8p7p4cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="60" cy="260" rx="11" ry="6"/>
    <ellipse cx="160" cy="265" rx="11" ry="6"/>
    <ellipse cx="280" cy="270" rx="11" ry="6"/>
    <ellipse cx="380" cy="265" rx="11" ry="6"/>
    <ellipse cx="80" cy="285" rx="11" ry="6"/>
    <ellipse cx="220" cy="290" rx="11" ry="6"/>
    <ellipse cx="350" cy="285" rx="11" ry="6"/>
  </g>

  <!-- ===== ONE GASLIGHT BEHIND (left, distance) — pool RECEDING ===== -->
  <g transform="translate(60 100)" opacity="0.85">
    <rect x="-2" y="0" width="4" height="120" fill="#3a3030"/>
    <rect x="-18" y="-22" width="18" height="18" fill="#1a1818"/>
    <ellipse cx="-9" cy="-12" rx="4" ry="6" fill="#fff8d8" filter="url(#i8p7p4strongglow)" opacity="0.85"/>
  </g>
  <ellipse cx="40" cy="240" rx="120" ry="40" fill="url(#i8p7p4lampPool)" filter="url(#i8p7p4megaglow)" opacity="0.7"/>

  <!-- Street ahead darker (no further lamps visible) -->
  <ellipse cx="270" cy="240" rx="180" ry="40" fill="#040408" opacity="0.85" filter="url(#i8p7p4glow)"/>

  <!-- ===== THEODORE walking FORWARD (deeper into shadow) ===== -->
  <g transform="translate(220 220)">
    <!-- Trousers -->
    <path d="M-7,60 L-11,11 L-7,-11 L-3,-22 L7,-22 L11,-11 L14,11 L11,60 Z" fill="#5a4838"/>
    <!-- Walking -->
    <path d="M-3,60 L-7,100 L-3,100 L0,60 Z" fill="#5a4838"/>
    <path d="M3,60 L7,100 L11,100 L9,60 Z" fill="#5a4838"/>
    <!-- Boots -->
    <path d="M-7,100 L-11,108 L-3,108 L-3,100 Z" fill="#1a1008"/>
    <path d="M7,100 L11,108 L7,108 L7,100 Z" fill="#1a1008"/>

    <!-- Waistcoat -->
    <path d="M-18,-3 L-22,-26 L-14,-44 L-7,-50 L7,-50 L14,-44 L22,-26 L18,-3 L14,3 L-14,3 Z" fill="url(#i8p7p4waistcoat)"/>
    <!-- Buttons -->
    <circle cx="0" cy="-36" r="1.4" fill="#a86838" filter="url(#i8p7p4bloom)"/>
    <circle cx="0" cy="-22" r="1.4" fill="#a86838" filter="url(#i8p7p4bloom)"/>
    <circle cx="0" cy="-9" r="1.4" fill="#a86838" filter="url(#i8p7p4bloom)"/>

    <!-- Breast pocket with stronger violet glow (closer to glyph) -->
    <rect x="-14" y="-36" width="11" height="11" fill="#3a2010" opacity="0.85"/>
    <ellipse cx="-9" cy="-30" rx="9" ry="6" fill="#a878e8" opacity="0.55" filter="url(#i8p7p4glow)"/>
    <circle cx="-9" cy="-30" r="2" fill="#c8a8e8" filter="url(#i8p7p4bloom)" opacity="0.95"/>

    <!-- Hands in pockets -->
    <ellipse cx="-18" cy="-3" rx="5" ry="3" fill="url(#i8p7p4waistcoat)"/>
    <ellipse cx="18" cy="-3" rx="5" ry="3" fill="url(#i8p7p4waistcoat)"/>

    <!-- White collar -->
    <path d="M-7,-50 L-5,-54 L5,-54 L7,-50 L5,-44 L-5,-44 Z" fill="#e8d0a8"/>

    <!-- Neck -->
    <path d="M-5,-54 L5,-54 L3,-62 L-3,-62 Z" fill="url(#i8p7p4skin)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-76" rx="11" ry="14" fill="url(#i8p7p4skin)"/>
    <!-- Hair catching last amber light -->
    <path d="M-11,-90 Q0,-94 11,-90 L11,-72 Q9,-86 0,-86 Q-9,-86 -11,-72 Z" fill="#7a5028"/>
    <ellipse cx="0" cy="-92" rx="9" ry="2" fill="#ffd898" opacity="0.85" filter="url(#i8p7p4bloom)"/>

    <!-- Eyes focused ahead -->
    <ellipse cx="-3" cy="-76" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-76" r="0.55" fill="#5a3018"/>
    <ellipse cx="3" cy="-76" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-76" r="0.55" fill="#5a3018"/>
    <line x1="-5" y1="-80" x2="-1" y2="-80" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="1" y1="-80" x2="5" y2="-80" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Mouth -->
    <line x1="-2" y1="-66" x2="2" y2="-66" stroke="#3a1808" stroke-width="0.4"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- THEODORE -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">My dad brought me here once. Said the oldest buildings</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">in London are hidden behind the new ones.</text>

  <!-- LUMA -->
  <g>
    <rect x="120" y="74" width="320" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="128" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(from pocket)</tspan></text>
  <text x="128" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">He was right. The glyph density is increasing. We're close.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260"/>
  </g>
</svg>
