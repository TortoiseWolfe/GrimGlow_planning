<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 17 — Panel 3: Thresh resumes — weapon back, eyes wiped, "Stay sharp" — same words, different tone — the watch that changed its watcher</title>
  <desc>28mm wide low angle. Thresh resettled against brick wall — compact weapon back across armored knees, back pressed to brick, broad-shouldered posture restored. Wiped eyes with back of gauntlet — practical field gesture. Copper-red buzz cut catches warm gaslight. Expression composed but differently than before. Not rigid mask of controlled fear. Something quieter, more settled. Grip on weapon firm but not white-knuckled — tool held by professional, not lifeline gripped by someone drowning. Dented ruby-crimson armor, long scratch across chest plate, dimmed crimson nodes. Same alley. Different soldier.</desc>

  <defs>
    <linearGradient id="i8p17p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p17p3brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p17p3cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p17p3lampDistant" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p17p3threshArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="i8p17p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p17p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p17p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p17p3megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p17p3bg)"/>

  <!-- Brick wall (low angle — towering up) -->
  <rect x="0" y="0" width="742" height="240" fill="url(#i8p17p3brick)"/>
  <g stroke="#040408" stroke-width="0.7" opacity="0.85">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
  </g>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="80" y1="0" x2="80" y2="40"/>
    <line x1="220" y1="0" x2="220" y2="40"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="540" y1="0" x2="540" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="180" y1="40" x2="180" y2="80"/>
    <line x1="320" y1="40" x2="320" y2="80"/>
    <line x1="460" y1="40" x2="460" y2="80"/>
    <line x1="600" y1="40" x2="600" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="120"/>
    <line x1="260" y1="80" x2="260" y2="120"/>
    <line x1="420" y1="80" x2="420" y2="120"/>
    <line x1="580" y1="80" x2="580" y2="120"/>
    <line x1="60" y1="120" x2="60" y2="160"/>
    <line x1="220" y1="120" x2="220" y2="160"/>
    <line x1="380" y1="120" x2="380" y2="160"/>
    <line x1="540" y1="120" x2="540" y2="160"/>
    <line x1="660" y1="120" x2="660" y2="160"/>
    <line x1="100" y1="160" x2="100" y2="200"/>
    <line x1="260" y1="160" x2="260" y2="200"/>
    <line x1="420" y1="160" x2="420" y2="200"/>
    <line x1="580" y1="160" x2="580" y2="200"/>
  </g>
  <!-- Soot stains -->
  <g fill="#040408" opacity="0.55">
    <ellipse cx="80" cy="80" rx="22" ry="9"/>
    <ellipse cx="280" cy="140" rx="22" ry="9"/>
    <ellipse cx="500" cy="100" rx="22" ry="9"/>
    <ellipse cx="660" cy="180" rx="22" ry="9"/>
  </g>

  <!-- Cobblestone -->
  <rect x="0" y="240" width="742" height="60" fill="url(#i8p17p3cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="60" cy="260" rx="11" ry="6"/>
    <ellipse cx="160" cy="270" rx="11" ry="6"/>
    <ellipse cx="280" cy="265" rx="11" ry="6"/>
    <ellipse cx="380" cy="270" rx="11" ry="6"/>
    <ellipse cx="480" cy="265" rx="11" ry="6"/>
    <ellipse cx="600" cy="270" rx="11" ry="6"/>
    <ellipse cx="700" cy="265" rx="11" ry="6"/>
    <ellipse cx="100" cy="285" rx="11" ry="6"/>
    <ellipse cx="240" cy="290" rx="11" ry="6"/>
    <ellipse cx="380" cy="285" rx="11" ry="6"/>
    <ellipse cx="540" cy="290" rx="11" ry="6"/>
    <ellipse cx="660" cy="285" rx="11" ry="6"/>
  </g>

  <!-- Distant gaslight halo from far right -->
  <ellipse cx="742" cy="180" rx="280" ry="200" fill="url(#i8p17p3lampDistant)" filter="url(#i8p17p3megaglow)"/>

  <!-- ===== THRESH at base of wall — RESETTLED, the watch resumes ===== -->
  <g transform="translate(180 250)">
    <!-- Body — back to brick, broad-shouldered solidity restored -->
    <path d="M-9,30 L-11,11 L-14,-7 L-11,-22 L-3,-32 L3,-32 L11,-22 L14,-7 L11,11 L9,30 Z" fill="url(#i8p17p3threshArmor)"/>

    <!-- Heavy dents (hours of wear) -->
    <ellipse cx="-11" cy="-14" rx="3" ry="2" fill="#5a1410"/>
    <ellipse cx="11" cy="-14" rx="3" ry="2" fill="#7a1810"/>

    <!-- LONG CHEST SCRATCH (continuity) -->
    <path d="M-7,-3 L7,3" stroke="#3a0a0a" stroke-width="1.4" opacity="0.85"/>
    <path d="M-5,-1 L5,5" stroke="#1a0606" stroke-width="0.55" opacity="0.7"/>

    <!-- Suit accent — back to STEALTH DIM (composed, not pulsing erratically) -->
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#a82818" stroke-width="0.55" opacity="0.7" filter="url(#i8p17p3bloom)"/>
    <circle cx="-7" cy="-14" r="0.7" fill="#a82818" filter="url(#i8p17p3bloom)" opacity="0.55"/>
    <circle cx="7" cy="-14" r="0.7" fill="#a82818" filter="url(#i8p17p3bloom)" opacity="0.55"/>
    <circle cx="0" cy="0" r="0.7" fill="#a82818" filter="url(#i8p17p3bloom)" opacity="0.55"/>

    <!-- Knees -->
    <ellipse cx="-7" cy="22" rx="6" ry="3" fill="url(#i8p17p3threshArmor)"/>
    <ellipse cx="7" cy="22" rx="6" ry="3" fill="url(#i8p17p3threshArmor)"/>

    <!-- ===== WEAPON BACK across knees ===== -->
    <rect x="-22" y="20" width="44" height="3" fill="#0a0408"/>
    <ellipse cx="0" cy="22" rx="6" ry="0.85" fill="#a82818" filter="url(#i8p17p3bloom)" opacity="0.55"/>
    <!-- ===== HANDS on weapon — FIRM but NOT WHITE-KNUCKLE ===== -->
    <ellipse cx="-9" cy="20" rx="3" ry="2" fill="url(#i8p17p3skin)"/>
    <ellipse cx="9" cy="20" rx="3" ry="2" fill="url(#i8p17p3skin)"/>
    <!-- Knuckles relaxed (no white highlights this time) -->
    <line x1="-12" y1="20" x2="-12" y2="23" stroke="#7a4818" stroke-width="0.4"/>
    <line x1="-9" y1="20" x2="-9" y2="23" stroke="#7a4818" stroke-width="0.4"/>
    <line x1="-6" y1="20" x2="-6" y2="23" stroke="#7a4818" stroke-width="0.4"/>
    <line x1="6" y1="20" x2="6" y2="23" stroke="#7a4818" stroke-width="0.4"/>
    <line x1="9" y1="20" x2="9" y2="23" stroke="#7a4818" stroke-width="0.4"/>
    <line x1="12" y1="20" x2="12" y2="23" stroke="#7a4818" stroke-width="0.4"/>

    <!-- Head — settled, looking forward, copper-red catches warm light -->
    <ellipse cx="0" cy="-40" rx="6" ry="7" fill="url(#i8p17p3skin)"/>
    <!-- Buzz cut, warmly lit -->
    <path d="M-7,-50 Q0,-54 7,-50 L7,-40 Q0,-44 -7,-40 Z" fill="#a83820"/>
    <ellipse cx="0" cy="-52" rx="6" ry="2" fill="#ffd898" opacity="0.7" filter="url(#i8p17p3bloom)"/>

    <!-- Eyes — STILL DAMP but face SET (composed) -->
    <ellipse cx="-3" cy="-40" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-40" r="0.55" fill="#3a1808"/>
    <ellipse cx="3" cy="-40" rx="1.4" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-40" r="0.55" fill="#3a1808"/>
    <!-- Catchlights warm -->
    <circle cx="-3" cy="-41" r="0.4" fill="#ffd898" filter="url(#i8p17p3bloom)" opacity="0.85"/>
    <circle cx="3" cy="-41" r="0.4" fill="#ffd898" filter="url(#i8p17p3bloom)" opacity="0.85"/>
    <!-- Faint moisture trace under eyes (residual) -->
    <line x1="-7" y1="-37" x2="-1" y2="-37" stroke="#fff" stroke-width="0.4" opacity="0.4" filter="url(#i8p17p3bloom)"/>

    <!-- Brows — set, composed -->
    <line x1="-7" y1="-46" x2="-1" y2="-46" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="1" y1="-46" x2="7" y2="-46" stroke="#3a1808" stroke-width="0.55"/>

    <!-- Mouth — flat, settled, whisper to self -->
    <line x1="-3" y1="-34" x2="3" y2="-34" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== DIALOGUE — THRESH whispers — same words, different tone ===== -->
  <g>
    <rect x="14" y="14" width="240" height="36" rx="2" fill="white" stroke="#dc143c" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#dc143c" font-weight="700">THRESH  <tspan font-style="italic" font-size="8" font-weight="500">(whisper)</tspan></text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">Stay sharp.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
