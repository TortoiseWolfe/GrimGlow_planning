<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 8 — Page 7 — Panel 2: Luma navigates from inside the waistcoat pocket — scanner overlay on the street, scientific focus</title>
  <desc>85mm close-up — view from inside waistcoat breast pocket looking out. Tiny woman South Asian features warm brown skin large dark eyes behind holographic lenses scrolling blue-violet data, long dark hair in one thick braid braided NOT loose with pulsing luminous filament, in worn sapphire-violet suit. Holds holographic scanner against pocket fabric, projecting data only she can see — geometric overlay markers on street beyond. One marker pulses brighter than others indicating target ahead. Pocket fabric warm brown wool close and textured. Beyond pocket's opening Victorian street stretches in warm amber gaslight out of focus.</desc>

  <defs>
    <linearGradient id="i8p7p2pocket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="i8p7p2violetGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5a4ab8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p7p2distantStreet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p7p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p7p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i8p7p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p7p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p7p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p7p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="i8p7p2dataPulse"><feGaussianBlur stdDeviation="0.55"/></filter>
    <filter id="i8p7p2outOfFocus"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Pocket interior — warm brown wool framing the panel -->
  <rect width="366" height="240" fill="url(#i8p7p2pocket)"/>
  <!-- Pocket fabric texture -->
  <g stroke="#7a5028" stroke-width="0.55" opacity="0.55" fill="none">
    <path d="M0,40 Q90,50 180,40 Q270,30 366,40"/>
    <path d="M0,80 Q90,90 180,80 Q270,70 366,80"/>
    <path d="M0,200 Q90,210 180,200 Q270,190 366,200"/>
    <path d="M0,160 Q90,170 180,160 Q270,150 366,160"/>
  </g>
  <!-- Vertical thread texture -->
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.4">
    <line x1="40" y1="0" x2="42" y2="240"/>
    <line x1="120" y1="0" x2="122" y2="240"/>
    <line x1="240" y1="0" x2="242" y2="240"/>
    <line x1="320" y1="0" x2="322" y2="240"/>
  </g>

  <!-- ===== POCKET OPENING — top edge, looking out at street ===== -->
  <path d="M0,0 L366,0 L340,80 L26,80 Z" fill="#1a1008"/>
  <!-- Distant Victorian street (out of focus through opening) -->
  <g filter="url(#i8p7p2outOfFocus)">
    <ellipse cx="183" cy="40" rx="220" ry="44" fill="url(#i8p7p2distantStreet)" filter="url(#i8p7p2megaglow)"/>
    <!-- Distant building shapes -->
    <rect x="60" y="20" width="60" height="60" fill="#3a2010" opacity="0.7"/>
    <rect x="160" y="14" width="60" height="66" fill="#5a3018" opacity="0.7"/>
    <rect x="240" y="20" width="60" height="60" fill="#3a2010" opacity="0.7"/>
    <!-- Distant gaslight -->
    <circle cx="200" cy="35" r="6" fill="#fff8d8" opacity="0.85"/>
  </g>

  <!-- Violet halo around Luma -->
  <ellipse cx="183" cy="160" rx="200" ry="80" fill="url(#i8p7p2violetGlow)" filter="url(#i8p7p2megaglow)"/>

  <!-- ===== LUMA inside pocket, holding scanner against fabric ===== -->
  <g transform="translate(160 160)">
    <!-- Body -->
    <path d="M-22,40 L-26,11 L-30,-22 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-22 L26,11 L22,40 Z" fill="url(#i8p7p2suit)"/>

    <!-- Heavy ink stains at hands -->
    <ellipse cx="-26" cy="11" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="26" cy="11" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent -->
    <line x1="0" y1="-50" x2="0" y2="30" stroke="#c8a8e8" stroke-width="0.55" opacity="0.85" filter="url(#i8p7p2bloom)"/>
    <circle cx="-9" cy="-30" r="0.85" fill="#c8a8e8" filter="url(#i8p7p2bloom)" opacity="0.85"/>
    <circle cx="9" cy="-30" r="0.85" fill="#c8a8e8" filter="url(#i8p7p2bloom)" opacity="0.85"/>
    <circle cx="0" cy="-3" r="0.85" fill="#c8a8e8" filter="url(#i8p7p2bloom)" opacity="0.85"/>

    <!-- Right arm holding scanner up against pocket fabric -->
    <path d="M22,-22 L40,-22 L44,-9 L26,-3 Z" fill="url(#i8p7p2suit)"/>
    <ellipse cx="40" cy="-22" rx="3" ry="2" fill="url(#i8p7p2skin)"/>
    <!-- Scanner device -->
    <rect x="40" y="-26" width="22" height="11" fill="#3a1858" stroke="#1a0810" stroke-width="0.55"/>
    <rect x="42" y="-24" width="18" height="7" fill="#1a0810"/>
    <!-- Scanner projection beam pointed up/out (toward pocket opening) -->
    <g filter="url(#i8p7p2bloom)" opacity="0.95">
      <path d="M55,-26 L80,-110 L66,-26 Z" fill="#a878e8" opacity="0.55"/>
    </g>
    <!-- Scanner data lines -->
    <g stroke="#c8a8e8" stroke-width="0.4" filter="url(#i8p7p2bloom)" opacity="0.85">
      <line x1="55" y1="-30" x2="80" y2="-110"/>
      <line x1="60" y1="-30" x2="78" y2="-105"/>
      <line x1="50" y1="-30" x2="76" y2="-105"/>
    </g>

    <!-- Other arm at side -->
    <path d="M-22,-22 L-30,3 L-22,11 L-14,-9 Z" fill="url(#i8p7p2suit)"/>

    <!-- Head — large in the close framing -->
    <ellipse cx="0" cy="-86" rx="22" ry="22" fill="url(#i8p7p2skin)"/>

    <!-- Long thick braid -->
    <path d="M11,-72 Q22,-30 30,40" stroke="#1a0808" stroke-width="4" fill="none"/>
    <g stroke="#a878e8" stroke-width="0.85" fill="none" filter="url(#i8p7p2bloom)" opacity="0.95">
      <path d="M11,-72 Q22,-30 30,40"/>
    </g>
    <!-- Filament pulse -->
    <ellipse cx="22" cy="-22" rx="3" ry="1.4" fill="#c8a8e8" filter="url(#i8p7p2strongglow)" opacity="0.85"/>

    <!-- Hair pulled back -->
    <path d="M-22,-100 Q0,-104 22,-100 L22,-86 Q11,-90 0,-90 Q-11,-90 -22,-86 Z" fill="#1a0808"/>

    <!-- ===== HOLOGRAPHIC LENSES — scrolling data ===== -->
    <ellipse cx="0" cy="-86" rx="32" ry="9" fill="#7848b8" filter="url(#i8p7p2strongglow)" opacity="0.55"/>
    <ellipse cx="-9" cy="-86" rx="9" ry="6" fill="none" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p7p2bloom)" opacity="0.95"/>
    <ellipse cx="-9" cy="-86" rx="6" ry="4" fill="#3a1858" opacity="0.55"/>
    <ellipse cx="9" cy="-86" rx="9" ry="6" fill="none" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p7p2bloom)" opacity="0.95"/>
    <ellipse cx="9" cy="-86" rx="6" ry="4" fill="#3a1858" opacity="0.55"/>
    <line x1="-3" y1="-86" x2="3" y2="-86" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p7p2bloom)" opacity="0.85"/>

    <!-- Data scrolling in lenses -->
    <g fill="#c8a8e8" filter="url(#i8p7p2dataPulse)" opacity="0.95">
      <text x="-15" y="-83" font-family="monospace" font-size="2.5">SCAN</text>
      <text x="3" y="-83" font-family="monospace" font-size="2.5">REF</text>
    </g>

    <!-- Eyes glowing through lenses (large, intense) -->
    <circle cx="-9" cy="-86" r="1.4" fill="#fff8e8" filter="url(#i8p7p2bloom)"/>
    <circle cx="9" cy="-86" r="1.4" fill="#fff8e8" filter="url(#i8p7p2bloom)"/>

    <!-- Brows — focused -->
    <line x1="-14" y1="-96" x2="-3" y2="-96" stroke="#3a1808" stroke-width="1.4"/>
    <line x1="3" y1="-96" x2="14" y2="-96" stroke="#3a1808" stroke-width="1.4"/>

    <!-- Nose -->
    <path d="M-2,-78 L0,-66 L3,-66 L3,-78 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth — speaking -->
    <line x1="-7" y1="-66" x2="7" y2="-66" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- ===== Geometric data overlay markers projected onto street view (above the pocket opening) ===== -->
  <g filter="url(#i8p7p2bloom)" opacity="0.95">
    <!-- Markers on street -->
    <circle cx="100" cy="50" r="3" fill="#a878e8"/>
    <circle cx="180" cy="40" r="3" fill="#a878e8"/>
    <!-- Brighter target marker (the next destination) -->
    <circle cx="240" cy="35" r="5" fill="#c8a8e8" filter="url(#i8p7p2strongglow)"/>
    <circle cx="240" cy="35" r="2" fill="#fff"/>
    <!-- Connecting trail line -->
    <path d="M100,50 L180,40 L240,35" stroke="#c8a8e8" stroke-width="0.55" fill="none" stroke-dasharray="3,2"/>
  </g>

  <!-- ===== DIALOGUE — LUMA from pocket ===== -->
  <g>
    <rect x="14" y="14" width="338" height="48" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(from pocket)</tspan></text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Left at the next corner. There's a marker on the wall —</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">I can feel the resonance already.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
  </g>
</svg>
