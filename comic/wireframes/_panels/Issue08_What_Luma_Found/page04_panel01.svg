<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 4 — Panel 1: Luma exits through the wall gap — silhouetted by amber, the world beyond is vast and warm — "Five hundred years"</title>
  <desc>35mm medium wide eye level. Wall gap. Luma exits scanner mounted at hip purpose. Warm amber gaslight from room beyond floods through gap silhouetting her. Small against gap — brickwork edges rough cliff faces, timber frame doorway built for something larger. Steps through faint blue-white perimeter markers flickering — registered friendly. World beyond gap warm vast gaslit. Determined focused forward. Suit's holographic nodes catch gaslight shifting color — sapphire bleeding amber.</desc>

  <defs>
    <linearGradient id="i8p4p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="i8p4p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="i8p4p1timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="i8p4p1amberFlood" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p4p1perimeter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c8d8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a3848" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p4p1lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7848b8"/>
      <stop offset="100%" stop-color="#1a1858"/>
    </linearGradient>
    <linearGradient id="i8p4p1lumaSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1858"/>
      <stop offset="100%" stop-color="#1a0838"/>
    </linearGradient>
    <filter id="i8p4p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p4p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p4p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p4p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p4p1bg)"/>

  <!-- ===== BRICK WALL surrounding the gap ===== -->
  <!-- Left wall (interior side) -->
  <rect x="0" y="0" width="280" height="300" fill="url(#i8p4p1brick)"/>
  <!-- Right wall (interior side) -->
  <rect x="500" y="0" width="242" height="300" fill="url(#i8p4p1brick)"/>
  <!-- Top transition -->
  <rect x="0" y="0" width="742" height="40" fill="url(#i8p4p1brick)"/>
  <!-- Bottom -->
  <rect x="0" y="270" width="742" height="30" fill="#0a0606"/>

  <!-- Brick mortar lines (left wall) -->
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.7">
    <line x1="0" y1="40" x2="280" y2="40"/>
    <line x1="0" y1="80" x2="280" y2="80"/>
    <line x1="0" y1="120" x2="280" y2="120"/>
    <line x1="0" y1="160" x2="280" y2="160"/>
    <line x1="0" y1="200" x2="280" y2="200"/>
    <line x1="0" y1="240" x2="280" y2="240"/>
    <!-- Vertical brick joints -->
    <line x1="60" y1="0" x2="60" y2="40"/>
    <line x1="120" y1="40" x2="120" y2="80"/>
    <line x1="180" y1="0" x2="180" y2="40"/>
    <line x1="40" y1="80" x2="40" y2="120"/>
    <line x1="100" y1="120" x2="100" y2="160"/>
    <line x1="160" y1="80" x2="160" y2="120"/>
    <line x1="220" y1="120" x2="220" y2="160"/>
    <line x1="80" y1="160" x2="80" y2="200"/>
    <line x1="140" y1="200" x2="140" y2="240"/>
    <line x1="200" y1="160" x2="200" y2="200"/>
    <line x1="60" y1="240" x2="60" y2="270"/>
    <line x1="180" y1="240" x2="180" y2="270"/>
  </g>
  <!-- Brick texture (left) -->
  <g fill="#5a3818" opacity="0.18">
    <rect x="20" y="20" width="22" height="11"/>
    <rect x="80" y="60" width="20" height="11"/>
    <rect x="140" y="100" width="18" height="11"/>
    <rect x="220" y="140" width="22" height="11"/>
    <rect x="40" y="180" width="20" height="11"/>
    <rect x="120" y="220" width="22" height="11"/>
  </g>

  <!-- Mortar (right wall) -->
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.7">
    <line x1="500" y1="40" x2="742" y2="40"/>
    <line x1="500" y1="80" x2="742" y2="80"/>
    <line x1="500" y1="120" x2="742" y2="120"/>
    <line x1="500" y1="160" x2="742" y2="160"/>
    <line x1="500" y1="200" x2="742" y2="200"/>
    <line x1="500" y1="240" x2="742" y2="240"/>
    <line x1="560" y1="0" x2="560" y2="40"/>
    <line x1="640" y1="0" x2="640" y2="40"/>
    <line x1="540" y1="40" x2="540" y2="80"/>
    <line x1="620" y1="80" x2="620" y2="120"/>
    <line x1="700" y1="40" x2="700" y2="80"/>
    <line x1="580" y1="120" x2="580" y2="160"/>
    <line x1="660" y1="160" x2="660" y2="200"/>
    <line x1="600" y1="200" x2="600" y2="240"/>
    <line x1="680" y1="240" x2="680" y2="270"/>
  </g>

  <!-- ===== THE GAP — center, opening to amber-flooded room ===== -->
  <!-- Gap base outline -->
  <path d="M280,40 L280,270 L500,270 L500,40 Z" fill="#040408"/>

  <!-- Amber flood from beyond -->
  <ellipse cx="390" cy="155" rx="220" ry="200" fill="url(#i8p4p1amberFlood)" filter="url(#i8p4p1megaglow)"/>

  <!-- Rough broken brick edges of the gap -->
  <path d="M280,40 L280,270 L290,265 L284,180 L294,170 L286,80 Z" fill="#1a1208" opacity="0.95"/>
  <path d="M500,40 L500,270 L490,265 L496,180 L486,170 L494,80 Z" fill="#1a1208" opacity="0.95"/>
  <!-- Top edge of gap -->
  <path d="M280,40 L500,40 L495,55 L286,55 Z" fill="#1a1208" opacity="0.85"/>
  <!-- Bottom edge of gap -->
  <path d="M280,270 L500,270 L495,260 L286,260 Z" fill="#1a1208" opacity="0.85"/>

  <!-- Timber frame around gap (the doorway) -->
  <rect x="270" y="40" width="14" height="230" fill="url(#i8p4p1timber)"/>
  <rect x="496" y="40" width="14" height="230" fill="url(#i8p4p1timber)"/>
  <rect x="270" y="40" width="240" height="11" fill="url(#i8p4p1timber)"/>
  <line x1="270" y1="40" x2="284" y2="40" stroke="#3a2010" stroke-width="0.55"/>

  <!-- Beyond the gap — Victorian room (vast space) -->
  <g opacity="0.7">
    <!-- Furniture leg silhouettes (chair leg as column) -->
    <rect x="320" y="60" width="14" height="180" fill="#5a3818" opacity="0.7"/>
    <rect x="450" y="80" width="11" height="160" fill="#5a3818" opacity="0.55"/>
    <!-- Table edge (distant ceiling) -->
    <rect x="290" y="60" width="200" height="14" fill="#7a5028" opacity="0.55"/>
    <!-- Floor pattern hint -->
    <line x1="290" y1="220" x2="490" y2="220" stroke="#a86838" stroke-width="0.55" opacity="0.55"/>
    <line x1="290" y1="240" x2="490" y2="240" stroke="#a86838" stroke-width="0.55" opacity="0.55"/>
  </g>

  <!-- Distant gas lamp glow (the source of the amber flood) -->
  <g filter="url(#i8p4p1strongglow)" opacity="0.95">
    <circle cx="420" cy="140" r="22" fill="#fff8d8"/>
  </g>
  <circle cx="420" cy="140" r="9" fill="#fff" filter="url(#i8p4p1bloom)" opacity="0.95"/>

  <!-- ===== PERIMETER MARKERS at the gap edges (flicking) ===== -->
  <g filter="url(#i8p4p1bloom)" opacity="0.85">
    <!-- Left marker pylon -->
    <line x1="290" y1="270" x2="290" y2="240" stroke="#a8c8d8" stroke-width="1.4"/>
    <circle cx="290" cy="240" r="3" fill="#a8c8d8" filter="url(#i8p4p1strongglow)"/>
    <!-- Right marker -->
    <line x1="490" y1="270" x2="490" y2="240" stroke="#a8c8d8" stroke-width="1.4"/>
    <circle cx="490" cy="240" r="3" fill="#a8c8d8" filter="url(#i8p4p1strongglow)"/>
  </g>
  <!-- Marker glow flickering (registered friendly) -->
  <g filter="url(#i8p4p1glow)" opacity="0.7">
    <ellipse cx="390" cy="240" rx="120" ry="6" fill="#a8c8d8"/>
  </g>
  <g stroke="#fff" stroke-width="0.4" fill="none" opacity="0.85" filter="url(#i8p4p1bloom)">
    <line x1="290" y1="240" x2="490" y2="240" stroke-dasharray="2,1.5"/>
  </g>

  <!-- ===== LUMA — silhouetted exit, mid-step ===== -->
  <g transform="translate(390 200)">
    <!-- Body (silhouetted, but suit nodes catch amber and shift color) -->
    <path d="M-22,80 L-26,40 L-30,11 L-26,-22 L-18,-50 L-9,-66 L9,-66 L18,-50 L26,-22 L30,11 L26,40 L22,80 Z" fill="url(#i8p4p1lumaSilhouette)"/>

    <!-- Backlight rim (amber on left edge) -->
    <path d="M-22,80 L-26,40 L-30,11 L-26,-22 L-18,-50 L-9,-66 L-9,-50 L-18,-22 L-22,11 L-22,80 Z" fill="#3a1858" opacity="0.85"/>
    <!-- Right edge backlit hot -->
    <path d="M9,-66 L18,-50 L26,-22 L30,11 L26,40 L22,80 L22,40 L18,11 L11,-22 L9,-50 Z" fill="#7848b8" opacity="0.85"/>

    <!-- ===== Suit holographic nodes — sapphire bleeding amber ===== -->
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#c8a8e8" stroke-width="0.55" opacity="0.85" filter="url(#i8p4p1bloom)"/>
    <!-- Each node halfway between violet and amber -->
    <circle cx="-9" cy="-30" r="2" fill="#a878e8" filter="url(#i8p4p1bloom)" opacity="0.85"/>
    <circle cx="-9" cy="-30" r="1.4" fill="#ffd898" filter="url(#i8p4p1bloom)" opacity="0.7"/>
    <circle cx="9" cy="-30" r="2" fill="#a878e8" filter="url(#i8p4p1bloom)" opacity="0.85"/>
    <circle cx="9" cy="-30" r="1.4" fill="#ffd898" filter="url(#i8p4p1bloom)" opacity="0.7"/>
    <circle cx="0" cy="3" r="2" fill="#a878e8" filter="url(#i8p4p1bloom)" opacity="0.85"/>
    <circle cx="0" cy="3" r="1.4" fill="#ffd898" filter="url(#i8p4p1bloom)" opacity="0.7"/>
    <circle cx="-18" cy="22" r="1.4" fill="#a878e8" filter="url(#i8p4p1bloom)" opacity="0.7"/>
    <circle cx="18" cy="22" r="1.4" fill="#a878e8" filter="url(#i8p4p1bloom)" opacity="0.7"/>

    <!-- Hip-mounted scanner -->
    <rect x="11" y="0" width="9" height="14" fill="#3a1858"/>
    <ellipse cx="15" cy="3" rx="3" ry="0.85" fill="#a878e8" filter="url(#i8p4p1bloom)" opacity="0.95"/>

    <!-- Mid-step: legs in walking pose -->
    <path d="M-9,80 L-14,140 L-3,140 L0,80 Z" fill="url(#i8p4p1lumaSilhouette)"/>
    <path d="M3,80 L9,140 L18,140 L14,80 Z" fill="url(#i8p4p1lumaSilhouette)"/>

    <!-- Arms (one forward in stride, one back) -->
    <path d="M-26,-22 L-36,3 L-22,18 L-14,0 Z" fill="url(#i8p4p1lumaSilhouette)"/>
    <path d="M26,-22 L36,11 L22,22 L14,3 Z" fill="url(#i8p4p1lumaSilhouette)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-86" rx="14" ry="14" fill="url(#i8p4p1lumaSilhouette)"/>

    <!-- Long thick BRAID (silhouetted, with filament glow) -->
    <path d="M9,-72 Q22,-30 30,40 Q35,80 40,140" stroke="#1a0808" stroke-width="4" fill="none"/>
    <g stroke="#a878e8" stroke-width="0.7" fill="none" filter="url(#i8p4p1bloom)" opacity="0.95">
      <path d="M9,-72 Q22,-30 30,40 Q35,80 40,140"/>
    </g>
    <!-- Filament pulses -->
    <ellipse cx="22" cy="-22" rx="3" ry="1" fill="#c8a8e8" filter="url(#i8p4p1bloom)" opacity="0.85"/>
    <ellipse cx="30" cy="22" rx="3" ry="1" fill="#c8a8e8" filter="url(#i8p4p1bloom)" opacity="0.85"/>

    <!-- Hair pulled back (silhouette) -->
    <path d="M-14,-100 Q0,-104 14,-100 L14,-86 Q0,-90 -14,-86 Z" fill="#0a0408"/>

    <!-- ===== HOLOGRAPHIC LENSES PUSHED UP above eyes ===== -->
    <ellipse cx="0" cy="-100" rx="9" ry="3" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p4p1bloom)" opacity="0.7"/>
    <line x1="-3" y1="-100" x2="3" y2="-100" stroke="#a878e8" stroke-width="0.4" filter="url(#i8p4p1bloom)" opacity="0.7"/>

    <!-- Eyes — focused forward (the look is forward, into amber) -->
    <ellipse cx="-3" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="-3" cy="-86" r="0.55" fill="#3a1808"/>
    <ellipse cx="3" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="3" cy="-86" r="0.55" fill="#3a1808"/>
    <!-- Catchlight amber (looking into amber) -->
    <circle cx="-3" cy="-87" r="0.4" fill="#ffd898" filter="url(#i8p4p1bloom)" opacity="0.85"/>
    <circle cx="3" cy="-87" r="0.4" fill="#ffd898" filter="url(#i8p4p1bloom)" opacity="0.85"/>

    <!-- Brows determined -->
    <line x1="-7" y1="-91" x2="-1" y2="-91" stroke="#0a0408" stroke-width="0.85"/>
    <line x1="1" y1="-91" x2="7" y2="-91" stroke="#0a0408" stroke-width="0.85"/>

    <!-- Mouth — barely audible whisper -->
    <line x1="-3" y1="-78" x2="3" y2="-78" stroke="#0a0408" stroke-width="0.55"/>
  </g>

  <!-- ===== DIALOGUE — LUMA whispers to herself ===== -->
  <g>
    <rect x="14" y="14" width="220" height="48" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(to herself)</tspan></text>
  <text x="22" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1410" font-style="italic" font-weight="700">Five hundred years.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
