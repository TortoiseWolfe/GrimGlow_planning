<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 16 — Panel 2: Thresh's face — devastation through tenderness — eyes wet, mouth open, weapon lowered, the moment the armor breaks</title>
  <desc>85mm close-up. Pale skin, defined cheekbones, copper-red buzz cut, intense eyes — but intensity has shifted. Eyes wet. Mouth slightly open. Weapon lowered out of focus at frame's bottom edge. Looking at child's extended hand off-panel — expression not fear, not combat readiness, not controlled tension of soldier on watch. Raw unguarded face of someone undone by gentleness. Armor — physical and emotional — has crack combat couldn't make. Warm reflected amber light illuminates face, gaslight and child's proximity making features warm and soft for first time in series. Crimson nodes pulse unevenly — biometric disruption, suit reading emotional state. Wetness in eyes catches warm light.</desc>

  <defs>
    <linearGradient id="i8p16p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p16p2warmAmber" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p16p2skinWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#c89868"/>
    </linearGradient>
    <linearGradient id="i8p16p2armor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <filter id="i8p16p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p16p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p16p2strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p16p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p16p2bg)"/>

  <!-- Warm reflected amber bath from right (the child's proximity) -->
  <ellipse cx="366" cy="120" rx="320" ry="240" fill="url(#i8p16p2warmAmber)" filter="url(#i8p16p2megaglow)"/>

  <!-- ===== THRESH'S FACE close-up — UNGUARDED, devastated by tenderness ===== -->
  <g transform="translate(183 150)">
    <!-- Suit collar — crimson armor at bottom of frame -->
    <path d="M-80,140 L-50,80 L-30,60 L30,60 L50,80 L80,140 L100,200 L-100,200 Z" fill="url(#i8p16p2armor)"/>
    <!-- Heavy dents -->
    <ellipse cx="-30" cy="80" rx="11" ry="7" fill="#5a1410"/>
    <ellipse cx="30" cy="80" rx="11" ry="7" fill="#7a1810"/>
    <!-- Long chest scratch -->
    <path d="M-30,120 L30,120" stroke="#3a0a0a" stroke-width="3" opacity="0.85"/>

    <!-- ===== Crimson nodes pulsing UNEVENLY (biometric disruption) ===== -->
    <line x1="0" y1="80" x2="0" y2="180" stroke="#ffa898" stroke-width="0.85" opacity="0.85" filter="url(#i8p16p2bloom)"/>
    <circle cx="-22" cy="80" r="2" fill="#ff8868" filter="url(#i8p16p2strongglow)" opacity="0.95"/>
    <circle cx="22" cy="80" r="1.4" fill="#a82818" filter="url(#i8p16p2bloom)" opacity="0.55"/>
    <circle cx="0" cy="120" r="2" fill="#ff8868" filter="url(#i8p16p2strongglow)" opacity="0.7"/>

    <!-- Neck — warmly lit -->
    <path d="M-9,60 L9,60 L9,40 L-9,40 Z" fill="url(#i8p16p2skinWarm)"/>

    <!-- Jaw — softer than usual (the warmth) -->
    <path d="M-30,18 L-36,30 L-22,52 L0,60 L22,52 L36,30 L30,18 L18,0 L-18,0 Z" fill="url(#i8p16p2skinWarm)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="36" ry="36" fill="url(#i8p16p2skinWarm)"/>

    <!-- Copper-red buzz cut — warm catch -->
    <path d="M-36,-58 Q0,-66 36,-58 L36,-30 Q18,-44 0,-44 Q-18,-44 -36,-30 Z" fill="#a83820"/>
    <line x1="-30" y1="-58" x2="-9" y2="-58" stroke="#5a1810" stroke-width="0.55"/>
    <line x1="0" y1="-62" x2="22" y2="-62" stroke="#5a1810" stroke-width="0.55"/>
    <ellipse cx="0" cy="-66" rx="32" ry="3" fill="#ffd898" filter="url(#i8p16p2bloom)" opacity="0.85"/>

    <!-- Defined cheekbone (softer) -->
    <path d="M-22,3 Q-30,-9 -22,-22" stroke="#a87838" stroke-width="0.85" fill="none" opacity="0.55"/>
    <path d="M22,3 Q30,-9 22,-22" stroke="#a87838" stroke-width="0.85" fill="none" opacity="0.55"/>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-32" rx="36" ry="6" fill="#5a3018" opacity="0.4"/>

    <!-- Brows — slightly drawn (devastation) -->
    <line x1="-30" y1="-30" x2="-9" y2="-32" stroke="#3a1808" stroke-width="2"/>
    <line x1="9" y1="-32" x2="30" y2="-30" stroke="#3a1808" stroke-width="2"/>

    <!-- ===== EYES WET (the tenderness, the moment of breaking) ===== -->
    <ellipse cx="-14" cy="-22" rx="9" ry="6" fill="#fff8e8"/>
    <ellipse cx="-14" cy="-22" rx="4" ry="3" fill="#3a2818"/>
    <circle cx="-14" cy="-22" r="2" fill="#0a0408"/>
    <ellipse cx="14" cy="-22" rx="9" ry="6" fill="#fff8e8"/>
    <ellipse cx="14" cy="-22" rx="4" ry="3" fill="#3a2818"/>
    <circle cx="14" cy="-22" r="2" fill="#0a0408"/>

    <!-- Catchlights — WARM amber (from gaslight + child) -->
    <circle cx="-12" cy="-24" r="2" fill="#fff8d8" filter="url(#i8p16p2bloom)" opacity="0.95"/>
    <circle cx="16" cy="-24" r="2" fill="#fff8d8" filter="url(#i8p16p2bloom)" opacity="0.95"/>

    <!-- ===== TEAR GLISTEN — wetness catching the warm light ===== -->
    <path d="M-22,-15 L-18,-9" stroke="#fff" stroke-width="0.7" filter="url(#i8p16p2bloom)" opacity="0.85"/>
    <path d="M-7,-15 L-3,-9" stroke="#fff" stroke-width="0.55" filter="url(#i8p16p2bloom)" opacity="0.7"/>
    <path d="M22,-15 L18,-9" stroke="#fff" stroke-width="0.7" filter="url(#i8p16p2bloom)" opacity="0.85"/>
    <!-- Lower lid moisture -->
    <line x1="-22" y1="-15" x2="-7" y2="-15" stroke="#fff" stroke-width="0.4" filter="url(#i8p16p2bloom)" opacity="0.55"/>
    <line x1="7" y1="-15" x2="22" y2="-15" stroke="#fff" stroke-width="0.4" filter="url(#i8p16p2bloom)" opacity="0.55"/>

    <!-- Lashes -->
    <g stroke="#1a0808" stroke-width="0.85" fill="none">
      <line x1="-22" y1="-30" x2="-22" y2="-34"/>
      <line x1="-14" y1="-30" x2="-14" y2="-35"/>
      <line x1="-7" y1="-30" x2="-7" y2="-34"/>
      <line x1="7" y1="-30" x2="7" y2="-34"/>
      <line x1="14" y1="-30" x2="14" y2="-35"/>
      <line x1="22" y1="-30" x2="22" y2="-34"/>
    </g>

    <!-- Nose -->
    <path d="M-3,-15 L0,5 L3,5 L3,-15 Z" fill="#7a4818" opacity="0.55"/>
    <line x1="-2" y1="5" x2="2" y2="5" stroke="#3a1808" stroke-width="0.55"/>

    <!-- ===== MOUTH SLIGHTLY OPEN ===== -->
    <ellipse cx="0" cy="22" rx="9" ry="3" fill="#3a1808"/>
    <line x1="-9" y1="22" x2="9" y2="22" stroke="#1a0606" stroke-width="0.55"/>
    <!-- Subtle parting — the tiny intake of breath -->
    <line x1="-3" y1="20" x2="3" y2="20" stroke="#fff8e8" stroke-width="0.4" opacity="0.55"/>

    <!-- Cheek warmth (the warm reflected light is on her face) -->
    <ellipse cx="-22" cy="0" rx="6" ry="11" fill="#e88868" opacity="0.18"/>
    <ellipse cx="22" cy="0" rx="6" ry="11" fill="#e88868" opacity="0.18"/>
  </g>

  <!-- Weapon lowered, OUT OF FOCUS at bottom edge -->
  <g transform="translate(183 280)" opacity="0.4">
    <rect x="-100" y="-3" width="200" height="6" fill="#0a0408" filter="url(#i8p16p2bloom)"/>
    <ellipse cx="0" cy="0" rx="22" ry="0.85" fill="#a82818" filter="url(#i8p16p2glow)" opacity="0.55"/>
  </g>

  <!-- (No dialogue — the silence IS the moment) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
