<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 280" width="366" height="280">
  <title>Issue 8 — Page 3 — Panel 1: Sable's hand on Luma's shoulder — the briefing too specific — flicker of guilt quickly suppressed</title>
  <desc>50mm medium shot. Sable and Luma in close conversation on timber beam. Sable hand on Luma's shoulder — command gesture also protective. Sable lit fading blue-violet from left, warm gaslight right. Flicker of guilt across eyes quickly suppressed. Luma attentive, lenses dimming, professional. Heavy wear suits — Sable silver scuffed at shoulder where hand rests, Luma sapphire-violet dusty and ink-stained. Timber camp behind, cobwebs and gear.</desc>

  <defs>
    <linearGradient id="i8p3p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="i8p3p1timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="i8p3p1amber" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p3p1violet" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7848b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p3p1sableSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </linearGradient>
    <linearGradient id="i8p3p1lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p3p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <linearGradient id="i8p3p1skinDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <filter id="i8p3p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p3p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p3p1megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="280" fill="url(#i8p3p1bg)"/>

  <!-- Fading blue-violet from left (display powering down) -->
  <ellipse cx="0" cy="160" rx="180" ry="200" fill="url(#i8p3p1violet)" filter="url(#i8p3p1megaglow)"/>
  <!-- Warm gaslight growing dominant from right -->
  <ellipse cx="366" cy="160" rx="200" ry="220" fill="url(#i8p3p1amber)" filter="url(#i8p3p1megaglow)"/>

  <!-- Timber beam they stand on -->
  <rect x="0" y="240" width="366" height="40" fill="url(#i8p3p1timber)"/>
  <line x1="0" y1="240" x2="366" y2="240" stroke="#5a3818" stroke-width="0.55" filter="url(#i8p3p1bloom)" opacity="0.7"/>
  <!-- Wood grain -->
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="255" x2="366" y2="255"/>
    <line x1="0" y1="270" x2="366" y2="270"/>
  </g>

  <!-- Cobweb hint upper-left -->
  <g stroke="#5a5050" stroke-width="0.4" fill="none" opacity="0.4">
    <line x1="0" y1="40" x2="50" y2="0"/>
    <line x1="20" y1="40" x2="50" y2="20"/>
    <line x1="0" y1="40" x2="50" y2="20"/>
  </g>

  <!-- ===== SABLE — left, hand on Luma's shoulder ===== -->
  <g transform="translate(120 200)">
    <!-- Body — open posture, one arm extended toward Luma -->
    <path d="M-30,40 L-36,-3 L-40,-50 L-30,-80 L-18,-100 L-3,-110 L9,-110 L22,-100 L30,-80 L40,-50 L36,-3 L30,40 Z" fill="url(#i8p3p1sableSuit)"/>

    <!-- Heavy soot streaks -->
    <ellipse cx="-22" cy="-30" rx="11" ry="6" fill="#1a1818" opacity="0.85"/>
    <ellipse cx="22" cy="-9" rx="9" ry="4" fill="#1a1818" opacity="0.7"/>
    <!-- Patched tear -->
    <rect x="-9" y="11" width="14" height="4" fill="#5a4838" opacity="0.85"/>
    <line x1="-9" y1="11" x2="5" y2="14" stroke="#1a1818" stroke-width="0.4"/>

    <!-- Tension wear crease -->
    <line x1="-22" y1="-94" x2="22" y2="-94" stroke="#1a1a20" stroke-width="0.85" opacity="0.85"/>

    <!-- Suit accent -->
    <line x1="0" y1="-94" x2="0" y2="40" stroke="#fff" stroke-width="0.55" opacity="0.55" filter="url(#i8p3p1bloom)"/>

    <!-- ARM extended right, hand on shoulder -->
    <path d="M30,-50 L70,-32 L80,-22 L40,-30 Z" fill="url(#i8p3p1sableSuit)"/>
    <!-- HAND on Luma's shoulder -->
    <ellipse cx="90" cy="-26" rx="9" ry="6" fill="url(#i8p3p1skinDark)"/>
    <!-- Fingers -->
    <line x1="86" y1="-22" x2="92" y2="-18" stroke="#3a2010" stroke-width="0.7"/>
    <line x1="90" y1="-22" x2="96" y2="-20" stroke="#3a2010" stroke-width="0.7"/>
    <line x1="94" y1="-22" x2="100" y2="-20" stroke="#3a2010" stroke-width="0.7"/>

    <!-- Other arm at side -->
    <path d="M-40,-50 L-44,-3 L-30,11 L-18,-22 Z" fill="url(#i8p3p1sableSuit)"/>

    <!-- Head — partly turned toward Luma -->
    <ellipse cx="3" cy="-128" rx="14" ry="16" fill="url(#i8p3p1skinDark)"/>
    <!-- Silver-white cropped hair -->
    <path d="M-11,-142 Q3,-148 14,-142 L14,-128 Q3,-132 -11,-128 Z" fill="#e8ecf0" opacity="0.95"/>
    <line x1="-7" y1="-142" x2="7" y2="-142" stroke="#fff" stroke-width="0.4" filter="url(#i8p3p1bloom)" opacity="0.55"/>

    <!-- Brow shadow — split warm/cool -->
    <ellipse cx="3" cy="-130" rx="14" ry="3" fill="#1a1018" opacity="0.55"/>

    <!-- ===== EYES — flicker of guilt quickly suppressed ===== -->
    <ellipse cx="-3" cy="-128" rx="3" ry="2" fill="#fff8e8"/>
    <ellipse cx="-3" cy="-128" rx="1.4" ry="1" fill="#3a2818"/>
    <circle cx="-3" cy="-128" r="0.55" fill="#0a0408"/>
    <ellipse cx="9" cy="-128" rx="3" ry="2" fill="#fff8e8"/>
    <ellipse cx="9" cy="-128" rx="1.4" ry="1" fill="#3a2818"/>
    <circle cx="9" cy="-128" r="0.55" fill="#0a0408"/>

    <!-- Catchlight (split) -->
    <circle cx="-3" cy="-129" r="0.55" fill="#a878e8" filter="url(#i8p3p1bloom)" opacity="0.85"/>
    <circle cx="11" cy="-129" r="0.55" fill="#ffd898" filter="url(#i8p3p1bloom)" opacity="0.85"/>

    <!-- Slight asymmetry — the suppressed tell — one brow microexpression different -->
    <line x1="-9" y1="-134" x2="-1" y2="-134" stroke="#1a0808" stroke-width="1.4"/>
    <line x1="3" y1="-134" x2="14" y2="-133" stroke="#1a0808" stroke-width="1.4"/>

    <!-- Nose -->
    <path d="M0,-122 L2,-114 L5,-114 L5,-122 Z" fill="#3a1808" opacity="0.55"/>

    <!-- Mouth — speaking, deliberate -->
    <line x1="-3" y1="-110" x2="9" y2="-110" stroke="#1a0808" stroke-width="1.4"/>

    <!-- Cheekbone shadow -->
    <ellipse cx="-7" cy="-118" rx="3" ry="6" fill="#1a1018" opacity="0.55"/>
    <ellipse cx="14" cy="-118" rx="3" ry="6" fill="#3a2818" opacity="0.4"/>

    <!-- Legs -->
    <path d="M-22,40 L-26,80 L-14,80 L-9,40 Z" fill="url(#i8p3p1sableSuit)"/>
    <path d="M3,40 L0,80 L14,80 L18,40 Z" fill="url(#i8p3p1sableSuit)"/>
  </g>

  <!-- ===== LUMA — right, attentive ===== -->
  <g transform="translate(250 200)">
    <!-- Body -->
    <path d="M-22,40 L-26,-3 L-30,-50 L-22,-80 L-9,-100 L9,-100 L18,-80 L26,-50 L22,-3 L18,40 Z" fill="url(#i8p3p1lumaSuit)"/>

    <!-- Heavy ink stains at hands -->
    <ellipse cx="-26" cy="11" rx="6" ry="4" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="22" cy="11" rx="6" ry="4" fill="#1a0810" opacity="0.95"/>
    <!-- Dust on shoulder where Sable's hand rests (the contact mark) -->
    <ellipse cx="-22" cy="-44" rx="11" ry="5" fill="#5a4838" opacity="0.7"/>

    <!-- Suit accent (dimming with display) -->
    <line x1="0" y1="-80" x2="0" y2="30" stroke="#c8a8e8" stroke-width="0.55" opacity="0.7" filter="url(#i8p3p1bloom)"/>
    <circle cx="-9" cy="-30" r="1" fill="#c8a8e8" filter="url(#i8p3p1bloom)" opacity="0.7"/>
    <circle cx="9" cy="-30" r="1" fill="#c8a8e8" filter="url(#i8p3p1bloom)" opacity="0.7"/>

    <!-- Arms at sides -->
    <path d="M-30,-50 L-32,-3 L-22,11 L-14,-22 Z" fill="url(#i8p3p1lumaSuit)"/>
    <path d="M26,-50 L30,-3 L18,11 L11,-22 Z" fill="url(#i8p3p1lumaSuit)"/>

    <!-- Head — turned toward Sable (LEFT) -->
    <ellipse cx="-3" cy="-118" rx="14" ry="16" fill="url(#i8p3p1skin)"/>
    <!-- Long thick braid -->
    <path d="M3,-105 Q14,-66 22,11" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <path d="M3,-105 Q14,-66 22,11" stroke="#a878e8" stroke-width="0.55" fill="none" filter="url(#i8p3p1bloom)" opacity="0.85"/>
    <!-- Filament pulses (still active) -->
    <ellipse cx="11" cy="-66" rx="3" ry="0.85" fill="#c8a8e8" filter="url(#i8p3p1bloom)" opacity="0.85"/>
    <ellipse cx="18" cy="-22" rx="3" ry="0.85" fill="#c8a8e8" filter="url(#i8p3p1bloom)" opacity="0.7"/>
    <!-- Hair pulled back -->
    <path d="M-14,-130 Q-3,-138 9,-130 L9,-118 Q-3,-122 -14,-118 Z" fill="#1a0808"/>

    <!-- ===== HOLOGRAPHIC LENSES — DIMMING (display powering down) ===== -->
    <ellipse cx="-7" cy="-118" rx="4" ry="3" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p3p1bloom)" opacity="0.55"/>
    <ellipse cx="3" cy="-118" rx="4" ry="3" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p3p1bloom)" opacity="0.55"/>
    <line x1="-3" y1="-118" x2="-1" y2="-118" stroke="#a878e8" stroke-width="0.4" filter="url(#i8p3p1bloom)" opacity="0.55"/>

    <!-- Eyes — attentive, professional -->
    <ellipse cx="-7" cy="-118" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-7" cy="-118" r="0.85" fill="#3a1808"/>
    <ellipse cx="3" cy="-118" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="3" cy="-118" r="0.85" fill="#3a1808"/>

    <!-- Brows — focused, mid-question -->
    <line x1="-11" y1="-124" x2="-3" y2="-124" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="-1" y1="-124" x2="7" y2="-124" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Mouth — speaking -->
    <line x1="-7" y1="-105" x2="3" y2="-105" stroke="#3a1808" stroke-width="0.7"/>

    <!-- Legs -->
    <path d="M-14,40 L-18,80 L-7,80 L-3,40 Z" fill="url(#i8p3p1lumaSuit)"/>
    <path d="M3,40 L7,80 L18,80 L18,40 Z" fill="url(#i8p3p1lumaSuit)"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- SABLE -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">If there's a sealed lower level — foundation-era,</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">pre-church — that is where you'll find it. Focus there.</text>

  <!-- LUMA -->
  <g>
    <rect x="80" y="74" width="270" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="88" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="88" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">How do you know there's a—</text>

  <!-- SABLE 2 — clipped, deflective -->
  <g>
    <rect x="14" y="118" width="320" height="36" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="148" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I do not. I am extrapolating from your data. Go.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,250 Q90,252 180,248 Q270,246 366,250"/>
  </g>
</svg>
