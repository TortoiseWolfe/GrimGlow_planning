<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 8 — Page 20 — Panel 4: Luma sits beside the core in grey dawn — quiet devastation resolved into calm — "Stay" — the morning after revelation</title>
  <desc>85mm slight high angle. Luma sits on timber beam beside dead data core, scanner dark, holographic lenses inactive. Lit by grey dawn light from wall gap — cool, flat, even illumination revealing dust and ink stains on sapphire-violet suit, fatigue lines around eyes, luminous filament in braid dimmed to near-dark. Expression quiet devastation resolved into something that looks like calm — but eyes carry the question. Dead data core lies beside her — dark, cracked, a relic. Grey light treats them equally — living woman and dead technology, both still. The morning after revelation.</desc>

  <defs>
    <linearGradient id="i8p20p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3838"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <linearGradient id="i8p20p4timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="i8p20p4greyDawn" cx="100%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a8b8c8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a4858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p20p4lumaSuitDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7848b8"/>
      <stop offset="100%" stop-color="#2a1858"/>
    </linearGradient>
    <linearGradient id="i8p20p4deadCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i8p20p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <filter id="i8p20p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p20p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p20p4megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="320" fill="url(#i8p20p4bg)"/>

  <!-- Grey dawn light from upper right -->
  <ellipse cx="600" cy="0" rx="500" ry="240" fill="url(#i8p20p4greyDawn)" filter="url(#i8p20p4megaglow)"/>

  <!-- Timber beam Luma sits on -->
  <rect x="0" y="220" width="742" height="11" fill="url(#i8p20p4timber)"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#5a3818" stroke-width="0.55" filter="url(#i8p20p4bloom)" opacity="0.55"/>
  <!-- Wood grain -->
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="226" x2="742" y2="226"/>
  </g>
  <!-- Floor below -->
  <rect x="0" y="231" width="742" height="89" fill="#0a0606"/>

  <!-- Background timber wall -->
  <rect x="0" y="0" width="742" height="220" fill="#2a2030"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.55">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="60"/>
    <line x1="380" y1="60" x2="380" y2="120"/>
    <line x1="540" y1="120" x2="540" y2="180"/>
    <line x1="640" y1="0" x2="640" y2="60"/>
  </g>

  <!-- Dust motes in cool grey dawn light -->
  <g fill="#a8b8c8" opacity="0.55" filter="url(#i8p20p4bloom)">
    <circle cx="200" cy="80" r="0.55"/>
    <circle cx="400" cy="60" r="0.4"/>
    <circle cx="500" cy="140" r="0.55"/>
    <circle cx="600" cy="100" r="0.4"/>
  </g>

  <!-- ===== LUMA — sits on beam beside core ===== -->
  <g transform="translate(280 200)">
    <!-- Body — seated, relaxed but tired -->
    <path d="M-22,22 L-26,3 L-30,-22 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-22 L26,3 L22,22 Z" fill="url(#i8p20p4lumaSuitDim)"/>
    <!-- Heavy ink stains and dust -->
    <ellipse cx="-26" cy="0" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="26" cy="0" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="-15" cy="-30" rx="9" ry="3" fill="#3a2010" opacity="0.7"/>
    <ellipse cx="15" cy="-30" rx="9" ry="3" fill="#3a2010" opacity="0.7"/>
    <!-- Soot bloom on suit -->
    <ellipse cx="-7" cy="-9" rx="11" ry="6" fill="#1a0810" opacity="0.55"/>

    <!-- Suit accent (DIMMED — fatigue) -->
    <line x1="0" y1="-50" x2="0" y2="14" stroke="#a878e8" stroke-width="0.55" opacity="0.4" filter="url(#i8p20p4bloom)"/>
    <circle cx="-9" cy="-30" r="0.7" fill="#a878e8" filter="url(#i8p20p4bloom)" opacity="0.4"/>
    <circle cx="9" cy="-30" r="0.7" fill="#a878e8" filter="url(#i8p20p4bloom)" opacity="0.4"/>

    <!-- Arms — at sides, hands resting on knees -->
    <path d="M-30,-22 L-36,3 L-30,11 L-22,-3 Z" fill="url(#i8p20p4lumaSuitDim)"/>
    <path d="M30,-22 L36,3 L30,11 L22,-3 Z" fill="url(#i8p20p4lumaSuitDim)"/>
    <!-- Hands resting -->
    <ellipse cx="-30" cy="11" rx="4" ry="3" fill="url(#i8p20p4skin)"/>
    <ellipse cx="30" cy="11" rx="4" ry="3" fill="url(#i8p20p4skin)"/>

    <!-- Knees (sitting) -->
    <ellipse cx="-14" cy="22" rx="9" ry="4" fill="url(#i8p20p4lumaSuitDim)"/>
    <ellipse cx="14" cy="22" rx="9" ry="4" fill="url(#i8p20p4lumaSuitDim)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-86" rx="14" ry="16" fill="url(#i8p20p4skin)"/>

    <!-- Long thick BRAID — filament DIMMED to near-dark -->
    <path d="M11,-72 Q22,-30 30,18" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <!-- Filament barely glowing -->
    <g stroke="#7848b8" stroke-width="0.4" fill="none" opacity="0.4">
      <path d="M11,-72 Q22,-30 30,18"/>
    </g>

    <!-- Hair pulled back -->
    <path d="M-14,-100 Q0,-104 14,-100 L14,-86 Q0,-90 -14,-86 Z" fill="#1a0808"/>

    <!-- ===== HOLOGRAPHIC LENSES INACTIVE — dark, no scrolling ===== -->
    <ellipse cx="-7" cy="-86" rx="6" ry="4" fill="none" stroke="#3a1858" stroke-width="0.55" opacity="0.55"/>
    <ellipse cx="-7" cy="-86" rx="4" ry="3" fill="#1a0828" opacity="0.55"/>
    <ellipse cx="7" cy="-86" rx="6" ry="4" fill="none" stroke="#3a1858" stroke-width="0.55" opacity="0.55"/>
    <ellipse cx="7" cy="-86" rx="4" ry="3" fill="#1a0828" opacity="0.55"/>

    <!-- ===== FATIGUE LINES around eyes ===== -->
    <line x1="-15" y1="-92" x2="-9" y2="-94" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>
    <line x1="-13" y1="-79" x2="-3" y2="-81" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>
    <line x1="9" y1="-94" x2="15" y2="-92" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>
    <line x1="3" y1="-81" x2="13" y2="-79" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>

    <!-- Brows — relaxed but heavy -->
    <line x1="-14" y1="-95" x2="-3" y2="-95" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="3" y1="-95" x2="14" y2="-95" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Eyes — open but unfocused, the question living behind them -->
    <ellipse cx="-7" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="-7" cy="-86" r="0.7" fill="#3a1808"/>
    <ellipse cx="7" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="7" cy="-86" r="0.7" fill="#3a1808"/>
    <!-- Cool grey catchlight (just dawn light, no warm) -->
    <circle cx="-5" cy="-87" r="0.4" fill="#a8b8c8" filter="url(#i8p20p4bloom)" opacity="0.85"/>
    <circle cx="9" cy="-87" r="0.4" fill="#a8b8c8" filter="url(#i8p20p4bloom)" opacity="0.85"/>

    <!-- Nose -->
    <path d="M-2,-78 L0,-66 L3,-66 L3,-78 Z" fill="#5a3018" opacity="0.55"/>

    <!-- Mouth — flat, calm -->
    <line x1="-5" y1="-66" x2="5" y2="-66" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== DATA CORE on beam beside Luma ===== -->
  <g transform="translate(440 215)">
    <rect x="-44" y="-9" width="88" height="22" fill="url(#i8p20p4deadCore)" stroke="#040408" stroke-width="0.55" rx="2"/>
    <line x1="-44" y1="3" x2="44" y2="3" stroke="#040408" stroke-width="0.4"/>
    <!-- Hairline fractures -->
    <path d="M-30,-3 L-22,7 L-15,-3" stroke="#040408" stroke-width="0.55" opacity="0.95"/>
    <path d="M14,-7 L22,3 L30,-3" stroke="#040408" stroke-width="0.55" opacity="0.85"/>
    <!-- Surface dust -->
    <ellipse cx="-22" cy="-7" rx="9" ry="2" fill="#a89878" opacity="0.4"/>
    <ellipse cx="22" cy="-7" rx="11" ry="2" fill="#a89878" opacity="0.4"/>
    <!-- Interface ports -->
    <circle cx="-30" cy="3" r="2" fill="#040408"/>
    <circle cx="30" cy="3" r="2" fill="#040408"/>
  </g>
  <!-- The grey light treats them EQUALLY — both still -->

  <!-- ===== CAPTIONS ===== -->
  <!-- CAPTION 1 — top -->
  <g>
    <rect x="14" y="14" width="500" height="62" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">The word would not leave her. Carved in stone, older than the church,</text>
  <text x="22" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">older than the city's memory. A single instruction from someone who had</text>
  <text x="22" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">stood where she stood, seen what she had seen,</text>
  <text x="22" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic" font-weight="700">and made a choice that consumed their life.</text>

  <!-- CAPTION 2 — single word -->
  <g>
    <rect x="490" y="280" width="240" height="32" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="1.4" opacity="0.92"/>
  </g>
  <text x="498" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1410" font-style="italic" font-weight="700">Stay.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1410" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
