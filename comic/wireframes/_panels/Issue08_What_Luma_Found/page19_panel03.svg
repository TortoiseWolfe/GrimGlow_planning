<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 19 — Panel 3: Theodore glances down — adjusts the waistcoat to shelter the pocket — the boy who cares</title>
  <desc>50mm medium eye level. Theodore glances down at waistcoat breast pocket, one hand adjusting waistcoat to shelter pocket better against cold night air. Sandy-brown hair catches warm gaslight. Expression tender concern — wide hazel eyes softened, face of perceptive boy offering what comfort he can. Faint blue-violet glow from pocket — Luma's presence — catches underside of chin. Brass gear ring catches gaslight as fingers adjust fabric. Fog curls around him. Small and genuine. The boy who cares.</desc>

  <defs>
    <linearGradient id="i8p19p3sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="i8p19p3building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1818"/>
    </linearGradient>
    <radialGradient id="i8p19p3lampHalo" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p19p3pocketGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p19p3fogLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5a4838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="i8p19p3waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p19p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p19p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p19p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p19p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p19p3megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="366" height="60" fill="url(#i8p19p3sky)"/>

  <!-- Building behind, soft -->
  <rect x="0" y="40" width="366" height="180" fill="url(#i8p19p3building)" filter="url(#i8p19p3glow)" opacity="0.85"/>
  <g fill="#a86838" opacity="0.55" filter="url(#i8p19p3glow)">
    <rect x="280" y="100" width="14" height="22"/>
    <rect x="60" y="120" width="14" height="22"/>
  </g>

  <!-- Fog layer -->
  <rect x="0" y="80" width="366" height="220" fill="url(#i8p19p3fogLayer)"/>
  <g opacity="0.55" filter="url(#i8p19p3glow)">
    <ellipse cx="100" cy="160" rx="80" ry="14" fill="#5a4838"/>
    <ellipse cx="280" cy="180" rx="80" ry="14" fill="#5a4838"/>
    <ellipse cx="180" cy="220" rx="100" ry="14" fill="#3a2818"/>
  </g>

  <!-- Distant gaslight (warm halo from right) -->
  <ellipse cx="366" cy="150" rx="200" ry="180" fill="url(#i8p19p3lampHalo)" filter="url(#i8p19p3megaglow)"/>

  <!-- ===== THEODORE — close, head tilted DOWN toward pocket ===== -->
  <g transform="translate(183 180)">
    <!-- Body -->
    <path d="M-44,120 L-50,40 L-44,-9 L-30,-32 L-14,-44 L9,-44 L18,-32 L36,-9 L44,40 L40,120 Z" fill="url(#i8p19p3waistcoat)"/>

    <!-- Buttons -->
    <circle cx="0" cy="-22" r="2" fill="#a86838" filter="url(#i8p19p3bloom)"/>
    <circle cx="0" cy="-3" r="2" fill="#a86838" filter="url(#i8p19p3bloom)"/>
    <circle cx="0" cy="18" r="2" fill="#a86838" filter="url(#i8p19p3bloom)"/>
    <line x1="0" y1="-32" x2="0" y2="40" stroke="#1a0808" stroke-width="0.4"/>

    <!-- ===== BREAST POCKET with Luma's glow ===== -->
    <rect x="-30" y="-22" width="22" height="22" fill="#3a2010" opacity="0.85"/>
    <ellipse cx="-19" cy="-11" rx="14" ry="9" fill="url(#i8p19p3pocketGlow)" filter="url(#i8p19p3glow)"/>
    <circle cx="-19" cy="-11" r="2" fill="#c8a8e8" filter="url(#i8p19p3bloom)" opacity="0.95"/>

    <!-- ===== HAND adjusting waistcoat (BRASS RING catches gaslight) ===== -->
    <path d="M-30,-22 L-22,-44 L-7,-44 L-3,-22 Z" fill="url(#i8p19p3waistcoat)"/>
    <ellipse cx="-15" cy="-44" rx="9" ry="5" fill="url(#i8p19p3skin)"/>
    <!-- Fingers adjusting fabric edge -->
    <ellipse cx="-22" cy="-50" rx="2" ry="3" fill="url(#i8p19p3skin)"/>
    <ellipse cx="-15" cy="-52" rx="2" ry="3" fill="url(#i8p19p3skin)"/>
    <ellipse cx="-9" cy="-50" rx="2" ry="3" fill="url(#i8p19p3skin)"/>
    <!-- BRASS GEAR RING on left index finger -->
    <circle cx="-22" cy="-44" r="2" fill="#a86838" stroke="#3a1808" stroke-width="0.55"/>
    <ellipse cx="-22" cy="-45" rx="1.4" ry="0.55" fill="#ffd898" filter="url(#i8p19p3bloom)" opacity="0.95"/>
    <!-- Gear teeth -->
    <g stroke="#3a1808" stroke-width="0.4" fill="none">
      <line x1="-25" y1="-44" x2="-27" y2="-44"/>
      <line x1="-19" y1="-44" x2="-17" y2="-44"/>
      <line x1="-22" y1="-47" x2="-22" y2="-49"/>
    </g>

    <!-- Other hand at side (in trouser pocket) -->
    <path d="M36,-9 L40,30 L30,30 L26,11 Z" fill="url(#i8p19p3waistcoat)"/>

    <!-- Shirt collar -->
    <path d="M-9,-44 L-7,-50 L9,-50 L11,-44 L9,-36 L-7,-36 Z" fill="#e8d0a8"/>
    <!-- Neck -->
    <path d="M-7,-50 L9,-50 L7,-58 L-5,-58 Z" fill="url(#i8p19p3skin)"/>

    <!-- Head — TILTED DOWN, looking at pocket -->
    <ellipse cx="-3" cy="-72" rx="14" ry="14" fill="url(#i8p19p3skin)"/>

    <!-- Damp hair -->
    <path d="M-15,-86 Q-3,-90 9,-86 L9,-72 Q-3,-76 -15,-72 Z" fill="#5a4838"/>
    <!-- Damp strand at temple -->
    <path d="M-9,-78 L-7,-72" stroke="#3a2010" stroke-width="0.85" opacity="0.85"/>
    <!-- Warm catch on top of hair -->
    <ellipse cx="-3" cy="-89" rx="9" ry="2" fill="#ffd898" opacity="0.7" filter="url(#i8p19p3bloom)"/>

    <!-- ===== VIOLET GLOW catches UNDERSIDE OF CHIN (from pocket) ===== -->
    <ellipse cx="-3" cy="-58" rx="9" ry="3" fill="#a878e8" opacity="0.4" filter="url(#i8p19p3bloom)"/>

    <!-- Eyes — looking DOWN softly (tender concern) -->
    <ellipse cx="-7" cy="-72" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="-7" cy="-71" rx="1" ry="0.55" fill="#5a3018"/>
    <ellipse cx="3" cy="-72" rx="2" ry="1.4" fill="#fff8e8"/>
    <ellipse cx="3" cy="-71" rx="1" ry="0.55" fill="#5a3018"/>
    <!-- Lashes (downcast) -->
    <line x1="-9" y1="-74" x2="-9" y2="-76" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="-5" y1="-74" x2="-5" y2="-76" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="1" y1="-74" x2="1" y2="-76" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="5" y1="-74" x2="5" y2="-76" stroke="#1a0808" stroke-width="0.55"/>
    <!-- Brows softened (concern) -->
    <line x1="-11" y1="-78" x2="-3" y2="-79" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="-1" y1="-79" x2="7" y2="-78" stroke="#3a1808" stroke-width="0.7"/>

    <!-- Nose -->
    <path d="M-1,-66 L0,-58 L2,-58 L2,-66 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth — soft, concerned -->
    <line x1="-3" y1="-54" x2="3" y2="-54" stroke="#3a1808" stroke-width="0.4"/>
  </g>

  <!-- Fog wisps around -->
  <g opacity="0.4" filter="url(#i8p19p3glow)">
    <ellipse cx="40" cy="240" rx="40" ry="9" fill="#5a4838"/>
    <ellipse cx="320" cy="240" rx="40" ry="9" fill="#5a4838"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- THEODORE -->
  <g>
    <rect x="14" y="14" width="338" height="36" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE  <tspan font-style="italic" font-size="8" font-weight="500">(quietly)</tspan></text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">We're nearly back. It'll be all right, Miss Luma.</text>

  <!-- LUMA -->
  <g>
    <rect x="80" y="60" width="270" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="88" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="88" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I know. Thank you, Theodore.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
