<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>Issue 8 — Page 5 — Panel 2: Thresh profile close-up — fear lives close to the surface, fighting the urge to flinch at moving fog</title>
  <desc>85mm close-up profile. Thresh's face — pale skin, defined cheekbones, firm jaw tight with controlled tension, copper-red buzz cut, intense eyes tracking something off-panel. Ruby-crimson armor visible at collar, holographic nodes dimmed faint pulse. Fear visible beneath discipline — not panic, not paralysis, but the chronic tension of someone who has learned to fight afraid. Warm reflected gaslight on near side of face. Crimson armor casts faint red tint on pale skin. Beyond profile alley blur of dark shapes.</desc>

  <defs>
    <linearGradient id="i8p5p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p5p2warm" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p5p2skinWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="i8p5p2skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3018"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="i8p5p2armor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <filter id="i8p5p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p5p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p5p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="i8p5p2blurBg"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="240" height="240" fill="url(#i8p5p2bg)"/>

  <!-- Warm reflected gaslight from right -->
  <ellipse cx="240" cy="120" rx="180" ry="200" fill="url(#i8p5p2warm)" filter="url(#i8p5p2megaglow)"/>

  <!-- Background — blurred alley shapes -->
  <g filter="url(#i8p5p2blurBg)" opacity="0.55">
    <rect x="0" y="60" width="240" height="120" fill="#1a1208"/>
    <ellipse cx="80" cy="120" rx="60" ry="80" fill="#0a0606"/>
    <ellipse cx="200" cy="60" rx="40" ry="40" fill="#3a2010"/>
  </g>

  <!-- Fog curling at top (the thing she's tracking) -->
  <g opacity="0.55" filter="url(#i8p5p2glow)">
    <ellipse cx="40" cy="40" rx="60" ry="14" fill="#5a4838"/>
    <ellipse cx="100" cy="50" rx="40" ry="9" fill="#5a4838"/>
  </g>

  <!-- ===== THRESH PROFILE — facing right (toward gaslight) ===== -->
  <g transform="translate(140 130)">
    <!-- Suit collar — crimson, dented -->
    <path d="M-44,80 L-30,40 L-22,30 L22,30 L30,40 L44,80 L60,120 L-60,120 Z" fill="url(#i8p5p2armor)"/>
    <!-- Heavy dents -->
    <ellipse cx="-22" cy="50" rx="9" ry="6" fill="#5a1410"/>
    <ellipse cx="22" cy="50" rx="9" ry="6" fill="#7a1810"/>
    <!-- Long chest scratch -->
    <path d="M-22,80 L22,80" stroke="#3a0a0a" stroke-width="2.5" opacity="0.85"/>
    <path d="M-18,82 L18,82" stroke="#1a0606" stroke-width="0.85" opacity="0.7"/>
    <!-- Suit accent (faint pulse) -->
    <line x1="0" y1="40" x2="0" y2="100" stroke="#ffa898" stroke-width="0.7" opacity="0.85" filter="url(#i8p5p2bloom)"/>
    <circle cx="-22" cy="40" r="1.4" fill="#f04838" filter="url(#i8p5p2bloom)" opacity="0.85"/>
    <circle cx="22" cy="40" r="1.4" fill="#f04838" filter="url(#i8p5p2bloom)" opacity="0.85"/>

    <!-- Neck — split lit warm/shadow -->
    <path d="M-9,30 L9,30 L9,18 L-9,18 Z" fill="url(#i8p5p2skinShadow)"/>
    <path d="M0,30 L9,30 L9,18 L0,18 Z" fill="url(#i8p5p2skinWarm)"/>

    <!-- Jaw profile (facing right) -->
    <path d="M-22,-9 L-26,11 L-18,30 L0,40 L22,30 L26,11 L22,-9 L11,-22 L-11,-22 Z" fill="url(#i8p5p2skinWarm)"/>
    <!-- Shadow on left side of face (away from gaslight) -->
    <path d="M-22,-9 L-26,11 L-18,30 L0,40 L0,-22 L-11,-22 Z" fill="url(#i8p5p2skinShadow)"/>

    <!-- Crimson armor reflection on jaw (the red tint on pale skin) -->
    <ellipse cx="0" cy="22" rx="14" ry="3" fill="#7a2018" opacity="0.4" filter="url(#i8p5p2bloom)"/>

    <!-- Forehead/head -->
    <ellipse cx="0" cy="-32" rx="22" ry="22" fill="url(#i8p5p2skinWarm)"/>
    <!-- Shadow on left side -->
    <path d="M0,-50 L-22,-50 L-22,-14 L0,-14 Z" fill="url(#i8p5p2skinShadow)"/>

    <!-- Tension sweat at temple -->
    <ellipse cx="-14" cy="-44" rx="3" ry="2" fill="#a8c8e8" opacity="0.4" filter="url(#i8p5p2bloom)"/>
    <circle cx="-11" cy="-40" r="0.55" fill="#fff8e8" opacity="0.55"/>

    <!-- Copper-red buzz cut -->
    <path d="M-22,-50 Q0,-58 22,-50 L22,-32 Q11,-44 0,-44 Q-11,-44 -22,-32 Z" fill="#a83820"/>
    <line x1="-18" y1="-50" x2="0" y2="-50" stroke="#5a1810" stroke-width="0.4"/>
    <line x1="0" y1="-54" x2="14" y2="-54" stroke="#5a1810" stroke-width="0.4"/>
    <!-- Amber catch on hair (warm side) -->
    <ellipse cx="11" cy="-54" rx="14" ry="2" fill="#ffd898" opacity="0.55" filter="url(#i8p5p2bloom)"/>

    <!-- Defined cheekbone -->
    <path d="M14,-3 Q11,-9 18,-14" stroke="#7a4818" stroke-width="0.7" fill="none" opacity="0.7"/>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-36" rx="22" ry="5" fill="#5a3018" opacity="0.55"/>

    <!-- Brow — tense, drawn down -->
    <line x1="-18" y1="-30" x2="-3" y2="-32" stroke="#3a1808" stroke-width="2"/>
    <line x1="3" y1="-32" x2="18" y2="-30" stroke="#3a1808" stroke-width="2"/>

    <!-- Eyes — narrowed, fixed forward (right), tracking -->
    <ellipse cx="9" cy="-22" rx="5" ry="3" fill="#fff8e8"/>
    <ellipse cx="11" cy="-22" rx="2.5" ry="2" fill="#3a1808"/>
    <circle cx="11" cy="-22" r="1" fill="#0a0408"/>

    <!-- Catchlight (amber from gaslight) -->
    <circle cx="13" cy="-23" r="0.85" fill="#ffd898" filter="url(#i8p5p2bloom)" opacity="0.95"/>

    <!-- Lashes -->
    <line x1="9" y1="-25" x2="9" y2="-28" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="13" y1="-25" x2="13" y2="-28" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Lower lid tension -->
    <line x1="3" y1="-18" x2="14" y2="-18" stroke="#3a1808" stroke-width="0.55" opacity="0.7"/>

    <!-- Nose (profile) -->
    <path d="M22,-9 L26,3 L24,11 L18,9 Z" fill="url(#i8p5p2skinWarm)"/>
    <line x1="22" y1="11" x2="18" y2="11" stroke="#3a1808" stroke-width="0.4"/>

    <!-- Mouth — flat, tight -->
    <line x1="11" y1="22" x2="22" y2="20" stroke="#3a1808" stroke-width="1.4"/>

    <!-- Jaw muscle clench -->
    <ellipse cx="-3" cy="14" rx="6" ry="3" fill="#7a4818" opacity="0.4"/>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q60,142 120,138 Q180,136 240,140"/>
    <path d="M0,200 Q60,202 120,198 Q180,196 240,200"/>
  </g>
</svg>
