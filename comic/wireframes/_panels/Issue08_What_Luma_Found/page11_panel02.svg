<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="240" height="270">
  <title>Issue 8 — Page 11 — Panel 2: Inset — corroded wing-pack skeleton — geometric struts, dragonfly geometry, the memory of flight in dead metal</title>
  <desc>100mm extreme close-up. Corroded wing-pack — geometric lattice struts that once supported translucent holographic wings, now stripped bare by centuries of oxidation. Dragonfly-wing geometry recognizable but skeletal — structural logic preserved even as material has decayed. Where scanner light touches struts, faint blue-white ghost-glow traces old luminous channels — technology remembering what it was. Centuries of mineral deposits and verdigris. Wing-pack rests on stone shelf thick with dust, undisturbed.</desc>

  <defs>
    <linearGradient id="i8p11p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p11p2corroded" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i8p11p2shelfStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i8p11p2ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p11p2scannerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <filter id="i8p11p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p11p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p11p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p11p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="240" height="270" fill="url(#i8p11p2bg)"/>

  <!-- Stone shelf -->
  <rect x="0" y="200" width="240" height="70" fill="url(#i8p11p2shelfStone)"/>
  <line x1="0" y1="200" x2="240" y2="200" stroke="#040408" stroke-width="0.85"/>
  <!-- Heavy dust on shelf -->
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="60" cy="210" rx="30" ry="3"/>
    <ellipse cx="180" cy="215" rx="40" ry="4"/>
    <ellipse cx="120" cy="235" rx="50" ry="4"/>
  </g>

  <!-- Scanner light wash -->
  <ellipse cx="120" cy="120" rx="160" ry="100" fill="url(#i8p11p2scannerLight)" filter="url(#i8p11p2megaglow)"/>

  <!-- Ghost glow halo around the relic -->
  <ellipse cx="120" cy="140" rx="100" ry="60" fill="url(#i8p11p2ghostGlow)" filter="url(#i8p11p2strongglow)" opacity="0.55"/>

  <!-- ===== WING-PACK SKELETON — large in this close-up frame ===== -->
  <g transform="translate(120 160)">
    <!-- Mounting block (corroded) -->
    <rect x="-30" y="-9" width="60" height="30" fill="url(#i8p11p2corroded)"/>
    <rect x="-30" y="-9" width="60" height="30" fill="none" stroke="#040408" stroke-width="0.85"/>
    <!-- Verdigris on mount -->
    <ellipse cx="-14" cy="0" rx="11" ry="4" fill="#3a4838" opacity="0.7"/>
    <ellipse cx="14" cy="3" rx="11" ry="4" fill="#5a3818" opacity="0.55"/>
    <ellipse cx="0" cy="-3" rx="9" ry="2" fill="#3a4838" opacity="0.55"/>
    <!-- Mineral deposits -->
    <g fill="#7a6038" opacity="0.55">
      <ellipse cx="-22" cy="11" rx="3" ry="1.4"/>
      <ellipse cx="22" cy="11" rx="3" ry="1.4"/>
    </g>

    <!-- ===== LEFT WING SKELETON ===== -->
    <g stroke="url(#i8p11p2corroded)" stroke-width="3" fill="none">
      <!-- Outer frame (dragonfly upper wing arc) -->
      <path d="M-30,-3 L-66,-44 L-110,-30 L-110,18 L-66,30 L-30,11"/>
      <!-- Main veins -->
      <line x1="-30" y1="-3" x2="-110" y2="-3"/>
      <line x1="-66" y1="-44" x2="-66" y2="30"/>
      <!-- Cross-veins -->
      <line x1="-66" y1="-44" x2="-110" y2="18"/>
      <line x1="-66" y1="30" x2="-110" y2="-30"/>
      <!-- Sub-veins -->
      <line x1="-44" y1="-22" x2="-90" y2="-22"/>
      <line x1="-44" y1="11" x2="-90" y2="11"/>
      <!-- Cell walls (the dragonfly geometry) -->
      <line x1="-50" y1="-30" x2="-80" y2="-15"/>
      <line x1="-50" y1="18" x2="-80" y2="3"/>
    </g>
    <!-- Lattice nodes (joints) -->
    <g fill="url(#i8p11p2corroded)" stroke="#040408" stroke-width="0.55">
      <circle cx="-66" cy="-3" r="3"/>
      <circle cx="-66" cy="-22" r="2"/>
      <circle cx="-66" cy="14" r="2"/>
      <circle cx="-44" cy="-22" r="2"/>
      <circle cx="-44" cy="11" r="2"/>
      <circle cx="-90" cy="-22" r="2"/>
      <circle cx="-90" cy="11" r="2"/>
      <circle cx="-30" cy="-3" r="2.5"/>
      <circle cx="-30" cy="11" r="2"/>
    </g>

    <!-- ===== RIGHT WING SKELETON (mirrored) ===== -->
    <g stroke="url(#i8p11p2corroded)" stroke-width="3" fill="none">
      <path d="M30,-3 L66,-44 L110,-30 L110,18 L66,30 L30,11"/>
      <line x1="30" y1="-3" x2="110" y2="-3"/>
      <line x1="66" y1="-44" x2="66" y2="30"/>
      <line x1="66" y1="-44" x2="110" y2="18"/>
      <line x1="66" y1="30" x2="110" y2="-30"/>
      <line x1="44" y1="-22" x2="90" y2="-22"/>
      <line x1="44" y1="11" x2="90" y2="11"/>
      <line x1="50" y1="-30" x2="80" y2="-15"/>
      <line x1="50" y1="18" x2="80" y2="3"/>
    </g>
    <g fill="url(#i8p11p2corroded)" stroke="#040408" stroke-width="0.55">
      <circle cx="66" cy="-3" r="3"/>
      <circle cx="66" cy="-22" r="2"/>
      <circle cx="66" cy="14" r="2"/>
      <circle cx="44" cy="-22" r="2"/>
      <circle cx="44" cy="11" r="2"/>
      <circle cx="90" cy="-22" r="2"/>
      <circle cx="90" cy="11" r="2"/>
      <circle cx="30" cy="-3" r="2.5"/>
      <circle cx="30" cy="11" r="2"/>
    </g>

    <!-- ===== GHOST-GLOW on luminous channels (where light USED to flow) ===== -->
    <g stroke="#a86838" stroke-width="0.85" fill="none" opacity="0.55" filter="url(#i8p11p2bloom)">
      <line x1="-30" y1="-3" x2="-110" y2="-3"/>
      <line x1="-66" y1="-44" x2="-66" y2="30"/>
      <line x1="30" y1="-3" x2="110" y2="-3"/>
      <line x1="66" y1="-44" x2="66" y2="30"/>
    </g>
    <g stroke="#fff" stroke-width="0.4" fill="none" opacity="0.4" filter="url(#i8p11p2bloom)">
      <line x1="-66" y1="-3" x2="-66" y2="20"/>
      <line x1="66" y1="-3" x2="66" y2="20"/>
    </g>
    <!-- Ghost-glow at strut nodes (the memory) -->
    <g opacity="0.7" filter="url(#i8p11p2bloom)">
      <circle cx="-66" cy="-3" r="1.4" fill="#a86838"/>
      <circle cx="66" cy="-3" r="1.4" fill="#a86838"/>
      <circle cx="-30" cy="-3" r="1.4" fill="#a86838"/>
      <circle cx="30" cy="-3" r="1.4" fill="#a86838"/>
    </g>

    <!-- Mineral encrustation on lattice -->
    <g fill="#3a4838" opacity="0.55">
      <ellipse cx="-44" cy="0" rx="3" ry="1.4"/>
      <ellipse cx="44" cy="0" rx="3" ry="1.4"/>
      <ellipse cx="-90" cy="-3" rx="3" ry="1.4"/>
      <ellipse cx="90" cy="-3" rx="3" ry="1.4"/>
    </g>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q60,142 120,138 Q180,136 240,140"/>
  </g>
</svg>
