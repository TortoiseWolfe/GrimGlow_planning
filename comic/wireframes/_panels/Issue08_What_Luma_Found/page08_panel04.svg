<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 8 — Panel 4: Luma's scanner reveals the sealed chamber beneath the nave — ghost light in dead circuitry, centuries dormant</title>
  <desc>85mm slight high angle. Luma stands on Theodore's shoulder — tiny figure in sapphire-violet suit approximately four inches tall, scanner held forward projecting holographic cross-section of building below. Cross-section shows stone floor layers and beneath them sealed chamber, highlighted in pulsing blue-violet. Within chamber, faint residual energy signatures glow — ghost light in dead circuitry, barely perceptible. Luma's expression wide-eyed realization — mouth slightly open, holographic lenses scrolling rapid data. Theodore's shoulder and collar visible beneath — worn waistcoat fabric, scale contrast stark.</desc>

  <defs>
    <linearGradient id="i8p8p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i8p8p4waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="i8p8p4violetField" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5a4ab8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p8p4chamberPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a8e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7848b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p8p4lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p8p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i8p8p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p8p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p8p4strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p8p4megaglow"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="i8p8p4dataPulse"><feGaussianBlur stdDeviation="0.7"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p8p4bg)"/>

  <!-- Distant grey church light from upper-left -->
  <ellipse cx="0" cy="0" rx="180" ry="200" fill="#a8a8b8" opacity="0.18" filter="url(#i8p8p4megaglow)"/>

  <!-- Violet halo from scanner -->
  <ellipse cx="183" cy="150" rx="280" ry="200" fill="url(#i8p8p4violetField)" filter="url(#i8p8p4megaglow)"/>

  <!-- ===== THEODORE'S SHOULDER (foreground, large in frame) ===== -->
  <g transform="translate(183 280)">
    <!-- Waistcoat fabric -->
    <path d="M-180,40 L-180,-40 L-30,-50 L0,-44 L30,-50 L180,-40 L180,40 Z" fill="url(#i8p8p4waistcoat)"/>
    <!-- Shoulder seam -->
    <path d="M-30,-50 L-30,40" stroke="#3a2010" stroke-width="0.85" opacity="0.85"/>
    <path d="M30,-50 L30,40" stroke="#3a2010" stroke-width="0.85" opacity="0.85"/>
    <!-- Wool fabric texture -->
    <g stroke="#5a3018" stroke-width="0.4" opacity="0.55" fill="none">
      <path d="M-180,0 Q-90,5 0,0 Q90,-5 180,0"/>
      <path d="M-180,20 Q-90,25 0,20 Q90,15 180,20"/>
      <path d="M-180,-20 Q-90,-15 0,-20 Q90,-25 180,-20"/>
    </g>
    <!-- Subtle warm catch on shoulder -->
    <ellipse cx="-50" cy="-30" rx="80" ry="14" fill="#a86838" opacity="0.18" filter="url(#i8p8p4bloom)"/>

    <!-- Shirt collar visible at top -->
    <path d="M-30,-50 L-22,-58 L22,-58 L30,-50 L22,-44 L-22,-44 Z" fill="#e8d0a8" opacity="0.85"/>

    <!-- Theodore's neck/jaw partial (out of focus, just suggested) -->
    <path d="M-22,-58 L-18,-72 L18,-72 L22,-58 Z" fill="url(#i8p8p4skin)" opacity="0.55"/>
    <ellipse cx="0" cy="-80" rx="22" ry="11" fill="url(#i8p8p4skin)" opacity="0.4"/>
  </g>

  <!-- ===== LUMA standing on Theodore's shoulder ===== -->
  <g transform="translate(183 200)">
    <!-- Body — slight forward lean (engaged with scan) -->
    <path d="M-9,30 L-11,9 L-14,-14 L-11,-30 L-3,-40 L3,-40 L11,-30 L14,-14 L11,9 L9,30 Z" fill="url(#i8p8p4lumaSuit)"/>

    <!-- Ink stains -->
    <ellipse cx="-14" cy="0" rx="3" ry="2" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="14" cy="0" rx="3" ry="2" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent -->
    <line x1="0" y1="-30" x2="0" y2="22" stroke="#c8a8e8" stroke-width="0.55" opacity="0.85" filter="url(#i8p8p4bloom)"/>
    <circle cx="-9" cy="-22" r="0.85" fill="#c8a8e8" filter="url(#i8p8p4bloom)" opacity="0.95"/>
    <circle cx="9" cy="-22" r="0.85" fill="#c8a8e8" filter="url(#i8p8p4bloom)" opacity="0.95"/>
    <circle cx="0" cy="-3" r="0.85" fill="#c8a8e8" filter="url(#i8p8p4bloom)" opacity="0.95"/>

    <!-- Right arm holding scanner FORWARD/DOWN (toward floor for cross-section) -->
    <path d="M11,-22 L26,-9 L22,11 L9,3 Z" fill="url(#i8p8p4lumaSuit)"/>
    <ellipse cx="26" cy="-9" rx="3" ry="2" fill="url(#i8p8p4skin)"/>

    <!-- Scanner held forward -->
    <rect x="26" y="-14" width="14" height="9" fill="#3a1858" stroke="#1a0810" stroke-width="0.4"/>
    <ellipse cx="33" cy="-9" rx="5" ry="0.85" fill="#a878e8" filter="url(#i8p8p4bloom)" opacity="0.95"/>

    <!-- Other arm at side -->
    <path d="M-11,-22 L-22,-3 L-14,11 L-7,-3 Z" fill="url(#i8p8p4lumaSuit)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-50" rx="6" ry="7" fill="url(#i8p8p4skin)"/>

    <!-- Long thick braid -->
    <path d="M3,-44 Q9,-22 14,18" stroke="#1a0808" stroke-width="2" fill="none"/>
    <path d="M3,-44 Q9,-22 14,18" stroke="#a878e8" stroke-width="0.4" fill="none" filter="url(#i8p8p4bloom)" opacity="0.95"/>
    <!-- Filament pulses -->
    <ellipse cx="9" cy="-22" rx="2" ry="0.85" fill="#c8a8e8" filter="url(#i8p8p4strongglow)" opacity="0.95"/>
    <ellipse cx="14" cy="11" rx="2" ry="0.85" fill="#c8a8e8" filter="url(#i8p8p4strongglow)" opacity="0.85"/>

    <!-- Hair pulled back -->
    <path d="M-7,-58 Q0,-62 7,-58 L7,-50 Q0,-54 -7,-50 Z" fill="#1a0808"/>

    <!-- Holographic lenses scrolling RAPID data -->
    <ellipse cx="0" cy="-50" rx="9" ry="3" fill="#7848b8" filter="url(#i8p8p4strongglow)" opacity="0.7"/>
    <ellipse cx="-2" cy="-50" rx="2.5" ry="2" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p8p4bloom)" opacity="0.95"/>
    <ellipse cx="2" cy="-50" rx="2.5" ry="2" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p8p4bloom)" opacity="0.95"/>

    <!-- Eyes WIDE behind lenses -->
    <circle cx="-2" cy="-50" r="0.85" fill="#fff8e8" filter="url(#i8p8p4bloom)"/>
    <circle cx="2" cy="-50" r="0.85" fill="#fff8e8" filter="url(#i8p8p4bloom)"/>

    <!-- Brows raised (realization) -->
    <line x1="-5" y1="-55" x2="-1" y2="-56" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="1" y1="-56" x2="5" y2="-55" stroke="#3a1808" stroke-width="0.55"/>

    <!-- Mouth slightly open -->
    <ellipse cx="0" cy="-44" rx="1.4" ry="0.85" fill="#3a1808"/>
  </g>

  <!-- ===== HOLOGRAPHIC CROSS-SECTION projected over the shoulder showing the building below ===== -->
  <g transform="translate(220 230)">
    <!-- Cross-section frame -->
    <rect x="-100" y="-60" width="200" height="100" fill="#1a1858" opacity="0.7" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p8p4bloom)"/>
    <!-- Title bar -->
    <text x="-95" y="-50" font-family="monospace" font-size="3.5" fill="#c8a8e8" filter="url(#i8p8p4dataPulse)" opacity="0.95">CROSS-SECT//SUBSURFACE-SCAN</text>
    <line x1="-95" y1="-46" x2="40" y2="-46" stroke="#c8a8e8" stroke-width="0.4" opacity="0.7"/>

    <!-- Stone floor layers (top of section) -->
    <g stroke="#a878e8" stroke-width="0.55" fill="none" filter="url(#i8p8p4bloom)" opacity="0.85">
      <path d="M-90,-30 L90,-30"/>
      <path d="M-90,-22 L90,-22"/>
      <path d="M-90,-15 L90,-15"/>
    </g>
    <text x="-90" y="-38" font-family="monospace" font-size="3" fill="#a878e8" opacity="0.85">FLOOR 0.4m</text>

    <!-- Stone foundation (mid-section) -->
    <rect x="-90" y="-15" width="180" height="11" fill="#7848b8" opacity="0.4"/>
    <text x="-90" y="-7" font-family="monospace" font-size="3" fill="#a878e8" opacity="0.85">FOUNDATION</text>

    <!-- ===== SEALED CHAMBER below — pulsing blue-violet ===== -->
    <rect x="-70" y="0" width="140" height="35" fill="#3a1858" stroke="#c8a8e8" stroke-width="0.85" filter="url(#i8p8p4bloom)" opacity="0.95"/>
    <!-- Chamber pulse -->
    <ellipse cx="0" cy="18" rx="80" ry="20" fill="url(#i8p8p4chamberPulse)" filter="url(#i8p8p4strongglow)" opacity="0.85"/>
    <!-- Highlight box -->
    <rect x="-70" y="0" width="140" height="35" fill="none" stroke="#fff" stroke-width="0.4" stroke-dasharray="2,1.5" filter="url(#i8p8p4bloom)" opacity="0.85"/>

    <!-- ===== RESIDUAL ENERGY SIGNATURES — ghost light in dead circuitry ===== -->
    <g filter="url(#i8p8p4bloom)" opacity="0.85">
      <circle cx="-50" cy="11" r="2" fill="#c8a8e8"/>
      <circle cx="-30" cy="22" r="1.4" fill="#c8a8e8"/>
      <circle cx="-9" cy="14" r="2.5" fill="#c8a8e8"/>
      <circle cx="14" cy="22" r="1.4" fill="#c8a8e8"/>
      <circle cx="35" cy="11" r="2" fill="#c8a8e8"/>
      <circle cx="55" cy="22" r="1.4" fill="#c8a8e8"/>
    </g>
    <!-- Connecting circuit lines (faint) -->
    <g stroke="#c8a8e8" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#i8p8p4bloom)">
      <path d="M-50,11 L-30,22 L-9,14 L14,22 L35,11 L55,22"/>
    </g>

    <!-- Chamber labels -->
    <text x="-65" y="11" font-family="monospace" font-size="3" fill="#fff" filter="url(#i8p8p4dataPulse)">SEALED-CHAMBER</text>
    <text x="-65" y="20" font-family="monospace" font-size="2.5" fill="#c8a8e8" opacity="0.85">DEPTH 4m  STATUS: DORMANT</text>
    <text x="-65" y="29" font-family="monospace" font-size="2.5" fill="#c8a8e8" opacity="0.85">RESIDUAL-FAIRY-TECH  AGE ~600y</text>

    <!-- Bottom of cross-section (deeper rock) -->
    <rect x="-90" y="35" width="180" height="3" fill="#3a1858" opacity="0.55"/>

    <!-- Scanner beam connecting Luma's scanner to the projection (top) -->
    <line x1="-80" y1="-60" x2="-50" y2="-30" stroke="#a878e8" stroke-width="0.4" stroke-dasharray="1,1.5" opacity="0.7" filter="url(#i8p8p4bloom)"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- LUMA — wide-eyed realization -->
  <g>
    <rect x="14" y="14" width="338" height="68" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Theodore. There's a chamber below the nave. Sealed.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">And there's... there's a residual energy signature.</text>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">Fairy technology. It's been there for centuries.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
