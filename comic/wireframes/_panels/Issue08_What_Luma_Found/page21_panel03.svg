<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 21 — Panel 3: Luma defers full briefing — organizing grief into data — Sable accepts</title>
  <desc>50mm medium eye level. Luma sits on timber beam beside dead data core, gaze fixed on its dark cracked surface. Sapphire-violet suit dusty and worn, holographic lenses dimmed, scanner at hip inactive. Organizing grief into data — jaw set, eyes focused, scientist preparing to transform personal devastation into briefing. Dark core beside her absorbs grey morning light. Sable's voice from off-panel — captain's question, professional, controlled. Luma's response equally controlled, equally professional, equally hiding something enormous. Grey morning light on scientist and relic. The secrets we carry next to us.</desc>

  <defs>
    <linearGradient id="i8p21p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i8p21p3timber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="i8p21p3greyDawn" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#a8a8b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p21p3lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7848b8"/>
      <stop offset="100%" stop-color="#2a1858"/>
    </linearGradient>
    <linearGradient id="i8p21p3deadCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <linearGradient id="i8p21p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <filter id="i8p21p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p21p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p21p3megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p21p3bg)"/>

  <!-- Grey dawn from above -->
  <ellipse cx="183" cy="0" rx="280" ry="180" fill="url(#i8p21p3greyDawn)" filter="url(#i8p21p3megaglow)"/>

  <!-- Camp wall -->
  <rect x="0" y="0" width="366" height="220" fill="#2a2030"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.55">
    <line x1="0" y1="60" x2="366" y2="60"/>
    <line x1="0" y1="120" x2="366" y2="120"/>
    <line x1="0" y1="180" x2="366" y2="180"/>
  </g>
  <!-- Beam Luma sits on -->
  <rect x="0" y="220" width="366" height="14" fill="url(#i8p21p3timber)"/>
  <rect x="0" y="270" width="366" height="30" fill="#0a0606"/>

  <!-- ===== LUMA — sits, focused, jaw set ===== -->
  <g transform="translate(140 215)">
    <!-- Body — seated -->
    <path d="M-22,11 L-26,-9 L-30,-32 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-32 L26,-9 L22,11 Z" fill="url(#i8p21p3lumaSuit)"/>
    <!-- Heavy ink stains and dust -->
    <ellipse cx="-26" cy="-9" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="26" cy="-9" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="-15" cy="-30" rx="9" ry="3" fill="#3a2010" opacity="0.55"/>

    <!-- Suit accent dim -->
    <line x1="0" y1="-50" x2="0" y2="3" stroke="#a878e8" stroke-width="0.55" opacity="0.55" filter="url(#i8p21p3bloom)"/>
    <circle cx="-9" cy="-30" r="0.7" fill="#a878e8" filter="url(#i8p21p3bloom)" opacity="0.55"/>
    <circle cx="9" cy="-30" r="0.7" fill="#a878e8" filter="url(#i8p21p3bloom)" opacity="0.55"/>

    <!-- Arms in lap, hands resting -->
    <path d="M-30,-15 L-36,3 L-22,11 L-15,0 Z" fill="url(#i8p21p3lumaSuit)"/>
    <path d="M30,-15 L36,3 L22,11 L15,0 Z" fill="url(#i8p21p3lumaSuit)"/>
    <ellipse cx="-22" cy="11" rx="4" ry="3" fill="url(#i8p21p3skin)"/>
    <ellipse cx="22" cy="11" rx="4" ry="3" fill="url(#i8p21p3skin)"/>

    <!-- Knees -->
    <ellipse cx="-14" cy="14" rx="9" ry="4" fill="url(#i8p21p3lumaSuit)"/>
    <ellipse cx="14" cy="14" rx="9" ry="4" fill="url(#i8p21p3lumaSuit)"/>

    <!-- Scanner at hip (INACTIVE) -->
    <rect x="-30" y="-3" width="6" height="9" fill="#3a1858" opacity="0.55"/>
    <ellipse cx="-27" cy="0" rx="2" ry="0.4" fill="#3a1858" opacity="0.55"/>

    <!-- Head -->
    <ellipse cx="0" cy="-86" rx="14" ry="16" fill="url(#i8p21p3skin)"/>

    <!-- Braid (filament barely glowing) -->
    <path d="M11,-72 Q22,-30 30,11" stroke="#1a0808" stroke-width="3" fill="none"/>
    <g stroke="#7848b8" stroke-width="0.4" fill="none" opacity="0.4">
      <path d="M11,-72 Q22,-30 30,11"/>
    </g>

    <!-- Hair pulled back -->
    <path d="M-14,-100 Q0,-104 14,-100 L14,-86 Q0,-90 -14,-86 Z" fill="#1a0808"/>

    <!-- Lenses INACTIVE (dark/dim) -->
    <ellipse cx="-7" cy="-86" rx="6" ry="4" fill="none" stroke="#3a1858" stroke-width="0.55" opacity="0.55"/>
    <ellipse cx="-7" cy="-86" rx="4" ry="3" fill="#1a0828" opacity="0.55"/>
    <ellipse cx="7" cy="-86" rx="6" ry="4" fill="none" stroke="#3a1858" stroke-width="0.55" opacity="0.55"/>
    <ellipse cx="7" cy="-86" rx="4" ry="3" fill="#1a0828" opacity="0.55"/>

    <!-- Brows — set, JAW SET -->
    <line x1="-15" y1="-94" x2="-3" y2="-94" stroke="#3a1808" stroke-width="1.4"/>
    <line x1="3" y1="-94" x2="15" y2="-94" stroke="#3a1808" stroke-width="1.4"/>

    <!-- Eyes — focused on core -->
    <ellipse cx="-7" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="-7" cy="-85" r="0.7" fill="#3a1808"/>
    <ellipse cx="7" cy="-86" rx="2" ry="1" fill="#fff8e8"/>
    <circle cx="7" cy="-85" r="0.7" fill="#3a1808"/>

    <!-- Fatigue lines -->
    <line x1="-15" y1="-92" x2="-9" y2="-94" stroke="#3a1808" stroke-width="0.4" opacity="0.7"/>

    <!-- Nose -->
    <path d="M-2,-78 L0,-66 L3,-66 L3,-78 Z" fill="#5a3018" opacity="0.55"/>

    <!-- Mouth — flat, controlled (the scientist's mask) -->
    <line x1="-5" y1="-66" x2="5" y2="-66" stroke="#3a1808" stroke-width="0.85"/>
  </g>

  <!-- Dead data core to the right -->
  <g transform="translate(260 220)">
    <rect x="-44" y="-9" width="88" height="22" fill="url(#i8p21p3deadCore)" stroke="#040408" stroke-width="0.55" rx="2"/>
    <line x1="-44" y1="3" x2="44" y2="3" stroke="#040408" stroke-width="0.4"/>
    <path d="M-30,-3 L-22,7 L-15,-3" stroke="#040408" stroke-width="0.55" opacity="0.95"/>
    <path d="M14,-7 L22,3 L30,-3" stroke="#040408" stroke-width="0.55" opacity="0.85"/>
    <ellipse cx="-22" cy="-7" rx="9" ry="2" fill="#a89878" opacity="0.4"/>
    <circle cx="-30" cy="3" r="2" fill="#040408"/>
    <circle cx="30" cy="3" r="2" fill="#040408"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- SABLE off-panel -->
  <g>
    <rect x="14" y="14" width="280" height="36" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE  <tspan font-style="italic" font-size="8" font-weight="500">(off-panel)</tspan></text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Luma. What did you find?</text>

  <!-- LUMA -->
  <g>
    <rect x="14" y="60" width="338" height="50" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">A cache. Prior operative remains and technology.</text>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">A message. I need time before a full briefing.</text>

  <!-- SABLE response -->
  <g>
    <rect x="14" y="120" width="280" height="36" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Understood. Take what you need.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
