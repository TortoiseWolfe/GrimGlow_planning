<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 18 — Panel 2: The exhale at dawn — Thresh looks at the spot, then up at lightening sky — visible breath, brief private peace</title>
  <desc>50mm slight low angle. Thresh looks at cobblestones where child crouched — ordinary stones, no mark, no sign of encounter. Gaze rests there with significance. Then she looks up — toward strip of lightening sky between rooflines, predawn grey replacing blue-black. Exhales. Breath visible in cold air — tiny wisp from tiny figure, catching last warm amber of guttering gaslight. Copper-red buzz cut catches both lights — warm amber below, cool grey above. Expression brief private peace — not happiness, not resolution, but something earned. The soldier who has been seen.</desc>

  <defs>
    <linearGradient id="i8p18p2skyTransition" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8898"/>
      <stop offset="60%" stop-color="#3a4858"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <linearGradient id="i8p18p2brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p18p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p18p2lampDying" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p18p2predawn" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#a8b8c8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a4858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p18p2breathCatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p18p2threshArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="i8p18p2skinDual" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="50%" stop-color="#c89878"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p18p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p18p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p18p2strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p18p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <!-- Sky strip (more grey now — predawn approaching) -->
  <rect width="742" height="60" fill="url(#i8p18p2skyTransition)"/>
  <ellipse cx="371" cy="0" rx="600" ry="50" fill="url(#i8p18p2predawn)" filter="url(#i8p18p2megaglow)"/>

  <!-- Top of brick walls — top edges catching cool grey -->
  <rect x="0" y="60" width="742" height="14" fill="#1a1818"/>
  <line x1="0" y1="60" x2="742" y2="60" stroke="#a8b8c8" stroke-width="0.55" filter="url(#i8p18p2bloom)" opacity="0.55"/>

  <!-- Brick walls -->
  <rect x="0" y="74" width="200" height="180" fill="url(#i8p18p2brick)"/>
  <rect x="540" y="74" width="202" height="180" fill="url(#i8p18p2brick)"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="200" x2="200" y2="200"/>
    <line x1="540" y1="120" x2="742" y2="120"/>
    <line x1="540" y1="160" x2="742" y2="160"/>
    <line x1="540" y1="200" x2="742" y2="200"/>
  </g>
  <g fill="#040408" opacity="0.7">
    <ellipse cx="80" cy="120" rx="22" ry="9"/>
    <ellipse cx="160" cy="200" rx="22" ry="9"/>
    <ellipse cx="600" cy="120" rx="22" ry="9"/>
    <ellipse cx="680" cy="200" rx="22" ry="9"/>
  </g>
  <!-- Top edges of walls catch cool grey light -->
  <line x1="0" y1="120" x2="200" y2="120" stroke="#a8b8c8" stroke-width="0.4" filter="url(#i8p18p2bloom)" opacity="0.4"/>
  <line x1="540" y1="120" x2="742" y2="120" stroke="#a8b8c8" stroke-width="0.4" filter="url(#i8p18p2bloom)" opacity="0.4"/>

  <!-- Cobblestone -->
  <rect x="0" y="254" width="742" height="46" fill="url(#i8p18p2cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="40" cy="270" rx="11" ry="6"/>
    <ellipse cx="120" cy="280" rx="11" ry="6"/>
    <ellipse cx="200" cy="275" rx="11" ry="6"/>
    <ellipse cx="280" cy="280" rx="11" ry="6"/>
    <ellipse cx="380" cy="275" rx="11" ry="6"/>
    <ellipse cx="480" cy="280" rx="11" ry="6"/>
    <ellipse cx="600" cy="275" rx="11" ry="6"/>
    <ellipse cx="700" cy="280" rx="11" ry="6"/>
  </g>

  <!-- ===== Gaslight at far end — almost out, last warm catch ===== -->
  <g transform="translate(620 100)">
    <rect x="-2" y="0" width="4" height="140" fill="#3a3030"/>
    <rect x="-22" y="-26" width="22" height="22" fill="#1a1818"/>
    <ellipse cx="-11" cy="-10" rx="1.4" ry="2" fill="#fff8d8" filter="url(#i8p18p2strongglow)" opacity="0.7"/>
  </g>
  <ellipse cx="600" cy="120" rx="100" ry="60" fill="url(#i8p18p2lampDying)" filter="url(#i8p18p2megaglow)"/>

  <!-- ===== EMPTY COBBLESTONES where child was — ordinary stones ===== -->
  <g transform="translate(380 270)">
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="#040408" stroke-width="0.55" opacity="0.7"/>
    <!-- Slight variation suggesting "the spot" but it IS ordinary -->
  </g>

  <!-- ===== THRESH — looking up at lightening sky (subtle low angle) ===== -->
  <g transform="translate(140 250)">
    <!-- Body — same position -->
    <path d="M-7,18 L-9,3 L-11,-9 L-7,-22 L-3,-30 L3,-30 L7,-22 L11,-9 L9,3 L7,18 Z" fill="url(#i8p18p2threshArmor)"/>
    <ellipse cx="-9" cy="-14" rx="3" ry="2" fill="#3a0a0a"/>
    <ellipse cx="9" cy="-14" rx="3" ry="2" fill="#5a1410"/>
    <path d="M-5,-3 L5,3" stroke="#3a0a0a" stroke-width="1" opacity="0.85"/>
    <!-- Suit accent (settled, dim) -->
    <line x1="0" y1="-22" x2="0" y2="14" stroke="#a82818" stroke-width="0.4" opacity="0.55" filter="url(#i8p18p2bloom)"/>
    <circle cx="-7" cy="-14" r="0.55" fill="#a82818" filter="url(#i8p18p2bloom)" opacity="0.55"/>
    <circle cx="7" cy="-14" r="0.55" fill="#a82818" filter="url(#i8p18p2bloom)" opacity="0.55"/>
    <!-- Knees and weapon -->
    <ellipse cx="-7" cy="14" rx="6" ry="3" fill="url(#i8p18p2threshArmor)"/>
    <ellipse cx="7" cy="14" rx="6" ry="3" fill="url(#i8p18p2threshArmor)"/>
    <rect x="-14" y="14" width="28" height="2" fill="#0a0408"/>
    <ellipse cx="0" cy="15" rx="3" ry="0.4" fill="#a82818" filter="url(#i8p18p2bloom)" opacity="0.4"/>

    <!-- Head LOOKING UP -->
    <ellipse cx="0" cy="-36" rx="4" ry="5" fill="url(#i8p18p2skinDual)"/>
    <!-- Buzz cut catching BOTH lights — warm below + cool grey above -->
    <path d="M-5,-42 Q0,-44 5,-42 L5,-36 Q0,-38 -5,-36 Z" fill="#7a2818"/>
    <!-- Cool grey catch on TOP of hair (sky light) -->
    <ellipse cx="0" cy="-44" rx="4" ry="0.85" fill="#a8b8c8" filter="url(#i8p18p2bloom)" opacity="0.85"/>
    <!-- Warm catch on BOTTOM of hair/face (gaslight) -->
    <ellipse cx="0" cy="-36" rx="4" ry="0.85" fill="#ffd898" filter="url(#i8p18p2bloom)" opacity="0.55"/>
    <!-- Eyes — looking up -->
    <line x1="-1" y1="-37" x2="0" y2="-39" stroke="#1a0808" stroke-width="0.7"/>
    <line x1="2" y1="-39" x2="3" y2="-37" stroke="#1a0808" stroke-width="0.7"/>

    <!-- ===== EXHALED BREATH — visible in cold air ===== -->
  </g>
  <!-- Breath wisp (catching last gaslight) -->
  <g transform="translate(140 200)" filter="url(#i8p18p2bloom)">
    <ellipse cx="0" cy="0" rx="14" ry="6" fill="url(#i8p18p2breathCatch)" filter="url(#i8p18p2glow)" opacity="0.85"/>
    <ellipse cx="3" cy="-6" rx="11" ry="4" fill="url(#i8p18p2breathCatch)" filter="url(#i8p18p2glow)" opacity="0.7"/>
    <ellipse cx="7" cy="-15" rx="9" ry="3" fill="url(#i8p18p2breathCatch)" filter="url(#i8p18p2glow)" opacity="0.55"/>
    <ellipse cx="11" cy="-22" rx="6" ry="2" fill="#a8b8c8" opacity="0.4"/>
  </g>

  <!-- Subtle warm halo at her position -->
  <ellipse cx="140" cy="240" rx="14" ry="6" fill="#3a0a0a" opacity="0.4" filter="url(#i8p18p2glow)"/>

  <!-- (No dialogue — the breath IS the panel) -->

  <!-- Brushwork overlay -->
  <g stroke="#040408" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
