<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 9 — Panel 1: Theodore on hands and knees, Luma marks weak mortar joints — giant hands guided by tiny technology</title>
  <desc>35mm medium wide eye level near altar of abandoned church. Theodore on hands and knees on dusty stone floor, oil-stained fingers testing mortar joints, feeling for give. Beside his left hand on floor, Luma stands — tiny figure in sapphire-violet suit, scanner projecting downward, marking spots on stone with small blue-violet holographic indicators. Holographic lenses scroll data. Theodore's hands clever and careful, brass gear ring catching grey light. Church floor thick with dust — movements have cleared paths. Grey light from boarded windows. Blue-violet holographic indicators scattered like stars on stone floor.</desc>

  <defs>
    <linearGradient id="i8p9p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="i8p9p1stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="i8p9p1greyLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#a8a8b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p9p1violetField" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p9p1waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p9p1trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i8p9p1lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p9p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p9p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p9p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p9p1strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p9p1megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p9p1bg)"/>

  <!-- Grey filtered light from above (boarded windows) -->
  <ellipse cx="371" cy="0" rx="500" ry="120" fill="url(#i8p9p1greyLight)" filter="url(#i8p9p1megaglow)"/>

  <!-- Violet field around Luma's scan area -->
  <ellipse cx="280" cy="220" rx="220" ry="80" fill="url(#i8p9p1violetField)" filter="url(#i8p9p1megaglow)"/>

  <!-- Stone wall hint (background) -->
  <rect x="0" y="0" width="742" height="80" fill="#2a2030"/>
  <g stroke="#1a0808" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="100" y1="0" x2="100" y2="40"/>
    <line x1="220" y1="0" x2="220" y2="40"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="540" y1="0" x2="540" y2="40"/>
    <line x1="640" y1="0" x2="640" y2="40"/>
  </g>

  <!-- Pews silhouette in background -->
  <g fill="#3a2010" opacity="0.85">
    <rect x="20" y="120" width="80" height="6"/>
    <rect x="20" y="115" width="3" height="11"/>
    <rect x="98" y="115" width="3" height="11"/>
    <rect x="640" y="120" width="80" height="6"/>
    <rect x="640" y="115" width="3" height="11"/>
    <rect x="718" y="115" width="3" height="11"/>
  </g>

  <!-- ===== STONE FLOOR (dusty, stretching) ===== -->
  <rect x="0" y="160" width="742" height="140" fill="url(#i8p9p1stone)"/>
  <!-- Stone block lines -->
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.7">
    <line x1="0" y1="200" x2="742" y2="200"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
    <line x1="0" y1="280" x2="742" y2="280"/>
    <line x1="80" y1="160" x2="80" y2="200"/>
    <line x1="200" y1="160" x2="200" y2="200"/>
    <line x1="320" y1="160" x2="320" y2="200"/>
    <line x1="440" y1="160" x2="440" y2="200"/>
    <line x1="560" y1="160" x2="560" y2="200"/>
    <line x1="680" y1="160" x2="680" y2="200"/>
    <line x1="40" y1="200" x2="40" y2="240"/>
    <line x1="160" y1="200" x2="160" y2="240"/>
    <line x1="280" y1="200" x2="280" y2="240"/>
    <line x1="400" y1="200" x2="400" y2="240"/>
    <line x1="520" y1="200" x2="520" y2="240"/>
    <line x1="640" y1="200" x2="640" y2="240"/>
    <line x1="100" y1="240" x2="100" y2="280"/>
    <line x1="240" y1="240" x2="240" y2="280"/>
    <line x1="380" y1="240" x2="380" y2="280"/>
    <line x1="520" y1="240" x2="520" y2="280"/>
  </g>
  <!-- Dust on floor (heavy) -->
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="120" cy="180" rx="60" ry="6"/>
    <ellipse cx="380" cy="190" rx="80" ry="7"/>
    <ellipse cx="600" cy="180" rx="60" ry="6"/>
    <ellipse cx="180" cy="240" rx="50" ry="6"/>
    <ellipse cx="500" cy="260" rx="70" ry="6"/>
  </g>
  <!-- Cleared paths in dust (where Theodore has knelt) -->
  <ellipse cx="280" cy="220" rx="120" ry="14" fill="#3a2818" opacity="0.7"/>
  <line x1="180" y1="220" x2="380" y2="220" stroke="#5a4838" stroke-width="0.4" opacity="0.55"/>

  <!-- ===== HOLOGRAPHIC INDICATORS scattered like stars on the floor ===== -->
  <g filter="url(#i8p9p1bloom)" opacity="0.95">
    <!-- Cluster around target area -->
    <circle cx="200" cy="200" r="2" fill="#a878e8"/>
    <circle cx="240" cy="220" r="2" fill="#a878e8"/>
    <circle cx="260" cy="180" r="1.4" fill="#a878e8"/>
    <circle cx="290" cy="240" r="2" fill="#a878e8"/>
    <circle cx="320" cy="200" r="1.4" fill="#a878e8"/>
    <!-- BRIGHTER target marker (the loose stone) -->
    <circle cx="280" cy="210" r="3" fill="#c8a8e8" filter="url(#i8p9p1strongglow)"/>
    <circle cx="280" cy="210" r="1.4" fill="#fff"/>
    <!-- Distant scattered indicators -->
    <circle cx="120" cy="240" r="1.4" fill="#a878e8"/>
    <circle cx="360" cy="240" r="1.4" fill="#a878e8"/>
    <circle cx="400" cy="200" r="1.4" fill="#a878e8"/>
    <circle cx="440" cy="220" r="1" fill="#a878e8"/>
    <circle cx="480" cy="240" r="1" fill="#a878e8"/>
  </g>

  <!-- ===== THEODORE on hands and knees ===== -->
  <g transform="translate(420 180)">
    <!-- Trousers (hindquarters in air) -->
    <path d="M0,30 L80,40 L80,80 L0,80 Z" fill="url(#i8p9p1trousers)"/>
    <!-- Patches -->
    <rect x="20" y="55" width="14" height="9" fill="#7a5028" opacity="0.85"/>
    <line x1="20" y1="58" x2="34" y2="58" stroke="#3a2010" stroke-width="0.4"/>
    <!-- Legs bent under -->
    <path d="M40,80 L60,120 L80,120 L70,80 Z" fill="url(#i8p9p1trousers)"/>
    <path d="M10,80 L20,120 L40,120 L40,80 Z" fill="url(#i8p9p1trousers)"/>
    <!-- Boots -->
    <rect x="55" y="120" width="30" height="6" fill="#1a1008"/>
    <rect x="15" y="120" width="30" height="6" fill="#1a1008"/>

    <!-- Waistcoat (back visible) -->
    <path d="M-20,30 L-30,0 L-26,-30 L-14,-50 L0,-58 L18,-50 L26,-30 L40,0 L20,40 Z" fill="url(#i8p9p1waistcoat)"/>
    <!-- Buttons (back not visible — just seam) -->
    <line x1="-3" y1="-50" x2="0" y2="20" stroke="#1a0808" stroke-width="0.4"/>
    <!-- Soot on shoulder (hands have transferred dust) -->
    <ellipse cx="-9" cy="-22" rx="9" ry="3" fill="#a89878" opacity="0.55"/>

    <!-- Both arms forward, hands on floor -->
    <!-- Left arm extended forward and down -->
    <path d="M-26,-22 L-66,-7 L-72,3 L-30,-9 Z" fill="url(#i8p9p1waistcoat)"/>
    <!-- Right arm extended forward and down -->
    <path d="M22,-30 L-22,-3 L-18,9 L18,-14 Z" fill="url(#i8p9p1waistcoat)"/>

    <!-- ===== HANDS ON FLOOR (testing mortar) ===== -->
    <!-- Left hand (further back, palm down) -->
    <ellipse cx="-72" cy="3" rx="14" ry="6" fill="url(#i8p9p1skin)"/>
    <!-- Brass gear ring -->
    <circle cx="-78" cy="0" r="2" fill="#a86838" stroke="#3a1808" stroke-width="0.55"/>
    <ellipse cx="-78" cy="-1" rx="1.4" ry="0.55" fill="#ffd898" filter="url(#i8p9p1bloom)" opacity="0.85"/>
    <!-- Fingers spread -->
    <ellipse cx="-86" cy="0" rx="3" ry="2" fill="url(#i8p9p1skin)"/>
    <ellipse cx="-82" cy="-7" rx="3" ry="2" fill="url(#i8p9p1skin)"/>
    <ellipse cx="-78" cy="9" rx="3" ry="2" fill="url(#i8p9p1skin)"/>
    <!-- Oil stains -->
    <ellipse cx="-72" cy="3" rx="4" ry="2" fill="#1a0606" opacity="0.7"/>

    <!-- Right hand (forward, fingers pressed to mortar joint) -->
    <ellipse cx="-22" cy="-3" rx="14" ry="6" fill="url(#i8p9p1skin)"/>
    <!-- Index finger pressed down to test -->
    <ellipse cx="-30" cy="-7" rx="6" ry="2.5" fill="url(#i8p9p1skin)"/>
    <ellipse cx="-36" cy="-9" rx="3" ry="1.4" fill="url(#i8p9p1skin)"/>
    <!-- Other fingers spread -->
    <ellipse cx="-26" cy="3" rx="6" ry="2" fill="url(#i8p9p1skin)"/>
    <ellipse cx="-22" cy="11" rx="6" ry="2" fill="url(#i8p9p1skin)"/>
    <!-- Oil stains -->
    <ellipse cx="-26" cy="-3" rx="4" ry="2" fill="#1a0606" opacity="0.7"/>
    <!-- Pressing on the bright marker -->
    <ellipse cx="-36" cy="-9" rx="3" ry="1.4" fill="#c8a8e8" filter="url(#i8p9p1bloom)" opacity="0.4"/>

    <!-- Head — looking down at hands/floor -->
    <ellipse cx="-26" cy="-50" rx="14" ry="14" fill="url(#i8p9p1skin)"/>
    <!-- Untidy hair falling forward -->
    <path d="M-40,-58 Q-22,-66 -11,-58 L-11,-44 Q-22,-50 -32,-44 L-40,-44 Z" fill="#7a5028"/>
    <!-- Hair falling forward (cowlick) -->
    <path d="M-32,-58 L-30,-50" stroke="#7a5028" stroke-width="2"/>
    <ellipse cx="-26" cy="-66" rx="9" ry="2" fill="#a8a8b8" opacity="0.55" filter="url(#i8p9p1bloom)"/>

    <!-- Eyes — looking down (downcast lashes) -->
    <line x1="-32" y1="-50" x2="-26" y2="-49" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="-22" y1="-49" x2="-14" y2="-50" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Brows -->
    <line x1="-34" y1="-54" x2="-26" y2="-55" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="-22" y1="-55" x2="-14" y2="-54" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Mouth — concentrated, slight tongue between teeth -->
    <ellipse cx="-22" cy="-44" rx="2" ry="1" fill="#3a1808"/>
    <ellipse cx="-22" cy="-45" rx="0.85" ry="0.55" fill="#a82818" opacity="0.7"/>
  </g>

  <!-- ===== LUMA on floor beside Theodore's left hand, scanner pointing downward ===== -->
  <g transform="translate(290 220)">
    <!-- Body -->
    <path d="M-5,11 L-7,3 L-9,-7 L-7,-15 L-3,-22 L3,-22 L7,-15 L9,-7 L7,3 L5,11 Z" fill="url(#i8p9p1lumaSuit)"/>
    <!-- Suit accent -->
    <line x1="0" y1="-15" x2="0" y2="9" stroke="#c8a8e8" stroke-width="0.55" opacity="0.85" filter="url(#i8p9p1bloom)"/>

    <!-- Arm holding scanner DOWNWARD -->
    <path d="M7,-7 L11,3 L7,11 L3,3 Z" fill="url(#i8p9p1lumaSuit)"/>
    <ellipse cx="11" cy="3" rx="2" ry="1.4" fill="url(#i8p9p1skin)"/>

    <!-- Scanner pointed down at floor -->
    <rect x="9" y="3" width="6" height="9" fill="#3a1858"/>
    <ellipse cx="12" cy="14" rx="3" ry="0.85" fill="#a878e8" filter="url(#i8p9p1strongglow)" opacity="0.95"/>
    <!-- Scanner beam going down -->
    <line x1="12" y1="14" x2="14" y2="22" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p9p1bloom)" opacity="0.95"/>

    <!-- Head -->
    <ellipse cx="0" cy="-26" rx="3" ry="4" fill="url(#i8p9p1skin)"/>
    <path d="M2,-22 Q5,-15 7,3" stroke="#1a0808" stroke-width="1.4" fill="none"/>
    <path d="M2,-22 Q5,-15 7,3" stroke="#a878e8" stroke-width="0.4" fill="none" filter="url(#i8p9p1bloom)" opacity="0.85"/>
    <path d="M-3,-30 Q0,-32 3,-30 L3,-26 Q0,-28 -3,-26 Z" fill="#1a0808"/>
    <!-- Eyes -->
    <line x1="-2" y1="-26" x2="-1" y2="-26" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="1" y1="-26" x2="2" y2="-26" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Lens hint -->
    <circle cx="-1" cy="-26" r="0.4" fill="#a878e8" filter="url(#i8p9p1bloom)" opacity="0.85"/>
    <circle cx="1" cy="-26" r="0.4" fill="#a878e8" filter="url(#i8p9p1bloom)" opacity="0.85"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- LUMA -->
  <g>
    <rect x="14" y="14" width="380" height="50" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Two meters left. The mortar joint there is degraded —</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">the stone should be loose.</text>

  <!-- THEODORE -->
  <g>
    <rect x="408" y="14" width="320" height="36" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="416" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE</text>
  <text x="416" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">This one. I can feel it moving.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
