<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 320" width="742" height="320">
  <title>Issue 8 — Page 4 — Panel 4: The alley as canyon — single gaslight a sun, deep shadows a sea, Thresh tiny against dark brick — solitude and scale</title>
  <desc>28mm wide establishing eye level. Narrow Victorian alley at night. Brick walls rising on both sides close together, sky narrow strip of dark cloud above. Far end single gas lamp casts warm amber pool, long shadows toward viewer. Rest deep blue-black shadow. Cobblestones gleam faintly where gaslight reaches. Drainpipe runs down one wall, iron brackets like rungs. Base of near wall, barely visible in shadow, tiny figure approximately four inches tall sits with back to brick, compact weapon across knees. Alone. Alley enormous around her. Single gaslight warm beacon in cold world. The alley was a canyon. The gaslight, a sun. The silence, a sound she couldn't name.</desc>

  <defs>
    <linearGradient id="i8p4p4sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="i8p4p4brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p4p4cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <radialGradient id="i8p4p4gaslightCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d86838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p4p4gaslightHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p4p4threshSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <filter id="i8p4p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p4p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p4p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p4p4megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky strip narrow above -->
  <rect width="742" height="60" fill="url(#i8p4p4sky)"/>
  <!-- Cloud hint -->
  <ellipse cx="280" cy="30" rx="80" ry="14" fill="#3a4858" opacity="0.4" filter="url(#i8p4p4glow)"/>
  <ellipse cx="540" cy="40" rx="100" ry="11" fill="#3a4858" opacity="0.55" filter="url(#i8p4p4glow)"/>

  <!-- Brick wall LEFT (rising tall) -->
  <rect x="0" y="0" width="200" height="320" fill="url(#i8p4p4brick)"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.85">
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="0" y1="200" x2="200" y2="200"/>
    <line x1="0" y1="240" x2="200" y2="240"/>
    <line x1="0" y1="280" x2="200" y2="280"/>
    <!-- Vertical joints -->
    <line x1="60" y1="80" x2="60" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="160"/>
    <line x1="40" y1="160" x2="40" y2="200"/>
    <line x1="100" y1="200" x2="100" y2="240"/>
    <line x1="160" y1="240" x2="160" y2="280"/>
    <line x1="80" y1="280" x2="80" y2="320"/>
  </g>

  <!-- Brick wall RIGHT -->
  <rect x="540" y="0" width="202" height="320" fill="url(#i8p4p4brick)"/>
  <g stroke="#040408" stroke-width="0.55" opacity="0.85">
    <line x1="540" y1="80" x2="742" y2="80"/>
    <line x1="540" y1="120" x2="742" y2="120"/>
    <line x1="540" y1="160" x2="742" y2="160"/>
    <line x1="540" y1="200" x2="742" y2="200"/>
    <line x1="540" y1="240" x2="742" y2="240"/>
    <line x1="540" y1="280" x2="742" y2="280"/>
    <line x1="600" y1="80" x2="600" y2="120"/>
    <line x1="680" y1="120" x2="680" y2="160"/>
    <line x1="580" y1="160" x2="580" y2="200"/>
    <line x1="660" y1="200" x2="660" y2="240"/>
    <line x1="600" y1="240" x2="600" y2="280"/>
    <line x1="700" y1="280" x2="700" y2="320"/>
  </g>

  <!-- Drainpipe on right wall with iron brackets -->
  <g transform="translate(700 0)">
    <rect x="-3" y="0" width="6" height="320" fill="#3a2010"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#5a3018" stroke-width="0.55" opacity="0.7"/>
    <!-- Iron brackets like rungs -->
    <rect x="-7" y="60" width="14" height="3" fill="#1a0808"/>
    <rect x="-7" y="120" width="14" height="3" fill="#1a0808"/>
    <rect x="-7" y="180" width="14" height="3" fill="#1a0808"/>
    <rect x="-7" y="240" width="14" height="3" fill="#1a0808"/>
  </g>

  <!-- Cobblestone alley floor -->
  <rect x="200" y="240" width="340" height="80" fill="url(#i8p4p4cobble)"/>
  <!-- Cobblestone pattern -->
  <g stroke="#0a0606" stroke-width="0.55" opacity="0.7">
    <ellipse cx="240" cy="260" rx="11" ry="6" fill="none"/>
    <ellipse cx="280" cy="270" rx="11" ry="6" fill="none"/>
    <ellipse cx="320" cy="260" rx="11" ry="6" fill="none"/>
    <ellipse cx="360" cy="270" rx="11" ry="6" fill="none"/>
    <ellipse cx="400" cy="265" rx="11" ry="6" fill="none"/>
    <ellipse cx="440" cy="270" rx="11" ry="6" fill="none"/>
    <ellipse cx="480" cy="260" rx="11" ry="6" fill="none"/>
    <ellipse cx="520" cy="270" rx="11" ry="6" fill="none"/>
    <ellipse cx="260" cy="290" rx="11" ry="6" fill="none"/>
    <ellipse cx="300" cy="300" rx="11" ry="6" fill="none"/>
    <ellipse cx="340" cy="295" rx="11" ry="6" fill="none"/>
    <ellipse cx="380" cy="305" rx="11" ry="6" fill="none"/>
    <ellipse cx="420" cy="295" rx="11" ry="6" fill="none"/>
    <ellipse cx="460" cy="305" rx="11" ry="6" fill="none"/>
    <ellipse cx="500" cy="295" rx="11" ry="6" fill="none"/>
  </g>

  <!-- ===== GASLIGHT at far end ===== -->
  <g transform="translate(550 100)">
    <!-- Lamp post -->
    <rect x="-2" y="0" width="4" height="120" fill="#3a3030"/>
    <!-- Decorative bracket -->
    <path d="M0,0 L-22,-9 L-22,-7 L-2,3 Z" fill="#3a3030"/>
    <!-- Lamp housing -->
    <rect x="-22" y="-26" width="22" height="22" fill="#1a1818"/>
    <polygon points="-26,-26 4,-26 0,-36 -22,-36" fill="#3a3030"/>
    <!-- Glass pane with flame -->
    <rect x="-18" y="-22" width="14" height="16" fill="#3a1808"/>
    <ellipse cx="-11" cy="-14" rx="6" ry="9" fill="url(#i8p4p4gaslightCore)" filter="url(#i8p4p4strongglow)"/>
    <ellipse cx="-11" cy="-14" rx="3" ry="6" fill="#fff" filter="url(#i8p4p4bloom)"/>
  </g>
  <!-- Massive amber halo from gaslight -->
  <ellipse cx="540" cy="86" rx="240" ry="200" fill="url(#i8p4p4gaslightHalo)" filter="url(#i8p4p4megaglow)"/>
  <!-- Amber pool on cobblestones -->
  <ellipse cx="500" cy="270" rx="180" ry="50" fill="url(#i8p4p4gaslightHalo)" filter="url(#i8p4p4megaglow)" opacity="0.85"/>

  <!-- Cobblestones gleam where gaslight reaches -->
  <g opacity="0.85" filter="url(#i8p4p4bloom)">
    <ellipse cx="440" cy="270" rx="6" ry="3" fill="#ffd898" opacity="0.55"/>
    <ellipse cx="480" cy="265" rx="6" ry="3" fill="#ffd898" opacity="0.7"/>
    <ellipse cx="500" cy="290" rx="9" ry="3" fill="#ffd898" opacity="0.7"/>
    <ellipse cx="520" cy="270" rx="6" ry="3" fill="#ffd898" opacity="0.85"/>
  </g>

  <!-- Long shadows stretching from far end toward viewer -->
  <g opacity="0.55">
    <path d="M540,100 L240,260 L260,300 L580,180 Z" fill="#040408" filter="url(#i8p4p4glow)"/>
  </g>

  <!-- ===== THRESH at base of LEFT wall, barely visible in shadow ===== -->
  <g transform="translate(140 250)">
    <!-- Body — seated, weapon across knees -->
    <path d="M-6,18 L-9,3 L-9,-11 L-6,-22 L-3,-28 L3,-28 L6,-22 L9,-11 L9,3 L6,18 Z" fill="url(#i8p4p4threshSuit)"/>
    <!-- Heavy dents (visible only in suggestion) -->
    <ellipse cx="-7" cy="-14" rx="3" ry="2" fill="#3a0a0a" opacity="0.85"/>
    <ellipse cx="7" cy="-14" rx="3" ry="2" fill="#3a0a0a" opacity="0.85"/>
    <!-- Chest scratch -->
    <path d="M-3,-3 L3,3" stroke="#5a1010" stroke-width="0.7" opacity="0.85"/>
    <!-- Suit accent (very dim, stealth mode) -->
    <line x1="0" y1="-22" x2="0" y2="11" stroke="#a82818" stroke-width="0.4" opacity="0.55" filter="url(#i8p4p4bloom)"/>
    <!-- Knees -->
    <ellipse cx="-7" cy="14" rx="6" ry="3" fill="url(#i8p4p4threshSuit)"/>
    <ellipse cx="7" cy="14" rx="6" ry="3" fill="url(#i8p4p4threshSuit)"/>
    <!-- WEAPON across knees -->
    <rect x="-14" y="14" width="28" height="2" fill="#0a0408"/>
    <ellipse cx="0" cy="15" rx="3" ry="0.4" fill="#a82818" filter="url(#i8p4p4bloom)" opacity="0.55"/>
    <!-- Hands on weapon -->
    <ellipse cx="-9" cy="14" rx="1.4" ry="1" fill="#7a4828"/>
    <ellipse cx="9" cy="14" rx="1.4" ry="1" fill="#7a4828"/>
    <!-- Head -->
    <ellipse cx="0" cy="-36" rx="4" ry="5" fill="#a87838"/>
    <!-- Copper-red buzz cut catching faintest gaslight reflection -->
    <path d="M-5,-42 Q0,-44 5,-42 L5,-36 Q0,-38 -5,-36 Z" fill="#7a2818"/>
    <!-- Faint reflected gaslight on hair top -->
    <ellipse cx="0" cy="-43" rx="3" ry="0.85" fill="#a86828" opacity="0.55" filter="url(#i8p4p4bloom)"/>
    <!-- Eyes alert (tiny dots) -->
    <line x1="-2" y1="-36" x2="-1" y2="-36" stroke="#1a0808" stroke-width="0.7"/>
    <line x1="1" y1="-36" x2="2" y2="-36" stroke="#1a0808" stroke-width="0.7"/>
  </g>

  <!-- Subtle crimson hint at Thresh's location -->
  <ellipse cx="140" cy="240" rx="22" ry="14" fill="#3a0a0a" opacity="0.4" filter="url(#i8p4p4glow)"/>

  <!-- Barred window high on left wall -->
  <g transform="translate(80 100)" opacity="0.7">
    <rect x="-22" y="0" width="44" height="22" fill="#0a0606"/>
    <line x1="-15" y1="0" x2="-15" y2="22" stroke="#1a1410" stroke-width="0.85"/>
    <line x1="0" y1="0" x2="0" y2="22" stroke="#1a1410" stroke-width="0.85"/>
    <line x1="15" y1="0" x2="15" y2="22" stroke="#1a1410" stroke-width="0.85"/>
  </g>

  <!-- ===== CAPTION ===== -->
  <g>
    <rect x="14" y="14" width="380" height="50" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">Thresh took first watch. The alley was a canyon.</text>
  <text x="22" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">The gaslight, a sun.</text>
  <text x="22" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic" font-weight="700">The silence, a sound she couldn't name.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
