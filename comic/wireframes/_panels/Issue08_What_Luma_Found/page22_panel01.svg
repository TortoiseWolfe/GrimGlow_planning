<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 22 — Panel 1: St. Elspeth's in its living days — golden afternoon, parishioners arrive, the church alive — "built on sacred ground"</title>
  <desc>28mm wide establishing eye level. Victorian-era church alive intact tended. St. Elspeth's living days. Stained glass windows whole catching golden afternoon sunlight. Stone clean, churchyard green, iron railings upright, headstones orderly. Parishioners approach in Sunday dress — men in hats, women in shawls, children in tow. Priest in vestments stands at open door welcoming. Scene warm, communal, ordinary — church at center of neighborhood's life. Golden afternoon light bathes everything. Ivy trimmed. Gate open.</desc>

  <defs>
    <linearGradient id="i8p22p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd898"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="i8p22p1stoneNorman" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#7a6048"/>
    </linearGradient>
    <linearGradient id="i8p22p1stoneGothic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a8868"/>
      <stop offset="100%" stop-color="#6a5040"/>
    </linearGradient>
    <linearGradient id="i8p22p1grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a7038"/>
      <stop offset="100%" stop-color="#3a5028"/>
    </linearGradient>
    <linearGradient id="i8p22p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5828"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </linearGradient>
    <radialGradient id="i8p22p1goldenSun" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p22p1stainedGlassRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a82018" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a1018" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="i8p22p1stainedGlassGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="i8p22p1stainedGlassBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4878b8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2a4878" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="i8p22p1cassock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p22p1coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="i8p22p1shawl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p22p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p22p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p22p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p22p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p22p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky — GOLDEN afternoon -->
  <rect width="742" height="80" fill="url(#i8p22p1sky)"/>
  <!-- Sun in upper right -->
  <ellipse cx="600" cy="20" rx="320" ry="200" fill="url(#i8p22p1goldenSun)" filter="url(#i8p22p1megaglow)"/>

  <!-- ===== ST. ELSPETH'S CHURCH — alive, intact, golden ===== -->
  <!-- Norman lower courses (clean stone) -->
  <rect x="220" y="160" width="380" height="80" fill="url(#i8p22p1stoneNorman)"/>
  <!-- Stone block lines (visible, clean) -->
  <g stroke="#5a4828" stroke-width="0.85" opacity="0.85">
    <line x1="220" y1="180" x2="600" y2="180"/>
    <line x1="220" y1="200" x2="600" y2="200"/>
    <line x1="220" y1="220" x2="600" y2="220"/>
    <line x1="280" y1="160" x2="278" y2="180"/>
    <line x1="360" y1="160" x2="362" y2="180"/>
    <line x1="440" y1="160" x2="438" y2="180"/>
    <line x1="520" y1="160" x2="522" y2="180"/>
    <line x1="260" y1="180" x2="258" y2="200"/>
    <line x1="320" y1="180" x2="322" y2="200"/>
    <line x1="400" y1="180" x2="398" y2="200"/>
    <line x1="480" y1="180" x2="482" y2="200"/>
    <line x1="560" y1="180" x2="558" y2="200"/>
    <line x1="240" y1="200" x2="242" y2="220"/>
    <line x1="320" y1="200" x2="318" y2="220"/>
    <line x1="400" y1="200" x2="402" y2="220"/>
    <line x1="480" y1="200" x2="478" y2="220"/>
  </g>
  <!-- Light catches on stone -->
  <line x1="220" y1="160" x2="600" y2="160" stroke="#fff8d8" stroke-width="0.85" filter="url(#i8p22p1bloom)" opacity="0.7"/>

  <!-- Gothic upper section -->
  <rect x="240" y="60" width="340" height="100" fill="url(#i8p22p1stoneGothic)"/>
  <g stroke="#5a4828" stroke-width="0.55" opacity="0.7">
    <line x1="240" y1="90" x2="580" y2="90"/>
    <line x1="240" y1="120" x2="580" y2="120"/>
    <line x1="300" y1="60" x2="298" y2="90"/>
    <line x1="380" y1="60" x2="382" y2="90"/>
    <line x1="460" y1="60" x2="458" y2="90"/>
    <line x1="540" y1="60" x2="542" y2="90"/>
  </g>

  <!-- ===== INTACT POINTED ARCH STAINED GLASS WINDOWS ===== -->
  <!-- Left window -->
  <g transform="translate(310 110)">
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40 Z" fill="#3a2818"/>
    <!-- Stained glass panes (red, gold, blue) -->
    <rect x="-22" y="-30" width="22" height="22" fill="url(#i8p22p1stainedGlassRed)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="-30" width="22" height="22" fill="url(#i8p22p1stainedGlassGold)" filter="url(#i8p22p1bloom)"/>
    <rect x="-22" y="-8" width="22" height="22" fill="url(#i8p22p1stainedGlassBlue)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="-8" width="22" height="22" fill="url(#i8p22p1stainedGlassRed)" filter="url(#i8p22p1bloom)"/>
    <rect x="-22" y="14" width="22" height="22" fill="url(#i8p22p1stainedGlassGold)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="14" width="22" height="22" fill="url(#i8p22p1stainedGlassBlue)" filter="url(#i8p22p1bloom)"/>
    <!-- Lead came -->
    <g stroke="#1a0808" stroke-width="0.55" fill="none" opacity="0.85">
      <line x1="-22" y1="-8" x2="22" y2="-8"/>
      <line x1="-22" y1="14" x2="22" y2="14"/>
      <line x1="0" y1="-30" x2="0" y2="40"/>
    </g>
    <!-- Stone arch -->
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40" stroke="#5a4828" stroke-width="2" fill="none"/>
  </g>

  <!-- Center window (largest) -->
  <g transform="translate(410 100)">
    <path d="M-26,50 L-26,-9 Q-26,-40 0,-40 Q26,-40 26,-9 L26,50 Z" fill="#3a2818"/>
    <rect x="-26" y="-40" width="26" height="22" fill="url(#i8p22p1stainedGlassGold)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="-40" width="26" height="22" fill="url(#i8p22p1stainedGlassRed)" filter="url(#i8p22p1bloom)"/>
    <rect x="-26" y="-18" width="26" height="22" fill="url(#i8p22p1stainedGlassBlue)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="-18" width="26" height="22" fill="url(#i8p22p1stainedGlassGold)" filter="url(#i8p22p1bloom)"/>
    <rect x="-26" y="4" width="26" height="22" fill="url(#i8p22p1stainedGlassRed)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="4" width="26" height="22" fill="url(#i8p22p1stainedGlassBlue)" filter="url(#i8p22p1bloom)"/>
    <rect x="-26" y="26" width="26" height="22" fill="url(#i8p22p1stainedGlassGold)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="26" width="26" height="22" fill="url(#i8p22p1stainedGlassRed)" filter="url(#i8p22p1bloom)"/>
    <g stroke="#1a0808" stroke-width="0.55" fill="none" opacity="0.85">
      <line x1="-26" y1="-18" x2="26" y2="-18"/>
      <line x1="-26" y1="4" x2="26" y2="4"/>
      <line x1="-26" y1="26" x2="26" y2="26"/>
      <line x1="0" y1="-40" x2="0" y2="48"/>
    </g>
    <path d="M-26,50 L-26,-9 Q-26,-40 0,-40 Q26,-40 26,-9 L26,50" stroke="#5a4828" stroke-width="2" fill="none"/>
  </g>

  <!-- Right window -->
  <g transform="translate(510 110)">
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40 Z" fill="#3a2818"/>
    <rect x="-22" y="-30" width="22" height="22" fill="url(#i8p22p1stainedGlassBlue)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="-30" width="22" height="22" fill="url(#i8p22p1stainedGlassRed)" filter="url(#i8p22p1bloom)"/>
    <rect x="-22" y="-8" width="22" height="22" fill="url(#i8p22p1stainedGlassGold)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="-8" width="22" height="22" fill="url(#i8p22p1stainedGlassBlue)" filter="url(#i8p22p1bloom)"/>
    <rect x="-22" y="14" width="22" height="22" fill="url(#i8p22p1stainedGlassRed)" filter="url(#i8p22p1bloom)"/>
    <rect x="0" y="14" width="22" height="22" fill="url(#i8p22p1stainedGlassGold)" filter="url(#i8p22p1bloom)"/>
    <g stroke="#1a0808" stroke-width="0.55" fill="none" opacity="0.85">
      <line x1="-22" y1="-8" x2="22" y2="-8"/>
      <line x1="-22" y1="14" x2="22" y2="14"/>
      <line x1="0" y1="-30" x2="0" y2="40"/>
    </g>
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40" stroke="#5a4828" stroke-width="2" fill="none"/>
  </g>

  <!-- Roof/parapet -->
  <path d="M240,60 L260,40 L320,40 L340,55 L380,40 L440,40 L460,55 L500,40 L560,40 L580,60 Z" fill="#7a6048"/>

  <!-- Cross/spire -->
  <g transform="translate(410 30)">
    <rect x="-2" y="0" width="4" height="22" fill="#5a4838"/>
    <rect x="-7" y="6" width="14" height="3" fill="#5a4838"/>
  </g>
  <!-- Cross catches sun -->
  <ellipse cx="410" cy="24" rx="9" ry="3" fill="#fff8d8" filter="url(#i8p22p1bloom)" opacity="0.85"/>

  <!-- ===== OPEN DOOR (welcoming) ===== -->
  <g transform="translate(410 220)">
    <rect x="-22" y="0" width="44" height="40" fill="#1a0808"/>
    <path d="M-22,0 Q-22,-11 0,-11 Q22,-11 22,0" fill="#1a0808"/>
    <!-- DOOR OPEN — interior visible (warm light from inside) -->
    <ellipse cx="0" cy="20" rx="14" ry="22" fill="#a86838" filter="url(#i8p22p1strongglow)" opacity="0.85"/>
    <!-- Door frame -->
    <path d="M-22,0 Q-22,-11 0,-11 Q22,-11 22,0 L22,40 L-22,40 Z" stroke="#5a4828" stroke-width="2" fill="none"/>
  </g>

  <!-- ===== CHURCHYARD GREEN AND TENDED ===== -->
  <rect x="0" y="240" width="742" height="60" fill="url(#i8p22p1grass)"/>
  <!-- Grass texture (tended) -->
  <g stroke="#3a5028" stroke-width="0.55" opacity="0.7">
    <line x1="40" y1="265" x2="40" y2="260"/>
    <line x1="80" y1="270" x2="80" y2="265"/>
    <line x1="120" y1="265" x2="120" y2="260"/>
    <line x1="180" y1="270" x2="180" y2="265"/>
    <line x1="240" y1="265" x2="240" y2="260"/>
    <line x1="600" y1="270" x2="600" y2="265"/>
    <line x1="660" y1="265" x2="660" y2="260"/>
    <line x1="700" y1="270" x2="700" y2="265"/>
  </g>

  <!-- Headstones (orderly, clean) -->
  <g transform="translate(80 270)" opacity="0.85">
    <path d="M-7,0 L-9,-22 L9,-22 L7,0 Z" fill="#a89878"/>
    <line x1="-7" y1="-11" x2="7" y2="-11" stroke="#5a4828" stroke-width="0.4"/>
  </g>
  <g transform="translate(180 280)" opacity="0.7">
    <path d="M-6,0 L-7,-18 L7,-18 L6,0 Z" fill="#a89878"/>
  </g>
  <g transform="translate(620 275)" opacity="0.7">
    <path d="M-7,0 L-9,-22 L9,-22 L7,0 Z" fill="#a89878"/>
  </g>

  <!-- Cobblestone path leading to door -->
  <path d="M340,300 L380,240 L440,240 L480,300 Z" fill="url(#i8p22p1cobble)"/>
  <g stroke="#5a3818" stroke-width="0.4" opacity="0.55">
    <ellipse cx="380" cy="260" rx="14" ry="3"/>
    <ellipse cx="430" cy="260" rx="14" ry="3"/>
    <ellipse cx="380" cy="280" rx="14" ry="3"/>
    <ellipse cx="430" cy="280" rx="14" ry="3"/>
  </g>

  <!-- ===== IRON RAILINGS (upright, in repair) ===== -->
  <g stroke="#3a3030" stroke-width="2" fill="none">
    <line x1="20" y1="240" x2="20" y2="280"/>
    <line x1="60" y1="240" x2="60" y2="280"/>
    <line x1="100" y1="240" x2="100" y2="280"/>
    <line x1="140" y1="240" x2="140" y2="280"/>
    <line x1="200" y1="240" x2="200" y2="280"/>
    <line x1="240" y1="240" x2="240" y2="280"/>
    <line x1="580" y1="240" x2="580" y2="280"/>
    <line x1="640" y1="240" x2="640" y2="280"/>
    <line x1="680" y1="240" x2="680" y2="280"/>
    <line x1="720" y1="240" x2="720" y2="280"/>
    <line x1="0" y1="240" x2="280" y2="240"/>
    <line x1="540" y1="240" x2="742" y2="240"/>
    <!-- Spear tips -->
    <line x1="20" y1="240" x2="20" y2="234"/>
    <line x1="60" y1="240" x2="60" y2="234"/>
    <line x1="100" y1="240" x2="100" y2="234"/>
    <line x1="140" y1="240" x2="140" y2="234"/>
    <line x1="200" y1="240" x2="200" y2="234"/>
    <line x1="240" y1="240" x2="240" y2="234"/>
    <line x1="580" y1="240" x2="580" y2="234"/>
    <line x1="640" y1="240" x2="640" y2="234"/>
    <line x1="680" y1="240" x2="680" y2="234"/>
    <line x1="720" y1="240" x2="720" y2="234"/>
  </g>

  <!-- ===== GATE OPEN ===== -->
  <g transform="translate(290 260)">
    <line x1="0" y1="-20" x2="-3" y2="-26" stroke="#3a3030" stroke-width="2"/>
    <line x1="-30" y1="-20" x2="-30" y2="20" stroke="#3a3030" stroke-width="2"/>
    <!-- Open gate (swung outward) -->
    <g transform="rotate(-30 -30 -20)">
      <rect x="-30" y="-20" width="40" height="40" fill="none" stroke="#3a3030" stroke-width="2"/>
      <line x1="-30" y1="0" x2="10" y2="0" stroke="#3a3030" stroke-width="0.85"/>
    </g>
  </g>

  <!-- ===== TRIMMED IVY (small, contained) ===== -->
  <g fill="#3a5028" opacity="0.7">
    <ellipse cx="180" cy="225" rx="22" ry="4"/>
    <ellipse cx="630" cy="225" rx="22" ry="4"/>
  </g>
  <g fill="#5a7038" opacity="0.85">
    <circle cx="170" cy="223" r="1.4"/>
    <circle cx="195" cy="223" r="1.4"/>
    <circle cx="640" cy="223" r="1.4"/>
  </g>

  <!-- ===== PRIEST in vestments at door ===== -->
  <g transform="translate(410 270)">
    <!-- Cassock -->
    <path d="M-9,30 L-11,-22 L-7,-32 L0,-40 L7,-32 L11,-22 L9,30 Z" fill="url(#i8p22p1cassock)"/>
    <!-- White collar/surplice -->
    <path d="M-7,-24 L7,-24 L11,-9 L-11,-9 Z" fill="#fff" opacity="0.95"/>
    <!-- Head -->
    <ellipse cx="0" cy="-44" rx="5" ry="6" fill="url(#i8p22p1skin)"/>
    <!-- Hair -->
    <path d="M-5,-50 Q0,-52 5,-50 L5,-44 Q0,-46 -5,-44 Z" fill="#3a2818"/>
    <!-- Welcoming gesture (arms slightly out) -->
    <path d="M-11,-22 L-15,-3 L-11,3 L-7,-9 Z" fill="url(#i8p22p1cassock)"/>
    <path d="M11,-22 L15,-3 L11,3 L7,-9 Z" fill="url(#i8p22p1cassock)"/>
  </g>

  <!-- ===== PARISHIONERS approaching ===== -->
  <!-- Family 1 (left, walking up) -->
  <g transform="translate(280 275)" opacity="0.85">
    <!-- Man with hat -->
    <path d="M-9,30 L-11,-22 L-7,-32 L7,-32 L11,-22 L9,30 Z" fill="url(#i8p22p1coat)"/>
    <ellipse cx="0" cy="-40" rx="5" ry="6" fill="url(#i8p22p1skin)"/>
    <!-- Top hat -->
    <rect x="-5" y="-50" width="10" height="11" fill="#1a1818"/>
    <rect x="-7" y="-39" width="14" height="2" fill="#1a1818"/>
  </g>
  <!-- Woman in shawl -->
  <g transform="translate(310 280)" opacity="0.85">
    <path d="M-9,25 L-11,-22 L-3,-32 L7,-32 L11,-22 L9,25 Z" fill="url(#i8p22p1shawl)"/>
    <ellipse cx="0" cy="-40" rx="5" ry="6" fill="url(#i8p22p1skin)"/>
    <!-- Shawl over head -->
    <path d="M-7,-46 Q0,-50 7,-46 L11,-22 L-11,-22 Z" fill="url(#i8p22p1shawl)"/>
  </g>
  <!-- Child in tow -->
  <g transform="translate(338 285)" opacity="0.85">
    <path d="M-3,18 L-5,-9 L-3,-15 L3,-15 L5,-9 L3,18 Z" fill="#7a4828"/>
    <ellipse cx="0" cy="-22" rx="3" ry="4" fill="url(#i8p22p1skin)"/>
    <path d="M-2,-26 Q0,-28 2,-26 L2,-22 Q0,-24 -2,-22 Z" fill="#7a5028"/>
  </g>
  <!-- Family 2 (right approaching) -->
  <g transform="translate(540 280)" opacity="0.7">
    <path d="M-7,25 L-9,-18 L-5,-28 L5,-28 L9,-18 L7,25 Z" fill="url(#i8p22p1coat)"/>
    <ellipse cx="0" cy="-34" rx="4" ry="5" fill="url(#i8p22p1skin)"/>
    <rect x="-4" y="-43" width="8" height="9" fill="#1a1818"/>
  </g>
  <g transform="translate(560 285)" opacity="0.7">
    <path d="M-7,20 L-9,-18 L-3,-28 L5,-28 L9,-18 L7,20 Z" fill="url(#i8p22p1shawl)"/>
    <ellipse cx="0" cy="-34" rx="4" ry="5" fill="url(#i8p22p1skin)"/>
    <path d="M-5,-39 Q0,-43 5,-39 L9,-18 L-9,-18 Z" fill="url(#i8p22p1shawl)"/>
  </g>

  <!-- Long warm shadows from sun (pointing away from sun = left) -->
  <g opacity="0.55">
    <path d="M280,290 L240,300 L290,300 L300,290 Z" fill="#3a2818" filter="url(#i8p22p1glow)"/>
    <path d="M310,290 L270,300 L320,300 L330,290 Z" fill="#3a2818" filter="url(#i8p22p1glow)"/>
    <path d="M540,295 L500,300 L555,300 L560,295 Z" fill="#3a2818" filter="url(#i8p22p1glow)"/>
  </g>

  <!-- ===== CAPTION ===== -->
  <g>
    <rect x="14" y="14" width="380" height="32" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">The legends say St. Elspeth's was built on sacred ground.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a2818" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
