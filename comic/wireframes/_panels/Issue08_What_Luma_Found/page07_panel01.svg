<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 7 — Panel 1: Theodore navigates the old quarter at dusk — gaslight rising as daylight fades, Luma riding concealed in his waistcoat pocket</title>
  <desc>28mm wide establishing eye level. Victorian street at dusk — older architecture, timber-framed buildings leaning over narrow road, upper stories nearly touching. Gaslight from iron lamps casts warm amber pools on cobblestones as daylight fades to orange-grey at sky. Slight boy 12-13, lanky pre-teen NOT young child walks with purpose — sandy-brown untidy hair, worn leather waistcoat too large, patched wool trousers, scuffed boots. Hands in pockets. In waistcoat breast pocket, faint blue-violet glow — Luma riding concealed. Street narrows ahead, buildings older, gaslight dimmer.</desc>

  <defs>
    <linearGradient id="i8p7p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="60%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#2a2030"/>
    </linearGradient>
    <linearGradient id="i8p7p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="i8p7p1tudor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89868"/>
      <stop offset="100%" stop-color="#7a6038"/>
    </linearGradient>
    <linearGradient id="i8p7p1tudorBeams" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="i8p7p1georgian" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="i8p7p1lampPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p7p1waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p7p1trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i8p7p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p7p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p7p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p7p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p7p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky — orange-grey dusk fading to night -->
  <rect width="742" height="120" fill="url(#i8p7p1sky)"/>

  <!-- ===== TUDOR/GEORGIAN BUILDINGS leaning over the street ===== -->
  <!-- Left building (Tudor with timber framing, leaning right) -->
  <path d="M0,40 L120,30 L120,260 L0,260 Z" fill="url(#i8p7p1tudor)"/>
  <!-- Tudor timber beams (visible structural cross-beams) -->
  <g stroke="url(#i8p7p1tudorBeams)" stroke-width="3" fill="none" opacity="0.95">
    <!-- Horizontal cross-beam -->
    <line x1="0" y1="120" x2="120" y2="115"/>
    <line x1="0" y1="180" x2="120" y2="175"/>
    <!-- Vertical structural posts -->
    <line x1="40" y1="35" x2="40" y2="260"/>
    <line x1="80" y1="32" x2="80" y2="260"/>
  </g>
  <!-- Tudor X-bracing -->
  <g stroke="url(#i8p7p1tudorBeams)" stroke-width="2" fill="none" opacity="0.85">
    <path d="M0,180 L40,120"/>
    <path d="M40,180 L80,120"/>
    <path d="M80,180 L120,118"/>
    <path d="M0,260 L40,180"/>
    <path d="M40,260 L80,180"/>
  </g>
  <!-- Windows (small, leaded) -->
  <g fill="#1a1208">
    <rect x="14" y="80" width="14" height="14"/>
    <rect x="55" y="80" width="14" height="14"/>
    <rect x="95" y="80" width="14" height="14"/>
    <rect x="14" y="140" width="14" height="14"/>
    <rect x="95" y="140" width="14" height="14"/>
    <rect x="14" y="200" width="14" height="14"/>
    <rect x="55" y="200" width="14" height="14"/>
  </g>
  <!-- Warm light from one window (interior gaslight) -->
  <rect x="55" y="140" width="14" height="14" fill="#a86838" opacity="0.85"/>
  <line x1="55" y1="146" x2="69" y2="146" stroke="#1a1008" stroke-width="0.4"/>
  <line x1="62" y1="140" x2="62" y2="154" stroke="#1a1008" stroke-width="0.4"/>

  <!-- Right building (Georgian/Victorian brick, leaning left, even taller) -->
  <path d="M620,30 L742,40 L742,260 L620,260 Z" fill="url(#i8p7p1georgian)"/>
  <!-- Brick mortar -->
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="620" y1="60" x2="742" y2="60"/>
    <line x1="620" y1="80" x2="742" y2="80"/>
    <line x1="620" y1="100" x2="742" y2="100"/>
    <line x1="620" y1="120" x2="742" y2="120"/>
    <line x1="620" y1="140" x2="742" y2="140"/>
    <line x1="620" y1="160" x2="742" y2="160"/>
    <line x1="620" y1="180" x2="742" y2="180"/>
    <line x1="620" y1="200" x2="742" y2="200"/>
    <line x1="620" y1="220" x2="742" y2="220"/>
    <line x1="660" y1="40" x2="660" y2="60"/>
    <line x1="700" y1="40" x2="700" y2="60"/>
  </g>
  <!-- Tall narrow Georgian windows -->
  <g fill="#1a1208">
    <rect x="640" y="80" width="22" height="50"/>
    <rect x="690" y="80" width="22" height="50"/>
    <rect x="640" y="160" width="22" height="50"/>
    <rect x="690" y="160" width="22" height="50"/>
  </g>
  <!-- Window glow (one lit) -->
  <rect x="690" y="160" width="22" height="50" fill="#a86838" opacity="0.55"/>
  <g stroke="#1a1008" stroke-width="0.4">
    <line x1="690" y1="180" x2="712" y2="180"/>
    <line x1="701" y1="160" x2="701" y2="210"/>
  </g>

  <!-- Buildings lean toward each other — sky narrows visibly -->

  <!-- Distant darker buildings further down the street -->
  <g fill="#1a1208" opacity="0.85">
    <rect x="200" y="80" width="100" height="160"/>
    <rect x="320" y="60" width="80" height="180"/>
    <rect x="420" y="80" width="100" height="160"/>
  </g>
  <!-- Distant building details -->
  <g fill="#040408" opacity="0.7">
    <rect x="220" y="120" width="14" height="22"/>
    <rect x="270" y="120" width="14" height="22"/>
    <rect x="340" y="100" width="11" height="22"/>
    <rect x="370" y="100" width="11" height="22"/>
    <rect x="440" y="120" width="14" height="22"/>
    <rect x="490" y="120" width="14" height="22"/>
  </g>
  <!-- Distant lit windows -->
  <rect x="220" y="120" width="14" height="22" fill="#a86838" opacity="0.4"/>
  <rect x="370" y="100" width="11" height="22" fill="#a86838" opacity="0.4"/>

  <!-- ===== GASLIGHT — TWO LAMPS, the street lit by gaslight ===== -->
  <!-- Lamp 1 (mid-distance, behind Theodore) -->
  <g transform="translate(160 110)">
    <rect x="-2" y="0" width="4" height="130" fill="#3a3030"/>
    <path d="M0,0 L-22,-9 L-22,-7 L-2,3 Z" fill="#3a3030"/>
    <rect x="-22" y="-26" width="22" height="22" fill="#1a1818"/>
    <polygon points="-26,-26 4,-26 0,-36 -22,-36" fill="#3a3030"/>
    <rect x="-18" y="-22" width="14" height="16" fill="#3a1808"/>
    <ellipse cx="-11" cy="-14" rx="6" ry="9" fill="#fff8d8" filter="url(#i8p7p1strongglow)" opacity="0.85"/>
    <ellipse cx="-11" cy="-14" rx="3" ry="6" fill="#fff" filter="url(#i8p7p1bloom)"/>
  </g>
  <!-- Lamp pool 1 -->
  <ellipse cx="140" cy="240" rx="120" ry="40" fill="url(#i8p7p1lampPool)" filter="url(#i8p7p1megaglow)" opacity="0.85"/>

  <!-- Lamp 2 (further down street, dimmer) -->
  <g transform="translate(560 130)" opacity="0.85">
    <rect x="-2" y="0" width="4" height="110" fill="#3a3030"/>
    <rect x="-18" y="-22" width="18" height="18" fill="#1a1818"/>
    <polygon points="-22,-22 2,-22 -2,-30 -18,-30" fill="#3a3030"/>
    <ellipse cx="-9" cy="-12" rx="4" ry="6" fill="#fff8d8" filter="url(#i8p7p1strongglow)" opacity="0.7"/>
  </g>
  <ellipse cx="540" cy="240" rx="80" ry="22" fill="url(#i8p7p1lampPool)" filter="url(#i8p7p1megaglow)" opacity="0.55"/>

  <!-- Cobblestone street -->
  <rect x="0" y="240" width="742" height="60" fill="url(#i8p7p1cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="40" cy="260" rx="11" ry="6"/>
    <ellipse cx="100" cy="270" rx="11" ry="6"/>
    <ellipse cx="200" cy="265" rx="11" ry="6"/>
    <ellipse cx="280" cy="270" rx="11" ry="6"/>
    <ellipse cx="360" cy="265" rx="11" ry="6"/>
    <ellipse cx="440" cy="270" rx="11" ry="6"/>
    <ellipse cx="520" cy="265" rx="11" ry="6"/>
    <ellipse cx="600" cy="270" rx="11" ry="6"/>
    <ellipse cx="680" cy="265" rx="11" ry="6"/>
    <ellipse cx="80" cy="285" rx="11" ry="6"/>
    <ellipse cx="240" cy="290" rx="11" ry="6"/>
    <ellipse cx="400" cy="285" rx="11" ry="6"/>
    <ellipse cx="560" cy="290" rx="11" ry="6"/>
  </g>
  <!-- Cobblestones gleam where lamp pools touch -->
  <g opacity="0.85" filter="url(#i8p7p1bloom)">
    <ellipse cx="100" cy="270" rx="6" ry="2" fill="#ffd898" opacity="0.55"/>
    <ellipse cx="160" cy="265" rx="6" ry="2" fill="#ffd898" opacity="0.7"/>
    <ellipse cx="540" cy="270" rx="4" ry="2" fill="#ffd898" opacity="0.4"/>
  </g>

  <!-- ===== THEODORE walking with purpose, mid-stride ===== -->
  <g transform="translate(280 220)">
    <!-- Trousers (patched wool) -->
    <path d="M-9,80 L-14,30 L-9,0 L-3,-9 L9,-9 L14,0 L18,30 L14,80 Z" fill="url(#i8p7p1trousers)"/>
    <!-- Patches -->
    <rect x="-7" y="40" width="11" height="9" fill="#7a5028" opacity="0.85"/>
    <line x1="-7" y1="42" x2="4" y2="42" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="-7" y1="46" x2="4" y2="46" stroke="#3a2010" stroke-width="0.4"/>
    <!-- Walking legs (mid-stride) -->
    <path d="M-3,80 L-9,140 L-3,140 L0,80 Z" fill="url(#i8p7p1trousers)"/>
    <path d="M3,80 L9,140 L18,140 L11,80 Z" fill="url(#i8p7p1trousers)"/>
    <!-- Scuffed boots -->
    <path d="M-9,140 L-14,148 L-3,148 L-3,140 Z" fill="#1a1008"/>
    <path d="M9,140 L18,148 L11,148 L11,140 Z" fill="#1a1008"/>

    <!-- Waistcoat (worn leather, too large) -->
    <path d="M-22,-3 L-26,-32 L-18,-50 L-9,-58 L9,-58 L18,-50 L26,-32 L22,-3 L18,3 L-18,3 Z" fill="url(#i8p7p1waistcoat)"/>
    <!-- Waistcoat buttons (brass, four of them) -->
    <circle cx="0" cy="-44" r="1.4" fill="#a86838" filter="url(#i8p7p1bloom)"/>
    <circle cx="0" cy="-30" r="1.4" fill="#a86838" filter="url(#i8p7p1bloom)"/>
    <circle cx="0" cy="-15" r="1.4" fill="#a86838" filter="url(#i8p7p1bloom)"/>
    <circle cx="0" cy="-3" r="1.4" fill="#a86838" filter="url(#i8p7p1bloom)"/>
    <line x1="0" y1="-50" x2="0" y2="0" stroke="#1a0808" stroke-width="0.4"/>

    <!-- ===== BREAST POCKET with Luma's faint blue-violet glow ===== -->
    <rect x="-18" y="-44" width="14" height="14" fill="#3a2010" opacity="0.85"/>
    <line x1="-18" y1="-30" x2="-4" y2="-30" stroke="#1a0808" stroke-width="0.4"/>
    <ellipse cx="-11" cy="-37" rx="9" ry="6" fill="#a878e8" opacity="0.4" filter="url(#i8p7p1glow)"/>
    <circle cx="-11" cy="-37" r="2" fill="#c8a8e8" filter="url(#i8p7p1bloom)" opacity="0.85"/>

    <!-- Hands in trouser pockets -->
    <ellipse cx="-22" cy="-3" rx="6" ry="3" fill="url(#i8p7p1waistcoat)"/>
    <ellipse cx="22" cy="-3" rx="6" ry="3" fill="url(#i8p7p1waistcoat)"/>

    <!-- Shirt collar (white, visible at neck) -->
    <path d="M-9,-58 L-7,-62 L7,-62 L9,-58 L7,-50 L-7,-50 Z" fill="#e8d0a8"/>

    <!-- Neck -->
    <path d="M-7,-62 L7,-62 L4,-72 L-4,-72 Z" fill="url(#i8p7p1skin)"/>

    <!-- Head (12-13 boy, lanky pre-teen) -->
    <ellipse cx="0" cy="-90" rx="14" ry="16" fill="url(#i8p7p1skin)"/>

    <!-- Untidy sandy-brown hair -->
    <path d="M-14,-104 Q0,-110 14,-104 L14,-86 Q11,-100 0,-100 Q-11,-100 -14,-86 Z" fill="#7a5028"/>
    <!-- Hair tufts/cowlicks -->
    <path d="M-9,-110 L-7,-104" stroke="#7a5028" stroke-width="2" fill="none"/>
    <path d="M3,-110 L5,-104" stroke="#7a5028" stroke-width="2" fill="none"/>
    <path d="M11,-108 L9,-102" stroke="#7a5028" stroke-width="2" fill="none"/>
    <!-- Amber catch on hair -->
    <ellipse cx="0" cy="-106" rx="11" ry="3" fill="#ffd898" opacity="0.55" filter="url(#i8p7p1bloom)"/>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-92" rx="14" ry="3" fill="#7a4818" opacity="0.4"/>

    <!-- Eyes — focused, hazel, looking ahead -->
    <ellipse cx="-3" cy="-88" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="-3" cy="-88" r="0.85" fill="#5a3018"/>
    <ellipse cx="3" cy="-88" rx="2" ry="1.4" fill="#fff8e8"/>
    <circle cx="3" cy="-88" r="0.85" fill="#5a3018"/>
    <!-- Catchlight amber -->
    <circle cx="-3" cy="-89" r="0.4" fill="#ffd898" filter="url(#i8p7p1bloom)" opacity="0.85"/>
    <circle cx="3" cy="-89" r="0.4" fill="#ffd898" filter="url(#i8p7p1bloom)" opacity="0.85"/>

    <!-- Brows -->
    <line x1="-7" y1="-94" x2="-1" y2="-94" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="1" y1="-94" x2="7" y2="-94" stroke="#3a1808" stroke-width="0.7"/>

    <!-- Nose -->
    <path d="M-1,-86 L0,-78 L2,-78 L2,-86 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth — slight, focused -->
    <line x1="-3" y1="-74" x2="3" y2="-74" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- THEODORE -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">The old parish is past the brewery.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Not many go there since they shut the church.</text>

  <!-- LUMA from pocket -->
  <g>
    <rect x="408" y="14" width="320" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="416" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(from pocket)</tspan></text>
  <text x="416" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">How long has it been closed?</text>

  <!-- THEODORE 2 -->
  <g>
    <rect x="408" y="60" width="320" height="50" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="416" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE</text>
  <text x="416" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Twenty years, I think. Maybe more.</text>
  <text x="416" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Mr. Cribbage said it were condemned when he was a boy.</text>

  <!-- Brushwork overlay -->
  <g stroke="#1a1008" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
