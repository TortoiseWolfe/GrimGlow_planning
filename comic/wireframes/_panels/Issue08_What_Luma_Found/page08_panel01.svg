<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 8 — Panel 1: St. Elspeth's — the decommissioned church, Norman lower courses, Gothic boarded windows, the building that has been waiting</title>
  <desc>28mm wide slightly low angle. Decommissioned Victorian church in small overgrown churchyard — iron railings tangled with ivy, leaning headstones in long grass, padlocked iron gate. Church is stone — Norman in lower courses, heavy and ancient, Gothic pointed arches in upper windows boarded with weathered planks. Heavier and older than surrounding Victorian streets, rooted deep, settled with centuries of weight. Theodore stands at iron gate looking up — slight boy, blue-violet glow in breast pocket stronger now, Luma's scanner responding to proximity. Shadow stretches forward across churchyard from gaslight behind. Church in grey-blue shadow, stone absorbing light. Night closing.</desc>

  <defs>
    <linearGradient id="i8p8p1sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3038"/>
      <stop offset="100%" stop-color="#1a1820"/>
    </linearGradient>
    <linearGradient id="i8p8p1stoneNorman" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i8p8p1stoneGothic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3038"/>
      <stop offset="100%" stop-color="#2a1820"/>
    </linearGradient>
    <linearGradient id="i8p8p1grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3818"/>
      <stop offset="100%" stop-color="#1a1808"/>
    </linearGradient>
    <linearGradient id="i8p8p1ivy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3018"/>
      <stop offset="100%" stop-color="#0a1808"/>
    </linearGradient>
    <radialGradient id="i8p8p1distantLamp" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p8p1waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p8p1trousers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4838"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <linearGradient id="i8p8p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p8p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p8p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p8p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p8p1megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="742" height="80" fill="url(#i8p8p1sky)"/>
  <!-- Distant clouds -->
  <ellipse cx="200" cy="40" rx="120" ry="11" fill="#5a4858" opacity="0.55" filter="url(#i8p8p1glow)"/>
  <ellipse cx="540" cy="50" rx="160" ry="14" fill="#5a4858" opacity="0.55" filter="url(#i8p8p1glow)"/>

  <!-- Distant gaslight from behind Theodore (left) -->
  <ellipse cx="0" cy="200" rx="160" ry="100" fill="url(#i8p8p1distantLamp)" filter="url(#i8p8p1megaglow)"/>

  <!-- ===== ST. ELSPETH'S CHURCH — central, dominant ===== -->
  <!-- Lower Norman courses (heavy, ancient stone) -->
  <rect x="220" y="180" width="380" height="80" fill="url(#i8p8p1stoneNorman)"/>
  <!-- Norman stone block lines (large irregular) -->
  <g stroke="#1a0808" stroke-width="0.85" opacity="0.85">
    <line x1="220" y1="200" x2="600" y2="200"/>
    <line x1="220" y1="220" x2="600" y2="220"/>
    <line x1="220" y1="240" x2="600" y2="240"/>
    <line x1="280" y1="180" x2="278" y2="200"/>
    <line x1="360" y1="180" x2="362" y2="200"/>
    <line x1="440" y1="180" x2="438" y2="200"/>
    <line x1="520" y1="180" x2="522" y2="200"/>
    <line x1="260" y1="200" x2="258" y2="220"/>
    <line x1="320" y1="200" x2="322" y2="220"/>
    <line x1="400" y1="200" x2="398" y2="220"/>
    <line x1="480" y1="200" x2="482" y2="220"/>
    <line x1="560" y1="200" x2="558" y2="220"/>
    <line x1="240" y1="220" x2="242" y2="240"/>
    <line x1="320" y1="220" x2="318" y2="240"/>
    <line x1="400" y1="220" x2="402" y2="240"/>
    <line x1="480" y1="220" x2="478" y2="240"/>
  </g>
  <!-- Texture/weathering on Norman stones -->
  <g fill="#1a0808" opacity="0.55">
    <ellipse cx="280" cy="210" rx="14" ry="6"/>
    <ellipse cx="380" cy="230" rx="14" ry="6"/>
    <ellipse cx="500" cy="215" rx="14" ry="6"/>
    <ellipse cx="560" cy="240" rx="14" ry="6"/>
  </g>

  <!-- Upper Gothic section (taller, with pointed arch windows) -->
  <rect x="240" y="60" width="340" height="120" fill="url(#i8p8p1stoneGothic)"/>
  <!-- Gothic stone courses -->
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.7">
    <line x1="240" y1="90" x2="580" y2="90"/>
    <line x1="240" y1="120" x2="580" y2="120"/>
    <line x1="240" y1="150" x2="580" y2="150"/>
    <line x1="300" y1="60" x2="298" y2="90"/>
    <line x1="380" y1="60" x2="382" y2="90"/>
    <line x1="460" y1="60" x2="458" y2="90"/>
    <line x1="540" y1="60" x2="542" y2="90"/>
    <line x1="280" y1="90" x2="278" y2="120"/>
    <line x1="360" y1="90" x2="362" y2="120"/>
    <line x1="440" y1="90" x2="438" y2="120"/>
    <line x1="520" y1="90" x2="522" y2="120"/>
  </g>

  <!-- ===== POINTED GOTHIC ARCH WINDOWS (boarded) ===== -->
  <!-- Left window -->
  <g transform="translate(310 110)">
    <!-- Window frame (pointed arch) -->
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40 Z" fill="#1a0808"/>
    <!-- Boarded planks -->
    <rect x="-22" y="-22" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="-12" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="-2" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="8" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="18" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="28" width="44" height="6" fill="#3a2010"/>
    <!-- Plank gaps -->
    <line x1="-22" y1="-16" x2="22" y2="-16" stroke="#0a0408" stroke-width="0.4"/>
    <line x1="-22" y1="-6" x2="22" y2="-6" stroke="#0a0408" stroke-width="0.4"/>
    <line x1="-22" y1="4" x2="22" y2="4" stroke="#0a0408" stroke-width="0.4"/>
    <line x1="-22" y1="14" x2="22" y2="14" stroke="#0a0408" stroke-width="0.4"/>
    <line x1="-22" y1="24" x2="22" y2="24" stroke="#0a0408" stroke-width="0.4"/>
    <line x1="-22" y1="34" x2="22" y2="34" stroke="#0a0408" stroke-width="0.4"/>
    <!-- Stone arch surround -->
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40" stroke="#5a3818" stroke-width="2" fill="none"/>
    <!-- Tracery hint at top -->
    <path d="M-9,-22 Q0,-26 9,-22" stroke="#3a2010" stroke-width="0.55" fill="none" opacity="0.85"/>
  </g>

  <!-- Center window (largest) -->
  <g transform="translate(410 100)">
    <path d="M-26,50 L-26,-9 Q-26,-40 0,-40 Q26,-40 26,-9 L26,50 Z" fill="#1a0808"/>
    <rect x="-26" y="-30" width="52" height="6" fill="#3a2010"/>
    <rect x="-26" y="-20" width="52" height="6" fill="#3a2010"/>
    <rect x="-26" y="-10" width="52" height="6" fill="#3a2010"/>
    <rect x="-26" y="0" width="52" height="6" fill="#3a2010"/>
    <rect x="-26" y="10" width="52" height="6" fill="#3a2010"/>
    <rect x="-26" y="20" width="52" height="6" fill="#3a2010"/>
    <rect x="-26" y="30" width="52" height="6" fill="#3a2010"/>
    <rect x="-26" y="40" width="52" height="6" fill="#3a2010"/>
    <g stroke="#0a0408" stroke-width="0.4">
      <line x1="-26" y1="-24" x2="26" y2="-24"/>
      <line x1="-26" y1="-14" x2="26" y2="-14"/>
      <line x1="-26" y1="-4" x2="26" y2="-4"/>
      <line x1="-26" y1="6" x2="26" y2="6"/>
      <line x1="-26" y1="16" x2="26" y2="16"/>
      <line x1="-26" y1="26" x2="26" y2="26"/>
      <line x1="-26" y1="36" x2="26" y2="36"/>
    </g>
    <path d="M-26,50 L-26,-9 Q-26,-40 0,-40 Q26,-40 26,-9 L26,50" stroke="#5a3818" stroke-width="2" fill="none"/>
  </g>

  <!-- Right window -->
  <g transform="translate(510 110)">
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40 Z" fill="#1a0808"/>
    <rect x="-22" y="-22" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="-12" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="-2" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="8" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="18" width="44" height="6" fill="#3a2010"/>
    <rect x="-22" y="28" width="44" height="6" fill="#3a2010"/>
    <g stroke="#0a0408" stroke-width="0.4">
      <line x1="-22" y1="-16" x2="22" y2="-16"/>
      <line x1="-22" y1="-6" x2="22" y2="-6"/>
      <line x1="-22" y1="4" x2="22" y2="4"/>
      <line x1="-22" y1="14" x2="22" y2="14"/>
      <line x1="-22" y1="24" x2="22" y2="24"/>
      <line x1="-22" y1="34" x2="22" y2="34"/>
    </g>
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40" stroke="#5a3818" stroke-width="2" fill="none"/>
  </g>

  <!-- Roof/parapet (Gothic) -->
  <path d="M240,60 L260,40 L320,40 L340,55 L380,40 L440,40 L460,55 L500,40 L560,40 L580,60 Z" fill="#2a2030"/>

  <!-- Cross/spire at top -->
  <g transform="translate(410 30)" opacity="0.7">
    <rect x="-2" y="0" width="4" height="22" fill="#3a3030"/>
    <rect x="-7" y="6" width="14" height="3" fill="#3a3030"/>
  </g>

  <!-- Heavy wooden door (centered, in Norman section) -->
  <g transform="translate(410 220)">
    <rect x="-22" y="0" width="44" height="40" fill="#3a2010"/>
    <path d="M-22,0 Q-22,-11 0,-11 Q22,-11 22,0" fill="#3a2010"/>
    <line x1="0" y1="-11" x2="0" y2="40" stroke="#1a0808" stroke-width="0.4"/>
    <!-- Iron studs -->
    <circle cx="-14" cy="11" r="0.85" fill="#1a1818"/>
    <circle cx="14" cy="11" r="0.85" fill="#1a1818"/>
    <circle cx="-14" cy="22" r="0.85" fill="#1a1818"/>
    <circle cx="14" cy="22" r="0.85" fill="#1a1818"/>
  </g>

  <!-- ===== CHURCHYARD with iron railings + ivy ===== -->
  <!-- Iron railings -->
  <g stroke="#1a1818" stroke-width="2" fill="none">
    <line x1="20" y1="240" x2="20" y2="280"/>
    <line x1="50" y1="240" x2="50" y2="280"/>
    <line x1="80" y1="240" x2="80" y2="280"/>
    <line x1="110" y1="240" x2="110" y2="280"/>
    <line x1="140" y1="240" x2="140" y2="280"/>
    <line x1="170" y1="240" x2="170" y2="280"/>
    <line x1="200" y1="240" x2="200" y2="280"/>
    <line x1="620" y1="240" x2="620" y2="280"/>
    <line x1="650" y1="240" x2="650" y2="280"/>
    <line x1="680" y1="240" x2="680" y2="280"/>
    <line x1="710" y1="240" x2="710" y2="280"/>
    <line x1="740" y1="240" x2="740" y2="280"/>
    <line x1="0" y1="240" x2="220" y2="240"/>
    <line x1="600" y1="240" x2="742" y2="240"/>
    <!-- Spear tips -->
    <line x1="20" y1="240" x2="20" y2="234"/>
    <line x1="50" y1="240" x2="50" y2="234"/>
    <line x1="80" y1="240" x2="80" y2="234"/>
    <line x1="110" y1="240" x2="110" y2="234"/>
    <line x1="140" y1="240" x2="140" y2="234"/>
    <line x1="170" y1="240" x2="170" y2="234"/>
    <line x1="200" y1="240" x2="200" y2="234"/>
    <line x1="620" y1="240" x2="620" y2="234"/>
    <line x1="650" y1="240" x2="650" y2="234"/>
    <line x1="680" y1="240" x2="680" y2="234"/>
    <line x1="710" y1="240" x2="710" y2="234"/>
    <line x1="740" y1="240" x2="740" y2="234"/>
  </g>
  <!-- Ivy tangling the railings -->
  <g fill="url(#i8p8p1ivy)" opacity="0.85">
    <ellipse cx="50" cy="260" rx="22" ry="9"/>
    <ellipse cx="120" cy="270" rx="22" ry="9"/>
    <ellipse cx="180" cy="265" rx="22" ry="9"/>
    <ellipse cx="640" cy="265" rx="22" ry="9"/>
    <ellipse cx="700" cy="270" rx="22" ry="9"/>
  </g>
  <!-- Ivy leaf detail -->
  <g fill="#3a4818" opacity="0.85">
    <ellipse cx="60" cy="258" rx="3" ry="2"/>
    <ellipse cx="80" cy="262" rx="3" ry="2"/>
    <ellipse cx="120" cy="265" rx="3" ry="2"/>
    <ellipse cx="180" cy="263" rx="3" ry="2"/>
    <ellipse cx="640" cy="265" rx="3" ry="2"/>
  </g>

  <!-- Iron gate (padlocked, center-left at the path) -->
  <g transform="translate(220 240)">
    <rect x="-3" y="0" width="6" height="40" fill="#1a1818"/>
    <rect x="-30" y="0" width="6" height="40" fill="#1a1818"/>
    <line x1="-26" y1="0" x2="-26" y2="-7" stroke="#1a1818" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#1a1818" stroke-width="2"/>
    <line x1="-26" y1="20" x2="0" y2="20" stroke="#1a1818" stroke-width="0.85"/>
    <!-- Padlock (rusted) -->
    <rect x="-18" y="14" width="11" height="11" fill="#5a3818" stroke="#1a0808" stroke-width="0.55"/>
    <path d="M-15,14 Q-15,9 -10,9 Q-5,9 -5,14" stroke="#5a3818" stroke-width="1.4" fill="none"/>
  </g>

  <!-- Long grass / weeds in churchyard -->
  <rect x="0" y="270" width="742" height="30" fill="url(#i8p8p1grass)"/>
  <g stroke="#3a3818" stroke-width="0.85" opacity="0.85">
    <line x1="40" y1="280" x2="40" y2="270"/>
    <line x1="100" y1="280" x2="100" y2="268"/>
    <line x1="160" y1="280" x2="160" y2="270"/>
    <line x1="280" y1="285" x2="280" y2="275"/>
    <line x1="500" y1="285" x2="500" y2="275"/>
    <line x1="630" y1="280" x2="630" y2="270"/>
    <line x1="690" y1="280" x2="690" y2="268"/>
  </g>

  <!-- Leaning headstones in long grass -->
  <g transform="translate(360 280)" opacity="0.85">
    <path d="M-7,0 L-9,-22 L9,-22 L7,0 Z" fill="#5a4848" transform="rotate(-12)"/>
    <line x1="-7" y1="-11" x2="7" y2="-11" stroke="#3a2828" stroke-width="0.4" transform="rotate(-12)"/>
  </g>
  <g transform="translate(550 285)" opacity="0.85">
    <path d="M-6,0 L-7,-18 L7,-18 L6,0 Z" fill="#5a4848" transform="rotate(8)"/>
  </g>

  <!-- ===== THEODORE at the gate, looking up ===== -->
  <g transform="translate(220 250)">
    <!-- Body -->
    <path d="M-7,40 L-9,9 L-7,-22 L-3,-32 L7,-32 L11,-22 L14,9 L11,40 Z" fill="url(#i8p8p1trousers)"/>
    <!-- Waistcoat -->
    <path d="M-14,0 L-18,-22 L-14,-32 L-3,-40 L7,-40 L14,-32 L18,-22 L14,0 L11,3 L-11,3 Z" fill="url(#i8p8p1waistcoat)"/>
    <circle cx="0" cy="-26" r="0.85" fill="#a86838" filter="url(#i8p8p1bloom)"/>
    <circle cx="0" cy="-15" r="0.85" fill="#a86838" filter="url(#i8p8p1bloom)"/>
    <circle cx="0" cy="-5" r="0.85" fill="#a86838" filter="url(#i8p8p1bloom)"/>
    <!-- Breast pocket — STRONGER blue-violet glow -->
    <rect x="-11" y="-26" width="9" height="9" fill="#3a2010" opacity="0.85"/>
    <ellipse cx="-7" cy="-22" rx="11" ry="6" fill="#a878e8" opacity="0.7" filter="url(#i8p8p1strongglow)"/>
    <circle cx="-7" cy="-22" r="2" fill="#c8a8e8" filter="url(#i8p8p1bloom)" opacity="0.95"/>

    <!-- Head — turned UP, looking at church -->
    <ellipse cx="0" cy="-50" rx="9" ry="11" fill="url(#i8p8p1skin)"/>
    <path d="M-9,-58 Q0,-62 9,-58 L9,-44 Q0,-48 -9,-44 Z" fill="#7a5028"/>
    <ellipse cx="0" cy="-60" rx="6" ry="2" fill="#ffd898" opacity="0.55" filter="url(#i8p8p1bloom)"/>
    <!-- Eyes — looking up -->
    <ellipse cx="-3" cy="-52" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="-3" cy="-53" r="0.55" fill="#5a3018"/>
    <ellipse cx="3" cy="-52" rx="1.4" ry="0.85" fill="#fff8e8"/>
    <circle cx="3" cy="-53" r="0.55" fill="#5a3018"/>
    <!-- Mouth slightly open in awe -->
    <ellipse cx="0" cy="-44" rx="1.4" ry="0.85" fill="#3a1808"/>
  </g>

  <!-- Theodore's shadow stretching forward across churchyard (from gaslight behind him) -->
  <path d="M214,290 L180,300 L260,300 L226,290 Z" fill="#040408" opacity="0.55" filter="url(#i8p8p1glow)"/>

  <!-- ===== DIALOGUE ===== -->
  <!-- THEODORE -->
  <g>
    <rect x="14" y="14" width="280" height="36" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">St. Elspeth's. Been shut as long as anyone remembers.</text>

  <!-- LUMA -->
  <g>
    <rect x="14" y="60" width="380" height="50" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(from pocket)</tspan></text>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">The resonance is strong here. Very strong.</text>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">Theodore — there's something beneath this building.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
