<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 1 — Panel 2: Luma medium close-up gesturing at the fairy glyph display — scientific precision, controlled excitement beneath</title>
  <desc>50mm medium close-up eye level. Luma gestures at hovering holographic display showing enlarged geometric glyph — precise alien script in structured blue-violet, annotated with layered analysis data in smaller geometric characters. Holographic lenses scrolling data. Free hand traces glyph contours in air. Sapphire-violet suit ink-stained at hands and wrists. Holographic nodes pulse at collar and joints. Filament in braid responds with sympathetic glow. Controlled scientific precision with visible significance beneath.</desc>

  <defs>
    <linearGradient id="i8p1p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0814"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <radialGradient id="i8p1p2violetMain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#5a4ab8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p1p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p1p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i8p1p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p1p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p1p2strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p1p2megaglow"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="i8p1p2dataPulse"><feGaussianBlur stdDeviation="0.85"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p1p2bg)"/>

  <!-- Violet halo from holographic display -->
  <ellipse cx="247" cy="150" rx="240" ry="180" fill="url(#i8p1p2violetMain)" filter="url(#i8p1p2megaglow)"/>

  <!-- ===== HOLOGRAPHIC DISPLAY — fairy glyph enlarged ===== -->
  <g transform="translate(247 150)">
    <!-- Display frame -->
    <rect x="-90" y="-100" width="180" height="200" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p1p2bloom)" opacity="0.85"/>
    <!-- Inner viewport -->
    <rect x="-80" y="-90" width="160" height="180" fill="#1a1858" opacity="0.4"/>

    <!-- ===== THE FAIRY GLYPH — geometric alien script ===== -->
    <g stroke="#c8a8e8" stroke-width="2" fill="none" filter="url(#i8p1p2bloom)" opacity="0.95">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="44"/>
      <!-- Inner pentagon -->
      <polygon points="0,-30 28,-9 18,22 -18,22 -28,-9"/>
      <!-- Central rune -->
      <path d="M-11,-22 L0,-9 L11,-22"/>
      <path d="M-11,-22 L11,-22"/>
      <line x1="0" y1="-9" x2="0" y2="11"/>
      <path d="M-9,11 L9,11"/>
      <path d="M-7,18 L7,18"/>
      <!-- Outer marks -->
      <line x1="-44" y1="0" x2="-32" y2="0"/>
      <line x1="44" y1="0" x2="32" y2="0"/>
      <line x1="0" y1="-44" x2="0" y2="-36"/>
      <line x1="0" y1="44" x2="0" y2="36"/>
      <!-- Diagonal struts -->
      <line x1="-32" y1="-32" x2="-22" y2="-22"/>
      <line x1="32" y1="-32" x2="22" y2="-22"/>
      <line x1="-32" y1="32" x2="-22" y2="22"/>
      <line x1="32" y1="32" x2="22" y2="22"/>
    </g>
    <!-- Glyph fill glow -->
    <circle cx="0" cy="0" r="11" fill="#a878e8" filter="url(#i8p1p2strongglow)" opacity="0.55"/>

    <!-- ===== ANNOTATION DATA layered ===== -->
    <g fill="#c8a8e8" filter="url(#i8p1p2dataPulse)" opacity="0.95">
      <!-- Top annotations -->
      <text x="-78" y="-78" font-family="monospace" font-size="3.5">GLYPH//ID-01-CLERKENWELL</text>
      <text x="-78" y="-70" font-family="monospace" font-size="3">ENC-ETCHED  TOOL: PHYSICAL</text>
      <text x="-78" y="-62" font-family="monospace" font-size="3">SIG: FAIRY-GEO/v3</text>
      <!-- Right side -->
      <text x="46" y="-50" font-family="monospace" font-size="3">DEPTH 0.4mm</text>
      <text x="46" y="-42" font-family="monospace" font-size="3">EROS:18%</text>
      <text x="46" y="-30" font-family="monospace" font-size="3">AGE:~60y</text>
      <!-- Bottom -->
      <text x="-78" y="62" font-family="monospace" font-size="3">CROSS-REF: 11 SITES</text>
      <text x="-78" y="70" font-family="monospace" font-size="3">RADIUS: 2 mi</text>
      <text x="-78" y="78" font-family="monospace" font-size="3">PATTERN: NON-RANDOM</text>
      <text x="-78" y="86" font-family="monospace" font-size="3">SOURCE: SINGLE OPERATIVE?</text>
    </g>
    <!-- Pointer arrows -->
    <g stroke="#c8a8e8" stroke-width="0.4" filter="url(#i8p1p2bloom)" opacity="0.85">
      <line x1="-30" y1="-30" x2="-50" y2="-50"/>
      <line x1="30" y1="30" x2="50" y2="50"/>
      <line x1="22" y1="-22" x2="44" y2="-30"/>
    </g>

    <!-- Scrolling data lines around glyph -->
    <g stroke="#a878e8" stroke-width="0.4" fill="none" filter="url(#i8p1p2bloom)" opacity="0.55">
      <line x1="-90" y1="-22" x2="-50" y2="-22" stroke-dasharray="2,1.5"/>
      <line x1="50" y1="22" x2="90" y2="22" stroke-dasharray="2,1.5"/>
      <line x1="-90" y1="40" x2="-60" y2="40" stroke-dasharray="1,2"/>
    </g>
  </g>

  <!-- ===== LUMA close-up (right side, gesturing at display on left/center) ===== -->
  <g transform="translate(80 180)">
    <!-- Body -->
    <path d="M-22,120 L-26,80 L-32,30 L-32,-22 L-22,-58 L-9,-80 L9,-80 L22,-58 L32,-22 L32,30 L26,80 L22,120 Z" fill="url(#i8p1p2suit)"/>

    <!-- Heavy ink stains at hands -->
    <ellipse cx="-30" cy="11" rx="6" ry="4" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="30" cy="11" rx="6" ry="4" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent -->
    <line x1="0" y1="-58" x2="0" y2="80" stroke="#c8a8e8" stroke-width="0.85" opacity="0.85" filter="url(#i8p1p2bloom)"/>
    <!-- Pulsing accent nodes (heavy wear, dimmed but pulsing) -->
    <circle cx="-18" cy="-30" r="1.4" fill="#c8a8e8" filter="url(#i8p1p2bloom)" opacity="0.85"/>
    <circle cx="18" cy="-30" r="1.4" fill="#c8a8e8" filter="url(#i8p1p2bloom)" opacity="0.85"/>
    <circle cx="0" cy="3" r="1.4" fill="#c8a8e8" filter="url(#i8p1p2bloom)" opacity="0.85"/>
    <circle cx="-22" cy="40" r="1.4" fill="#c8a8e8" filter="url(#i8p1p2bloom)" opacity="0.7"/>

    <!-- Soot/dust on shoulders -->
    <ellipse cx="-22" cy="-50" rx="9" ry="3" fill="#1a0810" opacity="0.55"/>
    <ellipse cx="22" cy="-50" rx="9" ry="3" fill="#1a0810" opacity="0.55"/>

    <!-- Right arm raised, hand traces glyph contours -->
    <path d="M22,-30 L60,-50 L70,-30 L40,-9 Z" fill="url(#i8p1p2suit)"/>
    <ellipse cx="70" cy="-30" rx="6" ry="4" fill="url(#i8p1p2skin)"/>
    <!-- Ink stains on this hand -->
    <ellipse cx="68" cy="-28" rx="3" ry="2" fill="#1a0810" opacity="0.85"/>
    <!-- Index finger pointing -->
    <line x1="76" y1="-30" x2="86" y2="-36" stroke="#7a4828" stroke-width="2" stroke-linecap="round"/>

    <!-- Left arm — holding scanner -->
    <path d="M-22,-30 L-32,3 L-22,11 L-9,-9 Z" fill="url(#i8p1p2suit)"/>
    <ellipse cx="-32" cy="3" rx="6" ry="4" fill="url(#i8p1p2skin)"/>

    <!-- Neck -->
    <path d="M-7,-80 L7,-80 L4,-90 L-4,-90 Z" fill="url(#i8p1p2skin)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-110" rx="22" ry="22" fill="url(#i8p1p2skin)"/>

    <!-- Long thick BRAID with luminous filament -->
    <path d="M11,-94 Q22,-50 30,30 Q40,80 50,120" stroke="#1a0808" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g stroke="#3a1808" stroke-width="2" fill="none" opacity="0.85">
      <path d="M14,-80 Q22,-44 28,0"/>
      <path d="M28,0 Q35,40 45,90"/>
    </g>
    <!-- Braid bands -->
    <g fill="#5a3818" opacity="0.85">
      <ellipse cx="22" cy="-50" rx="6" ry="2"/>
      <ellipse cx="30" cy="-9" rx="6" ry="2"/>
      <ellipse cx="36" cy="30" rx="6" ry="2"/>
      <ellipse cx="44" cy="70" rx="6" ry="2"/>
    </g>
    <!-- LUMINOUS FILAMENT pulsing -->
    <g stroke="#a878e8" stroke-width="0.85" fill="none" filter="url(#i8p1p2bloom)" opacity="0.95">
      <path d="M11,-94 Q22,-50 30,30 Q40,80 50,120"/>
    </g>
    <g filter="url(#i8p1p2strongglow)" opacity="0.85">
      <ellipse cx="22" cy="-50" rx="4" ry="1.4" fill="#c8a8e8"/>
      <ellipse cx="30" cy="-9" rx="4" ry="1.4" fill="#c8a8e8"/>
      <ellipse cx="36" cy="30" rx="4" ry="1.4" fill="#c8a8e8"/>
      <ellipse cx="44" cy="70" rx="4" ry="1.4" fill="#c8a8e8"/>
    </g>

    <!-- Hair pulled back -->
    <path d="M-22,-128 Q0,-134 22,-128 L22,-104 Q11,-114 0,-114 Q-11,-114 -22,-104 Z" fill="#1a0808"/>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-114" rx="22" ry="6" fill="#5a3018" opacity="0.4"/>

    <!-- Brows — focused -->
    <line x1="-14" y1="-118" x2="-3" y2="-118" stroke="#3a1808" stroke-width="1.4"/>
    <line x1="3" y1="-118" x2="14" y2="-118" stroke="#3a1808" stroke-width="1.4"/>

    <!-- ===== HOLOGRAPHIC LENSES with scrolling data ===== -->
    <g filter="url(#i8p1p2strongglow)" opacity="0.7">
      <ellipse cx="0" cy="-110" rx="32" ry="11" fill="#7848b8"/>
    </g>
    <!-- Left lens -->
    <ellipse cx="-9" cy="-110" rx="9" ry="6" fill="none" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p1p2bloom)" opacity="0.95"/>
    <ellipse cx="-9" cy="-110" rx="6" ry="4" fill="#3a1858" opacity="0.55"/>
    <!-- Right lens -->
    <ellipse cx="9" cy="-110" rx="9" ry="6" fill="none" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p1p2bloom)" opacity="0.95"/>
    <ellipse cx="9" cy="-110" rx="6" ry="4" fill="#3a1858" opacity="0.55"/>
    <line x1="-3" y1="-110" x2="3" y2="-110" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p1p2bloom)" opacity="0.85"/>
    <!-- Scrolling data inside lenses -->
    <g fill="#c8a8e8" filter="url(#i8p1p2dataPulse)" opacity="0.95">
      <text x="-15" y="-108" font-family="monospace" font-size="2">SCAN</text>
      <text x="3" y="-108" font-family="monospace" font-size="2">REF</text>
    </g>

    <!-- Eyes glowing through lenses -->
    <circle cx="-9" cy="-110" r="0.85" fill="#fff8e8" filter="url(#i8p1p2bloom)"/>
    <circle cx="9" cy="-110" r="0.85" fill="#fff8e8" filter="url(#i8p1p2bloom)"/>

    <!-- Nose -->
    <path d="M-2,-105 L0,-94 L3,-94 L3,-105 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth — speaking, focused -->
    <path d="M-7,-94 Q0,-90 7,-94" stroke="#3a1808" stroke-width="1.4" fill="none"/>

    <!-- Cheekbone shadow -->
    <ellipse cx="-14" cy="-100" rx="3" ry="6" fill="#5a3018" opacity="0.4"/>
    <ellipse cx="14" cy="-100" rx="3" ry="6" fill="#5a3018" opacity="0.4"/>
  </g>

  <!-- ===== DIALOGUE — LUMA ===== -->
  <g>
    <rect x="14" y="14" width="338" height="68" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">The glyph from Clerkenwell is not isolated.</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Eleven more across a two-mile radius.</text>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">All in fairy script. All carved — physical tool.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
