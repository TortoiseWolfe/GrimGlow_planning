<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 320" width="366" height="320">
  <title>Issue 8 — Page 22 — Panel 3: The mural detail — an "angel" with structured geometric wings — the legend filtered, the truth at its core</title>
  <desc>85mm close-up church mural detail. Painted angel — but rendered with wings of structured geometric light, not feathers. Figure small, armored in stylized version of metallic plating, wings prismatic and angular. Painting style folk-art devotional — work of local painter interpreting descriptions passed down through generations. Details legend-filtered: armor stylized, wings exaggerated, face idealized into seraphic beauty. But core truth visible — portrait of prior operative, painted by someone who never saw them but heard the stories. Warm candlelight illuminates painted plaster. Geometric wing patterns catch the light and seem to glow. Paint old, cracked at edges, colors faded but present.</desc>

  <defs>
    <linearGradient id="i8p22p3plaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#7a6038"/>
    </linearGradient>
    <radialGradient id="i8p22p3candlelight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p22p3wingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a86838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p22p3goldPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd898"/>
      <stop offset="100%" stop-color="#a86838"/>
    </linearGradient>
    <linearGradient id="i8p22p3armorPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#5a5050"/>
    </linearGradient>
    <linearGradient id="i8p22p3skinPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="100%" stop-color="#c89868"/>
    </linearGradient>
    <filter id="i8p22p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p22p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p22p3strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p22p3megaglow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <!-- Plaster wall background -->
  <rect width="366" height="320" fill="url(#i8p22p3plaster)"/>
  <!-- Plaster cracks (old) -->
  <g stroke="#5a4828" stroke-width="0.4" opacity="0.7" fill="none">
    <path d="M0,40 Q60,45 120,40 Q180,35 240,42 Q300,40 366,42"/>
    <path d="M0,260 Q60,265 120,260 Q180,255 240,262 Q300,260 366,262"/>
    <path d="M40,0 Q42,80 38,160 Q40,240 42,320"/>
    <path d="M340,0 Q338,80 342,160 Q340,240 338,320"/>
  </g>
  <!-- Plaster age stains -->
  <g fill="#5a4828" opacity="0.4">
    <ellipse cx="80" cy="80" rx="22" ry="9"/>
    <ellipse cx="280" cy="100" rx="22" ry="9"/>
    <ellipse cx="60" cy="240" rx="22" ry="9"/>
    <ellipse cx="300" cy="260" rx="22" ry="9"/>
  </g>

  <!-- Candlelight from below illuminates the mural -->
  <ellipse cx="183" cy="320" rx="280" ry="200" fill="url(#i8p22p3candlelight)" filter="url(#i8p22p3megaglow)"/>

  <!-- ===== THE ANGEL — central figure ===== -->
  <g transform="translate(183 160)">
    <!-- Halo behind head -->
    <circle cx="0" cy="-66" r="40" fill="none" stroke="url(#i8p22p3goldPaint)" stroke-width="2" filter="url(#i8p22p3strongglow)" opacity="0.85"/>
    <circle cx="0" cy="-66" r="44" fill="none" stroke="#a86838" stroke-width="0.55" opacity="0.55"/>
    <ellipse cx="0" cy="-66" rx="36" ry="36" fill="#ffd898" opacity="0.18" filter="url(#i8p22p3bloom)"/>

    <!-- ===== STRUCTURED GEOMETRIC WINGS (NOT feathers — prismatic) ===== -->
    <!-- Wing glow halo -->
    <ellipse cx="0" cy="-3" rx="120" ry="60" fill="url(#i8p22p3wingGlow)" filter="url(#i8p22p3megaglow)" opacity="0.55"/>

    <!-- Left wing — geometric/angular -->
    <g stroke="url(#i8p22p3goldPaint)" stroke-width="2.5" fill="none" filter="url(#i8p22p3bloom)" opacity="0.85">
      <!-- Outer dragonfly arc -->
      <path d="M-22,-22 L-66,-50 L-100,-30 L-100,18 L-66,40 L-22,11"/>
      <!-- Main veins (radiating) -->
      <line x1="-22" y1="-22" x2="-100" y2="-22"/>
      <line x1="-22" y1="0" x2="-100" y2="0"/>
      <line x1="-22" y1="11" x2="-100" y2="18"/>
      <line x1="-66" y1="-50" x2="-66" y2="40"/>
      <!-- Cross-veins (cell walls) -->
      <line x1="-66" y1="-50" x2="-100" y2="18"/>
      <line x1="-66" y1="40" x2="-100" y2="-30"/>
      <line x1="-44" y1="-30" x2="-90" y2="-30"/>
      <line x1="-44" y1="22" x2="-90" y2="22"/>
    </g>
    <!-- Wing fill (faded gold paint) -->
    <path d="M-22,-22 L-66,-50 L-100,-30 L-100,18 L-66,40 L-22,11 Z" fill="url(#i8p22p3goldPaint)" opacity="0.4"/>

    <!-- Right wing — mirrored -->
    <g stroke="url(#i8p22p3goldPaint)" stroke-width="2.5" fill="none" filter="url(#i8p22p3bloom)" opacity="0.85">
      <path d="M22,-22 L66,-50 L100,-30 L100,18 L66,40 L22,11"/>
      <line x1="22" y1="-22" x2="100" y2="-22"/>
      <line x1="22" y1="0" x2="100" y2="0"/>
      <line x1="22" y1="11" x2="100" y2="18"/>
      <line x1="66" y1="-50" x2="66" y2="40"/>
      <line x1="66" y1="-50" x2="100" y2="18"/>
      <line x1="66" y1="40" x2="100" y2="-30"/>
      <line x1="44" y1="-30" x2="90" y2="-30"/>
      <line x1="44" y1="22" x2="90" y2="22"/>
    </g>
    <path d="M22,-22 L66,-50 L100,-30 L100,18 L66,40 L22,11 Z" fill="url(#i8p22p3goldPaint)" opacity="0.4"/>

    <!-- Wing nodes (joints — like Jink's wing-pack) -->
    <g fill="url(#i8p22p3goldPaint)" filter="url(#i8p22p3bloom)" opacity="0.95">
      <circle cx="-66" cy="-22" r="2.5"/>
      <circle cx="-66" cy="0" r="2.5"/>
      <circle cx="-66" cy="22" r="2.5"/>
      <circle cx="-44" cy="-30" r="2"/>
      <circle cx="-44" cy="22" r="2"/>
      <circle cx="-90" cy="-30" r="2"/>
      <circle cx="-90" cy="22" r="2"/>
      <circle cx="66" cy="-22" r="2.5"/>
      <circle cx="66" cy="0" r="2.5"/>
      <circle cx="66" cy="22" r="2.5"/>
      <circle cx="44" cy="-30" r="2"/>
      <circle cx="44" cy="22" r="2"/>
      <circle cx="90" cy="-30" r="2"/>
      <circle cx="90" cy="22" r="2"/>
    </g>

    <!-- ===== BODY — armored figure (stylized fairy operative) ===== -->
    <!-- Torso (in armor — silver with gold trim) -->
    <path d="M-22,-22 L-22,40 L-7,55 L7,55 L22,40 L22,-22 L11,-30 L-11,-30 Z" fill="url(#i8p22p3armorPaint)"/>
    <!-- Plate seams -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#5a5050" stroke-width="0.55"/>
    <line x1="-22" y1="22" x2="22" y2="22" stroke="#5a5050" stroke-width="0.55"/>
    <line x1="0" y1="-30" x2="0" y2="55" stroke="#5a5050" stroke-width="0.55"/>
    <!-- Gold trim on armor -->
    <line x1="-22" y1="-22" x2="22" y2="-22" stroke="url(#i8p22p3goldPaint)" stroke-width="1.4" filter="url(#i8p22p3bloom)" opacity="0.85"/>
    <line x1="-22" y1="40" x2="22" y2="40" stroke="url(#i8p22p3goldPaint)" stroke-width="1.4" filter="url(#i8p22p3bloom)" opacity="0.85"/>

    <!-- Decorative breastplate emblem -->
    <circle cx="0" cy="14" r="6" fill="url(#i8p22p3goldPaint)" filter="url(#i8p22p3bloom)" opacity="0.85"/>
    <polygon points="0,7 5,14 0,22 -5,14" fill="#a86838"/>

    <!-- Arms (extending out, sleeves) -->
    <path d="M-22,-15 L-30,11 L-22,18 L-15,3 Z" fill="url(#i8p22p3armorPaint)"/>
    <path d="M22,-15 L30,11 L22,18 L15,3 Z" fill="url(#i8p22p3armorPaint)"/>
    <!-- Hands (small, idealized) -->
    <ellipse cx="-30" cy="11" rx="3" ry="3" fill="url(#i8p22p3skinPaint)"/>
    <ellipse cx="30" cy="11" rx="3" ry="3" fill="url(#i8p22p3skinPaint)"/>

    <!-- Robes/sash -->
    <path d="M-22,40 L-30,80 L0,80 L22,40 L0,55 Z" fill="url(#i8p22p3goldPaint)" opacity="0.7"/>

    <!-- ===== HEAD — idealized seraphic face ===== -->
    <ellipse cx="0" cy="-50" rx="11" ry="14" fill="url(#i8p22p3skinPaint)"/>
    <!-- Hair (golden, flowing — stylized) -->
    <path d="M-11,-62 Q-9,-66 0,-66 Q9,-66 11,-62 L11,-44 Q9,-58 0,-58 Q-9,-58 -11,-44 Z" fill="url(#i8p22p3goldPaint)"/>
    <!-- Hair flowing back -->
    <path d="M-11,-50 Q-22,-44 -26,-30" stroke="url(#i8p22p3goldPaint)" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M11,-50 Q22,-44 26,-30" stroke="url(#i8p22p3goldPaint)" stroke-width="1.4" fill="none" opacity="0.85"/>

    <!-- Idealized face -->
    <!-- Eyes (closed/serene — seraphic) -->
    <path d="M-7,-50 Q-3,-48 1,-50" stroke="#3a2818" stroke-width="0.85" fill="none"/>
    <path d="M1,-50 Q5,-48 9,-50" stroke="#3a2818" stroke-width="0.85" fill="none"/>
    <!-- Lashes -->
    <line x1="-7" y1="-50" x2="-9" y2="-52" stroke="#3a2818" stroke-width="0.55"/>
    <line x1="9" y1="-50" x2="11" y2="-52" stroke="#3a2818" stroke-width="0.55"/>
    <!-- Brows -->
    <path d="M-9,-55 Q-3,-58 1,-55" stroke="#a86838" stroke-width="0.7" fill="none" opacity="0.85"/>
    <path d="M1,-55 Q5,-58 11,-55" stroke="#a86838" stroke-width="0.7" fill="none" opacity="0.85"/>
    <!-- Nose (stylized) -->
    <path d="M-1,-46 L0,-40 L2,-40 L2,-46 Z" fill="#a87838" opacity="0.55"/>
    <!-- Mouth (small, peaceful) -->
    <path d="M-3,-36 Q0,-34 3,-36" stroke="#7a3818" stroke-width="0.85" fill="none"/>

    <!-- Crackle pattern on the painted figure (the legend is OLD) -->
    <g stroke="#5a4828" stroke-width="0.4" opacity="0.55" fill="none">
      <path d="M-15,-30 L-9,-22 L-15,-7"/>
      <path d="M15,-30 L9,-22 L15,-7"/>
      <path d="M-7,7 L0,18 L7,7"/>
    </g>
  </g>

  <!-- Faint Latin inscription -->
  <g transform="translate(183 280)">
    <text x="-44" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="6" fill="#5a4828" font-style="italic" opacity="0.85">Sanctus Custos</text>
  </g>

  <!-- ===== CAPTION ===== -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">They said the foundation stones were laid with</text>
  <text x="22" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">the good folk's blessing. That the church stood on</text>
  <text x="22" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic" font-weight="700">ground where the fair ones had lived.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a2818" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
