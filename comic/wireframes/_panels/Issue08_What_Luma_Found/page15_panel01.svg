<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 15 — Panel 1: Hours later — Thresh still at her post — gaslight burning lower, shadows deeper, the watch is long</title>
  <desc>28mm wide eye level. Narrow Victorian alley at deep night — hours have passed. Single gas lamp at far end burns lower, flame smaller, warm amber pool narrower. Shadows have grown longer, deeper. Alley quieter — city's background noise diminished to near silence. Base of near wall, tiny figure in dented ruby-crimson armor sits motionless — compact weapon across knees, back to brick, posture unchanged from hours ago but fatigue visible in slump of armored shoulders. Crimson holographic nodes at minimal stealth dim — barely perceptible points of faint red. Night is deep. Watch is long.</desc>

  <defs>
    <linearGradient id="i8p15p1skyDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p15p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p15p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p15p1lampLower" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#a86838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p15p1lampCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d86838" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p15p1threshArmor" cx="0%" cy="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a1810"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <filter id="i8p15p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p15p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p15p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p15p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- Sky strip at top (deeper night) -->
  <rect width="742" height="50" fill="url(#i8p15p1skyDeep)"/>
  <!-- Faint stars (deeper night = more visible) -->
  <circle cx="80" cy="20" r="0.55" fill="#fff8e8" filter="url(#i8p15p1bloom)" opacity="0.85"/>
  <circle cx="280" cy="15" r="0.55" fill="#fff8e8" filter="url(#i8p15p1bloom)" opacity="0.7"/>
  <circle cx="500" cy="22" r="0.55" fill="#fff8e8" filter="url(#i8p15p1bloom)" opacity="0.55"/>
  <circle cx="650" cy="18" r="0.4" fill="#fff8e8" filter="url(#i8p15p1bloom)" opacity="0.7"/>

  <!-- Top of brick walls (silhouette) -->
  <rect x="0" y="50" width="742" height="14" fill="#040408"/>
  <!-- Chimney pots -->
  <rect x="80" y="35" width="11" height="20" fill="#040408"/>
  <rect x="320" y="38" width="14" height="18" fill="#040408"/>
  <rect x="540" y="32" width="11" height="22" fill="#040408"/>

  <!-- ===== BRICK WALLS ===== -->
  <rect x="0" y="64" width="200" height="180" fill="url(#i8p15p1brick)"/>
  <rect x="540" y="64" width="202" height="180" fill="url(#i8p15p1brick)"/>
  <!-- Mortar -->
  <g stroke="#040408" stroke-width="0.7" opacity="0.85">
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="0" y1="180" x2="200" y2="180"/>
    <line x1="0" y1="220" x2="200" y2="220"/>
    <line x1="540" y1="100" x2="742" y2="100"/>
    <line x1="540" y1="140" x2="742" y2="140"/>
    <line x1="540" y1="180" x2="742" y2="180"/>
    <line x1="540" y1="220" x2="742" y2="220"/>
  </g>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="60" y1="64" x2="60" y2="100"/>
    <line x1="120" y1="100" x2="120" y2="140"/>
    <line x1="40" y1="140" x2="40" y2="180"/>
    <line x1="100" y1="180" x2="100" y2="220"/>
    <line x1="160" y1="220" x2="160" y2="244"/>
    <line x1="600" y1="64" x2="600" y2="100"/>
    <line x1="680" y1="100" x2="680" y2="140"/>
    <line x1="580" y1="140" x2="580" y2="180"/>
    <line x1="660" y1="180" x2="660" y2="220"/>
  </g>
  <!-- Heavy soot/grime -->
  <g fill="#040408" opacity="0.7">
    <ellipse cx="80" cy="120" rx="22" ry="9"/>
    <ellipse cx="160" cy="200" rx="22" ry="9"/>
    <ellipse cx="600" cy="120" rx="22" ry="9"/>
    <ellipse cx="680" cy="200" rx="22" ry="9"/>
  </g>

  <!-- Cobblestone alley floor -->
  <rect x="0" y="244" width="742" height="56" fill="url(#i8p15p1cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="40" cy="260" rx="11" ry="6"/>
    <ellipse cx="120" cy="270" rx="11" ry="6"/>
    <ellipse cx="200" cy="265" rx="11" ry="6"/>
    <ellipse cx="280" cy="270" rx="11" ry="6"/>
    <ellipse cx="360" cy="265" rx="11" ry="6"/>
    <ellipse cx="440" cy="270" rx="11" ry="6"/>
    <ellipse cx="520" cy="265" rx="11" ry="6"/>
    <ellipse cx="600" cy="270" rx="11" ry="6"/>
    <ellipse cx="680" cy="265" rx="11" ry="6"/>
    <ellipse cx="100" cy="285" rx="11" ry="6"/>
    <ellipse cx="240" cy="290" rx="11" ry="6"/>
    <ellipse cx="380" cy="285" rx="11" ry="6"/>
    <ellipse cx="520" cy="290" rx="11" ry="6"/>
    <ellipse cx="660" cy="285" rx="11" ry="6"/>
  </g>

  <!-- ===== GASLIGHT (FAR END, BURNING LOWER) ===== -->
  <g transform="translate(620 100)">
    <rect x="-2" y="0" width="4" height="140" fill="#3a3030"/>
    <path d="M0,0 L-22,-9 L-22,-7 L-2,3 Z" fill="#3a3030"/>
    <rect x="-22" y="-26" width="22" height="22" fill="#1a1818"/>
    <polygon points="-26,-26 4,-26 0,-36 -22,-36" fill="#3a3030"/>
    <rect x="-18" y="-22" width="14" height="16" fill="#3a1808"/>
    <!-- LOWER FLAME (smaller than P5/P6) -->
    <ellipse cx="-11" cy="-12" rx="3" ry="6" fill="url(#i8p15p1lampCore)" filter="url(#i8p15p1strongglow)"/>
    <ellipse cx="-11" cy="-12" rx="1.4" ry="3" fill="#fff" filter="url(#i8p15p1bloom)" opacity="0.85"/>
  </g>
  <!-- NARROWER amber halo (gaslight is lower) -->
  <ellipse cx="600" cy="86" rx="160" ry="100" fill="url(#i8p15p1lampLower)" filter="url(#i8p15p1megaglow)"/>
  <ellipse cx="540" cy="270" rx="140" ry="22" fill="url(#i8p15p1lampLower)" filter="url(#i8p15p1megaglow)" opacity="0.7"/>

  <!-- Cobblestones gleam (narrower) -->
  <g opacity="0.7" filter="url(#i8p15p1bloom)">
    <ellipse cx="440" cy="270" rx="6" ry="2" fill="#ffd898" opacity="0.4"/>
    <ellipse cx="520" cy="265" rx="6" ry="2" fill="#ffd898" opacity="0.55"/>
    <ellipse cx="600" cy="270" rx="9" ry="3" fill="#ffd898" opacity="0.7"/>
  </g>

  <!-- LONGER shadows (deeper night) -->
  <g opacity="0.85">
    <path d="M540,100 L120,260 L160,300 L580,180 Z" fill="#040408" filter="url(#i8p15p1glow)"/>
  </g>

  <!-- Drainpipe right wall -->
  <g transform="translate(700 50)" opacity="0.85">
    <rect x="-2" y="14" width="4" height="220" fill="#3a2010"/>
  </g>

  <!-- ===== THRESH at base of LEFT wall — slumped fatigue ===== -->
  <g transform="translate(140 256)">
    <!-- Body — slumped, shoulders down -->
    <path d="M-7,18 L-9,3 L-11,-9 L-7,-22 L-3,-30 L3,-30 L7,-22 L11,-9 L9,3 L7,18 Z" fill="url(#i8p15p1threshArmor)"/>

    <!-- Heavy dents (hours accumulated wear) -->
    <ellipse cx="-9" cy="-14" rx="3" ry="2" fill="#3a0a0a"/>
    <ellipse cx="9" cy="-14" rx="3" ry="2" fill="#5a1410"/>

    <!-- Long chest scratch -->
    <path d="M-5,-3 L5,3" stroke="#3a0a0a" stroke-width="1" opacity="0.85"/>

    <!-- Suit accent VERY DIM (minimal stealth) -->
    <line x1="0" y1="-22" x2="0" y2="14" stroke="#a82818" stroke-width="0.4" opacity="0.55" filter="url(#i8p15p1bloom)"/>
    <!-- Crimson nodes minimal stealth dim -->
    <circle cx="-7" cy="-14" r="0.55" fill="#a82818" filter="url(#i8p15p1bloom)" opacity="0.55"/>
    <circle cx="7" cy="-14" r="0.55" fill="#a82818" filter="url(#i8p15p1bloom)" opacity="0.55"/>
    <circle cx="0" cy="0" r="0.55" fill="#a82818" filter="url(#i8p15p1bloom)" opacity="0.55"/>

    <!-- Knees -->
    <ellipse cx="-7" cy="14" rx="6" ry="3" fill="url(#i8p15p1threshArmor)"/>
    <ellipse cx="7" cy="14" rx="6" ry="3" fill="url(#i8p15p1threshArmor)"/>

    <!-- Weapon across knees -->
    <rect x="-14" y="14" width="28" height="2" fill="#0a0408"/>
    <ellipse cx="0" cy="15" rx="3" ry="0.4" fill="#a82818" filter="url(#i8p15p1bloom)" opacity="0.4"/>
    <!-- Hands on weapon (relaxed grip - fatigue) -->
    <ellipse cx="-9" cy="14" rx="1.4" ry="1" fill="#a87838"/>
    <ellipse cx="9" cy="14" rx="1.4" ry="1" fill="#a87838"/>

    <!-- Head — slightly lowered (fatigue) -->
    <ellipse cx="0" cy="-36" rx="4" ry="5" fill="#a87838"/>
    <!-- Buzz cut -->
    <path d="M-5,-42 Q0,-44 5,-42 L5,-36 Q0,-38 -5,-36 Z" fill="#7a2818"/>
    <!-- Eyes — alert but tired -->
    <line x1="-2" y1="-36" x2="-1" y2="-36" stroke="#1a0808" stroke-width="0.7"/>
    <line x1="1" y1="-36" x2="2" y2="-36" stroke="#1a0808" stroke-width="0.7"/>
  </g>
  <!-- Faint crimson hint at her position (the points the child will see) -->
  <ellipse cx="140" cy="244" rx="14" ry="6" fill="#3a0a0a" opacity="0.55" filter="url(#i8p15p1glow)"/>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#040408" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
