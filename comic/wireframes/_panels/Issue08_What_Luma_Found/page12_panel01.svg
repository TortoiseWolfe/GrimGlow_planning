<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 12 — Panel 1: Luma's scanner climbs the wall — past the cache, toward the carving above — the residual energy strongest here</title>
  <desc>35mm medium eye level. Tiny woman in sapphire-violet suit on stone shelf in alcove, scanner raised, structured blue-violet beam climbing rough stone wall above cache of corroded fairy technology. Light catches dust motes as it rises, illuminating wall surface in sweeping arc. Edges of carved lines begin to appear in scanner light — deeper, wider than chronicle glyphs, made with force. Relics on shelf behind and below provide warm residual ghost-glow at frame's base. Luma looks up, body taut with anticipation, holographic lenses tracking scanner beam's climb. Carving above partially visible — lower edges entering light — but not yet readable.</desc>

  <defs>
    <linearGradient id="i8p12p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p12p1stoneAlcove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p12p1shelf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i8p12p1scannerCone" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p12p1ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p12p1carveTop" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#7848b8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p12p1lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p12p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <linearGradient id="i8p12p1corroded" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="i8p12p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p12p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p12p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p12p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p12p1bg)"/>

  <!-- Stone wall -->
  <rect x="0" y="0" width="742" height="220" fill="url(#i8p12p1stoneAlcove)"/>
  <g stroke="#040408" stroke-width="0.7" fill="none" opacity="0.85">
    <path d="M0,40 L120,42 L240,38 L360,40 L480,38 L600,40 L742,42"/>
    <path d="M0,80 L120,82 L240,78 L360,80 L480,78 L600,80 L742,82"/>
    <path d="M0,120 L120,122 L240,118 L360,120 L480,118 L600,120 L742,122"/>
    <path d="M0,160 L120,162 L240,158 L360,160 L480,158 L600,160 L742,162"/>
    <line x1="100" y1="0" x2="100" y2="40"/>
    <line x1="240" y1="0" x2="240" y2="40"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="520" y1="0" x2="520" y2="40"/>
    <line x1="640" y1="0" x2="640" y2="40"/>
    <line x1="60" y1="40" x2="60" y2="80"/>
    <line x1="180" y1="40" x2="180" y2="80"/>
    <line x1="320" y1="40" x2="320" y2="80"/>
    <line x1="460" y1="40" x2="460" y2="80"/>
    <line x1="600" y1="40" x2="600" y2="80"/>
    <line x1="120" y1="80" x2="120" y2="120"/>
    <line x1="280" y1="80" x2="280" y2="120"/>
    <line x1="420" y1="80" x2="420" y2="120"/>
    <line x1="560" y1="80" x2="560" y2="120"/>
    <line x1="60" y1="120" x2="60" y2="160"/>
    <line x1="220" y1="120" x2="220" y2="160"/>
    <line x1="360" y1="120" x2="360" y2="160"/>
    <line x1="500" y1="120" x2="500" y2="160"/>
  </g>
  <!-- Stone weathering -->
  <g fill="#040408" opacity="0.55">
    <ellipse cx="80" cy="60" rx="22" ry="9"/>
    <ellipse cx="380" cy="100" rx="22" ry="9"/>
    <ellipse cx="600" cy="60" rx="14" ry="6"/>
    <ellipse cx="200" cy="180" rx="22" ry="9"/>
    <ellipse cx="540" cy="180" rx="22" ry="9"/>
  </g>

  <!-- ===== EDGES of THE CARVING beginning to appear at top of frame ===== -->
  <ellipse cx="371" cy="0" rx="200" ry="50" fill="url(#i8p12p1carveTop)" filter="url(#i8p12p1megaglow)" opacity="0.85"/>
  <!-- Lower edges of large carved characters just visible -->
  <g stroke="#0a0408" stroke-width="2.5" fill="none" opacity="0.85">
    <line x1="280" y1="0" x2="280" y2="22"/>
    <line x1="280" y1="22" x2="310" y2="22"/>
    <line x1="340" y1="0" x2="340" y2="22"/>
    <line x1="340" y1="22" x2="370" y2="22"/>
    <line x1="400" y1="0" x2="400" y2="22"/>
    <line x1="400" y1="22" x2="430" y2="22"/>
    <line x1="460" y1="0" x2="460" y2="22"/>
    <line x1="460" y1="22" x2="490" y2="22"/>
  </g>
  <!-- Phosphorescent lower edges (just lighting up) -->
  <g stroke="#a878e8" stroke-width="0.85" fill="none" opacity="0.7" filter="url(#i8p12p1bloom)">
    <line x1="280" y1="22" x2="310" y2="22"/>
    <line x1="340" y1="22" x2="370" y2="22"/>
    <line x1="400" y1="22" x2="430" y2="22"/>
    <line x1="460" y1="22" x2="490" y2="22"/>
  </g>

  <!-- Shelf (foreground bottom) -->
  <rect x="0" y="220" width="742" height="80" fill="url(#i8p12p1shelf)"/>
  <line x1="0" y1="220" x2="742" y2="220" stroke="#040408" stroke-width="0.85"/>
  <!-- Heavy dust on shelf -->
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="100" cy="240" rx="60" ry="6"/>
    <ellipse cx="400" cy="245" rx="100" ry="7"/>
    <ellipse cx="640" cy="240" rx="60" ry="6"/>
  </g>

  <!-- ===== CACHE RELICS (lower frame, ghost-glowing) — abbreviated since this is rear-shot ===== -->
  <!-- Wing-pack skeleton -->
  <g transform="translate(180 240)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="url(#i8p12p1ghostGlow)" filter="url(#i8p12p1strongglow)" opacity="0.55"/>
    <g stroke="url(#i8p12p1corroded)" stroke-width="1.4" fill="none">
      <path d="M-22,-3 L-44,-22 L-60,-9 L-60,7 L-44,11 L-22,3"/>
      <path d="M22,-3 L44,-22 L60,-9 L60,7 L44,11 L22,3"/>
      <line x1="-22" y1="-3" x2="-60" y2="-3"/>
      <line x1="22" y1="-3" x2="60" y2="-3"/>
      <line x1="-44" y1="-22" x2="-44" y2="11"/>
      <line x1="44" y1="-22" x2="44" y2="11"/>
    </g>
    <rect x="-22" y="-3" width="44" height="14" fill="url(#i8p12p1corroded)"/>
  </g>
  <!-- Data core -->
  <g transform="translate(540 250)" opacity="0.85">
    <rect x="-30" y="-9" width="60" height="18" fill="#1a1018" rx="3"/>
    <ellipse cx="-9" cy="-3" rx="14" ry="5" fill="#1a1018"/>
    <line x1="-22" y1="-3" x2="22" y2="3" stroke="#040408" stroke-width="0.4"/>
    <ellipse cx="-9" cy="-3" rx="6" ry="2" fill="#a86838" opacity="0.4" filter="url(#i8p12p1bloom)"/>
  </g>

  <!-- ===== LUMA on shelf (mid-foreground), scanner raised UP ===== -->
  <g transform="translate(371 230)">
    <!-- Body, leaning back, looking up -->
    <path d="M-9,40 L-11,11 L-14,-7 L-11,-22 L-3,-32 L3,-32 L11,-22 L14,-7 L11,11 L9,40 Z" fill="url(#i8p12p1lumaSuit)"/>

    <!-- Heavy ink stains -->
    <ellipse cx="-14" cy="3" rx="3" ry="2" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent -->
    <line x1="0" y1="-22" x2="0" y2="30" stroke="#c8a8e8" stroke-width="0.55" opacity="0.95" filter="url(#i8p12p1bloom)"/>
    <circle cx="-9" cy="-15" r="0.85" fill="#c8a8e8" filter="url(#i8p12p1bloom)" opacity="0.95"/>
    <circle cx="9" cy="-15" r="0.85" fill="#c8a8e8" filter="url(#i8p12p1bloom)" opacity="0.95"/>
    <circle cx="0" cy="3" r="0.85" fill="#c8a8e8" filter="url(#i8p12p1bloom)" opacity="0.95"/>

    <!-- Right arm RAISED UP with scanner -->
    <path d="M11,-22 L18,-50 L26,-44 L14,-9 Z" fill="url(#i8p12p1lumaSuit)"/>
    <ellipse cx="22" cy="-50" rx="3" ry="2" fill="url(#i8p12p1skin)"/>
    <!-- Scanner pointed UP -->
    <rect x="20" y="-58" width="6" height="11" fill="#3a1858"/>
    <ellipse cx="23" cy="-58" rx="3" ry="0.85" fill="#a878e8" filter="url(#i8p12p1strongglow)" opacity="0.95"/>

    <!-- Other arm at side -->
    <path d="M-11,-15 L-22,-3 L-14,9 L-7,-3 Z" fill="url(#i8p12p1lumaSuit)"/>

    <!-- Legs, planted -->
    <path d="M-3,40 L-7,52 L-1,52 L0,40 Z" fill="url(#i8p12p1lumaSuit)"/>
    <path d="M3,40 L7,52 L1,52 L0,40 Z" fill="url(#i8p12p1lumaSuit)"/>

    <!-- Head — TILTED UP, looking at the carving -->
    <ellipse cx="0" cy="-40" rx="6" ry="7" fill="url(#i8p12p1skin)"/>
    <!-- Long braid -->
    <path d="M3,-32 Q9,-15 14,11" stroke="#1a0808" stroke-width="2" fill="none"/>
    <path d="M3,-32 Q9,-15 14,11" stroke="#a878e8" stroke-width="0.4" fill="none" filter="url(#i8p12p1bloom)" opacity="0.95"/>
    <ellipse cx="9" cy="-15" rx="2" ry="0.7" fill="#c8a8e8" filter="url(#i8p12p1strongglow)" opacity="0.95"/>
    <!-- Hair -->
    <path d="M-5,-46 Q0,-50 5,-46 L5,-40 Q0,-44 -5,-40 Z" fill="#1a0808"/>

    <!-- Holographic lenses tracking up -->
    <ellipse cx="-2" cy="-40" rx="2" ry="1.4" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p12p1bloom)" opacity="0.95"/>
    <ellipse cx="2" cy="-40" rx="2" ry="1.4" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p12p1bloom)" opacity="0.95"/>
    <!-- Eyes — tracking upward -->
    <circle cx="-2" cy="-41" r="0.55" fill="#fff8e8" filter="url(#i8p12p1bloom)"/>
    <circle cx="2" cy="-41" r="0.55" fill="#fff8e8" filter="url(#i8p12p1bloom)"/>
    <!-- Brows raised (anticipation) -->
    <line x1="-4" y1="-46" x2="-1" y2="-47" stroke="#3a1808" stroke-width="0.55"/>
    <line x1="1" y1="-47" x2="4" y2="-46" stroke="#3a1808" stroke-width="0.55"/>
    <!-- Mouth slightly open -->
    <ellipse cx="0" cy="-34" rx="1" ry="0.55" fill="#3a1808"/>
  </g>

  <!-- ===== SCANNER BEAM CLIMBING the wall (vertical column of light, with dust motes) ===== -->
  <g filter="url(#i8p12p1megaglow)" opacity="0.85">
    <path d="M381,170 L350,0 L420,0 L391,170 Z" fill="url(#i8p12p1scannerCone)"/>
  </g>
  <!-- Beam structure lines -->
  <g stroke="#a878e8" stroke-width="0.7" fill="none" opacity="0.95" filter="url(#i8p12p1bloom)">
    <line x1="385" y1="170" x2="370" y2="0"/>
    <line x1="389" y1="170" x2="400" y2="0"/>
    <line x1="394" y1="170" x2="430" y2="0"/>
  </g>
  <!-- Dust motes IN the beam -->
  <g fill="#fff8d8" opacity="0.85" filter="url(#i8p12p1bloom)">
    <circle cx="380" cy="40" r="0.55"/>
    <circle cx="395" cy="60" r="0.4"/>
    <circle cx="400" cy="80" r="0.55"/>
    <circle cx="385" cy="100" r="0.4"/>
    <circle cx="390" cy="120" r="0.55"/>
    <circle cx="380" cy="140" r="0.4"/>
    <circle cx="400" cy="160" r="0.55"/>
  </g>
  <!-- Scanner light on wall (where it touches) -->
  <ellipse cx="385" cy="80" rx="60" ry="14" fill="#a878e8" opacity="0.4" filter="url(#i8p12p1bloom)"/>
  <ellipse cx="385" cy="120" rx="50" ry="11" fill="#a878e8" opacity="0.4" filter="url(#i8p12p1bloom)"/>

  <!-- ===== DIALOGUE — LUMA ===== -->
  <g>
    <rect x="14" y="14" width="500" height="50" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">There's something above the cache. The residual energy concentration</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">is highest here — whatever this is, it was carved with intention.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
