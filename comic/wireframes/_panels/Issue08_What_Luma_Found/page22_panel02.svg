<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 22 — Panel 2: Inside the church alive — congregation, candles, the angel mural — the truth hiding in plain sight</title>
  <desc>35mm medium wide eye level. Interior of St. Elspeth's Church in living days — polished pews, lit candles, stained glass casting shafts of colored light across nave. Congregation sits for sermon, faces turned toward pulpit where priest speaks. Behind pulpit on wall, partially visible in warm candlelight, painted mural — angels depicted with wings of structured geometric light. Angels small figures with prismatic wings — not feathered but made of light trapped in geometry. To congregation they are angels. To reader who has seen Jink deploy a wing-pack, they are something else entirely. Mural old, overlooked. Warm candlelight and colored stained-glass light create complex warm interior.</desc>

  <defs>
    <linearGradient id="i8p22p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p22p2pew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5028"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p22p2stoneFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a6038"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="i8p22p2candleHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p22p2redLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#a82018" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p22p2goldLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p22p2blueLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4878b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a3858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p22p2cassock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p22p2muralWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a89878"/>
      <stop offset="100%" stop-color="#7a6038"/>
    </linearGradient>
    <filter id="i8p22p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p22p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p22p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p22p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p22p2bg)"/>

  <!-- Vaulted ceiling lost in shadow -->
  <g stroke="#3a2010" stroke-width="0.55" fill="none" opacity="0.7">
    <path d="M0,0 L60,40 L682,40 L742,0"/>
    <line x1="200" y1="0" x2="240" y2="40"/>
    <line x1="500" y1="0" x2="540" y2="40"/>
  </g>

  <!-- Stone walls -->
  <rect x="0" y="40" width="50" height="180" fill="#5a4838"/>
  <rect x="692" y="40" width="50" height="180" fill="#5a4838"/>
  <g stroke="#3a2818" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="80" x2="50" y2="80"/>
    <line x1="0" y1="120" x2="50" y2="120"/>
    <line x1="0" y1="160" x2="50" y2="160"/>
    <line x1="692" y1="80" x2="742" y2="80"/>
    <line x1="692" y1="120" x2="742" y2="120"/>
    <line x1="692" y1="160" x2="742" y2="160"/>
  </g>

  <!-- ===== STAINED GLASS WINDOWS — alive, casting colored shafts ===== -->
  <g transform="translate(80 80)">
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40 Z" fill="#a82018" opacity="0.85"/>
    <rect x="-22" y="-30" width="22" height="22" fill="#ffd898" opacity="0.85"/>
    <rect x="-22" y="-8" width="22" height="22" fill="#4878b8" opacity="0.85"/>
    <rect x="0" y="-8" width="22" height="22" fill="#a82018" opacity="0.85"/>
    <rect x="-22" y="14" width="22" height="22" fill="#ffd898" opacity="0.85"/>
    <rect x="0" y="14" width="22" height="22" fill="#4878b8" opacity="0.85"/>
    <g stroke="#1a0808" stroke-width="0.4" fill="none">
      <line x1="-22" y1="-8" x2="22" y2="-8"/>
      <line x1="-22" y1="14" x2="22" y2="14"/>
      <line x1="0" y1="-30" x2="0" y2="40"/>
    </g>
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40" stroke="#5a4828" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(660 80)">
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40 Z" fill="#4878b8" opacity="0.85"/>
    <rect x="-22" y="-30" width="22" height="22" fill="#a82018" opacity="0.85"/>
    <rect x="-22" y="-8" width="22" height="22" fill="#ffd898" opacity="0.85"/>
    <rect x="0" y="-8" width="22" height="22" fill="#4878b8" opacity="0.85"/>
    <rect x="-22" y="14" width="22" height="22" fill="#a82018" opacity="0.85"/>
    <rect x="0" y="14" width="22" height="22" fill="#ffd898" opacity="0.85"/>
    <g stroke="#1a0808" stroke-width="0.4" fill="none">
      <line x1="-22" y1="-8" x2="22" y2="-8"/>
      <line x1="-22" y1="14" x2="22" y2="14"/>
      <line x1="0" y1="-30" x2="0" y2="40"/>
    </g>
    <path d="M-22,40 L-22,-9 Q-22,-30 0,-30 Q22,-30 22,-9 L22,40" stroke="#5a4828" stroke-width="2" fill="none"/>
  </g>

  <!-- COLORED SHAFTS of light from windows onto pews/floor -->
  <ellipse cx="120" cy="180" rx="80" ry="22" fill="url(#i8p22p2redLight)" filter="url(#i8p22p2glow)" opacity="0.7"/>
  <ellipse cx="180" cy="200" rx="60" ry="14" fill="url(#i8p22p2goldLight)" filter="url(#i8p22p2glow)" opacity="0.55"/>
  <ellipse cx="620" cy="180" rx="80" ry="22" fill="url(#i8p22p2blueLight)" filter="url(#i8p22p2glow)" opacity="0.7"/>
  <ellipse cx="560" cy="200" rx="60" ry="14" fill="url(#i8p22p2redLight)" filter="url(#i8p22p2glow)" opacity="0.55"/>

  <!-- ===== STONE FLOOR (polished) ===== -->
  <rect x="50" y="200" width="642" height="100" fill="url(#i8p22p2stoneFloor)"/>
  <g stroke="#3a2010" stroke-width="0.55" opacity="0.55">
    <line x1="50" y1="220" x2="692" y2="220"/>
    <line x1="50" y1="260" x2="692" y2="260"/>
    <line x1="160" y1="200" x2="160" y2="220"/>
    <line x1="280" y1="200" x2="280" y2="220"/>
    <line x1="400" y1="200" x2="400" y2="220"/>
    <line x1="520" y1="200" x2="520" y2="220"/>
    <line x1="100" y1="220" x2="100" y2="260"/>
    <line x1="220" y1="220" x2="220" y2="260"/>
    <line x1="340" y1="220" x2="340" y2="260"/>
    <line x1="460" y1="220" x2="460" y2="260"/>
    <line x1="580" y1="220" x2="580" y2="260"/>
  </g>

  <!-- ===== PEWS in rows (polished) ===== -->
  <g fill="url(#i8p22p2pew)">
    <!-- Front pew -->
    <rect x="100" y="230" width="200" height="6"/>
    <rect x="100" y="225" width="3" height="11"/>
    <rect x="297" y="225" width="3" height="11"/>
    <rect x="440" y="230" width="200" height="6"/>
    <rect x="440" y="225" width="3" height="11"/>
    <rect x="637" y="225" width="3" height="11"/>
    <!-- Back pew -->
    <rect x="80" y="260" width="240" height="6"/>
    <rect x="77" y="255" width="3" height="11"/>
    <rect x="317" y="255" width="3" height="11"/>
    <rect x="420" y="260" width="240" height="6"/>
    <rect x="417" y="255" width="3" height="11"/>
    <rect x="657" y="255" width="3" height="11"/>
  </g>
  <!-- Polish gleam on pews -->
  <line x1="100" y1="230" x2="300" y2="230" stroke="#a87838" stroke-width="0.55" filter="url(#i8p22p2bloom)" opacity="0.55"/>
  <line x1="440" y1="230" x2="640" y2="230" stroke="#a87838" stroke-width="0.55" filter="url(#i8p22p2bloom)" opacity="0.55"/>

  <!-- ===== CONGREGATION (faces turned toward pulpit) ===== -->
  <g opacity="0.85">
    <!-- Heads in front pew -->
    <circle cx="120" cy="220" r="3" fill="#3a2818"/>
    <circle cx="150" cy="220" r="3" fill="#5a3818"/>
    <circle cx="180" cy="220" r="3" fill="#3a2010"/>
    <circle cx="220" cy="220" r="3" fill="#3a2818"/>
    <circle cx="260" cy="220" r="3" fill="#3a2010"/>
    <circle cx="290" cy="220" r="3" fill="#3a2818"/>
    <circle cx="460" cy="220" r="3" fill="#3a2010"/>
    <circle cx="490" cy="220" r="3" fill="#5a3818"/>
    <circle cx="530" cy="220" r="3" fill="#3a2818"/>
    <circle cx="560" cy="220" r="3" fill="#3a2010"/>
    <circle cx="600" cy="220" r="3" fill="#3a2818"/>
    <circle cx="630" cy="220" r="3" fill="#3a2010"/>
    <!-- Heads in back pew -->
    <circle cx="100" cy="252" r="3" fill="#3a2010"/>
    <circle cx="140" cy="252" r="3" fill="#3a2818"/>
    <circle cx="180" cy="252" r="3" fill="#5a3818"/>
    <circle cx="220" cy="252" r="3" fill="#3a2010"/>
    <circle cx="260" cy="252" r="3" fill="#3a2818"/>
    <circle cx="300" cy="252" r="3" fill="#3a2010"/>
    <circle cx="440" cy="252" r="3" fill="#3a2010"/>
    <circle cx="480" cy="252" r="3" fill="#3a2818"/>
    <circle cx="520" cy="252" r="3" fill="#5a3818"/>
    <circle cx="560" cy="252" r="3" fill="#3a2010"/>
    <circle cx="600" cy="252" r="3" fill="#3a2818"/>
    <circle cx="640" cy="252" r="3" fill="#3a2010"/>
  </g>

  <!-- ===== PULPIT center ===== -->
  <g transform="translate(371 200)">
    <rect x="-22" y="-30" width="44" height="40" fill="#5a4828"/>
    <line x1="-22" y1="-15" x2="22" y2="-15" stroke="#3a2010" stroke-width="0.55"/>
    <!-- Priest at pulpit -->
    <ellipse cx="0" cy="-44" rx="6" ry="9" fill="url(#i8p22p2cassock)"/>
    <!-- White surplice/collar -->
    <ellipse cx="0" cy="-50" rx="3" ry="2" fill="#fff" opacity="0.85"/>
    <!-- Head -->
    <ellipse cx="0" cy="-58" rx="3" ry="4" fill="#f0d8a8"/>
    <!-- Arms (gestural) -->
    <path d="M-6,-44 L-11,-32 L-7,-26 Z" fill="url(#i8p22p2cassock)"/>
    <path d="M6,-44 L11,-32 L7,-26 Z" fill="url(#i8p22p2cassock)"/>
  </g>

  <!-- ===== ANGEL MURAL on the wall behind pulpit ===== -->
  <g transform="translate(371 130)">
    <!-- Mural plaster background -->
    <rect x="-100" y="-50" width="200" height="80" fill="url(#i8p22p2muralWall)" opacity="0.85"/>

    <!-- Faded gold border -->
    <rect x="-100" y="-50" width="200" height="80" fill="none" stroke="#7a5028" stroke-width="1.4" opacity="0.7"/>

    <!-- ===== ANGELS with structured geometric wings ===== -->
    <!-- Angel 1 (left) -->
    <g transform="translate(-60 0)">
      <!-- Body (small, armored — stylized fairy operative) -->
      <ellipse cx="0" cy="-7" rx="6" ry="11" fill="#a89878"/>
      <!-- Halo around head -->
      <circle cx="0" cy="-15" r="6" fill="none" stroke="#ffd898" stroke-width="0.7" filter="url(#i8p22p2bloom)" opacity="0.85"/>
      <ellipse cx="0" cy="-15" rx="3" ry="4" fill="#f0d8a8"/>
      <!-- ===== STRUCTURED GEOMETRIC WINGS — prismatic, dragonfly-like (NOT feathers) ===== -->
      <g stroke="#a86838" stroke-width="0.85" fill="none" filter="url(#i8p22p2bloom)" opacity="0.85">
        <!-- Left wing -->
        <path d="M-6,-7 L-22,-22 L-30,-9 L-30,5 L-22,11 L-6,3"/>
        <line x1="-6" y1="-7" x2="-30" y2="-7"/>
        <line x1="-22" y1="-22" x2="-22" y2="11"/>
        <line x1="-22" y1="-22" x2="-30" y2="5"/>
        <!-- Right wing -->
        <path d="M6,-7 L22,-22 L30,-9 L30,5 L22,11 L6,3"/>
        <line x1="6" y1="-7" x2="30" y2="-7"/>
        <line x1="22" y1="-22" x2="22" y2="11"/>
        <line x1="22" y1="-22" x2="30" y2="5"/>
      </g>
      <!-- Wing fill (faint gold paint) -->
      <path d="M-6,-7 L-22,-22 L-30,-9 L-30,5 L-22,11 L-6,3 Z" fill="#ffd898" opacity="0.4"/>
      <path d="M6,-7 L22,-22 L30,-9 L30,5 L22,11 L6,3 Z" fill="#ffd898" opacity="0.4"/>
    </g>
    <!-- Angel 2 (center, larger — primary figure) -->
    <g transform="translate(0 -3)">
      <ellipse cx="0" cy="-7" rx="9" ry="14" fill="#a89878"/>
      <circle cx="0" cy="-22" r="9" fill="none" stroke="#ffd898" stroke-width="0.85" filter="url(#i8p22p2bloom)" opacity="0.85"/>
      <ellipse cx="0" cy="-22" rx="4" ry="5" fill="#f0d8a8"/>
      <g stroke="#a86838" stroke-width="1" fill="none" filter="url(#i8p22p2bloom)" opacity="0.95">
        <path d="M-9,-7 L-30,-26 L-44,-11 L-44,9 L-30,18 L-9,7"/>
        <line x1="-9" y1="-7" x2="-44" y2="-7"/>
        <line x1="-30" y1="-26" x2="-30" y2="18"/>
        <line x1="-30" y1="-26" x2="-44" y2="9"/>
        <line x1="-30" y1="18" x2="-44" y2="-11"/>
        <line x1="-22" y1="-15" x2="-40" y2="-15"/>
        <line x1="-22" y1="9" x2="-40" y2="9"/>
        <path d="M9,-7 L30,-26 L44,-11 L44,9 L30,18 L9,7"/>
        <line x1="9" y1="-7" x2="44" y2="-7"/>
        <line x1="30" y1="-26" x2="30" y2="18"/>
        <line x1="30" y1="-26" x2="44" y2="9"/>
        <line x1="30" y1="18" x2="44" y2="-11"/>
        <line x1="22" y1="-15" x2="40" y2="-15"/>
        <line x1="22" y1="9" x2="40" y2="9"/>
      </g>
      <path d="M-9,-7 L-30,-26 L-44,-11 L-44,9 L-30,18 L-9,7 Z" fill="#ffd898" opacity="0.55"/>
      <path d="M9,-7 L30,-26 L44,-11 L44,9 L30,18 L9,7 Z" fill="#ffd898" opacity="0.55"/>
    </g>
    <!-- Angel 3 (right) -->
    <g transform="translate(60 0)">
      <ellipse cx="0" cy="-7" rx="6" ry="11" fill="#a89878"/>
      <circle cx="0" cy="-15" r="6" fill="none" stroke="#ffd898" stroke-width="0.7" filter="url(#i8p22p2bloom)" opacity="0.85"/>
      <ellipse cx="0" cy="-15" rx="3" ry="4" fill="#f0d8a8"/>
      <g stroke="#a86838" stroke-width="0.85" fill="none" filter="url(#i8p22p2bloom)" opacity="0.85">
        <path d="M-6,-7 L-22,-22 L-30,-9 L-30,5 L-22,11 L-6,3"/>
        <line x1="-6" y1="-7" x2="-30" y2="-7"/>
        <line x1="-22" y1="-22" x2="-22" y2="11"/>
        <line x1="-22" y1="-22" x2="-30" y2="5"/>
        <path d="M6,-7 L22,-22 L30,-9 L30,5 L22,11 L6,3"/>
        <line x1="6" y1="-7" x2="30" y2="-7"/>
        <line x1="22" y1="-22" x2="22" y2="11"/>
        <line x1="22" y1="-22" x2="30" y2="5"/>
      </g>
      <path d="M-6,-7 L-22,-22 L-30,-9 L-30,5 L-22,11 L-6,3 Z" fill="#ffd898" opacity="0.4"/>
      <path d="M6,-7 L22,-22 L30,-9 L30,5 L22,11 L6,3 Z" fill="#ffd898" opacity="0.4"/>
    </g>

    <!-- Mural caption (faint gold inscription) -->
    <text x="-40" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="3" fill="#5a4828" font-style="italic" opacity="0.85">SANCTUS · SANCTUS</text>

    <!-- Painted glow seems to emanate from the wings (warm catch in candlelight) -->
    <ellipse cx="0" cy="-7" rx="44" ry="9" fill="#ffd898" opacity="0.18" filter="url(#i8p22p2glow)"/>
  </g>

  <!-- ===== CANDLE on altar (warm light source) ===== -->
  <g transform="translate(371 195)">
    <!-- Tall candle to the side -->
    <g transform="translate(-50 0)">
      <rect x="-2" y="-22" width="4" height="22" fill="#fff8d8"/>
      <ellipse cx="0" cy="-26" rx="2" ry="3" fill="#fff8d8" filter="url(#i8p22p2strongglow)"/>
    </g>
    <g transform="translate(50 0)">
      <rect x="-2" y="-22" width="4" height="22" fill="#fff8d8"/>
      <ellipse cx="0" cy="-26" rx="2" ry="3" fill="#fff8d8" filter="url(#i8p22p2strongglow)"/>
    </g>
  </g>
  <!-- Candle halos -->
  <ellipse cx="321" cy="170" rx="80" ry="40" fill="url(#i8p22p2candleHalo)" filter="url(#i8p22p2megaglow)" opacity="0.55"/>
  <ellipse cx="421" cy="170" rx="80" ry="40" fill="url(#i8p22p2candleHalo)" filter="url(#i8p22p2megaglow)" opacity="0.55"/>

  <!-- Dust motes in colored shafts -->
  <g fill="#fff8d8" opacity="0.55" filter="url(#i8p22p2bloom)">
    <circle cx="120" cy="120" r="0.55"/>
    <circle cx="180" cy="140" r="0.4"/>
    <circle cx="600" cy="120" r="0.55"/>
    <circle cx="650" cy="140" r="0.4"/>
  </g>

  <!-- ===== CAPTION ===== -->
  <g>
    <rect x="14" y="14" width="380" height="36" rx="2" fill="#fff8e8" stroke="#5a3818" stroke-width="0.85" opacity="0.92"/>
  </g>
  <text x="22" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">The good folk lived here once, the stories said.</text>
  <text x="22" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#5a3818" font-style="italic">Before the church. Before the city remembered itself.</text>

  <!-- Brushwork overlay -->
  <g stroke="#3a2818" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
