<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 10 — Panel 3: Luma follows the glyph trail — a chronicle stretching deeper into the basement, blue-violet ribbon of testimony in the dark</title>
  <desc>28mm wide eye level. Rough stone wall stretches across frame, along its base trail of geometric glyphs glow with residual blue-violet phosphorescence — ribbon of fairy script awakened by scanner's passage, stretching deeper into basement darkness. Tiny figure in sapphire-violet suit follows trail, scanner held forward, each new glyph responding as she passes. Glyphs carved at fairy height — four inches from floor — chronicle left by someone at her scale. Behind her awakened glyphs fade slowly back to dormancy. Ahead more glyphs wait in darkness. In far background Theodore's candle warm amber anchor.</desc>

  <defs>
    <linearGradient id="i8p10p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p10p3stoneWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <radialGradient id="i8p10p3candleDistant" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p10p3scannerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p10p3lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p10p3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i8p10p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p10p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p10p3strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p10p3megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p10p3bg)"/>

  <!-- Distant warm candle from far left (Theodore's anchor) -->
  <ellipse cx="0" cy="180" rx="80" ry="60" fill="url(#i8p10p3candleDistant)" filter="url(#i8p10p3megaglow)"/>

  <!-- Stone wall along entire frame -->
  <rect x="0" y="0" width="742" height="220" fill="url(#i8p10p3stoneWall)"/>
  <!-- Hand-cut stone (ancient, pre-Norman) -->
  <g stroke="#040408" stroke-width="0.7" fill="none" opacity="0.85">
    <path d="M0,40 L80,42 L160,38 L260,40 L360,38 L460,40 L560,38 L660,40 L742,42"/>
    <path d="M0,80 L80,82 L160,78 L260,80 L360,78 L460,80 L560,78 L660,80 L742,82"/>
    <path d="M0,120 L80,122 L160,118 L260,120 L360,118 L460,120 L560,118 L660,120 L742,122"/>
    <path d="M0,160 L80,162 L160,158 L260,160 L360,158 L460,160 L560,158 L660,160 L742,162"/>
    <line x1="80" y1="0" x2="80" y2="40"/>
    <line x1="200" y1="0" x2="200" y2="40"/>
    <line x1="320" y1="0" x2="320" y2="40"/>
    <line x1="440" y1="0" x2="440" y2="40"/>
    <line x1="560" y1="0" x2="560" y2="40"/>
    <line x1="660" y1="0" x2="660" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="160" y1="40" x2="160" y2="80"/>
    <line x1="280" y1="40" x2="280" y2="80"/>
    <line x1="400" y1="40" x2="400" y2="80"/>
    <line x1="520" y1="40" x2="520" y2="80"/>
    <line x1="640" y1="40" x2="640" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="120"/>
    <line x1="220" y1="80" x2="220" y2="120"/>
    <line x1="340" y1="80" x2="340" y2="120"/>
    <line x1="460" y1="80" x2="460" y2="120"/>
    <line x1="580" y1="80" x2="580" y2="120"/>
    <line x1="680" y1="80" x2="680" y2="120"/>
    <line x1="60" y1="120" x2="60" y2="160"/>
    <line x1="180" y1="120" x2="180" y2="160"/>
    <line x1="300" y1="120" x2="300" y2="160"/>
    <line x1="420" y1="120" x2="420" y2="160"/>
    <line x1="540" y1="120" x2="540" y2="160"/>
    <line x1="660" y1="120" x2="660" y2="160"/>
  </g>
  <!-- Stone weathering -->
  <g fill="#0a0408" opacity="0.55">
    <ellipse cx="60" cy="60" rx="22" ry="9"/>
    <ellipse cx="240" cy="100" rx="22" ry="9"/>
    <ellipse cx="380" cy="60" rx="14" ry="6"/>
    <ellipse cx="560" cy="100" rx="22" ry="9"/>
    <ellipse cx="640" cy="60" rx="14" ry="6"/>
  </g>

  <!-- Floor (just below stone wall row) -->
  <rect x="0" y="220" width="742" height="80" fill="#040408"/>
  <!-- Pebbles/dust on floor -->
  <g fill="#1a1208" opacity="0.85">
    <ellipse cx="60" cy="240" rx="6" ry="2"/>
    <ellipse cx="180" cy="245" rx="9" ry="3"/>
    <ellipse cx="280" cy="240" rx="6" ry="2"/>
    <ellipse cx="380" cy="250" rx="11" ry="3"/>
    <ellipse cx="480" cy="240" rx="6" ry="2"/>
    <ellipse cx="600" cy="245" rx="9" ry="3"/>
    <ellipse cx="700" cy="240" rx="6" ry="2"/>
  </g>

  <!-- ===== TRAIL OF GLYPHS along the wall base (at fairy height — ~190y position) ===== -->
  <!-- Glyph 1 — far left, FADING (already passed, dimming back) -->
  <g transform="translate(60 195)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#3a1858" opacity="0.7"/>
    <g stroke="#7848b8" stroke-width="0.55" fill="none" filter="url(#i8p10p3bloom)" opacity="0.7">
      <circle cx="0" cy="0" r="9"/>
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
  </g>

  <!-- Glyph 2 — left, fading -->
  <g transform="translate(140 195)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#3a1858" opacity="0.7"/>
    <g stroke="#a878e8" stroke-width="0.55" fill="none" filter="url(#i8p10p3bloom)" opacity="0.85">
      <polygon points="-9,-7 -3,-9 3,-9 9,-7 9,7 3,9 -3,9 -9,7"/>
      <line x1="-9" y1="0" x2="9" y2="0"/>
    </g>
  </g>

  <!-- Glyph 3 — mid-left, brighter -->
  <g transform="translate(220 195)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#5a4ab8" opacity="0.85"/>
    <g stroke="#c8a8e8" stroke-width="0.7" fill="none" filter="url(#i8p10p3bloom)" opacity="0.95">
      <circle cx="0" cy="0" r="11"/>
      <polygon points="-7,-7 7,-7 7,7 -7,7"/>
      <line x1="-7" y1="0" x2="7" y2="0"/>
    </g>
  </g>

  <!-- Glyph 4 — center, BRIGHT (where Luma is now) -->
  <g transform="translate(310 195)" opacity="0.95">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#7848b8" filter="url(#i8p10p3strongglow)" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#a878e8" filter="url(#i8p10p3bloom)" opacity="0.95"/>
    <g stroke="#fff" stroke-width="0.85" fill="none" filter="url(#i8p10p3bloom)" opacity="0.95">
      <circle cx="0" cy="0" r="14"/>
      <circle cx="0" cy="0" r="7"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <polygon points="-7,-7 7,-7 7,7 -7,7"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#fff" filter="url(#i8p10p3bloom)"/>
  </g>

  <!-- Glyph 5 — mid-right, just waking -->
  <g transform="translate(420 195)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#5a4ab8" filter="url(#i8p10p3glow)" opacity="0.85"/>
    <g stroke="#c8a8e8" stroke-width="0.7" fill="none" filter="url(#i8p10p3bloom)" opacity="0.95">
      <circle cx="0" cy="0" r="11"/>
      <line x1="-9" y1="-7" x2="9" y2="7"/>
      <line x1="-9" y1="7" x2="9" y2="-7"/>
      <polygon points="-7,0 0,-7 7,0 0,7"/>
    </g>
  </g>

  <!-- Glyph 6 — right, dimmer (not yet woken) -->
  <g transform="translate(520 195)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="11" ry="6" fill="#3a1858" opacity="0.55"/>
    <g stroke="#7848b8" stroke-width="0.55" fill="none" filter="url(#i8p10p3bloom)" opacity="0.7">
      <circle cx="0" cy="0" r="9"/>
      <polygon points="-7,-5 7,-5 0,5"/>
    </g>
  </g>

  <!-- Glyph 7 — far right, dormant (ahead, waiting) -->
  <g transform="translate(620 195)" opacity="0.4">
    <g stroke="#3a1858" stroke-width="0.55" fill="none">
      <circle cx="0" cy="0" r="9"/>
      <line x1="-7" y1="0" x2="7" y2="0"/>
      <polygon points="-5,-5 5,-5 5,5 -5,5"/>
    </g>
  </g>
  <!-- Glyph 8 — barely visible -->
  <g transform="translate(700 195)" opacity="0.18">
    <g stroke="#3a1858" stroke-width="0.4" fill="none">
      <circle cx="0" cy="0" r="7"/>
    </g>
  </g>

  <!-- ===== TRAIL line connecting the glyphs (light ribbon) ===== -->
  <g stroke="#a878e8" stroke-width="0.4" fill="none" opacity="0.55" filter="url(#i8p10p3bloom)">
    <path d="M60,195 Q140,200 220,195 Q300,190 380,195 Q460,200 540,195"/>
  </g>

  <!-- ===== LUMA mid-frame, scanner forward ===== -->
  <g transform="translate(310 220)">
    <!-- Body -->
    <path d="M-5,11 L-7,3 L-9,-7 L-7,-15 L-3,-22 L3,-22 L7,-15 L9,-7 L7,3 L5,11 Z" fill="url(#i8p10p3lumaSuit)"/>
    <line x1="0" y1="-15" x2="0" y2="9" stroke="#c8a8e8" stroke-width="0.55" filter="url(#i8p10p3bloom)" opacity="0.95"/>

    <!-- Arm forward with scanner -->
    <path d="M7,-7 L14,-3 L11,3 L5,0 Z" fill="url(#i8p10p3lumaSuit)"/>
    <ellipse cx="14" cy="-3" rx="2" ry="1.4" fill="url(#i8p10p3skin)"/>
    <rect x="14" y="-7" width="6" height="6" fill="#3a1858"/>
    <ellipse cx="17" cy="-3" rx="2" ry="0.55" fill="#a878e8" filter="url(#i8p10p3bloom)" opacity="0.95"/>
    <!-- Scanner beam to next glyph (right) -->
    <line x1="20" y1="-3" x2="60" y2="-25" stroke="#a878e8" stroke-width="0.85" filter="url(#i8p10p3bloom)" opacity="0.95"/>

    <!-- Other arm at side -->
    <path d="M-7,-7 L-11,5 L-7,11 L-5,3 Z" fill="url(#i8p10p3lumaSuit)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-25" rx="3" ry="3.5" fill="url(#i8p10p3skin)"/>
    <!-- Braid -->
    <path d="M2,-22 Q5,-15 7,3" stroke="#1a0808" stroke-width="1.4" fill="none"/>
    <path d="M2,-22 Q5,-15 7,3" stroke="#a878e8" stroke-width="0.4" fill="none" filter="url(#i8p10p3bloom)" opacity="0.95"/>
    <ellipse cx="5" cy="-7" rx="1.4" ry="0.4" fill="#c8a8e8" filter="url(#i8p10p3bloom)" opacity="0.95"/>
    <!-- Hair -->
    <path d="M-3,-29 Q0,-31 3,-29 L3,-25 Q0,-27 -3,-25 Z" fill="#1a0808"/>
    <!-- Lenses -->
    <ellipse cx="-1" cy="-25" rx="1.4" ry="1" fill="none" stroke="#a878e8" stroke-width="0.4" filter="url(#i8p10p3bloom)" opacity="0.95"/>
    <ellipse cx="2" cy="-25" rx="1.4" ry="1" fill="none" stroke="#a878e8" stroke-width="0.4" filter="url(#i8p10p3bloom)" opacity="0.95"/>
    <!-- Eyes -->
    <circle cx="-1" cy="-25" r="0.4" fill="#fff8e8" filter="url(#i8p10p3bloom)"/>
    <circle cx="2" cy="-25" r="0.4" fill="#fff8e8" filter="url(#i8p10p3bloom)"/>
    <!-- Mouth open (urgency) -->
    <ellipse cx="0" cy="-22" rx="0.55" ry="0.4" fill="#3a1808"/>
  </g>
  <!-- Halo around Luma -->
  <ellipse cx="310" cy="200" rx="60" ry="40" fill="url(#i8p10p3scannerHalo)" filter="url(#i8p10p3megaglow)"/>

  <!-- ===== DIALOGUE ===== -->
  <!-- LUMA -->
  <g>
    <rect x="14" y="14" width="500" height="68" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">It continues. Theodore, it continues. This is a chronicle —</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">operational reports, environmental data, temporal readings.</text>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">Year after year. For... for centuries.</text>

  <!-- THEODORE distant -->
  <g>
    <rect x="14" y="92" width="338" height="36" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE  <tspan font-style="italic" font-size="8" font-weight="500">(distant)</tspan></text>
  <text x="22" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">Centuries? One person?</text>

  <!-- LUMA 2 -->
  <g>
    <rect x="408" y="92" width="320" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="416" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="416" y="122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I don't know yet.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
