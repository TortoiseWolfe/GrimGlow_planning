<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 2 — Panel 2: Sable close-up — the question that betrays — control masking foreknowledge — mixed violet and Titan-bruise light</title>
  <desc>85mm close-up. Sable's face. Calm command authority but the calm is too precise, too composed for someone hearing this for the first time. Jaw muscle tight. Eyes steady, focused, tracking something internal. Mixed holographic light — structured blue-violet fairy from one side, dark iridescent Titan trace from the other. Scuffed silver suit catches both, reflecting neither cleanly. Control masking foreknowledge.</desc>

  <defs>
    <linearGradient id="i8p2p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0814"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <radialGradient id="i8p2p2violet" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p2p2titan" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#3a1838" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#040208" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p2p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </linearGradient>
    <linearGradient id="i8p2p2skinViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6848a0"/>
      <stop offset="100%" stop-color="#2a1858"/>
    </linearGradient>
    <linearGradient id="i8p2p2skinTitan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1838"/>
      <stop offset="100%" stop-color="#1a0818"/>
    </linearGradient>
    <filter id="i8p2p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p2p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p2p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="i8p2p2wrongness"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p2p2bg)"/>

  <!-- Left side: violet fairy light -->
  <ellipse cx="0" cy="150" rx="180" ry="220" fill="url(#i8p2p2violet)" filter="url(#i8p2p2megaglow)"/>
  <!-- Right side: dark iridescent Titan light (the wrongness washing over half her face) -->
  <ellipse cx="366" cy="150" rx="180" ry="220" fill="url(#i8p2p2titan)" filter="url(#i8p2p2wrongness)"/>

  <!-- Iridescent edge between the two lights -->
  <ellipse cx="183" cy="150" rx="14" ry="200" fill="#3a1838" opacity="0.4" filter="url(#i8p2p2glow)"/>

  <!-- ===== SABLE close-up ===== -->
  <g transform="translate(183 175)">
    <!-- Suit collar — split lit -->
    <path d="M-44,80 L-30,40 L-22,30 L22,30 L30,40 L44,80 L60,140 L-60,140 Z" fill="url(#i8p2p2suit)"/>
    <!-- Heavy soot wear -->
    <ellipse cx="-18" cy="60" rx="11" ry="6" fill="#1a1818" opacity="0.85"/>
    <ellipse cx="18" cy="80" rx="9" ry="4" fill="#1a1818" opacity="0.7"/>
    <!-- Tension wear crease -->
    <line x1="-22" y1="40" x2="22" y2="40" stroke="#1a1a20" stroke-width="0.85" opacity="0.85"/>
    <!-- Suit accent -->
    <line x1="0" y1="40" x2="0" y2="120" stroke="#fff" stroke-width="0.55" opacity="0.55" filter="url(#i8p2p2bloom)"/>

    <!-- Neck — split lit -->
    <path d="M-9,30 L9,30 L9,18 L-9,18 Z" fill="url(#i8p2p2skinViolet)"/>
    <path d="M0,30 L9,30 L9,18 L0,18 Z" fill="url(#i8p2p2skinTitan)"/>

    <!-- Jaw — split lit -->
    <!-- Left (violet) -->
    <path d="M-22,-9 L-26,11 L-18,30 L0,40 L0,-22 L-11,-22 Z" fill="url(#i8p2p2skinViolet)"/>
    <!-- Right (titan dark) -->
    <path d="M22,-9 L26,11 L18,30 L0,40 L0,-22 L11,-22 Z" fill="url(#i8p2p2skinTitan)"/>

    <!-- Head proper — split lit -->
    <path d="M0,-110 L18,-104 L26,-86 L26,-66 L18,-58 L0,-58 Z" fill="url(#i8p2p2skinTitan)"/>
    <path d="M0,-110 L-18,-104 L-26,-86 L-26,-66 L-18,-58 L0,-58 Z" fill="url(#i8p2p2skinViolet)"/>

    <!-- Silver-white cropped hair (catching both lights) -->
    <path d="M-26,-110 Q-22,-118 -14,-120 L0,-122 L14,-120 Q22,-118 26,-110 L26,-92 Q14,-104 0,-104 Q-14,-104 -26,-92 Z" fill="#a8a8b0"/>
    <!-- Hair texture, half violet half iridescent -->
    <g stroke="#c8a8e8" stroke-width="0.4" opacity="0.7" filter="url(#i8p2p2bloom)">
      <line x1="-22" y1="-114" x2="-7" y2="-114"/>
      <line x1="-3" y1="-118" x2="0" y2="-118"/>
    </g>
    <g stroke="#3a1838" stroke-width="0.4" opacity="0.7" filter="url(#i8p2p2bloom)">
      <line x1="0" y1="-118" x2="11" y2="-118"/>
      <line x1="9" y1="-114" x2="22" y2="-114"/>
    </g>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-92" rx="22" ry="4" fill="#1a1018" opacity="0.55"/>

    <!-- Brows — flat hard line, JAW MUSCLE TIGHT -->
    <line x1="-22" y1="-86" x2="-7" y2="-88" stroke="#1a0808" stroke-width="2"/>
    <line x1="7" y1="-88" x2="22" y2="-86" stroke="#1a0808" stroke-width="2"/>

    <!-- Eyes — STEADY, focused, tracking something internal -->
    <ellipse cx="-9" cy="-78" rx="5" ry="3" fill="#fff8e8"/>
    <ellipse cx="-9" cy="-78" rx="2" ry="2" fill="#3a2818"/>
    <circle cx="-9" cy="-78" r="0.85" fill="#0a0408"/>
    <ellipse cx="9" cy="-78" rx="5" ry="3" fill="#fff8e8"/>
    <ellipse cx="9" cy="-78" rx="2" ry="2" fill="#3a2818"/>
    <circle cx="9" cy="-78" r="0.85" fill="#0a0408"/>

    <!-- Catchlights — violet on left, titan-bruise on right -->
    <circle cx="-7" cy="-80" r="0.85" fill="#c8a8e8" filter="url(#i8p2p2bloom)" opacity="0.95"/>
    <circle cx="11" cy="-80" r="0.85" fill="#3a1838" filter="url(#i8p2p2bloom)" opacity="0.95"/>

    <!-- Lid tightness -->
    <line x1="-14" y1="-72" x2="-3" y2="-72" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>
    <line x1="3" y1="-72" x2="14" y2="-72" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>

    <!-- Nose — split lit -->
    <path d="M-3,-72 L-2,-58 L0,-58 L0,-72 Z" fill="#3a1838" opacity="0.55"/>
    <path d="M0,-72 L0,-58 L2,-58 L3,-72 Z" fill="#1a0818" opacity="0.55"/>
    <line x1="-2" y1="-58" x2="2" y2="-58" stroke="#1a0808" stroke-width="0.4"/>

    <!-- JAW MUSCLE — visible tension, the tell -->
    <ellipse cx="-14" cy="-62" rx="3" ry="6" fill="#1a0818" opacity="0.85"/>
    <ellipse cx="14" cy="-62" rx="3" ry="6" fill="#1a0818" opacity="0.85"/>

    <!-- Mouth — flat, asking the technical question -->
    <line x1="-9" y1="-58" x2="9" y2="-58" stroke="#1a0808" stroke-width="1.4"/>
    <ellipse cx="-9" cy="-58" rx="1.4" ry="0.85" fill="#3a1808" opacity="0.55"/>
    <ellipse cx="9" cy="-58" rx="1.4" ry="0.85" fill="#3a1808" opacity="0.55"/>

    <!-- Cheekbone shadow -->
    <ellipse cx="-18" cy="-66" rx="5" ry="9" fill="#1a1018" opacity="0.7"/>
    <ellipse cx="18" cy="-66" rx="5" ry="9" fill="#1a0818" opacity="0.7"/>
  </g>

  <!-- ===== DIALOGUE — SABLE — the too-precise question ===== -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Do older glyphs correlate with older Titan traces?</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Is there temporal overlap at each site?</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
