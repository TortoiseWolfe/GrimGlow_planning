<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 19 — Panel 2: Luma in the pocket — haunted, unfocused, the word repeating — "They chose to stay"</title>
  <desc>85mm close-up. Luma in Theodore's waistcoat breast pocket — one hand holding pocket fabric edge, other limp at side. Holographic lenses dimmed but still scrolling data slowly — glyph recordings replaying. Eyes unfocused behind lenses, seeing something beyond data. Expression haunted — scientific composure broken, replaced by look of someone replaying moment they can't process. Luminous filament in braid pulses erratically. Sapphire-violet suit nodes glow faintly. Beyond pocket, warm amber gaslight filters through fabric.</desc>

  <defs>
    <linearGradient id="i8p19p2pocket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <radialGradient id="i8p19p2violetField" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p19p2pocketAmber" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p19p2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p19p2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8a878"/>
      <stop offset="100%" stop-color="#7a4828"/>
    </linearGradient>
    <filter id="i8p19p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p19p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p19p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p19p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="i8p19p2dataPulse"><feGaussianBlur stdDeviation="0.55"/></filter>
  </defs>

  <!-- Pocket interior framing -->
  <rect width="366" height="300" fill="url(#i8p19p2pocket)"/>
  <!-- Wool texture -->
  <g stroke="#7a5028" stroke-width="0.55" opacity="0.55" fill="none">
    <path d="M0,40 Q90,50 180,40 Q270,30 366,40"/>
    <path d="M0,80 Q90,90 180,80 Q270,70 366,80"/>
    <path d="M0,160 Q90,170 180,160 Q270,150 366,160"/>
    <path d="M0,240 Q90,250 180,240 Q270,230 366,240"/>
  </g>
  <g stroke="#3a2010" stroke-width="0.4" opacity="0.4">
    <line x1="40" y1="0" x2="42" y2="300"/>
    <line x1="120" y1="0" x2="122" y2="300"/>
    <line x1="240" y1="0" x2="242" y2="300"/>
    <line x1="320" y1="0" x2="322" y2="300"/>
  </g>

  <!-- Pocket OPENING at top — warm amber filtering through -->
  <path d="M0,0 L366,0 L340,80 L26,80 Z" fill="#1a1008"/>
  <ellipse cx="183" cy="40" rx="220" ry="50" fill="url(#i8p19p2pocketAmber)" filter="url(#i8p19p2megaglow)"/>

  <!-- Violet field around Luma -->
  <ellipse cx="183" cy="180" rx="200" ry="120" fill="url(#i8p19p2violetField)" filter="url(#i8p19p2megaglow)"/>

  <!-- ===== LUMA in the pocket ===== -->
  <g transform="translate(183 180)">
    <!-- Body -->
    <path d="M-22,80 L-26,40 L-30,11 L-26,-22 L-22,-50 L-9,-66 L9,-66 L22,-50 L30,-22 L26,11 L22,40 L18,80 Z" fill="url(#i8p19p2suit)"/>

    <!-- Heavy ink stains -->
    <ellipse cx="-26" cy="11" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>
    <ellipse cx="26" cy="11" rx="6" ry="3" fill="#1a0810" opacity="0.95"/>

    <!-- Suit accent (faint) -->
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#c8a8e8" stroke-width="0.55" opacity="0.55" filter="url(#i8p19p2bloom)"/>
    <circle cx="-9" cy="-30" r="1" fill="#c8a8e8" filter="url(#i8p19p2bloom)" opacity="0.7"/>
    <circle cx="9" cy="-30" r="1" fill="#c8a8e8" filter="url(#i8p19p2bloom)" opacity="0.7"/>

    <!-- ===== ONE HAND holding pocket fabric edge ===== -->
    <path d="M-30,-22 L-50,-3 L-44,11 L-22,3 Z" fill="url(#i8p19p2suit)"/>
    <ellipse cx="-50" cy="-3" rx="3" ry="2" fill="url(#i8p19p2skin)"/>
    <!-- Fingers gripping fabric edge -->
    <line x1="-55" y1="-7" x2="-55" y2="3" stroke="#1a0606" stroke-width="0.55"/>
    <line x1="-50" y1="-3" x2="-50" y2="0" stroke="#1a0606" stroke-width="0.55"/>

    <!-- Other arm LIMP at side -->
    <path d="M30,-22 L36,11 L26,18 L22,3 Z" fill="url(#i8p19p2suit)"/>
    <ellipse cx="36" cy="14" rx="3" ry="2" fill="url(#i8p19p2skin)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-86" rx="22" ry="22" fill="url(#i8p19p2skin)"/>

    <!-- Long thick BRAID — filament PULSING ERRATICALLY -->
    <path d="M11,-72 Q22,-30 30,40" stroke="#1a0808" stroke-width="3.5" fill="none"/>
    <g stroke="#a878e8" stroke-width="0.7" fill="none" filter="url(#i8p19p2bloom)" opacity="0.85">
      <path d="M11,-72 Q22,-30 30,40"/>
    </g>
    <!-- Erratic pulses (uneven brightness — the disruption) -->
    <ellipse cx="22" cy="-30" rx="3" ry="1" fill="#fff" filter="url(#i8p19p2strongglow)" opacity="0.85"/>
    <ellipse cx="28" cy="3" rx="2" ry="0.85" fill="#7848b8" filter="url(#i8p19p2bloom)" opacity="0.4"/>
    <ellipse cx="30" cy="22" rx="3" ry="1" fill="#c8a8e8" filter="url(#i8p19p2strongglow)" opacity="0.95"/>

    <!-- Hair pulled back -->
    <path d="M-22,-100 Q0,-104 22,-100 L22,-86 Q11,-90 0,-90 Q-11,-90 -22,-86 Z" fill="#1a0808"/>

    <!-- ===== HOLOGRAPHIC LENSES — DIMMED but data scrolls slowly ===== -->
    <ellipse cx="0" cy="-86" rx="32" ry="9" fill="#7848b8" filter="url(#i8p19p2strongglow)" opacity="0.4"/>
    <ellipse cx="-9" cy="-86" rx="6" ry="4" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p19p2bloom)" opacity="0.55"/>
    <ellipse cx="-9" cy="-86" rx="4" ry="3" fill="#3a1858" opacity="0.55"/>
    <ellipse cx="9" cy="-86" rx="6" ry="4" fill="none" stroke="#a878e8" stroke-width="0.55" filter="url(#i8p19p2bloom)" opacity="0.55"/>
    <ellipse cx="9" cy="-86" rx="4" ry="3" fill="#3a1858" opacity="0.55"/>

    <!-- ===== "STAY" replaying in lenses (faint, ghosted) ===== -->
    <g fill="#c8a8e8" filter="url(#i8p19p2dataPulse)" opacity="0.7">
      <text x="-15" y="-83" font-family="monospace" font-size="2.5" font-weight="700">STAY</text>
      <text x="3" y="-83" font-family="monospace" font-size="2.5" font-weight="700">STAY</text>
    </g>

    <!-- Eyes UNFOCUSED behind lenses -->
    <circle cx="-9" cy="-86" r="0.85" fill="#fff8e8" filter="url(#i8p19p2bloom)" opacity="0.7"/>
    <circle cx="9" cy="-86" r="0.85" fill="#fff8e8" filter="url(#i8p19p2bloom)" opacity="0.7"/>
    <!-- The "thousand-yard stare" — eyes don't focus on anything -->

    <!-- Brows slightly drawn (haunted) -->
    <line x1="-15" y1="-94" x2="-3" y2="-94" stroke="#3a1808" stroke-width="0.85"/>
    <line x1="3" y1="-94" x2="15" y2="-94" stroke="#3a1808" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M-2,-78 L0,-66 L3,-66 L3,-78 Z" fill="#7a4818" opacity="0.55"/>

    <!-- Mouth — slightly parted, the quiet word -->
    <line x1="-7" y1="-66" x2="7" y2="-66" stroke="#3a1808" stroke-width="0.55"/>
    <ellipse cx="0" cy="-66" rx="1.4" ry="0.55" fill="#3a1808" opacity="0.7"/>
  </g>

  <!-- ===== DIALOGUE ===== -->
  <!-- LUMA quiet -->
  <g>
    <rect x="14" y="14" width="160" height="32" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA  <tspan font-style="italic" font-size="8" font-weight="500">(quiet)</tspan></text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">Stay.</text>

  <!-- LUMA again -->
  <g>
    <rect x="14" y="56" width="240" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="1.4" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">They chose to stay.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
