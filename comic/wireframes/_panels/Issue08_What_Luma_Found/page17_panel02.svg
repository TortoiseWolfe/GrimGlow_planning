<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 17 — Panel 2: The gentle fist — Thresh's gauntleted hand closing slowly, holding the memory — the soldier's hand performing a gesture that has nothing to do with fighting</title>
  <desc>85mm slight high angle. Thresh's gauntleted hand. Armored fingers closing slowly — not into combat fist but gently, as if holding something invisible. Dented ruby-crimson plating catches warm amber gaslight. Crimson holographic nodes at knuckles and wrist pulse softly. Hand making gentle fist — soldier's hand performing gesture that has nothing to do with fighting. Cobblestones beneath hand rough and dark. Shadow surrounds. The gentle fist.</desc>

  <defs>
    <linearGradient id="i8p17p2bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p17p2cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <radialGradient id="i8p17p2warmAmber" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p17p2gauntletPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="i8p17p2gauntletHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c83838"/>
      <stop offset="100%" stop-color="#5a1410"/>
    </linearGradient>
    <filter id="i8p17p2bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p17p2glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p17p2strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p17p2megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p17p2bg)"/>

  <!-- Warm amber glow from above (the gaslight catching the hand) -->
  <ellipse cx="371" cy="0" rx="500" ry="200" fill="url(#i8p17p2warmAmber)" filter="url(#i8p17p2megaglow)"/>

  <!-- ===== COBBLESTONES (close-up, beneath the hand) ===== -->
  <rect x="0" y="200" width="742" height="100" fill="url(#i8p17p2cobble)"/>
  <g stroke="#040408" stroke-width="0.85" fill="none" opacity="0.7">
    <ellipse cx="80" cy="240" rx="40" ry="11"/>
    <ellipse cx="220" cy="245" rx="50" ry="14"/>
    <ellipse cx="380" cy="240" rx="50" ry="14"/>
    <ellipse cx="540" cy="245" rx="50" ry="14"/>
    <ellipse cx="660" cy="240" rx="40" ry="11"/>
    <ellipse cx="120" cy="280" rx="40" ry="11"/>
    <ellipse cx="280" cy="285" rx="50" ry="14"/>
    <ellipse cx="440" cy="280" rx="50" ry="14"/>
    <ellipse cx="600" cy="285" rx="50" ry="14"/>
  </g>
  <!-- Dust between stones -->
  <g fill="#1a1208" opacity="0.55">
    <ellipse cx="160" cy="260" rx="14" ry="3"/>
    <ellipse cx="320" cy="265" rx="14" ry="3"/>
    <ellipse cx="500" cy="262" rx="14" ry="3"/>
  </g>

  <!-- ===== GAUNTLETED HAND — large in close-up frame ===== -->
  <g transform="translate(371 170)">
    <!-- Forearm (cropped at frame edge) -->
    <path d="M-100,40 L-180,30 L-180,-15 L-100,-30 L-44,-7 L-44,18 Z" fill="url(#i8p17p2gauntletPlate)"/>
    <!-- Plate seams on forearm -->
    <line x1="-180" y1="-15" x2="-100" y2="-30" stroke="#1a0606" stroke-width="0.85"/>
    <line x1="-180" y1="30" x2="-100" y2="40" stroke="#1a0606" stroke-width="0.85"/>
    <line x1="-150" y1="-22" x2="-150" y2="36" stroke="#1a0606" stroke-width="0.55"/>
    <line x1="-120" y1="-26" x2="-120" y2="38" stroke="#1a0606" stroke-width="0.55"/>
    <!-- Heavy dents on forearm -->
    <ellipse cx="-150" cy="3" rx="14" ry="6" fill="#3a0a0a"/>
    <ellipse cx="-110" cy="11" rx="11" ry="4" fill="#5a1410"/>
    <!-- Faint highlight rim (warm catch) -->
    <line x1="-150" y1="-22" x2="-100" y2="-30" stroke="#c83838" stroke-width="0.85" filter="url(#i8p17p2bloom)" opacity="0.55"/>

    <!-- ===== HAND — closing into GENTLE FIST ===== -->
    <!-- Hand back -->
    <ellipse cx="-15" cy="0" rx="50" ry="32" fill="url(#i8p17p2gauntletPlate)"/>
    <!-- Knuckle ridge -->
    <path d="M-44,-22 L36,-14" stroke="url(#i8p17p2gauntletHi)" stroke-width="3" filter="url(#i8p17p2bloom)" opacity="0.85"/>
    <!-- Plate divisions on hand back -->
    <line x1="-50" y1="-9" x2="40" y2="-3" stroke="#1a0606" stroke-width="0.85"/>
    <line x1="-50" y1="9" x2="40" y2="14" stroke="#1a0606" stroke-width="0.85"/>

    <!-- Crimson nodes at knuckles and wrist (pulsing softly) -->
    <circle cx="-22" cy="-15" r="2.5" fill="#f04838" filter="url(#i8p17p2strongglow)" opacity="0.95"/>
    <circle cx="-7" cy="-15" r="2.5" fill="#f04838" filter="url(#i8p17p2strongglow)" opacity="0.95"/>
    <circle cx="9" cy="-11" r="2.5" fill="#f04838" filter="url(#i8p17p2strongglow)" opacity="0.95"/>
    <circle cx="22" cy="-11" r="2.5" fill="#f04838" filter="url(#i8p17p2strongglow)" opacity="0.95"/>
    <!-- Wrist node -->
    <circle cx="-44" cy="0" r="2" fill="#f04838" filter="url(#i8p17p2bloom)" opacity="0.85"/>

    <!-- Fingers curled INWARD (gentle fist — not combat) -->
    <!-- Each finger curls back into palm -->
    <ellipse cx="-22" cy="-22" rx="6" ry="11" fill="url(#i8p17p2gauntletPlate)"/>
    <ellipse cx="-22" cy="-3" rx="5" ry="9" fill="url(#i8p17p2gauntletPlate)"/>
    <line x1="-22" y1="-15" x2="-15" y2="-7" stroke="#1a0606" stroke-width="0.55"/>

    <ellipse cx="-7" cy="-22" rx="6" ry="11" fill="url(#i8p17p2gauntletPlate)"/>
    <ellipse cx="-7" cy="-3" rx="5" ry="9" fill="url(#i8p17p2gauntletPlate)"/>
    <line x1="-7" y1="-15" x2="0" y2="-7" stroke="#1a0606" stroke-width="0.55"/>

    <ellipse cx="9" cy="-18" rx="5" ry="9" fill="url(#i8p17p2gauntletPlate)"/>
    <ellipse cx="9" cy="0" rx="4" ry="7" fill="url(#i8p17p2gauntletPlate)"/>
    <line x1="9" y1="-11" x2="14" y2="-3" stroke="#1a0606" stroke-width="0.55"/>

    <ellipse cx="22" cy="-15" rx="4" ry="7" fill="url(#i8p17p2gauntletPlate)"/>
    <ellipse cx="22" cy="0" rx="3" ry="5" fill="url(#i8p17p2gauntletPlate)"/>

    <!-- Thumb (visible, curled around the gesture) -->
    <ellipse cx="40" cy="9" rx="11" ry="6" fill="url(#i8p17p2gauntletPlate)"/>
    <ellipse cx="44" cy="22" rx="9" ry="5" fill="url(#i8p17p2gauntletPlate)"/>
    <line x1="36" y1="0" x2="44" y2="11" stroke="#1a0606" stroke-width="0.55"/>

    <!-- Highlight on knuckles (warm gaslight) -->
    <ellipse cx="-22" cy="-22" rx="3" ry="2" fill="#c83838" filter="url(#i8p17p2bloom)" opacity="0.7"/>
    <ellipse cx="-7" cy="-22" rx="3" ry="2" fill="#c83838" filter="url(#i8p17p2bloom)" opacity="0.7"/>
    <ellipse cx="9" cy="-18" rx="3" ry="2" fill="#c83838" filter="url(#i8p17p2bloom)" opacity="0.55"/>

    <!-- The gentleness — the fist is not tight; finger gaps visible -->
    <!-- (Subtle: spaces between fingers indicating loose closure, not white-knuckled) -->
    <line x1="-15" y1="-11" x2="-15" y2="-3" stroke="#0a0408" stroke-width="0.4"/>
    <line x1="0" y1="-11" x2="0" y2="-3" stroke="#0a0408" stroke-width="0.4"/>
    <line x1="14" y1="-7" x2="14" y2="0" stroke="#0a0408" stroke-width="0.4"/>

    <!-- Subtle warm rim on knuckle ridge (catching gaslight from above) -->
    <path d="M-50,-25 Q-15,-32 36,-22" stroke="#ffd898" stroke-width="0.7" fill="none" filter="url(#i8p17p2bloom)" opacity="0.7"/>
  </g>

  <!-- (No dialogue — the gesture IS the panel) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
