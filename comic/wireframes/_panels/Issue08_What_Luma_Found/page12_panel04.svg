<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 12 — Panel 4: Pull-back — three lights in vast darkness — Luma tiny beneath enormous letters, Theodore's candle distant — the message and its finder</title>
  <desc>28mm wide slightly high angle. Full sealed basement alcove — rough stone walls, arched ceiling, centuries of dust. Stone shelf thick with dust, tiny figure in sapphire-violet suit among corroded fairy technology. Above her on wall, carved deep in large geometric fairy script, single word glows with warm phosphorescent light — brightest point in frame. Tiny figure's hand at mouth, scanner trembling. Far above and behind at basement entrance, boy's silhouette holds candle — warm amber point of light against grey of church above. Three light sources in vast darkness: warm phosphorescent word, cold blue-violet scanner, distant warm candle. Scale devastating — tiny figure beneath enormous carved letters.</desc>

  <defs>
    <linearGradient id="i8p12p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0606"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p12p4stoneAlcove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="i8p12p4shelf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i8p12p4stayBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#c8a8e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p12p4scannerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p12p4candleDistant" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p12p4ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a86838" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p12p4lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p12p4waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p12p4corroded" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <filter id="i8p12p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p12p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p12p4strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p12p4megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p12p4bg)"/>

  <!-- Vaulted ceiling lost in shadow above -->
  <g stroke="#1a0808" stroke-width="0.55" opacity="0.55" fill="none">
    <path d="M100,40 Q371,0 642,40"/>
  </g>

  <!-- Distant church entrance behind/above (where Theodore stands) -->
  <rect x="40" y="20" width="120" height="80" fill="#1a1410"/>
  <line x1="40" y1="20" x2="160" y2="20" stroke="#040408" stroke-width="0.7"/>
  <line x1="40" y1="100" x2="160" y2="100" stroke="#040408" stroke-width="0.7"/>
  <!-- Steps leading down -->
  <path d="M40,100 L100,100 L120,80 L40,80 Z" fill="url(#i8p12p4stoneAlcove)" opacity="0.85"/>
  <path d="M50,80 L120,80 L130,60 L50,60 Z" fill="url(#i8p12p4stoneAlcove)" opacity="0.7"/>

  <!-- ===== STONE WALL of alcove (right portion, where STAY is carved) ===== -->
  <rect x="280" y="0" width="462" height="220" fill="url(#i8p12p4stoneAlcove)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.7">
    <line x1="280" y1="40" x2="742" y2="40"/>
    <line x1="280" y1="80" x2="742" y2="80"/>
    <line x1="280" y1="120" x2="742" y2="120"/>
    <line x1="280" y1="160" x2="742" y2="160"/>
    <line x1="280" y1="200" x2="742" y2="200"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="500" y1="0" x2="500" y2="40"/>
    <line x1="620" y1="0" x2="620" y2="40"/>
    <line x1="340" y1="40" x2="340" y2="80"/>
    <line x1="460" y1="40" x2="460" y2="80"/>
    <line x1="580" y1="40" x2="580" y2="80"/>
    <line x1="680" y1="40" x2="680" y2="80"/>
    <line x1="320" y1="160" x2="320" y2="200"/>
    <line x1="440" y1="160" x2="440" y2="200"/>
    <line x1="560" y1="160" x2="560" y2="200"/>
    <line x1="660" y1="160" x2="660" y2="200"/>
  </g>

  <!-- ===== STAY carved on the right wall (at human height — large) ===== -->
  <g transform="translate(540 100)">
    <!-- Bloom halo -->
    <ellipse cx="0" cy="0" rx="180" ry="80" fill="url(#i8p12p4stayBloom)" filter="url(#i8p12p4megaglow)"/>
    <!-- Letters (smaller, at distance, but bright) -->
    <g stroke="#fff" stroke-width="2" fill="none" filter="url(#i8p12p4bloom)" opacity="0.95">
      <!-- S -->
      <g transform="translate(-66 0)">
        <path d="M11,-22 L-11,-22 L-11,-3 L11,-3 L11,18 L-11,18"/>
      </g>
      <!-- T -->
      <g transform="translate(-22 0)">
        <path d="M-11,-22 L11,-22"/>
        <path d="M0,-22 L0,18"/>
      </g>
      <!-- A -->
      <g transform="translate(22 0)">
        <path d="M-11,18 L0,-22 L11,18"/>
        <path d="M-7,7 L7,7"/>
      </g>
      <!-- Y -->
      <g transform="translate(60 0)">
        <path d="M-11,-22 L0,-3"/>
        <path d="M11,-22 L0,-3"/>
        <path d="M0,-3 L0,18"/>
      </g>
    </g>
    <g stroke="#c8a8e8" stroke-width="3.5" fill="none" filter="url(#i8p12p4bloom)" opacity="0.55">
      <g transform="translate(-66 0)">
        <path d="M11,-22 L-11,-22 L-11,-3 L11,-3 L11,18 L-11,18"/>
      </g>
      <g transform="translate(-22 0)">
        <path d="M-11,-22 L11,-22"/>
        <path d="M0,-22 L0,18"/>
      </g>
      <g transform="translate(22 0)">
        <path d="M-11,18 L0,-22 L11,18"/>
        <path d="M-7,7 L7,7"/>
      </g>
      <g transform="translate(60 0)">
        <path d="M-11,-22 L0,-3"/>
        <path d="M11,-22 L0,-3"/>
        <path d="M0,-3 L0,18"/>
      </g>
    </g>
  </g>

  <!-- Shelf with cache (mid frame) -->
  <rect x="280" y="220" width="462" height="80" fill="url(#i8p12p4shelf)"/>
  <line x1="280" y1="220" x2="742" y2="220" stroke="#040408" stroke-width="0.7"/>
  <!-- Dust on shelf -->
  <g fill="#a89878" opacity="0.4">
    <ellipse cx="380" cy="240" rx="60" ry="6"/>
    <ellipse cx="540" cy="245" rx="80" ry="7"/>
    <ellipse cx="680" cy="240" rx="60" ry="6"/>
  </g>

  <!-- Cache silhouettes (on shelf) -->
  <g opacity="0.85">
    <!-- Wing-pack -->
    <ellipse cx="400" cy="240" rx="30" ry="11" fill="url(#i8p12p4ghostGlow)" filter="url(#i8p12p4glow)"/>
    <g stroke="url(#i8p12p4corroded)" stroke-width="1" fill="none">
      <path d="M380,237 L368,225 L356,232 L356,240 L368,243 L380,240"/>
      <path d="M420,237 L432,225 L444,232 L444,240 L432,243 L420,240"/>
    </g>
    <rect x="385" y="237" width="30" height="6" fill="url(#i8p12p4corroded)"/>
    <!-- Data core -->
    <rect x="500" y="235" width="40" height="11" fill="#1a1018" stroke="#040408" stroke-width="0.4" rx="2"/>
    <!-- Suit fragments -->
    <path d="M580,240 L600,232 L620,240 L600,250 Z" fill="#1a1818" opacity="0.85"/>
  </g>

  <!-- Floor below shelf -->
  <rect x="0" y="220" width="280" height="80" fill="url(#i8p12p4stoneAlcove)"/>

  <!-- ===== THREE LIGHT SOURCES in the darkness ===== -->

  <!-- 1. STAY bloom — already drawn, brightest -->

  <!-- 2. Scanner light from Luma's position (cool blue-violet) -->
  <ellipse cx="540" cy="240" rx="80" ry="40" fill="url(#i8p12p4scannerLight)" filter="url(#i8p12p4megaglow)" opacity="0.7"/>

  <!-- 3. Distant candle from Theodore (warm amber, far) -->
  <ellipse cx="100" cy="60" rx="60" ry="40" fill="url(#i8p12p4candleDistant)" filter="url(#i8p12p4megaglow)"/>

  <!-- Theodore silhouette at the entrance with candle held up -->
  <g transform="translate(100 75)" opacity="0.85">
    <!-- Body silhouette -->
    <path d="M-7,40 L-9,9 L-7,-22 L-3,-32 L7,-32 L11,-22 L14,9 L11,40 Z" fill="#1a1410"/>
    <!-- Arm raised with candle -->
    <path d="M11,-22 L18,-44 L22,-44 L18,-15 Z" fill="#1a1410"/>
    <!-- Candle held high -->
    <rect x="18" y="-50" width="3" height="9" fill="#a89878"/>
    <ellipse cx="19.5" cy="-54" rx="2.5" ry="5" fill="#fff8d8" filter="url(#i8p12p4strongglow)"/>
    <ellipse cx="19.5" cy="-54" rx="1" ry="2.5" fill="#fff" filter="url(#i8p12p4bloom)"/>
    <!-- Head -->
    <ellipse cx="2" cy="-40" rx="3" ry="4" fill="#5a3818"/>
    <!-- Looking down toward Luma (concerned) -->
    <line x1="0" y1="-40" x2="2" y2="-40" stroke="#1a0808" stroke-width="0.55"/>
    <line x1="3" y1="-40" x2="5" y2="-40" stroke="#1a0808" stroke-width="0.55"/>
  </g>

  <!-- ===== LUMA tiny on shelf, hand still at mouth ===== -->
  <g transform="translate(450 215)">
    <!-- Body -->
    <path d="M-3,9 L-5,3 L-7,-7 L-5,-15 L-3,-22 L3,-22 L5,-15 L7,-7 L5,3 L3,9 Z" fill="url(#i8p12p4lumaSuit)"/>
    <!-- Suit accent (vivid against dust) -->
    <line x1="0" y1="-15" x2="0" y2="7" stroke="#fff" stroke-width="0.55" filter="url(#i8p12p4bloom)" opacity="0.95"/>
    <!-- Hand at mouth -->
    <path d="M-5,-7 L-9,-15 L-7,-22 L-3,-22 L0,-15 L-3,-9 Z" fill="url(#i8p12p4lumaSuit)"/>
    <ellipse cx="-5" cy="-22" rx="2" ry="1.4" fill="#d8a878"/>
    <!-- Other arm with scanner -->
    <path d="M5,-7 L9,-3 L7,3 L5,3 Z" fill="url(#i8p12p4lumaSuit)"/>
    <rect x="9" y="-7" width="3" height="3" fill="#3a1858"/>
    <ellipse cx="11" cy="-5" rx="1" ry="0.4" fill="#a878e8" filter="url(#i8p12p4bloom)" opacity="0.95"/>
    <!-- Head -->
    <ellipse cx="0" cy="-26" rx="3" ry="3" fill="#d8a878"/>
    <!-- Tilted up -->
    <line x1="-1" y1="-26" x2="0" y2="-26" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="1" y1="-26" x2="2" y2="-26" stroke="#3a1808" stroke-width="0.4"/>
    <!-- Hair -->
    <path d="M-3,-29 Q0,-30 3,-29 L3,-26 Q0,-27 -3,-26 Z" fill="#1a0808"/>
  </g>
  <!-- Faint violet glow around Luma's position -->
  <ellipse cx="450" cy="200" rx="22" ry="14" fill="#a878e8" opacity="0.4" filter="url(#i8p12p4glow)"/>

  <!-- ===== DIALOGUE ===== -->
  <!-- THEODORE distant -->
  <g>
    <rect x="14" y="14" width="280" height="36" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE  <tspan font-style="italic" font-size="8" font-weight="500">(distant, from above)</tspan></text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-style="italic">Miss Luma? What did you find?</text>

  <!-- LUMA -->
  <g>
    <rect x="14" y="60" width="500" height="50" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">A message. From someone who was here before us.</text>
  <text x="22" y="104" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410" font-weight="700">A very long time before us.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
