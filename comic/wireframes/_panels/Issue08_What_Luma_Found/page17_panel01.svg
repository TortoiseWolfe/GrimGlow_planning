<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 17 — Panel 1: Thresh alone — gauntleted hand still half-raised, weapon on cobblestones, the stillness that means everything</title>
  <desc>50mm medium eye level. Thresh sits against brick wall motionless exactly where child left her. Compact weapon lies beside her on cobblestones — hasn't picked it up. Gauntleted hand still half-raised, reaching toward nothing, gesture suspended in space where child's hand was. Eyes fixed on empty cobblestones where child crouched. Expression open, unguarded — wet eyes, half-raised hand, weapon forgotten. Not grief, not fear — recognition. Ruby-crimson armored suit's holographic nodes pulse unevenly. Warm amber gaslight from alley's far end illuminates scene. Shadow around Thresh seems lighter than before — child's warmth left a residue.</desc>

  <defs>
    <linearGradient id="i8p17p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p17p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p17p1cobble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p17p1lamplight" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p17p1residueWarmth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p17p1threshArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="i8p17p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p17p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p17p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p17p1strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p17p1megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p17p1bg)"/>

  <!-- Brick wall (Thresh's wall) -->
  <rect x="0" y="0" width="742" height="240" fill="url(#i8p17p1brick)"/>
  <g stroke="#040408" stroke-width="0.7" opacity="0.85">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
  </g>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="80" y1="0" x2="80" y2="40"/>
    <line x1="220" y1="0" x2="220" y2="40"/>
    <line x1="380" y1="0" x2="380" y2="40"/>
    <line x1="540" y1="0" x2="540" y2="40"/>
    <line x1="660" y1="0" x2="660" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="180" y1="40" x2="180" y2="80"/>
    <line x1="320" y1="40" x2="320" y2="80"/>
    <line x1="460" y1="40" x2="460" y2="80"/>
    <line x1="600" y1="40" x2="600" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="120"/>
    <line x1="260" y1="80" x2="260" y2="120"/>
    <line x1="420" y1="80" x2="420" y2="120"/>
    <line x1="580" y1="80" x2="580" y2="120"/>
    <line x1="60" y1="120" x2="60" y2="160"/>
    <line x1="220" y1="120" x2="220" y2="160"/>
    <line x1="380" y1="120" x2="380" y2="160"/>
    <line x1="540" y1="120" x2="540" y2="160"/>
    <line x1="660" y1="120" x2="660" y2="160"/>
    <line x1="40" y1="160" x2="40" y2="200"/>
    <line x1="180" y1="160" x2="180" y2="200"/>
    <line x1="320" y1="160" x2="320" y2="200"/>
    <line x1="460" y1="160" x2="460" y2="200"/>
    <line x1="600" y1="160" x2="600" y2="200"/>
    <line x1="100" y1="200" x2="100" y2="240"/>
    <line x1="260" y1="200" x2="260" y2="240"/>
    <line x1="420" y1="200" x2="420" y2="240"/>
    <line x1="580" y1="200" x2="580" y2="240"/>
  </g>
  <!-- Soot stains -->
  <g fill="#040408" opacity="0.55">
    <ellipse cx="60" cy="80" rx="22" ry="9"/>
    <ellipse cx="280" cy="140" rx="22" ry="9"/>
    <ellipse cx="500" cy="100" rx="22" ry="9"/>
    <ellipse cx="660" cy="180" rx="22" ry="9"/>
  </g>

  <!-- Cobblestones -->
  <rect x="0" y="240" width="742" height="60" fill="url(#i8p17p1cobble)"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="60" cy="260" rx="11" ry="6"/>
    <ellipse cx="160" cy="270" rx="11" ry="6"/>
    <ellipse cx="280" cy="265" rx="11" ry="6"/>
    <ellipse cx="380" cy="270" rx="11" ry="6"/>
    <ellipse cx="480" cy="265" rx="11" ry="6"/>
    <ellipse cx="600" cy="270" rx="11" ry="6"/>
    <ellipse cx="700" cy="265" rx="11" ry="6"/>
  </g>

  <!-- Distant gaslight (off-frame right) — warm amber halo -->
  <ellipse cx="742" cy="160" rx="280" ry="200" fill="url(#i8p17p1lamplight)" filter="url(#i8p17p1megaglow)"/>

  <!-- ===== RESIDUE OF WARMTH where child crouched (the cobblestones are LIGHTER there) ===== -->
  <ellipse cx="380" cy="265" rx="80" ry="22" fill="url(#i8p17p1residueWarmth)" filter="url(#i8p17p1megaglow)" opacity="0.55"/>

  <!-- ===== EMPTY COBBLESTONES where child was (slightly brighter, the gaze fixes here) ===== -->
  <g opacity="0.7" filter="url(#i8p17p1bloom)">
    <ellipse cx="380" cy="270" rx="14" ry="3" fill="#ffd898" opacity="0.4"/>
    <ellipse cx="420" cy="265" rx="11" ry="3" fill="#ffd898" opacity="0.4"/>
  </g>

  <!-- ===== THRESH at base of wall, motionless ===== -->
  <g transform="translate(180 250)">
    <!-- Body — same position as before, motionless -->
    <path d="M-9,30 L-11,11 L-14,-7 L-11,-22 L-3,-32 L3,-32 L11,-22 L14,-7 L11,11 L9,30 Z" fill="url(#i8p17p1threshArmor)"/>

    <!-- Heavy dents -->
    <ellipse cx="-11" cy="-14" rx="3" ry="2" fill="#5a1410"/>
    <ellipse cx="11" cy="-14" rx="3" ry="2" fill="#7a1810"/>

    <!-- Long chest scratch -->
    <path d="M-7,-3 L7,3" stroke="#3a0a0a" stroke-width="1.4" opacity="0.85"/>

    <!-- Suit accent — pulsing UNEVENLY (biometric disruption) -->
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffa898" stroke-width="0.55" opacity="0.85" filter="url(#i8p17p1bloom)"/>
    <circle cx="-7" cy="-14" r="1.4" fill="#ff8868" filter="url(#i8p17p1strongglow)" opacity="0.95"/>
    <circle cx="7" cy="-14" r="0.7" fill="#a82818" filter="url(#i8p17p1bloom)" opacity="0.55"/>
    <circle cx="0" cy="0" r="1.4" fill="#ff8868" filter="url(#i8p17p1strongglow)" opacity="0.7"/>

    <!-- Knees -->
    <ellipse cx="-7" cy="22" rx="6" ry="3" fill="url(#i8p17p1threshArmor)"/>
    <ellipse cx="7" cy="22" rx="6" ry="3" fill="url(#i8p17p1threshArmor)"/>

    <!-- ===== WEAPON LIES ON COBBLESTONES (not picked up) ===== -->
    <rect x="-22" y="36" width="44" height="3" fill="#0a0408"/>
    <ellipse cx="0" cy="38" rx="6" ry="0.85" fill="#a82818" filter="url(#i8p17p1bloom)" opacity="0.4"/>

    <!-- ===== GAUNTLETED HAND HALF-RAISED — suspended, reaching toward nothing ===== -->
    <path d="M11,-9 L26,-22 L36,-15 L18,-3 Z" fill="url(#i8p17p1threshArmor)"/>
    <ellipse cx="32" cy="-22" rx="3" ry="2" fill="url(#i8p17p1threshArmor)"/>
    <!-- Fingers half-extended -->
    <ellipse cx="36" cy="-26" rx="2" ry="3" fill="url(#i8p17p1threshArmor)"/>
    <ellipse cx="40" cy="-22" rx="2" ry="3" fill="url(#i8p17p1threshArmor)"/>
    <ellipse cx="36" cy="-18" rx="2" ry="3" fill="url(#i8p17p1threshArmor)"/>
    <!-- Crimson node on gauntlet -->
    <circle cx="32" cy="-22" r="0.85" fill="#f04838" filter="url(#i8p17p1bloom)" opacity="0.95"/>

    <!-- Other arm at side -->
    <path d="M-11,-9 L-22,3 L-14,11 L-9,0 Z" fill="url(#i8p17p1threshArmor)"/>

    <!-- Head — looking right (toward where child was) -->
    <ellipse cx="2" cy="-40" rx="4" ry="5" fill="url(#i8p17p1skin)"/>
    <path d="M-1,-46 Q2,-48 5,-46 L5,-40 Q2,-42 -1,-40 Z" fill="#a83820"/>
    <!-- Eyes — open, unguarded, wet -->
    <ellipse cx="0" cy="-40" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="1" cy="-40" r="0.4" fill="#3a1808"/>
    <ellipse cx="4" cy="-40" rx="1" ry="0.7" fill="#fff8e8"/>
    <circle cx="5" cy="-40" r="0.4" fill="#3a1808"/>
    <!-- Wet catchlight -->
    <circle cx="1" cy="-41" r="0.4" fill="#ffd898" filter="url(#i8p17p1bloom)" opacity="0.95"/>
    <circle cx="5" cy="-41" r="0.4" fill="#ffd898" filter="url(#i8p17p1bloom)" opacity="0.95"/>
    <!-- Lower lid moisture -->
    <line x1="-1" y1="-37" x2="2" y2="-37" stroke="#fff" stroke-width="0.4" opacity="0.55" filter="url(#i8p17p1bloom)"/>
    <line x1="3" y1="-37" x2="6" y2="-37" stroke="#fff" stroke-width="0.4" opacity="0.55" filter="url(#i8p17p1bloom)"/>
  </g>

  <!-- Faint warm glow on Thresh (the residue) -->
  <ellipse cx="180" cy="240" rx="40" ry="22" fill="#ffd898" opacity="0.18" filter="url(#i8p17p1glow)"/>

  <!-- Eye-line to where child was (subtle visual implication) -->
  <g opacity="0.4" stroke="#ffd898" stroke-width="0.4" filter="url(#i8p17p1bloom)" stroke-dasharray="2,2">
    <line x1="200" y1="220" x2="380" y2="265"/>
  </g>

  <!-- (No dialogue — the stillness IS the panel) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
