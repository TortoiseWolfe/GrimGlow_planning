<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 240" width="366" height="240">
  <title>Issue 8 — Page 13 — Panel 4: Theodore wraps the core in a clean handkerchief — the boy who knows how to carry fragile things</title>
  <desc>50mm slight low angle. Theodore wraps dead data core in clean handkerchief — oil-stained fingers careful precise, brass gear ring on left index catching warm candlelight. Tucks wrapped bundle inside waistcoat against chest. On shoulder Luma watches — tiny figure in sapphire-violet suit, expression a flash of gratitude amid exhaustion. Theodore's face shows focus of boy who handles delicate clockwork professionally — this is something he knows how to do. Candle set down on a step casts warm amber light upward. Luma's suit nodes cast faint blue-violet on his collar. Scale contrast — capable hands, tiny figure watching — partnership in one frame.</desc>

  <defs>
    <linearGradient id="i8p13p4bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="i8p13p4stoneStep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3030"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="i8p13p4candleHalo" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffd898" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p13p4lumaGlow" cx="100%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p13p4waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4828"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="i8p13p4handkerchief" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#d8c8a8"/>
    </linearGradient>
    <linearGradient id="i8p13p4skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d0a0"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <linearGradient id="i8p13p4lumaSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a878e8"/>
      <stop offset="100%" stop-color="#3a1858"/>
    </linearGradient>
    <linearGradient id="i8p13p4deadCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
    <filter id="i8p13p4bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p13p4glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p13p4strongglow"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="i8p13p4megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="240" fill="url(#i8p13p4bg)"/>

  <!-- Stone step (foreground bottom — where candle is set) -->
  <rect x="0" y="200" width="366" height="40" fill="url(#i8p13p4stoneStep)"/>
  <line x1="0" y1="200" x2="366" y2="200" stroke="#040408" stroke-width="0.85"/>

  <!-- ===== CANDLE on step (set down, casting upward halo) ===== -->
  <g transform="translate(80 200)">
    <rect x="-2" y="-22" width="4" height="22" fill="#a89878"/>
    <line x1="-2" y1="-22" x2="2" y2="-22" stroke="#5a4838" stroke-width="0.4"/>
    <ellipse cx="0" cy="-26" rx="3" ry="6" fill="#fff8d8" filter="url(#i8p13p4strongglow)"/>
    <ellipse cx="0" cy="-26" rx="1.4" ry="3" fill="#fff" filter="url(#i8p13p4bloom)"/>
    <line x1="0" y1="-22" x2="0" y2="-19" stroke="#3a1808" stroke-width="0.55"/>
  </g>
  <!-- Candle halo casts UPWARD -->
  <ellipse cx="80" cy="120" rx="200" ry="140" fill="url(#i8p13p4candleHalo)" filter="url(#i8p13p4megaglow)"/>

  <!-- Luma's faint blue-violet glow (from upper right — Theodore's shoulder) -->
  <ellipse cx="290" cy="40" rx="100" ry="80" fill="url(#i8p13p4lumaGlow)" filter="url(#i8p13p4megaglow)"/>

  <!-- ===== THEODORE — close, working on the wrap ===== -->
  <g transform="translate(160 130)">
    <!-- Body — torso visible -->
    <path d="M-44,80 L-50,11 L-44,-30 L-36,-44 L-22,-58 L-9,-62 L9,-62 L22,-58 L36,-44 L44,-30 L50,11 L44,80 Z" fill="url(#i8p13p4waistcoat)"/>
    <!-- Buttons -->
    <circle cx="0" cy="-22" r="2" fill="#a86838" filter="url(#i8p13p4bloom)"/>
    <circle cx="0" cy="-3" r="2" fill="#a86838" filter="url(#i8p13p4bloom)"/>
    <circle cx="0" cy="18" r="2" fill="#a86838" filter="url(#i8p13p4bloom)"/>
    <line x1="0" y1="-44" x2="0" y2="40" stroke="#1a0808" stroke-width="0.4"/>

    <!-- Breast pocket showing wrapped bundle going in -->
    <rect x="-30" y="-22" width="22" height="22" fill="#3a2010" opacity="0.85"/>
    <line x1="-30" y1="0" x2="-8" y2="0" stroke="#1a0808" stroke-width="0.4"/>

    <!-- ===== HANDS WRAPPING the core in handkerchief ===== -->
    <!-- Right hand holding handkerchief edge -->
    <g transform="translate(40 0)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#i8p13p4skin)"/>
      <!-- Knuckles -->
      <path d="M-15,-7 Q-7,0 0,-3" stroke="#7a4818" stroke-width="0.55" fill="none" opacity="0.7"/>
      <!-- Fingers extending to handle wrap -->
      <ellipse cx="-22" cy="-7" rx="6" ry="3" fill="url(#i8p13p4skin)"/>
      <ellipse cx="-22" cy="0" rx="6" ry="3" fill="url(#i8p13p4skin)"/>
      <ellipse cx="-22" cy="7" rx="6" ry="3" fill="url(#i8p13p4skin)"/>
      <!-- Oil stains -->
      <ellipse cx="-15" cy="0" rx="4" ry="2" fill="#1a0606" opacity="0.7"/>
    </g>

    <!-- Left hand (with brass ring) holding the core -->
    <g transform="translate(-40 0)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#i8p13p4skin)"/>
      <!-- Knuckles -->
      <path d="M0,-3 Q9,0 14,-7" stroke="#7a4818" stroke-width="0.55" fill="none" opacity="0.7"/>
      <!-- Fingers wrapping under bundle -->
      <ellipse cx="14" cy="-7" rx="6" ry="3" fill="url(#i8p13p4skin)"/>
      <ellipse cx="18" cy="0" rx="6" ry="3" fill="url(#i8p13p4skin)"/>
      <ellipse cx="22" cy="7" rx="6" ry="3" fill="url(#i8p13p4skin)"/>
      <!-- Oil stains -->
      <ellipse cx="14" cy="0" rx="4" ry="2" fill="#1a0606" opacity="0.7"/>
      <!-- ===== BRASS GEAR RING on left INDEX finger — catches candlelight ===== -->
      <circle cx="14" cy="-7" r="3" fill="#a86838" stroke="#3a1808" stroke-width="0.55"/>
      <!-- Gear teeth -->
      <g stroke="#3a1808" stroke-width="0.4" fill="none">
        <line x1="11" y1="-7" x2="9" y2="-7"/>
        <line x1="17" y1="-7" x2="19" y2="-7"/>
        <line x1="14" y1="-10" x2="14" y2="-12"/>
        <line x1="14" y1="-4" x2="14" y2="-2"/>
      </g>
      <!-- Warm catch from candle (the focal warm point) -->
      <ellipse cx="14" cy="-9" rx="2" ry="0.85" fill="#ffd898" filter="url(#i8p13p4bloom)" opacity="0.95"/>
    </g>

    <!-- ===== DATA CORE wrapped in handkerchief (held between hands) ===== -->
    <g>
      <!-- Handkerchief layer -->
      <path d="M-26,-15 L-7,-22 L7,-22 L26,-15 L26,15 L7,22 L-7,22 L-26,15 Z" fill="url(#i8p13p4handkerchief)" stroke="#a89878" stroke-width="0.55"/>
      <!-- Handkerchief folds -->
      <path d="M-22,-11 L0,-15 L22,-11" stroke="#a89878" stroke-width="0.4" fill="none" opacity="0.85"/>
      <path d="M-22,11 L0,15 L22,11" stroke="#a89878" stroke-width="0.4" fill="none" opacity="0.85"/>
      <!-- Hint of dark core inside (silhouette through cloth) -->
      <path d="M-15,-7 L15,-7 L15,7 L-15,7 Z" fill="#3a2818" opacity="0.4"/>
      <!-- Texture lines on cloth -->
      <g stroke="#a89878" stroke-width="0.4" opacity="0.55">
        <line x1="-22" y1="-7" x2="22" y2="-7"/>
        <line x1="-22" y1="0" x2="22" y2="0"/>
        <line x1="-22" y1="7" x2="22" y2="7"/>
      </g>
    </g>

    <!-- Cuff/forearm visible -->
    <line x1="-44" y1="11" x2="-44" y2="22" stroke="#3a2010" stroke-width="0.4"/>
    <line x1="44" y1="11" x2="44" y2="22" stroke="#3a2010" stroke-width="0.4"/>

    <!-- White shirt collar visible at top -->
    <path d="M-14,-58 L-11,-62 L11,-62 L14,-58 L11,-50 L-11,-50 Z" fill="#e8d0a8"/>
    <!-- Neck -->
    <path d="M-9,-62 L9,-62 L7,-72 L-7,-72 Z" fill="url(#i8p13p4skin)"/>

    <!-- Head — looking DOWN at hands, focused -->
    <ellipse cx="0" cy="-94" rx="14" ry="16" fill="url(#i8p13p4skin)"/>
    <!-- Untidy hair -->
    <path d="M-14,-108 Q0,-114 14,-108 L14,-90 Q11,-104 0,-104 Q-11,-104 -14,-90 Z" fill="#7a5028"/>
    <ellipse cx="0" cy="-110" rx="11" ry="2.5" fill="#ffd898" opacity="0.7" filter="url(#i8p13p4bloom)"/>
    <!-- Eyes — DOWN (focused on hands) -->
    <line x1="-7" y1="-92" x2="-3" y2="-92" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="3" y1="-92" x2="7" y2="-92" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Brows focused -->
    <line x1="-9" y1="-98" x2="-3" y2="-98" stroke="#3a1808" stroke-width="0.7"/>
    <line x1="3" y1="-98" x2="9" y2="-98" stroke="#3a1808" stroke-width="0.7"/>
    <!-- Mouth concentrated -->
    <line x1="-3" y1="-80" x2="3" y2="-80" stroke="#3a1808" stroke-width="0.55"/>
  </g>

  <!-- ===== LUMA on Theodore's shoulder, watching ===== -->
  <g transform="translate(280 70)">
    <!-- Body, small but visible -->
    <path d="M-3,7 L-5,1 L-7,-7 L-5,-13 L-3,-18 L3,-18 L5,-13 L7,-7 L5,1 L3,7 Z" fill="url(#i8p13p4lumaSuit)"/>
    <line x1="0" y1="-13" x2="0" y2="3" stroke="#c8a8e8" stroke-width="0.4" filter="url(#i8p13p4bloom)" opacity="0.95"/>
    <!-- Head looking down (at Theodore's hands) -->
    <ellipse cx="0" cy="-22" rx="2.5" ry="3" fill="url(#i8p13p4skin)"/>
    <path d="M-2,-26 Q0,-28 2,-26 L2,-22 Q0,-24 -2,-22 Z" fill="#1a0808"/>
    <!-- Eyes lowered (gratitude flash) -->
    <line x1="-1" y1="-22" x2="0" y2="-22" stroke="#3a1808" stroke-width="0.4"/>
    <line x1="1" y1="-22" x2="2" y2="-22" stroke="#3a1808" stroke-width="0.4"/>
    <circle cx="0" cy="-22" r="0.4" fill="#a878e8" filter="url(#i8p13p4bloom)" opacity="0.95"/>
    <circle cx="2" cy="-22" r="0.4" fill="#a878e8" filter="url(#i8p13p4bloom)" opacity="0.95"/>
  </g>
  <!-- Faint violet on Theodore's collar (Luma's nodes) -->
  <ellipse cx="280" cy="80" rx="22" ry="9" fill="#a878e8" opacity="0.4" filter="url(#i8p13p4glow)"/>

  <!-- ===== DIALOGUE ===== -->
  <!-- THEODORE -->
  <g>
    <rect x="14" y="14" width="338" height="50" rx="2" fill="white" stroke="#7a4828" stroke-width="0.85" opacity="0.95"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7a4828" font-weight="700">THEODORE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I'll carry it safe. I carry clockwork parts all day —</text>
  <text x="22" y="58" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">I know how to mind something delicate.</text>

  <!-- LUMA -->
  <g>
    <rect x="14" y="80" width="338" height="36" rx="2" fill="white" stroke="#7848b8" stroke-width="0.85" opacity="0.95" stroke-dasharray="2,2"/>
  </g>
  <text x="22" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#7848b8" font-weight="700">LUMA</text>
  <text x="22" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">Carefully. That core may be the only record.</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
  </g>
</svg>
