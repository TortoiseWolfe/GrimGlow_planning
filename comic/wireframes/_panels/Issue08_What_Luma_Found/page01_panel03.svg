<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 300" width="366" height="300">
  <title>Issue 8 — Page 1 — Panel 3: Sable medium shot, slight low angle — too composed, recognition where surprise should be</title>
  <desc>50mm medium shot slight low angle. Sable arms folded, watching glyph display off-panel. Dark brown skin, sharp angular features, very short military-cropped silver-white hair. Silver suit scuffed, soot-streaked. Posture rigid, arms folded tight, jaw muscle visible. Eyes narrowed, tracking data with the precision of recognition — she is not surprised. She should be. The stillness is wrong. Half warm amber from wall gap right, half cool blue-violet from holographic display left.</desc>

  <defs>
    <linearGradient id="i8p1p3bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <radialGradient id="i8p1p3amber" cx="100%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p1p3violet" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p1p3suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </linearGradient>
    <linearGradient id="i8p1p3skinWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#5a3018"/>
    </linearGradient>
    <linearGradient id="i8p1p3skinCool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4858"/>
      <stop offset="100%" stop-color="#2a1a38"/>
    </linearGradient>
    <filter id="i8p1p3bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p1p3glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p1p3megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="366" height="300" fill="url(#i8p1p3bg)"/>

  <!-- Right side: warm amber from wall gap -->
  <ellipse cx="366" cy="150" rx="180" ry="220" fill="url(#i8p1p3amber)" filter="url(#i8p1p3megaglow)"/>
  <!-- Left side: cool violet from holo display -->
  <ellipse cx="0" cy="150" rx="180" ry="220" fill="url(#i8p1p3violet)" filter="url(#i8p1p3megaglow)"/>

  <!-- Wall gap edge (right side) -->
  <rect x="340" y="0" width="26" height="300" fill="#040408" opacity="0.85"/>
  <path d="M340,0 L340,300 L350,290 L344,180 L350,170 L344,80 Z" fill="#1a1208" opacity="0.85"/>

  <!-- Timber beam at left edge (Luma's direction) -->
  <rect x="0" y="0" width="14" height="300" fill="#1a1008"/>

  <!-- Lower beam -->
  <rect x="0" y="270" width="366" height="30" fill="#0a0606"/>
  <line x1="0" y1="270" x2="366" y2="270" stroke="#3a2818" stroke-width="0.55" opacity="0.55"/>

  <!-- ===== SABLE — center, slight low angle ===== -->
  <g transform="translate(183 175)">
    <!-- Body -->
    <path d="M-30,120 L-36,80 L-40,30 L-36,-22 L-22,-50 L-9,-66 L9,-66 L22,-50 L36,-22 L40,30 L36,80 L30,120 Z" fill="url(#i8p1p3suit)"/>

    <!-- Heavy soot streaks -->
    <ellipse cx="-22" cy="-9" rx="14" ry="6" fill="#1a1818" opacity="0.85"/>
    <ellipse cx="22" cy="11" rx="11" ry="4" fill="#1a1818" opacity="0.7"/>
    <!-- Patched tear (continuity from prior wear) -->
    <rect x="-9" y="22" width="14" height="4" fill="#5a4838" opacity="0.85"/>
    <line x1="-9" y1="22" x2="5" y2="26" stroke="#1a1818" stroke-width="0.4"/>

    <!-- Tension wear crease at collar -->
    <line x1="-14" y1="-58" x2="14" y2="-58" stroke="#1a1a20" stroke-width="0.85" opacity="0.85"/>

    <!-- Suit accent silver hologram -->
    <line x1="0" y1="-50" x2="0" y2="100" stroke="#fff" stroke-width="0.55" opacity="0.7" filter="url(#i8p1p3bloom)"/>

    <!-- ===== ARMS FOLDED tight ===== -->
    <path d="M-36,-22 L-44,3 L-30,18 L-9,11 L-9,-3 Z" fill="url(#i8p1p3suit)"/>
    <path d="M36,-22 L44,3 L30,18 L9,11 L9,-3 Z" fill="url(#i8p1p3suit)"/>
    <!-- Arms crossing line -->
    <line x1="-30" y1="11" x2="30" y2="11" stroke="#1a1818" stroke-width="0.85"/>
    <!-- Hands tucked under opposite arms -->
    <ellipse cx="-30" cy="14" rx="6" ry="3" fill="url(#i8p1p3skinWarm)"/>
    <ellipse cx="30" cy="14" rx="6" ry="3" fill="url(#i8p1p3skinCool)"/>

    <!-- Neck — split lit -->
    <path d="M-9,-66 L9,-66 L9,-78 L-9,-78 Z" fill="url(#i8p1p3skinWarm)"/>
    <path d="M-9,-66 L0,-66 L0,-78 L-9,-78 Z" fill="url(#i8p1p3skinCool)"/>

    <!-- Head — split lit -->
    <!-- Right side warm -->
    <path d="M0,-110 L18,-104 L26,-86 L26,-66 L18,-58 L0,-58 Z" fill="url(#i8p1p3skinWarm)"/>
    <!-- Left side cool -->
    <path d="M0,-110 L-18,-104 L-26,-86 L-26,-66 L-18,-58 L0,-58 Z" fill="url(#i8p1p3skinCool)"/>

    <!-- Silver-white cropped hair -->
    <path d="M-26,-110 Q-22,-118 -14,-120 L0,-122 L14,-120 Q22,-118 26,-110 L26,-92 Q14,-104 0,-104 Q-14,-104 -26,-92 Z" fill="#e8ecf0" opacity="0.95"/>
    <!-- Hair texture -->
    <g stroke="#fff" stroke-width="0.4" opacity="0.55" filter="url(#i8p1p3bloom)">
      <line x1="-22" y1="-114" x2="-7" y2="-114"/>
      <line x1="-3" y1="-118" x2="11" y2="-118"/>
      <line x1="9" y1="-114" x2="22" y2="-114"/>
    </g>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-92" rx="22" ry="4" fill="#1a1018" opacity="0.4"/>

    <!-- Brows — flat, narrow, hard -->
    <line x1="-22" y1="-86" x2="-7" y2="-88" stroke="#1a0808" stroke-width="2"/>
    <line x1="7" y1="-88" x2="22" y2="-86" stroke="#1a0808" stroke-width="2"/>

    <!-- ===== EYES — narrowed, tracking data with recognition ===== -->
    <ellipse cx="-9" cy="-78" rx="5" ry="3" fill="#fff8e8"/>
    <ellipse cx="-9" cy="-78" rx="2" ry="2" fill="#3a2818"/>
    <circle cx="-9" cy="-78" r="0.85" fill="#0a0408"/>
    <ellipse cx="9" cy="-78" rx="5" ry="3" fill="#fff8e8"/>
    <ellipse cx="9" cy="-78" rx="2" ry="2" fill="#3a2818"/>
    <circle cx="9" cy="-78" r="0.85" fill="#0a0408"/>
    <!-- Lower lid tightness (the tell) -->
    <line x1="-14" y1="-72" x2="-3" y2="-72" stroke="#3a1808" stroke-width="0.55" opacity="0.7"/>
    <line x1="3" y1="-72" x2="14" y2="-72" stroke="#3a1808" stroke-width="0.55" opacity="0.7"/>

    <!-- Catchlights — amber on right, violet on left -->
    <circle cx="-7" cy="-80" r="0.85" fill="#a878e8" filter="url(#i8p1p3bloom)" opacity="0.85"/>
    <circle cx="11" cy="-80" r="0.85" fill="#ffd898" filter="url(#i8p1p3bloom)" opacity="0.85"/>

    <!-- Nose -->
    <path d="M-3,-72 L0,-58 L3,-58 L3,-72 Z" fill="#7a4818" opacity="0.55"/>
    <line x1="-2" y1="-58" x2="2" y2="-58" stroke="#3a1808" stroke-width="0.4"/>

    <!-- ===== JAW MUSCLE TIGHT — visible tension ===== -->
    <ellipse cx="-14" cy="-62" rx="3" ry="6" fill="#1a1018" opacity="0.55"/>
    <ellipse cx="14" cy="-62" rx="3" ry="6" fill="#5a3018" opacity="0.4"/>

    <!-- Mouth — flat, hard, command -->
    <line x1="-9" y1="-58" x2="9" y2="-58" stroke="#1a0808" stroke-width="1.4"/>
    <!-- Tightness at corners -->
    <ellipse cx="-9" cy="-58" rx="1.4" ry="0.85" fill="#3a1808" opacity="0.55"/>
    <ellipse cx="9" cy="-58" rx="1.4" ry="0.85" fill="#3a1808" opacity="0.55"/>

    <!-- Cheekbone shadow -->
    <ellipse cx="-18" cy="-66" rx="5" ry="9" fill="#1a1018" opacity="0.55"/>
    <ellipse cx="18" cy="-66" rx="5" ry="9" fill="#3a2818" opacity="0.4"/>
  </g>

  <!-- ===== DIALOGUE — SABLE — clipped, technical ===== -->
  <g>
    <rect x="14" y="14" width="240" height="36" rx="2" fill="white" stroke="#5a606a" stroke-width="0.85" opacity="0.95" stroke-dasharray="3,1.5"/>
  </g>
  <text x="22" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" fill="#5a606a" font-weight="700">SABLE</text>
  <text x="22" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1410">What's the age spread?</text>

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q90,142 180,138 Q270,136 366,140"/>
    <path d="M0,260 Q90,262 180,258 Q270,256 366,260"/>
  </g>
</svg>
