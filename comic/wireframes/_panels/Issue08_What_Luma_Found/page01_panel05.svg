<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 300" width="248" height="300">
  <title>Issue 8 — Page 1 — Panel 5: Wren close-up — eyes off Sable not the display — the engineer reading a system that doesn't add up</title>
  <desc>85mm close-up eye level. Wren's face. Not looking at holographic display. Looking at Sable. Eyes narrowed, calculating — engineer reading a system. Suspicion hardening into analysis — not anger, not confrontation, but the quiet recognition that something does not add up. Blue-violet from holographic display illuminates left side of face, casting geometric reflections in eyes. Copper suit catches the light dimly through accumulated grime. Eyes catch it sharp and bright. The plant for Issue 9.</desc>

  <defs>
    <linearGradient id="i8p1p5bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1018"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </linearGradient>
    <radialGradient id="i8p1p5violet" cx="0%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a878e8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p1p5suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a86838"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
    <linearGradient id="i8p1p5skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p1p5bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p1p5glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p1p5megaglow"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <rect width="248" height="300" fill="url(#i8p1p5bg)"/>

  <!-- Violet wash from left (the holo display) -->
  <ellipse cx="0" cy="150" rx="160" ry="220" fill="url(#i8p1p5violet)" filter="url(#i8p1p5megaglow)"/>

  <!-- Background timber hint -->
  <rect x="0" y="0" width="248" height="14" fill="#1a1008"/>
  <rect x="0" y="286" width="248" height="14" fill="#1a1008"/>

  <!-- ===== WREN close-up ===== -->
  <g transform="translate(124 160)">
    <!-- Suit collar (copper, oil-stained, heavy wear) -->
    <path d="M-44,80 L-30,40 L-22,30 L22,30 L30,40 L44,80 L60,140 L-60,140 Z" fill="url(#i8p1p5suit)"/>
    <!-- Heavy oil stains -->
    <ellipse cx="-22" cy="60" rx="11" ry="6" fill="#1a0606" opacity="0.95"/>
    <ellipse cx="22" cy="80" rx="9" ry="4" fill="#1a0606" opacity="0.85"/>
    <path d="M-30,90 L0,100" stroke="#1a0606" stroke-width="1.4" opacity="0.7"/>
    <!-- Copper accent (still pulsing, dim through grime) -->
    <line x1="0" y1="40" x2="0" y2="120" stroke="#ffa848" stroke-width="0.7" opacity="0.7" filter="url(#i8p1p5bloom)"/>
    <circle cx="-14" cy="60" r="0.85" fill="#ffa848" filter="url(#i8p1p5bloom)" opacity="0.55"/>
    <circle cx="14" cy="60" r="0.85" fill="#ffa848" filter="url(#i8p1p5bloom)" opacity="0.55"/>

    <!-- Patched tear (continuity — copper-wire patch) -->
    <rect x="-9" y="50" width="11" height="6" fill="#5a3818" opacity="0.95"/>
    <line x1="-9" y1="53" x2="2" y2="55" stroke="#7a4828" stroke-width="0.4"/>
    <line x1="-9" y1="51" x2="2" y2="53" stroke="#7a4828" stroke-width="0.4"/>

    <!-- Neck -->
    <path d="M-9,30 L9,30 L7,18 L-7,18 Z" fill="url(#i8p1p5skin)"/>

    <!-- Jaw — wiry, defined -->
    <path d="M-22,-9 L-26,11 L-18,30 L0,40 L18,30 L26,11 L22,-9 L11,-22 L-11,-22 Z" fill="url(#i8p1p5skin)"/>

    <!-- Head proper -->
    <ellipse cx="0" cy="-32" rx="22" ry="22" fill="url(#i8p1p5skin)"/>

    <!-- Messy hair UP — high knot -->
    <ellipse cx="0" cy="-58" rx="22" ry="9" fill="#1a1008"/>
    <circle cx="9" cy="-66" r="9" fill="#1a1008"/>
    <circle cx="-7" cy="-62" r="6" fill="#1a1008"/>
    <!-- Strands fallen loose -->
    <path d="M-22,-32 Q-26,-9 -18,11" stroke="#1a1008" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M22,-40 Q26,-22 22,0" stroke="#1a1008" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M-9,-50 Q-14,-44 -11,-36" stroke="#1a1008" stroke-width="0.85" fill="none" opacity="0.7"/>

    <!-- Brow shadow -->
    <ellipse cx="0" cy="-40" rx="22" ry="5" fill="#5a3018" opacity="0.4"/>

    <!-- Brows — narrowed, calculating -->
    <line x1="-18" y1="-34" x2="-7" y2="-36" stroke="#3a1808" stroke-width="2"/>
    <line x1="7" y1="-36" x2="18" y2="-34" stroke="#3a1808" stroke-width="2"/>

    <!-- ===== EYES — narrowed, looking RIGHT (off-panel toward Sable) ===== -->
    <ellipse cx="-9" cy="-26" rx="6" ry="3" fill="#fff8e8"/>
    <ellipse cx="-7" cy="-26" rx="3" ry="2" fill="#3a1808"/>
    <circle cx="-7" cy="-26" r="1.4" fill="#0a0408"/>
    <ellipse cx="9" cy="-26" rx="6" ry="3" fill="#fff8e8"/>
    <ellipse cx="11" cy="-26" rx="3" ry="2" fill="#3a1808"/>
    <circle cx="11" cy="-26" r="1.4" fill="#0a0408"/>

    <!-- Lid tightness (focused, narrowed) -->
    <line x1="-14" y1="-22" x2="-3" y2="-22" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>
    <line x1="3" y1="-22" x2="14" y2="-22" stroke="#3a1808" stroke-width="0.55" opacity="0.85"/>

    <!-- ===== VIOLET CATCHLIGHT in eyes — sharp and bright (the recognition) ===== -->
    <circle cx="-5" cy="-28" r="1.4" fill="#c8a8e8" filter="url(#i8p1p5bloom)" opacity="0.95"/>
    <circle cx="13" cy="-28" r="1.4" fill="#c8a8e8" filter="url(#i8p1p5bloom)" opacity="0.95"/>
    <!-- Geometric reflection inside the catchlight -->
    <line x1="-7" y1="-30" x2="-3" y2="-26" stroke="#fff" stroke-width="0.4" opacity="0.85"/>
    <line x1="11" y1="-30" x2="15" y2="-26" stroke="#fff" stroke-width="0.4" opacity="0.85"/>

    <!-- Lashes -->
    <line x1="-14" y1="-30" x2="-14" y2="-32" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="-9" y1="-30" x2="-9" y2="-33" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="-3" y1="-30" x2="-3" y2="-32" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="3" y1="-30" x2="3" y2="-32" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="9" y1="-30" x2="9" y2="-33" stroke="#1a0808" stroke-width="0.85"/>
    <line x1="14" y1="-30" x2="14" y2="-32" stroke="#1a0808" stroke-width="0.85"/>

    <!-- Nose -->
    <path d="M-3,-22 L-2,-9 L0,-3 L2,-9 L3,-22 Z" fill="#7a4818" opacity="0.55"/>
    <line x1="-2" y1="-3" x2="2" y2="-3" stroke="#3a1808" stroke-width="0.4"/>

    <!-- Mouth — flat, set, the analyst's mouth -->
    <line x1="-9" y1="11" x2="9" y2="11" stroke="#3a1808" stroke-width="1.4"/>

    <!-- Cheekbone shadow -->
    <ellipse cx="-18" cy="-3" rx="6" ry="9" fill="#5a3018" opacity="0.4"/>
    <ellipse cx="18" cy="-3" rx="6" ry="9" fill="#5a3018" opacity="0.4"/>

    <!-- Smudge / oil mark on cheek -->
    <ellipse cx="14" cy="3" rx="6" ry="2" fill="#1a0606" opacity="0.55"/>
  </g>

  <!-- Subtle violet geometric pattern reflecting on her face/hair (the holo data shape) -->
  <g opacity="0.4" filter="url(#i8p1p5bloom)">
    <line x1="40" y1="60" x2="80" y2="100" stroke="#a878e8" stroke-width="0.55"/>
    <line x1="40" y1="80" x2="80" y2="40" stroke="#a878e8" stroke-width="0.55"/>
  </g>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q60,142 124,138 Q190,136 248,140"/>
    <path d="M0,260 Q60,262 124,258 Q190,256 248,260"/>
  </g>
</svg>
