<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 5 — Panel 1: Thresh against the wall — vertical scale, brick as cliffs, weapon raised, scanning the alley left to right</title>
  <desc>35mm low angle looking up along Victorian brick wall. Tiny woman approximately four inches tall presses against wall at base, compact weapon raised, scanning alley. Broad-shouldered muscular pale skin defined cheekbones copper-red buzz cut dented ruby-crimson armored suit heavier plating. Wall rises enormously above her — each brick a slab larger than her body, mortar lines like trenches, spider web spanning gap above her like a cable array. Gaslight far end alley warm amber glow upper background. Eyes scan left to right, jaw set. Holographic nodes pulse faintly crimson — dimmed for stealth but not extinguished. Mostly in shadow.</desc>

  <defs>
    <linearGradient id="i8p5p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p5p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <radialGradient id="i8p5p1distantGaslight" cx="80%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p5p1threshSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="i8p5p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p5p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p5p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p5p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p5p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p5p1bg)"/>

  <!-- Distant gaslight glow upper background -->
  <ellipse cx="600" cy="40" rx="180" ry="100" fill="url(#i8p5p1distantGaslight)" filter="url(#i8p5p1megaglow)"/>

  <!-- ===== ENORMOUS BRICK WALL — towering above Thresh ===== -->
  <rect x="0" y="0" width="742" height="300" fill="url(#i8p5p1brick)"/>

  <!-- Mortar lines — TRENCHES at this scale -->
  <g stroke="#040408" stroke-width="2.5" opacity="0.85">
    <line x1="0" y1="60" x2="742" y2="60"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="180" x2="742" y2="180"/>
    <line x1="0" y1="240" x2="742" y2="240"/>
  </g>
  <!-- Vertical brick joints — staggered -->
  <g stroke="#040408" stroke-width="2" opacity="0.7">
    <line x1="120" y1="0" x2="120" y2="60"/>
    <line x1="280" y1="0" x2="280" y2="60"/>
    <line x1="440" y1="0" x2="440" y2="60"/>
    <line x1="600" y1="0" x2="600" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="120"/>
    <line x1="220" y1="60" x2="220" y2="120"/>
    <line x1="380" y1="60" x2="380" y2="120"/>
    <line x1="540" y1="60" x2="540" y2="120"/>
    <line x1="680" y1="60" x2="680" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="180"/>
    <line x1="280" y1="120" x2="280" y2="180"/>
    <line x1="440" y1="120" x2="440" y2="180"/>
    <line x1="600" y1="120" x2="600" y2="180"/>
    <line x1="60" y1="180" x2="60" y2="240"/>
    <line x1="220" y1="180" x2="220" y2="240"/>
    <line x1="380" y1="180" x2="380" y2="240"/>
    <line x1="540" y1="180" x2="540" y2="240"/>
    <line x1="120" y1="240" x2="120" y2="300"/>
    <line x1="280" y1="240" x2="280" y2="300"/>
    <line x1="440" y1="240" x2="440" y2="300"/>
    <line x1="600" y1="240" x2="600" y2="300"/>
  </g>

  <!-- Brick texture (highlights catching faint distant light) -->
  <g fill="#3a2818" opacity="0.55">
    <rect x="40" y="20" width="60" height="32"/>
    <rect x="200" y="20" width="60" height="32"/>
    <rect x="360" y="20" width="60" height="32"/>
    <rect x="520" y="20" width="60" height="32"/>
    <rect x="640" y="20" width="80" height="32"/>
    <rect x="120" y="80" width="80" height="32"/>
    <rect x="280" y="80" width="80" height="32"/>
    <rect x="440" y="80" width="80" height="32"/>
    <rect x="600" y="80" width="60" height="32"/>
    <rect x="40" y="140" width="60" height="32"/>
    <rect x="200" y="140" width="60" height="32"/>
    <rect x="360" y="140" width="60" height="32"/>
    <rect x="520" y="140" width="60" height="32"/>
    <rect x="640" y="140" width="80" height="32"/>
    <rect x="120" y="200" width="80" height="32"/>
    <rect x="280" y="200" width="80" height="32"/>
    <rect x="440" y="200" width="80" height="32"/>
    <rect x="600" y="200" width="60" height="32"/>
  </g>
  <!-- Brick highlight catching gaslight on top edges -->
  <g stroke="#3a2818" stroke-width="0.55" opacity="0.55" filter="url(#i8p5p1bloom)">
    <line x1="0" y1="62" x2="742" y2="62"/>
    <line x1="0" y1="122" x2="742" y2="122"/>
  </g>
  <!-- Soot stains and grime -->
  <g fill="#040408" opacity="0.4">
    <ellipse cx="100" cy="40" rx="14" ry="7"/>
    <ellipse cx="320" cy="100" rx="11" ry="6"/>
    <ellipse cx="500" cy="160" rx="14" ry="7"/>
    <ellipse cx="660" cy="220" rx="11" ry="6"/>
  </g>

  <!-- ===== SPIDER WEB in mortar gap above Thresh — engineering marvel of cables ===== -->
  <g transform="translate(160 90)" stroke="#5a5050" stroke-width="0.4" fill="none" opacity="0.7">
    <!-- Anchor lines -->
    <line x1="-30" y1="-15" x2="30" y2="0"/>
    <line x1="-30" y1="15" x2="30" y2="-5"/>
    <line x1="-25" y1="20" x2="25" y2="-15"/>
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <!-- Concentric -->
    <ellipse cx="0" cy="0" rx="15" ry="12" stroke-width="0.55"/>
    <ellipse cx="0" cy="0" rx="10" ry="8"/>
    <ellipse cx="0" cy="0" rx="6" ry="4"/>
    <!-- Spider tiny -->
    <circle cx="3" cy="3" r="0.85" fill="#1a1008" opacity="0.85"/>
  </g>
  <!-- Faint highlight on web -->
  <g stroke="#a89888" stroke-width="0.4" fill="none" opacity="0.4" filter="url(#i8p5p1bloom)">
    <ellipse cx="160" cy="90" rx="15" ry="12"/>
  </g>

  <!-- ===== THRESH at base of wall — TINY against the cliff face ===== -->
  <g transform="translate(280 270)">
    <!-- Body — pressed against wall -->
    <path d="M-9,18 L-11,3 L-14,-9 L-9,-22 L-3,-30 L3,-30 L9,-22 L14,-9 L11,3 L9,18 Z" fill="url(#i8p5p1threshSuit)"/>

    <!-- Heavy dents -->
    <ellipse cx="-11" cy="-14" rx="4" ry="2" fill="#5a1410"/>
    <line x1="-13" y1="-17" x2="-9" y2="-11" stroke="#1a0606" stroke-width="0.55"/>
    <ellipse cx="11" cy="-14" rx="4" ry="2" fill="#7a1810"/>

    <!-- Long chest scratch -->
    <path d="M-7,-3 L7,3" stroke="#3a0a0a" stroke-width="1.4" opacity="0.85"/>
    <path d="M-5,-1 L5,5" stroke="#1a0606" stroke-width="0.55" opacity="0.7"/>

    <!-- Suit accent crimson dimmed -->
    <line x1="0" y1="-22" x2="0" y2="14" stroke="#ffa898" stroke-width="0.55" opacity="0.85" filter="url(#i8p5p1bloom)"/>
    <circle cx="-7" cy="-14" r="0.85" fill="#f04838" filter="url(#i8p5p1bloom)" opacity="0.85"/>
    <circle cx="7" cy="-14" r="0.85" fill="#f04838" filter="url(#i8p5p1bloom)" opacity="0.85"/>

    <!-- ===== WEAPON RAISED, SIGHTING ===== -->
    <!-- Right arm extended forward -->
    <path d="M11,-9 L26,-22 L36,-15 L18,-3 Z" fill="url(#i8p5p1threshSuit)"/>
    <ellipse cx="32" cy="-22" rx="3" ry="2" fill="url(#i8p5p1skin)"/>
    <!-- Compact rifle (raised, sighted along alley) -->
    <rect x="32" y="-25" width="44" height="6" fill="#0a0408" stroke="#040208" stroke-width="0.4"/>
    <ellipse cx="50" cy="-22" rx="11" ry="0.85" fill="#f04838" filter="url(#i8p5p1bloom)" opacity="0.85"/>
    <!-- Stock and barrel -->
    <rect x="70" y="-23.5" width="9" height="3" fill="#1a1818"/>
    <rect x="32" y="-25" width="6" height="6" fill="#3a2818"/>
    <!-- Trigger guard -->
    <path d="M44,-19 L44,-15 L48,-13 L52,-13 L56,-15 L56,-19 Z" fill="#0a0408"/>
    <!-- Left hand supporting -->
    <ellipse cx="22" cy="-22" rx="2" ry="2" fill="url(#i8p5p1skin)"/>

    <!-- Other arm bracing -->
    <path d="M-11,-9 L-22,3 L-14,11 L-9,0 Z" fill="url(#i8p5p1threshSuit)"/>

    <!-- Knees bent (taking position) -->
    <ellipse cx="-7" cy="14" rx="6" ry="3" fill="url(#i8p5p1threshSuit)"/>
    <ellipse cx="7" cy="14" rx="6" ry="3" fill="url(#i8p5p1threshSuit)"/>

    <!-- Head — eyes scanning along weapon sight -->
    <ellipse cx="2" cy="-30" rx="3" ry="4" fill="url(#i8p5p1skin)"/>
    <!-- Copper-red buzz cut catching faint distant gaslight -->
    <path d="M-1,-34 Q2,-36 5,-34 L5,-30 Q2,-32 -1,-30 Z" fill="#a83820"/>
    <!-- Faint amber catch on hair top -->
    <ellipse cx="2" cy="-35" rx="3" ry="0.85" fill="#a86828" opacity="0.7" filter="url(#i8p5p1bloom)"/>

    <!-- Eyes — focused along sight, scanning -->
    <line x1="0" y1="-30" x2="2" y2="-30" stroke="#1a0808" stroke-width="0.7"/>
    <line x1="3" y1="-30" x2="5" y2="-30" stroke="#1a0808" stroke-width="0.7"/>
    <!-- Catchlight -->
    <circle cx="3" cy="-30" r="0.4" fill="#ffd898" filter="url(#i8p5p1bloom)" opacity="0.85"/>
  </g>

  <!-- Faint crimson accent halo around Thresh's position -->
  <ellipse cx="290" cy="260" rx="44" ry="22" fill="#3a0a0a" opacity="0.4" filter="url(#i8p5p1glow)"/>

  <!-- (No dialogue) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
