<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 300" width="742" height="300">
  <title>Issue 8 — Page 6 — Panel 1: Rat crosses the gaslight — Thresh snaps to combat readiness — false alarm at scale</title>
  <desc>35mm low angle. Thresh snapped to combat readiness — weapon up, sighting along alley, body rigid, eyes wide. Far end alley silhouetted against warm amber gaslight, enormous rat crosses cobblestones — at four inches tall, rat the size of large dog, dark body blocking gaslight, tail dragging across stones. Rat casts massive shifting shadow sweeping alley. Thresh's ruby-crimson armor nodes pulse brighter — adrenaline response. Pale face lit by flickering gaslight as rat disrupts source. Frozen in combat stance. Rat doesn't notice her. Crosses and disappears.</desc>

  <defs>
    <linearGradient id="i8p6p1bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
    <linearGradient id="i8p6p1brick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <radialGradient id="i8p6p1gaslightHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd898" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a86838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a1808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i8p6p1adrenaline" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f04838" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i8p6p1threshSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a82818"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="i8p6p1ratFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0808"/>
    </linearGradient>
    <linearGradient id="i8p6p1skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b888"/>
      <stop offset="100%" stop-color="#a87838"/>
    </linearGradient>
    <filter id="i8p6p1bloom"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="i8p6p1glow"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="i8p6p1strongglow"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="i8p6p1megaglow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="742" height="300" fill="url(#i8p6p1bg)"/>

  <!-- ===== BRICK WALL — towering ===== -->
  <rect x="0" y="0" width="742" height="240" fill="url(#i8p6p1brick)"/>
  <g stroke="#040408" stroke-width="0.85" opacity="0.85">
    <line x1="0" y1="40" x2="742" y2="40"/>
    <line x1="0" y1="80" x2="742" y2="80"/>
    <line x1="0" y1="120" x2="742" y2="120"/>
    <line x1="0" y1="160" x2="742" y2="160"/>
    <line x1="0" y1="200" x2="742" y2="200"/>
  </g>
  <g stroke="#040408" stroke-width="0.55" opacity="0.7">
    <line x1="120" y1="0" x2="120" y2="40"/>
    <line x1="280" y1="0" x2="280" y2="40"/>
    <line x1="60" y1="40" x2="60" y2="80"/>
    <line x1="220" y1="40" x2="220" y2="80"/>
    <line x1="120" y1="80" x2="120" y2="120"/>
    <line x1="280" y1="80" x2="280" y2="120"/>
    <line x1="60" y1="120" x2="60" y2="160"/>
    <line x1="220" y1="120" x2="220" y2="160"/>
    <line x1="120" y1="160" x2="120" y2="200"/>
    <line x1="280" y1="160" x2="280" y2="200"/>
    <line x1="60" y1="200" x2="60" y2="240"/>
    <line x1="220" y1="200" x2="220" y2="240"/>
  </g>
  <g fill="#040408" opacity="0.55">
    <ellipse cx="80" cy="80" rx="14" ry="6"/>
    <ellipse cx="200" cy="140" rx="14" ry="6"/>
    <ellipse cx="60" cy="180" rx="11" ry="4"/>
  </g>

  <!-- Cobblestone floor -->
  <rect x="0" y="240" width="742" height="60" fill="#0a0606"/>
  <g stroke="#040408" stroke-width="0.55" fill="none" opacity="0.55">
    <ellipse cx="80" cy="260" rx="11" ry="6"/>
    <ellipse cx="160" cy="270" rx="11" ry="6"/>
    <ellipse cx="240" cy="265" rx="11" ry="6"/>
    <ellipse cx="320" cy="270" rx="11" ry="6"/>
    <ellipse cx="640" cy="270" rx="11" ry="6"/>
    <ellipse cx="700" cy="265" rx="11" ry="6"/>
  </g>

  <!-- Gaslight at far right — flickering as rat passes -->
  <g transform="translate(660 50)">
    <rect x="-2" y="0" width="4" height="160" fill="#3a3030"/>
    <rect x="-22" y="-26" width="22" height="22" fill="#1a1818"/>
    <polygon points="-26,-26 4,-26 0,-36 -22,-36" fill="#3a3030"/>
    <rect x="-18" y="-22" width="14" height="16" fill="#3a1808"/>
    <ellipse cx="-11" cy="-14" rx="6" ry="9" fill="#fff8d8" filter="url(#i8p6p1strongglow)" opacity="0.85"/>
  </g>
  <!-- Gaslight halo — DISRUPTED by rat -->
  <ellipse cx="640" cy="100" rx="240" ry="140" fill="url(#i8p6p1gaslightHalo)" filter="url(#i8p6p1megaglow)" opacity="0.7"/>

  <!-- ===== ENORMOUS RAT silhouette crossing gaslight ===== -->
  <g transform="translate(540 250)">
    <!-- Body (large, blocking light) -->
    <ellipse cx="0" cy="-20" rx="80" ry="22" fill="url(#i8p6p1ratFur)"/>
    <!-- Head -->
    <ellipse cx="-70" cy="-22" rx="22" ry="14" fill="url(#i8p6p1ratFur)"/>
    <!-- Snout -->
    <path d="M-90,-22 L-95,-18 L-95,-25 Z" fill="#1a0808"/>
    <!-- Ears -->
    <ellipse cx="-65" cy="-36" rx="6" ry="9" fill="url(#i8p6p1ratFur)"/>
    <ellipse cx="-72" cy="-36" rx="5" ry="7" fill="#1a0808"/>
    <!-- Eye (small dark, gleaming) -->
    <circle cx="-78" cy="-26" r="2" fill="#1a0606"/>
    <circle cx="-78" cy="-27" r="0.85" fill="#fff8e8" opacity="0.85"/>
    <!-- Whiskers -->
    <line x1="-92" y1="-22" x2="-105" y2="-26" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>
    <line x1="-92" y1="-19" x2="-105" y2="-19" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>
    <line x1="-92" y1="-16" x2="-105" y2="-12" stroke="#5a5050" stroke-width="0.4" opacity="0.7"/>
    <!-- Legs -->
    <ellipse cx="-30" cy="-3" rx="6" ry="11" fill="url(#i8p6p1ratFur)"/>
    <ellipse cx="30" cy="-3" rx="6" ry="11" fill="url(#i8p6p1ratFur)"/>
    <ellipse cx="-30" cy="3" rx="3" ry="2" fill="#1a0606"/>
    <ellipse cx="30" cy="3" rx="3" ry="2" fill="#1a0606"/>
    <!-- TAIL DRAGGING across cobblestones -->
    <path d="M70,-15 Q120,0 180,11 Q240,18 280,9" stroke="url(#i8p6p1ratFur)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M70,-15 Q120,0 180,11 Q240,18 280,9" stroke="#5a3018" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Fur texture -->
    <g stroke="#1a0808" stroke-width="0.4" opacity="0.55" fill="none">
      <path d="M-50,-30 Q-30,-22 -10,-32"/>
      <path d="M0,-25 Q22,-18 44,-28"/>
      <path d="M14,-9 Q30,-3 50,-12"/>
    </g>
    <!-- Backlight rim from gaslight -->
    <path d="M-50,-30 Q-30,-22 -10,-32" stroke="#a86838" stroke-width="0.55" fill="none" opacity="0.85" filter="url(#i8p6p1bloom)"/>
  </g>

  <!-- MASSIVE SHIFTING SHADOW cast by rat -->
  <path d="M540,260 L200,290 L240,300 L600,280 Z" fill="#040408" opacity="0.7" filter="url(#i8p6p1glow)"/>

  <!-- Subtle light scatter where rat blocks gaslight -->
  <g opacity="0.55" filter="url(#i8p6p1bloom)">
    <ellipse cx="490" cy="180" rx="60" ry="22" fill="#ffd898" opacity="0.55"/>
  </g>

  <!-- Crimson adrenaline halo around Thresh -->
  <ellipse cx="180" cy="240" rx="60" ry="40" fill="url(#i8p6p1adrenaline)" filter="url(#i8p6p1strongglow)"/>

  <!-- ===== THRESH — combat readiness, weapon up ===== -->
  <g transform="translate(180 250)">
    <!-- Body — rigid, leaning into shot -->
    <path d="M-9,18 L-11,3 L-14,-9 L-9,-22 L-3,-30 L3,-30 L9,-22 L14,-9 L11,3 L9,18 Z" fill="url(#i8p6p1threshSuit)"/>

    <!-- Heavy dents -->
    <ellipse cx="-11" cy="-14" rx="4" ry="2" fill="#5a1410"/>
    <ellipse cx="11" cy="-14" rx="4" ry="2" fill="#7a1810"/>
    <!-- Long chest scratch -->
    <path d="M-7,-3 L7,3" stroke="#3a0a0a" stroke-width="1.4" opacity="0.85"/>

    <!-- ===== Suit accent BRIGHTER (adrenaline response) ===== -->
    <line x1="0" y1="-22" x2="0" y2="14" stroke="#ff8868" stroke-width="0.85" opacity="0.95" filter="url(#i8p6p1bloom)"/>
    <circle cx="-7" cy="-14" r="1.4" fill="#ff8868" filter="url(#i8p6p1strongglow)" opacity="0.95"/>
    <circle cx="7" cy="-14" r="1.4" fill="#ff8868" filter="url(#i8p6p1strongglow)" opacity="0.95"/>
    <circle cx="0" cy="0" r="1.4" fill="#ff8868" filter="url(#i8p6p1strongglow)" opacity="0.95"/>

    <!-- WEAPON UP, sighting at rat (right) -->
    <path d="M11,-9 L36,-22 L44,-15 L18,-3 Z" fill="url(#i8p6p1threshSuit)"/>
    <ellipse cx="38" cy="-22" rx="3" ry="2" fill="url(#i8p6p1skin)"/>
    <!-- Rifle leveled -->
    <rect x="40" y="-25" width="50" height="6" fill="#0a0408" stroke="#040208" stroke-width="0.4"/>
    <ellipse cx="60" cy="-22" rx="14" ry="0.85" fill="#ff8868" filter="url(#i8p6p1bloom)" opacity="0.95"/>
    <rect x="86" y="-23.5" width="11" height="3" fill="#1a1818"/>
    <rect x="40" y="-25" width="6" height="6" fill="#3a2818"/>
    <path d="M52,-19 L52,-15 L58,-13 L62,-13 L66,-15 L66,-19 Z" fill="#0a0408"/>
    <!-- Left support hand -->
    <ellipse cx="30" cy="-22" rx="2" ry="2" fill="url(#i8p6p1skin)"/>

    <!-- Other arm bracing -->
    <path d="M-11,-9 L-22,3 L-14,11 L-9,0 Z" fill="url(#i8p6p1threshSuit)"/>

    <!-- Knees bent (combat ready) -->
    <ellipse cx="-7" cy="14" rx="6" ry="3" fill="url(#i8p6p1threshSuit)"/>
    <ellipse cx="7" cy="14" rx="6" ry="3" fill="url(#i8p6p1threshSuit)"/>

    <!-- Head — sighting, eyes WIDE -->
    <ellipse cx="2" cy="-30" rx="3" ry="4" fill="url(#i8p6p1skin)"/>
    <path d="M-1,-34 Q2,-36 5,-34 L5,-30 Q2,-32 -1,-30 Z" fill="#a83820"/>
    <!-- Flickering gaslight illuminates pale face -->
    <ellipse cx="2" cy="-30" rx="3" ry="3" fill="#ffd898" opacity="0.4" filter="url(#i8p6p1bloom)"/>
    <!-- Eyes WIDE -->
    <ellipse cx="0" cy="-30" rx="0.85" ry="0.7" fill="#fff8e8"/>
    <circle cx="0" cy="-30" r="0.4" fill="#3a1808"/>
    <ellipse cx="4" cy="-30" rx="0.85" ry="0.7" fill="#fff8e8"/>
    <circle cx="4" cy="-30" r="0.4" fill="#3a1808"/>
  </g>

  <!-- (No dialogue — combat readiness silence) -->

  <!-- Brushwork overlay -->
  <g stroke="#0a0606" stroke-width="0.4" opacity="0.18" fill="none">
    <path d="M0,140 Q120,142 240,138 Q360,136 494,140 Q620,138 742,140"/>
    <path d="M0,260 Q120,262 240,258 Q360,256 494,260 Q620,258 742,260"/>
  </g>
</svg>
