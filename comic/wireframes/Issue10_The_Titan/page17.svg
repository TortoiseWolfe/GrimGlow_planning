  <title>Issue 10 Page 17 — They'll explain it the way they explain everything. A story.</title>
  <desc>Four-panel painterly composition. Top: squad regroups, Wren holds up the induction coil. Middle: Sable touches the Titan device and recognizes inverted fairy-tech architecture (P2), and through the shattered window the ordinary city wakes (P3). Bottom: the squad extracts through the cable entry, Thresh covers the rear.</desc>
