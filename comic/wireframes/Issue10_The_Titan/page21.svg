  <title>Issue 10 Page 21 — Fairy Tales Have a Villain Now</title>
  <desc>Four-panel painterly composition. Top: Theodore reads TELEGRAPH DEMON in his workshop, the same light, different meaning. Middle: Theodore's hands grip the newspaper (P2 narrow-left), Theodore looks at the still-glowing fairy emitter and quietly says "Please be all right" (P3 wide-right). Bottom: Theodore at the window, fairy tales have a villain now.</desc>
