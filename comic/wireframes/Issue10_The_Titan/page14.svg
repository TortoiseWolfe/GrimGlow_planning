  <title>Issue 10 Page 14 — Wren's sprint, Thresh stands</title>
  <desc>Four-panel painterly composition. Top full-width: squad creates corridor of covering fire as Wren sprints. Mid: Titan recognizes the threat (P2 narrow-left) and Wren reaches the desk as Titan's shadow falls (P3 wide-right). Bottom full-width: Thresh stands between Wren and the Titan — "Through me."</desc>
