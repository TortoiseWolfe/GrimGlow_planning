  <title>Issue 10 Page 20 — We Have to Stop Them</title>
  <desc>Four-panel painterly composition. Top: telegraph office boarded up, "everything is a gas leak". Middle: squad back at camp, Wren reads the Titan device data — "they're steering things" (P2), Luma treats Thresh — "that's what made it extraordinary" (P3). Bottom: Sable at the wall gap, "We have to stop them."</desc>
  <defs>
    <linearGradient id="pageBg20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg20)"/>

