<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 10 Page 22 — Dual Fairy Tale Echo — Issue Closer</title>
  <desc>Four-panel painterly composition closing Issue 10. Top: the newspaper laid flat with TELEGRAPH DEMON and MYSTERIOUS LIGHTS side by side (P1), James Machen reads the paper in his study and connects them — "Two phenomena. Same period. Same district. Interesting." (P2). Middle full-width: Machen pins to the cork board, fairy and demon threads converging — "Someone should look into this." Bottom full-width: the final panel — Machen's full study, the city beyond, the demons are real, the fairies are real, and now someone is writing it all down. End of Issue 10.</desc>
  <defs>
    <linearGradient id="pageBg22" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg22)"/>

  <text x="400" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#9098a0" opacity="0.62" font-weight="500" letter-spacing="2">PAGE 22 — DUAL FAIRY TALE ECHO</text>

