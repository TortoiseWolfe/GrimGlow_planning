<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 3 — Page 1 — "Clerkenwell, 14 November 1886" — Section 1 opens</title>
  <desc>Page 1 opens Issue 3. 5 panels in 3 tiers (banner / 2-col equal / 2/3 + 1/3). Total 1179px (59 + 364 + 10 + 364 + 10 + 364 + 8). Section 1 (Theodore's World) — introduces Theodore at Cribbage's clockmaker shop. Three days after the falling star. Warm-amber-only palette; no fairy tech yet.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 1  (5 panels)</text>

  <!-- TIER 1: P1 banner 742x364 at y=59 (EST through-window). -->
  <g id="page01-panel1">
    <image x="29" y="59" width="742" height="364" xlink:href="_panels/Issue03_The_Tinkers_Boy/page01_panel01.svg"/>
    <rect x="29" y="59" width="742" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- TIER 2: P2 half-left 366x364 + P3 half-right 366x364 at y=433. -->
  <g id="page01-panel2">
    <image x="29" y="433" width="366" height="364" xlink:href="_panels/Issue03_The_Tinkers_Boy/page01_panel02.svg"/>
    <rect x="29" y="433" width="366" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page01-panel3">
    <image x="405" y="433" width="366" height="364" xlink:href="_panels/Issue03_The_Tinkers_Boy/page01_panel03.svg"/>
    <rect x="405" y="433" width="366" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <!-- TIER 3: P4 wide-left 493.8x364 + P5 narrow-right 238.2x364 at y=807. -->
  <g id="page01-panel4">
    <image x="29" y="807" width="493.8" height="364" xlink:href="_panels/Issue03_The_Tinkers_Boy/page01_panel04.svg"/>
    <rect x="29" y="807" width="493.8" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

  <g id="page01-panel5">
    <image x="532.8" y="807" width="238.2" height="364" xlink:href="_panels/Issue03_The_Tinkers_Boy/page01_panel05.svg"/>
    <rect x="532.8" y="807" width="238.2" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

</svg>
