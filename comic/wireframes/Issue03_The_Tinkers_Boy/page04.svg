<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 3 — Page 4 — "Two Worlds Parallel" — Section 1 deepens</title>
  <desc>Page 4 develops the issue's parallel structure. 5 panels in 3 tiers (banner / 3-col equal / banner). Total 1179px. Theodore split-task + Cribbage leaving + Theodore alone exhale + CUT to squad camp ("Elsewhere") + Theodore in candlelight absorption ("Most days, this is enough"). The issue's first cool-light fairy intrusion appears in P4.</desc>

