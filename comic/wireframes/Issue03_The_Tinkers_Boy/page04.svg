    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 4  (5 panels)</text>

  <!-- TIER 1: P1 banner 742x364 at y=59. -->
