<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 3 — Page 8 — "Scale Reversal" — Section 2 deepens</title>
  <desc>Page 8: Scale reversal. 5 panels in 3 tiers (banner SCALE REVERSAL / 2-col / 1/3+2/3). Total 1179px. Workbench AS landscape from fairy POV + Theodore looms above. Jink walks across bench + Theodore's enormous face leaning close fascinated. Jink arms-spread reveal. Theodore crouches first smile "fair folk" / Jink "Sure let's go with that." The moment wonder wins.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 8  (5 panels)</text>

  <!-- TIER 1: P1 banner 742x364 at y=59 (SCALE REVERSAL). -->
  <g id="page08-panel1">
    <image x="29" y="59" width="742" height="364" xlink:href="_panels/Issue03_The_Tinkers_Boy/page08_panel01.svg"/>
    <rect x="29" y="59" width="742" height="364" fill="none" stroke="#2a2a2a" stroke-width="1.5" rx="2"/>
  </g>

