  <title>Issue 11 Page 10 — Recognizing the Echo</title>
  <desc>Five-panel painterly composition. Top: squad and Theodore in operational planning, Sable agrees with Jink's east approach. Middle: Sable holds the comm device with the protocol — "We adapt. We do not abort." (P2); Wren passes Theodore the hybrid comm device through the wall gap (P3). Bottom: Sable traces extraction routes including the church basement fallback (P4 wide-left); Sable in profile, recognizing the echo of "STAY" (P5 narrow-right).</desc>
