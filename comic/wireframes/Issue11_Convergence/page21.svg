<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 11 Page 21 — The Longest Night</title>
  <desc>Three stacked full-width panels, vertical emphasis. Top: the camp at night, "Nobody sleeps" — five jewel-tone heartbeats of light in the shadow between walls (P1). Middle: the city through the wall gap, sleeping, vulnerable, the dark web of telegraph lines (P2). Bottom: Sable's stillness in the dark, eyes catching starlight (P3). Section 6 opens — the night between Pages 16 and 17.</desc>
  <defs>
    <linearGradient id="pageBg11_21" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg11_21)"/>

