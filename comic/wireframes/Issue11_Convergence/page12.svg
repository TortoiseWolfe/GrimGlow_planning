  <title>Issue 11 Page 12 — Night Before</title>
  <desc>Five-panel painterly composition opening Section 4. Top: Victorian rooftop establishing, "Night before." Middle: Theodore in profile gazing at the gaslit city (P2); Jink studies him with the grin gone (P3). Bottom: Jink begins the conversation, "If things go wrong tomorrow — you walk away." (P4 wide-left); Theodore turns, "What do you mean, walk away?" (P5 narrow-right).</desc>
