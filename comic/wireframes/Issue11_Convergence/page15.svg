  <title>Issue 11 Page 15 — You Stayed</title>
  <desc>Five-panel painterly composition. Top: Luma at the church basement, "STAY" carved enormous above her in fairy script, scanner blue-violet light, corroded wing-pack on dusty stone shelf. Middle row: Luma's face reading STAY (P2) and the corroded wing-pack detail (P3). Bottom: Luma's hand pressed against stone beneath STAY (P4) and cut to camp — Thresh at perimeter post weapon check, hands steady eyes afraid (P5). Communion across centuries.</desc>
