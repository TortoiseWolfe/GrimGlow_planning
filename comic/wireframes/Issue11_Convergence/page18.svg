  <title>Issue 11 Page 18 — Becoming the Myths</title>
  <desc>Four-panel painterly composition. Top: squad in line, geared and ready, five jewel-tone glows through degraded suits — the visual moment that crystallizes the degradation arc's irony (P1). Middle: five suit detail crops montage, the degradation arc crystallized (P2). Bottom row: Jink deploys wing-pack (P3) and Theodore approaches through pre-dawn street (P4). Fairy tales getting ready for war.</desc>
