<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 11 Page 2 — Their Future. Not Ours.</title>
  <desc>Five-panel painterly composition. Top: Wren's network map fills the air with copper-gold lines and amber-black markers — "the nervous system of the industrial age." Middle: Jink crouched, the grin gone (P2); Thresh still, fear with a target (P3); Luma's anomaly data aligns — "It's all one operation" (P4). Bottom: Wren delivers the core revelation — "They're steering the entire industrial revolution. Their future. Not ours."</desc>
  <defs>
    <linearGradient id="pageBg11_2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
