<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 11 Page 13 — This Is Not Your War</title>
  <desc>Five-panel painterly composition. Top: high angle, Jink delivers the argument standing on the ledge. Middle: Jink ECU, "You are twelve years old. This is not your war." (P2 narrow-left); Theodore's face, "No." (P3 wide-right). Bottom: Jink steps closer, "I am not asking. I am telling you —" (P4); detail of Jink's hand pressed against Theodore's fingernail, "I am still coming." (P5).</desc>
  <defs>
    <linearGradient id="pageBg11_13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg11_13)"/>

