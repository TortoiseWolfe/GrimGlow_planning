<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 11 Page 14 — You Cannot Choose Who Stays</title>
  <desc>Four-panel painterly composition. KEY emotional centerpiece of the volume. Top: Jink and Theodore facing each other on the rooftop, "It is not your choice either, Jink. You cannot choose who stays. I learned that from watching you." Middle: pull-back wide, silence after the argument, "you are the bravest person I have ever met." Bottom: Jink in cold moonlight, held tears, acceptance without peace (P3); Theodore in warm gaslight, gentle resolve, "First light, Jink. I'll be there." (P4).</desc>
  <defs>
    <linearGradient id="pageBg11_14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg11_14)"/>

  <text x="400" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#9098a0" opacity="0.62" font-weight="500" letter-spacing="2">PAGE 14 — YOU CANNOT CHOOSE WHO STAYS</text>

