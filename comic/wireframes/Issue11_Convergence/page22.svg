<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 11 Page 22 — The Stories They Tell — Issue Closer</title>
  <desc>Four-panel painterly composition. Top: Machen's Victorian study, "Elsewhere. A study at University College, London" (P1). Middle: Machen at his desk reading from the pamphlet (P2). Bottom row: the pamphlet's title page wide left — THE STORIES THEY TELL — the volume's title inside the volume (P3); and the final image narrow right — the spectacle reflection of the emerald trail still happening outside the window (P4). The mythology made permanent. Issue 11 closes.</desc>
  <defs>
    <linearGradient id="pageBg11_22" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg11_22)"/>

