  <title>Issue 11 Page 11 — We Move at First Light</title>
  <desc>Four-panel painterly composition closing Section 3. Top: tactical projection collapses, "We move at first light." Middle full: Theodore pulls back from the gap, "First light. I'll be ready." Bottom: squad disperses to preparation (P3); Jink alone, looking toward the gap, rehearsing the conversation (P4).</desc>
