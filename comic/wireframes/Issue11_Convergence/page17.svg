  <title>Issue 11 Page 17 — Final Preparations</title>
  <desc>Five-panel painterly composition opening Section 5. Top: pre-dawn camp gearing-up establishing wide (P1). Middle row: Wren at her repair station (P2) and Thresh arming (P3). Bottom: Sable reviewing the tactical projection wide (P4) and Luma calibrating her holographic lenses narrow (P5). Triple-source pre-dawn lighting throughout — grey-blue from outside, warm gaslight from below, jewel-tone holographic glow from suits and equipment.</desc>
