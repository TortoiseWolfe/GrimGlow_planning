<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 11 Page 1 — Worse Than I Thought</title>
  <desc>Five-panel painterly composition opening Issue 11. Top: Wren briefs the squad in the wall cavity camp. Middle: Wren over the captured Titan device — "temporal nudge engine" (P2), Sable listens with telegraph lines visible behind her (P3). Bottom: Wren's hands manipulate the holographic cross-section — "Not changed. Nudged." (P4 wide-left), Luma's recognition — "The nervous system..." (P5 narrow-right).</desc>
  <defs>
    <linearGradient id="pageBg11_1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg11_1)"/>

  <text x="400" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#9098a0" opacity="0.62" font-weight="500" letter-spacing="2">ISSUE 11 — CONVERGENCE — PAGE 1 — WORSE THAN I THOUGHT</text>

