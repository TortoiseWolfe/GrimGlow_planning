<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 5 — Page 11 — "The Threshold" — Section 3 hide-and-tension</title>
  <desc>Page 11: 5 panels in 3 tiers (full / 2-col / wide-left+narrow-right). Total 1179px. Clockmaker approaches grandfather clock, Wren goes dark behind mainspring. His face through the glass panel checking the dial — inches from her. Reverse: Wren pressed against brass, ruby pulse. Theodore approaches shop on street, manufactured casualness. CU on his hand on the brass door handle. Caption: First useful thing he'd ever done for them.</desc>

