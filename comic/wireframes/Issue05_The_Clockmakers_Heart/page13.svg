  <title>GrimGlow Issue 5 — Page 13 — "Pinned in the Mechanism" — Section 4 mid</title>
  <desc>Page 13: 5 panels in 3 tiers (2-col / full-tall / narrow-left + wide-right). Total 1179px. Wren saved by grime as loupe-light sweeps over her. Clockmaker's fingers work tiny screw inches away. Cathedral claustrophobia: gears, pendulum, hand all converging — Wren reads engineering as masterwork. Earpiece comms reaching slowly. Cut to camp: Sable receives transmission, dispatches Jink to fetch Theodore.</desc>

