<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 6 — Page 9 — "Watched" — Section 2 Titan-shadow first appearance</title>
  <desc>Page 9: 4 panels in 2 tiers (full / wide-left + narrow-center + wide-right). HIGHEST TECHNICAL ART RISK page of issue. The Titan shadow appears at the far end of the narrow street, defined by what it isn't — too tall, too still, faint dark iridescence at margins, fog parting around it. Theodore unaware. Luma's scanner alarms. She signals stop. Theodore freezes, fights instinct to look up the street.</desc>

