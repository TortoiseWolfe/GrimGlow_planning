<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 6 — Page 10 — "The Descent" — Section 2 Titan-shadow second appearance + basement door</title>
  <desc>Page 10: 4 panels in 4 tiers (full-bottom-tall / full-banner / tall-half + tall-half). Theodore walks deliberately to the basement steps, fists clenched. From the bottom of the steps, a wide low-angle shows the Titan shadow STILL THERE through the stairwell opening — it has not moved. Theodore reaches the basement door (unlocked, blistered paint, iron studs). His brass-gear-ring index finger pulls the heavy iron latch, opening into darkness.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

