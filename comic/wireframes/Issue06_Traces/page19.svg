<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 6 — Page 19 — "The Mask Restored" — Section 4 closes</title>
  <desc>Page 19: 4 panels in 3 tiers (full / full / half-half). Section 4 closes. Mask restored, perimeter emitters back on, command posture rebuilt. Squad returns through the wall gap — Jink lands first, Wren and Thresh climb through behind. Wren observes Sable with the engineer's narrowed gaze: power cell was off, you running dark? Sable deflects with operational redirect. The mask holds — but the reader can see the seams.</desc>

