  <title>GrimGlow Issue 6 — Page 17 — "Convergence Intervention" — Section 4 opens</title>
  <desc>Page 17: 4 panels in 3 tiers (full widescreen / full / half-half). Section 4 opens. Sable alone in the wall-cavity camp at night — perimeter emitters off, power cell dark. She accesses the corrupted CONVERGENCE / PRIOR data module from I2 P20-21. Words resolve through static: "CONVERGENCE INTERVENTION". "PRIOR INSERTION TIMELINE — N=4". "DO NOT BRIEF FIELD TEAM —". The command mask slips into devastation. SABLE (whisper): "Reconnaissance."</desc>

