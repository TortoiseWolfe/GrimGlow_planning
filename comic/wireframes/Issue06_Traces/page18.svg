  <title>GrimGlow Issue 6 — Page 18 — "She Sat In The Dark" — Section 4 continues</title>
  <desc>Page 18: 4 panels in 3 tiers (full / half-half / full widescreen). Sable processes the file through pacing — afterimage text trails behind. Hand on module, lock icon glowing, thumb tremor: "Not yet." Encryption lattice folds inward, light vanishes. Final wide widescreen from wall gap: Sable a silhouette on the central beam, isolation as a form of duty. CAPTION: "She sat in the dark until she could wear her face again."</desc>

