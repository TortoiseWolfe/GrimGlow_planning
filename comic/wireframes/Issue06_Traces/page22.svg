<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 6 — Page 22 — "The Fog Looked Back" — Issue 6 closes</title>
  <desc>Page 22: 5 panels in 3 tiers (full / half-half / half-half). Section 6 — Theodore's unsettled night. Garret room, candle burning, did not undress. Hands still on knees, gear ring catching candlelight. Realization: it wasn't the dark, it was Luma's fear. At the window, breath fogging glass, whispering "Don't look into the fog." Final issue panel from outside the window: Theodore small in the lit pane, vast fog beyond, dark iridescence at the edge of perception. The fog looked back.</desc>

