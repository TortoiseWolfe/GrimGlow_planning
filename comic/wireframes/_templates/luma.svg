<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <title>Luma — Medic/Scientist — Clean Suit (Pristine)</title>
  <desc>Master template for the medic/scientist Luma. Sapphire-violet metallic suit, South Asian warm brown skin, single thick braid draped over right shoulder (NOT loose, NOT with filament — explicit Issue 1 production note), thin holographic lens visor across eyes, blue-violet holographic accent nodes, medium build, clinical/observational posture. Department: Science/Medical. Visual recipe for per-panel composition.</desc>

  <defs>
    <linearGradient id="lumaSuitMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a690e8"/>
      <stop offset="20%" stop-color="#7a62c8"/>
      <stop offset="50%" stop-color="#523aa0"/>
      <stop offset="80%" stop-color="#382475"/>
      <stop offset="100%" stop-color="#1c1242"/>
    </linearGradient>

    <linearGradient id="lumaSuitHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dcd0ff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="lumaSuitSeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15083a"/>
      <stop offset="100%" stop-color="#0a0420"/>
    </linearGradient>

    <!-- South Asian warm brown skin. -->
    <linearGradient id="lumaSkinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8956a"/>
      <stop offset="50%" stop-color="#a87648"/>
      <stop offset="100%" stop-color="#7a512a"/>
    </linearGradient>

    <!-- Dark hair for braid. -->
    <linearGradient id="lumaHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="60%" stop-color="#0e0604"/>
      <stop offset="100%" stop-color="#040201"/>
    </linearGradient>

    <!-- Blue-violet holographic accent. -->
    <radialGradient id="lumaHologramCore" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#c8b8ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0.7"/>
    </radialGradient>

    <radialGradient id="lumaHologramGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#c8b8ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5a3ad8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1c1242" stop-opacity="0"/>
    </radialGradient>

    <!-- Holographic lens visor — translucent strip across eyes. -->
    <linearGradient id="lumaVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3ad8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c8b8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a3ad8" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="lumaShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <filter id="lumaHoloBloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <symbol id="lumaHexNode" viewBox="-10 -10 20 20" overflow="visible">
      <polygon points="0,-9 7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5" fill="url(#lumaHologramGlow)" filter="url(#lumaHoloBloom)"/>
      <polygon points="0,-7 6.1,-3.5 6.1,3.5 0,7 -6.1,3.5 -6.1,-3.5" fill="url(#lumaHologramCore)"/>
      <polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#ffffff" opacity="0.85"/>
    </symbol>
  </defs>

  <rect width="400" height="600" fill="#f5f5f7"/>
  <ellipse cx="200" cy="582" rx="62" ry="6" fill="#000" opacity="0.22"/>

  <g id="luma-figure" filter="url(#lumaShadow)">

    <g id="luma-legs">
      <path d="M170,360 L168,580 L196,580 L198,360 Z" fill="url(#lumaSuitSeam)"/>
      <path d="M202,360 L204,580 L232,580 L230,360 Z" fill="url(#lumaSuitSeam)"/>

      <path d="M168,360 Q166,400 168,442 L196,442 Q198,400 196,360 Z" fill="url(#lumaSuitMetal)"/>
      <path d="M168,360 Q166,400 168,442 L196,442 Q198,400 196,360 Z" fill="url(#lumaSuitHighlight)"/>
      <path d="M204,360 Q202,400 204,442 L230,442 Q232,400 230,360 Z" fill="url(#lumaSuitMetal)"/>
      <path d="M204,360 Q202,400 204,442 L230,442 Q232,400 230,360 Z" fill="url(#lumaSuitHighlight)" opacity="0.5"/>

      <rect x="168" y="442" width="28" height="6" fill="url(#lumaSuitSeam)"/>
      <rect x="204" y="442" width="26" height="6" fill="url(#lumaSuitSeam)"/>

      <path d="M170,448 Q168,495 172,540 L194,540 Q198,495 196,448 Z" fill="url(#lumaSuitMetal)"/>
      <path d="M170,448 Q168,495 172,540 L194,540 Q198,495 196,448 Z" fill="url(#lumaSuitHighlight)"/>
      <path d="M204,448 Q202,495 206,540 L228,540 Q232,495 230,448 Z" fill="url(#lumaSuitMetal)"/>

      <path d="M168,540 Q166,560 172,575 L196,575 Q198,560 196,540 Z" fill="#1c1232"/>
      <path d="M168,540 Q166,560 172,575 L196,575 Q198,560 196,540 Z" fill="url(#lumaSuitHighlight)" opacity="0.4"/>
      <path d="M204,540 Q202,560 208,575 L228,575 Q232,560 230,540 Z" fill="#1c1232"/>

      <use href="#lumaHexNode" x="182" y="445" width="14" height="14"/>
      <use href="#lumaHexNode" x="217" y="445" width="14" height="14"/>
    </g>

    <g id="luma-torso">
      <path d="M158,340 L242,340 L240,365 L160,365 Z" fill="url(#lumaSuitSeam)"/>

      <path d="M158,235 Q150,280 158,340 L242,340 Q250,280 242,235 Q236,228 200,228 Q164,228 158,235 Z" fill="url(#lumaSuitMetal)"/>
      <path d="M158,235 Q150,280 158,340 L242,340 Q250,280 242,235 Q236,228 200,228 Q164,228 158,235 Z" fill="url(#lumaSuitHighlight)"/>

      <line x1="200" y1="232" x2="200" y2="338" stroke="#15083a" stroke-width="1.1" opacity="0.7"/>

      <path d="M170,250 Q175,275 178,295 L172,295 Q170,275 170,250 Z" fill="#15083a" opacity="0.4"/>
      <path d="M230,250 Q225,275 222,295 L228,295 Q230,275 230,250 Z" fill="#15083a" opacity="0.4"/>

      <line x1="170" y1="305" x2="230" y2="305" stroke="#15083a" stroke-width="0.8" opacity="0.6"/>
      <line x1="172" y1="320" x2="228" y2="320" stroke="#15083a" stroke-width="0.8" opacity="0.6"/>

      <!-- Medical scanner pouch on left hip. -->
      <rect x="156" y="345" width="16" height="22" fill="#0a0420" rx="1"/>
      <!-- Small scanner device protruding. -->
      <rect x="158" y="338" width="12" height="9" fill="#3a2a5e" rx="1"/>
      <circle cx="164" cy="343" r="1.5" fill="url(#lumaHologramCore)"/>

      <!-- Right hip pouch. -->
      <rect x="228" y="345" width="14" height="20" fill="#0a0420" rx="1"/>

      <use href="#lumaHexNode" x="186" y="262" width="28" height="28"/>
      <use href="#lumaHexNode" x="158" y="245" width="20" height="20"/>
      <use href="#lumaHexNode" x="222" y="245" width="20" height="20"/>
      <use href="#lumaHexNode" x="192" y="324" width="16" height="16"/>
    </g>

    <g id="luma-arms">
      <path d="M148,238 Q132,275 130,318 L150,322 Q156,275 158,240 Z" fill="url(#lumaSuitMetal)"/>
      <path d="M148,238 Q132,275 130,318 L150,322 Q156,275 158,240 Z" fill="url(#lumaSuitHighlight)"/>
      <ellipse cx="140" cy="320" rx="14" ry="6" fill="url(#lumaSuitSeam)"/>
      <path d="M130,322 Q126,355 132,388 L152,388 Q150,355 150,322 Z" fill="url(#lumaSuitMetal)"/>
      <ellipse cx="141" cy="395" rx="11" ry="9" fill="url(#lumaSkinTone)"/>
      <use href="#lumaHexNode" x="135" y="265" width="14" height="14"/>
      <ellipse cx="141" cy="386" rx="12" ry="3" fill="url(#lumaHologramCore)" opacity="0.85"/>

      <path d="M252,238 Q268,275 270,318 L250,322 Q244,275 242,240 Z" fill="url(#lumaSuitMetal)"/>
      <path d="M252,238 Q268,275 270,318 L250,322 Q244,275 242,240 Z" fill="url(#lumaSuitHighlight)" opacity="0.4"/>
      <ellipse cx="260" cy="320" rx="14" ry="6" fill="url(#lumaSuitSeam)"/>
      <path d="M270,322 Q274,355 268,388 L248,388 Q250,355 250,322 Z" fill="url(#lumaSuitMetal)"/>
      <ellipse cx="259" cy="395" rx="11" ry="9" fill="url(#lumaSkinTone)"/>
      <use href="#lumaHexNode" x="251" y="265" width="14" height="14"/>
      <ellipse cx="259" cy="386" rx="12" ry="3" fill="url(#lumaHologramCore)" opacity="0.85"/>
    </g>

    <!-- LAYER: head with single thick braid + holographic lens visor -->
    <g id="luma-head">
      <path d="M188,205 L188,232 L212,232 L212,205 Z" fill="url(#lumaSkinTone)"/>
      <path d="M178,222 Q200,212 222,222 L218,235 L182,235 Z" fill="url(#lumaSuitMetal)"/>
      <line x1="200" y1="218" x2="200" y2="234" stroke="#15083a" stroke-width="0.8" opacity="0.6"/>

      <ellipse cx="200" cy="180" rx="28" ry="34" fill="url(#lumaSkinTone)"/>

      <!-- Hair: smooth pulled-back top with center part. -->
      <path d="M173,160 Q175,140 200,134 Q225,140 227,160 Q227,170 222,168 Q221,156 200,150 Q179,156 178,168 Q173,170 173,160 Z" fill="url(#lumaHair)"/>
      <!-- Center part. -->
      <line x1="200" y1="138" x2="200" y2="160" stroke="#040201" stroke-width="0.7" opacity="0.85"/>
      <!-- Hair sides framing face (smooth, sleek). -->
      <path d="M174,168 Q172,195 178,218 L184,216 Q180,195 182,170 Z" fill="url(#lumaHair)"/>
      <path d="M226,168 Q228,195 222,218 L216,216 Q220,195 218,170 Z" fill="url(#lumaHair)"/>
      <!-- Smooth top highlight (catches light, signals well-kept hair). -->
      <path d="M180,148 Q200,142 220,148" fill="none" stroke="#3a2818" stroke-width="0.6" opacity="0.55"/>

      <!-- THE BRAID — THICK rope draped over right shoulder. Wider than v1 (~22px instead of 12px). -->
      <!-- Braid main trunk: starts behind ear, drapes forward over right shoulder. Width ~22px so it READS as a thick rope. -->
      <path d="M214,206 Q224,232 234,262 Q240,294 234,328 L218,332 Q224,294 218,262 Q210,234 204,210 Z" fill="url(#lumaHair)"/>
      <!-- Inner shadow giving the braid 3D form. -->
      <path d="M218,218 Q226,244 232,272 Q236,298 230,322" fill="none" stroke="#040201" stroke-width="2.5" opacity="0.5"/>
      <!-- Braid PLAIT segments — alternating S-curves showing the woven structure. Each "section" is a chevron. -->
      <g stroke="#040201" stroke-width="1.4" fill="none" opacity="0.9">
        <!-- Top section. -->
        <path d="M208,222 Q218,225 230,222"/>
        <path d="M210,232 Q220,229 232,232"/>
        <!-- Mid sections. -->
        <path d="M212,244 Q222,247 234,244"/>
        <path d="M212,256 Q222,253 234,256"/>
        <path d="M214,268 Q224,271 234,268"/>
        <path d="M214,280 Q224,277 234,280"/>
        <path d="M216,292 Q226,295 234,292"/>
        <path d="M216,304 Q226,301 232,304"/>
        <!-- Bottom (slight taper). -->
        <path d="M218,316 Q226,319 230,316"/>
      </g>
      <!-- Highlight strands following the braid's twist (catching light on the upper side). -->
      <g stroke="#5a4030" stroke-width="0.8" fill="none" opacity="0.7">
        <path d="M210,220 Q214,232 218,244"/>
        <path d="M218,232 Q224,250 228,266"/>
        <path d="M226,256 Q230,278 232,300"/>
      </g>
      <!-- Braid tie at the tip (small dark band wrapping the end). -->
      <ellipse cx="226" cy="332" rx="9" ry="4" fill="#040201"/>
      <ellipse cx="226" cy="331" rx="7" ry="2" fill="#1a0e08"/>
      <!-- Tassel wisps escaping below the tie. -->
      <path d="M222,335 L220,342" stroke="#0a0604" stroke-width="0.7" opacity="0.85"/>
      <path d="M226,336 L226,344" stroke="#0a0604" stroke-width="0.7" opacity="0.85"/>
      <path d="M230,335 L232,342" stroke="#0a0604" stroke-width="0.7" opacity="0.85"/>

      <!-- Holographic lens VISOR across eyes. -->
      <rect x="174" y="172" width="52" height="11" rx="2" fill="url(#lumaVisor)" opacity="0.75"/>
      <!-- Visor frame. -->
      <rect x="174" y="172" width="52" height="11" rx="2" fill="none" stroke="#7a52d8" stroke-width="0.6" opacity="0.85"/>
      <!-- Subtle eye shapes visible behind translucent visor. -->
      <ellipse cx="190" cy="178" rx="2.5" ry="1.2" fill="#0a0604" opacity="0.6"/>
      <ellipse cx="210" cy="178" rx="2.5" ry="1.2" fill="#0a0604" opacity="0.6"/>
      <!-- Visor shine glint. -->
      <line x1="178" y1="174" x2="184" y2="174" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
      <line x1="220" y1="174" x2="224" y2="174" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>

      <!-- Brows above visor, faintly visible. -->
      <path d="M183,168 Q190,166 196,168" fill="none" stroke="#0a0604" stroke-width="1.0" stroke-linecap="round" opacity="0.85"/>
      <path d="M204,168 Q210,166 217,168" fill="none" stroke="#0a0604" stroke-width="1.0" stroke-linecap="round" opacity="0.85"/>
      <!-- Nose. -->
      <path d="M200,184 L198,194 Q200,196 202,194 Z" fill="#5a3018" opacity="0.55"/>
      <!-- Mouth — slight curiosity, slight parting. -->
      <path d="M193,202 Q200,204 207,202" fill="none" stroke="#3a1a0a" stroke-width="1.1" stroke-linecap="round"/>
    </g>

  </g>

  <!-- ========================================================== -->
  <!-- LAYER: wear-state overlays                                  -->
  <!-- ========================================================== -->

  <g id="luma-wear-clean" display="inline"/>

  <g id="luma-wear-fresh-impact" display="none">
    <!-- Issue 1 post-crash: lenses cracked (one), medical scanner active. -->
    <line x1="178" y1="175" x2="186" y2="180" stroke="#0a0420" stroke-width="0.7" opacity="0.85"/>
    <line x1="186" y1="180" x2="184" y2="178" stroke="#0a0420" stroke-width="0.5" opacity="0.7"/>
    <!-- Active scanner glow brighter. -->
    <circle cx="164" cy="343" r="2.5" fill="url(#lumaHologramCore)" opacity="0.95"/>
    <!-- Scuffs. -->
    <line x1="178" y1="290" x2="195" y2="305" stroke="#15083a" stroke-width="1.0" opacity="0.6"/>
  </g>

  <g id="luma-wear-mid-mission" display="none">
    <path d="M158,235 Q150,280 158,340 L242,340 Q250,280 242,235" fill="#0a0604" opacity="0.18"/>
    <path d="M168,360 L196,442 L168,442 Z" fill="#0a0604" opacity="0.22"/>
    <path d="M204,360 L230,442 L204,442 Z" fill="#0a0604" opacity="0.22"/>
    <line x1="178" y1="175" x2="190" y2="180" stroke="#15083a" stroke-width="0.8" opacity="0.85"/>
    <line x1="172" y1="270" x2="190" y2="295" stroke="#15083a" stroke-width="0.8" opacity="0.65"/>
  </g>

  <g id="luma-wear-heavy" display="none">
    <path d="M158,235 Q150,280 158,340 L242,340 Q250,280 242,235" fill="#040201" opacity="0.42"/>
    <path d="M168,360 L196,442 L168,442 Z" fill="#040201" opacity="0.45"/>
    <path d="M204,360 L230,442 L204,442 Z" fill="#040201" opacity="0.45"/>
    <line x1="174" y1="174" x2="226" y2="180" stroke="#0a0420" stroke-width="0.9" opacity="0.85"/>
    <line x1="178" y1="262" x2="218" y2="295" stroke="#15083a" stroke-width="0.9" opacity="0.85"/>
  </g>

</svg>
