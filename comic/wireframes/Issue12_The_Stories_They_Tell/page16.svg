  <title>Issue 12 Page 16 — The Squad Reconvenes — I Know What We Are</title>
  <desc>Four-panel painterly composition closing Section 4. Top: the squad reconvenes at the church steeple, Theodore visible below "For now is enough" (P1). Bottom row: Luma steps forward "I know what we are" wide left (P2), her face in the moment before narrow center (P3), Sable watching, the commander who knew narrow right (P4).</desc>
