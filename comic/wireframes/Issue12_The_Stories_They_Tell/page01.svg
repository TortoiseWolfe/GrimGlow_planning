<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 12 Page 1 — Operation Commence</title>
  <desc>Six-panel painterly composition opening the final issue. Top: dawn over the city, five tiny points of fairy-tech color scattered across the cityscape (P1). Middle row: Jink banking between chimneys (P2), Wren scaling the brick wall (P3), Thresh descending into darkness (P4). Bottom row: Sable on the church steeple wide left (P5) and Theodore walking through morning street narrow right (P6). The deployment montage — six operators, six locations, one synchronized moment.</desc>
  <defs>
    <linearGradient id="pageBg12_1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040206"/>
      <stop offset="0.5" stop-color="#080404"/>
      <stop offset="1" stop-color="#020100"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#pageBg12_1)"/>

