<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 12 Page 6 — The Fifth Node</title>
  <desc>Four-panel 2x2 grid painterly composition. Top row: Wren on the rooftop checking the data buffer (P1) and Sable hearing "A fifth device" (P2). Bottom row: Jink scanning the city from altitude (P3) and the network schematic with the fifth node pulsing amber-black at center (P4). The plan unravels — the four devices were satellites; the hub remains, and it is human-scaled.</desc>
