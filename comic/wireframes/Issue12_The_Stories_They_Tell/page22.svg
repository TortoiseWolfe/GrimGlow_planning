<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#040206">
  <title>Issue 12 Page 22 — And the Stories They Tell — VOLUME 1 CLOSER</title>
  <desc>Three-panel painterly composition closing Volume 1. Top: Theodore writing all night, dawn approaching at the horizon (P1). Middle KEY IMAGE: overhead journal, Theodore's hands, the candle flame reflected in the inkwell, the oldest fairy tale in ink (P2). Bottom FINAL PANEL: extreme close-up — pen nib mid-stroke on "And the stories they tell..." — the sentence incomplete, the story continuing beyond the frame (P3). The beginning of everything.</desc>
