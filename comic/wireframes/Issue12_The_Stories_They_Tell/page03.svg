  <title>Issue 12 Page 3 — The Targets</title>
  <desc>Five-panel painterly composition opening Section 2. Top row: Wren at Station Bravo wide left (P1) and Jink at Junction Alpha narrow right with dutch angle (P2). Middle: Thresh's POV at the dark basement, the Titan device pulsing far away (P3). Bottom row: Wren disarming the device with copper-gold tools (P4) and Jink extracting the core, "One down" (P5). Cross-cutting between four operation locations.</desc>
