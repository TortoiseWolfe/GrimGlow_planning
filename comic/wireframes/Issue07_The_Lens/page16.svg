<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 16 — "The Quiet" — heist conclusion closes, the moment before the turn</title>
  <desc>Page 16: 4 panels (full / half-half / full). Jink launches off the gallery in a burst of emerald wing-light as the keeper's back turns into the warm lantern room. Banks low over black river — emerald geometric reflections rippling on water. Lands beside Wren on the stone ledge, mutual nod between scout and engineer. Wide transitional pulls back: Jink and Wren tiny on the ledge, river vast, far bank ordinary. Quiet before the sighting.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

