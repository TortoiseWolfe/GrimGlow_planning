<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 8 — "The Boot" — Section 3 opens, the closest a human has come to killing them by accident</title>
  <desc>Page 8: 5 panels in 3 tiers (full / wide-narrow / narrow-wide). Section 3 — Thresh's near-miss. The waterfront's mundane danger materialized: a late-shift dockworker hauling a cart, his boot descending toward Thresh's position. The defining image of her fear arc. She rolls. The boot misses. Fresh paint scored to bare metal across her right shoulder plate. Luma reaches her, scanner casting a blue-violet anatomical hologram, hand on forearm — grounding contact.</desc>

