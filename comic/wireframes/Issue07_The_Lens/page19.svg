  <title>Issue 7 — Page 19: Radio Silence — Sable's order, the wing-light dies, the squad runs dark, the far bank empties</title>
  <desc>Page 19, 4 panels. Top: split-composition comms exchange Jink/Sable, RADIO SILENCE order. Tier 2 left: Jink stows wings, light dying. Tier 2 right: overhead extraction, four shadows in operational darkness. Bottom: final wide of far bank, the absence worse than the presence — Jink doesn't look back.</desc>
