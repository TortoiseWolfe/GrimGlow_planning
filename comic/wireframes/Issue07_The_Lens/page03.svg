<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 3 — "Transit to the Waterfront" — Section 1 closes</title>
  <desc>Page 3: 5 panels in 3 tiers (full widescreen / half-half / half-half). Section 1 closes. Theodore walks the transition zone — Clerkenwell brick-and-timber behind, industrial waterfront opening ahead. Inside the pocket, Jink reads the wider streets and rougher people. The waterfront reveals itself: river, cranes, stone quay, and the lighthouse at the end of a stone pier — their target, lamp dark in the afternoon. A dockworker hails Theodore; he performs confidence and gets directions. Inside the pocket, Jink looks up at Theodore's underside-of-jaw and smiles — pride in a friend.</desc>

