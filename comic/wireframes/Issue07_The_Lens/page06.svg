<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 6 — "Squad Assembles" — Section 2 closes the friendship beats</title>
  <desc>Page 6: 5 panels in 3 tiers (half-half / full / wide-narrow). Jink on Theodore's shoulder asks something personal — does Cribbage see him? "We see you." Theodore in profile, moved beyond words. Squad arrives at the quay, wing-packs folding in formation. Wren inspects the lens with a holographic scanner — focal length correct, glass purity adequate. Sable apart, lighthouse beam sweeps her, professional focus over emotional distance.</desc>

