<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 5 — "The Quay" — Section 2 friendship beats</title>
  <desc>Page 5: 4 panels in 3 tiers (full / half-half / full). Theodore exits Prentiss and Hall with the wrapped lens — relief breaking through nerves. Finds a quiet spot on the waterfront — a stone bollard at the end of an unused quay. Jink climbs out of the pocket and stretches on his knee. They talk — friendship deepening past the operational. Pull back: dusk has settled, the lighthouse lamp is lit, the target visible across the water. They wait for the squad.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

