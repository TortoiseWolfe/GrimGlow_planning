<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 4 — "Prentiss and Hall" — Section 2 opens</title>
  <desc>Page 4: 4 panels in stepped arrangement (full banner / left tall + center medium + right short). Section 2 opens. Theodore stands before the lens-grinder's shop, composing himself. Inside, the warm precision of glass instruments — Prentiss looks up from his counter. Theodore quotes the spec exactly. Prentiss opens a felt-lined case and the four-inch plano-convex lens refracts a rainbow onto the counter. Hands close-up — coins counted, brass gear ring catching the light.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

