<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 11 — "The Cathedral" — splash + extraction begins</title>
  <desc>Page 11: 5 panels (half-page splash + 2x2 grid). The visual centerpiece of the issue. The lamp room is a cathedral of glass and brass at fairy scale — concentric Fresnel rings refracting amber lamplight in geometric patterns across every surface, oil lamp at center, brass clockwork rotating below. The squad is tiny in the doorway. Wren projects her schematic onto the lens, identifying the third concentric ring and four spring-loaded brass pins. Sable lies flat at the floor hatch monitoring the keeper soft-focused below in warm amber. Wren climbs the brass framework. The first pin releases.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

