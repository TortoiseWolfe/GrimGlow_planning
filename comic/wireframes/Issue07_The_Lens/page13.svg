<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 13 — "The Swap" — Wren works the lens</title>
  <desc>Page 13: 5 panels (wide-narrow / full / half-half). Wren stands inside the Fresnel cathedral at the base of the target ring — four retaining clips, each the size of a door. Above on the grating, the keeper's boot shifts and a page turns; faint copper-gold glow leaks through the iron. Wren on the first clip — three holographic tools, sweat at the temple, the beam sweeps. The original lens extracts in a copper-gold cradle. The replacement seats with subtle copper-gold etching at its rim.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

