<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 14 — "The Window" — keeper rises, barge horn breaks the tension</title>
  <desc>Page 14: 4 panels in 3 tiers (full / half-half / full). The keeper's chair scrapes — he's standing. Wren freezes mid-descent on a gear tooth, all holographic tools killed, going dark. From below, his boots cross the grating, the oil lamp swinging amber, heading for the stairs. Outside, Jink's grin tightens — ready to deploy a diversion. A barge horn cuts through. The keeper turns, goes to the gallery instead. Wren exhales, reactivates her tools at minimum power, and descends.</desc>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" fill="#888" font-weight="500">PAGE 14  (4 panels)</text>

