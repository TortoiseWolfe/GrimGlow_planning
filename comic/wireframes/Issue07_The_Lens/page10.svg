<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" width="800" height="1200" style="background:#ffffff">
  <title>GrimGlow Issue 7 — Page 10 — "The Iron Mountain" — Section 4 opens, the heist begins</title>
  <desc>Page 10: 5 panels in 3 tiers (full banner / half-half / half-half). Section 4 opens — the lighthouse heist. The squad approaches the iron-and-brick tower from the waterline. Sable and Wren climb the exterior brickwork in darkness, the mortar joints serving as ledges at fairy scale, the lens harness throwing Wren's balance. Jink hovers at the lamp room window — the Fresnel lens visible inside, the keeper soft-focused below the floor hatch. They reach the iron gallery. Jink levers open the door. Crack of warm light. They are in.</desc>

