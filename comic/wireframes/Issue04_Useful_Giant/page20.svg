  <title>GrimGlow Issue 4 — Page 20 — "The Walk Home" — Section 5 opens</title>
  <desc>Page 20: 4 panels in 3 tiers (full / 2-col / full). Total 1179px. Theodore walks home through dusk Clerkenwell. Lamplighter, workers, last sunset overhead. Pie shop window catches face, shard glow bleeding through pocket. Looks up at first stars in dual light. Bird's-eye on streetcorner — only upturned face. Section 5 opens with full shift to human scale and Victorian gaslight.</desc>

