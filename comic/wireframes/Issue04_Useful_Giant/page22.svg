  <title>GrimGlow Issue 4 — Page 22 — "Luma's Vigil" — Section 6 — END OF ISSUE 4</title>
  <desc>Page 22: 4 panels in 3 tiers (full / full / 2-col with 2/3+1/3 split). Total 1179px. Sleeping camp at night, Luma alone with her vigil. MCU on her face between two side-by-side script projections — ancient + modern, identical. Two-thirds wide on her hands tracing the glyph in the air, holding the data core. Narrow CU on her eyes — the loneliest knowledge. Issue 4 closes here.</desc>

