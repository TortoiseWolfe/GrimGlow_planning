  <title>GrimGlow Issue 4 — Page 18 — "The Hand on the Glyph" — Section 4 deepens</title>
  <desc>Page 18: 4 panels in 3 tiers (2-col / full / full). Total 1179px. ECU of glyph carved by hand. Luma surrounded by recording displays. Full-width: she touches the glyph and its glow responds to her bioelectric signature. Pull-back: she stands alone in the void with the secret kept.</desc>

