  <title>GrimGlow Issue 4 — Page 21 — "The Door Closes" — Section 5 closes</title>
  <desc>Page 21: 4 panels in 3 tiers (full / full / 2-col). Total 1179px. Theodore approaches HOROLOGY shop, watches a street cat with new wariness (now a monster to fairies). Pauses at side door, key in hand, looks back at street. CU on shard glow through pocket beside brass gear ring on his other hand. Silhouette enters dark doorway, last gaslight catching hand on frame as door closes.</desc>

